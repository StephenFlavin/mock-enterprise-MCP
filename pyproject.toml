[project]
name = "mockmcp"
version = "0.1.0"
description = "Mock enterprise MCP servers (one per system) backed by CSV + DuckDB"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2", "duckdb>=1.1", "pyyaml>=6", "jinja2>=3", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["faker>=25", "pytest>=8"]

[tool.setuptools]
packages = ["mockmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
