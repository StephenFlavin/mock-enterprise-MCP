# One entry per question row that uses this system's tools (see: python -m mockmcp brief bi).
- question: "06:54:Q5"
  story: >
    Product range is being reviewed. SKU-100014 (clearance item) is underperforming against plan
    with sales GBP 6,300 vs target 9,000 (30% shortfall). K-1700 (kettle) is also below
    with margin down 1.1 points. PF-220 is on track. After review, the manager schedules weekly range
    review reports to product team and buying head for ongoing tracking.
  checks:
    - tool: get_range_performance_vs_plan
      args: {period: "last month"}
      expect: ["SKU-100014", "6300", "22.8"]
    - tool: get_margin_vs_plan_by_product
      args: {period: "last month"}
      expect: ["K-1700", "32.1", "31.0"]
    - tool: list_outliers_vs_plan
      args: {period: "last month", variance_threshold_pct: 20}
      expect: ["SKU-100014", "product"]
    - tool: create_scheduled_report
      args: {report_type: "Range Review Weekly", recipient_emails: "pm@company.com;buying@company.com", frequency: "weekly"}
      expect: ["RPT-90"]

- question: "08:73:Q2"
  story: >
    Regional manager reviews UK North stores. ST142 is below sales target with 14,250 GBP actual vs 18,900 target
    (shortfall 4,650 GBP) and margin at 28.2% vs 30.5% target. ST143 is worse off with only
    8,800 GBP sales vs 14,400 target, margins weak at 26.1%. ST144 is strong at 24,700
    performing above plan. The manager adds bottom stores to visit list.
  checks:
    - tool: get_store_performance_summary_for_region
      args: {region: "UK North"}
      expect: ["ST141", "ST142", "ST144"]
    - tool: list_stores_below_target
      args: {period: "last month", region: "UK North"}
      expect: ["ST142", "ST143", "shortfall"]
    - tool: get_margin_by_store
      args: {period: "last month", region: "UK North"}
      expect: ["ST144", "35.2"]

- question: "08:73:Q3"
  story: >
    For Q4 investment planning, stores are ranked by priority score. ST045 leads with highest sales (24,700 GBP)
    and strong margin (35.2%), priority score highest. ST001 ranks second. ST214 ranks lowest with
    sales 8,800 and margin 26.1%, needs turnaround investment.
  checks:
    - tool: get_store_performance_summary_for_region
      args: {region: "UK North"}
      expect: ["ST045", "24700", "35.2"]
    - tool: calculate_store_priority_score
      args: {region: "UK North", period: "last month"}
      expect: ["ST045", "priority_score"]

- question: "08:73:Q4"
  story: >
    Variance analysis for the period shows ST012 driving regional variance with 4,650 GBP sales shortfall
    and 2.3 point margin variance (28.2% vs 30.5%). ST214 also weak.
    ST045 performing ahead of plan.
  checks:
    - tool: calculate_variance_drivers_by_store
      args: {region: "UK North", period: "last month"}
      expect: ["ST012", "variance"]

- question: "09:81:Q6"
  story: >
    Data quality review shows critical issues: missing sales data and labour cost schema mismatch,
    both affecting store_performance_summary report. High priority duplicate stock and incorrect
    margin calculations. Three top issues (DQ-900001, DQ-900005, DQ-900003) identified for fix.
  checks:
    - tool: get_data_quality_issue_impact
      args: {severity: "critical"}
      expect: ["DQ-900001", "DQ-900005", "critical"]
    - tool: get_data_quality_issue_impact
      args: {severity: "high"}
      expect: ["DQ-900002", "DQ-900003", "high"]

- question: "09:89:Q5"
  story: >
    HR reviews recruitment and workforce data. A scheduled report is set up to track attrition,
    absence and hiring metrics weekly to the HR director, combining data from multiple systems.
  checks:
    - tool: create_scheduled_report
      args: {report_type: "Weekly Workforce Report", recipient_emails: "hr.director@company.com;recruitment@company.com", frequency: "weekly"}
      expect: ["RPT-90", "active"]
