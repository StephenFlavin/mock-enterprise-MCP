# One entry per question row that uses this system's tools (see: python -m mockmcp brief bi).
- question: "06:54:Q5"
  story: >
    Range review. Three products are far from plan in the latest month: SKU-100014 (Blush Blouse 12) sales
    38,866 vs 53,500 plan (-27%) with margin 22.8% vs 30% and returns 4.2% / rating 3.5; PF-220 (desk fan) sales
    23,397 vs 29,900 (-22%) with returns 3.4% and rating 3.8; K-1700 (glass kettle) margin 27.4% vs 31% with
    returns 6.8% and rating 3.1 (a new quality problem: Aug was on plan). SKU-100007 and SKU-100021 are on plan and
    all ~800 background products stay within about 3% of plan. A weekly range review report is scheduled afterwards.
  checks:
    - tool: get_range_performance_vs_plan
      args: {period_from: "-30d"}
      expect: ["SKU-100014", "-27.4", "PF-220", "K-1700", "6.8"]
    - tool: get_margin_vs_plan_by_product
      args: {period_from: "-30d"}
      expect: ["SKU-100014", "-7.2", "K-1700", "-3.6"]
    - tool: list_outliers_vs_plan
      args: {period_from: "-30d", variance_threshold_pct: 10, entity_type: product}
      expect: ["SKU-100014", "PF-220", "K-1700", "3 rows"]
    - tool: get_range_performance_vs_plan
      args: {period_from: "-30d", sku: K-1700}
      expect: ["K-1700", "27.4", "3.1"]
    - tool: create_scheduled_report
      args: {report_type: "Range Review Weekly", recipient_emails: "pm@company.com;buying@company.com", frequency: "weekly"}
      expect: ["RPT-9", "monday", "Range Review Weekly, sent weekly"]

- question: "08:73:Q2"
  story: >
    UK North (59 stores). The bottom three against plan last month are ST143 Preston High Street 2 (sales 24,900
    vs 36,000, margin 26.1% vs 32.5%), ST142 Preston High Street (28,400 vs 34,900, margin 28.2% vs 31.5%) and
    ST150 Leeds Shopping Centre (64,300 vs 68,900, margin 31.0% vs 33.0%). All three have shrink of 2.1% or more
    (region norm about 1.2%) and labour cost of 11.5% or more (norm about 10.2%); ST142/ST143 also have availability
    below 95%. ST144 Durham is 8% ahead of plan. No other store misses plan by 2% or more.
  checks:
    - tool: get_store_performance_summary_for_region
      args: {region: "UK North", period_from: "-30d"}
      expect: ["ST143", "92.3", "ST150", "14.5", "ST144", "98.1"]
    - tool: list_stores_below_target
      args: {region: "UK North", period_from: "-30d"}
      expect: ["ST143", "ST142", "ST150", "11100", "3 rows"]
    - tool: get_margin_by_store
      args: {region: "UK North", period_from: "-30d"}
      expect: ["ST143", "26.1", "32.5", "ST144", "35.2"]

- question: "08:73:Q3"
  story: >
    Ranking UK North stores for visits and investment by priority score (weighted sales and margin shortfall
    vs target). ST143 ranks first (30.8% sales and 19.7% margin shortfall, score 26.4), then ST142 (15.4) and
    ST150 (6.4); every other store scores about 1 or less, and ST144 (ahead of plan) is at the bottom.
  checks:
    - tool: get_store_performance_summary_for_region
      args: {region: "UK North", period_from: "-30d"}
      expect: ["ST144", "32030", "35.2"]
    - tool: calculate_store_priority_score
      args: {region: "UK North", period_from: "-30d"}
      expect: ["ST143", "26.38", "ST142", "15.37", "ST150", "6.43", "formula"]

- question: "08:73:Q4"
  story: >
    Variance for UK North last month. ST143 (-11,100 sales, -5,201 margin), ST142 (-6,500 sales, -2,985 margin)
    and ST150 (-4,600 sales, -2,804 margin) drive the shortfall, mostly through sales volume; other stores
    vary by a few thousand pounds at most and some (e.g. ST144 +2,380 sales) are ahead of plan.
  checks:
    - tool: calculate_variance_drivers_by_store
      args: {region: "UK North", period_from: "-30d"}
      expect: ["ST143", "-11100", "-5201.1", "ST142", "-6500", "ST150", "-4600", "sales volume"]

- question: "09:81:Q6"
  story: >
    Data quality review. Two critical issues (DQ-900001 click-and-collect sales missing, DQ-900005 labour cost
    schema mismatch) and two high ones (DQ-900002 duplicate Northampton stock, DQ-900003 clearance margin before
    markdown) are open, each with business impact, affected KPIs, owner (a data analyst in Technology) and a fix
    estimate (DQ-900002 fastest at 3 days, DQ-900005 slowest at 10). DQ-900004 is resolved.
  checks:
    - tool: get_data_quality_issue_impact
      args: {severity: critical}
      expect: ["DQ-900001", "DQ-900005", "Anne Turner", "Labour cost %", "10"]
    - tool: get_data_quality_issue_impact
      args: {severity: high}
      expect: ["DQ-900002", "DQ-900003", "Barbara Murphy", "Range outliers"]
    - tool: get_data_quality_issue_impact
      args: {dataset: store_performance}
      expect: ["DQ-900005", "DQ-900008"]

- question: "09:89:Q5"
  story: >
    HR asks for a weekly workforce report to themselves. The scheduled report is stored with its type,
    recipients, frequency, send day and description.
  checks:
    - tool: create_scheduled_report
      args: {report_type: "Weekly Workforce Report", recipient_emails: "hr.director@company.com", frequency: "weekly", day_of_week: friday}
      expect: ["RPT-9", "friday", "hr.director@company.com", "true"]
