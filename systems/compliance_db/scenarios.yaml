# One entry per question row that uses this system's tools (see: python -m mockmcp brief compliance_db).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "01:9:Q2"
  story: >
    New electric reach trucks will be deployed at DC1 and DC3 (two newest sites) in January.
    The system contains draft_compliance_checklist data for battery charging areas, ventilation, fire separation and operator training requirements.
    The checklist will guide site managers on UK regulations and gaps in risk assessments.
  checks:
    - tool: draft_compliance_checklist
      args: {sku: PF-220, market: UK}
      expect: ["Compliance Checklist"]

- question: "04:34:Q2"
  story: >
    Seeking suppliers in Portugal and Turkey for technical outerwear with seam-sealing and OEKO-TEX certification.
    The system contains seam-seal supplier (Seam-Seal Specialist Factory, cert OT-26-2008899, active through 2027-05-14)
    with active OEKO-TEX certification verified in the public registry.
  checks:
    - tool: search_certification_registry
      args: {certificate_number: "OT-26-2008899"}
      expect: ["Seam-Seal Specialist Factory"]

- question: "04:41:Q2"
  story: >
    Korean cosmetics exporter needs EU and UK registrations and certifications.
    The system contains cosmetics regulatory requirements for EU with CPNP registration requirement
    and safety data requirements for UK.
  checks:
    - tool: search_cosmetics_regulatory_requirements
      args: {market: EU}
      expect: ["documentation"]
    - tool: list_required_registrations_by_market
      args: {market: EU}
      expect: ["documentation"]

- question: "05:42:Q3"
  story: >
    QA team needs flammability rules for kids' sleepwear across UK, EU and US.
    The system contains regulations REG-900001 (UK), REG-900002 (EU), and REG-900003 (US)
    with specific testing requirements that can be compared side-by-side.
  checks:
    - tool: search_regulations_by_product_type
      args: {product_scope: sleepwear, market: UK}
      expect: ["sleepwear"]
    - tool: get_regulatory_requirements_by_market
      args: {product_category: kids_sleepwear, market: UK}
      expect: ["testing"]
    - tool: compare_requirements_across_markets
      args: {product_category: kids_sleepwear}
      expect: ["market"]

- question: "05:44:Q1"
  story: >
    Product safety team evaluates children's water bottles (K-1700) for UK, EU, US and AU.
    Regulations require testing, certification, material specs and labelling.
    K-1700 is compliant in UK/US but under review in EU and non-compliant in AU.
  checks:
    - tool: search_regulations_by_product_type
      args: {product_scope: water_bottles, market: EU}
      expect: ["water_bottles"]
    - tool: get_regulatory_requirements_by_market
      args: {product_category: water_bottles, market: UK}
      expect: ["material"]
    - tool: compare_requirements_across_markets
      args: {product_category: water_bottles}
      expect: ["UK"]
    - tool: compare_product_specs_to_requirements
      args: {sku: K-1700, market: EU}
      expect: ["K-1700"]

- question: "05:44:Q3"
  story: >
    Upcoming regulations over next 18 months include PFAS restrictions (REG-900011, EU, critical impact)
    and battery directive (REG-900012, EU, high impact).
    Tasks are created for addressing these regulations.
  checks:
    - tool: list_upcoming_regulatory_changes
      args: {}
      expect: ["regulation_id", "impact_level"]
    - tool: get_regulation_deadlines
      args: {days_ahead: 540}
      expect: ["effective_date"]
    - tool: calculate_regulation_impact_score
      args: {regulation_id: REG-900011}
      expect: ["REG-900011"]
    - tool: create_compliance_task
      args: {regulation_id: REG-900011, title: "Test PFAS alternatives", due_date: "-30d"}
      expect: ["TSK-"]

- question: "05:44:Q4"
  story: >
    New PFAS restrictions (REG-900010) will affect waterproof outerwear.
    Restriction becomes effective within 18 months with grace period.
    Alternatives are available.
  checks:
    - tool: search_regulations_by_product_type
      args: {product_scope: waterproof_outerwear, market: EU}
      expect: ["waterproof_outerwear"]
    - tool: get_regulation_deadlines
      args: {days_ahead: 540}
      expect: ["effective_date"]
    - tool: search_alternative_materials
      args: {substance_name: PFAS, market: EU}
      expect: ["PFAS"]

- question: "05:44:Q5"
  story: >
    Smart water bottle with battery needs certification in EU and UK.
    Battery directive requirements are defined for both markets with certification as key requirement.
  checks:
    - tool: get_regulatory_requirements_by_market
      args: {product_category: water_bottles_with_battery, market: EU}
      expect: ["certification"]
    - tool: get_regulatory_requirements_by_market
      args: {product_category: water_bottles_with_battery, market: UK}
      expect: ["certification"]

- question: "05:44:Q7"
  story: >
    Labelling check for products in Germany and France. Requirements include CE marks, content declarations,
    warnings in German/French, and origin. ISS-900004 shows resolved label issue.
    Labelling requirements cover EU market needs.
  checks:
    - tool: get_labelling_requirements_by_market
      args: {market: EU}
      expect: ["requirement_category"]
    - tool: compare_label_to_requirements
      args: {sku: K-1700, market: EU}
      expect: ["label_req_id"]
    - tool: create_compliance_issue
      args: {sku: K-1700, market: EU, issue_type: labelling_gap, description: "Missing required marking", priority: high}
      expect: ["ISS-"]
    - tool: update_compliance_issue_status
      args: {issue_id: ISS-900004, status: resolved}
      expect: ["ISS-900004"]

- question: "05:44:Q8"
  story: >
    Chromium VI and PFAS are on restricted lists in EU.
    Alternatives are available for both substances.
  checks:
    - tool: search_restricted_substance_lists
      args: {market: EU}
      expect: ["restriction_type"]
    - tool: get_substance_list_matches_for_materials
      args: {market: EU}
      expect: ["substance_id"]
    - tool: search_alternative_materials
      args: {substance_name: PFAS, market: EU}
      expect: ["PFAS"]

- question: "05:47:Q2"
  story: >
    Regulatory notification requirements for UK market are defined in labelling requirements.
    These outline requirements for regulatory notifications.
  checks:
    - tool: get_regulatory_notification_requirements_by_country
      args: {market: UK}
      expect: ["market"]

- question: "06:51:Q6"
  story: >
    New materials compliance status for K-1700 shows OEKO-TEX certification active,
    and no restrictions on stainless steel materials used.
  checks:
    - tool: get_material_compliance_status
      args: {material: "water repellent", market: EU}
      expect: ["substance_name"]

- question: "06:52:Q3"
  story: >
    Competitor sustainability claims found: various competitors make claims including carbon neutral, fair trade, and recycled content.
    Our materials: K-1700 and SKU-100007 have certifications.
  checks:
    - tool: search_competitor_sustainability_claims
      args: {keyword: "Carbon"}
      expect: ["claim_id"]
    - tool: search_material_certification_registry
      args: {certification_type: oeko_tex}
      expect: ["holder_name"]
    - tool: compare_claims_to_certifications
      args: {subject_id: SKU-100007}
      expect: ["claim_id"]
    - tool: get_own_material_certifications
      args: {supplier_id: SUP-0001}
      expect: ["certification_type"]

- question: "06:52:Q4"
  story: >
    Fabric sustainability certifications show cotton with GOTS and Fair Trade certifications,
    and polyester with OEKO-TEX certification.
  checks:
    - tool: get_fabric_sustainability_certifications
      args: {material: cotton}
      expect: ["certification_type"]

- question: "06:55:Q1"
  story: >
    Cosmetics packaging in France and Germany requires labelling in local languages,
    with legal marks, recycling labels, and warnings. Minimum font sizes specified.
  checks:
    - tool: search_cosmetics_labelling_requirements_by_country
      args: {market: EU}
      expect: ["market"]
    - tool: get_language_requirements_by_country
      args: {market: EU}
      expect: ["language"]

- question: "06:59:Q5"
  story: >
    Products missing compliance data in EU market: K-1700 under review, PF-220 non-compliant.
    Both have missing data types and deadlines.
  checks:
    - tool: list_products_missing_compliance_data_by_market
      args: {market: EU}
      expect: ["sku"]

- question: "06:60:Q1"
  story: >
    PFAS regulatory status by region: EU has phase-out restrictions with alternatives available.
  checks:
    - tool: get_regulatory_status_by_substance_and_region
      args: {substance_name: PFAS, market: EU}
      expect: ["substance_name"]

- question: "06:60:Q6"
  story: >
    Microplastics regulations coming: search shows upcoming regulations by topic for microplastics.
  checks:
    - tool: search_upcoming_regulations_by_topic
      args: {topic: microplastics}
      expect: ["regulation_id"]

- question: "06:60:Q7"
  story: >
    Recycled content claims must meet chain-of-custody evidence requirements.
    K-1700 claims recycled content with OEKO-TEX backing.
  checks:
    - tool: search_recycled_content_claim_standards
      args: {market: EU}
      expect: ["market"]
    - tool: compare_claims_to_certificate_coverage
      args: {sku: K-1700}
      expect: ["claim_id"]

- question: "08:80:Q1"
  story: >
    Market entry for Poland and Czechia requires local labelling and compliance rules.
    EU requirements apply with language and labelling support.
  checks:
    - tool: get_labelling_and_language_requirements
      args: {market: EU}
      expect: ["market"]
    - tool: get_product_compliance_requirements_by_market
      args: {sku: K-1700, market: EU}
      expect: ["sku"]

- question: "08:80:Q3"
  story: >
    Japan market entry assessment: compliance requirements for water bottles and apparel products.
  checks:
    - tool: get_product_compliance_requirements_by_market
      args: {sku: SKU-100007, market: EU}
      expect: ["sku"]
