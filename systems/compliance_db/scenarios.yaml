# One entry per question row that uses this system's tools (see: python -m mockmcp brief compliance_db).

- question: "01:9:Q2"
  story: >
    Electric reach trucks need UK-compliant charging areas. The regulations REG-900021 to REG-900024 (PUWER, DSEAR, Fire Safety Order, HSE L117)
    give requirements for battery charging area, ventilation (hydrogen below 1%), fire separation (30 minutes) and operator training,
    which the checklist draft groups by topic.
  checks:
    - tool: draft_compliance_checklist
      args: {product_category: electric_reach_trucks, market: UK}
      expect: ["Battery Charging Area", "Ventilation", "Fire Separation", "Operator Training", "1% by volume"]

- question: "04:34:Q2"
  story: >
    OEKO-TEX certificates in the public registry for the Portugal and Turkey candidates: Warren Products Co (SUP-0058) and
    Baxter Trading Group (SUP-0044) valid in Portugal; Brennan Textiles JSC (SUP-0036) expired and Davies Industries (SUP-0067) expiring soon in Turkey.
  checks:
    - tool: search_certification_registry
      args: {certification_type: oeko_tex, holder_country: PT}
      expect: ["Warren Products Co", "Baxter Trading Group", "OT-26-3010058"]
    - tool: search_certification_registry
      args: {certification_type: oeko_tex, holder_country: TR}
      expect: ["Brennan Textiles JSC", "expired", "Davies Industries Pvt Ltd"]

- question: "04:41:Q2"
  story: >
    A Korean cosmetics exporter needs an EU Responsible Person, CPNP notification, product information file and ISO 22716 for the EU,
    and a UK Responsible Person plus SCPN notification for the UK.
  checks:
    - tool: search_cosmetics_regulatory_requirements
      args: {market: EU}
      expect: ["Responsible Person", "CPNP", "ISO 22716"]
    - tool: list_required_registrations_by_market
      args: {market: UK, product_category: cosmetics}
      expect: ["SCPN", "UK Responsible Person"]

- question: "05:42:Q3"
  story: >
    Kids sleepwear flammability: UK BS 5722 (REG-900001), EU EN 14878 (REG-900002) and US 16 CFR 1615/1616 (REG-900003) with the US
    tight-fitting exemption and UK 3-month exemption.
  checks:
    - tool: search_regulations_by_product_type
      args: {product_scope: kids sleepwear}
      expect: ["REG-900001", "REG-900002", "REG-900003"]
    - tool: get_regulatory_requirements_by_market
      args: {product_category: kids_sleepwear, market: US}
      expect: ["16 CFR 1615", "7.0 inches", "Tight-fitting"]
    - tool: compare_requirements_across_markets
      args: {product_category: kids_sleepwear, topic: flammability}
      expect: ["BS 5722", "EN 14878", "16 CFR 1615"]

- question: "05:44:Q1"
  story: >
    Children's 350ml insulated bottles have food contact, heavy metal, small parts, labelling and marking requirements in UK, EU, US and AU.
    SKU-102590 is compliant; SKU-104123 and SKU-104795 are under review; SKU-105551 failed heavy metals (lead 120 mg/kg).
  checks:
    - tool: search_regulations_by_product_type
      args: {product_scope: children's water bottles}
      expect: ["REG-900004", "REG-900005", "REG-900006", "REG-900007"]
    - tool: compare_requirements_across_markets
      args: {product_category: childrens_drinkware}
      expect: ["small_parts", "food_contact", "heavy_metals", "marking"]
    - tool: compare_product_specs_to_requirements
      args: {product_category: childrens_drinkware, market: UK}
      expect: ["SKU-105551", "SKU-104123", "SKU-104795", "lead 120 mg/kg"]

- question: "05:44:Q2"
  story: >
    A leather bag (SKU-101813) failed chromium VI. Reporting duties: UK OPSS and EU Safety Business Gateway within 2 working days, US CPSC 24 hours.
    Chromium VI is a restricted substance in EU and UK and MAT-LEATHER from SUP-0049 matches.
  checks:
    - tool: get_regulatory_reporting_obligations
      args: {market: UK}
      expect: ["OPSS", "2 working days", "chromium VI"]
    - tool: get_regulatory_reporting_obligations
      args: {market: EU}
      expect: ["Safety Business Gateway"]

- question: "05:44:Q3"
  story: >
    Upcoming changes: PFAS restriction (REG-900011, critical), EU Battery Regulation (REG-900012, high), microplastics (REG-900014, high),
    cosmetics CMR ban (REG-900015, medium, soonest), ESPR textiles (REG-900018). The Toy Safety Regulation is beyond 18 months.
  checks:
    - tool: list_upcoming_regulatory_changes
      args: {}
      expect: ["REG-900011", "REG-900012", "REG-900014", "REG-900015"]
    - tool: get_regulation_deadlines
      args: {days_ahead: 540}
      expect: ["REG-900015", "REG-900011"]
    - tool: calculate_regulation_impact_score
      args: {regulation_id: REG-900011}
      expect: ["REG-900011", "affected_products", "impact_score"]
    - tool: create_compliance_task
      args: {regulation_id: REG-900011, title: "Test PFAS alternatives", due_date: "+30d"}
      expect: ["TSK-"]

- question: "05:44:Q4"
  story: >
    The EU PFAS restriction (REG-900011) applies from 2027-06-01 with a transition to 2028-06-01 and affects waterproof outerwear.
    PFAS-free DWR alternatives: silicone +21.4%, dendrimer +38.1%, wax -9.5%; membranes PU -30.8%, polyester -19.2%.
  checks:
    - tool: search_regulations_by_product_type
      args: {product_scope: waterproof outerwear}
      expect: ["REG-900011"]
    - tool: get_regulation_deadlines
      args: {product_scope: waterproof outerwear}
      expect: ["REG-900011", "critical"]
    - tool: search_alternative_materials
      args: {substance_name: PFAS}
      expect: ["silicone", "dendrimer", "21.4", "38.1"]

- question: "05:44:Q5"
  story: >
    The smart water bottle (SKU-104809) with Li-ion cell and Bluetooth needs radio/EMC (CE under RED, UKCA) plus battery safety tests
    (IEC 62133-2, UN 38.3) in EU and UK. SKU-104809 is under review with no certificates yet.
  checks:
    - tool: get_regulatory_requirements_by_market
      args: {product_category: smart_bottles, market: EU}
      expect: ["Radio Equipment Directive", "IEC 62133-2"]
    - tool: get_regulatory_requirements_by_market
      args: {product_category: smart_bottles, market: UK}
      expect: ["UKCA", "IEC 62133-2"]

- question: "05:44:Q7"
  story: >
    Labels for Germany and France: German rules need composition, care, origin and importer in German; French rules need composition, care and
    origin in French plus Triman and Info-tri. SKU-106118 lacks Triman and Info-tri; SKU-102975 has English care and origin text.
  checks:
    - tool: get_labelling_requirements_by_market
      args: {country: FR, product_scope: all_textiles}
      expect: ["Triman", "Info-tri"]
    - tool: compare_label_to_requirements
      args: {sku: SKU-106118, country: FR, label_text: "Ochre Blouse 10 95% Polyester 5% Elasthanne Lavage en machine 30 Fabriqué en Turquie"}
      expect: ["MISSING", "Triman"]
    - tool: create_compliance_issue
      args: {sku: SKU-106118, market: EU, country: FR, issue_type: labelling_gap, description: "Triman and Info-tri missing", priority: high}
      expect: ["ISS-900007"]
    - tool: update_compliance_issue_status
      args: {issue_id: ISS-900007, status: resolved, resolution_note: "Printer fixed"}
      expect: ["resolved"]

- question: "05:44:Q8"
  story: >
    Our materials on lists: MAT-LEATHER (chromium VI, SUP-0049), MAT-DWR-C6-PFAS, MAT-MEM-PTFE and MAT-PFAS-COATED (PFAS), MAT-HARDWARE
    (lead, candidate list, SUP-0007). Alternatives are costed and rated.
  checks:
    - tool: search_restricted_substance_lists
      args: {market: EU}
      expect: ["Chromium VI", "candidate_list", "PFAS"]
    - tool: get_substance_list_matches_for_materials
      args: {market: EU}
      expect: ["MAT-LEATHER", "MAT-HARDWARE", "MAT-DWR-C6-PFAS"]
    - tool: search_alternative_materials
      args: {substance_name: Lead}
      expect: ["Lead-free zinc alloy"]

- question: "05:47:Q2"
  story: >
    Notification duties for GB, IE, DE and FR for recall versus withdrawal; France has the tightest recall deadline (6 hours, DGCCRF),
    sign-off by the Director of Product Safety and submission by Head of Legal.
  checks:
    - tool: get_regulatory_notification_requirements_by_country
      args: {country: FR}
      expect: ["DGCCRF", "6", "Director of Product Safety"]
    - tool: get_regulatory_notification_requirements_by_country
      args: {action_type: recall}
      expect: ["Trading Standards", "CCPC", "Produktüberwachung"]

