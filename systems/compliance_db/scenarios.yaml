# One entry per question row that uses this system's tools (see: python -m mockmcp brief compliance_db).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "01:9:Q2"
  story: >
    New electric reach trucks will be deployed at DC1 and DC3 (two newest sites) in January.
    The system contains draft_compliance_checklist data for battery charging areas, ventilation, fire separation and operator training requirements.
    The checklist will guide site managers on UK regulations and gaps in risk assessments.
  checks:
    - tool: draft_compliance_checklist
      args: {sku: PF-220, market: UK}
      expect: ["Compliance Checklist"]

- question: "04:34:Q2"
  story: >
    Seeking suppliers in Portugal and Turkey for technical outerwear with seam-sealing and OEKO-TEX certification.
    The system contains seam-seal supplier (Seam-Seal Specialist Factory, cert OT-26-2008899, expiry 2027-05-14)
    with active OEKO-TEX certification verified in the public registry.
  checks:
    - tool: search_certification_registry
      args: {certificate_number: "OT-26-2008899"}
      expect: ["Seam-Seal Specialist Factory", "oeko_tex", "true"]

- question: "04:41:Q2"
  story: >
    Korean cosmetics exporter needs EU and UK registrations and certifications.
    The system contains cosmetics regulatory requirements for both markets with CPNP registration requirement for EU
    and safety data requirements for UK.
  checks:
    - tool: search_cosmetics_regulatory_requirements
      args: {market: EU}
      expect: ["CPNP", "documentation"]
    - tool: list_required_registrations_by_market
      args: {market: EU}
      expect: ["documentation"]

- question: "05:42:Q3"
  story: >
    QA team needs flammability rules for kids' sleepwear across UK, EU and US.
    The system contains regulations REG-900001 (UK), REG-900002 (EU), and REG-900003 (US)
    with specific testing requirements that can be compared side-by-side.
  checks:
    - tool: search_regulations_by_product_type
      args: {product_scope: sleepwear, market: UK}
      expect: ["sleepwear", "REG-900001"]
    - tool: get_regulatory_requirements_by_market
      args: {product_category: kids_sleepwear, market: UK}
      expect: ["testing", "BS 5722"]
    - tool: compare_requirements_across_markets
      args: {product_category: kids_sleepwear}
      expect: ["UK", "EU", "US"]

- question: "05:44:Q1"
  story: >
    Product safety team evaluates children's water bottles (K-1700) for UK, EU, US and AU.
    Regulations require testing, certification, material specs and labelling.
    K-1700 is compliant in UK/US but under review in EU (awaiting migration test) and non-compliant in AU (missing certification).
  checks:
    - tool: search_regulations_by_product_type
      args: {product_scope: water_bottles, market: EU}
      expect: ["REG-900004", "water_bottles"]
    - tool: get_regulatory_requirements_by_market
      args: {product_category: water_bottles, market: UK}
      expect: ["material", "testing", "labelling"]
    - tool: compare_requirements_across_markets
      args: {product_category: water_bottles}
      expect: ["UK", "EU", "US", "AU"]
    - tool: compare_product_specs_to_requirements
      args: {sku: K-1700, market: EU}
      expect: ["K-1700", "EU"]

- question: "05:44:Q3"
  story: >
    Upcoming regulations over next 18 months include PFAS restrictions (REG-900010, EU, critical impact, effective 2027-06-01)
    and battery directive (REG-900011, EU, high impact, effective 2027-01-01).
    Two tasks are created for Q4: test PFAS alternatives (TSK-900001) and battery testing for PF-220 (TSK-900004).
  checks:
    - tool: list_upcoming_regulatory_changes
      args: {}
      expect: ["REG-900010", "PFAS", "upcoming"]
    - tool: get_regulation_deadlines
      args: {days_ahead: 540}
      expect: ["PFAS", "2027"]
    - tool: calculate_regulation_impact_score
      args: {regulation_id: REG-900010}
      expect: ["REG-900010", "critical"]
    - tool: create_compliance_task
      args: {regulation_id: REG-900010, title: "Test PFAS alternatives", due_date: "-30d"}
      expect: ["TSK-"]

- question: "05:44:Q4"
  story: >
    New PFAS restrictions (REG-900010) will affect waterproof outerwear.
    Restriction becomes effective 2027-06-01 with 12-month grace period.
    Alternatives are available (flagged as alternative_available: true in substance restrictions).
  checks:
    - tool: search_regulations_by_product_type
      args: {product_scope: waterproof_outerwear, market: EU}
      expect: ["PFAS", "REG-900010"]
    - tool: get_regulation_deadlines
      args: {days_ahead: 540}
      expect: ["2027-06-01"]
    - tool: search_alternative_materials
      args: {substance_name: PFAS, market: EU}
      expect: ["PFAS"]

- question: "05:44:Q5"
  story: >
    Smart water bottle with battery needs certification in EU and UK.
    Battery directive requirements (REG-900011 for EU, REG-900012 for UK)
    both require certification under regulations effective 2027-01-01.
  checks:
    - tool: get_regulatory_requirements_by_market
      args: {product_category: water_bottles_with_battery, market: EU}
      expect: ["certification", "Battery"]
    - tool: get_regulatory_requirements_by_market
      args: {product_category: water_bottles_with_battery, market: UK}
      expect: ["certification", "battery"]

- question: "05:44:Q7"
  story: >
    Labelling check for products in Germany and France. Requirements include CE marks, content declarations,
    warnings in German/French, and origin. ISS-900004 shows resolved label issue (size labels for sleepwear).
    Labelling requirements LBL-900002 through LBL-900007 cover German and French requirements.
  checks:
    - tool: get_labelling_requirements_by_market
      args: {market: EU}
      expect: ["content_declaration", "warnings", "origin"]
    - tool: compare_label_to_requirements
      args: {sku: K-1700, market: EU}
      expect: ["mandatory"]
    - tool: create_compliance_issue
      args: {sku: K-1700, market: EU, issue_type: labelling_gap, description: "Missing required marking", priority: high}
      expect: ["ISS-"]
    - tool: update_compliance_issue_status
      args: {issue_id: ISS-900004, status: resolved}
      expect: ["ISS-900004"]

- question: "05:44:Q8"
  story: >
    Chromium VI (SUB-900004, SUB-900005) and PFAS (SUB-900003) are on restricted lists.
    Alternatives are available for all three substances. Materials marked under review.
  checks:
    - tool: search_restricted_substance_lists
      args: {market: EU}
      expect: ["Chromium", "PFAS"]
    - tool: get_substance_list_matches_for_materials
      args: {market: EU}
      expect: ["Chromium VI", "PFAS"]
    - tool: search_alternative_materials
      args: {substance_name: PFAS, market: EU}
      expect: ["alternative"]

- question: "05:47:Q2"
  story: >
    Regulatory notification requirements for UK, EU and US markets are defined in labelling requirements.
    These outline who must be notified, format and timeline for regulatory notifications.
  checks:
    - tool: get_regulatory_notification_requirements_by_country
      args: {market: UK}
      expect: ["UK"]

- question: "06:51:Q6"
  story: >
    New materials compliance status for K-1700 shows OEKO-TEX certification verified,
    and no restrictions on materials used (stainless steel, silicone).
  checks:
    - tool: get_material_compliance_status
      args: {material: stainless, market: EU}
      expect: ["stainless"]

- question: "06:52:Q3"
  story: >
    Competitor sustainability claims found: CompetiCorp AW26 makes carbon neutral claim with fair_trade backing (verified).
    EcoStyle makes recycled content claim without verified backing (dubious confidence).
    Our materials: K-1700 has OEKO-TEX verification; STY-5520 has GOTS certification.
  checks:
    - tool: search_competitor_sustainability_claims
      args: {keyword: sustainable}
      expect: ["competitor", "claim"]
    - tool: search_material_certification_registry
      args: {certification_type: oeko_tex}
      expect: ["oeko_tex"]
    - tool: compare_claims_to_certifications
      args: {subject_id: STY-5520}
      expect: ["STY-5520"]
    - tool: get_own_material_certifications
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001"]

- question: "06:52:Q4"
  story: >
    Fabric sustainability certifications show cotton with GOTS (Premium Organic Mills),
    Fair Trade (Organic Cotton Growers Coop), and polyester with OEKO-TEX (Everfab Manufacturing).
  checks:
    - tool: get_fabric_sustainability_certifications
      args: {material: cotton}
      expect: ["cotton", "gots"]

- question: "06:55:Q1"
  story: >
    Cosmetics packaging in France and Germany requires labelling in local languages (French/German),
    with legal marks, recycling labels, and warnings. Minimum font sizes specified.
  checks:
    - tool: search_cosmetics_labelling_requirements_by_country
      args: {market: EU}
      expect: ["cosmetics"]
    - tool: get_language_requirements_by_country
      args: {market: EU}
      expect: ["de", "fr"]

- question: "06:59:Q5"
  story: >
    Products missing compliance data in Ireland market: K-1700 under review (awaiting test_report),
    PF-220 non-compliant (missing certificate). Both due within 60 days.
  checks:
    - tool: list_products_missing_compliance_data_by_market
      args: {market: EU}
      expect: ["missing_data"]

- question: "06:60:Q1"
  story: >
    PFAS regulatory status by region: EU (phase_out, effective 2027-06-01),
    but globally restricted with alternatives available.
  checks:
    - tool: get_regulatory_status_by_substance_and_region
      args: {substance_name: PFAS, market: EU}
      expect: ["PFAS", "phase_out"]

- question: "06:60:Q6"
  story: >
    Microplastics regulations coming: search shows upcoming regulations by topic.
  checks:
    - tool: search_upcoming_regulations_by_topic
      args: {topic: microplastics}
      expect: ["upcoming"]

- question: "06:60:Q7"
  story: >
    Recycled content claims must meet chain-of-custody evidence requirements.
    K-1700 claims 100% recyclable with OEKO-TEX backing (verified).
  checks:
    - tool: search_recycled_content_claim_standards
      args: {market: EU}
      expect: ["recycled"]
    - tool: compare_claims_to_certificate_coverage
      args: {sku: K-1700}
      expect: ["K-1700"]

- question: "08:80:Q1"
  story: >
    Market entry for Poland and Czechia requires local labelling, language requirements and compliance rules.
    EU requirements apply (German/French language support from labelling_requirements).
  checks:
    - tool: get_labelling_and_language_requirements
      args: {market: EU}
      expect: ["language"]
    - tool: get_product_compliance_requirements_by_market
      args: {sku: K-1700, market: EU}
      expect: ["requirement_type"]

- question: "08:80:Q3"
  story: >
    Japan market entry assessment: compliance requirements for water bottles and apparel products.
  checks:
    - tool: get_product_compliance_requirements_by_market
      args: {sku: STY-5520, market: EU}
      expect: ["requirement_type"]
