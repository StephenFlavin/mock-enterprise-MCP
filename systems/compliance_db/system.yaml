id: compliance_db
name: Product Compliance & Regulatory Database
instructions: >
  Product compliance requirements, regulations and certifications by market.
  Regulation ids look like REG-900011. Issue ids look like ISS-000456. Task ids look like TSK-000789.
  Use it for regulatory requirements by product type and market, compliance gaps, labelling rules, certifications and compliance tracking.

tables:
  regulations:
    key: regulation_id
    cols:
      regulation_id: {type: str, desc: "Regulation id, e.g. REG-000123"}
      title: {type: str, desc: "Regulation name"}
      description: {type: text, desc: "What the regulation covers"}
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, other], desc: "Primary market"}
      product_scope: {type: str, desc: "Regulated product categories, | separated, e.g. kids_sleepwear or battery_products|smart_bottles"}
      effective_date: {type: date, desc: "When the regulation takes effect"}
      transitional_period_end: {type: date, desc: "End of grace period if any"}
      impact_level: {type: enum, values: [critical, high, medium, low], desc: "Business impact"}
      status: {type: enum, values: [upcoming, active, expiring, superseded], desc: "Regulation status"}
      keywords: {type: text, desc: "Search words: product types, topics and synonyms"}
      required_action: {type: text, desc: "What the business must do to comply"}
      created_at: {type: timestamp, desc: "When this was added to tracking"}
      updated_at: {type: timestamp, desc: "Last update"}

  regulatory_requirements:
    key: req_id
    cols:
      req_id: {type: str, desc: "Requirement id, e.g. REQ-000123"}
      regulation_id: {type: str, desc: "Related regulation"}
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, other], desc: "Market this applies to"}
      product_category: {type: str, desc: "Product category, e.g. kids_sleepwear, water_bottles, cosmetics"}
      requirement_type: {type: enum, values: [labelling, testing, certification, performance, material, documentation], desc: "Type of requirement"}
      topic: {type: str, desc: "Subject, e.g. flammability, food_contact, heavy_metals, small_parts, ventilation"}
      standard: {type: str, desc: "Standard or law cited, e.g. BS 5722, EN 14350"}
      description: {type: text, desc: "What must be done or documented"}
      applies_to: {type: str, desc: "E.g. EU market, stainless steel products, items with batteries"}

  product_compliance_status:
    key: [sku, market]
    cols:
      sku: {desc: "Product SKU"}
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, other], desc: "Market"}
      product_category: {type: str, desc: "Regulated category the product falls under, e.g. childrens_drinkware"}
      compliance_status: {type: enum, values: [compliant, non_compliant, under_review, blocked, exempt], desc: "Compliance status"}
      missing_data_type: {type: str, desc: "What data is missing, e.g. test_report, certificate, labelling_approval"}
      required_by: {type: date, desc: "Deadline for compliance"}
      notes: {type: str, desc: "Notes on status or remediation"}
      updated_at: {type: timestamp, desc: "Last updated"}

  compliance_issues:
    key: issue_id
    cols:
      issue_id: {type: str, desc: "Issue id, e.g. ISS-000123"}
      sku: {desc: "Affected product SKU"}
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, other], desc: "Market where issue was found"}
      country: {type: str, desc: "Country code if country specific, e.g. DE, FR, GB"}
      issue_type: {type: enum, values: [labelling_gap, testing_failure, certification_missing, spec_non_compliance, ingredient_issue, other], desc: "Type of problem"}
      description: {type: text, desc: "What the problem is"}
      priority: {type: enum, values: [critical, high, medium, low], desc: "Severity"}
      status: {type: enum, values: [open, under_review, resolved, waived, duplicate], desc: "Current status"}
      created_at: {type: timestamp, desc: "When logged"}
      resolution_note: {type: text, desc: "How the issue was resolved or waived"}
      updated_at: {type: timestamp, desc: "Last updated"}

  compliance_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Task id, e.g. TSK-000123"}
      regulation_id: {type: str, desc: "Related regulation change"}
      title: {type: str, desc: "What needs to be done"}
      description: {type: text, desc: "Details of the task"}
      task_type: {type: enum, values: [testing, documentation, supplier_request, design_change, labelling_update, certification, other], desc: "Type of action"}
      status: {type: enum, values: [open, in_progress, completed, cancelled, blocked], desc: "Task status"}
      due_date: {type: date, desc: "When this should be completed"}
      assigned_to: {type: str, desc: "Employee id responsible"}
      estimated_cost_gbp: {type: float, desc: "Estimated cost if known"}
      created_at: {type: timestamp, desc: "When task was created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  material_certifications:
    key: cert_id
    cols:
      cert_id: {type: str, desc: "Certification id, e.g. CRT-000123"}
      certificate_number: {type: str, desc: "Official certificate number"}
      certification_type: {type: enum, values: [oeko_tex, gots, fair_trade, b_corp, eu_ecolabel, cradle_to_cradle, bluesign, other], desc: "Type of certification"}
      holder_type: {type: enum, values: [supplier, factory, own_product, material], desc: "Who holds it"}
      holder_name: {type: str, desc: "Company or product name holding cert"}
      supplier_id: {type: str, desc: "If held by supplier"}
      sku: {type: str, desc: "If held by our product"}
      material: {type: str, desc: "If for a material type"}
      issue_date: {type: date, desc: "When certificate was issued"}
      expiry_date: {type: date, desc: "When it expires"}
      verified_in_registry: {type: bool, desc: "Verified in public registry"}
      registry_checked_at: {type: date, desc: "Date registry was checked"}
      status: {type: enum, values: [active, expired, revoked, pending, unverified], desc: "Certificate status"}

  labelling_requirements:
    key: label_req_id
    cols:
      label_req_id: {type: str, desc: "Requirement id"}
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, other], desc: "Market"}
      country: {type: str, desc: "Country code if specific, blank = whole market, e.g. DE, FR"}
      language: {type: str, desc: "Language, e.g. de (German), fr (French)"}
      requirement_category: {type: enum, values: [legal_marks, content_declaration, warnings, recycling, nutrition, allergens, instructions, origin, other], desc: "Category"}
      requirement_text: {type: text, desc: "What must appear on the label"}
      product_scope: {type: str, desc: "Products this applies to, e.g. cosmetics, textiles"}
      mandatory: {type: bool, desc: "Is it mandatory or voluntary"}
      minimum_font_size_pt: {type: int, desc: "Minimum font size if specified"}
      check_terms: {type: str, desc: "Regex of words that prove the requirement is on the label"}

  substance_restrictions:
    key: substance_id
    cols:
      substance_id: {type: str, desc: "Substance id, e.g. SUB-000123"}
      substance_name: {type: str, desc: "Chemical name"}
      common_name: {type: str, desc: "Common/trade name if any"}
      restriction_type: {type: enum, values: [banned, restricted, candidate_list, under_review, phase_out], desc: "Type of restriction"}
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, global, other], desc: "Where it applies"}
      applies_to: {type: str, desc: "Product types or uses affected"}
      effective_date: {type: date, desc: "When the restriction takes effect"}
      ban_date: {type: date, desc: "If applicable, when ban starts"}
      typical_use: {type: str, desc: "Where used, e.g. durable water repellent, flame retardant"}
      alternative_available: {type: bool, desc: "If alternatives exist"}

  sustainability_claims:
    key: claim_id
    cols:
      claim_id: {type: str, desc: "Claim id, e.g. CLA-000123"}
      subject_type: {type: enum, values: [own_product, competitor_product, supplier_brand, material], desc: "Who is making the claim"}
      subject_id: {type: str, desc: "SKU or company name"}
      claim_text: {type: text, desc: "The sustainability claim made"}
      claim_type: {type: enum, values: [recycled_content, sustainable_sourced, carbon_neutral, water_saved, animal_welfare, other], desc: "Type of claim"}
      certification_backing: {type: str, desc: "If backed by certification, which one"}
      certification_verified: {type: bool, desc: "Is the certification verified"}
      confidence_level: {type: enum, values: [verified, likely, unclear, dubious], desc: "Confidence in claim"}
      sources: {type: text, desc: "Where the claim is made"}
      updated_at: {type: timestamp, desc: "When last reviewed"}

  certification_registry:
    key: registry_entry_id
    cols:
      registry_entry_id: {type: str, desc: "Entry id, e.g. CRG-000123"}
      certificate_number: {type: str, desc: "Certificate number to look up"}
      certification_type: {type: str, desc: "Type, e.g. OEKO-TEX"}
      holder_name: {type: str, desc: "Company holding the certificate"}
      holder_country: {type: str, desc: "Holder country code, e.g. PT, TR"}
      issued_date: {type: date, desc: "Issue date"}
      expiry_date: {type: date, desc: "Expiry date"}
      registry_url: {type: str, desc: "URL where it can be verified"}
      is_valid: {type: bool, desc: "Currently valid"}
      status: {type: enum, values: [valid, expired, revoked, suspended], desc: "Registry status"}
      last_checked: {type: date, desc: "Last verification check"}

  regulated_categories:
    key: product_category
    cols:
      product_category: {type: str, desc: "Category key, e.g. childrens_drinkware, kids_sleepwear"}
      description: {type: str, desc: "What the category covers"}
      master_categories: {type: str, desc: "Our product categories in it, | separated"}
      hazmat: {type: str, desc: "Hazmat class that also puts a product in it, e.g. li_ion_battery"}

  countries:
    key: country
    cols:
      country: {type: str, desc: "ISO country code, e.g. DE, FR, GB"}
      name: {type: str, desc: "Country name"}
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, other], desc: "Regulatory market it belongs to"}

  regulatory_notifications:
    key: notification_id
    cols:
      notification_id: {type: str, desc: "Id, e.g. NOT-900001"}
      country: {type: str, desc: "Country code, e.g. GB, DE, FR, IE; EU for EU-wide"}
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, other], desc: "Market"}
      trigger_event: {type: enum, values: [recall, withdrawal, test_failure_report], desc: "What triggers the duty"}
      authority: {type: str, desc: "Regulator to notify"}
      channel: {type: str, desc: "Portal or route used"}
      deadline_hours: {type: int, desc: "Hours allowed from the decision or confirmed failure"}
      deadline_text: {type: str, desc: "Deadline in words"}
      format: {type: str, desc: "What the notification must contain"}
      signoff_role: {type: str, desc: "Internal role that signs the notification off"}
      notified_by: {type: str, desc: "Internal role that submits it"}
      definition: {type: text, desc: "How the law defines this measure"}
      legal_basis: {type: str, desc: "Law or rule"}

  alternative_materials:
    key: alt_id
    cols:
      alt_id: {type: str, desc: "Id, e.g. ALT-900001"}
      substance_name: {type: str, desc: "Restricted substance it replaces, e.g. PFAS"}
      applies_to: {type: str, desc: "Use, e.g. DWR finish for waterproof outerwear"}
      alternative_name: {type: str, desc: "Alternative material"}
      material_id: {type: str, desc: "Costing material id if one exists"}
      supplier_id: {desc: "Supplier of the alternative if known"}
      cost_impact_pct: {type: float, desc: "Cost change against the current material, percent"}
      performance_notes: {type: text, desc: "Performance versus current"}
      maturity: {type: enum, values: [proven_in_volume, pilot, experimental], desc: "How proven it is"}
      proven_at_price_point: {type: bool, desc: "Proven at our price point"}

  material_substances:
    key: match_id
    cols:
      match_id: {type: str, desc: "Id, e.g. MSL-900001"}
      material_id: {type: str, desc: "Material id, e.g. MAT-LEATHER"}
      material_name: {type: str, desc: "Material name"}
      substance_id: {type: str, desc: "Matching substance restriction id, e.g. SUB-900004"}
      supplier_id: {desc: "Supplier of the material"}
      evidence: {type: text, desc: "Why the material matches"}
      status: {type: enum, values: [confirmed, declared, suspected], desc: "Confidence"}

tools:
  - name: search_regulations_by_product_type
    desc: Find regulations for a product type, optionally in one market, with status, dates and summary. Use first to get regulation ids.
    kind: select
    from: regulations
    filters:
      product_scope: {col: keywords, op: like, desc: "Product type words, e.g. kids sleepwear, water bottles, waterproof outerwear"}
      market: {}
      status: {}
    columns: [regulation_id, title, description, market, product_scope, effective_date, transitional_period_end, impact_level, status]
    order: market, effective_date
    limit: 30
    example: {product_scope: sleepwear}

  - name: get_regulatory_requirements_by_market
    desc: Requirements (testing, labelling, materials, certification) for a regulated product category, in one market or all markets.
    kind: sql
    args:
      product_category: {required: true, type: enum, values: [kids_sleepwear, childrens_drinkware, smart_bottles, battery_products, waterproof_outerwear, cosmetics, leather_goods, electrical_appliances, electric_reach_trucks], desc: "Regulated product category"}
      market: {desc: "Market, e.g. UK, EU, US, AU. Omit for all markets"}
      requirement_type: {type: enum, values: [labelling, testing, certification, performance, material, documentation], desc: "Only this type of requirement"}
    sql: |
      SELECT rr.req_id, rr.market, rr.product_category, rr.requirement_type, rr.topic, rr.standard, rr.description, g.title AS regulation
      FROM regulatory_requirements rr LEFT JOIN regulations g USING (regulation_id)
      WHERE rr.product_category = replace(lower($product_category), ' ', '_')
        AND ($market IS NULL OR rr.market = $market)
        AND ($requirement_type IS NULL OR rr.requirement_type = $requirement_type)
      ORDER BY rr.market, rr.requirement_type, rr.req_id
    limit: 60
    example: {product_category: kids_sleepwear, market: UK}

  - name: compare_requirements_across_markets
    desc: Side-by-side requirements for one product category across UK, EU, US and AU, with standards. Use for comparison tables.
    kind: sql
    args:
      product_category: {required: true, type: enum, values: [kids_sleepwear, childrens_drinkware, smart_bottles, battery_products, waterproof_outerwear, cosmetics, leather_goods, electrical_appliances, electric_reach_trucks], desc: "Regulated product category"}
      topic: {type: str, desc: "Only this topic, e.g. flammability, food_contact, heavy_metals, small_parts, labelling, marking"}
    sql: |
      SELECT market, requirement_type, topic, standard, description
      FROM regulatory_requirements
      WHERE product_category = replace(lower($product_category), ' ', '_')
        AND market IN ('UK', 'EU', 'US', 'AU')
        AND ($topic IS NULL OR topic = $topic)
      ORDER BY topic, market, requirement_type
    limit: 60
    example: {product_category: kids_sleepwear}

  - name: compare_product_specs_to_requirements
    desc: Flag our products that fail or are still under review against market requirements, with what evidence is missing. Give a sku, or a category and market.
    kind: sql
    args:
      sku: {}
      market: {desc: "Market, e.g. UK, EU, US, AU. Omit for all markets"}
      product_category: {type: str, desc: "Regulated category, e.g. childrens_drinkware, kids_sleepwear, leather_goods"}
    sql: |
      SELECT ps.sku, p.name, ps.market, ps.product_category, ps.compliance_status, ps.missing_data_type, ps.required_by, ps.notes,
             (SELECT string_agg(DISTINCT rr.requirement_type, ', ') FROM regulatory_requirements rr
              WHERE rr.product_category = ps.product_category AND rr.market = ps.market) AS requirement_types_to_evidence
      FROM product_compliance_status ps JOIN master.products p USING (sku)
      WHERE ($sku IS NULL OR ps.sku = $sku)
        AND ($market IS NULL OR ps.market = $market)
        AND ($product_category IS NULL OR ps.product_category = replace(lower($product_category), ' ', '_'))
        AND ($sku IS NOT NULL OR ps.compliance_status IN ('non_compliant', 'under_review', 'blocked'))
      ORDER BY ps.compliance_status DESC, ps.sku, ps.market
    limit: 60
    example: {product_category: childrens_drinkware, market: UK}

  - name: get_regulation_deadlines
    desc: Effective dates and transitional periods for upcoming and in-transition regulations, earliest first, optionally for one product type or market.
    kind: sql
    args:
      days_ahead: {type: int, default: 540, desc: "Show regulations effective in next N days"}
      product_scope: {type: str, desc: "Product type words, e.g. waterproof outerwear, battery"}
      market: {}
    sql: |
      SELECT regulation_id, title, market, product_scope, effective_date, transitional_period_end, impact_level, status, required_action,
             date_diff('day', CAST($as_of AS DATE), effective_date) AS days_until_effective
      FROM regulations
      WHERE status IN ('upcoming', 'active')
        AND effective_date <= CAST($as_of AS DATE) + (INTERVAL '1' DAY) * CAST($days_ahead AS INT)
        AND (effective_date >= CAST($as_of AS DATE) OR transitional_period_end >= CAST($as_of AS DATE))
        AND ($market IS NULL OR market = $market)
        AND ($product_scope IS NULL OR list_bool_and(list_transform(string_split(replace(lower($product_scope), '_', ' '), ' '), w -> contains(replace(lower(keywords), '_', ' '), w))))
      ORDER BY effective_date ASC
    limit: 30
    example: {product_scope: waterproof outerwear}

  - name: list_upcoming_regulatory_changes
    desc: Pending regulation changes in the next N days ranked by impact then deadline, with what each requires. Use for horizon scans.
    kind: sql
    args:
      days_ahead: {type: int, default: 540, desc: "Show changes effective in next N days"}
      market: {}
      product_scope: {type: str, desc: "Product type words, e.g. textiles, cosmetics, battery"}
    sql: |
      SELECT regulation_id, title, market, product_scope, effective_date, transitional_period_end, impact_level, required_action
      FROM regulations
      WHERE status = 'upcoming'
        AND effective_date >= CAST($as_of AS DATE)
        AND effective_date <= CAST($as_of AS DATE) + (INTERVAL '1' DAY) * CAST($days_ahead AS INT)
        AND ($market IS NULL OR market = $market)
        AND ($product_scope IS NULL OR list_bool_and(list_transform(string_split(replace(lower($product_scope), '_', ' '), ' '), w -> contains(replace(lower(keywords), '_', ' '), w))))
      ORDER BY
        CASE impact_level WHEN 'critical' THEN 0 WHEN 'high' THEN 1 WHEN 'medium' THEN 2 WHEN 'low' THEN 3 END,
        effective_date ASC
    limit: 30
    example: {}

  - name: calculate_regulation_impact_score
    desc: Score upcoming regulations 0-100 from impact level, number of our products affected and deadline urgency. Omit regulation_id to rank all.
    kind: sql
    args:
      regulation_id: {desc: "Regulation id, e.g. REG-900011. Omit to score every upcoming regulation"}
    sql: |
      WITH r AS (
        SELECT * FROM regulations WHERE status = 'upcoming' AND ($regulation_id IS NULL OR regulation_id = $regulation_id)
      ), aff AS (
        SELECT r.regulation_id, count(DISTINCT p.sku) AS affected_products,
               string_agg(DISTINCT p.category, ', ') AS affected_categories
        FROM r
        JOIN regulated_categories rc ON list_contains(string_split(r.product_scope, '|'), rc.product_category)
        JOIN master.products p ON p.status <> 'discontinued'
             AND (list_contains(string_split(rc.master_categories, '|'), p.category) OR (rc.hazmat <> '' AND p.hazmat = rc.hazmat))
        GROUP BY r.regulation_id
      )
      SELECT r.regulation_id, r.title, r.impact_level, r.effective_date,
             date_diff('day', CAST($as_of AS DATE), r.effective_date) AS days_until_effective,
             coalesce(a.affected_products, 0) AS affected_products, a.affected_categories,
             CASE r.impact_level WHEN 'critical' THEN 40 WHEN 'high' THEN 30 WHEN 'medium' THEN 20 ELSE 10 END AS impact_points,
             least(30, ceil(coalesce(a.affected_products, 0) / 10.0)) AS product_points,
             CASE WHEN date_diff('day', CAST($as_of AS DATE), r.effective_date) <= 90 THEN 30
                  WHEN date_diff('day', CAST($as_of AS DATE), r.effective_date) <= 180 THEN 25
                  WHEN date_diff('day', CAST($as_of AS DATE), r.effective_date) <= 365 THEN 15 ELSE 5 END AS urgency_points,
             CASE r.impact_level WHEN 'critical' THEN 40 WHEN 'high' THEN 30 WHEN 'medium' THEN 20 ELSE 10 END
               + least(30, ceil(coalesce(a.affected_products, 0) / 10.0))
               + CASE WHEN date_diff('day', CAST($as_of AS DATE), r.effective_date) <= 90 THEN 30
                      WHEN date_diff('day', CAST($as_of AS DATE), r.effective_date) <= 180 THEN 25
                      WHEN date_diff('day', CAST($as_of AS DATE), r.effective_date) <= 365 THEN 15 ELSE 5 END AS impact_score,
             'impact_score = impact points (critical 40, high 30, medium 20, low 10) + product points (1 per 10 affected products, max 30) + urgency points (<=90 days 30, <=180 25, <=365 15, else 5)' AS formula
      FROM r LEFT JOIN aff a USING (regulation_id)
      ORDER BY impact_score DESC, r.effective_date
    limit: 30
    example: {regulation_id: REG-900011}

  - name: get_regulatory_notification_requirements_by_country
    desc: Who to notify for a product recall or withdrawal in each country, by when, how, and who signs off. Compare recall against withdrawal.
    kind: sql
    args:
      country: {type: str, desc: "Country code or name, e.g. GB, DE, FR, IE. Omit for all countries"}
      action_type: {type: enum, values: [recall, withdrawal], desc: "Only this measure"}
    sql: |
      SELECT n.country, n.market, n.trigger_event AS action_type, n.authority, n.channel, n.deadline_hours, n.deadline_text,
             n.format, n.signoff_role, n.notified_by, n.legal_basis, n.definition
      FROM regulatory_notifications n
      WHERE n.trigger_event IN ('recall', 'withdrawal')
        AND ($country IS NULL OR n.country = (SELECT c.country FROM countries c WHERE lower($country) IN (lower(c.country), lower(c.name))))
        AND ($action_type IS NULL OR n.trigger_event = $action_type)
      ORDER BY n.deadline_hours, n.country, n.trigger_event
    limit: 30
    example: {country: GB}

  - name: get_regulatory_reporting_obligations
    desc: Duty to report a test failure or non-compliant product to regulators by market, with authority, channel, deadline and legal basis.
    kind: sql
    args:
      market: {desc: "Market, e.g. UK, EU, US, AU. Omit for all markets"}
    sql: |
      SELECT market, authority, channel, deadline_hours, deadline_text, format, legal_basis
      FROM regulatory_notifications
      WHERE trigger_event = 'test_failure_report' AND ($market IS NULL OR market = $market)
      ORDER BY deadline_hours, market
    limit: 20
    example: {market: EU}

  - name: get_labelling_requirements_by_market
    desc: Label content rules (marks, composition, care, origin, importer, recycling) for a country or market and product scope, with language.
    kind: sql
    args:
      country: {type: str, desc: "Country code or name, e.g. DE, FR, GB. Includes market-wide rules"}
      market: {desc: "Market, e.g. UK, EU, US, AU. Omit when a country is given"}
      product_scope: {type: str, desc: "Regulated category, e.g. all_textiles, childrens_drinkware, cosmetics"}
    sql: |
      WITH t AS (
        SELECT (SELECT c.country FROM countries c WHERE lower($country) IN (lower(c.country), lower(c.name))) AS cc,
               coalesce((SELECT c.market FROM countries c WHERE lower($country) IN (lower(c.country), lower(c.name))), upper($market)) AS mk
      )
      SELECT DISTINCT lr.label_req_id, lr.market, lr.country, lr.language, lr.requirement_category, lr.requirement_text,
             lr.product_scope, lr.mandatory, lr.minimum_font_size_pt
      FROM labelling_requirements lr, t
      WHERE (t.mk IS NULL OR lr.market = t.mk)
        AND (t.cc IS NULL OR lr.country IS NULL OR lr.country = t.cc)
        AND ($product_scope IS NULL OR lr.product_scope = replace(lower($product_scope), ' ', '_'))
      ORDER BY lr.product_scope, lr.country, lr.requirement_category, lr.label_req_id
    limit: 50
    example: {country: DE, product_scope: all_textiles}

  - name: get_labelling_and_language_requirements
    desc: Retrieves labelling and language requirements by market (e.g. which languages required, font sizes).
    kind: sql
    args:
      market: {required: true}
      language: {type: str, desc: "Language code, e.g. fr, de, it (optional)"}
    sql: |
      SELECT market, language, requirement_category, requirement_text, mandatory, minimum_font_size_pt
      FROM labelling_requirements
      WHERE market = $market
        AND ($language IS NULL OR language = $language)
      ORDER BY language, requirement_category
    limit: 40
    example: {market: EU}

  - name: get_language_requirements_by_country
    desc: Return language requirements by country (which languages must labels be in).
    kind: sql
    args:
      market: {required: true}
    sql: |
      SELECT DISTINCT market, language
      FROM labelling_requirements
      WHERE market = $market
      ORDER BY language
    limit: 10
    example: {market: EU}

  - name: compare_label_to_requirements
    desc: Check extracted label text for a product against the mandatory label rules of a country; lists each rule as present or MISSING.
    kind: sql
    args:
      sku: {required: true}
      country: {required: true, type: str, desc: "Country code or name of the market the label is for, e.g. DE, FR, GB"}
      label_text: {type: str, desc: "Text extracted from the label image. Omit to just list the rules"}
    sql: |
      WITH t AS (
        SELECT (SELECT c.country FROM countries c WHERE lower($country) IN (lower(c.country), lower(c.name))) AS cc,
               (SELECT c.market FROM countries c WHERE lower($country) IN (lower(c.country), lower(c.name))) AS mk
      ), pc AS (
        SELECT rc.product_category FROM regulated_categories rc JOIN master.products p ON p.sku = $sku
        WHERE list_contains(string_split(rc.master_categories, '|'), p.category)
      )
      SELECT $sku AS sku, lr.label_req_id, t.cc AS country, lr.requirement_category, lr.requirement_text,
             CASE WHEN $label_text IS NULL OR lr.check_terms IS NULL THEN 'to_check'
                  WHEN regexp_matches($label_text, lr.check_terms, 'i') THEN 'present'
                  ELSE 'MISSING' END AS gap_status
      FROM labelling_requirements lr, t
      WHERE lr.mandatory = true AND lr.market = t.mk AND (lr.country IS NULL OR lr.country = t.cc)
        AND lr.product_scope IN (SELECT product_category FROM pc)
      ORDER BY gap_status DESC, lr.label_req_id
    limit: 40
    example: {sku: SKU-100476, country: DE, label_text: "Navy Blouse 12 100% Polyester Machine wash 30C Made in China Importer"}

  - name: draft_compliance_checklist
    desc: Draft a walkable compliance checklist from the requirements for a regulated category or a product in a market, grouped by topic.
    kind: draft
    args:
      product_category: {type: enum, values: [kids_sleepwear, childrens_drinkware, smart_bottles, battery_products, waterproof_outerwear, cosmetics, leather_goods, electrical_appliances, electric_reach_trucks], desc: "Regulated category, e.g. electric_reach_trucks. Or give a sku"}
      sku: {desc: "Product SKU, used when no category is given"}
      market: {required: true, desc: "Market, e.g. UK, EU"}
    sql:
      reqs: |
        SELECT rr.requirement_type, rr.topic, rr.standard, rr.description
        FROM regulatory_requirements rr
        WHERE rr.market = $market
          AND rr.product_category = coalesce(replace(lower($product_category), ' ', '_'),
            (SELECT ps.product_category FROM product_compliance_status ps WHERE ps.sku = $sku AND ps.market = $market LIMIT 1),
            (SELECT rc.product_category FROM regulated_categories rc JOIN master.products p ON p.sku = $sku
             WHERE list_contains(string_split(rc.master_categories, '|'), p.category) ORDER BY rc.product_category LIMIT 1))
        ORDER BY rr.req_id
    template: |
      # Compliance checklist: {{ product_category or sku }} in {{ market }}
      {% for req in reqs %}
      {% if loop.first or req.topic != reqs[loop.index0 - 1].topic %}

      ## {{ req.topic | replace('_', ' ') | title }}
      {% endif %}
      - [ ] {{ req.requirement_type | upper }} ({{ req.standard }}): {{ req.description }}
      {% endfor %}

      Walk each item and record evidence before sign-off.
    example: {product_category: electric_reach_trucks, market: UK}

  - name: create_compliance_issue
    desc: Log a compliance issue against a product (labelling gap, test failure, missing certification) for a market and optional country.
    kind: insert
    table: compliance_issues
    id_prefix: ISS-
    defaults: {status: open}
    args:
      sku: {required: true}
      market: {required: true}
      country: {}
      issue_type: {required: true}
      description: {required: true}
      priority: {required: true}
    example: {sku: SKU-100476, market: EU, country: DE, issue_type: labelling_gap, description: "Care and origin text in English, German required", priority: high}

  - name: update_compliance_issue_status
    desc: Change the status of a logged compliance issue (open, under_review, resolved, waived) with an optional resolution note.
    kind: update
    table: compliance_issues
    set: {status: "{status}"}
    args:
      status: {required: true, type: enum, values: [open, under_review, resolved, waived, duplicate]}
      resolution_note: {}
    example: {issue_id: ISS-900006, status: resolved, resolution_note: "Printer fixed label"}

  - name: create_compliance_task
    desc: Create a compliance action task for a regulation change (testing, design, labelling, certification) with due date and owner.
    kind: insert
    table: compliance_tasks
    id_prefix: TSK-
    defaults: {status: open}
    args:
      regulation_id: {required: true}
      title: {required: true}
      description: {}
      task_type: {}
      due_date: {}
      assigned_to: {}
      estimated_cost_gbp: {}
    example: {regulation_id: REG-900011, title: "Test PFAS alternatives for performance", due_date: "+30d"}

  - name: search_restricted_substance_lists
    desc: Restricted, banned and candidate-list substances by market, including global entries, with dates and typical use.
    kind: sql
    args:
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, global, other], desc: "Market; global rules are always included"}
      restriction_type: {}
      applies_to: {type: str, desc: "Words in the use or product, e.g. leather, textiles"}
    sql: |
      SELECT substance_id, substance_name, restriction_type, market, applies_to, effective_date, ban_date, typical_use, alternative_available
      FROM substance_restrictions
      WHERE ($market IS NULL OR market = $market OR market = 'global')
        AND ($restriction_type IS NULL OR restriction_type = $restriction_type)
        AND ($applies_to IS NULL OR lower(applies_to || ' ' || typical_use) LIKE '%' || lower($applies_to) || '%')
      ORDER BY restriction_type, substance_name
    limit: 50
    example: {market: EU}

  - name: get_substance_list_matches_for_materials
    desc: Our materials that contain a restricted, banned or candidate-list substance in a market, with supplier and evidence. Use to find products at risk.
    kind: sql
    args:
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, global, other], desc: "Market whose lists apply; global rules are included"}
      restriction_type: {}
    sql: |
      SELECT ms.material_id, ms.material_name, ms.supplier_id, sr.substance_id, sr.substance_name, sr.restriction_type, sr.market,
             sr.effective_date, sr.ban_date, ms.status, ms.evidence, sr.alternative_available
      FROM material_substances ms JOIN substance_restrictions sr USING (substance_id)
      WHERE ($market IS NULL OR sr.market = $market OR sr.market = 'global')
        AND ($restriction_type IS NULL OR sr.restriction_type = $restriction_type)
      ORDER BY sr.restriction_type DESC, ms.material_id
    limit: 40
    example: {market: EU}

  - name: search_alternative_materials
    desc: Compliant alternatives to a restricted substance with cost impact, performance, maturity and whether proven at our price point.
    kind: sql
    args:
      substance_name: {required: true, desc: "Substance to replace, e.g. PFAS, Chromium VI, Lead"}
      applies_to: {type: str, desc: "Use, e.g. DWR, membrane, leather, hardware"}
    sql: |
      SELECT alt_id, substance_name, applies_to, alternative_name, material_id, supplier_id, cost_impact_pct,
             performance_notes, maturity, proven_at_price_point
      FROM alternative_materials
      WHERE lower(substance_name) LIKE '%' || lower($substance_name) || '%'
        AND ($applies_to IS NULL OR lower(applies_to || ' ' || alternative_name) LIKE '%' || lower($applies_to) || '%')
      ORDER BY substance_name, applies_to, cost_impact_pct
    limit: 20
    example: {substance_name: PFAS}

  - name: get_material_compliance_status
    desc: Return material compliance status (whether in use, if restricted, alternatives available).
    kind: sql
    args:
      material: {required: true, desc: "Material or substance name"}
      market: {required: true}
    sql: |
      SELECT sr.substance_id, sr.substance_name, sr.restriction_type, sr.market,
             sr.applies_to, sr.alternative_available
      FROM substance_restrictions sr
      WHERE sr.substance_name ILIKE '%' || $material || '%'
        AND (sr.market = $market OR sr.market = 'global')
    limit: 20
    example: {material: PFAS, market: EU}

  - name: search_certification_registry
    desc: Verify certificates in the public registry by certificate number, or list a certification type for a holder or country, with validity and expiry.
    kind: sql
    args:
      certificate_number: {type: str, desc: "Certificate number, e.g. OT-26-3010058"}
      certification_type: {type: str, desc: "Type, e.g. oeko_tex, gots, fair_trade, bluesign"}
      holder_country: {type: str, desc: "Holder country code, e.g. PT, TR"}
      holder_name: {type: str, desc: "Company name, partial match"}
    sql: |
      SELECT registry_entry_id, certificate_number, certification_type, holder_name, holder_country, issued_date, expiry_date, status, is_valid, last_checked
      FROM certification_registry
      WHERE ($certificate_number IS NULL OR certificate_number = $certificate_number)
        AND ($certification_type IS NULL OR certification_type = replace(replace(lower($certification_type), '-', '_'), ' ', '_'))
        AND ($holder_country IS NULL OR holder_country = upper($holder_country))
        AND ($holder_name IS NULL OR lower(holder_name) LIKE '%' || lower($holder_name) || '%')
      ORDER BY holder_country, holder_name
    limit: 30
    example: {certification_type: oeko_tex, holder_country: PT}

  - name: get_own_material_certifications
    desc: Return own material certifications (our products, suppliers, factories).
    kind: sql
    args:
      sku: {desc: "Product SKU (optional)"}
      supplier_id: {desc: "Supplier (optional)"}
    sql: |
      SELECT cert_id, certificate_number, certification_type, holder_type, holder_name,
             issue_date, expiry_date, verified_in_registry, status
      FROM material_certifications
      WHERE ($sku IS NULL OR sku = $sku)
        AND ($supplier_id IS NULL OR supplier_id = $supplier_id)
      ORDER BY certification_type, expiry_date DESC
    limit: 30
    example: {supplier_id: SUP-0001}

  - name: get_fabric_sustainability_certifications
    desc: Return fabric sustainability certifications (OEKO-TEX, GOTS, Bluesign, Fair Trade).
    kind: sql
    args:
      material: {required: true, desc: "Fabric type or supplier"}
    sql: |
      SELECT cert_id, certificate_number, certification_type, holder_name,
             issue_date, expiry_date, verified_in_registry, status
      FROM material_certifications
      WHERE (holder_name LIKE '%' || $material || '%' OR material LIKE '%' || $material || '%')
        AND certification_type IN ('oeko_tex', 'gots', 'bluesign', 'eu_ecolabel')
      ORDER BY certification_type, expiry_date DESC
    limit: 30
    example: {material: cotton}

  - name: search_material_certification_registry
    desc: Search for material certification registry entries and verify their status.
    kind: sql
    args:
      certification_type: {required: true, desc: "Type like oeko_tex, gots, fair_trade"}
      holder_name: {desc: "Company or mill name (partial match)"}
    sql: |
      SELECT registry_entry_id, certificate_number, certification_type, holder_name,
             issued_date, expiry_date, is_valid
      FROM certification_registry
      WHERE certification_type = $certification_type
        AND ($holder_name IS NULL OR holder_name LIKE '%' || $holder_name || '%')
      ORDER BY expiry_date DESC
    limit: 30
    example: {certification_type: oeko_tex}

  - name: compare_claims_to_certifications
    desc: Compare claims to certifications. Which claims are backed by verified certificates.
    kind: sql
    args:
      subject_id: {required: true, desc: "Product SKU or company name"}
    sql: |
      SELECT sc.claim_id, sc.claim_text, sc.claim_type, sc.certification_backing,
             sc.certification_verified, sc.confidence_level
      FROM sustainability_claims sc
      WHERE sc.subject_id = $subject_id
      ORDER BY sc.certification_verified DESC, sc.confidence_level
    limit: 30
    example: {subject_id: STY-5520}

  - name: compare_claims_to_certificate_coverage
    desc: Check if recycled content claims meet chain-of-custody evidence requirements.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT sc.claim_id, sc.claim_text, sc.certification_backing,
             mc.cert_id, mc.certificate_number, mc.status
      FROM sustainability_claims sc
      LEFT JOIN material_certifications mc ON sc.certification_backing = mc.certification_type
      WHERE sc.subject_id = $sku AND sc.claim_type = 'recycled_content'
    limit: 20
    example: {sku: K-1700}

  - name: search_competitor_sustainability_claims
    desc: Search for competitor sustainability claims and whether they are certified.
    kind: sql
    args:
      keyword: {required: true, desc: "Search term like sustainable, recycled, organic"}
    sql: |
      SELECT DISTINCT claim_id, subject_type, subject_id, claim_text, claim_type,
             certification_verified, confidence_level
      FROM sustainability_claims
      WHERE subject_type IN ('competitor_product', 'supplier_brand')
        AND claim_text ILIKE '%' || $keyword || '%'
      ORDER BY certification_verified DESC
    limit: 50
    example: {keyword: Carbon}

  - name: search_recycled_content_claim_standards
    desc: Search for recycled content claim standards and chain-of-custody requirements.
    kind: sql
    args:
      market: {required: true}
    sql: |
      SELECT label_req_id, market, requirement_category, requirement_text
      FROM labelling_requirements
      WHERE market = $market AND requirement_text ILIKE '%recycled%'
    limit: 20
    example: {market: EU}

  - name: search_cosmetics_regulatory_requirements
    desc: Cosmetics regulatory requirements in a market (Responsible Person, notification, safety file, GMP, testing, labelling).
    kind: sql
    args:
      market: {desc: "Market, e.g. EU, UK. Omit for all markets"}
    sql: |
      SELECT req_id, market, requirement_type, topic, standard, description, applies_to
      FROM regulatory_requirements
      WHERE product_category = 'cosmetics' AND ($market IS NULL OR market = $market)
      ORDER BY market, requirement_type, req_id
    limit: 40
    example: {market: EU}

  - name: search_cosmetics_labelling_requirements_by_country
    desc: Search for cosmetics labelling requirements by country (ingredients, warnings, language).
    kind: sql
    args:
      market: {required: true}
    sql: |
      SELECT label_req_id, market, language, requirement_category, requirement_text,
             mandatory, minimum_font_size_pt
      FROM labelling_requirements
      WHERE market = $market AND product_scope LIKE '%cosmetics%'
      ORDER BY language, requirement_category
    limit: 30
    example: {market: EU}

  - name: list_required_registrations_by_market
    desc: Registrations, notifications and certificates required to sell a product category in a market (cosmetics CPNP, SCPN, GMP and so on).
    kind: sql
    args:
      market: {desc: "Market, e.g. EU, UK. Omit for all markets"}
      product_category: {type: str, desc: "Regulated category, e.g. cosmetics, smart_bottles"}
    sql: |
      SELECT req_id, market, product_category, requirement_type, standard, description, applies_to
      FROM regulatory_requirements
      WHERE requirement_type IN ('documentation', 'certification')
        AND ($market IS NULL OR market = $market)
        AND ($product_category IS NULL OR product_category = replace(lower($product_category), ' ', '_'))
      ORDER BY market, product_category, requirement_type, req_id
    limit: 40
    example: {market: EU, product_category: cosmetics}

  - name: get_regulatory_status_by_substance_and_region
    desc: Return regulatory status of a substance by region (banned, restricted, allowed, phase-out timeline).
    kind: sql
    args:
      substance_name: {required: true, desc: "Chemical name"}
      market: {type: enum, values: [UK, EU, US, AU, JP, CN, global, other], default: global}
    sql: |
      SELECT substance_id, substance_name, restriction_type, market, applies_to,
             effective_date, ban_date, alternative_available
      FROM substance_restrictions
      WHERE (substance_name LIKE '%' || $substance_name || '%' OR common_name LIKE '%' || $substance_name || '%')
        AND (market = $market OR market = 'global')
      ORDER BY market, effective_date
    limit: 20
    example: {substance_name: PFAS, market: EU}

  - name: search_upcoming_regulations_by_topic
    desc: Search for upcoming regulations by topic (e.g. microplastics, PFAS, recycling, traceability).
    kind: sql
    args:
      topic: {required: true, desc: "Topic keyword, e.g. microplastics, PFAS, traceability"}
    sql: |
      SELECT regulation_id, title, market, product_scope, effective_date, impact_level
      FROM regulations
      WHERE status = 'upcoming'
        AND (title LIKE '%' || $topic || '%' OR description LIKE '%' || $topic || '%')
      ORDER BY effective_date ASC
    limit: 30
    example: {topic: microplastics}

  - name: list_products_missing_compliance_data_by_market
    desc: List products missing compliance data by market (test reports, certifications, labelling approval).
    kind: sql
    args:
      market: {required: true}
    sql: |
      SELECT sku, market, compliance_status, missing_data_type, required_by
      FROM product_compliance_status
      WHERE market = $market AND missing_data_type IS NOT NULL
      ORDER BY required_by ASC
    limit: 50
    example: {market: EU}

  - name: get_product_compliance_requirements_by_market
    desc: Compliance requirements (testing, certification, labelling, materials) that apply to one product in a market, with its current status.
    kind: sql
    args:
      sku: {required: true}
      market: {required: true}
    sql: |
      WITH pc AS (
        SELECT product_category FROM product_compliance_status WHERE sku = $sku AND market = $market
        UNION
        SELECT rc.product_category FROM regulated_categories rc JOIN master.products p ON p.sku = $sku
        WHERE list_contains(string_split(rc.master_categories, '|'), p.category)
      )
      SELECT DISTINCT rr.product_category, rr.requirement_type, rr.topic, rr.standard, rr.description, rr.applies_to,
             (SELECT ps.compliance_status FROM product_compliance_status ps WHERE ps.sku = $sku AND ps.market = $market) AS compliance_status
      FROM regulatory_requirements rr
      WHERE rr.market = $market AND rr.product_category IN (SELECT product_category FROM pc)
      ORDER BY rr.product_category, rr.requirement_type
    limit: 40
    example: {sku: K-1700, market: EU}
