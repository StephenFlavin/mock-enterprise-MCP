      args: {top_n: 3}
      expect: ["FAC-0087", "FAC-0107", "FAC-0137", "worse"]

- question: "05:43:Q1"
  story: >
    Factory K = FAC-0001 with three audits (B, B, C). Overtime records, wage calculation and fire exits were closed
    after the first audit and came back; later findings are reopened and not yet flagged as repeat.
  checks:
    - tool: list_audit_reports_for_factory
      args: {factory_id: FAC-0001}
      expect: ["AUD-900001", "AUD-900002", "AUD-900003", "Management system weak"]
    - tool: compare_audit_findings_across_audits
      args: {factory_id: FAC-0001}
      expect: ["working hours", "fire safety", "wage calculation", "true"]
    - tool: get_corrective_action_status
      args: {factory_id: FAC-0001, status: overdue}
      expect: ["CAP-900004", "CAP-900005", "CAP-900007"]
    - tool: draft_next_audit_focus_plan
      args: {factory_id: FAC-0001}
      expect: ["working hours", "fire safety", "forced labour"]
    - tool: update_audit_finding_status
      args: {finding_id: FND-900007, is_repeat: true}
      expect: ["is_repeat"]

- question: "05:43:Q4"
  story: >
    FAC-0001 has three open critical findings (FND-900007, FND-900008, FND-900010) so suspension of new orders is
    warranted. The draft lists them with a 5 day deadline; a CAP can then be created.
  checks:
    - tool: get_audit_findings_for_factory
      args: {factory_id: FAC-0001, severity: critical}
      expect: ["FND-900007", "FND-900008", "FND-900010"]
    - tool: draft_corrective_action_plan
      args: {factory_id: FAC-0001}
      expect: ["Factory owner / general manager", "critical"]
    - tool: create_corrective_action_plan
      args: {finding_id: FND-900008, factory_id: FAC-0001, supplier_id: SUP-0001, description: "Clear all fire exits", assigned_to: EMP-00009, due_date: "+5d"}
      expect: ["CAP-", "open"]

- question: "05:43:Q5"
  story: >
    Overdue critical findings: FAC-0001, FAC-0087, FAC-0107 and FAC-0137 (suspended). Reminders are stored in an
