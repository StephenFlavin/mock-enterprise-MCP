      expect: ["FAC-0001", "FAC-0087", "FAC-0107", "FAC-0137"]
    - tool: send_corrective_action_reminder
      args: {corrective_action_id: CAP-900011, factory_id: FAC-0087, supplier_id: SUP-0046, message: "Critical action overdue", sent_by: EMP-00009}
      expect: ["REM-", "CAP-900011"]
    - tool: update_corrective_action_due_date
      args: {corrective_action_id: CAP-900007, due_date: "+14d"}
      expect: ["due_date"]

