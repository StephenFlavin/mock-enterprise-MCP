    - tool: create_corrective_action_plan
      args: {finding_id: FND-900031, factory_id: FAC-0003, supplier_id: SUP-0002, description: "Repay recruitment fees and end passport retention", assigned_to: EMP-00009, due_date: "+30d"}
      expect: ["CAP-", "FND-900031"]

