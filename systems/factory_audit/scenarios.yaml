- question: "02:14:Q3"
  story: >
    Customs holds are for supplier SUP-0052 (Heath Products, Bangladesh), whose factories FAC-0097 and FAC-0098
    have open major findings (FND-900021, FND-900022) for not retaining proof of origin. The CAP draft for the
    supplier lists them with owner role and due dates by severity.
  checks:
    - tool: draft_corrective_action_plan
      args: {supplier_id: SUP-0052}
      expect: ["FND-900021", "FND-900022", "origin documentation", "Factory compliance manager"]

- question: "04:32:Q3"
  story: >
    Bedding shortlist SUP-0039 (Connor Products), SUP-0004 (Collins Textiles) and SUP-0011 (Khan Products), the three
    suppliers every bedding story uses. Connor's FAC-0075 is grade A with nothing open; Collins' factories are mixed
    (FAC-0008 C with one major finding, FAC-0010 A); Khan's FAC-0022 slipped from B to C after an audit found
    unregistered subcontracting (one open critical) and excess overtime.
  checks:
    - tool: get_supplier_audit_status
      args: {supplier_id: SUP-0039}
      expect: ["McDonald Dyehouse 75", "FAC-0075"]
    - tool: get_supplier_audit_status
      args: {supplier_id: SUP-0011}
      expect: ["Brookes Factory 22", "FAC-0022"]

- question: "04:33:Q1"
  story: >
    FAC-0121 (SUP-0064) audit notes and findings point to materials, not labour: a subcontracted dye house releases
    lots without rubbing-fastness testing, matching the supplier portal's rejected dye lots.
  checks:
    - tool: get_factory_audit_findings
      args: {factory_id: FAC-0121}
      expect: ["rubbing-fastness", "materials control", "Labour and working-hours records in order"]

