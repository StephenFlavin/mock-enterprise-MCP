# Scenarios for factory_audit system questions
- question: "02:14:Q3"
  story: >
    A sourcing manager needs to draft a corrective action plan for FAC-0003 (a supplier with critical audit
    findings in multiple areas). The system drafts the CAP with suggested timelines.
  checks:
    - tool: draft_corrective_action_plan
      args: {factory_id: FAC-0003}
      expect: ["suggested_due_date_30", "critical", "forced labor"]

- question: "04:32:Q3"
  story: >
    A category buyer is comparing three suppliers. Supplier SUP-0001 (owns FAC-0002) has audit scores of A.
    Supplier SUP-0001 also owns FAC-0001 with mixed ratings. The buyer checks audit status for both.
  checks:
    - tool: get_supplier_audit_status
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001", "audit"]

- question: "04:33:Q1"
  story: >
    A sourcing manager checks audit findings for FAC-0001 to understand capacity and performance issues.
    The factory has open critical findings for working hours and fire safety from recent audit.
  checks:
    - tool: get_factory_audit_findings
      args: {factory_id: FAC-0001}
      expect: ["critical", "working hours", "FND-900006"]

- question: "04:33:Q3"
  story: >
    Sourcing manager evaluates moving volume from Bangladesh (SUP-0001 with factory FAC-0001) to Vietnam.
    Needs to check audit status for comparison.
  checks:
    - tool: get_supplier_audit_status
      args: {supplier_id: SUP-0001}
      expect: ["audit"]

- question: "04:34:Q2"
  story: >
    Sourcing manager searches for suppliers in Portugal/Turkey for technical outerwear. Checks audit status
    of shortlisted factories to verify compliance capability.
  checks:
    - tool: get_supplier_audit_status
      args: {supplier_id: SUP-0001}
      expect: ["latest_score"]

- question: "04:41:Q5"
  story: >
    Supplier onboarding specialist needs an audit for a new supplier before their first order.
    Creates an audit request for a factory to verify compliance capability.
  checks:
    - tool: create_audit_request
      args: {factory_id: FAC-0002, supplier_id: SUP-0001, audit_type: social, requested_by: EMP-00008}
      expect: ["AUR-", "pending"]

- question: "05:42:Q4"
  story: >
    QA technologist reviews which factories are highest risk for quality problems next season.
    Uses audit scores to identify top three worst-performing factories.
  checks:
    - tool: get_factory_audit_scores
      args: {top_n: 5}
      expect: ["FAC-0003", "D"]

- question: "05:43:Q1"
  story: >
    Factory auditor reviews the last three audit reports for FAC-0001 (Factory K). Finds repeated issues
    with working hours, fire safety (unopened from previous audit). Scores went B→B→C. Corrective actions
    show CAP-900002, CAP-900003, CAP-900005 are overdue. Reopened findings identified. Plans next audit focus.
  checks:
    - tool: list_audit_reports_for_factory
      args: {factory_id: FAC-0001}
      expect: ["AUD-900001", "AUD-900003"]
    - tool: get_audit_findings_for_factory
      args: {factory_id: FAC-0001}
      expect: ["working hours", "fire safety", "FND-900007"]
    - tool: compare_audit_findings_across_audits
      args: {factory_id: FAC-0001}
      expect: ["reopened", "working hours"]
    - tool: get_corrective_action_status
      args: {factory_id: FAC-0001, status: overdue}
      expect: ["CAP-900002", "CAP-900003", "CAP-900005"]
    - tool: draft_next_audit_focus_plan
      args: {factory_id: FAC-0001}
      expect: ["working hours", "fire safety"]
    - tool: update_audit_finding_status
      args: {finding_id: FND-900007, status: reopened, is_repeat: true}
      expect: ["reopened"]

- question: "05:43:Q4"
  story: >
    Factory auditor reviews audit findings for FAC-0001 from most recent audit (AUD-900003, score C).
    Critical findings: working hours (FND-900006, in_progress), fire safety (FND-900007, reopened).
    Major finding: discrimination (FND-900008, open). Drafts corrective action plan with 30/60 day
    timelines. Creates formal CAP for each finding. Corrective actions created with due dates.
  checks:
    - tool: get_audit_findings_for_factory
      args: {factory_id: FAC-0001}
      expect: ["critical", "FND-900006", "FND-900007"]
    - tool: draft_corrective_action_plan
      args: {factory_id: FAC-0001}
      expect: ["suggested_due_date", "critical"]
    - tool: create_corrective_action_plan
      args: {finding_id: FND-900006, factory_id: FAC-0001, supplier_id: SUP-0001, description: "Implement overtime controls", assigned_to: EMP-00008, due_date: "+30d"}
      expect: ["CAP-", "open"]

- question: "05:43:Q5"
  story: >
    Factory auditor checks which factories have overdue critical findings across the business.
    FAC-0001 has CAP-900002, CAP-900003, CAP-900005 overdue (originally due 2026-10-01, 2026-09-07, 2026-10-15).
    FAC-0003 has CAP-900007, CAP-900008, CAP-900009 overdue (all due in June/July). Manager sends reminders
    and extends due dates where needed.
  checks:
    - tool: list_overdue_critical_findings
      args: {min_days_overdue: 0}
      expect: ["FAC-0001", "FAC-0003", "critical"]
    - tool: send_corrective_action_reminder
      args: {finding_id: FND-900006, factory_id: FAC-0001, supplier_id: SUP-0001, description: "REMINDER: Critical finding overdue", assigned_to: EMP-00008, due_date: "+7d"}
      expect: ["CAP-"]
    - tool: update_corrective_action_due_date
      args: {corrective_action_id: CAP-900002, due_date: "+60d"}
      expect: ["due_date"]

- question: "05:46:Q2"
  story: >
    Ethical trade manager reviews audit findings at a suspicious factory (FAC-0003). Finds critical
    findings for working hours (FND-900011), forced labor (FND-900012), child labor (FND-900013).
    All three are open and overdue. Plans remediation approach.
  checks:
    - tool: get_audit_findings_for_factory
      args: {factory_id: FAC-0003, severity: critical}
      expect: ["FND-900011", "FND-900012", "critical"]

- question: "05:46:Q3"
  story: >
    Ethical trade manager reviews FAC-0003 for remediation vs. exit decision. Audit findings show three
    critical issues (working hours, forced labor, child labor). Corrective actions were created but remain
    overdue. Creates updated CAP and blocks POs.
  checks:
    - tool: get_audit_findings_for_factory
      args: {factory_id: FAC-0003}
      expect: ["critical", "forced labor"]
    - tool: get_corrective_action_status
      args: {factory_id: FAC-0003}
      expect: ["overdue", "CAP-900007"]
    - tool: create_corrective_action_plan
      args: {finding_id: FND-900015, factory_id: FAC-0003, supplier_id: SUP-0002, description: "Complete remediation plan", assigned_to: EMP-00008, due_date: "+90d"}
      expect: ["CAP-"]

- question: "05:46:Q5"
  story: >
    Ethical trade manager analyzes audit findings at top 10 riskiest factories. FAC-0003 shows three
    critical findings (working hours, forced labor, child labor). FAC-0001 shows two critical findings
    (working hours, fire safety). Patterns indicate systemic compliance issues.
  checks:
    - tool: get_audit_findings_for_factory
      args: {factory_id: FAC-0003, severity: critical}
      expect: ["critical", "FAC-0003"]
    - tool: get_audit_findings_for_factory
      args: {factory_id: FAC-0001, severity: critical}
      expect: ["critical", "FAC-0001"]

- question: "06:51:Q2"
  story: >
    New product developer researches compliance records for three shortlisted factories. Searches audit
    results to find recent audits and compliance grades for each factory option.
  checks:
    - tool: search_factory_audit_results
      args: {factory_id: FAC-0001}
      expect: ["AUD-900003", "FAC-0001"]
    - tool: search_factory_audit_results
      args: {overall_score: C}
      expect: ["C"]
