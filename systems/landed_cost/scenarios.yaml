- question: "02:12:Q6"
  story: "Shanghai (CNSHA) to Northampton DC1 has six container routings: direct to Felixstowe, via Rotterdam, and via Valencia or Piraeus plus rail to the Daventry rail terminal, each as spot and as a 10+ container block-train contract. Spot rail costs a little more than Felixstowe but is more reliable (82 vs 72 percent on time) with a tighter p95; the block-train rate is cheapest but only applies from 40,000 units."
  checks:
    - tool: calculate_door_to_door_cost
      args: {origin_port: "CNSHA", dest_site_id: "DC1", fob_value_gbp: 400000, units: 10000}
      expect: ["Valencia", "Piraeus", "Felixstowe", "42.59", "42.84", "72", "82"]
    - tool: calculate_door_to_door_cost
      args: {origin_port: "CNSHA", dest_site_id: "DC1", fob_value_gbp: 1600000, units: 40000}
      expect: ["block-train", "true"]

