# Telematics scenarios - one entry per question that uses this system
# Question mappings from brief:
# 02:11:Q5 — Transport planner: Route plans say 94% utilisation but drivers keep running out of hours on M62 routes
# 09:88:Q6 — COO: Should we in-source or outsource transport? Fleet operating costs comparison

- question: "02:11:Q5"
  story: >
    The M62 routes (RTE-000002 East and RTE-000003 West) show persistent driver hours issues.
    From late September, drivers on these routes exceeded available hours on multiple runs (RUN-900001..900010),
    with RTE-000003 showing the worst pattern. Stop times (avg 260-330 minutes) exceed assumptions (40 and 35 minutes)
    by 200-300%, and unload times (110-145 minutes) are significantly longer than planned.
    Drivers EMP-00142 through EMP-00150 show multiple compliance breaches and violations.
  checks:
    - tool: get_driver_hours_compliance_by_route
      args: {route_id: RTE-000002}
      expect: ["RTE-000002", "M62-Route-East", "BREACH", "RUN-900001", "RUN-900004"]
    - tool: get_driver_hours_compliance_by_route
      args: {route_id: RTE-000003}
      expect: ["RTE-000003", "M62-Route-West", "BREACH", "RUN-900003", "RUN-900009"]
    - tool: get_actual_stop_durations_by_route
      args: {route_id: RTE-000002}
      expect: ["RTE-000002", "avg_stop_time_minutes", "240", "avg_unload_time_minutes"]
    - tool: get_actual_stop_durations_by_route
      args: {route_id: RTE-000003}
      expect: ["RTE-000003", "avg_stop_time_minutes", "avg_unload_time_minutes", "310"]

- question: "09:88:Q6"
  story: >
    Fleet operating costs analysis for make vs buy decision. Our active fleet includes mixed vehicle types:
    box vans (purchase cost £35k, HX26ABC, HX26DEF), older articulated units (DAF XF, £42k current value),
    newer refrigerated units (Mercedes, £45k current value), and various medium to large trucks.
    Annual running costs range from £2,350 (parcel van) to £7,900 (articulated), with depreciation factored in.
    Utilisation varies from 35,000 km annually (parcel) to 120,000 km (articulated).
    One vehicle (VEH-900005) is currently in maintenance, affecting availability.
  checks:
    - tool: get_fleet_operating_costs
      args: {status: active}
      expect: ["VEH-900001", "HX26ABC", "box_van", "cost_per_km_gbp", "depreciation"]
    - tool: get_fleet_operating_costs
      args: {status: active}
      expect: ["VEH-900003", "curtainside", "55000", "annual_total_running_cost_gbp"]
    - tool: get_fleet_operating_costs
      args: {status: active}
      expect: ["VEH-900006", "articulated", "age_years", "HX21PQR"]
    - tool: get_fleet_operating_costs
      args: {vehicle_type: box_van, status: active}
      expect: ["box_van", "HX26ABC", "HX26DEF", "Ford"]
