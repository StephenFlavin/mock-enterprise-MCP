- question: "02:11:Q5"
  story: >
    Planned stop time is 15 minutes per drop on the M62 Leeds DC (DC3) to Manchester routes RTE-900001..900008 (same ids as
    tms route plans). Actual dwell plus unloading is 22.5 min per drop on RTE-900006 and 21.6 on RTE-900003, with unloading
    about 60% of it and traffic only 31-35 min. Those two routes have breaches on every run (peaks 14.4h and 13.9h on duty
    against 11h available), RTE-900001 and 900005 are milder, RTE-900004 and 900007 are fine.
  checks:
    - tool: get_driver_hours_compliance_by_route
      args: {route_name: M62}
      expect: ["RTE-900003", "RTE-900006", "14.4", "13.9", "RTE-900001"]
    - tool: get_driver_hours_compliance_by_route
      args: {route_id: RTE-900003}
      expect: ["RTE-900003", "12.9", "3.4"]
    - tool: get_actual_stop_durations_by_route
      args: {route_name: M62}
      expect: ["RTE-900006", "22.5", "RTE-900003", "21.6", "35.3"]
    - tool: get_actual_stop_durations_by_route
      args: {route_id: RTE-900003}
      expect: ["RTE-900003", "168.5", "112.3"]

- question: "09:88:Q6"
  story: >
    In-house fleet of about 60 active vehicles across six types with ages up to about 9 years. Articulated units are the
    biggest cost (17 vehicles, about GBP 1.33m a year, 0.65 GBP/km, average age 5.6 years); vans are cheapest per km.
    Seeded VEH-900010 (9.5 years) is the oldest and costliest tractor unit.
  checks:
    - tool: get_fleet_operating_costs
      args: {status: active}
      expect: ["articulated", "1329820", "0.65", "5.6", "box_van"]
    - tool: get_fleet_operating_costs
      args: {group_by: vehicle, vehicle_type: articulated}
      expect: ["VEH-900010", "HX17BCD", "82690"]
