# One entry per question row that uses this system's tools (see: python -m mockmcp brief ats).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.
- question: "09:88:Q4"
  story: >
    The COO requests recruitment lead time data to understand how quickly we can hire for peak.
    Historical metrics show Warehouse Operative roles take 26 days via direct recruitment,
    4 days via agency, and 31 days via job board (MET-900001..003). New requisitions REQ-900001
    and REQ-900002 are opened for DC1 to hire 10 Warehouse Operatives and 15 Pickers.
  checks:
    - tool: get_recruitment_lead_times
      args: {role: "Warehouse Operative"}
      expect: ["Warehouse Operative", "26", "4", "31"]
    - tool: create_job_requisition
      args: {site_id: DC1, role: "Warehouse Operative", headcount_required: 10, salary_gbp: 24000}
      expect: ["REQ-", "open", "Warehouse Operative"]

- question: "09:89:Q1"
  story: >
    HR workforce planner needs to compare recruitment costs and lead times for peak hiring planning.
    They review that direct recruitment costs £1,150 per hire but takes 26 days (MET-900001),
    while agency costs £1,950 but only takes 4 days (MET-900002). For DC1 Picker role,
    direct recruitment averages £1,050 over 25 days (MET-900006) vs agency at £1,850 in 3 days (MET-900007).
    They open REQ-900003 for 8 Warehouse Operatives at DC3 to test the hiring process.
  checks:
    - tool: get_recruitment_lead_times
      args: {role: "Picker/Packer"}
      expect: ["Picker/Packer", "25", "3", "32"]
    - tool: get_recruitment_cost_per_hire
      args: {role: "Warehouse Operative"}
      expect: ["Warehouse Operative", "1150", "1950", "520"]
    - tool: create_job_requisition
      args: {site_id: DC3, role: "Warehouse Operative", headcount_required: 8, salary_gbp: 24000}
      expect: ["REQ-", "open", "DC3"]

- question: "09:89:Q4"
  story: >
    HR workforce planner decides to use agency labour for the first four weeks of peak season.
    They submit agency labour requests for DC1 night shift (20 positions, ALR-900001),
    DC1 late shift (15 positions, ALR-900002), and DC2 night shift (12 positions, ALR-900003)
    to cover the peak period starting in about eight days.
  checks:
    - tool: submit_agency_labour_request
      args: {site_id: DC1, shift: night, start_date: "+8d", end_date: "+54d", positions_requested: 20, role: "Warehouse Operative"}
      expect: ["ALR-", "submitted", "DC1", "night", "20"]
    - tool: submit_agency_labour_request
      args: {site_id: DC2, shift: night, start_date: "+3d", end_date: "+49d", positions_requested: 12, role: "Warehouse Operative"}
      expect: ["ALR-", "submitted", "DC2", "night"]

- question: "09:89:Q5"
  story: >
    HR workforce planner identifies recruitment as a people problem. They see that DC1 Warehouse Operative
    requisitions (REQ-900001) have 8 applicants but only 2 hired so far, with average time to hire
    around 13 days for successful candidates. The funnel shows a 25% conversion from application to hired.
    Similar bottleneck data exists for DC1 Picker role (REQ-900002) where 14 applicants yielded 1 hire.
    This is much worse than DC3 Warehouse (REQ-900003) which had faster conversions. They request
    weekly reporting on these metrics.
  checks:
    - tool: get_time_to_hire_by_site
      args: {site_id: DC1, role: "Warehouse Operative"}
      expect: ["DC1", "Warehouse Operative", "hired"]
    - tool: list_recruitment_funnel_bottlenecks
      args: {site_id: DC1, role: "Picker/Packer"}
      expect: ["Picker/Packer", "application", "screening", "interview", "hired"]
    - tool: list_recruitment_funnel_bottlenecks
      args: {site_id: DC3}
      expect: ["DC3", "interview"]
