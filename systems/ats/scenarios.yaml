# One entry per question row that uses this system's tools (see: python -m mockmcp brief ats).
- question: "09:88:Q4"
  story: >
    Current-quarter channel metrics (MET-9000xx) give Warehouse Operative lead times: direct 26 days to hire + 14
    onboarding = 40, job board 45, agency 6 total. The COO then raises a DC2 (Daventry, the site furthest below standard in lms and thinnest on wms capacity) requisition for the first tranche.
  checks:
    - tool: get_recruitment_lead_times
      args: {role: "Warehouse Operative"}
      expect: ["job_board", "45", "40", "agency"]
    - tool: create_job_requisition
      args: {site_id: DC2, role: "Warehouse Operative", headcount_required: 12, salary_gbp: 24000}
      expect: ["REQ-", "open", "DC2"]

- question: "09:89:Q1"
  story: >
    Warehouse Operative cost per hire: agency 1950 (4 days) against direct 1150.50 (26 days), job board 520.
    A DC6 (Corby 3PL overflow DC) requisition for the Corby shortfall follows.
  checks:
    - tool: get_recruitment_cost_per_hire
      args: {role: "Warehouse Operative"}
      expect: ["1950", "1150.5", "520"]
    - tool: get_recruitment_lead_times
      args: {role: "Picker/Packer"}
      expect: ["Picker/Packer", "39"]
    - tool: create_job_requisition
      args: {site_id: DC6, role: "Warehouse Operative", headcount_required: 10, salary_gbp: 24000}
      expect: ["REQ-", "open", "DC6"]

- question: "09:89:Q4"
  story: >
    The planner submits agency labour for DC2 (Daventry) night shift; the request is stored with status submitted.
  checks:
    - tool: submit_agency_labour_request
      args: {site_id: DC2, shift: night, start_date: "+14d", end_date: "+42d", positions_requested: 20, role: "Warehouse Operative"}
      expect: ["ALR-", "submitted", "DC2", "night", "20"]

- question: "09:89:Q5"
  story: >
    DC2 Daventry is the outlier: generated candidate histories give it about 38 days to hire against 18 to 24 elsewhere,
    because interviews average 18 days there (9 across all sites) and only about 38% of candidates pass interview.
  checks:
    - tool: get_time_to_hire_by_site
      args: {}
      expect: ["DC2", "Daventry DC", "37.8"]
    - tool: list_recruitment_funnel_bottlenecks
      args: {site_id: DC2}
      expect: ["interview", "18.4", "9.1"]
