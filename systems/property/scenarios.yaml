# One entry per question row that uses this system's tools (see: python -m mockmcp brief property).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.
- question: "05:48:Q2"
  story: >
    Energy consumption for DC1 shows a consistent 15% reduction from last year's period, indicating the
    Scope 2 emissions reduction is real, not a method change. The reduction is visible in weekly data.
  checks:
    - tool: get_energy_consumption_by_site
      args: {site_id: DC1, period_from: "-90d"}
      expect: ["DC1", "44200", "43800"]

- question: "05:49:Q3"
  story: >
    Store footfall and sales analysis shows that multiple stores have high footfall volumes making
    in-store take-back program viable. High-volume stores like ST001 demonstrate strong visitor traffic
    and sales per visitor patterns suitable for expanded initiatives.
  checks:
    - tool: get_store_footfall_and_sales_by_store
      args: {date_from: "-30d"}
      expect: ["ST001", "ST050", "total_sales_per_visitor"]

- question: "08:71:Q3"
  story: >
    Footfall forecast for ST001 for the coming week shows predicted peaks around lunch hours with
    1,150-1,280 visitors forecasted. Confidence levels around 86-87% allow safe staffing decisions
    with forecast patterns guiding hourly resource allocation.
  checks:
    - tool: get_footfall_forecast_for_store
      args: {site_id: ST001, forecast_date: "+7d"}
      expect: ["ST001", "1150", "confidence_level"]

- question: "08:71:Q4"
  story: >
    Historical footfall for ST001 shows baseline behaviour with peak hours at lunch (1,200-2,100 visitors)
    and evening ramp-down. Hour-by-hour patterns provide reference data to assess impact of local events
    and track performance against typical trading patterns.
  checks:
    - tool: get_footfall_history_for_store
      args: {site_id: ST001, date_from: "-30d"}
      expect: ["ST001", "2100", "footfall_count"]

- question: "08:73:Q5"
  story: >
    Store ST001 has a 3.2 km catchment radius serving 48,000 people with 16% overlap from competitor
    stores ST002 and ST003. This competitor analysis provides regional managers data to prioritize
    response strategies when competitors open or close nearby locations.
  checks:
    - tool: get_store_catchment_overlap
      args: {primary_store_id: ST001}
      expect: ["ST001", "3.2", "48000", "16"]
