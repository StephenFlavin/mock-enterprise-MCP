# One entry per question row that uses this system's tools (see: python -m mockmcp brief property).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.
- question: "05:48:Q2"
  story: >
    Energy consumption for DC1 shows a consistent 15% reduction from last year's period (Oct 2025 52,000 kWh
    vs Oct 2026 44,200 kWh), indicating the Scope 2 emissions reduction is real, not a method change.
    The reduction is consistent across multiple weeks.
  checks:
    - tool: get_energy_consumption_by_site
      args: {site_id: DC1, period_from: "-180d"}
      expect: ["DC1", "44200", "52000"]

- question: "05:49:Q3"
  story: >
    Store footfall and sales analysis shows ST214 with 11,700 total footfall on 2026-09-21 generating £140,400
    in sales, while ST001 had 7,650 footfall generating £91,800. ST214's higher footfall (34% more visitors)
    and strong sales per visitor (£12) indicate high participation potential for in-store take-back program.
  checks:
    - tool: get_store_footfall_and_sales_by_store
      args: {date_from: "2026-09-21", date_to: "2026-09-22"}
      expect: ["ST214", "11700", "ST001", "7650"]

- question: "08:71:Q3"
  story: >
    Footfall forecast for ST214 for next week (starting Monday 2026-10-12) shows peaks around lunch hours
    (12pm-1pm with 1,250-1,380 visitors forecasted). Tuesday's forecast (2026-10-13) shows slightly higher
    volumes (1,400-1,520 at peak), suggesting delivery day impact. With 85-89% confidence levels, the manager
    can safely plan 2-3 staff per hour baseline.
  checks:
    - tool: get_footfall_forecast_for_store
      args: {site_id: ST214, forecast_date: "2026-10-12"}
      expect: ["ST214", "2026-10-12", "1250"]

- question: "08:71:Q4"
  story: >
    Historical footfall for ST214 shows baseline behaviour (21 Sep: 11,700 daily footfall; 22 Sep: 14,920 daily
    footfall, 28% higher on Saturday). This provides reference pattern to compare against event impacts.
    The hour-by-hour breakdown (peak 1-2pm with 1,200-1,350 visitors) helps identify staffing gaps.
  checks:
    - tool: get_footfall_history_for_store
      args: {site_id: ST214, date_from: "2026-09-21"}
      expect: ["ST214", "2026-09-21", "1200", "14920"]

- question: "08:73:Q5"
  story: >
    Store ST214 has a 3.2 km catchment radius serving 48,000 people with 16% overlap from 2 competitor stores
    (ST215, ST216). Regional stores ST001 and ST002 show 20-24% overlap. This competitor analysis helps
    prioritize response to competitor openings/closures with highest impact on our trade.
  checks:
    - tool: get_store_catchment_overlap
      args: {primary_store_id: ST214}
      expect: ["ST214", "3.2", "48000", "16.0"]
