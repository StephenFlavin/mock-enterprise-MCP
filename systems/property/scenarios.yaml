# One entry per question row that uses this system's tools (see: python -m mockmcp brief property).
- question: "05:48:Q2"
  story: >
    Electricity use at the five DCs (DC1 Northampton to DC5 Columbus) is only about 1% lower than the prior 12 months
    (DC1 -1.1%, all DCs -1.2%), so the 15% fall in reported Scope 2 is not explained by real consumption; the esg
    system shows it comes from grid factor, method and boundary changes.
  checks:
    - tool: get_energy_consumption_by_site
      args: {site_type: dc}
      expect: ["Northampton DC", "ALL SITES", "-1.2", "-1.1"]
    - tool: get_energy_consumption_by_site
      args: {site_id: DC1}
      expect: ["DC1", "prior_year_kwh", "-1.1"]

- question: "05:49:Q3"
  story: >
    Daily footfall and sales for all 215 UK stores (country GB). Large retail parks lead: ST017 Guildford and ST001
    Swindon have the highest footfall, which makes them the first candidates for take-back volume.
  checks:
    - tool: get_store_footfall_and_sales_by_store
      args: {country: GB, date_from: "-30d"}
      expect: ["ALL STORES", "Total of 215 stores", "ST017", "ST001", "sales_per_visitor"]

- question: "08:71:Q3"
  story: >
    ST214 Glasgow Retail Park hourly forecast for the next three weeks: Saturday is the peak day (about 3,370 visitors,
    peak hour 14:00 with 414), weekdays about 1,700-1,900. Promotions (knitwear, bedding) lift the week and
    the access roadworks dampen it.
  checks:
    - tool: get_footfall_forecast_for_store
      args: {site_id: ST214, date_from: "+1d", date_to: "+14d"}
      expect: ["ST214", "Saturday", "414", "confidence_level"]

- question: "08:71:Q4"
  story: >
    ST214 daily footfall history shows the effect of past local events: the summer music festival Saturday was the
    busiest day (4,431 visitors vs about 3,450 on a normal Saturday) and the home football match Saturday the quietest
    (2,665) because of parking; June roadworks and the JD Sports opening 300 m away also dented trade.
  checks:
    - tool: get_footfall_history_for_store
      args: {site_id: ST214, date_from: "-100d"}
      expect: ["Saturday", "4431", "2665"]

- question: "08:73:Q5"
  story: >
    Scotland catchments: John Lewis overlaps 18% of ST214 Glasgow's catchment (0.45 km) and 14% of ST208 Edinburgh's,
    the largest overlaps in the region; JD Sports (new, 12% at ST214) and Argos follow. Currys at ST214 has closed.
  checks:
    - tool: get_store_catchment_overlap
      args: {region: Scotland}
      expect: ["John Lewis", "ST214", "ST208", "JD Sports", "overlap_percentage"]
