id: marketplace
name: Marketplace Seller Portal
instructions: >
  Multi-channel e-commerce marketplace listings, requirements, policies and fees.
  Listing ids look like LST-000123. Use for marketplace compliance, content requirements,
  policy changes, fee impact analysis and listing rejections.

tables:
  marketplace_listings:
    key: listing_id
    cols:
      listing_id: {type: str, desc: "Marketplace listing, e.g. LST-000123"}
      sku: {type: str, desc: "SKU being listed, e.g. K-1700"}
      marketplace_id: {type: str, desc: "Marketplace id, e.g. MKT-DE"}
      category_id: {type: str, desc: "Marketplace category id"}
      status: {type: enum, values: [active, draft, rejected, submitted, in_review, paused, delisted], desc: Listing status}
      title: {type: str, desc: Marketplace product title}
      description_length: {type: int, desc: Description character count}
      has_images: {type: bool, desc: "Has product images"}
      has_video: {type: bool, desc: "Has product video"}
      attributes_complete: {type: float, desc: "% of required attributes completed"}
      submitted_at: {type: timestamp, desc: First submission date}
      rejected_at: {type: timestamp, desc: Most recent rejection date}
      rejection_count: {type: int, desc: Total rejection count}
      updated_at: {type: timestamp, desc: Last updated}
      resubmission_note: {type: text, desc: "Note stored with the latest resubmission, e.g. what was corrected"}

  listing_rejections:
    key: rejection_id
    cols:
      rejection_id: {type: str, desc: "Rejection record, e.g. REJ-000123"}
      listing_id: {type: str, desc: "Listing that was rejected"}
      sku: {type: str, desc: "SKU"}
      reason_code: {type: str, desc: "Rejection code, e.g. MISSING_IMAGE, INCOMPLETE_TITLE"}
      reason_text: {type: str, desc: "Human-readable rejection reason"}
      field_name: {type: str, desc: "Field with the issue, if applicable"}
      rejected_at: {type: timestamp, desc: When rejection occurred}
      is_fixable_in_bulk: {type: bool, desc: "Can be fixed programmatically"}
      suggested_fix: {type: text, desc: "How to fix it, e.g. fill EAN from PIM"}

  marketplace_categories:
    key: category_id
    cols:
      category_id: {type: str, desc: "Marketplace category, e.g. MKTCAT-001"}
      marketplace_id: {type: str, desc: "Marketplace, e.g. MKT-DE"}
      parent_category_id: {type: str, desc: "Parent category, if nested"}
      name: {type: str, desc: "Category name"}
      local_name: {type: str, desc: "Category name in marketplace language"}
      pim_category_match: {type: str, desc: "Corresponding PIM category"}

  marketplace_policies:
    key: policy_id
    cols:
      policy_id: {type: str, desc: "Policy change, e.g. POL-000123"}
      marketplace_id: {type: str, desc: "Marketplace id"}
      policy_type: {type: enum, values: [commission_fee, returns, listing_requirements, seller_agreement, other], desc: Policy type}
      effective_date: {type: date, desc: "When policy takes effect"}
      description: {type: str, desc: "Policy change description"}
      impact_summary: {type: str, desc: "Business impact"}
      previous_policy: {type: str, desc: "What it replaces"}
      announced_at: {type: timestamp, desc: "When announced"}
      est_margin_impact_pct: {type: float, desc: "Estimated margin impact in percentage points, negative = worse"}

  marketplace_fee_schedule:
    key: fee_id
    cols:
      fee_id: {type: str, desc: "Fee schedule entry, e.g. FEE-000123"}
      marketplace_id: {type: str, desc: "Marketplace id"}
      effective_date: {type: date, desc: "Fee effective from"}
      category_id: {type: str, desc: "Marketplace category"}
      pim_category: {type: str, desc: "PIM category"}
      commission_pct: {type: float, desc: "Commission percentage"}
      fixed_fee_gbp: {type: float, desc: "Fixed per-listing fee in GBP"}
      fulfillment_fee_gbp: {type: float, desc: "Fulfillment fee per unit in GBP"}
      previous_commission_pct: {type: float, desc: "Previous commission %"}

  marketplace_listing_requirements:
    key: requirement_id
    cols:
      requirement_id: {type: str, desc: "Requirement, e.g. REQ-000123"}
      marketplace_id: {type: str, desc: "Marketplace id"}
      category_id: {type: str, desc: "Marketplace category"}
      attribute_name: {type: str, desc: "Required attribute, e.g. brand, weight"}
      is_mandatory: {type: bool, desc: "Is this attribute mandatory"}
      description: {type: str, desc: "Requirement description"}
      format_rules: {type: str, desc: "Format/validation rules"}
      examples: {type: str, desc: "Example values"}
      effective_date: {type: date, desc: "When the requirement applies from"}
      policy_id: {type: str, desc: "Policy change that introduced it, e.g. POL-900007"}

  marketplace_content_requirements:
    key: content_req_id
    cols:
      content_req_id: {type: str, desc: "Content requirement, e.g. CONT-000123"}
      marketplace_id: {type: str, desc: "Marketplace id"}
      category_id: {type: str, desc: "Category id"}
      content_type: {type: enum, values: [title, description, images, video, attributes, SEO], desc: Content type}
      requirement: {type: str, desc: "Content requirement"}
      min_length: {type: int, desc: "Minimum length"}
      max_length: {type: int, desc: "Maximum length"}
      mandatory: {type: bool, desc: "Is mandatory"}
      examples: {type: str, desc: "Example content"}

  pim_attributes:
    key: attribute_id
    cols:
      attribute_id: {type: str, desc: "PIM attribute, e.g. ATTR-000123"}
      attribute_name: {type: str, desc: "Attribute name"}
      pim_category: {type: str, desc: "PIM category"}
      data_type: {type: enum, values: [text, number, enum, date, image], desc: Data type}
      is_mandatory: {type: bool, desc: "Mandatory in PIM"}
      description: {type: str, desc: "Attribute description"}

tools:
  - name: list_rejected_listings
    desc: Rejected listings in the last N days grouped by error and field, with bulk-fixable counts and fixes. Filter by reason; view=listings gives one row per listing.
    kind: sql
    args:
      days_back: {type: int, desc: "Rejections in last N days", default: 7}
      marketplace_id: {}
      reason_code: {type: str, desc: "Only this rejection code, e.g. MISSING_IMAGE"}
      exclude_reason_code: {type: str, desc: "Leave out listings that also have this rejection code, e.g. MISSING_IMAGE"}
      bulk_fixable_only: {type: bool, default: false, desc: "True keeps only reasons that can be fixed in bulk"}
      view: {type: enum, values: [summary, listings], default: summary, desc: "summary groups by error; listings gives one row per listing"}
    sql: |
      WITH f AS (
        SELECT r.listing_id, r.sku, r.reason_code, r.reason_text, r.field_name, r.rejected_at, r.is_fixable_in_bulk,
               r.suggested_fix, l.marketplace_id
        FROM listing_rejections r JOIN marketplace_listings l ON l.listing_id = r.listing_id
        WHERE r.rejected_at >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
          AND ($marketplace_id IS NULL OR l.marketplace_id = $marketplace_id)
          AND ($reason_code IS NULL OR r.reason_code = $reason_code)
          AND (NOT $bulk_fixable_only OR r.is_fixable_in_bulk)
          AND ($exclude_reason_code IS NULL OR NOT EXISTS (
                SELECT 1 FROM listing_rejections x
                WHERE x.listing_id = r.listing_id AND x.reason_code = $exclude_reason_code
                  AND x.rejected_at >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY))
      )
      SELECT reason_code, reason_text, field_name, COUNT(DISTINCT listing_id) AS listing_count,
             COUNT(DISTINCT sku) AS sku_count,
             SUM(CASE WHEN is_fixable_in_bulk THEN 1 ELSE 0 END) AS fixable_in_bulk,
             any_value(suggested_fix) AS suggested_fix, MAX(rejected_at) AS latest_rejection,
             array_to_string((list(DISTINCT listing_id ORDER BY listing_id))[1:5], ', ') AS listing_ids,
             CAST(NULL AS VARCHAR) AS sku, CAST(NULL AS VARCHAR) AS marketplace_id
      FROM f WHERE $view = 'summary'
      GROUP BY reason_code, reason_text, field_name
      UNION ALL
      SELECT string_agg(reason_code, ', ' ORDER BY reason_code), string_agg(reason_text, '; ' ORDER BY reason_code),
             string_agg(field_name, ', ' ORDER BY reason_code), 1, 1,
             SUM(CASE WHEN is_fixable_in_bulk THEN 1 ELSE 0 END), string_agg(suggested_fix, '; ' ORDER BY reason_code),
             MAX(rejected_at), listing_id, any_value(sku), any_value(marketplace_id)
      FROM f WHERE $view = 'listings'
      GROUP BY listing_id
      ORDER BY listing_count DESC, reason_code, listing_ids
    limit: 100
    example: {}

  - name: get_rejection_reasons_by_listing
    desc: Every rejection reason for one listing with the field at fault, whether it can be fixed in bulk and how to fix it.
    kind: sql
    args:
      listing_id: {required: true}
    sql: |
      SELECT r.rejection_id, r.listing_id, r.sku, l.marketplace_id, l.status AS listing_status, r.reason_code, r.reason_text,
             r.field_name, r.rejected_at, r.is_fixable_in_bulk, r.suggested_fix
      FROM listing_rejections r JOIN marketplace_listings l ON l.listing_id = r.listing_id
      WHERE r.listing_id = $listing_id
      ORDER BY r.rejected_at DESC, r.reason_code
    limit: 20
    example: {listing_id: LST-900001}

  - name: submit_marketplace_listing_resubmission
    desc: Resubmit one corrected listing to the marketplace for approval, setting its status to submitted. Call once per listing id.
    kind: update
    table: marketplace_listings
    set: {status: submitted, updated_at: "$as_of"}
    args:
      resubmission_note: {desc: "What was corrected, stored with the resubmission"}
    example: {listing_id: LST-900003, resubmission_note: Title and description corrected from PIM}

  - name: search_marketplace_content_requirements
    desc: Content rules (title, description, images, video, attributes, SEO) by marketplace and category, with length limits and mandatory flags. Use to compare marketplaces.
    kind: sql
    args:
      marketplace_id: {}
      category_id: {}
      category_name: {type: str, desc: "Words in the marketplace category name, e.g. appliances"}
      content_type: {}
      mandatory: {}
    sql: |
      SELECT q.content_req_id, q.marketplace_id, q.category_id, c.name AS category_name, q.content_type, q.requirement,
             q.min_length, q.max_length, q.mandatory, q.examples
      FROM marketplace_content_requirements q JOIN marketplace_categories c ON c.category_id = q.category_id
      WHERE ($marketplace_id IS NULL OR q.marketplace_id = $marketplace_id)
        AND ($category_id IS NULL OR q.category_id = $category_id)
        AND ($category_name IS NULL OR LOWER(c.name) LIKE '%' || LOWER($category_name) || '%')
        AND ($content_type IS NULL OR q.content_type = $content_type)
        AND ($mandatory IS NULL OR q.mandatory = $mandatory)
      ORDER BY q.marketplace_id, q.category_id, q.content_type
    limit: 100
    example: {marketplace_id: MKT-DE, category_name: appliances}

  - name: compare_pim_attributes_to_marketplace_requirements
    desc: Each marketplace-required attribute with whether PIM holds it for the mapped PIM category, and the action needed. Shows gaps, mandatory first.
    kind: sql
    args:
      marketplace_id: {required: true}
      category_id: {}
      pim_category: {type: str, desc: "PIM category to compare, e.g. kitchen"}
    sql: |
      SELECT r.category_id, c.name AS category_name, r.attribute_name AS marketplace_required, r.is_mandatory, r.format_rules,
             CASE WHEN pa.attribute_id IS NOT NULL THEN 'YES' ELSE 'MISSING' END AS pim_has_attribute,
             pa.attribute_id AS pim_attribute_id,
             CASE WHEN pa.attribute_id IS NULL THEN 'Add attribute to PIM'
                  WHEN r.is_mandatory AND NOT pa.is_mandatory THEN 'Map to PIM attribute and make mandatory'
                  ELSE 'Map to PIM attribute' END AS action
      FROM marketplace_listing_requirements r
      JOIN marketplace_categories c ON c.category_id = r.category_id
      LEFT JOIN pim_attributes pa ON LOWER(pa.attribute_name) = LOWER(r.attribute_name) AND pa.pim_category = c.pim_category_match
      WHERE r.marketplace_id = $marketplace_id
        AND ($category_id IS NULL OR r.category_id = $category_id)
        AND ($pim_category IS NULL OR c.pim_category_match = $pim_category)
      ORDER BY r.is_mandatory DESC, (pa.attribute_id IS NULL) DESC, r.category_id, r.attribute_name
    limit: 100
    example: {marketplace_id: MKT-DE, category_id: MKTCAT-000002}

  - name: get_marketplace_policy_changes
    desc: Marketplace policy changes announced or taking effect in the last N days (fees, returns, listing rules) with estimated margin impact in points.
    kind: sql
    args:
      days_back: {type: int, desc: "Policy changes in last N days (90 = this quarter)", default: 90}
      marketplace_id: {}
      policy_type: {type: str, desc: "Filter by policy type, e.g. commission_fee, returns, listing_requirements"}
    sql: |
      SELECT policy_id, marketplace_id, policy_type, effective_date, description, impact_summary, previous_policy,
             est_margin_impact_pct, announced_at
      FROM marketplace_policies
      WHERE (announced_at >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
             OR effective_date >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY)
        AND ($marketplace_id IS NULL OR marketplace_id = $marketplace_id)
        AND ($policy_type IS NULL OR policy_type = $policy_type)
      ORDER BY announced_at DESC
    limit: 30
    example: {}

  - name: get_marketplace_fee_schedule
    desc: Current commission, fixed and fulfilment fees by marketplace category, with the previous commission and change. Use to calculate margin impact.
    kind: sql
    args:
      marketplace_id: {}
      category_id: {}
      pim_category: {type: str, desc: "PIM category, e.g. kitchen"}
      effective_date: {type: date, desc: "Fee schedule as of this date", default: "$as_of"}
    sql: |
      SELECT f.fee_id, f.marketplace_id, f.category_id, c.name AS category_name, f.pim_category, f.commission_pct,
             f.previous_commission_pct,
             ROUND(f.commission_pct - COALESCE(f.previous_commission_pct, f.commission_pct), 2) AS commission_change_pct,
             f.fixed_fee_gbp, f.fulfillment_fee_gbp, f.effective_date
      FROM marketplace_fee_schedule f JOIN marketplace_categories c ON c.category_id = f.category_id
      WHERE ($marketplace_id IS NULL OR f.marketplace_id = $marketplace_id)
        AND ($category_id IS NULL OR f.category_id = $category_id)
        AND ($pim_category IS NULL OR f.pim_category = $pim_category)
        AND f.effective_date <= CAST($effective_date AS DATE)
      QUALIFY row_number() OVER (PARTITION BY f.category_id ORDER BY f.effective_date DESC) = 1
      ORDER BY f.marketplace_id, f.category_id
    limit: 100
    example: {marketplace_id: MKT-DE}

  - name: get_marketplace_listing_requirements
    desc: Mandatory listing attributes by marketplace and category, with format rules and when each took effect. Use for the compliance checklist and new rules.
    kind: sql
    args:
      marketplace_id: {required: true}
      category_id: {}
      effective_from: {type: date, desc: "Only requirements effective on or after this date, to see what is new"}
    sql: |
      SELECT r.requirement_id, r.marketplace_id, r.category_id, c.name AS category_name, r.attribute_name, r.is_mandatory,
             r.description, r.format_rules, r.examples, r.effective_date, r.policy_id
      FROM marketplace_listing_requirements r JOIN marketplace_categories c ON c.category_id = r.category_id
      WHERE r.marketplace_id = $marketplace_id
        AND ($category_id IS NULL OR r.category_id = $category_id)
        AND ($effective_from IS NULL OR r.effective_date >= CAST($effective_from AS DATE))
        AND r.is_mandatory = true
      ORDER BY r.category_id, r.attribute_name
    limit: 100
    example: {marketplace_id: MKT-DE, category_id: MKTCAT-000002}

  - name: get_marketplace_category_tree
    desc: Marketplace category hierarchy with local names and the mapped PIM category. Use for category mapping and navigation; optional PIM category filter.
    kind: sql
    args:
      marketplace_id: {required: true}
      pim_category: {type: str, desc: "Only categories mapped to this PIM category, e.g. kitchen"}
    sql: |
      WITH RECURSIVE cat_tree AS (
        SELECT category_id, parent_category_id, name, local_name, pim_category_match, 0 AS level, name AS category_path
        FROM marketplace_categories
        WHERE marketplace_id = $marketplace_id AND parent_category_id IS NULL
        UNION ALL
        SELECT c.category_id, c.parent_category_id, c.name, c.local_name, c.pim_category_match, ct.level + 1,
               ct.category_path || ' > ' || c.name
        FROM marketplace_categories c JOIN cat_tree ct ON c.parent_category_id = ct.category_id
        WHERE c.marketplace_id = $marketplace_id
      )
      SELECT category_path, category_id, parent_category_id, local_name, pim_category_match, level
      FROM cat_tree
      WHERE ($pim_category IS NULL OR pim_category_match = $pim_category)
      ORDER BY category_path
    limit: 200
    example: {marketplace_id: MKT-DE}
