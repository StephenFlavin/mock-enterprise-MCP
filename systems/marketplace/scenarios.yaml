# One entry per question row that uses this system's tools (see: python -m mockmcp brief marketplace).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "06:59:Q1"
  story: >
    This week 340 marketplace listings were rejected across marketplaces. The rejections are primarily
    missing images (LST-900001, LST-900002, LST-900003, LST-900004, LST-900005) and incomplete titles
    (LST-900001, LST-900003, LST-900004) - all can be fixed in bulk.
    After review, corrected listings LST-900001 and LST-900002 are resubmitted.
  checks:
    - tool: list_rejected_listings
      args: {days_back: 7}
      expect: ["MISSING_IMAGE", "340", "INCOMPLETE_TITLE", "MISSING_DESCRIPTION", "INCOMPLETE_ATTRIBUTES"]
    - tool: get_rejection_reasons_by_listing
      args: {listing_id: LST-900001}
      expect: ["MISSING_IMAGE", "INCOMPLETE_TITLE", "LST-900001"]
    - tool: submit_marketplace_listing_resubmission
      args: {listing_id: LST-900001, notes: "Added images and completed title"}
      expect: ["submitted"]

- question: "06:59:Q2"
  story: >
    The German and French marketplaces have different content requirements for home appliances.
    German marketplace (MKT-DE) requires brand, weight, dimensions, colour, material, country_of_origin for kitchen category (MKTCAT-000001).
    French marketplace (MKT-FR) requires brand and weight for kitchen (MKTCAT-000007) but similar overall.
    PIM has attributes for brand, weight, dimensions, colour, material, country_of_origin.
    Gap analysis shows all PIM attributes map but no country_of_origin data in German listings currently.
  checks:
    - tool: search_marketplace_content_requirements
      args: {marketplace_id: MKT-DE, category_id: MKTCAT-000001}
      expect: ["MKT-DE", "MKTCAT-000001", "title", "description", "images"]
    - tool: search_marketplace_content_requirements
      args: {marketplace_id: MKT-FR, category_id: MKTCAT-000007}
      expect: ["MKT-FR", "MKTCAT-000007", "Cuisine"]
    - tool: compare_pim_attributes_to_marketplace_requirements
      args: {marketplace_id: MKT-DE, pim_category: kitchen}
      expect: ["brand", "weight", "dimensions", "country_of_origin"]

- question: "06:59:Q3"
  story: >
    The home category needs attribute structure alignment across PIM and marketplaces.
    PIM home category has 10 core attributes (brand, weight, dimensions, colour, material,
    country_of_origin, care_instructions, warranty, sku, ean).
    Marketplaces organize as: Home > Kitchen, Bedding, Electrics at multiple levels.
    German marketplace (MKT-DE) has a 3-level hierarchy for home starting with MKTCAT-000000.
  checks:
    - tool: get_marketplace_category_tree
      args: {marketplace_id: MKT-DE}
      expect: ["Home", "Kitchen", "Bedding", "MKTCAT-000001", "MKTCAT-000002"]
    - tool: search_marketplace_content_requirements
      args: {marketplace_id: MKT-DE, category_id: MKTCAT-000001}
      expect: ["brand", "weight", "dimensions"]

- question: "08:75:Q3"
  story: >
    Marketplace policies changed this quarter (Oct 2026). German marketplace (MKT-DE) increased
    commission from 10% to 12% on 2026-07-01 (POL-900001), extended returns from 30 to 60 days on 2026-08-01 (POL-900002),
    and added mandatory video content on 2026-09-01 (POL-900003).
    French marketplace (MKT-FR) increased commission to 11% on 2026-07-15 (POL-900004).
    Current fees: MKT-DE kitchen 12% commission, MKT-FR 11%, MKT-UK 10.5%.
  checks:
    - tool: get_marketplace_policy_changes
      args: {days_back: 90}
      expect: ["commission_fee", "returns", "listing_requirements", "12%", "60 days"]
    - tool: get_marketplace_policy_changes
      args: {marketplace_id: MKT-DE}
      expect: ["MKT-DE", "POL-900001", "POL-900002", "POL-900003"]
    - tool: get_marketplace_fee_schedule
      args: {marketplace_id: MKT-DE}
      expect: ["12.00", "kitchen", "MKT-DE", "10.00"]
    - tool: get_marketplace_listing_requirements
      args: {marketplace_id: MKT-DE, category_id: MKTCAT-000001}
      expect: ["brand", "weight", "dimensions", "mandatory"]
