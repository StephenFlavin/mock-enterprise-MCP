# One entry per question row that uses this system's tools (see: python -m mockmcp brief marketplace).

- question: "06:59:Q1"
  story: >
    340 listings were rejected this week (LST-900001..5 plus generated ones). Missing images (83 listings) is the top error,
    then incomplete title (67) and missing EAN (57); title, description and PIM-held attributes are fixable in bulk, images are not.
    LST-900003 has only title and description faults, so after correction it is resubmitted.
  checks:
    - tool: list_rejected_listings
      args: {days_back: 11}
      expect: ["MISSING_IMAGE", "INCOMPLETE_TITLE", "ean", "Missing product images", "83"]
    - tool: list_rejected_listings
      args: {exclude_reason_code: MISSING_IMAGE, bulk_fixable_only: true}
      expect: ["INCOMPLETE_TITLE", "MISSING_DESCRIPTION", "country_of_origin"]
    - tool: get_rejection_reasons_by_listing
      args: {listing_id: LST-900003}
      expect: ["INCOMPLETE_TITLE", "MISSING_DESCRIPTION", "true"]
    - tool: submit_marketplace_listing_resubmission
      args: {listing_id: LST-900003, resubmission_note: Title and description corrected}
      expect: ["submitted"]

- question: "06:59:Q2"
  story: >
    Small Kitchen Appliances is the home-appliance category: MKT-DE (MKTCAT-000002) is strictest (7+ images, mandatory video,
    12 mandatory attributes incl. energy label and WEEE number); MKT-FR (MKTCAT-000015) needs 9 incl. repairability index;
    MKT-UK (MKTCAT-000028) 8 after POL-900007. PIM lacks energy_label, weee_registration_number, voltage_wattage, instructions_language.
  checks:
    - tool: search_marketplace_content_requirements
      args: {marketplace_id: MKT-DE, category_name: appliances}
      expect: ["MKT-DE", "MKTCAT-000002", "video", "At least 7 images"]
    - tool: search_marketplace_content_requirements
      args: {marketplace_id: MKT-FR, category_name: appliances}
      expect: ["MKT-FR", "MKTCAT-000015", "repairability index"]
    - tool: compare_pim_attributes_to_marketplace_requirements
      args: {marketplace_id: MKT-DE, category_id: MKTCAT-000002}
      expect: ["energy_label", "weee_registration_number", "MISSING", "brand"]

- question: "06:59:Q3"
  story: >
    Each marketplace has a Home & Living root with Kitchen & Dining (cookware, drinkware, small appliances), Bedding & Bath,
    Electrics and Storage children, each mapped to a PIM category (home, kitchen, bedding, electrics).
  checks:
    - tool: get_marketplace_category_tree
      args: {marketplace_id: MKT-DE}
      expect: ["Home & Living", "Kitchen & Dining", "Small Kitchen Appliances", "Electrics", "MKTCAT-000002"]
    - tool: search_marketplace_content_requirements
      args: {marketplace_id: MKT-DE, category_name: appliances}
      expect: ["MKT-DE", "title", "description", "images"]

- question: "08:75:Q3"
  story: >
    This quarter MKT-DE raised commission 10% to 12% (POL-900001, -2.0 pts), doubled the return window to 60 days (POL-900002, -1.4 pts)
    and made video mandatory for home appliances (POL-900003, -0.3). MKT-FR raised commission 9% to 11% (POL-900004). Fee schedule shows
    the new 12% rates; commission is the biggest hit.
  checks:
    - tool: get_marketplace_policy_changes
      args: {days_back: 90}
      expect: ["commission_fee", "returns", "listing_requirements", "POL-900001", "POL-900004", "est_margin_impact_pct"]
    - tool: get_marketplace_policy_changes
      args: {marketplace_id: MKT-DE}
      expect: ["POL-900002", "POL-900003", "60 days"]
    - tool: get_marketplace_fee_schedule
      args: {marketplace_id: MKT-DE}
      expect: ["12", "Small Kitchen Appliances", "commission_change_pct"]
    - tool: get_marketplace_listing_requirements
      args: {marketplace_id: MKT-UK, effective_from: -30d}
      expect: ["POL-900007", "ukca_marking"]
