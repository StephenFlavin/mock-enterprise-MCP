# One entry per question row that uses inv_opt's tools (see: python -m mockmcp brief inv_opt).

- question: "03:22:Q3"
  story: >
    Review reorder points and safety stock for fastest sellers in Blouses category.
    SKU-100007 and SKU-100014 are top sellers (7800 and 7500 units/year) with 95% SL targets.
    SKU-100021 has high variability (CV=0.55) and needs review. Current safety stock may be too low
    for demand volatility. Working capital impact of 10% increase shown.
  checks:
    - tool: get_inventory_policy_parameters
      args: {abc_class: A}
      expect: ["SKU-100007", "SKU-100049"]
    - tool: calculate_safety_stock
      args: {sku: SKU-100007, target_service_level_pct: 97}
      expect: ["SKU-100007", "recommended_safety_stock"]
    - tool: list_high_variability_skus
      args: {category: Blouses}
      expect: ["Blouses", "demand_cv"]
    - tool: compare_policy_to_recommended_parameters
      args: {category: Blouses, variance_threshold_pct: 0}
      expect: ["SKU-100007", "variance_pct"]
    - tool: calculate_working_capital_impact
      args: {category: Blouses, safety_stock_change_pct: 10}
      expect: ["Blouses", "wc_change_gbp"]

- question: "03:27:Q6"
  story: >
    Compare service level vs inventory holding for A items (top 10%) vs C items (long tail).
    A items target 97% SL with higher inventory cost. The service level vs inventory curve shows
    the cost of incremental service improvements. Segments SEG-001, SEG-002, SEG-003 have
    different targets: 97%, 95%, 90% respectively.
  checks:
    - tool: get_sku_abc_classification
      args: {limit_count: 10}
      expect: ["abc_class", "annual_volume_units"]
    - tool: get_service_level_vs_inventory_curve
      args: {category: Blouses}
      expect: ["service_level_pct", "inventory_cost_gbp"]
    - tool: calculate_service_level_target_options
      args: {sku_abc_class: A}
      expect: ["abc_class", "inventory_value_gbp"]
    - tool: calculate_service_level_impact
      args: {category: Blouses, target_service_level_pct: 92}
      expect: ["estimated_lost_units", "lost_revenue_gbp"]

- question: "03:28:Q1"
  story: >
    Calculate safety stock for 500 highest-value SKUs at 97% service level using demand and
    lead-time variability from last 2 years. SKU-100007 and SKU-100049 are high-value A items with 97% targets.
    SKU-100021 and SKU-100028 are high-variability items (CV>0.65) flagged for exclusion.
    Working capital change shown by category. 97% setting applied only to A items.
  checks:
    - tool: calculate_safety_stock
      args: {sku: SKU-100049, target_service_level_pct: 97}
      expect: ["SKU-100049", "recommended_safety_stock"]
    - tool: calculate_safety_stock
      args: {sku: SKU-100056, target_service_level_pct: 95}
      expect: ["SKU-100056", "recommended_safety_stock"]
    - tool: list_high_variability_skus
      args: {}
      expect: ["high_variability", "demand_cv"]
    - tool: compare_policy_to_recommended_parameters
      args: {abc_class: A, variance_threshold_pct: 0}
      expect: ["abc_class", "variance_pct"]
    - tool: calculate_working_capital_impact
      args: {safety_stock_change_pct: 5}
      expect: ["current_value_gbp", "wc_change_gbp"]

- question: "03:28:Q3"
  story: >
    What if lead times from Asia increase by 2 weeks? Categories with Asian sourcing are most sensitive.
    Lead time sensitivity shows which categories need extra safety stock.
    Recommendation is to hold more stock or accept lower availability. Working capital cost
    calculated for extended lead time scenario.
  checks:
    - tool: calculate_lead_time_sensitivity_by_category
      args: {lead_time_increase_days: 14}
      expect: ["avg_lead_time_days", "additional_wc_gbp"]
    - tool: calculate_safety_stock
      args: {sku: SKU-100007, target_service_level_pct: 97}
      expect: ["SKU-100007", "recommended_safety_stock"]
    - tool: calculate_working_capital_impact
      args: {safety_stock_change_pct: 15}
      expect: ["wc_change_gbp", "new_value_gbp"]
    - tool: compare_hold_stock_vs_accept_stockouts
      args: {current_service_level_pct: 95, proposed_service_level_pct: 90}
      expect: ["current_annual_holding_cost_gbp", "lost_sales_gbp"]

- question: "03:28:Q4"
  story: >
    Long-tail items like SKU-100028 (5100 units/year) and SKU-100238 (4200 units/year) have
    high demand variability (CV=0.65, CV=0.72) and low volumes per store. Centralisation analysis
    shows working capital saving from consolidating to DC instead of every store. Make-to-order
    consideration for candidates with low inventory turns and high holding costs.
  checks:
    - tool: get_demand_pattern_for_sku
      args: {sku: SKU-100028}
      expect: ["SKU-100028", "demand_cv"]
    - tool: get_demand_pattern_for_sku
      args: {sku: SKU-100238}
      expect: ["SKU-100238", "seasonality_factor"]
    - tool: calculate_centralised_stock_saving
      args: {annual_volume_units: 5000}
      expect: ["total_saving_gbp", "working_capital_saving_gbp"]
    - tool: calculate_service_level_impact
      args: {category: Bodycare, target_service_level_pct: 85}
      expect: ["estimated_lost_units", "lost_revenue_gbp"]
    - tool: update_service_level_target_for_segment
      args: {segment_id: SEG-003, target_service_level_pct: 88}
      expect: ["SEG-003"]
