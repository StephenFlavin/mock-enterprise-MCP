# Scenarios for stage 1 tools

- question: "08:71:Q1"
  story: >
    Store 214 shrink has been high. Stock adjustments show INV-ADJ-900001-003 with shrink or picking error causes.
    Shrink analysis shows Dresses at elevated rates. Compare with peer stores.
  checks:
    - tool: get_stock_adjustments_for_store
      args: {site_id: ST214, date_from: "-90d"}
      expect: ["INV-ADJ-900001", "K-1700"]
    - tool: get_shrink_by_category_for_store
      args: {site_id: ST214, date_from: "-30d"}
      expect: ["Dresses"]
    - tool: compare_shrink_with_peer_stores
      args: {site_id: ST214}
      expect: ["ST214"]

- question: "08:71:Q2"
  story: >
    Store 214 has gaps on shelf for K-1700 with lost sales. Goods receipt discrepancies show adjustments.
  checks:
    - tool: get_stock_on_hand_by_product_and_location
      args: {sku: K-1700, site_id: ST214}
      expect: ["K-1700", "ST214"]
    - tool: calculate_lost_sales_from_availability_gaps
      args: {sku: K-1700, site_id: ST214, date_from: "-30d"}
      expect: ["K-1700"]
    - tool: get_goods_receipt_discrepancies_for_store
      args: {site_id: ST214, date_from: "-30d"}
      expect: ["ST214"]

- question: "08:71:Q5"
  story: >
    Store 214 shrink rate shows high values. Availability at ST214 shows in-stock data.
  checks:
    - tool: get_shrink_rate_by_store
      args: {date_from: "-30d"}
      expect: ["ST214"]
    - tool: get_availability_by_store
      args: {site_id: ST214, date_from: "-30d"}
      expect: ["ST214"]

- question: "08:73:Q1"
  story: >
    Store 214 shows availability trends over time and stock position data for key categories.
  checks:
    - tool: get_availability_trend_for_store
      args: {site_id: ST214, date_from: "-90d"}
      expect: ["ST214"]
    - tool: get_stock_position_for_store
      args: {site_id: ST214}
      expect: ["ST214"]

- question: "08:73:Q2"
  story: >
    Regional analysis shows ST214 with availability and shrink metrics across the network.
  checks:
    - tool: get_availability_by_store
      args: {site_id: ST214}
      expect: ["ST214"]
    - tool: get_shrink_rate_by_store
      args: {date_from: "-30d"}
      expect: ["ST214"]

- question: "08:73:Q3"
  story: >
    Stock imbalance analysis identifies overstocked and understocked stores. STR-900001 to STR-900005 show transfers.
  checks:
    - tool: get_stock_imbalance_by_store
      args: {}
      expect: ["ST"]
    - tool: create_store_transfer_request
      args: {sku: SKU-100007, from_site_id: ST215, to_site_id: ST214, quantity: 20}
      expect: ["STR-"]

- question: "08:74:Q1"
  story: >
    Top products availability shows rates across the network for key SKUs.
  checks:
    - tool: get_availability_rate_for_top_products
      args: {limit_products: 20}
      expect: ["availability_rate"]

- question: "08:74:Q6"
  story: >
    K-1700 stock allocation between channels. RESV-900001 for click-collect created. RESV-900004 released.
  checks:
    - tool: create_stock_reservation_for_channel
      args: {sku: K-1700, site_id: DC1, channel: click_collect, quantity: 20}
      expect: ["RESV-"]
    - tool: cancel_stock_reservation_for_channel
      args: {reservation_id: RESV-900004}
      expect: ["RESV-900004"]

- question: "08:79:Q3"
  story: >
    Shrink analysis shows ST214 with elevated rates. CC-900002 and CC-900003 cycle counts scheduled for ST214.
  checks:
    - tool: get_shrink_year_to_date_by_store
      args: {date_from: "-270d"}
      expect: ["ST214"]
    - tool: get_shrink_by_category
      args: {}
      expect: ["shrink"]
    - tool: create_cycle_count_task
      args: {site_id: ST214, category: Dresses, scheduled_date: "+7d", reason: "High shrink anomaly"}
      expect: ["CC-"]

- question: "08:79:Q6"
  story: >
    Loss analysis shows LOSS-900001 K-1700 damage at ST214, LOSS-900002 PF-220 theft, LOSS-900004 SKU-100014 damage.
  checks:
    - tool: get_highest_loss_products
      args: {limit_products: 20, date_from: "-90d"}
      expect: ["loss_value"]
    - tool: compare_product_loss_year_on_year
      args: {sku: K-1700}
      expect: ["K-1700"]

- question: "08:80:Q2"
  story: >
    Franchise stock position for PTN-001 shows K-1700 and PF-220 availability across partner locations.
  checks:
    - tool: get_franchise_stock_position
      args: {partner_id: PTN-001}
      expect: ["on_hand"]

- question: "09:81:Q2"
  story: >
    Stock position by site shows inventory at DC1 with INV-ADJ-900004 and 900009 adjustments recorded.
  checks:
    - tool: get_stock_position_by_site
      args: {site_id: DC1}
      expect: ["DC1"]
    - tool: list_inventory_adjustments_and_cutoffs
      args: {site_id: DC1, date_from: "-30d"}
      expect: ["adjustment"]

- question: "04:35:Q4"
  story: >
    Supplier disruption risk assessment for packaging supplier. Inventory cover by item shows which SKUs
    from the supplier have sufficient cover to weather a six-week failure.
  checks:
    - tool: get_inventory_cover_by_item
      args: {sku: K-1700}
      expect: ["K-1700", "weeks_of_cover"]
