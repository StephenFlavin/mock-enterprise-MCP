# Scenarios for stage 1 tools

- question: "08:71:Q1"
  story: >
    Store 214 shrink has been high. Stock adjustments from the last 12 weeks show 5 units of K-1700
    (INV-ADJ-900001), 3 units of SKU-100007 (INV-ADJ-900002), and 2 units of PF-220 (INV-ADJ-900003)
    all with shrink or picking error causes. Shrink analysis shows Dresses at 1.5%
    (300 GBP) and Bedding at 1.0% (210 GBP). Compare with peer stores ST215 and ST216 which show lower rates.
  checks:
    - tool: get_stock_adjustments_for_store
      args: {site_id: ST214, date_from: "-90d"}
      expect: ["INV-ADJ-900001", "INV-ADJ-900002", "K-1700", "shrink"]
    - tool: get_shrink_by_category_for_store
      args: {site_id: ST214, date_from: "-30d"}
      expect: ["Dresses", "1.5", "300", "Bedding"]
    - tool: compare_shrink_with_peer_stores
      args: {site_id: ST214}
      expect: ["Dresses", "ST214"]

- question: "08:71:Q2"
  story: >
    Store 214 has gaps on shelf for K-1700 and SKU-100014 even though stock shows available.
    K-1700 showed low available in recent weeks with lost sales. SKU-100014 was out of stock with lost sales.
    Goods receipt discrepancies for ST214 from the last 30 days show receiving_variance and receiving_error adjustments.
  checks:
    - tool: get_stock_on_hand_by_product_and_location
      args: {sku: K-1700, site_id: ST214}
      expect: ["K-1700", "ST214", "15"]
    - tool: get_stock_adjustments_for_product
      args: {sku: K-1700, date_from: "-90d"}
      expect: ["INV-ADJ-900001", "K-1700"]
    - tool: calculate_lost_sales_from_availability_gaps
      args: {sku: K-1700, site_id: ST214, date_from: "-30d"}
      expect: ["K-1700", "ST214", "lost_sales"]
    - tool: get_goods_receipt_discrepancies_for_store
      args: {site_id: ST214, date_from: "-30d"}
      expect: ["receiving", "ST214"]

- question: "08:71:Q5"
  story: >
    Store 214 shrink rate for 2026-10-07 is 1.5% (300 GBP) for Dresses, while peer stores ST215 and ST216
    show 0.7% and 0.9% respectively. Availability at ST214 shows in-stock rate below peers.
  checks:
    - tool: get_shrink_rate_by_store
      args: {date_from: "-30d"}
      expect: ["ST214", "ST215", "shrink"]
    - tool: get_availability_by_store
      args: {site_id: ST214, date_from: "-30d"}
      expect: ["ST214", "K-1700"]

- question: "08:73:Q1"
  story: >
    Store 214 is below target. Availability trend shows variability with 70% in-stock rate over 30 days.
    Stock position shows low inventory for key categories with Bedding at only 45 units and low availability.
  checks:
    - tool: get_availability_trend_for_store
      args: {site_id: ST214, date_from: "-90d"}
      expect: ["ST214", "availability_rate"]
    - tool: get_stock_position_for_store
      args: {site_id: ST214}
      expect: ["ST214", "Bedding", "value_at_cost"]

- question: "08:73:Q2"
  story: >
    Regional analysis shows ST214 with low availability at 65% in-stock rate and high shrink of 1.2% average
    across categories in the month of October, both below network targets.
  checks:
    - tool: get_availability_by_store
      args: {site_id: ST214}
      expect: ["ST214"]
    - tool: get_shrink_rate_by_store
      args: {date_from: "-30d"}
      expect: ["ST214", "shrink_rate"]

- question: "08:73:Q3"
  story: >
    Stock imbalance analysis shows ST214 is overstocked on SKU-100007 with 45 units and understocked on
    K-1700 with only 15 units. ST215 has better balance. Rebalancing would move 20 units of SKU-100007
    from ST215 to ST214.
  checks:
    - tool: get_stock_imbalance_by_store
      args: {}
      expect: ["ST214", "overstocked"]
    - tool: create_store_transfer_request
      args: {sku: SKU-100007, from_site_id: ST215, to_site_id: ST214, quantity: 20}
      expect: ["STR-"]

- question: "08:74:Q1"
  story: >
    Top products availability shows K-1700 at 60% availability, SKU-100014 at 50%, and PF-220 at 75%
    across the store network. K-1700 and SKU-100014 are underperforming.
  checks:
    - tool: get_availability_rate_for_top_products
      args: {category: Home, limit_products: 20, date_from: "-30d"}
      expect: ["availability_rate"]

- question: "08:74:Q6"
  story: >
    K-1700 has 15 units available at DC1 for online channel. Reserve 10 units for click-and-collect
    (RESV-900001 created on 2026-10-01). Then release 5 units after day three if not sold.
  checks:
    - tool: create_stock_reservation_for_channel
      args: {sku: K-1700, site_id: DC1, channel: click_collect, quantity: 20}
      expect: ["RESV-"]
    - tool: cancel_stock_reservation_for_channel
      args: {reservation_id: RESV-900004}
      expect: ["released"]

- question: "08:79:Q3"
  story: >
    Shrink year to date by store shows ST214 at 8.2% annual rate (calculated from weekly 1.2% average),
    while network average is 0.8%. Main categories are Dresses at 300 GBP and Bedding at 210 GBP.
    Schedule a cycle count for Dresses at ST214 for next week.
  checks:
    - tool: get_shrink_year_to_date_by_store
      args: {date_from: "-270d"}
      expect: ["ST214", "shrink"]
    - tool: get_shrink_by_category
      args: {}
      expect: ["Dresses", "damage"]
    - tool: create_cycle_count_task
      args: {site_id: ST214, category: Dresses, scheduled_date: "+7d", reason: "High shrink anomaly"}
      expect: ["CC-"]

- question: "08:79:Q6"
  story: >
    Highest loss products analysis shows K-1700 with 5 units of damage loss (25.50 GBP) at ST214
    and 2 units of shrink loss (10.20 GBP) at ST215. SKU-100014 shows 8 units damage (150 GBP).
    Compare with prior year to show trend. Cause breakdown shows damage vs theft.
  checks:
    - tool: get_highest_loss_products
      args: {limit_products: 20, date_from: "-90d"}
      expect: ["K-1700", "loss_value", "loss_units"]
    - tool: get_product_loss_by_cause
      args: {}
      expect: ["damage", "theft"]
    - tool: compare_product_loss_year_on_year
      args: {sku: K-1700}
      expect: ["K-1700", "yoy"]

- question: "08:80:Q2"
  story: >
    Franchise stock position for partner PTN-001 shows core lines (K-1700, PF-220) out of stock or low
    while overstocked on others (SKU-100014). Inventory positions show disparities requiring rebalancing.
  checks:
    - tool: get_franchise_stock_position
      args: {partner_id: PTN-001}
      expect: ["franchise"]

- question: "09:81:Q2"
  story: >
    Stock position by site shows DC1 with 150 units K-1700 (120 available) and 300 units SKU-100007
    (220 available). Adjustments and cutoffs from the last 30 days total 18 units of adjustments across
    multiple cause codes.
  checks:
    - tool: get_stock_position_by_site
      args: {site_id: DC1}
      expect: ["DC1", "stock"]
    - tool: list_inventory_adjustments_and_cutoffs
      args: {site_from: "-30d"}
      expect: ["adjustment", "posted"]

- question: "04:35:Q4"
  story: >
    Supplier disruption risk assessment for largest packaging supplier (SUP-0001). K-1700 has 480 units
    at DC1 with 4.5 weeks of cover, while PF-220 shows 3.2 weeks at DC1 and lower cover at stores.
    A six-week supplier failure would impact availability across the network. Inventory cover by item
    shows which SKUs from this supplier have sufficient cover to weather the disruption.
  checks:
    - tool: get_inventory_cover_by_item
      args: {sku: K-1700}
      expect: ["K-1700", "weeks_of_cover", "480"]
    - tool: get_inventory_cover_by_item
      args: {sku: PF-220, site_id: DC1}
      expect: ["PF-220", "DC1", "weeks_of_cover"]
