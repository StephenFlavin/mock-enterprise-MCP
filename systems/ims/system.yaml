  - name: get_stock_on_hand_by_product_and_location
    desc: Retrieves stock on hand by product and location. Shows precise inventory levels.
    kind: select
    from: inventory_positions
    filters:
      sku: {required: true}
      site_id: {}
      location_id: {}
    columns: [sku, site_id, location_id, on_hand, allocated, available, hold_qty, updated_at]
