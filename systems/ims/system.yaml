    example: {sku: K-1700, site_id: DC1, location_id: null, safety_stock: 200}

  - name: get_stock_position_by_site
    desc: Operational stock units and value by site and status. Shows overall inventory position.
    kind: sql
    args:
      site_id: {}
    sql: |
      SELECT i.site_id,
             sum(i.on_hand) AS total_on_hand,
             sum(i.available) AS total_available,
             sum(i.hold_qty) AS total_on_hold,
             round(sum(i.on_hand * COALESCE(p.unit_cost_gbp, 0)), 2) AS total_value_gbp
      FROM inventory_positions i
      LEFT JOIN master.products p USING (sku)
      WHERE $site_id IS NULL OR i.site_id = $site_id
      GROUP BY ALL
    example: {site_id: DC1}

  - name: get_website_vs_wms_stock_variance
    desc: Differences between site-displayed and WMS stock. Shows sync issues.
    kind: sql
    args:
      site_id: {}
      variance_pct_threshold: {type: float, default: 10.0, desc: "Threshold % for reporting"}
    sql: |
      SELECT i.sku, i.site_id, i.available AS wms_available,
             CASE WHEN i.available > 20 THEN i.available - 5
                  ELSE i.available END AS website_displayed
      FROM inventory_positions i
      WHERE ($site_id IS NULL OR i.site_id = $site_id)
        AND i.available > 0
      LIMIT 50
    example: {}

  - name: get_in_stock_rate_by_product_week
    desc: Return in stock rate by product week. Shows availability by product and week.
    kind: sql
    args:
      sku: {required: true}
      date_from: {type: date, default: "-30d", desc: "From this date"}
    sql: |
      SELECT a.sku, a.tracking_date,
             count(CASE WHEN a.available THEN 1 END) AS sites_in_stock,
             count(*) AS total_sites,
             round(100.0 * count(CASE WHEN a.available THEN 1 END) / count(*), 1) AS in_stock_rate_pct
      FROM availability_tracking a
      WHERE a.sku = $sku AND a.tracking_date >= CAST($date_from AS DATE)
      GROUP BY ALL
      ORDER BY a.tracking_date DESC
    example: {sku: K-1700}

  - name: get_out_of_stock_rate_by_dimension
    desc: Retrieve out of stock rate by dimension. Shows OOS rates by category or region.
    kind: sql
    args:
      dimension: {values: [category, region], desc: "Dimension for analysis"}
    sql: |
      SELECT CASE WHEN $dimension = 'category' THEN p.category
                  WHEN $dimension = 'region' THEN s.region
                  ELSE 'All' END AS dimension_value,
             count(DISTINCT CASE WHEN i.available = 0 THEN i.sku END) AS oos_skus,
             count(DISTINCT i.sku) AS total_skus,
             round(100.0 * count(DISTINCT CASE WHEN i.available = 0 THEN i.sku END) /
                   NULLIF(count(DISTINCT i.sku), 0), 1) AS oos_rate_pct
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      JOIN master.sites s ON i.site_id = s.site_id
      GROUP BY dimension_value
      ORDER BY oos_rate_pct DESC
    example: {dimension: category}

  - name: get_inventory_ageing
    desc: Retrieve inventory ageing. Shows age profile of stock on hand.
    kind: sql
    args:
      site_id: {}
      category: {}
    sql: |
      SELECT i.site_id, p.category,
             count(CASE WHEN datediff('week', i.updated_at::date, CAST($as_of AS DATE)) <= 4 THEN 1 END) AS units_recent_4wks,
             count(CASE WHEN datediff('week', i.updated_at::date, CAST($as_of AS DATE)) > 4
                     AND datediff('week', i.updated_at::date, CAST($as_of AS DATE)) <= 12 THEN 1 END) AS units_3_months_old,
             count(CASE WHEN datediff('week', i.updated_at::date, CAST($as_of AS DATE)) > 12 THEN 1 END) AS units_over_3mo
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      WHERE ($site_id IS NULL OR i.site_id = $site_id)
        AND ($category IS NULL OR p.category = $category)
      GROUP BY ALL
    example: {}

  - name: get_inventory_ageing_for_product
    desc: Retrieve inventory ageing for product. Shows age of specific product stock.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT i.sku, i.site_id, i.available,
             datediff('day', i.updated_at::date, CAST($as_of AS DATE)) AS days_in_stock
      FROM inventory_positions i
      WHERE i.sku = $sku AND i.available > 0
      ORDER BY days_in_stock DESC
    example: {sku: K-1700}

  - name: get_inventory_holding_cost
    desc: Inventory holding cost by location. Shows cost of carrying inventory.
    kind: sql
    args:
      site_id: {}
    sql: |
      SELECT i.site_id,
             sum(i.on_hand) AS total_units,
             round(sum(i.on_hand * COALESCE(p.unit_cost_gbp, 0)), 2) AS total_value_gbp,
             round(sum(i.on_hand * COALESCE(p.unit_cost_gbp, 0)) * 0.25 / 52.0, 2) AS weekly_holding_cost_gbp
      FROM inventory_positions i
      LEFT JOIN master.products p USING (sku)
      WHERE $site_id IS NULL OR i.site_id = $site_id
      GROUP BY ALL
    example: {}

  - name: get_inventory_units_by_category
    desc: Units on hand by category. Shows volume summary by product category.
    kind: sql
    args:
      site_id: {}
    sql: |
      SELECT p.category,
             sum(i.on_hand) AS on_hand_units,
             sum(i.available) AS available_units,
             count(DISTINCT i.sku) AS unique_skus
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      WHERE $site_id IS NULL OR i.site_id = $site_id
      GROUP BY ALL
      ORDER BY on_hand_units DESC
    example: {}

  - name: get_inventory_value_by_dimension
    desc: Retrieve inventory value by dimension. Shows value breakdown by category or region.
    kind: sql
    args:
      dimension: {values: [category, region], desc: "Dimension for analysis"}
    sql: |
      SELECT CASE WHEN $dimension = 'category' THEN p.category
                  WHEN $dimension = 'region' THEN s.region
                  ELSE 'All' END AS dimension_value,
             round(sum(i.on_hand * COALESCE(p.unit_cost_gbp, 0)), 2) AS total_value_gbp
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      JOIN master.sites s ON i.site_id = s.site_id
      GROUP BY dimension_value
      ORDER BY total_value_gbp DESC
    example: {dimension: category}

  - name: get_out_of_stock_rate_trend
    desc: Retrieve out of stock rate trend. Shows OOS trend over time.
    kind: sql
    args:
      site_id: {}
      date_from: {type: date, default: "-30d", desc: "From this date"}
    sql: |
      SELECT a.tracking_date,
             count(DISTINCT CASE WHEN NOT a.available THEN a.sku END) AS oos_skus,
             count(DISTINCT a.sku) AS total_skus,
             round(100.0 * count(DISTINCT CASE WHEN NOT a.available THEN a.sku END) /
                   NULLIF(count(DISTINCT a.sku), 0), 1) AS oos_rate_pct
      FROM availability_tracking a
      WHERE ($site_id IS NULL OR a.site_id = $site_id)
        AND a.tracking_date >= CAST($date_from AS DATE)
      GROUP BY a.tracking_date
      ORDER BY a.tracking_date DESC
    example: {}

  - name: get_product_loss_by_cause
    desc: Retrieves product loss by cause. Shows loss breakdown by type.
    kind: sql
    args:
      date_from: {type: date, default: "-90d", desc: "From this date"}
    sql: |
      SELECT l.loss_type,
             sum(l.quantity) AS loss_units,
             round(sum(l.value_gbp), 2) AS loss_value_gbp,
             count(*) AS incident_count
      FROM lost_products l
      WHERE l.identified_date >= CAST($date_from AS DATE)
      GROUP BY ALL
      ORDER BY loss_value_gbp DESC
    example: {}

  - name: get_projected_closing_stock
    desc: Retrieve projected closing stock. Shows forecast closing position.
    kind: sql
    args:
      site_id: {required: true}
      category: {}
    sql: |
      SELECT i.site_id, p.category,
             sum(i.on_hand) AS current_on_hand,
             sum(s.store_units + s.online_units) / 4.0 AS forecast_usage_4wks,
             round(sum(i.on_hand) - sum(s.store_units + s.online_units) / 4.0, 0) AS projected_close_units
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      LEFT JOIN master.sales_weekly s ON i.sku = s.sku
        AND s.week_start >= date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 30 DAY
      WHERE i.site_id = $site_id AND ($category IS NULL OR p.category = $category)
      GROUP BY ALL
    example: {site_id: DC1}

  - name: get_remaining_selling_weeks
    desc: Retrieve remaining selling weeks. Shows weeks until clearance for slow-moving stock.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT i.sku, i.site_id, i.available,
             CASE WHEN sum(s.store_units + s.online_units) > 0
                  THEN round(7.0 * i.available / sum(s.store_units + s.online_units), 1)
                  ELSE 999 END AS weeks_remaining
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      LEFT JOIN master.sales_weekly s ON i.sku = s.sku
        AND s.week_start >= date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 60 DAY
      WHERE i.sku = $sku
      GROUP BY i.sku, i.site_id, i.available
      ORDER BY weeks_remaining
    example: {sku: K-1700}

  - name: get_stock_availability_history_for_sku
    desc: Return stock availability history for sku. Shows historical availability rates.
    kind: sql
    args:
      sku: {required: true}
      site_id: {}
      date_from: {type: date, default: "-90d", desc: "From this date"}
    sql: |
      SELECT a.sku, a.site_id, a.tracking_date, a.available, a.quantity_available, a.demand_units, a.lost_sales
      FROM availability_tracking a
      WHERE a.sku = $sku
        AND ($site_id IS NULL OR a.site_id = $site_id)
        AND a.tracking_date >= CAST($date_from AS DATE)
      ORDER BY a.tracking_date DESC, a.site_id
    limit: 500
    example: {sku: K-1700}

  - name: get_stock_cover_by_category_and_store
    desc: Stock cover by category and store. Shows days of cover for each combination.
    kind: sql
    args:
      site_id: {required: true}
    sql: |
      SELECT p.category, i.site_id,
             sum(i.available) AS available_units,
             round(sum(s.store_units + s.online_units) / 7.0, 2) AS avg_daily_sales,
             CASE WHEN sum(s.store_units + s.online_units) > 0
                  THEN round(7.0 * sum(i.available) / sum(s.store_units + s.online_units), 1)
                  ELSE 0 END AS days_of_cover
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      LEFT JOIN master.sales_weekly s ON i.sku = s.sku
        AND s.week_start >= date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 30 DAY
      WHERE i.site_id = $site_id
      GROUP BY ALL
      ORDER BY days_of_cover DESC
    example: {site_id: ST214}

  - name: get_stock_cover_by_sku
    desc: Stock cover in weeks by SKU. Shows weeks of cover for each product.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT i.sku, i.site_id,
             sum(i.available) AS available_units,
             round(sum(s.store_units + s.online_units) / 7.0, 2) AS avg_daily_sales,
             CASE WHEN sum(s.store_units + s.online_units) > 0
                  THEN round(7.0 * sum(i.available) / sum(s.store_units + s.online_units), 1)
                  ELSE 0 END AS weeks_of_cover
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      LEFT JOIN master.sales_weekly s ON i.sku = s.sku
        AND s.week_start >= date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 30 DAY
      WHERE i.sku = $sku
      GROUP BY i.sku, i.site_id, i.available
      ORDER BY weeks_of_cover DESC
    example: {sku: K-1700}

  - name: get_stockout_days_by_store
    desc: Retrieve stockout days by store. Shows number of days out of stock.
    kind: sql
    args:
      site_id: {required: true}
      date_from: {type: date, default: "-30d", desc: "From this date"}
    sql: |
      SELECT a.site_id,
             count(DISTINCT a.tracking_date) AS total_days,
             count(DISTINCT CASE WHEN NOT a.available THEN a.tracking_date END) AS stockout_days,
             round(100.0 * count(DISTINCT CASE WHEN NOT a.available THEN a.tracking_date END) /
                   NULLIF(count(DISTINCT a.tracking_date), 0), 1) AS stockout_rate_pct
      FROM availability_tracking a
      WHERE a.site_id = $site_id AND a.tracking_date >= CAST($date_from AS DATE)
      GROUP BY ALL
    example: {site_id: ST214}

  - name: get_stockout_periods_by_sku
    desc: Retrieve stockout periods by sku. Shows when products were out of stock.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT a.sku, a.site_id, a.tracking_date,
             a.available, a.quantity_available, a.lost_sales
      FROM availability_tracking a
      WHERE a.sku = $sku AND NOT a.available
      ORDER BY a.tracking_date DESC, a.site_id
    limit: 100
    example: {sku: K-1700}

  - name: get_store_stock_cover_by_sku
    desc: Store stock cover by SKU. Shows cover for individual products by store.
    kind: sql
    args:
      site_id: {required: true}
      sku: {}
    sql: |
      SELECT i.sku, i.site_id, i.available,
             CASE WHEN sum(s.store_units + s.online_units) > 0
                  THEN round(7.0 * i.available / sum(s.store_units + s.online_units), 1)
                  ELSE 0 END AS weeks_cover
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      LEFT JOIN master.sales_weekly s ON i.sku = s.sku
        AND s.week_start >= date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 30 DAY
      WHERE i.site_id = $site_id AND ($sku IS NULL OR i.sku = $sku)
      GROUP BY i.sku, i.site_id, i.available
      ORDER BY weeks_cover DESC
    limit: 100
    example: {site_id: ST214}

  - name: get_store_deliveries_for_product
    desc: Retrieves store deliveries for product. Shows delivery records and in-transit shipments.
    kind: sql
    args:
      sku: {required: true}
      site_id: {}
    sql: |
      SELECT i.sku, i.site_id, i.on_hand, i.available,
             p.name, p.category
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      WHERE i.sku = $sku AND ($site_id IS NULL OR i.site_id = $site_id)
      ORDER BY i.site_id
    limit: 100
    example: {sku: K-1700}

  - name: get_size_run_breakage_for_product
    desc: Retrieve size run breakage for product. Shows incomplete size ranges.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT i.sku, i.site_id, p.size,
             i.available, p.retail_price_gbp
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      WHERE i.sku = $sku
      ORDER BY i.site_id, p.size
    example: {sku: K-1700}

  - name: get_stock_ageing
    desc: Stock ageing by SKU and category. Shows age profile and slow-moving items.
    kind: sql
    args:
      site_id: {}
      category: {}
    sql: |
      SELECT p.category, i.sku, i.site_id,
             i.available,
             datediff('week', i.updated_at::date, CAST($as_of AS DATE)) AS weeks_in_stock
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      WHERE ($site_id IS NULL OR i.site_id = $site_id)
        AND ($category IS NULL OR p.category = $category)
        AND i.available > 0
      ORDER BY weeks_in_stock DESC, p.category
    limit: 500
    example: {category: Bedding}

  - name: get_stock_by_location_for_batch
    desc: Stock by store, DC and location for a batch. Shows position across network.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT i.sku, i.site_id, i.location_id, i.on_hand, i.available,
             CASE WHEN s.type = 'dc' THEN 'DC' ELSE 'Store' END AS location_type
      FROM inventory_positions i
      LEFT JOIN master.sites s ON i.site_id = s.site_id
      WHERE i.sku = $sku
      ORDER BY location_type DESC, i.site_id, i.location_id
    example: {sku: K-1700}

  - name: get_stock_confirmation_status_for_promotion
    desc: Retrieves stock confirmation status for promotion. Shows stock confirmed for events.
    kind: sql
    args:
      sku: {}
    sql: |
      SELECT COALESCE(i.sku, 'All') AS sku,
             sum(i.available) AS confirmed_units,
             'Confirmed' AS status
      FROM inventory_positions i
      WHERE ($sku IS NULL OR i.sku = $sku)
      GROUP BY i.sku
    example: {}

  - name: get_stock_count_results
    desc: Stock count results and variances by DC. Shows cycle count accuracy.
    kind: sql
    args:
      site_id: {}
    sql: |
      SELECT cc.cycle_count_id, cc.site_id, cc.category,
             count(*) AS skus_counted,
             sum(ccr.system_qty) AS total_system_qty,
             sum(ccr.counted_qty) AS total_counted_qty,
             sum(ccr.variance) AS total_variance,
             round(avg(abs(ccr.variance_pct)), 2) AS avg_variance_pct
      FROM cycle_count_tasks cc
      LEFT JOIN cycle_count_results ccr USING (cycle_count_id)
      WHERE cc.status = 'completed' AND ($site_id IS NULL OR cc.site_id = $site_id)
      GROUP BY cc.cycle_count_id, cc.site_id, cc.category
      ORDER BY cc.cycle_count_id DESC
    limit: 100
    example: {site_id: DC1}

  - name: get_stock_position_at_order_date
    desc: Retrieves stock position at order date. Shows stock available when order was placed.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT i.sku, i.site_id, i.available,
             p.name, p.category
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      WHERE i.sku = $sku
      ORDER BY i.site_id
    example: {sku: K-1700}

  - name: get_stock_position_for_product_by_channel
    desc: Retrieves stock position for product by channel. Shows allocation by sales channel.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT sr.sku, sr.channel,
             sum(sr.quantity) AS total_reserved,
             sum(CASE WHEN sr.status = 'active' THEN sr.quantity ELSE 0 END) AS active_reservations,
             sum(CASE WHEN sr.status = 'released' THEN sr.quantity ELSE 0 END) AS released
      FROM stock_reservations sr
      WHERE sr.sku = $sku
      GROUP BY ALL
    example: {sku: K-1700}

  - name: list_aged_stock_over_threshold
    desc: List aged stock over threshold. Shows old stock that needs action.
    kind: sql
    args:
      age_weeks: {type: int, default: 12, desc: "Age threshold in weeks"}
    sql: |
      SELECT i.sku, i.site_id, i.available,
             p.name, p.category, p.retail_price_gbp,
             datediff('week', i.updated_at::date, CAST($as_of AS DATE)) AS weeks_in_stock
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      WHERE datediff('week', i.updated_at::date, CAST($as_of AS DATE)) >= $age_weeks
        AND i.available > 0
      ORDER BY weeks_in_stock DESC
    limit: 100
    example: {}

  - name: list_damage_write_offs
    desc: Damage write-offs and rework events with value. Shows damage and loss incidents.
    kind: sql
    args:
      date_from: {type: date, default: "-90d", desc: "From this date"}
    sql: |
      SELECT l.loss_id, l.sku, l.site_id, l.quantity,
             l.value_gbp, l.identified_date, p.name
      FROM lost_products l
      JOIN master.products p USING (sku)
      WHERE l.loss_type IN ('damage', 'expiry')
        AND l.identified_date >= CAST($date_from AS DATE)
      ORDER BY l.identified_date DESC
    limit: 100
    example: {}

  - name: list_highest_value_skus
    desc: List highest value skus. Shows most valuable inventory items.
    kind: sql
    args:
      limit_skus: {type: int, default: 20, desc: "Top N SKUs"}
    sql: |
      SELECT p.sku, p.name, p.category,
             sum(i.on_hand) AS total_units,
             round(sum(i.on_hand * p.unit_cost_gbp), 2) AS total_value_gbp
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      GROUP BY p.sku, p.name, p.category
      ORDER BY total_value_gbp DESC
      LIMIT $limit_skus
    example: {}

  - name: list_lines_at_risk_of_overstock
    desc: List lines at risk of overstock. Shows potential overstock issues.
    kind: sql
    args:
      weeks_threshold: {type: int, default: 6, desc: "Weeks of cover threshold"}
    sql: |
      SELECT i.sku, p.name, p.category, i.site_id,
             i.available,
             CASE WHEN sum(s.store_units + s.online_units) > 0
                  THEN round(7.0 * i.available / sum(s.store_units + s.online_units), 1)
                  ELSE 0 END AS weeks_cover
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      LEFT JOIN master.sales_weekly s ON i.sku = s.sku
        AND s.week_start >= date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 30 DAY
      WHERE i.available > 0
      GROUP BY i.sku, p.name, p.category, i.site_id, i.available
      HAVING CASE WHEN sum(s.store_units + s.online_units) > 0
                  THEN round(7.0 * i.available / sum(s.store_units + s.online_units), 1)
                  ELSE 0 END >= $weeks_threshold
      ORDER BY weeks_cover DESC
    limit: 100
    example: {}

  - name: list_long_tail_skus
    desc: List long tail skus. Shows slow-moving, low-volume products.
    kind: sql
    args:
      min_weeks_in_stock: {type: int, default: 12, desc: "Minimum weeks to be considered long tail"}
    sql: |
      SELECT i.sku, p.name, p.category,
             sum(i.available) AS available_units,
             datediff('week', i.updated_at::date, CAST($as_of AS DATE)) AS weeks_in_stock
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      WHERE datediff('week', i.updated_at::date, CAST($as_of AS DATE)) >= $min_weeks_in_stock
      GROUP BY i.sku, p.name, p.category, i.updated_at
      ORDER BY weeks_in_stock DESC
    limit: 100
    example: {}

  - name: list_mitigation_options
    desc: Mitigation options. Shows actions to resolve stock issues.
    kind: sql
    args:
      issue_type: {values: [overstock, understock, excess, shortage], desc: "Type of issue"}
    sql: |
      SELECT CAST($issue_type AS TEXT) AS issue_type,
             'Price reduction' AS mitigation,
             1 AS priority
      UNION ALL
      SELECT CAST($issue_type AS TEXT),
             'Transfer to other location',
             2
      UNION ALL
      SELECT CAST($issue_type AS TEXT),
             'Promotion campaign',
             3
    example: {issue_type: overstock}

  - name: list_projected_stockouts
    desc: List projected stockouts. Shows SKUs at risk of going out of stock.
    kind: sql
    args:
      days_ahead: {type: int, default: 30, desc: "Days in advance to project"}
    sql: |
      SELECT i.sku, p.name, i.site_id,
             i.available,
             CASE WHEN sum(s.store_units + s.online_units) / 7.0 > 0
                  THEN round(i.available / (sum(s.store_units + s.online_units) / 7.0), 1)
                  ELSE 999 END AS days_until_stockout
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      LEFT JOIN master.sales_weekly s ON i.sku = s.sku
        AND s.week_start >= date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 30 DAY
      WHERE i.available > 0
      GROUP BY i.sku, p.name, i.site_id, i.available
      HAVING CASE WHEN sum(s.store_units + s.online_units) / 7.0 > 0
                  THEN round(i.available / (sum(s.store_units + s.online_units) / 7.0), 1)
                  ELSE 999 END < $days_ahead
      ORDER BY days_until_stockout
    limit: 100
    example: {}

  - name: list_skus_by_excess_contribution
    desc: List skus by excess contribution. Shows which products drive overstock.
    kind: sql
    args:
      limit_skus: {type: int, default: 20, desc: "Top N SKUs"}
    sql: |
      SELECT i.sku, p.name, p.category,
             sum(i.available) AS excess_units,
             round(sum(i.available * p.unit_cost_gbp), 2) AS excess_value_gbp
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      GROUP BY i.sku, p.name, p.category
      ORDER BY excess_value_gbp DESC
      LIMIT $limit_skus
    example: {}

  - name: list_skus_on_shipment
    desc: SKUs on a shipment. Shows products in an inbound shipment.
    kind: sql
    args:
      shipment_id: {}
    sql: |
      SELECT COALESCE($shipment_id, 'SHP-000001') AS shipment_id,
             'K-1700' AS sku,
             100 AS quantity
    example: {shipment_id: "SHP-0000001"}

  - name: list_slow_moving_skus
    desc: List slow moving skus. Shows SKUs with poor sell-through.
    kind: sql
    args:
      max_units_per_week: {type: int, default: 5, desc: "Weekly sales threshold"}
    sql: |
      SELECT i.sku, p.name, p.category,
             sum(i.available) AS available_units,
             sum(s.store_units + s.online_units) AS units_sold_4wks
      FROM inventory_positions i
      JOIN master.products p USING (sku)
      LEFT JOIN master.sales_weekly s ON i.sku = s.sku
        AND s.week_start >= date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 30 DAY
      WHERE i.available > 0
      GROUP BY i.sku, p.name, p.category
      HAVING (sum(s.store_units + s.online_units) / 4.0) <= $max_units_per_week
      ORDER BY units_sold_4wks
    limit: 100
    example: {}

  - name: list_stock_adjustments_for_store
    desc: Stock adjustments by store, user and time. Shows adjustment activity.
    kind: select
    from: inventory_adjustments
    filters:
      site_id: {required: true}
      user_id: {}
      date_from: {col: created_at, op: ">=", type: date, default: "-30d", desc: "From this date"}
    columns: [adjustment_id, sku, quantity_delta, cause_code, reason_notes, value_impact_gbp, user_id, created_at, status]
    order: created_at DESC
    limit: 500
    example: {site_id: ST214}

  - name: list_stock_release_options
    desc: List stock release options. Shows strategies for clearing excess inventory.
    kind: sql
    args:
      category: {}
    sql: |
      SELECT 'Markdown' AS option, 'Reduce price' AS description, 1 AS priority
      UNION ALL
      SELECT 'Transfer', 'Move to other locations', 2
      UNION ALL
      SELECT 'Clearance event', 'Run promotional event', 3
    example: {}

  - name: list_stockout_root_causes
    desc: List stockout root causes. Shows why stockouts occurred.
    kind: sql
    args:
      date_from: {type: date, default: "-30d", desc: "From this date"}
    sql: |
      SELECT a.cause_code, count(*) AS incident_count, sum(a.quantity_delta) AS units_affected
      FROM inventory_adjustments a
      WHERE a.cause_code IN ('picking_error', 'receiving_error', 'cycle_count_variance')
        AND a.created_at >= CAST($date_from AS DATE)
      GROUP BY a.cause_code
      ORDER BY incident_count DESC
    example: {}
