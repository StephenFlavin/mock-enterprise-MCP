      cause_code: {required: true, values: [shrink, damage, expiry, loss, receiving_variance, cycle_count_variance, write_off, reclass, receiving_error, picking_error, markdown, sample, theft, other]}
    example: {adjustment_id: INV-ADJ-900001, cause_code: cycle_count_variance}

  - name: update_inventory_hold_status
