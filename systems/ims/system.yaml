  - name: get_self_checkout_shrink_by_store
    desc: Retrieves self checkout shrink by store. Shows self-checkout specific losses.
    kind: sql
    args:
      date_from: {type: date, default: "-30d", desc: "From this date"}
    sql: |
      SELECT l.site_id, l.loss_type,
             sum(l.quantity) AS loss_units,
             round(sum(l.value_gbp), 2) AS loss_value_gbp,
             count(*) AS incident_count
      FROM lost_products l
      WHERE l.loss_type IN ('shrink','theft')
        AND l.identified_date >= CAST($date_from AS DATE)
      GROUP BY ALL ORDER BY loss_value_gbp DESC
    limit: 50
    example: {}

  - name: get_highest_loss_products
    desc: Retrieves highest loss products. Shows SKUs with highest loss value.
    kind: sql
    args:
      loss_type: {}
      limit_products: {type: int, default: 20, desc: "Top N products"}
      date_from: {type: date, default: "-90d", desc: "From this date"}
    sql: |
      SELECT l.sku, p.name, p.category, p.retail_price_gbp,
             sum(l.quantity) AS loss_units,
             round(sum(l.value_gbp), 2) AS total_loss_value_gbp,
             count(DISTINCT l.site_id) AS sites_affected,
             l.loss_type
      FROM lost_products l
      JOIN master.products p USING (sku)
      WHERE ($loss_type IS NULL OR l.loss_type = $loss_type)
        AND l.identified_date >= CAST($date_from AS DATE)
      GROUP BY ALL ORDER BY total_loss_value_gbp DESC
      LIMIT $limit_products
