      FROM programme_milestones
      WHERE programme_name = $programme_name
      ORDER BY sequence
    limit: 50
    example: {programme_name: "ERP"}

  - name: get_programme_resource_plan
    desc: Resource plan and availability by workstream. For capacity planning.
    kind: py
    fn: get_programme_resource_plan
    args:
      programme_name: {required: true}
    example: {programme_name: "ERP"}

  - name: get_project_cost_estimate
    desc: Cost estimate and resource plan for a delivery project. For business case and planning.
    kind: sql
    args:
      project_id: {required: true}
    sql: |
      SELECT p.project_id, p.name, p.status, p.owner_id, p.site_id, p.budget_gbp, p.actual_cost_gbp,
             p.budget_gbp - p.actual_cost_gbp AS remaining_budget_gbp, p.start_date, p.end_date,
             (SELECT string_agg(t.title || ' (' || t.assigned_to || ', due ' || CAST(t.due_date AS VARCHAR) || ')', '; ' ORDER BY t.due_date)
                FROM project_tasks t WHERE t.project_id = p.project_id) AS resource_plan,
             p.description
      FROM projects p
      WHERE p.project_id = $project_id
    limit: 1
    example: {project_id: PRJ-000001}

  - name: get_project_delivery_risk
    desc: Delivery risk rating and issues per project. For governance and tracking.
    kind: sql
    args:
      project_id: {required: true}
    sql: |
      SELECT x.project_id, x.name, x.delivery_risk_rating, x.raid_id, x.item_type, x.title, x.impact, x.status, x.owner_id
      FROM (
        SELECT p.project_id, p.name, r.raid_id, r.item_type, r.title, r.impact, r.status, r.owner_id, r.updated_at,
               CASE r.impact WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 WHEN 'low' THEN 1 ELSE 0 END AS score,
               CASE max(CASE r.impact WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 WHEN 'low' THEN 1 ELSE 0 END) OVER ()
                    WHEN 0 THEN 'green' WHEN 1 THEN 'green' WHEN 2 THEN 'amber' ELSE 'red' END AS delivery_risk_rating
        FROM projects p
        LEFT JOIN raid_log_items r ON r.project_id = p.project_id AND r.status IN ('open', 'in_progress')
        WHERE p.project_id = $project_id
      ) x
      ORDER BY x.score DESC, x.updated_at DESC
    limit: 30
    example: {project_id: PRJ-000001}

  - name: get_project_dependencies
    desc: Dependencies between projects and programmes. For sequencing and critical path.
    kind: sql
    args:
      project_id: {}
    sql: |
      SELECT r.raid_id, r.project_id, p.name AS project_name, r.depends_on_project_id, d.name AS depends_on_project_name,
             r.title, r.impact, r.target_resolution_date, r.status,
             count(*) OVER (PARTITION BY r.depends_on_project_id) AS projects_waiting_on_it
      FROM raid_log_items r
      LEFT JOIN projects p ON p.project_id = r.project_id
      LEFT JOIN projects d ON d.project_id = r.depends_on_project_id
      WHERE r.item_type = 'dependency'
        AND r.status IN ('open', 'in_progress', 'on_hold')
        AND ($project_id IS NULL OR r.project_id = $project_id OR r.depends_on_project_id = $project_id)
      ORDER BY projects_waiting_on_it DESC, r.target_resolution_date, r.raid_id
    limit: 50
    example: {}

  - name: get_test_cycle_pass_rates
    desc: Test execution and pass rates. For quality gates.
    kind: sql
    args:
      programme_name: {required: true}
      cycle_name: {}
    sql: |
      SELECT cycle_id, programme_name, cycle_name, status, total_tests, tests_passed, tests_failed,
             tests_blocked, pass_rate_pct, scheduled_start, scheduled_end
      FROM test_cycles
      WHERE programme_name = $programme_name
        AND ($cycle_name IS NULL OR cycle_name = $cycle_name)
      ORDER BY cycle_name DESC
    limit: 20
    example: {programme_name: "ERP"}

  # Read tools - draft/py
  - name: draft_pilot_pass_fail_criteria
    desc: Draft pilot pass-fail criteria for a candidate material, with metric, threshold and test method. Uses candidate-specific criteria, else material-type defaults.
    kind: draft
    args:
      material_id: {required: true, desc: "Candidate material id, e.g. CAND-901002"}
      material_type: {desc: "Material type for default criteria, e.g. fabric, yarn"}
    sql:
      own: SELECT metric, comparator, threshold, unit, test_method, notes FROM pilot_criteria WHERE material_id = $material_id ORDER BY criterion_id
      dflt: SELECT metric, comparator, threshold, unit, test_method, notes FROM pilot_criteria WHERE material_id IS NULL AND lower(material_type) = lower(coalesce($material_type, 'fabric')) ORDER BY criterion_id
    template: |
      PILOT PASS / FAIL CRITERIA for {{ material_id }}
      {% if own %}Criteria set for this candidate:
      {% for c in own %}- {{ c.metric }}: {{ c.comparator }} {{ c.threshold }} {{ c.unit }} (method: {{ c.test_method }}){% if c.notes %}. {{ c.notes }}{% endif %}

      {% endfor %}
      {% else %}No candidate-specific criteria are on file; standard defaults{% if material_type %} for {{ material_type }}{% endif %}:
      {% for c in dflt %}- {{ c.metric }}: {{ c.comparator }} {{ c.threshold }} {{ c.unit }} (method: {{ c.test_method }}){% if c.notes %}. {{ c.notes }}{% endif %}

      {% endfor %}
      {% endif %}
      The candidate passes the pilot only if every criterion above is met; any single miss is a fail.
    example: {material_id: CAND-901002, material_type: fabric}

  - name: run_programme_scenario
    desc: Re-plan the programme under a scope, date or resource change. For trade-off analysis.
    kind: py
    fn: run_programme_scenario
    args:
      programme_name: {required: true}
      scenario_type: {required: true, type: enum, values: [scope_reduction, date_slip, resource_change], desc: "Type of change"}
      parameter: {required: true, desc: "Change parameter, e.g. number of weeks"}
    example: {programme_name: "ERP", scenario_type: date_slip, parameter: "6"}

  - name: search_test_labs_and_pilot_partners
    desc: Test labs and pilot partners by material type and capability, with location, accreditation, lead time and typical pilot cost. For choosing who runs a pilot.
    kind: select
    from: test_labs
    filters:
      material_type: {col: material_types, op: like, desc: "Material type, e.g. fabric, yarn, leather, packaging"}
      capability: {col: capabilities, op: like, desc: "Required test or trial, e.g. tensile, abrasion, dyeability"}
      lab_type: {}
      status: {}
    columns: [lab_id, name, lab_type, location, material_types, capabilities, accreditation, lead_time_weeks, pilot_cost_gbp, status]
    order: (status = 'unavailable'), lead_time_weeks, pilot_cost_gbp
    limit: 10
    example: {material_type: fabric, capability: tensile}
