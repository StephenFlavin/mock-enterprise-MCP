  # Read tools - select
  - name: list_cost_saving_initiatives
    desc: Cost saving initiatives with owner, status, estimated saving and confidence-weighted saving, largest first. Archived and cancelled hidden unless asked for.
    kind: sql
    args:
      status: {type: enum, values: [draft, active, in_progress, delivered, on_hold, archived, cancelled], desc: "Only this status; omit for all except archived and cancelled"}
      category: {desc: "Savings category, e.g. procurement, labour, freight, shrink, markdown"}
      owner_id: {col: employee_id}
    sql: |
      SELECT initiative_id, title, owner_id, status, category, estimated_saving_gbp, confidence_pct,
             round(estimated_saving_gbp * confidence_pct / 100.0, 0) AS risk_adjusted_saving_gbp,
             realized_saving_gbp, target_date
      FROM cost_saving_initiatives
      WHERE ($status IS NULL AND status NOT IN ('archived', 'cancelled') OR status = $status)
        AND ($category IS NULL OR lower(category) = lower($category))
        AND ($owner_id IS NULL OR owner_id = $owner_id)
      ORDER BY estimated_saving_gbp DESC
    limit: 50
    example: {}

  - name: list_raid_log_items
    desc: RAID items with status, impact, owner, created and last-updated dates, worst impact first. Omit status for all unresolved items. For programme health tracking.
    kind: sql
    args:
      programme_name: {desc: "Programme the items belong to, e.g. ERP"}
      project_id: {}
      item_type: {type: enum, values: [risk, action, issue, dependency], desc: "Only this item type"}
      status: {type: enum, values: [open, in_progress, resolved, retired, on_hold], desc: "Only this status; omit for open, in progress and on hold"}
    sql: |
      SELECT raid_id, programme_name, project_id, item_type, title, owner_id, status, impact, probability,
             target_resolution_date, mitigation_action, created_at, updated_at
      FROM raid_log_items
      WHERE ($programme_name IS NULL OR programme_name = $programme_name)
        AND ($project_id IS NULL OR project_id = $project_id)
        AND ($item_type IS NULL OR item_type = $item_type)
        AND ($status IS NULL AND status IN ('open', 'in_progress', 'on_hold') OR status = $status)
      ORDER BY CASE impact WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END DESC, created_at
    limit: 50
    example: {programme_name: ERP}

  - name: list_project_milestones_for_site
    desc: Rollout milestones for one site with project, owner, due and forecast dates and status, earliest first. For tracking site rollouts.
    kind: sql
    args:
      site_id: {required: true}
      project_name: {desc: "Words in the project name, e.g. electric reach truck"}
      status: {type: enum, values: [on_track, at_risk, off_track, completed, cancelled], desc: "Only this status"}
    sql: |
      SELECT m.milestone_id, m.site_id, p.project_id, p.name AS project_name, m.title, m.owner_id,
             m.due_date, m.forecast_date, m.status,
             CASE WHEN m.forecast_date > m.due_date THEN date_diff('day', m.due_date, m.forecast_date) ELSE 0 END AS slip_days,
             m.description
      FROM project_milestones m
      LEFT JOIN projects p ON p.project_id = m.project_id
      WHERE m.site_id = $site_id
        AND ($status IS NULL OR m.status = $status)
        AND ($project_name IS NULL OR lower(p.name) LIKE '%' || lower($project_name) || '%')
      ORDER BY m.due_date, m.milestone_id
    limit: 30
    example: {site_id: DC3}

  - name: list_steering_committee_decisions_required
    desc: Open decisions awaiting steering committee. For governance tracking.
    kind: select
    from: steering_decisions
    filters:
      status: {default: pending}
      programme_name: {}
    columns: [decision_id, programme_name, title, due_date, options, recommendation, owner_id]
    order: due_date ASC
    limit: 30
    example: {status: pending}

  - name: list_migration_defects_and_blockers
    desc: Open migration defects and blockers. For migration risk tracking.
    kind: sql
    args:
      programme_name: {required: true}
      workstream_id: {}
    sql: |
      SELECT workstream_id, programme_name, name AS workstream_name, object_type, owner_id,
             records_total, records_completed, data_quality_pct, issues_count, status,
             blocker, blocker_owner_id, updated_at
      FROM migration_workstreams
      WHERE programme_name = $programme_name
        AND ($workstream_id IS NULL OR workstream_id = $workstream_id)
        AND (status != 'completed' OR issues_count > 0)
      ORDER BY issues_count DESC, updated_at DESC
    limit: 30
    example: {programme_name: "ERP"}

  # Read tools - sql (get/calculate)
  - name: get_capex_proposal
    desc: Capex proposals with cost, payback, IRR, NPV, assumptions and sensitivity. Find by id, site or title words. For investment decisions.
    kind: sql
    args:
      proposal_id: {}
