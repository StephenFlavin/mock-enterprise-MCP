    sql: |
      SELECT proposal_id, title, sponsor_id, status, site_id, capex_gbp, payback_years, irr_pct, npv_gbp,
             risk_rating, business_case, key_assumptions, sensitivity_10pct, submission_date, decision_date
      FROM capex_proposals
      WHERE ($proposal_id IS NULL OR proposal_id = $proposal_id)
