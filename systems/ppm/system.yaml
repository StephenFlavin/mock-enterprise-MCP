id: ppm
name: Project & Portfolio Management Tool
instructions: >
  Project and programme management, capital planning, initiatives and benefits tracking.
  Project ids look like PRJ-000123, action items like ACT-000123.
  Use it for projects, milestones, RAID logs, capex decisions, initiatives and steering committee approvals.

tables:
  projects:
    key: project_id
    cols:
      project_id: {type: str, desc: "Project id, e.g. PRJ-000123"}
      name: {type: str, desc: Project name}
      owner_id: {type: str, desc: Project owner employee id}
      status: {type: enum, values: [draft, active, completed, on_hold, cancelled], desc: Project status}
      start_date: {type: date, desc: Planned start date}
      end_date: {type: date, desc: Planned end date}
      budget_gbp: {type: float, desc: Project budget in GBP}
      actual_cost_gbp: {type: float, desc: Actual spend to date}
      description: {type: str, desc: Project description}
      site_id: {type: str, desc: "Site the project is for, if site-specific"}
      supplier_id: {type: str, desc: "Supplier the project is run with, if any"}
      tasks: {type: text, desc: "Initial task list, newline-separated, e.g. 'Task (owner EMP-00001)'"}
      milestones: {type: text, desc: "Planned milestones with owners, newline-separated"}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  project_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Task id, e.g. TSK-000123"}
      project_id: {type: str, desc: Parent project}
      title: {type: str, desc: Task title}
      assigned_to: {type: str, desc: Employee id of assignee}
      status: {type: enum, values: [open, in_progress, completed, blocked, cancelled], desc: Task status}
      due_date: {type: date, desc: Due date}
      priority: {type: enum, values: [low, medium, high, urgent], desc: Priority}
      description: {type: str, desc: Task description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  project_milestones:
    key: milestone_id
    cols:
      milestone_id: {type: str, desc: "Milestone id, e.g. MIL-000123"}
      project_id: {type: str, desc: Project (null for programme milestones)}
      programme_milestone_id: {type: str, desc: "Programme milestone, if programme-level"}
      site_id: {type: str, desc: "Site the milestone applies to, if a site rollout milestone"}
      owner_id: {type: str, desc: Milestone owner employee id}
      title: {type: str, desc: Milestone title}
      due_date: {type: date, desc: Due date}
      forecast_date: {type: date, desc: Forecast date (if later than due date)}
      status: {type: enum, values: [on_track, at_risk, off_track, completed, cancelled], desc: Status}
      description: {type: str, desc: Milestone description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  raid_log_items:
    key: raid_id
    cols:
      raid_id: {type: str, desc: "RAID item id, e.g. RSD-000123"}
      project_id: {type: str, desc: Project (null for programme level)}
      item_type: {type: enum, values: [risk, action, issue, dependency], desc: Item type}
      title: {type: str, desc: Title}
      owner_id: {type: str, desc: Owner employee id}
      status: {type: enum, values: [open, in_progress, resolved, retired, on_hold], desc: Status}
      impact: {type: enum, values: [low, medium, high, critical], desc: Impact level}
      probability: {type: enum, values: [low, medium, high], desc: "Probability (risks only)"}
      programme_name: {type: str, desc: "Programme the item belongs to, e.g. ERP; blank if project-level"}
      depends_on_project_id: {type: str, desc: "For dependencies: the project that must deliver first, e.g. PRJ-900014"}
      mitigation_action: {type: str, desc: Mitigation or action}
      target_resolution_date: {type: date, desc: Target date}
      resolved_date: {type: date, desc: Date resolved}
      description: {type: str, desc: Full description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  cost_saving_initiatives:
    key: initiative_id
    cols:
      initiative_id: {type: str, desc: "Initiative id, e.g. CSI-000123"}
      title: {type: str, desc: Initiative title}
      owner_id: {type: str, desc: Initiative owner employee id}
      status: {type: enum, values: [draft, active, in_progress, delivered, on_hold, archived, cancelled], desc: Status}
      estimated_saving_gbp: {type: float, desc: Estimated annual saving in GBP}
      realized_saving_gbp: {type: float, desc: Realized saving to date}
      confidence_pct: {type: int, desc: Confidence level as percentage}
      category: {type: str, desc: "Savings category, e.g. procurement, labour, freight"}
      depends_on: {type: str, desc: "Comma-separated ids of initiatives that must deliver first"}
      depends_on_team: {type: str, desc: "Other team or project that must deliver first, if any"}
      status_reason: {type: str, desc: "Why the status was last changed"}
      start_date: {type: date, desc: Start date}
      target_date: {type: date, desc: Target realization date}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  improvement_initiatives:
    key: improvement_id
    cols:
      improvement_id: {type: str, desc: "Improvement id, e.g. IMP-000123"}
      title: {type: str, desc: Initiative title}
      owner_id: {type: str, desc: Initiative owner employee id}
      status: {type: enum, values: [draft, active, in_progress, completed, on_hold, archived], desc: Status}
      site_id: {type: str, desc: Site focus (if applicable)}
      target_metric: {type: str, desc: "What is being improved, e.g. labour productivity"}
      current_value: {type: float, desc: Current performance value}
      target_value: {type: float, desc: Target performance value}
      unit: {type: str, desc: "Unit of measurement, e.g. units/hour, %"}
      team_members: {type: str, desc: "Comma-separated employee ids"}
      start_date: {type: date, desc: Start date}
      target_date: {type: date, desc: Target completion date}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  capex_proposals:
    key: proposal_id
    cols:
      proposal_id: {type: str, desc: "Proposal id, e.g. CAP-000123"}
      title: {type: str, desc: Proposal title}
      sponsor_id: {type: str, desc: Proposal sponsor employee id}
      status: {type: enum, values: [draft, submitted, under_review, approved, rejected, withdrawn, phased, descoped], desc: Status}
      capex_gbp: {type: float, desc: Capital expenditure in GBP}
      payback_years: {type: float, desc: Payback period in years}
      irr_pct: {type: float, desc: Internal rate of return as percentage}
      npv_gbp: {type: float, desc: Net present value in GBP}
      risk_rating: {type: enum, values: [low, medium, high], desc: Risk rating}
      site_id: {type: str, desc: Site affected (if applicable)"}
      business_case: {type: str, desc: Business case summary}
      key_assumptions: {type: str, desc: Key assumptions}
      sensitivity_10pct: {type: str, desc: Impact of 10% revenue miss}
      submission_date: {type: date, desc: Submitted for review date}
      decision_date: {type: date, desc: Decision date}
      description: {type: str, desc: Full description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  capex_projects:
    key: capex_project_id
    cols:
      capex_project_id: {type: str, desc: "Capex project id, e.g. CXP-000123"}
      title: {type: str, desc: Project title}
      sponsor_id: {type: str, desc: Project sponsor employee id}
      status: {type: enum, values: [planned, active, completed, on_hold, phased, descoped, cancelled], desc: Status}
      capex_gbp: {type: float, desc: Approved capex in GBP}
      actual_spend_gbp: {type: float, desc: Actual spend to date}
      planned_start: {type: date, desc: Planned start date}
      planned_end: {type: date, desc: Planned end date}
      forecast_end: {type: date, desc: Forecast end date}
      payback_years: {type: float, desc: Expected payback in years}
      irr_pct: {type: float, desc: Expected IRR as percentage}
      delivery_project_id: {type: str, desc: "Delivery project that tracks this capex project's risks, e.g. PRJ-900031"}
      business_case: {type: str, desc: Business case reference}
      phasing: {type: str, desc: "Phasing plan, if phased, e.g. Phase 1 Q1, Phase 2 Q2"}
      site_id: {type: str, desc: Site affected}
      description: {type: str, desc: Project description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  pilot_projects:
    key: pilot_id
    cols:
      pilot_id: {type: str, desc: "Pilot id, e.g. PIL-000123"}
      title: {type: str, desc: Pilot title}
      material_id: {type: str, desc: "Material or candidate being piloted"}
      owner_id: {type: str, desc: Pilot owner employee id}
      status: {type: enum, values: [planning, approved, in_progress, completed, cancelled], desc: Status}
      lab_id: {type: str, desc: "Test lab or pilot partner running the pilot, e.g. LAB-001"}
      budget_gbp: {type: float, desc: Pilot budget}
      actual_cost_gbp: {type: float, desc: Actual spend}
      planned_start: {type: date, desc: Planned start date}
      planned_end: {type: date, desc: Planned end date}
      actual_end: {type: date, desc: Actual end date}
      pass_criteria: {type: text, desc: Pass/fail criteria}
      result: {type: enum, values: [pass, fail, inconclusive, pending], desc: Pilot result}
      outcome: {type: str, desc: Summary outcome}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  test_labs:
    key: lab_id
    cols:
      lab_id: {type: str, desc: "Test lab or pilot partner id, e.g. LAB-001"}
      name: {type: str, desc: Lab or partner name}
      lab_type: {type: enum, values: [test_lab, pilot_partner], desc: "test_lab runs standard tests; pilot_partner runs scaled pilot or production trials"}
      location: {type: str, desc: "Town and country"}
      material_types: {type: str, desc: "Comma-separated material types covered, e.g. fabric, yarn, leather, packaging"}
      capabilities: {type: text, desc: "Tests and trials offered, e.g. tensile, abrasion, dyeability"}
      accreditation: {type: str, desc: "e.g. UKAS ISO 17025"}
      lead_time_weeks: {type: int, desc: "Typical weeks from booking to report"}
      pilot_cost_gbp: {type: float, desc: "Typical cost of a standard pilot programme in GBP"}
      status: {type: enum, values: [available, limited, unavailable], desc: Availability}

  pilot_criteria:
    key: criterion_id
    cols:
      criterion_id: {type: str, desc: "Criterion id, e.g. CRIT-000123"}
      material_id: {type: str, desc: "Candidate material id the criterion is for, e.g. CAND-901001; blank for a material-type default"}
      material_type: {type: str, desc: "Material type the default applies to, e.g. fabric, yarn"}
      metric: {type: str, desc: "What is measured, e.g. tensile strength"}
      comparator: {type: enum, values: [">=", "<=", "="], desc: "Pass if the result is >= / <= the threshold"}
      threshold: {type: float, desc: Pass threshold}
      unit: {type: str, desc: Unit}
      test_method: {type: str, desc: "Test method or standard"}
      notes: {type: str, desc: Notes}

  market_entry_projects:
    key: market_project_id
    cols:
      market_project_id: {type: str, desc: "Market entry project id, e.g. MEP-000123"}
      title: {type: str, desc: Project title}
      countries: {type: str, desc: "Comma-separated country codes"}
      owner_id: {type: str, desc: Project owner employee id}
      status: {type: enum, values: [planning, approved, in_progress, completed, cancelled], desc: Status}
      scope: {type: str, desc: "Product range or business model"}
      planned_launch: {type: date, desc: Planned launch date}
      budget_gbp: {type: float, desc: Project budget}
      workstreams: {type: str, desc: "Key workstreams, comma-separated"}
      description: {type: str, desc: Project description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  action_items:
    key: action_id
    cols:
      action_id: {type: str, desc: "Action item id, e.g. ACT-000123"}
      title: {type: str, desc: Action title}
      owner_id: {type: str, desc: Owner employee id}
      status: {type: enum, values: [open, in_progress, completed, on_hold, cancelled], desc: Status}
      priority: {type: enum, values: [low, medium, high, urgent], desc: Priority}
      due_date: {type: date, desc: Due date}
      source: {type: str, desc: "Source, e.g. question id or RAID item"}
      category: {type: str, desc: "Category, e.g. budget, compliance, performance"}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  artwork_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Task id, e.g. AWK-000123"}
      title: {type: str, desc: Task title}
      owner_id: {type: str, desc: Owner employee id}
      status: {type: enum, values: [draft, assigned, in_progress, review, completed, cancelled], desc: Status}
      agency: {type: str, desc: "Design agency name"}
      countries: {type: str, desc: "Comma-separated country codes the artwork is for, e.g. FR,DE,IT"}
      product_category: {type: str, desc: "Product category, e.g. cosmetics"}
      due_date: {type: date, desc: Due date}
      checklist: {type: text, desc: Task checklist items}
      deliverables: {type: str, desc: What is being delivered}
      requirements: {type: str, desc: Key requirements and compliance items}
      description: {type: str, desc: Task description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  programme_milestones:
    key: milestone_id
    cols:
      milestone_id: {type: str, desc: "Milestone id, e.g. PRM-000123"}
      programme_name: {type: str, desc: "Programme name, e.g. ERP"}
      title: {type: str, desc: Milestone title}
      sequence: {type: int, desc: Sequence in plan}
      due_date: {type: date, desc: Due date}
      forecast_date: {type: date, desc: Forecast date}
      status: {type: enum, values: [planned, on_track, at_risk, off_track, completed, cancelled], desc: Status}
      dependencies: {type: str, desc: "Dependent milestone ids"}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  cutover_options:
    key: option_id
    cols:
      option_id: {type: str, desc: "Option id, e.g. CUT-000123"}
      programme_name: {type: str, desc: "Programme name"}
      option_name: {type: str, desc: "Cutover option, e.g. big bang, phased by region"}
      status: {type: enum, values: [active, inactive, completed, deleted], desc: Status}
      description: {type: str, desc: Option description}
      risk_level: {type: enum, values: [low, medium, high], desc: Risk level}
      estimated_duration_days: {type: int, desc: Estimated duration}
      requires_parallel_run: {type: bool, desc: Requires parallel run}
      rollback_feasible: {type: bool, desc: Rollback possible}
      freeze_window: {type: str, desc: "Change freeze window the option has to respect"}
      rollback_notes: {type: text, desc: "How rollback would work and its point of no return"}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  automation_options:
    key: option_id
    cols:
      option_id: {type: str, desc: "Option id, e.g. AUT-000123"}
      site_id: {type: str, desc: Site}
      title: {type: str, desc: Option title}
      description: {type: str, desc: Description}
      capex_gbp: {type: float, desc: Capital cost}
      lead_time_weeks: {type: int, desc: Lead time in weeks}
      payback_years: {type: float, desc: Payback period}
      annual_saving_gbp: {type: float, desc: Annual operating saving}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  steering_decisions:
    key: decision_id
    cols:
      decision_id: {type: str, desc: "Decision id, e.g. DEC-000123"}
      programme_name: {type: str, desc: "Programme name"}
      title: {type: str, desc: Decision title}
      status: {type: enum, values: [pending, approved, rejected, deferred], desc: Status}
      due_date: {type: date, desc: Decision due date}
      options: {type: str, desc: "Available options"}
      recommendation: {type: str, desc: Recommendation}
      decision: {type: str, desc: "Decision made"}
      rationale: {type: str, desc: Decision rationale}
      owner_id: {type: str, desc: Decision owner employee id}
      description: {type: str, desc: Full description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  benefits_tracking:
    key: benefit_id
    cols:
      benefit_id: {type: str, desc: "Benefit id, e.g. BEN-000123"}
      initiative_id: {type: str, desc: "Initiative id (capex, CSI, etc)"}
      programme_name: {type: str, desc: "Programme the benefit belongs to, e.g. ERP; blank if not programme-level"}
      title: {type: str, desc: Benefit title}
      benefit_type: {type: enum, values: [financial, operational, strategic], desc: Benefit type}
      planned_gbp: {type: float, desc: Planned benefit in GBP}
      realized_gbp: {type: float, desc: Realized to date}
      realization_date: {type: date, desc: Target realization date}
      forecast_date: {type: date, desc: Forecast realization date}
      status: {type: enum, values: [on_track, at_risk, off_track, delivered], desc: Status}
      owner_id: {type: str, desc: Owner employee id}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  migration_workstreams:
    key: workstream_id
    cols:
      workstream_id: {type: str, desc: "Workstream id, e.g. MWS-000123"}
      programme_name: {type: str, desc: "Programme name"}
      name: {type: str, desc: Workstream name}
      object_type: {type: str, desc: "Object being migrated, e.g. customer master, purchase orders"}
      status: {type: enum, values: [planning, extracting, transforming, validating, loading, completed], desc: Migration status}
      cycle: {type: int, desc: "Migration cycle number"}
      planned_date: {type: date, desc: Planned completion date}
      forecast_date: {type: date, desc: Forecast completion date}
      actual_date: {type: date, desc: Actual completion date}
      owner_id: {type: str, desc: Workstream lead employee id}
      blocker: {type: text, desc: "What is blocking the workstream, if anything"}
      blocker_owner_id: {type: str, desc: "Employee id who can clear the blocker"}
      fte_required: {type: float, desc: FTE needed to hit the plan}
      fte_available: {type: float, desc: FTE currently assigned}
      records_total: {type: int, desc: Total records to migrate}
      records_completed: {type: int, desc: Records completed}
      data_quality_pct: {type: int, desc: Data quality score"}
      issues_count: {type: int, desc: Open issues}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  test_cycles:
    key: cycle_id
    cols:
      cycle_id: {type: str, desc: "Cycle id, e.g. TYC-000123"}
      programme_name: {type: str, desc: "Programme name"}
      cycle_name: {type: str, desc: "Cycle name, e.g. UAT cycle 1"}
      status: {type: enum, values: [planning, active, completed, suspended], desc: Status}
      scheduled_start: {type: date, desc: Scheduled start}
      scheduled_end: {type: date, desc: Scheduled end}
      actual_start: {type: date, desc: Actual start}
      actual_end: {type: date, desc: Actual end}
      total_tests: {type: int, desc: Total test cases}
      tests_passed: {type: int, desc: Tests passed}
      tests_failed: {type: int, desc: Tests failed}
      tests_blocked: {type: int, desc: Tests blocked}
      pass_rate_pct: {type: float, desc: Pass rate percentage}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  implementation_projects:
    key: impl_project_id
    cols:
      impl_project_id: {type: str, desc: "Implementation project id, e.g. IPT-000123"}
      title: {type: str, desc: Project title}
      system_name: {type: str, desc: "System being implemented"}
      owner_id: {type: str, desc: Project owner employee id}
      regulation_id: {type: str, desc: "Reporting regulation the project is needed for, e.g. REG-EU-CSRD; blank if none"}
      data_gap: {type: str, desc: "Data metric or capability the project closes, e.g. Scope3_supplier_emissions"}
      cost_estimate_gbp: {type: float, desc: Cost estimate in GBP}
      timeline_weeks: {type: int, desc: Estimated timeline in weeks}
      start_after: {type: str, desc: "Implementation project that must finish first, if any"}
      scope: {type: str, desc: Scope summary}
      deliverables: {type: str, desc: Key deliverables}
      risks: {type: str, desc: Key risks}
      resource_plan: {type: str, desc: Resource plan summary}
      description: {type: str, desc: Full description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  programmes:
    key: programme_name
    cols:
      programme_name: {type: str, desc: "Programme name, e.g. ERP"}
      rag_status: {type: enum, values: [red, amber, green], desc: "Programme RAG status"}
      owner_id: {type: str, desc: Programme owner employee id}
      description: {type: str, desc: Programme description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

tools:
  # Write tools - create
  - name: create_project
    desc: Creates a project with owner, budget, dates and an initial task list. Returns the new project.
    kind: insert
    table: projects
    id_prefix: PRJ-
    defaults: {status: active}
    args:
      name: {required: true, desc: "Project name"}
      owner_id: {required: true, col: employee_id}
      start_date: {type: date, required: true}
      end_date: {type: date, required: true}
      budget_gbp: {type: float, default: 0}
      site_id: {}
      tasks: {desc: "Initial tasks, newline-separated, e.g. 'Re-slot fast movers to Leeds (owner EMP-00003)'"}
      description: {}
    example: {name: "Network efficiency fixes", owner_id: "EMP-00004", start_date: "+7d", end_date: "+120d", budget_gbp: 395000, site_id: DC1, tasks: "Rebalance DC3 stock to cut cross-shipping\nFix split-order allocation rules", description: "Deliver the top three network inefficiency fixes"}

  - name: create_project_task
    desc: Adds a task to a project backlog. Returns the new task.
    kind: insert
    table: project_tasks
    id_prefix: TSK-
    defaults: {status: open}
    args:
      project_id: {required: true}
      title: {required: true}
      assigned_to: {required: true, desc: "Employee id of assignee"}
      due_date: {required: true, type: date}
      priority: {type: enum, values: [low, medium, high, urgent], default: medium}
      description: {}
    example: {project_id: PRJ-000001, title: "Complete requirements", assigned_to: EMP-0042, due_date: "+30d", priority: high}

  - name: create_project_plan
    desc: Creates a project with its milestones and owners (one per line) and optional supplier. Returns the new project.
    kind: insert
    table: projects
    id_prefix: PRJ-
    defaults: {status: active}
    args:
      name: {required: true, desc: "Project name"}
      owner_id: {required: true, col: employee_id}
      start_date: {type: date, required: true}
      end_date: {type: date, required: true}
      milestones: {required: true, desc: "Milestones with owners, newline-separated, e.g. 'Baseline lead times agreed - owner EMP-00057 - week 4'"}
      supplier_id: {}
      budget_gbp: {type: float, default: 0}
      description: {}
