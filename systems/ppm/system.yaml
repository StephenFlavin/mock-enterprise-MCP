  - name: get_benefits_tracking
    desc: Benefits realisation status. For programme value tracking.
    kind: sql
    args:
      initiative_id: {}
      programme_name: {}
    sql: |
      SELECT benefit_id, programme_name, initiative_id, title, benefit_type, planned_gbp, realized_gbp,
             realization_date, forecast_date, status, owner_id,
             sum(planned_gbp) OVER () AS total_planned_gbp, sum(realized_gbp) OVER () AS total_realized_gbp
      FROM benefits_tracking
      WHERE ($initiative_id IS NULL OR initiative_id = $initiative_id)
        AND ($programme_name IS NULL OR programme_name = $programme_name)
      ORDER BY planned_gbp DESC
    limit: 50
    example: {}

  - name: get_initiative_confidence_and_dependencies
    desc: Confidence per cost saving initiative with the initiatives and other teams it depends on, and their status. For risk and sequencing.
    kind: sql
    args:
      initiative_id: {}
      status: {type: enum, values: [draft, active, in_progress, delivered, on_hold, archived, cancelled], desc: "Only this status; omit for all except archived and cancelled"}
    sql: |
      SELECT c.initiative_id, c.title, c.status, c.estimated_saving_gbp, c.confidence_pct,
             CASE WHEN c.confidence_pct >= 70 THEN 'high' WHEN c.confidence_pct >= 50 THEN 'medium' ELSE 'low' END AS confidence_rating,
             c.depends_on,
             (SELECT string_agg(d.initiative_id || ' ' || d.title || ' (' || d.status || ')', '; ')
                FROM cost_saving_initiatives d
               WHERE list_contains(string_split(replace(c.depends_on, ' ', ''), ','), d.initiative_id)) AS depends_on_initiatives,
             c.depends_on_team
      FROM cost_saving_initiatives c
      WHERE ($initiative_id IS NULL OR c.initiative_id = $initiative_id)
        AND ($status IS NULL AND c.status NOT IN ('archived', 'cancelled') OR c.status = $status)
      ORDER BY c.confidence_pct DESC, c.estimated_saving_gbp DESC
    limit: 50
    example: {}

  - name: get_implementation_cost_estimates
    desc: Cost, timeline, dependencies and regulation driver of reporting system projects, with totals. Filter by system or regulation. For investment planning.
    kind: sql
    args:
      system_name: {desc: "Words in the system name, e.g. ESG platform"}
      regulation_id: {desc: "Regulation the project is for, e.g. REG-EU-CSRD"}
    sql: |
      WITH RECURSIVE chain AS (
        SELECT impl_project_id, timeline_weeks AS finish_week FROM implementation_projects WHERE start_after IS NULL
        UNION ALL
        SELECT i.impl_project_id, c.finish_week + i.timeline_weeks
        FROM implementation_projects i JOIN chain c ON i.start_after = c.impl_project_id
      )
      SELECT p.impl_project_id, p.title, p.system_name, p.regulation_id, p.data_gap, p.cost_estimate_gbp, p.timeline_weeks,
             p.start_after, c.finish_week AS finish_week_if_sequenced, p.scope, p.deliverables, p.risks, p.resource_plan,
             sum(p.cost_estimate_gbp) OVER () AS total_cost_gbp, max(c.finish_week) OVER () AS overall_weeks
      FROM implementation_projects p JOIN chain c USING (impl_project_id)
      WHERE ($system_name IS NULL OR lower(p.system_name) LIKE '%' || lower($system_name) || '%')
        AND ($regulation_id IS NULL OR p.regulation_id = $regulation_id)
      ORDER BY p.cost_estimate_gbp DESC
    limit: 20
    example: {system_name: ESG platform}

  - name: get_migration_workstream_status
    desc: Migration progress by object and cycle. For programme tracking.
    kind: sql
    args:
      programme_name: {required: true}
      cycle: {}
    sql: |
      SELECT workstream_id, programme_name, name AS workstream_name, object_type, owner_id, status, cycle,
             planned_date, forecast_date, actual_date,
             CASE WHEN status = 'completed' THEN 0 ELSE greatest(date_diff('day', planned_date, forecast_date), 0) END AS days_behind,
             records_total, records_completed, data_quality_pct, issues_count
      FROM migration_workstreams
      WHERE programme_name = $programme_name
        AND ($cycle IS NULL OR cycle = $cycle)
      ORDER BY cycle, days_behind DESC, status
    limit: 30
    example: {programme_name: "ERP"}

  - name: get_programme_plan_milestones
    desc: Plan, milestones and forecast dates. For schedule tracking.
    kind: sql
    args:
      programme_name: {required: true}
