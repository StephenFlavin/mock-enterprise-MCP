id: ppm
name: Project & Portfolio Management Tool
instructions: >
  Project and programme management, capital planning, initiatives and benefits tracking.
  Project ids look like PRJ-000123, action items like ACT-000123.
  Use it for projects, milestones, RAID logs, capex decisions, initiatives and steering committee approvals.

tables:
  projects:
    key: project_id
    cols:
      project_id: {type: str, desc: "Project id, e.g. PRJ-000123"}
      name: {type: str, desc: Project name}
      owner_id: {type: str, desc: Project owner employee id}
      status: {type: enum, values: [draft, active, completed, on_hold, cancelled], desc: Project status}
      start_date: {type: date, desc: Planned start date}
      end_date: {type: date, desc: Planned end date}
      budget_gbp: {type: float, desc: Project budget in GBP}
      actual_cost_gbp: {type: float, desc: Actual spend to date}
      description: {type: str, desc: Project description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  project_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Task id, e.g. TSK-000123"}
      project_id: {type: str, desc: Parent project}
      title: {type: str, desc: Task title}
      assigned_to: {type: str, desc: Employee id of assignee}
      status: {type: enum, values: [open, in_progress, completed, blocked, cancelled], desc: Task status}
      due_date: {type: date, desc: Due date}
      priority: {type: enum, values: [low, medium, high, urgent], desc: Priority}
      description: {type: str, desc: Task description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  project_milestones:
    key: milestone_id
    cols:
      milestone_id: {type: str, desc: "Milestone id, e.g. MIL-000123"}
      project_id: {type: str, desc: Project (null for programme milestones)}
      programme_milestone_id: {type: str, desc: "Programme milestone, if programme-level"}
      title: {type: str, desc: Milestone title}
      due_date: {type: date, desc: Due date}
      forecast_date: {type: date, desc: Forecast date (if later than due date)}
      status: {type: enum, values: [on_track, at_risk, off_track, completed, cancelled], desc: Status}
      description: {type: str, desc: Milestone description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  raid_log_items:
    key: raid_id
    cols:
      raid_id: {type: str, desc: "RAID item id, e.g. RSD-000123"}
      project_id: {type: str, desc: Project (null for programme level)}
      item_type: {type: enum, values: [risk, action, issue, dependency], desc: Item type}
      title: {type: str, desc: Title}
      owner_id: {type: str, desc: Owner employee id}
      status: {type: enum, values: [open, in_progress, resolved, retired, on_hold], desc: Status}
      impact: {type: enum, values: [low, medium, high, critical], desc: Impact level}
      probability: {type: enum, values: [low, medium, high], desc: "Probability (risks only)"}
      mitigation_action: {type: str, desc: Mitigation or action}
      target_resolution_date: {type: date, desc: Target date}
      resolved_date: {type: date, desc: Date resolved}
      description: {type: str, desc: Full description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  cost_saving_initiatives:
    key: initiative_id
    cols:
      initiative_id: {type: str, desc: "Initiative id, e.g. CSI-000123"}
      title: {type: str, desc: Initiative title}
      owner_id: {type: str, desc: Initiative owner employee id}
      status: {type: enum, values: [draft, active, in_progress, delivered, on_hold, archived, cancelled], desc: Status}
      estimated_saving_gbp: {type: float, desc: Estimated annual saving in GBP}
      realized_saving_gbp: {type: float, desc: Realized saving to date}
      confidence_pct: {type: int, desc: Confidence level as percentage}
      category: {type: str, desc: "Savings category, e.g. procurement, labour, freight"}
      depends_on: {type: str, desc: "Comma-separated dependent initiative ids"}
      start_date: {type: date, desc: Start date}
      target_date: {type: date, desc: Target realization date}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  improvement_initiatives:
    key: improvement_id
    cols:
      improvement_id: {type: str, desc: "Improvement id, e.g. IMP-000123"}
      title: {type: str, desc: Initiative title}
      owner_id: {type: str, desc: Initiative owner employee id}
      status: {type: enum, values: [draft, active, in_progress, completed, on_hold, archived], desc: Status}
      site_id: {type: str, desc: Site focus (if applicable)}
      target_metric: {type: str, desc: "What is being improved, e.g. labour productivity"}
      current_value: {type: float, desc: Current performance value}
      target_value: {type: float, desc: Target performance value}
      unit: {type: str, desc: "Unit of measurement, e.g. units/hour, %"}
      team_members: {type: str, desc: "Comma-separated employee ids"}
      start_date: {type: date, desc: Start date}
      target_date: {type: date, desc: Target completion date}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  capex_proposals:
    key: proposal_id
    cols:
      proposal_id: {type: str, desc: "Proposal id, e.g. CAP-000123"}
      title: {type: str, desc: Proposal title}
      sponsor_id: {type: str, desc: Proposal sponsor employee id}
      status: {type: enum, values: [draft, submitted, under_review, approved, rejected, withdrawn, phased, descoped], desc: Status}
      capex_gbp: {type: float, desc: Capital expenditure in GBP}
      payback_years: {type: float, desc: Payback period in years}
      irr_pct: {type: float, desc: Internal rate of return as percentage}
      npv_gbp: {type: float, desc: Net present value in GBP}
      risk_rating: {type: enum, values: [low, medium, high], desc: Risk rating}
      site_id: {type: str, desc: Site affected (if applicable)"}
      business_case: {type: str, desc: Business case summary}
      key_assumptions: {type: str, desc: Key assumptions}
      sensitivity_10pct: {type: str, desc: Impact of 10% revenue miss}
      submission_date: {type: date, desc: Submitted for review date}
      decision_date: {type: date, desc: Decision date}
      description: {type: str, desc: Full description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  capex_projects:
    key: project_id
    cols:
      project_id: {type: str, desc: "Project id, e.g. CXP-000123"}
      title: {type: str, desc: Project title}
      sponsor_id: {type: str, desc: Project sponsor employee id}
      status: {type: enum, values: [planned, active, completed, on_hold, phased, descoped, cancelled], desc: Status}
      capex_gbp: {type: float, desc: Approved capex in GBP}
      actual_spend_gbp: {type: float, desc: Actual spend to date}
      planned_start: {type: date, desc: Planned start date}
      planned_end: {type: date, desc: Planned end date}
      forecast_end: {type: date, desc: Forecast end date}
      payback_years: {type: float, desc: Expected payback in years}
      irr_pct: {type: float, desc: Expected IRR as percentage}
      business_case: {type: str, desc: Business case reference}
      phasing: {type: str, desc: "Phasing plan, if phased, e.g. Phase 1 Q1, Phase 2 Q2"}
      site_id: {type: str, desc: Site affected}
      description: {type: str, desc: Project description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  pilot_projects:
    key: pilot_id
    cols:
      pilot_id: {type: str, desc: "Pilot id, e.g. PIL-000123"}
      title: {type: str, desc: Pilot title}
      material_id: {type: str, desc: "Material or candidate being piloted"}
      owner_id: {type: str, desc: Pilot owner employee id}
      status: {type: enum, values: [planning, approved, in_progress, completed, cancelled], desc: Status}
      test_partner: {type: str, desc: "Test lab or partner running pilot"}
      budget_gbp: {type: float, desc: Pilot budget}
      actual_cost_gbp: {type: float, desc: Actual spend}
      planned_start: {type: date, desc: Planned start date}
      planned_end: {type: date, desc: Planned end date}
      actual_end: {type: date, desc: Actual end date}
      pass_criteria: {type: text, desc: Pass/fail criteria}
      result: {type: enum, values: [pass, fail, inconclusive, pending], desc: Pilot result}
      outcome: {type: str, desc: Summary outcome}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  market_entry_projects:
    key: project_id
    cols:
      project_id: {type: str, desc: "Project id, e.g. MEP-000123"}
      title: {type: str, desc: Project title}
      countries: {type: str, desc: "Comma-separated country codes"}
      owner_id: {type: str, desc: Project owner employee id}
      status: {type: enum, values: [planning, approved, in_progress, completed, cancelled], desc: Status}
      scope: {type: str, desc: "Product range or business model"}
      planned_launch: {type: date, desc: Planned launch date}
      budget_gbp: {type: float, desc: Project budget}
      workstreams: {type: str, desc: "Key workstreams, comma-separated"}
      description: {type: str, desc: Project description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  action_items:
    key: action_id
    cols:
      action_id: {type: str, desc: "Action item id, e.g. ACT-000123"}
      title: {type: str, desc: Action title}
      owner_id: {type: str, desc: Owner employee id}
      status: {type: enum, values: [open, in_progress, completed, on_hold, cancelled], desc: Status}
      priority: {type: enum, values: [low, medium, high, urgent], desc: Priority}
      due_date: {type: date, desc: Due date}
      source: {type: str, desc: "Source, e.g. question id or RAID item"}
      category: {type: str, desc: "Category, e.g. budget, compliance, performance"}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  artwork_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Task id, e.g. AWK-000123"}
      title: {type: str, desc: Task title}
      owner_id: {type: str, desc: Owner employee id}
      status: {type: enum, values: [draft, assigned, in_progress, review, completed, cancelled], desc: Status}
      agency: {type: str, desc: "Design agency name"}
      due_date: {type: date, desc: Due date}
      checklist: {type: text, desc: Task checklist items}
      deliverables: {type: str, desc: What is being delivered}
      requirements: {type: str, desc: Key requirements and compliance items}
      description: {type: str, desc: Task description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  programme_milestones:
    key: milestone_id
    cols:
      milestone_id: {type: str, desc: "Milestone id, e.g. PRM-000123"}
      programme_name: {type: str, desc: "Programme name, e.g. ERP"}
      title: {type: str, desc: Milestone title}
      sequence: {type: int, desc: Sequence in plan}
      due_date: {type: date, desc: Due date}
      forecast_date: {type: date, desc: Forecast date}
      status: {type: enum, values: [planned, on_track, at_risk, off_track, completed, cancelled], desc: Status}
      dependencies: {type: str, desc: "Dependent milestone ids"}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  cutover_options:
    key: option_id
    cols:
      option_id: {type: str, desc: "Option id, e.g. CUT-000123"}
      programme_name: {type: str, desc: "Programme name"}
      option_name: {type: str, desc: "Cutover option, e.g. big bang, phased by region"}
      status: {type: enum, values: [active, inactive, completed, deleted], desc: Status}
      description: {type: str, desc: Option description}
      risk_level: {type: enum, values: [low, medium, high], desc: Risk level}
      estimated_duration_days: {type: int, desc: Estimated duration}
      requires_parallel_run: {type: bool, desc: Requires parallel run}
      rollback_feasible: {type: bool, desc: Rollback possible}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  automation_options:
    key: option_id
    cols:
      option_id: {type: str, desc: "Option id, e.g. AUT-000123"}
      site_id: {type: str, desc: Site}
      title: {type: str, desc: Option title}
      description: {type: str, desc: Description}
      capex_gbp: {type: float, desc: Capital cost}
      lead_time_weeks: {type: int, desc: Lead time in weeks}
      payback_years: {type: float, desc: Payback period}
      annual_saving_gbp: {type: float, desc: Annual operating saving}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  steering_decisions:
    key: decision_id
    cols:
      decision_id: {type: str, desc: "Decision id, e.g. DEC-000123"}
      programme_name: {type: str, desc: "Programme name"}
      title: {type: str, desc: Decision title}
      status: {type: enum, values: [pending, approved, rejected, deferred], desc: Status}
      due_date: {type: date, desc: Decision due date}
      options: {type: str, desc: "Available options"}
      recommendation: {type: str, desc: Recommendation}
      decision: {type: str, desc: "Decision made"}
      rationale: {type: str, desc: Decision rationale}
      owner_id: {type: str, desc: Decision owner employee id}
      description: {type: str, desc: Full description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  benefits_tracking:
    key: benefit_id
    cols:
      benefit_id: {type: str, desc: "Benefit id, e.g. BEN-000123"}
      initiative_id: {type: str, desc: "Initiative id (capex, CSI, etc)"}
      title: {type: str, desc: Benefit title}
      benefit_type: {type: enum, values: [financial, operational, strategic], desc: Benefit type}
      planned_gbp: {type: float, desc: Planned benefit in GBP}
      realized_gbp: {type: float, desc: Realized to date}
      realization_date: {type: date, desc: Target realization date}
      forecast_date: {type: date, desc: Forecast realization date}
      status: {type: enum, values: [on_track, at_risk, off_track, delivered], desc: Status}
      owner_id: {type: str, desc: Owner employee id}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  migration_workstreams:
    key: workstream_id
    cols:
      workstream_id: {type: str, desc: "Workstream id, e.g. MWS-000123"}
      programme_name: {type: str, desc: "Programme name"}
      name: {type: str, desc: Workstream name}
      object_type: {type: str, desc: "Object being migrated, e.g. customer master, purchase orders"}
      status: {type: enum, values: [planning, extracting, transforming, validating, loading, completed], desc: Migration status}
      cycle: {type: int, desc: "Migration cycle number"}
      planned_date: {type: date, desc: Planned completion date}
      actual_date: {type: date, desc: Actual completion date}
      records_total: {type: int, desc: Total records to migrate}
      records_completed: {type: int, desc: Records completed}
      data_quality_pct: {type: int, desc: Data quality score"}
      issues_count: {type: int, desc: Open issues}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  test_cycles:
    key: cycle_id
    cols:
      cycle_id: {type: str, desc: "Cycle id, e.g. TYC-000123"}
      programme_name: {type: str, desc: "Programme name"}
      cycle_name: {type: str, desc: "Cycle name, e.g. UAT cycle 1"}
      status: {type: enum, values: [planning, active, completed, suspended], desc: Status}
      scheduled_start: {type: date, desc: Scheduled start}
      scheduled_end: {type: date, desc: Scheduled end}
      actual_start: {type: date, desc: Actual start}
      actual_end: {type: date, desc: Actual end}
      total_tests: {type: int, desc: Total test cases}
      tests_passed: {type: int, desc: Tests passed}
      tests_failed: {type: int, desc: Tests failed}
      tests_blocked: {type: int, desc: Tests blocked}
      pass_rate_pct: {type: float, desc: Pass rate percentage}
      description: {type: str, desc: Description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

  implementation_projects:
    key: project_id
    cols:
      project_id: {type: str, desc: "Project id, e.g. IPT-000123"}
      title: {type: str, desc: Project title}
      system_name: {type: str, desc: "System being implemented"}
      owner_id: {type: str, desc: Project owner employee id}
      cost_estimate_gbp: {type: float, desc: Cost estimate in GBP}
      timeline_weeks: {type: int, desc: Estimated timeline in weeks}
      scope: {type: str, desc: Scope summary}
      deliverables: {type: str, desc: Key deliverables}
      risks: {type: str, desc: Key risks}
      resource_plan: {type: str, desc: Resource plan summary}
      description: {type: str, desc: Full description}
      created_at: {type: timestamp, desc: Created timestamp}
      updated_at: {type: timestamp, desc: Last updated}

tools:
  # Write tools - create
  - name: create_project
    desc: Creates a project with owner and tasks. Returns the new project.
    kind: insert
    table: projects
    id_prefix: PRJ-
    defaults: {status: active}
    args:
      name: {required: true, desc: "Project name"}
      owner_id: {required: true, desc: "Project owner employee id"}
      start_date: {type: date, required: true}
      end_date: {type: date, required: true}
      budget_gbp: {type: float, default: 0}
      description: {}
    example: {name: "New Project", owner_id: "EMP-0001", start_date: "-30d", end_date: "+120d", budget_gbp: 1500000, description: "Project description"}

  - name: create_project_task
    desc: Adds a task to a project backlog. Returns the new task.
    kind: insert
    table: project_tasks
    id_prefix: TSK-
    defaults: {status: open}
    args:
      project_id: {required: true}
      title: {required: true}
      assigned_to: {required: true, desc: "Employee id of assignee"}
      due_date: {required: true, type: date}
      priority: {type: enum, values: [low, medium, high, urgent], default: medium}
      description: {}
    example: {project_id: PRJ-000001, title: "Complete requirements", assigned_to: EMP-0042, due_date: "+30d", priority: high}

  - name: create_project_plan
    desc: Creates a project with milestones and owners. Returns the new project.
    kind: insert
    table: projects
    id_prefix: PRJ-
    defaults: {status: active}
    args:
      name: {required: true, desc: "Project name"}
      owner_id: {required: true, desc: "Project owner employee id"}
      start_date: {type: date, required: true}
      end_date: {type: date, required: true}
      budget_gbp: {type: float, default: 0}
      description: {}
    example: {name: "Market Entry Programme", owner_id: "EMP-0001", start_date: "-30d", end_date: "+180d", budget_gbp: 2500000, description: "Project plan with milestones"}

  - name: create_raid_log_item
    desc: Adds a risk, issue or dependency to the RAID log. Returns the new item.
    kind: insert
    table: raid_log_items
    id_prefix: RSD-
    defaults: {status: open}
    args:
      project_id: {}
      item_type: {required: true, type: enum, values: [risk, action, issue, dependency]}
      title: {required: true}
      owner_id: {required: true, desc: "Employee id of owner"}
      impact: {type: enum, values: [low, medium, high, critical], default: medium}
      probability: {type: enum, values: [low, medium, high]}
      target_resolution_date: {type: date}
      description: {}
    example: {project_id: PRJ-000001, item_type: risk, title: "Supplier delay risk", owner_id: EMP-0042, impact: high, probability: medium, target_resolution_date: "+30d", description: "Component availability uncertain"}

  - name: create_cost_saving_initiative
    desc: Adds a new initiative with owner and estimated saving to the tracker. Returns the new initiative.
    kind: insert
    table: cost_saving_initiatives
    id_prefix: CSI-
    defaults: {status: draft}
    args:
      title: {required: true}
      owner_id: {required: true, desc: "Initiative owner employee id"}
      estimated_saving_gbp: {required: true, type: float}
      category: {required: true, desc: "Savings category, e.g. procurement, labour"}
      confidence_pct: {type: int, default: 50}
      target_date: {type: date}
      description: {}
    example: {title: "Freight rate negotiation", owner_id: EMP-0042, estimated_saving_gbp: 750000, category: "freight", confidence_pct: 75, target_date: "+90d", description: "Negotiate 12% reduction with carriers"}

  - name: create_improvement_initiative
    desc: Creates an improvement initiative with owners and targets. Returns the new initiative.
    kind: insert
    table: improvement_initiatives
    id_prefix: IMP-
    defaults: {status: active}
    args:
      title: {required: true}
      owner_id: {required: true}
      target_metric: {required: true, desc: "What metric is being improved"}
      current_value: {required: true, type: float}
      target_value: {required: true, type: float}
      unit: {required: true, desc: "Unit of measurement"}
      target_date: {type: date, required: true}
      site_id: {}
    example: {title: "Productivity Recovery", owner_id: "EMP-0001", target_metric: "labour productivity", current_value: 85, target_value: 100, unit: "units/hour", target_date: "+180d"}

  - name: create_pilot_project
    desc: Creates a pilot project with tasks, budget and pass-fail criteria for a material. Returns the new pilot.
    kind: insert
    table: pilot_projects
    id_prefix: PIL-
    defaults: {status: planning}
    args:
      title: {required: true}
      material_id: {required: true, desc: "Material or candidate being tested"}
      owner_id: {required: true}
      test_partner: {required: true, desc: "Test lab or partner"}
      budget_gbp: {required: true, type: float}
      planned_start: {type: date, required: true}
      planned_end: {type: date, required: true}
      pass_criteria: {type: text, required: true, desc: "Pass/fail criteria"}
    example: {title: "Sustainable Packaging Pilot", material_id: MAT-00523, owner_id: EMP-0042, test_partner: "Smithers Rapra", budget_gbp: 45000, planned_start: "+14d", planned_end: "+60d", pass_criteria: "Tensile strength >= 50MPa, tear resistance within 5%, cost <= 12pence per unit"}

  - name: create_market_entry_project
    desc: Creates a market entry project with workstreams. Returns the new project.
    kind: insert
    table: market_entry_projects
    id_prefix: MEP-
    defaults: {status: planning}
    args:
      title: {required: true}
      countries: {required: true, desc: "Country codes, comma-separated"}
      owner_id: {required: true}
      scope: {required: true, desc: "Product range or business model"}
      planned_launch: {type: date, required: true}
      budget_gbp: {required: true, type: float}
      workstreams: {desc: "Workstream names, comma-separated"}
    example: {title: "Eastern Europe Expansion", countries: "PL,CZ", owner_id: EMP-0042, scope: "Home range", planned_launch: "+240d", budget_gbp: 5000000, workstreams: "Regulatory compliance,Product adaptation,Supply chain setup,Local partnerships"}

  - name: create_action_item
    desc: Creates an action assigned to a named owner with a due date. Returns the new action.
    kind: insert
    table: action_items
    id_prefix: ACT-
    defaults: {status: open}
    args:
      title: {required: true}
      owner_id: {required: true}
      due_date: {required: true, type: date}
      priority: {type: enum, values: [low, medium, high, urgent], default: medium}
      category: {desc: "Action category"}
      source: {desc: "Source of action, e.g. question id"}
      description: {}
    example: {title: "Review budget variance", owner_id: EMP-0042, due_date: "+7d", priority: high, category: "budget", description: "Explain 14% overspend in facilities"}

  - name: create_artwork_task
    desc: Creates an artwork task for the design agency with checklist attached. Returns the new task.
    kind: insert
    table: artwork_tasks
    id_prefix: AWK-
    defaults: {status: draft}
    args:
      title: {required: true}
      owner_id: {required: true}
      agency: {required: true, desc: "Design agency name"}
      due_date: {required: true, type: date}
      checklist: {type: text, required: true, desc: "Checklist items, newline-separated"}
      deliverables: {desc: "What will be delivered"}
      requirements: {desc: "Key requirements and compliance"}
    example: {title: "Cosmetics Packaging - France/Germany/Italy", owner_id: EMP-0042, agency: "Brand Design Studio", due_date: "+45d", checklist: "Legal marks compliance\nRecycling labels (all three countries)\nLanguage requirements (FR/DE/IT)\nWarning symbols\nNutrition format (if applicable)", deliverables: "3 packaging layouts (one per country)", requirements: "EU Cosmetics Regulation compliance, local language requirements"}

  - name: create_programme_milestone
    desc: Adds a milestone to the programme plan. Returns the new milestone.
    kind: insert
    table: programme_milestones
    id_prefix: PRM-
    defaults: {status: planned}
    args:
      programme_name: {required: true}
      title: {required: true}
      sequence: {type: int, required: true}
      due_date: {required: true, type: date}
      dependencies: {desc: "Dependent milestone ids"}
      description: {}
    example: {programme_name: "ERP", title: "Data migration complete", sequence: 5, due_date: "+90d", dependencies: "PRM-000001,PRM-900002", description: "All master data and transactions migrated and validated"}

  # Write tools - update
  - name: update_initiative_status
    desc: Changes the status of an initiative, e.g. to on hold. Returns old and new status.
    kind: update
    table: cost_saving_initiatives
    set: {status: "{status}"}
    args:
      status: {required: true, type: enum, values: [draft, active, in_progress, delivered, on_hold, archived, cancelled], desc: "New status"}
    example: {initiative_id: CSI-000001, status: on_hold}

  - name: archive_cost_saving_initiative
    desc: Archives an initiative so it leaves the active list. Returns the archived initiative.
    kind: update
    table: cost_saving_initiatives
    set: {status: archived}
    args: {}
    example: {initiative_id: CSI-000001}

  - name: cancel_capex_proposal
    desc: Withdraws a proposal from the capital queue. Returns the old and new status.
    kind: update
    table: capex_proposals
    set: {status: withdrawn}
    args: {}
    example: {proposal_id: CAP-000001}

  - name: cancel_capex_project
    desc: Cancels a capex project and releases its budget. Returns the old and new status.
    kind: update
    table: capex_projects
    set: {status: cancelled}
    args: {}
    example: {project_id: CXP-000001}

  - name: update_capex_project_status
    desc: Sets the status or phasing of a capex project. Returns old and new status.
    kind: update
    table: capex_projects
    set: {status: "{status}"}
    args:
      status: {required: true, type: enum, values: [planned, active, completed, on_hold, phased, descoped, cancelled], desc: "New status"}
      phasing: {desc: "Phasing plan if phased"}
    example: {project_id: CXP-000001, status: phased, phasing: "Phase 1 Q1 2027, Phase 2 Q2 2027"}

  - name: update_raid_log_item
    desc: Updates the status or details of a RAID log item. Returns the updated item.
    kind: update
    table: raid_log_items
    set: {status: "{status}"}
    args:
      status: {required: true, type: enum, values: [open, in_progress, resolved, retired, on_hold], desc: "New status"}
      mitigation_action: {desc: "Updated mitigation or action"}
    example: {raid_id: RSD-000001, status: in_progress, mitigation_action: "Supplier capacity confirmed for October shipment"}

  - name: update_programme_status_rag
    desc: Sets the RAG status of a programme. Returns the new status and timestamp.
    kind: update
    table: programme_milestones
    set: {status: "{status}"}
    args:
      status: {required: true, type: enum, values: [planned, on_track, at_risk, off_track, completed, cancelled], desc: "New status"}
    example: {milestone_id: "PRM-000001", status: "at_risk"}

  - name: delete_cutover_option
    desc: Removes an option from the cutover plan. Returns confirmation.
    kind: update
    table: cutover_options
    set: {status: deleted}
    args: {}
    example: {option_id: CUT-000001}

  - name: submit_capex_case_for_review
    desc: Submits a capex case to the capex committee queue. Returns the proposal with submitted status.
    kind: update
    table: capex_proposals
    set: {status: submitted, submission_date: "$as_of"}
    args: {}
    example: {proposal_id: CAP-000001}

  - name: submit_investment_request
    desc: Submits a funding request for an initiative for approval. Returns confirmation.
    kind: update
    table: cost_saving_initiatives
    set: {status: active}
    args: {}
    example: {initiative_id: "CSI-000001"}

  - name: reassign_programme_task
    desc: Changes the owner of a programme task. Returns the updated task.
    kind: update
    table: projects
    set: {owner_id: "{owner_id}"}
    args:
      owner_id: {required: true, desc: "New owner employee id"}
    example: {project_id: "PRJ-000001", owner_id: "EMP-0002"}

  # Read tools - select
  - name: list_cost_saving_initiatives
    desc: Cost saving initiatives with owners and status. For prioritisation and tracking.
    kind: select
    from: cost_saving_initiatives
    filters:
      status: {default: active}
    columns: [initiative_id, title, owner_id, status, estimated_saving_gbp, confidence_pct, target_date]
    order: estimated_saving_gbp DESC
    limit: 50
    example: {status: active}

  - name: list_raid_log_items
    desc: RAID items with status, owner and last action. For programme health tracking.
    kind: select
    from: raid_log_items
    filters:
      item_type: {}
      status: {default: open}
      project_id: {}
    columns: [raid_id, project_id, item_type, title, owner_id, status, impact, target_resolution_date, updated_at]
    order: impact DESC, updated_at DESC
    limit: 50
    example: {status: open}

  - name: list_project_milestones_for_site
    desc: Rollout milestones and dates by site. For tracking phased implementations.
    kind: select
    from: project_milestones
    filters:
      status: {}
    columns: [milestone_id, project_id, title, due_date, forecast_date, status]
    order: due_date
    limit: 30
    example: {}

  - name: list_steering_committee_decisions_required
    desc: Open decisions awaiting steering committee. For governance tracking.
    kind: select
    from: steering_decisions
    filters:
      status: {default: pending}
      programme_name: {}
    columns: [decision_id, programme_name, title, due_date, recommendation, owner_id]
    order: due_date ASC
    limit: 30
    example: {status: pending}

  - name: list_migration_defects_and_blockers
    desc: Open migration defects and blockers. For migration risk tracking.
    kind: sql
    args:
      programme_name: {required: true}
      workstream_id: {}
    sql: |
      SELECT workstream_id, programme_name, name AS workstream_name, object_type,
             records_total, records_completed, data_quality_pct, issues_count, status, updated_at
      FROM migration_workstreams
      WHERE programme_name = $programme_name
        AND ($workstream_id IS NULL OR workstream_id = $workstream_id)
        AND (status != 'completed' OR issues_count > 0)
      ORDER BY issues_count DESC, updated_at DESC
    limit: 30
    example: {programme_name: "ERP"}

  # Read tools - sql (get/calculate)
  - name: get_capex_proposal
    desc: Capex proposal, costs and benefits case. For investment decision making.
    kind: sql
    args:
      proposal_id: {required: true}
    sql: |
      SELECT proposal_id, title, sponsor_id, status, capex_gbp, payback_years, irr_pct, npv_gbp,
             risk_rating, site_id, business_case, key_assumptions, sensitivity_10pct, submission_date, decision_date
      FROM capex_proposals
      WHERE proposal_id = $proposal_id
    limit: 1
    example: {proposal_id: CAP-000001}

  - name: get_capex_project_business_cases
    desc: Business cases for capex projects. For portfolio review and ranking.
    kind: sql
    args:
      site_id: {}
      status: {default: active}
    sql: |
      SELECT project_id, title, sponsor_id, capex_gbp, payback_years, irr_pct,
             actual_spend_gbp, planned_start, planned_end, forecast_end, status
      FROM capex_projects
      WHERE ($site_id IS NULL OR site_id = $site_id)
        AND status = $status
      ORDER BY irr_pct DESC, capex_gbp DESC
    limit: 20
    example: {status: active}

  - name: get_capital_project_proposals
    desc: Candidate capital projects and cases. For budget allocation decisions.
    kind: select
    from: capex_proposals
    filters:
      status: {default: submitted}
      risk_rating: {}
    columns: [proposal_id, title, capex_gbp, payback_years, irr_pct, npv_gbp, risk_rating, status]
    order: npv_gbp DESC
    limit: 20
    example: {status: submitted}

  - name: get_cutover_plan
    desc: Cutover plan, freeze windows and dependencies. For go-live planning.
    kind: sql
    args:
      programme_name: {required: true}
    sql: |
      SELECT option_id, programme_name, option_name, status, description, risk_level,
             estimated_duration_days, requires_parallel_run, rollback_feasible
      FROM cutover_options
      WHERE programme_name = $programme_name
      ORDER BY option_name
    limit: 20
    example: {programme_name: "ERP"}

  - name: get_automation_option_cost_estimate
    desc: Cost and lead time of automation options. For labour-cost decisions at peak.
    kind: sql
    args:
      site_id: {required: true}
    sql: |
      SELECT option_id, title, capex_gbp, lead_time_weeks, payback_years, annual_saving_gbp
      FROM automation_options
      WHERE site_id = $site_id
      ORDER BY payback_years, lead_time_weeks
    limit: 10
    example: {site_id: DC1}

  - name: get_benefits_tracking
    desc: Benefits realisation status. For programme value tracking.
    kind: sql
    args:
      initiative_id: {}
    sql: |
      SELECT benefit_id, initiative_id, title, benefit_type, planned_gbp, realized_gbp,
             realization_date, forecast_date, status, owner_id
      FROM benefits_tracking
      WHERE $initiative_id IS NULL OR initiative_id = $initiative_id
      ORDER BY planned_gbp DESC
    limit: 50
    example: {}

  - name: get_initiative_confidence_and_dependencies
    desc: Confidence rating and dependencies per initiative. For risk and sequencing.
    kind: sql
    args:
      initiative_id: {}
    sql: |
      SELECT initiative_id, title, status, confidence_pct, depends_on, estimated_saving_gbp
      FROM cost_saving_initiatives
      WHERE $initiative_id IS NULL OR initiative_id = $initiative_id
      ORDER BY confidence_pct DESC, estimated_saving_gbp DESC
    limit: 50
    example: {}

  - name: get_implementation_cost_estimates
    desc: Cost and timeline of reporting system projects. For investment planning.
    kind: sql
    args:
      system_name: {}
    sql: |
      SELECT project_id, title, system_name, cost_estimate_gbp, timeline_weeks, scope, deliverables
      FROM implementation_projects
      WHERE $system_name IS NULL OR system_name = $system_name
      ORDER BY cost_estimate_gbp DESC
    limit: 20
    example: {}

  - name: get_migration_workstream_status
    desc: Migration progress by object and cycle. For programme tracking.
    kind: sql
    args:
      programme_name: {required: true}
      cycle: {}
    sql: |
      SELECT workstream_id, programme_name, name AS workstream_name, object_type, status, cycle,
             records_total, records_completed, data_quality_pct, issues_count, actual_date
      FROM migration_workstreams
      WHERE programme_name = $programme_name
        AND ($cycle IS NULL OR cycle = $cycle)
      ORDER BY cycle, status
    limit: 30
    example: {programme_name: "ERP"}

  - name: get_programme_plan_milestones
    desc: Plan, milestones and forecast dates. For schedule tracking.
    kind: sql
    args:
      programme_name: {required: true}
    sql: |
      SELECT milestone_id, programme_name, title, sequence, due_date, forecast_date, status, dependencies
      FROM programme_milestones
      WHERE programme_name = $programme_name
      ORDER BY sequence
    limit: 50
    example: {programme_name: "ERP"}

  - name: get_programme_resource_plan
    desc: Resource plan and availability by workstream. For capacity planning.
    kind: py
    fn: get_programme_resource_plan
    args:
      programme_name: {required: true}
    example: {programme_name: "ERP"}

  - name: get_project_cost_estimate
    desc: Cost estimate and resource plan for a delivery project. For business case and planning.
    kind: sql
    args:
      project_id: {required: true}
    sql: |
      SELECT project_id, name, budget_gbp, actual_cost_gbp, start_date, end_date, owner_id, status
      FROM projects
      WHERE project_id = $project_id
    limit: 1
    example: {project_id: PRJ-000001}

  - name: get_project_delivery_risk
    desc: Delivery risk rating and issues per project. For governance and tracking.
    kind: sql
    args:
      project_id: {required: true}
    sql: |
      SELECT r.raid_id, p.project_id, p.name, r.item_type, r.title, r.impact, r.status, r.owner_id
      FROM raid_log_items r
      JOIN projects p ON r.project_id = p.project_id
      WHERE p.project_id = $project_id
        AND r.status IN ('open', 'in_progress')
      ORDER BY r.impact DESC, r.updated_at DESC
    limit: 30
    example: {project_id: PRJ-000001}

  - name: get_project_dependencies
    desc: Dependencies between projects and programmes. For sequencing and critical path.
    kind: sql
    args:
      project_id: {}
    sql: |
      SELECT raid_id, project_id, title, item_type, target_resolution_date, status
      FROM raid_log_items
      WHERE item_type = 'dependency'
        AND ($project_id IS NULL OR project_id = $project_id)
      ORDER BY target_resolution_date, status
    limit: 50
    example: {}

  - name: get_test_cycle_pass_rates
    desc: Test execution and pass rates. For quality gates.
    kind: sql
    args:
      programme_name: {required: true}
      cycle_name: {}
    sql: |
      SELECT cycle_id, programme_name, cycle_name, status, total_tests, tests_passed, tests_failed,
             tests_blocked, pass_rate_pct, scheduled_start, scheduled_end
      FROM test_cycles
      WHERE programme_name = $programme_name
        AND ($cycle_name IS NULL OR cycle_name = $cycle_name)
      ORDER BY cycle_name DESC
    limit: 20
    example: {programme_name: "ERP"}

  # Read tools - draft/py
  - name: draft_pilot_pass_fail_criteria
    desc: Draft pilot pass fail criteria. For defining test success metrics.
    kind: py
    fn: draft_pilot_pass_fail_criteria
    args:
      material_id: {required: true}
    example: {material_id: MAT-00523}

  - name: run_programme_scenario
    desc: Re-plan the programme under a scope, date or resource change. For trade-off analysis.
    kind: py
    fn: run_programme_scenario
    args:
      programme_name: {required: true}
      scenario_type: {required: true, type: enum, values: [scope_reduction, date_slip, resource_change], desc: "Type of change"}
      parameter: {required: true, desc: "Change parameter, e.g. number of weeks"}
    example: {programme_name: "ERP", scenario_type: date_slip, parameter: "6"}

  - name: search_test_labs_and_pilot_partners
    desc: Search for test labs and pilot partners. For finding capability.
    kind: py
    fn: search_test_labs_and_pilot_partners
    args:
      material_type: {required: true, desc: "Type of material to test"}
      capability: {desc: "Required capability, e.g. tensile testing"}
    example: {material_type: packaging, capability: "tensile strength testing"}
