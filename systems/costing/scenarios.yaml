      expect: ["tooling_per_unit_gbp"]
    - tool: calculate_fix_cost_and_lead_time_for_sku
      args: {sku: SKU-100007}
      expect: ["total_fixed_costs_per_unit_gbp"]

- question: "06:58:Q3"
