# Scenario tests for costing system tools (25 tools, Stage 1 of 3)

- question: "02:13:Q1"
  story: >
    Style 7731 is three weeks late, a key winter promo line with 6,000 units.
    Air freight costs £8.50/unit vs sea at £1.20/unit. Evaluate the margin impact
    and sales risk if delayed, plus a partial 3,000-unit air option.
  checks:
    - tool: calculate_air_vs_sea_margin_impact
      args: {style_id: STY-7731, volume_units: 6000, air_freight_cost_gbp: 8.5, sea_freight_cost_gbp: 1.2}
      expect: ["air_cost_premium_gbp"]
    - tool: calculate_lost_sales_if_delayed
      args: {style_id: STY-7731, delay_weeks: 3, volume_units: 6000}
      expect: ["estimated_lost_units"]
    - tool: calculate_margin_at_volumes
      args: {style_id: STY-7731, volume_units: 3000}
      expect: ["margin_at_volume_gbp"]

- question: "02:21:Q2"
  story: >
    Electronics returns need disposition routing. Evaluate recovery routes by
    age band (0-30d, 31-60d, 61-180d, 180d+) for handling cost and time to realise.
  checks:
    - tool: calculate_recovered_value_by_route
      args: {category: Electronics, cost_per_unit_gbp: 25}
      expect: ["route_name", "recovered_value_gbp"]
    - tool: calculate_recovery_potential_for_lines
      args: {category: Electronics, min_age_days: 180}
      expect: ["route_name"]
    - tool: calculate_date_recovery_cost
      args: {route_id: ROU-RESTOCK, category: Electronics, age_band: "0-30d"}
      expect: ["recovery_rate_pct"]

- question: "03:25:Q1"
  story: >
    Women's knitwear margin below plan. Bridge into cost, FX, mix and supplier
    drivers. Evaluate season-end projection if trends continue.
  checks:
    - tool: calculate_margin_variance_by_driver
      args: {category: "Dresses"}
      expect: ["cost_driver_pct"]
    - tool: calculate_margin_bridge
      args: {category: "Dresses"}
      expect: ["total_variance_pct"]
    - tool: calculate_end_of_season_margin_projection
      args: {category: "Dresses", weeks_remaining: 8}
      expect: ["projected_season_margin_pct"]

- question: "03:29:Q5"
  story: >
    Old small appliance stock aged 180+ days. Evaluate recovery options by route
    (restocking, outlet, liquidation) and identify best disposition choice.
  checks:
    - tool: calculate_recovered_value_by_route
      args: {category: "Dresses", cost_per_unit_gbp: 8}
      expect: ["recovered_value_gbp"]

- question: "03:31:Q1"
  story: >
    Network expansion: second DC adds £2.5M fixed cost/year. Each SKU contributes
    £12.50 gross margin. Calculate break-even volume.
  checks:
    - tool: calculate_break_even_volume
      args: {fixed_cost_gbp: 2500000, contribution_margin_gbp: 12.5}
      expect: ["break_even_units", "200000"]

- question: "04:32:Q2"
  story: >
    304 stainless steel commodity price up 4%. Bottles have steel cost exposure.
    Calculate product cost impact from commodity price change.
  checks:
    - tool: calculate_commodity_cost_exposure
      args: {sku: K-1700, commodity_price_change_pct: 4}
      expect: ["product_cost_impact_pct"]

- question: "04:32:Q4"
  story: >
    Competitor 750ml bottle £24.99 retail. Our cost £8.00. Target 55% margin
    implies target cost. Calculate price floor and margin budget allocation.
  checks:
    - tool: calculate_target_cost
      args: {retail_price_gbp: 24.99, target_margin_pct: 55}
      expect: ["target_cost_gbp"]
    - tool: calculate_price_floor_from_cost
      args: {total_cost_gbp: 8.0, target_margin_pct: 55}
      expect: ["minimum_retail_price_gbp"]

- question: "04:32:Q8"
  story: >
    Small appliances buying margin down 2.5pts YoY. Bridge by cost, FX, mix and
    supplier drivers. Identify main cost drivers for renegotiation potential.
  checks:
    - tool: calculate_margin_bridge
      args: {category: "Dresses"}
      expect: ["cost_driver_pct"]

- question: "04:34:Q1"
  story: >
    Nearshore evaluation: Portugal costs 12% premium over Vietnam but 4-week lead
    time saves 3% markdown. Calculate break-even markdown reduction needed.
  checks:
    - tool: calculate_markdown_breakeven
      args: {cost_increase_pct: 12, current_markdown_pct: 15}
      expect: ["markdown_reduction_needed_pct"]

- question: "04:34:Q5"
  story: >
    Nearshore quotes 35% above baseline. Target cost for £49.99 retail at 55% margin.
    Break down material, labour and overhead budgets.
  checks:
    - tool: calculate_target_cost
      args: {retail_price_gbp: 49.99, target_margin_pct: 55}
      expect: ["material_budget_gbp", "labour_budget_gbp"]

- question: "04:39:Q3"
  story: >
    Fabric cost up 9% but cotton only up 4%. Variance bridge shows supplier premium
    and freight impact. Calculate cost variance drivers.
  checks:
    - tool: calculate_cost_variance_bridge
      args: {category: Apparel}
      expect: ["total_cost_variance_pct"]

- question: "04:39:Q4"
  story: >
    Oil shock scenario: polyester +20%. Calculate cost and margin impact by product
    category and exposure level.
  checks:
    - tool: calculate_commodity_shock_impact_by_category
      args: {commodity: polyester, shock_pct: 20}
      expect: ["avg_cost_impact_pct_of_product"]

- question: "06:51:Q2"
  story: >
    New product sourcing: baseline Vietnam vs nearshore Portugal. Calculate garment
    cost breakdown by fabric component and labour allocation.
  checks:
    - tool: calculate_garment_cost_by_fabric
      args: {style_id: STY-5520}
      expect: ["component_type"]

- question: "06:58:Q1"
  story: >
    Fix-and-forget costing: £15,000 tooling over 50,000 unit lifetime.
    Calculate tooling amortisation and total fixed cost per unit.
  checks:
    - tool: calculate_tooling_amortisation_per_unit
      args: {tooling_cost_gbp: 15000, lifetime_volume_units: 50000}
      expect: ["tooling_per_unit_gbp"]
    - tool: calculate_fix_cost_and_lead_time_for_sku
      args: {sku: SKU-100007}
      expect: ["total_fixed_costs_per_unit_gbp"]

- question: "06:58:Q3"
  story: >
    Product margin contribution: Track revenue, COGS, gross margin and net margin
    by SKU and period. Identify high-margin SKUs for promotion.
  checks:
    - tool: calculate_product_margin_contribution
      args: {sku: SKU-100007}
      expect: ["total_revenue_gbp"]

- question: "07:62:Q1"
  story: >
    Standard cost update: material costs +5% effective Sept 1. Calculate material
    cost at different volumes to show bulk discount benefits.
  checks:
    - tool: calculate_material_cost_at_volume
      args: {sku: K-1700, volume_units: 10000}
      expect: ["adjusted_material_cost_gbp"]

- question: "08:74:Q6"
  story: >
    Next-day premium: standard £2.50/unit freight vs expedited £12.00/unit for
    500 units. Calculate margin impact of expedite cost premium.
  checks:
    - tool: calculate_next_day_margin_impact
      args: {standard_freight_cost_gbp: 2.5, expedited_freight_cost_gbp: 12.0, volume_units: 500}
      expect: ["premium_per_unit_gbp"]

- question: "04:32:Q1"
  story: >
    Margin recovery via price increase: 3% retail price increase with -1.2 demand
    elasticity. Calculate revenue and margin impact.
  checks:
    - tool: calculate_margin_recovery_from_price_change
      args: {category: Dresses, price_increase_pct: 3, volume_elasticity: -1.2}
      expect: ["revenue_impact_pct"]

- question: "04:40:Q1"
  story: >
    Packaging comparison: corrugated £0.85/unit, recycled plastic £0.78/unit.
    Calculate margin impact of fee changes across 400,000 units.
  checks:
    - tool: calculate_margin_impact_of_fee_changes
      args: {fee_type: packaging, fee_change_gbp: -0.07, volume_units: 400000}
      expect: ["total_fee_impact_gbp"]

- question: "04:39:Q1"
  story: >
    Material cost share and commodity exposure: bottle SKU exposure to cotton,
    polyester, aluminium. Calculate price sensitivity by material.
  checks:
    - tool: calculate_commodity_cost_exposure
      args: {sku: K-1700, commodity_price_change_pct: 10}
      expect: ["product_cost_impact_pct"]
