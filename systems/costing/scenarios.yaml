# Scenario tests for costing system tools

- question: "02:13:Q1"
  story: >
    Style 7731 is three weeks late, a key winter promo line with 6,000 units on order from Vietnam.
    Air freight costs £8.50/unit vs sea at £1.20/unit, but delay loses 15% of sales.
    Decision: calculate air vs sea margin impact, lost sales if delayed, and evaluate 3,000-unit
    partial air option.
  checks:
    - tool: calculate_air_vs_sea_margin_impact
      args: {style_id: STY-7731, volume_units: 6000, air_freight_cost_gbp: 8.5, sea_freight_cost_gbp: 1.2}
      expect: ["air_cost_premium_gbp", "51000", "42000"]
    - tool: calculate_lost_sales_if_delayed
      args: {style_id: STY-7731, delay_weeks: 3, volume_units: 6000}
      expect: ["estimated_lost_units", "900", "delay_weeks"]
    - tool: calculate_margin_at_volumes
      args: {style_id: STY-7731, volume_units: 3000}
      expect: ["margin_at_volume_gbp", "adjusted_material_cost_gbp"]

- question: "02:21:Q2"
  story: >
    Electronics returns (chargers, cables) need disposition routing. Last 6 months: 1,200 units
    through restocking (avg recovery 92%), 800 through outlet (75%), 350 to liquidator (45%).
    Evaluate by age band (0-30d, 31-60d, 61-180d, 180d+), handling cost and time to realise.
  checks:
    - tool: calculate_recovered_value_by_route
      args: {category: Electronics, cost_per_unit_gbp: 25}
      expect: ["Restocking", "Outlet", "recovered_value_gbp"]
    - tool: calculate_recovery_potential_for_lines
      args: {category: Electronics, min_age_days: 180}
      expect: ["route_name", "avg_recovery_rate_pct"]
    - tool: calculate_date_recovery_cost
      args: {route_id: ROU-RESTOCK, category: Electronics, age_band: "0-30d"}
      expect: ["95", "0.5", "recovery_rate_pct"]

- question: "03:25:Q1"
  story: >
    Women's knitwear margin was 3.2 points below plan in August (actual 56.8% vs plan 60%).
    Bridge into cost (1.8pts), FX (-0.9pts), mix (-0.2pts), supplier (-0.5pts), markdown (-0.1pts).
    Evaluate season-end projection if nothing changes and which actions recover most.
  checks:
    - tool: calculate_margin_variance_by_driver
      args: {category: "Women's Knitwear", period: "2026-09"}
      expect: ["cost_driver_pct", "mix_driver_pct"]
    - tool: calculate_margin_bridge
      args: {category: "Women's Knitwear", period: "2026-09"}
      expect: ["total_variance_pct", "cost_driver_pct"]
    - tool: calculate_end_of_season_margin_projection
      args: {category: "Women's Knitwear", weeks_remaining: 8}
      expect: ["projected_season_margin_pct", "weeks_remaining"]

- question: "03:29:Q5"
  story: >
    Old stock in small appliances: 85 units aged 180-365d (cost £8/unit, recovery 25% via liquidation),
    yield £1.70/unit after handling. Clear decision: liquidate; evaluate recovery vs holding cost.
  checks:
    - tool: calculate_recovered_value_by_route
      args: {category: "Small Appliances", cost_per_unit_gbp: 8.0}
      expect: ["Liquidation", "recovered_value_gbp"]
    - tool: calculate_recovery_potential_for_lines
      args: {category: "Small Appliances", min_age_days: 180}
      expect: ["avg_recovery_rate_pct", "avg_handling_cost_gbp"]

- question: "03:31:Q1"
  story: >
    Network expansion: second DC in Midlands adds £2.5M fixed cost/year, but if each SKU contributes
    £12.50 gross margin, break-even is 200,000 units. Evaluate against baseline volumes.
  checks:
    - tool: calculate_break_even_volume
      args: {fixed_cost_gbp: 2500000, contribution_margin_gbp: 12.5}
      expect: ["break_even_units", "200000"]

- question: "04:32:Q2"
  story: >
    304 stainless steel up 4% (commodity), but bottle cost up 9%. Exposure analysis: bottles
    have 6.2% steel exposure; 4% price rise should mean 0.25% cost impact but actual was 0.45%
    (supplier premium). Identify excess pass-through.
  checks:
    - tool: calculate_commodity_cost_exposure
      args: {sku: K-1700, commodity_price_change_pct: 4}
      expect: ["product_cost_impact_pct", "assumed_price_change_pct"]

- question: "04:32:Q4"
  story: >
    Competitor 750ml bottle £24.99 retail; our cost £8.00; target 55% margin implies target cost
    of £11.25 but we're at £8.00 (profit). Margin available from cost reduction, feature prioritisation.
  checks:
    - tool: calculate_target_cost
      args: {retail_price_gbp: 24.99, target_margin_pct: 55}
      expect: ["target_cost_gbp", "minimum_retail_price_gbp"]
    - tool: calculate_price_floor_from_cost
      args: {total_cost_gbp: 8.0, target_margin_pct: 55}
      expect: ["minimum_retail_price_gbp", "margin_gbp_at_floor"]

- question: "04:32:Q8"
  story: >
    Small appliances buying margin down 2.5pts YoY. Bridge: cost up 1.5pts, FX impact -0.8pts,
    mix down 0.6pts, supplier premium 0.3pts. Main driver is cost; renegotiation recovery potential.
  checks:
    - tool: calculate_margin_bridge
      args: {category: "Small Appliances", period: "2026-08"}
      expect: ["cost_driver_pct", "supplier_driver_pct", "total_variance_pct"]

- question: "04:33:Q2"
  story: >
    Vietnam wages: minimum up 3% YoY, Cambodia +2%, Bangladesh +1.5%. FOB prices up: Vietnam 4.2%,
    Cambodia 2.8%, Bangladesh 2.1%. This is analyzed via other systems; costing uses historical data.
  checks: []

- question: "04:34:Q1"
  story: >
    Nearshore evaluation: Portugal costs 12% premium over Vietnam but 4-week lead time saves 3%
    markdown (faster sell-through). Break-even markdown reduction: 15% vs 12%.
  checks:
    - tool: calculate_markdown_breakeven
      args: {cost_increase_pct: 12, current_markdown_pct: 15}
      expect: ["markdown_reduction_needed_pct", "cost_increase_pct"]

- question: "04:34:Q3"
  story: >
    Wool coat: Vietnam FOB £18, Portugal £20.16 (12% premium), UK duty 10%, holding cost rate 15%/year.
    4-week lead time shorter saves 2% markdown. Material cost at different volumes helps decision.
  checks:
    - tool: calculate_material_cost_at_volume
      args: {sku: K-1700, volume_units: 5000}
      expect: ["savings_gbp", "adjusted_material_cost_gbp"]

- question: "04:34:Q5"
  story: >
    Nearshore quotes 35% above baseline (£22.68 vs £16.80). Target cost for £49.99 retail at 55% margin
    is £22.49. Components: material £8.50, labour £3.20, overhead £2.50, freight £3.80. Which drives premium?
  checks:
    - tool: calculate_target_cost
      args: {retail_price_gbp: 49.99, target_margin_pct: 55}
      expect: ["target_cost_gbp", "material_budget_gbp", "labour_budget_gbp"]

- question: "04:39:Q3"
  story: >
    Fabric cost rose 9% YoY, cotton up only 4%. Variance bridge: 3% from supplier premium, 2% from
    freight increase, 4% contract lag (suppliers passing through 2026 increases now). Calculate and
    identify worst offender to challenge.
  checks:
    - tool: calculate_cost_variance_bridge
      args: {category: Apparel, period: "2026-09"}
      expect: ["cost_driver_pct", "total_cost_variance_pct"]

- question: "04:39:Q4"
  story: >
    Oil shock scenario: polyester +20% ($12→$14.40/kg). Product cost exposed 8% to polyester.
    By category: Activewear 10% exposure (£0.80 cost impact), Dresses 6% (£0.48 impact).
  checks:
    - tool: calculate_commodity_shock_impact_by_category
      args: {commodity: polyester, shock_pct: 20}
      expect: ["shock_pct", "avg_cost_impact_pct_of_product"]

- question: "06:51:Q2"
  story: >
    New product sourcing: Vietnam baseline £18, nearshore scenario £20.16, premium £2.16/unit.
    Calculate garment cost breakdown by fabric component and labour allocation.
  checks:
    - tool: calculate_garment_cost_by_fabric
      args: {style_id: STY-5520}
      expect: ["component_type", "pct_of_total_cost", "unit_cost_gbp"]

- question: "06:58:Q1"
  story: >
    Fix-and-forget costing: tooling £15,000 over 50,000 unit lifetime = £0.30/unit amortisation.
    Overhead allocation £2.50/unit. Total fixed costs £2.80/unit.
  checks:
    - tool: calculate_tooling_amortisation_per_unit
      args: {tooling_cost_gbp: 15000, lifetime_volume_units: 50000}
      expect: ["tooling_per_unit_gbp", "0.3"]
    - tool: calculate_fix_cost_and_lead_time_for_sku
      args: {sku: SKU-100007}
      expect: ["tooling_amortised_per_unit_gbp", "total_fixed_costs_per_unit_gbp"]

- question: "06:58:Q3"
  story: >
    Product margin contribution: SKU-100007 revenue £125,000, COGS £56,250, gross margin £68,750,
    markdown £8,750, net contribution £60,000. Track by channel and period.
  checks:
    - tool: calculate_product_margin_contribution
      args: {sku: SKU-100007}
      expect: ["total_revenue_gbp", "net_margin_contribution_gbp"]

- question: "07:62:Q1"
  story: >
    Standard cost update: material costs +5% effective Sept 1 (£12.50→£13.13), labour unchanged.
    Impact on margin: £0.63/unit cost increase, 1.3% gross margin reduction if price held.
  checks:
    - tool: calculate_material_cost_at_volume
      args: {sku: SKU-100007, volume_units: 10000}
      expect: ["adjusted_material_cost_gbp", "savings_gbp"]

- question: "08:74:Q6"
  story: >
    Next-day premium: standard £2.50/unit freight vs expedited £12.00/unit for 500 units = £4,750 premium
    to save 3-day delay and 150 lost units (£3,000 margin). ROI positive at >£2.00/unit value.
  checks:
    - tool: calculate_next_day_margin_impact
      args: {standard_freight_cost_gbp: 2.5, expedited_freight_cost_gbp: 12.0, volume_units: 500}
      expect: ["premium_per_unit_gbp", "total_premium_gbp", "4750"]

- question: "04:32:Q1"
  story: >
    Margin recovery via price increase: category price +3% assumes -1.2 demand elasticity = +1.8% revenue.
    Margin recovery depends on cost absorption and elasticity assumptions.
  checks:
    - tool: calculate_margin_recovery_from_price_change
      args: {category: Dresses, price_increase_pct: 3, volume_elasticity: -1.2}
      expect: ["price_increase_pct", "revenue_impact_pct", "demand_elasticity"]

- question: "04:40:Q1"
  story: >
    Packaging comparison: corrugated £0.85/unit, recycled plastic £0.78/unit (8% saving),
    moulded pulp £0.92/unit (+ 8% cost). Margin impact £0.07-0.14 per unit across 400k units = £28-56k.
  checks:
    - tool: calculate_margin_impact_of_fee_changes
      args: {fee_type: packaging, fee_change_gbp: -0.07, volume_units: 400000}
      expect: ["total_fee_impact_gbp", "-28000"]

- question: "03:22:Q2"
  story: >
    Stock at risk: STY-5520 margin £26.10, sales velocity 450 units/week, only 3 weeks left before
    clearance. Rank by margin and sales at risk, identify expedite candidates.
  checks:
    - tool: calculate_product_margin_contribution
      args: {sku: SKU-100014, period: "2026-W40"}
      expect: ["gross_margin_gbp", "total_revenue_gbp"]

- question: "04:39:Q1"
  story: >
    Material cost share: bottle SKU-100007 exposure 35% cotton (12% of product cost), 20% polyester
    (8% cost), 15% aluminium (5% cost). Total material cost exposure and commodity price sensitivity.
  checks:
    - tool: calculate_commodity_cost_exposure
      args: {sku: K-1700, commodity_price_change_pct: 10}
      expect: ["product_cost_impact_pct", "exposure_quantity"]
