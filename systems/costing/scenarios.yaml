  checks:
    - tool: calculate_next_day_margin_impact
      args: {standard_freight_cost_gbp: 2.5, expedited_freight_cost_gbp: 12.0, volume_units: 500}
      expect: ["premium_per_unit_gbp"]

- question: "04:32:Q1"
  story: >
    Margin recovery via price increase: 3% retail price increase with -1.2 demand
    elasticity. Calculate revenue and margin impact.
  checks:
    - tool: calculate_margin_recovery_from_price_change
      args: {category: Dresses, price_increase_pct: 3, volume_elasticity: -1.2}
      expect: ["revenue_impact_pct"]

- question: "04:40:Q1"
  story: >
    Packaging comparison: corrugated £0.85/unit, recycled plastic £0.78/unit.
    Calculate margin impact of fee changes across 400,000 units.
  checks:
    - tool: calculate_margin_impact_of_fee_changes
      args: {fee_type: packaging, fee_change_gbp: -0.07, volume_units: 400000}
