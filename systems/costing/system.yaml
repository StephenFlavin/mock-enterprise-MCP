id: costing
name: Costing & Margin Tool
instructions: >
  Product costing sheets, margin analysis and cost drivers. Style costings track
  material, labour, overhead and freight. Includes margin bridges, cost variance
  analysis and disposition routes. Costing ids look like CST-STY-5520-26S1.

tables:
  product_costings:
    key: costing_id
    cols:
      costing_id: {type: str, desc: "Costing id, e.g. CST-STY-5520-26S1"}
      style_id: {type: str, desc: "Style, e.g. STY-5520"}
      sku: {type: str, desc: "SKU, e.g. SKU-100234"}
      season: {type: str, desc: "Season code, e.g. AW26"}
      version: {type: int, desc: "Version number (1=original, 2+=scenario)"}
      origin_country: {type: str, desc: "ISO country code of manufacture"}
      supplier_id: {type: str, desc: "Primary supplier"}
      factory_id: {type: str, desc: "Factory"}
      quantity_units: {type: int, desc: "Quantity for this costing"}
      material_cost_gbp: {type: float, desc: "Material cost per unit at volume"}
      labour_cost_gbp: {type: float, desc: "Labour cost per unit"}
      overhead_cost_gbp: {type: float, desc: "Overhead allocation per unit"}
      freight_cost_gbp: {type: float, desc: "Inbound freight per unit"}
      tooling_cost_gbp: {type: float, desc: "Tooling amortisation per unit"}
      total_cost_gbp: {type: float, desc: "Total landed cost per unit in GBP"}
      retail_price_gbp: {type: float, desc: "Retail price per unit"}
      gross_margin_gbp: {type: float, desc: "Gross margin per unit (price - cost)"}
      gross_margin_pct: {type: float, desc: "Gross margin as % of price"}
      target_margin_pct: {type: float, desc: "Target margin goal for this product"}
      status: {type: enum, values: [active, obsolete, scenario, archived], desc: "Costing status"}
      notes: {type: str, desc: "Version notes or assumptions"}
      created_at: {type: timestamp, desc: "When created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  material_costs:
    key: [material_id, recorded_at]
    cols:
      material_id: {type: str, desc: "Material identifier, e.g. MAT-COTTON-10OZ"}
      material_name: {type: str, desc: "Material name, e.g. 10oz cotton fabric"}
      material_type: {type: enum, values: [fabric, packaging, component, dyes_chemicals], desc: "Material category"}
      supplier_id: {type: str, desc: "Supplier"}
      unit: {type: str, desc: "Unit of measure, e.g. metre, kg, unit"}
      cost_per_unit_gbp: {type: float, desc: "Cost per unit"}
      index_price_gbp: {type: float, desc: "Commodity index price if applicable"}
      currency_conversion: {type: float, desc: "FX conversion factor to GBP"}
      recorded_at: {type: date, desc: "Date cost recorded"}
      notes: {type: str, desc: "Notes on price or contract terms"}

  margin_analyses:
    key: margin_id
    cols:
      margin_id: {type: str, desc: "Analysis id, e.g. MAR-STY-5520-26S1"}
      style_id: {type: str, desc: "Style"}
      sku: {type: str, desc: "SKU"}
      category: {type: str, desc: "Product category, e.g. Dresses"}
      period: {type: str, desc: "Period, e.g. 2026-W39"}
      channel: {type: enum, values: [store, online, outlet, wholesale, marketplace], desc: "Sales channel"}
      volume_units: {type: int, desc: "Units sold"}
      revenue_gbp: {type: float, desc: "Total revenue in period"}
      cost_of_goods_gbp: {type: float, desc: "Cost of goods sold"}
      gross_margin_gbp: {type: float, desc: "Gross profit"}
      gross_margin_pct: {type: float, desc: "Gross margin %"}
      markdown_gbp: {type: float, desc: "Markdown cost in period"}
      net_margin_gbp: {type: float, desc: "Net margin after markdown"}
      net_margin_pct: {type: float, desc: "Net margin %"}
      plan_margin_pct: {type: float, desc: "Planned margin %"}
      variance_pct: {type: float, desc: "Actual vs plan variance"}
      analysed_at: {type: timestamp, desc: "When analysed"}

  cost_variance_drivers:
    key: variance_id
    cols:
      variance_id: {type: str, desc: "Variance analysis id"}
      style_id: {type: str, desc: "Style"}
      category: {type: str, desc: "Category"}
      period: {type: str, desc: "Analysis period"}
      total_variance_pct: {type: float, desc: "Total margin variance %"}
      cost_driver_pct: {type: float, desc: "Variance from cost change %"}
      fx_driver_pct: {type: float, desc: "Variance from FX impact %"}
      mix_driver_pct: {type: float, desc: "Variance from product mix %"}
      supplier_driver_pct: {type: float, desc: "Variance from supplier performance %"}
      markdown_driver_pct: {type: float, desc: "Variance from markdown pressure %"}
      other_driver_pct: {type: float, desc: "Other variance %"}
      notes: {type: str, desc: "Analysis notes"}
      analysed_at: {type: timestamp, desc: "When analysed"}

  recovery_routes:
    key: route_id
    cols:
      route_id: {type: str, desc: "Route id, e.g. ROU-RESTOCK"}
      route_name: {type: str, desc: "Route name, e.g. Restocking"}
      description: {type: str, desc: "Route description and process"}
      category_focus: {type: str, desc: "Primary product category"}
      min_age_days: {type: int, desc: "Minimum age for this route"}
      max_age_days: {type: int, desc: "Maximum age for this route"}
      status: {type: enum, values: [active, trial, inactive], desc: "Route status"}

  recovery_rates:
    key: [route_id, category, age_band]
    cols:
      route_id: {type: str, desc: "Recovery route"}
      category: {type: str, desc: "Product category"}
      age_band: {type: str, desc: "Age band, e.g. 0-30d, 31-60d, 61-180d, 180d+"}
      recovery_rate_pct: {type: float, desc: "Recovery rate as % of cost"}
      handling_cost_gbp: {type: float, desc: "Handling cost per unit"}
      time_to_realise_days: {type: int, desc: "Days to convert to cash"}
      risk_rating: {type: enum, values: [low, medium, high], desc: "Brand/risk rating"}
      volume_last_6m: {type: int, desc: "Units through this route in last 6 months"}
      last_updated: {type: date, desc: "Last update date"}

  scenario_analyses:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Scenario id, e.g. SCN-AIR-STY7731"}
      scenario_name: {type: str, desc: "Scenario name"}
      base_costing_id: {type: str, desc: "Base costing this scenario modifies"}
      scenario_type: {type: enum, values: [freight_mode, volume, material_cost, supplier, markdown, lead_time], desc: "Scenario type"}
      assumption_detail: {type: str, desc: "Key assumptions for this scenario"}
      cost_impact_gbp: {type: float, desc: "Cost per unit impact"}
      margin_impact_gbp: {type: float, desc: "Margin per unit impact"}
      margin_impact_pct: {type: float, desc: "Margin impact %"}
      volume_impact: {type: int, desc: "Units saved or lost"}
      financial_impact_gbp: {type: float, desc: "Total financial impact for full volume"}
      created_by: {type: str, desc: "User who created scenario"}
      created_at: {type: timestamp, desc: "Created date"}

  cost_sheet_details:
    key: [costing_id, line_no]
    cols:
      costing_id: {type: str, desc: "Parent costing"}
      line_no: {type: int, desc: "Line sequence"}
      component_type: {type: enum, values: [fabric, trimming, labour_cut, labour_sew, labour_finish, packing, inbound_freight, tooling, overhead], desc: "Cost component"}
      description: {type: str, desc: "Component description"}
      quantity: {type: float, desc: "Quantity of component per unit"}
      unit: {type: str, desc: "Unit of measure"}
      unit_cost_gbp: {type: float, desc: "Cost per unit"}
      total_cost_gbp: {type: float, desc: "Total cost for this component"}
      as_pct_of_total: {type: float, desc: "% of total product cost"}

  commodity_exposures:
    key: exposure_id
    cols:
      exposure_id: {type: str, desc: "Exposure id"}
      sku: {type: str, desc: "SKU"}
      category: {type: str, desc: "Product category"}
      commodity: {type: str, desc: "Commodity, e.g. cotton, polyester, oil"}
      exposure_pct: {type: float, desc: "% of product cost exposed to this commodity"}
      exposure_unit: {type: str, desc: "Unit, e.g. kg, metre, litre"}
      exposure_quantity: {type: float, desc: "Quantity exposed per unit"}
      elasticity: {type: float, desc: "Pass-through elasticity (% cost increase per 1% commodity price increase)"}
      date_from: {type: date, desc: "Period from"}

  supplier_cost_history:
    key: [supplier_id, sku, period]
    cols:
      supplier_id: {type: str, desc: "Supplier"}
      sku: {type: str, desc: "SKU"}
      period: {type: str, desc: "Period, e.g. 2026-08"}
      quoted_cost_gbp: {type: float, desc: "Quoted unit cost"}
      actual_cost_gbp: {type: float, desc: "Actual received cost"}
      index_price_gbp: {type: float, desc: "Commodity index in that period"}
      market_price_index: {type: float, desc: "Market price index (100 = baseline)"}
      supplier_price_index: {type: float, desc: "Supplier price index vs baseline"}
      pass_through_pct: {type: float, desc: "% of market move passed through"}
      notes: {type: str, desc: "Notes"}

tools:
  - name: calculate_air_vs_sea_margin_impact
    desc: Compares gross margin per unit when shipping air versus sea, including freight cost and delay impact on sales.
    kind: sql
    args:
      style_id: {required: true, desc: "Style, e.g. STY-5520"}
      volume_units: {type: int, desc: "Units to evaluate", default: 1000}
      air_freight_cost_gbp: {type: float, required: true, desc: "Air freight cost per unit in GBP"}
      sea_freight_cost_gbp: {type: float, required: true, desc: "Sea freight cost per unit in GBP"}
      days_saved: {type: int, desc: "Days saved by air shipping", default: 21}
    sql: |
      SELECT
        $style_id AS style_id,
        $volume_units AS volume_units,
        ROUND($sea_freight_cost_gbp, 2) AS sea_freight_cost_gbp,
        ROUND($air_freight_cost_gbp, 2) AS air_freight_cost_gbp,
        ROUND($air_freight_cost_gbp - $sea_freight_cost_gbp, 2) AS air_cost_premium_gbp,
        $days_saved AS days_saved,
        ROUND(($air_freight_cost_gbp - $sea_freight_cost_gbp) * $volume_units, 2) AS total_freight_premium_gbp,
        'air_premium = (air_cost - sea_cost) * volume' AS formula
    limit: 1
    example: {style_id: STY-5520, air_freight_cost_gbp: 8.5, sea_freight_cost_gbp: 1.2}

  - name: calculate_break_even_volume
    desc: Break-even volume for network expansion or supply chain change, given fixed and variable costs and margin.
    kind: sql
    args:
      fixed_cost_gbp: {type: float, required: true, desc: "Fixed annual cost in GBP"}
      contribution_margin_gbp: {type: float, required: true, desc: "Contribution margin per unit in GBP"}
    sql: |
      SELECT
        ROUND($fixed_cost_gbp, 2) AS fixed_cost_gbp,
        ROUND($contribution_margin_gbp, 2) AS contribution_margin_gbp,
        ROUND($fixed_cost_gbp / $contribution_margin_gbp, 0) AS break_even_units,
        'break_even_units = fixed_cost / contribution_margin' AS formula
    limit: 1
    example: {fixed_cost_gbp: 500000, contribution_margin_gbp: 12.5}

  - name: calculate_commodity_cost_exposure
    desc: Product cost exposed to a commodity price move and the margin impact if commodity price changes by specified percentage.
    kind: sql
    args:
      sku: {required: true, desc: "SKU"}
      commodity_price_change_pct: {type: float, desc: "Commodity price change %", default: 10}
    sql: |
      SELECT
        c.sku,
        c.category,
        c.commodity,
        ROUND(c.exposure_pct, 2) AS commodity_exposure_pct,
        c.exposure_quantity,
        c.exposure_unit,
        ROUND($commodity_price_change_pct, 1) AS assumed_price_change_pct,
        ROUND(c.exposure_pct * $commodity_price_change_pct / 100, 2) AS product_cost_impact_pct,
        'cost_impact_pct = commodity_exposure_pct * price_change_pct / 100' AS formula
      FROM commodity_exposures c
      WHERE c.sku = $sku
      ORDER BY c.exposure_pct DESC
    limit: 20
    example: {sku: SKU-100007}

  - name: calculate_commodity_shock_impact_by_category
    desc: Cost and margin impact of a commodity price shock (e.g. oil, cotton) by product category.
    kind: sql
    args:
      commodity: {type: str, required: true, desc: "Commodity, e.g. cotton, polyester"}
      shock_pct: {type: float, required: true, desc: "Shock magnitude as % price increase"}
    sql: |
      SELECT
        c.category,
        COUNT(DISTINCT c.sku) AS sku_count,
        ROUND(AVG(c.exposure_pct), 2) AS avg_commodity_exposure_pct,
        ROUND(AVG(c.exposure_pct * $shock_pct / 100), 2) AS avg_cost_impact_pct_of_product,
        'margin_impact = avg_exposure_pct * shock_pct / 100' AS formula
      FROM commodity_exposures c
      WHERE c.commodity = $commodity
      GROUP BY c.category
      ORDER BY avg_cost_impact_pct_of_product DESC
    limit: 50
    example: {commodity: cotton, shock_pct: 20}

  - name: calculate_cost_variance_bridge
    desc: Bridge a cost change into market premiums, supplier pass-through, freight and timing lag components.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
      period: {type: str, desc: "Period to analyse, e.g. 2026-08 (default latest available)"}
    sql: |
      SELECT
        $category AS category,
        $period AS period,
        c.total_variance_pct AS total_cost_variance_pct,
        c.cost_driver_pct,
        c.fx_driver_pct,
        c.supplier_driver_pct,
        c.markdown_driver_pct,
        ROUND(c.cost_driver_pct + c.fx_driver_pct + c.supplier_driver_pct + c.markdown_driver_pct, 2) AS explained_variance_pct,
        c.notes
      FROM cost_variance_drivers c
      WHERE c.category = $category AND c.period = $period
      LIMIT 1
    limit: 1
    example: {category: Dresses}

  - name: calculate_date_recovery_cost
    desc: Recovered value by disposition route and product age, with handling costs and days to realise cash.
    kind: sql
    args:
      route_id: {desc: "Recovery route, e.g. ROU-RESTOCK"}
      category: {desc: "Product category"}
      age_band: {desc: "Age band, e.g. 0-30d, 180d+"}
    sql: |
      SELECT
        r.route_name,
        r.category_focus,
        rr.recovery_rate_pct,
        rr.handling_cost_gbp,
        rr.time_to_realise_days,
        rr.risk_rating,
        'net_recovery = recovery_rate - handling_cost' AS formula
      FROM recovery_routes r
      JOIN recovery_rates rr ON r.route_id = rr.route_id
      WHERE ($route_id IS NULL OR r.route_id = $route_id)
        AND ($category IS NULL OR rr.category = $category)
        AND ($age_band IS NULL OR rr.age_band = $age_band)
      LIMIT 10
    limit: 10
    example: {route_id: ROU-RESTOCK}

  - name: calculate_end_of_season_margin_projection
    desc: Projected season-end margin for a category if current trends continue, with markdown pressure factored in.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
      weeks_remaining: {type: int, desc: "Weeks left in season", default: 8}
    sql: |
      SELECT
        $category AS category,
        $weeks_remaining AS weeks_remaining,
        ROUND(AVG(m.gross_margin_pct), 1) AS current_gross_margin_pct,
        ROUND(AVG(m.net_margin_pct), 1) AS current_net_margin_pct,
        ROUND(AVG(m.net_margin_pct) * (1 - ($weeks_remaining / 26.0)), 1) AS projected_season_margin_pct,
        'projection assumes linear markdown increase over remaining weeks' AS formula
      FROM margin_analyses m
      WHERE m.category = $category
      GROUP BY m.category
    limit: 1
    example: {category: Dresses}

  - name: calculate_fix_cost_and_lead_time_for_sku
    desc: Calculate fixed costs allocated per unit and lead time impact for a SKU from factory to DC.
    kind: sql
    args:
      sku: {required: true, desc: "SKU"}
    sql: |
      SELECT
        pc.sku,
        pc.factory_id,
        pc.origin_country,
        ROUND(pc.tooling_cost_gbp, 2) AS tooling_amortised_per_unit_gbp,
        ROUND(pc.overhead_cost_gbp, 2) AS overhead_allocated_per_unit_gbp,
        ROUND(pc.tooling_cost_gbp + pc.overhead_cost_gbp, 2) AS total_fixed_costs_per_unit_gbp,
        pc.quantity_units AS costing_volume,
        'fixed_per_unit = (tooling + overhead) / quantity' AS formula
      FROM product_costings pc
      WHERE pc.sku = $sku AND pc.status = 'active'
      LIMIT 1
    limit: 1
    example: {sku: SKU-100007}

  - name: calculate_garment_cost_by_fabric
    desc: Calculate product cost breakdown by fabric and labour component, with cost per fabric type.
    kind: sql
    args:
      style_id: {required: true, desc: "Style"}
    sql: |
      SELECT
        c.component_type,
        c.description,
        c.quantity,
        c.unit,
        ROUND(c.unit_cost_gbp, 3) AS unit_cost_gbp,
        ROUND(c.total_cost_gbp, 2) AS total_cost_gbp,
        ROUND(c.as_pct_of_total, 1) AS pct_of_total_cost
      FROM cost_sheet_details c
      JOIN product_costings pc ON c.costing_id = pc.costing_id
      WHERE pc.style_id = $style_id AND pc.status = 'active'
      ORDER BY c.as_pct_of_total DESC
    limit: 50
    example: {style_id: STY-5520}

  - name: calculate_lost_sales_if_delayed
    desc: Estimates sales units lost if product delivery is delayed by specified weeks, based on seasonality and demand.
    kind: sql
    args:
      style_id: {required: true, desc: "Style"}
      delay_weeks: {type: int, desc: "Delay in weeks", default: 3}
      volume_units: {type: int, desc: "Original planned volume", default: 5000}
    sql: |
      SELECT
        $style_id AS style_id,
        $delay_weeks AS delay_weeks,
        $volume_units AS planned_volume_units,
        ROUND($volume_units * (0.05 * $delay_weeks), 0) AS estimated_lost_units,
        ROUND($volume_units * (0.05 * $delay_weeks) / $volume_units * 100, 1) AS lost_sales_pct,
        'lost_units = volume * (5% per week of delay)' AS formula
    limit: 1
    example: {style_id: STY-5520, delay_weeks: 3, volume_units: 6000}

  - name: calculate_margin_at_volumes
    desc: Gross margin per unit at different order volumes, accounting for cost reductions from economies of scale.
    kind: sql
    args:
      style_id: {required: true, desc: "Style"}
      volume_units: {type: int, desc: "Order volume to evaluate", default: 1000}
    sql: |
      SELECT
        $style_id AS style_id,
        $volume_units AS volume_units,
        CASE
          WHEN $volume_units >= 10000 THEN ROUND(pc.material_cost_gbp * 0.95, 2)
          WHEN $volume_units >= 5000 THEN ROUND(pc.material_cost_gbp * 0.97, 2)
          ELSE pc.material_cost_gbp
        END AS adjusted_material_cost_gbp,
        ROUND(pc.labour_cost_gbp, 2) AS labour_cost_gbp,
        ROUND(pc.freight_cost_gbp, 2) AS freight_cost_gbp,
        ROUND((CASE WHEN $volume_units >= 10000 THEN pc.material_cost_gbp * 0.95 ELSE pc.material_cost_gbp END) + pc.labour_cost_gbp + pc.freight_cost_gbp, 2) AS total_cost_gbp,
        ROUND(pc.retail_price_gbp - (CASE WHEN $volume_units >= 10000 THEN pc.material_cost_gbp * 0.95 ELSE pc.material_cost_gbp END + pc.labour_cost_gbp + pc.freight_cost_gbp), 2) AS margin_at_volume_gbp,
        'margin_at_volume accounts for material cost reduction at higher volumes' AS formula
      FROM product_costings pc
      WHERE pc.style_id = $style_id AND pc.status = 'active'
      LIMIT 1
    limit: 1
    example: {style_id: STY-5520, volume_units: 5000}

  - name: calculate_margin_bridge
    desc: Decompose margin change into cost, FX, mix, markdown and supplier performance drivers.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
      period: {required: true, desc: "Period to analyse, e.g. 2026-08"}
    sql: |
      SELECT
        $category AS category,
        $period AS period,
        c.total_variance_pct,
        c.cost_driver_pct,
        c.fx_driver_pct,
        c.mix_driver_pct,
        c.supplier_driver_pct,
        c.markdown_driver_pct,
        c.other_driver_pct,
        ROUND(c.cost_driver_pct + c.fx_driver_pct + c.mix_driver_pct + c.supplier_driver_pct + c.markdown_driver_pct + c.other_driver_pct, 2) AS total_explained,
        'bridge: sum of drivers = total variance' AS formula
      FROM cost_variance_drivers c
      WHERE c.category = $category AND c.period = $period
    limit: 1
    example: {category: Dresses}

  - name: calculate_margin_impact_of_fee_changes
    desc: Calculates how shipping, service or handling fee changes impact product margin by channel and category.
    kind: sql
    args:
      fee_type: {type: str, desc: "Fee category, e.g. inbound_freight, handling, packaging"}
      fee_change_gbp: {type: float, required: true, desc: "Fee change per unit in GBP"}
      volume_units: {type: int, desc: "Volume affected", default: 1000}
    sql: |
      SELECT
        $fee_type AS fee_type,
        ROUND($fee_change_gbp, 2) AS fee_change_per_unit_gbp,
        $volume_units AS volume_units,
        ROUND($fee_change_gbp * $volume_units, 2) AS total_fee_impact_gbp,
        'margin_impact = fee_change * volume' AS formula
    limit: 1
    example: {fee_type: inbound_freight, fee_change_gbp: 0.5, volume_units: 5000}

  - name: calculate_margin_recovery_from_price_change
    desc: Margin recovered under price changes by channel and segment, accounting for elasticity.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
      price_increase_pct: {type: float, required: true, desc: "Retail price increase %"}
      volume_elasticity: {type: float, desc: "Volume elasticity to price", default: -1.2}
    sql: |
      SELECT
        $category AS category,
        ROUND($price_increase_pct, 1) AS price_increase_pct,
        ROUND($volume_elasticity, 2) AS demand_elasticity,
        ROUND($price_increase_pct * (1 + $volume_elasticity / 100), 1) AS revenue_impact_pct,
        'margin_recovery = price_increase * (1 + elasticity)' AS formula
    limit: 1
    example: {category: Dresses, price_increase_pct: 3, volume_elasticity: -1.2}

  - name: calculate_margin_variance_by_driver
    desc: Split margin variance by pricing, volume, cost and mix drivers for a category in a period.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
      period: {required: true, desc: "Period, e.g. 2026-08"}
    sql: |
      SELECT
        c.category,
        c.period,
        c.total_variance_pct AS total_margin_variance_pct,
        c.cost_driver_pct,
        c.mix_driver_pct,
        c.supplier_driver_pct,
        c.markdown_driver_pct,
        'variance split by driver shows which factors drive margin change' AS formula
      FROM cost_variance_drivers c
      WHERE c.category = $category AND c.period = $period
    limit: 1
    example: {category: Dresses}

  - name: calculate_markdown_breakeven
    desc: Markdown reduction needed to offset cost increase while maintaining target margin.
    kind: sql
    args:
      cost_increase_pct: {type: float, required: true, desc: "Cost increase %"}
      current_markdown_pct: {type: float, desc: "Current markdown % of retail", default: 15}
    sql: |
      SELECT
        ROUND($cost_increase_pct, 1) AS cost_increase_pct,
        ROUND($current_markdown_pct, 1) AS current_markdown_pct,
        ROUND(CASE WHEN $current_markdown_pct - $cost_increase_pct < 0 THEN 0 ELSE $current_markdown_pct - $cost_increase_pct END, 1) AS markdown_reduction_needed_pct,
        'reduced_markdown = current_markdown - cost_increase' AS formula
    limit: 1
    example: {cost_increase_pct: 8, current_markdown_pct: 20}

  - name: calculate_material_cost_at_volume
    desc: Calculate material cost per unit at different purchase volumes, including bulk discounts.
    kind: sql
    args:
      sku: {required: true, desc: "SKU"}
      volume_units: {type: int, desc: "Purchase volume", default: 5000}
    sql: |
      SELECT
        $sku AS sku,
        $volume_units AS volume_units,
        pc.material_cost_gbp AS base_material_cost_gbp,
        CASE
          WHEN $volume_units >= 20000 THEN ROUND(pc.material_cost_gbp * 0.92, 2)
          WHEN $volume_units >= 10000 THEN ROUND(pc.material_cost_gbp * 0.95, 2)
          WHEN $volume_units >= 5000 THEN ROUND(pc.material_cost_gbp * 0.98, 2)
          ELSE pc.material_cost_gbp
        END AS adjusted_material_cost_gbp,
        ROUND(pc.material_cost_gbp - CASE WHEN $volume_units >= 20000 THEN pc.material_cost_gbp * 0.92 ELSE pc.material_cost_gbp END, 2) AS savings_gbp,
        'cost reduction from bulk discount' AS formula
      FROM product_costings pc
      WHERE pc.sku = $sku AND pc.status = 'active'
      LIMIT 1
    limit: 1
    example: {sku: K-1700, volume_units: 10000}

  - name: calculate_next_day_margin_impact
    desc: Calculates margin impact of expedited next-day or premium freight cost for urgent shipments.
    kind: sql
    args:
      standard_freight_cost_gbp: {type: float, required: true, desc: "Standard freight cost per unit"}
      expedited_freight_cost_gbp: {type: float, required: true, desc: "Expedited freight cost per unit"}
      volume_units: {type: int, desc: "Volume requiring expedite", default: 100}
    sql: |
      SELECT
        ROUND($standard_freight_cost_gbp, 2) AS standard_freight_gbp,
        ROUND($expedited_freight_cost_gbp, 2) AS expedited_freight_gbp,
        ROUND($expedited_freight_cost_gbp - $standard_freight_cost_gbp, 2) AS premium_per_unit_gbp,
        $volume_units AS volume_units,
        ROUND(($expedited_freight_cost_gbp - $standard_freight_cost_gbp) * $volume_units, 2) AS total_premium_gbp,
        'premium = (expedited - standard) * volume' AS formula
    limit: 1
    example: {standard_freight_cost_gbp: 2.5, expedited_freight_cost_gbp: 12.0, volume_units: 500}

  - name: calculate_price_floor_from_cost
    desc: Calculates minimum retail price floor given cost of goods, target margin and channel mix.
    kind: sql
    args:
      total_cost_gbp: {type: float, required: true, desc: "Total cost per unit including all freight and overhead"}
      target_margin_pct: {type: float, desc: "Target gross margin %", default: 50}
    sql: |
      SELECT
        ROUND($total_cost_gbp, 2) AS total_cost_gbp,
        ROUND($target_margin_pct, 1) AS target_margin_pct,
        ROUND($total_cost_gbp / (1 - $target_margin_pct / 100), 2) AS minimum_retail_price_gbp,
        ROUND($total_cost_gbp * ($target_margin_pct / 100) / (1 - $target_margin_pct / 100), 2) AS margin_gbp_at_floor,
        'floor_price = cost / (1 - margin_pct)' AS formula
    limit: 1
    example: {total_cost_gbp: 15, target_margin_pct: 50}

  - name: calculate_product_margin_contribution
    desc: Calculate the margin contribution of a product to category and overall business after all direct costs and allocations.
    kind: sql
    args:
      sku: {required: true, desc: "SKU"}
      period: {desc: "Period for analysis, e.g. 2026-08"}
    sql: |
      SELECT
        m.sku,
        m.category,
        ROUND(SUM(m.revenue_gbp), 2) AS total_revenue_gbp,
        ROUND(SUM(m.cost_of_goods_gbp), 2) AS total_cogs_gbp,
        ROUND(SUM(m.gross_margin_gbp), 2) AS gross_margin_gbp,
        ROUND(SUM(m.markdown_gbp), 2) AS markdown_gbp,
        ROUND(SUM(m.net_margin_gbp), 2) AS net_margin_contribution_gbp,
        'contribution = revenue - cogs - markdown' AS formula
      FROM (SELECT sku, category, revenue_gbp, cost_of_goods_gbp, gross_margin_gbp, markdown_gbp, net_margin_gbp
            FROM margin_analyses
            WHERE sku = $sku AND ($period IS NULL OR period = $period)) m
      GROUP BY m.sku, m.category
    limit: 1
    example: {sku: SKU-100007}

  - name: calculate_recovered_value_by_route
    desc: Recovered value per disposition route for aged or clearance stock, including handling costs and time to sell.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
      cost_per_unit_gbp: {type: float, required: true, desc: "Original cost per unit"}
    sql: |
      SELECT
        r.route_name,
        rr.recovery_rate_pct,
        ROUND($cost_per_unit_gbp * rr.recovery_rate_pct / 100, 2) AS recovered_value_gbp,
        ROUND(rr.handling_cost_gbp, 2) AS handling_cost_gbp,
        ROUND($cost_per_unit_gbp * rr.recovery_rate_pct / 100 - rr.handling_cost_gbp, 2) AS net_recovery_gbp,
        rr.time_to_realise_days,
        rr.risk_rating
      FROM recovery_routes r
      JOIN recovery_rates rr ON r.route_id = rr.route_id
      WHERE rr.category = $category
      ORDER BY net_recovery_gbp DESC
    limit: 10
    example: {category: Electronics, cost_per_unit_gbp: 25}

  - name: calculate_recovery_potential_for_lines
    desc: Ranked recovery potential by disposition route for a set of aged product lines with age band, category and current cost.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
      min_age_days: {type: int, desc: "Minimum age", default: 90}
    sql: |
      SELECT
        $category AS category,
        $min_age_days AS min_age_days,
        r.route_name,
        COUNT(*) AS line_count,
        ROUND(AVG(rr.recovery_rate_pct), 1) AS avg_recovery_rate_pct,
        ROUND(AVG(rr.handling_cost_gbp), 2) AS avg_handling_cost_gbp,
        ROUND(AVG(rr.time_to_realise_days), 0) AS avg_days_to_realise,
        ANY_VALUE(rr.risk_rating) AS risk_rating
      FROM recovery_routes r
      JOIN recovery_rates rr ON r.route_id = rr.route_id
      WHERE rr.category = $category
      GROUP BY r.route_name
      ORDER BY avg_recovery_rate_pct DESC
    limit: 10
    example: {category: Dresses, min_age_days: 180}

  - name: calculate_structure_cost_comparison
    desc: Compare total cost structure between two sourcing origins or manufacturing scenarios.
    kind: sql
    args:
      style_id: {required: true, desc: "Style"}
      origin_1: {type: str, desc: "Origin country code 1"}
      origin_2: {type: str, desc: "Origin country code 2"}
    sql: |
      SELECT
        $style_id AS style_id,
        $origin_1 AS origin_1,
        $origin_2 AS origin_2,
        'Compare material, labour and freight costs between origins' AS comparison_type,
        'Requires costing versions for each origin to be seeded separately' AS note
    limit: 1
    example: {style_id: STY-5520, origin_1: VN, origin_2: PT}

  - name: calculate_target_cost
    desc: Target cost implied by retail price and margin goal, breaking down into material, labour and overhead budgets.
    kind: sql
    args:
      retail_price_gbp: {type: float, required: true, desc: "Retail price in GBP"}
      target_margin_pct: {type: float, desc: "Target gross margin %", default: 55}
    sql: |
      SELECT
        ROUND($retail_price_gbp, 2) AS retail_price_gbp,
        ROUND($target_margin_pct, 1) AS target_margin_pct,
        ROUND($retail_price_gbp * (1 - $target_margin_pct / 100), 2) AS target_cost_gbp,
        ROUND($retail_price_gbp * (1 - $target_margin_pct / 100) * 0.50, 2) AS material_budget_gbp,
        ROUND($retail_price_gbp * (1 - $target_margin_pct / 100) * 0.30, 2) AS labour_budget_gbp,
        ROUND($retail_price_gbp * (1 - $target_margin_pct / 100) * 0.20, 2) AS overhead_budget_gbp,
        'target_cost = price * (1 - margin_pct)' AS formula
    limit: 1
    example: {retail_price_gbp: 49.99, target_margin_pct: 55}

  - name: calculate_tooling_amortisation_per_unit
    desc: Calculate per-unit tooling cost amortised over the expected product lifetime or season volume.
    kind: sql
    args:
      tooling_cost_gbp: {type: float, required: true, desc: "Total tooling cost in GBP"}
      lifetime_volume_units: {type: int, required: true, desc: "Expected lifetime volume"}
    sql: |
      SELECT
        ROUND($tooling_cost_gbp, 2) AS total_tooling_cost_gbp,
        $lifetime_volume_units AS lifetime_volume_units,
        ROUND($tooling_cost_gbp / $lifetime_volume_units, 3) AS tooling_per_unit_gbp,
        'tooling_per_unit = total_tooling / lifetime_volume' AS formula
    limit: 1
    example: {tooling_cost_gbp: 15000, lifetime_volume_units: 50000}
