tools:
- name: calculate_air_vs_sea_margin_impact
  desc: Margin for a style shipped late by sea versus air, from planned volume, weekly demand and lost-sales rate. Use to decide whether airfreight pays.
  kind: sql
  args:
    style_id:
      required: true
      desc: Style, e.g. STY-7731
    air_freight_cost_gbp:
      type: float
      required: true
      desc: Air freight cost per unit in GBP
    volume_units:
      type: int
      desc: Units to fly; default is the whole planned volume
    sea_freight_cost_gbp:
      type: float
      desc: Sea freight per unit in GBP; default is the freight in the costing
    days_saved:
      type: int
      desc: Days of lateness the air units avoid
      default: 21
  sql: |
    WITH s AS (
      SELECT style_id, sum(quantity_units) AS planned, sum(weekly_demand_units) AS wk,
             sum(quantity_units * gross_margin_gbp) / sum(quantity_units) AS margin_u,
             sum(quantity_units * retail_price_gbp) / sum(quantity_units) AS retail_u,
             sum(quantity_units * freight_cost_gbp) / sum(quantity_units) AS freight_u,
             avg(late_sales_lost_pct) AS lost_pct
      FROM product_costings WHERE style_id = $style_id AND status = 'active' GROUP BY style_id
    ), p AS (
      SELECT s.*, LEAST(COALESCE($volume_units, planned), planned) AS air_units,
             COALESCE($sea_freight_cost_gbp, freight_u) AS sea_u, wk * $days_saved / 7.0 AS late_demand
      FROM s
    ), q AS (
      SELECT p.*, margin_u + freight_u - sea_u AS sea_margin_u, margin_u + freight_u - $air_freight_cost_gbp AS air_margin_u,
             LEAST(planned, late_demand * lost_pct / 100) AS lost_sea,
             LEAST(planned, GREATEST(0, late_demand - air_units) * lost_pct / 100) AS lost_air
      FROM p
    )
    SELECT style_id, planned AS planned_units, air_units, ROUND(retail_u, 2) AS retail_price_gbp,
           ROUND(sea_u, 2) AS sea_freight_gbp, ROUND($air_freight_cost_gbp, 2) AS air_freight_gbp,
           ROUND($air_freight_cost_gbp - sea_u, 2) AS air_premium_per_unit_gbp,
           ROUND(air_units * ($air_freight_cost_gbp - sea_u), 0) AS total_air_premium_gbp,
           ROUND(late_demand, 0) AS demand_in_late_window_units, ROUND(lost_sea, 0) AS units_lost_if_all_sea,
           ROUND(lost_air, 0) AS units_lost_with_air, ROUND(lost_sea * retail_u, 0) AS sales_lost_if_all_sea_gbp,
           ROUND((planned - lost_sea) * sea_margin_u, 0) AS margin_all_sea_gbp,
           ROUND(air_units * air_margin_u + GREATEST(0, planned - air_units - lost_air) * sea_margin_u, 0) AS margin_with_air_gbp,
           ROUND(air_units * air_margin_u + GREATEST(0, planned - air_units - lost_air) * sea_margin_u - (planned - lost_sea) * sea_margin_u, 0) AS net_margin_gain_from_air_gbp,
           'gain = margin with air units - margin all sea; lost units = late-window demand * lost-sales %' AS formula
    FROM q
  limit: 1
  example:
    style_id: STY-7731
    air_freight_cost_gbp: 16
    volume_units: 6000
- name: calculate_break_even_volume
  desc: Break-even volume from fixed cost and contribution per unit (or a SKU's costed gross margin), over one or more years, against expected volume.
  kind: sql
  args:
    fixed_cost_gbp:
      type: float
      required: true
      desc: Fixed cost per year in GBP, e.g. tooling and development spend
    contribution_margin_gbp:
      type: float
      desc: Saving or contribution per unit in GBP; omit to use the SKU's costed gross margin per unit
    sku:
      desc: SKU whose costed gross margin is the contribution when no contribution is given
    annual_volume_units:
      type: int
      desc: Expected annual units, to show break-even as a share of it
    years:
      type: int
      desc: Years to recover the cost over
      default: 1
  sql: |
    WITH c AS (
      SELECT COALESCE($contribution_margin_gbp,
                      (SELECT gross_margin_gbp FROM product_costings WHERE sku = $sku AND status = 'active' ORDER BY updated_at DESC LIMIT 1)) AS cm
    )
    SELECT $sku AS sku, ROUND($fixed_cost_gbp, 2) AS fixed_cost_per_year_gbp, ROUND(cm, 2) AS contribution_per_unit_gbp,
           $years AS years, ROUND($fixed_cost_gbp / NULLIF(cm, 0), 0) AS break_even_units_per_year,
           ROUND($fixed_cost_gbp * $years / NULLIF(cm, 0), 0) AS break_even_units_total,
           $annual_volume_units AS expected_annual_units,
           ROUND($fixed_cost_gbp / NULLIF(cm, 0) / NULLIF($annual_volume_units, 0) * 100, 1) AS break_even_pct_of_expected_volume,
           'break_even_units = fixed_cost / contribution_per_unit' AS formula
    FROM c
  limit: 1
  example:
    fixed_cost_gbp: 2400000
    contribution_margin_gbp: 1.6
    annual_volume_units: 20000000
- name: calculate_commodity_cost_exposure
  desc: Share of a SKU's cost tied to each commodity and the unit, annual and margin impact of a commodity price move.
  kind: sql
  args:
    sku:
      required: true
      desc: SKU, e.g. SKU-102590
    commodity_price_change_pct:
      type: float
      desc: Commodity price change %
      default: 10
    commodity:
      desc: Commodity code, e.g. SS304, COTTON
  sql: |
    SELECT c.sku, c.commodity, ROUND(c.exposure_pct, 1) AS commodity_share_of_cost_pct, ROUND(pc.total_cost_gbp, 2) AS unit_cost_gbp,
           ROUND($commodity_price_change_pct, 1) AS assumed_price_change_pct, c.elasticity AS pass_through,
           ROUND(c.exposure_pct * $commodity_price_change_pct * c.elasticity / 100, 2) AS unit_cost_increase_pct,
           ROUND(pc.total_cost_gbp * c.exposure_pct * $commodity_price_change_pct * c.elasticity / 10000, 2) AS unit_cost_increase_gbp,
           ROUND(pc.total_cost_gbp * c.exposure_pct * $commodity_price_change_pct * c.elasticity / 10000 / pc.retail_price_gbp * 100, 2) AS margin_impact_pts,
           pc.weekly_demand_units * 52 AS annual_units,
           ROUND(pc.total_cost_gbp * c.exposure_pct * $commodity_price_change_pct * c.elasticity / 10000 * pc.weekly_demand_units * 52, 0) AS annual_cost_increase_gbp,
           'unit cost increase = unit cost * commodity share * price change * pass-through' AS formula
    FROM commodity_exposures c JOIN product_costings pc ON pc.sku = c.sku AND pc.status = 'active'
    WHERE c.sku = $sku AND ($commodity IS NULL OR upper(c.commodity) = upper($commodity))
    ORDER BY c.exposure_pct DESC
  limit: 10
  example:
    sku: SKU-102590
    commodity_price_change_pct: 10
- name: calculate_commodity_shock_impact_by_category
  desc: Cost and gross margin impact of a commodity price rise (e.g. polyester +20%) by product category, from exposure share and pass-through.
  kind: sql
  args:
    commodity:
      type: str
      required: true
      desc: Commodity code, e.g. COTTON, POLYESTER, SS304, COPPER
    shock_pct:
      type: float
      required: true
      desc: Price rise in the commodity, %
  sql: |
    SELECT c.category, COUNT(DISTINCT c.sku) AS sku_count, ROUND(AVG(c.exposure_pct), 1) AS avg_commodity_exposure_pct,
      ROUND(AVG(c.elasticity), 2) AS avg_pass_through, $shock_pct AS shock_pct,
      ROUND(AVG(c.exposure_pct * $shock_pct * c.elasticity / 100), 2) AS avg_cost_impact_pct_of_product,
      ROUND(AVG(pc.total_cost_gbp), 2) AS avg_unit_cost_gbp,
      ROUND(AVG(pc.total_cost_gbp * c.exposure_pct * $shock_pct * c.elasticity / 10000), 2) AS avg_unit_cost_increase_gbp,
      ROUND(AVG(pc.gross_margin_pct), 1) AS avg_gross_margin_pct,
      ROUND(AVG(pc.total_cost_gbp * c.exposure_pct * $shock_pct * c.elasticity / 10000 / pc.retail_price_gbp * 100), 2) AS avg_margin_impact_pts,
      ROUND(SUM(pc.total_cost_gbp * c.exposure_pct * $shock_pct * c.elasticity / 10000 * pc.weekly_demand_units * 52), 0) AS annual_cost_increase_gbp,
      'unit cost increase = unit cost * exposure % * shock % * pass-through; margin impact = increase / retail price' AS formula
    FROM commodity_exposures c JOIN product_costings pc ON pc.sku = c.sku AND pc.status = 'active'
    WHERE upper(c.commodity) = upper($commodity)
    GROUP BY c.category
    ORDER BY annual_cost_increase_gbp DESC
  limit: 50
  example:
    commodity: COTTON
    shock_pct: 20
- name: calculate_cost_variance_bridge
  desc: Bridge a material cost change into market move, supplier premium, mill margin, freight and contract lag, in percentage points.
  kind: sql
  args:
    commodity:
      type: str
      desc: Commodity code, e.g. COTTON, WOOL, POLYESTER
    category:
      type: str
      desc: Product category whose commodity to bridge, e.g. Knitwear
    period:
      type: str
      desc: Period end to match, e.g. 2026-10 (default latest available)
  sql: |
    SELECT b.commodity, b.material_id, b.period_start, b.period_end, b.total_change_pct AS total_cost_variance_pct,
      b.market_pct, b.premium_pct, b.mill_margin_pct, b.freight_pct, b.lag_pct,
      ROUND(b.market_pct + b.premium_pct + b.mill_margin_pct + b.freight_pct + b.lag_pct, 1) AS explained_variance_pct,
      b.notes, 'total change = market + premium + mill margin + freight + contract lag' AS formula
    FROM cost_bridges b
    WHERE ($commodity IS NULL OR upper(b.commodity) = upper($commodity))
      AND ($category IS NULL OR b.commodity IN (SELECT e.commodity FROM commodity_exposures e WHERE lower(e.category) = lower($category)))
      AND ($period IS NULL OR CAST(b.period_end AS VARCHAR) LIKE $period || '%')
    ORDER BY b.period_end DESC, b.commodity
  limit: 10
  example:
    commodity: COTTON
- name: calculate_date_recovery_cost
  desc: Cost of airfreighting a late product to recover its in-store date, against the sales and margin lost if it lands late. Use to decide whether recovery pays.
  kind: sql
  args:
    sku:
      required: true
    weeks_late:
      type: int
      desc: Weeks the delivery is currently late
      default: 2
    air_freight_cost_gbp:
      type: float
      desc: Quoted air freight per unit in GBP; default is the costing's sea freight times the air multiple
    air_freight_multiple:
      type: float
      desc: Air freight as a multiple of sea freight, used when no quote is given
      default: 4
    volume_units:
      type: int
      desc: Units to fly; default is the whole costed volume
  sql: |
    WITH s AS (
      SELECT sku, style_id, quantity_units AS planned, freight_cost_gbp AS sea_u, retail_price_gbp AS retail_u,
             gross_margin_gbp AS margin_u, weekly_demand_units AS wk, late_sales_lost_pct AS lost_pct
      FROM product_costings WHERE sku = $sku AND status = 'active' ORDER BY updated_at DESC LIMIT 1
    ), p AS (
      SELECT s.*, COALESCE($air_freight_cost_gbp, sea_u * $air_freight_multiple) AS air_u,
             LEAST(COALESCE($volume_units, planned), planned) AS air_units,
             LEAST(planned, wk * $weeks_late * lost_pct / 100) AS lost_units
      FROM s
    )
    SELECT sku, style_id, planned AS costed_units, air_units AS units_flown, $weeks_late AS weeks_late,
           ROUND(sea_u, 2) AS sea_freight_per_unit_gbp, ROUND(air_u, 2) AS air_freight_per_unit_gbp,
           ROUND(air_u - sea_u, 2) AS extra_cost_per_unit_gbp, ROUND(air_units * (air_u - sea_u), 0) AS recovery_cost_gbp,
           wk AS weekly_demand_units, ROUND(lost_pct, 0) AS lost_sales_pct, ROUND(lost_units, 0) AS units_lost_if_late,
           ROUND(lost_units * retail_u, 0) AS sales_lost_if_late_gbp, ROUND(lost_units * margin_u, 0) AS margin_lost_if_late_gbp,
           ROUND(lost_units * air_units / planned * margin_u - air_units * (air_u - sea_u), 0) AS net_benefit_of_recovery_gbp,
           CASE WHEN lost_units * air_units / planned * margin_u > air_units * (air_u - sea_u) THEN 'recovery pays'
                ELSE 'recovery costs more than the margin it protects' END AS verdict,
           'recovery cost = units flown * (air - sea freight); lost units = weekly demand * weeks late * lost-sales %' AS formula
    FROM p
  limit: 1
  example:
    sku: K-1700
    weeks_late: 2
- name: calculate_end_of_season_margin_projection
  desc: Projected net margin at season end for a category if the recent 4-week trend continues, against plan. Uses the last four trading periods.
  kind: sql
  args:
    category:
      required: true
      desc: Product category, e.g. Knitwear
    department:
      desc: Department, e.g. Womenswear
    weeks_remaining:
      type: int
      desc: Weeks left in the season
      default: 8
  sql: |
    WITH f AS (
      SELECT m.*, date_diff('day', m.period_start, (SELECT max(period_start) FROM margin_analyses)) / 28 AS back
      FROM margin_analyses m
      WHERE lower(m.category) = lower($category) AND ($department IS NULL OR lower(m.department) = lower($department))
    ), p AS (
      SELECT back, sum(net_margin_gbp) / sum(revenue_gbp) * 100 AS net_pct, sum(plan_margin_pct * revenue_gbp) / sum(revenue_gbp) AS plan_pct,
             sum(markdown_gbp) / sum(revenue_gbp) * 100 AS md_pct
      FROM f WHERE back <= 3 GROUP BY back
    )
    SELECT $category AS category, $weeks_remaining AS weeks_remaining,
           ROUND(max(net_pct) FILTER (back = 0), 1) AS current_net_margin_pct,
           ROUND(max(plan_pct) FILTER (back = 0), 1) AS plan_net_margin_pct,
           ROUND((max(net_pct) FILTER (back = 0) - max(net_pct) FILTER (back = 3)) / 3, 2) AS trend_pts_per_4_weeks,
           ROUND(max(md_pct) FILTER (back = 0) - max(md_pct) FILTER (back = 3), 2) AS markdown_pct_rise_over_12_weeks,
           ROUND(max(net_pct) FILTER (back = 0) + (max(net_pct) FILTER (back = 0) - max(net_pct) FILTER (back = 3)) / 3 * $weeks_remaining / 4.0, 1) AS projected_season_end_net_margin_pct,
           ROUND(max(net_pct) FILTER (back = 0) + (max(net_pct) FILTER (back = 0) - max(net_pct) FILTER (back = 3)) / 3 * $weeks_remaining / 4.0 - max(plan_pct) FILTER (back = 0), 1) AS projected_gap_to_plan_pts,
           'projection = current net margin + 4-week trend * weeks remaining / 4' AS formula
    FROM p
  limit: 1
  example:
    category: Knitwear
    department: Womenswear
- name: calculate_fix_cost_and_lead_time_for_sku
  desc: Fix options for a SKU with total cost, added unit cost, margin after the fix and days to reach the DC. Use to compare fixes by cost and speed.
  kind: sql
  args:
    sku:
      required: true
      desc: SKU, e.g. K-1700
    units_to_fix:
      type: int
      desc: Units the fix must cover; default is the affected units on the fix option
  sql: |
    SELECT f.fix_id, f.sku, f.fix_name, f.description,
           COALESCE($units_to_fix, f.units_to_fix) AS units_to_fix,
           ROUND(f.one_off_cost_gbp, 0) AS one_off_cost_gbp, ROUND(f.unit_cost_change_gbp, 2) AS added_cost_per_unit_gbp,
           ROUND(f.one_off_cost_gbp + f.unit_cost_change_gbp * COALESCE($units_to_fix, f.units_to_fix), 0) AS total_fix_cost_gbp,
           f.development_days, f.production_days, f.transit_days,
           f.development_days + f.production_days + f.transit_days AS lead_time_days_to_dc,
           CAST($as_of AS DATE) + to_days(CAST(f.development_days + f.production_days + f.transit_days AS INTEGER)) AS earliest_dc_date,
           ROUND(pc.total_cost_gbp, 2) AS current_unit_cost_gbp,
           ROUND(pc.total_cost_gbp + f.unit_cost_change_gbp, 2) AS unit_cost_after_fix_gbp,
           ROUND((pc.retail_price_gbp - pc.total_cost_gbp - f.unit_cost_change_gbp) / pc.retail_price_gbp * 100, 1) AS margin_pct_after_fix,
           f.status,
           'total fix cost = one-off cost + added cost per unit * units; lead time = development + production + transit days' AS formula
    FROM fix_options f LEFT JOIN product_costings pc ON pc.sku = f.sku AND pc.status = 'active'
    WHERE f.sku = $sku AND f.status <> 'rejected'
    ORDER BY lead_time_days_to_dc
  limit: 10
  example:
    sku: K-1700
- name: calculate_garment_cost_by_fabric
  desc: Garment cost for a style with each candidate fabric, against its target cost, with the retail price needed for the target margin. Omit fabrics for the current costing.
  kind: sql
  args:
    style_id:
      required: true
      desc: Style, e.g. STY-4102
    material_ids:
      type: str
      desc: Candidate fabric material ids, comma-separated, e.g. MAT-COTTON-10OZ,MAT-POLYESTER-100
  sql: |
    WITH sh AS (
      SELECT pc.costing_id, pc.retail_price_gbp AS retail, pc.total_cost_gbp AS tot, pc.target_margin_pct AS tgt,
             COALESCE(sum(d.total_cost_gbp) FILTER (WHERE d.component_type = 'fabric'), 0) AS fabric,
             COALESCE(sum(d.quantity) FILTER (WHERE d.component_type = 'fabric' AND d.unit = 'metre'), 0) AS metres,
             COALESCE(sum(d.total_cost_gbp) FILTER (WHERE d.component_type = 'trimming'), 0) AS trims,
             COALESCE(sum(d.total_cost_gbp) FILTER (WHERE d.component_type LIKE 'labour%'), 0) AS labour
      FROM product_costings pc LEFT JOIN cost_sheet_details d ON d.costing_id = pc.costing_id
      WHERE pc.style_id = $style_id AND pc.status = 'active'
      GROUP BY pc.costing_id, pc.retail_price_gbp, pc.total_cost_gbp, pc.target_margin_pct
    ), st AS (
      SELECT avg(retail) AS retail, avg(tot) AS tot, avg(tgt) AS tgt, avg(fabric) AS fabric, avg(metres) AS metres,
             avg(trims) AS trims, avg(labour) AS labour
      FROM sh HAVING count(*) > 0
    ), px AS (
      SELECT material_id, any_value(material_name) AS material_name, avg(c) AS price
      FROM (SELECT material_id, supplier_id, any_value(material_name) AS material_name, arg_max(cost_per_unit_gbp, recorded_at) AS c
            FROM material_costs GROUP BY material_id, supplier_id)
      GROUP BY material_id
    ), cand AS (
      SELECT 'current costing' AS fabric_option, CAST(NULL AS VARCHAR) AS material_id, CAST(NULL AS DOUBLE) AS price, metres, fabric AS fabric_cost FROM st
      UNION ALL
      SELECT px.material_name, px.material_id, px.price, st.metres, st.metres * px.price
      FROM st CROSS JOIN px
      WHERE $material_ids IS NOT NULL AND list_contains(string_split(replace($material_ids, ' ', ''), ','), px.material_id)
    )
    SELECT cand.fabric_option, cand.material_id, ROUND(cand.price, 2) AS fabric_price_per_metre_gbp, ROUND(cand.metres, 2) AS metres_per_garment,
           ROUND(cand.fabric_cost, 2) AS fabric_cost_gbp, ROUND(st.trims, 2) AS trims_gbp, ROUND(st.labour, 2) AS labour_gbp,
           ROUND(st.tot - st.fabric - st.trims - st.labour, 2) AS other_costs_gbp,
           ROUND(st.tot - st.fabric + cand.fabric_cost, 2) AS garment_cost_gbp,
           ROUND(st.retail * (1 - st.tgt / 100), 2) AS target_cost_gbp,
           ROUND(st.tot - st.fabric + cand.fabric_cost - st.retail * (1 - st.tgt / 100), 2) AS gap_to_target_gbp,
           CASE WHEN st.tot - st.fabric + cand.fabric_cost <= st.retail * (1 - st.tgt / 100) THEN 'meets target' ELSE 'over target' END AS vs_target,
           ROUND((st.retail - (st.tot - st.fabric + cand.fabric_cost)) / st.retail * 100, 1) AS margin_pct_at_current_price,
           ROUND((st.tot - st.fabric + cand.fabric_cost) / (1 - st.tgt / 100), 2) AS price_needed_for_target_margin_gbp,
           ROUND(st.retail, 2) AS current_retail_price_gbp,
           'garment cost = current cost - current fabric line + metres * fabric price per metre' AS formula
    FROM cand CROSS JOIN st
    ORDER BY garment_cost_gbp
  limit: 20
  example:
    style_id: STY-5520
    material_ids: MAT-COTTON-10OZ,MAT-POLYESTER-100
- name: calculate_lost_sales_if_delayed
  desc: Units, sales and margin lost if a style's delivery is late, from its weekly demand and lost-sales rate. Use for delay or airfreight decisions.
  kind: sql
  args:
    style_id:
      required: true
      desc: Style, e.g. STY-7731
    delay_weeks:
      type: int
      desc: Weeks the delivery is late
      default: 3
    volume_units:
      type: int
      desc: Delivery size at risk; default is the planned volume
  sql: |
    WITH s AS (
      SELECT style_id, any_value(category) AS category, sum(quantity_units) AS planned, sum(weekly_demand_units) AS wk,
             sum(quantity_units * gross_margin_gbp) / sum(quantity_units) AS margin_u,
             sum(quantity_units * retail_price_gbp) / sum(quantity_units) AS retail_u, avg(late_sales_lost_pct) AS lost_pct
      FROM product_costings WHERE style_id = $style_id AND status = 'active' GROUP BY style_id
    )
    SELECT style_id, category, $delay_weeks AS delay_weeks, COALESCE($volume_units, planned) AS delivery_units,
           wk AS weekly_demand_units, wk * $delay_weeks AS demand_in_delay_window_units, ROUND(lost_pct, 0) AS lost_sales_pct,
           ROUND(LEAST(COALESCE($volume_units, planned), wk * $delay_weeks * lost_pct / 100), 0) AS estimated_lost_units,
           ROUND(LEAST(COALESCE($volume_units, planned), wk * $delay_weeks * lost_pct / 100) * retail_u, 0) AS lost_sales_gbp,
           ROUND(LEAST(COALESCE($volume_units, planned), wk * $delay_weeks * lost_pct / 100) * margin_u, 0) AS lost_margin_gbp,
           'lost units = weekly demand * delay weeks * lost-sales %' AS formula
    FROM s
  limit: 1
  example:
    style_id: STY-7731
    delay_weeks: 3
- name: calculate_margin_at_volumes
  desc: Unit cost, gross margin per unit and margin % at several order volumes for a SKU or style, with scale discounts on material and tooling spread over volume.
  kind: sql
  args:
    sku:
      desc: SKU, e.g. K-1700; give a sku or a style
    style_id:
      desc: Style, e.g. STY-5520, used when no sku is given
    volumes:
      type: str
      desc: Volume levels, comma-separated, e.g. 20000,50000,100000
      default: 1000,5000,10000
  sql: |
    WITH b AS (
      SELECT avg(quantity_units) AS q0, avg(material_cost_gbp) AS mat, avg(labour_cost_gbp) AS lab, avg(overhead_cost_gbp) AS ovh,
             avg(freight_cost_gbp) AS frt, avg(tooling_cost_gbp) AS tool, avg(total_cost_gbp) AS tot, avg(retail_price_gbp) AS retail,
             avg(target_margin_pct) AS tgt
      FROM product_costings
      WHERE status = 'active' AND ($sku IS NOT NULL OR $style_id IS NOT NULL)
        AND ($sku IS NULL OR sku = $sku) AND ($style_id IS NULL OR style_id = $style_id)
      HAVING count(*) > 0
    ), v AS (
      SELECT CAST(CASE WHEN lower(trim(x)) LIKE '%k' THEN CAST(replace(lower(trim(x)), 'k', '') AS DOUBLE) * 1000
                       ELSE CAST(trim(x) AS DOUBLE) END AS BIGINT) AS volume
      FROM (SELECT unnest(string_split($volumes, ',')) AS x)
    ), w AS (
      SELECT v.volume, b.*,
             CASE WHEN v.volume >= 100000 THEN 0.88 WHEN v.volume >= 50000 THEN 0.90 WHEN v.volume >= 25000 THEN 0.92
                  WHEN v.volume >= 10000 THEN 0.94 WHEN v.volume >= 5000 THEN 0.96 WHEN v.volume >= 2000 THEN 0.98 ELSE 1.0 END AS f_v,
             CASE WHEN b.q0 >= 100000 THEN 0.88 WHEN b.q0 >= 50000 THEN 0.90 WHEN b.q0 >= 25000 THEN 0.92
                  WHEN b.q0 >= 10000 THEN 0.94 WHEN b.q0 >= 5000 THEN 0.96 WHEN b.q0 >= 2000 THEN 0.98 ELSE 1.0 END AS f_0
      FROM v CROSS JOIN b
    ), u AS (
      SELECT w.*, mat * f_v / f_0 + lab + ovh + frt + tool * q0 / volume AS cost FROM w
    )
    SELECT $sku AS sku, $style_id AS style_id, volume AS volume_units, ROUND(cost, 2) AS unit_cost_gbp, ROUND(retail, 2) AS retail_price_gbp,
           ROUND(retail - cost, 2) AS margin_per_unit_gbp, ROUND((retail - cost) / retail * 100, 1) AS margin_pct,
           ROUND((retail - cost) * volume, 0) AS total_margin_gbp, ROUND(tgt, 1) AS target_margin_pct,
           ROUND((retail - cost) / retail * 100 - tgt, 1) AS margin_vs_target_pts, CAST(ROUND(q0, 0) AS BIGINT) AS costed_volume_units,
           'margin = retail - (material * scale factor + labour + overhead + freight + total tooling / volume)' AS formula
    FROM u ORDER BY volume
  limit: 10
  example:
    sku: K-1700
    volumes: 5000,20000
- name: calculate_margin_bridge
  desc: Decompose a margin change into cost, FX, mix, supplier, price, markdown and shrink points for a category. Default is the year on year buying margin.
  kind: sql
  args:
    category:
      required: true
      desc: Product category, e.g. Small Appliances
    department:
      desc: Department, e.g. Electricals
    basis:
      type: enum
      values:
      - vs_plan
      - yoy
      default: yoy
      desc: yoy = against last year; vs_plan = against plan
    period_from:
      type: date
      default: -35d
      desc: Periods starting on or after this date; the default is the last 4-week period
  sql: |
    SELECT v.category, v.department, v.basis, v.period_start, v.total_variance_pct AS total_variance_pts,
           v.cost_driver_pct AS cost_pts, v.fx_driver_pct AS fx_pts, v.mix_driver_pct AS mix_pts, v.supplier_driver_pct AS supplier_pts,
           v.price_driver_pct AS price_pts, v.markdown_driver_pct AS markdown_pts, v.shrink_driver_pct AS shrink_pts, v.other_driver_pct AS other_pts,
           ROUND(v.cost_driver_pct + v.fx_driver_pct + v.mix_driver_pct + v.supplier_driver_pct + v.price_driver_pct + v.markdown_driver_pct
                 + v.shrink_driver_pct + v.other_driver_pct, 2) AS total_explained_pts,
           v.notes, 'bridge: sum of drivers = total variance' AS formula
    FROM cost_variance_drivers v
    WHERE lower(v.category) = lower($category) AND ($department IS NULL OR lower(v.department) = lower($department))
      AND v.basis = $basis AND v.period_start >= CAST($period_from AS DATE)
    ORDER BY v.department, v.period_start DESC
  limit: 6
  example:
    category: Small Appliances
    department: Electricals
- name: calculate_margin_impact_of_fee_changes
  desc: Calculates how shipping, service or handling fee changes impact product margin by channel and category.
  kind: sql
  args:
    fee_type:
      type: str
      desc: Fee category, e.g. inbound_freight, handling, packaging
    fee_change_gbp:
      type: float
      required: true
      desc: Fee change per unit in GBP
    volume_units:
      type: int
      desc: Volume affected
      default: 1000
  sql: |
    SELECT
      $fee_type AS fee_type,
      ROUND($fee_change_gbp, 2) AS fee_change_per_unit_gbp,
      $volume_units AS volume_units,
      ROUND($fee_change_gbp * $volume_units, 2) AS total_fee_impact_gbp,
      'margin_impact = fee_change * volume' AS formula
  limit: 1
  example:
    fee_type: inbound_freight
    fee_change_gbp: 0.5
    volume_units: 5000
- name: calculate_margin_recovery_from_price_change
  desc: Margin recovered by a retail price rise for a category, using last 13 weeks of sales, demand elasticity and an optional cost increase to recover.
  kind: sql
  args:
    category:
      required: true
      desc: Product category, e.g. Footwear
    price_increase_pct:
      type: float
      required: true
      desc: Retail price increase %
    volume_elasticity:
      type: float
      desc: Volume change % per 1% price change
      default: -1.2
    cost_increase_pct:
      type: float
      desc: Cost of goods increase % to recover, e.g. from a tariff
      default: 0
    department:
      desc: Department, e.g. Womenswear, to separate same-named categories
  sql: |
    WITH b AS (
      SELECT sum(revenue_gbp) AS rev, sum(cost_of_goods_gbp) AS cogs, sum(markdown_gbp + shrink_gbp) AS leak, sum(volume_units) AS units
      FROM margin_analyses
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department))
        AND period_start >= CAST($as_of AS DATE) - INTERVAL 90 DAY
    ), c AS (
      SELECT *, 1 + $volume_elasticity * $price_increase_pct / 100 AS u, 1 + $price_increase_pct / 100 AS p, 1 + $cost_increase_pct / 100 AS k FROM b
    )
    SELECT $category AS category, ROUND($price_increase_pct, 1) AS price_increase_pct, ROUND($volume_elasticity, 2) AS volume_elasticity,
           ROUND($cost_increase_pct, 1) AS cost_increase_pct, units AS units_last_13_weeks, ROUND(rev, 0) AS revenue_last_13_weeks_gbp,
           ROUND(rev - cogs * k - leak, 0) AS margin_after_cost_increase_gbp,
           ROUND(rev * p * u - cogs * k * u - leak * p * u, 0) AS margin_after_price_rise_gbp,
           ROUND((rev * p * u - cogs * k * u - leak * p * u) - (rev - cogs * k - leak), 0) AS margin_recovered_13_weeks_gbp,
           ROUND(((rev * p * u - cogs * k * u - leak * p * u) - (rev - cogs * k - leak)) * 4, 0) AS margin_recovered_annualised_gbp,
           ROUND((rev * p * u - cogs * k * u - leak * p * u) / (rev * p * u) * 100 - (rev - cogs * k - leak) / rev * 100, 2) AS margin_pct_points_gained,
           ROUND(CASE WHEN cogs * (k - 1) > 0 THEN ((rev * p * u - cogs * k * u - leak * p * u) - (rev - cogs * k - leak)) / (cogs * (k - 1)) * 100 END, 0) AS pct_of_cost_increase_recovered,
           'margin = revenue*(1+price)*(1+elasticity*price) - cogs*(1+cost)*(1+elasticity*price) - markdown and shrink at the same % of revenue' AS formula
    FROM c
  limit: 1
  example:
    category: Footwear
    price_increase_pct: 3
    cost_increase_pct: 5
- name: calculate_margin_variance_by_driver
  desc: Split margin variance by pricing, volume, cost and mix drivers for a category in a period.
  kind: sql
  args:
    category:
      required: true
      desc: Product category
    period:
      type: str
      desc: Period, e.g. 2026-08 (default latest available)
  sql: |
    SELECT
      c.category,
      c.department,
      c.period_start,
      c.total_variance_pct AS total_margin_variance_pct,
      c.cost_driver_pct,
      c.mix_driver_pct,
      c.supplier_driver_pct,
      c.markdown_driver_pct,
      'variance split by driver shows which factors drive margin change' AS formula
    FROM cost_variance_drivers c
    WHERE c.category = $category AND c.basis = 'vs_plan' AND ($period IS NULL OR CAST(c.period_start AS VARCHAR) LIKE $period || '%')
    ORDER BY c.period_start DESC, c.department
  limit: 1
  example:
    category: Dresses
- name: calculate_markdown_breakeven
  desc: Markdown reduction, in points of retail price, needed to keep margin when a SKU's cost rises, against its current markdown rate.
  kind: sql
  args:
    sku:
      required: true
      desc: SKU, e.g. SKU-101897
    cost_increase_pct:
      type: float
      required: true
      desc: Cost increase % of landed cost, e.g. the nearshore premium
    current_markdown_pct:
      type: float
      desc: Current markdown as % of retail revenue; default is the SKU's last 13 weeks
  sql: |
    WITH md AS (
      SELECT sum(markdown_gbp) / sum(revenue_gbp) * 100 AS pct FROM margin_analyses
      WHERE sku = $sku AND period_start >= CAST($as_of AS DATE) - INTERVAL 90 DAY
    ), s AS (
      SELECT sku, total_cost_gbp, retail_price_gbp, COALESCE($current_markdown_pct, (SELECT pct FROM md)) AS cur_md
      FROM product_costings WHERE sku = $sku AND status = 'active'
    )
    SELECT s.sku, ROUND(s.retail_price_gbp, 2) AS retail_price_gbp, ROUND(s.total_cost_gbp, 2) AS current_cost_gbp,
           ROUND($cost_increase_pct, 1) AS cost_increase_pct, ROUND(s.total_cost_gbp * $cost_increase_pct / 100, 2) AS cost_increase_gbp,
           ROUND(s.cur_md, 1) AS current_markdown_pct,
           ROUND(s.total_cost_gbp * $cost_increase_pct / s.retail_price_gbp, 1) AS markdown_reduction_needed_pts,
           ROUND(s.cur_md - s.total_cost_gbp * $cost_increase_pct / s.retail_price_gbp, 1) AS markdown_pct_needed_to_break_even,
           ROUND(s.total_cost_gbp * $cost_increase_pct / s.retail_price_gbp / NULLIF(s.cur_md, 0) * 100, 0) AS pct_of_current_markdown_to_remove,
           CASE WHEN s.total_cost_gbp * $cost_increase_pct / s.retail_price_gbp <= s.cur_md THEN 'achievable' ELSE 'markdown cannot fall enough' END AS feasibility,
           'reduction (pts of price) = cost * cost increase % / retail price' AS formula
    FROM s
  limit: 1
  example:
    sku: SKU-101897
    cost_increase_pct: 12
- name: calculate_material_cost_at_volume
  desc: Calculate material cost per unit at different purchase volumes, including bulk discounts.
  kind: sql
  args:
    sku:
      required: true
      desc: SKU
    volume_units:
      type: int
      desc: Purchase volume
      default: 5000
  sql: |
    SELECT
      $sku AS sku,
      $volume_units AS volume_units,
      pc.material_cost_gbp AS base_material_cost_gbp,
      CASE
        WHEN $volume_units >= 20000 THEN ROUND(pc.material_cost_gbp * 0.92, 2)
        WHEN $volume_units >= 10000 THEN ROUND(pc.material_cost_gbp * 0.95, 2)
        WHEN $volume_units >= 5000 THEN ROUND(pc.material_cost_gbp * 0.98, 2)
        ELSE pc.material_cost_gbp
      END AS adjusted_material_cost_gbp,
      ROUND(pc.material_cost_gbp - CASE WHEN $volume_units >= 20000 THEN pc.material_cost_gbp * 0.92 ELSE pc.material_cost_gbp END, 2) AS savings_gbp,
      'cost reduction from bulk discount' AS formula
    FROM product_costings pc
    WHERE pc.sku = $sku AND pc.status = 'active'
    LIMIT 1
  limit: 1
  example:
    sku: K-1700
    volume_units: 10000
- name: calculate_next_day_margin_impact
  desc: Calculates margin impact of expedited next-day or premium freight cost for urgent shipments.
  kind: sql
  args:
    standard_freight_cost_gbp:
      type: float
      required: true
      desc: Standard freight cost per unit
    expedited_freight_cost_gbp:
      type: float
      required: true
      desc: Expedited freight cost per unit
    volume_units:
      type: int
      desc: Volume requiring expedite
      default: 100
  sql: |
    SELECT
      ROUND($standard_freight_cost_gbp, 2) AS standard_freight_gbp,
      ROUND($expedited_freight_cost_gbp, 2) AS expedited_freight_gbp,
      ROUND($expedited_freight_cost_gbp - $standard_freight_cost_gbp, 2) AS premium_per_unit_gbp,
      $volume_units AS volume_units,
      ROUND(($expedited_freight_cost_gbp - $standard_freight_cost_gbp) * $volume_units, 2) AS total_premium_gbp,
      'premium = (expedited - standard) * volume' AS formula
  limit: 1
  example:
    standard_freight_cost_gbp: 2.5
    expedited_freight_cost_gbp: 12.0
    volume_units: 500
- name: calculate_price_floor_from_cost
  desc: Calculates minimum retail price floor given cost of goods, target margin and channel mix.
  kind: sql
  args:
    total_cost_gbp:
      type: float
      required: true
      desc: Total cost per unit including all freight and overhead
    target_margin_pct:
      type: float
      desc: Target gross margin %
      default: 50
  sql: |
    SELECT
      ROUND($total_cost_gbp, 2) AS total_cost_gbp,
      ROUND($target_margin_pct, 1) AS target_margin_pct,
      ROUND($total_cost_gbp / (1 - $target_margin_pct / 100), 2) AS minimum_retail_price_gbp,
      ROUND($total_cost_gbp * ($target_margin_pct / 100) / (1 - $target_margin_pct / 100), 2) AS margin_gbp_at_floor,
      'floor_price = cost / (1 - margin_pct)' AS formula
  limit: 1
  example:
    total_cost_gbp: 15
    target_margin_pct: 50
- name: calculate_product_margin_contribution
  desc: Revenue, gross margin, markdown, net margin and share of category and total net margin per SKU over a period. Give a sku or a category.
  kind: sql
  args:
    sku:
      desc: SKU, e.g. K-1700; omit to list every SKU in the category
    category:
      type: str
      desc: Product category, e.g. Small Appliances
    date_from:
      type: date
      desc: Start of the period analysed
      default: -180d
    date_to:
      type: date
      desc: End of the period analysed; default is today
  sql: |
    WITH m AS (
      SELECT sku, any_value(style_id) AS style_id, category, sum(volume_units) AS units, sum(revenue_gbp) AS rev,
             sum(cost_of_goods_gbp) AS cogs, sum(gross_margin_gbp) AS gm, sum(markdown_gbp) AS md, sum(shrink_gbp) AS shr,
             sum(net_margin_gbp) AS nm
      FROM margin_analyses
      WHERE CAST(period_start AS DATE) >= CAST($date_from AS DATE) AND ($date_to IS NULL OR CAST(period_start AS DATE) <= CAST($date_to AS DATE))
      GROUP BY sku, category
    ), t AS (
      SELECT m.*, sum(nm) OVER (PARTITION BY category) AS cat_nm, sum(nm) OVER () AS all_nm,
             rank() OVER (PARTITION BY category ORDER BY nm DESC) AS rk
      FROM m
    )
    SELECT sku, style_id, category, units AS units_sold, ROUND(rev, 2) AS total_revenue_gbp, ROUND(cogs, 2) AS total_cogs_gbp,
           ROUND(gm, 2) AS gross_margin_gbp, ROUND(gm / NULLIF(rev, 0) * 100, 1) AS gross_margin_pct, ROUND(md, 2) AS markdown_gbp,
           ROUND(shr, 2) AS shrink_gbp, ROUND(nm, 2) AS net_margin_contribution_gbp, ROUND(nm / NULLIF(rev, 0) * 100, 1) AS net_margin_pct,
           ROUND(nm / NULLIF(cat_nm, 0) * 100, 1) AS share_of_category_net_margin_pct,
           ROUND(nm / NULLIF(all_nm, 0) * 100, 2) AS share_of_total_net_margin_pct, rk AS rank_in_category,
           'contribution = revenue - cogs - markdown - shrink' AS formula
    FROM t
    WHERE ($sku IS NULL OR sku = $sku) AND ($category IS NULL OR lower(category) = lower($category))
    ORDER BY category, rk
  limit: 20
  example:
    sku: K-1700
- name: calculate_recovered_value_by_route
  desc: Recovered value, handling cost, net recovery, days to cash and risk for each disposition route by item age, with the best route to switch to.
  kind: sql
  args:
    category:
      required: true
      desc: Product category, e.g. Electronics accessories, Knitwear
    cost_per_unit_gbp:
      type: float
      required: true
      desc: Original cost per unit in GBP
    min_age_days:
      type: int
      desc: Only age bands containing items older than this many days, e.g. 60
    stock_type:
      type: enum
      values:
      - returns
      - aged_stock
      desc: Customer returns or aged stock
  sql: |
    WITH base AS (
      SELECT r.route_name, rr.age_band, rr.band_min_days, rr.recovery_rate_pct, rr.handling_cost_gbp, rr.time_to_realise_days,
             rr.risk_rating, rr.volume_last_6m,
             ROUND($cost_per_unit_gbp * rr.recovery_rate_pct / 100, 2) AS recovered_value_gbp,
             ROUND($cost_per_unit_gbp * rr.recovery_rate_pct / 100 - rr.handling_cost_gbp, 2) AS net_recovery_gbp
      FROM recovery_rates rr JOIN recovery_routes r ON r.route_id = rr.route_id
      WHERE lower(rr.category) = lower($category) AND ($stock_type IS NULL OR rr.stock_type = $stock_type)
        AND ($min_age_days IS NULL OR rr.band_max_days > $min_age_days)
    ), cur AS (
      SELECT age_band, arg_max(route_name, volume_last_6m) AS current_main_route, arg_max(net_recovery_gbp, volume_last_6m) AS cur_net,
             sum(volume_last_6m) AS band_units
      FROM base GROUP BY age_band
    )
    SELECT b.age_band, b.route_name, b.recovery_rate_pct, b.recovered_value_gbp, b.handling_cost_gbp, b.net_recovery_gbp,
           b.time_to_realise_days, b.risk_rating, b.volume_last_6m AS units_last_6m, c.current_main_route,
           ROUND((b.net_recovery_gbp - c.cur_net) * c.band_units, 0) AS gain_6m_if_band_moved_here_gbp,
           rank() OVER (PARTITION BY b.age_band ORDER BY b.net_recovery_gbp DESC) AS rank_in_band
    FROM base b JOIN cur c USING (age_band)
    ORDER BY b.band_min_days, b.net_recovery_gbp DESC
  limit: 20
  example:
    category: Electronics accessories
    cost_per_unit_gbp: 20
    min_age_days: 60
- name: calculate_recovery_potential_for_lines
  desc: Recovery potential by disposition route for aged stock of a category at an age threshold, as % of cost and, given stock value, in pounds.
  kind: sql
  args:
    category:
      desc: Product category, e.g. Knitwear; blank ranks all categories
    min_age_days:
      type: int
      desc: Minimum age of the stock in days
      default: 180
    stock_value_gbp:
      type: float
      desc: Aged stock value at cost for the category; scales the result to pounds
  sql: |
    SELECT rr.category, r.route_name, rr.age_band, rr.recovery_rate_pct, rr.handling_cost_gbp, rr.time_to_realise_days,
           rr.risk_rating, rr.avg_unit_cost_gbp,
           ROUND(rr.recovery_rate_pct - rr.handling_cost_gbp / rr.avg_unit_cost_gbp * 100, 1) AS net_recovery_pct_of_cost,
           ROUND($stock_value_gbp * (rr.recovery_rate_pct - rr.handling_cost_gbp / rr.avg_unit_cost_gbp * 100) / 100, 0) AS expected_recovery_gbp,
           rank() OVER (PARTITION BY rr.category ORDER BY rr.recovery_rate_pct - rr.handling_cost_gbp / rr.avg_unit_cost_gbp * 100 DESC) AS route_rank
    FROM recovery_rates rr JOIN recovery_routes r ON r.route_id = rr.route_id
    WHERE rr.stock_type = 'aged_stock' AND ($category IS NULL OR lower(rr.category) = lower($category))
      AND rr.band_min_days <= $min_age_days + 1 AND rr.band_max_days > $min_age_days
    ORDER BY net_recovery_pct_of_cost DESC
  limit: 40
  example:
    category: Knitwear
    min_age_days: 180
    stock_value_gbp: 1000000
- name: calculate_structure_cost_comparison
  desc: Compare total cost structure between two sourcing origins or manufacturing scenarios.
  kind: sql
  args:
    style_id:
      required: true
      desc: Style
    origin_1:
      type: str
      desc: Origin country code 1
    origin_2:
      type: str
      desc: Origin country code 2
  sql: |
    SELECT
      $style_id AS style_id,
      $origin_1 AS origin_1,
      $origin_2 AS origin_2,
      'Compare material, labour and freight costs between origins' AS comparison_type,
      'Requires costing versions for each origin to be seeded separately' AS note
  limit: 1
  example:
    style_id: STY-5520
    origin_1: VN
    origin_2: PT
- name: calculate_target_cost
  desc: Target landed cost implied by retail price and margin goal, split into material, labour and other budgets, compared with a SKU's current cost.
  kind: sql
  args:
    retail_price_gbp:
      type: float
      required: true
      desc: Retail price in GBP, e.g. the competitor price to match
    sku:
      desc: SKU whose current cost and cost split to compare, e.g. SKU-102590
    target_margin_pct:
      type: float
      desc: Target gross margin %; default is the SKU's costing target
  sql: |
    WITH s AS (
      SELECT total_cost_gbp, material_cost_gbp, labour_cost_gbp, total_cost_gbp - material_cost_gbp - labour_cost_gbp AS other_cost_gbp, target_margin_pct
      FROM product_costings WHERE sku = $sku AND status = 'active' LIMIT 1
    ), t AS (
      SELECT COALESCE($target_margin_pct, (SELECT target_margin_pct FROM s)) AS tm
    )
    SELECT ROUND($retail_price_gbp, 2) AS retail_price_gbp, ROUND(t.tm, 1) AS target_margin_pct,
           ROUND($retail_price_gbp * (1 - t.tm / 100), 2) AS target_cost_gbp,
           ROUND($retail_price_gbp * (1 - t.tm / 100) * s.material_cost_gbp / s.total_cost_gbp, 2) AS material_budget_gbp,
           ROUND($retail_price_gbp * (1 - t.tm / 100) * s.labour_cost_gbp / s.total_cost_gbp, 2) AS labour_budget_gbp,
           ROUND($retail_price_gbp * (1 - t.tm / 100) * s.other_cost_gbp / s.total_cost_gbp, 2) AS overhead_freight_tooling_budget_gbp,
           ROUND(s.total_cost_gbp, 2) AS current_cost_gbp,
           ROUND(s.total_cost_gbp - $retail_price_gbp * (1 - t.tm / 100), 2) AS cost_reduction_needed_gbp,
           ROUND((s.total_cost_gbp - $retail_price_gbp * (1 - t.tm / 100)) / s.total_cost_gbp * 100, 1) AS cost_reduction_needed_pct,
           ROUND((1 - s.total_cost_gbp / $retail_price_gbp) * 100, 1) AS margin_at_current_cost_pct,
           'target_cost = retail_price * (1 - target_margin); budgets follow the SKU cost split' AS formula
    FROM t LEFT JOIN s ON true
  limit: 1
  example:
    retail_price_gbp: 52
    sku: SKU-102590
- name: calculate_tooling_amortisation_per_unit
  desc: Per-unit tooling cost spread over expected volume, and the unit price including tooling when a unit cost is given.
  kind: sql
  args:
    tooling_cost_gbp:
      type: float
      required: true
      desc: Total tooling cost in GBP
    lifetime_volume_units:
      type: int
      required: true
      desc: Expected lifetime or order volume in units
    unit_cost_gbp:
      type: float
      desc: Unit cost before tooling (for example FOB); adds the unit price including tooling
  sql: |
    SELECT ROUND($tooling_cost_gbp, 2) AS total_tooling_cost_gbp, $lifetime_volume_units AS lifetime_volume_units,
           ROUND($tooling_cost_gbp / NULLIF($lifetime_volume_units, 0), 4) AS tooling_per_unit_gbp,
           ROUND($unit_cost_gbp, 2) AS unit_cost_before_tooling_gbp,
           ROUND($unit_cost_gbp + $tooling_cost_gbp / NULLIF($lifetime_volume_units, 0), 2) AS unit_cost_incl_tooling_gbp,
           ROUND($tooling_cost_gbp / NULLIF($lifetime_volume_units, 0) / NULLIF($unit_cost_gbp, 0) * 100, 1) AS tooling_uplift_pct,
           'tooling_per_unit = total_tooling / volume; unit cost incl tooling = unit cost + tooling_per_unit' AS formula
  limit: 1
  example:
    tooling_cost_gbp: 15000
    lifetime_volume_units: 50000
- name: calculate_trial_cost_and_duration
  desc: Calculate trial cost and duration for new material evaluation at test volume. Returns cost per unit and time to complete.
  kind: sql
  args:
    material_id:
      type: str
      desc: Material identifier, e.g. MAT-COTTON-10OZ
    test_volume_units:
      type: int
      desc: Test volume units
      default: 500
    days_to_produce:
      type: int
      desc: Days to produce trial
      default: 14
  sql: |
    SELECT
      $material_id AS material_id,
      $test_volume_units AS test_volume_units,
      $days_to_produce AS days_to_produce,
      COALESCE((SELECT ROUND(cost_per_unit_gbp, 3) FROM material_costs WHERE material_id = $material_id ORDER BY recorded_at DESC LIMIT 1), 5.0) AS cost_per_unit_gbp,
      ROUND(COALESCE((SELECT cost_per_unit_gbp FROM material_costs WHERE material_id = $material_id ORDER BY recorded_at DESC LIMIT 1), 5.0) * $test_volume_units, 2) AS total_trial_cost_gbp,
      'trial_cost = material_cost_per_unit * test_volume' AS formula
  limit: 1
  example:
    material_id: MAT-COTTON-10OZ
- name: calculate_unit_cost_at_volumes
  desc: Unit cost breakdown at several order volumes for a SKU or style, with scale discounts on material and tooling spread over volume.
  kind: sql
  args:
    sku:
      desc: SKU, e.g. K-1700; give a sku or a style
    style_id:
      desc: Style, e.g. STY-5520, used when no sku is given
    volumes:
      type: str
      desc: Volume levels, comma-separated, e.g. 20000,50000,100000
      default: 1000,5000,10000
  sql: |
    WITH b AS (
      SELECT avg(quantity_units) AS q0, avg(material_cost_gbp) AS mat, avg(labour_cost_gbp) AS lab, avg(overhead_cost_gbp) AS ovh,
             avg(freight_cost_gbp) AS frt, avg(tooling_cost_gbp) AS tool, avg(total_cost_gbp) AS tot, avg(retail_price_gbp) AS retail
      FROM product_costings
      WHERE status = 'active' AND ($sku IS NOT NULL OR $style_id IS NOT NULL)
        AND ($sku IS NULL OR sku = $sku) AND ($style_id IS NULL OR style_id = $style_id)
      HAVING count(*) > 0
    ), v AS (
      SELECT CAST(CASE WHEN lower(trim(x)) LIKE '%k' THEN CAST(replace(lower(trim(x)), 'k', '') AS DOUBLE) * 1000
                       ELSE CAST(trim(x) AS DOUBLE) END AS BIGINT) AS volume
      FROM (SELECT unnest(string_split($volumes, ',')) AS x)
    ), w AS (
      SELECT v.volume, b.*,
             CASE WHEN v.volume >= 100000 THEN 0.88 WHEN v.volume >= 50000 THEN 0.90 WHEN v.volume >= 25000 THEN 0.92
                  WHEN v.volume >= 10000 THEN 0.94 WHEN v.volume >= 5000 THEN 0.96 WHEN v.volume >= 2000 THEN 0.98 ELSE 1.0 END AS f_v,
             CASE WHEN b.q0 >= 100000 THEN 0.88 WHEN b.q0 >= 50000 THEN 0.90 WHEN b.q0 >= 25000 THEN 0.92
                  WHEN b.q0 >= 10000 THEN 0.94 WHEN b.q0 >= 5000 THEN 0.96 WHEN b.q0 >= 2000 THEN 0.98 ELSE 1.0 END AS f_0
      FROM v CROSS JOIN b
    )
    SELECT $sku AS sku, $style_id AS style_id, volume AS volume_units,
           ROUND(mat * f_v / f_0, 2) AS material_cost_gbp, ROUND(lab, 2) AS labour_cost_gbp, ROUND(ovh, 2) AS overhead_cost_gbp,
           ROUND(frt, 2) AS freight_cost_gbp, ROUND(tool * q0 / volume, 2) AS tooling_per_unit_gbp,
           ROUND(mat * f_v / f_0 + lab + ovh + frt + tool * q0 / volume, 2) AS unit_cost_gbp,
           ROUND(tot, 2) AS costed_unit_cost_gbp, CAST(ROUND(q0, 0) AS BIGINT) AS costed_volume_units,
           ROUND((tot - (mat * f_v / f_0 + lab + ovh + frt + tool * q0 / volume)) / tot * 100, 1) AS saving_vs_costed_pct,
           'unit cost = material * scale factor + labour + overhead + freight + total tooling / volume' AS formula
    FROM w ORDER BY volume
  limit: 10
  example:
    sku: K-1700
    volumes: 5000,20000
- name: calculate_unit_cost_impact_of_material_change
  desc: Unit cost, margin and percentage change for a SKU when its fabric switches from one material to another, from latest material prices and fabric metres per unit.
  kind: sql
  args:
    sku:
      required: true
    old_material_id:
      type: str
      required: true
      desc: Current material id, e.g. MAT-POLYESTER-100
    new_material_id:
      type: str
      required: true
      desc: Alternative material id, e.g. MAT-RPET-100
    usage_per_unit:
      type: float
      desc: Metres of fabric per unit; default is the metres on the SKU's costing sheet
  sql: |
    WITH px AS (
      SELECT material_id, any_value(material_name) AS material_name, any_value(unit) AS unit, avg(c) AS price
      FROM (SELECT material_id, supplier_id, any_value(material_name) AS material_name, any_value(unit) AS unit,
                   arg_max(cost_per_unit_gbp, recorded_at) AS c
            FROM material_costs GROUP BY material_id, supplier_id)
      GROUP BY material_id
    ), s AS (
      SELECT pc.sku, pc.style_id, pc.total_cost_gbp, pc.retail_price_gbp,
             COALESCE($usage_per_unit, (SELECT sum(d.quantity) FROM cost_sheet_details d
                                        WHERE d.costing_id = pc.costing_id AND d.component_type = 'fabric' AND d.unit = 'metre')) AS usage
      FROM product_costings pc WHERE pc.sku = $sku AND pc.status = 'active' ORDER BY pc.updated_at DESC LIMIT 1
    )
    SELECT s.sku, s.style_id, o.material_id AS old_material_id, o.material_name AS old_material, n.material_id AS new_material_id,
           n.material_name AS new_material, o.unit AS price_unit, ROUND(o.price, 3) AS old_cost_gbp, ROUND(n.price, 3) AS new_cost_gbp,
           ROUND((n.price - o.price) / o.price * 100, 1) AS material_price_change_pct, ROUND(s.usage, 2) AS usage_per_unit,
           ROUND(s.usage * (n.price - o.price), 2) AS cost_change_gbp,
           ROUND(s.total_cost_gbp, 2) AS current_unit_cost_gbp, ROUND(s.total_cost_gbp + s.usage * (n.price - o.price), 2) AS new_unit_cost_gbp,
           ROUND(s.usage * (n.price - o.price) / s.total_cost_gbp * 100, 1) AS unit_cost_change_pct,
           ROUND((s.retail_price_gbp - s.total_cost_gbp - s.usage * (n.price - o.price)) / s.retail_price_gbp * 100, 1) AS new_margin_pct,
           'cost_change = metres per unit * (new price - old price)' AS formula
    FROM s JOIN px o ON o.material_id = $old_material_id JOIN px n ON n.material_id = $new_material_id
  limit: 1
  example:
    sku: SKU-103157
    old_material_id: MAT-POLYESTER-100
    new_material_id: MAT-NYLON-SPANDEX
- name: calculate_wage_impact_on_fob
  desc: FOB impact of a wage rise in an origin country, from its latest FOB split into labour and other cost, in pounds and percent.
  kind: sql
  args:
    origin_country:
      required: true
      desc: ISO country code, e.g. VN, BD, KH
    wage_increase_pct:
      type: float
      desc: Wage increase percentage
      default: 5
  sql: |
    SELECT h.origin_country, h.basis, h.period_start, $wage_increase_pct AS wage_increase_pct, h.avg_fob_cost_gbp AS base_fob_cost_gbp,
           h.avg_labour_cost_gbp AS base_labour_cost_gbp, h.labour_share_pct,
           ROUND(h.avg_labour_cost_gbp * $wage_increase_pct / 100, 2) AS fob_increase_gbp,
           ROUND(h.avg_fob_cost_gbp + h.avg_labour_cost_gbp * $wage_increase_pct / 100, 2) AS fob_after_wage_increase_gbp,
           ROUND(h.avg_labour_cost_gbp * $wage_increase_pct / h.avg_fob_cost_gbp, 2) AS fob_increase_pct,
           'fob increase = labour cost per unit * wage increase %' AS formula
    FROM fob_price_history h
    WHERE upper(h.origin_country) = upper($origin_country)
    ORDER BY h.period_start DESC LIMIT 1
  limit: 1
  example:
    origin_country: VN
    wage_increase_pct: 8
- name: compare_supplier_pass_through_to_market
  desc: Supplier price index change versus the market index change, by supplier, with pass-through % and who passed on more than the market. Leave supplier blank to rank all.
  kind: sql
  args:
    supplier_id:
      desc: Supplier, e.g. SUP-0064. Leave blank to compare all suppliers.
    sku:
      desc: SKU to limit to, e.g. SKU-100007
    commodity:
      type: str
      desc: Commodity behind the market index, e.g. COTTON
  sql: |
    WITH h AS (
      SELECT sch.*, row_number() OVER (PARTITION BY sch.supplier_id, sch.sku ORDER BY sch.period) AS rn_first,
             row_number() OVER (PARTITION BY sch.supplier_id, sch.sku ORDER BY sch.period DESC) AS rn_last
      FROM supplier_cost_history sch
      WHERE ($supplier_id IS NULL OR sch.supplier_id = $supplier_id) AND ($sku IS NULL OR sch.sku = $sku)
        AND ($commodity IS NULL OR upper(sch.commodity) = upper($commodity))
    ), f AS (
      SELECT supplier_id, sku, commodity,
             max(market_price_index) FILTER (WHERE rn_first = 1) AS m0, max(market_price_index) FILTER (WHERE rn_last = 1) AS m1,
             max(supplier_price_index) FILTER (WHERE rn_first = 1) AS s0, max(supplier_price_index) FILTER (WHERE rn_last = 1) AS s1
      FROM h GROUP BY supplier_id, sku, commodity
    ), g AS (
      SELECT supplier_id, commodity, count(*) AS sku_count, avg((m1 / m0 - 1) * 100) AS market_change_pct, avg((s1 / s0 - 1) * 100) AS supplier_change_pct
      FROM f GROUP BY supplier_id, commodity
    )
    SELECT g.supplier_id, s.name AS supplier_name, g.commodity, g.sku_count, ROUND(g.market_change_pct, 1) AS market_change_pct,
      ROUND(g.supplier_change_pct, 1) AS supplier_change_pct, ROUND(g.supplier_change_pct - g.market_change_pct, 1) AS excess_over_market_pts,
      CASE WHEN abs(g.market_change_pct) >= 0.5 THEN ROUND(g.supplier_change_pct / g.market_change_pct * 100, 0) END AS pass_through_pct,
      CASE WHEN g.supplier_change_pct > g.market_change_pct THEN 'yes' ELSE 'no' END AS passed_on_more_than_market,
      'pass-through % = supplier index change / market index change over the period' AS formula
    FROM g JOIN master.suppliers s ON s.supplier_id = g.supplier_id
    ORDER BY excess_over_market_pts DESC
  limit: 20
  example:
    commodity: COTTON
- name: create_costing_version_for_product
  desc: Saves a new costing version (scenario) for a product at a given volume, with unit cost, price and margin. Returns the new costing.
  kind: insert
  table: product_costings
  id_prefix: CST-
  defaults:
    status: scenario
    version: 2
    notes: Costing version saved at {quantity_units} units
  args:
    sku:
      required: true
    style_id:
      required: true
    season:
      type: str
      required: true
      desc: Season code, e.g. SS27
    quantity_units:
      type: int
      required: true
      desc: Volume units for this version
    total_cost_gbp:
      type: float
      required: true
      desc: Total cost per unit in GBP at this volume
    retail_price_gbp:
      type: float
      required: true
      desc: Retail price per unit in GBP
    gross_margin_gbp:
      type: float
      required: true
    gross_margin_pct:
      type: float
      required: true
  example:
    sku: K-1700
    style_id: STY-K-1700
    season: SS27
    quantity_units: 5000
    total_cost_gbp: 23.5
    retail_price_gbp: 77.99
    gross_margin_gbp: 54.49
    gross_margin_pct: 69.9
- name: get_buying_margin_by_category_period
  desc: Gross buying margin % for a category over a period against the same period a year earlier, with the change in points.
  kind: sql
  args:
    category:
      required: true
      desc: Product category, e.g. Small Appliances
    department:
      desc: Department, e.g. Electricals
    period_from:
      type: date
      default: -90d
      desc: Trading periods starting on or after this date
    period_to:
      type: date
      default: today
      desc: Trading periods starting on or before this date
  sql: |
    WITH cur AS (
      SELECT category, sum(revenue_gbp) AS rev, sum(cost_of_goods_gbp) AS cogs, sum(gross_margin_gbp) AS gm, count(DISTINCT sku) AS skus
      FROM margin_analyses
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department))
        AND period_start BETWEEN CAST($period_from AS DATE) AND CAST($period_to AS DATE) GROUP BY category
    ), prev AS (
      SELECT category, sum(revenue_gbp) AS rev, sum(cost_of_goods_gbp) AS cogs, sum(gross_margin_gbp) AS gm
      FROM margin_analyses
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department))
        AND period_start + INTERVAL 364 DAY IN (SELECT DISTINCT period_start FROM margin_analyses
                                                WHERE period_start BETWEEN CAST($period_from AS DATE) AND CAST($period_to AS DATE)) GROUP BY category
    )
    SELECT cur.category, ROUND(cur.rev, 0) AS revenue_gbp, ROUND(cur.cogs, 0) AS cogs_gbp, ROUND(cur.gm / cur.rev * 100, 1) AS buying_margin_pct,
           ROUND(prev.gm / prev.rev * 100, 1) AS same_period_last_year_pct,
           ROUND(cur.gm / cur.rev * 100 - prev.gm / prev.rev * 100, 1) AS change_pts, cur.skus AS sku_count
    FROM cur LEFT JOIN prev USING (category)
  limit: 1
  example:
    category: Small Appliances
- name: get_category_margin_benchmarks
  desc: Gross, net and plan margin benchmarks by category and channel, optionally for a whole department. Use to compare categories.
  kind: sql
  args:
    category:
      desc: Product category, e.g. Small Appliances; omit to compare every category in the department
    department:
      type: str
      desc: Department, e.g. Electricals, Home
    date_from:
      type: date
      desc: Only margin periods starting on or after this date; default is all history
  sql: |
    SELECT m.department, m.category, m.channel,
           ROUND(AVG(m.gross_margin_pct), 1) AS avg_margin_pct,
           ROUND(MIN(m.gross_margin_pct), 1) AS min_margin_pct,
           ROUND(MAX(m.gross_margin_pct), 1) AS max_margin_pct,
           ROUND(AVG(m.net_margin_pct), 1) AS avg_net_margin_pct,
           ROUND(AVG(m.plan_margin_pct), 1) AS avg_plan_net_margin_pct,
           COUNT(DISTINCT m.sku) AS sku_count,
           COUNT(*) AS record_count
    FROM margin_analyses m
    WHERE ($category IS NULL OR lower(m.category) = lower($category))
      AND ($department IS NULL OR lower(m.department) = lower($department))
      AND ($category IS NOT NULL OR $department IS NOT NULL)
      AND ($date_from IS NULL OR CAST(m.period_start AS DATE) >= CAST($date_from AS DATE))
    GROUP BY m.department, m.category, m.channel
    ORDER BY avg_margin_pct DESC, m.category, m.channel
  limit: 30
  example:
    category: Dresses
- name: get_channel_margin_for_product
  desc: Retrieves channel margin for product.
  kind: sql
  args:
    sku:
      required: true
    channel:
      type: enum
      values:
      - store
      - online
      - outlet
      - wholesale
      - marketplace
      desc: Sales channel
  sql: |
    SELECT
      m.sku,
      m.channel,
      ROUND(AVG(m.revenue_gbp), 2) AS avg_revenue_gbp,
      ROUND(AVG(m.cost_of_goods_gbp), 2) AS avg_cogs_gbp,
      ROUND(AVG(m.gross_margin_gbp), 2) AS avg_margin_gbp,
      ROUND(AVG(m.gross_margin_pct), 1) AS avg_margin_pct,
      COUNT(*) AS periods_recorded
    FROM margin_analyses m
    WHERE m.sku = $sku AND m.channel = $channel
    GROUP BY m.sku, m.channel
  limit: 1
  example:
    sku: K-1700
    channel: store
- name: get_channel_revenue_and_margin
  desc: Revenue and margin by channel and segment.
  kind: sql
  args:
    period_from:
      type: date
      default: -35d
      desc: Trading periods starting on or after this date; the default is the last 4-week period
  sql: |
    SELECT
      m.channel,
      ROUND(SUM(m.revenue_gbp), 2) AS total_revenue_gbp,
      ROUND(SUM(m.cost_of_goods_gbp), 2) AS total_cogs_gbp,
      ROUND(SUM(m.gross_margin_gbp), 2) AS total_margin_gbp,
      ROUND(SUM(m.gross_margin_gbp) / SUM(m.revenue_gbp) * 100, 1) AS margin_pct,
      COUNT(DISTINCT m.sku) AS sku_count
    FROM margin_analyses m
    WHERE m.period_start >= CAST($period_from AS DATE)
    GROUP BY m.channel
    ORDER BY total_revenue_gbp DESC
  limit: 10
  example: {}
- name: get_cost_price_changes_for_category
  desc: Retrieves cost price changes for category.
  kind: sql
  args:
    category:
      required: true
  sql: |
    SELECT
      m.category,
      m.period,
      ROUND(AVG(m.revenue_gbp), 2) AS avg_revenue_gbp,
      ROUND(AVG(m.cost_of_goods_gbp), 2) AS avg_cogs_gbp,
      COUNT(DISTINCT m.sku) AS sku_count
    FROM margin_analyses m
    WHERE m.category = $category
    GROUP BY m.category, m.period
    ORDER BY m.period DESC
    LIMIT 12
  limit: 12
  example:
    category: Dresses
- name: get_costed_margin_for_product
  desc: Costed price, unit cost, gross margin and margin % for a SKU against its target margin, with the gap to target. Use to find products below target.
  kind: sql
  args:
    sku:
      required: true
  sql: |
    SELECT
      p.sku,
      p.style_id,
      p.season,
      p.origin_country,
      ROUND(p.retail_price_gbp, 2) AS retail_price_gbp,
      ROUND(p.total_cost_gbp, 2) AS costed_cost_gbp,
      ROUND(p.gross_margin_gbp, 2) AS margin_gbp,
      ROUND(p.gross_margin_pct, 1) AS margin_pct,
      ROUND(p.target_margin_pct, 1) AS target_margin_pct,
      ROUND(p.target_margin_pct - p.gross_margin_pct, 1) AS variance_to_target_pct,
      CASE WHEN p.gross_margin_pct < p.target_margin_pct THEN 'below target' ELSE 'on or above target' END AS vs_target
    FROM product_costings p
    WHERE p.sku = $sku AND p.status = 'active'
    ORDER BY p.updated_at DESC
    LIMIT 1
  limit: 1
  example:
    sku: K-1700
- name: get_costed_vs_actual_cost_by_product
  desc: Return costed vs actual cost by product.
  kind: sql
  args:
    sku:
      required: true
  sql: |
    SELECT
      p.sku,
      p.style_id,
      ROUND(p.total_cost_gbp, 2) AS costed_cost_gbp,
      ROUND(COALESCE((SELECT ROUND(AVG(actual_cost_gbp), 2) FROM supplier_cost_history WHERE sku = $sku), p.total_cost_gbp), 2) AS actual_cost_gbp,
      ROUND(COALESCE((SELECT ROUND(AVG(actual_cost_gbp), 2) FROM supplier_cost_history WHERE sku = $sku), p.total_cost_gbp) - p.total_cost_gbp, 2) AS variance_gbp,
      ROUND((COALESCE((SELECT ROUND(AVG(actual_cost_gbp), 2) FROM supplier_cost_history WHERE sku = $sku), p.total_cost_gbp) - p.total_cost_gbp) / p.total_cost_gbp * 100, 1) AS variance_pct
    FROM product_costings p
    WHERE p.sku = $sku AND p.status = 'active'
    ORDER BY p.updated_at DESC
    LIMIT 1
  limit: 1
  example:
    sku: K-1700
- name: get_costing_sheet_for_product
  desc: Costing sheet for a SKU, active and scenario versions - origin, volume, cost components with shares, total cost, price and margin. Use before changing a costing.
  kind: sql
  args:
    sku:
      required: true
  sql: |
    SELECT
      p.costing_id,
      p.sku,
      p.style_id,
      p.season,
      p.version,
      p.origin_country,
      p.supplier_id,
      p.factory_id,
      p.quantity_units,
      ROUND(p.material_cost_gbp, 2) AS material_cost_gbp,
      ROUND(p.labour_cost_gbp, 2) AS labour_cost_gbp,
      ROUND(p.overhead_cost_gbp, 2) AS overhead_cost_gbp,
      ROUND(p.freight_cost_gbp, 2) AS freight_cost_gbp,
      ROUND(p.tooling_cost_gbp, 2) AS tooling_cost_gbp,
      ROUND(p.total_cost_gbp, 2) AS total_cost_gbp,
      ROUND(p.material_cost_gbp / p.total_cost_gbp * 100, 1) AS material_share_pct,
      ROUND(p.labour_cost_gbp / p.total_cost_gbp * 100, 1) AS labour_share_pct,
      ROUND(p.retail_price_gbp, 2) AS retail_price_gbp,
      ROUND(p.gross_margin_gbp, 2) AS margin_gbp,
      ROUND(p.gross_margin_pct, 1) AS margin_pct,
      ROUND(p.target_margin_pct, 1) AS target_margin_pct,
      p.status,
      p.notes
    FROM product_costings p
    WHERE p.sku = $sku AND p.status IN ('active', 'scenario')
    ORDER BY p.version DESC, p.updated_at DESC
  limit: 10
  example:
    sku: K-1700
- name: get_expected_recovery_rates
  desc: Expected recovery on aged or clearance stock.
  kind: sql
  args:
    category:
      required: true
    age_band:
      type: str
      desc: Age band, e.g. 0-30d, 31-60d, 61-180d, 180d+
      default: 0-30d
  sql: |
    SELECT
      r.category,
      r.age_band,
      ro.route_name,
      ROUND(r.recovery_rate_pct, 1) AS recovery_rate_pct,
      ROUND(r.handling_cost_gbp, 2) AS handling_cost_gbp,
      r.time_to_realise_days,
      r.risk_rating,
      r.volume_last_6m
    FROM recovery_rates r
    JOIN recovery_routes ro ON r.route_id = ro.route_id
    WHERE lower(r.category) = lower($category) AND r.age_band = $age_band
    ORDER BY r.recovery_rate_pct DESC
  limit: 10
  example:
    category: Electronics accessories
    age_band: 0-30d
- name: get_fabric_cost_history_by_supplier
  desc: Fabric cost per unit by supplier over time, with the change since the first record and the commodity index change. Leave supplier blank to compare suppliers.
  kind: sql
  args:
    supplier_id:
      desc: Supplier, e.g. SUP-0064. Leave blank for all suppliers of the material.
    material_id:
      type: str
      desc: Material, e.g. MAT-COTTON-10OZ
    material_type:
      type: enum
      values:
      - fabric
      - packaging
      - component
      - dyes_chemicals
      default: fabric
  sql: |
    SELECT m.material_id, m.material_name, m.supplier_id, s.name AS supplier_name, m.recorded_at, m.unit,
      ROUND(m.cost_per_unit_gbp, 3) AS cost_per_unit_gbp, ROUND(m.index_price_gbp, 3) AS index_price_gbp,
      ROUND((m.cost_per_unit_gbp / first_value(m.cost_per_unit_gbp) OVER w - 1) * 100, 1) AS cost_change_since_first_pct,
      ROUND((m.index_price_gbp / first_value(m.index_price_gbp) OVER w - 1) * 100, 1) AS index_change_since_first_pct
    FROM material_costs m JOIN master.suppliers s ON s.supplier_id = m.supplier_id
    WHERE ($supplier_id IS NULL OR m.supplier_id = $supplier_id) AND ($material_id IS NULL OR upper(m.material_id) = upper($material_id))
      AND m.material_type = $material_type
    WINDOW w AS (PARTITION BY m.material_id, m.supplier_id ORDER BY m.recorded_at)
    ORDER BY m.material_id, m.supplier_id, m.recorded_at
  limit: 100
  example:
    supplier_id: SUP-0001
- name: get_factory_cost_quotes_by_country
  desc: Factory FOB and freight cost quotes for an origin country, optionally one category, with a country average. Includes prospective RFQ quotes.
  kind: sql
  args:
    origin_country:
      required: true
      desc: ISO country code, e.g. VN, ID, PT
    category:
      desc: Product category, e.g. Footwear
  sql: |
    SELECT q.origin_country, q.category, q.quote_status, q.factory_id, q.supplier_id, q.style_count,
           ROUND(q.fob_cost_gbp, 2) AS fob_cost_gbp, ROUND(q.freight_cost_gbp, 2) AS freight_cost_gbp,
           ROUND(q.fob_cost_gbp + q.freight_cost_gbp, 2) AS cost_before_duty_gbp, q.lead_time_days,
           ROUND(avg(q.fob_cost_gbp) OVER (PARTITION BY q.origin_country, q.category), 2) AS country_avg_fob_gbp,
           ROUND(avg(q.fob_cost_gbp + q.freight_cost_gbp) OVER (PARTITION BY q.origin_country, q.category), 2) AS country_avg_cost_before_duty_gbp,
           q.notes
    FROM origin_cost_quotes q
    WHERE upper(q.origin_country) = upper($origin_country) AND ($category IS NULL OR lower(q.category) = lower($category))
    ORDER BY q.category, q.fob_cost_gbp
  limit: 30
  example:
    origin_country: VN
    category: Footwear
- name: get_fob_price_history_by_country
  desc: FOB cost per unit by 4-week period for an origin country, with labour share and change against a year earlier.
  kind: sql
  args:
    origin_country:
      required: true
      desc: ISO country code, e.g. VN, BD, KH
    period_from:
      type: date
      default: -400d
      desc: Periods starting on or after this date
  sql: |
    SELECT h.origin_country, h.period_start, h.avg_fob_cost_gbp, h.avg_material_cost_gbp, h.avg_labour_cost_gbp, h.labour_share_pct, h.basis,
           ROUND((h.avg_fob_cost_gbp / lag(h.avg_fob_cost_gbp, 13) OVER (ORDER BY h.period_start) - 1) * 100, 1) AS fob_change_vs_year_ago_pct,
           ROUND((h.avg_labour_cost_gbp / lag(h.avg_labour_cost_gbp, 13) OVER (ORDER BY h.period_start) - 1) * 100, 1) AS labour_change_vs_year_ago_pct,
           h.sku_count
    FROM fob_price_history h
    WHERE upper(h.origin_country) = upper($origin_country)
    QUALIFY h.period_start >= CAST($period_from AS DATE)
    ORDER BY h.period_start DESC
  limit: 20
  example:
    origin_country: VN
- name: get_gross_margin_bridge
  desc: Gross margin movement bridged by driver.
  kind: sql
  args:
    category:
      required: true
  sql: |
    SELECT
      v.category,
      v.department,
      v.period_start,
      v.total_variance_pct,
      v.cost_driver_pct,
      v.fx_driver_pct,
      v.mix_driver_pct,
      v.supplier_driver_pct,
      v.markdown_driver_pct,
      v.other_driver_pct,
      v.notes
    FROM cost_variance_drivers v
    WHERE v.category = $category AND v.basis = 'vs_plan'
    ORDER BY v.period_start DESC, v.department
    LIMIT 12
  limit: 12
  example:
    category: Dresses
- name: get_historical_costings_for_similar_styles
  desc: Costings of similar styles we have bought (same category and department, similar price) by line - fabric, trims, labour, overhead - with an average benchmark row.
  kind: sql
  args:
    style_id:
      required: true
      desc: Reference style, e.g. STY-4595; similar styles share its category and department
    price_band_pct:
      type: float
      desc: Similar means retail price within this percentage of the reference style's
      default: 35
  sql: |
    WITH ref AS (
      SELECT any_value(category) AS category, any_value(department) AS department, avg(retail_price_gbp) AS price
      FROM product_costings WHERE style_id = $style_id AND status IN ('active', 'obsolete') HAVING count(*) > 0
    ), per_sku AS (
      SELECT pc.costing_id, pc.style_id, pc.season, pc.origin_country, pc.supplier_id, pc.labour_cost_gbp AS labour,
             pc.overhead_cost_gbp AS overhead, pc.total_cost_gbp AS tot, pc.retail_price_gbp AS retail, pc.gross_margin_pct AS gm_pct,
             pc.updated_at AS upd,
             COALESCE(sum(d.total_cost_gbp) FILTER (WHERE d.component_type = 'fabric'), 0) AS fabric,
             COALESCE(sum(d.total_cost_gbp) FILTER (WHERE d.component_type = 'trimming'), 0) AS trims
      FROM product_costings pc CROSS JOIN ref LEFT JOIN cost_sheet_details d ON d.costing_id = pc.costing_id
      WHERE pc.category = ref.category AND pc.department = ref.department AND pc.style_id <> $style_id
        AND pc.status IN ('active', 'obsolete') AND abs(pc.retail_price_gbp / ref.price - 1) <= $price_band_pct / 100
      GROUP BY pc.costing_id, pc.style_id, pc.season, pc.origin_country, pc.supplier_id, pc.labour_cost_gbp, pc.overhead_cost_gbp,
               pc.total_cost_gbp, pc.retail_price_gbp, pc.gross_margin_pct, pc.updated_at
    ), by_style AS (
      SELECT style_id, any_value(season) AS season, any_value(origin_country) AS origin_country, any_value(supplier_id) AS supplier_id,
             count(*) AS sku_count, avg(fabric) AS fabric, avg(trims) AS trims, avg(labour) AS labour, avg(overhead) AS overhead,
             avg(tot) AS tot, avg(retail) AS retail, avg(gm_pct) AS gm_pct, max(upd) AS upd
      FROM per_sku GROUP BY style_id
    )
    SELECT row_type, style_id, season, origin_country, supplier_id, sku_count, fabric_gbp, trims_gbp, labour_gbp, overhead_gbp,
           cost_gbp, price_gbp, margin_pct
    FROM (
      SELECT 'style' AS row_type, style_id, season, origin_country, supplier_id, sku_count, ROUND(fabric, 2) AS fabric_gbp,
             ROUND(trims, 2) AS trims_gbp, ROUND(labour, 2) AS labour_gbp, ROUND(overhead, 2) AS overhead_gbp,
             ROUND(tot, 2) AS cost_gbp, ROUND(retail, 2) AS price_gbp, ROUND(gm_pct, 1) AS margin_pct, 1 AS ord
      FROM by_style
      UNION ALL
      SELECT 'benchmark average' AS row_type, 'AVERAGE of ' || count(*) || ' similar styles' AS style_id, NULL, NULL, NULL, sum(sku_count),
             ROUND(avg(fabric), 2), ROUND(avg(trims), 2), ROUND(avg(labour), 2), ROUND(avg(overhead), 2), ROUND(avg(tot), 2),
             ROUND(avg(retail), 2), ROUND(avg(gm_pct), 1), 0 AS ord
      FROM by_style HAVING count(*) > 0
    ) ORDER BY ord, style_id
  limit: 20
  example:
    style_id: STY-4595
- name: get_inventory_holding_cost_rate
  desc: Annual inventory holding cost rate by category (capital, storage, insurance, obsolescence), with the cost of holding stock for a number of weeks.
  kind: sql
  args:
    category:
      type: str
      desc: Product category, e.g. Outerwear. Leave blank for all categories.
    weeks_held:
      type: float
      desc: Weeks the stock is held, to cost that holding period
  sql: |
    SELECT h.category, h.capital_cost_pct, h.storage_handling_pct, h.insurance_pct, h.obsolescence_pct,
      h.total_annual_pct AS annual_holding_cost_rate_pct, ROUND(h.total_annual_pct / 52, 2) AS weekly_holding_cost_pct,
      $weeks_held AS weeks_held, ROUND(h.total_annual_pct * $weeks_held / 52, 2) AS holding_cost_for_period_pct,
      'holding cost for period = annual rate * weeks held / 52' AS formula
    FROM holding_cost_rates h
    WHERE ($category IS NULL OR lower(h.category) = lower($category))
    ORDER BY h.category
  limit: 40
  example:
    category: Outerwear
- name: get_margin_bridge_for_category
  desc: Margin bridge for a category and period - price, cost, mix, markdown, shrink, FX and supplier effects in points, with notes on causes.
  kind: sql
  args:
    category:
      required: true
      desc: Product category, e.g. Knitwear
    department:
      desc: Department, e.g. Womenswear
    basis:
      type: enum
      values:
      - vs_plan
      - yoy
      default: vs_plan
      desc: vs_plan = against plan; yoy = against last year
    period_from:
      type: date
      default: -35d
      desc: Periods starting on or after this date; the default is the last 4-week period
  sql: |
    SELECT v.category, v.department, v.basis, v.period_start, ROUND(v.total_variance_pct, 1) AS total_variance_pts,
           ROUND(v.price_driver_pct, 1) AS price_pts, ROUND(v.cost_driver_pct, 1) AS cost_pts, ROUND(v.mix_driver_pct, 1) AS mix_pts,
           ROUND(v.markdown_driver_pct, 1) AS markdown_pts, ROUND(v.shrink_driver_pct, 1) AS shrink_pts, ROUND(v.fx_driver_pct, 1) AS fx_pts,
           ROUND(v.supplier_driver_pct, 1) AS supplier_pts, ROUND(v.other_driver_pct, 1) AS other_pts, v.notes
    FROM cost_variance_drivers v
    WHERE lower(v.category) = lower($category) AND ($department IS NULL OR lower(v.department) = lower($department))
      AND v.basis = $basis AND v.period_start >= CAST($period_from AS DATE)
    ORDER BY v.department, v.period_start DESC
  limit: 6
  example:
    category: Knitwear
    department: Womenswear
- name: get_margin_variance_to_plan
  desc: Net margin against plan by 4-week trading period for a category - actual %, plan %, variance in points, revenue and margin.
  kind: sql
  args:
    category:
      required: true
      desc: Product category, e.g. Knitwear
    department:
      desc: Department, e.g. Womenswear; separates Womenswear from Menswear Knitwear
    period_from:
      type: date
      default: -35d
      desc: Periods starting on or after this date; the default is the last 4-week period
  sql: |
    SELECT m.category, m.department, m.period_start, CAST(m.period_start AS DATE) + 27 AS period_end,
           ROUND(sum(m.net_margin_gbp) / sum(m.revenue_gbp) * 100, 1) AS actual_net_margin_pct,
           ROUND(sum(m.plan_margin_pct * m.revenue_gbp) / sum(m.revenue_gbp), 1) AS plan_net_margin_pct,
           ROUND(sum(m.net_margin_gbp) / sum(m.revenue_gbp) * 100 - sum(m.plan_margin_pct * m.revenue_gbp) / sum(m.revenue_gbp), 1) AS variance_to_plan_pts,
           ROUND(sum(m.gross_margin_gbp) / sum(m.revenue_gbp) * 100, 1) AS gross_margin_pct,
           ROUND(sum(m.revenue_gbp), 0) AS total_revenue_gbp, ROUND(sum(m.net_margin_gbp), 0) AS total_net_margin_gbp,
           count(DISTINCT m.sku) AS sku_count
    FROM margin_analyses m
    WHERE lower(m.category) = lower($category) AND ($department IS NULL OR lower(m.department) = lower($department))
      AND m.period_start >= CAST($period_from AS DATE)
    GROUP BY m.category, m.department, m.period_start
    ORDER BY m.department, m.period_start DESC
  limit: 12
  example:
    category: Knitwear
    department: Womenswear
- name: get_material_cost_and_performance_data
  desc: 'Latest cost and performance of materials: PFAS status, water repellency, wash durability and cost against the PFAS option. Filter by use, e.g. waterproof outerwear.'
  kind: sql
  args:
    material_type:
      type: enum
      values:
      - fabric
      - packaging
      - component
      - dyes_chemicals
    application:
      type: str
      desc: Use to search, e.g. waterproof outerwear
    contains_pfas:
      type: bool
      desc: True for PFAS materials only, false for PFAS-free only
  sql: |
    WITH cur AS (
      SELECT m.*, row_number() OVER (PARTITION BY m.material_id, m.supplier_id ORDER BY m.recorded_at DESC) AS rn,
             avg(m.cost_per_unit_gbp) OVER (PARTITION BY m.material_id, m.supplier_id) AS avg_cost
      FROM material_costs m
    ), latest AS (SELECT * FROM cur WHERE rn = 1),
    base AS (SELECT application, avg(cost_per_unit_gbp) AS pfas_cost FROM latest WHERE contains_pfas AND material_type = 'dyes_chemicals' GROUP BY application),
    base2 AS (SELECT application, avg(cost_per_unit_gbp) AS pfas_cost FROM latest WHERE contains_pfas AND material_type = 'fabric' GROUP BY application)
    SELECT l.material_id, l.material_name, l.material_type, l.supplier_id, l.unit, l.application, l.contains_pfas,
      ROUND(l.cost_per_unit_gbp, 2) AS current_cost_gbp, ROUND(l.avg_cost, 2) AS avg_cost_gbp,
      ROUND((l.cost_per_unit_gbp / COALESCE(b.pfas_cost, b2.pfas_cost) - 1) * 100, 1) AS cost_vs_pfas_option_pct,
      l.spray_rating, l.wash_durability_cycles, l.notes, l.recorded_at AS last_recorded_at
    FROM latest l LEFT JOIN base b ON b.application = l.application AND l.material_type = 'dyes_chemicals'
    LEFT JOIN base2 b2 ON b2.application = l.application AND l.material_type = 'fabric'
    WHERE ($material_type IS NULL OR l.material_type = $material_type)
      AND ($application IS NULL OR l.application ILIKE '%' || $application || '%')
      AND ($contains_pfas IS NULL OR l.contains_pfas = $contains_pfas)
    ORDER BY l.application NULLS LAST, l.material_type, l.cost_per_unit_gbp DESC
  limit: 50
  example:
    material_type: fabric
- name: get_material_cost_per_metre
  desc: Return material cost per metre.
  kind: sql
  args:
    material_id:
      required: true
  sql: |
    SELECT
      m.material_id,
      m.material_name,
      m.unit,
      ROUND(m.cost_per_unit_gbp, 3) AS cost_per_metre_gbp,
      m.recorded_at,
      m.supplier_id,
      m.notes
    FROM material_costs m
    WHERE m.material_id = $material_id AND m.unit LIKE '%metre%'
    ORDER BY m.recorded_at DESC
    LIMIT 1
  limit: 1
  example:
    material_id: MAT-COTTON-10OZ
- name: update_costing_sheet_for_product
  desc: Updates a costing sheet with the chosen scenario - origin, supplier, factory, volume, unit cost and margin. Use the costing id from the sheet.
  kind: update
  table: product_costings
  set:
    updated_at: $as_of
    notes: "Scenario saved to costing sheet: {origin_country} at {quantity_units} units"
  args:
    origin_country:
      required: true
    quantity_units:
      type: int
      required: true
      desc: Volume the scenario is costed at
    total_cost_gbp:
      type: float
      required: true
      desc: Total landed cost per unit in GBP under the scenario
    gross_margin_gbp:
      type: float
      required: true
    gross_margin_pct:
      type: float
      required: true
    supplier_id:
      desc: Supplier for the chosen origin, e.g. SUP-0058
    factory_id:
      desc: Factory for the chosen origin, e.g. FAC-0110
  example:
    costing_id: CST-SKU-100070-V1
    origin_country: PT
    quantity_units: 30000
    total_cost_gbp: 27.4
    gross_margin_gbp: 60.0
    gross_margin_pct: 68.7
- name: update_costed_price_for_product
  desc: Updates the costed price for a product for the next season.
  kind: update
  table: product_costings
  set:
    retail_price_gbp: '{retail_price_gbp}'
    updated_at: $as_of
  args:
    retail_price_gbp:
      type: float
      required: true
      desc: New retail price in GBP
  example:
    costing_id: CST-SKU-100700-V1
    retail_price_gbp: 49.99
- name: get_style_unit_margin
  desc: Unit economics for a style - retail price, landed cost, gross margin per unit and %, planned volume and total planned margin.
  kind: sql
  args:
    style_id:
      required: true
      desc: Style, e.g. STY-7731
  sql: |
    SELECT pc.style_id, any_value(pc.category) AS category, any_value(pc.origin_country) AS origin_country,
           any_value(pc.supplier_id) AS supplier_id, count(*) AS sku_count,
           ROUND(avg(pc.retail_price_gbp), 2) AS retail_price_gbp, ROUND(avg(pc.total_cost_gbp), 2) AS total_cost_gbp,
           ROUND(avg(pc.freight_cost_gbp), 2) AS freight_cost_gbp, ROUND(avg(pc.gross_margin_gbp), 2) AS unit_gross_margin_gbp,
           ROUND(avg(pc.gross_margin_pct), 1) AS gross_margin_pct, sum(pc.quantity_units) AS planned_units,
           ROUND(sum(pc.quantity_units * pc.gross_margin_gbp), 0) AS planned_gross_margin_gbp, any_value(pc.status) AS status
    FROM product_costings pc
    WHERE pc.style_id = $style_id AND pc.status = 'active'
    GROUP BY pc.style_id
  limit: 1
  example:
    style_id: STY-7731
- name: get_product_costing_for_style
  desc: 'Costing sheet for a style, one row per active SKU: material, labour, overhead, freight, total cost, price, margin, origin and lead time.'
  kind: sql
  args:
    style_id:
      required: true
      desc: Style, e.g. STY-5520
  sql: |
    SELECT pc.costing_id, pc.style_id, pc.sku, pc.season, pc.origin_country, pc.supplier_id, pc.factory_id, p.lead_time_days,
      ROUND(pc.material_cost_gbp, 2) AS material_cost_gbp, ROUND(pc.labour_cost_gbp, 2) AS labour_cost_gbp,
      ROUND(pc.overhead_cost_gbp, 2) AS overhead_cost_gbp, ROUND(pc.freight_cost_gbp, 2) AS freight_cost_gbp,
      ROUND(pc.tooling_cost_gbp, 2) AS tooling_cost_gbp, ROUND(pc.total_cost_gbp, 2) AS total_cost_gbp,
      ROUND(pc.retail_price_gbp, 2) AS retail_price_gbp, ROUND(pc.gross_margin_gbp, 2) AS gross_margin_gbp,
      ROUND(pc.gross_margin_pct, 1) AS gross_margin_pct, pc.status, pc.quantity_units
    FROM product_costings pc JOIN master.products p ON p.sku = pc.sku
    WHERE pc.style_id = $style_id AND pc.status = 'active'
    ORDER BY pc.sku
  limit: 12
  example:
    style_id: STY-5520
- name: get_material_cost_share_for_product
  desc: 'Material cost share. With a sku: each material line with cost and % of unit cost. Without: cost exposed to each commodity (cotton, polyester, nylon, leather) across products.'
  kind: sql
  args:
    sku:
      desc: SKU, e.g. SKU-102590. Leave blank for exposure by commodity across all products.
    commodity:
      type: str
      desc: Commodity code to include when no sku is given, e.g. COTTON, POLYESTER, NYLON, LEATHER
    category:
      type: str
      desc: Product category to include when no sku is given, e.g. Outerwear
  sql: |
    WITH tot AS (
      SELECT sum(pc.total_cost_gbp * pc.weekly_demand_units * 52) AS all_cost FROM product_costings pc WHERE pc.status = 'active'
    )
    SELECT pc.sku AS scope, e.commodity, c.component_type, c.description, ROUND(c.total_cost_gbp, 2) AS cost_gbp,
           ROUND(c.total_cost_gbp / pc.total_cost_gbp * 100, 1) AS pct_of_unit_cost,
           ROUND(pc.material_cost_gbp / pc.total_cost_gbp * 100, 1) AS total_material_share_pct,
           ROUND(pc.labour_cost_gbp / pc.total_cost_gbp * 100, 1) AS labour_share_pct,
           ROUND(pc.freight_cost_gbp / pc.total_cost_gbp * 100, 1) AS freight_share_pct,
           ROUND(pc.total_cost_gbp, 2) AS unit_cost_gbp, 1 AS sku_count, CAST(NULL AS DOUBLE) AS annual_cost_exposed_gbp,
           CAST(NULL AS DOUBLE) AS share_of_all_product_cost_pct
    FROM product_costings pc JOIN cost_sheet_details c ON c.costing_id = pc.costing_id
    LEFT JOIN commodity_exposures e ON e.sku = pc.sku AND ROUND(c.total_cost_gbp / pc.total_cost_gbp * 100, 1) = e.exposure_pct
    WHERE $sku IS NOT NULL AND pc.sku = $sku AND pc.status = 'active'
      AND c.component_type IN ('fabric', 'trimming', 'metal', 'plastics', 'electronics', 'other_material')
    UNION ALL
    SELECT 'ALL PRODUCTS' AS scope, e.commodity, NULL AS component_type,
           'Exposed material line, across ' || count(DISTINCT e.category) || ' categories: ' || string_agg(DISTINCT e.category, ', ') AS description,
           ROUND(sum(e.exposure_pct / 100 * pc.total_cost_gbp * pc.weekly_demand_units) / sum(pc.weekly_demand_units), 2) AS cost_gbp,
           ROUND(sum(e.exposure_pct / 100 * pc.total_cost_gbp * pc.weekly_demand_units) / sum(pc.total_cost_gbp * pc.weekly_demand_units) * 100, 1) AS pct_of_unit_cost,
           ROUND(sum(pc.material_cost_gbp * pc.weekly_demand_units) / sum(pc.total_cost_gbp * pc.weekly_demand_units) * 100, 1) AS total_material_share_pct,
           ROUND(sum(pc.labour_cost_gbp * pc.weekly_demand_units) / sum(pc.total_cost_gbp * pc.weekly_demand_units) * 100, 1) AS labour_share_pct,
           ROUND(sum(pc.freight_cost_gbp * pc.weekly_demand_units) / sum(pc.total_cost_gbp * pc.weekly_demand_units) * 100, 1) AS freight_share_pct,
           ROUND(sum(pc.total_cost_gbp * pc.weekly_demand_units) / sum(pc.weekly_demand_units), 2) AS unit_cost_gbp, count(DISTINCT e.sku) AS sku_count,
           ROUND(sum(e.exposure_pct / 100 * pc.total_cost_gbp * pc.weekly_demand_units * 52), 0) AS annual_cost_exposed_gbp,
           ROUND(sum(e.exposure_pct / 100 * pc.total_cost_gbp * pc.weekly_demand_units * 52) / max(t.all_cost) * 100, 1) AS share_of_all_product_cost_pct
    FROM commodity_exposures e JOIN product_costings pc ON pc.sku = e.sku AND pc.status = 'active' CROSS JOIN tot t
    WHERE $sku IS NULL AND ($commodity IS NULL OR upper(e.commodity) = upper($commodity)) AND ($category IS NULL OR lower(e.category) = lower($category))
    GROUP BY e.commodity
    ORDER BY annual_cost_exposed_gbp DESC NULLS LAST, cost_gbp DESC
  limit: 12
  example:
    sku: SKU-102590
- name: get_shrink_by_category
  desc: Stock-loss (shrink) cost for a category - % of revenue in the period against the 12 weeks before, plus markdown % of revenue.
  kind: sql
  args:
    category:
      required: true
      desc: Product category, e.g. Knitwear
    department:
      desc: Department, e.g. Womenswear
    period_from:
      type: date
      default: -35d
      desc: Periods starting on or after this date; the default is the last 4-week period
  sql: |
    WITH f AS (
      SELECT m.*, CASE WHEN m.period_start >= CAST($period_from AS DATE) THEN 'now'
                       WHEN m.period_start >= CAST($period_from AS DATE) - INTERVAL 84 DAY THEN 'before' END AS win
      FROM margin_analyses m
      WHERE lower(m.category) = lower($category) AND ($department IS NULL OR lower(m.department) = lower($department))
    )
    SELECT any_value(category) AS category, any_value(department) AS department,
           ROUND(sum(shrink_gbp) FILTER (win = 'now'), 0) AS shrink_gbp,
           ROUND(sum(shrink_gbp) FILTER (win = 'now') / sum(revenue_gbp) FILTER (win = 'now') * 100, 2) AS shrink_pct_of_revenue,
           ROUND(sum(shrink_gbp) FILTER (win = 'before') / sum(revenue_gbp) FILTER (win = 'before') * 100, 2) AS prior_12_weeks_shrink_pct,
           ROUND(sum(shrink_gbp) FILTER (win = 'now') / sum(revenue_gbp) FILTER (win = 'now') * 100
                 - sum(shrink_gbp) FILTER (win = 'before') / sum(revenue_gbp) FILTER (win = 'before') * 100, 2) AS shrink_change_pts,
           ROUND(sum(markdown_gbp) FILTER (win = 'now') / sum(revenue_gbp) FILTER (win = 'now') * 100, 2) AS markdown_pct_of_revenue,
           ROUND(sum(revenue_gbp) FILTER (win = 'now'), 0) AS revenue_gbp
    FROM f WHERE win IS NOT NULL
  limit: 1
  example:
    category: Knitwear
    department: Womenswear
- name: get_sku_margin_and_revenue
  desc: Revenue and margin by SKU over the latest trading blocks, with weekly run-rate and total row. Filter by SKU, origin country or category.
  kind: sql
  args:
    sku: {}
    origin_country:
      type: str
      desc: Country of manufacture, ISO code, e.g. VN
    category:
      type: str
      desc: Product category, e.g. Knitwear
    period_from:
      type: date
      desc: Period start; overrides trading_blocks when given
    trading_blocks:
      type: int
      default: 3
      desc: Number of latest 4-week trading blocks to include
  sql: |
    WITH g AS (
      SELECT m.sku, m.category, pc.origin_country, SUM(m.volume_units) AS total_units, SUM(m.revenue_gbp) AS rev, SUM(m.cost_of_goods_gbp) AS cogs,
        SUM(m.gross_margin_gbp) AS gm, SUM(m.markdown_gbp) AS md, SUM(m.net_margin_gbp) AS nm, COUNT(DISTINCT m.period_start) * 4 AS weeks
      FROM margin_analyses m JOIN product_costings pc ON pc.sku = m.sku
      WHERE ($sku IS NULL OR m.sku = $sku) AND ($origin_country IS NULL OR upper(pc.origin_country) = upper($origin_country))
        AND ($category IS NULL OR lower(m.category) = lower($category)) AND (($period_from IS NULL AND m.period_start > (SELECT max(x.period_start) FROM margin_analyses x) - 28 * $trading_blocks)
             OR ($period_from IS NOT NULL AND m.analysed_at >= CAST($period_from AS DATE)))
      GROUP BY m.sku, m.category, pc.origin_country
    ), r AS (
      SELECT 1 AS sort_key, sku, category, origin_country, total_units, rev, cogs, gm, md, nm, weeks FROM g
      UNION ALL
      SELECT 0, 'TOTAL (' || count(*) || ' SKUs)', NULL, NULL, SUM(total_units), SUM(rev), SUM(cogs), SUM(gm), SUM(md), SUM(nm), max(weeks) FROM g
      WHERE $sku IS NULL HAVING count(*) > 0
    )
    SELECT sku, category, origin_country, total_units, ROUND(rev, 2) AS total_revenue_gbp, ROUND(cogs, 2) AS total_cogs_gbp, ROUND(gm, 2) AS gross_margin_gbp,
      ROUND(md, 2) AS markdown_gbp, ROUND(nm, 2) AS net_margin_gbp, ROUND(nm / NULLIF(rev, 0) * 100, 1) AS net_margin_pct,
      ROUND(rev / NULLIF(weeks, 0), 0) AS weekly_revenue_gbp, ROUND(nm / NULLIF(weeks, 0), 0) AS weekly_net_margin_gbp
    FROM r ORDER BY sort_key, rev DESC
  limit: 50
  example:
    origin_country: VN
- name: get_sku_margin_and_sales_at_risk
  desc: Per-unit margin plus sales and margin at risk over a number of weeks if a SKU runs out, from recent weekly sales rates. Ranked by margin at risk.
  kind: sql
  args:
    sku: {}
    category:
      desc: Product category, e.g. Footwear
    weeks:
      type: int
      desc: Weeks without stock to price the risk over
      default: 4
  sql: |
    WITH rate AS (
      SELECT sku, avg(store_units + online_units) AS wk_units, avg(revenue_gbp) AS wk_sales
      FROM master.sales_weekly WHERE week_start > (SELECT max(week_start) FROM master.sales_weekly) - INTERVAL 56 DAY GROUP BY sku
    )
    SELECT pc.sku, pc.category, ROUND(pc.retail_price_gbp, 2) AS retail_price_gbp, ROUND(pc.gross_margin_gbp, 2) AS margin_per_unit_gbp,
           ROUND(pc.gross_margin_pct, 1) AS margin_pct, ROUND(rate.wk_units, 0) AS avg_weekly_units, ROUND(rate.wk_sales, 0) AS avg_weekly_sales_gbp,
           $weeks AS weeks, ROUND(rate.wk_sales * $weeks, 0) AS sales_at_risk_gbp,
           ROUND(rate.wk_units * pc.gross_margin_gbp * $weeks, 0) AS margin_at_risk_gbp
    FROM product_costings pc JOIN rate ON rate.sku = pc.sku
    WHERE pc.status = 'active' AND ($sku IS NULL OR pc.sku = $sku) AND ($category IS NULL OR lower(pc.category) = lower($category))
    ORDER BY margin_at_risk_gbp DESC
  limit: 50
  example:
    sku: SKU-105341
- name: get_sku_sales_and_margin
  desc: Sales and margin per SKU, ranked by revenue or margin contribution.
  kind: sql
  args:
    sku: {}
    rank_by:
      type: str
      desc: Rank by revenue or margin
      default: revenue
  sql: |
    SELECT
      m.sku,
      m.category,
      SUM(m.volume_units) AS units_sold,
      ROUND(SUM(m.revenue_gbp), 2) AS total_revenue_gbp,
      ROUND(SUM(m.cost_of_goods_gbp), 2) AS total_cost_gbp,
      ROUND(SUM(m.gross_margin_gbp), 2) AS gross_margin_gbp,
      ROUND(SUM(m.net_margin_gbp), 2) AS net_margin_gbp,
      ROUND(SUM(m.net_margin_gbp) / NULLIF(SUM(m.revenue_gbp), 0) * 100, 1) AS margin_pct
    FROM margin_analyses m
    WHERE ($sku IS NULL OR m.sku = $sku)
    GROUP BY m.sku, m.category
    ORDER BY SUM(m.revenue_gbp) DESC
  limit: 100
  example: {}
- name: list_top_skus_by_sales
  desc: Top SKUs ranked by sales volume or revenue, with margin and velocity metrics.
  kind: sql
  args:
    limit_rows:
      type: int
      desc: Number of top SKUs to return
      default: 20
    rank_by:
      type: str
      desc: Rank by units or revenue
      default: units
  sql: |
    SELECT
      m.sku,
      m.category,
      SUM(m.volume_units) AS units_sold,
      ROUND(SUM(m.revenue_gbp), 2) AS revenue_gbp,
      ROUND(SUM(m.net_margin_gbp), 2) AS net_margin_gbp,
      ROUND(SUM(m.net_margin_gbp) / NULLIF(SUM(m.volume_units), 0), 2) AS margin_per_unit_gbp,
      COUNT(DISTINCT m.period) AS periods_in_sale
    FROM margin_analyses m
    GROUP BY m.sku, m.category
    ORDER BY SUM(m.volume_units) DESC
    LIMIT $limit_rows
  limit: 100
  example:
    limit_rows: 20
- name: list_loss_making_skus
  desc: SKUs where cost to serve exceeds margin or where net margin is negative; priority for cost reduction or discontinuation.
  kind: sql
  args:
    min_loss_gbp:
      type: float
      desc: Show SKUs whose net margin over the data period is below this GBP amount
      default: 0
  sql: |
    SELECT
      m.sku,
      m.category,
      ROUND(SUM(m.revenue_gbp), 2) AS total_revenue_gbp,
      ROUND(SUM(m.cost_of_goods_gbp), 2) AS total_cogs_gbp,
      ROUND(SUM(m.net_margin_gbp), 2) AS net_margin_gbp,
      ROUND(SUM(m.net_margin_gbp) / NULLIF(SUM(m.revenue_gbp), 0) * 100, 1) AS net_margin_pct,
      SUM(m.volume_units) AS units_sold
    FROM margin_analyses m
    GROUP BY m.sku, m.category
    HAVING SUM(m.net_margin_gbp) < $min_loss_gbp
    ORDER BY SUM(m.net_margin_gbp) ASC
  limit: 100
  example:
    min_loss_gbp: 60000
- name: get_standard_cost_updates
  desc: Standard cost changes and effective dates by SKU and period, tracking cost evolution.
  kind: sql
  args:
    sku: {}
    period_from:
      type: str
      desc: Period start, e.g. 2026-01 (default 6 months back)
  sql: |
    SELECT
      sch.sku,
      sch.period,
      ROUND(sch.actual_cost_gbp, 2) AS actual_cost_gbp,
      ROUND(sch.quoted_cost_gbp, 2) AS quoted_cost_gbp,
      ROUND((sch.actual_cost_gbp - sch.quoted_cost_gbp) / NULLIF(sch.quoted_cost_gbp, 0) * 100, 1) AS variance_pct,
      sch.pass_through_pct,
      sch.notes
    FROM supplier_cost_history sch
    WHERE ($sku IS NULL OR sch.sku = $sku)
    ORDER BY sch.period DESC
  limit: 50
  example:
    sku: K-1700
- name: get_unit_cost_and_retail_price
  desc: Unit cost and retail price by SKU with margin, and the cost and retail value of a number of units (e.g. a recall quantity).
  kind: sql
  args:
    sku:
      desc: SKU, e.g. PF-220
    units:
      type: int
      desc: Units to value at cost and at retail, e.g. 18000
  sql: |
    SELECT pc.sku, pc.style_id, ROUND(pc.total_cost_gbp, 2) AS unit_cost_gbp, ROUND(pc.retail_price_gbp, 2) AS retail_price_gbp,
      ROUND(pc.gross_margin_gbp, 2) AS gross_margin_gbp, ROUND(pc.gross_margin_pct, 1) AS gross_margin_pct, pc.status, pc.quantity_units,
      $units AS units, ROUND(pc.total_cost_gbp * $units, 0) AS cost_of_units_gbp, ROUND(pc.retail_price_gbp * $units, 0) AS retail_value_of_units_gbp
    FROM product_costings pc
    WHERE ($sku IS NULL OR pc.sku = $sku) AND pc.status = 'active'
    ORDER BY pc.retail_price_gbp DESC
  limit: 50
  example:
    sku: K-1700
- name: get_target_cost_for_product
  desc: Target cost for a SKU from its retail price and margin goal, split into material, labour and overhead/freight budgets, with the gap to current cost.
  kind: sql
  args:
    sku:
      required: true
      desc: SKU, e.g. SKU-102863
    target_margin_pct:
      type: float
      desc: Target margin %; the product's own target margin if blank
  sql: |
    SELECT pc.sku, pc.style_id, ROUND(pc.retail_price_gbp, 2) AS retail_price_gbp,
      COALESCE($target_margin_pct, pc.target_margin_pct) AS target_margin_pct,
      ROUND(pc.retail_price_gbp * (1 - COALESCE($target_margin_pct, pc.target_margin_pct) / 100), 2) AS target_total_cost_gbp,
      ROUND(pc.total_cost_gbp, 2) AS current_cost_gbp,
      ROUND(pc.total_cost_gbp - pc.retail_price_gbp * (1 - COALESCE($target_margin_pct, pc.target_margin_pct) / 100), 2) AS gap_to_target_gbp,
      ROUND(pc.retail_price_gbp * (1 - COALESCE($target_margin_pct, pc.target_margin_pct) / 100) * pc.material_cost_gbp / pc.total_cost_gbp, 2) AS material_budget_gbp,
      ROUND(pc.retail_price_gbp * (1 - COALESCE($target_margin_pct, pc.target_margin_pct) / 100) * pc.labour_cost_gbp / pc.total_cost_gbp, 2) AS labour_budget_gbp,
      ROUND(pc.retail_price_gbp * (1 - COALESCE($target_margin_pct, pc.target_margin_pct) / 100) * (pc.overhead_cost_gbp + pc.freight_cost_gbp + pc.tooling_cost_gbp) / pc.total_cost_gbp, 2) AS overhead_freight_budget_gbp,
      ROUND(pc.material_cost_gbp, 2) AS current_material_gbp, ROUND(pc.labour_cost_gbp, 2) AS current_labour_gbp,
      ROUND(pc.overhead_cost_gbp + pc.freight_cost_gbp + pc.tooling_cost_gbp, 2) AS current_overhead_freight_gbp,
      'target cost = retail price * (1 - target margin); budgets follow the current cost split' AS budget_allocation
    FROM product_costings pc
    WHERE pc.sku = $sku AND pc.status = 'active'
  limit: 1
  example:
    sku: K-1700
- name: get_target_cost_for_style
  desc: Target cost for a style from its retail price and target margin (default the costed target), split by component, against current cost.
  kind: sql
  args:
    style_id:
      required: true
      desc: Style, e.g. STY-5520
    target_margin_pct:
      type: float
      desc: Target margin %; default is the style's costed target margin
  sql: |
    WITH s AS (
      SELECT style_id, avg(retail_price_gbp) AS retail, avg(total_cost_gbp) AS cost, avg(material_cost_gbp) AS mat,
             avg(labour_cost_gbp) AS lab, avg(target_margin_pct) AS tgt
      FROM product_costings WHERE style_id = $style_id AND status = 'active' GROUP BY style_id
    ), t AS (
      SELECT s.*, COALESCE($target_margin_pct, tgt) AS m, retail * (1 - COALESCE($target_margin_pct, tgt) / 100) AS target_cost FROM s
    )
    SELECT style_id, ROUND(m, 1) AS target_margin_pct, ROUND(retail, 2) AS avg_retail_price_gbp, ROUND(target_cost, 2) AS target_cost_gbp,
           ROUND(cost, 2) AS current_cost_gbp, ROUND(cost - target_cost, 2) AS cost_over_target_gbp,
           ROUND(target_cost * mat / cost, 2) AS material_target_gbp, ROUND(target_cost * lab / cost, 2) AS labour_target_gbp,
           ROUND(target_cost * (cost - mat - lab) / cost, 2) AS overhead_target_gbp,
           'target cost = retail price * (1 - target margin); components split in line with the current cost mix' AS formula
    FROM t
  limit: 1
  example:
    style_id: STY-5520
- name: get_target_margin_for_category
  desc: Target gross margin for a category from costings, with current gross and net margin and plan over the last 13 weeks.
  kind: sql
  args:
    category:
      required: true
      desc: Product category, e.g. Drinkware
    department:
      desc: Department, e.g. Home
  sql: |
    WITH t AS (
      SELECT category, avg(target_margin_pct) AS target FROM product_costings
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department)) AND status = 'active' GROUP BY category
    ), m AS (
      SELECT category, sum(gross_margin_gbp) / sum(revenue_gbp) * 100 AS gross_pct, sum(net_margin_gbp) / sum(revenue_gbp) * 100 AS net_pct,
             sum(plan_margin_pct * revenue_gbp) / sum(revenue_gbp) AS plan_pct, count(DISTINCT sku) AS skus
      FROM margin_analyses
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department))
        AND period_start >= CAST($as_of AS DATE) - INTERVAL 90 DAY GROUP BY category
    )
    SELECT t.category, ROUND(t.target, 1) AS target_gross_margin_pct, ROUND(m.gross_pct, 1) AS current_gross_margin_pct,
           ROUND(m.net_pct, 1) AS current_net_margin_pct, ROUND(m.plan_pct, 1) AS plan_net_margin_pct,
           ROUND(m.gross_pct - t.target, 1) AS gross_vs_target_pts, m.skus AS sku_count
    FROM t LEFT JOIN m USING (category)
  limit: 1
  example:
    category: Drinkware
- name: get_product_cost_sheet
  desc: 'Detailed product cost sheet with line items: material, labour, overhead, freight and tooling per unit.'
  kind: sql
  args:
    costing_id:
      required: true
      desc: Costing id, e.g. CST-SKU-102590-V1
  sql: |
    SELECT
      csd.costing_id,
      csd.line_no,
      csd.component_type,
      csd.description,
      ROUND(csd.quantity, 2) AS quantity,
      csd.unit,
      ROUND(csd.unit_cost_gbp, 3) AS unit_cost_gbp,
      ROUND(csd.total_cost_gbp, 2) AS total_cost_gbp,
      ROUND(csd.as_pct_of_total, 1) AS pct_of_total_cost
    FROM cost_sheet_details csd
    WHERE csd.costing_id = $costing_id
    ORDER BY csd.line_no
  limit: 50
  example:
    costing_id: CST-SKU-102590-V1
- name: get_products_requiring_modification
  desc: Products where cost structure or sourcing needs review due to margin or cost pressure.
  kind: sql
  args:
    margin_threshold_pct:
      type: float
      desc: Margin threshold for review
      default: 60
  sql: |
    SELECT
      pc.sku,
      pc.style_id,
      ROUND(pc.gross_margin_pct, 1) AS gross_margin_pct,
      ROUND(pc.target_margin_pct, 1) AS target_margin_pct,
      CASE WHEN pc.gross_margin_pct < $margin_threshold_pct THEN 'YES' ELSE 'NO' END AS needs_modification,
      ROUND(pc.material_cost_gbp, 2) AS material_cost_gbp,
      ROUND(pc.labour_cost_gbp, 2) AS labour_cost_gbp,
      ROUND(pc.freight_cost_gbp, 2) AS freight_cost_gbp,
      'Review sourcing, material or labour efficiency' AS action
    FROM product_costings pc
    WHERE pc.status = 'active' AND pc.gross_margin_pct < $margin_threshold_pct
    ORDER BY pc.gross_margin_pct ASC
  limit: 50
  example:
    margin_threshold_pct: 60
- name: get_nearshore_cost_assumptions
  desc: Unit cost, lead time and MOQ assumptions for nearshore sourcing (Portugal, Turkey, Morocco) versus far-east.
  kind: sql
  args:
    style_id:
      required: true
      desc: Style, e.g. STY-5520
  sql: |
    SELECT
      $style_id AS style_id,
      pc.origin_country,
      ROUND(AVG(pc.total_cost_gbp), 2) AS avg_cost_gbp,
      ROUND(AVG(pc.material_cost_gbp), 2) AS material_cost_gbp,
      ROUND(AVG(pc.labour_cost_gbp), 2) AS labour_cost_gbp,
      ROUND(AVG(pc.freight_cost_gbp), 2) AS freight_cost_gbp,
      CASE
        WHEN pc.origin_country IN ('PT', 'TR', 'MA') THEN 'Nearshore (4-6 week lead)'
        ELSE 'Far-east (8-12 week lead)'
      END AS sourcing_region,
      AVG(pc.quantity_units) AS typical_moq,
      'Nearshore offers speed advantage but cost premium' AS note
    FROM product_costings pc
    WHERE pc.style_id = $style_id AND pc.status = 'active'
    GROUP BY pc.origin_country
    ORDER BY pc.origin_country
  limit: 10
  example:
    style_id: STY-5520
- name: get_packaging_unit_cost_by_material
  desc: 'Packaging options by material (corrugated, moulded pulp, recycled plastic): unit cost, change versus the current pack, damage rate, recyclability, recycled content, annual cost.'
  kind: sql
  args:
    category:
      type: str
      desc: Product category the pack is for, e.g. Small Appliances
    material:
      type: str
      desc: Pack material, e.g. Moulded pulp
    annual_units:
      type: int
      desc: Units a year, to cost each option annually, e.g. 400000
  sql: |
    SELECT p.category, p.material, p.spec, ROUND(p.unit_cost_gbp, 2) AS cost_gbp,
      ROUND(p.unit_cost_gbp - b.unit_cost_gbp, 2) AS cost_change_vs_current_gbp,
      ROUND(p.damage_rate_pct, 1) AS damage_rate_pct, ROUND(p.damage_rate_pct - b.damage_rate_pct, 1) AS damage_rate_change_pts,
      p.recyclability_pct, p.recycled_content_pct, p.is_current,
      $annual_units AS annual_units, ROUND(p.unit_cost_gbp * $annual_units, 0) AS annual_cost_gbp,
      ROUND((p.unit_cost_gbp - b.unit_cost_gbp) * $annual_units, 0) AS annual_cost_change_vs_current_gbp, p.notes
    FROM packaging_options p JOIN packaging_options b ON b.category = p.category AND b.is_current
    WHERE ($category IS NULL OR lower(p.category) = lower($category)) AND ($material IS NULL OR lower(p.material) LIKE '%' || lower($material) || '%')
    ORDER BY p.category, p.unit_cost_gbp DESC
  limit: 12
  example: {}
- name: get_recycled_material_cost_premium
  desc: Cost premium of recycled versus virgin materials (fabric, packaging, plastic), with the annual extra cost of switching the products that use that commodity.
  kind: sql
  args:
    material_type:
      type: str
      desc: 'Material type: fabric, packaging or plastic'
    commodity:
      type: str
      desc: Commodity code, e.g. POLYESTER
    category:
      type: str
      desc: Limit the annual spend to one product category, e.g. Outerwear
  sql: |
    WITH spend AS (
      SELECT e.commodity, sum(e.exposure_pct / 100 * pc.total_cost_gbp * pc.weekly_demand_units * 52) AS annual_spend
      FROM commodity_exposures e JOIN product_costings pc ON pc.sku = e.sku AND pc.status = 'active'
      WHERE $category IS NULL OR lower(e.category) = lower($category)
      GROUP BY e.commodity
    )
    SELECT r.material_type, r.commodity, r.recycled_material AS material, r.virgin_material, r.unit,
      ROUND(r.recycled_cost_gbp, 2) AS cost_per_unit_gbp, ROUND(r.virgin_cost_gbp, 2) AS virgin_cost_per_unit_gbp,
      ROUND(r.recycled_cost_gbp - r.virgin_cost_gbp, 2) AS premium_per_unit_gbp,
      ROUND((r.recycled_cost_gbp / r.virgin_cost_gbp - 1) * 100, 1) AS premium_pct,
      ROUND(s.annual_spend, 0) AS annual_virgin_spend_gbp, ROUND(s.annual_spend * (r.recycled_cost_gbp / r.virgin_cost_gbp - 1), 0) AS annual_extra_cost_gbp,
      r.notes AS note, 'annual extra cost = annual spend on the commodity * premium %' AS formula
    FROM recycled_premiums r LEFT JOIN spend s ON s.commodity = r.commodity AND r.commodity <> ''
    WHERE ($material_type IS NULL OR lower(r.material_type) = lower($material_type)) AND ($commodity IS NULL OR upper(r.commodity) = upper($commodity))
    ORDER BY premium_pct DESC
  limit: 10
  example:
    material_type: fabric
- name: get_repair_cost_by_category
  desc: Repair cost per unit by product category, with repair days, success rate and repair cost as % of unit cost. Leave category blank for a department or all.
  kind: sql
  args:
    category:
      type: str
      desc: Product category, e.g. Small Appliances. Leave blank for all.
    department:
      type: str
      desc: Department, e.g. Electricals
  sql: |
    SELECT r.category, ROUND(r.repair_cost_gbp, 2) AS repair_cost_gbp, r.avg_repair_days, r.success_rate_pct, r.typical_repair_work,
      ROUND(a.avg_cost, 2) AS avg_unit_cost_gbp, ROUND(r.repair_cost_gbp / a.avg_cost * 100, 1) AS repair_cost_pct_of_unit_cost,
      ROUND(r.repair_cost_gbp / (r.success_rate_pct / 100), 2) AS cost_per_successful_repair_gbp
    FROM repair_costs r LEFT JOIN (SELECT category, avg(total_cost_gbp) AS avg_cost FROM product_costings WHERE status = 'active' GROUP BY category) a ON a.category = r.category
    WHERE ($category IS NULL OR lower(r.category) = lower($category))
      AND ($department IS NULL OR r.category IN (SELECT pc.category FROM product_costings pc WHERE lower(pc.department) = lower($department)))
    ORDER BY repair_cost_pct_of_unit_cost
  limit: 20
  example:
    category: Small Appliances
- name: get_resale_value_estimates_by_category
  desc: Expected resale value as % of cost by category for an item age, with the best disposition route, handling cost, days to cash and risk. Leave category blank to rank.
  kind: sql
  args:
    category:
      type: str
      desc: Product category, e.g. Small Appliances. Leave blank to rank all categories.
    department:
      type: str
      desc: Department, e.g. Electricals
    age_days:
      type: int
      desc: Item age in days
      default: 90
  sql: |
    WITH cand AS (
      SELECT rr.category, rr.stock_type, r.route_name, rr.recovery_rate_pct, rr.handling_cost_gbp, rr.time_to_realise_days, rr.risk_rating,
             rr.recovery_rate_pct - rr.handling_cost_gbp / NULLIF(rr.avg_unit_cost_gbp, 0) * 100 AS net_pct
      FROM recovery_rates rr JOIN recovery_routes r ON r.route_id = rr.route_id
      WHERE $age_days BETWEEN rr.band_min_days AND rr.band_max_days AND r.status = 'active'
        AND ($category IS NULL OR lower(rr.category) = lower($category))
        AND ($department IS NULL OR rr.category IN (SELECT pc.category FROM product_costings pc WHERE lower(pc.department) = lower($department)))
    ), best AS (SELECT *, row_number() OVER (PARTITION BY category, stock_type ORDER BY net_pct DESC) AS rk FROM cand)
    SELECT category, stock_type, $age_days AS age_days, ROUND(net_pct, 1) AS resale_value_pct_of_cost, route_name AS best_disposition_route,
      recovery_rate_pct, handling_cost_gbp, time_to_realise_days, risk_rating,
      'resale value % = recovery rate % - handling cost / unit cost' AS formula
    FROM best WHERE rk = 1 ORDER BY resale_value_pct_of_cost DESC
  limit: 40
  example:
    category: Dresses
    age_days: 90
