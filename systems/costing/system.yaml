id: costing
name: Costing & Margin Tool
instructions: |
  Product costing sheets, margin analysis and cost drivers. Style costings track material, labour, overhead and freight. Includes margin bridges, cost variance analysis and disposition routes. Costing ids look like CST-SKU-101897-V1; one per SKU.
tables:
  product_costings:
    key: costing_id
    cols:
      costing_id: {type: str, desc: 'Costing id, e.g. CST-STY-5520-26S1'}
      style_id: {type: str, desc: 'Style, e.g. STY-5520'}
      sku: {type: str, desc: 'SKU, e.g. K-1700'}
      season: {type: str, desc: 'Season code, e.g. AW26'}
      version: {type: int, desc: 'Version number (1=original, 2+=scenario)'}
      origin_country: {type: str, desc: ISO country code of manufacture}
      supplier_id: {type: str, desc: Primary supplier}
      factory_id: {type: str, desc: Factory}
      quantity_units: {type: int, desc: Quantity for this costing}
      material_cost_gbp: {type: float, desc: Material cost per unit at volume}
      labour_cost_gbp: {type: float, desc: Labour cost per unit}
      overhead_cost_gbp: {type: float, desc: Overhead allocation per unit}
      freight_cost_gbp: {type: float, desc: Inbound freight per unit}
      tooling_cost_gbp: {type: float, desc: Tooling amortisation per unit}
      total_cost_gbp: {type: float, desc: Total landed cost per unit in GBP}
      retail_price_gbp: {type: float, desc: Retail price per unit}
      gross_margin_gbp: {type: float, desc: Gross margin per unit (price - cost)}
      gross_margin_pct: {type: float, desc: Gross margin as % of price}
      target_margin_pct: {type: float, desc: Target margin goal for this product}
      status:
        type: enum
        values: [active, obsolete, scenario, archived]
        desc: Costing status
      notes: {type: str, desc: Version notes or assumptions}
      category: {type: str, desc: 'Product category from master, e.g. Outerwear'}
      department: {type: str, desc: 'Department from master, e.g. Womenswear'}
      weekly_demand_units: {type: int, desc: Planned or recent weekly sales units for this SKU}
      late_sales_lost_pct: {type: float, desc: 'Share of demand in a late-delivery window that is lost for good, not deferred'}
      created_at: {type: timestamp, desc: When created}
      updated_at: {type: timestamp, desc: Last updated}
  material_costs:
    key: [material_id, recorded_at]
    cols:
      material_id: {type: str, desc: 'Material identifier, e.g. MAT-COTTON-10OZ'}
      material_name: {type: str, desc: 'Material name, e.g. 10oz cotton fabric'}
      material_type:
        type: enum
        values: [fabric, packaging, component, dyes_chemicals]
        desc: Material category
      supplier_id: {type: str, desc: Supplier}
      unit: {type: str, desc: 'Unit of measure, e.g. metre, kg, unit'}
      cost_per_unit_gbp: {type: float, desc: Cost per unit}
      index_price_gbp: {type: float, desc: Commodity index price if applicable}
      currency_conversion: {type: float, desc: FX conversion factor to GBP}
      recorded_at: {type: date, desc: Date cost recorded}
      notes: {type: str, desc: Notes on price or contract terms}
  margin_analyses:
    key: margin_id
    cols:
      margin_id: {type: str, desc: 'Analysis id, e.g. MAR-STY-5520-26S1'}
      style_id: {type: str, desc: Style}
      sku: {type: str, desc: SKU}
      category: {type: str, desc: 'Product category, e.g. Dresses'}
      period: {type: str, desc: 'Period, e.g. 2026-W39'}
      channel:
        type: enum
        values: [store, online, outlet, wholesale, marketplace]
        desc: Sales channel
      volume_units: {type: int, desc: Units sold}
      revenue_gbp: {type: float, desc: Total revenue in period}
      cost_of_goods_gbp: {type: float, desc: Cost of goods sold}
      gross_margin_gbp: {type: float, desc: Gross profit}
      gross_margin_pct: {type: float, desc: Gross margin %}
      markdown_gbp: {type: float, desc: Markdown cost in period}
      net_margin_gbp: {type: float, desc: Net margin after markdown}
      net_margin_pct: {type: float, desc: Net margin %}
      plan_margin_pct: {type: float, desc: Planned margin %}
      variance_pct: {type: float, desc: Actual vs plan variance}
      analysed_at: {type: timestamp, desc: 'Period end, end of the 4-week trading block'}
      department: {type: str, desc: 'Department from master, e.g. Womenswear'}
      period_start: {type: date, desc: First day of the 4-week trading block}
      shrink_gbp: {type: float, desc: Stock loss (shrink) cost in period}
  cost_variance_drivers:
    key: variance_id
    cols:
      variance_id: {type: str, desc: Variance analysis id}
      style_id: {type: str, desc: Style}
      category: {type: str, desc: Category}
      period: {type: str, desc: Analysis period}
      total_variance_pct: {type: float, desc: Total margin variance %}
      cost_driver_pct: {type: float, desc: Variance from cost change %}
      fx_driver_pct: {type: float, desc: Variance from FX impact %}
      mix_driver_pct: {type: float, desc: Variance from product mix %}
      supplier_driver_pct: {type: float, desc: Variance from supplier performance %}
      markdown_driver_pct: {type: float, desc: Variance from markdown pressure %}
      other_driver_pct: {type: float, desc: Other variance %}
      notes: {type: str, desc: Analysis notes}
      analysed_at: {type: timestamp, desc: When analysed}
      department: {type: str, desc: 'Department from master, e.g. Womenswear'}
      period_start: {type: date, desc: First day of the 4-week trading block analysed}
      basis:
        type: enum
        values: [vs_plan, yoy]
        desc: vs_plan = margin against plan; yoy = buying margin against the same period last year
      price_driver_pct: {type: float, desc: 'Variance from selling price, points'}
      shrink_driver_pct: {type: float, desc: 'Variance from stock loss, points'}
  recovery_routes:
    key: route_id
    cols:
      route_id: {type: str, desc: 'Route id, e.g. ROU-RESTOCK'}
      route_name: {type: str, desc: 'Route name, e.g. Restocking'}
      description: {type: str, desc: Route description and process}
      category_focus: {type: str, desc: Primary product category}
      min_age_days: {type: int, desc: Minimum age for this route}
      max_age_days: {type: int, desc: Maximum age for this route}
      status:
        type: enum
        values: [active, trial, inactive]
        desc: Route status
  recovery_rates:
    key: [route_id, category, age_band]
    cols:
      route_id: {type: str, desc: Recovery route}
      category: {type: str, desc: Product category}
      age_band: {type: str, desc: 'Age band, e.g. 0-30d, 31-60d, 61-180d, 180d+'}
      recovery_rate_pct: {type: float, desc: Recovery rate as % of cost}
      handling_cost_gbp: {type: float, desc: Handling cost per unit}
      time_to_realise_days: {type: int, desc: Days to convert to cash}
      risk_rating:
        type: enum
        values: [low, medium, high]
        desc: Brand/risk rating
      volume_last_6m: {type: int, desc: Units through this route in last 6 months}
      last_updated: {type: date, desc: Last update date}
      stock_type:
        type: enum
        values: [returns, aged_stock]
        desc: Whether the rates are for customer returns or aged stock
      band_min_days: {type: int, desc: 'Youngest item age in this band, days'}
      band_max_days: {type: int, desc: 'Oldest item age in this band, days'}
      avg_unit_cost_gbp: {type: float, desc: Typical unit cost of items in this category}
  scenario_analyses:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: 'Scenario id, e.g. SCN-AIR-STY7731'}
      scenario_name: {type: str, desc: Scenario name}
      base_costing_id: {type: str, desc: Base costing this scenario modifies}
      scenario_type:
        type: enum
        values: [freight_mode, volume, material_cost, supplier, markdown, lead_time]
        desc: Scenario type
      assumption_detail: {type: str, desc: Key assumptions for this scenario}
      cost_impact_gbp: {type: float, desc: Cost per unit impact}
      margin_impact_gbp: {type: float, desc: Margin per unit impact}
      margin_impact_pct: {type: float, desc: Margin impact %}
      volume_impact: {type: int, desc: Units saved or lost}
      financial_impact_gbp: {type: float, desc: Total financial impact for full volume}
      created_by: {type: str, desc: User who created scenario}
      created_at: {type: timestamp, desc: Created date}
  cost_sheet_details:
    key: [costing_id, line_no]
    cols:
      costing_id: {type: str, desc: Parent costing}
      line_no: {type: int, desc: Line sequence}
      component_type:
        type: enum
        values: [fabric, trimming, metal, plastics, electronics, other_material, labour_cut, labour_sew, labour_finish, packing, inbound_freight, tooling, overhead]
        desc: Cost component
      description: {type: str, desc: Component description}
      quantity: {type: float, desc: Quantity of component per unit}
      unit: {type: str, desc: Unit of measure}
      unit_cost_gbp: {type: float, desc: Cost per unit}
      total_cost_gbp: {type: float, desc: Total cost for this component}
      as_pct_of_total: {type: float, desc: '% of total product cost'}
  commodity_exposures:
    key: exposure_id
    cols:
      exposure_id: {type: str, desc: Exposure id}
      sku: {type: str, desc: SKU}
      category: {type: str, desc: Product category}
      commodity: {type: str, desc: 'Commodity, e.g. cotton, polyester, oil'}
      exposure_pct: {type: float, desc: '% of product cost exposed to this commodity'}
      exposure_unit: {type: str, desc: 'Unit, e.g. kg, metre, litre'}
      exposure_quantity: {type: float, desc: Quantity exposed per unit}
      elasticity: {type: float, desc: Pass-through elasticity (% cost increase per 1% commodity price increase)}
      date_from: {type: date, desc: Period from}
  fob_price_history:
    key: [origin_country, period_start]
    cols:
      origin_country: {type: str, desc: 'ISO country code, e.g. VN, BD, KH'}
      period_start: {type: date, desc: First day of the 4-week block}
      avg_fob_cost_gbp: {type: float, desc: Average FOB cost per unit}
      avg_labour_cost_gbp: {type: float, desc: Average labour cost per unit within FOB}
      avg_material_cost_gbp: {type: float, desc: Average material cost per unit within FOB}
      labour_share_pct: {type: float, desc: Labour as % of FOB}
      basis:
        type: enum
        values: [ordered, quoted]
        desc: ordered = from live costings; quoted = factory quotes, no orders yet
      sku_count: {type: int, desc: SKUs behind the average}
  origin_cost_quotes:
    key: quote_id
    cols:
      quote_id: {type: str, desc: 'Quote id, e.g. QTE-000001'}
      origin_country: {type: str, desc: 'ISO country code, e.g. VN, ID'}
      category: {type: str, desc: 'Product category, e.g. Footwear'}
      factory_id: {type: str, desc: 'Factory, blank for prospective factories not yet in master'}
      supplier_id: {type: str, desc: 'Supplier, blank for prospective factories'}
      quote_status:
        type: enum
        values: [current, prospective]
        desc: current = live costed factory; prospective = RFQ quote
      fob_cost_gbp: {type: float, desc: FOB cost per unit}
      freight_cost_gbp: {type: float, desc: Inbound freight per unit}
      lead_time_days: {type: int, desc: Production plus transit lead time}
      style_count: {type: int, desc: Styles behind the figure}
      quoted_at: {type: date, desc: Quote date}
      notes: {type: str, desc: Notes}
  supplier_cost_history:
    key: [supplier_id, sku, period]
    cols:
      supplier_id: {type: str, desc: Supplier}
      sku: {type: str, desc: SKU}
      period: {type: str, desc: 'Period, e.g. 2026-08'}
      quoted_cost_gbp: {type: float, desc: Quoted unit cost}
      actual_cost_gbp: {type: float, desc: Actual received cost}
      index_price_gbp: {type: float, desc: Commodity index in that period}
      market_price_index: {type: float, desc: Market price index (100 = baseline)}
      supplier_price_index: {type: float, desc: Supplier price index vs baseline}
      pass_through_pct: {type: float, desc: '% of market move passed through'}
      notes: {type: str, desc: Notes}
tools:
- name: calculate_air_vs_sea_margin_impact
  desc: Margin for a style shipped late by sea versus air, from planned volume, weekly demand and lost-sales rate. Use to decide whether airfreight pays.
  kind: sql
  args:
    style_id: {required: true, desc: 'Style, e.g. STY-7731'}
    air_freight_cost_gbp: {type: float, required: true, desc: Air freight cost per unit in GBP}
    volume_units: {type: int, desc: Units to fly; default is the whole planned volume}
    sea_freight_cost_gbp: {type: float, desc: Sea freight per unit in GBP; default is the freight in the costing}
    days_saved: {type: int, desc: Days of lateness the air units avoid, default: 21}
  sql: |
    WITH s AS (
      SELECT style_id, sum(quantity_units) AS planned, sum(weekly_demand_units) AS wk,
             sum(quantity_units * gross_margin_gbp) / sum(quantity_units) AS margin_u,
             sum(quantity_units * retail_price_gbp) / sum(quantity_units) AS retail_u,
             sum(quantity_units * freight_cost_gbp) / sum(quantity_units) AS freight_u,
             avg(late_sales_lost_pct) AS lost_pct
      FROM product_costings WHERE style_id = $style_id AND status = 'active' GROUP BY style_id
    ), p AS (
      SELECT s.*, LEAST(COALESCE($volume_units, planned), planned) AS air_units,
             COALESCE($sea_freight_cost_gbp, freight_u) AS sea_u, wk * $days_saved / 7.0 AS late_demand
      FROM s
    ), q AS (
      SELECT p.*, margin_u + freight_u - sea_u AS sea_margin_u, margin_u + freight_u - $air_freight_cost_gbp AS air_margin_u,
             LEAST(planned, late_demand * lost_pct / 100) AS lost_sea,
             LEAST(planned, GREATEST(0, late_demand - air_units) * lost_pct / 100) AS lost_air
      FROM p
    )
    SELECT style_id, planned AS planned_units, air_units, ROUND(retail_u, 2) AS retail_price_gbp,
           ROUND(sea_u, 2) AS sea_freight_gbp, ROUND($air_freight_cost_gbp, 2) AS air_freight_gbp,
           ROUND($air_freight_cost_gbp - sea_u, 2) AS air_premium_per_unit_gbp,
           ROUND(air_units * ($air_freight_cost_gbp - sea_u), 0) AS total_air_premium_gbp,
           ROUND(late_demand, 0) AS demand_in_late_window_units, ROUND(lost_sea, 0) AS units_lost_if_all_sea,
           ROUND(lost_air, 0) AS units_lost_with_air, ROUND(lost_sea * retail_u, 0) AS sales_lost_if_all_sea_gbp,
           ROUND((planned - lost_sea) * sea_margin_u, 0) AS margin_all_sea_gbp,
           ROUND(air_units * air_margin_u + GREATEST(0, planned - air_units - lost_air) * sea_margin_u, 0) AS margin_with_air_gbp,
           ROUND(air_units * air_margin_u + GREATEST(0, planned - air_units - lost_air) * sea_margin_u - (planned - lost_sea) * sea_margin_u, 0) AS net_margin_gain_from_air_gbp,
           'gain = margin with air units - margin all sea; lost units = late-window demand * lost-sales %' AS formula
    FROM q
  limit: 1
  example: {style_id: STY-7731, air_freight_cost_gbp: 16, volume_units: 6000}
- name: calculate_break_even_volume
  desc: Break-even volume for a network or supply chain change from fixed cost and contribution per unit, over one or more years, against expected volume.
  kind: sql
  args:
    fixed_cost_gbp: {type: float, required: true, desc: Fixed cost per year in GBP}
    contribution_margin_gbp: {type: float, required: true, desc: Saving or contribution per unit in GBP}
    annual_volume_units: {type: int, desc: 'Expected annual units, to show break-even as a share of it'}
    years: {type: int, desc: Years to recover the cost over, default: 1}
  sql: |
    SELECT ROUND($fixed_cost_gbp, 2) AS fixed_cost_per_year_gbp, ROUND($contribution_margin_gbp, 2) AS contribution_per_unit_gbp,
           $years AS years, ROUND($fixed_cost_gbp / NULLIF($contribution_margin_gbp, 0), 0) AS break_even_units_per_year,
           ROUND($fixed_cost_gbp * $years / NULLIF($contribution_margin_gbp, 0), 0) AS break_even_units_total,
           $annual_volume_units AS expected_annual_units,
           ROUND($fixed_cost_gbp / NULLIF($contribution_margin_gbp, 0) / NULLIF($annual_volume_units, 0) * 100, 1) AS break_even_pct_of_expected_volume,
           'break_even_units = fixed_cost / contribution_per_unit' AS formula
  limit: 1
  example: {fixed_cost_gbp: 2400000, contribution_margin_gbp: 1.6, annual_volume_units: 20000000}
- name: calculate_commodity_cost_exposure
  desc: Share of a SKU's cost tied to each commodity and the unit, annual and margin impact of a commodity price move.
  kind: sql
  args:
    sku: {required: true, desc: 'SKU, e.g. SKU-102590'}
    commodity_price_change_pct: {type: float, desc: Commodity price change %, default: 10}
    commodity: {desc: 'Commodity code, e.g. SS304, COTTON'}
  sql: |
    SELECT c.sku, c.commodity, ROUND(c.exposure_pct, 1) AS commodity_share_of_cost_pct, ROUND(pc.total_cost_gbp, 2) AS unit_cost_gbp,
           ROUND($commodity_price_change_pct, 1) AS assumed_price_change_pct, c.elasticity AS pass_through,
           ROUND(c.exposure_pct * $commodity_price_change_pct * c.elasticity / 100, 2) AS unit_cost_increase_pct,
           ROUND(pc.total_cost_gbp * c.exposure_pct * $commodity_price_change_pct * c.elasticity / 10000, 2) AS unit_cost_increase_gbp,
           ROUND(pc.total_cost_gbp * c.exposure_pct * $commodity_price_change_pct * c.elasticity / 10000 / pc.retail_price_gbp * 100, 2) AS margin_impact_pts,
           pc.weekly_demand_units * 52 AS annual_units,
           ROUND(pc.total_cost_gbp * c.exposure_pct * $commodity_price_change_pct * c.elasticity / 10000 * pc.weekly_demand_units * 52, 0) AS annual_cost_increase_gbp,
           'unit cost increase = unit cost * commodity share * price change * pass-through' AS formula
    FROM commodity_exposures c JOIN product_costings pc ON pc.sku = c.sku AND pc.status = 'active'
    WHERE c.sku = $sku AND ($commodity IS NULL OR upper(c.commodity) = upper($commodity))
    ORDER BY c.exposure_pct DESC
  limit: 10
  example: {sku: SKU-102590, commodity_price_change_pct: 10}
- name: calculate_commodity_shock_impact_by_category
  desc: Cost and margin impact of a commodity price shock (e.g. oil, cotton) by product category.
  kind: sql
  args:
    commodity: {type: str, required: true, desc: 'Commodity code, e.g. COTTON, POLYESTER, SS304, COPPER'}
    shock_pct: {type: float, required: true, desc: Shock magnitude as % price increase}
  sql: |
    SELECT
      c.category,
      COUNT(DISTINCT c.sku) AS sku_count,
      ROUND(AVG(c.exposure_pct), 2) AS avg_commodity_exposure_pct,
      ROUND(AVG(c.exposure_pct * $shock_pct / 100), 2) AS avg_cost_impact_pct_of_product,
      'margin_impact = avg_exposure_pct * shock_pct / 100' AS formula
    FROM commodity_exposures c
    WHERE upper(c.commodity) = upper($commodity)
    GROUP BY c.category
    ORDER BY avg_cost_impact_pct_of_product DESC
  limit: 50
  example: {commodity: COTTON, shock_pct: 20}
- name: calculate_cost_variance_bridge
  desc: Bridge a cost change into market premiums, supplier pass-through, freight and timing lag components.
  kind: sql
  args:
    category: {required: true, desc: Product category}
    period: {type: str, desc: 'Period to analyse, e.g. 2026-08 (default latest available)'}
  sql: |
    SELECT
      $category AS category,
      c.department,
      c.period_start,
      c.total_variance_pct AS total_cost_variance_pct,
      c.cost_driver_pct,
      c.fx_driver_pct,
      c.supplier_driver_pct,
      c.markdown_driver_pct,
      ROUND(c.cost_driver_pct + c.fx_driver_pct + c.supplier_driver_pct + c.markdown_driver_pct, 2) AS explained_variance_pct,
      c.notes
    FROM cost_variance_drivers c
    WHERE c.category = $category AND c.basis = 'vs_plan' AND ($period IS NULL OR CAST(c.period_start AS VARCHAR) LIKE $period || '%')
    ORDER BY c.period_start DESC, c.department
    LIMIT 1
  limit: 3
  example: {category: Dresses}
- name: calculate_date_recovery_cost
  desc: Recovered value by disposition route and product age, with handling costs and days to realise cash.
  kind: sql
  args:
    route_id: {desc: 'Recovery route, e.g. ROU-RESTOCK'}
    category: {desc: Product category}
    age_band: {desc: 'Age band, e.g. 0-30d, 180d+'}
  sql: |
    SELECT
      r.route_name,
      r.category_focus,
      rr.recovery_rate_pct,
      rr.handling_cost_gbp,
      rr.time_to_realise_days,
      rr.risk_rating,
      'net_recovery = recovery_rate - handling_cost' AS formula
    FROM recovery_routes r
    JOIN recovery_rates rr ON r.route_id = rr.route_id
    WHERE ($route_id IS NULL OR r.route_id = $route_id)
      AND ($category IS NULL OR lower(rr.category) = lower($category))
      AND ($age_band IS NULL OR rr.age_band = $age_band)
    LIMIT 10
  limit: 10
  example: {route_id: ROU-RESTOCK, category: Electronics accessories, age_band: 0-30d}
- name: calculate_end_of_season_margin_projection
  desc: Projected net margin at season end for a category if the recent 4-week trend continues, against plan. Uses the last four trading periods.
  kind: sql
  args:
    category: {required: true, desc: 'Product category, e.g. Knitwear'}
    department: {desc: 'Department, e.g. Womenswear'}
    weeks_remaining: {type: int, desc: Weeks left in the season, default: 8}
  sql: |
    WITH f AS (
      SELECT m.*, date_diff('day', m.period_start, (SELECT max(period_start) FROM margin_analyses)) / 28 AS back
      FROM margin_analyses m
      WHERE lower(m.category) = lower($category) AND ($department IS NULL OR lower(m.department) = lower($department))
    ), p AS (
      SELECT back, sum(net_margin_gbp) / sum(revenue_gbp) * 100 AS net_pct, sum(plan_margin_pct * revenue_gbp) / sum(revenue_gbp) AS plan_pct,
             sum(markdown_gbp) / sum(revenue_gbp) * 100 AS md_pct
      FROM f WHERE back <= 3 GROUP BY back
    )
    SELECT $category AS category, $weeks_remaining AS weeks_remaining,
           ROUND(max(net_pct) FILTER (back = 0), 1) AS current_net_margin_pct,
           ROUND(max(plan_pct) FILTER (back = 0), 1) AS plan_net_margin_pct,
           ROUND((max(net_pct) FILTER (back = 0) - max(net_pct) FILTER (back = 3)) / 3, 2) AS trend_pts_per_4_weeks,
           ROUND(max(md_pct) FILTER (back = 0) - max(md_pct) FILTER (back = 3), 2) AS markdown_pct_rise_over_12_weeks,
           ROUND(max(net_pct) FILTER (back = 0) + (max(net_pct) FILTER (back = 0) - max(net_pct) FILTER (back = 3)) / 3 * $weeks_remaining / 4.0, 1) AS projected_season_end_net_margin_pct,
           ROUND(max(net_pct) FILTER (back = 0) + (max(net_pct) FILTER (back = 0) - max(net_pct) FILTER (back = 3)) / 3 * $weeks_remaining / 4.0 - max(plan_pct) FILTER (back = 0), 1) AS projected_gap_to_plan_pts,
           'projection = current net margin + 4-week trend * weeks remaining / 4' AS formula
    FROM p
  limit: 1
  example: {category: Knitwear, department: Womenswear}
- name: calculate_fix_cost_and_lead_time_for_sku
  desc: Calculate fixed costs allocated per unit and lead time impact for a SKU from factory to DC.
  kind: sql
  args:
    sku: {required: true, desc: SKU}
  sql: |
    SELECT
      pc.sku,
      pc.factory_id,
      pc.origin_country,
      ROUND(pc.tooling_cost_gbp, 2) AS tooling_amortised_per_unit_gbp,
      ROUND(pc.overhead_cost_gbp, 2) AS overhead_allocated_per_unit_gbp,
      ROUND(pc.tooling_cost_gbp + pc.overhead_cost_gbp, 2) AS total_fixed_costs_per_unit_gbp,
      pc.quantity_units AS costing_volume,
      'fixed_per_unit = (tooling + overhead) / quantity' AS formula
    FROM product_costings pc
    WHERE pc.sku = $sku AND pc.status = 'active'
    LIMIT 1
  limit: 1
  example: {sku: SKU-100007}
- name: calculate_garment_cost_by_fabric
  desc: Calculate product cost breakdown by fabric and labour component, with cost per fabric type.
  kind: sql
  args:
    style_id: {required: true, desc: Style}
  sql: |
    SELECT
      c.component_type,
      c.description,
      c.quantity,
      c.unit,
      ROUND(c.unit_cost_gbp, 3) AS unit_cost_gbp,
      ROUND(c.total_cost_gbp, 2) AS total_cost_gbp,
      ROUND(c.as_pct_of_total, 1) AS pct_of_total_cost
    FROM cost_sheet_details c
    JOIN product_costings pc ON c.costing_id = pc.costing_id
    WHERE pc.style_id = $style_id AND pc.status = 'active'
    ORDER BY c.as_pct_of_total DESC
  limit: 50
  example: {style_id: STY-5520}
- name: calculate_lost_sales_if_delayed
  desc: Units, sales and margin lost if a style's delivery is late, from its weekly demand and lost-sales rate. Use for delay or airfreight decisions.
  kind: sql
  args:
    style_id: {required: true, desc: 'Style, e.g. STY-7731'}
    delay_weeks: {type: int, desc: Weeks the delivery is late, default: 3}
    volume_units: {type: int, desc: Delivery size at risk; default is the planned volume}
  sql: |
    WITH s AS (
      SELECT style_id, any_value(category) AS category, sum(quantity_units) AS planned, sum(weekly_demand_units) AS wk,
             sum(quantity_units * gross_margin_gbp) / sum(quantity_units) AS margin_u,
             sum(quantity_units * retail_price_gbp) / sum(quantity_units) AS retail_u, avg(late_sales_lost_pct) AS lost_pct
      FROM product_costings WHERE style_id = $style_id AND status = 'active' GROUP BY style_id
    )
    SELECT style_id, category, $delay_weeks AS delay_weeks, COALESCE($volume_units, planned) AS delivery_units,
           wk AS weekly_demand_units, wk * $delay_weeks AS demand_in_delay_window_units, ROUND(lost_pct, 0) AS lost_sales_pct,
           ROUND(LEAST(COALESCE($volume_units, planned), wk * $delay_weeks * lost_pct / 100), 0) AS estimated_lost_units,
           ROUND(LEAST(COALESCE($volume_units, planned), wk * $delay_weeks * lost_pct / 100) * retail_u, 0) AS lost_sales_gbp,
           ROUND(LEAST(COALESCE($volume_units, planned), wk * $delay_weeks * lost_pct / 100) * margin_u, 0) AS lost_margin_gbp,
           'lost units = weekly demand * delay weeks * lost-sales %' AS formula
    FROM s
  limit: 1
  example: {style_id: STY-7731, delay_weeks: 3}
- name: calculate_margin_at_volumes
  desc: Gross margin per unit at different order volumes, accounting for cost reductions from economies of scale.
  kind: sql
  args:
    style_id: {required: true, desc: Style}
    volume_units: {type: int, desc: Order volume to evaluate, default: 1000}
  sql: |
    SELECT
      $style_id AS style_id,
      $volume_units AS volume_units,
      CASE
        WHEN $volume_units >= 10000 THEN ROUND(pc.material_cost_gbp * 0.95, 2)
        WHEN $volume_units >= 5000 THEN ROUND(pc.material_cost_gbp * 0.97, 2)
        ELSE pc.material_cost_gbp
      END AS adjusted_material_cost_gbp,
      ROUND(pc.labour_cost_gbp, 2) AS labour_cost_gbp,
      ROUND(pc.freight_cost_gbp, 2) AS freight_cost_gbp,
      ROUND((CASE WHEN $volume_units >= 10000 THEN pc.material_cost_gbp * 0.95 ELSE pc.material_cost_gbp END) + pc.labour_cost_gbp + pc.freight_cost_gbp, 2) AS total_cost_gbp,
      ROUND(pc.retail_price_gbp - (CASE WHEN $volume_units >= 10000 THEN pc.material_cost_gbp * 0.95 ELSE pc.material_cost_gbp END + pc.labour_cost_gbp + pc.freight_cost_gbp), 2) AS margin_at_volume_gbp,
      'margin_at_volume accounts for material cost reduction at higher volumes' AS formula
    FROM product_costings pc
    WHERE pc.style_id = $style_id AND pc.status = 'active'
    LIMIT 1
  limit: 1
  example: {style_id: STY-5520, volume_units: 5000}
- name: calculate_margin_bridge
  desc: Decompose a margin change into cost, FX, mix, supplier, price, markdown and shrink points for a category. Default is the year on year buying margin.
  kind: sql
  args:
    category: {required: true, desc: 'Product category, e.g. Small Appliances'}
    department: {desc: 'Department, e.g. Electricals'}
    basis:
      type: enum
      values: [vs_plan, yoy]
      default: yoy
      desc: yoy = against last year; vs_plan = against plan
    period_from: {type: date, default: -35d, desc: Periods starting on or after this date; the default is the last 4-week period}
  sql: |
    SELECT v.category, v.department, v.basis, v.period_start, v.total_variance_pct AS total_variance_pts,
           v.cost_driver_pct AS cost_pts, v.fx_driver_pct AS fx_pts, v.mix_driver_pct AS mix_pts, v.supplier_driver_pct AS supplier_pts,
           v.price_driver_pct AS price_pts, v.markdown_driver_pct AS markdown_pts, v.shrink_driver_pct AS shrink_pts, v.other_driver_pct AS other_pts,
           ROUND(v.cost_driver_pct + v.fx_driver_pct + v.mix_driver_pct + v.supplier_driver_pct + v.price_driver_pct + v.markdown_driver_pct
                 + v.shrink_driver_pct + v.other_driver_pct, 2) AS total_explained_pts,
           v.notes, 'bridge: sum of drivers = total variance' AS formula
    FROM cost_variance_drivers v
    WHERE lower(v.category) = lower($category) AND ($department IS NULL OR lower(v.department) = lower($department))
      AND v.basis = $basis AND v.period_start >= CAST($period_from AS DATE)
    ORDER BY v.department, v.period_start DESC
  limit: 6
  example: {category: Small Appliances, department: Electricals}
- name: calculate_margin_impact_of_fee_changes
  desc: Calculates how shipping, service or handling fee changes impact product margin by channel and category.
  kind: sql
  args:
    fee_type: {type: str, desc: 'Fee category, e.g. inbound_freight, handling, packaging'}
    fee_change_gbp: {type: float, required: true, desc: Fee change per unit in GBP}
    volume_units: {type: int, desc: Volume affected, default: 1000}
  sql: |
    SELECT
      $fee_type AS fee_type,
      ROUND($fee_change_gbp, 2) AS fee_change_per_unit_gbp,
      $volume_units AS volume_units,
      ROUND($fee_change_gbp * $volume_units, 2) AS total_fee_impact_gbp,
      'margin_impact = fee_change * volume' AS formula
  limit: 1
  example: {fee_type: inbound_freight, fee_change_gbp: 0.5, volume_units: 5000}
- name: calculate_margin_recovery_from_price_change
  desc: Margin recovered by a retail price rise for a category, using last 13 weeks of sales, demand elasticity and an optional cost increase to recover.
  kind: sql
  args:
    category: {required: true, desc: 'Product category, e.g. Footwear'}
    price_increase_pct: {type: float, required: true, desc: Retail price increase %}
    volume_elasticity: {type: float, desc: Volume change % per 1% price change, default: -1.2}
    cost_increase_pct: {type: float, desc: 'Cost of goods increase % to recover, e.g. from a tariff', default: 0}
    department: {desc: 'Department, e.g. Womenswear, to separate same-named categories'}
  sql: |
    WITH b AS (
      SELECT sum(revenue_gbp) AS rev, sum(cost_of_goods_gbp) AS cogs, sum(markdown_gbp + shrink_gbp) AS leak, sum(volume_units) AS units
      FROM margin_analyses
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department))
        AND period_start >= CAST($as_of AS DATE) - INTERVAL 90 DAY
    ), c AS (
      SELECT *, 1 + $volume_elasticity * $price_increase_pct / 100 AS u, 1 + $price_increase_pct / 100 AS p, 1 + $cost_increase_pct / 100 AS k FROM b
    )
    SELECT $category AS category, ROUND($price_increase_pct, 1) AS price_increase_pct, ROUND($volume_elasticity, 2) AS volume_elasticity,
           ROUND($cost_increase_pct, 1) AS cost_increase_pct, units AS units_last_13_weeks, ROUND(rev, 0) AS revenue_last_13_weeks_gbp,
           ROUND(rev - cogs * k - leak, 0) AS margin_after_cost_increase_gbp,
           ROUND(rev * p * u - cogs * k * u - leak * p * u, 0) AS margin_after_price_rise_gbp,
           ROUND((rev * p * u - cogs * k * u - leak * p * u) - (rev - cogs * k - leak), 0) AS margin_recovered_13_weeks_gbp,
           ROUND(((rev * p * u - cogs * k * u - leak * p * u) - (rev - cogs * k - leak)) * 4, 0) AS margin_recovered_annualised_gbp,
           ROUND((rev * p * u - cogs * k * u - leak * p * u) / (rev * p * u) * 100 - (rev - cogs * k - leak) / rev * 100, 2) AS margin_pct_points_gained,
           ROUND(CASE WHEN cogs * (k - 1) > 0 THEN ((rev * p * u - cogs * k * u - leak * p * u) - (rev - cogs * k - leak)) / (cogs * (k - 1)) * 100 END, 0) AS pct_of_cost_increase_recovered,
           'margin = revenue*(1+price)*(1+elasticity*price) - cogs*(1+cost)*(1+elasticity*price) - markdown and shrink at the same % of revenue' AS formula
    FROM c
  limit: 1
  example: {category: Footwear, price_increase_pct: 3, cost_increase_pct: 5}
- name: calculate_margin_variance_by_driver
  desc: Split margin variance by pricing, volume, cost and mix drivers for a category in a period.
  kind: sql
  args:
    category: {required: true, desc: Product category}
    period: {type: str, desc: 'Period, e.g. 2026-08 (default latest available)'}
  sql: |
    SELECT
      c.category,
      c.department,
      c.period_start,
      c.total_variance_pct AS total_margin_variance_pct,
      c.cost_driver_pct,
      c.mix_driver_pct,
      c.supplier_driver_pct,
      c.markdown_driver_pct,
      'variance split by driver shows which factors drive margin change' AS formula
    FROM cost_variance_drivers c
    WHERE c.category = $category AND c.basis = 'vs_plan' AND ($period IS NULL OR CAST(c.period_start AS VARCHAR) LIKE $period || '%')
    ORDER BY c.period_start DESC, c.department
  limit: 1
  example: {category: Dresses}
- name: calculate_markdown_breakeven
  desc: Markdown reduction, in points of retail price, needed to keep margin when a SKU's cost rises, against its current markdown rate.
  kind: sql
  args:
    sku: {required: true, desc: 'SKU, e.g. SKU-101897'}
    cost_increase_pct: {type: float, required: true, desc: 'Cost increase % of landed cost, e.g. the nearshore premium'}
    current_markdown_pct: {type: float, desc: Current markdown as % of retail revenue; default is the SKU's last 13 weeks}
  sql: |
    WITH md AS (
      SELECT sum(markdown_gbp) / sum(revenue_gbp) * 100 AS pct FROM margin_analyses
      WHERE sku = $sku AND period_start >= CAST($as_of AS DATE) - INTERVAL 90 DAY
    ), s AS (
      SELECT sku, total_cost_gbp, retail_price_gbp, COALESCE($current_markdown_pct, (SELECT pct FROM md)) AS cur_md
      FROM product_costings WHERE sku = $sku AND status = 'active'
    )
    SELECT s.sku, ROUND(s.retail_price_gbp, 2) AS retail_price_gbp, ROUND(s.total_cost_gbp, 2) AS current_cost_gbp,
           ROUND($cost_increase_pct, 1) AS cost_increase_pct, ROUND(s.total_cost_gbp * $cost_increase_pct / 100, 2) AS cost_increase_gbp,
           ROUND(s.cur_md, 1) AS current_markdown_pct,
           ROUND(s.total_cost_gbp * $cost_increase_pct / s.retail_price_gbp, 1) AS markdown_reduction_needed_pts,
           ROUND(s.cur_md - s.total_cost_gbp * $cost_increase_pct / s.retail_price_gbp, 1) AS markdown_pct_needed_to_break_even,
           ROUND(s.total_cost_gbp * $cost_increase_pct / s.retail_price_gbp / NULLIF(s.cur_md, 0) * 100, 0) AS pct_of_current_markdown_to_remove,
           CASE WHEN s.total_cost_gbp * $cost_increase_pct / s.retail_price_gbp <= s.cur_md THEN 'achievable' ELSE 'markdown cannot fall enough' END AS feasibility,
           'reduction (pts of price) = cost * cost increase % / retail price' AS formula
    FROM s
  limit: 1
  example: {sku: SKU-101897, cost_increase_pct: 12}
- name: calculate_material_cost_at_volume
  desc: Calculate material cost per unit at different purchase volumes, including bulk discounts.
  kind: sql
  args:
    sku: {required: true, desc: SKU}
    volume_units: {type: int, desc: Purchase volume, default: 5000}
  sql: |
    SELECT
      $sku AS sku,
      $volume_units AS volume_units,
      pc.material_cost_gbp AS base_material_cost_gbp,
      CASE
        WHEN $volume_units >= 20000 THEN ROUND(pc.material_cost_gbp * 0.92, 2)
        WHEN $volume_units >= 10000 THEN ROUND(pc.material_cost_gbp * 0.95, 2)
        WHEN $volume_units >= 5000 THEN ROUND(pc.material_cost_gbp * 0.98, 2)
        ELSE pc.material_cost_gbp
      END AS adjusted_material_cost_gbp,
      ROUND(pc.material_cost_gbp - CASE WHEN $volume_units >= 20000 THEN pc.material_cost_gbp * 0.92 ELSE pc.material_cost_gbp END, 2) AS savings_gbp,
      'cost reduction from bulk discount' AS formula
    FROM product_costings pc
    WHERE pc.sku = $sku AND pc.status = 'active'
    LIMIT 1
  limit: 1
  example: {sku: K-1700, volume_units: 10000}
- name: calculate_next_day_margin_impact
  desc: Calculates margin impact of expedited next-day or premium freight cost for urgent shipments.
  kind: sql
  args:
    standard_freight_cost_gbp: {type: float, required: true, desc: Standard freight cost per unit}
    expedited_freight_cost_gbp: {type: float, required: true, desc: Expedited freight cost per unit}
    volume_units: {type: int, desc: Volume requiring expedite, default: 100}
  sql: |
    SELECT
      ROUND($standard_freight_cost_gbp, 2) AS standard_freight_gbp,
      ROUND($expedited_freight_cost_gbp, 2) AS expedited_freight_gbp,
      ROUND($expedited_freight_cost_gbp - $standard_freight_cost_gbp, 2) AS premium_per_unit_gbp,
      $volume_units AS volume_units,
      ROUND(($expedited_freight_cost_gbp - $standard_freight_cost_gbp) * $volume_units, 2) AS total_premium_gbp,
      'premium = (expedited - standard) * volume' AS formula
  limit: 1
  example: {standard_freight_cost_gbp: 2.5, expedited_freight_cost_gbp: 12.0, volume_units: 500}
- name: calculate_price_floor_from_cost
  desc: Calculates minimum retail price floor given cost of goods, target margin and channel mix.
  kind: sql
  args:
    total_cost_gbp: {type: float, required: true, desc: Total cost per unit including all freight and overhead}
    target_margin_pct: {type: float, desc: Target gross margin %, default: 50}
  sql: |
    SELECT
      ROUND($total_cost_gbp, 2) AS total_cost_gbp,
      ROUND($target_margin_pct, 1) AS target_margin_pct,
      ROUND($total_cost_gbp / (1 - $target_margin_pct / 100), 2) AS minimum_retail_price_gbp,
      ROUND($total_cost_gbp * ($target_margin_pct / 100) / (1 - $target_margin_pct / 100), 2) AS margin_gbp_at_floor,
      'floor_price = cost / (1 - margin_pct)' AS formula
  limit: 1
  example: {total_cost_gbp: 15, target_margin_pct: 50}
- name: calculate_product_margin_contribution
  desc: Calculate the margin contribution of a product to category and overall business after all direct costs and allocations.
  kind: sql
  args:
    sku: {required: true, desc: SKU}
    period: {desc: 'Period for analysis, e.g. 2026-08'}
  sql: |
    SELECT
      m.sku,
      m.category,
      ROUND(SUM(m.revenue_gbp), 2) AS total_revenue_gbp,
      ROUND(SUM(m.cost_of_goods_gbp), 2) AS total_cogs_gbp,
      ROUND(SUM(m.gross_margin_gbp), 2) AS gross_margin_gbp,
      ROUND(SUM(m.markdown_gbp), 2) AS markdown_gbp,
      ROUND(SUM(m.net_margin_gbp), 2) AS net_margin_contribution_gbp,
      'contribution = revenue - cogs - markdown' AS formula
    FROM (SELECT sku, category, revenue_gbp, cost_of_goods_gbp, gross_margin_gbp, markdown_gbp, net_margin_gbp
          FROM margin_analyses
          WHERE sku = $sku AND ($period IS NULL OR period = $period)) m
    GROUP BY m.sku, m.category
  limit: 1
  example: {sku: SKU-100007}
- name: calculate_recovered_value_by_route
  desc: Recovered value, handling cost, net recovery, days to cash and risk for each disposition route by item age, with the best route to switch to.
  kind: sql
  args:
    category: {required: true, desc: 'Product category, e.g. Electronics accessories, Knitwear'}
    cost_per_unit_gbp: {type: float, required: true, desc: Original cost per unit in GBP}
    min_age_days: {type: int, desc: 'Only age bands containing items older than this many days, e.g. 60'}
    stock_type:
      type: enum
      values: [returns, aged_stock]
      desc: Customer returns or aged stock
  sql: |
    WITH base AS (
      SELECT r.route_name, rr.age_band, rr.band_min_days, rr.recovery_rate_pct, rr.handling_cost_gbp, rr.time_to_realise_days,
             rr.risk_rating, rr.volume_last_6m,
             ROUND($cost_per_unit_gbp * rr.recovery_rate_pct / 100, 2) AS recovered_value_gbp,
             ROUND($cost_per_unit_gbp * rr.recovery_rate_pct / 100 - rr.handling_cost_gbp, 2) AS net_recovery_gbp
      FROM recovery_rates rr JOIN recovery_routes r ON r.route_id = rr.route_id
      WHERE lower(rr.category) = lower($category) AND ($stock_type IS NULL OR rr.stock_type = $stock_type)
        AND ($min_age_days IS NULL OR rr.band_max_days > $min_age_days)
    ), cur AS (
      SELECT age_band, arg_max(route_name, volume_last_6m) AS current_main_route, arg_max(net_recovery_gbp, volume_last_6m) AS cur_net,
             sum(volume_last_6m) AS band_units
      FROM base GROUP BY age_band
    )
    SELECT b.age_band, b.route_name, b.recovery_rate_pct, b.recovered_value_gbp, b.handling_cost_gbp, b.net_recovery_gbp,
           b.time_to_realise_days, b.risk_rating, b.volume_last_6m AS units_last_6m, c.current_main_route,
           ROUND((b.net_recovery_gbp - c.cur_net) * c.band_units, 0) AS gain_6m_if_band_moved_here_gbp,
           rank() OVER (PARTITION BY b.age_band ORDER BY b.net_recovery_gbp DESC) AS rank_in_band
    FROM base b JOIN cur c USING (age_band)
    ORDER BY b.band_min_days, b.net_recovery_gbp DESC
  limit: 20
  example: {category: Electronics accessories, cost_per_unit_gbp: 20, min_age_days: 60}
- name: calculate_recovery_potential_for_lines
  desc: Recovery potential by disposition route for aged stock of a category at an age threshold, as % of cost and, given stock value, in pounds.
  kind: sql
  args:
    category: {desc: 'Product category, e.g. Knitwear; blank ranks all categories'}
    min_age_days: {type: int, desc: Minimum age of the stock in days, default: 180}
    stock_value_gbp: {type: float, desc: Aged stock value at cost for the category; scales the result to pounds}
  sql: |
    SELECT rr.category, r.route_name, rr.age_band, rr.recovery_rate_pct, rr.handling_cost_gbp, rr.time_to_realise_days,
           rr.risk_rating, rr.avg_unit_cost_gbp,
           ROUND(rr.recovery_rate_pct - rr.handling_cost_gbp / rr.avg_unit_cost_gbp * 100, 1) AS net_recovery_pct_of_cost,
           ROUND($stock_value_gbp * (rr.recovery_rate_pct - rr.handling_cost_gbp / rr.avg_unit_cost_gbp * 100) / 100, 0) AS expected_recovery_gbp,
           rank() OVER (PARTITION BY rr.category ORDER BY rr.recovery_rate_pct - rr.handling_cost_gbp / rr.avg_unit_cost_gbp * 100 DESC) AS route_rank
    FROM recovery_rates rr JOIN recovery_routes r ON r.route_id = rr.route_id
    WHERE rr.stock_type = 'aged_stock' AND ($category IS NULL OR lower(rr.category) = lower($category))
      AND rr.band_min_days <= $min_age_days + 1 AND rr.band_max_days > $min_age_days
    ORDER BY net_recovery_pct_of_cost DESC
  limit: 40
  example: {category: Knitwear, min_age_days: 180, stock_value_gbp: 1000000}
- name: calculate_structure_cost_comparison
  desc: Compare total cost structure between two sourcing origins or manufacturing scenarios.
  kind: sql
  args:
    style_id: {required: true, desc: Style}
    origin_1: {type: str, desc: Origin country code 1}
    origin_2: {type: str, desc: Origin country code 2}
  sql: |
    SELECT
      $style_id AS style_id,
      $origin_1 AS origin_1,
      $origin_2 AS origin_2,
      'Compare material, labour and freight costs between origins' AS comparison_type,
      'Requires costing versions for each origin to be seeded separately' AS note
  limit: 1
  example: {style_id: STY-5520, origin_1: VN, origin_2: PT}
- name: calculate_target_cost
  desc: Target landed cost implied by retail price and margin goal, split into material, labour and other budgets, compared with a SKU's current cost.
  kind: sql
  args:
    retail_price_gbp: {type: float, required: true, desc: 'Retail price in GBP, e.g. the competitor price to match'}
    sku: {desc: 'SKU whose current cost and cost split to compare, e.g. SKU-102590'}
    target_margin_pct: {type: float, desc: Target gross margin %; default is the SKU's costing target}
  sql: |
    WITH s AS (
      SELECT total_cost_gbp, material_cost_gbp, labour_cost_gbp, total_cost_gbp - material_cost_gbp - labour_cost_gbp AS other_cost_gbp, target_margin_pct
      FROM product_costings WHERE sku = $sku AND status = 'active' LIMIT 1
    ), t AS (
      SELECT COALESCE($target_margin_pct, (SELECT target_margin_pct FROM s)) AS tm
    )
    SELECT ROUND($retail_price_gbp, 2) AS retail_price_gbp, ROUND(t.tm, 1) AS target_margin_pct,
           ROUND($retail_price_gbp * (1 - t.tm / 100), 2) AS target_cost_gbp,
           ROUND($retail_price_gbp * (1 - t.tm / 100) * s.material_cost_gbp / s.total_cost_gbp, 2) AS material_budget_gbp,
           ROUND($retail_price_gbp * (1 - t.tm / 100) * s.labour_cost_gbp / s.total_cost_gbp, 2) AS labour_budget_gbp,
           ROUND($retail_price_gbp * (1 - t.tm / 100) * s.other_cost_gbp / s.total_cost_gbp, 2) AS overhead_freight_tooling_budget_gbp,
           ROUND(s.total_cost_gbp, 2) AS current_cost_gbp,
           ROUND(s.total_cost_gbp - $retail_price_gbp * (1 - t.tm / 100), 2) AS cost_reduction_needed_gbp,
           ROUND((s.total_cost_gbp - $retail_price_gbp * (1 - t.tm / 100)) / s.total_cost_gbp * 100, 1) AS cost_reduction_needed_pct,
           ROUND((1 - s.total_cost_gbp / $retail_price_gbp) * 100, 1) AS margin_at_current_cost_pct,
           'target_cost = retail_price * (1 - target_margin); budgets follow the SKU cost split' AS formula
    FROM t LEFT JOIN s ON true
  limit: 1
  example: {retail_price_gbp: 52, sku: SKU-102590}
- name: calculate_tooling_amortisation_per_unit
  desc: Calculate per-unit tooling cost amortised over the expected product lifetime or season volume.
  kind: sql
  args:
    tooling_cost_gbp: {type: float, required: true, desc: Total tooling cost in GBP}
    lifetime_volume_units: {type: int, required: true, desc: Expected lifetime volume}
  sql: |
    SELECT
      ROUND($tooling_cost_gbp, 2) AS total_tooling_cost_gbp,
      $lifetime_volume_units AS lifetime_volume_units,
      ROUND($tooling_cost_gbp / $lifetime_volume_units, 3) AS tooling_per_unit_gbp,
      'tooling_per_unit = total_tooling / lifetime_volume' AS formula
  limit: 1
  example: {tooling_cost_gbp: 15000, lifetime_volume_units: 50000}
- name: calculate_trial_cost_and_duration
  desc: Calculate trial cost and duration for new material evaluation at test volume. Returns cost per unit and time to complete.
  kind: sql
  args:
    material_id: {type: str, desc: 'Material identifier, e.g. MAT-COTTON-10OZ'}
    test_volume_units: {type: int, desc: Test volume units, default: 500}
    days_to_produce: {type: int, desc: Days to produce trial, default: 14}
  sql: |
    SELECT
      $material_id AS material_id,
      $test_volume_units AS test_volume_units,
      $days_to_produce AS days_to_produce,
      COALESCE((SELECT ROUND(cost_per_unit_gbp, 3) FROM material_costs WHERE material_id = $material_id ORDER BY recorded_at DESC LIMIT 1), 5.0) AS cost_per_unit_gbp,
      ROUND(COALESCE((SELECT cost_per_unit_gbp FROM material_costs WHERE material_id = $material_id ORDER BY recorded_at DESC LIMIT 1), 5.0) * $test_volume_units, 2) AS total_trial_cost_gbp,
      'trial_cost = material_cost_per_unit * test_volume' AS formula
  limit: 1
  example: {material_id: MAT-COTTON-10OZ}
- name: calculate_unit_cost_at_volumes
  desc: Calculate unit cost at different order volumes, accounting for scale discounts.
  kind: sql
  args:
    style_id: {required: true}
    volumes: {type: str, desc: 'Volume levels, comma-separated, e.g. 1000,5000,10000', default: '1000,5000,10000'}
  sql: "WITH volumes AS (\n  SELECT 1000 AS volume UNION ALL\n  SELECT 5000 UNION ALL\n  SELECT 10000 UNION ALL\n  SELECT 25000\n)\nSELECT\n  $style_id AS style_id,\n  v.volume AS volume_units,\n  COALESCE(p.total_cost_gbp, 20.0) AS base_cost_gbp,\n  ROUND(COALESCE(p.total_cost_gbp, 20.0) * CASE \n    WHEN v.volume >= 10000 THEN 0.92\n    WHEN v.volume >= 5000 THEN 0.95\n    WHEN v.volume >= 1000 THEN 0.98\n    ELSE 1.0\n  END, 2) AS cost_at_volume_gbp\nFROM volumes v\nLEFT JOIN product_costings p ON p.style_id = $style_id AND p.status = 'active'\nORDER BY v.volume\n"
  limit: 10
  example: {style_id: STY-5520}
- name: calculate_unit_cost_impact_of_material_change
  desc: Calculate unit cost impact when switching to alternative material.
  kind: sql
  args:
    sku: {required: true}
    old_material_id: {type: str, required: true, desc: Current material}
    new_material_id: {type: str, required: true, desc: Alternative material}
  sql: |
    SELECT
      $sku AS sku,
      $old_material_id AS old_material_id,
      $new_material_id AS new_material_id,
      COALESCE((SELECT cost_per_unit_gbp FROM material_costs WHERE material_id = $old_material_id ORDER BY recorded_at DESC LIMIT 1), 5.0) AS old_cost_gbp,
      COALESCE((SELECT cost_per_unit_gbp FROM material_costs WHERE material_id = $new_material_id ORDER BY recorded_at DESC LIMIT 1), 5.5) AS new_cost_gbp,
      ROUND(COALESCE((SELECT cost_per_unit_gbp FROM material_costs WHERE material_id = $new_material_id ORDER BY recorded_at DESC LIMIT 1), 5.5) - COALESCE((SELECT cost_per_unit_gbp FROM material_costs WHERE material_id = $old_material_id ORDER BY recorded_at DESC LIMIT 1), 5.0), 2) AS cost_change_gbp,
      ROUND((COALESCE((SELECT cost_per_unit_gbp FROM material_costs WHERE material_id = $new_material_id ORDER BY recorded_at DESC LIMIT 1), 5.5) - COALESCE((SELECT cost_per_unit_gbp FROM material_costs WHERE material_id = $old_material_id ORDER BY recorded_at DESC LIMIT 1), 5.0)) / COALESCE((SELECT cost_per_unit_gbp FROM material_costs WHERE material_id = $old_material_id ORDER BY recorded_at DESC LIMIT 1), 5.0) * 100, 1) AS cost_change_pct,
      'material_cost_impact = new_cost - old_cost' AS formula
  limit: 1
  example: {sku: K-1700, old_material_id: MAT-COTTON-10OZ, new_material_id: MAT-POLYESTER-100}
- name: calculate_wage_impact_on_fob
  desc: FOB impact of a wage rise in an origin country, from its latest FOB split into labour and other cost, in pounds and percent.
  kind: sql
  args:
    origin_country: {required: true, desc: 'ISO country code, e.g. VN, BD, KH'}
    wage_increase_pct: {type: float, desc: Wage increase percentage, default: 5}
  sql: |
    SELECT h.origin_country, h.basis, h.period_start, $wage_increase_pct AS wage_increase_pct, h.avg_fob_cost_gbp AS base_fob_cost_gbp,
           h.avg_labour_cost_gbp AS base_labour_cost_gbp, h.labour_share_pct,
           ROUND(h.avg_labour_cost_gbp * $wage_increase_pct / 100, 2) AS fob_increase_gbp,
           ROUND(h.avg_fob_cost_gbp + h.avg_labour_cost_gbp * $wage_increase_pct / 100, 2) AS fob_after_wage_increase_gbp,
           ROUND(h.avg_labour_cost_gbp * $wage_increase_pct / h.avg_fob_cost_gbp, 2) AS fob_increase_pct,
           'fob increase = labour cost per unit * wage increase %' AS formula
    FROM fob_price_history h
    WHERE upper(h.origin_country) = upper($origin_country)
    ORDER BY h.period_start DESC LIMIT 1
  limit: 1
  example: {origin_country: VN, wage_increase_pct: 8}
- name: compare_supplier_pass_through_to_market
  desc: Supplier price moves versus market index moves.
  kind: sql
  args:
    supplier_id: {required: true}
    sku: {required: true}
  sql: |
    SELECT
      $supplier_id AS supplier_id,
      $sku AS sku,
      COALESCE((SELECT ROUND(AVG(market_price_index), 1) FROM supplier_cost_history WHERE sku = $sku), 100.0) AS avg_market_index,
      COALESCE((SELECT ROUND(AVG(supplier_price_index), 1) FROM supplier_cost_history WHERE supplier_id = $supplier_id AND sku = $sku), 100.0) AS avg_supplier_index,
      ROUND(COALESCE((SELECT AVG(pass_through_pct) FROM supplier_cost_history WHERE supplier_id = $supplier_id AND sku = $sku), 80.0), 1) AS pass_through_pct,
      'pass_through = (supplier_index - 100) / (market_index - 100)' AS formula
  limit: 1
  example: {supplier_id: SUP-0001, sku: K-1700}
- name: create_costing_version_for_product
  desc: Saves a new costing version for a product at given volumes.
  kind: insert
  table: product_costings
  id_prefix: CST-
  defaults: {status: scenario, version: 2}
  args:
    sku: {required: true}
    quantity_units: {type: int, required: true, desc: Volume units for this version}
    total_cost_gbp: {type: float, required: true, desc: Total cost per unit in GBP}
    retail_price_gbp: {type: float, required: true, desc: Retail price per unit in GBP}
    season: {type: str, desc: Season code, default: AW26}
    notes: {type: str, desc: Notes about this version}
  example: {sku: K-1700, quantity_units: 5000, total_cost_gbp: 9.5, retail_price_gbp: 35.0}
- name: get_buying_margin_by_category_period
  desc: Gross buying margin % for a category over a period against the same period a year earlier, with the change in points.
  kind: sql
  args:
    category: {required: true, desc: 'Product category, e.g. Small Appliances'}
    department: {desc: 'Department, e.g. Electricals'}
    period_from: {type: date, default: -90d, desc: Trading periods starting on or after this date}
    period_to: {type: date, default: today, desc: Trading periods starting on or before this date}
  sql: |
    WITH cur AS (
      SELECT category, sum(revenue_gbp) AS rev, sum(cost_of_goods_gbp) AS cogs, sum(gross_margin_gbp) AS gm, count(DISTINCT sku) AS skus
      FROM margin_analyses
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department))
        AND period_start BETWEEN CAST($period_from AS DATE) AND CAST($period_to AS DATE) GROUP BY category
    ), prev AS (
      SELECT category, sum(revenue_gbp) AS rev, sum(cost_of_goods_gbp) AS cogs, sum(gross_margin_gbp) AS gm
      FROM margin_analyses
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department))
        AND period_start + INTERVAL 364 DAY IN (SELECT DISTINCT period_start FROM margin_analyses
                                                WHERE period_start BETWEEN CAST($period_from AS DATE) AND CAST($period_to AS DATE)) GROUP BY category
    )
    SELECT cur.category, ROUND(cur.rev, 0) AS revenue_gbp, ROUND(cur.cogs, 0) AS cogs_gbp, ROUND(cur.gm / cur.rev * 100, 1) AS buying_margin_pct,
           ROUND(prev.gm / prev.rev * 100, 1) AS same_period_last_year_pct,
           ROUND(cur.gm / cur.rev * 100 - prev.gm / prev.rev * 100, 1) AS change_pts, cur.skus AS sku_count
    FROM cur LEFT JOIN prev USING (category)
  limit: 1
  example: {category: Small Appliances}
- name: get_category_margin_benchmarks
  desc: Category margin benchmarks by channel and season.
  kind: sql
  args:
    category: {required: true}
  sql: |
    SELECT
      m.category,
      m.channel,
      ROUND(AVG(m.gross_margin_pct), 1) AS avg_margin_pct,
      ROUND(MIN(m.gross_margin_pct), 1) AS min_margin_pct,
      ROUND(MAX(m.gross_margin_pct), 1) AS max_margin_pct,
      COUNT(*) AS record_count
    FROM margin_analyses m
    WHERE m.category = $category
    GROUP BY m.category, m.channel
    ORDER BY m.channel
  limit: 10
  example: {category: Dresses}
- name: get_channel_margin_for_product
  desc: Retrieves channel margin for product.
  kind: sql
  args:
    sku: {required: true}
    channel:
      type: enum
      values: [store, online, outlet, wholesale, marketplace]
      desc: Sales channel
  sql: |
    SELECT
      m.sku,
      m.channel,
      ROUND(AVG(m.revenue_gbp), 2) AS avg_revenue_gbp,
      ROUND(AVG(m.cost_of_goods_gbp), 2) AS avg_cogs_gbp,
      ROUND(AVG(m.gross_margin_gbp), 2) AS avg_margin_gbp,
      ROUND(AVG(m.gross_margin_pct), 1) AS avg_margin_pct,
      COUNT(*) AS periods_recorded
    FROM margin_analyses m
    WHERE m.sku = $sku AND m.channel = $channel
    GROUP BY m.sku, m.channel
  limit: 1
  example: {sku: K-1700, channel: store}
- name: get_channel_revenue_and_margin
  desc: Revenue and margin by channel and segment.
  kind: sql
  args:
    period_from: {type: date, default: -35d, desc: Trading periods starting on or after this date; the default is the last 4-week period}
  sql: |
    SELECT
      m.channel,
      ROUND(SUM(m.revenue_gbp), 2) AS total_revenue_gbp,
      ROUND(SUM(m.cost_of_goods_gbp), 2) AS total_cogs_gbp,
      ROUND(SUM(m.gross_margin_gbp), 2) AS total_margin_gbp,
      ROUND(SUM(m.gross_margin_gbp) / SUM(m.revenue_gbp) * 100, 1) AS margin_pct,
      COUNT(DISTINCT m.sku) AS sku_count
    FROM margin_analyses m
    WHERE m.period_start >= CAST($period_from AS DATE)
    GROUP BY m.channel
    ORDER BY total_revenue_gbp DESC
  limit: 10
  example: {}
- name: get_cost_price_changes_for_category
  desc: Retrieves cost price changes for category.
  kind: sql
  args:
    category: {required: true}
  sql: |
    SELECT
      m.category,
      m.period,
      ROUND(AVG(m.revenue_gbp), 2) AS avg_revenue_gbp,
      ROUND(AVG(m.cost_of_goods_gbp), 2) AS avg_cogs_gbp,
      COUNT(DISTINCT m.sku) AS sku_count
    FROM margin_analyses m
    WHERE m.category = $category
    GROUP BY m.category, m.period
    ORDER BY m.period DESC
    LIMIT 12
  limit: 12
  example: {category: Dresses}
- name: get_costed_margin_for_product
  desc: Return costed margin for product.
  kind: sql
  args:
    sku: {required: true}
  sql: |
    SELECT
      p.sku,
      p.style_id,
      p.season,
      ROUND(p.retail_price_gbp, 2) AS retail_price_gbp,
      ROUND(p.total_cost_gbp, 2) AS costed_cost_gbp,
      ROUND(p.gross_margin_gbp, 2) AS margin_gbp,
      ROUND(p.gross_margin_pct, 1) AS margin_pct,
      ROUND(p.target_margin_pct, 1) AS target_margin_pct,
      ROUND(p.target_margin_pct - p.gross_margin_pct, 1) AS variance_to_target_pct
    FROM product_costings p
    WHERE p.sku = $sku AND p.status = 'active'
    ORDER BY p.updated_at DESC
    LIMIT 1
  limit: 1
  example: {sku: K-1700}
- name: get_costed_vs_actual_cost_by_product
  desc: Return costed vs actual cost by product.
  kind: sql
  args:
    sku: {required: true}
  sql: |
    SELECT
      p.sku,
      p.style_id,
      ROUND(p.total_cost_gbp, 2) AS costed_cost_gbp,
      ROUND(COALESCE((SELECT ROUND(AVG(actual_cost_gbp), 2) FROM supplier_cost_history WHERE sku = $sku), p.total_cost_gbp), 2) AS actual_cost_gbp,
      ROUND(COALESCE((SELECT ROUND(AVG(actual_cost_gbp), 2) FROM supplier_cost_history WHERE sku = $sku), p.total_cost_gbp) - p.total_cost_gbp, 2) AS variance_gbp,
      ROUND((COALESCE((SELECT ROUND(AVG(actual_cost_gbp), 2) FROM supplier_cost_history WHERE sku = $sku), p.total_cost_gbp) - p.total_cost_gbp) / p.total_cost_gbp * 100, 1) AS variance_pct
    FROM product_costings p
    WHERE p.sku = $sku AND p.status = 'active'
    ORDER BY p.updated_at DESC
    LIMIT 1
  limit: 1
  example: {sku: K-1700}
- name: get_costing_sheet_for_product
  desc: Return costing sheet for product.
  kind: sql
  args:
    sku: {required: true}
  sql: |
    SELECT
      p.costing_id,
      p.sku,
      p.style_id,
      p.season,
      p.quantity_units,
      ROUND(p.material_cost_gbp, 2) AS material_cost_gbp,
      ROUND(p.labour_cost_gbp, 2) AS labour_cost_gbp,
      ROUND(p.overhead_cost_gbp, 2) AS overhead_cost_gbp,
      ROUND(p.freight_cost_gbp, 2) AS freight_cost_gbp,
      ROUND(p.tooling_cost_gbp, 2) AS tooling_cost_gbp,
      ROUND(p.total_cost_gbp, 2) AS total_cost_gbp,
      ROUND(p.retail_price_gbp, 2) AS retail_price_gbp,
      ROUND(p.gross_margin_gbp, 2) AS margin_gbp,
      ROUND(p.gross_margin_pct, 1) AS margin_pct,
      p.status,
      p.notes
    FROM product_costings p
    WHERE p.sku = $sku AND p.status IN ('active', 'scenario')
    ORDER BY p.version DESC, p.updated_at DESC
  limit: 10
  example: {sku: K-1700}
- name: get_expected_recovery_rates
  desc: Expected recovery on aged or clearance stock.
  kind: sql
  args:
    category: {required: true}
    age_band: {type: str, desc: 'Age band, e.g. 0-30d, 31-60d, 61-180d, 180d+', default: 0-30d}
  sql: |
    SELECT
      r.category,
      r.age_band,
      ro.route_name,
      ROUND(r.recovery_rate_pct, 1) AS recovery_rate_pct,
      ROUND(r.handling_cost_gbp, 2) AS handling_cost_gbp,
      r.time_to_realise_days,
      r.risk_rating,
      r.volume_last_6m
    FROM recovery_rates r
    JOIN recovery_routes ro ON r.route_id = ro.route_id
    WHERE lower(r.category) = lower($category) AND r.age_band = $age_band
    ORDER BY r.recovery_rate_pct DESC
  limit: 10
  example: {category: Electronics accessories, age_band: 0-30d}
- name: get_fabric_cost_history_by_supplier
  desc: Fabric cost per metre by supplier over time.
  kind: sql
  args:
    supplier_id: {required: true}
    material_type:
      type: enum
      values: [fabric, packaging, component, dyes_chemicals]
      default: fabric
  sql: |
    SELECT
      m.material_id,
      m.material_name,
      m.supplier_id,
      m.recorded_at,
      m.unit,
      ROUND(m.cost_per_unit_gbp, 2) AS cost_per_unit_gbp,
      ROUND(m.index_price_gbp, 2) AS index_price_gbp
    FROM material_costs m
    WHERE m.supplier_id = $supplier_id AND m.material_type = $material_type
    ORDER BY m.material_id, m.recorded_at DESC
    LIMIT 100
  limit: 100
  example: {supplier_id: SUP-0001}
- name: get_factory_cost_quotes_by_country
  desc: Factory FOB and freight cost quotes for an origin country, optionally one category, with a country average. Includes prospective RFQ quotes.
  kind: sql
  args:
    origin_country: {required: true, desc: 'ISO country code, e.g. VN, ID, PT'}
    category: {desc: 'Product category, e.g. Footwear'}
  sql: |
    SELECT q.origin_country, q.category, q.quote_status, q.factory_id, q.supplier_id, q.style_count,
           ROUND(q.fob_cost_gbp, 2) AS fob_cost_gbp, ROUND(q.freight_cost_gbp, 2) AS freight_cost_gbp,
           ROUND(q.fob_cost_gbp + q.freight_cost_gbp, 2) AS cost_before_duty_gbp, q.lead_time_days,
           ROUND(avg(q.fob_cost_gbp) OVER (PARTITION BY q.origin_country, q.category), 2) AS country_avg_fob_gbp,
           ROUND(avg(q.fob_cost_gbp + q.freight_cost_gbp) OVER (PARTITION BY q.origin_country, q.category), 2) AS country_avg_cost_before_duty_gbp,
           q.notes
    FROM origin_cost_quotes q
    WHERE upper(q.origin_country) = upper($origin_country) AND ($category IS NULL OR lower(q.category) = lower($category))
    ORDER BY q.category, q.fob_cost_gbp
  limit: 30
  example: {origin_country: VN, category: Footwear}
- name: get_fob_price_history_by_country
  desc: FOB cost per unit by 4-week period for an origin country, with labour share and change against a year earlier.
  kind: sql
  args:
    origin_country: {required: true, desc: 'ISO country code, e.g. VN, BD, KH'}
    period_from: {type: date, default: -400d, desc: Periods starting on or after this date}
  sql: |
    SELECT h.origin_country, h.period_start, h.avg_fob_cost_gbp, h.avg_material_cost_gbp, h.avg_labour_cost_gbp, h.labour_share_pct, h.basis,
           ROUND((h.avg_fob_cost_gbp / lag(h.avg_fob_cost_gbp, 13) OVER (ORDER BY h.period_start) - 1) * 100, 1) AS fob_change_vs_year_ago_pct,
           ROUND((h.avg_labour_cost_gbp / lag(h.avg_labour_cost_gbp, 13) OVER (ORDER BY h.period_start) - 1) * 100, 1) AS labour_change_vs_year_ago_pct,
           h.sku_count
    FROM fob_price_history h
    WHERE upper(h.origin_country) = upper($origin_country)
    QUALIFY h.period_start >= CAST($period_from AS DATE)
    ORDER BY h.period_start DESC
  limit: 20
  example: {origin_country: VN}
- name: get_gross_margin_bridge
  desc: Gross margin movement bridged by driver.
  kind: sql
  args:
    category: {required: true}
  sql: |
    SELECT
      v.category,
      v.department,
      v.period_start,
      v.total_variance_pct,
      v.cost_driver_pct,
      v.fx_driver_pct,
      v.mix_driver_pct,
      v.supplier_driver_pct,
      v.markdown_driver_pct,
      v.other_driver_pct,
      v.notes
    FROM cost_variance_drivers v
    WHERE v.category = $category AND v.basis = 'vs_plan'
    ORDER BY v.period_start DESC, v.department
    LIMIT 12
  limit: 12
  example: {category: Dresses}
- name: get_historical_costings_for_similar_styles
  desc: Return historical costings for similar styles.
  kind: sql
  args:
    style_id: {required: true}
  sql: |
    SELECT
      p.costing_id,
      p.style_id,
      p.sku,
      p.season,
      p.origin_country,
      p.supplier_id,
      ROUND(p.total_cost_gbp, 2) AS cost_gbp,
      ROUND(p.retail_price_gbp, 2) AS price_gbp,
      ROUND(p.gross_margin_pct, 1) AS margin_pct,
      p.updated_at
    FROM product_costings p
    WHERE p.style_id = $style_id OR p.origin_country IN (SELECT origin_country FROM product_costings WHERE style_id = $style_id LIMIT 1)
    ORDER BY p.updated_at DESC
    LIMIT 20
  limit: 20
  example: {style_id: STY-5520}
- name: get_inventory_holding_cost_rate
  desc: Inventory holding cost rate.
  kind: sql
  args: {}
  sql: |
    SELECT
      ROUND(0.20, 2) AS annual_holding_cost_rate_pct,
      'Industry standard: 20% of inventory value per annum' AS notes
  limit: 1
  example: {}
- name: get_margin_bridge_for_category
  desc: Margin bridge for a category and period - price, cost, mix, markdown, shrink, FX and supplier effects in points, with notes on causes.
  kind: sql
  args:
    category: {required: true, desc: 'Product category, e.g. Knitwear'}
    department: {desc: 'Department, e.g. Womenswear'}
    basis:
      type: enum
      values: [vs_plan, yoy]
      default: vs_plan
      desc: vs_plan = against plan; yoy = against last year
    period_from: {type: date, default: -35d, desc: Periods starting on or after this date; the default is the last 4-week period}
  sql: |
    SELECT v.category, v.department, v.basis, v.period_start, ROUND(v.total_variance_pct, 1) AS total_variance_pts,
           ROUND(v.price_driver_pct, 1) AS price_pts, ROUND(v.cost_driver_pct, 1) AS cost_pts, ROUND(v.mix_driver_pct, 1) AS mix_pts,
           ROUND(v.markdown_driver_pct, 1) AS markdown_pts, ROUND(v.shrink_driver_pct, 1) AS shrink_pts, ROUND(v.fx_driver_pct, 1) AS fx_pts,
           ROUND(v.supplier_driver_pct, 1) AS supplier_pts, ROUND(v.other_driver_pct, 1) AS other_pts, v.notes
    FROM cost_variance_drivers v
    WHERE lower(v.category) = lower($category) AND ($department IS NULL OR lower(v.department) = lower($department))
      AND v.basis = $basis AND v.period_start >= CAST($period_from AS DATE)
    ORDER BY v.department, v.period_start DESC
  limit: 6
  example: {category: Knitwear, department: Womenswear}
- name: get_margin_variance_to_plan
  desc: Net margin against plan by 4-week trading period for a category - actual %, plan %, variance in points, revenue and margin.
  kind: sql
  args:
    category: {required: true, desc: 'Product category, e.g. Knitwear'}
    department: {desc: 'Department, e.g. Womenswear; separates Womenswear from Menswear Knitwear'}
    period_from: {type: date, default: -35d, desc: Periods starting on or after this date; the default is the last 4-week period}
  sql: |
    SELECT m.category, m.department, m.period_start, CAST(m.period_start AS DATE) + 27 AS period_end,
           ROUND(sum(m.net_margin_gbp) / sum(m.revenue_gbp) * 100, 1) AS actual_net_margin_pct,
           ROUND(sum(m.plan_margin_pct * m.revenue_gbp) / sum(m.revenue_gbp), 1) AS plan_net_margin_pct,
           ROUND(sum(m.net_margin_gbp) / sum(m.revenue_gbp) * 100 - sum(m.plan_margin_pct * m.revenue_gbp) / sum(m.revenue_gbp), 1) AS variance_to_plan_pts,
           ROUND(sum(m.gross_margin_gbp) / sum(m.revenue_gbp) * 100, 1) AS gross_margin_pct,
           ROUND(sum(m.revenue_gbp), 0) AS total_revenue_gbp, ROUND(sum(m.net_margin_gbp), 0) AS total_net_margin_gbp,
           count(DISTINCT m.sku) AS sku_count
    FROM margin_analyses m
    WHERE lower(m.category) = lower($category) AND ($department IS NULL OR lower(m.department) = lower($department))
      AND m.period_start >= CAST($period_from AS DATE)
    GROUP BY m.category, m.department, m.period_start
    ORDER BY m.department, m.period_start DESC
  limit: 12
  example: {category: Knitwear, department: Womenswear}
- name: get_material_cost_and_performance_data
  desc: Cost and performance of materials.
  kind: sql
  args:
    material_type:
      type: enum
      values: [fabric, packaging, component, dyes_chemicals]
  sql: |
    SELECT
      m.material_id,
      m.material_name,
      m.material_type,
      m.supplier_id,
      m.unit,
      ROUND(m.cost_per_unit_gbp, 2) AS current_cost_gbp,
      ROUND(AVG(m.cost_per_unit_gbp) OVER (PARTITION BY m.material_id), 2) AS avg_cost_gbp,
      m.recorded_at AS last_recorded_at
    FROM material_costs m
    WHERE ($material_type IS NULL OR m.material_type = $material_type)
    ORDER BY m.material_id, m.recorded_at DESC
    LIMIT 50
  limit: 50
  example: {material_type: fabric}
- name: get_material_cost_per_metre
  desc: Return material cost per metre.
  kind: sql
  args:
    material_id: {required: true}
  sql: |
    SELECT
      m.material_id,
      m.material_name,
      m.unit,
      ROUND(m.cost_per_unit_gbp, 3) AS cost_per_metre_gbp,
      m.recorded_at,
      m.supplier_id,
      m.notes
    FROM material_costs m
    WHERE m.material_id = $material_id AND m.unit LIKE '%metre%'
    ORDER BY m.recorded_at DESC
    LIMIT 1
  limit: 1
  example: {material_id: MAT-COTTON-10OZ}
- name: update_costing_sheet_for_product
  desc: Updates the active costing sheet for a product with the chosen scenario.
  kind: update
  table: product_costings
  set: {status: archived, updated_at: $as_of}
  args: {}
  example: {costing_id: CST-SKU-100070-V1}
- name: update_costed_price_for_product
  desc: Updates the costed price for a product for the next season.
  kind: update
  table: product_costings
  set: {retail_price_gbp: '{retail_price_gbp}', updated_at: $as_of}
  args:
    retail_price_gbp: {type: float, required: true, desc: New retail price in GBP}
  example: {costing_id: CST-SKU-100700-V1, retail_price_gbp: 49.99}
- name: get_style_unit_margin
  desc: Unit economics for a style - retail price, landed cost, gross margin per unit and %, planned volume and total planned margin.
  kind: sql
  args:
    style_id: {required: true, desc: 'Style, e.g. STY-7731'}
  sql: |
    SELECT pc.style_id, any_value(pc.category) AS category, any_value(pc.origin_country) AS origin_country,
           any_value(pc.supplier_id) AS supplier_id, count(*) AS sku_count,
           ROUND(avg(pc.retail_price_gbp), 2) AS retail_price_gbp, ROUND(avg(pc.total_cost_gbp), 2) AS total_cost_gbp,
           ROUND(avg(pc.freight_cost_gbp), 2) AS freight_cost_gbp, ROUND(avg(pc.gross_margin_gbp), 2) AS unit_gross_margin_gbp,
           ROUND(avg(pc.gross_margin_pct), 1) AS gross_margin_pct, sum(pc.quantity_units) AS planned_units,
           ROUND(sum(pc.quantity_units * pc.gross_margin_gbp), 0) AS planned_gross_margin_gbp, any_value(pc.status) AS status
    FROM product_costings pc
    WHERE pc.style_id = $style_id AND pc.status = 'active'
    GROUP BY pc.style_id
  limit: 1
  example: {style_id: STY-7731}
- name: get_product_costing_for_style
  desc: Full costing sheet for a style, including material, labour, overhead and freight breakdown.
  kind: sql
  args:
    style_id: {required: true, desc: 'Style, e.g. STY-5520'}
  sql: |
    SELECT
      pc.costing_id,
      pc.style_id,
      pc.sku,
      pc.season,
      ROUND(pc.material_cost_gbp, 2) AS material_cost_gbp,
      ROUND(pc.labour_cost_gbp, 2) AS labour_cost_gbp,
      ROUND(pc.overhead_cost_gbp, 2) AS overhead_cost_gbp,
      ROUND(pc.freight_cost_gbp, 2) AS freight_cost_gbp,
      ROUND(pc.tooling_cost_gbp, 2) AS tooling_cost_gbp,
      ROUND(pc.total_cost_gbp, 2) AS total_cost_gbp,
      ROUND(pc.retail_price_gbp, 2) AS retail_price_gbp,
      ROUND(pc.gross_margin_gbp, 2) AS gross_margin_gbp,
      ROUND(pc.gross_margin_pct, 1) AS gross_margin_pct,
      pc.status,
      pc.quantity_units
    FROM product_costings pc
    WHERE pc.style_id = $style_id AND pc.status = 'active'
    LIMIT 1
  limit: 1
  example: {style_id: STY-5520}
- name: get_material_cost_share_for_product
  desc: Material share of a SKU's cost by component - each material line with its cost and % of unit cost, plus total material share.
  kind: sql
  args:
    sku: {required: true, desc: 'SKU, e.g. SKU-102590'}
  sql: |
    SELECT pc.sku, c.component_type, c.description, ROUND(c.total_cost_gbp, 2) AS cost_gbp,
           ROUND(c.total_cost_gbp / pc.total_cost_gbp * 100, 1) AS pct_of_unit_cost,
           ROUND(pc.material_cost_gbp / pc.total_cost_gbp * 100, 1) AS total_material_share_pct,
           ROUND(pc.labour_cost_gbp / pc.total_cost_gbp * 100, 1) AS labour_share_pct,
           ROUND(pc.freight_cost_gbp / pc.total_cost_gbp * 100, 1) AS freight_share_pct, ROUND(pc.total_cost_gbp, 2) AS unit_cost_gbp
    FROM product_costings pc JOIN cost_sheet_details c ON c.costing_id = pc.costing_id
    WHERE pc.sku = $sku AND pc.status = 'active' AND c.component_type IN ('fabric', 'trimming', 'metal', 'plastics', 'electronics', 'other_material')
    ORDER BY c.total_cost_gbp DESC
  limit: 10
  example: {sku: SKU-102590}
- name: get_shrink_by_category
  desc: Stock-loss (shrink) cost for a category - % of revenue in the period against the 12 weeks before, plus markdown % of revenue.
  kind: sql
  args:
    category: {required: true, desc: 'Product category, e.g. Knitwear'}
    department: {desc: 'Department, e.g. Womenswear'}
    period_from: {type: date, default: -35d, desc: Periods starting on or after this date; the default is the last 4-week period}
  sql: |
    WITH f AS (
      SELECT m.*, CASE WHEN m.period_start >= CAST($period_from AS DATE) THEN 'now'
                       WHEN m.period_start >= CAST($period_from AS DATE) - INTERVAL 84 DAY THEN 'before' END AS win
      FROM margin_analyses m
      WHERE lower(m.category) = lower($category) AND ($department IS NULL OR lower(m.department) = lower($department))
    )
    SELECT any_value(category) AS category, any_value(department) AS department,
           ROUND(sum(shrink_gbp) FILTER (win = 'now'), 0) AS shrink_gbp,
           ROUND(sum(shrink_gbp) FILTER (win = 'now') / sum(revenue_gbp) FILTER (win = 'now') * 100, 2) AS shrink_pct_of_revenue,
           ROUND(sum(shrink_gbp) FILTER (win = 'before') / sum(revenue_gbp) FILTER (win = 'before') * 100, 2) AS prior_12_weeks_shrink_pct,
           ROUND(sum(shrink_gbp) FILTER (win = 'now') / sum(revenue_gbp) FILTER (win = 'now') * 100
                 - sum(shrink_gbp) FILTER (win = 'before') / sum(revenue_gbp) FILTER (win = 'before') * 100, 2) AS shrink_change_pts,
           ROUND(sum(markdown_gbp) FILTER (win = 'now') / sum(revenue_gbp) FILTER (win = 'now') * 100, 2) AS markdown_pct_of_revenue,
           ROUND(sum(revenue_gbp) FILTER (win = 'now'), 0) AS revenue_gbp
    FROM f WHERE win IS NOT NULL
  limit: 1
  example: {category: Knitwear, department: Womenswear}
- name: get_sku_margin_and_revenue
  desc: Revenue and margin by SKU, showing sales by channel and net contribution.
  kind: sql
  args:
    sku: {}
    period_from: {type: date, default: -90d, desc: Period start}
  sql: |
    SELECT
      m.sku,
      m.category,
      SUM(m.volume_units) AS total_units,
      ROUND(SUM(m.revenue_gbp), 2) AS total_revenue_gbp,
      ROUND(SUM(m.cost_of_goods_gbp), 2) AS total_cogs_gbp,
      ROUND(SUM(m.gross_margin_gbp), 2) AS gross_margin_gbp,
      ROUND(SUM(m.markdown_gbp), 2) AS markdown_gbp,
      ROUND(SUM(m.net_margin_gbp), 2) AS net_margin_gbp,
      ROUND(SUM(m.net_margin_gbp) / NULLIF(SUM(m.revenue_gbp), 0) * 100, 1) AS net_margin_pct
    FROM margin_analyses m
    WHERE ($sku IS NULL OR m.sku = $sku)
      AND m.analysed_at >= CAST($period_from AS DATE)
    GROUP BY m.sku, m.category
    ORDER BY total_revenue_gbp DESC
  limit: 50
  example: {period_from: -90d}
- name: get_sku_margin_and_sales_at_risk
  desc: Per-unit margin plus sales and margin at risk over a number of weeks if a SKU runs out, from recent weekly sales rates. Ranked by margin at risk.
  kind: sql
  args:
    sku: {}
    category: {desc: 'Product category, e.g. Footwear'}
    weeks: {type: int, desc: Weeks without stock to price the risk over, default: 4}
  sql: |
    WITH rate AS (
      SELECT sku, avg(store_units + online_units) AS wk_units, avg(revenue_gbp) AS wk_sales
      FROM master.sales_weekly WHERE week_start > (SELECT max(week_start) FROM master.sales_weekly) - INTERVAL 56 DAY GROUP BY sku
    )
    SELECT pc.sku, pc.category, ROUND(pc.retail_price_gbp, 2) AS retail_price_gbp, ROUND(pc.gross_margin_gbp, 2) AS margin_per_unit_gbp,
           ROUND(pc.gross_margin_pct, 1) AS margin_pct, ROUND(rate.wk_units, 0) AS avg_weekly_units, ROUND(rate.wk_sales, 0) AS avg_weekly_sales_gbp,
           $weeks AS weeks, ROUND(rate.wk_sales * $weeks, 0) AS sales_at_risk_gbp,
           ROUND(rate.wk_units * pc.gross_margin_gbp * $weeks, 0) AS margin_at_risk_gbp
    FROM product_costings pc JOIN rate ON rate.sku = pc.sku
    WHERE pc.status = 'active' AND ($sku IS NULL OR pc.sku = $sku) AND ($category IS NULL OR lower(pc.category) = lower($category))
    ORDER BY margin_at_risk_gbp DESC
  limit: 50
  example: {sku: SKU-105341}
- name: get_sku_sales_and_margin
  desc: Sales and margin per SKU, ranked by revenue or margin contribution.
  kind: sql
  args:
    sku: {}
    rank_by: {type: str, desc: Rank by revenue or margin, default: revenue}
  sql: |
    SELECT
      m.sku,
      m.category,
      SUM(m.volume_units) AS units_sold,
      ROUND(SUM(m.revenue_gbp), 2) AS total_revenue_gbp,
      ROUND(SUM(m.cost_of_goods_gbp), 2) AS total_cost_gbp,
      ROUND(SUM(m.gross_margin_gbp), 2) AS gross_margin_gbp,
      ROUND(SUM(m.net_margin_gbp), 2) AS net_margin_gbp,
      ROUND(SUM(m.net_margin_gbp) / NULLIF(SUM(m.revenue_gbp), 0) * 100, 1) AS margin_pct
    FROM margin_analyses m
    WHERE ($sku IS NULL OR m.sku = $sku)
    GROUP BY m.sku, m.category
    ORDER BY SUM(m.revenue_gbp) DESC
  limit: 100
  example: {}
- name: list_top_skus_by_sales
  desc: Top SKUs ranked by sales volume or revenue, with margin and velocity metrics.
  kind: sql
  args:
    limit_rows: {type: int, desc: Number of top SKUs to return, default: 20}
    rank_by: {type: str, desc: Rank by units or revenue, default: units}
  sql: |
    SELECT
      m.sku,
      m.category,
      SUM(m.volume_units) AS units_sold,
      ROUND(SUM(m.revenue_gbp), 2) AS revenue_gbp,
      ROUND(SUM(m.net_margin_gbp), 2) AS net_margin_gbp,
      ROUND(SUM(m.net_margin_gbp) / NULLIF(SUM(m.volume_units), 0), 2) AS margin_per_unit_gbp,
      COUNT(DISTINCT m.period) AS periods_in_sale
    FROM margin_analyses m
    GROUP BY m.sku, m.category
    ORDER BY SUM(m.volume_units) DESC
    LIMIT $limit_rows
  limit: 100
  example: {limit_rows: 20}
- name: list_loss_making_skus
  desc: SKUs where cost to serve exceeds margin or where net margin is negative; priority for cost reduction or discontinuation.
  kind: sql
  args:
    min_loss_gbp: {type: float, desc: Show SKUs whose net margin over the data period is below this GBP amount, default: 0}
  sql: |
    SELECT
      m.sku,
      m.category,
      ROUND(SUM(m.revenue_gbp), 2) AS total_revenue_gbp,
      ROUND(SUM(m.cost_of_goods_gbp), 2) AS total_cogs_gbp,
      ROUND(SUM(m.net_margin_gbp), 2) AS net_margin_gbp,
      ROUND(SUM(m.net_margin_gbp) / NULLIF(SUM(m.revenue_gbp), 0) * 100, 1) AS net_margin_pct,
      SUM(m.volume_units) AS units_sold
    FROM margin_analyses m
    GROUP BY m.sku, m.category
    HAVING SUM(m.net_margin_gbp) < $min_loss_gbp
    ORDER BY SUM(m.net_margin_gbp) ASC
  limit: 100
  example: {min_loss_gbp: 60000}
- name: get_standard_cost_updates
  desc: Standard cost changes and effective dates by SKU and period, tracking cost evolution.
  kind: sql
  args:
    sku: {}
    period_from: {type: str, desc: 'Period start, e.g. 2026-01 (default 6 months back)'}
  sql: |
    SELECT
      sch.sku,
      sch.period,
      ROUND(sch.actual_cost_gbp, 2) AS actual_cost_gbp,
      ROUND(sch.quoted_cost_gbp, 2) AS quoted_cost_gbp,
      ROUND((sch.actual_cost_gbp - sch.quoted_cost_gbp) / NULLIF(sch.quoted_cost_gbp, 0) * 100, 1) AS variance_pct,
      sch.pass_through_pct,
      sch.notes
    FROM supplier_cost_history sch
    WHERE ($sku IS NULL OR sch.sku = $sku)
    ORDER BY sch.period DESC
  limit: 50
  example: {sku: K-1700}
- name: get_unit_cost_and_retail_price
  desc: Unit cost and retail price by SKU, with margin and status.
  kind: sql
  args:
    sku: {}
  sql: |
    SELECT
      pc.sku,
      pc.style_id,
      ROUND(pc.total_cost_gbp, 2) AS unit_cost_gbp,
      ROUND(pc.retail_price_gbp, 2) AS retail_price_gbp,
      ROUND(pc.gross_margin_gbp, 2) AS gross_margin_gbp,
      ROUND(pc.gross_margin_pct, 1) AS gross_margin_pct,
      pc.status,
      pc.quantity_units
    FROM product_costings pc
    WHERE ($sku IS NULL OR pc.sku = $sku) AND pc.status = 'active'
    ORDER BY pc.retail_price_gbp DESC
  limit: 50
  example: {sku: K-1700}
- name: get_target_cost_for_product
  desc: Target cost for a product based on retail price and margin goal, with budget allocation to material, labour and overhead.
  kind: sql
  args:
    sku: {required: true, desc: SKU}
    target_margin_pct: {type: float, desc: Target margin %, default: 55}
  sql: |
    SELECT
      $sku AS sku,
      $target_margin_pct AS target_margin_pct,
      ROUND(AVG(pc.retail_price_gbp), 2) AS avg_retail_price_gbp,
      ROUND(AVG(pc.retail_price_gbp) * (1 - $target_margin_pct / 100), 2) AS target_total_cost_gbp,
      ROUND(AVG(pc.retail_price_gbp) * (1 - $target_margin_pct / 100) * 0.55, 2) AS material_budget_gbp,
      ROUND(AVG(pc.retail_price_gbp) * (1 - $target_margin_pct / 100) * 0.25, 2) AS labour_budget_gbp,
      ROUND(AVG(pc.retail_price_gbp) * (1 - $target_margin_pct / 100) * 0.2, 2) AS overhead_freight_budget_gbp,
      'Budget split: 55% material, 25% labour, 20% overhead/freight' AS budget_allocation
    FROM product_costings pc
    WHERE pc.sku = $sku AND pc.status = 'active'
  limit: 1
  example: {sku: K-1700}
- name: get_target_cost_for_style
  desc: Target cost for a style given retail price and desired margin, breaking down by component.
  kind: sql
  args:
    style_id: {required: true, desc: 'Style, e.g. STY-5520'}
    target_margin_pct: {type: float, desc: Target margin %, default: 55}
  sql: |
    SELECT
      $style_id AS style_id,
      $target_margin_pct AS target_margin_pct,
      ROUND(AVG(pc.retail_price_gbp), 2) AS avg_retail_price_gbp,
      ROUND(AVG(pc.retail_price_gbp) * (1 - $target_margin_pct / 100), 2) AS target_cost_gbp,
      ROUND(AVG(pc.retail_price_gbp) * (1 - $target_margin_pct / 100) * 0.50, 2) AS material_target_gbp,
      ROUND(AVG(pc.retail_price_gbp) * (1 - $target_margin_pct / 100) * 0.30, 2) AS labour_target_gbp,
      ROUND(AVG(pc.retail_price_gbp) * (1 - $target_margin_pct / 100) * 0.20, 2) AS overhead_target_gbp
    FROM product_costings pc
    WHERE pc.style_id = $style_id AND pc.status = 'active'
    GROUP BY pc.style_id
  limit: 1
  example: {style_id: STY-5520}
- name: get_target_margin_for_category
  desc: Target gross margin for a category from costings, with current gross and net margin and plan over the last 13 weeks.
  kind: sql
  args:
    category: {required: true, desc: 'Product category, e.g. Drinkware'}
    department: {desc: 'Department, e.g. Home'}
  sql: |
    WITH t AS (
      SELECT category, avg(target_margin_pct) AS target FROM product_costings
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department)) AND status = 'active' GROUP BY category
    ), m AS (
      SELECT category, sum(gross_margin_gbp) / sum(revenue_gbp) * 100 AS gross_pct, sum(net_margin_gbp) / sum(revenue_gbp) * 100 AS net_pct,
             sum(plan_margin_pct * revenue_gbp) / sum(revenue_gbp) AS plan_pct, count(DISTINCT sku) AS skus
      FROM margin_analyses
      WHERE lower(category) = lower($category) AND ($department IS NULL OR lower(department) = lower($department))
        AND period_start >= CAST($as_of AS DATE) - INTERVAL 90 DAY GROUP BY category
    )
    SELECT t.category, ROUND(t.target, 1) AS target_gross_margin_pct, ROUND(m.gross_pct, 1) AS current_gross_margin_pct,
           ROUND(m.net_pct, 1) AS current_net_margin_pct, ROUND(m.plan_pct, 1) AS plan_net_margin_pct,
           ROUND(m.gross_pct - t.target, 1) AS gross_vs_target_pts, m.skus AS sku_count
    FROM t LEFT JOIN m USING (category)
  limit: 1
  example: {category: Drinkware}
- name: get_product_cost_sheet
  desc: 'Detailed product cost sheet with line items: material, labour, overhead, freight and tooling per unit.'
  kind: sql
  args:
    costing_id: {required: true, desc: 'Costing id, e.g. CST-SKU-102590-V1'}
  sql: |
    SELECT
      csd.costing_id,
      csd.line_no,
      csd.component_type,
      csd.description,
      ROUND(csd.quantity, 2) AS quantity,
      csd.unit,
      ROUND(csd.unit_cost_gbp, 3) AS unit_cost_gbp,
      ROUND(csd.total_cost_gbp, 2) AS total_cost_gbp,
      ROUND(csd.as_pct_of_total, 1) AS pct_of_total_cost
    FROM cost_sheet_details csd
    WHERE csd.costing_id = $costing_id
    ORDER BY csd.line_no
  limit: 50
  example: {costing_id: CST-SKU-102590-V1}
- name: get_products_requiring_modification
  desc: Products where cost structure or sourcing needs review due to margin or cost pressure.
  kind: sql
  args:
    margin_threshold_pct: {type: float, desc: Margin threshold for review, default: 60}
  sql: |
    SELECT
      pc.sku,
      pc.style_id,
      ROUND(pc.gross_margin_pct, 1) AS gross_margin_pct,
      ROUND(pc.target_margin_pct, 1) AS target_margin_pct,
      CASE WHEN pc.gross_margin_pct < $margin_threshold_pct THEN 'YES' ELSE 'NO' END AS needs_modification,
      ROUND(pc.material_cost_gbp, 2) AS material_cost_gbp,
      ROUND(pc.labour_cost_gbp, 2) AS labour_cost_gbp,
      ROUND(pc.freight_cost_gbp, 2) AS freight_cost_gbp,
      'Review sourcing, material or labour efficiency' AS action
    FROM product_costings pc
    WHERE pc.status = 'active' AND pc.gross_margin_pct < $margin_threshold_pct
    ORDER BY pc.gross_margin_pct ASC
  limit: 50
  example: {margin_threshold_pct: 60}
- name: get_nearshore_cost_assumptions
  desc: Unit cost, lead time and MOQ assumptions for nearshore sourcing (Portugal, Turkey, Morocco) versus far-east.
  kind: sql
  args:
    style_id: {required: true, desc: 'Style, e.g. STY-5520'}
  sql: |
    SELECT
      $style_id AS style_id,
      pc.origin_country,
      ROUND(AVG(pc.total_cost_gbp), 2) AS avg_cost_gbp,
      ROUND(AVG(pc.material_cost_gbp), 2) AS material_cost_gbp,
      ROUND(AVG(pc.labour_cost_gbp), 2) AS labour_cost_gbp,
      ROUND(AVG(pc.freight_cost_gbp), 2) AS freight_cost_gbp,
      CASE
        WHEN pc.origin_country IN ('PT', 'TR', 'MA') THEN 'Nearshore (4-6 week lead)'
        ELSE 'Far-east (8-12 week lead)'
      END AS sourcing_region,
      AVG(pc.quantity_units) AS typical_moq,
      'Nearshore offers speed advantage but cost premium' AS note
    FROM product_costings pc
    WHERE pc.style_id = $style_id AND pc.status = 'active'
    GROUP BY pc.origin_country
    ORDER BY pc.origin_country
  limit: 10
  example: {style_id: STY-5520}
- name: get_packaging_unit_cost_by_material
  desc: Packaging unit cost by material type (corrugated, moulded pulp, recycled plastic), with damage rate and recyclability.
  kind: sql
  args:
    category: {}
  sql: |
    SELECT
      'Corrugated' AS material,
      0.85 AS cost_gbp,
      0.95 AS recyclability_pct,
      2.0 AS damage_rate_pct,
      'Standard box' AS spec,
      'Standard option' AS note
    UNION ALL
    SELECT
      'Moulded pulp' AS material,
      0.92 AS cost_gbp,
      0.98 AS recyclability_pct,
      1.5 AS damage_rate_pct,
      'Moulded pulp tray' AS spec,
      'Better protection, premium cost' AS note
    UNION ALL
    SELECT
      'Recycled plastic' AS material,
      0.78 AS cost_gbp,
      0.85 AS recyclability_pct,
      3.0 AS damage_rate_pct,
      'Recycled clamshell' AS spec,
      'Lowest cost but higher damage' AS note
  limit: 3
  example: {}
- name: get_recycled_material_cost_premium
  desc: Cost premium of recycled versus virgin materials (fabric, packaging, plastic components).
  kind: sql
  args:
    material_type: {type: str, desc: 'Material type, e.g. fabric, packaging, plastic'}
  sql: |
    SELECT
      CASE WHEN $material_type = 'fabric' THEN 'Recycled polyester' ELSE 'Virgin polyester' END AS material,
      CASE WHEN $material_type = 'fabric' THEN 5.50 ELSE 5.00 END AS cost_per_unit_gbp,
      CASE WHEN $material_type = 'fabric' THEN 10.0 ELSE 0.0 END AS premium_pct,
      'Supplier margin and certification cost drive premium' AS note
    UNION ALL
    SELECT
      'Recycled packaging',
      0.92 AS cost_per_unit_gbp,
      15.0 AS premium_pct,
      'Certified recycled content and sourcing cost'
  limit: 5
  example: {material_type: fabric}
- name: get_repair_cost_by_category
  desc: Repair and refurbishment cost by product category (electronics, appliances, furniture) if returned for service.
  kind: sql
  args:
    category: {required: true, desc: Product category}
  sql: |
    SELECT
      $category AS category,
      CASE WHEN $category = 'Electronics' THEN 12.50
           WHEN $category = 'Appliances' THEN 15.00
           ELSE 8.00 END AS repair_cost_gbp,
      CASE WHEN $category = 'Electronics' THEN 3
           WHEN $category = 'Appliances' THEN 5
           ELSE 7 END AS avg_repair_days,
      CASE WHEN $category = 'Electronics' THEN 'Component replacement, testing'
           WHEN $category = 'Appliances' THEN 'Functional test, minor parts'
           ELSE 'Inspection and repackaging' END AS typical_repair_work,
      85.0 AS success_rate_pct
  limit: 1
  example: {category: Electronics}
- name: get_resale_value_estimates_by_category
  desc: Expected resale value as % of cost by category and age, for clearance and aged stock routing decisions.
  kind: sql
  args:
    category: {required: true, desc: Product category}
    age_days: {type: int, desc: Product age in days, default: 90}
  sql: |
    SELECT
      $category AS category,
      $age_days AS age_days,
      CASE WHEN $age_days <= 30 THEN 85
           WHEN $age_days <= 60 THEN 70
           WHEN $age_days <= 180 THEN 50
           ELSE 25 END AS resale_value_pct_of_cost,
      CASE WHEN $age_days <= 30 THEN 'Near full retail'
           WHEN $age_days <= 60 THEN 'Outlet channel'
           WHEN $age_days <= 180 THEN 'Liquidator discount'
           ELSE 'Recycling only' END AS best_disposition_route
  limit: 1
  example: {category: Dresses, age_days: 90}
