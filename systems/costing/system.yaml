id: costing
name: Costing & Margin Tool
instructions: |
  Product costing sheets, margin analysis and cost drivers. Style costings track material, labour, overhead and freight. Includes margin bridges, cost variance analysis and disposition routes. Costing ids look like CST-SKU-101897-V1; one per SKU.
tables:
  product_costings:
    key: costing_id
    cols:
      costing_id:
        type: str
        desc: Costing id, e.g. CST-STY-5520-26S1
      style_id:
        type: str
        desc: Style, e.g. STY-5520
      sku:
        type: str
        desc: SKU, e.g. K-1700
      season:
        type: str
        desc: Season code, e.g. AW26
      version:
        type: int
        desc: Version number (1=original, 2+=scenario)
      origin_country:
        type: str
        desc: ISO country code of manufacture
      supplier_id:
        type: str
        desc: Primary supplier
      factory_id:
        type: str
        desc: Factory
      quantity_units:
        type: int
        desc: Quantity for this costing
      material_cost_gbp:
        type: float
        desc: Material cost per unit at volume
      labour_cost_gbp:
        type: float
        desc: Labour cost per unit
      overhead_cost_gbp:
        type: float
        desc: Overhead allocation per unit
      freight_cost_gbp:
        type: float
        desc: Inbound freight per unit
      tooling_cost_gbp:
        type: float
        desc: Tooling amortisation per unit
      total_cost_gbp:
        type: float
        desc: Total landed cost per unit in GBP
      retail_price_gbp:
        type: float
        desc: Retail price per unit
      gross_margin_gbp:
        type: float
        desc: Gross margin per unit (price - cost)
      gross_margin_pct:
        type: float
        desc: Gross margin as % of price
      target_margin_pct:
        type: float
        desc: Target margin goal for this product
      status:
        type: enum
        values:
        - active
        - obsolete
        - scenario
        - archived
        desc: Costing status
      notes:
        type: str
        desc: Version notes or assumptions
      category:
        type: str
        desc: Product category from master, e.g. Outerwear
      department:
        type: str
        desc: Department from master, e.g. Womenswear
      weekly_demand_units:
        type: int
        desc: Planned or recent weekly sales units for this SKU
      late_sales_lost_pct:
        type: float
        desc: Share of demand in a late-delivery window that is lost for good, not deferred
      created_at:
        type: timestamp
        desc: When created
      updated_at:
        type: timestamp
        desc: Last updated
  material_costs:
    key:
    - material_id
    - supplier_id
    - recorded_at
    cols:
      material_id:
        type: str
        desc: Material identifier, e.g. MAT-COTTON-10OZ
      material_name:
        type: str
        desc: Material name, e.g. 10oz cotton fabric
      material_type:
        type: enum
        values:
        - fabric
        - packaging
        - component
        - dyes_chemicals
        desc: Material category
      supplier_id:
        type: str
        desc: Supplier
      unit:
        type: str
        desc: Unit of measure, e.g. metre, kg, unit
      cost_per_unit_gbp:
        type: float
        desc: Cost per unit
      index_price_gbp:
        type: float
        desc: Commodity index price if applicable
      currency_conversion:
        type: float
        desc: FX conversion factor to GBP
      recorded_at:
        type: date
        desc: Date cost recorded
      notes:
        type: str
        desc: Notes on price or contract terms
      application:
        type: str
        desc: Use, e.g. DWR finish, waterproof outerwear
      contains_pfas:
        type: bool
        desc: True if the material contains PFAS
      spray_rating:
        type: int
        desc: Water repellency spray rating, 0-100 (100 = best)
      wash_durability_cycles:
        type: int
        desc: Wash cycles before performance drops
  margin_analyses:
    key: margin_id
    cols:
      margin_id:
        type: str
        desc: Analysis id, e.g. MAR-STY-5520-26S1
      style_id:
        type: str
        desc: Style
      sku:
        type: str
        desc: SKU
      category:
        type: str
        desc: Product category, e.g. Dresses
      period:
        type: str
        desc: Period, e.g. 2026-W39
      channel:
        type: enum
        values:
        - store
        - online
        - outlet
        - wholesale
        - marketplace
        desc: Sales channel
      volume_units:
        type: int
        desc: Units sold
      revenue_gbp:
        type: float
        desc: Total revenue in period
      cost_of_goods_gbp:
        type: float
        desc: Cost of goods sold
      gross_margin_gbp:
        type: float
        desc: Gross profit
      gross_margin_pct:
        type: float
        desc: Gross margin %
      markdown_gbp:
        type: float
