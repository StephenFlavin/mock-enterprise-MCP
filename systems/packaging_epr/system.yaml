id: packaging_epr
name: Packaging Compliance & EPR System
instructions: >
  Extended Producer Responsibility (EPR) compliance, packaging regulations,
  recycled content targets, and recyclability assessments across markets.
  Task ids look like ERT-000123. Use for EPR fees, recycled content tracking,
  regulatory compliance, and preparation planning.

tables:
  packaging_targets:
    key: target_id
    cols:
      target_id: {type: str, desc: "Target id, e.g. TGT-000001"}
      sku: {desc: "Product SKU"}
      material: {type: str, desc: "Packaging material, e.g. corrugated, flexible_plastic, moulded_pulp"}
      metric: {type: str, desc: "Metric name, e.g. recycled_content_pct, recyclability_pct"}
      target_value: {type: float, desc: "Target value (percentage or number)"}
      current_value: {type: float, desc: "Current achieved value"}
      deadline: {type: date, desc: "When target must be met"}
      status: {type: enum, values: [on_track, at_risk, off_track], desc: "Progress status"}
      last_updated: {type: timestamp, desc: "Last review date"}

  epr_registrations:
    key: registration_id
    cols:
      registration_id: {type: str, desc: "Registration, e.g. REG-000001"}
      country: {type: str, desc: "ISO country code"}
      scheme_name: {type: str, desc: "EPR scheme name"}
      registration_number: {type: str, desc: "Unique registration number in that scheme"}
      status: {type: enum, values: [active, pending, suspended, inactive], desc: "Registration status"}
      registration_date: {type: date, desc: "Date registered"}
      category: {type: str, desc: "Product category covered, e.g. packaging, textiles"}

  epr_reporting_obligations:
    key: obligation_id
    cols:
      obligation_id: {type: str, desc: "Obligation id, e.g. OBL-000001"}
      country: {type: str, desc: "ISO country code"}
      category: {type: str, desc: "Product category"}
      data_required: {type: text, desc: "Semicolon-separated data fields needed"}
      deadline: {type: date, desc: "Reporting deadline"}
      frequency: {type: enum, values: [annual, biannual, quarterly, monthly], desc: "Reporting frequency"}
      penalty_gbp: {type: float, desc: "Penalty for non-compliance in GBP"}

  epr_fee_schedules:
    key: schedule_id
    cols:
      schedule_id: {type: str, desc: "Schedule id, e.g. SCH-000001"}
      country: {type: str, desc: "ISO country code"}
      scheme_name: {type: str, desc: "EPR scheme name"}
      category: {type: str, desc: "Fee category: packaging or textiles"}
      material: {type: str, desc: "Material type, e.g. plastic, corrugated, textile"}
      product_category: {type: str, desc: "Textile product category, e.g. Womenswear (textiles only)"}
      fee_per_tonne_gbp: {type: float, desc: "Packaging fee in GBP per tonne"}
      fee_per_item_gbp: {type: float, desc: "Textile fee in GBP per item placed on market"}
      effective_from: {type: date, desc: "When fees come into effect"}
      effective_to: {type: date, desc: "When fees expire (if applicable)"}

  packaging_regulations:
    key: regulation_id
    cols:
      regulation_id: {type: str, desc: "Regulation id, e.g. REG-000001"}
      country: {type: str, desc: "ISO country code"}
      regulation_name: {type: str, desc: "Name of the regulation"}
      requirement: {type: text, desc: "Regulatory requirement text"}
      recycled_content_mandate_pct: {type: float, desc: "Mandatory recycled content % if applicable"}
      plastic_tax_pct: {type: float, desc: "Plastic tax rate if applicable"}
      effective_from: {type: date, desc: "When regulation comes into effect"}
      effective_to: {type: date, desc: "When regulation expires (if applicable)"}
      penalty_gbp: {type: float, desc: "Penalty for non-compliance"}

  recyclability_assessments:
    key: assessment_id
    cols:
      assessment_id: {type: str, desc: "Assessment id, e.g. ASS-000001"}
      sku: {desc: "Product SKU"}
      pack_type: {type: str, desc: "Packaging type, e.g. rigid_box, flexible_pouch, carton"}
      material: {type: str, desc: "Primary material"}
      recyclability_pct: {type: float, desc: "Percentage recyclable"}
      recycled_content_pct: {type: float, desc: "Current recycled content %"}
      recyclability_rating: {type: enum, values: [excellent, good, fair, poor], desc: "Ease of recycling"}
      notes: {type: text, desc: "Assessment notes, e.g. non-recyclable components"}
      assessed_date: {type: date, desc: "Assessment date"}

  recycled_content_data:
    key: [sku, material]
    cols:
      sku: {desc: "Product SKU"}
      material: {type: str, desc: "Packaging material"}
      recycled_content_pct: {type: float, desc: "Current recycled content percentage"}
      target_recycled_pct: {type: float, desc: "Target recycled content %"}
      supplier_id: {desc: "Material supplier"}
      cost_per_unit_gbp: {type: float, desc: "Cost per unit in GBP"}
      last_updated: {type: date, desc: "When data was last verified"}

  recycling_label_rules:
    key: rule_id
    cols:
      rule_id: {type: str, desc: "Rule id, e.g. LBL-000001"}
      country: {type: str, desc: "ISO country code"}
      product_category: {type: str, desc: "Product category, e.g. cosmetics, home, textiles"}
      requirement: {type: text, desc: "Label requirement description"}
      legal_marks: {type: text, desc: "Mandatory legal marks and logos, e.g. Triman"}
      warnings: {type: text, desc: "Warnings and pictograms required on pack"}
      material_markings_required: {type: bool, desc: "Must mark material/component types"}
      disposal_instructions_required: {type: bool, desc: "Must include disposal instructions"}
      language_requirements: {type: text, desc: "Language(s) required"}
      often_missed: {type: text, desc: "Requirement most often missed on artwork"}
      penalty_gbp: {type: float, desc: "Penalty for non-compliant labelling"}
      effective_from: {type: date, desc: "Effective date"}

  epr_preparation_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Task id, e.g. ERT-000001"}
      country: {type: str, desc: "ISO country code"}
      category: {type: str, desc: "Product category"}
      task_description: {type: text, desc: "What needs to be done"}
      status: {type: enum, values: [open, in_progress, completed, cancelled], desc: "Task status"}
      due_date: {type: date, desc: "Due date"}
      assigned_to: {desc: "Employee responsible"}
      cancel_reason: {type: str, desc: "Reason if cancelled"}
      created_at: {type: timestamp, desc: "Creation timestamp"}
      updated_at: {type: timestamp, desc: "Last update timestamp"}

  packaging_cost_factors:
    key: factor_id
    cols:
      factor_id: {type: str, desc: "Factor id, e.g. FCT-000001"}
      material: {type: str, desc: "Material type"}
      country: {type: str, desc: "ISO country code for cost relevance"}
      packaging_tax_rate_pct: {type: float, desc: "Tax rate as percentage"}
      epr_contribution_pct: {type: float, desc: "EPR contribution as % of unit cost"}
      regulatory_cost_per_unit_gbp: {type: float, desc: "Regulatory compliance cost per unit"}
      effective_from: {type: date, desc: "When this cost structure is effective"}

  packaging_catch_up_options:
    key: option_id
    cols:
      option_id: {type: str, desc: "Option id, e.g. CU-000001"}
      target_id: {type: str, desc: "Target the option would close, e.g. TGT-900001"}
      option_name: {type: str, desc: "Short name of the action"}
      description: {type: text, desc: "What the action involves"}
      improvement_pts: {type: float, desc: "Percentage points the action adds to the metric"}
      cost_change_per_unit_gbp: {type: float, desc: "Change in pack cost per unit (negative is a saving)"}
      one_off_cost_gbp: {type: float, desc: "One-off tooling and trial cost"}
      lead_time_weeks: {type: int, desc: "Weeks to deliver"}

tools:
  - name: search_packaging_regulations_by_country
    desc: Packaging regulations (recycled content mandates, plastic taxes, EPR rules) by country with effective dates and whether each is in force or upcoming.
    kind: sql
    args:
      country: {type: str, desc: "ISO country code, or several comma-separated, e.g. GB,FR,DE,ES"}
      regulation_name: {type: str, desc: "Words in the regulation name"}
      status: {type: str, values: [in_force, upcoming, expired], desc: "Filter by whether the regulation applies today"}
    sql: |
      SELECT * FROM (
        SELECT r.regulation_id, r.country, r.regulation_name, r.recycled_content_mandate_pct, r.plastic_tax_pct,
               r.effective_from, r.effective_to, r.penalty_gbp,
               CASE WHEN r.effective_from > CAST($as_of AS DATE) THEN 'upcoming'
                    WHEN r.effective_to IS NOT NULL AND r.effective_to < CAST($as_of AS DATE) THEN 'expired'
                    ELSE 'in_force' END AS status,
               GREATEST(0, r.effective_from - CAST($as_of AS DATE)) AS days_until_effective
        FROM packaging_regulations r
        WHERE ($country IS NULL OR r.country IN (SELECT upper(trim(x)) FROM unnest(string_split($country, ',')) t(x)))
          AND ($regulation_name IS NULL OR r.regulation_name ILIKE '%' || $regulation_name || '%')
      ) q
      WHERE $status IS NULL OR q.status = $status
      ORDER BY q.effective_from, q.country
    limit: 30
    example: {country: "GB,FR,DE,ES"}

  - name: get_epr_fee_rates
    desc: Packaging EPR fee rates per tonne by material, country and scheme, with effective dates and whether each rate is current or upcoming.
    kind: sql
    args:
      country: {type: str, desc: "ISO country code, or several comma-separated, e.g. GB,FR,DE,ES"}
      material: {type: str, desc: "Packaging material, e.g. plastic, corrugated, flexible_plastic, moulded_pulp"}
      scheme_name: {type: str, desc: "Scheme name or part of it"}
    sql: |
      SELECT s.schedule_id, s.country, s.scheme_name, s.material, s.fee_per_tonne_gbp, s.effective_from, s.effective_to,
             CASE WHEN s.effective_from > CAST($as_of AS DATE) THEN 'upcoming'
                  WHEN s.effective_to IS NOT NULL AND s.effective_to < CAST($as_of AS DATE) THEN 'expired'
                  ELSE 'current' END AS status
      FROM epr_fee_schedules s
      WHERE s.category = 'packaging'
        AND ($country IS NULL OR s.country IN (SELECT upper(trim(x)) FROM unnest(string_split($country, ',')) t(x)))
        AND ($material IS NULL OR lower(s.material) = lower($material))
        AND ($scheme_name IS NULL OR s.scheme_name ILIKE '%' || $scheme_name || '%')
      ORDER BY s.country, s.material, s.effective_from
    limit: 40
    example: {country: "DE", material: plastic}

  - name: get_epr_registrations_by_country
    desc: EPR scheme registrations by country, scheme, category and status (active, pending, suspended), with registration numbers.
    kind: select
    from: epr_registrations
    filters:
      country: {}
      scheme_name: {op: like}
      status: {}
      category: {}
    columns: [registration_id, country, scheme_name, registration_number, status, registration_date, category]
    order: country, category
    limit: 30
    example: {country: DE}

  - name: list_epr_reporting_obligations
    desc: EPR reporting obligations by country and category with deadline, frequency, required data fields and penalty for late or missing reports.
    kind: select
    from: epr_reporting_obligations
    filters:
      country: {}
      category: {}
    columns: [obligation_id, country, category, data_required, deadline, frequency, penalty_gbp]
    order: country, category
    limit: 30
    example: {country: FR, category: packaging}

  - name: get_epr_reporting_requirements
    desc: Data fields to report and deadlines by country and category. Use for what must be reported and when; list_epr_reporting_obligations adds penalties.
    kind: select
    from: epr_reporting_obligations
    filters:
      country: {}
      category: {}
    columns: [country, category, data_required, deadline, frequency]
    order: country, category
    limit: 20
    example: {country: NL, category: textiles}

  - name: search_epr_scheme_fee_schedules
    desc: EPR fee schedules by scheme, country and category. Packaging fees are per tonne, textile fees per item by product category.
    kind: select
    from: epr_fee_schedules
    filters:
      scheme_name: {op: like, desc: "Scheme name or part of it"}
      country: {}
      category: {desc: "packaging or textiles"}
      product_category: {desc: "Textile product category, e.g. Womenswear, Menswear, Kids, Footwear, Home Textiles"}
    columns: [scheme_name, country, category, material, product_category, fee_per_tonne_gbp, fee_per_item_gbp, effective_from, effective_to]
    order: country, category, product_category, material, effective_from
    limit: 40
    example: {category: textiles}

  - name: get_packaging_targets_and_progress
    desc: Packaging targets (recycled content, recyclability) by SKU and material with current value, gap and status, biggest gap first.
    kind: sql
    args:
      sku: {}
      metric: {type: str, values: [recycled_content_pct, recyclability_pct], desc: "Target metric"}
      material: {type: str, desc: "Packaging material, e.g. corrugated, moulded_pulp, recycled_plastic"}
      status: {type: str, values: [on_track, at_risk, off_track], desc: "Progress status"}
    sql: |
      SELECT t.target_id, t.sku, t.material, t.metric, t.target_value, t.current_value,
             ROUND(GREATEST(0, t.target_value - t.current_value), 1) AS gap_points,
             ROUND(100.0 * GREATEST(0, t.target_value - t.current_value) / NULLIF(t.target_value, 0), 1) AS gap_pct,
             t.deadline, t.status,
             'gap_pct = (target - current) / target * 100' AS formula
      FROM packaging_targets t
      WHERE ($sku IS NULL OR t.sku = $sku)
        AND ($metric IS NULL OR t.metric = $metric)
        AND ($material IS NULL OR lower(t.material) = lower($material))
        AND ($status IS NULL OR t.status = $status)
      ORDER BY gap_pct DESC, t.target_id
    limit: 50
    example: {status: off_track}

  - name: get_recycled_content_and_recyclability
    desc: Recycled content %, recyclability % and rating, cost and 2028 target check by SKU and packaging material. Filter by SKU or product category.
    kind: sql
    args:
      sku: {}
      material: {type: str, desc: "Packaging material, e.g. corrugated, moulded_pulp, recycled_plastic"}
      category: {type: str, desc: "Product category, e.g. Small Appliances"}
    sql: |
      SELECT r.sku, pr.category, r.material, a.pack_type, r.recycled_content_pct, r.target_recycled_pct,
             ROUND(GREATEST(0, r.target_recycled_pct - r.recycled_content_pct), 1) AS shortfall_pct,
             a.recyclability_pct, tr.target_value AS target_recyclability_pct, a.recyclability_rating,
             r.cost_per_unit_gbp, r.supplier_id,
             (r.recycled_content_pct >= r.target_recycled_pct AND a.recyclability_pct >= COALESCE(tr.target_value, 0)) AS meets_targets
      FROM recycled_content_data r
      JOIN master.products pr ON pr.sku = r.sku
      LEFT JOIN recyclability_assessments a ON a.sku = r.sku AND a.material = r.material
      LEFT JOIN packaging_targets tr ON tr.sku = r.sku AND tr.material = r.material AND tr.metric = 'recyclability_pct'
      WHERE ($sku IS NULL OR r.sku = $sku)
        AND ($material IS NULL OR lower(r.material) = lower($material))
        AND ($category IS NULL OR lower(pr.category) = lower($category))
      ORDER BY r.sku, r.material
    limit: 50
    example: {sku: SKU-100532}

  - name: get_recyclability_assessment_for_pack
    desc: "Recyclability assessment for a pack: recyclable %, recycled content, rating and non-recyclable components by SKU and pack type."
    kind: select
    from: recyclability_assessments
    filters:
      sku: {}
      pack_type: {desc: "Pack type, e.g. rigid_box, flexible_pouch, carton, tray"}
    columns: [assessment_id, sku, pack_type, material, recyclability_pct, recycled_content_pct, recyclability_rating, notes, assessed_date]
    order: sku, pack_type
    limit: 20
    example: {sku: SKU-100091}

  - name: get_recycling_label_rules_by_country
    desc: Recycling label rules by country and product category - legal marks, warnings, material markings, disposal instructions, language and commonly missed items.
    kind: sql
    args:
      country: {type: str, desc: "ISO country code, or several comma-separated, e.g. FR,DE,IT"}
      product_category: {type: str, desc: "Product category, e.g. cosmetics, home"}
    sql: |
      SELECT r.rule_id, r.country, r.product_category, r.requirement, r.legal_marks, r.warnings,
             r.material_markings_required, r.disposal_instructions_required, r.language_requirements,
             r.often_missed, r.penalty_gbp, r.effective_from
      FROM recycling_label_rules r
      WHERE ($country IS NULL OR r.country IN (SELECT upper(trim(x)) FROM unnest(string_split($country, ',')) t(x)))
        AND ($product_category IS NULL OR lower(r.product_category) = lower($product_category))
      ORDER BY r.country, r.product_category
    limit: 30
    example: {country: "FR,DE,IT", product_category: cosmetics}

  - name: calculate_epr_cost_by_country
    desc: "Annual EPR fee and plastic tax for a packaging volume by country, plus the next announced fee. Omit country to cover GB, DE, FR, ES and NL."
    kind: sql
    args:
      country: {type: str, desc: "ISO country code, or several comma-separated, e.g. GB,FR,DE,ES"}
      volume_tonnes: {type: float, required: true, desc: "Annual packaging volume in tonnes"}
      material: {type: str, default: plastic, desc: "Packaging material, e.g. plastic, corrugated, flexible_plastic"}
      material_value_per_tonne_gbp: {type: float, default: 1500, desc: "Value of the plastic per tonne, the base for plastic tax"}
    sql: |
      WITH c AS (
        SELECT upper(trim(x)) AS country FROM unnest(string_split(COALESCE($country, 'GB,DE,FR,ES,NL'), ',')) t(x)
      ), cur AS (
        SELECT s.country, s.scheme_name, s.fee_per_tonne_gbp FROM epr_fee_schedules s
        WHERE s.category = 'packaging' AND lower(s.material) = lower($material)
          AND s.effective_from <= CAST($as_of AS DATE) AND (s.effective_to IS NULL OR s.effective_to >= CAST($as_of AS DATE))
      ), nxt AS (
        SELECT s.country, s.fee_per_tonne_gbp, s.effective_from FROM epr_fee_schedules s
        WHERE s.category = 'packaging' AND lower(s.material) = lower($material) AND s.effective_from > CAST($as_of AS DATE)
        QUALIFY row_number() OVER (PARTITION BY s.country ORDER BY s.effective_from) = 1
      ), tax AS (
        SELECT country, max(plastic_tax_pct) AS pct FROM packaging_regulations
        WHERE effective_from <= CAST($as_of AS DATE) AND (effective_to IS NULL OR effective_to >= CAST($as_of AS DATE))
        GROUP BY country
      )
      SELECT c.country, cur.scheme_name, $material AS material, $volume_tonnes AS volume_tonnes,
             COALESCE(cur.fee_per_tonne_gbp, 0) AS epr_fee_per_tonne_gbp,
             ROUND($volume_tonnes * COALESCE(cur.fee_per_tonne_gbp, 0), 2) AS annual_epr_cost_gbp,
             CASE WHEN lower($material) LIKE '%plastic%' THEN COALESCE(tax.pct, 0) ELSE 0 END AS plastic_tax_pct,
             ROUND(CASE WHEN lower($material) LIKE '%plastic%' THEN $volume_tonnes * $material_value_per_tonne_gbp * COALESCE(tax.pct, 0) / 100.0 ELSE 0 END, 2) AS annual_plastic_tax_gbp,
             ROUND($volume_tonnes * COALESCE(cur.fee_per_tonne_gbp, 0)
                   + CASE WHEN lower($material) LIKE '%plastic%' THEN $volume_tonnes * $material_value_per_tonne_gbp * COALESCE(tax.pct, 0) / 100.0 ELSE 0 END, 2) AS total_annual_cost_gbp,
             nxt.fee_per_tonne_gbp AS next_fee_per_tonne_gbp, nxt.effective_from AS next_fee_effective_from,
             'total = tonnes * epr_fee_per_tonne + tonnes * material_value_per_tonne * plastic_tax_pct / 100 (tax on plastic only)' AS formula
      FROM c LEFT JOIN cur USING (country) LEFT JOIN nxt USING (country) LEFT JOIN tax USING (country)
      ORDER BY total_annual_cost_gbp DESC
    limit: 10
    example: {country: "GB,DE,FR,ES", volume_tonnes: 500}

  - name: calculate_epr_fee_exposure
    desc: "Estimated annual textile EPR fee by country for one product category and volume in units, cheapest country first. Call once per category."
    kind: sql
    args:
      category: {type: str, required: true, desc: "Textile product category: Womenswear, Menswear, Kids, Footwear or Home Textiles"}
      volume_units: {type: int, required: true, desc: "Annual volume in units for that category"}
      country: {type: str, desc: "ISO country code, or several comma-separated, e.g. GB,FR,NL. Default all textile schemes"}
    sql: |
      WITH latest AS (
        SELECT s.* FROM epr_fee_schedules s
        WHERE s.category = 'textiles' AND lower(s.product_category) = lower($category)
          AND ($country IS NULL OR s.country IN (SELECT upper(trim(x)) FROM unnest(string_split($country, ',')) t(x)))
        QUALIFY row_number() OVER (PARTITION BY s.country ORDER BY s.effective_from DESC) = 1
      )
      SELECT l.country, l.scheme_name, l.product_category AS category, $volume_units AS volume_units,
             l.fee_per_item_gbp, ROUND($volume_units * l.fee_per_item_gbp, 2) AS estimated_annual_fee_gbp,
             l.effective_from AS fee_effective_from,
             COALESCE((SELECT string_agg(r.status, '; ') FROM epr_registrations r WHERE r.country = l.country AND r.category = 'textiles'), 'not registered') AS textiles_registration,
             'estimated_fee = volume_units * fee_per_item (latest published schedule, may not yet be in force)' AS formula
      FROM latest l
      ORDER BY estimated_annual_fee_gbp
    limit: 10
    example: {category: Womenswear, volume_units: 400000}

  - name: calculate_catch_up_options
    desc: Options, speed and cost to close packaging target gaps, biggest gap first; speed_rank 1 is the fastest option that closes the gap.
    kind: sql
    args:
      sku: {}
      metric: {type: str, values: [recycled_content_pct, recyclability_pct], desc: "Target metric"}
      annual_units: {type: int, default: 400000, desc: "Annual pack volume used to cost per-unit changes"}
    sql: |
      SELECT t.target_id, t.sku, t.material, t.metric, t.target_value, t.current_value,
             ROUND(t.target_value - t.current_value, 1) AS gap_points,
             ROUND(100.0 * (t.target_value - t.current_value) / t.target_value, 1) AS gap_pct,
             o.option_id, o.option_name, o.improvement_pts,
             (o.improvement_pts >= t.target_value - t.current_value) AS closes_gap,
             o.lead_time_weeks, o.cost_change_per_unit_gbp, o.one_off_cost_gbp,
             ROUND(o.cost_change_per_unit_gbp * $annual_units, 0) AS annual_cost_change_gbp,
             ROUND(o.one_off_cost_gbp + o.cost_change_per_unit_gbp * $annual_units, 0) AS first_year_cost_gbp,
             row_number() OVER (PARTITION BY t.target_id ORDER BY (o.improvement_pts >= t.target_value - t.current_value) DESC, o.lead_time_weeks) AS speed_rank,
             'first_year_cost = one_off + cost_change_per_unit * annual_units (negative is a saving)' AS formula
      FROM packaging_targets t JOIN packaging_catch_up_options o ON o.target_id = t.target_id
      WHERE t.target_value > t.current_value
        AND ($sku IS NULL OR t.sku = $sku)
        AND ($metric IS NULL OR t.metric = $metric)
      ORDER BY gap_pct DESC, t.target_id, speed_rank
    limit: 30
    example: {sku: SKU-100091, metric: recyclability_pct}

  - name: draft_epr_preparation_plan
    desc: "Draft a six-month EPR readiness plan for a country and category: registration status, reporting deadlines, data to gather and existing tasks with ids."
    kind: draft
    args:
      country: {type: str, required: true, desc: "ISO country code, e.g. FR"}
      category: {type: str, required: true, desc: "EPR category: packaging or textiles"}
    sql:
      obligations: SELECT *, deadline - CAST($as_of AS DATE) AS days_left FROM epr_reporting_obligations WHERE country = upper($country) AND category = lower($category)
      registrations: SELECT * FROM epr_registrations WHERE country = upper($country) AND category = lower($category)
      tasks: SELECT * FROM epr_preparation_tasks WHERE country = upper($country) AND category = lower($category) ORDER BY due_date
      fees: SELECT DISTINCT scheme_name, effective_from FROM epr_fee_schedules WHERE country = upper($country) AND category = lower($category) ORDER BY effective_from
    template: |
      EPR Readiness Plan: {{ country|upper }} - {{ category }} (next six months)

      Scheme and fees:
      {% for f in fees -%}
      - {{ f.scheme_name }}: fees from {{ f.effective_from }}
      {% else -%}
      - No fee schedule published yet
      {% endfor %}
      Registration:
      {% for reg in registrations -%}
      - {{ reg.scheme_name }}: {{ reg.status }} ({{ reg.registration_number }})
      {% else -%}
      - Not registered: register with the scheme first
      {% endfor %}
      Reporting obligations (data we must be able to supply):
      {% for o in obligations -%}
      - {{ o.frequency }} report due {{ o.deadline }} ({{ o.days_left }} days), penalty {{ o.penalty_gbp|money }}
        Data: {{ o.data_required }}
      {% else -%}
      - No obligation recorded
      {% endfor %}
      Existing preparation tasks:
      {% for t in tasks -%}
      - {{ t.task_id }} [{{ t.status }}] due {{ t.due_date }}: {{ t.task_description }}
      {% else -%}
      - None yet
      {% endfor %}
      Suggested sequence:
      1. Month 1: confirm scheme registration status and name a compliance owner
      2. Months 1-2: check every required data field exists in PIM and close the gaps
      3. Months 3-4: collect volumes by product category and test the reporting workflow
      4. Months 5-6: dry-run the first report before the deadline above
    example: {country: FR, category: textiles}

  - name: draft_artwork_compliance_checklist
    desc: "Draft an artwork compliance checklist for a product category: legal marks, recycling labels, warnings and language per country. Several countries allowed."
    kind: draft
    args:
      country: {type: str, desc: "ISO country code, or several comma-separated, e.g. FR,DE,IT. Default all"}
      product_category: {type: str, required: true, desc: "Product category, e.g. cosmetics"}
    sql:
      rules: SELECT * FROM recycling_label_rules WHERE ($country IS NULL OR country IN (SELECT upper(trim(x)) FROM unnest(string_split($country, ',')) t(x))) AND lower(product_category) = lower($product_category) ORDER BY country
    template: |
      Artwork Compliance Checklist: {{ product_category }} - {{ country|default('all countries', true) }}

      {% for r in rules -%}
      {{ r.country }}
      [ ] Rule: {{ r.requirement }}
      [ ] Legal marks: {{ r.legal_marks }}
      [ ] Material markings required: {{ 'yes' if r.material_markings_required else 'no' }}
      [ ] Disposal instructions required: {{ 'yes' if r.disposal_instructions_required else 'no' }}
      [ ] Warnings: {{ r.warnings }}
      [ ] Language: {{ r.language_requirements }}
      [ ] Easy to miss: {{ r.often_missed }}
      [ ] Penalty for non-compliant labelling: {{ r.penalty_gbp|money }}

      {% else -%}
      No label rules found for this country and category.

      {% endfor -%}
      Sign-off:
      - [ ] Legal review complete
      - [ ] Translations verified
      - [ ] Print-ready approved
    example: {country: "FR,DE,IT", product_category: cosmetics}

  - name: create_epr_preparation_task
    desc: Create an EPR readiness task for a country and category with due date and owner. Returns the new task with its id.
    kind: insert
    table: epr_preparation_tasks
    id_prefix: ERT-
    defaults: {status: open}
    args:
      country: {required: true, desc: "ISO country code, e.g. FR"}
      category: {required: true, desc: "EPR category: packaging or textiles"}
      task_description: {required: true}
      due_date: {type: date, required: true}
      assigned_to: {desc: "Employee id, e.g. EMP-00105"}
    example: {country: FR, category: textiles, task_description: "Verify all product data fields available in PIM", due_date: "+30d"}

  - name: cancel_epr_preparation_task
    desc: Cancel an EPR preparation task by id with a reason. Returns the old and new status.
    kind: update
    table: epr_preparation_tasks
    set: {status: cancelled}
    args:
      cancel_reason: {required: true, desc: "Reason for cancellation"}
    example: {task_id: ERT-900009, cancel_reason: "Out of scope for this market"}
