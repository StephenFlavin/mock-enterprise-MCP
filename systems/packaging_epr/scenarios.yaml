# One entry per question row that uses this system's tools (see: python -m mockmcp brief packaging_epr).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:21:Q4"
  story: >
    Reverse logistics asks about EPR rules on returned goods in Germany, France and the Netherlands.
    Packaging registrations are active in all three (DSD, La Poubelle Verte, Nedvang). Packaging reporting
    obligations all include returned-goods and take-back volumes; France is the strictest (quarterly reporting,
    penalty 60000) against Germany annual 50000 and the Netherlands annual 40000.
  checks:
    - tool: get_epr_registrations_by_country
      args: {country: DE, category: packaging}
      expect: ["DSD (Germany)", "active", "DE-WZ-2024-001"]
    - tool: get_epr_registrations_by_country
      args: {country: FR, category: packaging}
      expect: ["La Poubelle Verte (France)", "active", "FR-LPV-2024-089"]
    - tool: get_epr_registrations_by_country
      args: {country: NL, category: packaging}
      expect: ["Nedvang (Netherlands)", "active", "NL-NDV-2024-045"]
    - tool: list_epr_reporting_obligations
      args: {country: DE, category: packaging}
      expect: ["Returned-goods and take-back volumes", "annual", "50000"]
    - tool: list_epr_reporting_obligations
      args: {country: FR, category: packaging}
      expect: ["Returned-goods and take-back volumes", "quarterly", "60000"]
    - tool: list_epr_reporting_obligations
      args: {country: NL, category: packaging}
      expect: ["Returned-goods and take-back volumes", "annual", "40000"]

- question: "04:40:Q1"
  story: >
    Small appliance SKU-100532 compares corrugated carton (40% recycled, 95% recyclable), moulded pulp tray
    (80% recycled, 96% recyclable) and recycled plastic pouch (100% recycled, 75% recyclable) against 2028 targets of 60%
    recycled content and 90% recyclability. Only moulded pulp meets both; corrugated misses recycled content and the
    pouch misses recyclability. Costs 0.65, 0.82 and 1.15 per unit.
  checks:
    - tool: get_recycled_content_and_recyclability
      args: {category: Small Appliances}
      expect: ["SKU-100532", "corrugated", "moulded_pulp", "recycled_plastic", "true", "false"]
    - tool: get_packaging_targets_and_progress
      args: {sku: SKU-100532}
      expect: ["recycled_content_pct", "recyclability_pct", "90", "60"]
    - tool: get_recycled_content_and_recyclability
      args: {sku: SKU-100532, material: moulded_pulp}
      expect: ["80", "96", "0.82", "true"]

- question: "04:40:Q2"
  story: >
    UK, France, Germany and Spain have current EPR fees, recycled-content mandates and plastic taxes (UK 10%, France 20%,
    Spain 12%, Germany 0%). Upcoming: UK EPR modulated fees first (from next year), then UK plastic tax uplift,
    Spain phase 2, France AGEC phase 2 and EU PPWR in Germany and France. 120 tonnes of plastic costs most in France
    (98400) and least in Germany (57600).
  checks:
    - tool: search_packaging_regulations_by_country
      args: {country: "GB,FR,DE,ES"}
      expect: ["UK Packaging EPR (modulated fees)", "upcoming", "AGEC Law", "Law 7/2022 (Spain)", "EU PPWR (Germany)"]
    - tool: search_packaging_regulations_by_country
      args: {country: "GB", status: upcoming}
      expect: ["UK Packaging EPR (modulated fees)", "UK Plastic Packaging Tax uplift"]
    - tool: get_epr_fee_rates
      args: {country: "GB,FR,DE,ES", material: plastic}
      expect: ["480", "520", "400", "460", "upcoming"]
    - tool: calculate_epr_cost_by_country
      args: {country: "GB,FR,DE,ES", volume_tonnes: 120, material: plastic}
      expect: ["98400", "76800", "66000", "57600"]

- question: "04:40:Q5"
  story: >
    Targets are 60% recycled content and 90% recyclability by 2028. Furthest behind is the new product SKU-100091 rigid
    plastic box (recyclability 20 vs 90, recycled content 15 vs 60), then SKU-100007 polybag recycled content (20 vs 60).
    Fastest option to close the recyclability gap is a corrugated carton (8 weeks, saves 160000 a year at 400000 units).
  checks:
    - tool: get_packaging_targets_and_progress
      args: {status: off_track}
      expect: ["TGT-900008", "SKU-100091", "77.8", "TGT-900007", "SKU-100007"]
    - tool: get_recycled_content_and_recyclability
      args: {sku: SKU-100091}
      expect: ["rigid_plastic", "15", "20"]
    - tool: calculate_catch_up_options
      args: {sku: SKU-100091, metric: recyclability_pct}
      expect: ["CU-900001", "Switch to corrugated carton", "8", "-160000"]

- question: "05:49:Q6"
  story: >
    Textile EPR fees per item: France (Refashion, from next January) Womenswear 0.12, Home Textiles 0.35; Netherlands
    (UPV Textiel, suspended registration) 0.10 and 0.30; UK (proposed scheme, no registration) 0.14 and 0.40. 1.2m womenswear
    items cost 144000 in France, 120000 in the Netherlands and 168000 in the UK. Reporting needs volume by product category,
    fibre composition and end-of-life data. Open NL textiles tasks ERT-900009 and ERT-900010 can be cancelled after France
    tasks are created.
  checks:
    - tool: search_epr_scheme_fee_schedules
      args: {category: textiles, country: FR}
      expect: ["Refashion (France)", "0.12", "0.35"]
    - tool: calculate_epr_fee_exposure
      args: {category: Womenswear, volume_units: 1200000}
      expect: ["168000", "144000", "120000", "suspended", "not registered"]
    - tool: get_epr_reporting_requirements
      args: {country: FR, category: textiles}
      expect: ["Fibre composition", "End-of-life pathway data"]
    - tool: draft_epr_preparation_plan
      args: {country: NL, category: textiles}
      expect: ["ERT-900009", "ERT-900010", "suspended"]
    - tool: create_epr_preparation_task
      args: {country: FR, category: textiles, task_description: "Collect FY26 volumes by product category", due_date: "+30d", assigned_to: EMP-00105}
      expect: ["ERT-900011", "open", "FR"]
    - tool: cancel_epr_preparation_task
      args: {task_id: ERT-900009, cancel_reason: "Netherlands out of scope"}
      expect: ["open", "cancelled"]
    - tool: draft_epr_preparation_plan
      args: {country: NL, category: textiles}
      expect: ["ERT-900009 [cancelled]"]

- question: "06:55:Q1"
  story: >
    Cosmetics packaging rules: France needs Triman and Info-tri, French only, penalty 30000 (strictest); Germany needs material
    identification codes and German text (English allowed in addition); Italy needs CONAI environmental label with Italian
    instructions. Easy to miss: Info-tri per component in France, material code per component and licence registration in
    Germany, Italian collection instructions in Italy.
  checks:
    - tool: get_recycling_label_rules_by_country
      args: {country: "FR,DE,IT", product_category: cosmetics}
      expect: ["Triman logo", "CONAI", "Info-tri", "French only", "German mandatory", "Italian mandatory"]
    - tool: draft_artwork_compliance_checklist
      args: {country: "FR,DE,IT", product_category: cosmetics}
      expect: ["Legal marks: Triman logo", "Easy to miss", "CONAI", "Sign-off"]

- question: "06:55:Q3"
  story: >
    New product SKU-100091 options: rigid box (rigid plastic, 20% recyclable, poor, 15% recycled, not recyclable in kerbside
    streams) versus flexible pouch (recycled mono-material PE, 95% recyclable, excellent, 100% recycled).
  checks:
    - tool: get_recyclability_assessment_for_pack
      args: {sku: SKU-100091, pack_type: rigid_box}
      expect: ["20", "poor", "foam insert"]
    - tool: get_recyclability_assessment_for_pack
      args: {sku: SKU-100091, pack_type: flexible_pouch}
      expect: ["95", "excellent", "100"]
