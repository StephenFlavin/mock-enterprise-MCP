# One entry per question row that uses this system's tools (see: python -m mockmcp brief packaging_epr).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:21:Q4"
  story: >
    Reverse logistics asks about EPR rules on returned goods in Germany, France and Netherlands.
    Registrations show active schemes (DSD in Germany, La Poubelle Verte in France, Nedvang in Netherlands).
    Reporting obligations show requirements: Germany annual, France annual, Netherlands annual reporting.
  checks:
    - tool: get_epr_registrations_by_country
      args: {country: DE}
      expect: ["DSD (Germany)", "active", "DE-WZ-2024-001"]
    - tool: get_epr_registrations_by_country
      args: {country: FR}
      expect: ["La Poubelle Verte (France)", "active", "FR-LPV-2024-089"]
    - tool: get_epr_registrations_by_country
      args: {country: NL}
      expect: ["Nedvang (Netherlands)", "active", "NL-NDV-2024-045"]
    - tool: list_epr_reporting_obligations
      args: {country: DE, category: packaging}
      expect: ["annual", "50000"]
    - tool: list_epr_reporting_obligations
      args: {country: FR, category: packaging}
      expect: ["annual", "60000"]

- question: "04:40:Q1"
  story: >
    Packaging buyer compares corrugated, moulded pulp and recycled plastic for small-appliance packaging (PF-220).
    Recycled content and recyclability show corrugated 42% recycled content vs 50% target;
    flexible plastic only 18% vs 45% target. Recyclability: corrugated 95% excellent,
    flexible plastic 60% fair. Targets show corrugated status, flexible_plastic status.
  checks:
    - tool: get_recycled_content_and_recyclability
      args: {sku: PF-220}
      expect: ["PF-220", "corrugated", "42"]
    - tool: get_recycled_content_and_recyclability
      args: {sku: PF-220}
      expect: ["flexible_plastic", "18"]
    - tool: get_recyclability_assessment_for_pack
      args: {sku: PF-220, pack_type: rigid_box}
      expect: ["95", "excellent"]
    - tool: get_recyclability_assessment_for_pack
      args: {sku: PF-220, pack_type: flexible_pouch}
      expect: ["60", "fair"]

- question: "04:40:Q2"
  story: >
    Packaging buyer asks about EPR fees and plastic taxes UK, France, Germany, Spain.
    Germany DSD plastic 480/tonne, France LPV plastic 520/tonne.
    Regulations show plastic tax: UK 10%, France 20%, Germany 0%.
    Recycled content mandates: Germany 30%, France 25%, Spain 30%.
  checks:
    - tool: search_packaging_regulations_by_country
      args: {country: DE}
      expect: ["Packaging Act (VerpackG)", "30", "0"]
    - tool: search_packaging_regulations_by_country
      args: {country: FR}
      expect: ["AGEC Law", "25", "20"]
    - tool: search_packaging_regulations_by_country
      args: {country: GB}
      expect: ["UK Plastic Tax", "10"]
    - tool: get_epr_fee_rates
      args: {country: DE, material: plastic}
      expect: ["480", "DSD"]
    - tool: get_epr_fee_rates
      args: {country: FR, material: plastic}
      expect: ["520", "La Poubelle Verte"]
    - tool: calculate_epr_cost_by_country
      args: {country: DE, volume_tonnes: 500, material: plastic}
      expect: ["480", "DE", "240000"]

- question: "04:40:Q5"
  story: >
    Packaging buyer checks targets. Data shows packaging targets with various statuses.
    Some targets are on_track or at_risk. Shows catch-up options to close gaps.
  checks:
    - tool: get_packaging_targets_and_progress
      args: {sku: PF-220}
      expect: ["PF-220", "38", "50"]
    - tool: get_packaging_targets_and_progress
      args: {sku: K-1700}
      expect: ["K-1700", "25"]
    - tool: get_recycled_content_and_recyclability
      args: {sku: PF-220}
      expect: ["corrugated", "42"]
    - tool: calculate_catch_up_options
      args: {sku: PF-220, metric: recycled_content_pct}
      expect: ["PF-220", "recycled_content_pct"]

- question: "05:49:Q6"
  story: >
    Circular economy lead works on textiles EPR for UK, France, Netherlands.
    Registrations show active in France, suspended in Netherlands (confirming out of scope).
    Fee schedules show costs by country. Obligations show data requirements.
    Prep tasks created for France, Netherlands ones to be cancelled.
  checks:
    - tool: search_epr_scheme_fee_schedules
      args: {scheme_name: La Poubelle Verte, country: FR}
      expect: ["La Poubelle Verte", "FR"]
    - tool: get_epr_reporting_requirements
      args: {country: FR}
      expect: ["FR", "textiles"]
    - tool: get_epr_registrations_by_country
      args: {country: NL}
      expect: ["suspended"]
    - tool: list_epr_reporting_obligations
      args: {country: FR, category: textiles}
      expect: ["textiles", "FR"]

- question: "06:55:Q1"
  story: >
    Packaging designer needs cosmetics labelling rules for France, Germany, Italy.
    France: requires French language, material markings true, disposal instructions true.
    Germany: German and English permitted, material markings true.
    Italy: Italian required, material markings true.
  checks:
    - tool: get_recycling_label_rules_by_country
      args: {country: FR, product_category: cosmetics}
      expect: ["FR", "cosmetics", "FR; EN"]
    - tool: get_recycling_label_rules_by_country
      args: {country: DE, product_category: cosmetics}
      expect: ["DE", "cosmetics", "German"]
    - tool: get_recycling_label_rules_by_country
      args: {country: IT, product_category: cosmetics}
      expect: ["IT", "cosmetics", "Italian"]

- question: "06:55:Q3"
  story: >
    Packaging designer compares rigid box vs flexible pouch for new product.
    Rigid box (PF-220): recyclability 95%, recycled content 42%, rating excellent.
    Flexible pouch (PF-220): recyclability 60%, recycled content 18%, rating fair, multi-layer issue.
    Rigid box is better for recyclability and sustainability.
  checks:
    - tool: get_recyclability_assessment_for_pack
      args: {sku: PF-220, pack_type: rigid_box}
      expect: ["95", "excellent"]
    - tool: get_recyclability_assessment_for_pack
      args: {sku: PF-220, pack_type: flexible_pouch}
      expect: ["60", "fair"]
    - tool: get_recycled_content_and_recyclability
      args: {sku: PF-220}
      expect: ["corrugated", "42"]
