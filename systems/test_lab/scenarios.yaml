# One entry per question row that uses this system's tools
- question: "04:39:Q6"
  story: >
    Recycled nylon is being evaluated as a virgin polyester replacement. Test results show it meets
    durability requirements with good abrasion cycles. Material test results are available
    for cost and quality comparison.
  checks:
    - tool: get_material_test_results
      args: {material_name: "recycled nylon"}
      expect: ["recycled nylon", "Abrasion"]

- question: "04:40:Q3"
  story: >
    Glass item breakage is up 40%. Drop test results show consistent failures
    in August and September, suggesting packaging design or carrier damage issues.
  checks:
    - tool: get_drop_test_results
      args: {sku: "PF-220"}
      expect: ["test_result_id", "drop test"]

- question: "05:42:Q1"
  story: >
    Multiple bulk lots failed colourfastness to rubbing
    over a period. All failures show failure_mode=colourfastness, indicating common
    root cause from dye house or dye lot process changes.
  checks:
    - tool: search_test_results_by_failure_mode
      args: {failure_mode: "colourfastness"}
      expect: ["colourfastness", "fail"]
    - tool: search_test_results_by_failure_mode
      args: {failure_mode: "colourfastness", test_date: "-180d"}
      expect: ["colourfastness", "test_result_id"]

- question: "05:42:Q2"
  story: >
    A lot passed all tests except zip strength, which measured under spec minimum.
    Test result shows fail status. A retest request is submitted to verify.
  checks:
    - tool: get_lot_test_results
      args: {lot_id: "LOT-000001"}
      expect: ["test_result_id", "Zip"]
    - tool: create_retest_request
      args: {original_result_id: "RES-000001", lot_id: "LOT-000001", reason: "verify quality", test_methods: "TMT-0005"}
      expect: ["RET-", "submitted"]

- question: "05:44:Q1"
  story: >
    Testing cost and lead time for children's water bottle safety requirements (TMT-0014 heavy metals
    test costs £350, leads 14 days). A test request is created for regulatory compliance testing.
  checks:
    - tool: get_testing_cost_and_lead_time
      args: {test_category: "safety"}
      expect: ["TMT-0014", "350", "14"]
    - tool: create_test_request
      args: {test_type: "product", sku: "K-1700", test_methods: "TMT-0014", requested_by: "EMP-000001", priority: "expedited"}
      expect: ["TST-", "submitted"]

- question: "05:44:Q2"
  story: >
    A leather bag failed the chromium VI test (TMT-0013). Full test report details are retrieved
    showing test method, standards, and results for supply chain investigation.
  checks:
    - tool: get_test_report_details
      args: {report_id: "RPT-900001"}
      expect: ["ISO 105", "test_method_name"]

- question: "05:44:Q5"
  story: >
    Smart water bottle with battery needs EU/UK certification. Testing cost and lead time for
    battery certification is retrieved (TMT-0014: £350, 14 days), and test request is created.
  checks:
    - tool: get_testing_cost_and_lead_time
      args: {test_method_id: "TMT-0014"}
      expect: ["350", "14"]
    - tool: create_test_request
      args: {test_type: "product", sku: "K-1700", test_methods: "TMT-0014", requested_by: "EMP-000001"}
      expect: ["TST-", "submitted"]

- question: "06:51:Q4"
  story: >
    Backpack sample failed zip pull strength test in round 1 (RES-900010 passed at 54N, but baseline).
    Sample round comparison shows progression across multiple test runs (SMU-900001: round 1,
    SMU-900002: round 2). Retest is requested for verification.
  checks:
    - tool: get_test_results_for_sample
      args: {sample_id: "SMU-900001"}
      expect: ["RES-900010", "Zip Strength"]
    - tool: compare_test_results_across_sample_rounds
      args: {style_id: "STY-7731"}
      expect: ["round", "pass"]

- question: "06:52:Q4"
  story: >
    Three fabric options need evaluation for new overshirt. Fabric test results include durability,
    shrinkage and other properties. Results show which fabrics meet target specifications.
  checks:
    - tool: get_fabric_test_results
      args: {sku: "K-1700"}
      expect: ["test_result_id", "pass"]

- question: "06:53:Q3"
  story: >
    Technical jacket sample (SMU-900005) misses spec on seam strength (35N vs 40N spec) and water resistance.
    Sample test results show both failures. Test method details for seam strength (TMT-0006) and
    construction comparison reveal possible design fixes.
  checks:
    - tool: get_sample_test_results
      args: {sample_id: "SMU-900005"}
      expect: ["RES-900057", "fail", "seam failure"]
    - tool: get_test_method_details
      args: {test_method_id: "TMT-0006"}
      expect: ["Seam Strength", "ASTM D1883"]
    - tool: compare_construction_to_test_requirements
      args: {sample_id: "SMU-900005"}
      expect: ["fail", "Seam Strength"]

- question: "06:53:Q4"
  story: >
    Knit fabric shrinkage must be set for tolerance specification. Test results show fabric shrank
    3.2% in one batch and 2.8% in another, suggesting tolerance of ±3.0% with standard deviation.
  checks:
    - tool: get_shrinkage_test_results_for_fabric
      args: {sku: "K-1700"}
      expect: ["RES-900050", "3.2", "pass"]

- question: "06:55:Q2"
  story: >
    Moulded-pulp trays crack in drop tests. Drop test reports (RES-900030, RES-900031) show
    consistent failures that could be addressed by design changes.
  checks:
    - tool: get_drop_test_reports_for_pack
      args: {}
      expect: ["RES-900030", "drop test"]

- question: "06:55:Q4"
  story: >
    Making carton 10% smaller: drop and crush test results must verify it still passes. Tests show
    baseline K-1700 carton passes both tests (RES-900030, RES-900041, RES-900042).
  checks:
    - tool: get_drop_and_crush_test_results_for_carton
      args: {sku: "K-1700"}
      expect: ["RES-900040", "pass"]

- question: "06:60:Q1"
  story: >
    PFAS-free DWR alternatives evaluation for outerwear. DWR alternative data shows three options:
    SilverFlex 300 (silicone, 75 rating), EcoWater Pro (polyurethane, 70 rating), BioRepel Pure
    (bio-based, 65 rating) with regulatory status and cost per metre.
  checks:
    - tool: get_dwr_alternative_test_data
      args: {pfas_free: true}
      expect: ["SilverFlex 300", "75", "approved"]
    - tool: create_test_request
      args: {test_type: "material", material_name: "silicone DWR", test_methods: "TMT-0008", requested_by: "EMP-000001"}
      expect: ["TST-", "submitted"]

- question: "06:60:Q3"
  story: >
    Trial recycled nylon failed abrasion tests (RES-900071: 22000 cycles, below 25000 spec).
    Test results for material show failures across multiple tests. Comparison to reference
    fabrics (REF-0002: polyester 35000 cycles) shows recycled nylon underperforms.
    Retest with higher cycles is booked.
  checks:
    - tool: get_test_results_for_material
      args: {material_name: "recycled nylon"}
      expect: ["RES-900071", "fail"]
    - tool: compare_material_test_data_to_reference_fabrics
      args: {material_name: "recycled nylon"}
      expect: ["recycled nylon", "abrasion"]
    - tool: create_test_request
      args: {test_type: "material", material_name: "recycled nylon", test_methods: "TMT-0003", requested_by: "EMP-000001"}
      expect: ["TST-", "submitted"]

- question: "06:60:Q5"
  story: >
    Candidate materials (including recycled nylon, organic cotton) need pilot evaluation.
    Standard test plan for polyester (PLN-0001) shows required tests: TMT-0001, TMT-0002, TMT-0003
    with cost £185 and 14 days. Test results show which candidates pass initial screening.
  checks:
    - tool: get_test_results_for_material
      args: {material_name: "recycled nylon"}
      expect: ["recycled nylon", "test_result_id"]
    - tool: get_standard_test_plan_for_material_type
      args: {material_type: "polyester"}
      expect: ["PLN-0001", "TMT-0001", "185"]

- question: "06:60:Q8"
  story: >
    New finish (DWR) tests well in lab but fails in real-world wear trials. Lab test method
    (TMT-0008) shows good results, but wear trial results (WTR-900001) show field performance
    differs from lab. Revised test protocol recommendations are drafted comparing lab conditions
    to actual wear patterns.
  checks:
    - tool: get_lab_test_method_for_finish
      args: {finish_type: "DWR"}
      expect: ["TMT-0008", "DWR"]
    - tool: get_wear_trial_results
      args: {material_name: "recycled nylon"}
      expect: ["WTR-900001", "poor"]
    - tool: compare_lab_test_to_wear_trial_conditions
      args: {material_name: "recycled nylon", wear_trial_id: "WTR-900001"}
      expect: ["lab", "wear"]
    - tool: draft_revised_test_protocol
      args: {material_name: "recycled nylon", wear_trial_id: "WTR-900001"}
      expect: ["Revised protocol", "recommendations"]
