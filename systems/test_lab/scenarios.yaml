# One entry per question row that uses this system's tools
- question: "04:39:Q6"
  story: >
    Lab results compare virgin polyester with recycled polyester (rPET, about 4% lower abrasion, otherwise on par), bio-based PTT (adequate) and lyocell (fails abrasion and pilling).
  checks:
    - tool: get_material_test_results
      args: {material_name: "recycled polyester"}
      expect: ["recycled polyester (rPET)", "33500", "GRS-certified"]
    - tool: get_material_test_results
      args: {material_name: "virgin polyester"}
      expect: ["35000", "520 N"]
    - tool: get_material_test_results
      args: {material_name: "lyocell", pass_fail: fail}
      expect: ["abrasion damage", "pilling"]

- question: "04:40:Q3"
  story: >
    K-1700 glass kettle carton (single-wall corrugated) fails 1.2 m corner and edge drops with glass breakage (3 of 5 tests); SKU-100091 passed in its original corrugated pack and fails since the PKS-900008 change to a thinner recycled plastic pack.
  checks:
    - tool: get_drop_test_results
      args: {sku: "K-1700"}
      expect: ["glass breakage", "RES-900202", "RES-900203", "RES-900204"]
    - tool: get_drop_test_results
      args: {sku: "SKU-100091"}
      expect: ["PKS-900008", "recycled plastic 1.8 mm"]

- question: "05:42:Q1"
  story: >
    Seven pink polyester blouse lots LOT-900009 to LOT-900015 (SKU-100007/14/21, batches BATCH-POL-PINK-001 to 007) failed rubbing fastness at grade 2-3 against grade 4 between mid-August and late September.
  checks:
    - tool: search_test_results_by_failure_mode
      args: {failure_mode: "colourfastness"}
      expect: ["LOT-900009", "LOT-900015", "BATCH-POL-PINK-007", "RPT-900011"]
    - tool: search_test_results_by_failure_mode
      args: {failure_mode: "colourfastness", sku: "SKU-100021"}
      expect: ["LOT-900011", "LOT-900014"]

- question: "05:42:Q2"
  story: >
    Trouser lot LOT-900016 (SKU-100651) passed every lab test except zip strength, 96 N against 100 N (4% under); a retest can be requested against RES-900126.
  checks:
    - tool: get_lot_test_results
      args: {lot_id: "LOT-900016"}
      expect: ["RES-900126", "96 N", "zip strength", "Seam Strength"]
    - tool: create_retest_request
      args: {original_result_id: "RES-900126", lot_id: "LOT-900016", reason: "Confirm zip strength result before disposition", test_methods: "TMT-0005"}
      expect: ["RET-", "LOT-900016"]

- question: "05:44:Q1"
  story: >
    Children's bottle testing (heavy metals, food-contact migration, small parts, lead in coatings, labelling) is priced with lead times; test requests can be booked for SKU-104123, SKU-104795 and SKU-105551.
  checks:
    - tool: get_testing_cost_and_lead_time
      args: {applies_to: "children's bottle"}
      expect: ["Food Contact Migration", "420", "Small Parts", "Labelling and Age Warning Review"]
    - tool: create_test_request
      args: {test_type: "product", sku: "SKU-105551", test_methods: "TMT-0014,TMT-0015,TMT-0016", requested_by: "EMP-00063", notes: "UK EU US AU compliance"}
      expect: ["TST-", "SKU-105551"]

- question: "05:44:Q2"
  story: >
    Report RPT-900021 shows chromium VI 8.4 mg/kg on bag SKU-101813 and 9.1 mg/kg on retained leather from BATCH-LEATHER-002 against the 3.0 limit, while BATCH-LEATHER-001 passed at 2.1 mg/kg.
  checks:
    - tool: get_test_report_details
      args: {report_id: "RPT-900021"}
      expect: ["BATCH-LEATHER-002", "8.4 mg/kg", "9.1 mg/kg", "BATCH-LEATHER-001"]

- question: "05:44:Q5"
  story: >
    Smart bottle (battery, Bluetooth, USB-C) needs battery safety, UN 38.3, radio, EMC and electrical safety tests for UK and EU CE/UKCA; costs and lead times are listed and the testing can be booked for SKU-104809.
  checks:
    - tool: get_testing_cost_and_lead_time
      args: {applies_to: "smart bottle", markets: "UK EU"}
      expect: ["Battery Safety", "UN 38.3", "Radio Equipment", "2400", "28"]
    - tool: create_test_request
      args: {test_type: "product", sku: "SKU-104809", test_methods: "TMT-0019,TMT-0020,TMT-0021,TMT-0022,TMT-0023", requested_by: "EMP-00063", notes: "EU and UK certification"}
      expect: ["TST-", "SKU-104809"]

- question: "06:51:Q4"
  story: >
    Backpack style STY-4012 failed zip pull strength in three sample rounds (SMU-900011, SMU-900012, SMU-900013: 112 N, 118 N, 126 N against 140 N); the zip chain marking never matched the approved zip, so the supplier's claim of reverting does not add up.
  checks:
    - tool: get_test_results_for_sample
      args: {sample_id: "SMU-900013"}
      expect: ["126 N", "zip pull strength", "chain marking identical to round 2"]
    - tool: compare_test_results_across_sample_rounds
      args: {style_id: "STY-4012", test_method_id: "TMT-0005"}
      expect: ["112 N", "118 N", "126 N", "SMU-900011"]

- question: "06:52:Q4"
  story: >
    Overshirt fabric shortlist FAB-900010 brushed cotton twill, FAB-900011 poly-cotton twill and FAB-900012 washed linen: poly-cotton is most durable (70000 cycles), linen is weakest and fails shrinkage, pilling and rubbing.
  checks:
    - tool: get_fabric_test_results
      args: {fabric_id: "FAB-900011"}
      expect: ["70000", "Poly-cotton twill", "680 N"]
    - tool: get_fabric_test_results
      args: {fabric_id: "FAB-900012", pass_fail: fail}
      expect: ["excess shrinkage", "pilling", "colour transfer"]

- question: "06:53:Q3"
  story: >
    Technical jacket STY-7731 first sample SMU-900021 measured seam strength 96 N against 110 N, spray rating 70 against 80 and leaked at 640 mm against 1000 mm; construction notes show standard polyester thread, 10 stitches per inch and untaped shoulder seams.
  checks:
    - tool: get_sample_test_results
      args: {style_id: "STY-7731", round_number: 1}
      expect: ["SMU-900021", "96 N", "640 mm", "Hydrostatic Head"]
    - tool: get_test_method_details
      args: {test_method_id: "TMT-0006"}
      expect: ["Seam Strength", "ISO 13935-2"]
    - tool: compare_construction_to_test_requirements
      args: {sample_id: "SMU-900021"}
      expect: ["not taped", "standard polyester spun thread", "-12.7", "-36"]

- question: "06:53:Q4"
  story: >
    Six shrinkage tests on knit SKU-103808 (grey marl knitwear, factory FAC-0001) show length shrinkage 3.2 to 4.1% (average 3.67%) after three washes.
  checks:
    - tool: get_shrinkage_test_results_for_fabric
      args: {sku: "SKU-103808"}
      expect: ["3.67", "4.1", "RES-900604", "tests_run"]

- question: "06:55:Q2"
  story: >
    Moulded pulp tray PKS-900011 (3.5 mm wall, SKU-100658) cracks at the base corner in 1.2 m drops; a 4.5 mm wall prototype still hairline-cracks while a prototype with four base ribs passes.
  checks:
    - tool: get_drop_test_reports_for_pack
      args: {pack_spec_id: "PKS-900011"}
      expect: ["base corner crack", "4 base ribs", "4.5 mm wall", "RES-900802"]

- question: "06:55:Q4"
  story: >
    Drop and crush test results for package design verification.
  checks:
    - tool: get_drop_and_crush_test_results_for_carton
      args: {sku: "SKU-100070"}
      expect: ["test_result_id"]

