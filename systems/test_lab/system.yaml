id: test_lab
name: Test Lab / LIMS (Laboratory Information Management System)
instructions: >
  Testing and quality validation: material, fabric, sample, lot, pack and product test requests, methods,
  results and reports. Test request ids look like TST-000123. Use it for test scheduling, pass/fail tracking,
  failure mode analysis, and comparative testing.

tables:
  test_requests:
    key: test_request_id
    cols:
      test_request_id: {type: str, desc: "Test request, e.g. TST-000123"}
      test_type: {type: enum, values: [fabric, material, sample, lot, pack, product, other], desc: "What is being tested"}
      sku: {desc: "Product being tested, if applicable"}
      sample_id: {type: str, desc: "Sample identifier if applicable, e.g. SMU-000123"}
      lot_id: {type: str, desc: "Lot/batch identifier if applicable, e.g. LOT-000123"}
      material_name: {type: str, desc: "Material name if testing raw materials"}
      test_methods: {type: str, desc: "Comma-separated test method ids to run, e.g. TMT-0001,TMT-0002"}
      requested_by: {type: str, desc: "Employee who requested"}
      requested_at: {type: timestamp, desc: "Request date and time"}
      target_completion: {type: date, desc: "Expected completion date"}
      lead_time_days: {type: int, desc: "Standard lead time in days"}
      estimated_cost_gbp: {type: float, desc: "Estimated cost in GBP"}
      status: {type: enum, values: [draft, submitted, in_progress, completed, cancelled], desc: Request status}
      priority: {type: enum, values: [standard, expedited], desc: "Standard or expedited"}
      notes: {type: text, desc: "Test notes or special requirements"}
      updated_at: {type: timestamp, desc: "Last updated"}

  test_results:
    key: test_result_id
    cols:
      test_result_id: {type: str, desc: "Test result, e.g. RES-000123"}
      test_request_id: {type: str, desc: "Related test request"}
      test_method_id: {type: str, desc: "Test method used, e.g. TMT-0001"}
      test_method_name: {type: str, desc: "Test method name"}
      sku: {desc: "Product tested"}
      sample_id: {type: str, desc: "Sample identifier if applicable"}
      lot_id: {type: str, desc: "Lot/batch identifier if applicable"}
      material_name: {type: str, desc: "Material name if tested"}
      test_value: {type: str, desc: "Measured value, e.g. 4.2 mm or Pass"}
      spec_min: {type: str, desc: "Specification minimum"}
      spec_max: {type: str, desc: "Specification maximum"}
      spec_value: {type: str, desc: "Target specification value"}
      pass_fail: {type: enum, values: [pass, fail, conditional], desc: "Test result: pass, fail or conditional"}
      failure_mode: {type: str, desc: "Type of failure if failed, e.g. brittleness, poor adhesion"}
      test_date: {type: date, desc: "Date test was performed"}
      tested_by: {type: str, desc: "Lab technician"}
      report_id: {type: str, desc: "Full report reference"}
      notes: {type: text, desc: "Observation notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  test_methods:
    key: test_method_id
    cols:
      test_method_id: {type: str, desc: "Test method code, e.g. TMT-0001"}
      name: {type: str, desc: "Test method name"}
      category: {type: enum, values: [fabric, material, sample, lot, pack, product, finish, safety, performance], desc: Test category}
      standard: {type: str, desc: "Standard reference, e.g. ISO 6954, ASTM D6775"}
      description: {type: text, desc: "Test description and procedure"}
      specimen_size: {type: str, desc: "Specimen size/prep, e.g. 5x5cm"}
      duration_minutes: {type: int, desc: "How long the test takes"}
      lead_time_days: {type: int, desc: "Typical lead time"}
      cost_gbp: {type: float, desc: "Cost per test"}
      applicable_materials: {type: str, desc: "Comma-separated material types, e.g. cotton,polyester,nylon"}
      requires_retest_on_fail: {type: bool, desc: "Should sample be retested if failed"}

  wear_trials:
    key: wear_trial_id
    cols:
      wear_trial_id: {type: str, desc: "Wear trial, e.g. WTR-000123"}
      material_name: {type: str, desc: "Material being tested"}
      finish_type: {type: str, desc: "Finish or treatment, e.g. DWR, enzyme wash"}
      trial_start_date: {type: date, desc: "Trial start date"}
      trial_end_date: {type: date, desc: "Trial end date"}
      trial_environment: {type: str, desc: "Test environment, e.g. field wear, accelerated lab"}
      performance_rating: {type: enum, values: [excellent, good, adequate, poor, failed], desc: Performance assessment}
      key_findings: {type: text, desc: "Key findings from trial"}
      compared_to_lab_method: {type: str, desc: "Lab test method this trial compares to"}
      wear_pattern: {type: str, desc: "Type of wear observed, e.g. pilling, abrasion, fading"}
      updated_at: {type: timestamp, desc: "Last updated"}

  reference_fabrics:
    key: reference_fabric_id
    cols:
      reference_fabric_id: {type: str, desc: "Reference fabric, e.g. REF-000123"}
      reference_name: {type: str, desc: "Name or description"}
      material_composition: {type: str, desc: "Fiber composition, e.g. 100% cotton"}
      construction: {type: str, desc: "Construction detail, e.g. plain weave, jersey"}
      abrasion_cycles: {type: int, desc: "Abrasion cycles at failure"}
      shrinkage_pct: {type: float, desc: "Shrinkage percentage"}
      dwr_spray_rating: {type: float, desc: "Water repellency rating"}
      dwr_wash_durability: {type: int, desc: "Wash cycles before DWR loss"}
      comments: {type: text, desc: "Performance notes"}

  dwr_alternatives:
    key: dwr_alternative_id
    cols:
      dwr_alternative_id: {type: str, desc: "DWR alternative, e.g. DWR-000123"}
      product_name: {type: str, desc: "DWR product name"}
      chemical_base: {type: str, desc: "Chemical type, e.g. fluorocarbon, silicone, polyurethane"}
      pfas_free: {type: bool, desc: "PFAS-free status"}
      spray_rating: {type: float, desc: "Water repellency test rating"}
      wash_durability_cycles: {type: int, desc: "Wash cycles to maintain rating"}
      cost_per_metre: {type: float, desc: "Cost per metre in GBP"}
      availability: {type: enum, values: [limited, available, stock], desc: Availability status}
      supplier_id: {desc: "Supplier providing material"}
      regulatory_status_uk: {type: str, desc: "UK regulatory status"}
      regulatory_status_eu: {type: str, desc: "EU regulatory status"}
      regulatory_status_us: {type: str, desc: "US regulatory status"}
      test_data_available: {type: bool, desc: "Independent test evidence available"}
      comments: {type: text, desc: "Performance and sustainability notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  standard_test_plans:
    key: plan_id
    cols:
      plan_id: {type: str, desc: "Test plan, e.g. PLN-000123"}
      material_type: {type: enum, values: [cotton, polyester, nylon, wool, silk, blended, leather, synthetic], desc: Material type}
      purpose: {type: str, desc: "Purpose, e.g. AW27 trial evaluation, supplier qualification"}
      test_methods: {type: str, desc: "Comma-separated test method ids"}
      pass_fail_criteria: {type: text, desc: "Pass/fail decision criteria"}
      typical_cost_gbp: {type: float, desc: "Typical total cost"}
      typical_duration_days: {type: int, desc: "Typical duration in days"}
      notes: {type: text, desc: "Plan notes"}

  sample_submissions:
    key: sample_id
    cols:
      sample_id: {type: str, desc: "Sample, e.g. SMU-000123"}
      style_id: {desc: "Style being sampled"}
      sku: {desc: "SKU being sampled, if applicable"}
      supplier_id: {desc: "Supplier providing sample"}
      round_number: {type: int, desc: "Sample round number (1st, 2nd, etc.)"}
      submission_date: {type: date, desc: "Date sample was received"}
      status: {type: enum, values: [received, in_testing, testing_complete, rejected, approved], desc: Sample status}
      retest_reason: {type: str, desc: "Reason for retest if applicable"}
      updated_at: {type: timestamp, desc: "Last updated"}

  retest_requests:
    key: retest_id
    cols:
      retest_id: {type: str, desc: "Retest request, e.g. RET-000123"}
      original_result_id: {type: str, desc: "Original test result"}
      sample_id: {type: str, desc: "Sample being retested"}
      lot_id: {type: str, desc: "Lot being retested"}
      reason: {type: str, desc: "Reason for retest"}
      test_methods: {type: str, desc: "Test methods to repeat"}
      requested_at: {type: timestamp, desc: "When retest was requested"}
      target_date: {type: date, desc: "Target completion date"}
      status: {type: enum, values: [submitted, in_progress, completed, cancelled], desc: Retest status}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  # List and search tools for test results
  - name: get_fabric_test_results
    desc: Fabric test results (shrinkage, abrasion, DWR) by SKU, ordered by test date. For comparing fabric quality.
    kind: select
    from: test_results
    filters:
      sku: {desc: "Product SKU"}
      test_method_id: {desc: "Specific test method"}
      pass_fail: {}
      test_date: {col: test_date, op: ">=", type: date, default: "-90d", desc: "Tests on or after"}
    columns: [test_result_id, sku, test_method_name, test_value, spec_min, spec_max, pass_fail, failure_mode, test_date, tested_by]
    order: test_date DESC
    limit: 50
    example: {sku: "PF-220"}

  - name: get_material_test_results
    desc: Material test results for raw materials or trial materials by name. For evaluating material quality and fit.
    kind: select
    from: test_results
    filters:
      material_name: {desc: "Material name"}
      failure_mode: {desc: "Filter by failure type, e.g. brittleness"}
      pass_fail: {}
    columns: [test_result_id, material_name, test_method_name, test_value, spec_min, spec_max, pass_fail, failure_mode, test_date, notes]
    order: test_date DESC
    limit: 50
    example: {material_name: "recycled nylon"}

  - name: get_lot_test_results
    desc: Test results for a specific manufacturing lot with pass/fail status. For lot acceptance decisions.
    kind: sql
    args:
      lot_id: {required: true, desc: "Lot/batch id"}
    sql: |
      SELECT test_result_id, test_method_name, test_value, spec_min, spec_max, pass_fail,
             failure_mode, test_date, tested_by, notes
      FROM test_results
      WHERE lot_id = $lot_id
      ORDER BY test_date DESC
    limit: 30
    example: {lot_id: "LOT-000123"}

  - name: get_sample_test_results
    desc: Test results for a sample round showing pass/fail and any issues found. For sample evaluation.
    kind: select
    from: test_results
    filters:
      sample_id: {required: true, desc: "Sample id"}
    columns: [test_result_id, test_method_name, test_value, spec_min, spec_max, pass_fail, failure_mode, test_date, notes]
    order: test_date DESC
    limit: 30
    example: {sample_id: "SMU-000001"}

  - name: get_test_results_for_material
    desc: All test results for a material across sample rounds showing trends and failures. For R&D evaluation.
    kind: sql
    args:
      material_name: {required: true, desc: "Material name"}
      failure_mode: {desc: "Filter to specific failure type if provided"}
    sql: |
      SELECT test_result_id, test_method_name, test_value, spec_min, spec_max, pass_fail,
             failure_mode, sample_id, test_date, tested_by, notes
      FROM test_results
      WHERE material_name = $material_name
        AND ($failure_mode IS NULL OR failure_mode = $failure_mode)
      ORDER BY test_date DESC, test_method_id
    limit: 100
    example: {material_name: "recycled nylon"}

  - name: get_test_results_for_sample
    desc: All tests run on a sample submission. For reviewing sample performance across multiple tests.
    kind: select
    from: test_results
    filters:
      sample_id: {required: true, desc: "Sample id"}
    columns: [test_result_id, test_method_name, test_value, pass_fail, failure_mode, test_date, tested_by]
    order: test_date DESC
    limit: 50
    example: {sample_id: "SMU-000001"}

  - name: get_drop_test_results
    desc: Drop test results for packs by SKU. Returns pass/fail and failure details.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
      test_date: {type: date, desc: "Filter to tests on or after", default: "-180d", col: test_date, op: ">="}
    sql: |
      SELECT test_result_id, sku, test_method_name, test_value, pass_fail,
             failure_mode, test_date, notes
      FROM test_results
      WHERE sku = $sku
        AND test_method_id IN ('TMT-0010', 'TMT-0011')
        AND test_date >= CAST($test_date AS DATE)
      ORDER BY test_date DESC
    limit: 30
    example: {sku: "PF-220"}

  - name: get_drop_test_reports_for_pack
    desc: Drop test reports for pack designs showing pass/fail and fracture patterns. For packaging design optimization.
    kind: select
    from: test_results
    filters:
      test_method_name: {op: like, desc: "drop test"}
      pass_fail: {}
      test_date: {col: test_date, op: ">=", type: date, default: "-90d"}
    columns: [test_result_id, sku, test_value, pass_fail, failure_mode, test_date, notes]
    order: test_date DESC
    limit: 50
    example: {}

  - name: get_drop_and_crush_test_results_for_carton
    desc: Drop and crush test results for cartons showing pass/fail by dimension. For carton design changes.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
    sql: |
      SELECT test_result_id, sku, test_method_name, test_value, pass_fail,
             failure_mode, test_date, notes
      FROM test_results
      WHERE sku = $sku
        AND test_method_id IN ('TMT-0010', 'TMT-0011', 'TMT-0012')
      ORDER BY test_date DESC
    limit: 30
    example: {sku: "K-1700"}

  - name: get_shrinkage_test_results_for_fabric
    desc: Shrinkage test results for fabrics by SKU showing percentage shrinkage. For tolerance setting.
    kind: select
    from: test_results
    filters:
      sku: {desc: "Product SKU"}
      test_method_id: {desc: "Filter to shrinkage test"}
    columns: [test_result_id, sku, test_value, spec_min, spec_max, pass_fail, test_date]
    order: test_date DESC
    limit: 30
    example: {sku: "K-1700"}

  - name: get_dwr_alternative_test_data
    desc: Test data for PFAS-free DWR alternatives showing performance ratings and durability. For material evaluation.
    kind: select
    from: dwr_alternatives
    filters:
      pfas_free: {default: true}
      chemical_base: {}
    columns: [dwr_alternative_id, product_name, chemical_base, spray_rating, wash_durability_cycles, cost_per_metre, regulatory_status_uk, regulatory_status_eu, regulatory_status_us, test_data_available]
    order: spray_rating DESC
    limit: 30
    example: {pfas_free: true}

  - name: get_test_method_details
    desc: Description, standards and procedures for a specific test method. For understanding test requirements.
    kind: select
    from: test_methods
    filters:
      test_method_id: {required: true}
    columns: [test_method_id, name, category, standard, description, specimen_size, duration_minutes, lead_time_days, cost_gbp]
    order: test_method_id
    limit: 1
    example: {test_method_id: "TMT-0006"}

  - name: get_lab_test_method_for_finish
    desc: Test method and procedure for a finish type (e.g. DWR wash durability test). For lab validation.
    kind: sql
    args:
      finish_type: {required: true, desc: "Finish type, e.g. DWR, enzyme wash"}
    sql: |
      SELECT test_method_id, name, category, standard, description, specimen_size,
             duration_minutes, cost_gbp
      FROM test_methods
      WHERE applicable_materials LIKE '%' || $finish_type || '%'
         OR name LIKE '%' || $finish_type || '%'
      ORDER BY test_method_id
    limit: 10
    example: {finish_type: "DWR"}

  - name: get_wear_trial_results
    desc: Wear trial results for a material showing field performance vs lab testing. For real-world validation.
    kind: select
    from: wear_trials
    filters:
      material_name: {required: true}
    columns: [wear_trial_id, material_name, finish_type, trial_start_date, trial_end_date, performance_rating, wear_pattern, compared_to_lab_method, key_findings]
    order: trial_end_date DESC
    limit: 20
    example: {material_name: "recycled nylon"}

  - name: get_standard_test_plan_for_material_type
    desc: Standard test plan for a material type with methods, cost and timeline. For pilot planning.
    kind: select
    from: standard_test_plans
    filters:
      material_type: {required: true}
    columns: [plan_id, material_type, purpose, test_methods, pass_fail_criteria, typical_cost_gbp, typical_duration_days]
    order: plan_id
    limit: 10
    example: {material_type: "polyester"}

  - name: get_test_report_details
    desc: Full test report with methodology, results and conclusions for a test. For compliance and traceability.
    kind: sql
    args:
      report_id: {required: true, desc: "Report id"}
    sql: |
      SELECT t.test_result_id, t.test_method_name, t.sku, t.lot_id, t.sample_id,
             t.test_value, t.spec_min, t.spec_max, t.pass_fail, t.failure_mode,
             t.test_date, t.tested_by, t.notes, tm.standard, tm.description
      FROM test_results t
      LEFT JOIN test_methods tm ON t.test_method_id = tm.test_method_id
      WHERE t.report_id = $report_id
      ORDER BY t.test_date DESC
    limit: 50
    example: {report_id: "RPT-900001"}

  - name: get_testing_cost_and_lead_time
    desc: Cost and lead time for test methods. For budget planning and timeline estimation.
    kind: sql
    args:
      test_method_id: {desc: "Specific test method, or leave blank for all"}
      test_category: {type: enum, values: [fabric, material, sample, lot, pack, product, finish, safety, performance], desc: "Test category"}
    sql: |
      SELECT test_method_id, name, category, standard, cost_gbp, lead_time_days
      FROM test_methods
      WHERE ($test_method_id IS NULL OR test_method_id = $test_method_id)
        AND ($test_category IS NULL OR category = $test_category)
      ORDER BY category, cost_gbp DESC
    limit: 50
    example: {test_category: "fabric"}

  - name: search_test_results_by_failure_mode
    desc: Test results by failure type (e.g. colourfastness, brittleness) across all tests. For root cause analysis.
    kind: sql
    args:
      failure_mode: {required: true, desc: "Failure type, e.g. colourfastness, brittleness"}
      test_date: {type: date, desc: "Tests on or after", default: "-180d", col: test_date, op: ">="}
    sql: |
      SELECT test_result_id, sku, sample_id, lot_id, test_method_name,
             test_value, pass_fail, failure_mode, test_date, tested_by, notes
      FROM test_results
      WHERE pass_fail = 'fail'
        AND failure_mode LIKE '%' || $failure_mode || '%'
        AND test_date >= CAST($test_date AS DATE)
      ORDER BY test_date DESC, sku
    limit: 100
    example: {failure_mode: "colourfastness"}

  # Comparison and analysis tools
  - name: compare_test_results_across_sample_rounds
    desc: Test results progression across sample rounds showing improvements or persistent issues. For sample evaluation.
    kind: sql
    args:
      style_id: {required: true, desc: "Style id"}
      test_method_id: {desc: "Specific test method to compare"}
    sql: |
      SELECT s.round_number, t.test_method_name, t.test_value, t.pass_fail,
             t.failure_mode, t.test_date, t.tested_by, count(*) AS tests_in_round
      FROM test_results t
      JOIN sample_submissions s ON t.sample_id = s.sample_id
      WHERE s.style_id = $style_id
        AND ($test_method_id IS NULL OR t.test_method_id = $test_method_id)
      GROUP BY s.round_number, t.test_method_name, t.test_value, t.pass_fail, t.failure_mode, t.test_date, t.tested_by
      ORDER BY s.round_number ASC, t.test_date DESC
    limit: 50
    example: {style_id: "STY-5520"}

  - name: compare_construction_to_test_requirements
    desc: Compare sample construction notes to test spec requirements and actual results. For identifying design gaps.
    kind: sql
    args:
      sample_id: {required: true, desc: "Sample id"}
    sql: |
      SELECT t.test_result_id, t.test_method_name, t.spec_value, t.test_value,
             t.pass_fail, t.failure_mode, tm.description, t.notes
      FROM test_results t
      JOIN test_methods tm ON t.test_method_id = tm.test_method_id
      WHERE t.sample_id = $sample_id
      ORDER BY t.test_date DESC
    limit: 30
    example: {sample_id: "SMU-000001"}

  - name: compare_material_test_data_to_reference_fabrics
    desc: Compare material test data to reference fabric benchmarks. For durability and sustainability assessment.
    kind: sql
    args:
      material_name: {required: true, desc: "Material name"}
      test_method_id: {desc: "Specific test to compare"}
    sql: |
      SELECT t.test_result_id, t.material_name, t.test_method_name, t.test_value,
             r.reference_name, r.abrasion_cycles, r.shrinkage_pct, r.dwr_spray_rating,
             'Compare: material value vs reference benchmark' AS comparison_note
      FROM test_results t
      LEFT JOIN reference_fabrics r ON TRUE
      WHERE t.material_name = $material_name
        AND ($test_method_id IS NULL OR t.test_method_id = $test_method_id)
      ORDER BY t.test_date DESC
    limit: 50
    example: {material_name: "recycled nylon"}

  - name: compare_lab_test_to_wear_trial_conditions
    desc: Compare lab test method and conditions to real-world wear trial results and findings. For test correlation.
    kind: sql
    args:
      material_name: {required: true, desc: "Material name"}
      wear_trial_id: {desc: "Specific wear trial to compare"}
    sql: |
      SELECT t.test_result_id, t.test_method_name, t.test_value, t.pass_fail,
             w.wear_trial_id, w.trial_environment, w.performance_rating, w.wear_pattern, w.key_findings,
             tm.description, tm.standard
      FROM test_results t
      LEFT JOIN wear_trials w ON t.material_name = w.material_name
      JOIN test_methods tm ON t.test_method_id = tm.test_method_id
      WHERE t.material_name = $material_name
        AND ($wear_trial_id IS NULL OR w.wear_trial_id = $wear_trial_id)
      ORDER BY t.test_date DESC, w.trial_end_date DESC
    limit: 50
    example: {material_name: "recycled nylon"}

  # Write tools
  - name: create_test_request
    desc: Book a test with the lab for a sample, material, lot or product. Returns new test request.
    kind: insert
    table: test_requests
    id_prefix: TST-
    defaults: {status: submitted, priority: standard}
    args:
      test_type: {required: true, desc: "What to test: fabric, material, sample, lot, pack, product"}
      sku: {desc: "Product SKU if testing a product"}
      lot_id: {desc: "Lot id if testing a lot"}
      material_name: {desc: "Material name if testing raw material"}
      test_methods: {required: true, desc: "Comma-separated test method ids, e.g. TMT-0001,TMT-0003"}
      requested_by: {desc: "Employee requesting test"}
      target_completion: {type: date, desc: "Desired completion date"}
      priority: {type: enum, values: [standard, expedited], desc: "Standard or expedited"}
    example: {test_type: "lot", lot_id: "LOT-000010", test_methods: "TMT-0001", requested_by: "EMP-000001"}

  - name: create_retest_request
    desc: Request retesting of a lot due to failure. Tracks retest reason and status.
    kind: insert
    table: retest_requests
    id_prefix: RET-
    defaults: {status: submitted}
    args:
      original_result_id: {required: true, desc: "Original failing test result"}
      lot_id: {desc: "Lot being retested"}
      reason: {required: true, desc: "Reason for retest, e.g. suspected false positive"}
      test_methods: {required: true, desc: "Test methods to repeat"}
      target_date: {type: date, desc: "Desired retest completion date"}
    example: {original_result_id: "RES-000123", lot_id: "LOT-000123", reason: "suspected calibration error", test_methods: "TMT-0001"}

  # Draft/report tool
  - name: draft_revised_test_protocol
    desc: Draft revised test protocol based on lab method analysis. Returns recommendations for test changes.
    kind: sql
    args:
      material_name: {required: true, desc: "Material being evaluated"}
      current_test_method: {desc: "Current test method id"}
      wear_trial_id: {desc: "Wear trial to compare against"}
    sql: |
      SELECT tm.test_method_id, tm.name, tm.description, tm.standard,
             w.wear_trial_id, w.trial_environment, w.performance_rating, w.wear_pattern,
             'Revised protocol should: 1) Increase test duration to match field conditions, ' ||
             '2) Use same environmental controls as wear trial, ' ||
             '3) Validate against real-world failure patterns' AS recommendations
      FROM test_methods tm
      LEFT JOIN wear_trials w ON $wear_trial_id IS NOT NULL AND w.wear_trial_id = $wear_trial_id
      WHERE tm.applicable_materials LIKE '%' || $material_name || '%'
      ORDER BY tm.test_method_id
    limit: 10
    example: {material_name: "nylon", wear_trial_id: "WTR-000001"}
