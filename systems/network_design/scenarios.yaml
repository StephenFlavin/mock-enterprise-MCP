# One entry per question row that uses network_design tools (python -m mockmcp brief network_design).
# Network scenarios: NS-000001 current network (DC1 Northampton, DC2 Daventry, DC3 Leeds), NS-000002 second owned Midlands DC,
# NS-000003 third-party partner DC, NS-000004 close DC2 and consolidate, NS-000005..8 inbound sourcing origins.

- question: "03:31:Q1"
  story: >
    Baseline NS-000001 (current network, 31.9m a year) vs second owned Midlands DC NS-000002 (32.7m a year, 6.5m setup, stores 1.8 days,
    redundancy 70) vs partner DC NS-000003 (31.5m, 1.4m setup). The owned DC only breaks even against the baseline at about 9.09m units
    a year, falling to about 5.65m units when e-commerce reaches 40%, because its transport cost rises less with e-commerce share.
    A 15% rent rise adds about 4.1m over five years to the owned DC.
  checks:
    - tool: get_network_baseline_costs
      args: {}
      expect: ["31906025", "16596000", "Northampton DC"]
    - tool: run_network_scenario
      args: {}
      expect: ["NS-000002", "32692575", "31517600", "1.8"]
    - tool: calculate_network_total_cost
      args: {scenario_id: NS-000002, years: 5, rent_increase_pct: 15}
      expect: ["174087875", "33517575"]
    - tool: calculate_break_even_volume
      args: {baseline_scenario_id: NS-000001, alternative_scenario_id: NS-000002}
      expect: ["9086655"]
    - tool: calculate_break_even_volume
      args: {baseline_scenario_id: NS-000001, alternative_scenario_id: NS-000002, ecommerce_share_pct: 40}
      expect: ["5654895"]
    - tool: get_store_and_customer_delivery_volumes
      args: {region: UK North}
      expect: ["ecommerce", "stores", "UK North"]

- question: "03:31:Q2"
  story: >
    Last 12 months about 4.99m units, 22% e-commerce growing about 15% a year. At 5% growth to 2030 the network ships about 6.06m units;
    with e-commerce at 40% of volume instead of today's share, e-commerce rises from about 1.33m to about 2.43m units. The growth plan
    includes an EU new market (Poland and Czechia) in 2028 and the share forecast reaches 40% e-commerce in 2030.
  checks:
    - tool: get_volume_history_by_region_and_channel
      args: {months: 24}
      expect: ["UK South", "ecommerce", "last 12 months"]
    - tool: get_long_term_growth_plan
      args: {year: 2030}
      expect: ["Poland and Czechia", "23.9", "Strategic plan"]
    - tool: get_ecommerce_share_forecast
      args: {}
      expect: ["EF-000017", "40"]
    - tool: run_network_volume_forecast
      args: {growth_rate_pct: 5, ecommerce_penetration_pct: 40, target_year: 2030}
      expect: ["6064466", "2425786"]
    - tool: run_network_volume_forecast
      args: {growth_rate_pct: 5, ecommerce_penetration_pct: 22, target_year: 2030}
      expect: ["1334182"]

- question: "03:31:Q3"
  story: >
    Three shortlisted sites: Daventry Gateway Park SC-900001 (rent 1.9m, best labour and transport, lowest planning risk), Corby Enterprise
    Park SC-900002 (cheap, thinner labour, congestion) and Doncaster iPort SC-900003 (highest planning risk, judicial review pending, weakest
    labour). Doncaster is the weakest; removing it records the reason. Coventry was removed earlier and is hidden by default.
  checks:
    - tool: get_site_shortlist
      args: {}
      expect: ["SC-900001", "SC-900002", "SC-900003", "judicial review", "1900000"]
    - tool: get_labour_cost_and_supply_by_region
      args: {region: UK Midlands}
      expect: ["26500", "2800"]
    - tool: remove_site_from_shortlist
      args: {candidate_id: SC-900003, removed_reason: Highest planning risk and weakest labour supply}
      expect: ["removed", "Highest planning risk"]
    - tool: get_site_shortlist
      args: {}
      expect: ["SC-900001", "SC-900002"]

- question: "03:31:Q4"
  story: >
    Top three inefficiencies by annual saving: cross-shipping INE-900001 (260k saving, 150k fix), split orders INE-900002 (190k, 120k)
    and long haul INE-900003 (175k, 640k fix, low confidence). Together 910k to fix for 625k a year, 72% of the saving coming from
    inventory placement and 28% from site location. Underused DC3 and smaller items rank below.
  checks:
    - tool: calculate_inefficiency_fix_cost
      args: {top_n: 3}
      expect: ["INE-900001", "INE-900003", "910000", "625000", "72"]
    - tool: calculate_inefficiency_fix_cost
      args: {top_n: 5, ineff_type: underutilised}
      expect: ["INE-900004", "DC3", "site_location"]

- question: "03:31:Q5"
  story: >
    Consolidation NS-000004 closes DC2 (Daventry, 3,200 units a day) into DC1 and DC3: cost 29.25m vs 31.91m (2.65m saving, 2.8m one-off,
    payback 1.1 years) but store delivery goes from 2.2 to 2.5 days, redundancy falls 55 to 38 and peak (+25%) needs 17,125 units a day
    against 15,200 capacity (shortfall 1,925).
  checks:
    - tool: get_dc_cost_and_volume_profile
      args: {}
      expect: ["DC2", "3200", "4500", "71.1"]
    - tool: run_network_scenario
      args: {scenario_id: NS-000004}
      expect: ["29253115", "consolidation"]
    - tool: calculate_redundancy_cost
      args: {scenario_id: NS-000004, target_redundancy_score: 55}
      expect: ["817564", "139084"]
    - tool: calculate_service_impact
      args: {scenario_id: NS-000004}
      expect: ["worsens", "0.3"]
    - tool: calculate_peak_capacity_risk
      args: {scenario_id: NS-000004, peak_volume_uplift_pct: 25}
      expect: ["1925", "17125", "15200"]
    - tool: draft_business_case
      args: {scenario_id: NS-000004}
      expect: ["Daventry DC", "2,652,910", "1.1 years", "shortfall of 1,925"]

- question: "03:31:Q6"
  story: >
    DC1 Northampton carries 8,000 of 13,700 units a day; DC2 and DC3 have only 2,300 units a day spare, so a two-week DC1 outage leaves
    5,700 units a day (41.6% of volume, 79,800 units) unserved, costing about 848k; 75,810 units of buffer stock (95% target) or
    about 5,400 units a day of extra capacity would cover it. DC2 or DC3 outages are fully absorbed, so DC1 is the single point of failure.
  checks:
    - tool: run_dc_outage_scenario
      args: {down_site: DC1, outage_days: 14}
      expect: ["79800", "41.6", "848260"]
    - tool: calculate_dc_outage_service_impact
      args: {down_site: DC1, outage_days: 14}
      expect: ["36983", "41.6"]
    - tool: get_alternative_dc_capacity
      args: {excluding_site: DC1}
      expect: ["1300", "1000", "2300", "5700"]
    - tool: calculate_buffer_stock_requirement
      args: {down_site: DC1, outage_days: 14, target_service_pct: 95}
      expect: ["75810", "1061340"]
    - tool: run_dc_outage_scenario
      args: {down_site: DC2, outage_days: 14}
      expect: ["unserved_units_day: 0"]

- question: "04:33:Q6"
  story: >
    Sourcing scenarios: today southern China is 38 days lead time (NS-000005). Vietnam and Cambodia NS-000006 is 43 days and +5.5% unit
    cost, India and Bangladesh NS-000007 47 days and +3.2%, nearshore Turkey and Portugal NS-000008 14 days but +12.5%.
  checks:
    - tool: run_network_scenario
      args: {scenario_type: sourcing_shift}
      expect: ["NS-000006", "43", "5.5", "NS-000008", "12.5", "47"]
    - tool: run_network_scenario
      args: {scenario_id: NS-000005}
      expect: ["Southern China", "38"]

- question: "06:51:Q5"
  story: >
    Generic break-even mode: 250,000 of fixed tooling at a 7.00 contribution per unit (18.00 price, 11.00 variable cost) breaks even at
    35,715 units. Network scenario mode also works (NS-000001 vs NS-000003).
  checks:
    - tool: calculate_break_even_volume
      args: {fixed_cost_gbp: 250000, unit_price_gbp: 18, unit_variable_cost_gbp: 11}
      expect: ["35715", "7"]
    - tool: calculate_break_even_volume
      args: {baseline_scenario_id: NS-000001, alternative_scenario_id: NS-000003}
      expect: ["4488249"]

- question: "07:63:Q3"
  story: >
    Serving northern store ST141 from DC1: direct costs 2.19 a unit in a normal week against 2.54 via the Leeds cross-dock (which carries
    a 9,000 weekly fixed cost); at peak direct rises to 2.82 and the cross-dock to 2.65, so the cross-dock wins at peak, breaking even at
    about 27,100 units a week.
  checks:
    - tool: calculate_network_cost_comparison
      args: {origin_site: DC1, dest_site: ST141}
      expect: ["2.19", "2.54", "2.82", "2.65", "via_cross_dock", "27108"]

- question: "09:87:Q2"
  story: >
    At 10% more volume and 40% e-commerce, network options save against the current network: owned Midlands DC 1.17m a year for 6.5m
    (payback 5.5 years, 18 months, redundancy 70), partner DC 1.41m for 1.4m (6 months), consolidation 2.07m for 2.8m (9 months, redundancy 38).
  checks:
    - tool: run_network_design_scenario
      args: {volume_growth_pct: 10, ecommerce_share_pct: 40}
      expect: ["NS-000002", "1173356", "5.5", "NS-000004", "2073123"]
    - tool: run_network_design_scenario
      args: {scenario_id: NS-000002}
      expect: ["6500000", "18"]

- question: "09:87:Q3"
  story: >
    Losing DC1 for two weeks costs about 848k (41.6% of service impact, 79,800 units unserved, 3% a year chance, expected loss 25k); losing
    DC2 or DC3 costs under 100k because the others absorb it. DC1 hurts most. A blocked lane (60% of DC1 volume) is smaller.
  checks:
    - tool: run_network_disruption_simulation
      args: {}
      expect: ["DC1", "848260", "41.6", "25448", "DC3"]
    - tool: run_network_disruption_simulation
      args: {failing_node: DC1, lane_blocked: true, duration_days: 7}
      expect: ["lane_blocked", "DC1"]
