# Network Design scenarios: one entry per question row using network_design tools
# Questions from: python -m mockmcp brief network_design

- question: "03:31:Q1"
  story: >
    Network planner is evaluating expansion: keep single DC at Northampton (NS-900001),
    add second owned DC in Midlands (NS-900002), or hybrid partner approach (NS-900003).
    Compares total cost (handling, transport, rent, labour), delivery times to stores/customers,
    and resilience score over five years.
  checks:
    - tool: get_network_baseline_costs
      args: {site_id: DC1}
      expect: ["DC1", "utilisation_pct", "annual_rent_gbp"]
    - tool: get_store_and_customer_delivery_volumes
      args: {}
      expect: ["stores", "ecommerce"]
    - tool: run_network_scenario
      args: {scenario_id: NS-000001}
      expect: ["Baseline", "DC1", "total_cost_gbp"]
    - tool: run_network_scenario
      args: {scenario_id: NS-000002}
      expect: ["Dual Owned", "1.8", "5200000"]
    - tool: calculate_network_total_cost
      args: {scenario_id: NS-000001, annual_volume_units: 5000000}
      expect: ["cost_per_unit_gbp", "total_network_cost_gbp"]
    - tool: calculate_break_even_volume
      args: {baseline_scenario_id: NS-000001, alternative_scenario_id: NS-000002}
      expect: ["break_even_volume_units"]

- question: "03:31:Q2"
  story: >
    Network planner forecasts 2030 volumes split by region and channel. Baseline growth 5%,
    e-commerce penetration rising from 22% today to 40% by 2030. Tests sensitivity to
    faster e-commerce adoption.
  checks:
    - tool: get_volume_history_by_region_and_channel
      args: {months: 24}
      expect: ["stores", "ecommerce", "UK South"]
    - tool: get_long_term_growth_plan
      args: {year: 2030}
      expect: ["2030", "Strategic plan", "2027"]
    - tool: run_network_volume_forecast
      args: {growth_rate_pct: 5.0, ecommerce_penetration_pct: 40}
      expect: ["period", "forecast_units"]
    - tool: get_ecommerce_share_forecast
      args: {}
      expect: ["ecommerce_share_pct", "period"]

- question: "03:31:Q3"
  story: >
    Network planner compares three shortlist sites: Daventry (SC-000001, good labour/transport),
    Leeds (SC-000002, new build opportunity but planning risk), and Coventry (SC-000003, removed
    for capacity reasons). Flags labour supply, transport links and planning risks. Then removes
    the weakest site (Coventry).
  checks:
    - tool: get_site_shortlist
      args: {}
      expect: ["Daventry", "Leeds", "shortlist"]
    - tool: get_labour_cost_and_supply_by_region
      args: {region: "UK Midlands"}
      expect: ["26500", "annual_cost_per_worker_gbp"]
    - tool: remove_site_from_shortlist
      args: {candidate_id: SC-000003, removed_reason: "Lower capacity than Daventry, higher long-term cost."}
      expect: ["removed"]

- question: "03:31:Q4"
  story: >
    Network planner identifies cross-shipping (DC1→DC2, 120k units/year, £85k saving),
    split orders (DC1→ST105, 85k units, £52k saving), and long-haul (DC1→ST245, 65k units, £68k saving).
    Top three inefficiencies ranked by priority. Cost to fix top three: £395k investment, £205k annual saving.
  checks:
    - tool: calculate_inefficiency_fix_cost
      args: {top_n: 3}
      expect: ["cross_ship", "payback", "priority"]
    - tool: calculate_inefficiency_fix_cost
      args: {top_n: 1}
      expect: ["priority_rank", "cost"]

- question: "03:31:Q5"
  story: >
    Business case for consolidating to single DC: retain Northampton (DC1) as primary,
    close southern DC (if any exist). Analyzes redundancy cost (dual-source buffer stock),
    transport impact, service level change. Resilience risk flagged.
  checks:
    - tool: get_dc_cost_and_volume_profile
      args: {}
      expect: ["DC1", "utilisation_pct", "region"]
    - tool: run_network_scenario
      args: {scenario_id: NS-000001}
      expect: ["Baseline", "total_cost_gbp", "scenario_type"]
    - tool: calculate_redundancy_cost
      args: {scenario_id: NS-000001, target_redundancy_score: 80}
      expect: ["one_time_investment", "annual_cost"]
    - tool: calculate_service_impact
      args: {scenario_id: NS-000002, current_avg_days: 2.5}
      expect: ["scenario_name", "impact"]
    - tool: calculate_peak_capacity_risk
      args: {scenario_id: NS-000001, peak_volume_uplift_pct: 30}
      expect: ["scenario_id", "recommendation"]
    - tool: draft_business_case
      args: {scenario_id: NS-000001}
      expect: ["EXECUTIVE SUMMARY", "FINANCIAL IMPACT", "Northampton"]

- question: "03:31:Q6"
  story: >
    DC1 outage scenario: primary DC offline for two weeks. Query resilience:
    which DC is single point of failure? What's the service impact? How much buffer stock
    is needed? What capacity exists at alternatives?
  checks:
    - tool: run_dc_outage_scenario
      args: {down_site: DC1, outage_days: 14}
      expect: ["outage_days", "service_impact_pct", "cost_of_mitigation"]
    - tool: calculate_dc_outage_service_impact
      args: {down_site: DC1, outage_days: 14}
      expect: ["orders_at_risk", "service_level_impact"]
    - tool: get_alternative_dc_capacity
      args: {excluding_site: DC1, required_units: 3000}
      expect: ["spare_capacity"]
    - tool: calculate_buffer_stock_requirement
      args: {down_site: DC1, outage_days: 14, target_service_pct: 95}
      expect: ["buffer_inventory_units", "holding_cost"]

- question: "04:33:Q6"
  story: >
    Sourcing manager models tariff impact on China sourcing. Runs network scenario
    comparing current vs diversified supply scenario to assess landed cost and lead time impact.
  checks:
    - tool: run_network_scenario
      args: {scenario_id: NS-900002}
      expect: ["scenario_type", "total_cost_gbp"]

- question: "06:51:Q5"
  story: >
    New product developer calculates unit cost and margin at 20k, 50k, 100k volumes.
    Uses break-even volume to determine minimum viable volume for profitability.
  checks:
    - tool: calculate_break_even_volume
      args: {baseline_scenario_id: NS-900001, alternative_scenario_id: NS-900003}
      expect: ["break_even_volume_units"]

- question: "07:63:Q3"
  story: >
    Supply chain finance analyst compares: serving northern stores direct from main DC vs
    via cross-dock hub. Analyzes handling cost, transport, and inventory holding at different volumes.
  checks:
    - tool: calculate_network_cost_comparison
      args: {origin_site: DC1, dest_site: ST001}
      expect: ["direct_from_dc_gbp_per_unit", "via_cross_dock", "cheapest"]

- question: "09:87:Q2"
  story: >
    Chief supply chain officer evaluates top investments over 3 years within £80m envelope:
    network changes (dual DC scenario NS-900002), automation, nearshoring, dual sourcing, digital planning.
    Tests run_network_design_scenario to show cost/benefit of network expansion scenario.
  checks:
    - tool: run_network_design_scenario
      args: {scenario_id: NS-900002, volume_growth_pct: 10}
      expect: ["total_cost_gbp", "scenario_type"]

- question: "09:87:Q3"
  story: >
    Chief supply chain officer assesses resilience: what happens with major disruption?
    Models loss of DC1 for 14 days, showing impact on cost and service. Compares with alternative
    scenarios and evaluates which investments reduce exposure most.
  checks:
    - tool: run_network_disruption_simulation
      args: {failing_node: DC1, lane_blocked: false}
      expect: ["disruption_type", "volume_at_risk_pct"]
