      args: {clause_id: CLS-007, wording: "Supplier shall not use forced labour and shall comply with the UK Modern Slavery Act, provide traceability of its sub-supplier chain and pay no recruitment fees."}
      expect: ["CLS-007"]
    - tool: compare_clause_library_to_regulations
      args: {topic: forced_labour, jurisdiction: UK}
      expect: ["covered"]

