        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_credit_hold_policy
    desc: Credit hold and shipment stop policy for overdue customers.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'credit_hold'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_due_diligence_policy_obligations
    desc: Internal and legal obligations on allegations, escalation procedures and reporting.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'due_diligence'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_fallback_positions_playbook
    desc: Approved fallback positions by clause for contract negotiations.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'fallback_positions'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_hedging_policy
    desc: Treasury hedging policy and limits for currency and commodity exposure.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'hedging'
