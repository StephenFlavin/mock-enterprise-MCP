    example: {}

  - name: get_incident_response_playbook
    desc: Incident response and escalation procedures for security, quality and supply chain incidents.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'incident_response'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_insurance_requirements_policy
    desc: Insurance requirements for suppliers by risk tier and product type.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'insurance_requirements'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_internal_policy_on_market_entry_structures
    desc: Internal policy on market entry structures (subsidiary vs franchise vs partnership).
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'market_entry'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_inventory_definition_policy
    desc: Policy definition of inventory ownership, status and valuation methods.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'inventory_definition'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_kpi_definition
    desc: Internal definition and calculation of a named KPI. Returns formula and data source.
    kind: sql
    args:
      kpi_name: {required: true, desc: "KPI name, e.g. perfect order rate"}
    sql: |
      SELECT kpi_id, kpi_name, definition, formula, data_source, unit, effective_date
      FROM kpi_definitions
      WHERE LOWER(kpi_name) LIKE '%' || LOWER($kpi_name) || '%'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {kpi_name: perfect order rate}

  - name: get_legal_wording_guidelines
    desc: Legal guidance on admissions and claims wording to avoid liability exposure.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'legal_wording'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_lot_acceptance_policy
    desc: AQL and release policy for lots by product category and defect severity.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'lot_acceptance'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_onboarding_minimum_requirements
    desc: Minimum onboarding requirements by risk tier for new suppliers.
    kind: sql
    args:
      risk_tier: {type: enum, values: [high, medium, low], required: true, desc: "Risk tier"}
    sql: |
      SELECT item_id, policy_id, item_key, item_value, description
      FROM policy_items
      WHERE policy_id IN (SELECT policy_id FROM policies WHERE policy_type = 'onboarding_requirements')
        AND LOWER(item_key) LIKE '%' || LOWER($risk_tier) || '%'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY item_key
    limit: 20
    example: {risk_tier: high}

  - name: get_standard_clause_library
    desc: Standard clause wording for supplier and purchase agreements. Returns all standard clauses.
    kind: select
    from: standard_clauses
    filters: {}
    columns: [clause_id, clause_name, clause_type, wording, effective_date, version]
    order: clause_name
    limit: 100
    example: {}

  - name: compare_clause_library_to_regulations
    desc: Gap analysis comparing standard clauses to regulatory requirements.
    kind: sql
    args: {}
    sql: |
      SELECT clause_id, clause_name, wording, 'regulatory review required' AS gap_assessment
      FROM standard_clauses
      WHERE effective_date <= CAST($as_of AS DATE)
      ORDER BY clause_name
    limit: 50
    example: {}

  - name: draft_claims_review_checklist
    desc: Draft a sustainability claims review checklist based on regulatory and greenwashing risks.
    kind: draft
    args: {}
    sql:
      policies: SELECT policy_id, policy_name, content FROM policies WHERE policy_type = 'claims_review'
    template: |
      SUSTAINABILITY CLAIMS REVIEW CHECKLIST

      This checklist ensures claims comply with UK ASA and EU regulations on greenwashing.

      SUBSTANTIATION CHECKS
      - [ ] Independent third-party evidence obtained (ISO 14040, Product Environmental Footprint)
      - [ ] Data is current (not more than 3 years old)
      - [ ] Sample size is representative (≥5% of production)
      - [ ] Methodology disclosed and comparable to similar products
      - [ ] Comparators named explicitly if used

      WORDING CHECKS
      - [ ] Avoid absolute terms ("100% sustainable", "eco-friendly" without qualification)
      - [ ] Avoid time-based claims without baseline ("20% reduction since...")
      - [ ] Avoid implied certifications not held
      - [ ] Disclose trade-offs (e.g., carbon reduction + water use)
      - [ ] Scope is clear (product, company, supply chain?)

      ENFORCEMENT RISK
      - [ ] Cross-check against recent ASA/CMA/national regulator enforcement
      - [ ] Flag claims similar to recent cases
      - [ ] Legal review required before publication


    example: {}

  - name: get_provisioning_policy
    desc: Current stock provisioning policy for seasonal and slow-moving items.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'provisioning'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_recall_communication_templates
    desc: Approved recall communication templates for customers, stores and regulators.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'recall_communication'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_recall_vs_withdrawal_criteria
    desc: Criteria distinguishing a product recall from a withdrawal under regulations.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'recall_vs_withdrawal'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_reporting_framework_requirements
    desc: Disclosure requirements by framework (TCFD, GRI, CSRD, ISSB).
    kind: sql
    args:
      framework: {type: str, desc: "Reporting framework, e.g. TCFD, GRI, CSRD", required: false}
    sql: |
      SELECT item_id, policy_id, item_key, item_value, description
      FROM policy_items
      WHERE policy_id IN (SELECT policy_id FROM policies WHERE policy_type = 'reporting_frameworks')
        AND ($framework IS NULL OR LOWER(item_key) LIKE '%' || LOWER($framework) || '%')
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY item_key
    limit: 50
    example: {}

  - name: get_responsible_exit_policy
    desc: Responsible exit policy and worker protection steps when exiting a supplier.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'responsible_exit'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: list_kpi_definition_changes
    desc: Change history of KPI definitions and calculation rules for a KPI. Shows what changed and why.
    kind: select
    from: kpi_definition_changes
    filters:
      kpi_id: {}
      changed_at: {op: ">=", default: "-90d", desc: "Change date on or after"}
    columns: [change_id, kpi_id, changed_at, old_definition, new_definition, change_reason]
    order: changed_at
    limit: 20
    example: {kpi_id: KPI-OTIF-001}

  - name: list_programme_lessons_learned
    desc: Internal lessons-learned records from past programmes (ERP, WMS, transformation, etc).
    kind: select
    from: lessons_learned
    filters:
      programme_type: {op: like, desc: "Programme type, e.g. ERP or WMS"}
    columns: [lesson_id, programme_type, lesson_description, recommendation, date_learned]
    order: date_learned
    limit: 50
    example: {programme_type: ERP}

  - name: search_accounting_policy
    desc: Search internal accounting policies and guidance on topics like revenue, inventory and rebates.
    kind: select
    from: knowledge_base_articles
    filters:
      category: {default: accounting}
      title: {op: like, desc: "Search accounting policy by title or keywords"}
    columns: [article_id, title, category, content, created_at]
    order: updated_at
    limit: 20
    example: {category: accounting, title: rebate}

  - name: search_internal_knowledge_base
    desc: Search internal runbooks, test plans and procedures. Used for WMS, vendor issues and technical guidance.
    kind: select
    from: knowledge_base_articles
    filters:
      category: {default: runbook}
      title: {op: like, desc: "Search by title or keywords"}
    columns: [article_id, title, category, content, created_at]
    order: updated_at
    limit: 20
    example: {category: runbook, title: WMS}

  - name: search_knowledge_base
    desc: Searches internal policies and guides by keywords. Broad search across all categories.
    kind: select
    from: knowledge_base_articles
    filters:
      title: {op: like, desc: "Search by title or keywords"}
      status: {default: published}
    columns: [article_id, title, category, content, created_at]
    order: updated_at
    limit: 50
    example: {title: credit hold}

  - name: search_knowledge_base_articles
    desc: Search policies and articles by keyword. Returns published articles with metadata.
    kind: select
    from: knowledge_base_articles
    filters:
      title: {op: like, desc: "Search by title or keywords"}
      status: {default: published}
    columns: [article_id, title, category, content, created_at]
    order: updated_at
    limit: 50
    example: {title: nearshore}

  - name: search_knowledge_base_for_failure_modes
    desc: Search knowledge base for failure modes, root causes and design solutions.
    kind: select
    from: knowledge_base_articles
    filters:
      category: {default: failure_mode}
      title: {op: like, desc: "Search by failure type or keywords"}
    columns: [article_id, title, category, content, created_at]
    order: updated_at
    limit: 20
    example: {category: failure_mode, title: zip}

  - name: search_kpi_definitions
    desc: Internal KPI definitions and calculation methods. Search by name or keywords.
    kind: select
    from: kpi_definitions
    filters:
      kpi_name: {op: like, desc: "Search by KPI name or keywords"}
    columns: [kpi_id, kpi_name, definition, formula, data_source, unit, effective_date]
    order: kpi_name
    limit: 50
    example: {kpi_name: OTIF}

  - name: search_past_reconciliation_notes
    desc: Prior reconciliation write-ups and runbooks. Search for past resolution of similar issues.
    kind: select
    from: knowledge_base_articles
    filters:
      category: {default: reconciliation}
      title: {op: like, desc: "Search by title or keywords"}
    columns: [article_id, title, category, content, created_at]
    order: updated_at
    limit: 20
    example: {category: reconciliation, title: stock}

  - name: search_shrink_control_research
    desc: Searches for shrink control research and effectiveness studies. Store loss prevention methods.
    kind: select
    from: knowledge_base_articles
    filters:
      category: {default: shrink_control}
      title: {op: like, desc: "Search by control type or keywords"}
    columns: [article_id, title, category, content, created_at]
    order: updated_at
    limit: 20
    example: {category: shrink_control, title: tagging}

  - name: update_standard_clause
    desc: Changes the wording of a clause in the standard clause library. Returns old and new wording.
    kind: update
    table: standard_clauses
    set: {wording: "{wording}"}
    args:
      wording: {required: true, desc: "New clause wording"}
    example: {clause_id: CLS-001, wording: "Updated force majeure language..."}
