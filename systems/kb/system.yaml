id: kb
name: Knowledge Base / Policy Library
instructions: >
  Internal policies, guidelines, contract clause library and KPI definitions.
  Knowledge base articles are KB-XXXXX. Use for policies on credit holds, hedging,
  insurance, corrective action, incident response, due diligence, and more.

tables:
  knowledge_base_articles:
    key: article_id
    cols:
      article_id: {type: str, desc: "Article id, e.g. KB-000123"}
      title: {type: str, desc: Article title}
      category: {type: str, desc: "Category, e.g. reconciliation, failure_mode"}
      content: {type: text, desc: Article content and findings}
      status: {type: enum, values: [published, archived], desc: Publication status}
      created_at: {type: timestamp, desc: Creation date}
      updated_at: {type: timestamp, desc: Last updated}

  policies:
    key: policy_id
    cols:
      policy_id: {type: str, desc: "Policy id, e.g. POL-HEDGING-001"}
      policy_type: {type: enum, values: [approval_limits, assurance_requirements, corrective_action, credit_hold, due_diligence, fallback_positions, hedging, incident_response, insurance_requirements, market_entry, inventory_definition, legal_wording, lot_acceptance, onboarding_requirements, provisioning, responsible_exit, recall_communication, recall_vs_withdrawal, reporting_frameworks, supplier_code_of_conduct, claims_review], desc: Type of policy}
      policy_name: {type: str, desc: Policy name}
      content: {type: text, desc: Full policy text or content}
      version: {type: str, desc: "Policy version, e.g. 2.1"}
      effective_date: {type: date, desc: When policy became effective}
      updated_at: {type: timestamp, desc: Last updated}

  policy_items:
    key: item_id
    cols:
      item_id: {type: str, desc: "Item id, e.g. POL-ITEM-000123"}
      policy_id: {type: str, desc: Parent policy}
      item_key: {type: str, desc: "Item key, e.g. risk_tier_high"}
      item_value: {type: str, desc: "Item value or content"}
      description: {type: str, desc: "What this item covers"}
      effective_date: {type: date, desc: When item became effective}
      updated_at: {type: timestamp, desc: Last updated}

  kpi_definitions:
    key: kpi_id
    cols:
      kpi_id: {type: str, desc: "KPI id, e.g. KPI-OTIF-001"}
      kpi_name: {type: str, desc: "KPI name, e.g. perfect order rate"}
      definition: {type: text, desc: Definition of the KPI}
      formula: {type: text, desc: "Calculation formula"}
      data_source: {type: str, desc: "Where the data comes from"}
      unit: {type: str, desc: "Unit of measurement, e.g. percentage, days"}
      effective_date: {type: date, desc: When definition became effective}
      version: {type: str, desc: "Definition version"}

  kpi_definition_changes:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change id, e.g. KPI-CHG-000123"}
      kpi_id: {type: str, desc: KPI being changed}
      changed_at: {type: timestamp, desc: When the change was made}
      old_definition: {type: text, desc: Previous definition}
      new_definition: {type: text, desc: New definition}
      change_reason: {type: str, desc: "Why the definition changed"}

  audit_requirements:
    key: requirement_id
    cols:
      requirement_id: {type: str, desc: "Requirement id, e.g. AUD-REQ-000123"}
      risk_tier: {type: enum, values: [high, medium, low], desc: Supplier risk tier}
      audit_type: {type: str, desc: "Type of audit, e.g. social, quality, financial"}
      frequency: {type: str, desc: "Audit frequency, e.g. annual, triennial"}
      standard: {type: str, desc: "Audit standard, e.g. BSCI, SEDEX"}
      scope: {type: str, desc: "What the audit covers"}

  lessons_learned:
    key: lesson_id
    cols:
      lesson_id: {type: str, desc: "Lesson id, e.g. LES-000123"}
      programme_type: {type: str, desc: "Type of programme, e.g. ERP, WMS, transformation"}
      lesson_description: {type: text, desc: "The lesson learned"}
      recommendation: {type: text, desc: "Recommended action"}
      date_learned: {type: date, desc: "Date lesson was recorded"}

  standard_clauses:
    key: clause_id
    cols:
      clause_id: {type: str, desc: "Clause id, e.g. CLS-000123"}
      clause_name: {type: str, desc: "Clause name, e.g. Force Majeure"}
      clause_type: {type: str, desc: "Type, e.g. supplier_agreement, purchase_order"}
      wording: {type: text, desc: "Standard clause wording"}
      effective_date: {type: date, desc: "When clause became standard"}
      version: {type: str, desc: "Clause version"}

tools:
  - name: create_knowledge_base_article
    desc: Publish a documented cause and fix to the knowledge base. Returns the new article id.
    kind: insert
    table: knowledge_base_articles
    id_prefix: KB-
    defaults: {status: published}
    args:
      title: {required: true, desc: "Article title"}
      category: {required: true, desc: "Category, e.g. reconciliation or failure_mode"}
      content: {required: true, desc: "Article content"}
    example: {title: "ERP-WMS stock reconciliation mismatch", category: reconciliation, content: "Timing differences between ERP cutoff and WMS receipt processing cause £1m+ gaps monthly. Solution: align WMS cutoff to ERP close window."}

  - name: archive_knowledge_base_article
    desc: Archive a superseded article so it no longer appears in search.
    kind: update
    table: knowledge_base_articles
    set: {status: archived}
    example: {article_id: KB-900001}

  - name: get_approval_limits
    desc: Approval limits and delegation of authority for orders and payments.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'approval_limits'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_assurance_requirements
    desc: Assurance standard requirements for disclosures and reporting.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'assurance_requirements'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: list_audit_requirements_by_risk_tier
    desc: Audit requirements by risk tier. Specifies frequency, type and standard.
    kind: select
    from: audit_requirements
    filters:
      risk_tier: {}
      audit_type: {}
    columns: [requirement_id, risk_tier, audit_type, frequency, standard, scope]
    order: risk_tier
    limit: 20
    example: {risk_tier: high}

  - name: get_supplier_code_of_conduct_clauses
    desc: Wage and hours clauses in our supplier code of conduct. Covers minimum wages, overtime rules, working hours.
    kind: sql
    args: {}
    sql: |
      SELECT policy_id, policy_name, content
      FROM policies
      WHERE policy_type = 'supplier_code_of_conduct'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY effective_date DESC
      LIMIT 1
    limit: 1
    example: {}

  - name: get_corrective_action_policy
