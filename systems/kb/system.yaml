    sql: |
      SELECT item_id, policy_id, item_key, item_value, description
      FROM policy_items
      WHERE policy_id IN (SELECT policy_id FROM policies WHERE policy_type = 'onboarding_requirements')
        AND LOWER(item_key) LIKE '%' || LOWER($risk_tier) || '%'
        AND effective_date <= CAST($as_of AS DATE)
      ORDER BY item_key
    limit: 20
    example: {risk_tier: high}

  - name: get_standard_clause_library
    desc: Standard clause wording for supplier, framework and purchase agreements. Optionally filter by keywords or clause type.
    kind: py
    fn: clause_library
    args:
      query: {type: str, desc: "Keywords in clause name or wording, e.g. force majeure or volume"}
      clause_type: {type: str, desc: "Clause type, e.g. supplier_agreement or framework_agreement"}
      limit: {type: int, default: 20, desc: "Max clauses to return"}
    example: {}
  - name: compare_clause_library_to_regulations
    desc: Gap analysis of standard clauses against forced labour, due diligence and product liability law in the UK, EU and US. Shows covered or gap, with penalties.
    kind: sql
    args:
      topic: {type: str, desc: "Optional topic: forced_labour, due_diligence or product_liability"}
      jurisdiction: {type: str, desc: "Optional jurisdiction: UK, EU or US"}
    sql: |
      SELECT r.requirement_id, r.jurisdiction, r.regulation, r.topic, r.requirement,
             c.clause_id, c.clause_name,
             CASE WHEN c.clause_id IS NULL THEN 'GAP: no standard clause'
                  WHEN c.wording ILIKE '%' || r.required_term || '%' THEN 'covered'
                  ELSE 'GAP: wording does not mention ' || r.required_term END AS gap_assessment,
             r.penalty
      FROM regulatory_requirements r
      LEFT JOIN standard_clauses c ON c.clause_id = r.clause_id AND c.effective_date <= CAST($as_of AS DATE)
      WHERE ($topic IS NULL OR r.topic = lower(replace($topic, ' ', '_')))
        AND ($jurisdiction IS NULL OR r.jurisdiction = upper($jurisdiction))
      ORDER BY r.topic, r.jurisdiction, r.requirement_id
    limit: 50
    example: {}

  - name: draft_claims_review_checklist
    desc: Draft a sustainability claims review checklist based on regulatory and greenwashing risks.
    kind: draft
    args: {}
    sql:
      policies: SELECT policy_id, policy_name, content FROM policies WHERE policy_type = 'claims_review'
    template: |
      SUSTAINABILITY CLAIMS REVIEW CHECKLIST

      This checklist ensures claims comply with UK ASA and EU regulations on greenwashing.

      SUBSTANTIATION CHECKS
      - [ ] Independent third-party evidence obtained (ISO 14040, Product Environmental Footprint)
      - [ ] Data is current (not more than 3 years old)
      - [ ] Sample size is representative (≥5% of production)
      - [ ] Methodology disclosed and comparable to similar products
      - [ ] Comparators named explicitly if used

      WORDING CHECKS
      - [ ] Avoid absolute terms ("100% sustainable", "eco-friendly" without qualification)
      - [ ] Avoid time-based claims without baseline ("20% reduction since...")
      - [ ] Avoid implied certifications not held
      - [ ] Disclose trade-offs (e.g., carbon reduction + water use)
      - [ ] Scope is clear (product, company, supply chain?)

      ENFORCEMENT RISK
      - [ ] Cross-check against recent ASA/CMA/national regulator enforcement
      - [ ] Flag claims similar to recent cases
      - [ ] Legal review required before publication


    example: {}

