# Scenarios for Documents stage 1 tools
# One entry per question that uses stage 1 tools

- question: "02:11:Q2"
  story: >
    Transport planner comparing three carriers for northern region drops compares
    staying with current carriers vs moving 40% volume to pallet network.
    Needs draft_negotiation_brief to prepare for pallet network discussion.
  checks:
    - tool: draft_negotiation_brief
      args: {supplier_id: CAR-002, negotiation_type: terms}
      expect: ["NEGOTIATION BRIEF", "LEVERAGE", "MARKET BENCHMARKS"]

- question: "04:32:Q7"
  story: >
    Category buyer preparing annual review negotiation with largest cookware
    supplier drafts negotiation brief covering performance, leverage and strategy.
  checks:
    - tool: draft_negotiation_brief
      args: {supplier_id: SUP-0001, negotiation_type: price}
      expect: ["NEGOTIATION BRIEF", "OUR POSITION", "BATNA"]

- question: "04:35:Q5"
  story: >
    Supplier relationship manager prepares Q3 business review pack for
    Supplier T covering performance trends, SLA compliance and opportunities.
  checks:
    - tool: draft_business_review_pack
      args: {supplier_id: SUP-0042}
      expect: ["BUSINESS REVIEW PACK", "PERFORMANCE SCORECARD", "OPPORTUNITIES"]

- question: "04:35:Q6"
  story: >
    Supplier relationship manager structures joint improvement programme
    with a supplier to cut lead time by 20% over 12 months.
  checks:
    - tool: draft_improvement_programme_plan
      args: {supplier_id: SUP-0001, improvement_goal: "reduce lead time by 20%"}
      expect: ["IMPROVEMENT PROGRAMME PLAN", "INITIATIVES", "BENEFITS"]

- question: "04:38:Q2"
  story: >
    Supplier missed critical delivery. Contract manager needs to draft
    formal breach notice for the supplier about delivery failure.
  checks:
    - tool: draft_breach_notice
      args: {po_id: "PO-2026-004512", breach_type: late_delivery}
      expect: ["FORMAL NOTICE OF BREACH", "BREACH DETAILS", "REQUIRED ACTIONS"]

- question: "04:39:Q1"
  story: >
    Raw materials commodities buyer summarizes current prices and recent
    drivers for cotton, polyester, nylon and leather for the category buyers.
  checks:
    - tool: draft_commodity_summary
      args: {commodity: cotton}
      expect: ["COMMODITY SUMMARY", "CURRENT STATUS", "FORECAST"]

- question: "04:39:Q8"
  story: >
    Raw materials commodities buyer drafts weekly commodity brief for
    the buying team covering price moves, news and recommended actions.
  checks:
    - tool: draft_commodity_brief
      args: {commodity: polyester}
      expect: ["WEEKLY COMMODITY BRIEF", "PRICE SUMMARY", "RECOMMENDED ACTIONS"]

- question: "07:61:Q1"
  story: >
    Financial controller finds operating profit £1.8m below budget for September.
    Needs to decompose variance by driver and draft management accounts commentary
    explaining the gap to the board.
  checks:
    - tool: draft_management_accounts_commentary
      args: {variances_summary: "Operating profit variance"}
      expect: ["MANAGEMENT ACCOUNTS COMMENTARY", "VOLUME VARIANCE", "OUTLOOK"]

- question: "07:62:Q8"
  story: >
    FP&A analyst summarizes the month for leadership team covering performance,
    budget variance, top issues and recommendations in one-pager format.
  checks:
    - tool: draft_leadership_summary
      args: {reporting_period: "September 2026"}
      expect: ["LEADERSHIP SUMMARY", "HEADLINE PERFORMANCE", "TOP 5 ISSUES"]

- question: "07:65:Q2"
  story: >
    AR/credit controller has £480k invoice disputed by wholesale customer.
    Reviews order, delivery and price list to establish position and draft
    dispute response letter.
  checks:
    - tool: draft_dispute_response
      args: {customer_id: CUS-004512, dispute_amount_gbp: 480000}
      expect: ["DISPUTE RESPONSE", "OUR ANALYSIS", "PROPOSED RESOLUTION"]

- question: "07:68:Q1"
  story: >
    Internal auditor analyzes year of purchase orders and payments for anomalies:
    duplicates, split orders, round-sum invoices. Scores by fraud risk and drafts
    findings in audit report format.
  checks:
    - tool: draft_audit_findings_report
      args: {factory_id: FAC-0001, audit_type: compliance}
      expect: ["AUDIT FINDINGS REPORT", "KEY FINDINGS", "RECOMMENDED ACTIONS"]

- question: "07:70:Q1"
  story: >
    CFO evaluating £50m capital allocation across DC, automation, refits,
    e-commerce, nearshoring and new markets. Needs board paper outlining
    options, assumptions and recommendations.
  checks:
    - tool: draft_board_paper
      args: {topic: "Capital Allocation £50m", fiscal_year: "FY27"}
      expect: ["BOARD PAPER", "STRATEGIC CONTEXT", "FINANCIAL IMPACT"]

- question: "08:80:Q1"
  story: >
    International market manager considers launching home range in Poland
    and Czechia. Researches regulations, import rules, consumer preferences,
    retail margins and prepares market entry brief.
  checks:
    - tool: draft_market_entry_brief
      args: {market_country: Poland, product_category: "home range"}
      expect: ["MARKET ENTRY BRIEF", "REGULATORY", "CONSUMER PREFERENCES"]

- question: "09:85:Q2"
  story: >
    Cybersecurity analyst investigates unusual supplier portal login from
    unfamiliar location at 03:12. Analyzes auth and access logs to determine
    if real incident and drafts incident summary for CISO.
  checks:
    - tool: draft_incident_summary
      args: {incident_type: security, site_id: DC1}
      expect: ["INCIDENT SUMMARY", "TIMELINE", "ROOT CAUSE"]

- question: "09:87:Q1"
  story: >
    Chief supply chain officer preparing for executive meeting summarizes
    end-to-end performance across service, cost, inventory, risk and
    sustainability against plan with top five issues.
  checks:
    - tool: draft_executive_briefing
      args: {topic: "Supply Chain Performance Q3 Review"}
      expect: ["EXECUTIVE BRIEFING", "KEY FINDINGS", "TOP PRIORITIES"]

- question: "09:87:Q2"
  story: >
    Chief supply chain officer evaluates top investments over next three years:
    nearshoring, automation, network, dual sourcing, digital planning within
    £80m envelope. Proposes sequenced roadmap.
  checks:
    - tool: draft_investment_roadmap
      args: {investment_theme: "Automation and Network", budget_million_gbp: 80}
      expect: ["INVESTMENT ROADMAP", "PHASE 1", "DEPENDENCIES"]

- question: "09:90:Q1"
  story: >
    Programme manager checks ERP programme health: is it on track for scope,
    schedule, budget and benefits? Uses RAID log, plan and finance to draft
    highlight report for steering committee.
  checks:
    - tool: draft_highlight_report
      args: {programme_name: "ERP Transformation Programme"}
      expect: ["HIGHLIGHT REPORT", "STATUS", "DECISIONS REQUIRED"]
