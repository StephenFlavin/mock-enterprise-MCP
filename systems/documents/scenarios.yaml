# Scenarios for Documents system - all 17 tools
# One entry per question that uses these tools

- question: "01:4:Q2"
  story: >
    Inventory control manager analyzes WMS adjustment export for Q3
    using read_document to parse CSV file, then groups adjustments
    by cause, location, shift and day of week to identify process problems.
  checks:
    - tool: read_document
      args: {path: "adj_Q3.csv"}
      expect: ["adjustment", "cause", "location"]

- question: "01:6:Q3"
  story: >
    Warehouse manager reads labour data and agency rates to compare
    late shift vs overtime options, then drafts recommendation summary
    for operations director.
  checks:
    - tool: read_document
      args: {path: "labour_Sep.xlsx"}
      expect: ["labour", "shift", "productivity"]
    - tool: draft_recommendation_summary
      args: {topic: "Labour Shift Option", recommendation: "Recommend late shift"}
      expect: ["RECOMMENDATION SUMMARY", "KEY FINDINGS", "RATIONALE"]

- question: "01:8:Q1"
  story: >
    WMS analyst investigates 140 orders stuck in allocation failed status.
    Drafts incident summary documenting what happened and next steps.
  checks:
    - tool: draft_incident_summary
      args: {incident_type: operational, site_id: DC1}
      expect: ["INCIDENT SUMMARY", "TIMELINE", "ROOT CAUSE"]

- question: "01:10:Q2"
  story: >
    Automation engineer reads CMMS records to identify which motors,
    gearboxes and sensors are likely to fail before November based on
    run hours and fault history.
  checks:
    - tool: read_document
      args: {path: "cmms_export.xlsx"}
      expect: ["cmms", "asset", "run_hours"]

- question: "02:11:Q2"
  story: >
    Transport planner reads last quarter's volumes and delivery windows
    for northern region, then drafts negotiation brief for pallet network discussion.
  checks:
    - tool: read_document
      args: {path: "north_loads_Q3.csv"}
      expect: ["volume", "lane", "delivery"]
    - tool: draft_negotiation_brief
      args: {supplier_id: SUP-0001, negotiation_type: terms}
      expect: ["NEGOTIATION BRIEF", "LEVERAGE", "MARKET BENCHMARKS"]

- question: "02:20:Q1"
  story: >
    Carrier relationship manager reads 12 months of carrier invoices
    and compares against contracted rates to identify overcharges.
  checks:
    - tool: read_document
      args: {path: "carrier_invoices_FY26.csv"}
      expect: ["invoice", "carrier", "amount"]

- question: "03:23:Q2"
  story: >
    Demand planner reads marketing plan to forecast demand for new
    recycled-polyester backpack range launching January.
  checks:
    - tool: read_document
      args: {path: "Q1_marketing_plan.pdf"}
      expect: ["marketing", "launch", "plan"]

- question: "03:29:Q2"
  story: >
    Markdown analyst reads spreadsheet with 40 aged lines, analyzes
    inventory aging, and recommends whether to mark down, outlet, bundle
    or donate each line.
  checks:
    - tool: read_spreadsheet_document
      args: {filename: "aged_lines.xlsx"}
      expect: ["aged", "lines", "inventory"]

- question: "04:32:Q1"
  story: >
    Category buyer reads supplier quotes and extracts line items to
    build should-cost model and identify which lines look inflated.
  checks:
    - tool: read_document_attachment
      args: {filename: "quote_A.pdf"}
      expect: ["quote", "supplier", "price"]
    - tool: extract_quote_line_items
      args: {quote_file: "quote_A.pdf"}
      expect: ["Component", "Qty", "Unit Price"]

- question: "04:32:Q3"
  story: >
    Category buyer compares three suppliers on landed cost, lead time,
    quality and capacity for next season's bedding range, then drafts
    sourcing recommendation for the award.
  checks:
    - tool: draft_sourcing_recommendation
      args: {category: "bedding", winning_supplier_id: SUP-0042}
      expect: ["SOURCING RECOMMENDATION", "SCORING", "AWARD"]

- question: "04:32:Q7"
  story: >
    Category buyer prepares annual negotiation brief with largest cookware
    supplier covering performance, leverage, benchmarks and trading options.
  checks:
    - tool: draft_negotiation_brief
      args: {supplier_id: SUP-0001, negotiation_type: price}
      expect: ["NEGOTIATION BRIEF", "OUR POSITION", "BATNA"]

- question: "04:34:Q2"
  story: >
    Sourcing manager finds suppliers in Portugal and Turkey for technical
    outerwear with seam-sealing capability, then drafts shortlist comparison
    with scoring and recommendations.
  checks:
    - tool: draft_supplier_shortlist_comparison
      args: {category: "technical outerwear", num_suppliers: 3}
      expect: ["SUPPLIER SHORTLIST", "EVALUATION", "AWARD"]

- question: "04:35:Q1"
  story: >
    Supplier relationship manager investigates supplier performance decline
    over two quarters, pulls together order patterns and payment record,
    then drafts supplier recovery plan if recoverable.
  checks:
    - tool: draft_supplier_recovery_plan
      args: {supplier_id: SUP-0001, issue_summary: "Delivery and quality decline"}
      expect: ["RECOVERY PLAN", "ROOT CAUSE", "PHASE 1"]

- question: "04:35:Q5"
  story: >
    Supplier relationship manager reads Q3 scorecard and orders data,
    then drafts business review pack with performance trends and opportunities
    for upcoming meeting.
  checks:
    - tool: read_document_attachment
      args: {filename: "scorecard_T_Q3.xlsx"}
      expect: ["scorecard", "performance"]
    - tool: draft_business_review_pack
      args: {supplier_id: SUP-0042}
      expect: ["BUSINESS REVIEW PACK", "SCORECARD", "OPPORTUNITIES"]

- question: "04:35:Q6"
  story: >
    Supplier relationship manager structures joint improvement programme
    with supplier to cut lead time by 20% over 12 months, drafting detailed plan.
  checks:
    - tool: draft_improvement_programme_plan
      args: {supplier_id: SUP-0001, improvement_goal: "reduce lead time by 20%"}
      expect: ["IMPROVEMENT PROGRAMME", "INITIATIVES", "BENEFITS"]

- question: "04:36:Q5"
  story: >
    Procurement analyst reads vendor master with ~340 duplicate-looking names,
    uses fuzzy matching to group them, and shows combined spend by group.
  checks:
    - tool: read_document_attachment
      args: {filename: "vendor_master.csv"}
      expect: ["vendor", "supplier", "name"]

- question: "04:37:Q1"
  story: >
    Indirect procurement manager reads four warehouse cleaning bids,
    extracts pricing and terms, then drafts bid recommendation covering
    price, service levels and references.
  checks:
    - tool: read_document_attachment
      args: {filename: "bids.zip"}
      expect: ["bid", "cleaning"]
    - tool: extract_bid_pricing_and_terms
      args: {bid_file: "bids.zip"}
      expect: ["Supplier", "Total Price", "Payment Terms"]
    - tool: draft_bid_recommendation
      args: {supplier_id: SUP-0001, category: "cleaning"}
      expect: ["BID RECOMMENDATION", "SCORING", "AWARD"]

- question: "04:37:Q4"
  story: >
    Indirect procurement manager reviews contracts expiring in next 12 months,
    builds sourcing calendar with RFQ dates and tender timelines.
  checks:
    - tool: draft_sourcing_calendar
      args: {calendar_period: "next 12 months"}
      expect: ["SOURCING CALENDAR", "TENDER", "DATES"]

- question: "04:38:Q1"
  story: >
    Contracts/legal counsel reviews attached supplier agreement against
    standard terms, lists deviations ranked by risk and drafts redline email.
  checks:
    - tool: read_document_attachment
      args: {filename: "supply_agreement_v3.docx"}
      expect: ["agreement", "contract", "terms"]

- question: "04:38:Q6"
  story: >
    Contracts/legal counsel reviews contract remedies and drafts formal
    notice of breach for supplier who missed critical delivery.
  checks:
    - tool: draft_breach_notice
      args: {po_id: "PO-2026-005912"}
      expect: ["FORMAL NOTICE", "BREACH DETAILS", "REQUIRED ACTIONS"]

- question: "04:39:Q1"
  story: >
    Commodities buyer summarizes current prices and recent drivers for cotton,
    polyester, nylon and leather for category buyers.
  checks:
    - tool: draft_commodity_summary
      args: {commodity: cotton}
      expect: ["COMMODITY SUMMARY", "CURRENT STATUS", "FORECAST"]

- question: "04:39:Q2"
  story: >
    Commodities buyer reads cash forecast to evaluate whether to lock in
    60% of next year's cotton requirement now or wait.
  checks:
    - tool: read_document_attachment
      args: {filename: "cash_forecast_FY27.xlsx"}
      expect: ["cash", "forecast"]

- question: "04:39:Q8"
  story: >
    Commodities buyer drafts weekly commodity brief for buying team
    covering price moves, news and recommended actions for commodities.
  checks:
    - tool: draft_commodity_brief
      args: {commodity: polyester}
      expect: ["WEEKLY COMMODITY BRIEF", "PRICE", "ACTIONS"]

- question: "05:46:Q3"
  story: >
    Quality manager reads document with test results and production lot details,
    extracts label text from images, then issues corrective action request to supplier.
  checks:
    - tool: get_document_contents
      args: {file_reference: "test_results.pdf"}
      expect: ["test", "results"]
    - tool: extract_label_text_from_images
      args: {image_file: "label_sample.jpg"}
      expect: ["Text Recognized", "Barcode"]

- question: "06:59:Q5"
  story: >
    Product data specialist identifies products lacking compliance info for
    Ireland market and lists suppliers with missing documents to request them.
  checks:
    - tool: list_suppliers_with_missing_documents
      args: {market_country: "Ireland", document_type: "compliance"}
      expect: ["supplier", "missing", "document"]

- question: "07:61:Q1"
  story: >
    Financial controller finds operating profit £1.8m below budget for September.
    Reads P&L extract document, decomposes variance by driver, drafts commentary.
  checks:
    - tool: get_pl_extract_from_document
      args: {pl_file: "sept_pl.xlsx"}
      expect: ["Line Item", "Variance", "Driver"]
    - tool: draft_management_accounts_commentary
      args: {variances_summary: "Operating profit variance"}
      expect: ["MANAGEMENT ACCOUNTS", "VOLUME", "PRICE"]

- question: "07:62:Q8"
  story: >
    FP&A analyst summarizes month for leadership team covering performance,
    budget variance and top issues.
  checks:
    - tool: draft_leadership_summary
      args: {reporting_period: "September 2026"}
      expect: ["LEADERSHIP SUMMARY", "PERFORMANCE", "TOP 5 ISSUES"]

- question: "07:65:Q2"
  story: >
    AR/credit controller has £480k invoice disputed by wholesale customer.
    Reads dispute pack with order, delivery notes and email thread to establish
    position and draft response.
  checks:
    - tool: get_dispute_documents
      args: {pack_reference: "dispute_pack.zip"}
      expect: ["Order", "Delivery", "Price"]
    - tool: draft_dispute_response
      args: {customer_id: CUS-001000, dispute_amount_gbp: 480000}
      expect: ["DISPUTE RESPONSE", "ANALYSIS", "RESOLUTION"]

- question: "07:68:Q1"
  story: >
    Internal auditor analyzes year of purchase orders and payments for anomalies
    (splits, duplicates, new vendors paid fast). Reads data file and drafts
    audit findings report.
  checks:
    - tool: get_po_and_payment_data
      args: {file_reference: "po_pay_FY26.csv"}
      expect: ["PO", "Payment", "Amount"]
    - tool: draft_audit_findings_report
      args: {audit_subject: "Purchase order and payment controls"}
      expect: ["AUDIT FINDINGS", "FINDING", "RISK"]

- question: "07:70:Q1"
  story: >
    CFO evaluating £50m capital allocation drafts board paper for capital plan
    covering strategy, financials and risks.
  checks:
    - tool: draft_board_paper
      args: {topic: "Capital Allocation £50m"}
      expect: ["BOARD PAPER", "STRATEGIC CONTEXT", "FINANCIAL IMPACT"]

- question: "08:80:Q1"
  story: >
    International market manager considers launching home range in Poland and
    Czechia, researches regulations and consumer preferences, drafts market entry brief.
  checks:
    - tool: draft_market_entry_brief
      args: {market_country: Poland, product_category: "home range"}
      expect: ["MARKET ENTRY BRIEF", "REGULATORY", "CONSUMER"]

- question: "09:83:Q2"
  story: >
    ERP systems integrator reads supplier's new EDI spec document explaining
    what it changes and mapping to WMS inbound fields.
  checks:
    - tool: read_document
      args: {path: "ASN_spec_v2.pdf"}
      expect: ["ASN", "spec"]

- question: "09:85:Q2"
  story: >
    Cybersecurity analyst investigates unusual supplier portal login, reads
    auth and access logs from attached archive, determines if real incident
    and drafts incident summary for CISO.
  checks:
    - tool: read_document
      args: {path: "auth_logs.zip"}
      expect: ["auth", "logs"]
    - tool: draft_incident_summary
      args: {incident_type: security, site_id: DC1}
      expect: ["INCIDENT SUMMARY", "SECURITY", "INVESTIGATION"]

- question: "09:87:Q1"
  story: >
    Chief supply chain officer preparing for executive meeting drafts briefing
    summarizing end-to-end performance across service, cost, inventory, risk.
  checks:
    - tool: draft_executive_briefing
      args: {topic: "Supply Chain Performance Q3 Review"}
      expect: ["EXECUTIVE BRIEFING", "SITUATION", "PRIORITIES"]

- question: "09:87:Q2"
  story: >
    Chief supply chain officer evaluates top supply chain investments over
    3 years and proposes sequenced roadmap within £80m envelope.
  checks:
    - tool: draft_investment_roadmap
      args: {investment_theme: "Automation and Network", budget_million_gbp: 80}
      expect: ["INVESTMENT ROADMAP", "PHASE 1", "PHASE 2"]

- question: "09:88:Q3"
  story: >
    COO ranks seven capex projects by return and risk, drafts sponsor challenge
    brief anticipating objections and preparing responses for committee.
  checks:
    - tool: read_document
      args: {path: "capex_FY27.xlsx"}
      expect: ["capex", "project"]
    - tool: draft_sponsor_challenge_brief
      args: {project_name: "Portfolio Review", total_investment_gbp: 22000000}
      expect: ["SPONSOR CHALLENGE", "OBJECTIONS", "RESPONSES"]

- question: "09:90:Q1"
  story: >
    Programme manager checks ERP programme health, uses RAID log and finance
    report to identify top risks and decisions, drafts highlight report.
  checks:
    - tool: read_document
      args: {path: "erp_pack_Oct.zip"}
      expect: ["erp", "raid"]
    - tool: draft_highlight_report
      args: {programme_name: "ERP Transformation Programme"}
      expect: ["HIGHLIGHT REPORT", "STATUS", "RISKS"]
