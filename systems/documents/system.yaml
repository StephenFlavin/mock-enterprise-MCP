id: documents
name: Documents
instructions: >
  Document generation, reading and extraction. Read and extract data from documents
  (PDFs, CSVs, Excel, images). Draft tools create formatted documents from structured data.
  Document reference codes look like DOC-000123.

tables:
  documents:
    key: doc_id
    cols:
      doc_id: {type: str, desc: "Document id, e.g. DOC-000123"}
      title: {type: str, desc: "Document title"}
      doc_type: {type: enum, values: [csv, xlsx, pdf, image, txt, archive, docx], desc: "Document type"}
      path: {type: str, desc: "File path in files/"}
      created_at: {type: timestamp, desc: "Upload or creation timestamp"}
      description: {type: str, desc: "Brief description or notes"}

  contract_register:
    key: contract_id
    cols:
      contract_id: {type: str, desc: "Contract reference, e.g. CTR-000003"}
      party_id: {type: str, desc: "Supplier or carrier id of the counterparty, blank for services"}
      party_name: {type: str, desc: "Counterparty name"}
      contract_type: {type: enum, values: [supplier, carrier, service], desc: "Contract type"}
      category: {type: str, desc: "Category or scope of the contract"}
      owner_id: {type: str, desc: "Employee who owns the contract, e.g. EMP-00058"}
      end_date: {type: date, desc: "Contract expiry date"}
      renewal_notice_days: {type: int, desc: "Days of notice needed before expiry"}
      auto_renewal: {type: bool, desc: "True if the contract renews automatically"}
      annual_value_gbp: {type: float, desc: "Annual contract value in GBP"}

tools:
  - name: read_document
    desc: Read an attached file (CSV, XLSX, PDF or text). CSV and spreadsheet files come back as rows with totals; filter, group and sort them to analyse large files.
    kind: py
    fn: read_document
    limit: 400
    args:
      path: {type: str, required: true, desc: "File name, e.g. adj_Q3.csv"}
      where: {type: str, desc: "Keep rows matching column=value or column~text, separated by ;, e.g. status=disputable;carrier_id=CAR-002"}
      exclude: {type: str, desc: "Drop rows matching column=value pairs separated by ;, e.g. reversed_within_48h=yes"}
      min_amount: {type: float, desc: "Keep rows whose first _gbp amount column is at least this, e.g. 500"}
      group_by: {type: str, desc: "Comma-separated columns to total by, e.g. cause_code,location_zone,shift; largest value first"}
      sort_by: {type: str, desc: "Column to sort by, e.g. stock_value_gbp (add ' asc' for ascending)"}
      max_rows: {type: int, default: 150, desc: "Maximum rows or groups to return"}
    example: {path: "adj_Q3.csv", min_amount: 500}

  - name: read_document_attachment
    desc: Read an attached text or PDF file in full and return its contents, e.g. a supplier quote with its terms.
    kind: sql
    args:
      filename: {type: str, required: true, desc: "Attached filename, e.g. quote_A.pdf"}
    sql: |
      SELECT parse_filename(filename) AS filename, content FROM read_text('{files}/' || $filename)
    limit: 1
    example: {filename: "quote_A.pdf"}

  - name: read_spreadsheet_document
    desc: Read a spreadsheet file into rows with totals. Filter, group or sort and limit them, e.g. the top lines by value.
    kind: py
    fn: read_spreadsheet
    limit: 400
    args:
      filename: {type: str, required: true, desc: "Spreadsheet filename, e.g. aged_lines.xlsx"}
      where: {type: str, desc: "Keep rows matching column=value or column~text, separated by ;, e.g. category=Bags"}
      exclude: {type: str, desc: "Drop rows matching column=value pairs separated by ;"}
      min_amount: {type: float, desc: "Keep rows whose first _gbp amount column is at least this"}
      group_by: {type: str, desc: "Comma-separated columns to total by, e.g. category"}
      sort_by: {type: str, desc: "Column to sort by, e.g. stock_value_gbp; largest first unless ' asc'"}
      max_rows: {type: int, default: 150, desc: "Maximum rows or groups to return"}
    example: {filename: "aged_lines.xlsx", sort_by: stock_value_gbp, max_rows: 10}

  - name: get_document_contents
    desc: Read an attached or shared file or archive, parse and return structured content.
    kind: sql
    args:
      file_reference: {type: str, required: true, desc: "File name or path in archive"}
    sql: |
      SELECT content FROM read_text('{files}/' || $file_reference)
      WHERE TRUE
    limit: 1
    example: {file_reference: "cmms_export.xlsx"}

  - name: extract_quote_line_items
    desc: Extract the cost lines of a supplier quote (component, quantity, unit price, total, note) plus its key terms such as MOQ, incoterm, material grade and tooling.
    kind: py
    fn: extract_quote_lines
    limit: 60
    args:
      quote_file: {type: str, required: true, desc: "Quote filename, e.g. quote_A.pdf"}
    example: {quote_file: "quote_A.pdf"}

  - name: extract_bid_pricing_and_terms
    desc: Extract each bidder's price, payment terms, call-out fees, consumables, minimum hours, price review, service level and references from a bid archive, with the three-year cost including hidden costs, cheapest first.
    kind: py
    fn: extract_bids
    limit: 60
    args:
      bid_file: {type: str, required: true, desc: "Bid file or archive path, e.g. bids.zip"}
      call_out_per_year: {type: int, desc: "Expected call-outs a year, if different from the tender assumption"}
      term_years: {type: int, default: 3, desc: "Contract term in years used for the total cost"}
    example: {bid_file: "bids.zip"}

  - name: extract_label_text_from_images
    desc: OCR text and symbols from label images. Returns recognized text, barcodes and product info.
    kind: sql
    args:
      image_file: {type: str, required: true, desc: "Image filename with label, e.g. label_SKU.jpg"}
    sql: |
      SELECT content FROM read_text('{files}/' || $image_file)
      WHERE TRUE
    limit: 1
    example: {image_file: "label_sample.jpg"}

  - name: get_dispute_documents
    desc: Read documents from the attached dispute pack (zip or folder). Returns order, delivery notes and email thread.
    kind: sql
    args:
      pack_reference: {type: str, required: true, desc: "Dispute pack filename, e.g. dispute_pack.zip"}
    sql: |
      SELECT content FROM read_text('{files}/' || $pack_reference)
      WHERE TRUE
    limit: 1
    example: {pack_reference: "dispute_pack.zip"}

  - name: get_po_and_payment_data
    desc: Read a purchase order and payment file into rows (PO, supplier, invoice date, payment date, amount) with totals.
    kind: py
    fn: get_po_payment
    limit: 200
    args:
      file_reference: {type: str, required: true, desc: "CSV or Excel with PO and payment data, e.g. po_pay_FY26.csv"}
    example: {file_reference: "po_pay_FY26.csv"}

  - name: get_pl_extract_from_document
    desc: Parse the attached P&L extract into rows by line item with planned, actual, variance and driver.
    kind: py
    fn: get_pl_extract
    limit: 50
    args:
      pl_file: {type: str, required: true, desc: "P&L file, e.g. sept_pl.xlsx"}
    example: {pl_file: "sept_pl.xlsx"}

  - name: list_suppliers_with_missing_documents
    desc: List suppliers with missing compliance documents needed for selling in target market.
    kind: sql
    args:
      market_country: {type: str, required: true, desc: "Target country, e.g. Ireland"}
      document_type: {type: str, default: "compliance", desc: "Type of missing document"}
    sql: |
      SELECT
        s.supplier_id,
        s.name as supplier_name,
        COUNT(*) as missing_document_count,
        SUM(pur.total_value) as total_spend_gbp
      FROM master.suppliers s
      LEFT JOIN master.purchase_orders pur ON s.supplier_id = pur.supplier_id
      WHERE s.status = 'active'
      GROUP BY s.supplier_id, s.name
      ORDER BY total_spend_gbp DESC
      LIMIT 20
    example: {market_country: "Ireland", document_type: "compliance"}

  - name: draft_recommendation_summary
    desc: Draft a one-page recommendation comparing two options on cost, with the saving worked out and the recommendation and rationale stated.
    kind: draft
    args:
      topic: {type: str, required: true, desc: "Summary topic, e.g. Peak labour cover"}
      option_a: {type: str, desc: "First option, e.g. Late shift for eight weeks"}
      option_a_cost_gbp: {type: float, desc: "Total cost of option A in GBP"}
      option_b: {type: str, desc: "Second option, e.g. Overtime on existing shifts"}
      option_b_cost_gbp: {type: float, desc: "Total cost of option B in GBP"}
      recommendation: {type: str, required: true, desc: "Recommended option and the main reason"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      RECOMMENDATION SUMMARY

      Topic: {{ topic }}
      Date: {{ calendar[0].date if calendar else 'Current' }}
      Recommendation: {{ recommendation }}

      {% if option_a and option_b and option_a_cost_gbp is not none and option_b_cost_gbp is not none -%}
      OPTIONS COMPARED
      | Option | Total cost |
      |---|---|
      | A: {{ option_a }} | £{{ '%d'|format(option_a_cost_gbp) }} |
      | B: {{ option_b }} | £{{ '%d'|format(option_b_cost_gbp) }} |

      COST COMPARISON
      {% if option_a_cost_gbp < option_b_cost_gbp -%}
      Option A is cheaper by £{{ '%d'|format(option_b_cost_gbp - option_a_cost_gbp) }} ({{ "%.1f"|format((option_b_cost_gbp - option_a_cost_gbp) / option_b_cost_gbp * 100) }}% below option B).
      {%- elif option_a_cost_gbp > option_b_cost_gbp -%}
      Option B is cheaper by £{{ '%d'|format(option_a_cost_gbp - option_b_cost_gbp) }} ({{ "%.1f"|format((option_a_cost_gbp - option_b_cost_gbp) / option_a_cost_gbp * 100) }}% below option A).
      {%- else -%}
      The two options cost the same.
      {%- endif %}

      {% endif -%}

      RATIONALE
      {{ recommendation }}

      NEXT STEPS
      1. Confirm the decision with the sponsor
      2. Raise the requests needed for the chosen option
      3. Review cost and performance after the first two weeks
    example: {topic: "Peak labour cover", option_a: "Late shift", option_a_cost_gbp: 412000, option_b: "Overtime", option_b_cost_gbp: 486000, recommendation: "Late shift: cheaper and lower fatigue risk"}

  - name: draft_sourcing_recommendation
    desc: Draft a supplier award recommendation for a category using the winning supplier's master data against the other active suppliers in that category.
    kind: draft
    args:
      category: {type: str, required: true, desc: "Product category being sourced, e.g. Bedding"}
      winning_supplier_id: {type: str, required: true, desc: "Supplier ID of the winning bid, e.g. SUP-0039"}
      compare_supplier_ids: {type: str, desc: "Comma-separated supplier ids to compare against, e.g. SUP-0011,SUP-0004. Default all active suppliers in the category"}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $winning_supplier_id
      own: |
        SELECT count(*) AS skus, round(avg(unit_cost_gbp), 2) AS avg_unit_cost, round(avg(lead_time_days), 0) AS lead_days, min(moq) AS moq
        FROM master.products WHERE supplier_id = $winning_supplier_id AND lower(category) = lower($category)
      market: |
        SELECT round(avg(unit_cost_gbp), 2) AS avg_unit_cost, round(avg(lead_time_days), 0) AS lead_days
        FROM master.products WHERE lower(category) = lower($category)
      fac: |
        SELECT f.factory_id, f.name, f.country, f.capacity_units_month, f.certifications, f.audit_rating
        FROM master.factories f
        WHERE f.supplier_id = $winning_supplier_id
          AND f.factory_id IN (SELECT factory_id FROM master.products WHERE lower(category) = lower($category))
        ORDER BY f.factory_id
      rivals: |
        SELECT s.supplier_id, s.name, s.otif_pct_12m, s.payment_terms_days, s.risk_rating,
               round(avg(p.unit_cost_gbp), 2) AS avg_unit_cost, round(avg(p.lead_time_days), 0) AS lead_days
        FROM master.suppliers s JOIN master.products p ON p.supplier_id = s.supplier_id
        WHERE lower(p.category) = lower($category) AND s.supplier_id <> $winning_supplier_id AND s.status = 'active'
          AND ($compare_supplier_ids IS NULL OR list_contains(string_split(replace(upper($compare_supplier_ids), ' ', ''), ','), s.supplier_id))
        GROUP BY ALL ORDER BY s.otif_pct_12m DESC
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      SOURCING RECOMMENDATION

      Category: {{ category|upper }}
      Recommended supplier: {{ supplier[0].name if supplier else 'Unknown' }} ({{ winning_supplier_id }})
      Date: {{ calendar[0].date if calendar else 'Current' }}

      1. WHY THIS SUPPLIER
      {% if supplier -%}
      - On-time-in-full, last 12 months: {{ supplier[0].otif_pct_12m }}%
      - Payment terms: {{ supplier[0].payment_terms_days }} days, incoterm {{ supplier[0].incoterm }}, currency {{ supplier[0].currency }}
      - Risk rating: {{ supplier[0].risk_rating }}, tier {{ supplier[0].tier }}
      {% if own[0].skus -%}
      - Range in this category: {{ own[0].skus }} SKUs, average unit cost £{{ own[0].avg_unit_cost }} against a category average of £{{ market[0].avg_unit_cost }}
      {% set d = (own[0].avg_unit_cost - market[0].avg_unit_cost) / market[0].avg_unit_cost * 100 -%}
      - Unit cost is {{ "%.0f"|format(d|abs) }}% {{ 'above' if d > 0 else 'below' }} the category average
      - Lead time: {{ own[0].lead_days|int }} days against a category average of {{ market[0].lead_days|int }} days; MOQ {{ own[0].moq }} units
      {% else -%}
      - No SKUs in this category yet, so cost and lead time must come from the supplier's quote
      {% endif -%}
      {% else -%}
      - Supplier not found
      {% endif %}
      2. COMPARISON WITH OTHER ACTIVE SUPPLIERS IN THE CATEGORY
      | Supplier | OTIF % | Avg unit cost | Lead days | Payment days | Risk |
      |---|---|---|---|---|---|
      {% if supplier and own[0].skus -%}
      | {{ supplier[0].name }} (recommended) | {{ supplier[0].otif_pct_12m }} | £{{ own[0].avg_unit_cost }} | {{ own[0].lead_days|int }} | {{ supplier[0].payment_terms_days }} | {{ supplier[0].risk_rating }} |
      {% endif -%}
      {% for r in rivals -%}
      | {{ r.name }} | {{ r.otif_pct_12m }} | £{{ r.avg_unit_cost }} | {{ r.lead_days|int }} | {{ r.payment_terms_days }} | {{ r.risk_rating }} |
      {% endfor %}
      3. CAPACITY, QUALITY AND COMPLIANCE
      {% for f in fac -%}
      - {{ f.name }} ({{ f.factory_id }}, {{ f.country }}): {{ "{:,}".format(f.capacity_units_month|int) }} units a month, audit rating {{ f.audit_rating }}, certifications {{ f.certifications }}
      {% else -%}
      - No factory in this category on file for this supplier
      {% endfor %}
      4. APPROVAL REQUIRED
      Award of the {{ category }} volume to {{ supplier[0].name if supplier else 'the supplier' }}, subject to confirming the quoted price and landed cost.
    example: {category: "Bedding", winning_supplier_id: SUP-0039}

  - name: draft_sourcing_calendar
    desc: Draft a sourcing calendar from the contract register for the next months, listing each expiry with notice deadline, tender kick-off date, owner and auto-renewal warning.
    kind: draft
    args:
      months_ahead: {type: int, default: 12, desc: "How many months ahead to cover, e.g. 12"}
      exclude_contract_ids: {type: str, desc: "Comma-separated contract ids to leave out, e.g. CTR-000008,CTR-000042"}
      tender_threshold_gbp: {type: float, default: 1000000, desc: "Annual value at or above which a contract needs a tender"}
      tender_lead_days: {type: int, default: 150, desc: "Days before expiry to start the tender"}
    sql:
      rows: |
        SELECT c.contract_id, c.party_name, c.contract_type, c.category, c.owner_id, e.name AS owner_name,
               c.end_date, c.renewal_notice_days, c.auto_renewal, c.annual_value_gbp,
               c.end_date - CAST(c.renewal_notice_days AS INTEGER) AS notice_deadline,
               c.end_date - CAST($tender_lead_days AS INTEGER) AS tender_kickoff,
               c.annual_value_gbp >= $tender_threshold_gbp AS needs_tender,
               c.end_date - CAST(c.renewal_notice_days AS INTEGER) < CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE) AS notice_passed,
               c.end_date - CAST($tender_lead_days AS INTEGER) < CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE) AS kickoff_passed
        FROM contract_register c LEFT JOIN master.employees e ON e.employee_id = c.owner_id
        WHERE c.end_date BETWEEN date_trunc('week', CAST($as_of AS DATE)) AND CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE) + CAST($months_ahead AS INTEGER) * 30
          AND ($exclude_contract_ids IS NULL OR NOT list_contains(string_split(replace(upper($exclude_contract_ids), ' ', ''), ','), c.contract_id))
        ORDER BY c.end_date, c.contract_id
    template: |
      SOURCING CALENDAR

      Period: next {{ months_ahead }} months
      Contracts expiring: {{ rows|length }}; needing a tender (annual value of {{ "£{:,}".format(tender_threshold_gbp|int) }} or more): {{ rows|selectattr('needs_tender')|list|length }}; auto-renewing: {{ rows|selectattr('auto_renewal')|list|length }}; auto-renewing with the notice deadline already passed: {{ rows|selectattr('auto_renewal')|selectattr('notice_passed')|list|length }}
      Tender kick-off is {{ tender_lead_days }} days before expiry.
      {% if exclude_contract_ids %}Left out: {{ exclude_contract_ids }}
      {% endif %}
      | Contract | Party | Expires | Notice deadline | Tender | Tender kick-off | Auto-renews | Owner |
      |---|---|---|---|---|---|---|---|
      {% for r in rows -%}
      | {{ r.contract_id }} | {{ r.party_name }} | {{ r.end_date }} | {{ r.notice_deadline }} | {{ 'YES' if r.needs_tender else 'no' }} | {{ ((r.tender_kickoff|string) ~ (' (start now)' if r.kickoff_passed else '')) if r.needs_tender else '-' }} | {{ 'YES' if r.auto_renewal else 'no' }} | {{ r.owner_name or r.owner_id }} |
      {% else -%}
      | none | | | | | | | |
      {% endfor %}
      AUTO-RENEWAL WARNINGS (miss the notice deadline and the contract rolls over)
      {% for r in rows if r.auto_renewal -%}
      - {{ r.contract_id }} {{ r.party_name }}: give notice by {{ r.notice_deadline }}{{ ' - DEADLINE PASSED, the contract may already have rolled over' if r.notice_passed else '' }}
      {% else -%}
      - none
      {% endfor %}
    example: {months_ahead: 12}

  - name: draft_supplier_shortlist_comparison
    desc: Draft a shortlist comparison of approved factories in the given countries with the required certification and season capacity, ranked on category experience, audit rating and capacity.
    kind: draft
    args:
      category: {type: str, required: true, desc: "Product type being sourced, e.g. technical outerwear"}
      countries: {type: str, default: "PT,TR", desc: "Comma-separated country codes, e.g. PT,TR"}
      certification: {type: str, default: "OEKO-TEX", desc: "Certification the factory must hold"}
      min_season_capacity: {type: int, default: 30000, desc: "Minimum units per season (three months of capacity)"}
      product_category: {type: str, default: "Outerwear", desc: "Our product category used as evidence the factory can make it"}
      num_suppliers: {type: int, default: 3, desc: "Number of factories on the shortlist"}
    sql:
      eligible: |
        SELECT f.factory_id, f.name AS factory, f.country, f.capacity_units_month * 3 AS season_capacity, f.certifications,
               f.audit_rating, s.supplier_id, s.name AS supplier, s.otif_pct_12m, s.payment_terms_days, s.risk_rating,
               (SELECT count(*) FROM master.products p WHERE p.factory_id = f.factory_id AND lower(p.category) = lower($product_category)) AS category_skus
        FROM master.factories f JOIN master.suppliers s ON s.supplier_id = f.supplier_id
        WHERE list_contains(string_split(replace(upper($countries), ' ', ''), ','), f.country)
          AND f.certifications ILIKE '%' || $certification || '%'
          AND f.capacity_units_month * 3 >= $min_season_capacity AND f.status = 'approved' AND s.status = 'active'
        ORDER BY category_skus DESC, f.audit_rating ASC, season_capacity DESC
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      SUPPLIER SHORTLIST COMPARISON

      Category: {{ category|upper }}
      Date: {{ calendar[0].date if calendar else 'Current' }}
      Criteria: factories in {{ countries }} holding {{ certification }}, with at least {{ "{:,}".format(min_season_capacity|int) }} units per season
      Eligible factories found: {{ eligible|length }}; shortlisted: {{ [eligible|length, num_suppliers|int]|min }}

      | Rank | Factory | Supplier | Country | Season capacity | Audit rating | {{ product_category }} SKUs made | OTIF % | Payment days |
      |---|---|---|---|---|---|---|---|---|
      {% for r in eligible[:num_suppliers|int] -%}
      | {{ loop.index }} | {{ r.factory }} ({{ r.factory_id }}) | {{ r.supplier }} ({{ r.supplier_id }}) | {{ r.country }} | {{ "{:,}".format(r.season_capacity|int) }} | {{ r.audit_rating }} | {{ r.category_skus }} | {{ r.otif_pct_12m }} | {{ r.payment_terms_days }} |
      {% else -%}
      | none | no factory meets the criteria | | | | | | | |
      {% endfor %}
      RANKING BASIS
      1. Experience: factories already making our {{ product_category }} SKUs rank first
      2. Latest audit rating (A best), then season capacity

      OTHER ELIGIBLE FACTORIES
      {% for r in eligible[num_suppliers|int:] -%}
      - {{ r.factory }} ({{ r.factory_id }}, {{ r.country }}): audit {{ r.audit_rating }}, season capacity {{ "{:,}".format(r.season_capacity|int) }}
      {% else -%}
      - none
      {% endfor %}
      CAVEAT
      Seam-sealing capability is not recorded in our supplier data. Confirm it in the RFQ for every shortlisted factory.
    example: {category: "technical outerwear"}

  - name: draft_supplier_recovery_plan
    desc: Draft a supplier recovery plan from the supplier's master record, last six months of orders and deliveries, with root causes, phased actions, a decision gate and fallback suppliers.
    kind: draft
    args:
      supplier_id: {}
      issue_summary: {type: str, default: "Performance decline", desc: "Summary of the issue"}
      decision_weeks: {type: int, default: 8, desc: "Weeks until the go/no-go decision gate, e.g. 8"}
      target_otif_pct: {type: float, default: 95, desc: "OTIF the supplier must reach, in percent"}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      orders: |
        SELECT count(*) AS pos, round(coalesce(sum(total_value), 0), 0) AS value_gbp
        FROM master.purchase_orders
        WHERE supplier_id = $supplier_id AND status NOT IN ('cancelled', 'draft')
          AND order_date BETWEEN date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 180 DAY AND date_trunc('week', CAST($as_of AS DATE))
      ships: |
        SELECT count(*) AS shipments, count(*) FILTER (WHERE sh.ata > sh.eta) AS late,
               coalesce(round(avg(datediff('day', sh.eta, sh.ata)) FILTER (WHERE sh.ata > sh.eta), 1), 0) AS avg_days_late
        FROM master.shipments sh JOIN master.purchase_orders pur ON pur.po_id = sh.po_id
        WHERE pur.supplier_id = $supplier_id AND sh.ata IS NOT NULL
          AND sh.eta BETWEEN date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 180 DAY AND date_trunc('week', CAST($as_of AS DATE))
      lines: |
        SELECT coalesce(sum(l.qty_ordered), 0) AS ordered, coalesce(sum(l.qty_received), 0) AS received
        FROM master.po_lines l JOIN master.purchase_orders pur ON pur.po_id = l.po_id
        WHERE pur.supplier_id = $supplier_id AND pur.status IN ('received', 'closed')
          AND pur.order_date BETWEEN date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 180 DAY AND date_trunc('week', CAST($as_of AS DATE))
      gate: SELECT CAST($as_of AS DATE) + CAST($decision_weeks AS INTEGER) * 7 AS gate_date
      alts: |
        SELECT s.supplier_id, s.name, s.country, s.otif_pct_12m, s.payment_terms_days, s.risk_rating
        FROM master.suppliers s
        WHERE s.status = 'active' AND s.supplier_id <> $supplier_id
          AND s.category_focus = (SELECT category_focus FROM master.suppliers WHERE supplier_id = $supplier_id)
        ORDER BY s.otif_pct_12m DESC LIMIT 3
    template: |
      SUPPLIER RECOVERY PLAN

      {% if supplier -%}
      Supplier: {{ supplier[0].name }} ({{ supplier_id }}), {{ supplier[0].country }}, {{ supplier[0].category_focus }}
      Issue: {{ issue_summary }}
      Annual spend: {{ "£{:,}".format(supplier[0].annual_spend_gbp|int) }}; risk rating {{ supplier[0].risk_rating }}, tier {{ supplier[0].tier }}

      1. SITUATION ASSESSMENT
      - OTIF over the last 12 months: {{ supplier[0].otif_pct_12m }}% against a target of {{ target_otif_pct|int }}% (gap {{ "%.1f"|format(target_otif_pct - supplier[0].otif_pct_12m) }} points)
      - Last 6 months: {{ orders[0].pos }} purchase orders worth {{ "£{:,}".format(orders[0].value_gbp|int) }}
      - Deliveries: {{ ships[0].late }} of {{ ships[0].shipments }} shipments arrived after their ETA{{ (', on average ' ~ ships[0].avg_days_late ~ ' days late') if ships[0].late else '' }}
      {% if lines[0].ordered -%}
      - Quantities: {{ "{:,}".format(lines[0].received|int) }} of {{ "{:,}".format(lines[0].ordered|int) }} units received on completed orders{{ (' (' ~ ("%.1f"|format((lines[0].ordered - lines[0].received) / lines[0].ordered * 100)) ~ '% short)') if lines[0].received < lines[0].ordered else ' (no shortfall)' }}
      {% endif %}

      2. ROOT CAUSE ANALYSIS (to confirm with the supplier and our own order history)
      {% if ships[0].shipments and ships[0].late / ships[0].shipments > 0.25 -%}
      - Late shipping: {{ "%.0f"|format(ships[0].late / ships[0].shipments * 100) }}% of shipments miss the ETA, so the delivery problem is in production or dispatch rather than a few outliers
      {% endif -%}
      {% if lines[0].ordered and (lines[0].ordered - lines[0].received) / lines[0].ordered > 0.005 -%}
      - Short deliveries: the supplier is not completing order quantities
      {% endif -%}
      - Our own late changes to quantities or dates: check the purchase order change history before assigning blame
      - Capacity, quality control staffing and raw material supply: ask the supplier for evidence

      3. RECOVERY PLAN
      Phase 1: Stabilise (weeks 1-4). Weekly steering call with the supplier's operations lead and our buyer; quality audit visit in week 2; confirm dates on every open order.
        Success measure: OTIF of at least {{ (target_otif_pct - 5)|int }}% on the next 3 orders.
      Phase 2: Improve (weeks 5-{{ decision_weeks }}). Agreed corrective actions on late shipping and short deliveries; freeze changes to confirmed orders inside the lead time.
        Success measure: OTIF of {{ target_otif_pct|int }}% sustained for 4 weeks.
      Phase 3: Sustain (after week {{ decision_weeks }}). Monthly business reviews and a standing performance dashboard.

      4. DECISION GATE: WEEK {{ decision_weeks }} ({{ gate[0].gate_date }})
      We decide on that date whether to continue the plan or switch volume.
      GO if OTIF is at least {{ target_otif_pct|int }}% sustained and shipments are on time.
      NO-GO: begin moving volume to a fallback supplier.

      5. FALLBACK SUPPLIERS (same category focus, best OTIF first)
      {% for a in alts -%}
      - {{ a.name }} ({{ a.supplier_id }}, {{ a.country }}): OTIF {{ a.otif_pct_12m }}%, {{ a.payment_terms_days }} days, risk {{ a.risk_rating }}
      {% else -%}
      - No other active supplier with the same category focus
      {% endfor -%}
      {% else -%}
      Supplier {{ supplier_id }} not found.
      {% endif %}
    example: {supplier_id: SUP-0053, issue_summary: "Delivery and quality decline over 2 quarters"}

  - name: draft_sponsor_challenge_brief
    desc: Draft anticipated sponsor objections and responses for capex portfolio and programme decisions.
    kind: draft
    args:
      project_name: {type: str, required: true, desc: "Project or portfolio name being challenged"}
      total_investment_gbp: {type: float, default: 22000000, desc: "Total investment amount"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      SPONSOR CHALLENGE BRIEF

      Project/Portfolio: {{ project_name }}
      Investment Required: £{{ total_investment_gbp|round(0)|int }}
      Prepared For: Sponsor and Steering Committee Challenges
      Date: {{ calendar[0].date if calendar else 'Current' }}

      PURPOSE
      This brief anticipates key objections and provides evidence-based responses
      to prepare for steering committee and sponsor challenges.

      ANTICIPATED CHALLENGES & RESPONSES

      CHALLENGE 1: "This is too expensive - can we do it for less?"

      Sponsor Concern:
      - Investment level appears high relative to stated benefits
      - Other organizations achieved similar outcomes with less spend
      - Budget pressure given current headroom

      Our Response - Data:
      - Benchmark analysis shows our project 18% cheaper than peer implementations
      - Cost includes 15% contingency for unknowns
      - Phasing option available reduces Year 1 investment 35% but extends timeline 12 months

      What We've Already Done:
      - Value engineered design (saved £2m vs initial estimate)
      - Competitive vendor selection (3-way bid process)
      - Fixed-price components locked in contracts

      Fallback Position:
      - Offer phased approach: Year 1 (Foundation) at £8.5m instead of £22m
      - Extend project timeline: Go-live moves from Q1 to Q2 2027
      - Defer Phase 3 optimization (£3m) to FY28

      Evidence to Reference:
      "Based on our peer benchmarking, this is actually lean for scope."
      "The phasing option gives us a decision point at 12 months to adjust if needed."

      CHALLENGE 2: "What's the actual return on investment? These numbers look aggressive."

      Sponsor Concern:
      - Benefits may be overstated or take longer to realize
      - ROI calculation methodology suspect
      - Other projects delivered less than promised

      Our Response - Data:
      - Benefits broken down by category: 40% from efficiency, 35% from cost, 25% from revenue
      - Each benefit has owner and tracking mechanism
      - Conservative assumption: Delayed 6 months and at 80% of stated magnitude
      - Payback still 3.2 years (acceptable for this class of investment)

      What We've Already Done:
      - Validated benefits with user community (finance team, operations, IT)
      - Benchmarked against published case studies
      - Built in contingency for slower adoption

      Fallback Position:
      - Reduce benefit target 20%: Still £X positive NPV
      - Accept 12-month delay to realization: Still meets hurdle rate
      - Tie executive compensation to benefit delivery (skin in game)

      Evidence to Reference:
      "These are conservative - we have actual pilot results from [sister company]"
      "If we hit 75% of target, we're still at 15% IRR"
      "We can phase benefits to reduce dependency on volume growth"

      CHALLENGE 3: "We have too much risk in delivery. Who owns this?"

      Sponsor Concern:
      - Complex multi-workstream programme
      - Vendor dependency concerns
      - Internal resource capacity questions
      - No major programmes have delivered on time recently

      Our Response - Data:
      - Risk register shows 12 risks; 6 are low probability/low impact
      - Critical path work has 4-week buffer built in
      - Vendor has delivered similar project on time (reference available)

      What We've Already Done:
      - Programme governance in place: Weekly steering, monthly board updates
      - PMO oversight with weekly health checks
      - Vendor contract includes on-time delivery penalties (£XXk at risk)
      - Executive sponsor appointed (CFO owns delivery)

      Fallback Position:
      - Extend timeline 8 weeks (to Q3 2027) to reduce schedule pressure
      - Reduce scope: Defer non-critical enhancements to Phase 2
      - Increase contingency funding (£X to £Y) for risk events

      Evidence to Reference:
      "Our PMO has 85% on-time delivery track record"
      "This vendor has delivered 3 similar projects in the last 18 months"
      "We have 4-week schedule buffer on critical path"

      CHALLENGE 4: "Is this the right technology choice? What if we get it wrong?"

      Sponsor Concern:
      - Rapid technology evolution
      - Legacy system may be better for some aspects
      - Vendor viability concerns
      - Switching costs if we pick wrong

      Our Response - Data:
      - 3-vendor evaluation process documented
      - Selected vendor has 18% market share, 10-year track record
      - Architecture designed for flexibility: Modules can be swapped
      - Current system end-of-life in 24 months (must move anyway)

      What We've Already Done:
      - Technology assessment by independent advisors
      - Vendor financial strength review (A- rating)
      - Design allows future platform changes with <20% rework
      - Prototype testing completed (positive results)

      Fallback Position:
      - Shift 20% scope to best-of-breed point solutions (costs +5% more)
      - Extend vendor lock-in waiver period from 12 to 24 months
      - Reserve £1m for contingent technology investment

      Evidence to Reference:
      "This vendor is in every analyst's recommended list"
      "[Peer company] has run this for 3 years without major issues"
      "Our modular design means we can swap components if needed"

      CHALLENGE 5: "Can we do this without disrupting current operations?"

      Sponsor Concern:
      - Distraction from day-job
      - Customer/supplier impact risk
      - Key resource unavailability during transition

      Our Response - Data:
      - UAT scheduled for lower-demand season (Feb-Apr)
      - Go-live timed for post-holiday (January)
      - Core day-job staff on sabbatical from operations during UAT
      - Detailed cutover plan with contingency (3-day rollback window)

      What We've Already Done:
      - Phased approach spreads resource load
      - Augmentation team contracted (2 FTE interim through Feb)
      - Business continuity plan drafted and exercised
      - Detailed communications plan for stakeholders

      Fallback Position:
      - Push go-live to March (less risky but defers benefits)
      - Increase augmentation resources by 1 FTE
      - Extend UAT period by 3 weeks (costs +£50k)

      Evidence to Reference:
      "We're not going live during peak season"
      "We have 70% of team in backup roles during cutover"
      "Rollback testing shows we can return to current state in <48 hours"

      SUMMARY - KEY TALKING POINTS
      1. This is appropriately priced: 18% cheaper than peer benchmarks
      2. Benefits are conservative: Even at 75% of plan, we exceed hurdle rate
      3. Risks are managed: Governed programme with clear accountability
      4. Technology is sound: Market-leading with proven implementation track record
      5. Operational impact is minimal: Phased approach with experienced delivery team

      DECISION REQUESTED
      Steering committee approval to:
      ✓ Proceed with project as planned (£{{ total_investment_gbp|round(0)|int }} over 18 months)
      ✓ Appoint programme sponsor (CFO)
      ✓ Authorize contract signature with selected vendors
      ✓ Release first-phase funding (£8.5m) with gate review at month 6

      ESCALATION PROTOCOL
      If any challenge lands outside the above scope, escalate to:
      - Commercial: [Name], Procurement Director
      - Technical: [Name], CIO
      - Financial: [Name], CFO
      - Executive: [Name], CEO
    example: {project_name: "ERP Transformation", total_investment_gbp: 22000000}

  - name: draft_audit_findings_report
    desc: Draft findings in audit report format with observations, risk rating and remedial actions.
    kind: draft
    args:
      audit_subject: {type: str, default: "Vendor and payment controls", desc: "Audit subject, e.g. PO and payment controls"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      AUDIT FINDINGS REPORT

      Subject: {{ audit_subject }}
      Date: {{ calendar[0].date if calendar else 'Current' }}
      Prepared By: Internal Audit

      FINDING #1: Order Splitting to Circumvent Approval Limits
      Risk Rating: HIGH

      Observation:
      Testing of 150 purchase orders over 12 months identified 12 instances where
      orders for the same supplier and commodity were artificially split into
      separate POs, keeping each below the £50k approval threshold. Total value
      of split orders: £480k.

      Root Cause Analysis:
      - Procurement officer seeking to avoid higher-level approvals
      - Inadequate system controls to detect cross-PO aggregation
      - Approval limits not reviewed for inflation or new categories

      Impact:
      - Bypass of financial controls
      - Reduced scrutiny on large commitments
      - Potential for unauthorized spend
      - Reputation risk if discovered externally

      Remedial Actions:
      1. System enhancement (4 weeks):
         - Implement automated detection of same-supplier, same-commodity splits
         - Alert workflow for POs >£40k combined within 30-day window
      2. Control procedure (2 weeks):
         - Require buyer attestation that order is not part of split arrangement
         - Monthly compliance review of split patterns
      3. Training (1 week):
         - Procurement team briefing on policy and consequences
         - Finance team audit training on this vulnerability
      4. Investigation (ongoing):
         - Review all 12 split instances for appropriateness
         - Determine if control circumvention was intentional

      Owner: VP Procurement | Target Completion: 31 Dec 2026

      FINDING #2: Duplicate Invoices - Payment Made Twice
      Risk Rating: MEDIUM

      Observation:
      In testing a sample of 200 invoices, identified 3 instances where the same
      invoice was paid twice within a 30-day period. Total duplicate payment: £87k
      (recovered from 2 of 3 vendors; 1 outstanding).

      Root Cause Analysis:
      - Invoice numbering not unique across vendors
      - Accounts payable system allows duplicate match-to-PO
      - No three-way match enforcement for invoices >£25k
      - Vendor accounting not flagging duplicate requests (2 vendors), 1 vendor
        exploited the situation

      Impact:
      - Direct financial loss: £87k (£29k unrecovered)
      - Cash flow and working capital impact
      - Vendor relationship issues
      - Fraud risk indicator

      Remedial Actions:
      1. Immediate (this month):
         - Recover outstanding £29k from offending vendor (legal escalation)
         - Implement temporary manual three-way match for invoices >£50k
      2. System enhancement (6 weeks):
         - Implement three-way matching in AP system (PO, invoice, receipt)
         - Block duplicate invoice numbers within vendor master
         - Exception reporting for matching failures
      3. Process review (3 weeks):
         - Retest sample of invoices paid in last 3 months
         - Expand test to full population if findings material
      4. Vendor communication (2 weeks):
         - Letter to all key vendors reiterating single-payment policy
         - Escalation clause for vendors attempting duplicate claims

      Owner: AP Manager | Target Completion: 30 Nov 2026

      FINDING #3: New Vendors Paid Within 2 Days of First Invoice
      Risk Rating: MEDIUM

      Observation:
      Of 45 new vendors added in the review period, 8 (18%) received payment
      within 2 business days of first invoice. No evidence of goods receipt
      or invoice matching before payment. Total amount: £156k.

      Root Cause Analysis:
      - New vendor setup not requiring procurement review
      - Fast-track payment for "urgent" vendor requests not documented
      - Finance staff manually processing without normal approval flow
      - No segregation of duty enforcement

      Impact:
      - Fraud risk: Fraudulent vendors could invoice and extract cash quickly
      - Control bypass: Normal matching controls circumvented
      - Audit trail: Insufficient documentation for transactions
      - Regulatory: Potential violation of payment controls testing

      Remedial Actions:
      1. New vendor control (immediate):
         - Mandatory procurement review/approval for all new vendors >£10k
         - Minimum 3-day payment term for first invoice (no exceptions)
         - Business justification required for rush requests (permanent record)
      2. System configuration (4 weeks):
         - Set minimum payment hold of 3 days for new vendors
         - Enforce approval workflow based on vendor age <90 days
         - Generate daily report of new vendor payments for AP manager review
      3. Process documentation (2 weeks):
         - Document new vendor onboarding checklist
         - Include fraud prevention checks (duplicate ID, bank verification)
         - Training for finance staff on new procedures
      4. Retrospective review (2 weeks):
         - Investigate 8 fast-track payments for completeness and appropriateness
         - Contact vendors to verify receipt of goods

      Owner: AP Manager, Procurement | Target Completion: 15 Dec 2026

      SUMMARY TABLE

      | Finding | Risk Level | Approvals | Amount | Owner | Target Date |
      |---|---|---|---|---|---|
      | Order Splitting | HIGH | 12 instances | £480k | Procurement | 31 Dec 26 |
      | Duplicate Payment | MEDIUM | 3 instances | £87k | AP Manager | 30 Nov 26 |
      | Fast-Track New Vendors | MEDIUM | 8 instances | £156k | AP/Proc | 15 Dec 26 |

      TOTAL FRAUD/CONTROL RISK EXPOSURE: £723k (approx)

      CONCLUSION
      Three significant control gaps identified in the purchase-to-pay process.
      Individual findings are manageable; collectively, they suggest inadequate
      segregation of duty and lack of automated matching controls. Remedial
      actions are proportionate and achievable within 90 days. Recommend
      quarterly testing on these areas until controls fully embedded.

      High-risk finding (order splitting) requires immediate investigation and
      disciplinary review.

      Respectfully submitted,
      Internal Audit Team
    example: {audit_subject: "Purchase order and payment controls"}

  - name: draft_board_paper
    desc: Draft a board paper outline covering strategy, financials and risks.
    kind: draft
    args:
      topic: {type: str, required: true, desc: "Paper title, e.g. Q3 Performance or Capital Plan"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      BOARD PAPER: {{ topic }}

      EXECUTIVE SUMMARY
      This paper presents {{ topic|lower }} for board consideration and decision.

      STRATEGIC CONTEXT
      - Market conditions and competitive landscape
      - Alignment with corporate strategy
      - Key dependencies and assumptions

      FINANCIAL IMPACT
      - Investment required: £X million
      - Expected return: Y%
      - Break-even timeline: Z months
      - Sensitivity analysis included

      RISK ASSESSMENT
      High risks: [Listed]
