id: documents
name: Documents
instructions: >
  Document generation and management. Draft tools create formatted documents
  from structured data and templates. Document ids look like DOC-000123.

tables: {}

tools:
  - name: draft_audit_findings_report
    desc: Draft findings in audit report format from audit data and observations.
    kind: draft
    args:
      - factory_id
      - audit_type: {type: enum, values: [social, quality, safety, compliance], default: social}
    sql:
      factory: SELECT * FROM master.factories WHERE factory_id = $factory_id
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = (SELECT supplier_id FROM master.factories WHERE factory_id = $factory_id)
    template: |
      AUDIT FINDINGS REPORT

      Factory: {{ factory[0].name if factory else 'Unknown' }}
      Audit Type: {{ audit_type|upper }}

      Key Findings:
      - Compliance gap identified in production records
      - Workforce management processes require documentation
      - Health and safety protocols in place

      Risk Rating: Medium
      Recommended Actions: Enhanced monitoring, follow-up audit within 90 days
    example: {factory_id: FAC-0001}

  - name: draft_bid_recommendation
    desc: Draft bid recommendation for a steering group with scoring and rationale.
    kind: draft
    args:
      - supplier_id
      - category: {type: str, desc: "Product category, e.g. packaging"}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      performance: SELECT COUNT(*) as po_count FROM master.purchase_orders WHERE supplier_id = $supplier_id
    template: |
      BID RECOMMENDATION

      Supplier: {{ supplier[0].name if supplier else 'Unknown' }}
      Category: {{ category }}

      SCORING SUMMARY
      Price Competitiveness: 8/10
      Quality Track Record: 9/10
      Delivery Performance: 7/10
      Financial Stability: 8/10

      Overall Score: 8.0/10

      RECOMMENDATION: AWARD

      This supplier demonstrates strong overall capability with competitive pricing.
      Previous order volume: {{ performance[0].po_count }} purchase orders
    example: {supplier_id: SUP-0001, category: textiles}

  - name: draft_board_paper
    desc: Draft a board paper outline covering strategy, financials and risks.
    kind: draft
    args:
      - topic: {type: str, required: true, desc: "Paper title, e.g. Q3 Performance or Capital Plan"}
      - fiscal_year: {type: str, default: "FY27", desc: "Fiscal year, e.g. FY27"}
    sql:
      fy_info: SELECT DISTINCT fy FROM master.calendar WHERE fy = $fiscal_year LIMIT 1
    template: |
      BOARD PAPER: {{ topic }}

      EXECUTIVE SUMMARY
      This paper presents {{ topic|lower }} for board consideration and decision.

      STRATEGIC CONTEXT
      - Market conditions and competitive landscape
      - Alignment with corporate strategy
      - Key dependencies and assumptions

      FINANCIAL IMPACT
      - Investment required: £X million
      - Expected return: Y%
      - Break-even timeline: Z months
      - Sensitivity analysis included

      RISK ASSESSMENT
      High risks: [Listed]
      Mitigation strategies: [Outlined]

      RECOMMENDATION
      The board is invited to approve the proposed approach.

      APPENDICES
      Detailed financial projections, risk register, implementation timeline
    example: {topic: "Capital Allocation £50m"}

  - name: draft_breach_notice
    desc: Draft formal notice of breach or delay for contract enforcement.
    kind: draft
    args:
      - po_id
      - breach_type: {type: enum, values: [late_delivery, quality, quantity, compliance], default: late_delivery}
    sql:
      po: SELECT * FROM master.purchase_orders WHERE po_id = $po_id
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = (SELECT supplier_id FROM master.purchase_orders WHERE po_id = $po_id)
    template: |
      FORMAL NOTICE OF BREACH

      Date: {{ '{now}'|format_date }}
      RE: Purchase Order {{ po[0].po_id if po else 'Unknown' }}

      To: {{ supplier[0].name if supplier else 'Unknown' }}

      This notice is issued pursuant to the terms of our supply contract.

      BREACH DETAILS
      Breach Type: {{ breach_type|upper }}
      PO Reference: {{ po[0].po_id if po else 'Unknown' }}
      Expected Delivery: {{ po[0].due_date if po else 'TBD' }}

      You have failed to meet the contractual obligations outlined above.

      REQUIRED ACTIONS
      1. Respond within 5 business days
      2. Provide remedial plan within 10 business days
      3. Implement corrective measures immediately

      Failure to comply may result in contract termination and legal action.

      Regards,
      Procurement Team
    example: {po_id: "PO-2026-004512", breach_type: late_delivery}

  - name: draft_business_review_pack
    desc: Draft supplier business review pack with scorecard, trends and opportunities.
    kind: draft
    args:
      - supplier_id
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      orders: SELECT COUNT(*) as total_orders, SUM(total_value) as total_spend FROM master.purchase_orders WHERE supplier_id = $supplier_id
    template: |
      BUSINESS REVIEW PACK

      Supplier: {{ supplier[0].name if supplier else 'Unknown' }}
      Review Period: Last 12 months
      Prepared: {{ '{now}'|format_date }}

      1. PERFORMANCE SCORECARD
      On-Time-In-Full (OTIF): {{ supplier[0].otif_pct_12m if supplier else 'N/A' }}%
      Quality Score: 9/10
      Responsiveness: 8/10
      Payment Terms Compliance: 10/10

      2. BUSINESS METRICS
      Total Orders: {{ orders[0].total_orders }}
      Total Spend: £{{ orders[0].total_spend|format_currency }}
      Average Order Value: £{{ (orders[0].total_spend / orders[0].total_orders)|format_currency }}

      3. PERFORMANCE TRENDS
      - OTIF improved 2% year-over-year
      - Quality incidents decreased by 15%
      - Lead times stable

      4. JOINT OPPORTUNITIES
      - Volume growth potential in new category
      - Logistics optimization
      - Joint sustainability initiatives

      5. MEETING FOCUS AREAS
      - Q4 planning and capacity confirmation
      - Strategic roadmap alignment
      - Cost reduction opportunities
    example: {supplier_id: SUP-0001}

  - name: draft_commodity_brief
    desc: Draft weekly commodity brief for the buying team on prices and trends.
    kind: draft
    args:
      - commodity: {type: str, required: true, desc: "Commodity name, e.g. cotton"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      WEEKLY COMMODITY BRIEF

      Week of: {{ calendar[0].date if calendar else 'Current week' }}
      Commodity: {{ commodity|upper }}

      PRICE SUMMARY
      Current Price: $USD per tonne (spot)
      Week Change: +2.3%
      YTD Change: -8.5%

      KEY NEWS & DRIVERS
      - Supply tightness in primary production regions
      - Strong forward demand from apparel sector
      - Weather impact on next season crop

      MARKET COMMENTARY
      Prices have risen following tighter supply forecasts.
      Expect continued volatility heading into Q4.

      RECOMMENDED ACTIONS
      1. Review hedging strategies for next month's purchases
      2. Confirm demand forecasts for production planning
      3. Monitor currency movements (GBP/USD impact)

      OUTLOOK
      6-month forecast: Stable to firm
      12-month forecast: Moderate decline expected Q2 2027

      NEXT BRIEF: {{ '{now}' }} + 7 days
    example: {commodity: cotton}

  - name: draft_commodity_summary
    desc: Draft commodity summary for category buyers on pricing and outlook.
    kind: draft
    args:
      - commodity: {type: str, required: true, desc: "Commodity name, e.g. polyester"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      COMMODITY SUMMARY: {{ commodity|upper }}

      CURRENT STATUS
      Price Level: Above 12-month average (+12%)
      Volatility: Moderate
      Liquidity: Good

      RECENT PRICE MOVES
      - Last week: +1.2%
      - Last month: -3.1%
      - Last 6 months: +7.8%

      SUPPLY & DEMAND
      Supply: Stable, with some regional tightness
      Demand: Firm from apparel and consumer goods
      Inventory: Adequate levels across supply chain

      FORECAST
      3-Month: Firm to rising, expect +2-5%
      6-Month: Stable pricing expected
      12-Month: Seasonal decline in Q2 2027

      KEY RISKS
      - Weather impact on raw material production
      - Currency volatility (USD/GBP)
      - Geopolitical supply disruptions

      COST EXPOSURE FOR OUR CATEGORY BUYERS
      High exposure: Basic knits, activewear, basics
      Medium exposure: Woven garments
      Low exposure: Premium / non-commodity products

      RECOMMENDED STRATEGY
      - Lock in 60% of Q4 requirements
      - Use forwards for Q1 2027
      - Monitor for better pricing in months 3-4
    example: {commodity: polyester}

  - name: draft_dispute_response
    desc: Draft a reply to a customer dispute with analysis and settlement position.
    kind: draft
    args:
      - customer_id
      - dispute_amount_gbp: {type: float, default: 10000, desc: "Disputed amount in GBP"}
    sql:
      customer: SELECT * FROM master.customers WHERE customer_id = $customer_id
    template: |
      DISPUTE RESPONSE

      Customer: {{ customer[0].segment if customer else 'Valued' }} customer
      Disputed Amount: £{{ dispute_amount_gbp|format_currency }}
      Date: {{ '{now}'|format_date }}

      SUMMARY OF POSITION
      We have reviewed your dispute regarding the above invoice.

      FACTS
      - Order was placed per agreed specification
      - Delivery completed on schedule
      - Product quality confirmed at receipt
      - Invoice raised per agreed pricing

      OUR ANALYSIS
      We believe our position is substantially correct based on:
      1. Signed delivery notes confirming receipt
      2. Service levels met per contract
      3. Price consistent with quotation dated {{ '{now}' }} - 90 days

      PROPOSED RESOLUTION
      While we stand behind our invoice, we value the customer relationship.
      We propose:
      - Full payment of invoice: £{{ dispute_amount_gbp|format_currency }}
      OR
      - Partial credit of 5% (£{{ (dispute_amount_gbp * 0.05)|format_currency }}) and full payment of balance

      This offer is valid for 10 business days.

      Please confirm your preference by return email.

      Regards,
      Collections Team
    example: {customer_id: CUS-001, dispute_amount_gbp: 480000}

  - name: draft_executive_briefing
    desc: Draft a briefing document for executives summarizing key findings and recommendations.
    kind: draft
    args:
      - topic: {type: str, required: true, desc: "Briefing topic, e.g. Supply Chain Risks"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      EXECUTIVE BRIEFING

      Topic: {{ topic }}
      Date: {{ calendar[0].date if calendar else 'Current' }}
      Prepared For: Executive Team

      SITUATION OVERVIEW
      {{ topic }} requires immediate attention due to emerging risks and opportunities.

      KEY FINDINGS
      1. Primary Issue: Performance gap vs plan in key metric
         - Current status: At risk
         - Trend: Declining over past 2 months
         - Root cause: Identified and documented

      2. Secondary Issue: Cost pressures
         - Impact: £X million exposure
         - Timeline: Immediate
         - Mitigation: Underway

      3. Opportunity: Potential value creation
         - Estimated benefit: £Y million
         - Implementation timeline: Q4 2026 - Q1 2027

      TOP PRIORITIES
      1. Stabilize current operations (Week 1)
      2. Implement remediation plan (Weeks 2-4)
      3. Exploit identified opportunity (Weeks 4+)

      DECISIONS REQUIRED
      - Approve reallocation of £X million budget
      - Endorse proposed remediation approach
      - Authorize engagement of external advisors

      NEXT STEPS
      Weekly steering committee meetings through Q4
      Detailed updates to board in December
    example: {topic: "Supply Chain Risks - Q3 Review"}

  - name: draft_highlight_report
    desc: Draft a programme highlight report covering status, risks and decisions needed.
    kind: draft
    args:
      - programme_name: {type: str, required: true, desc: "Programme name, e.g. ERP Transformation"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      HIGHLIGHT REPORT

      Programme: {{ programme_name }}
      Period: {{ calendar[0].fy_period if calendar else '1' }}/12
      Date: {{ calendar[0].date if calendar else 'Current' }}
      Status: ON TRACK

      EXECUTIVE SUMMARY
      {{ programme_name }} is on track for delivery. Current focus is on [phase].

      SCOPE
      Status: GREEN - No changes this period
      Scope baseline maintained. All workstreams progressing as planned.

      SCHEDULE
      Status: AMBER - Minor slip identified
      Overall timeline: On track for planned go-live
      Key milestones this month:
      - Design review: Completed 29 Oct
      - Build phase start: 02 Nov (on plan)
      - UAT preparation: 09 Nov (on track)

      BUDGET
      Status: GREEN - Within tolerance
      Spend to date: £X.Xm of £Y.Ym budget (70%)
      Forecast: £Y.Ym (within ±5% tolerance)

      KEY RISKS (Top 5)
      1. AMBER - External system dependency (Owner: Tech Lead)
         Mitigation: Weekly sync scheduled, backup plan in place

      2. AMBER - Resource availability (Owner: PMO)
         Mitigation: Recruitment in final stages, contractors engaged

      3. GREEN - Data migration complexity (Owner: Data Lead)
         Status: Complexity validated, approach confirmed

      DECISIONS REQUIRED
      1. Approve extended testing timeline (Cost: +£0.2m)
      2. Confirm go-live date: 15 Jan 2027
      3. Release contingency reserve (£0.5m) for risk mitigation

      NEXT REPORT
      Next highlight report: {{ '{now}' }} + 30 days
    example: {programme_name: "ERP Transformation Programme"}

  - name: draft_improvement_programme_plan
    desc: Draft joint improvement programme plan with supplier to achieve specific targets.
    kind: draft
    args:
      - supplier_id
      - improvement_goal: {type: str, default: "reduce lead time by 20%", desc: "Improvement target"}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
    template: |
      JOINT IMPROVEMENT PROGRAMME PLAN

      Supplier: {{ supplier[0].name if supplier else 'Unknown' }}
      Goal: {{ improvement_goal }}
      Duration: 12 months
      Governance: Monthly steering committee

      1. CURRENT STATE ASSESSMENT
      Baseline lead time: 45 days
      Current OTIF: {{ supplier[0].otif_pct_12m if supplier else 'TBD' }}%
      Key constraints: Production scheduling, raw material procurement

      2. IMPROVEMENT INITIATIVES

      Initiative A: Production Capacity
      - Objective: Increase throughput 15%
      - Owner: Supplier Operations
      - Timeline: Months 1-6
      - Investment required: £X
      - Expected benefit: 8 days reduction

      Initiative B: Supply Chain Synchronization
      - Objective: Align forecast accuracy to 95%
      - Owner: Shared Procurement
      - Timeline: Months 1-3
      - Investment required: £Y
      - Expected benefit: 7 days reduction

      Initiative C: Process Automation
      - Objective: Reduce manual touchpoints 40%
      - Owner: Supplier, supported by our IT
      - Timeline: Months 4-12
      - Investment required: £Z
      - Expected benefit: 5 days reduction

      3. GOVERNANCE & MONITORING
      - Monthly steering meetings with clear agenda
      - KPI dashboard shared real-time
      - Quarterly health checks and replanning
      - Risk escalation process defined

      4. BENEFITS REALIZATION
      Month 6: Expected 10-day lead time reduction (50%)
      Month 12: Full 20-day reduction (target achieved)

      5. SUCCESS FACTORS
      - Executive commitment from both organizations
      - Adequate resource allocation
      - Transparent communication
      - Flexibility to pivot if conditions change

      6. CONTINGENCY
      If progress lags, escalate to senior management and review approach.
    example: {supplier_id: SUP-0001, improvement_goal: "reduce lead time by 20%"}

  - name: draft_incident_summary
    desc: Draft an incident summary for operational leadership documenting what happened.
    kind: draft
    args:
      - incident_type: {type: enum, values: [security, operational, quality, safety, financial], required: true}
      - site_id: {type: str, desc: "Site affected, e.g. DC1"}
    sql:
      site: SELECT * FROM master.sites WHERE site_id = $site_id
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      INCIDENT SUMMARY

      Incident Type: {{ incident_type|upper }}
      Site: {{ site[0].name if site else 'Unknown' }} ({{ site_id }})
      Date Detected: {{ calendar[0].date if calendar else 'Current' }}
      Report Date: {{ calendar[0].date if calendar else 'Current' }}

      INCIDENT OVERVIEW
      On {{ calendar[0].date if calendar else 'the stated date' }}, a {{ incident_type }} incident was identified.
      Current status: CONTAINED AND UNDER INVESTIGATION

      TIMELINE OF EVENTS
      06:00 - Incident detected during operations
      06:15 - Initial containment measures initiated
      06:45 - Root cause investigation commenced
      07:30 - Escalation to site management
      08:00 - Business continuity plan activated

      ROOT CAUSE
      [To be completed] Preliminary assessment suggests [issue category].
      Full RCA planned for completion within 5 working days.

      IMMEDIATE ACTIONS TAKEN
      1. Isolated affected area/system
      2. Notified relevant stakeholders
      3. Implemented workaround procedures
      4. Engaged specialized teams as required

      IMPACT ASSESSMENT
      - Operational impact: [Minimal / Moderate / High]
      - Financial impact: £X estimate
      - Regulatory impact: [Yes / No]
      - Reputational risk: [Low / Medium / High]

      NEXT STEPS
      1. Complete root cause analysis (Target: 3 Oct)
      2. Implement permanent corrective action (Target: 10 Oct)
      3. Test recovery procedures (Target: 13 Oct)
      4. Debrief and lessons learned (Target: 20 Oct)

      OWNER: [Name and title]
      ESCALATION: Available 24/7
    example: {incident_type: operational, site_id: DC1}

  - name: draft_investment_roadmap
    desc: Draft a sequenced roadmap document outlining investment priorities and timeline.
    kind: draft
    args:
      - investment_theme: {type: str, required: true, desc: "Theme, e.g. Automation or Network"}
      - budget_million_gbp: {type: float, default: 50, desc: "Total budget in £ millions"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      INVESTMENT ROADMAP

      Theme: {{ investment_theme }}
      Planning Period: FY27-FY29
      Total Budget: £{{ budget_million_gbp }}m
      Prepared: {{ calendar[0].date if calendar else 'Current' }}

      STRATEGIC CONTEXT
      This roadmap outlines our {{ investment_theme|lower }} investments to support:
      - Operational excellence
      - Cost competitiveness
      - Capability for future growth

      PHASE 1: FOUNDATION (FY27 Q1-Q2 | £15m)
      Focus: Baseline assessment and quick wins
      Projects:
      - Baseline assessment and planning: £2m
      - Quick-win efficiency projects: £8m
      - Capability building: £5m

      Deliverables:
      - Detailed business case for Phases 2-3
      - Foundation infrastructure in place
      - Team capability assessed and gaps identified

      PHASE 2: EXPANSION (FY27 Q3 - FY28 Q2 | £25m)
      Focus: Core capability delivery
      Projects:
      - Core platform implementation: £15m
      - Process redesign and change: £7m
      - Team expansion: £3m

      Expected Benefits:
      - 20% efficiency improvement
      - 30% cost reduction in targeted area
      - Improved quality metrics

      PHASE 3: OPTIMIZATION (FY28 Q3 - FY29 Q2 | £10m)
      Focus: Full deployment and optimization
      Projects:
      - Extended deployment: £6m
      - Advanced analytics: £2m
      - Continuous improvement: £2m

      Full Benefit Realization:
      - 35% total efficiency gain
      - 45% cost reduction vs baseline
      - Enhanced competitive position

      CRITICAL DEPENDENCIES
      1. Technology platform readiness (External risk)
      2. Organization capability development (Internal)
      3. Market stability (External)

      DECISION GATES
      - Phase 1 completion review: May 2027
      - Phase 2 go/no-go: September 2027
      - Phase 3 start: January 2028

      This roadmap will be reviewed and updated quarterly.
    example: {investment_theme: Automation, budget_million_gbp: 50}

  - name: draft_leadership_summary
    desc: Draft a leadership summary document covering performance, risks and priorities.
    kind: draft
    args:
      - reporting_period: {type: str, default: "September 2026", desc: "Period, e.g. September 2026"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      LEADERSHIP SUMMARY

      Period: {{ reporting_period }}
      Prepared: {{ calendar[0].date if calendar else 'Current' }}
      Audience: Executive Team

      HEADLINE PERFORMANCE
      Overall performance: ON PLAN with notable variance in two areas

      Key Metrics Status:
      - Revenue: £X.Xm (Plan: £X.Xm, Variance: +2%)
      - Operating Profit: £Y.Ym (Plan: £Y.Ym, Variance: -8%)
      - Inventory: £Z.Zm (Plan: £Z.Zm, Variance: +5%)
      - Service Level: 96.2% (Plan: 97%, Variance: -0.8pp)

      TOP 5 ISSUES
      1. PROFIT PRESSURE - Operating profit £1.2m below plan
         Root cause: Volume miss and cost inflation
         Action: Cost reduction project launched, benefits expected Q4
         Owner: CFO

      2. SUPPLY CHAIN DISRUPTION - One key supplier at risk
         Root cause: Production issues + quality problems
         Action: Dual sourcing plan in execution
         Owner: Head of Procurement

      3. INVENTORY AGING - DC stock levels elevated
         Root cause: Demand forecast miss and slower sell-through
         Action: Markdown and clearance programme implemented
         Owner: Merchandising Director

      4. LABOR AVAILABILITY - Warehouse staffing at 88%
         Root cause: Market-wide shortage + competitive rates
         Action: Retention bonus program and agency onboarding
         Owner: HR Director

      5. TECHNOLOGY DEBT - System performance degradation
         Root cause: ERP post go-live tuning
         Action: Technical enhancement roadmap approved
         Owner: CIO

      PRIORITIES FOR NEXT 30 DAYS
      1. Restore operating profit trajectory
      2. Stabilize supplier production
      3. Execute inventory clearance
      4. Close workforce gap to 95%
      5. Deploy ERP performance improvements

      DECISIONS NEEDED
      - Approve £2m investment in supply chain resilience
      - Confirm cost reduction target of £3m for FY27
      - Release contingency budget for market conditions

      OUTLOOK
      Q4 expected to be challenging given current conditions.
      January onwards should see improvement.
    example: {reporting_period: "September 2026"}

  - name: draft_management_accounts_commentary
    desc: Draft variance commentary for the management accounts explaining key variances.
    kind: draft
    args:
      - variances_summary: {type: str, default: "Operating profit variance", desc: "Summary of key variances"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      MANAGEMENT ACCOUNTS COMMENTARY

      Month: {{ calendar[0].fy_period if calendar else '1' }}
      Date: {{ calendar[0].date if calendar else 'Current' }}
      Variance Focus: {{ variances_summary }}

      OPERATING PROFIT VARIANCE: £(1.8)m (7% unfavorable)

      Analysis by Driver:

      VOLUME VARIANCE: £(2.1)m
      Customer demand was £0.9m below forecast due to:
      - Retail sector slowdown (-2%)
      - Stock clearance impact at key customers (-1%)
      Partially offset by online channel outperformance (+1%).

      Outlook: Expect recovery in Q4 based on forward orders.

      PRICE/MIX VARIANCE: £(1.2)m
      - Product mix unfavorable due to clearance activity: (£0.8)m
      - Promotional intensity higher than plan: (£0.4)m
      Offset by channel mix benefit: +£0.2m

      Outlook: Q4 should see better mix with full-price selling.

      COST VARIANCE: £(0.3)m
      - Freight costs +8% due to rate inflation: (£0.6)m
      - Favorable labor productivity: +£0.3m
      Net unfavorable due to transport headwinds.

      Outlook: Freight moderating in Q4; labor plan maintained.

      FAVORABLE ITEMS: £2.7m
      - Manufacturing overhead absorption better than plan: +£1.1m
      - Favorable foreign exchange: +£0.8m
      - One-off gain on asset disposal: +£0.8m

      SUMMARY & MITIGATION
      Core operating profit before one-offs: £(0.4)m unfavorable
      Primary driver: Volume miss partially offset by cost discipline

      Mitigating Actions Underway:
      1. Cost reduction program targeting 2% of COGS
      2. Volume recovery initiatives in Q4
      3. SKU rationalization to improve mix

      OUTLOOK & ASSUMPTIONS
      - Q4 volume recovery of 1-2% vs Q3
      - Freight rate stabilization (currently expected)
      - Full-year profit expected to recover to plan

      Items flagged as unexplained: None significant

      View: Overall trading environment remains challenging but manageable
      with current mitigation programs in place.
    example: {variances_summary: "Operating profit and cost drivers"}

  - name: draft_market_entry_brief
    desc: Draft a market entry brief from internal documents covering regulations and demand.
    kind: draft
    args:
      - market_country: {type: str, required: true, desc: "Country name, e.g. Poland"}
      - product_category: {type: str, default: "home range", desc: "Product category"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      MARKET ENTRY BRIEF

      Market: {{ market_country }}
      Category: {{ product_category }}
      Prepared: {{ calendar[0].date if calendar else 'Current' }}
      Recommendation: PROCEED with detailed feasibility study

      MARKET OVERVIEW
      Population: [Data from research]
      GDP per capita: [Data from research]
      Retail market size: £X billion
      Growth rate: Y% CAGR

      REGULATORY & COMPLIANCE
      Labeling Requirements:
      - Language: Local language mandatory
      - Content warning: Food contact materials declaration required
      - Compliance marks: CE mark required for products

      Import & Tariffs:
      - Tariff rate: [X%] on textiles and home goods
      - Rules of origin: EU/UK goods treated as [terms]
      - Lead time: 4-6 weeks typical clearance

      Product Standards:
      - Local safety standards align with EU requirements
      - No additional testing needed for core range
      - Textiles testing required for chemical compliance

      Labeling & Language:
      - All packaging must include local language
      - Price displayed in local currency
      - Consumer rights information mandatory

      CONSUMER PREFERENCES
      Style Preferences:
      - More muted color palette preferred
      - Sustainability messaging resonates strongly
      - Brand recognition: Limited (build required)

      Price Points:
      - Premium segment: €25-40 for home accessories
      - Mass market: €12-20
      - Our typical price point: Competitive in premium segment

      Retail Margins:
      - Department stores: 35-40% margin
      - Specialty retail: 45-50% margin
      - Online: 25-30% margin

      PRODUCT MODIFICATION REQUIRED
      Items requiring change:
      - Packaging design (language and sizing)
      - Color range (darker palettes more popular)
      - Size scaling (local preferences)

      Items NOT requiring change:
      - Core product specifications
      - Quality standards
      - Sustainability claims

      ENTRY STRATEGY
      Phase 1 (Months 1-6): Market assessment and partnership development
      - Identify potential retail partners
      - Conduct detailed consumer research
      - Finalize product modifications

      Phase 2 (Months 7-12): Soft launch with key partners
      - Launch with 2-3 major retailers
      - Limited SKU range (core products only)
      - Heavy marketing support

      Phase 3 (Months 13-24): Expansion
      - Full range availability
      - Extended retail footprint
      - E-commerce platform launch

      FINANCIAL PROJECTION
      Year 1: Limited, break-even focus
      Year 2: £X million revenue, 5% margin
      Year 3: £Y million revenue, 10% margin

      RISKS & MITIGATIONS
      Risk 1: Brand awareness (Low awareness)
         Mitigation: Partner with established local retailers for credibility
      Risk 2: Supply chain complexity (4+ week lead times)
         Mitigation: Build safety stock for initial period
      Risk 3: Currency exposure (GBP/PLN volatility)
         Mitigation: Local production sourcing for Phase 2+

      RECOMMENDATION
      Proceed with Phase 1 market study. Expected investment: £200k
      Decision gate: Month 6 (continue / pivot / exit)
    example: {market_country: Poland, product_category: "home range"}

  - name: draft_negotiation_brief
    desc: Draft two-page negotiation brief covering leverage, benchmarks and strategy.
    kind: draft
    args:
      - supplier_id
      - negotiation_type: {type: enum, values: [price, terms, capacity, quality], default: price}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      portfolio: SELECT COUNT(*) as po_count, SUM(total_value) as total_spend FROM master.purchase_orders WHERE supplier_id = $supplier_id
    template: |
      NEGOTIATION BRIEF

      Supplier: {{ supplier[0].name if supplier else 'Unknown' }}
      Type: {{ negotiation_type|upper }} NEGOTIATION
      Meeting Date: [To be scheduled]
      Attendees: [Buyer, Category Manager, Supplier account team]

      1. OUR POSITION

      Leverage: STRONG
      - Our annual spend: £{{ portfolio[0].total_spend if portfolio else 'X'|format_currency }}
      - Share of their volume: Approximately 8-12%
      - Multi-year relationship with growth potential
      - Alternative suppliers available (3+ options identified)

      Performance Track Record:
      - OTIF: {{ supplier[0].otif_pct_12m if supplier else 'N/A' }}%
      - Quality rating: [Good/Fair/Poor]
      - On-time payments: Consistently [X] days early

      2. MARKET BENCHMARKS

      Price Benchmark:
      - Current rate: £X per unit
      - Market range: £Y-Z per unit
      - Target: £W per unit (-3% vs current)

      Payment Terms:
      - Current: [X days]
      - Market standard: [Y days]
      - Our request: [Z days]

      Volume Commitment:
      - Current: [X,000 units annually]
      - Forecast growth: [+Y%]
      - Supplier capacity: Confirmed adequate

      3. WHAT THEY WILL ASK FOR
      Volume commitments beyond current levels (+10%)
      Extended payment terms (negotiate defensively)
      Price increases for raw materials (expect +1-2%)
      Exclusive arrangements for new products

      4. WHAT WE CAN TRADE
      Volume Growth:
      - Offer: +5% volume growth over 2 years
      - Benefit to them: Improved capacity utilization
      - Linkage: Conditional on price reduction

      Extended Payment Terms:
      - Offer: Increase to [Y days] if they achieve OTIF >98%
      - Benefit: Improved cash flow
      - Conditions: Performance-linked escalation clauses

      Multi-Year Agreement:
      - Offer: 3-year framework vs annual
      - Benefit: Supply certainty
      - Conditions: Price locked, volume commitments

      Collaborative Improvement:
      - Offer: Joint cost reduction projects (value-add supply)
      - Benefit: Access to our expertise
      - Expect: 50/50 benefit sharing

      5. OUR BEST ALTERNATIVE (BATNA)
      If negotiation deadlocks:
      - Switch 30% volume to Supplier B (CAR-XXX)
      - Lead time impact: Minimal (2-week delay)
      - Cost impact: Neutral (equivalent pricing)
      - Timeline: 90-day transition window

      Threat credibility: HIGH (we've executed similar transitions before)

      6. NEGOTIATION STRATEGY

      Opening Position:
      - Lead with our growth opportunity (+10% volume)
      - Request: 5% price reduction + extended terms
      - Frame: "Win-win for both organizations"

      Key Messages:
      - "We value your partnership and want to grow together"
      - "To do that, we need to optimize costs"
      - "Our mutual success requires competitive positioning"

      Negotiation Tactics:
      - Start with non-price items (terms, service)
      - Save price for middle/late discussion
      - Use their benchmarking data when available
      - Avoid anchoring to unrealistic numbers

      Walk-Away Position:
      - Minimum price reduction: 2.5%
      - Unacceptable: Any price increase
      - Flexibility: +3% if legitimate input cost increases

      Deal Structure:
      Target: 3-year agreement with quarterly reviews
      Price: Fixed for Year 1, indexed to material costs in Y2-Y3
      Volume: Base + up to +10% contingent on demand
      Terms: Net 60 (vs current Net 45)
      Quality: OTIF >97%, quality claims <0.2%

      Authority to commit: Up to 10% above ask on terms if price target achieved

      7. POST-NEGOTIATION
      Expected outcome: [Acceptable range]
      Next review: [12 months]
      Escalation point: Director level if impasse by [Date]

      ---
      This brief is confidential and for authorized negotiators only.
    example: {supplier_id: SUP-0001, negotiation_type: price}
