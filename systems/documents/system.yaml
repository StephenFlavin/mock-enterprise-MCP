  - name: draft_improvement_programme_plan
    desc: Draft a joint supplier improvement programme plan from the supplier's current lead times and open orders, with the target in days, milestones and what each side commits.
    kind: draft
    args:
      supplier_id: {}
      improvement_goal: {type: str, default: "reduce lead time by 20%", desc: "Improvement target in words"}
      target_reduction_pct: {type: float, default: 20, desc: "Lead time reduction wanted, in percent"}
      programme_weeks: {type: int, default: 26, desc: "Length of the programme in weeks"}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      lead: |
        SELECT count(*) AS skus, round(avg(lead_time_days), 0) AS avg_days, min(lead_time_days) AS min_days, max(lead_time_days) AS max_days
        FROM master.products WHERE supplier_id = $supplier_id
      cats: |
        SELECT category, count(*) AS skus, round(avg(lead_time_days), 0) AS avg_days
        FROM master.products WHERE supplier_id = $supplier_id GROUP BY category ORDER BY avg_days DESC, skus DESC LIMIT 3
      po: |
        SELECT count(*) AS pos, round(avg(datediff('day', order_date, due_date)), 0) AS order_to_due_days
        FROM master.purchase_orders WHERE supplier_id = $supplier_id AND status <> 'cancelled'
          AND order_date BETWEEN date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 365 DAY AND date_trunc('week', CAST($as_of AS DATE))
      openpo: |
        SELECT count(*) AS pos, round(coalesce(sum(total_value), 0), 0) AS value_gbp
        FROM master.purchase_orders WHERE supplier_id = $supplier_id AND status IN ('open', 'confirmed', 'shipped')
    template: |
      JOINT IMPROVEMENT PROGRAMME PLAN

      {% if supplier and lead[0].skus -%}
      Supplier: {{ supplier[0].name }} ({{ supplier_id }}), {{ supplier[0].country }}
      Goal: {{ improvement_goal }}
      {% set base = lead[0].avg_days|int -%}
      {% set target = (base * (1 - target_reduction_pct / 100))|round|int -%}

      1. CURRENT STATE
      - Standard lead time across {{ lead[0].skus }} SKUs: {{ base }} days on average (range {{ lead[0].min_days }} to {{ lead[0].max_days }})
      - Actual order-to-due time on our last 12 months of orders ({{ po[0].pos }} orders): {{ po[0].order_to_due_days|int }} days
      - Target: {{ target }} days, a cut of {{ base - target }} days ({{ target_reduction_pct|int }}%)
      - OTIF over 12 months: {{ supplier[0].otif_pct_12m }}%; payment terms {{ supplier[0].payment_terms_days }} days
      - Pilot scope, longest lead times first:
      {% for c in cats -%}
        - {{ c.category }}: {{ c.skus }} SKUs, {{ c.avg_days|int }} days
      {% endfor %}
      2. WORKSTREAMS
      A. Material and trim pre-positioning: hold agreed fabric and trim stock for forecast demand
      B. Production scheduling: reserve line capacity and release orders in fixed weekly windows
      C. Quality at source: inline inspection to remove rework and re-inspection time
      D. Transport: booked shipping slots and consolidated loads

      3. MILESTONES ({{ programme_weeks }}-week programme)
      - Week 2: baseline lead time mapped step by step with the supplier, owners named
      - Week {{ (programme_weeks * 0.25)|round|int }}: pilot range running at {{ base - ((base - target) * 0.25)|round|int }} days
      - Week {{ (programme_weeks * 0.5)|round|int }}: {{ base - ((base - target) * 0.6)|round|int }} days, review of what has worked
      - Week {{ programme_weeks }}: {{ target }} days across the range, roll out and hand over to business as usual

      4. WHAT THE SUPPLIER NEEDS FROM US
      - Rolling forecast: {{ openpo[0].pos }} open orders worth {{ "£{:,}".format(openpo[0].value_gbp|int) }} today, shared weekly
      - Freeze on changes to confirmed orders inside the lead time
      - Prompt payment on the agreed {{ supplier[0].payment_terms_days }} days, and technical support from our quality team

      5. BENEFITS
      - {{ base - target }} fewer days of stock in transit and on order per order cycle
      - Lower safety stock and faster response to demand changes
      {% else -%}
      Supplier {{ supplier_id }} not found or has no SKUs.
      {% endif %}
    example: {supplier_id: SUP-0046, improvement_goal: "reduce lead time by 20%"}

