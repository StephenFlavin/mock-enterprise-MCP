  - name: draft_bid_recommendation
    desc: Draft a bid recommendation for a steering group from the evaluated three-year costs, showing the saving of the recommended bidder against the runner-up and the cheapest headline bid.
    kind: draft
    args:
      category: {type: str, required: true, desc: "Category or contract type being evaluated, e.g. Warehouse cleaning"}
      recommended_bidder: {type: str, required: true, desc: "Name of the bidder recommended"}
      recommended_total_gbp: {type: float, desc: "Three-year total cost of the recommended bid in GBP, hidden costs included"}
      runner_up_bidder: {type: str, desc: "Name of the second-best bidder"}
      runner_up_total_gbp: {type: float, desc: "Three-year total cost of the runner-up in GBP"}
      cheapest_headline_bidder: {type: str, desc: "Bidder with the lowest headline price, if not the recommended one"}
      bid_summary: {type: str, default: "Evaluation complete", desc: "Summary of the evaluation: price, service levels, references, risks"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      BID RECOMMENDATION

      Category: {{ category|upper }}
      Date: {{ calendar[0].date if calendar else 'Current' }}
      Status: RECOMMENDATION TO STEERING GROUP

      RECOMMENDATION
      Award the {{ category }} contract to {{ recommended_bidder }}.
      {% if recommended_total_gbp is not none -%}
      Three-year total cost including hidden costs: {{ "£{:,}".format(recommended_total_gbp|int) }}
      {% endif -%}
      {% if recommended_total_gbp is not none and runner_up_bidder and runner_up_total_gbp is not none -%}
      Runner-up: {{ runner_up_bidder }} at {{ "£{:,}".format(runner_up_total_gbp|int) }}, which is {{ "£{:,}".format((runner_up_total_gbp - recommended_total_gbp)|int) }} ({{ "%.1f"|format((runner_up_total_gbp - recommended_total_gbp) / runner_up_total_gbp * 100) }}%) more over three years.
      {% endif -%}
      {% if cheapest_headline_bidder and cheapest_headline_bidder != recommended_bidder -%}
      Note: {{ cheapest_headline_bidder }} has the lowest headline price but is not recommended because of hidden costs and service risk.
      {% endif %}
      EVALUATION SUMMARY
      {{ bid_summary }}

      RISKS AND MITIGATION
      - Price review clause: cap the annual uplift in the contract
      - Service continuity: monthly service-level audit with credits for misses
      - References: confirm the references before signature

      STEERING GROUP DECISION REQUIRED
      [ ] Approve {{ recommended_bidder }} as the {{ category }} supplier
      [ ] Authorise contract negotiation and signature
    example: {category: "Warehouse cleaning", recommended_bidder: "Gleam Industrial Ltd", recommended_total_gbp: 328294, runner_up_bidder: "Meridian Hygiene Group", runner_up_total_gbp: 361182, bid_summary: "Best three-year cost and references"}

  - name: draft_breach_notice
    desc: Draft a formal notice of breach for a late purchase order, stating the supplier, due date, days late, units and value outstanding, and the response and remedy deadlines.
    kind: draft
    args:
      po_id: {}
      contract_id: {type: str, desc: "Supply contract reference, e.g. CTR-000045"}
      response_days: {type: int, default: 5, desc: "Business days the supplier has to respond"}
      cure_days: {type: int, default: 10, desc: "Days the supplier has to deliver a remedial plan"}
    sql:
      po: SELECT * FROM master.purchase_orders WHERE po_id = $po_id
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = (SELECT supplier_id FROM master.purchase_orders WHERE po_id = $po_id)
      lines: |
        SELECT coalesce(sum(qty_ordered), 0) AS ordered, coalesce(sum(qty_received), 0) AS received,
               coalesce(sum((qty_ordered - qty_received) * unit_cost), 0) AS outstanding_gbp
        FROM master.po_lines WHERE po_id = $po_id
      ship: SELECT status, eta FROM master.shipments WHERE po_id = $po_id ORDER BY etd DESC LIMIT 1
      dates: |
        SELECT CAST($as_of AS DATE) AS today, datediff('day', (SELECT due_date FROM master.purchase_orders WHERE po_id = $po_id), CAST($as_of AS DATE)) AS days_late,
               CAST($as_of AS DATE) + CAST($response_days AS INTEGER) AS respond_by, CAST($as_of AS DATE) + CAST($cure_days AS INTEGER) AS cure_by
    template: |
      FORMAL NOTICE OF BREACH

      Date: {{ dates[0].today }}
      RE: Purchase order {{ po[0].po_id if po else 'Unknown' }}{% if contract_id %} under supply contract {{ contract_id }}{% endif %}

      To: {{ supplier[0].name if supplier else 'Unknown' }}{% if supplier %} ({{ supplier[0].supplier_id }}){% endif %}

      This notice is issued under the terms of our supply contract.

      BREACH DETAILS
      PO reference: {{ po[0].po_id if po else 'Unknown' }}
      Contracted delivery date: {{ po[0].due_date if po else 'TBD' }}
      {% if po and dates[0].days_late > 0 -%}
      Days overdue: {{ dates[0].days_late }}
      {% endif -%}
      Order value: {{ "£{:,}".format(po[0].total_value|int) if po else '' }} for {{ "{:,}".format(po[0].total_units|int) if po else '' }} units
      {% if lines and lines[0].ordered -%}
      Units not received: {{ "{:,}".format((lines[0].ordered - lines[0].received)|int) }} of {{ "{:,}".format(lines[0].ordered|int) }}, worth {{ "£{:,}".format(lines[0].outstanding_gbp|int) }}
      {% endif -%}
      {% if ship -%}
      Shipment status: {{ ship[0].status }}, estimated arrival {{ ship[0].eta }}
      {% endif %}
      You have failed to deliver this order by the contracted date.

      REQUIRED ACTIONS
      1. Respond in writing by {{ dates[0].respond_by }} ({{ response_days }} days)
      2. Provide a remedial plan with a confirmed delivery date by {{ dates[0].cure_by }} ({{ cure_days }} days)
      3. Deliver the outstanding units without further delay

      We reserve all rights and remedies under the contract, including damages for delay, cancellation of the undelivered units and termination if the breach is not remedied.

      Regards,
      Procurement Team
    example: {po_id: "PO-2026-004301"}

  - name: draft_business_review_pack
    desc: Draft a supplier business review pack for the last quarter from the supplier's master record and orders, comparing scorecard results with SLA and proposing focus topics.
    kind: draft
    args:
      supplier_id: {}
      quarter_otif_pct: {type: float, desc: "Quarter OTIF from the scorecard, in percent, e.g. 85.4"}
      otif_sla_pct: {type: float, default: 95, desc: "OTIF service level in percent"}
      quarter_defect_pct: {type: float, desc: "Quarter AQL defect rate from the scorecard, in percent, e.g. 2.8"}
      defect_sla_pct: {type: float, default: 1.5, desc: "Maximum defect rate in percent"}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      orders: |
        SELECT count(*) AS pos, round(coalesce(sum(total_value), 0), 0) AS value_gbp, coalesce(sum(total_units), 0) AS units
        FROM master.purchase_orders
        WHERE supplier_id = $supplier_id AND status <> 'cancelled'
          AND order_date >= CAST(date_trunc('quarter', CAST($as_of AS DATE)) - INTERVAL 3 MONTH AS DATE) AND order_date < CAST(date_trunc('quarter', CAST($as_of AS DATE)) AS DATE)
      ships: |
        SELECT count(*) AS shipments, count(*) FILTER (WHERE sh.ata > sh.eta) AS late
        FROM master.shipments sh JOIN master.purchase_orders pur ON pur.po_id = sh.po_id
        WHERE pur.supplier_id = $supplier_id AND sh.ata IS NOT NULL
          AND sh.eta >= CAST(date_trunc('quarter', CAST($as_of AS DATE)) - INTERVAL 3 MONTH AS DATE) AND sh.eta < CAST(date_trunc('quarter', CAST($as_of AS DATE)) AS DATE)
      products: |
        SELECT count(*) AS skus, count(DISTINCT category) AS categories, string_agg(DISTINCT category, ', ') AS category_list
        FROM master.products WHERE supplier_id = $supplier_id
    template: |
      BUSINESS REVIEW PACK

      {% if supplier -%}
      Supplier: {{ supplier[0].name }} ({{ supplier_id }}), {{ supplier[0].country }}
      Review period: last completed quarter

      1. PERFORMANCE SCORECARD
      - OTIF over 12 months (master record): {{ supplier[0].otif_pct_12m }}%
      {% if quarter_otif_pct is not none -%}
      - OTIF this quarter: {{ quarter_otif_pct }}% against an SLA of {{ otif_sla_pct }}% ({{ "%.1f"|format(otif_sla_pct - quarter_otif_pct) }} points {{ 'below' if quarter_otif_pct < otif_sla_pct else 'above' }} SLA)
      {% endif -%}
      {% if quarter_defect_pct is not none -%}
      - Defect rate this quarter: {{ quarter_defect_pct }}% against a limit of {{ defect_sla_pct }}% ({{ 'breached' if quarter_defect_pct > defect_sla_pct else 'within limit' }})
      {% endif -%}
      - Risk rating {{ supplier[0].risk_rating }}, tier {{ supplier[0].tier }}, payment terms {{ supplier[0].payment_terms_days }} days

      2. ORDER PATTERN (last completed quarter)
      - {{ orders[0].pos }} purchase orders, {{ "{:,}".format(orders[0].units|int) }} units, {{ "£{:,}".format(orders[0].value_gbp|int) }}
      - {{ ships[0].late }} of {{ ships[0].shipments }} delivered shipments arrived after their ETA
      - Range with us: {{ products[0].skus }} SKUs in {{ products[0].category_list }}

      3. JOINT OPPORTUNITIES
      - Forecast sharing and fixed ordering windows to cut late order changes
      - Consolidated shipments to cut freight cost per unit
      - Quality at source: joint inspection plan for the highest-defect styles

      4. SUGGESTED FOCUS TOPICS FOR THE MEETING
      {% if quarter_otif_pct is not none and quarter_otif_pct < otif_sla_pct -%}
      1. Delivery: recover OTIF from {{ quarter_otif_pct }}% to the {{ otif_sla_pct }}% SLA
      {% else -%}
      1. Delivery: hold OTIF at or above SLA
      {% endif -%}
      {% if quarter_defect_pct is not none and quarter_defect_pct > defect_sla_pct -%}
      2. Quality: bring the defect rate from {{ quarter_defect_pct }}% back under {{ defect_sla_pct }}%
      {% else -%}
      2. Quality: keep the defect rate under {{ defect_sla_pct }}%
      {% endif -%}
      3. Ways of working: our order changes, payment performance and the joint opportunities above
      {% else -%}
      Supplier {{ supplier_id }} not found.
      {% endif %}
    example: {supplier_id: SUP-0012, quarter_otif_pct: 85.4, quarter_defect_pct: 2.8}

  - name: draft_commodity_brief
    desc: Draft the weekly commodity brief for the buying team from the supplied prices and news, working out the weekly and year-to-date moves and flagging moves above the alert threshold.
    kind: draft
    args:
      commodity: {type: str, required: true, desc: "Commodity name, e.g. cotton"}
      unit: {type: str, default: "GBP per tonne", desc: "Price unit, e.g. GBP per tonne"}
      price_now: {type: float, required: true, desc: "Price this week"}
      price_last_week: {type: float, desc: "Price a week ago"}
      price_year_start: {type: float, desc: "Price at the start of the year"}
      key_news: {type: str, desc: "Key news and drivers this week"}
      alert_threshold_pct: {type: float, default: 5, desc: "Weekly move in percent that triggers a faster response"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      WEEKLY COMMODITY BRIEF

      Commodity: {{ commodity|upper }}
      Week of: {{ calendar[0].date if calendar else 'Current' }}

      PRICE SUMMARY
      Price now: {{ price_now }} {{ unit }}
      {% if price_last_week -%}
      {% set w = (price_now - price_last_week) / price_last_week * 100 -%}
      Week change: {{ "%+.1f"|format(w) }}% (from {{ price_last_week }})
      {% endif -%}
      {% if price_year_start -%}
      {% set y = (price_now - price_year_start) / price_year_start * 100 -%}
      Year-to-date change: {{ "%+.1f"|format(y) }}% (from {{ price_year_start }})
      {% endif %}
      KEY NEWS AND DRIVERS
      {{ key_news or 'No significant news supplied' }}

      RECOMMENDED ACTIONS
      {% if price_last_week and (w|abs) >= alert_threshold_pct -%}
      1. ALERT: the weekly move of {{ "%+.1f"|format(w) }}% is above the {{ alert_threshold_pct }}% trigger. Escalate to the category lead and review open commitments today.
      {% else -%}
      1. Weekly move is inside the {{ alert_threshold_pct }}% alert threshold: no escalation needed.
      {% endif -%}
      {% if price_year_start and y > 10 -%}
      2. Price is well above the start of the year: review hedging cover for the next quarter.
      {% else -%}
      2. Review hedging and forward cover against the next month's purchases.
      {% endif -%}
      3. Confirm demand forecasts with planning before the next purchase.

      SUGGESTED ALERT TRIGGERS
      - Weekly move of {{ alert_threshold_pct }}% or more: same-day escalation
      - Move of {{ (alert_threshold_pct * 2)|round|int }}% or more over a month: refresh the buying plan
    example: {commodity: cotton, price_now: 1520, price_last_week: 1480, price_year_start: 1390, key_news: "Weak harvest forecast in the main growing regions"}

  - name: draft_commodity_summary
    desc: Draft a commodity summary for category buyers from the supplied price, 12-month average, outlook and drivers, working out price versus average and expected 6 and 12 month prices.
    kind: draft
    args:
      commodity: {type: str, required: true, desc: "Commodity name, e.g. polyester chips"}
      unit: {type: str, default: "GBP per tonne", desc: "Price unit, e.g. GBP per tonne"}
      current_price: {type: float, required: true, desc: "Current price in the given unit"}
      avg_12m_price: {type: float, desc: "12-month average price in the same unit"}
      outlook_6m_pct: {type: float, desc: "Analyst expected price change over 6 months, in percent, e.g. 3"}
      outlook_12m_pct: {type: float, desc: "Analyst expected price change over 12 months, in percent"}
      drivers: {type: str, desc: "Recent price drivers, e.g. weak harvest and strong demand"}
    sql:
      calendar: SELECT * FROM master.calendar WHERE date = CAST($as_of AS DATE) LIMIT 1
    template: |
      COMMODITY SUMMARY: {{ commodity|upper }}

      CURRENT STATUS
      Price: {{ current_price }} {{ unit }}
      {% if avg_12m_price -%}
      {% set d = (current_price - avg_12m_price) / avg_12m_price * 100 -%}
      Versus 12-month average ({{ avg_12m_price }}): {{ "%+.1f"|format(d) }}% ({{ 'above' if d > 0 else 'below' }} average)
      {% endif -%}
      {% if drivers %}Recent drivers: {{ drivers }}
      {% endif %}
      FORECAST
      {% if outlook_6m_pct is not none -%}
      6-month: {{ "%+.1f"|format(outlook_6m_pct) }}%, expected price about {{ "%.1f"|format(current_price * (1 + outlook_6m_pct / 100)) }} {{ unit }}
      {% endif -%}
      {% if outlook_12m_pct is not none -%}
      12-month: {{ "%+.1f"|format(outlook_12m_pct) }}%, expected price about {{ "%.1f"|format(current_price * (1 + outlook_12m_pct / 100)) }} {{ unit }}
      {% endif %}
      FOR BUYERS
      {% if outlook_6m_pct is not none and outlook_6m_pct > 0 -%}
      Prices are expected to rise: consider covering part of the requirement before the increase.
      {% elif outlook_6m_pct is not none and outlook_6m_pct < 0 -%}
      Prices are expected to ease: avoid committing early beyond the base requirement.
      {% else -%}
      Prices are expected to be stable: buy to plan.
      {% endif %}
    example: {commodity: polyester chips, current_price: 780, avg_12m_price: 810, outlook_6m_pct: -2, outlook_12m_pct: 1}

