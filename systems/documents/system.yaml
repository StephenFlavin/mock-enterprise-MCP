      negotiation_type: {type: enum, values: [price, terms, capacity, quality], default: price, desc: "Focus"}
      volume_shift_pct: {type: int, default: 0, desc: "Percent of volume we could move to an alternative, e.g. 40"}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      spend: |
        SELECT count(DISTINCT pur.po_id) AS pos, round(coalesce(sum(l.qty_ordered * l.unit_cost), 0), 0) AS spend_gbp
        FROM master.purchase_orders pur JOIN master.po_lines l ON l.po_id = pur.po_id JOIN master.products p ON p.sku = l.sku
        WHERE pur.supplier_id = $supplier_id AND ($category IS NULL OR lower(p.category) = lower($category))
          AND pur.order_date BETWEEN date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 365 DAY AND date_trunc('week', CAST($as_of AS DATE))
      cat_spend: |
        SELECT round(coalesce(sum(l.qty_ordered * l.unit_cost), 0), 0) AS spend_gbp
        FROM master.purchase_orders pur JOIN master.po_lines l ON l.po_id = pur.po_id JOIN master.products p ON p.sku = l.sku
        WHERE ($category IS NULL OR lower(p.category) = lower($category))
          AND pur.order_date BETWEEN date_trunc('week', CAST($as_of AS DATE)) - INTERVAL 365 DAY AND date_trunc('week', CAST($as_of AS DATE))
      own: |
        SELECT count(*) AS skus, round(avg(unit_cost_gbp), 2) AS avg_unit_cost, round(avg(lead_time_days), 0) AS lead_days
        FROM master.products WHERE supplier_id = $supplier_id AND ($category IS NULL OR lower(category) = lower($category))
      market: |
        SELECT round(avg(unit_cost_gbp), 2) AS avg_unit_cost, round(avg(s.payment_terms_days), 0) AS payment_days, round(avg(s.otif_pct_12m), 1) AS otif
        FROM master.products p JOIN master.suppliers s ON s.supplier_id = p.supplier_id
        WHERE s.status = 'active' AND (lower(p.category) = lower($category)
              OR ($category IS NULL AND p.category IN (SELECT category FROM master.products WHERE supplier_id = $supplier_id)))
      alts: |
        SELECT s.supplier_id, s.name, s.country, s.otif_pct_12m, s.payment_terms_days, s.risk_rating, round(avg(p.unit_cost_gbp), 2) AS avg_unit_cost
        FROM master.suppliers s JOIN master.products p ON p.supplier_id = s.supplier_id
        WHERE s.status = 'active' AND s.supplier_id <> $supplier_id
          AND (lower(p.category) = lower($category)
               OR ($category IS NULL AND p.category IN (SELECT category FROM master.products WHERE supplier_id = $supplier_id)))
        GROUP BY ALL ORDER BY s.otif_pct_12m DESC LIMIT 5
      carrier: |
        SELECT c.*, datediff('month', CAST($as_of AS DATE), c.contract_end) AS months_left FROM master.carriers c WHERE c.carrier_id = $carrier_id
      carrier_alts: |
        SELECT a.carrier_id, a.name, a.contract_end FROM master.carriers a, master.carriers c
        WHERE c.carrier_id = $carrier_id AND a.mode = c.mode AND a.scope = c.scope AND a.carrier_id <> c.carrier_id ORDER BY a.name
    template: |
      NEGOTIATION BRIEF

      {% if supplier -%}
      Supplier: {{ supplier[0].name }} ({{ supplier[0].supplier_id }}), {{ supplier[0].country }}
      Focus: {{ negotiation_type|upper }}{% if category %}, category {{ category }}{% endif %}

      1. OUR POSITION AND LEVERAGE
      - Spend with them in the last 12 months{% if category %} on {{ category }}{% endif %}: {{ "£{:,}".format(spend[0].spend_gbp|int) }} across {{ spend[0].pos }} purchase orders
      {% if cat_spend[0].spend_gbp and cat_spend[0].spend_gbp > 0 -%}
      - Share of our {{ category or 'category' }} spend: {{ "%.1f"|format(spend[0].spend_gbp / cat_spend[0].spend_gbp * 100) }}% (total {{ "£{:,}".format(cat_spend[0].spend_gbp|int) }})
      {% endif -%}
      - Performance: OTIF {{ supplier[0].otif_pct_12m }}% against a market average of {{ market[0].otif }}%; risk rating {{ supplier[0].risk_rating }}, tier {{ supplier[0].tier }}
      - Overall annual spend with them: {{ "£{:,}".format(supplier[0].annual_spend_gbp|int) }}

      2. BENCHMARKS
      - Average unit cost of their SKUs: £{{ own[0].avg_unit_cost }} ({{ own[0].skus }} SKUs) against a market average of £{{ market[0].avg_unit_cost }}
      - Payment terms: {{ supplier[0].payment_terms_days }} days against a market average of {{ market[0].payment_days|int }} days; incoterm {{ supplier[0].incoterm }}

      3. WHAT THEY ARE LIKELY TO ASK FOR
      - A price increase citing material, labour and freight costs
      - Longer volume commitments or a higher MOQ
      {% if supplier[0].payment_terms_days|int > market[0].payment_days|int -%}
      - Faster payment (our terms are longer than the market average)
      {% else -%}
      - Protection of current payment terms
      {% endif %}
      4. WHAT WE COULD TRADE
      - Multi-season volume commitment and forecast visibility
      - Earlier payment in return for a price reduction
      - Joint cost-down work on the {{ category or "product" }} range

      5. OUR BEST ALTERNATIVE (BATNA)
      {% for a in alts -%}
      - {{ a.name }} ({{ a.supplier_id }}, {{ a.country }}): OTIF {{ a.otif_pct_12m }}%, {{ a.payment_terms_days }} days, average unit cost £{{ a.avg_unit_cost }}, risk {{ a.risk_rating }}
      {% else -%}
      - No active alternative supplier found in the master data
      {% endfor -%}
      {% if volume_shift_pct %}If talks fail, move {{ volume_shift_pct }}% of volume to the alternatives above.{% endif %}

      6. STRATEGY
      Open on {{ negotiation_type }}: ask for a cost-down tied to our volume share and their OTIF record, and keep the alternatives above in reserve.
      {%- elif carrier %}
      Carrier: {{ carrier[0].name }} ({{ carrier[0].carrier_id }}), {{ carrier[0].mode }}, {{ carrier[0].scope }}
      Focus: {{ negotiation_type|upper }}

      1. OUR POSITION AND LEVERAGE
      - Contract ends {{ carrier[0].contract_end }}, about {{ carrier[0].months_left }} months from now
      {% if volume_shift_pct %}- Moving {{ volume_shift_pct }}% of volume away reduces their share of our lanes and needs a volume-tolerance or minimum-volume clause to be renegotiated
      {% endif %}
      2. TERMS WE WOULD HAVE TO NEGOTIATE
      - Volume commitment and tolerance if {{ volume_shift_pct }}% of volume moves to another network
      - Rate card and fuel surcharge cap for the remaining volume
      - On-time delivery service level and penalties
      - Notice period and exit terms before {{ carrier[0].contract_end }}

      3. ALTERNATIVES
      {% for a in carrier_alts -%}
      - {{ a.name }} ({{ a.carrier_id }}), contract ends {{ a.contract_end }}
      {% else -%}
      - No other carrier with the same mode and scope in the master data
      {% endfor -%}
      {%- else %}
      Provide a supplier_id or a carrier_id to build the brief.
      {%- endif %}
    example: {supplier_id: SUP-0074, category: Cookware, negotiation_type: price}
