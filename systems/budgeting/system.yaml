  - name: get_capital_budget_and_hurdle_rates
    desc: Capital investment budget, hurdle rate and risk adjustments for decision-making on capex.
    kind: sql
    args:
      entity_id: {}
    sql: |
      SELECT
        CAST($as_of AS DATE) AS as_of_date,
        'Capital budget: £100m (50% allocated), hurdle rate 12%, risk adjustment 2%' AS capital_plan,
        0.50 AS allocation_rate,
        0.12 AS hurdle_rate_pct,
        0.02 AS risk_adjustment_pct,
        'Return requirement 12% real; inflation 3%; assumes GBP stable' AS assumptions
    limit: 1
    example: {}
  - name: get_capital_investment_budget_for_region
    desc: Retrieves capital investment budget allocation for a region (site). Shows available capex for store upgrades and infrastructure.
    kind: sql
    args:
      site_id: {}
    sql: |
      SELECT
        'Region/Site capital budget' AS metric,
        COALESCE($site_id, 'Group') AS site_id,
        CASE WHEN $site_id = 'DC1' THEN 200000 WHEN $site_id = 'DC2' THEN 150000 WHEN $site_id = 'DC3' THEN 120000 ELSE 100000 END AS budget_gbp,
        'Automation, store upgrades, technology infrastructure' AS allocation_basis,
        CAST($as_of AS DATE) AS as_of_date
    limit: 1
    example: {site_id: DC1}
  - name: get_fx_budget_assumptions
    desc: Budgeted FX rates and hedge assumptions used in forecasts and budget planning.
    kind: sql
    args: []
    sql: |
      SELECT
        'FX budget assumptions' AS metric,
        'GBP/USD budget rate: 1.25, hedge cover 75%, hedged to end Q2 2027' AS assumptions,
        'GBP/EUR budget rate: 1.18, hedge cover 60%, hedged to end Q2 2027' AS eur_assumptions,
        'Spot rates volatile; forwards locked via forward contracts' AS notes,
        CAST($as_of AS DATE) AS as_of_date
      LIMIT 1
    limit: 1
    example: {}
  - name: get_programme_budget_vs_actual
    desc: Programme spend versus budget and forecast. Shows budget adherence and forecast accuracy.
    kind: sql
    args:
      programme_id: {required: true}
    sql: |
      SELECT
        p.programme_id, p.name AS programme_name, p.type, p.status,
        p.budget_gbp, SUM(pc.forecast_gbp) AS total_forecast_gbp, SUM(pc.actual_gbp) AS total_actual_gbp,
        ROUND(SUM(pc.actual_gbp) - p.budget_gbp, 2) AS variance_gbp,
        ROUND((SUM(pc.actual_gbp) - p.budget_gbp) / NULLIF(p.budget_gbp, 0) * 100, 1) AS variance_pct
      FROM programmes p
      LEFT JOIN programme_costs pc ON p.programme_id = pc.programme_id
      WHERE p.programme_id = $programme_id
      GROUP BY p.programme_id, p.name, p.type, p.status, p.budget_gbp
    limit: 1
    example: {programme_id: PGM-000001}
  - name: get_burn_rate_history
    desc: Programme burn rate over time showing forecast versus actual spend and cumulative progress.
    kind: sql
    args:
      programme_id: {required: true}
      period_from: {type: str, default: "-6m", desc: "Period from"}
    sql: |
      SELECT
        programme_id, p.name, period,
        forecast_gbp, actual_gbp,
        ROUND(COALESCE(actual_gbp, 0) / forecast_gbp * 100, 1) AS burn_rate_pct,
        SUM(COALESCE(actual_gbp, 0)) OVER (PARTITION BY programme_id ORDER BY period) AS cumulative_spend_gbp,
        SUM(forecast_gbp) OVER (PARTITION BY programme_id ORDER BY period) AS cumulative_forecast_gbp
      FROM programme_costs pc
      LEFT JOIN programmes p USING (programme_id)
      WHERE programme_id = $programme_id AND period >= $period_from
      ORDER BY period ASC
    limit: 60
    example: {programme_id: PGM-000001}
  - name: run_year_end_shrink_forecast
    desc: Forecast year-end shrink by store and category. Returns expected shrink % and impact.
    kind: py
    fn: forecast_shrink
    args:
      ytd_shrink_pct: {type: float, required: true, desc: "Year-to-date shrink % by store"}
      target_shrink_pct: {type: float, default: 1.5, desc: "Target shrink % for full year"}
    example: {ytd_shrink_pct: 2.0, target_shrink_pct: 1.5}
