id: budgeting
name: Budgeting & Forecasting Tool
instructions: >
  Budget management, forecasting, scenario analysis, margin planning and investment returns
  for Harbour & Vale. Cost budgets by cost centre (CC-2101), operating profit by legal entity (LE-UK),
  forecast versions (FCST-01001), scenarios (FSC-000001), margin plans, levers and investment cases (INV-900001).
  Budget line ids look like BL-000123, programmes PGM-000789.

tables:
  expense_categories:
    key: [category_group, category]
    cols:
      category_group: {type: str, desc: "Group: Facilities, Logistics, People or Technology"}
      category: {type: str, desc: "Expense category, e.g. utilities, air freight"}
      description: {type: str, desc: "What the category covers"}

  budget_lines:
    key: budget_line_id
    cols:
      budget_line_id: {type: str, desc: "Budget line, e.g. BL-000123"}
      cost_centre_id: {type: str, desc: "Cost centre"}
      category: {type: str, desc: "Expense category, e.g. air freight, staff, utilities"}
      period_date: {type: date, desc: "A date inside the budget month; the month is the period"}
      value_gbp: {type: float, desc: Budget amount in GBP}
      notes: {type: str, desc: "Notes on the budget"}
      updated_at: {type: timestamp, desc: "Last updated"}

  actual_costs:
    key: [cost_centre_id, category, period_date]
    cols:
      cost_centre_id: {type: str, desc: "Cost centre"}
      category: {type: str, desc: "Expense category"}
      period_date: {type: date, desc: "A date inside the month; the month is the period"}
      actual_gbp: {type: float, desc: "Actual spend in GBP"}
      one_off_gbp: {type: float, desc: "One-off/non-recurring portion in GBP"}
      notes: {type: str, desc: "What drove the spend"}
      updated_at: {type: timestamp, desc: "Last updated"}

  profit_lines:
    key: [entity_id, category, period_date]
    cols:
      entity_id: {type: str, desc: "Legal entity"}
      category: {type: str, desc: "Product department, e.g. Home, Womenswear, Electricals"}
      period_date: {type: date, desc: "A date inside the month; the month is the period"}
      budget_profit_gbp: {type: float, desc: "Budgeted operating profit in GBP"}
      actual_profit_gbp: {type: float, desc: "Actual operating profit in GBP"}
      basis: {type: enum, values: [full_month, month_to_date], desc: "Closed month or the current month so far"}

  variance_items:
    key: variance_item_id
    cols:
      variance_item_id: {type: str, desc: "Variance item, e.g. VI-000123"}
      entity_id: {type: str, desc: "Legal entity"}
      category: {type: str, desc: "Product department"}
      period_date: {type: date, desc: "A date inside the month"}
      driver: {type: enum, values: [volume, price, mix, cost, one_off], desc: "Variance driver"}
      nature: {type: enum, values: [permanent, timing], desc: "Permanent, or timing that reverses later"}
      amount_gbp: {type: float, desc: "Effect on operating profit in GBP (negative = adverse)"}
      explained: {type: bool, desc: "Whether the entity has explained the item"}
      explanation: {type: text, desc: "Explanation from the entity accountant"}

  forecast_versions:
    key: forecast_version_id
    cols:
      forecast_version_id: {type: str, desc: "Forecast version, e.g. FCST-01001"}
      forecast_date: {type: date, desc: "Date forecast was made"}
      scenario_id: {type: str, desc: "Scenario this forecast represents"}
      forecast_type: {type: enum, values: [forecast, budget], desc: "Forecast or the original budget"}
      revenue_forecast_gbp: {type: float, desc: "Full-year revenue forecast in GBP"}
      gross_margin_pct: {type: float, desc: "Gross margin percentage"}
      freight_cost_gbp: {type: float, desc: "Full-year freight cost in GBP (inside cost of goods)"}
      ebit_forecast_gbp: {type: float, desc: "Full-year EBIT forecast in GBP"}
      notes: {type: str, desc: "Notes on the forecast"}
      status: {type: enum, values: [current, superseded, rejected], desc: "Forecast status"}
      created_at: {type: timestamp, desc: "Created date"}

  forecast_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Forecast scenario, e.g. FSC-000001"}
      name: {type: str, desc: "Scenario name, e.g. Base, Downside, Upside"}
      description: {type: str, desc: "Description of assumptions in the scenario"}
      created_date: {type: date, desc: "Date scenario was created"}
      created_by: {type: str, desc: "Employee who created it"}
      assumptions: {type: text, desc: "Key assumptions in words (volume, price, freight, FX, etc.)"}
      demand_change_pct: {type: float, desc: "Demand (volume) change vs base forecast, %, e.g. -5"}
      price_change_pct: {type: float, desc: "Selling price change vs base forecast, %"}
      freight_change_pct: {type: float, desc: "Freight cost rate change vs base forecast, %"}
      fx_change_pct: {type: float, desc: "Move in sterling against the dollar, %, negative = sterling weaker"}
      nearshore_mix_pct: {type: float, desc: "Share of production moved nearshore, %"}
      status: {type: enum, values: [active, archived, deleted], desc: "Status"}

  forecast_assumptions:
    key: [forecast_version_id, driver]
    cols:
      forecast_version_id: {type: str, desc: "Forecast version"}
      driver: {type: str, desc: "Assumption, e.g. Demand growth vs last year"}
      assumed_value: {type: float, desc: "Value assumed in the forecast"}
      actual_value: {type: float, desc: "What actually happened, once known"}
      unit: {type: str, desc: "Unit of the values"}
      note: {type: text, desc: "Comment"}

  forecast_actuals:
    key: [forecast_version_id, period_date, line_item]
    cols:
      forecast_version_id: {type: str, desc: "Forecast version"}
      period_date: {type: date, desc: "A date in the middle of the month or quarter"}
      period_type: {type: enum, values: [month, quarter], desc: "Month or calendar quarter"}
      line_item: {type: str, desc: "P&L line (revenue, units, gross_profit, gross_margin_pct, freight, markdown, opex, ebit)"}
      unit: {type: str, desc: "GBP, units or %"}
      forecast_value: {type: float, desc: "Forecasted value"}
      actual_value: {type: float, desc: "Actual value"}

  margin_plans:
    key: [scenario_id, category]
    cols:
      scenario_id: {type: str, desc: "Forecast scenario"}
      category: {type: str, desc: "Product category, e.g. Housewares"}
      planned_margin_pct: {type: float, desc: "Planned gross margin %"}
      inflation_assumption_pct: {type: float, desc: "Assumed cost inflation %"}
      fx_impact_pct: {type: float, desc: "Cost increase from FX, % (net of hedges)"}
      fx_assumption: {type: str, desc: "FX assumption in words"}
      tariff_impact_pct: {type: float, desc: "Tariff cost increase %"}
      notes: {type: str, desc: "Notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  margin_actions:
    key: action_id
    cols:
      action_id: {type: str, desc: "Margin recovery action, e.g. MRA-0001"}
      category: {type: str, desc: "Product category, or All"}
      driver: {type: str, desc: "Margin driver it addresses: price, product cost, freight, fx, duty, mix, markdown, shrink"}
      description: {type: str, desc: "The action"}
      estimated_value_gbp: {type: float, desc: "Estimated annual margin recovered in GBP"}
      lead_time_weeks: {type: int, desc: "Weeks before it delivers"}
      confidence_pct: {type: int, desc: "Confidence in the estimate %"}

  mitigation_levers:
    key: lever_id
    cols:
      lever_id: {type: str, desc: "Lever, e.g. LEV-0001"}
      name: {type: str, desc: "Lever"}
      lever_type: {type: str, desc: "revenue, cost reduction, cost structure or working capital"}
      estimated_value_gbp: {type: float, desc: "Estimated value in GBP"}
      lead_time_weeks: {type: int, desc: "Weeks before it delivers"}
      one_time: {type: bool, desc: "One-off rather than recurring"}
      value_basis: {type: str, desc: "What the value measures, e.g. EBIT per year"}

  programmes:
    key: programme_id
    cols:
      programme_id: {type: str, desc: "Programme, e.g. PGM-000123"}
      name: {type: str, desc: "Programme name, e.g. Margin Recovery"}
      description: {type: str, desc: "Programme description"}
      budget_gbp: {type: float, desc: "Total programme budget in GBP"}
      start_date: {type: date, desc: "Start date"}
      end_date: {type: date, desc: "Expected end date"}
      status: {type: enum, values: [approved, in_progress, completed, cancelled], desc: "Status"}
      type: {type: enum, values: [cost_saving, revenue, capex, transformation], desc: "Programme type"}

  programme_costs:
    key: [programme_id, period]
    cols:
      programme_id: {type: str, desc: "Programme"}
      period: {type: str, desc: "Period (e.g. 2026-10 or FY27)"}
      forecast_gbp: {type: float, desc: "Forecast spend in GBP"}
      actual_gbp: {type: float, desc: "Actual spend in GBP"}
      burn_rate_pct: {type: float, desc: "Burn rate as % of budget"}
      updated_at: {type: timestamp, desc: "Last updated"}

  investment_cases:
    key: investment_case_id
    cols:
      investment_case_id: {type: str, desc: "Investment case, e.g. INV-900001"}
      title: {type: str, desc: "Investment title, e.g. Northampton DC automation"}
      description: {type: str, desc: "Investment description"}
      site_id: {type: str, desc: "Site affected, if any"}
      capex_gbp: {type: float, desc: "Capital expenditure in GBP"}
      annual_saving_gbp: {type: float, desc: "Expected annual saving in GBP once live"}
      annual_revenue_gbp: {type: float, desc: "Expected annual incremental revenue"}
      payback_period_months: {type: float, desc: "Payback period in months from first spend"}
      npv_gbp: {type: float, desc: "Net present value at 10% discount rate"}
      irr_pct: {type: float, desc: "Internal rate of return %"}
      status: {type: enum, values: [proposal, approved, rejected, implemented], desc: "Status"}
      created_date: {type: date, desc: "Created date"}
      assumptions: {type: text, desc: "Key assumptions used"}
      build_months: {type: int, desc: "Months of build before benefits start"}
      project_life_years: {type: int, desc: "Years of benefits"}

tools:
  - name: get_budget_vs_actual_by_cost_centre
    desc: Budget versus actual cost, variance and one-off amounts by cost centre, category or month, with a total row. Filter by category group such as Facilities.
    kind: sql
    args:
      cost_centre_id: {}
      category: {type: str, desc: "Expense category, e.g. utilities, maintenance, air freight, staff"}
      category_group: {type: str, desc: "Category group: Facilities, Logistics, People or Technology"}
      period_from: {type: date, default: "-12m", desc: "First month (e.g. this year, 2026-01, -3m)"}
      period_to: {type: date, default: "today", desc: "Last month (e.g. last month, 2026-09)"}
      group_by: {type: enum, values: [cost_centre, category, cost_centre_category, period], default: cost_centre, desc: "How to group the rows"}
    sql: |
      WITH bud AS (
        SELECT cost_centre_id, category, date_trunc('month', period_date) AS m, SUM(value_gbp) AS budget
        FROM budget_lines GROUP BY ALL),
      act AS (
        SELECT cost_centre_id, category, date_trunc('month', period_date) AS m, SUM(actual_gbp) AS actual, SUM(one_off_gbp) AS one_off
        FROM actual_costs GROUP BY ALL),
      j AS (
        SELECT a.cost_centre_id, a.category, COALESCE(ec.category_group, 'Other') AS category_group, a.m,
               COALESCE(b.budget, 0) AS budget, a.actual, a.one_off
        FROM act a
        LEFT JOIN bud b ON b.cost_centre_id = a.cost_centre_id AND b.category = a.category AND b.m = a.m
        LEFT JOIN expense_categories ec ON ec.category = a.category
        WHERE a.m >= date_trunc('month', CAST($period_from AS DATE))
          AND a.m <= date_trunc('month', CAST($period_to AS DATE))
          AND ($cost_centre_id IS NULL OR a.cost_centre_id = $cost_centre_id)
          AND ($category IS NULL OR lower(a.category) = lower($category))
          AND ($category_group IS NULL OR lower(COALESCE(ec.category_group, 'Other')) = lower($category_group))),
      agg AS (
        SELECT
          CASE WHEN $group_by IN ('cost_centre', 'cost_centre_category') THEN j.cost_centre_id ELSE COALESCE($cost_centre_id, 'ALL') END AS cost_centre_id,
          CASE WHEN $group_by IN ('category', 'cost_centre_category') THEN j.category ELSE 'ALL' END AS category,
          CASE WHEN $group_by = 'period' THEN strftime(j.m, '%Y-%m') ELSE 'ALL' END AS period,
          SUM(j.budget) AS budget_gbp, SUM(j.actual) AS actual_gbp, SUM(j.one_off) AS one_off_gbp
        FROM j GROUP BY ALL)
      SELECT cost_centre_id, cost_centre_name, category, period, budget_gbp, actual_gbp, variance_gbp,
             variance_pct, one_off_gbp, recurring_variance_gbp
      FROM (
        SELECT 1 AS ord, a.cost_centre_id, cc.name AS cost_centre_name, a.category, a.period,
               ROUND(a.budget_gbp, 0) AS budget_gbp, ROUND(a.actual_gbp, 0) AS actual_gbp,
               ROUND(a.actual_gbp - a.budget_gbp, 0) AS variance_gbp,
               ROUND((a.actual_gbp - a.budget_gbp) / NULLIF(a.budget_gbp, 0) * 100, 1) AS variance_pct,
               ROUND(a.one_off_gbp, 0) AS one_off_gbp,
               ROUND(a.actual_gbp - a.budget_gbp - a.one_off_gbp, 0) AS recurring_variance_gbp
        FROM agg a LEFT JOIN master.cost_centres cc ON cc.cost_centre_id = a.cost_centre_id
        UNION ALL
        SELECT 0, 'TOTAL', NULL, 'ALL', 'ALL', ROUND(SUM(budget_gbp), 0), ROUND(SUM(actual_gbp), 0),
               ROUND(SUM(actual_gbp) - SUM(budget_gbp), 0),
               ROUND((SUM(actual_gbp) - SUM(budget_gbp)) / NULLIF(SUM(budget_gbp), 0) * 100, 1),
               ROUND(SUM(one_off_gbp), 0), ROUND(SUM(actual_gbp) - SUM(budget_gbp) - SUM(one_off_gbp), 0)
        FROM agg HAVING count(*) > 1) t
      ORDER BY ord, CASE WHEN $group_by = 'period' THEN period END, variance_gbp DESC
    limit: 100
    example: {cost_centre_id: CC-2101}

  - name: get_budget_vs_actual_variance
    desc: Operating profit actual versus budget by legal entity, category or month for a period, with a total row. Use to see where profit is off budget.
    kind: py
    fn: profit_variance
    args:
      period_from: {type: date, default: "last month", desc: "First month (e.g. last month, this month, 2026-09)"}
      period_to: {type: date, desc: "Last month; defaults to the same month as period_from"}
      entity_id: {}
      category: {type: str, desc: "Product department, e.g. Home, Womenswear, Electricals"}
      group_by: {type: enum, values: [entity, category, entity_category, period], default: entity, desc: "How to group the rows"}
    example: {}

  - name: get_variance_drivers
    desc: Operating profit variance split into volume, price, mix, cost and one-off drivers, permanent versus timing, explained versus unexplained.
    kind: py
    fn: calc_variance_drivers
    args:
      period_from: {type: date, default: "last month", desc: "First month (e.g. last month, this month, 2026-09)"}
      period_to: {type: date, desc: "Last month; defaults to the same month as period_from"}
      entity_id: {}
      category: {type: str, desc: "Product department, e.g. Home, Womenswear, Electricals"}
      group_by: {type: enum, values: [driver, entity, category, item], default: driver, desc: "Split by driver, entity, category, or list each item with its explanation"}
    example: {}

  - name: get_historical_air_freight_spend
    desc: Air freight budget and actual spend by month, with the budget line ids (including the peak-season line). Use to base the peak budget on recent trend.
    kind: sql
    args:
      cost_centre_id: {}
      period_from: {type: date, default: "-12m", desc: "First month (e.g. -12m, 2025-11)"}
      period_to: {type: date, default: "+3m", desc: "Last month; future months show budget only"}
    sql: |
      WITH bud AS (
        SELECT date_trunc('month', period_date) AS m, string_agg(budget_line_id, ', ' ORDER BY budget_line_id) AS budget_line_ids,
               SUM(value_gbp) AS budget, string_agg(NULLIF(notes, ''), '; ') AS budget_notes
        FROM budget_lines WHERE category = 'air freight' AND ($cost_centre_id IS NULL OR cost_centre_id = $cost_centre_id)
        GROUP BY m),
      act AS (
        SELECT date_trunc('month', period_date) AS m, SUM(actual_gbp) AS actual, string_agg(NULLIF(notes, ''), '; ') AS actual_notes
        FROM actual_costs WHERE category = 'air freight' AND ($cost_centre_id IS NULL OR cost_centre_id = $cost_centre_id)
        GROUP BY m)
      SELECT strftime(COALESCE(b.m, a.m), '%Y-%m') AS period, b.budget_line_ids, ROUND(b.budget, 0) AS budget_gbp,
             ROUND(a.actual, 0) AS actual_gbp, ROUND(a.actual - b.budget, 0) AS variance_gbp,
             COALESCE(b.budget_notes, a.actual_notes) AS notes
      FROM bud b FULL JOIN act a ON a.m = b.m
      WHERE COALESCE(b.m, a.m) >= date_trunc('month', CAST($period_from AS DATE))
        AND COALESCE(b.m, a.m) <= date_trunc('month', CAST($period_to AS DATE))
      ORDER BY COALESCE(b.m, a.m)
    limit: 36
    example: {period_from: "-12m"}

  - name: update_budget_line
    desc: Change the value of a budget line for a period. Updates an existing budget line and returns the old and new value.
    kind: update
    table: budget_lines
    set: {updated_at: "$as_of"}
    args:
      value_gbp: {required: true, type: float, desc: "New budget value in GBP"}
      notes: {type: str, desc: "Reason for update"}
    example: {budget_line_id: BL-900101, value_gbp: 450000, notes: "Peak season adjustment"}

  - name: calculate_budget_impact_of_rate_increase
    desc: Annual budget impact of a carrier or supplier rate increase on a spend category. Uses the last 12 months of actual spend unless you supply one.
    kind: py
    fn: calc_rate_impact
    args:
      category: {required: true, type: str, desc: "Spend category, e.g. air freight, road transport"}
      rate_increase_pct: {required: true, type: float, desc: "Rate increase as %"}
      current_spend_gbp: {type: float, desc: "Annual spend in GBP; default is the last 12 months of actuals"}
      cost_centre_id: {}
      volume_assumption: {type: float, default: 1.0, desc: "Volume multiplier against last year; 1.0 = same volume"}
    example: {category: "air freight", rate_increase_pct: 9.0}

  - name: get_category_margin_plan
    desc: Planned gross margin by product category and scenario, with the inflation, FX and tariff assumptions behind each.
    kind: sql
    args:
      category: {type: str, desc: "Product category, e.g. Housewares, Womenswear, Electricals"}
      scenario_id: {}
    sql: |
      SELECT
        mp.scenario_id, fs.name AS scenario_name,
        mp.category, mp.planned_margin_pct,
        mp.inflation_assumption_pct, mp.fx_impact_pct, mp.fx_assumption, mp.tariff_impact_pct,
        mp.notes
      FROM margin_plans mp
      LEFT JOIN forecast_scenarios fs ON mp.scenario_id = fs.scenario_id
      WHERE ($category IS NULL OR lower(mp.category) = lower($category))
        AND ($scenario_id IS NULL OR mp.scenario_id = $scenario_id)
      ORDER BY mp.category, mp.scenario_id
    limit: 50
    example: {category: Housewares}

  - name: calculate_margin_scenario
    desc: Category margin under inflation, FX and tariff scenarios. Returns planned margin, each factor's impact in points and the scenario margin, for every scenario.
    kind: py
    fn: calc_margin_scenario
    args:
      category: {required: true, type: str, desc: "Product category, e.g. Housewares"}
      scenario_id: {}
      inflation_rate_pct: {type: float, desc: "Override cost inflation %; default from the plan"}
      fx_impact_pct: {type: float, desc: "Override cost increase from FX %; default from the plan"}
      tariff_rate_pct: {type: float, desc: "Override tariff cost increase %; default from the plan"}
      price_increase_pct: {type: float, default: 0, desc: "Selling price increase % to offset cost"}
    example: {category: Housewares}

  - name: update_category_margin_plan
    desc: Change the planned margin for a category in a chosen scenario. Returns the old and new planned margin.
    kind: update
    table: margin_plans
    set: {updated_at: "$as_of"}
    args:
      planned_margin_pct: {required: true, type: float, desc: "New margin % for category"}
      notes: {type: str, desc: "Why the plan changed"}
    example: {scenario_id: FSC-000002, category: Housewares, planned_margin_pct: 31.0}

  - name: get_latest_forecast_version
    desc: Full-year forecast versions with revenue, margin, EBIT and date. Current by default; use status superseded for earlier versions such as the July forecast.
    kind: sql
    args:
      scenario_id: {}
      status: {type: enum, values: [current, superseded, rejected], default: current, desc: "Forecast status"}
      forecast_type: {type: enum, values: [forecast, budget], default: forecast, desc: "Forecast, or the original budget"}
    sql: |
      SELECT
        fv.forecast_version_id, fv.forecast_type, fv.scenario_id, fs.name AS scenario_name, fv.forecast_date,
        fv.revenue_forecast_gbp, fv.gross_margin_pct,
        ROUND(fv.revenue_forecast_gbp * fv.gross_margin_pct / 100, 0) AS gross_profit_gbp,
        ROUND(fv.revenue_forecast_gbp * fv.gross_margin_pct / 100 - fv.ebit_forecast_gbp, 0) AS opex_gbp,
        fv.ebit_forecast_gbp, fv.freight_cost_gbp, fv.status, fv.notes
      FROM forecast_versions fv
      LEFT JOIN forecast_scenarios fs ON fv.scenario_id = fs.scenario_id
      WHERE fv.status = $status AND fv.forecast_type = $forecast_type
        AND ($scenario_id IS NULL OR fv.scenario_id = $scenario_id)
      ORDER BY fv.forecast_date DESC, fv.forecast_version_id DESC
    limit: 10
    example: {status: current}

  - name: get_forecast_drivers_and_assumptions
    desc: Driver assumptions behind a forecast version (demand, price, freight, FX, markdown, shrink), with the actual outcome where known.
    kind: sql
    args:
      forecast_version_id: {required: true}
    sql: |
      SELECT
        a.forecast_version_id, fv.forecast_date, fs.name AS scenario_name, a.driver, a.assumed_value, a.actual_value,
        ROUND(a.actual_value - a.assumed_value, 2) AS difference, a.unit, a.note
      FROM forecast_assumptions a
      JOIN forecast_versions fv ON fv.forecast_version_id = a.forecast_version_id
      LEFT JOIN forecast_scenarios fs ON fs.scenario_id = fv.scenario_id
      WHERE a.forecast_version_id = $forecast_version_id
      ORDER BY COALESCE(ABS(a.actual_value - a.assumed_value) / GREATEST(ABS(a.assumed_value), 1), 0) DESC, a.driver
    limit: 30
    example: {forecast_version_id: "FCST-00701"}

  - name: compare_forecast_to_actuals
    desc: Forecast version versus actual P&L by line (revenue, units, gross profit, margin, freight, EBIT), for the quarter and each month.
    kind: sql
    args:
      forecast_version_id: {required: true}
      period_from: {type: date, default: "-6m", desc: "First period (e.g. -6m, Q3, last quarter)"}
      period_to: {type: date, default: "today", desc: "Last period"}
      line_item: {type: str, desc: "One P&L line, e.g. revenue, units, gross_profit, gross_margin_pct, freight, ebit"}
    sql: |
      SELECT
        fa.forecast_version_id,
        CASE fa.period_type WHEN 'quarter' THEN CAST(year(fa.period_date) AS VARCHAR) || '-Q' || CAST(quarter(fa.period_date) AS VARCHAR)
             ELSE strftime(fa.period_date, '%Y-%m') END AS period,
        fa.period_type, fa.line_item, fa.unit, fa.forecast_value, fa.actual_value,
        ROUND(fa.actual_value - fa.forecast_value, 2) AS variance,
        CASE WHEN fa.unit = '%' THEN NULL ELSE ROUND((fa.actual_value - fa.forecast_value) / NULLIF(fa.forecast_value, 0) * 100, 1) END AS variance_pct
      FROM forecast_actuals fa
      WHERE fa.forecast_version_id = $forecast_version_id
        AND fa.period_date >= date_trunc('quarter', CAST($period_from AS DATE))
        AND fa.period_date <= CAST($period_to AS DATE)
        AND ($line_item IS NULL OR lower(fa.line_item) = lower($line_item))
      ORDER BY fa.period_type DESC, fa.period_date, fa.line_item
    limit: 100
    example: {forecast_version_id: "FCST-00701"}

  - name: get_forecast_accuracy_by_line
    desc: Forecast accuracy by P&L line over monthly periods, giving total forecast, total actual, bias %, average monthly error % and the worst month.
    kind: sql
    args:
      forecast_version_id: {required: true}
      period_from: {type: date, default: "-6m", desc: "First month (e.g. -6m, 2026-07)"}
      line_item: {type: str, desc: "One P&L line, e.g. revenue, units, gross_profit"}
    sql: |
      WITH m AS (
        SELECT fa.line_item, fa.unit, fa.period_date, fa.forecast_value, fa.actual_value,
               (fa.actual_value - fa.forecast_value) / NULLIF(fa.forecast_value, 0) * 100 AS err_pct
        FROM forecast_actuals fa
        WHERE fa.forecast_version_id = $forecast_version_id AND fa.period_type = 'month'
          AND fa.period_date >= date_trunc('month', CAST($period_from AS DATE))
          AND ($line_item IS NULL OR lower(fa.line_item) = lower($line_item)))
      SELECT $forecast_version_id AS forecast_version_id, line_item, unit, count(*) AS months,
             ROUND(SUM(forecast_value), 0) AS total_forecast, ROUND(SUM(actual_value), 0) AS total_actual,
             ROUND((SUM(actual_value) - SUM(forecast_value)) / NULLIF(SUM(forecast_value), 0) * 100, 1) AS bias_pct,
             ROUND(avg(abs(err_pct)), 1) AS avg_abs_error_pct,
             strftime(arg_min(period_date, err_pct), '%Y-%m') AS worst_month,
             ROUND(min(err_pct), 1) AS worst_month_error_pct
      FROM m GROUP BY line_item, unit ORDER BY abs(bias_pct) DESC
    limit: 20
    example: {forecast_version_id: "FCST-00701"}

  - name: get_full_year_outlook
    desc: Latest full-year forecast for revenue, gross margin, opex and EBIT, set against the original budget, with the gap in points and pounds.
    kind: sql
    args:
      scenario_type: {type: str, desc: "Scenario name, e.g. Base; empty for all current scenarios"}
    sql: |
      WITH bud AS (SELECT * FROM forecast_versions WHERE forecast_type = 'budget' ORDER BY forecast_date DESC LIMIT 1)
      SELECT
        fv.forecast_version_id, fs.name AS scenario_name, fv.forecast_date,
        fv.revenue_forecast_gbp, fv.gross_margin_pct,
        ROUND(fv.revenue_forecast_gbp * fv.gross_margin_pct / 100, 0) AS gross_profit_gbp,
        ROUND(fv.revenue_forecast_gbp * fv.gross_margin_pct / 100 - fv.ebit_forecast_gbp, 0) AS opex_gbp,
        fv.ebit_forecast_gbp, fv.freight_cost_gbp,
        b.revenue_forecast_gbp AS budget_revenue_gbp, b.gross_margin_pct AS budget_gross_margin_pct, b.ebit_forecast_gbp AS budget_ebit_gbp,
        ROUND(fv.gross_margin_pct - b.gross_margin_pct, 1) AS gross_margin_vs_budget_pts,
        ROUND(fv.ebit_forecast_gbp - b.ebit_forecast_gbp, 0) AS ebit_vs_budget_gbp,
        ROUND(fv.freight_cost_gbp - b.freight_cost_gbp, 0) AS freight_vs_budget_gbp,
        fv.status, fv.notes
      FROM forecast_versions fv CROSS JOIN bud b
      LEFT JOIN forecast_scenarios fs ON fv.scenario_id = fs.scenario_id
      WHERE fv.status = 'current' AND fv.forecast_type = 'forecast' AND COALESCE(fs.status, 'active') <> 'deleted'
        AND ($scenario_type IS NULL OR fs.name ILIKE '%' || $scenario_type || '%')
      ORDER BY fv.forecast_date DESC
    limit: 10
    example: {}

  - name: list_margin_recovery_actions
    desc: Candidate margin recovery actions with estimated annual value, lead time and confidence, largest first. Filter by category or margin driver.
    kind: sql
    args:
      category: {type: str, desc: "Product category, e.g. Housewares; actions for All categories are always included"}
      driver: {type: str, desc: "Margin driver: price, product cost, freight, fx, duty, mix, markdown or shrink"}
      min_value_gbp: {type: float, default: 0, desc: "Minimum estimated annual value in GBP"}
    sql: |
      SELECT action_id, category, driver, description, estimated_value_gbp, lead_time_weeks, confidence_pct,
             ROUND(estimated_value_gbp * confidence_pct / 100, 0) AS confidence_weighted_value_gbp
      FROM margin_actions
      WHERE ($category IS NULL OR lower(category) IN (lower($category), 'all'))
        AND ($driver IS NULL OR lower(driver) = lower($driver))
        AND estimated_value_gbp >= $min_value_gbp
      ORDER BY estimated_value_gbp DESC
    limit: 20
    example: {}

  - name: list_mitigation_levers
    desc: Cost and revenue levers with estimated value, lead time and whether one-off, largest first. Use for scenario planning and risk mitigation.
    kind: select
    from: mitigation_levers
    filters:
      lever_type: {desc: "Type: revenue, cost reduction, cost structure or working capital"}
      max_lead_time_weeks: {col: lead_time_weeks, op: "<=", desc: "Only levers that deliver within this many weeks"}
      min_value_gbp: {col: estimated_value_gbp, op: ">=", desc: "Minimum estimated value in GBP"}
    order: estimated_value_gbp DESC
    limit: 20
    example: {}

  - name: create_forecast_scenario
    desc: Save a new forecast scenario with its name and assumptions (demand, price, freight, FX, nearshoring changes against the base forecast).
    kind: insert
    table: forecast_scenarios
    id_prefix: FSC-
    defaults: {status: active, created_by: EMP-00077}
    args:
      name: {required: true, desc: "Scenario name, e.g. Downside"}
      description: {required: true, desc: "Description of assumptions"}
      assumptions: {}
      demand_change_pct: {}
      price_change_pct: {}
      freight_change_pct: {}
      fx_change_pct: {}
      nearshore_mix_pct: {}
    example: {name: "Downside", description: "Demand down 5%, freight up 20%", demand_change_pct: -5, freight_change_pct: 20}

  - name: delete_forecast_scenario
    desc: Delete a saved forecast scenario by id. Returns the old and new status.
    kind: update
    table: forecast_scenarios
    set: {status: deleted}
    args: {}
    example: {scenario_id: FSC-000003}

  - name: calculate_scenario_outcomes
    desc: Full-year revenue, gross margin, opex and EBIT under changed demand, price, freight and cost assumptions, against the base forecast.
    kind: py
    fn: calc_scenario_outcomes
    args:
      forecast_version_id: {type: str, desc: "Forecast version to flex; default is the current forecast"}
      scenario_id: {}
      demand_change_pct: {type: float, desc: "Demand change %, e.g. -5; default from the scenario, else 0"}
      price_change_pct: {type: float, desc: "Selling price change %; default from the scenario, else 0"}
      freight_change_pct: {type: float, desc: "Freight rate change %, e.g. 20; default from the scenario, else 0"}
      cost_inflation_pct: {type: float, default: 0, desc: "Change in non-freight cost of goods per unit, %"}
