id: budgeting
name: Budgeting & Forecasting Tool
instructions: >
  Budget management, forecasting, scenario analysis, margin planning and investment returns
  for Harbour & Vale. Forecast versions track full-year P&L with assumptions; scenarios model
  what-if cases; investment cases track capex and payback. Budget line ids look like BL-000123,
  forecast scenario ids like FSC-000456, programme ids like PGM-000789.

tables:
  budget_lines:
    key: budget_line_id
    cols:
      budget_line_id: {type: str, desc: "Budget line, e.g. BL-000123"}
      cost_centre_id: {type: str, desc: "Cost centre"}
      category: {type: str, desc: "Expense category, e.g. air freight, staff, systems"}
      period: {type: str, desc: "Period, e.g. 2026-10 (month) or FY27 (full year)"}
      value_gbp: {type: float, desc: Budget amount in GBP}
      notes: {type: str, desc: "Notes on the budget"}
      updated_at: {type: timestamp, desc: "Last updated"}

  actual_costs:
    key: [cost_centre_id, category, period]
    cols:
      cost_centre_id: {type: str, desc: "Cost centre"}
      category: {type: str, desc: "Expense category"}
      period: {type: str, desc: "Period (e.g. 2026-10 or FY27)"}
      actual_gbp: {type: float, desc: "Actual spend in GBP"}
      one_off_gbp: {type: float, desc: "One-off/non-recurring portion in GBP"}
      updated_at: {type: timestamp, desc: "Last updated"}

  forecast_versions:
    key: forecast_version_id
    cols:
      forecast_version_id: {type: str, desc: "Forecast version, e.g. FCST-2026-10-001"}
      forecast_date: {type: date, desc: "Date forecast was made"}
      scenario_id: {type: str, desc: "Scenario this forecast represents"}
      revenue_forecast_gbp: {type: float, desc: "Full-year revenue forecast in GBP"}
      gross_margin_pct: {type: float, desc: "Gross margin percentage"}
      ebit_forecast_gbp: {type: float, desc: "Full-year EBIT forecast in GBP"}
      notes: {type: str, desc: "Notes on the forecast"}
      status: {type: enum, values: [current, superseded, rejected], desc: "Forecast status"}
      created_at: {type: timestamp, desc: "Created date"}

  forecast_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Forecast scenario, e.g. FSC-000123"}
      name: {type: str, desc: "Scenario name, e.g. Base, Downside, Upside"}
      description: {type: str, desc: "Description of assumptions in the scenario"}
      created_date: {type: date, desc: "Date scenario was created"}
      created_by: {type: str, desc: "User who created it"}
      assumptions: {type: text, desc: "Key assumptions (volume, price, freight, FX, etc.)"}
      status: {type: enum, values: [active, archived, deleted], desc: "Status"}

  margin_plans:
    key: [scenario_id, category]
    cols:
      scenario_id: {type: str, desc: "Forecast scenario"}
      category: {type: str, desc: "Product category, e.g. Housewares"}
      planned_margin_pct: {type: float, desc: "Planned gross margin %"}
      inflation_assumption_pct: {type: float, desc: "Assumed inflation rate"}
      fx_assumption: {type: str, desc: "FX assumptions, e.g. GBP/USD=1.25"}
      tariff_impact_pct: {type: float, desc: "Tariff impact on margin %"}
      notes: {type: str, desc: "Notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  programmes:
    key: programme_id
    cols:
      programme_id: {type: str, desc: "Programme, e.g. PGM-000123"}
      name: {type: str, desc: "Programme name, e.g. Margin Recovery"}
      description: {type: str, desc: "Programme description"}
      budget_gbp: {type: float, desc: "Total programme budget in GBP"}
      start_date: {type: date, desc: "Start date"}
      end_date: {type: date, desc: "Expected end date"}
      status: {type: enum, values: [approved, in_progress, completed, cancelled], desc: "Status"}
      type: {type: enum, values: [cost_saving, revenue, capex, transformation], desc: "Programme type"}

  programme_costs:
    key: [programme_id, period]
    cols:
      programme_id: {type: str, desc: "Programme"}
      period: {type: str, desc: "Period (e.g. 2026-10 or FY27)"}
      forecast_gbp: {type: float, desc: "Forecast spend in GBP"}
      actual_gbp: {type: float, desc: "Actual spend in GBP"}
      burn_rate_pct: {type: float, desc: "Burn rate as % of budget"}
      updated_at: {type: timestamp, desc: "Last updated"}

  investment_cases:
    key: investment_case_id
    cols:
      investment_case_id: {type: str, desc: "Investment case, e.g. INV-000123"}
      title: {type: str, desc: "Investment title, e.g. Northampton DC automation"}
      description: {type: str, desc: "Investment description"}
      site_id: {type: str, desc: "Site affected, if any"}
      capex_gbp: {type: float, desc: "Capital expenditure in GBP"}
      annual_saving_gbp: {type: float, desc: "Expected annual saving in GBP"}
      annual_revenue_gbp: {type: float, desc: "Expected annual incremental revenue"}
      payback_period_months: {type: float, desc: "Payback period in months"}
      npv_gbp: {type: float, desc: "Net present value at 10% discount rate"}
      irr_pct: {type: float, desc: "Internal rate of return %"}
      status: {type: enum, values: [proposal, approved, rejected, implemented], desc: "Status"}
      created_date: {type: date, desc: "Created date"}
      assumptions: {type: text, desc: "Key assumptions used"}

  forecast_actuals:
    key: [forecast_version_id, period, line_item]
    cols:
      forecast_version_id: {type: str, desc: "Forecast version"}
      period: {type: str, desc: "Period (e.g. 2026-Q3 or 2026-10)"}
      line_item: {type: str, desc: "P&L line (revenue, cogs, freight, margin, ebit, etc.)"}
      forecast_value_gbp: {type: float, desc: "Forecasted value"}
      actual_value_gbp: {type: float, desc: "Actual value"}
      variance_gbp: {type: float, desc: "Variance (actual - forecast)"}
      variance_pct: {type: float, desc: "Variance as %"}

tools:
  - name: get_budget_vs_actual_by_cost_centre
    desc: Budget versus actual spend by cost centre and period, with variance. For tracking cost centre performance.
    kind: sql
    args:
      cost_centre_id: {}
      period_from: {type: str, default: "-12m", desc: "Period from (e.g. 2026-10, -3m, last month)"}
      period_to: {type: str, default: "+3m", desc: "Period to (e.g. 2026-10, 0m, this month)"}
    sql: |
      SELECT
        b.cost_centre_id, cc.name AS cost_centre_name,
        b.period,
        SUM(b.value_gbp) AS budget_gbp,
        SUM(COALESCE(a.actual_gbp, 0)) AS actual_gbp,
        ROUND(SUM(COALESCE(a.actual_gbp, 0)) - SUM(b.value_gbp), 2) AS variance_gbp,
        ROUND((SUM(COALESCE(a.actual_gbp, 0)) - SUM(b.value_gbp)) / NULLIF(SUM(b.value_gbp), 0) * 100, 1) AS variance_pct
      FROM budget_lines b
      LEFT JOIN actual_costs a ON b.cost_centre_id = a.cost_centre_id AND b.category = a.category AND b.period = a.period
      LEFT JOIN master.cost_centres cc ON cc.cost_centre_id = b.cost_centre_id
      WHERE ($cost_centre_id IS NULL OR b.cost_centre_id = $cost_centre_id)
      GROUP BY b.cost_centre_id, cc.name, b.period
      ORDER BY b.period, b.cost_centre_id
    limit: 100
    example: {cost_centre_id: CC-2101}

  - name: get_budget_vs_actual_variance
    desc: Variance split by cost centre, category and period. Returns budget, actual, variance amount and % for decomposition.
    kind: sql
    args:
      period_from: {type: str, default: "-12m", desc: "Period from"}
      period_to: {type: str, default: "+3m", desc: "Period to"}
      cost_centre_id: {}
    sql: |
      SELECT
        a.cost_centre_id, cc.name AS cost_centre_name,
        a.category,
        a.period,
        COALESCE(b.value_gbp, 0) AS budget_gbp,
        COALESCE(a.actual_gbp, 0) AS actual_gbp,
        COALESCE(a.one_off_gbp, 0) AS one_off_gbp,
        ROUND(COALESCE(a.actual_gbp, 0) - COALESCE(b.value_gbp, 0), 2) AS variance_gbp,
        CASE WHEN b.value_gbp > 0 THEN ROUND((COALESCE(a.actual_gbp, 0) - COALESCE(b.value_gbp, 0)) / b.value_gbp * 100, 1) ELSE 0 END AS variance_pct
      FROM actual_costs a
      LEFT JOIN budget_lines b ON a.cost_centre_id = b.cost_centre_id AND a.category = b.category AND a.period = b.period
      LEFT JOIN master.cost_centres cc ON cc.cost_centre_id = a.cost_centre_id
      WHERE ($cost_centre_id IS NULL OR a.cost_centre_id = $cost_centre_id)
      ORDER BY a.period DESC, variance_gbp DESC
    limit: 100
    example: {}

  - name: get_burn_rate_history
    desc: Programme burn rate over time showing forecast versus actual spend and cumulative progress.
    kind: sql
    args:
      programme_id: {required: true}
      period_from: {type: str, default: "-6m", desc: "Period from"}
    sql: |
      SELECT
        programme_id, p.name, period,
        forecast_gbp, actual_gbp,
        ROUND(COALESCE(actual_gbp, 0) / forecast_gbp * 100, 1) AS burn_rate_pct,
        SUM(COALESCE(actual_gbp, 0)) OVER (PARTITION BY programme_id ORDER BY period) AS cumulative_spend_gbp,
        SUM(forecast_gbp) OVER (PARTITION BY programme_id ORDER BY period) AS cumulative_forecast_gbp
      FROM programme_costs pc
      LEFT JOIN programmes p USING (programme_id)
      WHERE programme_id = $programme_id AND period >= $period_from
      ORDER BY period ASC
    limit: 60
    example: {programme_id: PGM-000001}

  - name: get_capital_budget_and_hurdle_rates
    desc: Capital investment budget, hurdle rate and risk adjustments for decision-making on capex.
    kind: sql
    args:
      entity_id: {}
    sql: |
      SELECT
        CAST($as_of AS DATE) AS as_of_date,
        'Capital budget: £100m (50% allocated), hurdle rate 12%, risk adjustment 2%' AS capital_plan,
        0.50 AS allocation_rate,
        0.12 AS hurdle_rate_pct,
        0.02 AS risk_adjustment_pct,
        'Return requirement 12% real; inflation 3%; assumes GBP stable' AS assumptions
    limit: 1
    example: {}

  - name: compare_forecast_to_actuals
    desc: Compare forecast version to actual P&L by line item and period. Shows variance by revenue, cost, freight, margin drivers.
    kind: sql
    args:
      forecast_version_id: {required: true}
      period_from: {type: str, default: "-3m", desc: "Period from (e.g. Sept, -3m, last month)"}
      period_to: {type: str, default: "0m", desc: "Period to (e.g. Sept, 0m, this month)"}
    sql: |
      SELECT
        fa.forecast_version_id, fa.period, fa.line_item,
        fa.forecast_value_gbp, fa.actual_value_gbp,
        ROUND(fa.actual_value_gbp - fa.forecast_value_gbp, 2) AS variance_gbp,
        COALESCE(fa.variance_pct, 0) AS variance_pct
      FROM forecast_actuals fa
      WHERE fa.forecast_version_id = $forecast_version_id
      ORDER BY fa.period, fa.line_item
    limit: 100
    example: {forecast_version_id: "FCST-01001"}

  - name: create_forecast_scenario
    desc: Save a new forecast scenario with key assumptions (volume, price, freight, FX, tariff).
    kind: insert
    table: forecast_scenarios
    id_prefix: FSC-
    defaults: {status: active}
    args:
      name: {required: true, desc: "Scenario name, e.g. Downside"}
      description: {required: true, desc: "Description of assumptions"}
      assumptions: {}
      created_by: {}
    example: {name: "Downside", description: "Demand down 5%, freight up 20%", created_by: "EMP-00123"}

  - name: delete_forecast_scenario
    desc: Delete a saved forecast scenario and all associated forecasts.
    kind: update
    table: forecast_scenarios
    set: {status: deleted}
    args: {}
    example: {scenario_id: FSC-000001}

  - name: calculate_margin_scenario
    desc: Margin under inflation, FX and tariff scenarios. Returns base margin and impact of each scenario.
    kind: py
    fn: calc_margin_scenario
    args:
      category: {required: true}
      base_margin_pct: {type: float, default: 40.0, desc: "Base gross margin %"}
      inflation_rate_pct: {type: float, default: 2.5, desc: "Inflation rate %"}
      fx_impact_pct: {type: float, default: 0, desc: "FX impact %"}
      tariff_rate_pct: {type: float, default: 0, desc: "Tariff rate %"}
    example: {category: Housewares}

  - name: calculate_pl_scenario
    desc: Full P&L under a scenario with changed sourcing mix. Returns revenue, cogs, margin, EBIT.
    kind: py
    fn: calc_pl_scenario
    args:
      scenario_id: {required: true}
      base_revenue_gbp: {type: float, default: 1000000, desc: "Base revenue"}
      volume_change_pct: {type: float, default: 0, desc: "Volume change %"}
      price_change_pct: {type: float, default: 0, desc: "Price change %"}
      nearshore_mix_pct: {type: float, default: 0, desc: "% of sourcing from nearshore"}
    example: {scenario_id: FSC-000001}

  - name: calculate_scenario_outcomes
    desc: P&L outcomes for a scenario. Returns revenue, margin, EBIT, profit with formula.
    kind: py
    fn: calc_scenario_outcomes
    args:
      scenario_id: {required: true}
      revenue_assumption_gbp: {type: float, default: 50000000, desc: "Assumed full-year revenue in GBP"}
      margin_assumption_pct: {type: float, default: 35.0, desc: "Assumed gross margin %"}
      opex_assumption_gbp: {type: float, default: 10000000, desc: "Assumed operating expenses in GBP"}
    example: {scenario_id: "FSC-000001"}

  - name: calculate_investment_returns
    desc: "Payback, NPV and IRR for an investment case. Returns the three metrics plus inputs and formula."
    kind: py
    fn: calc_investment_returns
    args:
      capex_gbp: {required: true, type: float}
      annual_saving_gbp: {type: float, default: 0}
      annual_revenue_gbp: {type: float, default: 0}
      discount_rate_pct: {type: float, default: 10.0, desc: "Discount rate as %"}
      project_life_years: {type: int, default: 5, desc: "Project life in years"}
    example: {capex_gbp: 1000000, annual_saving_gbp: 250000}

  - name: calculate_sensitivity_analysis
    desc: Sensitivity of returns (payback, NPV, IRR) to volume growth, price, cost, discount rate.
    kind: py
    fn: calc_sensitivity_analysis
    args:
      investment_case_id: {required: true}
      base_capex_gbp: {type: float, required: true, desc: "Capital expenditure in GBP"}
      base_annual_return_gbp: {type: float, required: true, desc: "Annual benefit or return in GBP"}
      sensitivity_variable: {type: enum, values: [volume, price, cost, discount_rate], default: volume, desc: "Which variable to vary"}
      variance_range_pct: {type: float, default: 20.0, desc: "Vary by +/- this %"}
    example: {investment_case_id: "INV-000001", base_capex_gbp: 1000000, base_annual_return_gbp: 250000}

  - name: calculate_breakeven_period
    desc: Breakeven period for an investment or initiative. Returns months to recover initial investment.
    kind: py
    fn: calc_breakeven
    args:
      initial_investment_gbp: {required: true, type: float, desc: "Initial investment in GBP"}
      monthly_return_gbp: {type: float, default: 0, desc: "Monthly return or saving in GBP"}
      annual_return_gbp: {type: float, default: 0, desc: "Annual return or saving in GBP"}
    example: {initial_investment_gbp: 500000, annual_return_gbp: 100000}

  - name: calculate_programme_payback
    desc: Calculate payback period for a cost-saving or revenue programme.
    kind: py
    fn: calc_programme_payback
    args:
      programme_id: {required: true}
      investment_gbp: {type: float, required: true, desc: "Programme investment in GBP"}
      annual_benefit_gbp: {type: float, required: true, desc: "Annual benefit from programme in GBP"}
    example: {programme_id: "PGM-000001", investment_gbp: 200000, annual_benefit_gbp: 100000}

  - name: calculate_programme_savings
    desc: Total savings from a programme tracking actual versus forecast and run rate.
    kind: py
    fn: calc_programme_savings
    args:
      programme_id: {required: true}
      start_date: {type: date, default: "-6m"}
    example: {programme_id: PGM-000001}

  - name: calculate_budget_impact_of_rate_increase
    desc: Budget impact of carrier or supplier rate increases. Takes current spend and new rate.
    kind: py
    fn: calc_rate_impact
    args:
      category: {required: true, desc: "e.g. air freight, road transport"}
      current_spend_gbp: {required: true, type: float, desc: "Current annual spend in GBP"}
      rate_increase_pct: {required: true, type: float, desc: "Rate increase as %"}
      volume_assumption: {type: int, default: 1, desc: "Volume multiplier"}
    example: {category: "air freight", current_spend_gbp: 500000, rate_increase_pct: 8.0}

  - name: calculate_investment_required
    desc: Investment required to achieve a target (e.g. sales growth, market entry). Returns capex needed.
    kind: py
    fn: calc_investment_required
    args:
      target_gbp: {required: true, type: float, desc: "Target revenue or benefit"}
      roi_target_pct: {required: true, type: float, default: 30.0, desc: "Target return on investment %"}
      payback_years: {type: float, default: 3.0, desc: "Desired payback period"}
    example: {target_gbp: 5000000, roi_target_pct: 25.0}

  - name: get_latest_forecast_version
    desc: Current forecast by line (revenue, margin, EBIT). Returns the latest active forecast version.
    kind: sql
    args:
      scenario_id: {}
      status: {type: enum, values: [current, superseded, rejected], default: current}
    sql: |
      SELECT
        forecast_version_id, scenario_id, forecast_date,
        revenue_forecast_gbp, gross_margin_pct, ebit_forecast_gbp,
        status, notes
      FROM forecast_versions
      WHERE (status = $status OR ($status IS NULL AND status = 'current'))
      ORDER BY forecast_date DESC, forecast_version_id DESC
      LIMIT 5
    limit: 5
    example: {status: current}

  - name: get_forecast_drivers_and_assumptions
    desc: Driver assumptions behind a forecast version. Returns volume, price, freight, FX and other key drivers.
    kind: sql
    args:
      forecast_version_id: {required: true}
    sql: |
      SELECT
        fv.forecast_version_id, fv.scenario_id, fs.assumptions,
        fs.name AS scenario_name, fs.description,
        fv.revenue_forecast_gbp, fv.gross_margin_pct, fv.ebit_forecast_gbp
      FROM forecast_versions fv
      LEFT JOIN forecast_scenarios fs ON fv.scenario_id = fs.scenario_id
      WHERE fv.forecast_version_id = $forecast_version_id
    limit: 1
    example: {forecast_version_id: "FCST-01001"}

  - name: get_forecast_accuracy_by_line
    desc: Forecast versus actual by line and period. Shows variance on revenue, cost, freight, margin.
    kind: sql
    args:
      forecast_version_id: {required: true}
      period_from: {type: str, default: "-6m", desc: "Period from (e.g. -6m, last month)"}
    sql: |
      SELECT
        forecast_version_id, period, line_item,
        forecast_value_gbp, actual_value_gbp,
        ROUND(actual_value_gbp - forecast_value_gbp, 2) AS variance_gbp,
        COALESCE(variance_pct, 0) AS variance_pct
      FROM forecast_actuals
      WHERE forecast_version_id = $forecast_version_id AND period >= $period_from
      ORDER BY period DESC, line_item
    limit: 100
    example: {forecast_version_id: "FCST-01001"}

  - name: get_full_year_outlook
    desc: Latest full-year forecast for revenue, margin and EBIT with status and assumptions.
    kind: sql
    args:
      scenario_type: {type: str, desc: "Base, Downside, Upside, or empty for all"}
    sql: |
      SELECT
        fv.forecast_version_id, fv.scenario_id, fs.name AS scenario_name,
        fv.revenue_forecast_gbp, fv.gross_margin_pct, fv.ebit_forecast_gbp,
        ROUND(fv.revenue_forecast_gbp * (fv.gross_margin_pct / 100), 2) AS gross_profit_gbp,
        fv.forecast_date, fv.status, fv.notes
      FROM forecast_versions fv
      LEFT JOIN forecast_scenarios fs ON fv.scenario_id = fs.scenario_id
      WHERE fv.status = 'current'
      ORDER BY fv.forecast_date DESC
      LIMIT 10
    limit: 10
    example: {}

  - name: get_capital_investment_budget_for_region
    desc: Retrieves capital investment budget allocation for a region (site). Shows available capex for store upgrades and infrastructure.
    kind: sql
    args:
      site_id: {}
    sql: |
      SELECT
        'Region/Site capital budget' AS metric,
        COALESCE($site_id, 'Group') AS site_id,
        CASE WHEN $site_id = 'DC1' THEN 200000 WHEN $site_id = 'DC2' THEN 150000 WHEN $site_id = 'DC3' THEN 120000 ELSE 100000 END AS budget_gbp,
        'Automation, store upgrades, technology infrastructure' AS allocation_basis,
        CAST($as_of AS DATE) AS as_of_date
    limit: 1
    example: {site_id: DC1}

  - name: get_fx_budget_assumptions
    desc: Budgeted FX rates and hedge assumptions used in forecasts and budget planning.
    kind: sql
    args: []
    sql: |
      SELECT
        'FX budget assumptions' AS metric,
        'GBP/USD budget rate: 1.25, hedge cover 75%, hedged to end Q2 2027' AS assumptions,
        'GBP/EUR budget rate: 1.18, hedge cover 60%, hedged to end Q2 2027' AS eur_assumptions,
        'Spot rates volatile; forwards locked via forward contracts' AS notes,
        CAST($as_of AS DATE) AS as_of_date
      LIMIT 1
    limit: 1
    example: {}

  - name: get_category_margin_plan
    desc: Planned margin by category under scenarios. Shows base margin and scenario impacts.
    kind: sql
    args:
      category: {}
      scenario_id: {}
    sql: |
      SELECT
        mp.scenario_id, fs.name AS scenario_name,
        category, planned_margin_pct,
        inflation_assumption_pct, fx_assumption, tariff_impact_pct,
        notes
      FROM margin_plans mp
      LEFT JOIN forecast_scenarios fs ON mp.scenario_id = fs.scenario_id
      WHERE ($category IS NULL OR category = $category)
        AND ($scenario_id IS NULL OR mp.scenario_id = $scenario_id)
      ORDER BY mp.scenario_id, category
    limit: 50
    example: {category: Housewares}

  - name: get_margin_phasing_forecast
    desc: Margin flow-through by month from landed cost changes. Shows phasing of margin recovery.
    kind: py
    fn: get_margin_phasing_forecast
    args:
      starting_margin_pct: {type: float, default: 35.0, desc: "Starting gross margin %"}
      cost_change_gbp: {type: float, default: 0, desc: "Monthly cost change impact in GBP"}
      recovery_months: {type: int, default: 6, desc: "Months to full recovery"}
    example: {starting_margin_pct: 35.0, cost_change_gbp: -50000, recovery_months: 6}

  - name: get_historical_air_freight_spend
    desc: Historic air spend by period. Shows trend in air freight costs over recent months.
    kind: sql
    args:
      period_from: {type: str, default: "-12m", desc: "Period from (e.g. -12m, last year)"}
    sql: |
      SELECT
        period,
        SUM(value_gbp) AS budgeted_air_freight_gbp,
        COUNT(*) AS budget_lines,
        ROUND(SUM(value_gbp) / COUNT(*), 2) AS avg_per_line_gbp
      FROM budget_lines
      WHERE category = 'air freight' AND period >= $period_from
      GROUP BY period
      ORDER BY period DESC
    limit: 24
    example: {period_from: "-12m"}

  - name: get_programme_budget_vs_actual
    desc: Programme spend versus budget and forecast. Shows budget adherence and forecast accuracy.
    kind: sql
    args:
      programme_id: {required: true}
    sql: |
      SELECT
        p.programme_id, p.name AS programme_name, p.type, p.status,
        p.budget_gbp, SUM(pc.forecast_gbp) AS total_forecast_gbp, SUM(pc.actual_gbp) AS total_actual_gbp,
        ROUND(SUM(pc.actual_gbp) - p.budget_gbp, 2) AS variance_gbp,
        ROUND((SUM(pc.actual_gbp) - p.budget_gbp) / NULLIF(p.budget_gbp, 0) * 100, 1) AS variance_pct
      FROM programmes p
      LEFT JOIN programme_costs pc ON p.programme_id = pc.programme_id
      WHERE p.programme_id = $programme_id
      GROUP BY p.programme_id, p.name, p.type, p.status, p.budget_gbp
    limit: 1
    example: {programme_id: PGM-000001}

  - name: get_variance_drivers
    desc: Variance split into volume, price, mix, cost and one-off drivers. Explains budget vs actual.
    kind: py
    fn: calc_variance_drivers
    args:
      cost_centre_id: {}
      period: {type: str, default: "0m"}
    example: {}

