- question: "02:13:Q4"
  story: "Air freight coordinator needs to budget for peak season. Base case uses historical air freight spend; variant checks scenarios with improved supplier on-time delivery. Seed data includes air freight budget lines for DC1 in various periods."
  checks:
    - tool: get_budget_vs_actual_by_cost_centre
      args: {cost_centre_id: CC-2101}
      expect: ["CC-2101", "Northampton DC Operations"]

- question: "02:20:Q4"
  story: "Carrier relationship manager calculates budget impact of rate increases. Uses current air freight spend (£500k annually) with 8% rate increase to show impact of £40k. Seed data includes air freight budget lines."
  checks:
    - tool: calculate_budget_impact_of_rate_increase
      args: {category: "air freight", current_spend_gbp: 500000, rate_increase_pct: 8.0}
      expect: ["500000", "40000", "540000"]

- question: "04:32:Q5"
  story: "Category buyer analyzes margin impact of inflation (2.5%), FX (0%), and tariffs (3%) on Housewares category. Base margin 40% under scenario impacts. Seed data includes margin plans for Housewares."
  checks:
    - tool: calculate_margin_scenario
      args: {category: Housewares, base_margin_pct: 40.0, inflation_rate_pct: 2.5, tariff_rate_pct: 3.0}
      expect: ["Housewares", "scenario_margin", "inflation_impact"]

- question: "04:37:Q3"
  story: "Indirect procurement manager reviews facilities spend variance at CC-2101 (Northampton DC). Budget vs actual shows spend patterns over recent periods for cost tracking."
  checks:
    - tool: get_budget_vs_actual_by_cost_centre
      args: {cost_centre_id: CC-2101, period_from: "-3m", period_to: "0m"}
      expect: ["CC-2101", "Northampton"]
    - tool: get_budget_vs_actual_variance
      args: {cost_centre_id: CC-2101, period_from: "-1m", period_to: "0m"}
      expect: ["CC-2101"]

- question: "07:61:Q1"
  story: "Financial controller decomposes profit variance for September. Uses budget vs actual variance analysis by cost centre, category and period to explain variances. Seed data shows actual spend patterns vs budget."
  checks:
    - tool: get_budget_vs_actual_variance
      args: {period_from: "-1m", period_to: "0m"}
      expect: ["variance", "actual"]

- question: "07:62:Q1"
  story: "FP&A analyst calculates scenario outcomes for revenue £50m, margin 35%, opex £10m to understand full-year P&L impact. Returns EBIT and profit after tax."
  checks:
    - tool: calculate_scenario_outcomes
      args: {scenario_id: FSC-000001, revenue_assumption_gbp: 50000000, margin_assumption_pct: 35.0, opex_assumption_gbp: 10000000}
      expect: ["revenue", "ebit", "profit"]

- question: "07:62:Q2"
  story: "FP&A analyst builds full-year forecast with three scenarios: Base, Downside, Upside. Creates new forecast scenarios with assumptions about volume, price, and freight changes, then deletes the upside after consideration."
  checks:
    - tool: create_forecast_scenario
      args: {name: "Downside", description: "Demand down 5%, freight up 20%", created_by: "EMP-00001"}
      expect: ["Downside", "FSC-"]
    - tool: calculate_scenario_outcomes
      args: {scenario_id: FSC-000001, revenue_assumption_gbp: 50000000, margin_assumption_pct: 33.0, opex_assumption_gbp: 10000000}
      expect: ["50000000", "16500000"]

- question: "07:62:Q3"
  story: "FP&A analyst calculates return metrics for £12m Northampton automation investment with £3m annual savings over 5 years at 10% discount rate. Analyzes sensitivity to volume growth changes."
  checks:
    - tool: calculate_investment_returns
      args: {capex_gbp: 12000000, annual_saving_gbp: 3000000, discount_rate_pct: 10.0, project_life_years: 5}
      expect: ["12000000", "3000000", "4.0", "payback"]
    - tool: calculate_sensitivity_analysis
      args: {investment_case_id: INV-000001, base_capex_gbp: 12000000, base_annual_return_gbp: 3000000, sensitivity_variable: volume}
      expect: ["volume", "scenarios", "payback"]

- question: "07:62:Q5"
  story: "FP&A analyst calculates breakeven period for a £500k investment with £100k annual return. Returns months and years to recover investment for ROI planning."
  checks:
    - tool: calculate_breakeven_period
      args: {initial_investment_gbp: 500000, annual_return_gbp: 100000}
      expect: ["500000", "60", "5"]

- question: "07:62:Q6"
  story: "FP&A analyst analyzes cost-saving programme with £200k investment and £100k annual benefit to determine payback period for strategic planning."
  checks:
    - tool: calculate_programme_payback
      args: {programme_id: PGM-000001, investment_gbp: 200000, annual_benefit_gbp: 100000}
      expect: ["200000", "100000", "2.0", "24"]

- question: "07:62:Q8"
  story: "FP&A analyst reviews programme savings from PGM-000001 tracking actual vs forecast spend and calculating realized programme benefits."
  checks:
    - tool: calculate_programme_savings
      args: {programme_id: PGM-000001, start_date: "-6m"}
      expect: ["PGM-000001", "Margin Recovery", "savings"]

- question: "07:63:Q1"
  story: "Supply chain finance analyst compares FCST-2026-10-001 forecast to actuals for September-October periods by P&L line items (revenue, COGS, margin, freight, EBIT)."
