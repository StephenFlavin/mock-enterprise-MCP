# One entry per question row that uses this system's tools
- question: "07:68:Q5"
  story: >
    Leeds Shopping Centre (ST150) weekly shrink tripled over the last four weeks, with theft at 72% of it and
    stock adjustments up fourfold. Incidents show evening stockroom removals (internal theft, INC-900001 to INC-900006)
    plus small self-checkout scanner faults, so internal theft explains most of it. A case is then opened.
  checks:
    - tool: get_store_shrink_by_period
      args: {site_id: ST150, date_from: "-112d", period_weeks: 4}
      expect: ["18724.1", "5932.03", "13481.35"]
    - tool: create_loss_prevention_case
      args: {site_id: ST150, case_type: internal_theft, description: "Shrink tripled with evening stockroom removals", estimated_loss_gbp: 4800, assigned_to: "EMP-00102"}
      expect: ["LPC-900003", "internal_theft", "open"]

- question: "07:69:Q3"
  story: >
    Group-wide store shrink in 13-week blocks: the latest block is about 7% above the same weeks last year, and last
    year's final quarter (Nov/Dec peak) was far higher than the quarters either side of it.
  checks:
    - tool: get_store_shrink_by_period
      args: {date_from: "-455d", period_weeks: 13}
      expect: ["3628217.04", "4219635.45", "3387398.91"]

- question: "08:79:Q1"
  story: >
    UK North last six months: ST150 internal theft in the evenings (stockroom, staff card), ST159 till 2 void cluster
    14:00-16:00 on Thursdays, an organised group of three hitting ST181, ST165 and ST159 around 12:30 in two waves
    (case LPC-900001), and ST183 refunds late afternoon. The case summary is drafted and a case for ST150 opened.
  checks:
    - tool: list_incidents_for_region
      args: {region: "UK North", date_from: "-180d"}
      expect: ["INC-900018", "ST150", "ST159", "ST165", "ST181", "stockroom", "Till 2"]
    - tool: draft_loss_prevention_case_summary
      args: {case_id: "LPC-900001"}
      expect: ["LPC-900001", "organized_retail_crime", "£5,876", "INC-900019"]
    - tool: create_loss_prevention_case
      args: {site_id: ST150, case_type: internal_theft, description: "Evening stockroom removals", estimated_loss_gbp: 4800, key_incidents: "INC-900001, INC-900002"}
      expect: ["LPC-", "internal_theft", "INC-900002"]

- question: "08:79:Q2"
  story: >
    Controls compared by type across the estate: POS rules and tagging return more than they cost, self-checkout monitoring
    breaks even, while layout, CCTV, security staff and staffing cost far more than the shrink they save.
  checks:
    - tool: compare_control_effectiveness
      args: {}
      expect: ["pos_rules", "tagging", "staffing", "security_staff", "layout"]
    - tool: calculate_control_payback
      args: {}
      expect: ["payback_months", "pos_rules", "staffing"]

- question: "08:79:Q4"
  story: >
    Incident counts by store over six months: ST150, ST181, ST159, ST165 and ST183 (all Leeds) are the hotspots, with
    ST003 Croydon High Street the only non-Leeds store near them.
  checks:
    - tool: get_incident_counts_by_location
      args: {}
      expect: ["ST150", "ST181", "ST159", "ST165", "ST003", "ST183"]

- question: "08:79:Q5"
  story: >
    Self-checkout shrink is up at ST150, ST159, ST165, ST181 and ST183. Of the interventions, tightening POS rules (such as the
    unexpected-item rule) has the lowest cost per pound saved, ahead of tagging and self-checkout monitoring.
  checks:
    - tool: calculate_intervention_cost_effectiveness
      args: {site_id: ST165}
      expect: ["pos_rules", "tagging", "cost_per_pound_saved", "51484"]
    - tool: calculate_intervention_cost_effectiveness
      args: {site_id: ST183, intervention_type: self_checkout_monitoring}
      expect: ["self_checkout_monitoring", "89292"]

- question: "08:79:Q6"
  story: >
    The five highest-loss products (SKU-102338, SKU-101834, SKU-101085, SKU-105159, SKU-105341) have theft incidents at six stores,
    except SKU-101085 knitwear whose losses are water damage. Tagging is the cheapest protection per pound prevented. SKU-101085 sits
    on the high-risk list as damage-driven (HRP-900005) and is removed.
  checks:
    - tool: get_incident_records_for_product
      args: {sku: SKU-101085}
      expect: ["damage", "Roof leak", "ST150"]
    - tool: get_incident_records_for_product
      args: {sku: SKU-105341}
      expect: ["theft_external", "ST159"]
    - tool: calculate_protection_options_cost
      args: {sku: SKU-105341}
      expect: ["tagging", "locked_case", "staff_supervised", "0.72"]
    - tool: update_high_risk_product_list
      args: {sku: SKU-105341, protection_type: tagging, loss_driver: theft}
      expect: ["HRP-900006", "SKU-105341", "tagging"]
    - tool: remove_product_from_high_risk_list
      args: {hrp_id: HRP-900005, reason: "Loss is water damage, not theft"}
      expect: ["removed", "HRP-900005"]
