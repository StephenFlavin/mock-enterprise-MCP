# One entry per question row that uses this system's tools
- question: "07:68:Q5"
  story: >
    Shrink at Leeds Shopping Centre (ST150) has tripled in recent weeks. In three weeks from 14 Sep,
    weekly shrink went from normal 4,000-4,300 GBP to 12,800-13,500 GBP. Most of the increase is in
    theft (up from 1,900 to 6,500+ GBP). Correlations with staff shifts show a pattern. A case is opened
    (LPC-900001) for investigation.
  checks:
    - tool: get_store_shrink_by_period
      args: {site_id: ST150, date_from: "-60d", date_to: "today"}
      expect: ["13500", "13200", "12800", "4100", "4200"]
    - tool: list_incidents_for_region
      args: {region: "UK North", date_from: "-90d"}
      expect: ["ST150", "INC-900001", "theft_internal"]
    - tool: create_loss_prevention_case
      args: {site_id: "ST150", case_type: "internal_theft", description: "Tripled shrink investigation", estimated_loss_gbp: 12500}
      expect: ["LPC-", "open", "internal_theft"]

- question: "07:69:Q3"
  story: >
    Year-end shrink forecast uses historical trends. Stores show typical seasonal pattern with
    peak shrink November-December. Current trends support forecast model.
  checks:
    - tool: get_store_shrink_by_period
      args: {site_id: ST001, date_from: "-180d"}
      expect: ["shrink_gbp", "site_id"]

- question: "08:79:Q1"
  story: >
    Regional analysis for UK North over 6 months shows 20 recorded incidents across Leeds stores.
    Incidents include both internal theft (EMP-0001 correlation), external shoplifting, and system errors.
    Case LPC-900002 is opened for organized retail crime suspicion. Summary is drafted for area manager.
  checks:
    - tool: list_incidents_for_region
      args: {region: "UK North", date_from: "-180d"}
      expect: ["INC-900001", "ST150", "theft_internal", "ST159", "ST165"]
    - tool: draft_loss_prevention_case_summary
      args: {case_id: "LPC-900002"}
      expect: ["LPC-900002", "organized_retail_crime", "£18,500", "INC-900001"]
    - tool: create_loss_prevention_case
      args: {site_id: "ST150", case_type: "internal_theft", description: "Follow-up investigation", estimated_loss_gbp: 8500}
      expect: ["LPC-", "open"]

- question: "08:79:Q2"
  story: >
    Control effectiveness data shows staffing delivering best ROI at 0.37 pounds of shrink reduction
    per pound spent. Tagging at 0.33. Self-checkout monitoring at 0.18. Payback for staffing control
    at ST150 is 2.7 years.
  checks:
    - tool: compare_control_effectiveness
      args: {}
      expect: ["staffing", "tagging", "cost_per_pound_reduced", "CTL-900001"]
    - tool: calculate_control_payback
      args: {control_id: "CTL-900001"}
      expect: ["payback_years"]

- question: "08:79:Q4"
  story: >
    Incident counts by location show ST150 with highest incident frequency (12 incidents over 6 months)
    and total value of 2,400 GBP. ST159 has 2 incidents for 562 GBP. Pattern shows theft-dominant
    locations need targeted controls.
  checks:
    - tool: get_incident_counts_by_location
      args: {date_from: "-180d"}
      expect: ["ST150", "incident_count", "total_value_gbp", "theft_external_count", "theft_internal_count"]

- question: "08:79:Q5"
  story: >
    Self-checkout shrink increased in five stores (ST150, ST159, ST165, ST001, ST002). Incidents
    show system errors and scanning failures contributing. Cost-effectiveness analysis shows
    self-checkout monitoring intervention at 0.18 multiplier for ST150 current shrink of 13,500 GBP.
  checks:
    - tool: list_incidents_for_region
      args: {region: "UK North", incident_type: "system_error"}
      expect: ["INC-900004", "self-checkout", "system"]
    - tool: calculate_intervention_cost_effectiveness
      args: {site_id: "ST150", intervention_type: "self_checkout_monitor", current_shrink_gbp: 13500}
      expect: ["self_checkout_monitor", "3375", "85000"]

- question: "08:79:Q6"
  story: >
    Highest-loss products are PF-220 (portable fan, 256 GBP in incidents), K-1700 (kettle, 257 GBP),
    and SKU-104732 (appliance, 635 GBP). All driven primarily by theft. Top five are added to high-risk
    list with tagging or locked case protection. K-1700 is later removed as damage risk (not theft).
  checks:
    - tool: get_incident_records_for_product
      args: {sku: "PF-220", date_from: "-180d"}
      expect: ["PF-220", "theft_internal", "incident_id"]
    - tool: get_incident_records_for_product
      args: {sku: "K-1700"}
      expect: ["K-1700"]
    - tool: update_high_risk_product_list
      args: {site_id: "ST150", sku: "PF-220", protection_type: "locked_case", loss_driver: "theft", notes: "High-value item frequent incidents"}
      expect: ["ST150", "PF-220", "locked_case"]
    - tool: remove_product_from_high_risk_list
      args: {site_id: "ST150", sku: "K-1700", reason: "Damage driver verified not theft"}
      expect: []
