- question: "03:23:Q6"
  story: >
    The demand planner wants to model Q1 cost-of-living downside scenario. We planted a downside scenario (SOP-S-900002)
    with demand down 5%, promotional intensity up 8 points. The scenario was created successfully and stored with full assumptions.
    The planner will use create_sop_scenario to build this into the S&OP system.
  checks:
    - tool: create_sop_scenario
      args: {name: "Downside Q1 demand squeeze", sop_cycle: "SOP-202701", scenario_type: "downside",
             description: "5% demand reduction due to consumer confidence shock; promotional intensity +8pp",
             created_by: "EMP-00011"}
      expect: ["SOP-S-", "draft", "downside"]

- question: "03:27:Q1"
  story: >
    The S&OP lead needs to see what changed in assumptions since the prior cycle. We planted assumption changes
    (SOP-C-900001 through SOP-C-900005) showing demand, supply, finance and macro changes. The lead will retrieve these
    to brief the exec team on drivers of changes and then create a pre-read for attendees.
  checks:
    - tool: get_assumption_changes_since_cycle
      args: {sop_cycle: "SOP-202701"}
      expect: ["SOP-C-900", "demand"]
    - tool: get_assumption_change_owner_and_reason
      args: {change_id: "SOP-C-900001"}
      expect: ["SOP-C-900001"]
    - tool: list_disputed_assumptions
      args: {}
      expect: ["SOP-D-900"]
    - tool: draft_sop_pre_read
      args: {sop_cycle: "SOP-202701"}
      expect: ["PRE-READ"]

- question: "03:27:Q2"
  story: >
    The S&OP lead is comparing Q4 scenarios for the executive. We planted four scenarios with different assumptions and impacts.
    The lead will retrieve the baseline, run each scenario, compare metrics, identify risks, and show triggers for switches.
  checks:
    - tool: get_current_plan_baseline
      args: {sop_cycle: "SOP-202701"}
      expect: ["SOP-B-", "Q4 2026"]
    - tool: run_s_op_scenario
      args: {scenario_id: "SOP-S-900001"}
      expect: ["SOP-R-900001"]
    - tool: run_s_op_scenario
      args: {scenario_id: "SOP-S-900002"}
      expect: ["SOP-R-900002", "-5"]
    - tool: run_s_op_scenario
      args: {scenario_id: "SOP-S-900003"}
      expect: ["SOP-R-900003"]
    - tool: calculate_scenario_revenue_margin
      args: {scenario_id: "SOP-S-900002"}
      expect: ["formula"]
    - tool: calculate_scenario_service_level
      args: {scenario_id: "SOP-S-900002"}
      expect: ["formula"]
    - tool: calculate_scenario_cash_impact
      args: {scenario_id: "SOP-S-900002", sales_variance_pct: "-5"}
      expect: ["formula"]
    - tool: compare_scenarios_risk_adjusted
      args: {sop_cycle: "SOP-202701"}
      expect: ["SOP-S-"]

- question: "03:27:Q4"
  story: >
    The S&OP lead wants to see what macro news is relevant and compare it to the current forecast. We planted 8 external
    assumptions covering GDP, inflation, consumer confidence, employment, interest rates, and other macro factors.
  checks:
    - tool: get_forecast_external_assumptions
      args: {sop_cycle: "SOP-202701"}
      expect: ["SOP-E-900"]
    - tool: compare_news_to_plan_assumptions
      args: {sop_cycle: "SOP-202701"}
      expect: ["SOP-E-900"]

- question: "03:27:Q5"
  story: >
    The S&OP lead is analyzing new product forecast accuracy. We planted 5 product launches with varying forecast accuracy
    to identify which assumptions are wrong and root causes.
  checks:
    - tool: get_launch_assumptions_vs_actuals
      args: {}
      expect: ["SOP-L-900", "accuracy"]
    - tool: get_launch_assumptions_vs_actuals
      args: {launch_date: "-26w"}
      expect: ["SOP-L-900"]
