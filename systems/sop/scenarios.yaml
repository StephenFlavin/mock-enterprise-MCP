- question: "03:23:Q6"
  story: >
    The demand planner wants a Q1 cost-of-living downside saved in the current S&OP cycle (SOP-202610) so it can be
    discussed. create_sop_scenario stores the name, cycle, type, Q1 2027 period, demand change and drivers as a draft.
  checks:
    - tool: create_sop_scenario
      args: {name: "Q1 cost-of-living downside", sop_cycle: "SOP-202610", scenario_type: "downside", forecast_period: "Q1 2027",
             demand_change_pct: -4, description: "Demand 4% below plan on cost-of-living pressure; promotional intensity up 3 points",
             created_by: "EMP-00036"}
      expect: ["SOP-S-900004", "draft", "downside", "Q1 2027"]

- question: "03:27:Q1"
  story: >
    Ten assumption changes were made in SOP-202610 (prior cycle SOP-202609): demand SOP-C-900001 to 900003, supply 900004 to
    900006, finance 900007 to 900009 and macro 900010. Biggest revenue effect is SOP-C-900001 (-£1.85M, Michael Knight); biggest
    inventory effect is SOP-C-900006 (+320,000 units). SOP-C-900001 and SOP-C-900004 are still disputed, as is scenario
    assumption SOP-A-900021; SOP-C-900008 was disputed and resolved.
  checks:
    - tool: get_assumption_changes_since_cycle
      args: {}
      expect: ["SOP-C-900001", "Michael Knight", "Billy Woodward", "Dr Harry McLean", "footfall", "-1850000"]
    - tool: get_assumption_changes_since_cycle
      args: {sort_by: inventory}
      expect: ["SOP-C-900006", "320000"]
    - tool: get_assumption_change_owner_and_reason
      args: {change_id: "SOP-C-900004"}
      expect: ["Billy Woodward", "Supply Planner", "Shanghai port congestion"]
    - tool: list_disputed_assumptions
      args: {}
      expect: ["SOP-D-900001", "SOP-D-900002", "SOP-D-900003", "Dr John Buckley", "+1.5% YoY"]
    - tool: draft_sop_pre_read
      args: {}
      expect: ["S&OP PRE-READ - SOP-202610", "Baseline demand growth", "Michael Knight", "Still disputed"]

- question: "03:27:Q2"
  story: >
    Current cycle SOP-202610 holds three Q4 2026 scenarios: SOP-S-900001 Hold Current Plan (low risk), SOP-S-900002 Lift Stock
    +10% Key Lines (medium risk) and SOP-S-900003 Cut Promotions Weeks 47-49 (high risk), each with a run, assumptions with
    confidence levels and a switch trigger. Hold Current Plan ranks first on risk-adjusted gross profit (22.23M). The lift stock
    scenario drops from 11.3M to about 8.99M cash if sales come in 5% under.
  checks:
    - tool: get_current_plan_baseline
      args: {}
      expect: ["SOP-B-900001", "Q4 2026", "68400000"]
    - tool: run_s_op_scenario
      args: {}
      expect: ["SOP-R-900001", "SOP-R-900002", "SOP-R-900003", "Lift Stock +10% Key Lines"]
    - tool: calculate_scenario_revenue_margin
      args: {}
      expect: ["69900000", "34.1", "formula"]
    - tool: calculate_scenario_service_level
      args: {}
      expect: ["97.1", "95.4"]
    - tool: calculate_scenario_cash_impact
      args: {scenario_id: "SOP-S-900002", sales_variance_pct: -5}
      expect: ["8989805", "-3495000"]
    - tool: compare_scenarios_risk_adjusted
      args: {}
      expect: ["Hold Current Plan", "22230000", "21382410", "19390965"]
    - tool: get_scenario_assumptions
      args: {}
      expect: ["SOP-A-900021", "SOP-A-900013", "Supplier capacity confirmations still outstanding"]

- question: "03:27:Q4"
  story: >
    Eight external assumptions sit in SOP-202610. Five are already in the forecast (GDP, CPI inflation, consumer confidence,
    employment, Asia port disruption); three are news not yet reflected: the Bank of England rate cut SOP-E-900006 (high
    confidence, should add), competitor Black Friday clearance SOP-E-900007 and the Ofgem price cap rise SOP-E-900008.
  checks:
    - tool: get_forecast_external_assumptions
      args: {already_in_forecast: true}
      expect: ["SOP-E-900002", "SOP-E-900005", "CPI inflation forecast"]
    - tool: compare_news_to_plan_assumptions
      args: {}
      expect: ["SOP-E-900006", "Should add to forecast", "SOP-E-900007", "SOP-E-900008"]

- question: "03:27:Q5"
  story: >
    Nine launches over three cycles (SOP-202607 to SOP-202609). Seven were over-forecast by 25 to 45 percent; the worst is
    SOP-L-900009 (SKU-100259, 55% of forecast). Distribution was assumed at 80 to 95 percent and came in 57 to 69 percent on those seven, and
    ramp timing slipped 6 to 16 days on the same seven, so distribution assumptions are the consistently wrong ones.
  checks:
    - tool: get_launch_assumptions_vs_actuals
      args: {}
      expect: ["SOP-L-900009", "SKU-100259", "-45", "-38", "distribution only 57%"]
    - tool: get_launch_assumptions_vs_actuals
      args: {sop_cycle: "SOP-202608"}
      expect: ["SOP-L-900004", "SOP-L-900005", "SOP-L-900006"]
