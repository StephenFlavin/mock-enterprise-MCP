- question: "03:23:Q6"
  story: >
    The demand planner wants to model Q1 cost-of-living downside scenario. We planted a downside scenario (SOP-S-900002)
    with demand down 5%, promotional intensity up 8 points, showing revenue impact of -5% (£43.2M vs £45.5M baseline).
    The scenario was created successfully and stored with full assumptions. The planner will use create_sop_scenario
    to build this into the S&OP system.
  checks:
    - tool: create_sop_scenario
      args: {name: "Downside Q1 demand squeeze", sop_cycle: "2026-10", scenario_type: "downside",
             description: "5% demand reduction due to consumer confidence shock; promotional intensity +8pp",
             created_by: "EMP-01235"}
      expect: ["SOP-S-", "draft", "downside"]

- question: "03:27:Q1"
  story: >
    The S&OP lead needs to see what changed in assumptions since the prior cycle. We planted assumption changes
    (SOP-C-900001 through SOP-C-900005) showing demand, supply, finance and macro changes with revenue impacts
    ranging from -£890k to +£1.2M. The lead will retrieve these to brief the exec team on drivers of changes
    and then create a pre-read for attendees.
  checks:
    - tool: get_assumption_changes_since_cycle
      args: {sop_cycle: "2026-10"}
      expect: ["SOP-C-", "demand", "supply", "finance", "macro", "1200000", "680000"]
    - tool: get_assumption_change_owner_and_reason
      args: {change_id: "SOP-C-900001"}
      expect: ["SOP-C-900001", "demand", "H1 repeat purchase", "1200000"]
    - tool: list_disputed_assumptions
      args: {}
      expect: ["SOP-D-", "Demand elasticity", "3%"]
    - tool: draft_sop_pre_read
      args: {sop_cycle: "2026-10"}
      expect: ["S&OP PRE-READ", "2026-10", "scenarios", "Downside"]

- question: "03:27:Q2"
  story: >
    The S&OP lead is comparing Q4 scenarios for the executive. We planted four scenarios: Hold Current Plan (baseline, 0% variance),
    Cost-of-Living Downside (-5% revenue, -1.8pp margin), Stock Lift 10% (+0% revenue but 9% higher inventory),
    and Strong Holiday Demand (+6% revenue, +1.5pp margin). Each has revenue, margin, cash and service level metrics.
    The lead will retrieve the baseline, run each scenario, compare metrics, identify risks, and show triggers for switches.
  checks:
    - tool: get_current_plan_baseline
      args: {}
      expect: ["SOP-B-", "2026-10", "Q4 2026", "45500000", "32.5"]
    - tool: run_s_op_scenario
      args: {scenario_id: "SOP-S-900001"}
      expect: ["SOP-R-", "Hold Current Plan", "45500000", "32.5", "94.5"]
    - tool: run_s_op_scenario
      args: {scenario_id: "SOP-S-900002"}
      expect: ["SOP-R-", "43225000", "-5", "30.7", "-1.8", "96.5"]
    - tool: run_s_op_scenario
      args: {scenario_id: "SOP-S-900003"}
      expect: ["SOP-R-", "45500000", "3080000", "96.8"]
    - tool: calculate_scenario_revenue_margin
      args: {scenario_id: "SOP-S-900002"}
      expect: ["43225000", "-5", "30.7", "formula"]
    - tool: calculate_scenario_service_level
      args: {scenario_id: "SOP-S-900002"}
      expect: ["96.5", "variance", "formula"]
    - tool: calculate_scenario_cash_impact
      args: {scenario_id: "SOP-S-900002", sales_variance_pct: "-5"}
      expect: ["7521000", "adjusted_cash", "formula"]
    - tool: compare_scenarios_risk_adjusted
      args: {sop_cycle: "2026-10"}
      expect: ["SOP-S-", "revenue", "margin", "cash", "risk_adjusted"]

- question: "03:27:Q4"
  story: >
    The S&OP lead wants to see what macro news is relevant and compare it to the current forecast. We planted 8 external
    assumptions covering GDP growth, inflation, consumer confidence, employment, interest rates, competitor actions,
    supply disruption, and regulatory changes. Some are already baked in (GDP, inflation, employment), while others
    need discussion (interest rate cuts, competitor pressure, supply disruption, regulatory impact).
  checks:
    - tool: get_forecast_external_assumptions
      args: {sop_cycle: "2026-10"}
      expect: ["SOP-E-", "gdp_growth", "inflation", "consumer_confidence", "Office for National Statistics"]
    - tool: compare_news_to_plan_assumptions
      args: {sop_cycle: "2026-10"}
      expect: ["SOP-E-", "recommended_action", "already reflected", "monitor"]

- question: "03:27:Q5"
  story: >
    The S&OP lead is analyzing new product forecast accuracy to identify systematic forecast errors. We planted 5 launches
    with variances from -25% (SOP-L-900004) to +40% (SOP-L-900005). The lead will identify which assumptions are wrong
    (demand, timing, distribution) and root causes (supplier allocation, digital channel underestimation, social media virality).
  checks:
    - tool: get_launch_assumptions_vs_actuals
      args: {}
      expect: ["SOP-L-", "accuracy", "75", "140", "timing", "distribution"]
    - tool: get_launch_assumptions_vs_actuals
      args: {launch_date: "-26w"}
      expect: ["SOP-L-900001", "K-1700", "75", "28"]
