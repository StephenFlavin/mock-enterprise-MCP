id: sop
name: S&OP Platform
instructions: >
  Sales & Operations Planning (S&OP) scenarios, assumptions, and plan baseline for executive review.
  Scenario ids look like SOP-S-000123 (scenario) and SOP-A-000456 (assumption).
  Use it for planning scenarios, assumption tracking, forecast accuracy analysis, and
  executive pre-reads.

tables:
  sop_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Scenario, e.g. SOP-S-000123"}
      name: {type: str, desc: "Scenario name, e.g. Downside Q1"}
      sop_cycle: {type: str, desc: "S&OP cycle, e.g. SOP-2027-01"}
      scenario_type: {type: enum, values: [baseline, upside, downside, test, other], desc: Scenario type}
      created_by: {type: str, desc: "Employee id of creator"}
      created_at: {type: timestamp, desc: "When created"}
      description: {type: str, desc: "Scenario description and key drivers"}
      status: {type: enum, values: [draft, submitted, approved, archived], desc: Scenario status}
      updated_at: {type: timestamp, desc: "Last updated"}

  sop_scenario_assumptions:
    key: assumption_id
    cols:
      assumption_id: {type: str, desc: "Assumption, e.g. SOP-A-000456"}
      scenario_id: {type: str, desc: "Scenario this assumption belongs to"}
      category: {type: enum, values: [demand, supply, finance, macro, channel], desc: "Assumption category"}
      description: {type: str, desc: "What the assumption is"}
      assumption_value: {type: str, desc: "The assumption (e.g. demand down 5%, promotional intensity +10%)"}
      basis: {type: str, desc: "Rationale or evidence"}
      is_disputed: {type: bool, desc: "True if this assumption has disagreement"}
      dispute_reason: {type: str, desc: "Why it is disputed if applicable"}
      owner_id: {type: str, desc: "Employee id of assumption owner"}
      created_at: {type: timestamp, desc: "When created"}

  assumption_changes:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change record, e.g. SOP-C-000789"}
      sop_cycle: {type: str, desc: "S&OP cycle, e.g. SOP-2027-01"}
      prior_cycle: {type: str, desc: "Previous cycle, e.g. SOP-2026-09"}
      category: {type: enum, values: [demand, supply, finance, macro, channel], desc: "Category of assumption changed"}
      description: {type: str, desc: "Description of what changed"}
      prior_assumption: {type: str, desc: "Previous assumption value"}
      new_assumption: {type: str, desc: "New assumption value"}
      owner_id: {type: str, desc: "Employee who made the change"}
      reason: {type: str, desc: "Why it was changed"}
      revenue_impact_gbp: {type: float, desc: "Estimated impact on revenue in GBP"}
      inventory_impact_units: {type: float, desc: "Estimated impact on inventory in units"}
      changed_at: {type: timestamp, desc: "When the change was made"}

  scenario_runs:
    key: run_id
    cols:
      run_id: {type: str, desc: "Scenario run result, e.g. SOP-R-000123"}
      scenario_id: {type: str, desc: "Scenario that was run"}
      sop_cycle: {type: str, desc: "S&OP cycle"}
      run_date: {type: date, desc: "Date the scenario was modelled"}
      forecast_period: {type: str, desc: "Forecast period, e.g. Q4 2026"}
      base_revenue_gbp: {type: float, desc: "Base revenue forecast in GBP"}
      scenario_revenue_gbp: {type: float, desc: "Revenue in this scenario in GBP"}
      scenario_revenue_variance_pct: {type: float, desc: "Revenue variance % vs base"}
      base_margin_pct: {type: float, desc: "Base gross margin %"}
      scenario_margin_pct: {type: float, desc: "Margin % in this scenario"}
      scenario_margin_variance_pct: {type: float, desc: "Margin variance percentage points"}
      scenario_cash_flow_gbp: {type: float, desc: "Cash impact in GBP"}
      service_level_pct: {type: float, desc: "Expected service level %"}
      inventory_units: {type: float, desc: "Ending inventory units"}
      inventory_value_gbp: {type: float, desc: "Ending inventory value in GBP"}
      key_risks: {type: str, desc: "Comma-separated list of key risks identified"}
      mitigation_actions: {type: str, desc: "Proposed mitigations for risks"}
      trigger_for_switch: {type: str, desc: "What event would trigger moving to this scenario"}
      created_at: {type: timestamp, desc: "When run was created"}

  plan_baseline:
    key: baseline_id
    cols:
      baseline_id: {type: str, desc: "Baseline record, e.g. SOP-B-000123"}
      sop_cycle: {type: str, desc: "S&OP cycle, e.g. SOP-2027-01"}
      forecast_period: {type: str, desc: "Forecast period, e.g. Q4 2026"}
      revenue_gbp: {type: float, desc: "Current plan revenue in GBP"}
      margin_pct: {type: float, desc: "Current plan gross margin %"}
      cash_flow_gbp: {type: float, desc: "Current plan operating cash flow in GBP"}
      service_level_pct: {type: float, desc: "Current plan service level %"}
      inventory_units: {type: float, desc: "Current plan ending inventory units"}
      promotional_intensity_pct: {type: float, desc: "% of sales with promotion"}
      demand_assumption: {type: str, desc: "Base demand assumption"}
      supply_assumption: {type: str, desc: "Base supply assumption"}
      created_at: {type: timestamp, desc: "When baseline was established"}

  new_product_launches:
    key: launch_id
    cols:
      launch_id: {type: str, desc: "Product launch, e.g. SOP-L-000123"}
      sop_cycle: {type: str, desc: "S&OP cycle when launched"}
      sku: {type: str, desc: "Product SKU"}
      style_id: {type: str, desc: "Style id"}
      launch_date: {type: date, desc: "Actual/planned launch date"}
      demand_assumption_units: {type: float, desc: "Assumed demand in units (12 week window)"}
      actual_demand_units: {type: float, desc: "Actual demand in units"}
      demand_assumption_accuracy_pct: {type: float, desc: "Actual vs assumed %"}
      timing_assumption_days: {type: int, desc: "Assumed ramp timing in days"}
      actual_timing_days: {type: int, desc: "Actual ramp timing in days"}
      distribution_assumption_pct: {type: float, desc: "Assumed % of channels/stores"}
      actual_distribution_pct: {type: float, desc: "Actual % of channels/stores"}
      retail_price_gbp: {type: float, desc: "Retail price in GBP"}
      notes: {type: str, desc: "Notes on forecast accuracy"}

  external_assumptions:
    key: ext_assumption_id
    cols:
      ext_assumption_id: {type: str, desc: "External assumption, e.g. SOP-E-000456"}
      sop_cycle: {type: str, desc: "S&OP cycle, e.g. SOP-2027-01"}
      category: {type: enum, values: [gdp_growth, inflation, consumer_confidence, employment, interest_rate, competitor_action, regulatory, supply_disruption], desc: "Macro category"}
      description: {type: str, desc: "Description of the macro assumption"}
      assumed_value: {type: str, desc: "The assumption value"}
      source: {type: str, desc: "Source of assumption (e.g. Office for National Statistics, industry consensus)"}
      confidence_level: {type: enum, values: [high, medium, low, very_low], desc: "Confidence in this assumption"}
      impact_on_demand: {type: str, desc: "How this affects demand assumptions"}
      impact_on_supply: {type: str, desc: "How this affects supply assumptions"}
      news_exposure_date: {type: date, desc: "When news broke"}
      already_in_forecast: {type: bool, desc: "True if already incorporated"}
      created_at: {type: timestamp, desc: "When assumption was added"}

  disputed_assumptions:
    key: dispute_id
    cols:
      dispute_id: {type: str, desc: "Dispute record, e.g. SOP-D-000789"}
      assumption_id: {type: str, desc: "Which assumption is disputed"}
      sop_cycle: {type: str, desc: "S&OP cycle"}
      raised_by: {type: str, desc: "Employee id of person raising dispute"}
      reason: {type: str, desc: "Reason for disagreement"}
      alternative_value: {type: str, desc: "Alternative value proposed"}
      raised_at: {type: timestamp, desc: "When dispute was raised"}
      resolution: {type: str, desc: "How it was resolved"}
      resolved_at: {type: timestamp, desc: "When resolved"}

tools:
  - name: get_current_plan_baseline
    desc: "Current plan baseline for revenue, margin, cash and service level. Use to understand the starting point."
    kind: select
    from: plan_baseline
    filters:
      sop_cycle: {}
    order: sop_cycle DESC
    limit: 1
    example: {}

  - name: run_s_op_scenario
    desc: "Run a modelled S&OP scenario to see revenue, margin, cash impact and service level. Use to model what-ifs."
    kind: select
    from: scenario_runs
    filters:
      scenario_id: {}
      sop_cycle: {}
    columns: [run_id, scenario_id, forecast_period, base_revenue_gbp, scenario_revenue_gbp,
              scenario_revenue_variance_pct, base_margin_pct, scenario_margin_pct, scenario_cash_flow_gbp,
              service_level_pct, key_risks, trigger_for_switch]
    order: created_at DESC
    limit: 5
    example: {scenario_id: "SOP-S-900001"}

  - name: calculate_scenario_revenue_margin
    desc: "Calculate revenue and margin for a scenario with formula shown. For detailed financial impact."
    kind: sql
    args:
      scenario_id: {required: true}
      sop_cycle: {}
    sql: |
      SELECT sr.run_id, sr.scenario_id, sr.forecast_period,
             sr.base_revenue_gbp, sr.scenario_revenue_gbp,
             CAST(sr.scenario_revenue_variance_pct AS FLOAT) AS revenue_variance_pct,
             sr.base_margin_pct, sr.scenario_margin_pct,
             CAST(sr.scenario_margin_variance_pct AS FLOAT) AS margin_variance_pct,
             'Revenue variance = (scenario_revenue - base_revenue) / base_revenue * 100; Margin variance = (scenario_margin_pct - base_margin_pct)' AS formula
      FROM scenario_runs sr
      WHERE sr.scenario_id = $scenario_id
        AND ($sop_cycle IS NULL OR sr.sop_cycle = $sop_cycle)
      ORDER BY sr.created_at DESC
      LIMIT 5
    example: {scenario_id: "SOP-S-900001"}

  - name: calculate_scenario_service_level
    desc: "Calculate expected service level % for a scenario. Compare to plan baseline."
    kind: sql
    args:
      scenario_id: {required: true}
    sql: |
      SELECT sr.scenario_id, sr.forecast_period, sr.service_level_pct,
             pb.service_level_pct AS baseline_service_level_pct,
             CAST(sr.service_level_pct - pb.service_level_pct AS FLOAT) AS service_level_variance_pct,
             'Service level impact = scenario_level - baseline_level' AS formula
      FROM scenario_runs sr
      LEFT JOIN plan_baseline pb ON pb.sop_cycle = sr.sop_cycle AND pb.forecast_period = sr.forecast_period
      WHERE sr.scenario_id = $scenario_id
      ORDER BY sr.created_at DESC
      LIMIT 1
    example: {scenario_id: "SOP-S-900001"}

  - name: calculate_scenario_cash_impact
    desc: "Calculate cash flow impact of a scenario with what-if sensitivity analysis. Use to model downside risks."
    kind: sql
    args:
      scenario_id: {required: true}
      sales_variance_pct: {type: float, desc: "What-if sales come in X% under plan", default: 0}
    sql: |
      SELECT sr.scenario_id, sr.forecast_period,
             sr.scenario_cash_flow_gbp AS base_scenario_cash_gbp,
             CAST(sr.scenario_cash_flow_gbp * (1 + ($sales_variance_pct / 100.0)) AS FLOAT) AS adjusted_cash_gbp,
             CAST((sr.scenario_cash_flow_gbp * (1 + ($sales_variance_pct / 100.0))) - sr.scenario_cash_flow_gbp AS FLOAT) AS cash_variance_gbp,
             'Cash = base_cash * (1 + sales_variance); variance = adjusted_cash - base_cash' AS formula
      FROM scenario_runs sr
      WHERE sr.scenario_id = $scenario_id
      ORDER BY sr.created_at DESC
      LIMIT 1
    example: {scenario_id: "SOP-S-900001", sales_variance_pct: "-5"}

  - name: compare_scenarios_risk_adjusted
    desc: "Compare scenarios by revenue, margin, cash and risk. Rank by risk-adjusted returns. Use for exec decision."
    kind: sql
    args:
      sop_cycle: {default: "current"}
    sql: |
      SELECT sr.scenario_id, s.name, sr.forecast_period,
             sr.scenario_revenue_gbp, sr.scenario_margin_pct, sr.scenario_cash_flow_gbp,
             sr.service_level_pct, sr.key_risks,
             CASE WHEN sr.key_risks LIKE '%critical%' THEN 0.7
                  WHEN sr.key_risks LIKE '%high%' THEN 0.85
                  ELSE 1.0 END AS risk_factor,
             CAST(sr.scenario_revenue_gbp * CASE WHEN sr.key_risks LIKE '%critical%' THEN 0.7
                  WHEN sr.key_risks LIKE '%high%' THEN 0.85
                  ELSE 1.0 END AS FLOAT) AS risk_adjusted_revenue_gbp,
             sr.trigger_for_switch
      FROM scenario_runs sr
      JOIN sop_scenarios s ON s.scenario_id = sr.scenario_id
      WHERE sr.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM scenario_runs) ELSE $sop_cycle END
      ORDER BY risk_adjusted_revenue_gbp DESC
    limit: 10
    example: {}

  - name: get_scenario_assumptions
    desc: "Get all assumptions for a scenario including disputed ones. Use to understand what drives each scenario."
    kind: select
    from: sop_scenario_assumptions
    filters:
      scenario_id: {required: true}
      category: {}
      is_disputed: {}
    columns: [assumption_id, scenario_id, category, description, assumption_value, basis, is_disputed, dispute_reason, owner_id]
    order: category, created_at DESC
    limit: 50
    example: {scenario_id: "SOP-S-900001"}

  - name: get_assumption_changes_since_cycle
    desc: "Assumption changes since prior S&OP cycle with revenue and inventory impact. Use to brief exec on what changed."
    kind: select
    from: assumption_changes
    filters:
      sop_cycle: {desc: "S&OP cycle, e.g. SOP-2027-01 or leave blank for current"}
      prior_cycle: {}
      category: {}
    columns: [change_id, category, description, prior_assumption, new_assumption, owner_id, reason, revenue_impact_gbp, inventory_impact_units, changed_at]
    order: revenue_impact_gbp DESC NULLS LAST, changed_at DESC
    limit: 30
    example: {}

  - name: get_assumption_change_owner_and_reason
    desc: "Who changed an assumption and why. Use for assumption traceability and accountability."
    kind: sql
    args:
      change_id: {required: true}
    sql: |
      SELECT ac.change_id, ac.description, ac.category, ac.prior_assumption, ac.new_assumption,
             e.name AS owner_name, e.employee_id, e.role, ac.reason,
             ac.revenue_impact_gbp, ac.inventory_impact_units, ac.changed_at
      FROM assumption_changes ac
      LEFT JOIN master.employees e ON e.employee_id = ac.owner_id
      WHERE ac.change_id = $change_id
    example: {change_id: "SOP-C-900001"}

  - name: list_disputed_assumptions
    desc: "Assumptions with active disagreement this cycle. Use to highlight contentious planning inputs."
    kind: sql
    args:
      sop_cycle: {default: "current"}
    sql: |
      SELECT da.dispute_id, ssa.assumption_id, ssa.scenario_id, ssa.category,
             ssa.description, ssa.assumption_value AS current_value,
             da.alternative_value, da.reason,
             e1.name AS raised_by_name, e2.name AS owner_name,
             da.raised_at, da.resolution
      FROM disputed_assumptions da
      JOIN sop_scenario_assumptions ssa ON ssa.assumption_id = da.assumption_id
      LEFT JOIN master.employees e1 ON e1.employee_id = da.raised_by
      LEFT JOIN master.employees e2 ON e2.employee_id = ssa.owner_id
      WHERE CASE WHEN $sop_cycle = 'current' THEN ssa.scenario_id IN (
        SELECT scenario_id FROM sop_scenarios WHERE sop_cycle = (SELECT MAX(sop_cycle) FROM sop_scenarios))
        ELSE ssa.scenario_id IN (SELECT scenario_id FROM sop_scenarios WHERE sop_cycle = $sop_cycle) END
      ORDER BY da.raised_at DESC
    limit: 20
    example: {}

  - name: get_forecast_external_assumptions
    desc: "External macro assumptions (GDP, inflation, consumer confidence, etc) baked into this cycle's forecast."
    kind: select
    from: external_assumptions
    filters:
      sop_cycle: {default: "current"}
      category: {}
      already_in_forecast: {}
    columns: [ext_assumption_id, category, description, assumed_value, source, confidence_level, impact_on_demand, impact_on_supply, already_in_forecast]
    order: confidence_level, category
    limit: 30
    example: {}

  - name: compare_news_to_plan_assumptions
    desc: "Compare recent macro news against what's already in the forecast assumptions. Flag what's missing."
    kind: sql
    args:
      sop_cycle: {default: "current"}
    sql: |
      SELECT ea.ext_assumption_id, ea.category, ea.description, ea.assumed_value,
             ea.source, ea.confidence_level, ea.already_in_forecast,
             CASE WHEN ea.already_in_forecast = true THEN 'Already reflected'
                  WHEN ea.confidence_level = 'high' THEN 'Should add to forecast'
                  WHEN ea.confidence_level = 'medium' THEN 'Monitor before adding'
                  ELSE 'Low confidence - defer' END AS recommended_action,
             ea.impact_on_demand, ea.impact_on_supply
      FROM external_assumptions ea
      WHERE ea.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM external_assumptions) ELSE $sop_cycle END
      ORDER BY ea.already_in_forecast, ea.confidence_level DESC
    limit: 20
    example: {}

  - name: get_launch_assumptions_vs_actuals
    desc: "New product launch forecast accuracy: demand, timing and distribution vs plan. Use to improve forecast."
    kind: select
    from: new_product_launches
    filters:
      sop_cycle: {}
      launch_date: {col: launch_date, op: ">=", default: "-26w"}
    columns: [launch_id, sku, style_id, launch_date, demand_assumption_units, actual_demand_units,
              demand_assumption_accuracy_pct, timing_assumption_days, actual_timing_days,
              distribution_assumption_pct, actual_distribution_pct, notes]
    order: demand_assumption_accuracy_pct ASC NULLS LAST
    limit: 20
    example: {}

  - name: draft_sop_pre_read
    desc: "Draft pre-read for S&OP exec meeting with assumptions, scenarios and key risks."
    kind: draft
    args:
      sop_cycle: {default: "current"}
      include_scenarios: {type: bool, desc: "Include scenario comparison", default: true}
    sql:
      cycle_info: |
        SELECT $sop_cycle AS sop_cycle, 'Q4 2026' AS forecast_period
      scenarios: |
        SELECT s.name, s.description, sr.forecast_period, sr.scenario_revenue_gbp,
               sr.scenario_margin_pct, sr.scenario_cash_flow_gbp, sr.service_level_pct
        FROM sop_scenarios s
        LEFT JOIN scenario_runs sr ON sr.scenario_id = s.scenario_id
        WHERE s.sop_cycle = $sop_cycle AND sr.sop_cycle = $sop_cycle
        ORDER BY s.scenario_type = 'baseline' DESC, s.name
      assumptions: |
        SELECT DISTINCT category, COUNT(*) AS count, SUM(CASE WHEN is_disputed THEN 1 ELSE 0 END) AS disputed
        FROM sop_scenario_assumptions
        WHERE scenario_id IN (SELECT scenario_id FROM sop_scenarios WHERE sop_cycle = $sop_cycle)
        GROUP BY category
      changes: |
        SELECT category, COUNT(*) AS changes, SUM(ABS(CAST(revenue_impact_gbp AS FLOAT))) AS total_impact
        FROM assumption_changes
        WHERE sop_cycle = $sop_cycle
        GROUP BY category
    template: |
      # S&OP PRE-READ — {{ cycle_info[0].sop_cycle }}

      ## Forecast Period: {{ cycle_info[0].forecast_period }}

      ### Scenarios
      {% for s in scenarios %}
      - **{{ s.name }}**: £{{ s.scenario_revenue_gbp|money }}, {{ s.scenario_margin_pct }}% margin,
        £{{ s.scenario_cash_flow_gbp|money }} cash, {{ s.service_level_pct }}% service level
      {% endfor %}

      ### Assumptions Summary
      | Category | Count | Disputed |
      |---|---|---|
      {% for a in assumptions %}
      | {{ a.category }} | {{ a.count }} | {{ a.disputed }} |
      {% endfor %}

      ### Changes Since Last Cycle
      {% for c in changes %}
      - **{{ c.category|title }}**: {{ c.changes }} changes, £{{ c.total_impact|money }} impact
      {% endfor %}

      Please review and send any questions before Thursday's meeting.
    example: {}

  - name: create_sop_scenario
    desc: "Save a new S&OP scenario with its assumptions. Use to build a model the team can discuss."
    kind: insert
    table: sop_scenarios
    id_prefix: "SOP-S-"
    defaults: {status: draft}
    args:
      name: {required: true, desc: "Scenario name, e.g. Downside Q1 demand"}
      sop_cycle: {required: true, desc: "S&OP cycle, e.g. SOP-2027-01"}
      scenario_type: {required: true}
      description: {required: true, desc: "What drives this scenario"}
      created_by: {required: true, desc: "Employee id"}
    example: {name: "Downside Q1", sop_cycle: "current", scenario_type: "downside",
              description: "5% demand reduction due to consumer confidence shock", created_by: "EMP-00010"}
