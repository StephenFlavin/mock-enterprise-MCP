id: sop
name: S&OP Platform
instructions: >
  Sales & Operations Planning (S&OP) scenarios, assumptions, and plan baseline for executive review.
  Scenario ids look like SOP-S-000123 (scenario) and SOP-A-000456 (assumption).
  Use it for planning scenarios, assumption tracking, forecast accuracy analysis, and
  executive pre-reads.

tables:
  sop_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Scenario, e.g. SOP-S-000123"}
      name: {type: str, desc: "Scenario name, e.g. Downside Q1"}
      sop_cycle: {type: str, desc: "S&OP cycle, e.g. SOP-202610"}
      scenario_type: {type: enum, values: [baseline, upside, downside, test, other], desc: Scenario type}
      created_by: {type: str, desc: "Employee id of creator"}
      created_at: {type: timestamp, desc: "When created"}
      forecast_period: {type: str, desc: "Period the scenario models, e.g. Q4 2026"}
      demand_change_pct: {type: float, desc: "Demand change vs plan in percent, e.g. -4"}
      description: {type: str, desc: "Scenario description and key drivers"}
      status: {type: enum, values: [draft, submitted, approved, archived], desc: Scenario status}
      updated_at: {type: timestamp, desc: "Last updated"}

  sop_scenario_assumptions:
    key: assumption_id
    cols:
      assumption_id: {type: str, desc: "Assumption, e.g. SOP-A-000456"}
      scenario_id: {type: str, desc: "Scenario this assumption belongs to"}
      category: {type: enum, values: [demand, supply, finance, macro, channel], desc: "Assumption category"}
      description: {type: str, desc: "What the assumption is"}
      assumption_value: {type: str, desc: "The assumption (e.g. demand down 5%, promotional intensity +10%)"}
      basis: {type: str, desc: "Rationale or evidence"}
      confidence_level: {type: enum, values: [high, medium, low], desc: "Confidence in the assumption"}
      is_disputed: {type: bool, desc: "True if this assumption has disagreement"}
      dispute_reason: {type: str, desc: "Why it is disputed if applicable"}
      owner_id: {type: str, desc: "Employee id of assumption owner"}
      created_at: {type: timestamp, desc: "When created"}

  assumption_changes:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change record, e.g. SOP-C-000789"}
      sop_cycle: {type: str, desc: "S&OP cycle, e.g. SOP-202610"}
      prior_cycle: {type: str, desc: "Previous cycle, e.g. SOP-202609"}
      category: {type: enum, values: [demand, supply, finance, macro, channel], desc: "Category of assumption changed"}
      description: {type: str, desc: "Description of what changed"}
      prior_assumption: {type: str, desc: "Previous assumption value"}
      new_assumption: {type: str, desc: "New assumption value"}
      owner_id: {type: str, desc: "Employee who made the change"}
      reason: {type: str, desc: "Why it was changed"}
      revenue_impact_gbp: {type: float, desc: "Estimated impact on revenue in GBP"}
      inventory_impact_units: {type: float, desc: "Estimated impact on inventory in units"}
      changed_at: {type: timestamp, desc: "When the change was made"}

  scenario_runs:
    key: run_id
    cols:
      run_id: {type: str, desc: "Scenario run result, e.g. SOP-R-000123"}
      scenario_id: {type: str, desc: "Scenario that was run"}
      sop_cycle: {type: str, desc: "S&OP cycle"}
      run_date: {type: date, desc: "Date the scenario was modelled"}
      forecast_period: {type: str, desc: "Forecast period, e.g. Q4 2026"}
      base_revenue_gbp: {type: float, desc: "Base revenue forecast in GBP"}
      scenario_revenue_gbp: {type: float, desc: "Revenue in this scenario in GBP"}
      scenario_revenue_variance_pct: {type: float, desc: "Revenue variance % vs base"}
      base_margin_pct: {type: float, desc: "Base gross margin %"}
      scenario_margin_pct: {type: float, desc: "Margin % in this scenario"}
      scenario_margin_variance_pct: {type: float, desc: "Margin variance percentage points"}
      scenario_cash_flow_gbp: {type: float, desc: "Cash impact in GBP"}
      service_level_pct: {type: float, desc: "Expected service level %"}
      inventory_units: {type: float, desc: "Ending inventory units"}
      inventory_value_gbp: {type: float, desc: "Ending inventory value in GBP"}
      risk_level: {type: enum, values: [low, medium, high, critical], desc: "Overall execution risk of the scenario"}
      key_risks: {type: str, desc: "Semicolon-separated list of key risks identified"}
      mitigation_actions: {type: str, desc: "Proposed mitigations for risks"}
      trigger_for_switch: {type: str, desc: "What event would trigger moving to this scenario"}
      created_at: {type: timestamp, desc: "When run was created"}

  plan_baseline:
    key: baseline_id
    cols:
      baseline_id: {type: str, desc: "Baseline record, e.g. SOP-B-000123"}
      sop_cycle: {type: str, desc: "S&OP cycle, e.g. SOP-202610"}
      forecast_period: {type: str, desc: "Forecast period, e.g. Q4 2026"}
      revenue_gbp: {type: float, desc: "Current plan revenue in GBP"}
      margin_pct: {type: float, desc: "Current plan gross margin %"}
      cash_flow_gbp: {type: float, desc: "Current plan operating cash flow in GBP"}
      service_level_pct: {type: float, desc: "Current plan service level %"}
      inventory_units: {type: float, desc: "Current plan ending inventory units"}
      promotional_intensity_pct: {type: float, desc: "% of sales with promotion"}
      demand_assumption: {type: str, desc: "Base demand assumption"}
      supply_assumption: {type: str, desc: "Base supply assumption"}
      created_at: {type: timestamp, desc: "When baseline was established"}

  new_product_launches:
    key: launch_id
    cols:
      launch_id: {type: str, desc: "Product launch, e.g. SOP-L-000123"}
      sop_cycle: {type: str, desc: "S&OP cycle when launched"}
      sku: {type: str, desc: "Product SKU"}
      style_id: {type: str, desc: "Style id"}
      launch_date: {type: date, desc: "Actual/planned launch date"}
      demand_assumption_units: {type: float, desc: "Assumed demand in units (12 week window)"}
      actual_demand_units: {type: float, desc: "Actual demand in units"}
      demand_assumption_accuracy_pct: {type: float, desc: "Actual vs assumed %"}
      timing_assumption_days: {type: int, desc: "Assumed ramp timing in days"}
      actual_timing_days: {type: int, desc: "Actual ramp timing in days"}
      distribution_assumption_pct: {type: float, desc: "Assumed % of channels/stores"}
      actual_distribution_pct: {type: float, desc: "Actual % of channels/stores"}
      retail_price_gbp: {type: float, desc: "Retail price in GBP"}
      notes: {type: str, desc: "Notes on forecast accuracy"}

  external_assumptions:
    key: ext_assumption_id
    cols:
      ext_assumption_id: {type: str, desc: "External assumption, e.g. SOP-E-000456"}
      sop_cycle: {type: str, desc: "S&OP cycle, e.g. SOP-202610"}
      category: {type: enum, values: [gdp_growth, inflation, consumer_confidence, employment, interest_rate, competitor_action, regulatory, supply_disruption], desc: "Macro category"}
      description: {type: str, desc: "Description of the macro assumption"}
      assumed_value: {type: str, desc: "The assumption value"}
      source: {type: str, desc: "Source of assumption (e.g. Office for National Statistics, industry consensus)"}
      confidence_level: {type: enum, values: [high, medium, low, very_low], desc: "Confidence in this assumption"}
      impact_on_demand: {type: str, desc: "How this affects demand assumptions"}
      impact_on_supply: {type: str, desc: "How this affects supply assumptions"}
      news_exposure_date: {type: date, desc: "When news broke"}
      already_in_forecast: {type: bool, desc: "True if already incorporated"}
      created_at: {type: timestamp, desc: "When assumption was added"}

  disputed_assumptions:
    key: dispute_id
    cols:
      dispute_id: {type: str, desc: "Dispute record, e.g. SOP-D-000789"}
      assumption_id: {type: str, desc: "Scenario assumption disputed, e.g. SOP-A-900021; blank if a change is disputed"}
      change_id: {type: str, desc: "Assumption change disputed, e.g. SOP-C-900001; blank if a scenario assumption is disputed"}
      sop_cycle: {type: str, desc: "S&OP cycle"}
      raised_by: {type: str, desc: "Employee id of person raising dispute"}
      reason: {type: str, desc: "Reason for disagreement"}
      alternative_value: {type: str, desc: "Alternative value proposed"}
      raised_at: {type: timestamp, desc: "When dispute was raised"}
      resolution: {type: str, desc: "How it was resolved"}
      resolved_at: {type: timestamp, desc: "When resolved"}

tools:
  - name: get_current_plan_baseline
    desc: "Current plan baseline: revenue, margin, cash, service level, inventory and promo intensity for the latest S&OP cycle. Use as the starting point."
    kind: select
    from: plan_baseline
    filters:
      sop_cycle: {}
    order: sop_cycle DESC
    limit: 1
    example: {}

  - name: run_s_op_scenario
    desc: "Modelled results per S&OP scenario: revenue, margin, cash, service level, risks and switch trigger. Omit scenario_id for all scenarios in the current cycle."
    kind: sql
    args:
      scenario_id: {}
      sop_cycle: {default: current, desc: "S&OP cycle, e.g. SOP-202610; current = latest cycle"}
    sql: |
      SELECT sr.run_id, sr.scenario_id, s.name AS scenario_name, sr.sop_cycle, sr.forecast_period,
             sr.base_revenue_gbp, sr.scenario_revenue_gbp, sr.scenario_revenue_variance_pct,
             sr.base_margin_pct, sr.scenario_margin_pct, sr.scenario_cash_flow_gbp,
             sr.service_level_pct, sr.inventory_units, sr.risk_level, sr.key_risks,
             sr.mitigation_actions, sr.trigger_for_switch
      FROM scenario_runs sr
      JOIN sop_scenarios s ON s.scenario_id = sr.scenario_id
      WHERE ($scenario_id IS NULL OR sr.scenario_id = $scenario_id)
        AND sr.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
      ORDER BY sr.scenario_id
    limit: 10
    example: {}

  - name: calculate_scenario_revenue_margin
    desc: "Revenue, margin % and gross profit for a scenario against the base plan, with formula. Omit scenario_id for all in the current cycle."
    kind: sql
    args:
      scenario_id: {}
      sop_cycle: {default: current, desc: "S&OP cycle, e.g. SOP-202610; current = latest cycle"}
    sql: |
      SELECT sr.scenario_id, s.name AS scenario_name, sr.forecast_period,
             sr.base_revenue_gbp, sr.scenario_revenue_gbp,
             round((sr.scenario_revenue_gbp - sr.base_revenue_gbp) / sr.base_revenue_gbp * 100, 1) AS revenue_variance_pct,
             sr.base_margin_pct, sr.scenario_margin_pct,
             round(sr.scenario_margin_pct - sr.base_margin_pct, 1) AS margin_variance_pts,
             round(sr.base_revenue_gbp * sr.base_margin_pct / 100) AS base_gross_profit_gbp,
             round(sr.scenario_revenue_gbp * sr.scenario_margin_pct / 100) AS scenario_gross_profit_gbp,
             'revenue variance % = (scenario_revenue - base_revenue) / base_revenue * 100; gross profit = revenue * margin_pct / 100' AS formula
      FROM scenario_runs sr
      JOIN sop_scenarios s ON s.scenario_id = sr.scenario_id
      WHERE ($scenario_id IS NULL OR sr.scenario_id = $scenario_id)
        AND sr.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
      ORDER BY sr.scenario_id
    limit: 10
    example: {}

  - name: calculate_scenario_service_level
    desc: "Expected service level % of a scenario against the plan baseline, with formula. Omit scenario_id for all in the current cycle."
    kind: sql
    args:
      scenario_id: {}
      sop_cycle: {default: current, desc: "S&OP cycle, e.g. SOP-202610; current = latest cycle"}
    sql: |
      SELECT sr.scenario_id, s.name AS scenario_name, sr.forecast_period, sr.service_level_pct,
             pb.service_level_pct AS baseline_service_level_pct,
             round(sr.service_level_pct - pb.service_level_pct, 1) AS service_level_variance_pts,
             sr.inventory_units,
             'service level variance = scenario service level - baseline service level' AS formula
      FROM scenario_runs sr
      JOIN sop_scenarios s ON s.scenario_id = sr.scenario_id
      LEFT JOIN plan_baseline pb ON pb.sop_cycle = sr.sop_cycle AND pb.forecast_period = sr.forecast_period
      WHERE ($scenario_id IS NULL OR sr.scenario_id = $scenario_id)
        AND sr.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
      ORDER BY sr.scenario_id
    limit: 10
    example: {}

  - name: calculate_scenario_cash_impact
    desc: "Cash flow of a scenario, optionally if sales come in under plan: lost margin plus unsold stock already bought. Use for downside sensitivity."
    kind: sql
    args:
      scenario_id: {required: true}
      sales_variance_pct: {type: float, default: 0, desc: "Sales vs scenario in percent; -5 means 5% under"}
      stock_committed_pct: {type: float, default: 50, desc: "Share of the cost of lost sales already bought as stock, in percent"}
    sql: |
      SELECT sr.scenario_id, s.name AS scenario_name, sr.forecast_period,
             sr.scenario_revenue_gbp, sr.scenario_margin_pct,
             $sales_variance_pct AS sales_variance_pct, $stock_committed_pct AS stock_committed_pct,
             sr.scenario_cash_flow_gbp AS scenario_cash_gbp,
             round(sr.scenario_revenue_gbp * $sales_variance_pct / 100) AS revenue_change_gbp,
             round(sr.scenario_revenue_gbp * $sales_variance_pct / 100
                   * (sr.scenario_margin_pct / 100 + (1 - sr.scenario_margin_pct / 100) * $stock_committed_pct / 100)) AS cash_change_gbp,
             round(sr.scenario_cash_flow_gbp + sr.scenario_revenue_gbp * $sales_variance_pct / 100
                   * (sr.scenario_margin_pct / 100 + (1 - sr.scenario_margin_pct / 100) * $stock_committed_pct / 100)) AS adjusted_cash_gbp,
             'cash change = revenue change * (margin% + (1 - margin%) * stock committed%); adjusted cash = scenario cash + cash change' AS formula
      FROM scenario_runs sr
      JOIN sop_scenarios s ON s.scenario_id = sr.scenario_id
      WHERE sr.scenario_id = $scenario_id
      ORDER BY sr.created_at DESC
    limit: 1
    example: {scenario_id: "SOP-S-900002", sales_variance_pct: "-5"}

  - name: compare_scenarios_risk_adjusted
    desc: "Rank a cycle's scenarios by risk-adjusted gross profit with revenue, margin, cash, service level, risks and switch trigger. Use for the exec decision."
    kind: sql
    args:
      sop_cycle: {default: current, desc: "S&OP cycle, e.g. SOP-202610; current = latest cycle"}
    sql: |
      SELECT rank() OVER (ORDER BY gp * f DESC) AS rank, scenario_id, name, forecast_period,
             scenario_revenue_gbp, scenario_margin_pct, round(gp) AS gross_profit_gbp,
             scenario_cash_flow_gbp, service_level_pct, risk_level, f AS risk_factor,
             round(gp * f) AS risk_adjusted_gross_profit_gbp, key_risks, trigger_for_switch,
             'risk adjusted gross profit = revenue * margin_pct / 100 * risk_factor (low 1.0, medium 0.95, high 0.85, critical 0.7)' AS formula
      FROM (
        SELECT sr.scenario_id, s.name, sr.forecast_period, sr.scenario_revenue_gbp, sr.scenario_margin_pct,
               sr.scenario_revenue_gbp * sr.scenario_margin_pct / 100 AS gp,
               sr.scenario_cash_flow_gbp, sr.service_level_pct, sr.risk_level, sr.key_risks, sr.trigger_for_switch,
               CASE sr.risk_level WHEN 'low' THEN 1.0 WHEN 'medium' THEN 0.95 WHEN 'high' THEN 0.85 ELSE 0.7 END AS f
        FROM scenario_runs sr
        JOIN sop_scenarios s ON s.scenario_id = sr.scenario_id
        WHERE sr.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
      ) t1
      ORDER BY rank, scenario_id
    limit: 10
    example: {}

  - name: get_scenario_assumptions
    desc: "Assumptions behind a scenario with confidence, basis and dispute flag, weakest first. Omit scenario_id for all scenarios in the current cycle."
    kind: sql
    args:
      scenario_id: {}
      category: {}
      sop_cycle: {default: current, desc: "S&OP cycle, e.g. SOP-202610; current = latest cycle"}
    sql: |
      SELECT a.assumption_id, a.scenario_id, s.name AS scenario_name, a.category, a.description, a.assumption_value,
             a.confidence_level, a.basis, a.is_disputed, a.dispute_reason, a.owner_id
      FROM sop_scenario_assumptions a
      JOIN sop_scenarios s ON s.scenario_id = a.scenario_id
      WHERE ($scenario_id IS NULL OR a.scenario_id = $scenario_id)
        AND ($category IS NULL OR a.category = $category)
        AND s.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
      ORDER BY CASE a.confidence_level WHEN 'low' THEN 0 WHEN 'medium' THEN 1 ELSE 2 END, a.is_disputed DESC, a.scenario_id, a.assumption_id
    limit: 50
    example: {scenario_id: "SOP-S-900002"}

  - name: get_assumption_changes_since_cycle
    desc: "Assumption changes made in an S&OP cycle since the prior one: what, who, why, revenue and inventory impact, open dispute. Use to brief the exec."
    kind: sql
    args:
      sop_cycle: {default: current, desc: "S&OP cycle the changes were made in, e.g. SOP-202610; current = latest cycle"}
      category: {}
      sort_by: {type: str, values: [revenue, inventory], default: revenue, desc: "Rank by size of revenue or inventory impact"}
    sql: |
      SELECT ac.change_id, ac.category, ac.description, ac.prior_assumption, ac.new_assumption,
             ac.owner_id, e.name AS changed_by, ac.reason, ac.revenue_impact_gbp, ac.inventory_impact_units,
             EXISTS (SELECT 1 FROM disputed_assumptions da WHERE da.change_id = ac.change_id AND da.resolved_at IS NULL) AS open_dispute,
             ac.prior_cycle, ac.changed_at
      FROM assumption_changes ac
      LEFT JOIN master.employees e ON e.employee_id = ac.owner_id
      WHERE ac.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
        AND ($category IS NULL OR ac.category = $category)
      ORDER BY CASE WHEN $sort_by = 'inventory' THEN abs(ac.inventory_impact_units) ELSE abs(ac.revenue_impact_gbp) END DESC
    limit: 30
    example: {}

  - name: get_assumption_change_owner_and_reason
    desc: "Who changed one assumption and why: owner name and role, reason, prior and new value, impact. Use for traceability."
    kind: sql
    args:
      change_id: {required: true}
    sql: |
      SELECT ac.change_id, ac.description, ac.category, ac.prior_assumption, ac.new_assumption,
             e.name AS owner_name, e.employee_id, e.role, ac.reason,
             ac.revenue_impact_gbp, ac.inventory_impact_units, ac.changed_at
      FROM assumption_changes ac
      LEFT JOIN master.employees e ON e.employee_id = ac.owner_id
      WHERE ac.change_id = $change_id
    example: {change_id: "SOP-C-900001"}

  - name: list_disputed_assumptions
    desc: "Disputed assumption changes and scenario assumptions: value, alternative proposed, who disputes, who owns. Unresolved only unless include_resolved."
    kind: sql
    args:
      sop_cycle: {default: current, desc: "S&OP cycle, e.g. SOP-202610; current = latest cycle"}
      include_resolved: {type: bool, default: false, desc: "Also show disputes already resolved"}
    sql: |
      SELECT da.dispute_id, COALESCE(da.change_id, da.assumption_id) AS item_id,
             CASE WHEN da.change_id IS NOT NULL THEN 'assumption change' ELSE 'scenario assumption' END AS item_type,
             COALESCE(ac.category, ssa.category) AS category,
             COALESCE(ac.description, ssa.description) AS description,
             COALESCE(ac.new_assumption, ssa.assumption_value) AS current_value,
             da.alternative_value, da.reason, da.raised_by, e1.name AS raised_by_name,
             COALESCE(ac.owner_id, ssa.owner_id) AS owner_id, e2.name AS owner_name,
             ac.revenue_impact_gbp, da.raised_at, da.resolution, da.resolved_at
      FROM disputed_assumptions da
      LEFT JOIN assumption_changes ac ON ac.change_id = da.change_id
      LEFT JOIN sop_scenario_assumptions ssa ON ssa.assumption_id = da.assumption_id
      LEFT JOIN master.employees e1 ON e1.employee_id = da.raised_by
      LEFT JOIN master.employees e2 ON e2.employee_id = COALESCE(ac.owner_id, ssa.owner_id)
      WHERE da.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
        AND ($include_resolved OR da.resolved_at IS NULL)
      ORDER BY da.resolved_at IS NOT NULL, da.raised_at DESC
    limit: 20
    example: {}

  - name: get_forecast_external_assumptions
    desc: "External macro assumptions (GDP, inflation, confidence, rates, competitors) for a cycle, with confidence and whether already in the forecast."
    kind: sql
    args:
      sop_cycle: {default: current, desc: "S&OP cycle, e.g. SOP-202610; current = latest cycle"}
      category: {}
      already_in_forecast: {}
    sql: |
      SELECT ea.ext_assumption_id, ea.category, ea.description, ea.assumed_value, ea.source, ea.confidence_level,
             ea.impact_on_demand, ea.impact_on_supply, ea.news_exposure_date, ea.already_in_forecast
      FROM external_assumptions ea
      WHERE ea.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
        AND ($category IS NULL OR ea.category = $category)
        AND ($already_in_forecast IS NULL OR ea.already_in_forecast = $already_in_forecast)
      ORDER BY ea.already_in_forecast, ea.news_exposure_date DESC
    limit: 30
    example: {}

  - name: compare_news_to_plan_assumptions
    desc: "Macro news items for a cycle against the forecast: flags which are already reflected and which should be added, newest gaps first."
    kind: sql
    args:
      sop_cycle: {default: current, desc: "S&OP cycle, e.g. SOP-202610; current = latest cycle"}
    sql: |
      SELECT ea.ext_assumption_id, ea.category, ea.description, ea.assumed_value, ea.source,
             ea.confidence_level, ea.news_exposure_date, ea.already_in_forecast,
             CASE WHEN ea.already_in_forecast THEN 'Already reflected in forecast'
                  WHEN ea.confidence_level = 'high' THEN 'Should add to forecast'
                  WHEN ea.confidence_level = 'medium' THEN 'Monitor before adding'
                  ELSE 'Low confidence - defer' END AS recommended_action,
             ea.impact_on_demand, ea.impact_on_supply
      FROM external_assumptions ea
      WHERE ea.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
      ORDER BY ea.already_in_forecast,
               CASE ea.confidence_level WHEN 'high' THEN 0 WHEN 'medium' THEN 1 ELSE 2 END, ea.news_exposure_date DESC
    limit: 20
    example: {}

  - name: get_launch_assumptions_vs_actuals
    desc: "New product launches: demand, timing and distribution assumptions vs actuals with errors, worst demand error first. Use to find which assumptions are wrong."
    kind: sql
    args:
      sop_cycle: {desc: "S&OP cycle the forecast was set in, e.g. SOP-202608"}
      sku: {}
      launch_from: {type: date, default: "-26w", desc: "Earliest launch date to include"}
    sql: |
      SELECT l.launch_id, l.sop_cycle, l.sku, p.name AS product_name, p.category, l.launch_date,
             l.demand_assumption_units, l.actual_demand_units,
             round(l.actual_demand_units / l.demand_assumption_units * 100, 1) AS demand_accuracy_pct,
             round((l.actual_demand_units - l.demand_assumption_units) / l.demand_assumption_units * 100, 1) AS demand_error_pct,
             l.timing_assumption_days, l.actual_timing_days, l.actual_timing_days - l.timing_assumption_days AS timing_slip_days,
             l.distribution_assumption_pct, l.actual_distribution_pct,
             round(l.actual_distribution_pct - l.distribution_assumption_pct, 1) AS distribution_gap_pts,
             l.notes
      FROM new_product_launches l
      LEFT JOIN master.products p ON p.sku = l.sku
      WHERE l.launch_date >= CAST($launch_from AS DATE)
        AND ($sop_cycle IS NULL OR l.sop_cycle = $sop_cycle)
        AND ($sku IS NULL OR l.sku = $sku)
      ORDER BY abs(l.actual_demand_units / l.demand_assumption_units - 1) DESC
    limit: 30
    example: {}

  - name: draft_sop_pre_read
    desc: "Draft the S&OP pre-read for a cycle: plan baseline, scenarios, assumption changes with owners, open disputes and macro gaps. Returns text to review."
    kind: draft
    args:
      sop_cycle: {default: current, desc: "S&OP cycle, e.g. SOP-202610; current = latest cycle"}
    sql:
      cycle_info: |
        SELECT pb.sop_cycle, pb.forecast_period, pb.revenue_gbp, pb.margin_pct, pb.cash_flow_gbp, pb.service_level_pct,
               pb.promotional_intensity_pct, pb.demand_assumption, pb.supply_assumption
        FROM plan_baseline pb
        WHERE pb.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
      scenarios: |
        SELECT s.name, sr.forecast_period, sr.scenario_revenue_gbp, sr.scenario_margin_pct, sr.scenario_cash_flow_gbp,
               sr.service_level_pct, sr.risk_level, sr.trigger_for_switch
        FROM sop_scenarios s
        JOIN scenario_runs sr ON sr.scenario_id = s.scenario_id
        WHERE s.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
        ORDER BY s.scenario_id
      changes: |
        SELECT ac.change_id, ac.category, ac.description, ac.prior_assumption, ac.new_assumption, e.name AS owner_name,
               ac.reason, ac.revenue_impact_gbp, ac.inventory_impact_units
        FROM assumption_changes ac
        LEFT JOIN master.employees e ON e.employee_id = ac.owner_id
        WHERE ac.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
        ORDER BY abs(ac.revenue_impact_gbp) DESC
      disputes: |
        SELECT da.dispute_id, COALESCE(ac.description, ssa.description) AS description, da.alternative_value, da.reason,
               e1.name AS raised_by_name
        FROM disputed_assumptions da
        LEFT JOIN assumption_changes ac ON ac.change_id = da.change_id
        LEFT JOIN sop_scenario_assumptions ssa ON ssa.assumption_id = da.assumption_id
        LEFT JOIN master.employees e1 ON e1.employee_id = da.raised_by
        WHERE da.resolved_at IS NULL
          AND da.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
        ORDER BY da.raised_at DESC
      macro_gaps: |
        SELECT ea.category, ea.description, ea.assumed_value, ea.confidence_level
        FROM external_assumptions ea
        WHERE NOT ea.already_in_forecast
          AND ea.sop_cycle = CASE WHEN $sop_cycle = 'current' THEN (SELECT MAX(sop_cycle) FROM plan_baseline) ELSE $sop_cycle END
        ORDER BY ea.news_exposure_date DESC
    template: |
      # S&OP PRE-READ - {{ cycle_info[0].sop_cycle }}

      ## Plan baseline ({{ cycle_info[0].forecast_period }})
      Revenue £{{ cycle_info[0].revenue_gbp|money }}, margin {{ cycle_info[0].margin_pct }}%, cash £{{ cycle_info[0].cash_flow_gbp|money }}, service level {{ cycle_info[0].service_level_pct }}%, promotional intensity {{ cycle_info[0].promotional_intensity_pct }}%.
      Demand: {{ cycle_info[0].demand_assumption }}. Supply: {{ cycle_info[0].supply_assumption }}.

      ## Scenarios
      {% for s in scenarios %}- **{{ s.name }}**: revenue £{{ s.scenario_revenue_gbp|money }}, margin {{ s.scenario_margin_pct }}%, cash £{{ s.scenario_cash_flow_gbp|money }}, service level {{ s.service_level_pct }}%, risk {{ s.risk_level }}. Switch trigger: {{ s.trigger_for_switch }}
      {% endfor %}
      ## Assumption changes since last cycle
      {% for c in changes %}- **{{ c.category|title }}: {{ c.description }}** ({{ c.change_id }}): {{ c.prior_assumption }} -> {{ c.new_assumption }}. Owner {{ c.owner_name }}. Why: {{ c.reason }}. Revenue £{{ c.revenue_impact_gbp|money }}, inventory {{ c.inventory_impact_units|money }} units.
      {% endfor %}
      ## Still disputed
      {% for d in disputes %}- {{ d.description }} ({{ d.dispute_id }}), raised by {{ d.raised_by_name }}: {{ d.reason }} Alternative: {{ d.alternative_value }}
      {% endfor %}
      ## Macro news not yet in the forecast
      {% for m in macro_gaps %}- {{ m.description }}: {{ m.assumed_value }} ({{ m.confidence_level }} confidence)
      {% endfor %}
      Please review before this goes to attendees.
    example: {}

  - name: create_sop_scenario
    desc: "Save a new named S&OP scenario (draft) with period, demand change and drivers. Use to build a model the team can discuss."
    kind: insert
    table: sop_scenarios
    id_prefix: "SOP-S-"
    defaults: {status: draft}
    args:
      name: {required: true, desc: "Scenario name, e.g. Downside Q1 demand"}
      sop_cycle: {required: true, desc: "S&OP cycle id the scenario is discussed in, e.g. SOP-202610"}
      scenario_type: {required: true}
      forecast_period: {desc: "Period modelled, e.g. Q1 2027"}
      demand_change_pct: {type: float, desc: "Demand change vs plan in percent, e.g. -4 for 4% down"}
      description: {required: true, desc: "What drives this scenario"}
      created_by: {required: true, desc: "Employee id of the creator, e.g. EMP-00036"}
    example: {name: "Downside Q1", sop_cycle: "SOP-202610", scenario_type: "downside", forecast_period: "Q1 2027", demand_change_pct: -4,
              description: "Demand 4% below plan on cost-of-living pressure", created_by: "EMP-00036"}
