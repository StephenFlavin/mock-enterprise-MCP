# One entry per question row that uses this system's tools (see: python -m mockmcp brief ecommerce).

- question: "02:14:Q8"
  story: >
    Cross-border orders (DE, FR, US, NL, BE, ES) all average a GBP 62 basket; Germany is the biggest market by value.
  checks:
    - tool: get_cross_border_order_baskets
      args: {}
      expect: ["DE", "62"]

- question: "02:21:Q5"
  story: >
    Latest return rates: ES 19.2%, DE 18.5%, BE 17.8% highest; UK 15.2%. Conversion is lower in cross-border markets
    (1.65%-2.10%) than UK 2.45%. Weekly history shows stable conversion.
  checks:
    - tool: get_return_rates_by_market
      args: {}
      expect: ["ES", "19.2", "18.5"]
    - tool: get_conversion_and_basket_history_by_market
      args: {region: DE}
      expect: ["1.85", "18.5"]

- question: "05:49:Q4"
  story: >
    Resale listings: 40 of 60 are priced under 25% off new and only 10% of them sold; listings 40%+ off sell through at 75%.
    Price depth, not views, is the barrier.
  checks:
    - tool: get_resale_listing_price_vs_new_price
      args: {summary: true}
      expect: ["discount under 25%", "75"]

- question: "07:63:Q6"
  story: >
    Weekly order volume is up about 2% since the week of 7 Sep while UK orders slipped; cross-border share rose from 39.6% to 44%.
  checks:
    - tool: get_ecom_order_volumes_and_mix
      args: {}
      expect: ["39.6", "44"]

- question: "07:67:Q3"
  story: >
    Parcels: GB 5200/day (GBP 60 average), DE 850, FR 700, NL 480; about 97% of parcels are under the customs low-value thresholds.
  checks:
    - tool: get_parcel_volumes_by_destination
      args: {}
      expect: ["5200", "850", "97"]

- question: "08:74:Q1"
  story: >
    Last week four London areas (SW1, SE1, E1, N1) had the default promise relaxed from next-day to 2-3 days and the
    cut-off moved from 16:00 to 12:00. Price moves on top SKUs were small (-4% to +6%).
  checks:
    - tool: get_delivery_promise_changes
      args: {}
      expect: ["SW1", "2-3 days", "12:00"]
    - tool: get_price_changes_for_top_products
      args: {}
      expect: ["SKU-104032", "6"]
    - tool: update_delivery_promise_rule
      args: {postcode_area: SW1, delivery_promise: "next-day"}
      expect: ["next-day"]

- question: "08:74:Q2"
  story: >
    UK peak plan: Black Friday Week (GBP 350k, 38% uplift), Christmas Gifting (220k, 20%), Last Order Dates (90k, 10%).
  checks:
    - tool: get_marketing_plan_for_peak
      args: {region: UK}
      expect: ["UK Black Friday Week", "350000", "38"]
    - tool: update_delivery_cutoff_dates_on_site
      args: {postcode_area: SW1, cutoff_date: "+14d", cutoff_time: "14:00"}
      expect: ["14:00"]

- question: "08:74:Q3"
  story: >
    Busiest UK areas: M1, B1, SW1, LS1, SE1, G1, E1, N1, L1, W1. LS1, G1 and L1 are in the top ten but have next-day off.
  checks:
    - tool: get_orders_by_postcode_area
      args: {}
      expect: ["M1", "LS1", "false"]
    - tool: update_next_day_postcode_eligibility
      args: {postcode_area: LS1, next_day_enabled: true}
      expect: ["true"]

- question: "08:74:Q4"
  story: >
    Top sellers over 90 days are ranked by revenue: SKU-104032, SKU-104025, SKU-105075 lead.
  checks:
    - tool: get_top_products_by_sales
      args: {top_n: 20}
      expect: ["SKU-104032", "SKU-104025"]

- question: "08:77:Q1"
  story: >
    Top 200 products for pricing analysis; Home department leader is SKU-106265 (Storage).
  checks:
    - tool: get_top_products_by_sales
      args: {department: Home}
      expect: ["SKU-106265", "Storage"]
