# One entry per question row that uses this system's tools (see: python -m mockmcp brief ecommerce).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:14:Q8"
  story: >
    Cross-border direct-to-consumer orders in DE, FR, NL have £62 average basket.
    We have 450 orders to NL, 680 to FR, and 850 to DE, with consistent £62 basket values.
  checks:
    - tool: get_cross_border_order_baskets
      args: {}
      expect: ["DE", "62", "NL"]

- question: "02:21:Q5"
  story: >
    Return rates by market: UK 15.2%, DE 18.5%, FR 17.3%. Conversion in UK is 2.45%, lower in cross-border markets (1.65%-1.92%).
  checks:
    - tool: get_return_rates_by_market
      args: {}
      expect: ["UK", "15.2"]
    - tool: get_conversion_and_basket_history_by_market
      args: {region: DE}
      expect: ["18.5", "62"]

- question: "05:49:Q4"
  story: >
    Resale programme has listed 8 SKUs with 50% discount. Most items in good condition.
    RSL-900001 (SKU-100001) sold with 245 views, RSL-900002 (PF-220) unsold with 89 views.
  checks:
    - tool: get_resale_listing_price_vs_new_price
      args: {discount_min_pct: 40}
      expect: ["RSL-900001", "50"]

- question: "07:63:Q6"
  story: >
    Daily order volumes: UK 2000 orders/day, 2400 units, £96k value (£48 basket);
    DE 450 orders/day, 280 units, £27.9k value (£62 basket).
  checks:
    - tool: get_ecom_order_volumes_and_mix
      args: {region: UK, date_from: "-10d"}
      expect: ["2000", "48"]

- question: "07:67:Q3"
  story: >
    Parcel volumes: GB 5250 parcels/day (£60 average), DE 850 parcels/day (£62 average),
    FR 680 parcels/day (£62.30 average).
  checks:
    - tool: get_parcel_volumes_by_destination
      args: {destination_country: GB}
      expect: ["5250", "60"]

- question: "08:74:Q1"
  story: >
    Price changes: SKU-100007 from £91.99 to £85.99 (Sep 30, -6.5%),
    PF-220 from £77.99 to £69.99 (Sep 29, -10.2%). These drove some conversion drop.
    Delivery promise in SW1 is next-day, needs rollback to standard.
  checks:
    - tool: get_delivery_promise_changes
      args: {}
      expect: ["SW1", "next-day"]
    - tool: get_price_changes_for_top_products
      args: {date_from: "-10d"}
      expect: ["85.99", "PF-220"]
    - tool: update_delivery_promise_rule
      args: {rule_id: DLR-900001, postcode_area: SW1, delivery_promise: "standard"}
      expect: ["standard"]

- question: "08:74:Q2"
  story: >
    Marketing plan for peak: UK has two campaigns (Nov-Dec 2026) with £250k and £150k budgets,
    expecting 15.5% and 12% traffic uplift. Cutoff dates: SW1 and SE1 at 2026-10-19 14:00.
  checks:
    - tool: get_marketing_plan_for_peak
      args: {region: UK}
      expect: ["UK Peak 2026", "15.5"]
    - tool: update_delivery_cutoff_dates_on_site
      args: {rule_id: DLR-900001, postcode_area: SW1, cutoff_date: "+14d", cutoff_time: "14:00"}
      expect: ["14:00"]

- question: "08:74:Q3"
  story: >
    Orders by postcode: SW1 and M1 are top postcodes. SW1 has next-day enabled,
    M1 also has next-day enabled. B1 is growing with 2-3 day delivery.
  checks:
    - tool: get_orders_by_postcode_area
      args: {}
      expect: ["SW1", "M1"]
    - tool: update_next_day_postcode_eligibility
      args: {rule_id: DLR-900003, postcode_area: E1, next_day_enabled: true}
      expect: ["true"]

- question: "08:74:Q4"
  story: >
    Top products by sales across departments. SKU-100007, PF-220, K-1700 are bestsellers.
  checks:
    - tool: get_top_products_by_sales
      args: {}
      expect: ["SKU", "retail_price_gbp"]

- question: "08:77:Q1"
  story: >
    Top 200 products for pricing analysis. SKU-100007 (£91.99), SKU-100014 (£91.99), K-1700 (£77.99) are key items.
  checks:
    - tool: get_top_products_by_sales
      args: {}
      expect: ["retail_price_gbp"]
