- question: "05:49:Q6"
  story: >
    EPR (Extended Producer Responsibility) regulations for textiles are tightening in UK, France and Netherlands.
    The circular economy lead needs to know which EPR data fields we currently hold for Textiles products
    (weights, materials, recyclability) with at least 50% coverage, so we can understand our data readiness.
    Seed data shows we hold 95% of unit weights, 85% of material composition data, and 75% of recyclability info.
  checks:
    - tool: get_available_epr_reporting_data_fields
      args: {category: Textiles, min_coverage_pct: 50}
      expect: ["Unit Weight", "Material Composition", "Recyclability"]

- question: "06:52:Q6"
  story: >
    Product designer is assessing what outdoor clothing features appeal to 25-34 year olds.
    She needs to find current products in the Womenswear category to understand their current attributes.
  checks:
    - tool: list_products_by_attribute_in_category
      args: {category: Womenswear}
      expect: ["sku", "name"]

- question: "06:59:Q1"
  story: >
    Marketplace rejected 340 listings this week. The PIM specialist needs to group the errors by field
    (like missing dimensions, materials, care instructions) and fix the high-volume issues in bulk.
    Seed data shows products in Home category with missing mandatory attributes.
  checks:
    - tool: get_pim_attribute_completeness
      args: {category: Home, min_completeness_pct: 100}
      expect: ["completeness_pct", "0"]
    - tool: draft_bulk_attribute_correction_file
      args: {category: Home, incomplete_only: true}
      expect: ["sku", "name"]
    - tool: update_pim_attributes_in_bulk
      args: {sku: SKU-100014, attribute_id: ATTR-008, value: "40 x 30 x 20 cm"}
      expect: ["attribute_id"]

- question: "06:59:Q2"
  story: >
    PIM specialist needs to understand what data and content requirements German and French marketplaces
    have for home appliances. Get attribute completeness by category to see our current coverage.
  checks:
    - tool: get_pim_attribute_completeness_by_category
      args: {}
      expect: ["category", "total_products", "avg_completeness_pct"]

- question: "06:59:Q3"
  story: >
    PIM specialist is redesigning the Home category attribute structure. She needs to:
    1. See current Home taxonomy
    2. Understand completeness
    3. Get a proposal for better structure
    4. Calculate migration effort
    5. Create the first new attribute group
  checks:
    - tool: get_pim_taxonomy_and_attributes
      args: {category: Home}
      expect: ["Home", "attribute_id"]
    - tool: get_pim_attribute_completeness_by_category
      args: {}
      expect: ["category", "avg_completeness_pct"]
    - tool: draft_attribute_taxonomy_proposal
      args: {category: Home}
      expect: ["attribute_id"]
    - tool: calculate_migration_effort_for_taxonomy
      args: {from_category: Home}
      expect: ["current_structure", "estimated_effort_hours"]
    - tool: create_pim_attribute_group
      args: {name: "Home_v2_Core", category: Home, description: "Revised Home attributes"}
      expect: ["group_id"]

- question: "06:59:Q4"
  story: >
    Returns and complaints are costing the business money. PIM specialist needs to identify which data
    errors in product attributes might drive complaints. She examines specific products' attributes.
  checks:
    - tool: get_pim_attributes_for_product
      args: {sku: SKU-100007}
      expect: ["SKU-100007"]

- question: "06:60:Q7"
  story: >
    R&D scientist wants to verify our product sustainability claims (recycled content, organic, fair trade).
    He needs to know which claims lack proper chain-of-custody evidence and should be removed or updated.
    Seed data includes product claims where some have proper evidence and others lack it or are pending review.
  checks:
    - tool: list_product_claims
      args: {status: active}
      expect: ["claim_id", "sku", "claim_type"]
    - tool: list_product_claims
      args: {status: insufficient_evidence}
      expect: ["insufficient_evidence"]
    - tool: update_product_claim
      args: {claim_id: CLM-900006, claim_text: "Certified organic cotton (GOTS pending)"}
      expect: ["updated_at"]
    - tool: remove_product_claim
      args: {claim_id: CLM-900008}
      expect: ["CLM-900008"]

- question: "08:80:Q3"
  story: >
    International manager is assessing whether we should enter Japan market. She wants to know which
    of our current products would work for Japan. She'll look at a style range to assess market fit.
  checks:
    - tool: get_product_attributes_for_range
      args: {style_id: STY-5520}
      expect: ["sku", "STY-5520"]
    - tool: compare_range_fit_to_market
      args: {style_id: STY-5520, target_market: Japan}
      expect: ["completeness_pct", "Japan"]
