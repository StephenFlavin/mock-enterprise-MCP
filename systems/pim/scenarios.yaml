- question: "05:49:Q6"
  story: >
    EPR (Extended Producer Responsibility) regulations for textiles are tightening in UK, France and Netherlands.
    The circular economy lead needs to know which EPR data fields we currently hold for Knitwear products
    (weights, materials, recyclability) with at least 50% coverage, so we can understand our data readiness.
  checks:
    - tool: get_available_epr_reporting_data_fields
      args: {category: Knitwear, min_coverage_pct: 50}
      expect: ["Unit Weight", "Material Composition", "Recyclability"]

- question: "06:52:Q6"
  story: >
    Product designer is assessing what outdoor clothing features appeal to 25-34 year olds.
    She looks at products in the Outerwear category to understand current attributes and gaps.
  checks:
    - tool: list_products_by_attribute_in_category
      args: {category: Outerwear}
      expect: ["sku", "name"]

- question: "06:59:Q1"
  story: >
    Marketplace rejected listings. The PIM specialist needs to identify which fields are missing most
    and fix issues in bulk. Seed data shows Cookware products with missing mandatory attributes like
    dimensions and dishwasher safety info.
  checks:
    - tool: get_pim_attribute_completeness
      args: {category: Cookware, min_completeness_pct: 100}
      expect: ["completeness_pct"]
    - tool: draft_bulk_attribute_correction_file
      args: {category: Cookware, incomplete_only: true}
      expect: ["sku", "name"]
    - tool: update_pim_attributes_in_bulk
      args: {sku: SKU-100812, attribute_id: ATTR-008, value: "28 x 20 x 10 cm"}
      expect: ["attribute_id"]

- question: "06:59:Q2"
  story: >
    PIM specialist needs to understand marketplace requirements by category. She checks our current
    data completeness across all categories to see which are worst prepared.
  checks:
    - tool: get_pim_attribute_completeness_by_category
      args: {}
      expect: ["category", "total_products", "avg_completeness_pct"]

- question: "06:59:Q3"
  story: >
    Cookware attributes are a mess - each marketplace wants different things. The specialist needs to:
    1. See current taxonomy
    2. Understand completeness
    3. Get a proposal for better structure
    4. Calculate migration effort
    5. Create the first new attribute group (Cookware_v2)
  checks:
    - tool: get_pim_taxonomy_and_attributes
      args: {category: Cookware}
      expect: ["Cookware", "attribute_id"]
    - tool: get_pim_attribute_completeness_by_category
      args: {}
      expect: ["category"]
    - tool: draft_attribute_taxonomy_proposal
      args: {category: Cookware}
      expect: ["attribute_id"]
    - tool: calculate_migration_effort_for_taxonomy
      args: {from_category: Cookware}
      expect: ["current_structure", "estimated_effort_hours"]
    - tool: create_pim_attribute_group
      args: {name: "Cookware_v2_Core", category: Cookware, description: "Revised cookware attributes for marketplace"}
      expect: ["group_id"]

- question: "06:59:Q4"
  story: >
    Returns are costing money. The specialist examines which data errors in Cookware products might
    be causing complaints (dimensions, materials, heat source compatibility). She checks individual
    product attributes to identify weak data.
  checks:
    - tool: get_pim_attributes_for_product
      args: {sku: SKU-100805}
      expect: ["SKU-100805"]

- question: "06:60:Q7"
  story: >
    R&D scientist verifies our product sustainability claims. Seed data includes Knitwear products with
    claims ranging from fully certified (CERT references, has_evidence=true) to pending review or
    insufficient evidence. He reviews claims, updates wording where needed, and removes unsupported ones.
  checks:
    - tool: list_product_claims
      args: {status: active}
      expect: ["claim_id", "sku", "claim_type"]
    - tool: list_product_claims
      args: {status: insufficient_evidence}
      expect: ["insufficient_evidence"]
    - tool: update_product_claim
      args: {claim_id: CLM-900006, claim_text: "Organic wool (GOTS certification pending)"}
      expect: ["updated_at"]
    - tool: remove_product_claim
      args: {claim_id: CLM-900008}
      expect: ["CLM-900008"]

- question: "08:80:Q3"
  story: >
    International manager assesses Japan entry. She examines a Knitwear style range (STY-5520) to see
    which products would work: looking at sizes, materials, and other attributes that matter in Japanese
    market. She checks what data completeness issues might prevent entry.
  checks:
    - tool: get_product_attributes_for_range
      args: {style_id: STY-5520}
      expect: ["sku", "STY-5520"]
    - tool: compare_range_fit_to_market
      args: {style_id: STY-5520, target_market: Japan}
      expect: ["completeness_pct", "Japan"]
