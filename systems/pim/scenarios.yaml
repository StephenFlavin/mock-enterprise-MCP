- question: "05:49:Q6"
  story: >
    EPR (Extended Producer Responsibility) regulations for textiles are tightening in UK, France and Netherlands.
    The circular economy lead needs to know which EPR data fields we currently hold for Textiles products
    (weights, materials, recyclability) with at least 50% coverage, so we can understand our data readiness.
    Seed data shows we hold 95% of unit weights, 85% of material composition data, and 75% of recyclability info.
  checks:
    - tool: get_available_epr_reporting_data_fields
      args: {category: Textiles, min_coverage_pct: 50}
      expect: ["Unit Weight", "Material Composition", "Recyclability", "95", "85", "75"]

- question: "06:52:Q6"
  story: >
    Product designer is assessing what outdoor clothing features appeal to 25-34 year olds.
    She needs to find current products in the Outdoor Clothing category that include wool (a premium material
    this demographic prefers). Seed data includes products in Outdoor Clothing with wool attributes showing
    what's currently in range. Search for products with wool attribute value.
  checks:
    - tool: list_products_by_attribute_in_category
      args: {category: "Outdoor Clothing", attribute_filter: "ATTR-005:wool", min_completeness: 50}
      expect: ["Outdoor Clothing"]

- question: "06:59:Q1"
  story: >
    Marketplace rejected 340 listings this week. The PIM specialist needs to group the errors by field
    (like missing dimensions, materials, care instructions) and fix the high-volume issues in bulk.
    Seed data shows products with missing mandatory Home Appliances attributes. Use tools to:
    1. Show which fields are missing most (get_pim_attribute_completeness for Home category)
    2. Draft a correction file (draft_bulk_attribute_correction_file)
    3. Apply fixes (update_pim_attributes_in_bulk)
  checks:
    - tool: get_pim_attribute_completeness
      args: {category: Home, min_completeness_pct: 100}
      expect: ["completeness_pct", "0", "1"]
    - tool: draft_bulk_attribute_correction_file
      args: {category: Home, incomplete_only: true}
      expect: ["missing_fields", "num_mandatory_missing"]
    - tool: update_pim_attributes_in_bulk
      args: {sku: SKU-100002, attribute_id: ATTR-008, value: "40 x 30 x 20 cm"}
      expect: ["attribute_id", "value"]

- question: "06:59:Q2"
  story: >
    PIM specialist needs to understand what data and content requirements German and French marketplaces
    have for home appliances, and whether we have those fields. Get attribute completeness by category
    to see our current coverage for Home Appliances. Seed shows completeness metrics across categories.
  checks:
    - tool: get_pim_attribute_completeness_by_category
      args: {}
      expect: ["category", "total_products", "avg_completeness_pct"]

- question: "06:59:Q3"
  story: >
    PIM specialist is redesigning the Home category attribute structure because every marketplace wants
    different attributes. She needs to:
    1. See current Home taxonomy (get_pim_taxonomy_and_attributes)
    2. Understand completeness (get_pim_attribute_completeness_by_category)
    3. Get a proposal for better structure (draft_attribute_taxonomy_proposal)
    4. Calculate migration effort (calculate_migration_effort_for_taxonomy)
    5. Create the first new attribute group (create_pim_attribute_group)
    Seed shows Home category has 7 attributes, some proposed new structure, estimated 40+ hour migration.
  checks:
    - tool: get_pim_taxonomy_and_attributes
      args: {category: Home}
      expect: ["Home", "attribute_id", "ATTR-007"]
    - tool: get_pim_attribute_completeness_by_category
      args: {}
      expect: ["category", "avg_completeness_pct"]
    - tool: draft_attribute_taxonomy_proposal
      args: {category: Home, for_marketplace: "Amazon.de"}
      expect: ["Home", "ATTR-007"]
    - tool: calculate_migration_effort_for_taxonomy
      args: {from_category: Home}
      expect: ["current_structure", "estimated_effort_hours", "migration_tasks"]
    - tool: create_pim_attribute_group
      args: {name: "Home_v2_Core", category: Home, description: "Revised Home attributes for marketplace compliance"}
      expect: ["group_id", "Home_v2_Core"]

- question: "06:59:Q4"
  story: >
    Returns and complaints are costing the business money. PIM specialist needs to identify which data
    errors (dimensions, materials, compatibility) in our product attributes are causing issues.
    She needs attributes for specific products to see what data quality issues might drive complaints.
    For example, if a kettle's dimensions are missing, customers might buy wrong size. Seed shows
    some products with incomplete attributes (missing dimensions, weight, care instructions).
  checks:
    - tool: get_pim_attributes_for_product
      args: {sku: SKU-100002}
      expect: ["SKU-100002", "attribute_id", "value"]

- question: "06:60:Q7"
  story: >
    R&D scientist wants to verify our product sustainability claims (recycled content, organic, fair trade).
    He needs to know which claims lack proper chain-of-custody evidence and should be removed or updated.
    Seed data includes product claims where 5 have proper evidence (CERT references, has_evidence=true) and
    5 lack evidence or are pending review. He will:
    1. List claims (list_product_claims showing status)
    2. Update wording where evidence is insufficient (update_product_claim)
    3. Remove claims with no evidence (remove_product_claim)
  checks:
    - tool: list_product_claims
      args: {status: active}
      expect: ["claim_id", "sku", "claim_type", "certification_type"]
    - tool: list_product_claims
      args: {status: insufficient_evidence}
      expect: ["insufficient_evidence", "CLM-900005"]
    - tool: update_product_claim
      args: {claim_id: CLM-900006, claim_text: "Certified organic cotton (GOTS pending)", has_evidence: false}
      expect: ["updated_at"]
    - tool: remove_product_claim
      args: {claim_id: CLM-900008}
      expect: ["removed"]

- question: "05:49:Q6"
  story: >
    Circular economy lead is checking which EPR data we hold for textiles (materials, weights, recyclability).
    This is subset of Q7 but focused on data readiness for regulatory compliance across UK/France/Netherlands.
    Get available EPR fields for Textiles with good coverage (>50%) to understand what we can report.
  checks:
    - tool: get_available_epr_reporting_data_fields
      args: {category: Textiles, min_coverage_pct: 50}
      expect: ["Textiles", "is_held", "95", "Unit Weight"]

- question: "08:80:Q3"
  story: >
    International manager is assessing whether we should enter Japan market. She wants to know which
    of our current products would work for Japan (sizes, pack formats, and local preferences).
    She'll look at a style range (e.g., STY-5520 women's knitwear) to see:
    1. What attributes we have (get_product_attributes_for_range)
    2. How those would fit Japan market expectations (compare_range_fit_to_market)
    Seed shows STY-5520 has products in multiple sizes/colours with various attributes; comparison
    identifies sizing constraints and data coverage for Japan.
  checks:
    - tool: get_product_attributes_for_range
      args: {style_id: STY-5520}
      expect: ["style_id", "attribute_id"]
    - tool: compare_range_fit_to_market
      args: {style_id: STY-5520, target_market: Japan}
      expect: ["STY-5520", "Japan", "completeness_pct"]
