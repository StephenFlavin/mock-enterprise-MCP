- question: "05:49:Q6"
  story: >
    Textile EPR (UK, France, Netherlands) needs unit weight, material composition, product category and country of
    manufacture, which PIM holds (90-100% coverage), plus recyclability (41%), recycled content % (38%), packaging
    weight (22%), supplier audit reference (18%) and end-of-life pathway (0%), which it does not. The gaps are what to
    prepare in the next six months.
  checks:
    - tool: get_available_epr_reporting_data_fields
      args: {category: Textiles}
      expect: ["Unit Weight", "Material Composition", "Recyclability", "not held", "End-of-life Pathway", "38"]
    - tool: get_available_epr_reporting_data_fields
      args: {category: Textiles, held_only: true}
      expect: ["Unit Weight", "Country of Manufacture"]

- question: "06:52:Q6"
  story: >
    Outerwear is the outdoor clothing range. Only eight adult (Menswear and Womenswear) outerwear products are waterproof
    in PIM, e.g. SKU-101358 and SKU-105544; no kids outerwear is. Recycled content % is held for under half of the range (40.3% complete across the 67 active and new outerwear products, including the new master wool coat and padded jacket whose PIM records are still empty).
  checks:
    - tool: list_products_by_attribute_in_category
      args: {category: Outerwear, attribute_filter: "Waterproof:true"}
      expect: ["8 rows", "SKU-101358", "SKU-105544", "Waterproof: true"]
    - tool: get_pim_attribute_completeness
      args: {category: Outerwear}
      expect: ["Recycled Content %", "40.3"]

- question: "06:59:Q1"
  story: >
    Small appliance listings (K-1700 kettle, PF-220 fan) are rejected for missing attributes. In PIM the most commonly
    missing mandatory fields for Small Appliances are WEEE Registration Number (41.9% complete) and Voltage & Wattage
    (51.2%). The correction file lists 15 rows that can be filled in bulk from product master (9 Colour, 6 Weight, e.g.
    SKU-100539) and rows that need supplier input (K-1700 voltage and WEEE number).
  checks:
    - tool: get_pim_attribute_completeness
      args: {category: Small Appliances}
      expect: ["WEEE Registration Number", "41.9", "Voltage & Wattage", "51.2"]
    - tool: draft_bulk_attribute_correction_file
      args: {category: Small Appliances, fixable_only: true}
      expect: ["15 rows", "SKU-100539", "bulk fix from product master", "Colour", "Weight"]
    - tool: draft_bulk_attribute_correction_file
      args: {skus: "K-1700,PF-220"}
      expect: ["K-1700", "Voltage & Wattage", "supplier input needed"]
    - tool: update_pim_attributes_in_bulk
      args: {sku: SKU-100539, attribute_id: ATTR-137, value: "0.76"}
      expect: ["Updated", "0.76"]

- question: "06:59:Q2"
  story: >
    For home appliances (Small Appliances, 43 active or new SKUs) the data to add before listing in Germany and France is
    WEEE Registration Number (42% complete), Voltage & Wattage (51%) and Energy Rating (63%); every product misses at
    least one mandatory field.
  checks:
    - tool: get_pim_attribute_completeness_by_category
      args: {category: Small Appliances}
      expect: ["43", "WEEE Registration Number (42% complete)", "Voltage & Wattage (51% complete)", "Energy Rating (63% complete)"]
    - tool: get_pim_attribute_completeness_by_category
      args: {}
      expect: ["Lighting", "Small Appliances", "avg_completeness_pct"]

- question: "06:59:Q3"
  story: >
    The Home department (Cookware, Drinkware, Bedding, Towels, Storage, Lighting) holds the same concepts under different
    names: Dimensions appears as Size, Size (cm), Height x Diameter and Dimensions (cm), optional in two categories and
    only about 65% complete, so it is the first thing to fix. Country of Origin and EAN are not held at all. Migration
    is about 19 working days (4 weeks). Creating the first group stores Home_Core_v2.
  checks:
    - tool: get_pim_taxonomy_and_attributes
      args: {category: Home}
      expect: ["Fabric", "Bulb Fitting", "Height x Diameter", "Dimensions"]
    - tool: get_pim_attribute_completeness_by_category
      args: {category: Home}
      expect: ["Storage", "Dimensions (cm) (58% complete)"]
    - tool: draft_attribute_taxonomy_proposal
      args: {category: Home}
      expect: ["Unify names and make mandatory in every category", "Height x Diameter", "Country of Origin", "Add: not held in PIM today"]
    - tool: calculate_migration_effort_for_taxonomy
      args: {category: Home}
      expect: ["attributes_to_rename: 11", "attributes_to_add: 12", "estimated_effort_days: 19", "estimated_weeks: 4"]
    - tool: create_pim_attribute_group
      args: {name: Home_Core_v2, category: Home, description: "Unified core attributes for home products"}
      expect: ["GRP-", "Home_Core_v2", "proposed"]

- question: "06:59:Q4"
  story: >
    Cookware SKU-100805 (Navy Cookware, the induction-hob complaints in customer service) is listed in PIM as suitable for
    "All hobs incl. induction" with low confidence (55, source marketplace); its dimensions (52) and material (48) are also
    low-confidence supplier values, matching the dimension and material complaints.
  checks:
    - tool: get_pim_attributes_for_product
      args: {sku: SKU-100805}
      expect: ["All hobs incl. induction", "55", "marketplace", "low confidence", "Pan diameter 28 cm"]

- question: "06:60:Q7"
  story: >
    Recycled content claims: SKU-100154 (CLM-900001) is fully certified (GRS 100%). SKU-100161 (CLM-900002) claims 100% but
    the certificate covers 70%, so the wording must be corrected. SKU-100427 (CLM-900003) has a lapsed GRS certificate.
    SKU-100700 (CLM-900004) and K-1700 packaging (CLM-900005) have no certificate and should be removed.
  checks:
    - tool: list_product_claims
      args: {claim_type: recycled_content}
      expect: ["CLM-900001", "CLM-900002", "70", "CLM-900003", "expired", "CLM-900004", "CLM-900005", "none"]
    - tool: update_product_claim
      args: {claim_id: CLM-900002, claim_text: "Made with 70% recycled polyester (GRS certified)", claimed_pct: 70}
      expect: ["Updated", "70% recycled polyester"]
    - tool: remove_product_claim
      args: {claim_id: CLM-900004, removal_reason: "No certificate on file"}
      expect: ["removed", "No certificate on file"]
    - tool: list_product_claims
      args: {sku: SKU-100700, status: removed}
      expect: ["CLM-900004", "removed", "No certificate on file"]

- question: "08:80:Q3"
  story: >
    Against Japan's rules (compact capacity, 100V, induction, waterproof outerwear, slim cuts, single/double beds) Cookware
    fits best (12 of 13 products, 92.3%), then Bedding (58.3%); Small Appliances, the biggest Japanese market, fit worst
    (4 of 43) because of capacity above 1.2 L and 230V, and Outerwear needs a waterproof shell range and smaller sizes.
  checks:
    - tool: compare_range_fit_to_market
      args: {target_market: Japan}
      expect: ["Cookware", "92.3", "Bedding", "Small Appliances", "Add a compact variant", "Re-certify for 100V", "Add a waterproof shell range"]
    - tool: get_product_attributes_for_range
      args: {category: Small Appliances}
      expect: ["Capacity", "Voltage & Wattage"]
