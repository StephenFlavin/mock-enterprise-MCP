# POS system scenarios: one entry per question in the brief
# Question refs: python -m mockmcp brief pos

- question: "03:25:Q5"
  story: >
    New Tops range (SKU-100070, 100077, 100084, STY-4056) for SS26 has sales data across
    ST001 Swindon and ST214 Glasgow over the last 4 weeks showing lower volume than expected.
    Size distribution shows too much M/L and not enough S/XS. Stores ST001 and ST214 ranked
    by sell-through show Glasgow underperforming. Availability averages 85% but some days drop
    to 70-80% which correlates with lower sales.
  checks:
    - tool: get_store_sell_through_ranking
      args: {category: "Tops"}
      expect: ["ST001", "ST214", "rank", "units_sold"]
    - tool: get_size_curve_vs_sales
      args: {category: "Tops"}
      expect: ["M", "L", "S", "sales_pct"]
    - tool: get_availability_impact_on_sales
      args: {days_back: 30}
      expect: ["medium", "low", "units", "revenue"]

- question: "03:27:Q6"
  story: >
    Availability impact data over last 30 days shows 5 products in medium availability (70-89%)
    have 40% lower unit sales than high availability items. This provides evidence for
    setting service level targets by segment.
  checks:
    - tool: get_availability_impact_on_sales
      args: {}
      expect: ["high", "medium", "low", "sku_count"]

- question: "07:68:Q5"
  story: >
    Leeds store (ST214 Glasgow) exceptions over last 6 weeks: 35+ exceptions including 12 voids,
    10 refunds, 8 discounts and 5 scan exceptions averaging £64 each. Scan exceptions spike
    around high-traffic hours. Total exception value £2240+. Employees EMP-00001 and EMP-00002
    account for most voids and refunds.
  checks:
    - tool: list_pos_exceptions
      args: {store_id: "ST214", exception_type: void}
      expect: ["EXC-900", "ST214", "void"]
    - tool: run_pos_exception_report
      args: {region: "Scotland"}
      expect: ["void", "refund", "discount", "exception_type"]

- question: "08:71:Q1"
  story: >
    ST214 Glasgow exceptions over last 4 weeks show 18+ exceptions (6 voids averaging £78,
    5 refunds averaging £79, 4 discounts averaging £32, 3+ scan exceptions). Till T01 and T02
    have highest void rates. Pattern: more exceptions on afternoons (14:00-16:00).
  checks:
    - tool: get_pos_voids_and_refunds_for_store
      args: {store_id: "ST214", date_from: "-28d"}
      expect: ["void", "refund", "discount", "scan_exception", "ST214"]
    - tool: list_pos_exceptions
      args: {store_id: "ST214"}
      expect: ["T01", "T02", "T03", "T04"]

- question: "08:71:Q2"
  story: >
    SKU-100070 (Sage Top M) and SKU-100077 (Sage Top L) show high sales on 2026-09-09 and 2026-09-10
    in store ST001, then drop sharply after 2026-09-11 when availability drops to 75%. Hourly data
    for ST001 shows morning peak at 10:00-11:00 when availability was highest (95%).
  checks:
    - tool: get_hourly_sales_for_product
      args: {sku: "SKU-100070"}
      expect: ["ST001", "transactions", "units_sold", "revenue_gbp"]
    - tool: get_sales_history_for_store_dates
      args: {store_id: "ST001", date_from: "-30d"}
      expect: ["sale_date", "units_sold", "revenue_gbp", "avg_availability_pct"]

- question: "08:71:Q4"
  story: >
    Store ST214 Glasgow daily sales over last 30 days show consistent £1000-1500 daily revenue,
    averaging 95% margin %. Recent week (last 7 days) shows same pattern with stable 7-12 transactions/day.
    No significant anomalies suggesting major local events.
  checks:
    - tool: get_sales_history_for_store_dates
      args: {store_id: "ST214", date_from: "-30d"}
      expect: ["ST214", "revenue_gbp", "margin_pct"]

- question: "08:73:Q4"
  story: >
    Period sales for UK North region (ST001 and others) over last 30 days: approximately 8000 units,
    £400,000+ revenue, 60-65% margin %. UK South region similar volumes. Data supports period
    outturn forecasting by region.
  checks:
    - tool: get_period_sales_to_date_for_region
      args: {region: "UK North"}
      expect: ["UK North", "units_sold", "revenue_gbp", "margin_pct"]

- question: "08:77:Q2"
  story: >
    Tops category (including Sage Tops STY-4056) sales and margin history over 26 weeks show
    baseline revenue £200k/week, margin 38%. Recent 4 weeks average 38.2% margin with 2100 units/week.
    Price point £63.99 with cost £23.57 gives elasticity baseline for testing 5% increase.
  checks:
    - tool: get_sales_and_margin_history_for_category
      args: {category: "Tops"}
      expect: ["units_sold", "revenue_gbp", "margin_pct"]

- question: "08:77:Q3"
  story: >
    Lighting category (SKU-100112, 100119, 100126, STY-4071) sales mix over 13 weeks shows
    stable distribution week-to-week. Weekly volume 200-250 units, margin 35%. No significant
    shift indicating pricing or cost mix changes drove margin variance elsewhere.
  checks:
    - tool: get_sales_mix_shift_for_category
      args: {category: "Lighting"}
      expect: ["week", "size", "mix_pct"]
    - tool: get_sales_and_margin_history_for_category
      args: {category: "Lighting"}
      expect: ["margin_pct", "revenue_gbp"]

- question: "08:79:Q1"
  story: >
    Region Scotland (ST214) exceptions over last 6 weeks total 25+ exceptions (8 voids, 7 refunds,
    6 discounts, 4+ scan exceptions) worth £1600+ across multiple stores. Exceptions concentrated
    in T01/T02 and employees EMP-00001/EMP-00002. Scan exception pattern suggests possible
    unexpected-item rule issue on certain product types.
  checks:
    - tool: get_pos_voids_and_refunds_for_region
      args: {region: "Scotland"}
      expect: ["ST214", "void", "refund", "discount"]
    - tool: run_pos_exception_report
      args: {region: "Scotland", weeks_back: 6}
      expect: ["void", "refund", "discount", "exception_type"]

- question: "08:79:Q5"
  story: >
    Five stores including ST214 Glasgow show elevated self-checkout scan exception rates:
    ST214 weight_tolerance at 3.8%, unexpected_item at 4.5% (chain average 1.2-1.8%).
    Suggests rules too sensitive. Other stores like ST001 at 1.2% and 1.8% are normal.
    Rule SCR-900001 and SCR-900003 should be loosened.
  checks:
    - tool: get_self_checkout_scan_exception_rates
      args: {store_id: "ST214"}
      expect: ["ST214", "weight_tolerance", "unexpected_item", "exception_rate_pct"]
    - tool: update_self_checkout_exception_rule
      args: {rule_id: "SCR-900001", threshold_value: 0.7}
      expect: ["SCR-900001", "updated"]
