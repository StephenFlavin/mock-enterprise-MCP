# POS scenarios: one entry per question in the brief (python -m mockmcp brief pos)

- question: "03:25:Q5"
  story: >
    The Tops range (STY-4056 and the other Tops styles, sizes 10/12/14) was bought to a 35/40/25 curve but sells
    22/44/34: size 14 is under-bought and size 10 over-bought. Sell-through is 44% against a 55% plan (20% behind);
    the five Scottish stores (ST201, ST204, ST207, ST212, ST214) are over-allocated and sit at the bottom of the
    ranking with about 30%, while UK South and Leeds stores sit near plan.
  checks:
    - tool: get_size_curve_vs_sales
      args: {category: Tops}
      expect: ["expected_pct", "variance_pts", "14", "-12.8"]
    - tool: get_store_sell_through_ranking
      args: {category: Tops}
      expect: ["ST214", "ST204", "ST201", "chain_sell_through_pct", "44"]

- question: "03:27:Q6"
  story: >
    Customers respond to availability: SKUs averaging 70-89% availability sell about half as many units per SKU as
    those at 90%+, and the effect is stronger for A-class SKUs (top sellers, about 70% fewer). Availability and
    units are positively correlated.
  checks:
    - tool: get_availability_impact_on_sales
      args: {}
      expect: ["high (90%+)", "medium (70-89%)", "units_per_sku_vs_high_pct", "est_lost_units"]
    - tool: get_availability_impact_on_sales
      args: {abc_class: A}
      expect: ["medium (70-89%)", "availability_sales_correlation"]

- question: "07:68:Q5"
  story: >
    At the Leeds store ST159 voids and refunds have ramped up over six weeks. Till T02 processed by EMP-00481
    accounts for almost all voids (reasons operator error, duplicate, wrong till) clustered at 14:00-16:00, far
    above the peer-store average. EMP-00472 (neighbouring Leeds manager) has a few legitimate cover voids.
  checks:
    - tool: list_pos_exceptions
      args: {store_id: ST159, exception_type: void}
      expect: ["EMP-00481", "T02", "operator error", "duplicate"]
    - tool: get_pos_voids_and_refunds_for_store
      args: {store_id: ST159}
      expect: ["EMP-00481", "Cameron Hill", "T02", "peer_avg_count_per_store"]

- question: "08:71:Q1"
  story: >
    At ST214 Glasgow, refunds ('wrong item', 'fit issue') cluster on till T03 and are processed by EMP-00529
    (Glasgow Shopping Centre manager covering shifts), about three times the peer average for refunds. Other tills
    and the store manager are at normal levels.
  checks:
    - tool: get_pos_voids_and_refunds_for_store
      args: {store_id: ST214}
      expect: ["EMP-00529", "Marc Taylor", "T03", "refund"]

- question: "08:71:Q2"
  story: >
    At ST214 the three best-selling Blouse lines SKU-100007, SKU-100014 and SKU-100021 sell strongly at 10:00-12:00
    but availability slides from about 92% to 55% over the last three days (SKU-100021 only to 84%), with no sales
    after lunchtime on the worst days: shelf gaps although the system shows stock.
  checks:
    - tool: get_hourly_sales_for_product
      args: {sku: SKU-100007, store_id: ST214}
      expect: ["ST214", "10:00", "11:00", "avg_availability_pct", "55"]
    - tool: get_hourly_sales_for_product
      args: {sku: SKU-100021, store_id: ST214}
      expect: ["ST214", "84"]

- question: "08:71:Q4"
  story: >
    ST214 daily sales show how past local effects hit trade: a festival Saturday 37 days ago more than doubled
    daily revenue (best day by far), and since the parking-area roadworks began 20 days ago weekday revenue is
    about 20% lower.
  checks:
    - tool: get_sales_history_for_store_dates
      args: {store_id: ST214, date_from: -45d}
      expect: ["ST214", "Saturday", "revenue_vs_period_avg_pct", "weekday"]

- question: "08:73:Q4"
  story: >
    UK North (16 stores in the POS extract) is trading about 6-7% below last year in units and revenue period to
    date, with margin about 0.8 points below last year. Other regions are within a few points of last year.
  checks:
    - tool: get_period_sales_to_date_for_region
      args: {region: UK North}
      expect: ["UK North", "last_year_revenue_gbp", "revenue_vs_last_year_pct", "-6"]
    - tool: get_period_sales_to_date_for_region
      args: {region: UK North, period: last period}
      expect: ["UK North", "period_from", "units_vs_last_year_pct"]

- question: "08:77:Q2"
  story: >
    Small Appliances weekly history shows a four-week promotion about four months ago: price realised versus list
    drops from about 97.5% to 90% and weekly units rise about 25-35%, giving a read on price response; margin %
    drops from about 68.5% to 65.5% in those weeks.
  checks:
    - tool: get_sales_and_margin_history_for_category
      args: {category: Small Appliances, weeks_back: 26}
      expect: ["avg_selling_price_gbp", "price_realised_vs_list_pct", "90", "margin_pct"]

- question: "08:77:Q3"
  story: >
    Home category mix has shifted over the last four weeks toward Storage and Bedding (the lowest-margin Home
    categories, about 66% margin) and away from Towels, Lighting and Drinkware (about 69-71%), pulling Home margin
    down about a point.
  checks:
    - tool: get_sales_mix_shift_for_category
      args: {department: Home, weeks_back: 8}
      expect: ["Storage", "Bedding", "Towels", "week_margin_pct", "mix_change_pts"]

- question: "08:79:Q1"
  story: >
    Across UK North over the last six weeks ST159 Leeds Retail Park is the clear outlier for voids (about five
    times the regional average count, peak hour 15:00, and half of the region's weekly void value). ST183 is a
    weaker second signal: refunds of high-value items at 2x the regional average, peaking late afternoon.
  checks:
    - tool: get_pos_voids_and_refunds_for_region
      args: {region: UK North}
      expect: ["ST159", "ST183", "void", "count_vs_region_avg_x", "peak_hour"]
    - tool: run_pos_exception_report
      args: {region: UK North}
      expect: ["ST159", "void", "top_store_share_pct", "week_on_week_pct_change"]

- question: "08:79:Q5"
  story: >
    Five Leeds stores (ST150, ST159, ST165, ST181, ST183) have unexpected-item exception rates 1.5-2.2x the chain
    average. ST150, ST159 and ST181 show a sudden step up (system-fault pattern, matching scanner malfunctions
    logged elsewhere); ST165 and ST183 climb steadily week on week (deliberate-theft pattern). Rule ids SCR-900001
    to SCR-900005 can be tightened with the update tool.
  checks:
    - tool: get_self_checkout_scan_exception_rates
      args: {rule_type: unexpected_item}
      expect: ["ST159", "ST150", "ST165", "ST181", "ST183", "SCR-900002", "chain_avg_pct"]
    - tool: update_self_checkout_exception_rule
      args: {rule_id: SCR-900002, threshold_value: 0.1}
      expect: ["SCR-900002", "0.15", "0.1"]
    - tool: get_self_checkout_scan_exception_rates
      args: {store_id: ST159, rule_type: unexpected_item}
      expect: ["SCR-900002", "0.1"]
