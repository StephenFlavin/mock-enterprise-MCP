# Scenarios for cost_allocation system tests
# One entry per question row in the brief that uses this system's tools

- question: "07:62:Q3"
  story: >
    The £12m Northampton (DC1) automation investment analysis requires current DC cost structure
    by component. DC1 handles 1.5M units annually with labour at 0.12/unit, space at 0.063/unit,
    equipment at 0.103/unit, and overhead at 0.043/unit. This baseline is used in the ROI model.
  checks:
    - tool: get_site_operating_costs
      args: {site_id: DC1}
      expect: ["DC1", "labour", "0.12", "1500000"]
    - tool: get_dc_cost_per_unit_by_component
      args: {site_id: DC1}
      expect: ["labour", "0.12", "space", "0.06"]

- question: "07:63:Q2"
  story: >
    Full cost-to-serve by channel (stores, online, wholesale) for FY26 actuals: store is 9% of sales,
    online is 16% of sales, wholesale is 5.5% of sales. Online is 2.3x more expensive than store due to
    higher transport and returns costs. This is saved as scenario SCEN-000001 (FY26 Actuals).
  checks:
    - tool: get_cost_to_serve_by_channel
      args: {}
      expect: ["store", "online", "warehousing"]
    - tool: get_warehouse_cost_pools
      args: {}
      expect: ["labour", "space", "equipment"]
    - tool: create_cost_allocation_scenario
      args: {scenario_name: "Test Scenario", assumptions: "Test assumptions", created_by: "EMP-00004"}
      expect: ["SCEN-"]
    - tool: update_cost_allocation_driver
      args: {driver_id: "DRV-000001", allocation_base: "weight", rate_gbp_per_unit: 0.85}
      expect: ["archived"]

- question: "07:63:Q4"
  story: >
    Logistics cost benchmarking: our total logistics cost is 12.5% of sales (median 11.0%, best-in-class 9.5%),
    putting us in quartile 2. We are above median on transport (4.8% vs 4.2%) but below on warehousing (5.5% vs 5.0%).
  checks:
    - tool: get_logistics_cost_by_line
      args: {}
      expect: ["total_logistics_cost", "0.12", "quartile", "2"]

- question: "07:63:Q6"
  story: >
    E-commerce cost per order went from £18.09 (four weeks ago) to £19.19 (this week).
    Labour increased from £4.47 to £4.24 per order (up 3%), transport from £8.03 to £8.67 (up 8%).
    This is driven by increased delivery costs and higher returns processing.
  checks:
    - tool: get_ecom_cost_per_order
      args: {}
      expect: ["2100", "19.19", "40300"]
    - tool: get_ecom_cost_per_order
      args: {}
      expect: ["1520", "18.09", "27500"]

- question: "07:63:Q7"
  story: >
    Small loss-making SKUs that cost more to serve than they earn: SKU-100063 loses £6.60/unit
    (1000 units), SKU-100070 loses £11.70/unit (2500 units), SKU-100077 loses £13.80/unit (4000 units).
    SKU-100056 loses £4.10/unit (1500 units). These should be flagged for range review.
  checks:
    - tool: get_sku_cost_to_serve
      args: {margin_threshold_gbp: -2.0}
      expect: ["SKU-100063", "-6.6"]
    - tool: get_sku_cost_to_serve
      args: {sku: "PF-220"}
      expect: ["PF-220", "45000", "7.52"]

- question: "09:87:Q5"
  story: >
    Northampton DC (DC1) cost per unit is £0.3299 (labour 0.12 + space 0.063 + equipment 0.103 + overhead 0.043)
    compared to network average of ~£0.305. The 8% structural difference is driven by lower throughput (1.5M units)
    and higher labour costs, fixable through automation and consolidation. This breakdown is available by component.
  checks:
    - tool: get_dc_cost_per_unit_by_component
      args: {site_id: DC1}
      expect: ["labour", "space", "equipment", "overhead"]
    - tool: get_dc_cost_per_unit_by_component
      args: {site_id: DC2}
      expect: ["DC2", "0.11"]
