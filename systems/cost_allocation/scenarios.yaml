# One entry per question row in the brief that uses this system's tools

- question: "07:62:Q3"
  story: >
    Northampton (DC1) annual operating cost base for the automation case: £64.6m on 62m units, of which labour
    £27.1m (42%), equipment £16.1m, space £13.6m and overhead £7.75m, £1.04 per unit.
  checks:
    - tool: get_site_operating_costs
      args: {site_id: DC1}
      expect: ["27125000", "64635000", "42", "1.04"]

- question: "07:63:Q2"
  story: >
    FY26 cost to serve by channel: store 6.1% of sales and +£934m contribution, wholesale 8.2%, online 34.2% of
    sales (£30.31 per order) and -£22.5m contribution after cost to serve, so online is unprofitable. Returns is
    allocated from POOL-RET-NET by the active driver DRV-000023 (orders); SCEN-000002 (free returns removed, -30%)
    cuts online cost by £16.9m but online stays negative. Switching the returns driver to items moves cost to store.
  checks:
    - tool: get_cost_to_serve_by_channel
      args: {channel: online}
      expect: ["30.31", "34.21", "-22462264"]
    - tool: get_warehouse_cost_pools
      args: {cost_type: returns}
      expect: ["POOL-RET-NET", "DRV-000023", "orders"]
    - tool: calculate_cost_to_serve_scenario
      args: {scenario_id: SCEN-000002}
      expect: ["16938679", "-5523585", "18900000"]
    - tool: create_cost_allocation_scenario
      args: {scenario_name: "Free returns removed", assumptions: "Returns pool reduced 30%", returns_change_pct: -30, created_by: "EMP-00085"}
      expect: ["SCEN-000003"]
    - tool: update_cost_allocation_driver
      args: {driver_id: DRV-000023, allocation_base: items, rate_gbp_per_unit: 7.68}
      expect: ["orders → items"]
    - tool: get_cost_to_serve_by_channel
      args: {channel: store, cost_type: returns}
      expect: ["store", "returns", "21"]

- question: "07:63:Q4"
  story: >
    Logistics cost is 12.92% of sales against a median of 11.4%. Returns is furthest above benchmark (2.1% vs 1.5%,
    +40%) but its definition is the least comparable; outbound transport is +14.3% with a like-for-like definition.
    Packaging (0.55%) beats best in class.
  checks:
    - tool: get_logistics_cost_by_line
      args: {}
      expect: ["returns", "40", "low", "outbound_transport", "14.3", "12.92"]

- question: "07:63:Q6"
  story: >
    Cost per e-commerce order rose from £6.20 to £7.10 on volume up 150k orders: transport +£0.45, returns +£0.23,
    labour +£0.20, system +£0.02.
  checks:
    - tool: get_ecom_cost_per_order
      args: {}
      expect: ["7.1", "6.2", "0.45", "0.23", "0.2"]

- question: "07:63:Q7"
  story: >
    Seven small (<=0.5 kg) SKUs lose money after cost to serve; six lose more than £2 a unit (worst SKU-105775 at
    -£3.89). SKU-104816 loses £1.86. SKU-102296 is a medium-size loss-maker excluded from the small filter.
  checks:
    - tool: get_sku_cost_to_serve
      args: {size_class: small, margin_threshold_gbp: 0}
      expect: ["SKU-105775", "-3.89", "SKU-104816", "-1.86"]
    - tool: get_sku_cost_to_serve
      args: {size_class: small, margin_threshold_gbp: -2}
      expect: ["SKU-104830", "-2.96"]

- question: "09:87:Q5"
  story: >
    DC1 cost per unit is £1.04 against a network average of £0.88 (+18.1%), about £9.9m a year of excess; labour
    is the largest part (£3.9m), space the highest percentage (+22.5%) but 90% fixed.
  checks:
    - tool: get_dc_cost_per_unit_by_component
      args: {site_id: DC1}
      expect: ["18.1", "1.04", "0.88", "3923333", "9893333"]
