id: risk
name: Risk Management System
instructions: >
  Enterprise risk register, alerts, events, scenarios and analysis. Risk ids like RSK-000123,
  alert rule ids like ARU-000123, scenario ids like RSC-000123, disruption incident ids like DIS-000123.
  Track supply chain, geopolitical, financial and operational risks with exposure estimates.

tables:
  risk_register:
    key: risk_id
    cols:
      risk_id: {type: str, desc: "Risk register entry, e.g. RSK-000123"}
      risk_category: {type: enum, values: [supply_chain, geopolitical, financial, operational, regulatory, climate, other], desc: "Risk category"}
      description: {type: text, desc: "What the risk is"}
      owner_id: {type: str, desc: "Responsible employee"}
      likelihood_pct: {type: int, desc: "Probability 0-100%"}
      impact_gbp: {type: float, desc: "Financial impact if it occurs"}
      exposure_gbp: {type: float, desc: "Expected value: likelihood * impact"}
      rating: {type: enum, values: [low, medium, high, critical], desc: "Risk rating"}
      affected_sku: {type: str, desc: "SKU if applicable"}
      affected_supplier_id: {type: str, desc: "Supplier if applicable"}
      affected_site_id: {type: str, desc: "DC or site if applicable"}
      mitigation_plan: {type: text, desc: "How we plan to mitigate"}
      status: {type: enum, values: [active, mitigated, closed], desc: "Risk status"}
      assumptions: {type: text, desc: "Key assumptions made"}
      created_at: {type: timestamp, desc: "When registered"}
      updated_at: {type: timestamp, desc: "Last updated"}
      archived_at: {type: timestamp, desc: "When archived if closed"}

  risk_alert_rules:
    key: rule_id
    cols:
      rule_id: {type: str, desc: "Alert rule, e.g. ARU-000123"}
      rule_name: {type: str, desc: "Name of the monitoring rule"}
      trigger_type: {type: enum, values: [country_risk, supplier_risk, port_risk, weather, regulatory, financial, other], desc: "What triggers this rule"}
      trigger_country: {type: str, desc: "Country code if country-based trigger"}
      trigger_supplier_id: {type: str, desc: "Supplier if supplier-based trigger"}
      severity_level: {type: enum, values: [info, warning, critical], desc: "Alert severity"}
      description: {type: text, desc: "What this rule watches for"}
      action_required: {type: text, desc: "What to do when triggered"}
      active: {type: bool, desc: "Whether this rule is enabled"}
      created_at: {type: timestamp, desc: "When rule created"}
      last_triggered_at: {type: timestamp, desc: "When last triggered"}

  risk_events:
    key: event_id
    cols:
      event_id: {type: str, desc: "Risk event, e.g. RVT-000123"}
      event_type: {type: enum, values: [geopolitical, weather, port_disruption, supplier_issue, regulatory, financial, cyber, other], desc: "Type of event"}
      location: {type: str, desc: "Geographic location or region"}
      description: {type: text, desc: "Event details"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Event severity"}
      affected_suppliers: {type: str, desc: "Comma-separated supplier ids"}
      affected_ports: {type: str, desc: "Comma-separated port names"}
      time_to_impact_days: {type: int, desc: "Days until impact felt"}
      revenue_at_risk_gbp: {type: float, desc: "Revenue potentially impacted"}
      status: {type: enum, values: [emerging, active, monitoring, resolved], desc: "Event status"}
      first_detected_at: {type: timestamp, desc: "When event first detected"}
      impact_felt_at: {type: timestamp, desc: "When impact started"}

  risk_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Scenario, e.g. RSC-000123"}
      scenario_name: {type: str, desc: "Name of the scenario"}
      description: {type: text, desc: "What-if scenario description"}
      trigger_event: {type: str, desc: "What would trigger this scenario"}
      likelihood_pct: {type: int, desc: "Estimated probability 0-100"}
      revenue_impact_gbp: {type: float, desc: "Revenue impact in worst case"}
      margin_impact_pct: {type: float, desc: "Margin impact percentage"}
      affected_skus: {type: str, desc: "Comma-separated SKUs impacted"}
      mitigation_options: {type: text, desc: "Possible mitigations"}
      cost_to_mitigate_gbp: {type: float, desc: "Cost of main mitigation"}
      payback_weeks: {type: int, desc: "Weeks until investment recovers"}
      created_at: {type: timestamp, desc: "When scenario created"}
      created_by_id: {type: str, desc: "Employee id who created it"}

  disruption_incidents:
    key: incident_id
    cols:
      incident_id: {type: str, desc: "Disruption incident, e.g. DIS-000123"}
      incident_name: {type: str, desc: "Name of the disruption"}
      description: {type: text, desc: "What happened"}
      root_cause: {type: text, desc: "Root cause of the disruption"}
      started_at: {type: timestamp, desc: "When the disruption started"}
      ended_at: {type: timestamp, desc: "When it was resolved"}
      duration_days: {type: int, desc: "Duration in days"}
      revenue_impact_gbp: {type: float, desc: "Actual revenue impact"}
      cost_impact_gbp: {type: float, desc: "Actual cost impact"}
      affected_suppliers: {type: str, desc: "Comma-separated supplier ids"}
      affected_skus: {type: str, desc: "Comma-separated affected SKUs"}
      lessons_learned: {type: text, desc: "Lessons and insights"}
      assumptions_wrong: {type: text, desc: "Which risk assumptions were proved wrong"}
      status: {type: enum, values: [in_progress, closed, archived], desc: "Incident status"}

  risk_assumptions:
    key: [incident_id, assumption_id]
    cols:
      incident_id: {type: str, desc: "Related disruption incident"}
      assumption_id: {type: int, desc: "Assumption number in this incident"}
      assumption_text: {type: text, desc: "The assumption that was made"}
      expected_value: {type: str, desc: "What we thought would happen"}
      actual_value: {type: str, desc: "What actually happened"}
      impact_of_error: {type: text, desc: "How the error affected outcomes"}
      recorded_at: {type: timestamp, desc: "When recorded"}

  guidance_risks:
    key: guidance_risk_id
    cols:
      guidance_risk_id: {type: str, desc: "Guidance risk entry, e.g. GRK-000123"}
      risk_description: {type: text, desc: "What risk to our revenue guidance"}
      guidance_range_gbp: {type: str, desc: "Affected guidance range, e.g. 850-900m"}
      likelihood_pct: {type: int, desc: "Probability 0-100"}
      impact_gbp: {type: float, desc: "Impact if occurs"}
      mitigation: {type: text, desc: "How we mitigate"}
      status: {type: enum, values: [active, mitigated, resolved], desc: "Status"}
      created_at: {type: timestamp, desc: "When identified"}

  single_points_of_failure:
    key: spof_id
    cols:
      spof_id: {type: str, desc: "SPOF entry, e.g. SPF-000123"}
      failure_type: {type: enum, values: [supplier, route, facility, carrier, port, raw_material, customer], desc: "Type of SPOF"}
      description: {type: text, desc: "What is the single point of failure"}
      critical_skus: {type: str, desc: "Comma-separated critical SKUs"}
      affected_supplier_id: {type: str, desc: "Supplier if applicable"}
      affected_route: {type: str, desc: "Route description if applicable"}
      revenue_dependent_gbp: {type: float, desc: "Annual revenue depending on this"}
      mitigation_options: {type: str, desc: "e.g. dual source, buffer stock, alternate route"}
      option_cost_gbp: {type: float, desc: "Cost of best mitigation"}
      priority: {type: enum, values: [low, medium, high, critical], desc: "Priority to address"}
      status: {type: enum, values: [identified, planning, implemented, mitigated], desc: "Status"}
      created_at: {type: timestamp, desc: "When identified"}

  cutover_risks:
    key: cutover_risk_id
    cols:
      cutover_risk_id: {type: str, desc: "Cutover risk, e.g. CTO-000123"}
      project_name: {type: str, desc: "Related project or go-live"}
      risk_description: {type: text, desc: "The risk during cutover"}
      probability: {type: enum, values: [low, medium, high, certain], desc: "Probability"}
      business_impact: {type: text, desc: "Impact if occurs"}
      impact_severity: {type: enum, values: [low, medium, high, critical], desc: "Severity rating"}
      mitigation_steps: {type: text, desc: "How to mitigate"}
      owner_id: {type: str, desc: "Responsible employee"}
      status: {type: enum, values: [open, mitigated, resolved, archived], desc: "Status"}
      created_at: {type: timestamp, desc: "When created"}

  risk_opportunities:
    key: opportunity_id
    cols:
      opportunity_id: {type: str, desc: "Opportunity, e.g. OPP-000123"}
      opportunity_name: {type: str, desc: "Name of opportunity"}
      description: {type: text, desc: "What is the opportunity"}
      category: {type: enum, values: [cost_saving, revenue_growth, efficiency, risk_reduction, other], desc: "Type of opportunity"}
      potential_benefit_gbp: {type: float, desc: "Estimated annual benefit"}
      probability_pct: {type: int, desc: "Probability of realizing 0-100"}
      expected_value_gbp: {type: float, desc: "Probability * benefit"}
      owner_id: {type: str, desc: "Responsible employee"}
      status: {type: enum, values: [identified, approved, in_progress, realized, cancelled], desc: "Status"}
      created_at: {type: timestamp, desc: "When identified"}

  risk_mitigation_options:
    key: mitigation_id
    cols:
      mitigation_id: {type: str, desc: "Mitigation option, e.g. MIT-000123"}
      related_risk_id: {type: str, desc: "Risk this mitigates"}
      option_name: {type: str, desc: "Name of the mitigation"}
      option_description: {type: text, desc: "How it works"}
      cost_gbp: {type: float, desc: "Implementation cost"}
      residual_risk_pct: {type: int, desc: "Risk reduction %"}
      implementation_weeks: {type: int, desc: "Weeks to implement"}
      effectiveness: {type: enum, values: [low, medium, high, very_high], desc: "Mitigation effectiveness"}
      owner_id: {type: str, desc: "Responsible employee"}

tools:
  - name: get_enterprise_risk_register
    desc: "Principal risks across the enterprise with ratings, exposure and mitigation status. Overview of key portfolio risks."
    kind: sql
    args:
      status: {type: enum, values: [active, mitigated, closed], desc: "Filter by status"}
      rating: {type: enum, values: [low, medium, high, critical], desc: "Filter by rating"}
    sql: |
      SELECT risk_id, risk_category, description, likelihood_pct, impact_gbp, exposure_gbp,
             rating, affected_sku, affected_supplier_id, affected_site_id, mitigation_plan, status
      FROM risk_register
      WHERE ($status IS NULL OR status = $status)
        AND ($rating IS NULL OR rating = $rating)
      ORDER BY exposure_gbp DESC, rating DESC
    limit: 50
    example: {rating: high}

  - name: get_risk_register_entries
    desc: "Risk register entries with assumptions and history. For review and audit of specific risks."
    kind: sql
    args:
      risk_category: {type: enum, values: [supply_chain, geopolitical, financial, operational, regulatory, climate, other]}
      supplier_id: {}
      site_id: {}
      date_from: {type: date, default: "-180d", desc: "Risks created on or after"}
    sql: |
      SELECT risk_id, risk_category, description, likelihood_pct, impact_gbp, exposure_gbp,
             rating, owner_id, mitigation_plan, assumptions, status, created_at, updated_at
      FROM risk_register
      WHERE ($risk_category IS NULL OR risk_category = $risk_category)
        AND ($supplier_id IS NULL OR affected_supplier_id = $supplier_id)
        AND ($site_id IS NULL OR affected_site_id = $site_id)
        AND created_at >= CAST($date_from AS DATE)
      ORDER BY created_at DESC
    limit: 50
    example: {risk_category: supply_chain}

  - name: get_supply_risk_summary
    desc: "Top supply chain risks with ratings and current mitigations. Quick view of supply exposure."
    kind: sql
    args:
      limit_results: {type: int, default: 10, desc: "Number of top risks to show"}
    sql: |
      SELECT risk_id, description, affected_supplier_id, affected_sku, likelihood_pct,
             exposure_gbp, rating, mitigation_plan, status
      FROM risk_register
      WHERE risk_category = 'supply_chain' AND status IN ('active', 'mitigated')
      ORDER BY exposure_gbp DESC
      LIMIT CAST($limit_results AS INT)
    limit: 20
    example: {}

  - name: list_supply_chain_risks
    desc: "List supply chain risks by supplier or SKU. Use to see what's exposed."
    kind: select
    from: risk_register
    filters:
      risk_category: {default: supply_chain}
      affected_supplier_id: {}
      affected_sku: {}
      rating: {type: enum, values: [low, medium, high, critical]}
    columns: [risk_id, description, affected_supplier_id, affected_sku, likelihood_pct, impact_gbp, exposure_gbp, rating, status]
    order: exposure_gbp DESC
    limit: 50
    example: {risk_category: supply_chain}

  - name: list_single_points_of_failure
    desc: "Critical single-source and single-route dependencies with revenue at risk. Use to find concentration risk."
    kind: select
    from: single_points_of_failure
    filters:
      failure_type: {}
      priority: {}
      status: {}
    columns: [spof_id, failure_type, description, critical_skus, affected_supplier_id, revenue_dependent_gbp, mitigation_options, priority, status]
    order: revenue_dependent_gbp DESC
    limit: 30
    example: {}

  - name: get_guidance_risk_register
    desc: "Risks that could affect our revenue guidance with likelihood and impact. For earnings forecasting."
    kind: select
    from: guidance_risks
    filters:
      status: {type: enum, values: [active, mitigated, resolved]}
    columns: [guidance_risk_id, risk_description, guidance_range_gbp, likelihood_pct, impact_gbp, mitigation, status]
    order: impact_gbp DESC
    limit: 20
    example: {status: active}

  - name: list_cutover_risks
    desc: "Cutover and go-live risks with ratings. For project delivery assurance."
    kind: select
    from: cutover_risks
    filters:
      project_name: {op: like}
      status: {type: enum, values: [open, mitigated, resolved, archived]}
      impact_severity: {}
    columns: [cutover_risk_id, project_name, risk_description, probability, impact_severity, mitigation_steps, owner_id, status]
    order: impact_severity
    limit: 30
    example: {}

  - name: list_key_risks_and_opportunities
    desc: "Key risks and opportunities register entries for strategic review."
    kind: sql
    args:
      limit_results: {type: int, default: 5, desc: "Number of items to return"}
    sql: |
      SELECT risk_id AS item_id, risk_category AS category, description, exposure_gbp AS value_gbp, rating AS severity, 'risk' AS type
      FROM risk_register WHERE status IN ('active', 'mitigated')
      UNION ALL
      SELECT opportunity_id, category, description, expected_value_gbp, probability_pct, 'opportunity'
      FROM risk_opportunities WHERE status IN ('identified', 'approved', 'in_progress')
      ORDER BY value_gbp DESC
      LIMIT CAST($limit_results AS INT)
    limit: 20
    example: {}

  - name: list_disruption_scenarios
    desc: "Defined disruption scenarios with likelihood and mitigation. Use for contingency planning."
    kind: select
    from: risk_scenarios
    filters:
      scenario_name: {op: like}
    columns: [scenario_id, scenario_name, description, likelihood_pct, revenue_impact_gbp, margin_impact_pct, cost_to_mitigate_gbp, payback_weeks]
    order: likelihood_pct DESC
    limit: 20
    example: {}

  - name: get_risk_events_feed
    desc: "Current monitored risk events and their status. For daily risk monitoring and updates."
    kind: sql
    args:
      status: {type: enum, values: [emerging, active, monitoring, resolved], default: active}
      days_back: {type: int, default: 30, desc: "Events in the last N days"}
    sql: |
      SELECT event_id, event_type, location, description, severity, affected_suppliers,
             affected_ports, time_to_impact_days, revenue_at_risk_gbp, status, first_detected_at
      FROM risk_events
      WHERE ($status IS NULL OR status = $status)
        AND first_detected_at >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
      ORDER BY first_detected_at DESC, severity DESC
    limit: 50
    example: {status: active}

  - name: get_country_risk_alerts
    desc: "Active risk alerts by sourcing country. Use for geopolitical risk monitoring."
    kind: sql
    args:
      country: {type: str, desc: "Country code or name"}
      severity_level: {type: enum, values: [info, warning, critical]}
    sql: |
      SELECT rule_id, rule_name, trigger_country, description, severity_level, action_required,
             last_triggered_at, active
      FROM risk_alert_rules
      WHERE trigger_type IN ('country_risk', 'weather', 'regulatory')
        AND ($country IS NULL OR trigger_country = $country)
        AND ($severity_level IS NULL OR severity_level = $severity_level)
        AND active = true
      ORDER BY last_triggered_at DESC
    limit: 30
    example: {country: VN}

  - name: calculate_risk_financial_exposure
    desc: "Calculate total financial exposure and expected value by category. Shows where the money is at risk."
    kind: sql
    args:
      risk_category: {type: enum, values: [supply_chain, geopolitical, financial, operational, regulatory, climate, other]}
    sql: |
      SELECT risk_category,
             count(*) AS risk_count,
             round(sum(exposure_gbp), 0) AS total_exposure_gbp,
             round(avg(exposure_gbp), 0) AS avg_exposure_gbp,
             round(max(exposure_gbp), 0) AS max_exposure_gbp,
             round(sum(impact_gbp), 0) AS total_potential_impact_gbp,
             'total_exposure = sum(likelihood% * impact_gbp)' AS formula
      FROM risk_register
      WHERE ($risk_category IS NULL OR risk_category = $risk_category)
        AND status IN ('active', 'mitigated')
      GROUP BY risk_category
      ORDER BY total_exposure_gbp DESC
    limit: 20
    example: {risk_category: supply_chain}

  - name: calculate_risk_correlation
    desc: "Calculate correlation between risks (e.g., weather, geopolitics affecting same suppliers or SKUs)."
    kind: sql
    args:
      risk_id_1: {type: str, desc: "First risk id"}
      risk_id_2: {type: str, desc: "Second risk id"}
    sql: |
      WITH r1 AS (
        SELECT risk_id, affected_sku, affected_supplier_id, affected_site_id
        FROM risk_register WHERE risk_id = $risk_id_1
      ),
      r2 AS (
        SELECT risk_id, affected_sku, affected_supplier_id, affected_site_id
        FROM risk_register WHERE risk_id = $risk_id_2
      )
      SELECT r1.risk_id AS risk_1, r2.risk_id AS risk_2,
             CASE WHEN r1.affected_sku = r2.affected_sku THEN 'same_sku' ELSE '' END AS shared_sku,
             CASE WHEN r1.affected_supplier_id = r2.affected_supplier_id THEN 'same_supplier' ELSE '' END AS shared_supplier,
             CASE WHEN r1.affected_site_id = r2.affected_site_id THEN 'same_site' ELSE '' END AS shared_site,
             'Risks are correlated if they share common dependencies' AS correlation_note
      FROM r1, r2 WHERE r1.risk_id != r2.risk_id
    limit: 1
    example: {risk_id_1: "RSK-900001", risk_id_2: "RSK-900002"}

  - name: calculate_time_to_impact
    desc: "Estimated time before a risk event affects supply or sales. Use for prioritization."
    kind: sql
    args:
      event_id: {type: str, required: true, desc: "Risk event id"}
    sql: |
      SELECT event_id, event_type, location, description,
             time_to_impact_days, revenue_at_risk_gbp,
             CASE WHEN time_to_impact_days <= 7 THEN 'immediate'
                  WHEN time_to_impact_days <= 30 THEN 'urgent'
                  ELSE 'planned' END AS urgency,
             'time_to_impact_days from event report' AS metric
      FROM risk_events
      WHERE event_id = $event_id
    limit: 1
    example: {event_id: "RVT-900001"}

  - name: get_disruption_incident_timeline
    desc: "Timeline of a past disruption showing start, impact and resolution. For post-mortems."
    kind: sql
    args:
      incident_id: {type: str, required: true, desc: "Disruption incident id"}
    sql: |
      SELECT incident_id, incident_name, description, root_cause, started_at, ended_at,
             duration_days, revenue_impact_gbp, cost_impact_gbp, affected_suppliers,
             affected_skus, lessons_learned, assumptions_wrong, status
      FROM disruption_incidents
      WHERE incident_id = $incident_id
    limit: 1
    example: {incident_id: "DIS-900001"}

  - name: compare_risk_assumptions_to_actuals
    desc: "Compare risk register assumptions with observed disruption outcomes. Shows where we were wrong."
    kind: sql
    args:
      incident_id: {type: str, required: true, desc: "Disruption incident to analyze"}
    sql: |
      SELECT a.incident_id, a.assumption_id, a.assumption_text, a.expected_value,
             a.actual_value, a.impact_of_error
      FROM risk_assumptions a
      WHERE a.incident_id = $incident_id
      ORDER BY a.assumption_id
    limit: 50
    example: {incident_id: "DIS-900001"}

  - name: get_prior_week_risk_briefing
    desc: "Last week's risk briefing for comparison and trend tracking."
    kind: sql
    args:
      weeks_back: {type: int, default: 1, desc: "Weeks to look back"}
    sql: |
      SELECT event_id, event_type, severity, affected_suppliers, revenue_at_risk_gbp,
             time_to_impact_days, status
      FROM risk_events
      WHERE first_detected_at >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks_back AS INT) * 7) DAY
        AND first_detected_at < CAST($as_of AS DATE)
      ORDER BY first_detected_at DESC
    limit: 50
    example: {}

  - name: draft_weekly_risk_briefing
    desc: "Draft weekly risk briefing document for leadership. Ready to review and send."
    kind: draft
    args: []
    sql:
      current_events: |
        SELECT event_id, event_type, severity, location, revenue_at_risk_gbp, time_to_impact_days, status
        FROM risk_events WHERE status IN ('emerging', 'active') AND first_detected_at >= CAST($as_of AS DATE) - INTERVAL 7 DAY
        ORDER BY time_to_impact_days ASC LIMIT 10
      top_risks: |
        SELECT risk_id, description, exposure_gbp, rating, mitigation_plan
        FROM risk_register WHERE status IN ('active', 'mitigated') ORDER BY exposure_gbp DESC LIMIT 5
      high_events: |
        SELECT event_id, event_type, location, description, revenue_at_risk_gbp, severity
        FROM risk_events WHERE severity = 'critical' AND status IN ('active', 'monitoring')
    template: |
      WEEKLY RISK BRIEFING

      {% if high_events %}
      CRITICAL EVENTS REQUIRING IMMEDIATE ACTION
      {% for e in high_events %}
      - {{ e.event_type }}: {{ e.description }} ({{ e.location }})
        Revenue at risk: £{{ "{:,.0f}".format(e.revenue_at_risk_gbp) }} | Severity: {{ e.severity }}
      {% endfor %}
      {% else %}
      No critical events this week.
      {% endif %}

      CURRENT RISK EVENTS (Last 7 days)
      {% for e in current_events %}
      - {{ e.event_type }} in {{ e.location }}: {{ e.event_id }}
        Impact in {{ e.time_to_impact_days }} days | Revenue at risk: £{{ "{:,.0f}".format(e.revenue_at_risk_gbp) }} ({{ e.severity }})
      {% endfor %}

      TOP ENTERPRISE RISKS (by exposure)
      {% for r in top_risks %}
      - {{ r.description }} ({{ r.risk_id }})
        Exposure: £{{ "{:,.0f}".format(r.exposure_gbp) }} | Rating: {{ r.rating }}
        Mitigation: {{ r.mitigation_plan }}
      {% endfor %}

      END OF BRIEFING
    example: {}

  - name: get_risk_mitigation_options
    desc: "Retrieve risk mitigation options. For each option, shows cost and residual risk reduction."
    kind: select
    from: risk_mitigation_options
    filters:
      related_risk_id: {}
      effectiveness: {}
    columns: [mitigation_id, option_name, option_description, cost_gbp, residual_risk_pct, implementation_weeks, effectiveness, owner_id]
    order: cost_gbp ASC
    limit: 30
    example: {}

  - name: create_risk_register_entry
    desc: "Add a new risk with owner and exposure to the risk register."
    kind: insert
    table: risk_register
    id_prefix: RSK-
    defaults: {status: active}
    args:
      risk_category: {required: true}
      description: {required: true, type: text}
      likelihood_pct: {required: true, type: int, desc: "Probability 0-100"}
      impact_gbp: {required: true, type: float}
      owner_id: {required: true}
      affected_supplier_id: {type: str}
    example: {risk_category: supply_chain, description: "Supplier concentration in Vietnam", likelihood_pct: 75, impact_gbp: 500000, owner_id: "EMP-0042", affected_supplier_id: "SUP-0001"}

  - name: update_risk_register_entry
    desc: "Update a risk register entry with new information or status."
    kind: update
    table: risk_register
    args:
      likelihood_pct: {type: int, desc: "Updated probability"}
      impact_gbp: {type: float, desc: "Updated impact estimate"}
      rating: {type: enum, values: [low, medium, high, critical]}
      status: {type: enum, values: [active, mitigated, closed]}
      mitigation_plan: {type: text}
      assumptions: {type: text}
    example: {risk_id: "RSK-900001", likelihood_pct: 60, rating: high}

  - name: archive_risk_register_entry
    desc: "Archive a closed risk register entry."
    kind: update
    table: risk_register
    set: {status: archived}
    args:
      archived_at: {}
    example: {risk_id: "RSK-900001"}

  - name: create_risk_alert_rule
    desc: "Create a monitoring alert on a country or supplier risk trigger."
    kind: insert
    table: risk_alert_rules
    id_prefix: ARU-
    defaults: {active: true}
    args:
      rule_name: {required: true}
      trigger_type: {required: true}
      trigger_country: {type: str}
      trigger_supplier_id: {type: str}
      severity_level: {required: true}
      description: {required: true, type: text}
      action_required: {type: text}
    example: {rule_name: "Vietnam supply disruption watch", trigger_type: country_risk, trigger_country: VN, severity_level: warning, description: "Monitor for supply chain disruptions from Vietnam", action_required: "Review alternative sources"}

  - name: create_risk_scenario
    desc: "Save a scenario analysis as a risk scenario record."
    kind: insert
    table: risk_scenarios
    id_prefix: RSC-
    args:
      scenario_name: {required: true}
      description: {required: true, type: text}
      trigger_event: {required: true, type: text}
      likelihood_pct: {required: true, type: int}
      revenue_impact_gbp: {required: true, type: float}
      affected_skus: {type: str}
    example: {scenario_name: "Vietnam port closure 6 weeks", description: "If Saigon port closed for 6 weeks due to typhoon", trigger_event: "Major typhoon in Vietnam", likelihood_pct: 35, revenue_impact_gbp: 750000, affected_skus: "STY-5520,K-1700"}
