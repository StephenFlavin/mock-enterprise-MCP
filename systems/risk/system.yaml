id: risk
name: Risk Management System
instructions: >
  Enterprise risk register, alerts, events, scenarios and analysis. Risk ids like RSK-000123,
  alert rule ids like ARU-000123, scenario ids like RSC-000123, disruption incident ids like DIS-000123,
  event ids like RVT-000123. Exposure = likelihood x impact. Rating is derived from exposure unless set.

tables:
  risk_register:
    key: risk_id
    cols:
      risk_id: {type: str, desc: "Risk register entry, e.g. RSK-900001"}
      risk_category: {type: enum, values: [supply_chain, demand, geopolitical, financial, operational, regulatory, climate, technology, other], desc: "Risk category; cost risks are financial"}
      description: {type: text, desc: "What the risk is"}
      owner_id: {type: str, desc: "Responsible employee, e.g. EMP-00004"}
      likelihood_pct: {type: int, desc: "Probability 0-100%"}
      impact_gbp: {type: float, desc: "Financial impact in GBP if it occurs"}
      rating: {type: enum, values: [low, medium, high, critical], desc: "Rating override; blank means derived from exposure"}
      horizon_months: {type: int, desc: "Months until the risk could materialise"}
      driver: {type: str, desc: "Common underlying driver, shared by correlated risks"}
      affected_sku: {type: str, desc: "SKU if applicable"}
      affected_supplier_id: {type: str, desc: "Supplier if applicable"}
      affected_site_id: {type: str, desc: "DC or site if applicable"}
      related_incident_id: {type: str, desc: "Disruption incident this entry relates to, e.g. DIS-900001"}
      mitigation_plan: {type: text, desc: "How we plan to mitigate"}
      status: {type: enum, values: [active, mitigated, closed, archived], desc: "Risk status"}
      assumptions: {type: text, desc: "Key assumptions made"}
      created_at: {type: timestamp, desc: "When registered"}
      updated_at: {type: timestamp, desc: "Last updated"}
      archived_at: {type: timestamp, desc: "When archived"}

  risk_alert_rules:
    key: rule_id
    cols:
      rule_id: {type: str, desc: "Alert rule, e.g. ARU-000123"}
      rule_name: {type: str, desc: "Name of the monitoring rule"}
      trigger_type: {type: enum, values: [country_risk, supplier_risk, port_risk, weather, regulatory, financial, other], desc: "What triggers this rule"}
      trigger_country: {type: str, desc: "Country code if country-based trigger, e.g. VN (several allowed, comma separated)"}
      trigger_supplier_id: {type: str, desc: "Supplier if supplier-based trigger"}
      severity_level: {type: enum, values: [info, warning, critical], desc: "Alert severity"}
      description: {type: text, desc: "What this rule watches for, including the trigger point"}
      action_required: {type: text, desc: "What to do when triggered"}
      active: {type: bool, desc: "Whether this rule is enabled"}
      created_at: {type: timestamp, desc: "When rule created"}
      last_triggered_at: {type: timestamp, desc: "When last triggered"}

  risk_events:
    key: event_id
    cols:
      event_id: {type: str, desc: "Risk event, e.g. RVT-900001"}
      event_type: {type: enum, values: [geopolitical, weather, port_disruption, supplier_issue, regulatory, financial, cyber, other], desc: "Type of event"}
      location: {type: str, desc: "Geographic location or region"}
      description: {type: text, desc: "Event details"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Event severity"}
      affected_suppliers: {type: str, desc: "Comma-separated supplier ids"}
      affected_ports: {type: str, desc: "Comma-separated port names"}
      affected_lanes: {type: str, desc: "Comma-separated trade lanes affected"}
      time_to_impact_days: {type: int, desc: "Days from now until impact is felt"}
      revenue_at_risk_gbp: {type: float, desc: "Revenue potentially impacted"}
      status: {type: enum, values: [emerging, active, monitoring, resolved], desc: "Event status"}
      first_detected_at: {type: timestamp, desc: "When event first detected"}
      impact_felt_at: {type: timestamp, desc: "When impact started"}

  risk_briefings:
    key: briefing_id
    cols:
      briefing_id: {type: str, desc: "Briefing line, e.g. BRF-900001"}
      week_start: {type: date, desc: "Monday of the week the briefing was issued"}
      event_id: {type: str, desc: "Risk event as briefed"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Severity in that briefing"}
      revenue_at_risk_gbp: {type: float, desc: "Revenue at risk in that briefing"}
      time_to_impact_days: {type: int, desc: "Days to impact as briefed"}
      status: {type: enum, values: [emerging, active, monitoring, resolved], desc: "Event status in that briefing"}

  risk_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Scenario, e.g. RSC-000123"}
      scenario_name: {type: str, desc: "Name of the scenario"}
      description: {type: text, desc: "What-if scenario description"}
      trigger_event: {type: str, desc: "What would trigger this scenario"}
      likelihood_pct: {type: int, desc: "Estimated probability 0-100"}
      revenue_impact_gbp: {type: float, desc: "Revenue impact in worst case"}
      margin_impact_pct: {type: float, desc: "Margin impact in percentage points"}
      affected_skus: {type: str, desc: "Comma-separated SKUs impacted"}
      mitigation_options: {type: text, desc: "Possible mitigations"}
      cost_to_mitigate_gbp: {type: float, desc: "Cost of main mitigation"}
      payback_weeks: {type: int, desc: "Weeks until investment recovers"}
      created_at: {type: timestamp, desc: "When scenario created"}
      created_by_id: {type: str, desc: "Employee id who created it"}

  disruption_incidents:
    key: incident_id
    cols:
      incident_id: {type: str, desc: "Disruption incident, e.g. DIS-900001"}
      incident_name: {type: str, desc: "Name of the disruption"}
      description: {type: text, desc: "What happened"}
      root_cause: {type: text, desc: "Root cause of the disruption"}
      started_at: {type: timestamp, desc: "When the disruption started"}
      ended_at: {type: timestamp, desc: "When it was resolved"}
      duration_days: {type: int, desc: "Duration in days"}
      revenue_impact_gbp: {type: float, desc: "Actual revenue impact"}
      cost_impact_gbp: {type: float, desc: "Actual extra cost"}
      affected_suppliers: {type: str, desc: "Comma-separated supplier ids"}
      affected_skus: {type: str, desc: "Comma-separated affected SKUs"}
      lessons_learned: {type: text, desc: "Lessons and insights"}
      assumptions_wrong: {type: text, desc: "Which risk assumptions were proved wrong"}
      status: {type: enum, values: [in_progress, closed, archived], desc: "Incident status"}

  risk_assumptions:
    key: [incident_id, assumption_id]
    cols:
      incident_id: {type: str, desc: "Related disruption incident"}
      assumption_id: {type: int, desc: "Assumption number in this incident"}
      assumption_text: {type: text, desc: "The assumption that was made"}
      expected_value: {type: str, desc: "What we thought would happen"}
      actual_value: {type: str, desc: "What actually happened"}
      expected_num: {type: float, desc: "Expected value as a number"}
      actual_num: {type: float, desc: "Actual value as a number"}
      unit: {type: str, desc: "Unit of the numbers, e.g. days"}
      impact_of_error: {type: text, desc: "How the error affected outcomes"}
      recorded_at: {type: timestamp, desc: "When recorded"}

  guidance_risks:
    key: guidance_risk_id
    cols:
      guidance_risk_id: {type: str, desc: "Guidance risk entry, e.g. GRK-900001"}
      risk_description: {type: text, desc: "What risk to our guidance"}
      guidance_range_gbp: {type: str, desc: "Guidance range at risk, e.g. 2026-Q4 EBITDA 38.5-44.4m"}
      likelihood_pct: {type: int, desc: "Probability 0-100"}
      impact_gbp: {type: float, desc: "Impact on the guided metric if it occurs"}
      mitigation: {type: text, desc: "How we mitigate"}
      mitigable_this_quarter: {type: bool, desc: "Whether mitigation can land this quarter"}
      trigger_point: {type: text, desc: "What would trigger a guidance update"}
      status: {type: enum, values: [active, mitigated, resolved], desc: "Status"}
      created_at: {type: timestamp, desc: "When identified"}

  single_points_of_failure:
    key: spof_id
    cols:
      spof_id: {type: str, desc: "SPOF entry, e.g. SPF-900001"}
      failure_type: {type: enum, values: [supplier, route, facility, carrier, port, raw_material, customer], desc: "Type of SPOF"}
      description: {type: text, desc: "What is the single point of failure"}
      critical_skus: {type: str, desc: "Comma-separated critical SKUs or styles"}
      affected_supplier_id: {type: str, desc: "Supplier if applicable"}
      affected_site_id: {type: str, desc: "DC or site if applicable"}
      affected_route: {type: str, desc: "Route description if applicable"}
      revenue_dependent_gbp: {type: float, desc: "Annual revenue depending on this"}
      mitigation_options: {type: str, desc: "e.g. dual source, buffer stock, alternate route"}
      option_cost_gbp: {type: float, desc: "Cost of best mitigation"}
      priority: {type: enum, values: [low, medium, high, critical], desc: "Priority to address"}
      status: {type: enum, values: [identified, planning, implemented, mitigated], desc: "Status"}
      created_at: {type: timestamp, desc: "When identified"}

  cutover_risks:
    key: cutover_risk_id
    cols:
      cutover_risk_id: {type: str, desc: "Cutover risk, e.g. CTO-000123"}
      project_name: {type: str, desc: "Related project or go-live"}
      risk_description: {type: text, desc: "The risk during cutover"}
      probability: {type: enum, values: [low, medium, high, certain], desc: "Probability"}
      business_impact: {type: text, desc: "Impact if occurs"}
      impact_severity: {type: enum, values: [low, medium, high, critical], desc: "Severity rating"}
      mitigation_steps: {type: text, desc: "How to mitigate"}
      owner_id: {type: str, desc: "Responsible employee"}
      status: {type: enum, values: [open, mitigated, resolved, archived], desc: "Status"}
      created_at: {type: timestamp, desc: "When created"}

  risk_opportunities:
    key: opportunity_id
    cols:
      opportunity_id: {type: str, desc: "Opportunity, e.g. OPP-900001"}
      opportunity_name: {type: str, desc: "Name of opportunity"}
      description: {type: text, desc: "What is the opportunity"}
      category: {type: enum, values: [cost_saving, revenue_growth, efficiency, risk_reduction, other], desc: "Type of opportunity"}
      potential_benefit_gbp: {type: float, desc: "Estimated annual benefit"}
      probability_pct: {type: int, desc: "Probability of realizing 0-100"}
      expected_value_gbp: {type: float, desc: "Probability * benefit"}
      owner_id: {type: str, desc: "Responsible employee"}
      status: {type: enum, values: [identified, approved, in_progress, realized, cancelled], desc: "Status"}
      created_at: {type: timestamp, desc: "When identified"}

  risk_mitigation_options:
    key: mitigation_id
    cols:
      mitigation_id: {type: str, desc: "Mitigation option, e.g. MIT-900001"}
      related_risk_id: {type: str, desc: "Risk register entry this mitigates, e.g. RSK-900001"}
      option_name: {type: str, desc: "Name of the mitigation"}
      option_description: {type: text, desc: "How it works"}
      cost_gbp: {type: float, desc: "Implementation cost"}
      residual_risk_pct: {type: int, desc: "Percentage of the risk that remains after the mitigation"}
      implementation_weeks: {type: int, desc: "Weeks to implement"}
      effectiveness: {type: enum, values: [low, medium, high, very_high], desc: "Mitigation effectiveness"}
      owner_id: {type: str, desc: "Responsible employee"}

tools:
  - name: get_enterprise_risk_register
    desc: "Principal enterprise risks across all categories with owner, rating, exposure and mitigation, largest exposure first. Defaults to active and mitigated risks."
    kind: sql
    args:
      status: {type: enum, values: [active, mitigated, closed, archived], desc: "Register status; default active and mitigated"}
      rating: {type: enum, values: [low, medium, high, critical], desc: "Filter by rating (critical >= 750k exposure, high >= 300k, medium >= 120k)"}
      risk_category: {type: enum, values: [supply_chain, demand, geopolitical, financial, operational, regulatory, climate, technology, other], desc: "Filter by category"}
    sql: |
      WITH r AS (
        SELECT risk_id, risk_category, description, owner_id, likelihood_pct, impact_gbp, horizon_months,
               affected_sku, affected_supplier_id, affected_site_id, mitigation_plan, status,
               round(likelihood_pct * impact_gbp / 100.0) AS exposure_gbp,
               COALESCE(rating, CASE WHEN likelihood_pct * impact_gbp / 100.0 >= 750000 THEN 'critical'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 300000 THEN 'high'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 120000 THEN 'medium'
                                     ELSE 'low' END) AS rating
        FROM risk_register)
      SELECT r.risk_id, r.risk_category, r.description, r.owner_id, e.role AS owner_role, r.likelihood_pct, r.impact_gbp,
             r.exposure_gbp, r.rating, r.mitigation_plan, r.status
      FROM r LEFT JOIN master.employees e ON e.employee_id = r.owner_id
      WHERE (($status IS NULL AND r.status IN ('active', 'mitigated')) OR r.status = $status)
        AND ($rating IS NULL OR r.rating = $rating)
        AND ($risk_category IS NULL OR r.risk_category = $risk_category)
      ORDER BY r.exposure_gbp DESC
    limit: 20
    example: {rating: high}

  - name: get_risk_register_entries
    desc: "Risk register entries with assumptions, owner, horizon and history, largest exposure first. Filter by category, supplier, site, disruption incident or time horizon."
    kind: sql
    args:
      risk_category: {type: enum, values: [supply_chain, demand, geopolitical, financial, operational, regulatory, climate, technology, other], desc: "Filter by category"}
      supplier_id: {}
      site_id: {}
      incident_id: {desc: "Only entries linked to this disruption incident, e.g. DIS-900001"}
      status: {type: enum, values: [active, mitigated, closed, archived], desc: "Register status; default active and mitigated"}
      max_horizon_months: {type: int, desc: "Only risks that could materialise within this many months, e.g. 36 for three years"}
    sql: |
      WITH r AS (
        SELECT risk_id, risk_category, description, owner_id, likelihood_pct, impact_gbp, horizon_months, driver,
               affected_sku, affected_supplier_id, affected_site_id, related_incident_id, mitigation_plan, status,
               assumptions, created_at, updated_at,
               round(likelihood_pct * impact_gbp / 100.0) AS exposure_gbp,
               COALESCE(rating, CASE WHEN likelihood_pct * impact_gbp / 100.0 >= 750000 THEN 'critical'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 300000 THEN 'high'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 120000 THEN 'medium'
                                     ELSE 'low' END) AS rating
        FROM risk_register)
      SELECT risk_id, risk_category, description, owner_id, likelihood_pct, impact_gbp, exposure_gbp, rating,
             horizon_months, affected_supplier_id, affected_site_id, related_incident_id, mitigation_plan,
             assumptions, status, created_at, updated_at
      FROM r
      WHERE ($risk_category IS NULL OR risk_category = $risk_category)
        AND ($supplier_id IS NULL OR affected_supplier_id = $supplier_id)
        AND ($site_id IS NULL OR affected_site_id = $site_id)
        AND ($incident_id IS NULL OR related_incident_id = $incident_id)
        AND (($status IS NULL AND status IN ('active', 'mitigated')) OR status = $status)
        AND ($max_horizon_months IS NULL OR horizon_months <= CAST($max_horizon_months AS INT))
      ORDER BY exposure_gbp DESC
    limit: 30
    example: {risk_category: geopolitical}

  - name: get_supply_risk_summary
    desc: "Top supply chain risks with ratings, exposure and current mitigations, largest exposure first. Quick view of supply exposure."
    kind: sql
    args:
      limit_results: {type: int, default: 10, desc: "Number of top risks to show"}
    sql: |
      WITH r AS (
        SELECT risk_id, description, affected_supplier_id, affected_sku, likelihood_pct, mitigation_plan, status, risk_category,
               round(likelihood_pct * impact_gbp / 100.0) AS exposure_gbp,
               COALESCE(rating, CASE WHEN likelihood_pct * impact_gbp / 100.0 >= 750000 THEN 'critical'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 300000 THEN 'high'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 120000 THEN 'medium'
                                     ELSE 'low' END) AS rating
        FROM risk_register)
      SELECT risk_id, description, affected_supplier_id, affected_sku, likelihood_pct,
             exposure_gbp, rating, mitigation_plan, status
      FROM r
      WHERE risk_category = 'supply_chain' AND status IN ('active', 'mitigated')
      ORDER BY exposure_gbp DESC
      LIMIT CAST($limit_results AS INT)
    limit: 20
    example: {}

  - name: list_supply_chain_risks
    desc: "List active register risks across supply, demand and cost, largest exposure first. Filter by category, supplier, SKU, rating or time horizon."
    kind: sql
    args:
      risk_category: {type: enum, values: [supply_chain, demand, geopolitical, financial, operational, regulatory, climate, technology, other], desc: "Category; leave empty for all. Cost risks are financial"}
      affected_supplier_id: {type: str, desc: "Supplier id the risk affects, e.g. SUP-0069"}
      affected_sku: {type: str, desc: "SKU the risk affects, e.g. K-1700"}
      rating: {type: enum, values: [low, medium, high, critical], desc: "Filter by rating"}
      max_horizon_months: {type: int, desc: "Only risks that could materialise within this many months, e.g. 6"}
    sql: |
      WITH r AS (
        SELECT risk_id, risk_category, description, affected_supplier_id, affected_sku, likelihood_pct, impact_gbp,
               horizon_months, status,
               round(likelihood_pct * impact_gbp / 100.0) AS exposure_gbp,
               COALESCE(rating, CASE WHEN likelihood_pct * impact_gbp / 100.0 >= 750000 THEN 'critical'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 300000 THEN 'high'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 120000 THEN 'medium'
                                     ELSE 'low' END) AS rating
        FROM risk_register)
      SELECT risk_id, risk_category, description, affected_supplier_id, affected_sku, likelihood_pct, impact_gbp,
             exposure_gbp, rating, horizon_months, status
      FROM r
      WHERE status = 'active'
        AND ($risk_category IS NULL OR risk_category = $risk_category)
        AND ($affected_supplier_id IS NULL OR affected_supplier_id = $affected_supplier_id)
        AND ($affected_sku IS NULL OR affected_sku = $affected_sku)
        AND ($rating IS NULL OR rating = $rating)
        AND ($max_horizon_months IS NULL OR horizon_months <= CAST($max_horizon_months AS INT))
      ORDER BY exposure_gbp DESC
    limit: 20
    example: {max_horizon_months: 6}

  - name: list_single_points_of_failure
    desc: "Single-source supplier, route, port and facility dependencies with annual revenue at risk, mitigation option and its cost, biggest first. Excludes mitigated ones by default."
    kind: sql
    args:
      failure_type: {type: enum, values: [supplier, route, facility, carrier, port, raw_material, customer], desc: "Type of single point of failure"}
      priority: {type: enum, values: [low, medium, high, critical], desc: "Priority to address"}
      status: {type: enum, values: [identified, planning, implemented, mitigated], desc: "Status; default excludes mitigated"}
      min_revenue_gbp: {type: float, desc: "Only dependencies with at least this annual revenue"}
    sql: |
      SELECT spof_id, failure_type, description, critical_skus, affected_supplier_id, affected_site_id, affected_route,
             revenue_dependent_gbp, mitigation_options, option_cost_gbp, priority, status
      FROM single_points_of_failure
      WHERE (($status IS NULL AND status <> 'mitigated') OR status = $status)
        AND ($failure_type IS NULL OR failure_type = $failure_type)
        AND ($priority IS NULL OR priority = $priority)
        AND ($min_revenue_gbp IS NULL OR revenue_dependent_gbp >= CAST($min_revenue_gbp AS DOUBLE))
      ORDER BY revenue_dependent_gbp DESC
    limit: 30
    example: {}

  - name: get_guidance_risk_register
    desc: "Risks to revenue and EBITDA guidance with likelihood, impact, expected impact, mitigation, whether mitigable this quarter and the guidance-update trigger."
    kind: sql
    args:
      status: {type: enum, values: [active, mitigated, resolved], desc: "Status; default excludes resolved"}
      mitigable_this_quarter: {type: bool, desc: "True for risks we can mitigate this quarter"}
    sql: |
      SELECT guidance_risk_id, risk_description, guidance_range_gbp, likelihood_pct, impact_gbp,
             round(likelihood_pct * impact_gbp / 100.0) AS expected_impact_gbp,
             mitigation, mitigable_this_quarter, trigger_point, status
      FROM guidance_risks
      WHERE (($status IS NULL AND status <> 'resolved') OR status = $status)
        AND ($mitigable_this_quarter IS NULL OR mitigable_this_quarter = CAST($mitigable_this_quarter AS BOOLEAN))
      ORDER BY expected_impact_gbp DESC
    limit: 20
    example: {status: active}

  - name: list_cutover_risks
    desc: "Cutover and go-live risks with ratings, most severe first. For project delivery assurance."
    kind: select
    from: cutover_risks
    filters:
      project_name: {op: like}
      status: {type: enum, values: [open, mitigated, resolved, archived]}
      impact_severity: {}
    columns: [cutover_risk_id, project_name, risk_description, probability, business_impact, impact_severity, mitigation_steps, owner_id, status]
    order: "CASE impact_severity WHEN 'critical' THEN 1 WHEN 'high' THEN 2 WHEN 'medium' THEN 3 ELSE 4 END, cutover_risk_id"
    limit: 30
    example: {}

  - name: list_key_risks_and_opportunities
    desc: "Key risks and opportunities side by side: top N of each by value (risk exposure, opportunity expected value) with probability, owner and status."
    kind: sql
    args:
      limit_results: {type: int, default: 5, desc: "Number of items to return for each of risks and opportunities"}
      item_type: {type: enum, values: [risk, opportunity], desc: "Only risks or only opportunities"}
    sql: |
      WITH items AS (
        SELECT risk_id AS item_id, 'risk' AS item_type, risk_category AS category, description,
               round(likelihood_pct * impact_gbp / 100.0) AS value_gbp, likelihood_pct AS probability_pct,
               COALESCE(rating, CASE WHEN likelihood_pct * impact_gbp / 100.0 >= 750000 THEN 'critical'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 300000 THEN 'high'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 120000 THEN 'medium'
                                     ELSE 'low' END) AS rating,
               owner_id, status
        FROM risk_register WHERE status IN ('active', 'mitigated')
        UNION ALL
        SELECT opportunity_id, 'opportunity', category, opportunity_name || ' - ' || description,
               expected_value_gbp, probability_pct, NULL, owner_id, status
        FROM risk_opportunities WHERE status IN ('identified', 'approved', 'in_progress')
      ), ranked AS (
        SELECT *, row_number() OVER (PARTITION BY item_type ORDER BY value_gbp DESC) AS rank_in_type FROM items
      )
      SELECT item_id, item_type, category, description, value_gbp, probability_pct, rating, owner_id, status, rank_in_type
      FROM ranked
      WHERE rank_in_type <= CAST($limit_results AS INT)
        AND ($item_type IS NULL OR item_type = $item_type)
      ORDER BY item_type DESC, value_gbp DESC
    limit: 40
    example: {}

  - name: list_disruption_scenarios
    desc: "Defined disruption scenarios with likelihood, revenue and margin impact, mitigation cost and payback. Use for contingency planning."
    kind: select
    from: risk_scenarios
    filters:
      scenario_name: {op: like}
    columns: [scenario_id, scenario_name, description, likelihood_pct, revenue_impact_gbp, margin_impact_pct, affected_skus, mitigation_options, cost_to_mitigate_gbp, payback_weeks]
    order: likelihood_pct DESC
    limit: 20
    example: {}

  - name: get_risk_events_feed
    desc: "Current monitored risk events with severity, affected suppliers, ports and lanes, days to impact and revenue at risk, most severe first. Excludes resolved events."
    kind: sql
    args:
      status: {type: enum, values: [emerging, active, monitoring, resolved], desc: "Event status; default is every unresolved event"}
      min_severity: {type: enum, values: [low, medium, high, critical], desc: "Only events at or above this severity"}
      location: {type: str, desc: "Part of the location, e.g. Vietnam"}
      days_back: {type: int, default: 30, desc: "Events first detected in the last N days"}
    sql: |
      SELECT event_id, event_type, location, description, severity, affected_suppliers, affected_ports,
             affected_lanes, time_to_impact_days, revenue_at_risk_gbp, status, first_detected_at, impact_felt_at
      FROM risk_events
      WHERE (($status IS NULL AND status <> 'resolved') OR status = $status)
        AND first_detected_at >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
        AND ($location IS NULL OR location ILIKE '%' || $location || '%')
        AND ($min_severity IS NULL
             OR (CASE severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END)
                >= (CASE $min_severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END))
      ORDER BY (CASE severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END) DESC,
               time_to_impact_days ASC
    limit: 30
    example: {min_severity: high}

  - name: get_country_risk_alerts
    desc: "Active risk alerts triggered recently by sourcing country or region (e.g. Asia): export restrictions, power shortages, unrest, severity and required action."
    kind: sql
    args:
      country: {type: str, desc: "Country code or name, e.g. BD or Bangladesh"}
      region: {type: str, desc: "Region, e.g. Asia or Europe"}
      severity_level: {type: enum, values: [info, warning, critical], desc: "Alert severity"}
      days_back: {type: int, default: 45, desc: "Alerts triggered in the last N days"}
    sql: |
      WITH cm(code, country_name, region) AS (
        VALUES ('CN', 'China', 'Asia'), ('VN', 'Vietnam', 'Asia'), ('BD', 'Bangladesh', 'Asia'), ('IN', 'India', 'Asia'),
               ('TR', 'Turkey', 'Europe'), ('PT', 'Portugal', 'Europe'), ('IT', 'Italy', 'Europe'), ('PL', 'Poland', 'Europe'),
               ('FR', 'France', 'Europe'), ('DE', 'Germany', 'Europe'), ('GB', 'United Kingdom', 'Europe'), ('MX', 'Mexico', 'Americas'))
      SELECT a.rule_id, a.rule_name, a.trigger_country, cm.country_name, cm.region, a.trigger_type, a.severity_level,
             a.description, a.action_required, a.last_triggered_at
      FROM risk_alert_rules a
      JOIN cm ON list_contains(string_split(replace(a.trigger_country, ' ', ''), ','), cm.code)
      WHERE a.trigger_type IN ('country_risk', 'weather', 'regulatory')
        AND a.active = true
        AND a.last_triggered_at IS NOT NULL
        AND a.last_triggered_at >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
        AND ($country IS NULL OR upper($country) = cm.code OR lower($country) = lower(cm.country_name))
        AND ($region IS NULL OR lower($region) = lower(cm.region))
        AND ($severity_level IS NULL OR a.severity_level = $severity_level)
      ORDER BY (CASE a.severity_level WHEN 'critical' THEN 3 WHEN 'warning' THEN 2 ELSE 1 END) DESC, a.last_triggered_at DESC
    limit: 30
    example: {region: Asia}

  - name: calculate_risk_financial_exposure
    desc: "Calculate financial exposure (likelihood x impact) for each active risk with category and overall totals. Filter by category, risk id or time horizon."
    kind: sql
    args:
      risk_category: {type: enum, values: [supply_chain, demand, geopolitical, financial, operational, regulatory, climate, technology, other], desc: "Only this category"}
      risk_id: {type: str, desc: "Only this risk, e.g. RSK-900001"}
      max_horizon_months: {type: int, desc: "Only risks that could materialise within this many months, e.g. 6"}
    sql: |
      WITH r AS (
        SELECT risk_id, risk_category, description, likelihood_pct, impact_gbp, horizon_months,
               round(likelihood_pct * impact_gbp / 100.0) AS exposure_gbp,
               COALESCE(rating, CASE WHEN likelihood_pct * impact_gbp / 100.0 >= 750000 THEN 'critical'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 300000 THEN 'high'
                                     WHEN likelihood_pct * impact_gbp / 100.0 >= 120000 THEN 'medium'
                                     ELSE 'low' END) AS rating
        FROM risk_register
        WHERE status = 'active'
          AND ($risk_category IS NULL OR risk_category = $risk_category)
          AND ($risk_id IS NULL OR risk_id = $risk_id)
          AND ($max_horizon_months IS NULL OR horizon_months <= CAST($max_horizon_months AS INT)))
      SELECT risk_id, risk_category, description, likelihood_pct, impact_gbp, exposure_gbp, rating, horizon_months,
             sum(exposure_gbp) OVER (PARTITION BY risk_category) AS category_exposure_gbp,
             sum(exposure_gbp) OVER () AS total_exposure_gbp,
             'exposure = likelihood_pct / 100 * impact_gbp' AS formula
      FROM r
      ORDER BY exposure_gbp DESC
    limit: 30
    example: {max_horizon_months: 6}

  - name: calculate_risk_correlation
    desc: "Calculate which other active risks are correlated with a risk (shared driver, supplier, SKU or site). Give a second risk id to compare two risks."
    kind: sql
    args:
      risk_id_1: {type: str, required: true, desc: "First risk id, e.g. RSK-900002"}
      risk_id_2: {type: str, desc: "Second risk id to compare against; omit to scan all other active risks"}
    sql: |
      WITH r AS (
        SELECT risk_id, description, driver, affected_sku, affected_supplier_id, affected_site_id,
               round(likelihood_pct * impact_gbp / 100.0) AS exposure_gbp
        FROM risk_register WHERE status IN ('active', 'mitigated')),
      pairs AS (
        SELECT a.risk_id AS risk_1, b.risk_id AS risk_2, b.description AS risk_2_description, b.exposure_gbp AS risk_2_exposure_gbp,
               COALESCE(a.driver = b.driver, false) AS same_driver,
               COALESCE(a.affected_supplier_id = b.affected_supplier_id, false) AS same_supplier,
               COALESCE(a.affected_sku = b.affected_sku, false) AS same_sku,
               COALESCE(a.affected_site_id = b.affected_site_id, false) AS same_site,
               a.driver AS driver_1
        FROM r a JOIN r b ON a.risk_id <> b.risk_id
        WHERE a.risk_id = $risk_id_1 AND ($risk_id_2 IS NULL OR b.risk_id = $risk_id_2))
      SELECT risk_1, risk_2, risk_2_description, risk_2_exposure_gbp,
             CASE WHEN same_driver THEN driver_1 ELSE '' END AS shared_driver,
             CASE WHEN same_supplier THEN 'same supplier' ELSE '' END AS shared_supplier,
             CASE WHEN same_sku THEN 'same SKU' ELSE '' END AS shared_sku,
             CASE WHEN same_site THEN 'same site' ELSE '' END AS shared_site,
             round(0.5 * CAST(same_driver AS INT) + 0.2 * CAST(same_supplier AS INT) + 0.2 * CAST(same_sku AS INT)
                   + 0.1 * CAST(same_site AS INT), 2) AS correlation_score,
             'score = 0.5 shared driver + 0.2 shared supplier + 0.2 shared SKU + 0.1 shared site' AS formula
      FROM pairs
      WHERE $risk_id_2 IS NOT NULL OR (same_driver OR same_supplier OR same_sku OR same_site)
      ORDER BY correlation_score DESC, risk_2_exposure_gbp DESC
    limit: 20
    example: {risk_id_1: "RSK-900002"}

  - name: calculate_time_to_impact
    desc: "Estimate how soon risk events hit supply or sales: days to impact, impact date, revenue at risk, urgency. Give an event id, or omit it to rank open events."
    kind: sql
    args:
      event_id: {type: str, desc: "Risk event id, e.g. RVT-900001; omit to rank every open event"}
    sql: |
      SELECT event_id, event_type, location, severity, affected_suppliers, affected_ports, affected_lanes,
             time_to_impact_days,
             CAST($as_of AS DATE) + CAST(time_to_impact_days AS INT) AS expected_impact_date,
             impact_felt_at IS NOT NULL AS impact_already_felt,
             revenue_at_risk_gbp,
             CASE WHEN time_to_impact_days <= 7 THEN 'immediate'
                  WHEN time_to_impact_days <= 30 THEN 'urgent'
                  ELSE 'planned' END AS urgency,
             'expected_impact_date = today + time_to_impact_days; immediate <= 7 days, urgent <= 30 days' AS formula
      FROM risk_events
      WHERE ($event_id IS NULL AND status IN ('emerging', 'active', 'monitoring')) OR event_id = $event_id
      ORDER BY time_to_impact_days ASC, revenue_at_risk_gbp DESC
    limit: 30
    example: {event_id: "RVT-900001"}

  - name: get_disruption_incident_timeline
    desc: "Timeline of past disruptions with start, end, duration, actual revenue and cost impact, root cause, lessons and linked register entries. Defaults to the last 60 days."
    kind: sql
    args:
      incident_id: {desc: "One incident, e.g. DIS-900001; omit to list recent incidents"}
      date_from: {type: date, default: "-60d", desc: "Incidents that ended on or after this date"}
    sql: |
      SELECT d.incident_id, d.incident_name, d.description, d.root_cause, d.started_at, d.ended_at,
             d.duration_days, d.revenue_impact_gbp, d.cost_impact_gbp,
             d.revenue_impact_gbp + d.cost_impact_gbp AS total_impact_gbp,
             d.affected_suppliers, d.affected_skus, d.lessons_learned, d.assumptions_wrong, d.status,
             (SELECT string_agg(r.risk_id, ', ' ORDER BY r.risk_id) FROM risk_register r
              WHERE r.related_incident_id = d.incident_id) AS linked_risk_ids
      FROM disruption_incidents d
      WHERE ($incident_id IS NULL OR d.incident_id = $incident_id)
        AND ($incident_id IS NOT NULL OR CAST(d.ended_at AS DATE) >= CAST($date_from AS DATE))
      ORDER BY d.started_at DESC
    limit: 10
    example: {}

  - name: compare_risk_assumptions_to_actuals
    desc: "Compare the risk assumptions made for a disruption with what actually happened, with variance and impact of each error. Defaults to the latest incident."
    kind: sql
    args:
      incident_id: {desc: "Disruption incident, e.g. DIS-900001; defaults to the most recent incident"}
    sql: |
      SELECT a.incident_id, i.incident_name, a.assumption_id, a.assumption_text, a.expected_value, a.actual_value,
             a.unit,
             round((a.actual_num - a.expected_num) / NULLIF(a.expected_num, 0) * 100, 0) AS variance_pct,
             a.impact_of_error,
             'variance_pct = (actual - expected) / expected * 100' AS formula
      FROM risk_assumptions a JOIN disruption_incidents i USING (incident_id)
      WHERE a.incident_id = COALESCE($incident_id, (SELECT incident_id FROM disruption_incidents ORDER BY started_at DESC LIMIT 1))
      ORDER BY a.assumption_id
    limit: 50
    example: {incident_id: "DIS-900001"}

  - name: get_prior_week_risk_briefing
    desc: "Last week's risk briefing compared with now: for each briefed or new event the severity and revenue at risk then and now, and what changed."
    kind: sql
    args:
      weeks_back: {type: int, default: 1, desc: "Weeks to look back"}
    sql: |
      WITH wk AS (
        SELECT CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE) - 7 * CAST($weeks_back AS INT) AS week_start),
      prev AS (
        SELECT b.* FROM risk_briefings b, wk WHERE CAST(b.week_start AS DATE) = wk.week_start),
      ids AS (
        SELECT event_id FROM prev
        UNION
        SELECT event_id FROM risk_events
        WHERE status IN ('emerging', 'active', 'monitoring') AND severity IN ('medium', 'high', 'critical')
          AND CAST(first_detected_at AS DATE) >= (SELECT week_start FROM wk))
      SELECT i.event_id, e.event_type, e.location,
             p.severity AS severity_last_week, e.severity AS severity_now,
             p.revenue_at_risk_gbp AS revenue_last_week_gbp, e.revenue_at_risk_gbp AS revenue_now_gbp,
             p.time_to_impact_days AS days_to_impact_last_week, e.time_to_impact_days AS days_to_impact_now,
             p.status AS status_last_week, e.status AS status_now,
             CASE WHEN p.event_id IS NULL THEN 'new this week'
                  WHEN e.status = 'resolved' THEN 'resolved'
                  WHEN (CASE e.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END)
                       > (CASE p.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END) THEN 'escalated'
                  WHEN (CASE e.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END)
                       < (CASE p.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END) THEN 'eased'
                  WHEN e.revenue_at_risk_gbp <> p.revenue_at_risk_gbp THEN 'revenue at risk changed'
                  ELSE 'unchanged' END AS change
      FROM ids i JOIN risk_events e USING (event_id) LEFT JOIN prev p USING (event_id)
      ORDER BY (CASE WHEN p.event_id IS NULL THEN 1 WHEN e.status = 'resolved' THEN 5 ELSE 2 END),
               (CASE e.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END) DESC,
               e.time_to_impact_days
    limit: 30
    example: {}

  - name: draft_weekly_risk_briefing
    desc: "Draft the weekly risk briefing for leadership: open events by urgency with suppliers, ports and lanes, what changed since last week, and top register risks."
    kind: draft
    args: []
    sql:
      events: |
        SELECT event_id, event_type, location, severity, affected_suppliers, affected_ports, affected_lanes,
               revenue_at_risk_gbp, time_to_impact_days, status
        FROM risk_events
        WHERE status IN ('emerging', 'active', 'monitoring') AND severity IN ('medium', 'high', 'critical')
        ORDER BY time_to_impact_days ASC, revenue_at_risk_gbp DESC LIMIT 10
      changes: |
        WITH wk AS (SELECT CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE) - 7 AS week_start)
        SELECT e.event_id, e.location, p.severity AS severity_then, e.severity AS severity_now,
               p.revenue_at_risk_gbp AS revenue_then, e.revenue_at_risk_gbp AS revenue_now,
               CASE WHEN p.event_id IS NULL THEN 'new this week'
                    WHEN (CASE e.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END)
                         > (CASE p.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END) THEN 'escalated'
                    WHEN (CASE e.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END)
                         < (CASE p.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END) THEN 'eased'
                    WHEN e.revenue_at_risk_gbp <> p.revenue_at_risk_gbp THEN 'revenue at risk changed'
                    ELSE 'unchanged' END AS change
        FROM risk_events e
        LEFT JOIN (SELECT b.* FROM risk_briefings b, wk WHERE CAST(b.week_start AS DATE) = wk.week_start) p USING (event_id)
        WHERE e.status IN ('emerging', 'active', 'monitoring') AND e.severity IN ('medium', 'high', 'critical')
        ORDER BY e.time_to_impact_days
      top_risks: |
        SELECT risk_id, description, round(likelihood_pct * impact_gbp / 100.0) AS exposure_gbp, mitigation_plan
        FROM risk_register WHERE status IN ('active', 'mitigated')
        ORDER BY exposure_gbp DESC LIMIT 5
    template: |
      WEEKLY RISK BRIEFING

      OPEN RISK EVENTS (soonest impact first)
      {% for e in events %}
      - {{ e.event_id }} {{ e.event_type }} in {{ e.location }} [{{ e.severity }}, {{ e.status }}]
        Impact in {{ e.time_to_impact_days }} days | Revenue at risk: £{{ "{:,.0f}".format(e.revenue_at_risk_gbp or 0) }}
        Suppliers: {{ e.affected_suppliers or "none named" }} | Ports: {{ e.affected_ports or "none" }} | Lanes: {{ e.affected_lanes or "none" }}
      {% endfor %}

      WHAT CHANGED SINCE LAST WEEK
      {% for c in changes %}
      - {{ c.event_id }} ({{ c.location }}): {{ c.change }}{% if c.severity_then and c.severity_then != c.severity_now %} (severity {{ c.severity_then }} to {{ c.severity_now }}){% endif %}{% if c.revenue_then and c.revenue_then != c.revenue_now %} (revenue at risk £{{ "{:,.0f}".format(c.revenue_then) }} to £{{ "{:,.0f}".format(c.revenue_now) }}){% endif %}{{ "" }}
      {% endfor %}

      TOP REGISTER RISKS (by exposure)
      {% for r in top_risks %}
      - {{ r.risk_id }} {{ r.description }}
        Exposure: £{{ "{:,.0f}".format(r.exposure_gbp or 0) }} | Mitigation: {{ r.mitigation_plan }}
      {% endfor %}

      END OF BRIEFING
    example: {}

  - name: get_risk_mitigation_options
    desc: "Mitigation options for a risk with cost, share of risk remaining, weeks to implement, effectiveness and residual exposure. Filter by risk id or maximum weeks."
    kind: sql
    args:
      related_risk_id: {type: str, desc: "Risk register entry to mitigate, e.g. RSK-900001"}
      effectiveness: {type: enum, values: [low, medium, high, very_high], desc: "Mitigation effectiveness"}
      max_weeks: {type: int, desc: "Only options that can be implemented within this many weeks"}
    sql: |
      SELECT m.mitigation_id, m.related_risk_id, r.description AS risk_description,
             round(r.likelihood_pct * r.impact_gbp / 100.0) AS risk_exposure_gbp,
             m.option_name, m.option_description, m.cost_gbp, m.residual_risk_pct,
             round(r.likelihood_pct * r.impact_gbp / 100.0 * m.residual_risk_pct / 100.0) AS residual_exposure_gbp,
             m.implementation_weeks, m.effectiveness, m.owner_id
      FROM risk_mitigation_options m LEFT JOIN risk_register r ON r.risk_id = m.related_risk_id
      WHERE ($related_risk_id IS NULL OR m.related_risk_id = $related_risk_id)
        AND ($effectiveness IS NULL OR m.effectiveness = $effectiveness)
        AND ($max_weeks IS NULL OR m.implementation_weeks <= CAST($max_weeks AS INT))
      ORDER BY risk_exposure_gbp DESC NULLS LAST, m.related_risk_id, m.cost_gbp
    limit: 30
    example: {max_weeks: 6}

  - name: create_risk_register_entry
    desc: "Add a new risk with owner, likelihood, impact, links and mitigation to the risk register. Exposure and rating are derived."
    kind: insert
    table: risk_register
    id_prefix: RSK-
    defaults: {status: active, horizon_months: 12}
    args:
      risk_category: {required: true}
      description: {required: true, type: text}
      likelihood_pct: {required: true, type: int, desc: "Probability 0-100"}
      impact_gbp: {required: true, type: float}
      owner_id: {required: true, desc: "Responsible employee id, e.g. EMP-00004"}
      affected_supplier_id: {type: str, desc: "Supplier id if applicable, e.g. SUP-0013"}
      affected_site_id: {type: str, desc: "DC or site id if applicable, e.g. DC1"}
      mitigation_plan: {type: text, desc: "Mitigation or action to take, e.g. review buffer stock"}
    example: {risk_category: supply_chain, description: "Supplier concentration in Vietnam", likelihood_pct: 75, impact_gbp: 500000, owner_id: "EMP-00004", affected_supplier_id: "SUP-0069", mitigation_plan: "Qualify an alternate supplier"}

  - name: update_risk_register_entry
    desc: "Update a risk register entry's likelihood, impact, rating, status, mitigation plan or assumptions."
    kind: update
    table: risk_register
    args:
      likelihood_pct: {type: int, desc: "Updated probability"}
      impact_gbp: {type: float, desc: "Updated impact estimate"}
      rating: {type: enum, values: [low, medium, high, critical]}
      status: {type: enum, values: [active, mitigated, closed]}
      mitigation_plan: {type: text}
      assumptions: {type: text}
    example: {risk_id: "RSK-900001", likelihood_pct: 60, rating: high}

  - name: archive_risk_register_entry
    desc: "Archive a closed risk register entry so it drops out of active views. Returns the old and new status."
    kind: update
    table: risk_register
    set: {status: archived, archived_at: "$as_of"}
    args: {}
    example: {risk_id: "RSK-900030"}

  - name: create_risk_alert_rule
    desc: "Create a monitoring alert rule on a country, weather, regulatory or supplier trigger, with severity, trigger point and required action."
    kind: insert
    table: risk_alert_rules
    id_prefix: ARU-
    defaults: {active: true}
    args:
      rule_name: {required: true}
      trigger_type: {required: true}
      trigger_country: {type: str}
      trigger_supplier_id: {type: str}
      severity_level: {required: true}
      description: {required: true, type: text}
      action_required: {type: text}
    example: {rule_name: "Vietnam supply disruption watch", trigger_type: country_risk, trigger_country: VN, severity_level: warning, description: "Monitor for supply chain disruptions from Vietnam", action_required: "Review alternative sources"}

  - name: create_risk_scenario
    desc: "Save a scenario analysis as a risk scenario record with likelihood, revenue and margin impact, affected SKUs, mitigations and mitigation cost."
    kind: insert
    table: risk_scenarios
    id_prefix: RSC-
    defaults: {trigger_event: "{scenario_name}"}
    args:
      scenario_name: {required: true}
      description: {required: true, type: text}
      likelihood_pct: {required: true, type: int}
      revenue_impact_gbp: {required: true, type: float}
      margin_impact_pct: {type: float}
      affected_skus: {type: str}
      mitigation_options: {type: text}
      cost_to_mitigate_gbp: {type: float}
    example: {scenario_name: "Vietnam port closure 6 weeks", description: "If the main southern Vietnam port closed for 6 weeks", likelihood_pct: 15, revenue_impact_gbp: 1060000, margin_impact_pct: 2.4, affected_skus: "SKU-103696,SKU-103682", mitigation_options: "Air freight, alternate port, buffer stock", cost_to_mitigate_gbp: 210000}
