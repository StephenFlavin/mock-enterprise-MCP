  checks:
    - tool: list_supply_chain_risks
      args: {}
      expect: ["RSK-900001", "STY-5520", "Vietnam"]
    - tool: calculate_risk_financial_exposure
      args: {risk_category: supply_chain}
      expect: ["375000", "340000", "exposure"]
