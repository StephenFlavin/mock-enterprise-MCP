id: integration
name: Integration Platform / API Gateway
instructions: >
  Monitors and manages system integrations including EDI, APIs, file transfers and feeds.
  Error codes look like ERR-000123. Use it for interface error logs, EDI mapping, third-party
  connections, feed latency, stock reconciliation and integration pattern costs.

tables:
  interface_errors:
    key: error_id
    cols:
      error_id: {type: str, desc: "Interface error, e.g. ERR-000123"}
      interface_name: {type: str, desc: "Interface name, e.g. ERP_to_WMS"}
      error_code: {type: str, desc: "Error code from the integration"}
      error_message: {type: text, desc: "Error description"}
      occurred_at: {type: timestamp, desc: "When the error occurred"}
      source_system: {type: str, desc: "Originating system, e.g. ERP, WMS"}
      dest_system: {type: str, desc: "Destination system, e.g. WMS, OMS"}
      message_count: {type: int, desc: "Number of messages affected"}
      queue_depth: {type: int, desc: "Number of messages in retry queue"}
      status: {type: enum, values: [active, resolved, acknowledged], desc: "Error status"}
      resolved_at: {type: timestamp, desc: "When error was resolved"}
      updated_at: {type: timestamp, desc: "Last update"}

  edi_messages:
    key: message_id
    cols:
      message_id: {type: str, desc: "EDI message id, e.g. EDI-000123"}
      message_type: {type: str, desc: "EDI type, e.g. ASN, PO_ACK"}
      partner_id: {type: str, desc: "Trading partner"}
      supplier_id: {type: str, desc: "Supplier if inbound"}
      sent_at: {type: timestamp, desc: "When sent/received"}
      status: {type: enum, values: [sent, received, processed, failed, retrying], desc: "Message status"}
      error_details: {type: text, desc: "Reason if failed"}
      line_count: {type: int, desc: "Number of lines/items"}
      processing_time_seconds: {type: float, desc: "Time to process"}
      updated_at: {type: timestamp, desc: "Last update"}

  edi_maps:
    key: map_id
    cols:
      map_id: {type: str, desc: "EDI map, e.g. MAP-000123"}
      message_type: {type: str, desc: "EDI message type, e.g. ASN, PO_ACK"}
      source_system: {type: str, desc: "Source system"}
      dest_system: {type: str, desc: "Destination system"}
      version: {type: str, desc: "Map version, e.g. 1.0, 2.1"}
      active: {type: bool, desc: "Is this map currently active"}
      created_at: {type: timestamp, desc: "When created"}
      updated_at: {type: timestamp, desc: "Last update"}
      change_log: {type: text, desc: "Recent changes"}

  config_changes:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change record, e.g. CFG-000123"}
      change_type: {type: enum, values: [mapping, certificate, endpoint, schedule, other], desc: "Type of change"}
      interface_name: {type: str, desc: "Affected interface"}
      changed_by: {type: str, desc: "Employee id who made the change"}
      changed_at: {type: timestamp, desc: "When the change was made"}
      description: {type: text, desc: "What changed"}
      previous_value: {type: text, desc: "Previous configuration"}
      new_value: {type: text, desc: "New configuration"}
      status: {type: enum, values: [deployed, testing, pending, rolled_back], desc: "Deployment status"}
      updated_at: {type: timestamp, desc: "Last update"}

  third_party_connections:
    key: connection_id
    cols:
      connection_id: {type: str, desc: "Connection record, e.g. CON-000123"}
      partner_name: {type: str, desc: "Partner or supplier name"}
      partner_id: {type: str, desc: "Master partner or supplier id, if any"}
      connection_type: {type: enum, values: [supplier, partner, carrier, 3pl, api_consumer], desc: "Type of connection"}
      protocol: {type: enum, values: [edi, api, sftp, http, webhook, other], desc: "Protocol used"}
      endpoint_url: {type: str, desc: "Connection endpoint or URL"}
      owner_id: {type: str, desc: "Employee owning the connection"}
      authenticated: {type: bool, desc: "Uses authentication"}
      privileged_access: {type: bool, desc: "Has direct system access"}
      active: {type: bool, desc: "Connection is active"}
      established_at: {type: date, desc: "When established"}
      security_risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Security risk"}
      updated_at: {type: timestamp, desc: "Last update"}

  integration_patterns:
    key: pattern_id
    cols:
      pattern_id: {type: str, desc: "Pattern id, e.g. PAT-000123"}
      pattern_name: {type: str, desc: "Pattern name, e.g. EDI, REST API, file transfer"}
      pattern_type: {type: enum, values: [edi, api, file_transfer, webhook, other], desc: "Integration pattern"}
      active_connections: {type: int, desc: "Number of active integrations using this pattern"}
      description: {type: text, desc: "Pattern description"}
      updated_at: {type: timestamp, desc: "Last update"}

  pattern_run_costs:
    key: cost_id
    cols:
      cost_id: {type: str, desc: "Cost record, e.g. COS-000123"}
      pattern_id: {type: str, desc: "Pattern being costed"}
      pattern_name: {type: str, desc: "Pattern name"}
      month: {type: date, desc: "Cost period month-start"}
      setup_cost_gbp: {type: float, desc: "Setup and configuration cost"}
      run_cost_gbp: {type: float, desc: "Monthly run cost per connection"}
      support_cost_gbp: {type: float, desc: "Monthly support cost"}
      total_cost_gbp: {type: float, desc: "Total monthly cost"}
      updated_at: {type: timestamp, desc: "Last update"}

  feed_runs:
    key: run_id
    cols:
      run_id: {type: str, desc: "Feed run, e.g. RUN-000123"}
      feed_name: {type: str, desc: "Feed name, e.g. stock_feed"}
      source_system: {type: str, desc: "Source system"}
      dest_system: {type: str, desc: "Destination system"}
      scheduled_time: {type: timestamp, desc: "Scheduled run time"}
      started_at: {type: timestamp, desc: "Actual start time"}
      completed_at: {type: timestamp, desc: "Completion time"}
      status: {type: enum, values: [scheduled, running, completed, failed], desc: "Run status"}
      records_processed: {type: int, desc: "Records in this run"}
      duration_seconds: {type: float, desc: "Duration in seconds"}
      updated_at: {type: timestamp, desc: "Last update"}

  stock_reconciliation:
    key: recon_id
    cols:
      recon_id: {type: str, desc: "Reconciliation record, e.g. REC-000123"}
      sku: {type: str, desc: "SKU being reconciled"}
      site_id: {type: str, desc: "DC"}
      erp_balance: {type: int, desc: "Balance in ERP"}
      wms_balance: {type: int, desc: "Balance in WMS"}
      difference: {type: int, desc: "WMS - ERP"}
      difference_pct: {type: float, desc: "Difference as %"}
      created_at: {type: timestamp, desc: "When created"}
      status: {type: enum, values: [new, investigating, resolved, manual_adj], desc: "Status"}
      updated_at: {type: timestamp, desc: "Last update"}

  stock_feed_schedule:
    key: schedule_id
    cols:
      schedule_id: {type: str, desc: "Schedule record, e.g. SCH-000123"}
      feed_name: {type: str, desc: "Feed name"}
      run_frequency: {type: str, desc: "Frequency, e.g. hourly, 4-hourly, daily"}
      run_time_utc: {type: str, desc: "Run time in UTC"}
      batch_size: {type: int, desc: "Batch size in records"}
      enabled: {type: bool, desc: "Schedule is enabled"}
      created_at: {type: timestamp, desc: "When created"}
      updated_at: {type: timestamp, desc: "Last update"}

  asn_feed_metrics:
    key: metric_id
    cols:
      metric_id: {type: str, desc: "Metric record, e.g. MET-000123"}
      measured_at: {type: timestamp, desc: "When measured"}
      asn_messages_received: {type: int, desc: "Number of ASN messages"}
      asn_lines_received: {type: int, desc: "Number of ASN lines"}
      lines_with_pallet_data: {type: int, desc: "Lines with pallet-level data"}
      message_completeness_pct: {type: float, desc: "Completeness percentage"}
      feed_status: {type: str, desc: "Feed status"}
      changes: {type: text, desc: "Recent changes to feed"}
      updated_at: {type: timestamp, desc: "Last update"}

tools:
  - name: list_interface_errors
    desc: Interface messages, failures and queue backlogs between systems. Filter by interface and status.
    kind: sql
    args:
      interface_name: {desc: "Interface name, e.g. ERP_to_WMS (default all)"}
      status: {desc: "Filter by status: active, resolved, acknowledged (default all)"}
      date_from: {type: date, default: "-30d", desc: "Errors on or after"}
    sql: |
      SELECT error_id, interface_name, error_code, error_message, occurred_at,
             source_system, dest_system, message_count, queue_depth, status, resolved_at
      FROM interface_errors
      WHERE ($interface_name IS NULL OR interface_name = $interface_name)
        AND ($status IS NULL OR status = $status)
        AND occurred_at >= CAST($date_from AS DATE)
      ORDER BY occurred_at DESC
    limit: 50
    example: {interface_name: ERP_to_WMS}

  - name: get_edi_error_log_summary
    desc: Aggregated EDI error log by cause, map and partner. Returns error frequency and impact.
    kind: sql
    args:
      message_type: {desc: "EDI message type, e.g. ASN, PO_ACK (default all)"}
      days: {type: int, default: 30, desc: "Last N days"}
    sql: |
      SELECT message_type,
             COUNT(*) AS failure_count,
             SUM(line_count) AS lines_affected,
             STRING_AGG(DISTINCT error_details, '; ') AS error_causes,
             COUNT(DISTINCT partner_id) AS partners_affected,
             ROUND(AVG(processing_time_seconds), 2) AS avg_processing_seconds
      FROM edi_messages
      WHERE status = 'failed'
        AND ($message_type IS NULL OR message_type = $message_type)
        AND sent_at >= CAST($as_of AS DATE) - INTERVAL CAST($days AS INT) DAY
      GROUP BY message_type
      ORDER BY failure_count DESC
    limit: 20
    example: {}

  - name: get_edi_map_for_message_type
    desc: Current mapping for an EDI message type, with version and recent changes. Use to understand structure.
    kind: sql
    args:
      message_type: {required: true, desc: "EDI message type, e.g. ASN, PO_ACK"}
    sql: |
      SELECT map_id, message_type, source_system, dest_system, version, active,
             created_at, updated_at, change_log
      FROM edi_maps
      WHERE message_type = $message_type
      ORDER BY version DESC
    limit: 5
    example: {message_type: ASN}

  - name: list_recent_mapping_and_config_changes
    desc: Recent changes to maps, certificates and endpoint configuration, who made them and when deployed.
    kind: sql
    args:
      interface_name: {desc: "Filter to interface (default all)"}
      days: {type: int, default: 30, desc: "Last N days"}
    sql: |
      SELECT change_id, change_type, interface_name, changed_by, changed_at,
             description, previous_value, new_value, status
      FROM config_changes
      WHERE ($interface_name IS NULL OR interface_name = $interface_name)
        AND changed_at >= CAST($as_of AS DATE) - INTERVAL CAST($days AS INT) DAY
      ORDER BY changed_at DESC
    limit: 50
    example: {}

  - name: list_third_party_connections
    desc: Supplier and partner connections with protocol and owner. Use to assess integration risk.
    kind: sql
    args:
      connection_type: {desc: "Filter by type: supplier, partner, carrier, 3pl, api_consumer"}
      protocol: {desc: "Filter by protocol: edi, api, sftp, http, webhook"}
      security_risk_rating: {desc: "Filter by risk: low, medium, high, critical"}
    sql: |
      SELECT connection_id, partner_name, partner_id, connection_type, protocol,
             endpoint_url, owner_id, authenticated, privileged_access, active,
             established_at, security_risk_rating
      FROM third_party_connections
      WHERE ($connection_type IS NULL OR connection_type = $connection_type)
        AND ($protocol IS NULL OR protocol = $protocol)
        AND ($security_risk_rating IS NULL OR security_risk_rating = $security_risk_rating)
      ORDER BY security_risk_rating DESC, active DESC
    limit: 100
    example: {}

  - name: get_integration_run_cost_by_pattern
    desc: Run and support cost per integration pattern. Returns setup, run and support costs.
    kind: sql
    args:
      pattern_type: {desc: "Pattern type: edi, api, file_transfer, webhook, other (default all)"}
      month: {type: date, desc: "Cost month (default current month)"}
    sql: |
      SELECT prc.cost_id, prc.pattern_id, prc.pattern_name, prc.month,
             prc.setup_cost_gbp, prc.run_cost_gbp, prc.support_cost_gbp,
             ROUND(prc.total_cost_gbp, 2) AS total_cost_gbp,
             ip.active_connections
      FROM pattern_run_costs prc
      LEFT JOIN integration_patterns ip ON ip.pattern_id = prc.pattern_id
      WHERE ($pattern_type IS NULL OR ip.pattern_type = $pattern_type)
        AND ($month IS NULL OR prc.month = CAST($month AS DATE))
      ORDER BY prc.total_cost_gbp DESC
    limit: 20
    example: {}

  - name: get_stock_feed_latency
    desc: End-to-end latency of the stock feed to the website. Shows delay between WMS update and website refresh.
    kind: sql
    args:
      days: {type: int, default: 7, desc: "Last N days"}
    sql: |
      SELECT run_id, feed_name, source_system, dest_system, scheduled_time,
             started_at, completed_at, records_processed,
             ROUND(duration_seconds / 60.0, 1) AS duration_minutes,
             CASE
               WHEN started_at > scheduled_time
               THEN ROUND(EXTRACT(EPOCH FROM (started_at - scheduled_time)) / 60.0, 1)
               ELSE 0
             END AS delay_minutes,
             status
      FROM feed_runs
      WHERE feed_name = 'stock_feed'
        AND completed_at >= CAST($as_of AS DATE) - INTERVAL CAST($days AS INT) DAY
      ORDER BY completed_at DESC
    limit: 100
    example: {}

  - name: get_asn_feed_change_log
    desc: Change log and volume/completeness of the inbound ASN feed. Track data quality and feed issues.
    kind: sql
    args:
      days: {type: int, default: 60, desc: "Last N days"}
    sql: |
      SELECT metric_id, measured_at, asn_messages_received, asn_lines_received,
             lines_with_pallet_data, message_completeness_pct,
             feed_status, changes
      FROM asn_feed_metrics
      WHERE measured_at >= CAST($as_of AS DATE) - INTERVAL CAST($days AS INT) DAY
      ORDER BY measured_at DESC
    limit: 100
    example: {}

  - name: compare_erp_and_wms_stock
    desc: Reconcile ERP and WMS balances and surface differences. Shows SKUs where counts don't match.
    kind: sql
    args:
      site_id: {desc: "Filter to DC (default all)"}
      min_difference: {type: int, default: 1, desc: "Only show differences of at least this many units"}
    sql: |
      SELECT recon_id, sku, site_id, erp_balance, wms_balance, difference,
             ROUND(difference_pct, 1) AS difference_pct, status, created_at
      FROM stock_reconciliation
      WHERE ($site_id IS NULL OR site_id = $site_id)
        AND ABS(difference) >= $min_difference
      ORDER BY ABS(difference) DESC, created_at DESC
    limit: 50
    example: {}

  - name: update_stock_feed_schedule
    desc: Change the run frequency or batch size of the stock feed. Allows tuning for latency and load.
    kind: update
    table: stock_feed_schedule
    set: {updated_at: "$as_of"}
    args:
      run_frequency: {desc: "New frequency: hourly, 4-hourly, daily, etc"}
      batch_size: {type: int, desc: "New batch size in records"}
    example: {schedule_id: SCH-000001, run_frequency: "4-hourly", batch_size: 5000}
