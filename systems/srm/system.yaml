id: srm
name: Supplier Relationship Management (SRM)
instructions: >
  Supplier performance tracking, scorecards, improvement plans, engagement, and capacity planning.
  Performance review ids look like SPR-000123, improvement plan ids look like SIP-000123, issue ids look like ISS-000123.
  Use it for supplier scorecards, on-time delivery trends, improvement programmes, engagement tracking,
  supplier segmentation, and sourcing decisions.

tables:
  supplier_scorecards:
    key: [supplier_id, scorecard_month]
    cols:
      supplier_id: {desc: "Supplier, e.g. SUP-0001"}
      scorecard_month: {type: date, desc: "Start of the month for this scorecard"}
      quality_score: {type: float, desc: "Quality score 0-100"}
      on_time_delivery_pct: {type: float, desc: "% of orders on time"}
      cost_performance_score: {type: float, desc: "Cost competitiveness score 0-100"}
      lead_time_days: {type: int, desc: "Actual lead time in days"}
      agreed_lead_time_days: {type: int, desc: "Agreed lead time in days"}
      responsiveness_score: {type: float, desc: "Response time to requests score 0-100"}
      reaction_time_hours: {type: float, desc: "Average hours to respond to a change request that month"}
      flexibility_score: {type: float, desc: "Ability to flex volume, mix or dates at short notice, 0-100"}
      compliance_score: {type: float, desc: "Compliance (quality, safety, ethics) score 0-100"}
      overall_score: {type: float, desc: "Overall supplier score 0-100"}
      status_category: {type: enum, values: [strategic, preferred, standard, at_risk, probation], desc: "Category based on performance"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_issues:
    key: issue_id
    cols:
      issue_id: {type: str, desc: "Issue record, e.g. ISS-000123"}
      supplier_id: {desc: "Supplier"}
      issue_type: {type: enum, values: [quality, delivery, cost, compliance, responsiveness, other], desc: "Type of issue"}
      description: {type: str, desc: "Issue description"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Severity level"}
      status: {type: enum, values: [open, investigating, in_progress, resolved, closed], desc: "Issue status"}
      assigned_to: {type: str, desc: "Employee assigned to resolve"}
      raised_date: {type: date, desc: "Date issue was raised"}
      target_resolution_date: {type: date, desc: "Target resolution date"}
      resolved_date: {type: date, desc: "When issue was resolved"}
      root_cause: {type: str, desc: "Root cause analysis"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_improvement_plans:
    key: plan_id
    cols:
      plan_id: {type: str, desc: "Improvement plan, e.g. SIP-000123"}
      supplier_id: {desc: "Supplier"}
      plan_name: {type: str, desc: "Name of the improvement initiative"}
      plan_type: {type: enum, values: [quality, delivery, cost, capacity, compliance, sustainability], desc: "Type of improvement"}
      focus_area: {type: str, desc: "Specific area to improve"}
      current_baseline: {type: str, desc: "Current performance baseline"}
      target_metric: {type: str, desc: "Target improvement metric"}
      target_value: {type: str, desc: "Target value to achieve"}
      start_date: {type: date, desc: "Start date"}
      target_completion_date: {type: date, desc: "Target completion date"}
      status: {type: enum, values: [planned, active, in_progress, completed, suspended], desc: "Plan status"}
      owner_supplier: {type: str, desc: "Supplier owner name"}
      owner_internal: {type: str, desc: "Internal owner employee"}
      progress_pct: {type: int, desc: "Progress percentage"}
      result: {type: str, desc: "Outcome achieved, filled when the plan completes or is suspended"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_performance_reviews:
    key: review_id
    cols:
      review_id: {type: str, desc: "Performance review, e.g. SPR-000123"}
      supplier_id: {desc: "Supplier"}
      review_period: {type: str, desc: "Period reviewed, e.g. Q3 2026"}
      scheduled_date: {type: date, desc: "Scheduled review date"}
      completed_date: {type: date, desc: "When review was completed"}
      status: {type: enum, values: [scheduled, in_progress, completed, cancelled], desc: "Review status"}
      meeting_outcome: {type: str, desc: "Outcome of meeting"}
      internal_owner: {type: str, desc: "Internal account manager"}
      created_at: {type: timestamp, desc: "When review was created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_engagement_plans:
    key: engagement_record_id
    cols:
      engagement_record_id: {type: str, desc: "Engagement record, e.g. ENG-000123"}
      supplier_id: {desc: "Supplier"}
      programme_type: {type: enum, values: [emissions, sustainability, innovation, quality], desc: "Type of engagement programme"}
      engagement_status: {type: enum, values: [planned, invited, active, inactive, completed], desc: "Current engagement status"}
      invitation_sent_date: {type: date, desc: "When invitation was sent"}
      acceptance_date: {type: date, desc: "When supplier accepted"}
      programme_start_date: {type: date, desc: "When programme started"}
      target_date: {type: date, desc: "Target completion date"}
      has_science_based_target: {type: bool, desc: "Whether supplier has science-based targets"}
      progress_notes: {type: str, desc: "Progress notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_lead_times:
    key: [po_id, supplier_id, process_stage]
    cols:
      po_id: {desc: "Purchase order"}
      supplier_id: {desc: "Supplier"}
      po_date: {type: date, desc: "PO date"}
      agreed_lead_time_days: {type: int, desc: "Agreed lead time in days"}
      actual_lead_time_days: {type: int, desc: "Actual lead time in days"}
      process_stage: {type: enum, values: [order_to_factory, factory_to_port, port_to_dc, total], desc: "Stage of lead time"}
      days_variance: {type: int, desc: "Actual minus agreed days"}
      status: {type: enum, values: [on_track, delayed, early, completed], desc: "Delivery status"}
      root_cause_delay: {type: str, desc: "If delayed, root cause"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_factory_capacity:
    key: [supplier_id, factory_name, capacity_month]
    cols:
      supplier_id: {desc: "Supplier"}
      factory_name: {type: str, desc: "Factory name or location"}
      capacity_month: {type: date, desc: "Start of month for this capacity"}
      total_capacity_units: {type: int, desc: "Total monthly capacity"}
      committed_capacity_units: {type: int, desc: "Committed to existing POs"}
      available_capacity_units: {type: int, desc: "Available for new orders"}
      capacity_utilization_pct: {type: float, desc: "% of capacity used"}
      is_alternative_source: {type: bool, desc: "Whether this is an alternative to main supplier"}
      lead_time_days: {type: int, desc: "Lead time from this factory"}
      cost_per_unit_gbp: {type: float, desc: "Cost per unit"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_management_costs:
    key: supplier_id
    cols:
      supplier_id: {desc: "Supplier"}
      team_hours: {type: int, desc: "Internal team hours spent managing the supplier per year"}
      team_cost_gbp: {type: float, desc: "Cost of team time per year"}
      audit_cost_gbp: {type: float, desc: "Audit and inspection cost per year"}
      systems_cost_gbp: {type: float, desc: "Systems and portal cost allocated per year"}
      travel_cost_gbp: {type: float, desc: "Travel and visits cost per year"}
      total_annual_cost_gbp: {type: float, desc: "Total annual cost to manage the supplier"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_relationships:
    key: supplier_id
    cols:
      supplier_id: {desc: "Supplier"}
      status: {type: enum, values: [active, watch, planned_exit, blocked], desc: "Relationship status"}
      reason: {type: str, desc: "Why the status was set"}
      status_changed_date: {type: date, desc: "When the status last changed"}
      updated_at: {type: timestamp, desc: "Last updated"}

  provider_integrations:
    key: provider_id
    cols:
      provider_id: {type: str, desc: "3PL provider, e.g. 3PL-001"}
      provider_name: {type: str, desc: "Provider name"}
      edi_supported: {type: bool, desc: "Supports EDI integration"}
      api_supported: {type: bool, desc: "Supports API integration"}
      file_transfer_supported: {type: bool, desc: "Supports file transfer (SFTP/FTP)"}
      edi_standards: {type: str, desc: "EDI standards supported"}
      api_documentation_url: {type: str, desc: "API documentation link"}
      file_formats_supported: {type: str, desc: "File formats (CSV, XML, JSON)"}
      setup_cost_gbp: {type: float, desc: "One-time setup cost"}
      monthly_cost_gbp: {type: float, desc: "Monthly operating cost"}
      integration_time_weeks: {type: int, desc: "Time to integrate in weeks"}
      technical_contact: {type: str, desc: "Technical contact details"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: search_suppliers
    desc: Find suppliers by name, country or category; returns supplier ids, risk rating and account manager. Use first to get ids.
    kind: select
    from: master.suppliers
    filters:
      supplier_id: {}
      name: {op: like, desc: "Words in supplier name, e.g. textile mill"}
      country: {op: like, desc: "Country name or code"}
      category_focus: {op: like, desc: "Category name or code"}
    columns: [supplier_id, name, country, category_focus, status, risk_rating, otif_pct_12m, annual_spend_gbp, account_manager_id]
    order: supplier_id
    limit: 50
    example: {category_focus: Womenswear}

  - name: list_suppliers_for_category
    desc: Suppliers that supply a product category (e.g. Bedding, Cookware) or department, largest spend first, with latest scorecard. Use to build a sourcing shortlist.
    kind: sql
    args:
      category: {required: true, type: str, desc: "Product category, subcategory or department, e.g. Bedding, Cookware, Home"}
    sql: |
      WITH hits AS (
        SELECT p.supplier_id, count(*) AS skus_in_category
        FROM master.products p
        WHERE p.category ILIKE '%' || $category || '%' OR p.subcategory ILIKE '%' || $category || '%'
           OR p.department ILIKE '%' || $category || '%'
        GROUP BY p.supplier_id
      ),
      latest AS (
        SELECT supplier_id, overall_score, on_time_delivery_pct
        FROM supplier_scorecards
        QUALIFY row_number() OVER (PARTITION BY supplier_id ORDER BY scorecard_month DESC) = 1
      )
      SELECT s.supplier_id, s.name, s.country, s.category_focus, h.skus_in_category, s.annual_spend_gbp,
             s.otif_pct_12m, s.risk_rating, s.status, l.overall_score AS latest_overall_score,
             l.on_time_delivery_pct AS latest_on_time_pct
      FROM hits h
      JOIN master.suppliers s ON s.supplier_id = h.supplier_id
      LEFT JOIN latest l ON l.supplier_id = s.supplier_id
      WHERE s.status IN ('active', 'onboarding')
      ORDER BY s.annual_spend_gbp DESC
    limit: 30
    example: {category: Bedding}

  - name: get_supplier_scorecard_history
    desc: Supplier's monthly scorecard history, latest first. Shows quality, on-time delivery, cost, responsiveness, compliance and overall score.
    kind: sql
    args:
      supplier_id: {required: true}
      months_back: {type: int, default: 12, desc: "Number of latest monthly scorecards to show"}
    sql: |
      SELECT supplier_id, scorecard_month, quality_score, on_time_delivery_pct,
             cost_performance_score, lead_time_days, agreed_lead_time_days,
             responsiveness_score, compliance_score, overall_score, status_category
      FROM supplier_scorecards
      WHERE supplier_id = $supplier_id
      QUALIFY row_number() OVER (ORDER BY scorecard_month DESC) <= CAST($months_back AS INT)
      ORDER BY scorecard_month DESC
    limit: 24
    example: {supplier_id: SUP-0001}

  - name: get_supplier_on_time_delivery_trend
    desc: On-time delivery percentage by month with the change from the month before, latest first. Shows whether delivery is improving or deteriorating.
    kind: sql
    args:
      supplier_id: {required: true}
      months_back: {type: int, default: 6, desc: "Number of latest months to show"}
    sql: |
      WITH t AS (
        SELECT supplier_id, scorecard_month, on_time_delivery_pct,
               LAG(on_time_delivery_pct) OVER (ORDER BY scorecard_month) AS prior_month_pct
        FROM supplier_scorecards
        WHERE supplier_id = $supplier_id
      )
      SELECT supplier_id, scorecard_month, on_time_delivery_pct, prior_month_pct,
             ROUND(on_time_delivery_pct - prior_month_pct, 1) AS change_vs_prior_month_pct
      FROM t
      QUALIFY row_number() OVER (ORDER BY scorecard_month DESC) <= CAST($months_back AS INT)
      ORDER BY scorecard_month DESC
    limit: 24
    example: {supplier_id: SUP-0001}

  - name: get_supplier_issues_log
    desc: Open and recent issues for a supplier, most severe first. Shows type, severity, owner, status, dates and root cause.
    kind: sql
    args:
      supplier_id: {required: true}
      status: {type: enum, values: [open, investigating, in_progress, resolved, closed], desc: "Filter by status (default all)"}
      issue_type: {type: enum, values: [quality, delivery, cost, compliance, responsiveness, other], desc: "Filter by issue type (default all)"}
      days_back: {type: int, default: 180, desc: "Show issues raised in last N days"}
    sql: |
      SELECT issue_id, supplier_id, issue_type, severity, status, description,
             assigned_to, raised_date, target_resolution_date, resolved_date, root_cause
      FROM supplier_issues
      WHERE supplier_id = $supplier_id
        AND ($status IS NULL OR status = $status)
        AND ($issue_type IS NULL OR issue_type = $issue_type)
        AND raised_date >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
      ORDER BY CASE severity WHEN 'critical' THEN 1 WHEN 'high' THEN 2 WHEN 'medium' THEN 3 ELSE 4 END, raised_date DESC
    limit: 30
    example: {supplier_id: SUP-0003}

  - name: get_supplier_lead_time_performance
    desc: Actual vs agreed lead time per supplier over recent months (total by default, or one process stage), with share of POs late. Filter by supplier or country.
    kind: sql
    args:
      supplier_id: {required: false}
      country: {type: str, desc: "Supplier country code, e.g. TR, PT, CN"}
      process_stage: {type: enum, values: [total, order_to_factory, factory_to_port, port_to_dc], default: total, desc: "Stage to analyse; total is door to door"}
      months_back: {type: int, default: 6, desc: "Months of POs to analyse"}
    sql: |
      SELECT l.supplier_id, s.name AS supplier_name, s.country, l.process_stage,
             COUNT(*) AS po_count,
             ROUND(AVG(l.agreed_lead_time_days), 1) AS avg_agreed_days,
             ROUND(AVG(l.actual_lead_time_days), 1) AS avg_actual_days,
             ROUND(AVG(l.days_variance), 1) AS avg_variance_days,
             ROUND(SUM(CASE WHEN l.days_variance > 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS late_pct
      FROM supplier_lead_times l
      JOIN master.suppliers s ON s.supplier_id = l.supplier_id
      WHERE ($supplier_id IS NULL OR l.supplier_id = $supplier_id)
        AND ($country IS NULL OR s.country = upper($country))
        AND l.process_stage = $process_stage
        AND l.po_date >= CAST($as_of AS DATE) - INTERVAL (CAST($months_back AS INT) * 30) DAY
      GROUP BY l.supplier_id, s.name, s.country, l.process_stage
      ORDER BY late_pct DESC, l.supplier_id
    limit: 30
    example: {supplier_id: SUP-0001}

  - name: get_supplier_lead_time_breakdown
    desc: Average lead time by process stage (order to factory, factory to port, port to DC) for a supplier, with each stage's share of the total. Shows where time goes.
    kind: sql
    args:
      supplier_id: {required: true}
      months_back: {type: int, default: 12, desc: "Months of POs to analyse"}
    sql: |
      WITH t AS (
        SELECT * FROM supplier_lead_times
        WHERE supplier_id = $supplier_id
          AND po_date >= CAST($as_of AS DATE) - INTERVAL (CAST($months_back AS INT) * 30) DAY
      ),
      tot AS (SELECT AVG(actual_lead_time_days) AS d FROM t WHERE process_stage = 'total')
      SELECT t.supplier_id, t.process_stage,
             ROUND(AVG(t.agreed_lead_time_days), 1) AS avg_agreed_days,
             ROUND(AVG(t.actual_lead_time_days), 1) AS avg_lead_time_days,
             ROUND(AVG(t.actual_lead_time_days) * 100.0 / (SELECT d FROM tot), 0) AS share_of_total_pct,
             MIN(t.actual_lead_time_days) AS min_days, MAX(t.actual_lead_time_days) AS max_days,
             ROUND(STDDEV_POP(t.actual_lead_time_days), 1) AS variability_std_dev,
             COUNT(*) AS data_points
      FROM t
      GROUP BY t.supplier_id, t.process_stage
      ORDER BY CASE t.process_stage WHEN 'order_to_factory' THEN 1 WHEN 'factory_to_port' THEN 2 WHEN 'port_to_dc' THEN 3 ELSE 4 END
    limit: 10
    example: {supplier_id: SUP-0001}

  - name: get_supplier_reaction_time
    desc: Average hours a supplier takes to respond to change requests, by quarter, with responsiveness score. Filter by supplier or country.
    kind: sql
    args:
      supplier_id: {required: false}
      country: {type: str, desc: "Supplier country code, e.g. TR, PT, CN"}
      quarters_back: {type: int, default: 4, desc: "Number of latest quarters"}
    sql: |
      SELECT c.supplier_id, s.name AS supplier_name, s.country,
             date_trunc('quarter', c.scorecard_month) AS quarter_start,
             ROUND(AVG(c.reaction_time_hours), 1) AS avg_reaction_hours,
             ROUND(AVG(c.responsiveness_score), 1) AS responsiveness_score
      FROM supplier_scorecards c
      JOIN master.suppliers s ON s.supplier_id = c.supplier_id
      WHERE ($supplier_id IS NULL OR c.supplier_id = $supplier_id)
        AND ($country IS NULL OR s.country = upper($country))
        AND c.scorecard_month >= date_trunc('quarter', CAST($as_of AS DATE)) - INTERVAL (CAST($quarters_back AS INT) * 3) MONTH
      GROUP BY c.supplier_id, s.name, s.country, date_trunc('quarter', c.scorecard_month)
      ORDER BY quarter_start DESC, avg_reaction_hours
    limit: 40
    example: {supplier_id: SUP-0001}

  - name: get_supplier_scorecard_comparison
    desc: Compare several suppliers side by side on average quality, on-time delivery, cost, lead time, reaction time, flexibility and overall score over recent months.
    kind: sql
    args:
      supplier_ids: {required: true, desc: "Comma-separated supplier ids, e.g. SUP-0001,SUP-0002"}
      months_back: {type: int, default: 6, desc: "Number of latest monthly scorecards to average"}
    sql: |
      WITH ids AS (SELECT trim(unnest(string_split($supplier_ids, ','))) AS supplier_id),
      recent AS (
        SELECT c.* FROM supplier_scorecards c JOIN ids USING (supplier_id)
        QUALIFY row_number() OVER (PARTITION BY c.supplier_id ORDER BY c.scorecard_month DESC) <= CAST($months_back AS INT)
      )
      SELECT r.supplier_id, s.name AS supplier_name, s.country,
             ROUND(AVG(r.quality_score), 1) AS quality_score,
             ROUND(AVG(r.on_time_delivery_pct), 1) AS on_time_delivery_pct,
             ROUND(AVG(r.cost_performance_score), 1) AS cost_performance_score,
             ROUND(AVG(r.lead_time_days), 1) AS avg_lead_time_days,
             ROUND(AVG(r.agreed_lead_time_days), 1) AS avg_agreed_lead_time_days,
             ROUND(AVG(r.reaction_time_hours), 1) AS reaction_time_hours,
             ROUND(AVG(r.responsiveness_score), 1) AS responsiveness_score,
             ROUND(AVG(r.flexibility_score), 1) AS flexibility_score,
             ROUND(AVG(r.compliance_score), 1) AS compliance_score,
             ROUND(AVG(r.overall_score), 1) AS overall_score
      FROM recent r JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      GROUP BY r.supplier_id, s.name, s.country
      ORDER BY overall_score DESC
    limit: 20
    example: {supplier_ids: "SUP-0001,SUP-0002,SUP-0003"}

  - name: get_supplier_management_cost
    desc: Annual cost to manage a supplier (team time, audits, systems, travel) and as a percentage of spend. Leave supplier blank to rank all, costliest relative to spend first.
    kind: sql
    args:
      supplier_id: {required: false}
    sql: |
      SELECT m.supplier_id, s.name AS supplier_name, s.annual_spend_gbp, m.team_hours, m.team_cost_gbp,
             m.audit_cost_gbp, m.systems_cost_gbp, m.travel_cost_gbp,
             m.total_annual_cost_gbp AS estimated_annual_cost_gbp,
             ROUND(m.total_annual_cost_gbp * 100.0 / s.annual_spend_gbp, 1) AS cost_pct_of_spend,
             'total = team hours x rate + audits + systems + travel' AS formula
      FROM supplier_management_costs m
      JOIN master.suppliers s ON s.supplier_id = m.supplier_id
      WHERE ($supplier_id IS NULL OR m.supplier_id = $supplier_id)
      ORDER BY cost_pct_of_spend DESC
    limit: 20
    example: {supplier_id: SUP-0001}

  - name: get_supplier_concentration_by_category
    desc: Percentage of category spend from top suppliers. Shows concentration risk.
    kind: select
    from: master.suppliers
    filters:
      category_focus: {}
    columns: [supplier_id, name, country, annual_spend_gbp]
    order: annual_spend_gbp
    limit: 20
    example: {category_focus: Womenswear}

  - name: calculate_supplier_segmentation_score
    desc: Score suppliers 0-100 for invest, maintain or exit from performance, spend and management cost. Exit means performance under 70 and small or costly. Leave supplier blank to rank all.
    kind: sql
    args:
      supplier_id: {required: false}
      recommendation: {type: enum, values: [Invest, Maintain, Exit], desc: "Only suppliers with this recommendation"}
      months_back: {type: int, default: 6, desc: "Months of scorecards averaged for performance"}
    sql: |
      WITH perf AS (
        SELECT supplier_id, AVG(overall_score) AS perf_score, AVG(on_time_delivery_pct) AS otd
        FROM (
          SELECT * FROM supplier_scorecards
          QUALIFY row_number() OVER (PARTITION BY supplier_id ORDER BY scorecard_month DESC) <= CAST($months_back AS INT)
        ) recent
        GROUP BY supplier_id
      ),
      base AS (
        SELECT s.supplier_id, s.name, s.country, s.category_focus, s.annual_spend_gbp, s.risk_rating,
               p.perf_score, p.otd, m.total_annual_cost_gbp,
               m.total_annual_cost_gbp * 100.0 / s.annual_spend_gbp AS cost_pct,
               percent_rank() OVER (ORDER BY s.annual_spend_gbp) * 100 AS spend_rank_pct
        FROM master.suppliers s
        JOIN perf p ON p.supplier_id = s.supplier_id
        JOIN supplier_management_costs m ON m.supplier_id = s.supplier_id
        WHERE s.status IN ('active', 'onboarding')
      ),
      scored AS (
        SELECT *, ROUND(0.5 * perf_score + 0.3 * spend_rank_pct + 0.2 * greatest(0, 100 - cost_pct * 8), 1) AS segmentation_score
        FROM base
      )
      SELECT supplier_id, name, country, category_focus, annual_spend_gbp, risk_rating,
             ROUND(perf_score, 1) AS avg_overall_score, ROUND(otd, 1) AS avg_on_time_pct,
             total_annual_cost_gbp AS management_cost_gbp, ROUND(cost_pct, 1) AS cost_pct_of_spend,
             segmentation_score,
             CASE WHEN perf_score < 70 AND (spend_rank_pct < 50 OR cost_pct > 5) THEN 'Exit'
                  WHEN perf_score >= 82 AND spend_rank_pct >= 50 THEN 'Invest'
                  ELSE 'Maintain' END AS recommendation,
             '0.5 x performance + 0.3 x spend rank + 0.2 x cost efficiency' AS formula
      FROM scored
      WHERE ($supplier_id IS NULL OR supplier_id = $supplier_id)
        AND ($recommendation IS NULL OR $recommendation = CASE
              WHEN perf_score < 70 AND (spend_rank_pct < 50 OR cost_pct > 5) THEN 'Exit'
              WHEN perf_score >= 82 AND spend_rank_pct >= 50 THEN 'Invest' ELSE 'Maintain' END)
      ORDER BY segmentation_score DESC
    limit: 25
    example: {supplier_id: SUP-0001}

  - name: get_dual_sourcing_cost_estimate
    desc: Cost and lead time to qualify a second source for a product category.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
      existing_supplier_id: {required: true, desc: "Current supplier"}
    sql: |
      SELECT $category as category,
             $existing_supplier_id as existing_supplier,
             (SELECT supplier_id FROM master.suppliers WHERE status = 'active' AND supplier_id != $existing_supplier_id LIMIT 1) as alternative_supplier_id,
             50000 as qualification_cost_gbp,
             30 as qualification_time_days,
             (SELECT ROUND(AVG(actual_lead_time_days), 0) FROM supplier_lead_times
              WHERE supplier_id = (SELECT supplier_id FROM master.suppliers WHERE status = 'active' AND supplier_id != $existing_supplier_id LIMIT 1)) as alternative_lead_time_days,
             'Cost includes samples, trials, audits' as cost_breakdown,
             'Time to full qualification and first PO' as time_note
    limit: 1
    example: {category: Bedding, existing_supplier_id: SUP-0001}

  - name: get_alternative_factory_capacity
    desc: Spare capacity at alternative factories if current supplier hits constraints.
    kind: sql
    args:
      supplier_id: {required: true}
      required_units: {type: int, default: 10000, desc: "Units needed per month"}
    sql: |
      SELECT supplier_id, factory_name, capacity_month,
             total_capacity_units, committed_capacity_units,
             available_capacity_units, capacity_utilization_pct,
             lead_time_days, cost_per_unit_gbp,
             ROUND(available_capacity_units * cost_per_unit_gbp, 2) as available_value_gbp
      FROM supplier_factory_capacity
      WHERE supplier_id = $supplier_id
        AND is_alternative_source = true
        AND available_capacity_units >= $required_units
      ORDER BY capacity_month DESC
    limit: 20
    example: {supplier_id: SUP-0003, required_units: 10000}

  - name: get_3pl_integration_capabilities
    desc: Integration methods a 3PL provider supports and technical details, costs and timelines.
    kind: select
    from: provider_integrations
    filters:
      provider_name: {op: like}
      edi_supported: {}
      api_supported: {}
      file_transfer_supported: {}
    columns: [provider_id, provider_name, edi_supported, api_supported, file_transfer_supported,
              edi_standards, setup_cost_gbp, monthly_cost_gbp, integration_time_weeks, technical_contact]
    order: provider_id
    limit: 20
    example: {api_supported: true}

  - name: get_supplier_engagement_status
    desc: Engagement records on emissions and other programmes (status, invitation and start dates, science-based target flag). Filter by supplier, programme or target flag.
    kind: select
    from: supplier_engagement_plans
    filters:
      supplier_id: {}
      programme_type: {}
      engagement_status: {}
      has_science_based_target: {}
    columns: [engagement_record_id, supplier_id, programme_type, engagement_status, invitation_sent_date,
              acceptance_date, programme_start_date, has_science_based_target, progress_notes]
    order: programme_start_date DESC
    limit: 30
    example: {supplier_id: SUP-0001}

  - name: get_supplier_improvement_programme_history
    desc: Past and current improvement programmes for a supplier with baseline, target, progress and the result achieved.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT plan_id, supplier_id, plan_name, plan_type, focus_area,
             current_baseline, target_value, start_date, target_completion_date,
             status, progress_pct, result, owner_internal
      FROM supplier_improvement_plans
      WHERE supplier_id = $supplier_id
      ORDER BY start_date DESC
    limit: 30
    example: {supplier_id: SUP-0001}

  - name: create_supplier_performance_review
    desc: Opens a supplier performance review record and schedules the review. Returns the new review.
    kind: insert
    table: supplier_performance_reviews
    id_prefix: SPR-
    defaults: {status: scheduled}
    args:
      supplier_id: {required: true}
      review_period: {required: true, desc: "Period reviewed, e.g. Q3 2026"}
      scheduled_date: {required: true, type: date, desc: "When the review will be held"}
      internal_owner: {required: true, desc: "Account manager employee id"}
    example: {supplier_id: SUP-0001, review_period: "Q4 2026", scheduled_date: "+14d", internal_owner: "EMP-0042"}

  - name: create_supplier_improvement_plan
    desc: Opens a formal improvement plan with baseline, target and dates for a supplier. Returns the new plan.
    kind: insert
    table: supplier_improvement_plans
    id_prefix: SIP-
    defaults: {status: active, progress_pct: 0, start_date: "$as_of", plan_name: "{plan_type} improvement plan: {focus_area}", target_metric: "{focus_area}", owner_supplier: "To be nominated by supplier"}
    args:
      supplier_id: {required: true}
      plan_type: {required: true, type: enum, values: [quality, delivery, cost, capacity, compliance, sustainability]}
      focus_area: {required: true, desc: "Specific area to improve, e.g. On-time delivery"}
      current_baseline: {required: true, desc: "Current performance, e.g. 61% on time"}
      target_value: {required: true, desc: "Target value to achieve, e.g. 90% on time"}
      target_completion_date: {required: true, type: date, desc: "Date the target must be met"}
      owner_internal: {required: true, desc: "Employee id of the internal owner, e.g. the account manager"}
      target_metric: {type: str, desc: "Metric measured, e.g. On-time delivery %"}
      owner_supplier: {type: str, desc: "Supplier-side owner name"}
    example: {supplier_id: SUP-0001, plan_type: delivery, focus_area: "On-time delivery", current_baseline: "88% on time", target_value: "95% on time", target_completion_date: "+90d", owner_internal: "EMP-00062"}

  - name: create_supplier_issue_record
    desc: Logs an issue and owner against a supplier. Returns the new issue record.
    kind: insert
    table: supplier_issues
    id_prefix: ISS-
    defaults: {status: open}
    args:
      supplier_id: {required: true}
      issue_type: {required: true, type: enum, values: [quality, delivery, cost, compliance, responsiveness, other]}
      description: {required: true, desc: "Issue description"}
      severity: {required: true, type: enum, values: [low, medium, high, critical]}
      assigned_to: {required: true, desc: "Employee id to own resolution"}
      target_resolution_date: {type: date, default: "+30d", desc: "Target resolution date"}
    example: {supplier_id: SUP-0001, issue_type: delivery, description: "Missed PO-2026-004512 by 5 days", severity: high, assigned_to: "EMP-0042", target_resolution_date: "+14d"}

  - name: block_supplier_for_new_orders
    desc: Places a hold on a supplier so no new purchase orders can be raised. Returns confirmation.
    kind: update
    table: master.suppliers
    set: {status: blocked}
    args: {}
    example: {supplier_id: SUP-0001}

  - name: update_supplier_status
    desc: Changes a supplier's relationship status (watch, planned_exit, active) with a reason. Returns old and new status.
    kind: update
    table: supplier_relationships
    set: {status: "{status}", status_changed_date: "$as_of"}
    args:
      status: {required: true, type: enum, values: [active, watch, planned_exit], desc: "New relationship status"}
      reason: {required: true, desc: "Why the status is changing"}
    example: {supplier_id: SUP-0001, status: watch, reason: "Delivery and quality slipping"}

  - name: create_supplier_engagement_plan
    desc: Add a supplier to the emissions (or other) engagement programme as planned, before any invitation. Returns the new engagement record.
    kind: insert
    table: supplier_engagement_plans
    id_prefix: ENG-
    defaults: {engagement_status: planned, has_science_based_target: false, progress_notes: "Added to programme, invitation not yet sent"}
    args:
      supplier_id: {required: true}
      programme_type: {required: true, type: enum, values: [emissions, sustainability, innovation, quality], desc: "Type of engagement"}
      target_date: {type: date, default: "+365d", desc: "Date by which engagement should be complete"}
      has_science_based_target: {type: bool, desc: "True if the supplier already has an SBTi-validated target"}
    example: {supplier_id: SUP-0001, programme_type: emissions}

  - name: send_supplier_engagement_invitation
    desc: Send an engagement programme invitation to a supplier and record it as invited today. Returns the invitation record.
    kind: insert
    table: supplier_engagement_plans
    id_prefix: ENG-
    defaults: {engagement_status: invited, invitation_sent_date: "$as_of", has_science_based_target: false, progress_notes: "Invitation sent, awaiting reply"}
    args:
      supplier_id: {required: true}
      programme_type: {required: true, type: enum, values: [emissions, sustainability, innovation, quality], desc: "Type of engagement"}
      target_date: {type: date, default: "+365d", desc: "Date by which engagement should be complete"}
    example: {supplier_id: SUP-0001, programme_type: emissions}

  - name: remove_supplier_from_engagement_programme
    desc: Remove a supplier from the engagement programme by marking its engagement record inactive, with a reason. Returns old and new status.
    kind: update
    table: supplier_engagement_plans
    set: {engagement_status: inactive}
    args:
      progress_notes: {required: true, desc: "Reason for removal, e.g. already has SBTi targets"}
    example: {engagement_record_id: ENG-000001, progress_notes: "Already has SBTi targets"}
