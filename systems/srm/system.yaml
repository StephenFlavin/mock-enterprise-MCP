id: srm
name: Supplier Relationship Management (SRM)
instructions: >
  Supplier performance tracking, scorecards, improvement plans, engagement, and capacity planning.
  Performance review ids look like SPR-000123, improvement plan ids look like SIP-000123, issue ids look like ISS-000123.
  Use it for supplier scorecards, on-time delivery trends, improvement programmes, engagement tracking,
  supplier segmentation, and sourcing decisions.

tables:
  supplier_scorecards:
    key: [supplier_id, scorecard_month]
    cols:
      supplier_id: {desc: "Supplier, e.g. SUP-0001"}
      scorecard_month: {type: date, desc: "Start of the month for this scorecard"}
      quality_score: {type: float, desc: "Quality score 0-100"}
      on_time_delivery_pct: {type: float, desc: "% of orders on time"}
      cost_performance_score: {type: float, desc: "Cost competitiveness score 0-100"}
      lead_time_days: {type: int, desc: "Actual lead time in days"}
      agreed_lead_time_days: {type: int, desc: "Agreed lead time in days"}
      responsiveness_score: {type: float, desc: "Response time to requests score 0-100"}
      compliance_score: {type: float, desc: "Compliance (quality, safety, ethics) score 0-100"}
      overall_score: {type: float, desc: "Overall supplier score 0-100"}
      status_category: {type: enum, values: [strategic, preferred, standard, at_risk, probation], desc: "Category based on performance"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_issues:
    key: issue_id
    cols:
      issue_id: {type: str, desc: "Issue record, e.g. ISS-000123"}
      supplier_id: {desc: "Supplier"}
      issue_type: {type: enum, values: [quality, delivery, cost, compliance, responsiveness, other], desc: "Type of issue"}
      description: {type: str, desc: "Issue description"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Severity level"}
      status: {type: enum, values: [open, investigating, in_progress, resolved, closed], desc: "Issue status"}
      assigned_to: {type: str, desc: "Employee assigned to resolve"}
      raised_date: {type: date, desc: "Date issue was raised"}
      target_resolution_date: {type: date, desc: "Target resolution date"}
      resolved_date: {type: date, desc: "When issue was resolved"}
      root_cause: {type: str, desc: "Root cause analysis"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_improvement_plans:
    key: plan_id
    cols:
      plan_id: {type: str, desc: "Improvement plan, e.g. SIP-000123"}
      supplier_id: {desc: "Supplier"}
      plan_name: {type: str, desc: "Name of the improvement initiative"}
      plan_type: {type: enum, values: [quality, delivery, cost, capacity, compliance, sustainability], desc: "Type of improvement"}
      focus_area: {type: str, desc: "Specific area to improve"}
      current_baseline: {type: str, desc: "Current performance baseline"}
      target_metric: {type: str, desc: "Target improvement metric"}
      target_value: {type: str, desc: "Target value to achieve"}
      start_date: {type: date, desc: "Start date"}
      target_completion_date: {type: date, desc: "Target completion date"}
      status: {type: enum, values: [planned, active, in_progress, completed, suspended], desc: "Plan status"}
      owner_supplier: {type: str, desc: "Supplier owner name"}
      owner_internal: {type: str, desc: "Internal owner employee"}
      progress_pct: {type: int, desc: "Progress percentage"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_performance_reviews:
    key: review_id
    cols:
      review_id: {type: str, desc: "Performance review, e.g. SPR-000123"}
      supplier_id: {desc: "Supplier"}
      review_period: {type: str, desc: "Period reviewed, e.g. Q3 2026"}
      scheduled_date: {type: date, desc: "Scheduled review date"}
      completed_date: {type: date, desc: "When review was completed"}
      status: {type: enum, values: [scheduled, in_progress, completed, cancelled], desc: "Review status"}
      meeting_outcome: {type: str, desc: "Outcome of meeting"}
      internal_owner: {type: str, desc: "Internal account manager"}
      created_at: {type: timestamp, desc: "When review was created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_engagement_plans:
    key: engagement_record_id
    cols:
      engagement_record_id: {type: str, desc: "Engagement record, e.g. ENG-000123"}
      supplier_id: {desc: "Supplier"}
      programme_type: {type: enum, values: [emissions, sustainability, innovation, quality], desc: "Type of engagement programme"}
      engagement_status: {type: enum, values: [invited, active, inactive, completed], desc: "Current engagement status"}
      invitation_sent_date: {type: date, desc: "When invitation was sent"}
      acceptance_date: {type: date, desc: "When supplier accepted"}
      programme_start_date: {type: date, desc: "When programme started"}
      target_date: {type: date, desc: "Target completion date"}
      has_science_based_target: {type: bool, desc: "Whether supplier has science-based targets"}
      progress_notes: {type: str, desc: "Progress notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_lead_times:
    key: [po_id, supplier_id]
    cols:
      po_id: {desc: "Purchase order"}
      supplier_id: {desc: "Supplier"}
      po_date: {type: date, desc: "PO date"}
      agreed_lead_time_days: {type: int, desc: "Agreed lead time in days"}
      actual_lead_time_days: {type: int, desc: "Actual lead time in days"}
      process_stage: {type: enum, values: [order_to_factory, factory_to_port, port_to_dc, total], desc: "Stage of lead time"}
      days_variance: {type: int, desc: "Actual minus agreed days"}
      status: {type: enum, values: [on_track, delayed, early, completed], desc: "Delivery status"}
      root_cause_delay: {type: str, desc: "If delayed, root cause"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_factory_capacity:
    key: [supplier_id, factory_name, capacity_month]
    cols:
      supplier_id: {desc: "Supplier"}
      factory_name: {type: str, desc: "Factory name or location"}
      capacity_month: {type: date, desc: "Start of month for this capacity"}
      total_capacity_units: {type: int, desc: "Total monthly capacity"}
      committed_capacity_units: {type: int, desc: "Committed to existing POs"}
      available_capacity_units: {type: int, desc: "Available for new orders"}
      capacity_utilization_pct: {type: float, desc: "% of capacity used"}
      is_alternative_source: {type: bool, desc: "Whether this is an alternative to main supplier"}
      lead_time_days: {type: int, desc: "Lead time from this factory"}
      cost_per_unit_gbp: {type: float, desc: "Cost per unit"}
      updated_at: {type: timestamp, desc: "Last updated"}

  provider_integrations:
    key: provider_id
    cols:
      provider_id: {type: str, desc: "3PL provider, e.g. 3PL-001"}
      provider_name: {type: str, desc: "Provider name"}
      edi_supported: {type: bool, desc: "Supports EDI integration"}
      api_supported: {type: bool, desc: "Supports API integration"}
      file_transfer_supported: {type: bool, desc: "Supports file transfer (SFTP/FTP)"}
      edi_standards: {type: str, desc: "EDI standards supported"}
      api_documentation_url: {type: str, desc: "API documentation link"}
      file_formats_supported: {type: str, desc: "File formats (CSV, XML, JSON)"}
      setup_cost_gbp: {type: float, desc: "One-time setup cost"}
      monthly_cost_gbp: {type: float, desc: "Monthly operating cost"}
      integration_time_weeks: {type: int, desc: "Time to integrate in weeks"}
      technical_contact: {type: str, desc: "Technical contact details"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: search_suppliers
    desc: Find suppliers by name, country or category; returns supplier ids.
    kind: select
    from: master.suppliers
    filters:
      name: {op: like, desc: "Words in supplier name, e.g. textile mill"}
      country: {op: like, desc: "Country name or code"}
      category: {op: like, desc: "Category name or code"}
    columns: [supplier_id, name, country, category, status]
    order: supplier_id
    limit: 50
    example: {category: fabric}

  - name: list_suppliers_for_category
    desc: Suppliers active in a category, sorted by spend. Use to see the supply base for sourcing decisions.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
    sql: |
      SELECT DISTINCT s.supplier_id, s.name, s.country, s.status,
             COUNT(DISTINCT po.po_id) as po_count,
             ROUND(SUM(CASE WHEN po.status NOT IN ('cancelled', 'draft') THEN po.total_value_gbp ELSE 0 END), 2) as total_spend_gbp
      FROM master.suppliers s
      LEFT JOIN master.purchase_orders po ON s.supplier_id = po.supplier_id
      LEFT JOIN master.po_lines pl ON po.po_id = pl.po_id
      LEFT JOIN master.products p ON pl.sku = p.sku
      WHERE p.category = $category AND s.status = 'active'
      GROUP BY s.supplier_id, s.name, s.country, s.status
      ORDER BY total_spend_gbp DESC
    limit: 30
    example: {category: apparel}

  - name: get_supplier_scorecard_history
    desc: Supplier's scorecard history by month, latest first. Shows quality, on-time delivery, cost and overall performance.
    kind: sql
    args:
      supplier_id: {required: true}
      months_back: {type: int, default: 12, desc: "Number of months to show"}
    sql: |
      SELECT supplier_id, scorecard_month, quality_score, on_time_delivery_pct,
             cost_performance_score, lead_time_days, agreed_lead_time_days,
             responsiveness_score, compliance_score, overall_score, status_category
      FROM supplier_scorecards
      WHERE supplier_id = $supplier_id
        AND scorecard_month >= CAST($as_of AS DATE) - INTERVAL (CAST($months_back AS INT) * 30) DAY
      ORDER BY scorecard_month DESC
    limit: 24
    example: {supplier_id: SUP-0001}

  - name: get_supplier_on_time_delivery_trend
    desc: On-time delivery percentage by month, latest first. Shows whether delivery performance is improving or deteriorating.
    kind: sql
    args:
      supplier_id: {required: true}
      months_back: {type: int, default: 6, desc: "Number of months to show"}
    sql: |
      SELECT supplier_id, scorecard_month, on_time_delivery_pct,
             LAG(on_time_delivery_pct) OVER (ORDER BY scorecard_month DESC) as prior_month_pct,
             ROUND(on_time_delivery_pct - LAG(on_time_delivery_pct) OVER (ORDER BY scorecard_month DESC), 1) as trend_change_pct
      FROM supplier_scorecards
      WHERE supplier_id = $supplier_id
        AND scorecard_month >= CAST($as_of AS DATE) - INTERVAL (CAST($months_back AS INT) * 30) DAY
      ORDER BY scorecard_month DESC
    limit: 12
    example: {supplier_id: SUP-0001}

  - name: get_supplier_issues_log
    desc: Open and recent issues for a supplier. Shows severity, type, assigned owner and status.
    kind: sql
    args:
      supplier_id: {required: true}
      status: {type: enum, values: [open, investigating, in_progress, resolved, closed], desc: "Filter by status (default all)"}
      days_back: {type: int, default: 180, desc: "Show issues raised in last N days"}
    sql: |
      SELECT issue_id, supplier_id, issue_type, severity, status, description,
             assigned_to, raised_date, target_resolution_date, resolved_date, root_cause
      FROM supplier_issues
      WHERE supplier_id = $supplier_id
        AND ($status IS NULL OR status = $status)
        AND raised_date >= CAST($as_of AS DATE) - INTERVAL CAST($days_back AS INT) DAY
      ORDER BY severity DESC, raised_date DESC
    limit: 30
    example: {supplier_id: SUP-0001}

  - name: get_supplier_lead_time_performance
    desc: Actual vs agreed lead time by process stage. Shows where delays occur (factory, port, transport).
    kind: sql
    args:
      supplier_id: {required: true}
      months_back: {type: int, default: 3, desc: "Months to analyse"}
    sql: |
      SELECT supplier_id, process_stage,
             COUNT(*) as po_count,
             ROUND(AVG(agreed_lead_time_days), 1) as avg_agreed_days,
             ROUND(AVG(actual_lead_time_days), 1) as avg_actual_days,
             ROUND(AVG(days_variance), 1) as avg_variance_days,
             ROUND(SUM(CASE WHEN days_variance > 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) as late_pct
      FROM supplier_lead_times
      WHERE supplier_id = $supplier_id
        AND po_date >= CAST($as_of AS DATE) - INTERVAL (CAST($months_back AS INT) * 30) DAY
      GROUP BY supplier_id, process_stage
      ORDER BY process_stage
    limit: 20
    example: {supplier_id: SUP-0001}

  - name: get_supplier_lead_time_breakdown
    desc: Average lead time by process stage (order to factory, factory to port, port to DC) for a supplier.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, process_stage,
             ROUND(AVG(actual_lead_time_days), 1) as avg_lead_time_days,
             ROUND(MIN(actual_lead_time_days), 0) as min_days,
             ROUND(MAX(actual_lead_time_days), 0) as max_days,
             ROUND(STDDEV_POP(actual_lead_time_days), 1) as variability_std_dev,
             COUNT(*) as data_points
      FROM supplier_lead_times
      WHERE supplier_id = $supplier_id AND status = 'completed'
      GROUP BY supplier_id, process_stage
      ORDER BY process_stage
    limit: 10
    example: {supplier_id: SUP-0001}

  - name: get_supplier_reaction_time
    desc: Average reaction time (in hours) to change requests, by quarter.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, scorecard_month,
             ROUND(responsiveness_score, 1) as responsiveness_score
      FROM supplier_scorecards
      WHERE supplier_id = $supplier_id
      ORDER BY scorecard_month DESC
    limit: 12
    example: {supplier_id: SUP-0001}

  - name: get_supplier_scorecard_comparison
    desc: Compare performance scorecards of multiple suppliers side-by-side for latest month.
    kind: sql
    args:
      supplier_ids: {required: true, desc: "Comma-separated supplier ids, e.g. SUP-0001,SUP-0002"}
    sql: |
      WITH latest_month AS (
        SELECT MAX(scorecard_month) as month FROM supplier_scorecards
      )
      SELECT supplier_id, scorecard_month, quality_score, on_time_delivery_pct,
             cost_performance_score, lead_time_days, responsiveness_score,
             compliance_score, overall_score, status_category
      FROM supplier_scorecards, latest_month
      WHERE scorecard_month = latest_month.month
        AND POSITION(supplier_id IN $supplier_ids) > 0
      ORDER BY overall_score DESC
    limit: 20
    example: {supplier_ids: "SUP-0001,SUP-0002,SUP-0003"}

  - name: get_supplier_management_cost
    desc: Estimated cost to manage a supplier (team time, audits, systems, travel).
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id,
             CASE
               WHEN (SELECT COUNT(*) FROM master.purchase_orders WHERE supplier_id = $supplier_id AND status NOT IN ('cancelled', 'draft')) > 50 THEN 25000
               WHEN (SELECT COUNT(*) FROM master.purchase_orders WHERE supplier_id = $supplier_id AND status NOT IN ('cancelled', 'draft')) > 20 THEN 18000
               ELSE 12000
             END as estimated_annual_cost_gbp,
             'Cost estimate based on volume and complexity' as formula
      LIMIT 1
    limit: 1
    example: {supplier_id: SUP-0001}

  - name: get_supplier_concentration_by_category
    desc: Percentage of category spend from top suppliers. Shows concentration risk.
    kind: sql
    args:
      category: {required: true}
    sql: |
      WITH supplier_category_spend AS (
        SELECT s.supplier_id, s.name, p.category,
               ROUND(SUM(po.total_value_gbp), 2) as spend_gbp
        FROM master.suppliers s
        JOIN master.purchase_orders po ON s.supplier_id = po.supplier_id
        JOIN master.po_lines pl ON po.po_id = pl.po_id
        JOIN master.products p ON pl.sku = p.sku
        WHERE p.category = $category AND po.status NOT IN ('cancelled', 'draft')
        GROUP BY s.supplier_id, s.name, p.category
      ),
      total_spend AS (
        SELECT SUM(spend_gbp) as total_gbp FROM supplier_category_spend
      )
      SELECT supplier_id, name, spend_gbp,
             ROUND(spend_gbp * 100.0 / (SELECT total_gbp FROM total_spend), 1) as pct_of_category
      FROM supplier_category_spend
      ORDER BY spend_gbp DESC
    limit: 20
    example: {category: apparel}

  - name: calculate_supplier_segmentation_score
    desc: Score suppliers for invest, maintain or exit based on spend, performance and criticality.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      WITH latest_scorecard AS (
        SELECT supplier_id, overall_score, on_time_delivery_pct
        FROM supplier_scorecards
        WHERE supplier_id = $supplier_id
        ORDER BY scorecard_month DESC
        LIMIT 1
      ),
      spend_data AS (
        SELECT s.supplier_id, COUNT(DISTINCT po.po_id) as po_count,
               ROUND(SUM(po.total_value_gbp), 2) as annual_spend_gbp
        FROM master.suppliers s
        LEFT JOIN master.purchase_orders po ON s.supplier_id = po.supplier_id
        WHERE s.supplier_id = $supplier_id AND po.status NOT IN ('cancelled', 'draft')
        GROUP BY s.supplier_id
      )
      SELECT supplier_id,
             ROUND((COALESCE((SELECT overall_score FROM latest_scorecard), 50) * 0.5) +
                   (COALESCE(CASE WHEN (SELECT annual_spend_gbp FROM spend_data) > 100000 THEN 30 ELSE 20 END, 0)) +
                   (CASE WHEN (SELECT po_count FROM spend_data) > 20 THEN 20 ELSE 10 END), 0) as segmentation_score,
             CASE
               WHEN (COALESCE((SELECT overall_score FROM latest_scorecard), 50) > 75) AND (SELECT annual_spend_gbp FROM spend_data) > 50000 THEN 'Invest'
               WHEN (COALESCE((SELECT overall_score FROM latest_scorecard), 50) < 40) THEN 'Exit'
               ELSE 'Maintain'
             END as recommendation,
             'score = (performance * 0.5) + (spend * 0.3) + (volume * 0.2)' as formula
      LIMIT 1
    limit: 1
    example: {supplier_id: SUP-0001}

  - name: get_dual_sourcing_cost_estimate
    desc: Cost and lead time to qualify a second source for a product category.
    kind: sql
    args:
      category: {required: true}
      existing_supplier_id: {required: true}
    sql: |
      SELECT $category as category,
             $existing_supplier_id as existing_supplier,
             (SELECT supplier_id FROM master.suppliers WHERE status = 'active' AND supplier_id != $existing_supplier_id LIMIT 1) as alternative_supplier_id,
             50000 as qualification_cost_gbp,
             30 as qualification_time_days,
             (SELECT ROUND(AVG(lead_time_days), 0) FROM supplier_lead_times
              WHERE supplier_id = (SELECT supplier_id FROM master.suppliers WHERE status = 'active' AND supplier_id != $existing_supplier_id LIMIT 1)) as alternative_lead_time_days,
             'Cost includes samples, trials, audits' as cost_breakdown,
             'Time to full qualification and first PO' as time_note
    limit: 1
    example: {category: apparel, existing_supplier_id: SUP-0001}

  - name: get_alternative_factory_capacity
    desc: Spare capacity at alternative factories if current supplier hits constraints.
    kind: sql
    args:
      supplier_id: {required: true}
      required_units: {type: int, default: 10000, desc: "Units needed per month"}
    sql: |
      SELECT supplier_id, factory_name, capacity_month,
             total_capacity_units, committed_capacity_units,
             available_capacity_units, capacity_utilization_pct,
             lead_time_days, cost_per_unit_gbp,
             ROUND(available_capacity_units * cost_per_unit_gbp, 2) as available_value_gbp
      FROM supplier_factory_capacity
      WHERE supplier_id = $supplier_id
        AND is_alternative_source = true
        AND available_capacity_units >= $required_units
      ORDER BY capacity_month DESC
    limit: 20
    example: {supplier_id: SUP-0001, required_units: 5000}

  - name: get_3pl_integration_capabilities
    desc: Integration methods a 3PL provider supports and technical details, costs and timelines.
    kind: select
    from: provider_integrations
    filters:
      provider_name: {op: like}
      edi_supported: {}
      api_supported: {}
      file_transfer_supported: {}
    columns: [provider_id, provider_name, edi_supported, api_supported, file_transfer_supported,
              edi_standards, setup_cost_gbp, monthly_cost_gbp, integration_time_weeks, technical_contact]
    order: provider_id
    limit: 20
    example: {api_supported: true}

  - name: get_supplier_engagement_status
    desc: Engagement history on emissions and sustainability programmes for a supplier.
    kind: select
    from: supplier_engagement_plans
    filters:
      supplier_id: {}
      programme_type: {}
    columns: [engagement_record_id, supplier_id, programme_type, engagement_status, invitation_sent_date,
              acceptance_date, programme_start_date, has_science_based_target, progress_notes]
    order: programme_start_date
    limit: 20
    example: {supplier_id: SUP-0001}

  - name: get_supplier_improvement_programme_history
    desc: Past improvement programmes and results (quality, delivery, cost).
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT plan_id, supplier_id, plan_name, plan_type, focus_area,
             current_baseline, target_value, start_date, target_completion_date,
             status, progress_pct, owner_internal
      FROM supplier_improvement_plans
      WHERE supplier_id = $supplier_id
      ORDER BY start_date DESC
    limit: 30
    example: {supplier_id: SUP-0001}

  - name: create_supplier_performance_review
    desc: Opens a supplier performance review record and schedules the review. Returns the new review.
    kind: insert
    table: supplier_performance_reviews
    id_prefix: SPR-
    defaults: {status: scheduled}
    args:
      supplier_id: {required: true}
      review_period: {required: true, desc: "Period reviewed, e.g. Q3 2026"}
      scheduled_date: {required: true, type: date, desc: "When the review will be held"}
      internal_owner: {required: true, desc: "Account manager employee id"}
    example: {supplier_id: SUP-0001, review_period: "Q4 2026", scheduled_date: "+14d", internal_owner: "EMP-0042"}

  - name: create_supplier_improvement_plan
    desc: Opens a formal improvement plan with targets and dates for a supplier. Returns the new plan.
    kind: insert
    table: supplier_improvement_plans
    id_prefix: SIP-
    defaults: {status: planned, progress_pct: 0}
    args:
      supplier_id: {required: true}
      plan_name: {required: true, desc: "Name of the improvement initiative"}
      plan_type: {required: true, type: enum, values: [quality, delivery, cost, capacity, compliance, sustainability]}
      focus_area: {required: true, desc: "Specific area to improve"}
      current_baseline: {required: true, desc: "Current performance baseline"}
      target_value: {required: true, desc: "Target value to achieve"}
      start_date: {type: date, default: "+0d", desc: "Start date"}
      target_completion_date: {required: true, type: date, desc: "Target completion date"}
      owner_internal: {required: true, desc: "Internal owner employee"}
    example: {supplier_id: SUP-0001, plan_name: "Lead time reduction", plan_type: delivery, focus_area: "Factory to port time", current_baseline: "28 days", target_value: "21 days", target_completion_date: "+90d", owner_internal: "EMP-0042"}

  - name: create_supplier_issue_record
    desc: Logs an issue and owner against a supplier. Returns the new issue record.
    kind: insert
    table: supplier_issues
    id_prefix: ISS-
    defaults: {status: open}
    args:
      supplier_id: {required: true}
      issue_type: {required: true, type: enum, values: [quality, delivery, cost, compliance, responsiveness, other]}
      description: {required: true, desc: "Issue description"}
      severity: {required: true, type: enum, values: [low, medium, high, critical]}
      assigned_to: {required: true, desc: "Employee id to own resolution"}
      target_resolution_date: {type: date, default: "+30d", desc: "Target resolution date"}
    example: {supplier_id: SUP-0001, issue_type: delivery, description: "Missed PO-2026-004512 by 5 days", severity: high, assigned_to: "EMP-0042", target_resolution_date: "+14d"}

  - name: block_supplier_for_new_orders
    desc: Places a hold on a supplier so no new purchase orders can be raised. Returns confirmation.
    kind: update
    table: master.suppliers
    set: {status: blocked}
    args:
      reason_for_block: {required: true, desc: "Reason for blocking"}
    example: {supplier_id: SUP-0001, reason_for_block: "Pending quality review"}

  - name: update_supplier_status
    desc: Changes a supplier's relationship status (watch, planned exit, active). Returns old and new status.
    kind: update
    table: master.suppliers
    set: {status: "{status}"}
    args:
      status: {required: true, type: enum, values: [active, watch, planned_exit, blocked], desc: "New status"}
    example: {supplier_id: SUP-0001, status: watch}

  - name: create_supplier_engagement_plan
    desc: Add suppliers to the emissions engagement programme. Returns the new engagement plan.
    kind: insert
    table: supplier_engagement_plans
    id_prefix: ENG-
