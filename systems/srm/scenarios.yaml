  story: Feature engineering for delay prediction. Supplier scorecard history provides past performance on on-time delivery %, lead time variance, responsiveness. Latest scorecards show on-time delivery ranging 58-85%, lead time variance 2-5 days. This historical data supports building features for ML model.
