- question: "05:45:Q7"
  story: Top suppliers for emissions engagement. Suppliers SUP-0002 and SUP-0003 are already active in emissions programme (ENG-000001, ENG-000002) with science-based targets. SUP-0004 invited (ENG-000003). SUP-0005 in sustainability programme (ENG-000004). SUP-0001 was in programme but withdrew (ENG-000005, inactive).
  checks:
