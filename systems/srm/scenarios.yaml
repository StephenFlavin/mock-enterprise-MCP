- question: "04:35:Q6"
  story: Lead time reduction programme with Supplier A (SUP-0001). Improvement plan SIP-000001 is in progress targeting 21-day lead time (from 28 days). Breakdown shows order_to_factory 8 days variance (should be reduced), factory_to_port and port_to_dc on target. Programme started 2026-07-15, target completion 2026-10-15.
  checks:
