- question: "05:50:Q2"
  story: Port closure scenario - southern Vietnam port. Supplier SUP-0001 has factory capacity data showing main factory in Vietnam (50,000 units, 84% utilized) and alternative in Thailand (35,000 units, 80% utilized, available 7,000 units). Alternative lead time 32 days vs 28 days from Vietnam.
  checks:
    - tool: get_alternative_factory_capacity
      args: {supplier_id: SUP-0001, required_units: 5000}
      expect: ["supplier_id", "SUP-0001", "Thailand", "7000", "available_capacity"]

- question: "05:50:Q4"
  story: Single points of failure and concentration. In apparel category, top 3 suppliers control supply. Concentration data shows SUP-0002 and SUP-0003 are strategic high-value suppliers. Dual sourcing estimates show cost and lead time to qualify alternative (e.g., 50k cost, 30 days lead time). Concentration risk by category helps identify where consolidation is highest.
  checks:
    - tool: get_supplier_concentration_by_category
      args: {category: apparel}
      expect: ["supplier_id", "pct_of_category", "spend_gbp"]
    - tool: get_dual_sourcing_cost_estimate
      args: {category: apparel, existing_supplier_id: SUP-0002}
      expect: ["qualification_cost_gbp", "50000", "qualification_time_days", "30"]

