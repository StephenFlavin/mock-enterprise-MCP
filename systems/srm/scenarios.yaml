- question: "03:24:Q1"
  story: Supplier SUP-0001 has deteriorating performance with on-time delivery dropping from 68% in July to 58% in October. Lead times have slipped from 28 to 40 days. The seed data shows 6 of their last 10 POs were late (PO-2026-004512 was 5 days late). An open performance review is scheduled for Q4.
  checks:
    - tool: get_supplier_on_time_delivery_trend
      args: {supplier_id: SUP-0001, months_back: 4}
      expect: ["58", "60", "65", "68", "trend_change"]
    - tool: get_supplier_scorecard_history
      args: {supplier_id: SUP-0001, months_back: 4}
      expect: ["40", "58", "probation", "at_risk"]
    - tool: get_supplier_lead_time_performance
      args: {supplier_id: SUP-0001}
      expect: ["late", "delayed", "2026"]

- question: "04:32:Q3"
  story: Three suppliers are compared for bedding sourcing - SUP-0002 (excellent, 85+ overall score), SUP-0003 (strategic, 87+ overall), and SUP-0004 (good, 76 overall). The data shows their latest monthly scorecards for quality, OTD, cost and lead times to support the comparison.
  checks:
    - tool: list_suppliers_for_category
      args: {category: apparel}
      expect: ["supplier", "SUP-", "total_spend"]
    - tool: get_supplier_scorecard_comparison
      args: {supplier_ids: "SUP-0002,SUP-0003,SUP-0004"}
      expect: ["SUP-0002", "SUP-0003", "SUP-0004", "overall_score"]
    - tool: get_supplier_lead_time_performance
      args: {supplier_id: SUP-0003}
      expect: ["lead_time", "days"]

- question: "04:32:Q6"
  story: Supplier SUP-0001 is in trouble with declining performance and open issues (ISS-000001 delivery high severity, ISS-000002 delivery high severity, ISS-000003 quality). Supplier SUP-0006 has quality issues (ISS-000005 defect rate high). The query returns both as at-risk status in their latest scorecards.
  checks:
    - tool: get_supplier_on_time_delivery_trend
      args: {supplier_id: SUP-0001}
      expect: ["58", "60", "65", "prior_month_pct"]
    - tool: get_supplier_issues_log
      args: {supplier_id: SUP-0001}
      expect: ["ISS-", "delivery", "high", "investigating"]
    - tool: get_supplier_issues_log
      args: {supplier_id: SUP-0006}
      expect: ["ISS-", "quality", "high"]

- question: "04:32:Q7"
  story: Annual review for cookware supplier. Supplier SUP-0002 has consistent high performance across Q3 with scorecard showing 85+ overall score, 82+ on-time delivery. Seed data plants performance review SPR-000002 scheduled for 2026-09-25. History shows 12 months of data with quality score 85-88, OTD 82-85%, cost 79-82.
  checks:
    - tool: get_supplier_scorecard_history
      args: {supplier_id: SUP-0002, months_back: 12}
      expect: ["SUP-0002", "85", "82", "83", "84", "overall_score"]
    - tool: search_suppliers
      args: {category: cookware}
      expect: ["supplier", "SUP-"]

- question: "04:34:Q4"
  story: Comparing Morocco vs Turkey nearshore suppliers. Lead time performance data shows typical Asian supplier (e.g., SUP-0001 Vietnam 28 days agreed, actual 33-40 days). Nearshore equivalent would show shorter lead times. Seed data plants lead time breakdown for order to factory, factory to port, and port to DC stages.
  checks:
    - tool: get_supplier_lead_time_breakdown
      args: {supplier_id: SUP-0001}
      expect: ["order_to_factory", "factory_to_port", "port_to_dc", "avg_lead_time_days"]

- question: "04:34:Q6"
  story: Comparing nearshore pilot suppliers (e.g., SUP-0004, SUP-0005) against Asian suppliers (SUP-0001, SUP-0002, SUP-0003). Scorecard data shows comparison on quality (nearshore 75+, Asian 85+), on-time delivery (both 80%+), and reaction time scores.
  checks:
    - tool: get_supplier_scorecard_comparison
      args: {supplier_ids: "SUP-0004,SUP-0005,SUP-0001,SUP-0003"}
      expect: ["overall_score", "quality_score", "on_time_delivery"]
    - tool: get_supplier_reaction_time
      args: {supplier_id: SUP-0004}
      expect: ["responsiveness_score", "scorecard_month"]

- question: "04:35:Q1"
  story: Supplier SUP-0001 has slipped on delivery and quality for 2 quarters. Scorecards show overall score declining from 68 in July to 58 in October. Quality issues (ISS-000001, ISS-000002, ISS-000003) are logged. Improvement plan SIP-000001 is in progress targeting 90% OTD by 2026-10-15. Performance review SPR-000001 completed in Sept showed issues identified.
  checks:
    - tool: get_supplier_scorecard_history
      args: {supplier_id: SUP-0001, months_back: 6}
      expect: ["SUP-0001", "58", "60", "probation", "at_risk"]
    - tool: get_supplier_issues_log
      args: {supplier_id: SUP-0001}
      expect: ["ISS-000001", "ISS-000002", "ISS-000003", "high", "delivery"]
    - tool: get_supplier_improvement_programme_history
      args: {supplier_id: SUP-0001}
      expect: ["SIP-000001", "Lead time", "90%"]
    - tool: update_supplier_status
      args: {supplier_id: SUP-0001, status: watch}
      expect: ["old", "new", "status"]

- question: "04:35:Q3"
  story: Consolidation scoring. Supplier SUP-0002 and SUP-0003 are strategic (high score, high spend) - recommend "Invest". Supplier SUP-0001 has low score (58) - recommend "Exit". Supplier SUP-0006 improving but still at_risk - recommend "Maintain". Management costs range from 12k to 25k annually based on volume.
  checks:
    - tool: get_supplier_scorecard_history
      args: {supplier_id: SUP-0002}
      expect: ["85", "86", "87", "strategic"]
    - tool: get_supplier_scorecard_history
      args: {supplier_id: SUP-0001}
      expect: ["58", "55", "probation"]
    - tool: calculate_supplier_segmentation_score
      args: {supplier_id: SUP-0002}
      expect: ["Invest", "segmentation_score", "formula"]
    - tool: calculate_supplier_segmentation_score
      args: {supplier_id: SUP-0001}
      expect: ["Exit", "segmentation_score"]
    - tool: get_supplier_management_cost
      args: {supplier_id: SUP-0001}
      expect: ["estimated_annual_cost_gbp", "12000"]

- question: "04:35:Q5"
  story: Q3 business review for Supplier T (SUP-0002). Scorecard history shows strong performance with quality 85 or more, OTD 82 or more, compliance 87 or more, overall 83 or more. Issues log is clean (only historical resolved issue). Performance review SPR-000002 completed showing strong partnership expansion.
  checks:
