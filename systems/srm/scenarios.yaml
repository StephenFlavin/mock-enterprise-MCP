- question: "04:38:Q6"
  story: Contract breach scenario. Supplier SUP-0001 missed critical delivery PO-2026-004512 by 5 days. Scorecard history shows deterioration. Relationship is at risk but not irretrievable.
  checks:
    - tool: get_supplier_scorecard_history
      args: {supplier_id: SUP-0001}
      expect: ["58", "probation", "at_risk"]
    - tool: get_supplier_lead_time_performance
      args: {supplier_id: SUP-0001}
