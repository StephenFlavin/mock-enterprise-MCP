# One entry per question row that uses this system's tools (see: python -m mockmcp brief carrier_portal).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:11:Q1"
  story: >
    This week CAR-002 (Midshires Transport) has a driver shortage on the Scotland routes, so loads on DC1-ST215 (ALR-900011)
    and DC1-ST214 (ALR-900012) run a day late, and CAR-003 has A1 closures that slow Newcastle loads on DC1-ST148 (ALR-900013).
    CAR-002 also announced an 8% fuel surcharge (ALR-900002) against a 5.5% general rate increase from January (ALR-900041).
  checks:
    - tool: search_carrier_service_alerts
      args: {}
      expect: ["ALR-900011", "DC1-ST215", "ALR-900012", "DC1-ST214", "ALR-900013", "DC1-ST148", "Driver shortage"]
    - tool: search_carrier_service_alerts
      args: {alert_type: surcharge, carrier_id: CAR-002}
      expect: ["ALR-900002", "8"]

- question: "02:11:Q2"
  story: >
    Northern drops are DC1-ST150 Leeds, DC1-ST151 Manchester, DC1-ST148 Newcastle and DC1-ST207 Glasgow. The three road carriers
    quote about 14 to 15 pounds a pallet on the first three and 24 to 26 on Glasgow (the same as the transport system's lane rates).
    Pallet Exchange publishes 13.70 to 14.50 and 22.80 on Glasgow, 96.2% on-time over the year but only 91.4% in peak, on a 12-month
    term with 90 days' notice and a 400 pallet a month minimum.
  checks:
    - tool: get_carrier_rate_card
      args: {lanes: "DC1-ST150,DC1-ST151,DC1-ST148,DC1-ST207", service_type: standard}
      expect: ["CAR-001", "CAR-002", "CAR-003", "14.6", "14.2", "15.2", "25.7", "per pallet"]
    - tool: get_pallet_network_rate_card
      args: {network_name: "Pallet Exchange", lanes: "DC1-ST150,DC1-ST151,DC1-ST148,DC1-ST207"}
      expect: ["13.9", "13.7", "14.5", "22.8", "96.2", "91.4", "90 days' notice", "400 pallets"]

- question: "02:11:Q4"
  story: >
    The planner asks CAR-001 for 25 extra pallets a week on DC1-ST215 (Dundee) for Black Friday and Christmas weeks, where the
    contracted capacity is short. The request is stored with today's date and status requested. Earlier requests exist on other lanes.
  checks:
    - tool: send_capacity_request_to_carrier
      args: {carrier_id: CAR-001, lane: DC1-ST215, weeks_needed: "weeks 48 and 51-52", units_requested: 25}
      expect: ["REQ-", "CAR-001", "DC1-ST215", "weeks 48 and 51-52", "25", "requested"]

- question: "02:12:Q2"
  story: >
    Carrier A is CAR-010 (Atlas Logistics Partners, contract ends in January per the contracts system), B is CAR-006 (Pacific Star
    Shipping) and C is CAR-007 (Meridian Ocean Lines). On Asia-Europe over 12 months A has 81.0% reliability and 9.6% roll rate at
    a 3,050 pound standard rate, B 72.4% and 19.0% at 2,780 pounds, C 76.8% and 15.5% at 2,860 pounds; shares are about 28/30/27%.
  checks:
    - tool: get_carrier_schedule_reliability
      args: {lane: Asia-Europe}
      expect: ["CAR-010", "81", "72.4", "76.8"]
    - tool: get_roll_rate_by_carrier_and_lane
      args: {lane: Asia-Europe}
      expect: ["CAR-006", "19", "15.5", "9.6"]
    - tool: get_carrier_share_of_volume
      args: {lane: Asia-Europe}
      expect: ["27.7", "30.1", "27.2"]
    - tool: compare_carrier_performance
      args: {lane: Asia-Europe, carrier_ids: "CAR-010,CAR-006,CAR-007"}
      expect: ["3050", "2780", "2860", "per 40ft container"]

- question: "02:12:Q4"
  story: >
    Last quarter 78 of 430 Asia-Europe bookings (18%) were rolled. CAR-006 (Pacific Star Shipping) rolled 26.2% and CAR-007
    (Meridian Ocean Lines) 21.7%, far above CAR-010 and CAR-005 at 10%.
  checks:
    - tool: get_roll_rate_by_carrier_and_lane
      args: {lane: Asia-Europe, period: last_quarter}
      expect: ["CAR-006", "26.2", "CAR-007", "21.7", "ALL", "18.1"]

- question: "02:12:Q5"
  story: >
    Blank sailings on Asia-Europe: CAR-005 omits Rotterdam (ALR-900001), CAR-006 cancels Hamburg (ALR-900021) and CAR-007 cancels
    Rotterdam (ALR-900022). Surcharges: CAR-005 12.5% Red Sea (ALR-900003), CAR-007 6% bunker (ALR-900032), CAR-006 400 pounds a
    container peak season (ALR-900031).
  checks:
    - tool: search_carrier_blank_sailing_notices
      args: {lane: Asia-Europe}
      expect: ["ALR-900001", "NLRTM", "ALR-900021", "DEHAM", "ALR-900022"]
    - tool: search_carrier_surcharge_announcements
      args: {lane: Asia-Europe}
      expect: ["12.5", "400", "gbp_per_container", "ALR-900032"]

- question: "02:16:Q3"
  story: >
    Peak courier commitments per week are 24,500 parcels in UK North and 7,500 in Scotland, the regions where forecast demand is
    highest relative to commitments, against 43,500 in UK South. DoorStep Couriers (CAR-013) has the earliest peak cut-offs
    (13:30 in UK North).
  checks:
    - tool: get_courier_capacity_commitments
      args: {}
      expect: ["24500", "7500", "43500", "25500"]
    - tool: get_courier_cut_off_times
      args: {region: UK North}
      expect: ["CAR-013", "13:30", "15:00", "15:30"]

- question: "02:20:Q1"
  story: >
    The relationship manager disputes 18,450 pounds of fuel surcharge billed by CAR-002 above the contracted rate across the last
    12 months. Earlier disputes exist for CAR-001 and CAR-003.
  checks:
    - tool: submit_carrier_invoice_dispute
      args: {carrier_id: CAR-002, period_from: "-365d", dispute_reason: "Fuel surcharge billed above contracted rate", disputed_amount_gbp: 18450}
      expect: ["DIS-", "CAR-002", "18450", "Fuel surcharge", "submitted"]

- question: "02:20:Q4"
  story: >
    Eleven carriers announced increases effective from January or February: DoorStep Couriers (CAR-013) 8.2%, Pennine Freight
    (CAR-003) 7.0%, ParcelPoint Express (CAR-012) 6.5%, Oceanic Container Line 6.0%, SwiftParcel 5.9%, Midshires 5.5%, Northline 4.0%.
  checks:
    - tool: search_carrier_rate_increase_announcements
      args: {}
      expect: ["ALR-900048", "8.2", "ALR-900042", "7", "ALR-900047", "6.5", "ALR-900004"]

- question: "02:20:Q5"
  story: >
    CAR-002 (Carrier B) had 20 claims in the last quarter against 9 the quarter before. Ten of the recent claims are
    K-1700 glass kettles in cartons, 16 are dispatched from DC1 and 16 are cartons, and lanes DC1-ST215 and DC1-ST214 carry 16 of
    20. Draft claims CLM-900016 to CLM-900020 are waiting to be sent to the carrier.
  checks:
    - tool: list_damage_claims_by_carrier
      args: {carrier_id: CAR-002}
      expect: ["CLM-900020", "K-1700", "carton", "DC1-ST215", "draft"]
    - tool: get_damage_claims_by_dimension
      args: {carrier_id: CAR-002}
      expect: ["DC1", "Northampton DC", "K-1700", "carton", "DC1-ST215", "DC1-ST214"]
    - tool: list_damage_claims_by_carrier
      args: {carrier_id: CAR-002, date_from: "-180d", date_to: "-91d"}
      expect: ["CLM-900021", "CLM-900029"]
    - tool: submit_carrier_damage_claim
      args: {claim_id: CLM-900020}
      expect: ["CLM-900020", "draft", "submitted"]

- question: "04:40:Q3"
  story: >
    For glass items CAR-002 (Midshires Transport) damages 4.15% of shipments on DC1-ST215 and 3.9% on DC1-ST214 against 1.7% on its
    other lanes, 1.5% for CAR-003 and 0.5% for CAR-001. Its glass claims are cartons from DC1 (K-1700 kettles, glass drinkware).
  checks:
    - tool: get_carrier_damage_rates
      args: {product_group: glass}
      expect: ["CAR-002", "DC1-ST215", "4.15", "3.9", "CAR-003", "1.46", "CAR-001", "0.49"]
    - tool: list_damage_claims_by_carrier
      args: {carrier_id: CAR-002, sku: K-1700}
      expect: ["K-1700", "carton", "Glass Kettle"]

- question: "08:74:Q2"
  story: >
    On parcel lane DC2-GB the three parcel carriers have peak daily capacity: SwiftParcel (CAR-011) 15,000, ParcelPoint Express
    (CAR-012) 18,000 and DoorStep Couriers (CAR-013) a flat 16,000 with no peak flex. In the last two weeks before Christmas
    CAR-013 has only 1 to 3% headroom left against about 15 to 17% for the others, so it is the weakest link.
  checks:
    - tool: get_carrier_capacity_by_day
      args: {lane: DC2-GB, carrier_id: CAR-013, date_from: "+67d", date_to: "+80d"}
      expect: ["CAR-013", "DoorStep Couriers", "16000", "headroom_pct"]
    - tool: get_carrier_capacity_by_day
      args: {lane: DC2-GB, date_from: "+67d", date_to: "+80d"}
      expect: ["CAR-011", "15000", "CAR-012", "18000"]
    - tool: send_capacity_request_to_carrier
      args: {carrier_id: CAR-013, lane: DC2-GB, weeks_needed: "weeks 51-52", units_requested: 3000}
      expect: ["REQ-", "CAR-013", "DC2-GB", "weeks 51-52", "3000", "requested"]

- question: "08:75:Q1"
  story: >
    Wholesale customer PTN-001's last four orders (ORD-900070 to ORD-900073, as in the oms system). Carrier delivery records show
    three delivered as loaded (CAR-001) and ORD-900071 (600 units, CAR-003 Pennine Freight) lost: no proof of delivery, 0 delivered.
    A claim is filed against CAR-003 for the lost order at its value of 19200.
  checks:
    - tool: get_carrier_delivery_record_for_order
      args: {order_id: "ORD-900071"}
      expect: ["DLV-900002", "CAR-003", "lost", "600", "DC1-UK South"]
    - tool: get_carrier_delivery_record_for_order
      args: {order_id: "ORD-900072"}
      expect: ["DLV-900003", "arrived", "650"]
    - tool: create_carrier_claim
      args: {carrier_id: CAR-003, order_ref: "ORD-900071", lane: "DC1-UK South", sku: "SKU-100469", package_type: "pallet", amount_gbp: 19200, claim_notes: "600 units lost in transit, no proof of delivery"}
      expect: ["CLM-", "submitted", "ORD-900071", "19200"]

- question: "09:82:Q1"
  story: >
    Ocean transit slips against the carrier quote: CAR-006 (Pacific Star Shipping) averages 25.6 days against 23 quoted on Asia-UK
    and CAR-010 24.1 against 23, while CAR-005 is close to quote at 23.6.
  checks:
    - tool: get_carrier_eta_vs_actual_by_lane
      args: {lane: Asia-UK}
      expect: ["CAR-006", "25.6", "23.6", "slippage_days", "2.6", "4.4"]

- question: "09:88:Q6"
  story: >
    Overall scorecard: CAR-001 (Northline Haulage) is the most reliable road carrier at 98.5% reliability with 0.5% roll rate,
    CAR-002 at 89.8% and CAR-003 at 85.6%.
  checks:
    - tool: get_carrier_performance
      args: {carrier_id: CAR-001}
      expect: ["98.5", "98.3", "0.5"]
    - tool: get_carrier_performance
      args: {mode: road}
      expect: ["CAR-001", "98.5", "89.8", "CAR-003", "85.6", "1.57"]
    - tool: compare_carrier_performance
      args: {lane: DC1-ST150}
      expect: ["CAR-001", "98.4", "88.6", "81.7", "14.6"]
