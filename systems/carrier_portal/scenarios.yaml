# One entry per question row that uses this system's tools (see: python -m mockmcp brief carrier_portal).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:11:Q1"
  story: >
    This week, CAR-001 has a blank sailing (ALR-900001) on Asia-UK route announced, and
    CAR-002 has an 8% fuel surcharge (ALR-900002) on Leeds-Manchester.
    Transport planner needs to find these alerts and understand lane impact.
  checks:
    - tool: search_carrier_service_alerts
      args: {carrier_id: CAR-001, alert_type: blank_sailing}
      expect: ["Asia-UK", "blank_sailing", "ALR-900001"]
    - tool: search_carrier_service_alerts
      args: {carrier_id: CAR-002, alert_type: surcharge}
      expect: ["Leeds-Manchester", "surcharge", "8.0", "ALR-900002"]

- question: "02:11:Q2"
  story: >
    Transport planner evaluates pallet networks for northern region (Leeds-Manchester).
    CAR-001 rate for this lane is £0.75/unit standard (RC-900001), and pallet networks
    offer £21-25.50/pallet with 94-97% on-time. Pallet Exchange is premium at £22.50 with 96.2% on-time (PNR-900001).
  checks:
    - tool: get_carrier_rate_card
      args: {carrier_id: CAR-001, lane: "Leeds-Manchester"}
      expect: ["0.75", "RC-900001", "active"]
    - tool: get_pallet_network_rate_card
      args: {network_name: "Pallet Exchange", lane: "Leeds-Manchester"}
      expect: ["22.50", "96.2", "PNR-900001"]
    - tool: get_pallet_network_rate_card
      args: {network_name: "National Pallet", lane: "Leeds-Manchester"}
      expect: ["21.00", "94.1"]

- question: "02:11:Q4"
  story: >
    For Black Friday/Christmas capacity planning, CAR-001 is requested for 500 units
    weeks 45-46 on Leeds-Manchester (REQ-900001 confirmed), and 600 units weeks 49-50 (REQ-900004).
    CAR-001 has capacity of 400-700 units on peak dates with availability varying 50-400 units.
  checks:
    - tool: send_capacity_request_to_carrier
      args: {carrier_id: CAR-001, lane: "Leeds-Manchester", weeks_needed: "weeks 45-46", units_requested: 500}
      expect: ["REQ-", "requested", "500"]
    - tool: get_carrier_capacity_by_day
      args: {carrier_id: CAR-001, lane: "Leeds-Manchester"}
      expect: ["Leeds-Manchester", "700", "CAP-", "capacity_units"]

- question: "02:12:Q2"
  story: >
    Freight forwarder evaluates carriers for contract renewal on Asia-UK lane.
    CAR-001 has 94.2% reliability, 92.1% on-time, 2.1% roll rate, 0.8% damage rate with 32.5% volume share (CP-900006).
    CAR-005 has 92.5% reliability, 89.5% on-time, 4.2% roll rate (CP-900007).
    Pallet networks not relevant for ocean but rate cards show CAR-001 at £150/unit vs CAR-005 at £155.
  checks:
    - tool: get_carrier_schedule_reliability
      args: {carrier_id: CAR-001, lane: "Asia-UK"}
      expect: ["94.2", "2.1", "CP-900006"]
    - tool: get_roll_rate_by_carrier_and_lane
      args: {carrier_id: CAR-005, lane: "Asia-UK"}
      expect: ["4.2", "CAR-005"]
    - tool: get_carrier_share_of_volume
      args: {carrier_id: CAR-001, lane: "Asia-UK"}
      expect: ["32.5", "92.1"]
    - tool: compare_carrier_performance
      args: {lane: "Asia-UK", period: "last_12m"}
      expect: ["94.2", "CAR-001"]

- question: "02:12:Q4"
  story: >
    Freight forwarder reviews 18% roll rate on Asia-Europe. Looking at roll rates by carrier,
    CAR-004 and CAR-008 show elevated roll rates (7.8-12.3% range) on relevant lanes.
    Roll rate data is in CP-900005 (CAR-007 18%) and CP-900008 (CAR-008 7.8%) for Asia-UK.
  checks:
    - tool: get_roll_rate_by_carrier_and_lane
      args: {carrier_id: CAR-007, lane: "Asia-UK"}
      expect: ["18.0", "CP-900005"]
    - tool: get_roll_rate_by_carrier_and_lane
      args: {lane: "Asia"}
      expect: ["7.8", "4.2", "2.1"]

- question: "02:12:Q5"
  story: >
    Freight forwarder checks for blank sailings and surcharges. CAR-001 has blank sailing on
    Asia-UK (ALR-900001 effective 15 Oct), and CAR-005 has Suez surcharge (ALR-900003, 12.5%, effective 10 Oct).
    These need to be identified and bookings moved accordingly.
  checks:
    - tool: search_carrier_blank_sailing_notices
      args: {carrier_id: CAR-001}
      expect: ["Asia-UK", "blank_sailing", "ALR-900001"]
    - tool: search_carrier_surcharge_announcements
      args: {carrier_id: CAR-005}
      expect: ["12.5", "Suez Surcharge"]

- question: "02:16:Q3"
  story: >
    Last-mile delivery manager checks courier capacity for peak. Courier Express has
    15,000 units capacity UK North (CCP-900001) and 17:30 cut-off (CCO-900001).
    ParcelMax offers 12,000 units UK North with 16:30 cut-off.
  checks:
    - tool: get_courier_capacity_commitments
      args: {region: "UK North"}
      expect: ["15000", "Courier Express", "CCP-900001"]
    - tool: get_courier_cut_off_times
      args: {region: "UK North"}
      expect: ["17:30", "16:30", "Courier Express"]

- question: "02:20:Q1"
  story: >
    Carrier relationship manager reviews invoice disputes. DIS-900001 for CAR-001 September
    invoice disputes £1250.50 surcharge claim (submitted 2026-10-01). DIS-900002 for CAR-002
    August has £750 weight discrepancy (under_review).
  checks:
    - tool: submit_carrier_invoice_dispute
      args: {carrier_id: CAR-001, invoice_month: "2026-09", dispute_reason: "Surcharge not in contract", disputed_amount_gbp: 1250.50}
      expect: ["DIS-", "submitted", "1250.50"]

- question: "02:20:Q4"
  story: >
    Rate increases are coming. CAR-001 announces 4% general increase from November (ALR-900004),
    CAR-007 announces 3.2% Q4 review (ALR-900007), and CAR-004 posts 7.5% port surcharge (ALR-900006).
    These need to be found and budget impact assessed.
  checks:
    - tool: search_carrier_rate_increase_announcements
      args: {carrier_id: CAR-001}
      expect: ["4.0", "November", "rate_increase"]
    - tool: search_carrier_rate_increase_announcements
      args: {carrier_id: CAR-004}
      expect: ["7.5", "port_congestion"]

- question: "02:20:Q5"
  story: >
    CAR-004 damage claims doubled in Q3. Seed data shows 5 claims from CAR-004 across
    Leeds-Manchester, Manchester-London, Asia-UK lanes totalling £1,805 (CLM-900001 through CLM-900005).
    These span different depots, products (K-1700, PF-220), and package types.
  checks:
    - tool: list_damage_claims_by_carrier
      args: {carrier_id: CAR-004}
      expect: ["CLM-900001", "CAR-004", "350.00"]
    - tool: get_damage_claims_by_dimension
      args: {carrier_id: CAR-004}
      expect: ["Leeds DC", "London Hub", "K-1700"]

- question: "04:40:Q3"
  story: >
    Packaging buyer reviews breakage on glass items (K-1700 kettles). Damage claims show CAR-004
    has high claim rate on K-1700 (CLM-900001, CLM-900005 carton damage), and CAR-003 also filed
    K-1700 claim (CLM-900008). Performance data shows CAR-004 has 4.5% damage rate on
    Leeds-Manchester (CP-900005).
  checks:
    - tool: get_carrier_damage_rates
      args: {carrier_id: CAR-004, lane: "Leeds-Manchester"}
      expect: ["4.5", "CP-900005"]
    - tool: list_damage_claims_by_carrier
      args: {carrier_id: CAR-004, claim_date: "-90d"}
      expect: ["K-1700", "carton"]

- question: "08:74:Q2"
  story: >
    E-commerce manager plans Black Friday capacity. CAR-001 has 400-700 units daily
    capacity Leeds-Manchester with peaks at 600-700 units (CAP-900001 through CAP-900005).
    Courier Express can handle 15,000 parcels UK North during peak (CCP-900001) with 17:30 cut-off.
    Manager requests extra capacity weeks 45-47 (REQ-900004 for 600 units).
  checks:
    - tool: get_carrier_capacity_by_day
      args: {carrier_id: CAR-001, lane: "Leeds-Manchester"}
      expect: ["700", "2026-12-01", "CAP-900005"]
    - tool: get_courier_capacity_commitments
      args: {region: "UK North", courier_name: "Courier Express"}
      expect: ["15000", "CCP-900001"]
    - tool: send_capacity_request_to_carrier
      args: {carrier_id: CAR-001, lane: "Leeds-Manchester", weeks_needed: "weeks 45-47", units_requested: 650}
      expect: ["REQ-", "requested"]

- question: "08:75:Q1"
  story: >
    Marketplace manager investigates 4 short orders. Order ORD-2026-0123462 shows carrier CAR-004
    with delayed status and note "one pallet missing" (DLV-900007).
    Other orders (ORD-2026-0123456, 0123457, etc.) show normal arrival patterns.
  checks:
    - tool: get_carrier_delivery_record_for_order
      args: {order_id: "ORD-2026-0123462"}
      expect: ["DLV-900007", "CAR-004", "short_shipment"]
    - tool: create_carrier_claim
      args: {carrier_id: CAR-004, lane: "Leeds-Manchester", sku: "SKU-100234", package_type: "carton", amount_gbp: 500.00, claim_notes: "Pallet missing in transit"}
      expect: ["CLM-", "filed"]

- question: "09:82:Q1"
  story: >
    Data scientist models ocean transit variability. CAR-001 Asia-UK has ETA vs actual data
    showing 16.5 average days (CP-900006). CAR-005 averages 17.2 days (CP-900007).
    CAR-001 on-time is 92.1% vs CAR-005 at 89.5%, indicating more predictable transit.
  checks:
    - tool: get_carrier_eta_vs_actual_by_lane
      args: {carrier_id: CAR-001, lane: "Asia-UK"}
      expect: ["16.5", "92.1", "CP-900006"]
    - tool: get_carrier_eta_vs_actual_by_lane
      args: {lane: "Asia-UK"}
      expect: ["16.5", "17.2"]

- question: "09:88:Q6"
  story: >
    COO evaluates make-vs-buy. Overall carrier performance shows CAR-001 dominates with
    95.2% on-time Leeds-Manchester, 96.5% reliability, 3.2% roll rate (CP-900001).
    CAR-007 is weakest at 84.1% on-time with 18% roll rate (CP-900005).
  checks:
    - tool: get_carrier_performance
      args: {carrier_id: CAR-001}
      expect: ["95.2", "96.5", "CP-900001"]
    - tool: compare_carrier_performance
      args: {lane: "Leeds-Manchester"}
      expect: ["96.5", "CAR-001", "89.8"]
