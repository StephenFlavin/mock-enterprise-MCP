id: carrier_portal
name: Carrier Portal
instructions: >
  Carrier service, rates, performance and capacity. Rate cards by lane and service level;
  schedule reliability, roll rates and damage claims by carrier; service alerts (blank sailings,
  surcharges, rate increases) and courier capacity. Carrier ids are CAR-… (e.g. CAR-001);
  claim ids are CLM-… (e.g. CLM-900001); alert ids are ALR-… (e.g. ALR-900001).

tables:
  carrier_rate_cards:
    key: rate_card_id
    cols:
      rate_card_id: {type: str, desc: "Rate card id, e.g. RC-000123"}
      carrier_id: {type: str, desc: "Carrier, e.g. CAR-001"}
      lane: {type: str, desc: "Route, e.g. Leeds-Manchester"}
      service_type: {type: str, desc: "Service level, e.g. standard, next_day"}
      rate_gbp: {type: float, desc: Rate in GBP per unit}
      min_volume: {type: int, desc: Minimum volume for rate}
      effective_from: {type: date, desc: Rate effective from}
      effective_to: {type: date, desc: Rate effective to}
      status: {type: enum, values: [active, expired, superseded], desc: Status}

  pallet_network_rates:
    key: pallet_rate_id
    cols:
      pallet_rate_id: {type: str, desc: "Pallet rate id, e.g. PNR-000123"}
      network_name: {type: str, desc: "Pallet network name"}
      lane: {type: str, desc: "Route, e.g. Leeds-Manchester"}
      service_type: {type: str, desc: "Service level, e.g. standard, express"}
      rate_gbp: {type: float, desc: Rate in GBP per pallet}
      on_time_pct: {type: float, desc: "Published on-time performance %"}
      effective_from: {type: date, desc: Rate effective from}
      contract_terms: {type: text, desc: Contract notes and terms}

  carrier_performance:
    key: perf_id
    cols:
      perf_id: {type: str, desc: "Performance record id, e.g. CP-000123"}
      carrier_id: {type: str, desc: "Carrier, e.g. CAR-001"}
      lane: {type: str, desc: "Route, e.g. Leeds-Manchester"}
      period: {type: str, desc: "Period, e.g. last_12m, Q3"}
      reliability_pct: {type: float, desc: "Schedule reliability %"}
      on_time_pct: {type: float, desc: "On-time delivery %"}
      roll_rate_pct: {type: float, desc: "Booking roll rate %"}
      damage_rate_pct: {type: float, desc: "Damage claims as % of shipments"}
      volume_share_pct: {type: float, desc: "Our volume share %"}
      avg_eta_days: {type: float, desc: "Average transit time (days)"}

  carrier_capacity_daily:
    key: capacity_id
    cols:
      capacity_id: {type: str, desc: "Capacity record id, e.g. CAP-000123"}
      carrier_id: {type: str, desc: "Carrier, e.g. CAR-001"}
      lane: {type: str, desc: "Route, e.g. Leeds-Manchester"}
      capacity_date: {type: date, desc: Date}
      capacity_units: {type: int, desc: Capacity available (pallets or units)}
      available_units: {type: int, desc: Unallocated capacity}

  damage_claims:
    key: claim_id
    cols:
      claim_id: {type: str, desc: "Claim id, e.g. CLM-900001"}
      carrier_id: {type: str, desc: "Carrier, e.g. CAR-001"}
      lane: {type: str, desc: "Route affected, e.g. Leeds-Manchester"}
      depot: {type: str, desc: "Depot or facility name"}
      sku: {type: str, desc: "Product SKU"}
      package_type: {type: str, desc: "Packaging type, e.g. carton, polybag"}
      claim_date: {type: date, desc: Date claimed}
      amount_gbp: {type: float, desc: Claim amount in GBP}
      status: {type: enum, values: [filed, accepted, rejected, settled, withdrawn], desc: Status}
      claim_notes: {type: text, desc: Claim description}

  service_alerts:
    key: alert_id
    cols:
      alert_id: {type: str, desc: "Alert id, e.g. ALR-900001"}
      carrier_id: {type: str, desc: "Carrier, e.g. CAR-001"}
      alert_type: {type: enum, values: [blank_sailing, surcharge, rate_increase, service_disruption, delay_notice], desc: Alert type}
      lane: {type: str, desc: "Route affected, e.g. Asia-Europe"}
      effective_from: {type: date, desc: Effective from"}
      effective_to: {type: date, desc: Effective to"}
      description: {type: text, desc: Alert details}
      amount_or_pct: {type: float, desc: Amount (GBP) or percentage for surcharges/rate increases"}
      published_date: {type: date, desc: Notice published date}

  courier_capacity_peak:
    key: courier_capacity_id
    cols:
      courier_capacity_id: {type: str, desc: "Courier capacity record, e.g. CCP-000123"}
      courier_name: {type: str, desc: "Courier name, e.g. Courier Express"}
      region: {type: str, desc: "Region, e.g. UK North, UK South"}
      peak_capacity_units: {type: int, desc: Peak week capacity (parcels)"}
      commitment_from: {type: date, desc: Commitment effective from}
      commitment_to: {type: date, desc: Commitment effective to}

  courier_cut_offs:
    key: cut_off_id
    cols:
      cut_off_id: {type: str, desc: "Cut-off record, e.g. CCO-000123"}
      courier_name: {type: str, desc: "Courier name, e.g. Courier Express"}
      region: {type: str, desc: "Region, e.g. UK North, UK South"}
      collection_time: {type: str, desc: "Collection time, e.g. 17:30"}
      cut_off_time: {type: str, desc: "Order cut-off time, e.g. 16:00"}
      effective_from: {type: date, desc: Effective from}

  order_delivery_records:
    key: delivery_id
    cols:
      delivery_id: {type: str, desc: "Delivery record id, e.g. DLV-000123"}
      order_id: {type: str, desc: "Customer order, e.g. ORD-2026-0123456"}
      carrier_id: {type: str, desc: "Carrier, e.g. CAR-001"}
      eta: {type: date, desc: Estimated arrival"}
      ata: {type: date, desc: Actual arrival"}
      status: {type: enum, values: [in_transit, delayed, arrived, short_shipped, damaged, returned], desc: Delivery status}
      delivery_notes: {type: text, desc: Delivery notes}

  capacity_requests:
    key: request_id
    cols:
      request_id: {type: str, desc: "Request id, e.g. REQ-000123"}
      carrier_id: {type: str, desc: "Carrier, e.g. CAR-001"}
      lane: {type: str, desc: "Route, e.g. Leeds-Manchester"}
      weeks_needed: {type: str, desc: "Weeks needed, e.g. weeks 45-46"}
      units_requested: {type: int, desc: "Units or pallets requested"}
      request_date: {type: date, desc: Request sent date}
      status: {type: enum, values: [requested, confirmed, rejected, cancelled], desc: Status}

  invoice_disputes:
    key: dispute_id
    cols:
      dispute_id: {type: str, desc: "Dispute id, e.g. DIS-000123"}
      carrier_id: {type: str, desc: "Carrier, e.g. CAR-001"}
      invoice_month: {type: str, desc: "Invoice month, e.g. 2026-09"}
      dispute_reason: {type: str, desc: "Reason for dispute"}
      disputed_amount_gbp: {type: float, desc: Disputed amount in GBP}
      status: {type: enum, values: [submitted, under_review, acknowledged, resolved, rejected], desc: Status}
      submission_date: {type: date, desc: Dispute submitted date}

tools:
  # Read tools - rate cards
  - name: get_carrier_rate_card
    desc: Carrier rate card by lane and service. Returns current rates and contract terms.
    kind: select
    from: carrier_rate_cards
    filters:
      carrier_id: {}
      lane: {}
      service_type: {default: "standard"}
      status: {default: active}
    columns: [rate_card_id, carrier_id, lane, service_type, rate_gbp, min_volume, effective_from, effective_to, status]
    order: effective_from DESC
    limit: 10
    example: {carrier_id: CAR-001, lane: "Leeds-Manchester"}

  - name: get_pallet_network_rate_card
    desc: Pallet network rates and published on-time performance by lane. Contract terms on request.
    kind: select
    from: pallet_network_rates
    filters:
      network_name: {}
      lane: {op: like}
      service_type: {default: "standard"}
    columns: [pallet_rate_id, network_name, lane, service_type, rate_gbp, on_time_pct, effective_from, contract_terms]
    order: rate_gbp
    limit: 20
    example: {network_name: "Pallet Exchange", lane: "Manchester"}

  # Performance metrics
  - name: get_carrier_schedule_reliability
    desc: Carrier schedule reliability (%) by lane, last 12 months. Use to assess booking predictability.
    kind: select
    from: carrier_performance
    filters:
      carrier_id: {}
      lane: {}
      period: {default: "last_12m"}
    columns: [perf_id, carrier_id, lane, reliability_pct, on_time_pct]
    order: reliability_pct DESC
    limit: 10
    example: {carrier_id: CAR-001}

  - name: get_roll_rate_by_carrier_and_lane
    desc: Booking roll rates (%) by carrier and lane, last 12 months. High roll rate = capacity unavailable.
    kind: select
    from: carrier_performance
    filters:
      carrier_id: {}
      lane: {op: like}
      period: {default: "last_12m"}
    columns: [perf_id, carrier_id, lane, roll_rate_pct]
    order: roll_rate_pct DESC
    limit: 20
    example: {carrier_id: CAR-001}

  - name: get_carrier_share_of_volume
    desc: "Our volume share (%) with each carrier by lane, last 12 months. Use to assess consolidation potential."
    kind: select
    from: carrier_performance
    filters:
      carrier_id: {}
      lane: {op: like}
      period: {default: "last_12m"}
    columns: [perf_id, carrier_id, lane, volume_share_pct, on_time_pct]
    order: volume_share_pct DESC
    limit: 20
    example: {lane: "Manchester"}

  - name: get_carrier_eta_vs_actual_by_lane
    desc: Carrier quoted ETA versus actual arrivals by lane. Returns average transit time (days).
    kind: select
    from: carrier_performance
    filters:
      carrier_id: {}
      lane: {op: like}
      period: {default: "last_12m"}
    columns: [perf_id, carrier_id, lane, avg_eta_days, on_time_pct]
    order: lane
    limit: 20
    example: {carrier_id: CAR-001}

  - name: get_carrier_damage_rates
    desc: Damage rate (% of shipments with claims) by carrier and lane. High rate indicates quality/handling issues.
    kind: select
    from: carrier_performance
    filters:
      carrier_id: {}
      lane: {op: like}
      period: {default: "last_12m"}
    columns: [perf_id, carrier_id, lane, damage_rate_pct]
    order: damage_rate_pct DESC
    limit: 20
    example: {carrier_id: CAR-001}

  - name: compare_carrier_performance
    desc: Compare carriers on reliability, roll rate and cost per lane. Use to decide renewal or consolidation.
    kind: sql
    args:
      lane: {required: true, type: str, desc: "Route, e.g. Leeds-Manchester or Asia-Europe"}
      period: {type: str, default: "last_12m", desc: "Period: last_12m, Q3, Q4"}
    sql: |
      SELECT carrier_id, lane, reliability_pct, roll_rate_pct, on_time_pct, damage_rate_pct, volume_share_pct
      FROM carrier_performance
      WHERE lane ILIKE $lane AND period = $period
      ORDER BY reliability_pct DESC, roll_rate_pct ASC
    limit: 10
    example: {lane: "Leeds-Manchester"}

  # Capacity
  - name: get_carrier_capacity_by_day
    desc: Carrier available capacity by day and lane. Use for peak season planning and spot bookings.
    kind: select
    from: carrier_capacity_daily
    filters:
      carrier_id: {}
      lane: {}
      capacity_date: {op: ">=", type: date, default: "$as_of", desc: "From date (default today)"}
    columns: [capacity_id, carrier_id, lane, capacity_date, capacity_units, available_units]
    order: capacity_date
    limit: 30
    example: {carrier_id: CAR-001, lane: "Leeds-Manchester"}

  - name: get_courier_capacity_commitments
    desc: Courier capacity commitments (parcels) for peak weeks by region. Use to assess gaps.
    kind: select
    from: courier_capacity_peak
    filters:
      region: {}
      courier_name: {op: like}
    columns: [courier_capacity_id, courier_name, region, peak_capacity_units, commitment_from, commitment_to]
    order: region, courier_name
    limit: 20
    example: {region: "UK North"}

  - name: get_courier_cut_off_times
    desc: Courier collection and cut-off times by region. Use to set order cut-offs and delivery promises.
    kind: select
    from: courier_cut_offs
    filters:
      region: {}
      courier_name: {op: like}
    columns: [cut_off_id, courier_name, region, collection_time, cut_off_time, effective_from]
    order: region, courier_name
    limit: 20
    example: {region: "UK North"}

  # Damage claims and alerts
  - name: list_damage_claims_by_carrier
    desc: Damage claims filed against carrier, most recent first. Use to identify problem carriers or lanes.
    kind: select
    from: damage_claims
    filters:
      carrier_id: {}
      lane: {op: like}
      claim_date: {op: ">=", type: date, default: "-90d", desc: "From date"}
      status: {}
    columns: [claim_id, carrier_id, lane, depot, sku, package_type, claim_date, amount_gbp, status]
    order: claim_date DESC
    limit: 30
    example: {carrier_id: CAR-001}

  - name: get_damage_claims_by_dimension
    desc: Damage claims broken down by depot, product, packaging and route. Use to find root causes.
    kind: sql
    args:
      carrier_id: {required: true}
      claim_date: {type: date, default: "-90d", desc: "From date"}
    sql: |
      SELECT depot, sku, package_type, lane, COUNT(*) AS claim_count, SUM(amount_gbp) AS total_amount_gbp
      FROM damage_claims
      WHERE carrier_id = $carrier_id AND claim_date >= CAST($claim_date AS DATE)
      GROUP BY ALL
      ORDER BY total_amount_gbp DESC
    limit: 20
    example: {carrier_id: CAR-001}

  - name: search_carrier_service_alerts
    desc: Carrier service notices (disruptions, blank sailings). Use to identify route/lane issues.
    kind: select
    from: service_alerts
    filters:
      carrier_id: {}
      alert_type: {}
      lane: {op: like}
      published_date: {op: ">=", type: date, default: "-60d", desc: "Published from"}
      effective_from: {op: "<=", type: date, default: "+30d", desc: "Effective by (default 30d ahead)"}
    columns: [alert_id, carrier_id, alert_type, lane, effective_from, effective_to, description, amount_or_pct]
    order: effective_from DESC
    limit: 20
    example: {carrier_id: CAR-002}

  - name: search_carrier_blank_sailing_notices
    desc: Blank sailing announcements. Use to identify cancelled sailings and plan alternatives.
    kind: select
    from: service_alerts
    filters:
      carrier_id: {}
      alert_type: {default: blank_sailing}
      published_date: {op: ">=", type: date, default: "-14d"}
      effective_from: {op: ">=", type: date, default: "$as_of"}
    columns: [alert_id, carrier_id, alert_type, lane, effective_from, description, published_date]
    order: effective_from
    limit: 20
    example: {carrier_id: CAR-001}

  - name: search_carrier_surcharge_announcements
    desc: Surcharge announcements and effective dates. Use to adjust route economics and pricing.
    kind: select
    from: service_alerts
    filters:
      carrier_id: {}
      alert_type: {default: surcharge}
      published_date: {op: ">=", type: date, default: "-60d"}
    columns: [alert_id, carrier_id, alert_type, lane, description, amount_or_pct, effective_from, published_date]
    order: effective_from
    limit: 20
    example: {carrier_id: CAR-002}

  - name: search_carrier_rate_increase_announcements
    desc: Carrier rate increase notices and general rate reviews. Use to forecast cost inflation.
    kind: select
    from: service_alerts
    filters:
      carrier_id: {}
      alert_type: {default: rate_increase}
      published_date: {op: ">=", type: date, default: "-60d"}
    columns: [alert_id, carrier_id, alert_type, description, amount_or_pct, effective_from, published_date]
    order: published_date DESC
    limit: 20
    example: {carrier_id: CAR-001}

  # Delivery and order tracking
  - name: get_carrier_delivery_record_for_order
    desc: Carrier delivery record for an order (ETA, actual arrival, status). Use to investigate shortages.
    kind: select
    from: order_delivery_records
    filters:
      order_id: {required: true}
      carrier_id: {}
    columns: [delivery_id, order_id, carrier_id, eta, ata, status, delivery_notes]
    limit: 5
    example: {order_id: "ORD-2026-0100001"}

  # Capacity requests
  - name: send_capacity_request_to_carrier
    desc: Send a capacity request to a carrier for specific lanes and weeks.
    kind: insert
    table: capacity_requests
    id_prefix: REQ-
    defaults: {status: requested}
    args:
      carrier_id: {required: true}
      lane: {required: true, desc: "Route, e.g. Leeds-Manchester"}
      weeks_needed: {required: true, type: str, desc: "Weeks needed, e.g. weeks 45-46"}
      units_requested: {required: true, type: int, desc: "Units or pallets"}
    example: {carrier_id: CAR-001, lane: "Leeds-Manchester", weeks_needed: "weeks 45-46", units_requested: 500}

  # Claims
  - name: create_carrier_claim
    desc: File a damage or short shipment claim against a carrier for an order.
    kind: insert
    table: damage_claims
    id_prefix: CLM-
    defaults: {status: filed}
    args:
      carrier_id: {required: true}
      lane: {required: true, desc: "Route where damage occurred"}
      sku: {required: true}
      package_type: {required: true, desc: "Packaging type, e.g. carton, polybag"}
      amount_gbp: {required: true, type: float, desc: "Claim amount in GBP"}
      claim_notes: {required: true, desc: "Description of loss or damage"}
      depot: {desc: "Depot or facility name"}
    example: {carrier_id: CAR-001, lane: "Leeds-Manchester", sku: "K-1700", package_type: "carton", amount_gbp: 250.00, claim_notes: "Goods damaged in transit"}

  - name: submit_carrier_damage_claim
    desc: Submit a filed damage claim to the carrier for recovery.
    kind: update
    table: damage_claims
    set: {status: "submitted"}
    args: {}
    example: {claim_id: "CLM-900001"}

  - name: submit_carrier_invoice_dispute
    desc: Submit a dispute of invoice lines to the carrier (charges, surcharges, weights).
    kind: insert
    table: invoice_disputes
    id_prefix: DIS-
    defaults: {status: submitted}
    args:
      carrier_id: {required: true}
      invoice_month: {required: true, type: str, desc: "Invoice month, e.g. YYYY-MM (month in the past)"}
      dispute_reason: {required: true, desc: "Reason for dispute"}
      disputed_amount_gbp: {required: true, type: float, desc: "Amount in dispute"}
    example: {carrier_id: CAR-002, invoice_month: "past month", dispute_reason: "Weight discrepancy", disputed_amount_gbp: 750.00}

  # General performance
  - name: get_carrier_performance
    desc: Carrier service and cost performance overall. Use for contract renewal and sourcing decisions.
    kind: select
    from: carrier_performance
    filters:
      carrier_id: {}
      period: {default: "last_12m"}
    columns: [perf_id, carrier_id, lane, reliability_pct, on_time_pct, roll_rate_pct, damage_rate_pct, volume_share_pct]
    order: reliability_pct DESC
    limit: 20
    example: {carrier_id: CAR-001}
