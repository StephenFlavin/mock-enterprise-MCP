# Consolidation system scenarios - one entry per question in the brief

- question: "07:61:Q1"
  story: >
    September operating profit is £1.8m below budget for LE-UK (revenue £12m, actual £1.8m vs budget £3.6m).
    Close tasks CT-900001 and CT-900002 are created to investigate unexplained variances and FX revaluations.
    Monthly performance shows the shortfall: revenue vs budget -£1m (-7.7%), operating profit vs budget -£1.8m.
  checks:
    - tool: get_monthly_performance_summary
      args: {period: "-1m", entity_id: LE-UK}
      expect: ["12000000", "-1800000", "1800000"]
    - tool: list_open_close_tasks
      args: {entity_id: LE-UK, priority: high}
      expect: ["CT-900001", "CT-900002", "high"]
    - tool: create_close_task
      args: {task_name: "Investigate trading margin shortfall", owner_id: EMP-00077, due_date: "+3d", entity_id: LE-UK, priority: urgent}
      expect: ["CT-", "open", "Investigate trading margin"]

- question: "07:61:Q2"
  story: >
    Intercompany between LE-UK and LE-NL is out by £340k. ICI-900005 shows a £170k missing invoice from UK to NL
    (dated in prior month, status unmatched), and ICI-900006 shows NL to UK with a £170k timing variance. Together they
    explain the £340k discrepancy. Close task CT-900003 tracks the reconciliation.
  checks:
    - tool: search_unmatched_intercompany_items
      args: {entity_from_id: LE-UK, entity_to_id: LE-NL, match_status: unmatched}
      expect: ["ICI-900005", "170000"]
    - tool: search_unmatched_intercompany_items
      args: {entity_from_id: LE-NL, entity_to_id: LE-UK, match_status: unmatched}
      expect: ["ICI-900006", "500000"]
    - tool: list_open_close_tasks
      args: {entity_id: LE-UK, priority: urgent}
      expect: ["CT-900003", "intercompany", "urgent"]

- question: "07:61:Q4"
  story: >
    Open close tasks for LE-UK: CT-900001 (revenue accruals, high), CT-900002 (FX revaluations, high),
    and CT-900003 (intercompany reconciliation, urgent). Similar tasks exist for LE-NL (CT-900004, CT-900005)
    and LE-DE (CT-900006).
  checks:
    - tool: list_open_close_tasks
      args: {entity_id: LE-UK, status: open}
      expect: ["CT-900001", "CT-900002", "CT-900003"]
    - tool: list_open_close_tasks
      args: {entity_id: LE-NL}
      expect: ["CT-900004", "CT-900005"]
    - tool: send_close_task_reminder
      args: {task_id: CT-900001, notes: "Reminder: revenue accruals reconciliation due by end of day"}
      expect: ["CTR-", "CT-900001"]

- question: "07:62:Q4"
  story: >
    LE-UK current month: gross margin 45%, operating margin 15%, revenue growth 8.5%, inventory turn 6.2x.
    LE-NL and LE-DE show lower margins (40% GM, 10-11% OM) and slower turns. Used for peer comparison.
  checks:
    - tool: get_company_financial_kpis
      args: {period: "-1m", entity_id: LE-UK}
      expect: ["45", "15", "8.5", "6.2"]
    - tool: get_company_financial_kpis
      args: {entity_id: LE-NL}
      expect: ["40", "10", "5.1"]

- question: "07:62:Q8"
  story: >
    Monthly performance summary: LE-UK revenue £12m (budget -£1m), operating profit £1.8m (budget -£1.8m).
    Key risks and KPIs tracked. Notes indicate volume and margin pressures.
  checks:
    - tool: get_monthly_performance_summary
      args: {period: "-1m"}
      expect: ["12000000", "-1000000", "1800000"]
    - tool: get_monthly_performance_summary
      args: {period: "-1m", entity_id: LE-UK}
      expect: ["pressures"]

- question: "07:70:Q3"
  story: >
    Current guidance and outlook shows Q4 revenue guidance £48-52m, EBITDA £5.28-6.24m.
    Inventory and supply chain KPIs for current month: LE-UK inventory turn 6.2x, supply chain cost 12.1% of revenue,
    carrier OTIF 94.2%, supplier OTIF 91.3%. These inform analyst commentary and risk assessment.
  checks:
    - tool: get_guidance_and_outlook
      args: {}
      expect: ["2026-Q4", "48000000", "52000000"]
    - tool: get_inventory_and_supply_chain_cost_kpis
      args: {period: "-1m", entity_id: LE-UK}
      expect: ["6.2", "12.1", "94.2", "91.3"]

- question: "07:70:Q5"
  story: >
    Guidance for Q4 shows £48-52m revenue target with £5.28-6.24m EBITDA. Risks include supply chain cost
    pressures (currently 12.1% of revenue) and inventory management challenges (turn 6.2x vs historical 6.5x).
    Outlook commentary notes margin resilience expected.
  checks:
    - tool: get_guidance_and_outlook
      args: {}
      expect: ["current", "48000000", "52000000", "5280000", "6240000"]
    - tool: get_inventory_and_supply_chain_cost_kpis
      args: {entity_id: LE-UK}
      expect: ["12.1"]
