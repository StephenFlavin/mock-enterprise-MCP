# Consolidation system scenarios - one entry per question in the brief

- question: "07:61:Q1"
  story: >
    September group operating profit is £1.8m below budget (matches budgeting): LE-UK -1.29m, LE-US -320k,
    LE-NL -240k, LE-DE on budget, LE-IE +50k, with driver commentary per entity. Open close tasks CT-900001 and
    CT-900002 track the unexplained items; create_close_task adds one per entity accountant.
  checks:
    - tool: get_monthly_performance_summary
      args: {}
      expect: ["GROUP", "-1800000", "LE-UK", "-1290000", "LE-US", "-320000"]
    - tool: create_close_task
      args: {task_name: "Explain unexplained items in LE-US September P&L", owner_id: EMP-00089, due_date: "+3d", entity_id: LE-US, priority: high}
      expect: ["CT-", "open", "EMP-00089", "LE-US"]

- question: "07:61:Q2"
  story: >
    UK to Polish entity (LE-PL) intercompany is out by £340k: two invoices not booked in PL (ICI-900001 128,000 and
    ICI-900002 61,997.70 = 189,997.70), timing on two invoices PL booked after period end (ICI-900003 84,000 and
    ICI-900004 36,000 = 120,000) and an FX difference on PLN stock supply ICI-900005 (30,002.30).
  checks:
    - tool: search_unmatched_intercompany_items
      args: {entity_from_id: LE-UK, entity_to_id: LE-PL}
      expect: ["ICI-900001", "128000", "ICI-900003", "84000", "ICI-900005", "30002.3", "PLN", "missing invoice", "timing", "FX variance"]

- question: "07:61:Q4"
  story: >
    Ten close tasks (accruals and reconciliations) are open for more than 60 days, owners EMP-00085/86/87/88/89.
    CT-900106 (LE-US, owner EMP-00089) is blocked by a vendor dispute. CT-900102 was already chased once.
  checks:
    - tool: list_open_close_tasks
      args: {min_age_days: 60}
      expect: ["CT-900108", "CT-900102", "CT-900106", "Open dispute", "EMP-00089"]
    - tool: send_close_task_reminder
      args: {task_id: CT-900101, recipient_id: EMP-00086, notes: "Please clear the Daventry rent accrual"}
      expect: ["CTR-", "CT-900101", "EMP-00086"]

- question: "07:62:Q4"
  story: >
    Group September KPIs: gross margin 33.8% (34.7% last year), operating margin 6.5%, revenue growth 2.8%, inventory
    turn 5.1x (5.4x last year). Behind last year on margin and turns, driven by freight and markdowns.
  checks:
    - tool: get_company_financial_kpis
      args: {view: group}
      expect: ["GROUP", "33.8", "34.7", "6.5", "2.8", "5.1", "5.4"]

- question: "07:62:Q8"
  story: >
    Latest month (September) group revenue £100.5m (£2.29m below budget), operating profit £6.53m (£1.8m below budget)
    with entity commentary on freight, markdowns, USD costs and phasing.
  checks:
    - tool: get_monthly_performance_summary
      args: {}
      expect: ["GROUP", "100500000", "6531000", "-1800000", "warm September"]

- question: "07:70:Q3"
  story: >
    Over the last two quarters group supply chain cost rose from 10.78% to 11.58% of revenue (freight 5.28% to 5.87%),
    inventory turn fell from 5.4 to 5.1, carrier OTIF 93.0% to 91.8% and supplier OTIF 87.6% to 86.2%. Current
    Q4 guidance is revenue £48-52m and EBITDA £5.28-6.24m.
  checks:
    - tool: get_inventory_and_supply_chain_cost_kpis
      args: {view: group}
      expect: ["11.58", "10.78", "5.87", "5.28", "86.2", "91.8"]
    - tool: get_guidance_and_outlook
      args: {}
      expect: ["2026-Q4", "48000000", "6240000", "inventory turn"]

- question: "07:70:Q5"
  story: >
    Current guidance for 2026-Q4 carries explicit assumptions (freight within 10% of budget, GBP/USD above 1.20,
    like-for-like sales, discount depth) and an update policy (EBITDA outside range for two consecutive months or a risk trigger).
  checks:
    - tool: get_guidance_and_outlook
      args: {}
      expect: ["GO-900001", "GBP/USD above 1.20", "two consecutive months"]
