# Consolidation system scenarios - one entry per question in the brief

- question: "07:61:Q1"
  story: >
    Most recent month operating profit shows significant variance for LE-UK. Close tasks are created
    to investigate unexplained variances and FX revaluations. Monthly performance shows shortfall:
    revenue below budget, operating profit significantly below budget.
  checks:
    - tool: get_monthly_performance_summary
      args: {entity_id: LE-UK}
      expect: ["LE-UK", "revenue_gbp"]
    - tool: list_open_close_tasks
      args: {entity_id: LE-UK, priority: high}
      expect: ["CT-900001", "CT-900002", "high"]
    - tool: create_close_task
      args: {task_name: "Investigate trading margin shortfall", owner_id: EMP-00077, due_date: "+3d", entity_id: LE-UK, priority: urgent}
      expect: ["CT-", "open", "Investigate trading margin"]

- question: "07:61:Q2"
  story: >
    Intercompany between LE-UK and LE-NL is out by £340k. ICI-900005 shows a £170k missing invoice
    and ICI-900006 shows a £170k timing variance. Together they explain the £340k discrepancy.
    Close task CT-900003 tracks the reconciliation.
  checks:
    - tool: search_unmatched_intercompany_items
      args: {entity_from_id: LE-UK, entity_to_id: LE-NL, match_status: unmatched}
      expect: ["ICI-900005", "170000"]
    - tool: search_unmatched_intercompany_items
      args: {entity_from_id: LE-NL, entity_to_id: LE-UK, match_status: unmatched}
      expect: ["ICI-900006", "500000"]
    - tool: list_open_close_tasks
      args: {entity_id: LE-UK, priority: urgent}
      expect: ["CT-900003", "intercompany", "urgent"]

- question: "07:61:Q4"
  story: >
    Open close tasks for LE-UK: CT-900001 (revenue accruals, high), CT-900002 (FX revaluations, high),
    and CT-900003 (intercompany reconciliation, urgent). Similar tasks exist for LE-NL and LE-DE.
  checks:
    - tool: list_open_close_tasks
      args: {entity_id: LE-UK, status: open}
      expect: ["CT-900001", "CT-900002", "CT-900003"]
    - tool: list_open_close_tasks
      args: {entity_id: LE-NL}
      expect: ["CT-900004", "CT-900005"]
    - tool: send_close_task_reminder
      args: {task_id: CT-900001, notes: "Reminder: revenue accruals reconciliation due by end of day"}
      expect: ["CTR-", "CT-900001"]

- question: "07:62:Q4"
  story: >
    LE-UK: gross margin 43%, operating margin 6%, inventory turn 9x.
    LE-NL and LE-DE show different margins and turn rates. Used for peer comparison.
  checks:
    - tool: get_company_financial_kpis
      args: {entity_id: LE-UK}
      expect: ["LE-UK"]
    - tool: get_company_financial_kpis
      args: {entity_id: LE-NL}
      expect: ["LE-NL"]

- question: "07:62:Q8"
  story: >
    Monthly performance summary shows LE-UK and other entities with revenue, profit and variance data.
    Key insights tracked with commentary on performance drivers.
  checks:
    - tool: get_monthly_performance_summary
      args: {}
      expect: ["LE-UK", "revenue_gbp"]
    - tool: get_monthly_performance_summary
      args: {entity_id: LE-UK}
      expect: ["LE-UK"]

- question: "07:70:Q3"
  story: >
    Current guidance shows revenue and EBITDA targets for Q4. LE-UK inventory and supply chain KPIs show
    inventory turn of 9x and supply chain cost of 8.5% of revenue, carrier OTIF 94.2%, supplier OTIF 91.3%.
    These inform analyst commentary and risk assessment.
  checks:
    - tool: get_guidance_and_outlook
      args: {}
      expect: ["current", "2026-Q4"]
    - tool: get_inventory_and_supply_chain_cost_kpis
      args: {entity_id: LE-UK}
      expect: ["LE-UK", "inventory_turn"]

- question: "07:70:Q5"
  story: >
    Guidance shows revenue and EBITDA targets for Q4. Supply chain cost KPIs inform risk assessment
    around costs and inventory management. Outlook commentary notes strategic direction.
  checks:
    - tool: get_guidance_and_outlook
      args: {}
      expect: ["current", "2026-Q4"]
    - tool: get_inventory_and_supply_chain_cost_kpis
      args: {entity_id: LE-UK}
      expect: ["supply_chain_cost_pct"]
