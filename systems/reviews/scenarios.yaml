- question: "02:21:Q1"
  story: >
    The most returned launched styles carry a dominant complaint theme in their reviews: STY-4123 (schoolwear) and
    STY-8908 (footwear) are about sizing, STY-5094 (bags) about quality (straps, zips), STY-8683 (bodycare) about
    expectations (not as described). All other styles have flat background feedback.
  checks:
    - tool: get_customer_feedback_themes_by_style
      args: {style_id: STY-4123}
      expect: ["sizing", "Much smaller than the age on the label"]
    - tool: get_customer_feedback_themes_by_style
      args: {style_id: STY-5094}
      expect: ["quality"]
    - tool: get_customer_feedback_themes_by_style
      args: {style_id: STY-8683}
      expect: ["expectation"]

- question: "03:25:Q5"
  story: >
    Athleisure style STY-4056 (Sage Top, SKU-100070/77/84) is rated in line with the assortment (about 4.05) and the
    top complaint theme is availability: size 14 (SKU-100084) is out of stock, so the problem is buying and
    distribution rather than the product.
  checks:
    - tool: get_range_reviews_summary
      args: {style_id: STY-4056}
      expect: ["STY-4056", "availability"]
    - tool: search_customer_reviews_for_product
      args: {sku: SKU-100084, theme: availability}
      expect: ["size 14"]

- question: "04:32:Q4"
  story: >
    SKU-102590 (Drinkware, stands in for the 750ml insulated bottle) has reviews led by insulation and the leakproof
    lid (rated about 4.5-4.6) with finish chipping as the main complaint (rating 3) and a few packaging dents.
  checks:
    - tool: search_customer_review_themes
      args: {sku: SKU-102590}
      expect: ["insulation", "lid", "finish"]
    - tool: get_competitor_ratings_for_products
      args: {category: insulated bottles}
      expect: ["John Lewis", "64.95"]

- question: "04:34:Q2"
  story: >
    Outerwear made by Portuguese and Turkish suppliers: SUP-0058 (PT) rated 4.5 with seam-sealing praised, SUP-0030
    (TR) 4.5, SUP-0079 (PT) 4.0, SUP-0065 (TR) 4.0, and SUP-0037 (PT) worst at about 3.5 because seams leak
    (waterproofing complaints).
  checks:
    - tool: search_customer_feedback_for_supplier
      args: {country: "PT,TR", category: Outerwear}
      expect: ["SUP-0058", "SUP-0037", "waterproofing"]

- question: "04:40:Q6"
  story: >
    Packaging complaints concentrate on SKU-100014 and SKU-100007 (torn polybags), K-1700 (crushed carton, smashed
    jug) and SKU-102590 (dented bottle); other products have one or two.
  checks:
    - tool: search_customer_review_themes
      args: {theme: packaging}
      expect: ["SKU-100014", "K-1700", "SKU-100007", "SKU-102590"]

- question: "05:42:Q5"
  story: >
    Shoe SKU-100301 (STY-4171) gets a growing number of sole separation reviews over the last 13 weeks (the sole
    batches from the new source started in July): about 20 mentions in the last 30 days against 8 in the 30 days before.
  checks:
    - tool: search_review_text_by_topic
      args: {topic: sole separation, date_from: "-90d"}
      expect: ["SKU-100301", "Sole separation"]

- question: "06:51:Q3"
  story: >
    Competitor lunch boxes (HomeShop Direct, John Lewis, Carrefour, Argos, JD Sports) have review text: leaking is the
    most common complaint (then insulation, size, durability); John Lewis is rated best (4.4), Carrefour worst (3.4).
  checks:
    - tool: get_review_theme_summary
      args: {category: Lunch boxes, sentiment: negative}
      expect: ["leaking", "competitor"]
    - tool: search_customer_reviews_for_competitor_products
      args: {category: Lunch boxes}
      expect: ["John Lewis", "Carrefour", "34"]

- question: "06:52:Q5"
  story: >
    Best-selling jeans SKU-100637 (style STY-T-4410): the most common complaint is the waistband gaping at the back
    (fit theme); customers praise comfort of the stretch denim most.
  checks:
    - tool: search_customer_reviews_for_product
      args: {sku: SKU-100637, max_rating: 3}
      expect: ["waistband", "gap"]
    - tool: get_review_theme_summary
      args: {sku: SKU-100637, sentiment: positive}
      expect: ["comfort"]

- question: "06:52:Q6"
  story: >
    Outerwear reviews from 25-34s ask for lightweight packable jackets with good pockets and recycled materials; German
    reviewers in that age group stress sustainability and warmth.
  checks:
    - tool: search_customer_reviews_by_segment
      args: {customer_segment: "25-34", category: Outerwear}
      expect: ["lightweight", "pockets", "sustainability"]
    - tool: search_customer_reviews_by_segment
      args: {customer_segment: "25-34", category: Outerwear, country: DE}
      expect: ["warmth", "sustainability"]

- question: "06:54:Q1"
  story: >
    K-1700 weekly rating falls from about 4.4 to under 3 over the last eight weeks; the low ratings are lid-seal
    leaks (quality theme), with a few crushed-carton and price complaints.
  checks:
    - tool: get_ratings_trend_for_sku
      args: {sku: K-1700, date_from: "-10w"}
      expect: ["week_start", "quality"]
    - tool: search_customer_reviews_for_product
      args: {sku: K-1700, max_rating: 2, date_from: "-30d"}
      expect: ["lid", "leak"]

- question: "06:54:Q5"
  story: >
    Rating outliers against the previous period: K-1700 (about 3.0 from 3.95, quality), SKU-100301 (sole separation),
    PF-220 (battery, 3.8) and SKU-100014 (3.5, fabric and colour, torn polybags); SKU-100007 and SKU-100021 are fine.
  checks:
    - tool: draft_range_review_shortlist
      args: {date_from: "-30d", limit_to: 5}
      expect: ["K-1700", "SKU-100014", "PF-220", "SKU-100301"]
    - tool: get_ratings_by_product
      args: {style_id: STY-4012, date_from: "-30d"}
      expect: ["SKU-100014", "prior_avg_rating"]

- question: "06:56:Q3"
  story: >
    Competitor wellness and recovery products: weighted blanket, massage gun and diffuser are bestsellers (4.4-4.6);
    the cold plunge tub, compression boots and sauna blanket were discontinued with ratings under 3.1 (leaking and
    set-up hassle, noise and durability, odour and overpricing).
  checks:
    - tool: search_customer_reviews_for_competitor_products
      args: {category: Wellness & recovery}
      expect: ["Weighted Blanket", "Cold Plunge Tub", "Sauna Blanket", "discontinued"]

- question: "06:58:Q3"
  story: >
    Kettle K-1700 reviews by theme show which product attributes customers notice: quality (lid seal), performance,
    design and ease of use; this feeds which cost cuts customers would notice.
  checks:
    - tool: get_review_theme_summary
      args: {sku: K-1700}
      expect: ["quality", "performance", "design"]

- question: "08:73:Q1"
  story: >
    Store ST214 has customer feedback rows collected at the store (background reviews with store_id set).
  checks:
    - tool: get_customer_feedback_for_store
      args: {store_id: ST214, date_from: "-90d"}
      expect: ["ST214"]

- question: "08:74:Q4"
  story: >
    Competitor kettle products matched to K-1700 with price and rating: John Lewis 4.6 at 89.99 down to Carrefour 3.9.
  checks:
    - tool: get_competitor_ratings_for_products
      args: {sku: K-1700}
      expect: ["John Lewis", "Carrefour", "89.99"]
