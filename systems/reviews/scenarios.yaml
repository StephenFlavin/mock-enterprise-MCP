- question: "02:21:Q1"
  story: "Seeded reviews for PF-220 (portable fan) with multiple feedback themes: sizing, quality, durability, fit, and comfort with varying ratings. The seed data plants the specific feedback themes that the returns manager needs to understand the top reasons for returns."
  checks:
    - tool: get_customer_feedback_themes_by_style
      args: {style_id: STY-PF-220}
      expect: ["feedback_count", "avg_rating"]

- question: "03:25:Q5"
  story: "Seeded reviews for STY-5520 athleisure range showing mixed ratings (2-4 stars) and multiple themes including sizing, fit, value, and comfort. The data shows the range underperforming with lower average ratings and specific complaints about fit and sizing issues."
  checks:
    - tool: get_range_reviews_summary
      args: {style_id: STY-5520}
      expect: ["review_count", "avg_rating", "positive_reviews"]

- question: "04:32:Q4"
  story: "Seeded competitor products for insulated bottles (750ml) from multiple competitors (SportGear Co, ActiveWear Inc, OutdoorMax, etc.) with prices ranging from 38.50 to 52.99 GBP and ratings from 4.1 to 4.6. Also seeded review themes for K-1700 showing customer feedback on quality and value."
  checks:
    - tool: search_customer_review_themes
      args: {sku: K-1700}
      expect: ["theme", "count", "avg_rating"]

- question: "04:34:Q2"
  story: "Seeded reviews for products from various suppliers. The system can retrieve customer feedback linked to supplier IDs through the product SKU->supplier_id relationship in master.products."
  checks:
    - tool: search_customer_feedback_for_supplier
      args: {supplier_id: SUP-0042}
      expect: ["review_id", "sku", "rating"]

- question: "04:40:Q6"
  story: "Seeded reviews with multiple themes (sizing, quality, durability, fit, comfort, value, color, packaging). Each theme is extracted and can be searched using search_customer_review_themes to find specific customer concerns about packaging and design approaches."
  checks:
    - tool: search_customer_review_themes
      args: {sku: SKU-100637}
      expect: ["theme", "count"]

- question: "05:42:Q5"
  story: "Seeded reviews for PF-220 shoes with 5 specific reviews about 'sole separation' problem occurring between 2026-09-28 and 2026-09-24. These reviews have low ratings (1-2 stars) and explicitly mention sole separation as the quality defect."
  checks:
    - tool: search_review_text_by_topic
      args: {topic: "sole separation"}
      expect: ["sole", "separation", "review_id", "sku"]

- question: "06:51:Q3"
  story: "Seeded competitor products for lunch boxes with 5 competitors offering prices from 29.50 to 42.99 GBP and ratings from 3.8 to 4.5. The seed data shows market options and competitor positioning for a new lunch box launch."
  checks:
    - tool: search_customer_reviews_for_competitor_products
      args: {category: "lunch box"}
      expect: ["competitor_product_id", "competitor_name", "avg_rating"]

- question: "06:52:Q5"
  story: "Seeded 6 reviews for SKU-100637 jeans with consistently high ratings (4-5 stars) and positive themes including fit, comfort, quality, and durability. Reviews mention 'perfect fit', 'comfortable all day', and 'great quality denim'. This supports the story of a best-selling product with strong customer feedback."
  checks:
    - tool: search_customer_reviews_for_product
      args: {sku: SKU-100637}
      expect: ["rating", "fit", "review_text"]

- question: "06:52:Q6"
  story: "Seeded reviews include customer_segment data with segments like 25-34, 35-44, 45-54, outdoor_enthusiast, and professional. Can search reviews by demographic segment to understand what different age groups and interest groups want from outdoor clothing."
  checks:
    - tool: search_customer_reviews_by_segment
      args: {customer_segment: "25-34"}
      expect: ["customer_segment", "rating", "review_id"]

- question: "06:54:Q1"
  story: "Seeded K-1700 kettle reviews spanning from 2026-09-01 to 2026-10-01 with ratings declining from 5 stars to 1 star over the 8-week period. Early reviews are positive (5, 4 stars) while recent reviews show quality issues (1, 2 stars). Themes progressively shift from durability/value to quality/leaking problems. This demonstrates the declining rating trend and quality issues the product manager needs to identify."
  checks:
    - tool: get_ratings_trend_for_sku
      args: {sku: K-1700, date_from: "-180d"}
      expect: ["week_ending", "avg_rating", "review_count"]

- question: "06:54:Q5"
  story: "Seeded multiple SKUs including STY-5520 with varying review counts and ratings. K-1700 shows declining ratings, SKU-100637 shows strong performance (5-star reviews). Data provides outlier examples for range review analysis with some products performing well and others underperforming."
  checks:
    - tool: get_ratings_by_product
      args: {style_id: STY-5520}
      expect: ["sku", "avg_rating", "review_count"]

- question: "06:54:Q5b"
  story: "Draft shortlist for range review using STY-5520 athleisure range, showing bottom performers based on low ratings and high problem review counts."
  checks:
    - tool: draft_range_review_shortlist
      args: {style_id: STY-5520, limit_to: 5}
      expect: ["sku", "avg_rating", "problem_reviews"]

- question: "06:56:Q3"
  story: "Seeded competitor products in various categories (outerwear, technical clothing, shoes, jeans) with ratings from 3.7 to 4.6. E-commerce competitors are tracked with pricing and rating data for market comparison and trend analysis."
  checks:
    - tool: search_customer_reviews_for_competitor_products
      args: {category: "outerwear"}
      expect: ["competitor_name", "avg_rating"]

- question: "06:58:Q3"
  story: "Seeded reviews with themes that indicate customer-noticed design aspects: quality (seal defects), durability (parts falling apart), value (overpriced perceptions). These themes show which product changes customers would notice most."
  checks:
    - tool: get_review_theme_summary
      args: {sku: K-1700}
      expect: ["theme", "review_count", "avg_rating"]

- question: "08:73:Q1"
  story: "Seeded customer feedback for ST214 store with reviews tagged to that specific location, showing store-level sentiment on the products carried there. Customer feedback for Store 214 helps identify local performance issues."
  checks:
    - tool: get_customer_feedback_for_store
      args: {store_id: ST214}
      expect: ["store_id", "rating", "review_text"]

- question: "08:74:Q4"
  story: "Seeded competitor products for multiple categories with ratings and review counts. This provides the e-commerce manager with competitive intelligence on how our products compare to competitor offerings in terms of customer ratings."
  checks:
    - tool: get_competitor_ratings_for_products
      args: {category: "insulated bottle"}
      expect: ["competitor_name", "avg_rating", "price_gbp"]
