- question: "01:10:Q4"
  story: >
    The DC1 tilt-tray sorter AST-DC1-SRT (master install date 2018-09) was acquired for
    £2,350,000 with a 15-year straight-line life. About 8 years in, £1,273,064 is depreciated
    and net book value is £1,076,936 against a £2.74m replacement cost, so replacing it
    would write off a large book value. (Master data makes it about 8 years old, not 12.)
  checks:
    - tool: get_asset_book_value
      args: {asset_id: AST-DC1-SRT}
      expect: ["AST-DC1-SRT", "1076935.89", "1273064.11", "2350000", "in_service"]

- question: "07:67:Q6"
  story: >
    Planned capex splits into automation (CAPEX-900001 sorter £450k, 900003 shuttle £280k,
    900005 conveyor £320k, 900008 robotic picking £650k = £1.7m) and renewable energy
    (900002 solar £85k, 900004 battery storage £120k, 900006 microgrid £250k = £455k).
    A cancelled solar canopy and a completed pilot are excluded by default.
  checks:
    - tool: get_planned_capex_by_type
      args: {investment_type: automation}
      expect: ["CAPEX-900001", "450000", "650000", "280000", "320000"]
    - tool: get_planned_capex_by_type
      args: {investment_type: renewable_energy}
      expect: ["CAPEX-900002", "CAPEX-900004", "335000", "120000"]
