# One entry per question row that uses this system's tools
- question: "01:10:Q4"
  story: >
    The sorter at Northampton DC (AST-DC1-SRT) was acquired in March 2014 for £485,000
    with a 15-year useful life. Over the last 12 years, £338,855 has been depreciated,
    leaving a net book value of £146,145. The aging sorter costs significantly to maintain,
    and engineers question whether it should continue to be maintained, undergo major overhaul,
    or be replaced. Current book value shows depreciation through age.
  checks:
    - tool: get_asset_book_value
      args: {asset_id: AST-DC1-SRT}
      expect: ["AST-DC1-SRT", "146145", "338855", "485000", "in_service"]

- question: "07:67:Q6"
  story: >
    The group has planned £1.2M in capital investment over the next 18 months,
    including automation equipment (sorter replacement at DC1 for £450k, conveyors and shuttles
    for £600k total) and renewable energy projects (solar panels £85k, battery storage £120k,
    microgrids £250k). Several projects target automation (CAPEX-900001, CAPEX-900003, CAPEX-900005)
    and renewable energy (CAPEX-900002, CAPEX-900004, CAPEX-900006) which may be eligible
    for tax incentives. Planned capex by type shows investment in automation and energy
    infrastructure.
  checks:
    - tool: get_planned_capex_by_type
      args: {}
      expect: ["sorter", "shuttle", "450000", "280000"]
    - tool: get_planned_capex_by_type
      args: {asset_class: other}
      expect: ["other", "625000"]
