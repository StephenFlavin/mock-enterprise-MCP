- question: "07:68:Q5"
  story: "Shrink at Leeds store (ST150) has tripled. We planted high-severity CCTV exceptions (EXC-900001 to 900004) with tampering and scanning errors from late August through late September, linked to incident logs (INC-900001 to 900003) showing internal theft patterns with estimated losses totaling 3000+ GBP. Queries will return these events and link to stock adjustments and POS anomalies."
  checks:
    - tool: get_cctv_exception_events_for_store
      args: {site_id: "ST150", severity: "high"}
      expect: ["ST150", "EXC-900001", "scanning_error", "high", "critical"]
    - tool: search_cctv_incident_logs
      args: {site_id: "ST150", incident_type: "internal_theft"}
      expect: ["INC-900001", "ST150", "internal_theft", "critical", "3000"]
    - tool: search_cctv_incident_logs
      args: {site_id: "ST150", severity: "high"}
      expect: ["INC-900002", "INC-900003", "POS", "refund"]

- question: "08:79:Q1"
  story: "Regional loss prevention analysis across UK stores over last 6 months. We planted incidents at multiple stores: ST150 (Leeds) with internal theft (INC-900001), ST001 (Swindon) with ORC activity (INC-900005), ST042 (Milton Keynes) with fraudulent refunds (INC-900006), ST031 (Bath) with till variance (INC-900007), and ST017 (Guildford) with suspicious voids (INC-900008). Each incident has high severity and specific evidence signals for pattern analysis."
  checks:
    - tool: search_cctv_incident_logs
      args: {severity: "high"}
      expect: ["INC-900001", "INC-900005", "INC-900006", "INC-900007", "INC-900008"]
    - tool: search_cctv_incident_logs
      args: {incident_type: "internal_theft"}
