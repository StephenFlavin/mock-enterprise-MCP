- question: "07:68:Q5"
  story: "ST150 Leeds Shopping Centre: from mid-September evening stockroom events (EXC-900001, 900003-900006) and critical internal-theft incident INC-900001 (4800 GBP) point to a staff member; self-checkout unit 5 scanner faults (INC-900002, 380 GBP) are a minor process/system factor."
  checks:
    - tool: search_cctv_incident_logs
      args: {site_id: "ST150"}
      expect: ["INC-900001", "internal_theft", "critical", "4800", "INC-900002", "process_error"]
    - tool: get_cctv_exception_events_for_store
      args: {site_id: "ST150", severity: "critical"}
      expect: ["EXC-900003", "Security tags removed"]

- question: "08:79:Q1"
  story: "UK North high/critical incidents: ST150 internal theft (INC-900001) and stock discrepancy, ST159 till 2 void pattern (INC-900004) and an organised group (INC-900006, same group at ST165/ST181), ST183 high-value refunds (INC-900009)."
  checks:
    - tool: search_cctv_incident_logs
      args: {region: "UK North", severity: "high"}
      expect: ["INC-900001", "INC-900004", "INC-900006", "INC-900009", "4800"]
    - tool: get_cctv_exception_events_for_store
      args: {site_id: "ST159", event_type: "unusual_activity"}
      expect: ["Till 2", "EMP-00481", "14:00 and 16:00"]

- question: "08:79:Q5"
  story: "Five Leeds stores: ST150, ST159 and ST181 show scanner/software faults on named self-checkout units (system-fault pattern); ST165 and ST183 show customers bypassing a working scanner (deliberate theft)."
  checks:
    - tool: get_cctv_exception_events_for_store
      args: {site_id: "ST181"}
      expect: ["EXC-900022", "unit 1", "software push"]
    - tool: get_cctv_exception_events_for_store
      args: {site_id: "ST165", severity: "high"}
      expect: ["scanner working normally", "unit 3"]
    - tool: get_cctv_exception_events_for_store
      args: {site_id: "ST183", event_type: "unusual_activity"}
      expect: ["unit 2", "scanner working normally"]
