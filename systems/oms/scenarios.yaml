# One entry per question row that uses this system's tools
- question: "01:6:Q5"
  story: >
    Store orders are on time 98.6% three weeks ago, falling to about 95% last week. The late orders sit on the DC1
    lane to North stores (Leeds ST159, ST150, ST183): since three weeks ago about half of North store orders are
    fulfilled from Northampton DC1 instead of Leeds DC3. ORD-900001 to ORD-900003 are late store orders still waiting.
  checks:
    - tool: get_store_service_level_trend
      args: {}
      expect: ["network", "DC1", "ST159"]
    - tool: update_order_priority
      args: {order_id: ORD-900001, priority: urgent}
      expect: ["urgent"]

- question: "01:8:Q5"
  story: >
    Online orders arrive mostly 10:00-14:00 and 18:00-22:00 with about two lines per order. The profile is by hour of day.
  checks:
    - tool: get_order_profile_summary
      args: {channel: online}
      expect: ["hour_of_day", "avg_lines_per_order", "online"]

- question: "03:31:Q4"
  story: >
    Cross-shipping is concentrated in the Leeds (DC3) catchment: about 32% of North orders come from Northampton DC1,
    almost all because stock is not at Leeds (placement, not site location). Split orders are 5.6% of shipped orders,
    up from 3.6% in the previous period.
  checks:
    - tool: get_cross_shipping_rate
      args: {date_from: "-30d"}
      expect: ["DC3", "due_to_stock_placement", "ALL"]
    - tool: get_split_order_rate
      args: {date_from: "-60d"}
      expect: ["ALL", "stock", "prior_split_rate_pct"]

- question: "05:42:Q1"
  story: >
    Seven Blush Blouse lots BATCH-POL-PINK-001 to 007 (SKU-100007/14/21). Most units have shipped to UK stores and
    wholesale; lots 004 to 007 still have allocated stock not yet shipped (007 none shipped). Lot 003 also went to DE.
  checks:
    - tool: get_shipped_units_by_lot
      args: {product_sku: SKU-100007}
      expect: ["BATCH-POL-PINK-004", "560", "240", "BATCH-POL-PINK-007", "500"]

- question: "05:47:Q1"
  story: >
    Portable fan PF-220: affected batch BATCH-PF220-2509-A sold 1385 units (720 to UK stores, 650 wholesale to DE/FR/IE,
    15 online); batch BATCH-PF220-2508-B sold 653.
  checks:
    - tool: get_units_sold_by_batch
      args: {product_sku: PF-220}
      expect: ["BATCH-PF220-2509-A", "1385", "BATCH-PF220-2508-B", "653"]

- question: "05:47:Q2"
  story: >
    Batch BATCH-PF220-2509-A was sold in GB (720), DE (300), FR (206) and IE (159).
  checks:
    - tool: get_countries_where_batch_sold
      args: {batch_id: BATCH-PF220-2509-A}
      expect: ["GB", "720", "DE", "300", "FR", "IE"]

- question: "07:65:Q2"
  story: >
    ORD-900040 (CUS-000028, 8,000 units, 480,000 GBP) shipped in two deliveries; the second (3,000 units) was signed for
    with only 2,640 received, 360 damaged or missing on pallet 4.
  checks:
    - tool: get_delivery_notes_for_invoice
      args: {order_id: ORD-900040}
      expect: ["480000", "2640", "360", "J. Patel"]

- question: "07:65:Q5"
  story: >
    CUS-000016 has three open orders on credit hold (75 days overdue); ORD-900050 is urgent at 20,000 GBP.
  checks:
    - tool: get_open_orders_for_customer
      args: {customer_id: CUS-000016}
      expect: ["ORD-900050", "urgent", "20000", "credit"]
    - tool: release_order_hold
      args: {order_id: ORD-900050}
      expect: ["none"]
    - tool: get_open_orders_for_customer
      args: {customer_id: CUS-000016}
      expect: ["ORD-900051"]

- question: "08:74:Q5"
  story: >
    Online split orders rise from about 4% to 11%, mostly cause stock: rule AR-900002 caps K-1700 online at 20% while
    online demand is higher, so online orders are part-filled and split. Editing the rule is a write.
  checks:
    - tool: get_split_order_rate
      args: {channel: online}
      expect: ["stock", "ALL"]
    - tool: list_split_orders_by_cause
      args: {cause: stock, channel: online, product_sku: K-1700}
      expect: ["K-1700", "stock", "online"]
    - tool: get_allocation_rules
      args: {product_sku: K-1700}
      expect: ["AR-900002", "capped at 20%"]
    - tool: update_allocation_rule
      args: {rule_id: AR-900002, store_pct: 55, online_pct: 35, wholesale_pct: 10}
      expect: ["35", "55"]

- question: "08:74:Q6"
  story: >
    K-1700 is hot: weekly units rise across stores and online. Rule AR-900002 currently gives online 20%. Scenarios compare
    the rule with pro rata, online first and stores first after a 20% click-and-collect hold-back.
  checks:
    - tool: get_sell_through_by_channel
      args: {product_sku: K-1700}
      expect: ["store", "online", "units_wow_pct"]
    - tool: calculate_allocation_scenarios
      args: {product_sku: K-1700, available_units: 1000, store_demand: 800, online_demand: 600, hold_back_pct: 20}
      expect: ["current_rule", "pro_rata_to_demand", "200"]
    - tool: update_channel_allocation_for_product
      args: {product_sku: K-1700, store_pct: 56, online_pct: 32, wholesale_pct: 12, hold_back_pct: 20}
      expect: ["AR-900102", "56", "20"]
    - tool: get_allocation_rules
      args: {product_sku: K-1700}
      expect: ["AR-900102", "32"]

- question: "08:75:Q1"
  story: >
    CUS-000030's last four orders: ORD-900070 allocated short (800 requested, 560 allocated: our fault), ORD-900071 lost by
    the carrier (shipped, never delivered), ORD-900072 fully allocated but shipped 450 of 500 (short pick), ORD-900073 in full.
  checks:
    - tool: get_allocation_decision_for_order
      args: {order_id: ORD-900070}
      expect: ["800", "560", "240", "true"]
    - tool: get_allocation_decision_for_order
      args: {order_id: ORD-900072}
      expect: ["500", "450"]

- question: "08:75:Q2"
  story: >
    Three wholesale customers ordered 15,000 units of SKU-100035 (ORD-900060 6,000 CUS-000036, ORD-900061 5,000 CUS-000037,
    ORD-900062 4,000 CUS-000038); 8,000 available. Allocating the oldest orders first leaves the last customer short.
  checks:
    - tool: get_open_wholesale_orders_for_product
      args: {product_sku: SKU-100035}
      expect: ["ORD-900060", "6000", "ORD-900061", "5000", "ORD-900062", "4000"]
    - tool: calculate_allocation_scenarios
      args: {product_sku: SKU-100035, available_units: 8000, store_demand: 0, online_demand: 0, wholesale_demand: 15000}
      expect: ["current_rule", "8000"]
    - tool: update_wholesale_order_allocation
      args: {order_id: ORD-900060, line_no: 1, qty_allocated: 6000}
      expect: ["6000"]
    - tool: draft_short_shipment_message_to_customers
      args: {customer_id: CUS-000038, product_sku: SKU-100035}
      expect: ["ORD-900062", "4000 short", "Order Management"]

- question: "08:75:Q4"
  story: >
    Six key accounts have 26 weeks of orders; CUS-000024 and CUS-000026 order less than in the previous 13 weeks (fewer orders),
    CUS-000022 and CUS-000031 more.
  checks:
    - tool: get_key_account_order_history
      args: {}
      expect: ["CUS-000024", "CUS-000026", "revenue_change_pct"]

- question: "08:75:Q5"
  story: >
    Fill rate by wholesale account: CUS-000010 is the worst key account (88% of units), then CUS-000033, CUS-000026; CUS-000022 is best.
  checks:
    - tool: get_fill_rate_by_account
      args: {}
      expect: ["CUS-000010", "CUS-000022", "unit_fill_rate_pct"]

- question: "09:83:Q5"
  story: >
    Online oversells climb in the last two weeks (about three a day), a mix of cancelled and short-shipped orders.
  checks:
    - tool: get_oversell_incidents
      args: {channel: online, date_from: "-14d"}
      expect: ["online", "cancelled", "short_shipped"]

- question: "09:85:Q5"
  story: >
    About 50 orders and 110,000 GBP of revenue flow through OMS per day.
  checks:
    - tool: get_daily_throughput_and_revenue_at_risk
      args: {date_from: "-5d"}
      expect: ["avg_daily_revenue_gbp", "online_orders"]
