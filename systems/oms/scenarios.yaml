# One entry per question row that uses this system's tools
- question: "01:6:Q5"
  story: >
    Store service level fell from 98.5% to 95% over the last three weeks. Orders ORD-900002 through ORD-900004
    (CUS-000002 to CUS-000004) show weekly delivery performance. Recent orders ORD-900011 and ORD-900012 have delivered
    on time but ORD-900009 was split across two shipments due to stock issues, affecting overall service level.
  checks:
    - tool: get_store_service_level_trend
      args: {store_id: ""}
      expect: ["service_level_pct", "delivered"]
    - tool: update_order_priority
      args: {order_id: ORD-900001, priority: urgent}
      expect: ["urgent"]

- question: "01:8:Q5"
  story: >
    Order profile shows 19 orders across store, online, and wholesale channels over the past week.
    Orders typically arrive with 1-2 line items, peaking in morning hours at 8-10am.
  checks:
    - tool: get_order_profile_summary
      args: {channel: ""}
      expect: ["store", "online", "wholesale"]

- question: "03:31:Q4"
  story: >
    Cross-shipping analysis shows 9 orders (47%) fulfilled from non-origin DC,
    with split orders due to stock issues (ORD-900009, ORD-900015) and wave planning (ORD-900004).
  checks:
    - tool: get_cross_shipping_rate
      args: {date_from: "-60d"}
      expect: ["cross_ship"]
    - tool: get_split_order_rate
      args: {cause: "stock"}
      expect: ["stock"]
    - tool: list_split_orders_by_cause
      args: {cause: "stock"}
      expect: ["ORD-900009", "stock"]

- question: "05:42:Q1"
  story: >
    Batch BAT-900023 and BAT-900024 (PF-220 and SKU-100021) failed colourfastness testing.
    These were shipped to GB stores totaling 100 units each.
    BAT-900003 also contains PF-220 shipped to stores on 2026-09-24.
  checks:
    - tool: get_shipped_units_by_lot
      args: {batch_id: BAT-900023, product_sku: PF-220}
      expect: ["GB", "100"]

- question: "05:47:Q1"
  story: >
    Portable fan SKU PF-220 battery issue. Batch BAT-900023 (100 units) shipped to stores,
    BAT-900003 (60 units) to stores, BAT-900012 (30 units) and BAT-900017 (57 units) to stores.
    Total ~247 units with PF-220 in various batches sold to store and online channels.
  checks:
    - tool: get_units_sold_by_batch
      args: {batch_id: BAT-900023, product_sku: PF-220}
      expect: ["100"]

- question: "05:47:Q2"
  story: >
    Batch BAT-900023 (PF-220) sold in GB only to stores (100 units).
  checks:
    - tool: get_countries_where_batch_sold
      args: {batch_id: BAT-900023, product_sku: PF-220}
      expect: ["GB", "100"]

- question: "07:65:Q2"
  story: >
    Order ORD-900015 (wholesale customer CUS-000015) for 600 units across 2 lines shipped via
    SHP-900012 and SHP-900013 with delivery notes DN-001 and DN-002.
  checks:
    - tool: get_delivery_notes_for_invoice
      args: {order_id: ORD-900015}
      expect: ["DN-001", "DN-002"]

- question: "07:65:Q5"
  story: >
    Customer CUS-000016 is 75 days overdue with hold status "credit".
    They have order ORD-900016 (200 units, £10k) that should ship but is held.
  checks:
    - tool: get_open_orders_for_customer
      args: {customer_id: CUS-000016}
      expect: ["ORD-900016", "credit"]
    - tool: release_order_hold
      args: {order_id: ORD-900016}
      expect: ["none"]

- question: "08:74:Q5"
  story: >
    Split orders are up due to stock issues. ORD-900009 split across SHP-900007 and SHP-900008 (stock),
    ORD-900015 split across SHP-900012 and SHP-900013 (location).
    Allocation rules show varying allocations by customer.
  checks:
    - tool: list_split_orders_by_cause
      args: {cause: ""}
      expect: ["stock", "location"]
    - tool: get_allocation_rules
      args: {}
      expect: ["40", "35", "25"]
    - tool: update_allocation_rule
      args: {rule_id: AR-900001, store_pct: 45, online_pct: 30, wholesale_pct: 25}
      expect: ["45", "30", "25"]

- question: "08:74:Q6"
  story: >
    Hot seller K-1700 has strong performance across all channels. Recent sell-through shows
    store and wholesale demand.  Allocation scenarios calculate distribution of limited stock.
  checks:
    - tool: get_sell_through_by_channel
      args: {product_sku: "K-1700"}
      expect: ["units", "revenue"]
    - tool: calculate_allocation_scenarios
      args: {product_sku: "K-1700", available_units: 1000, store_demand: 500, online_demand: 400, wholesale_demand: 200}
      expect: ["allocation"]
    - tool: update_channel_allocation_for_product
      args: {product_sku: "K-1700", channel: "store", store_pct: 50, online_pct: 30, wholesale_pct: 20}
      expect: ["50", "30", "20"]

- question: "08:75:Q1"
  story: >
    Wholesale customer CUS-000015 orders (ORD-900015 for 600 units) show allocation decisions revealing
    that both lines were allocated from DC1 and DC3 respectively, both shipped in full.
  checks:
    - tool: get_allocation_decision_for_order
      args: {order_id: ORD-900015}
      expect: ["DC1", "DC3", "300"]

- question: "08:75:Q2"
  story: >
    Two wholesale orders for SKU-100035: ORD-900007 (500 units, CUS-000007), ORD-900018 (450 units, CUS-000018).
    With 8000 units total demand and limited stock, allocation scenarios needed. Short shipment message drafted.
  checks:
    - tool: get_open_wholesale_orders_for_product
      args: {product_sku: "SKU-100035"}
      expect: ["ORD-900007", "ORD-900018"]
    - tool: calculate_allocation_scenarios
      args: {product_sku: "SKU-100035", available_units: 8000, store_demand: 3000, online_demand: 2500, wholesale_demand: 2500}
      expect: ["allocation_method"]
    - tool: update_wholesale_order_allocation
      args: {order_id: ORD-900007, line_no: 2, qty_allocated: 500}
      expect: ["500"]
    - tool: draft_short_shipment_message_to_customers
      args: {customer_id: CUS-000007}
      expect: ["CUS-000007", "Order Management"]

- question: "08:75:Q4"
  story: >
    Key account CUS-000015 has order history showing ORD-900015 (wholesale channel).
    Orders placed with consistent patterns over 13-week lookback.
  checks:
    - tool: get_key_account_order_history
      args: {customer_id: CUS-000015}
      expect: ["week", "revenue"]

- question: "08:75:Q5"
  story: >
    Fill rate by account shows wholesale performance. Wholesale orders tracked with fill metrics
    by customer (CUS-000015, CUS-000007, CUS-000010).
  checks:
    - tool: get_fill_rate_by_account
      args: {customer_id: ""}
      expect: ["fill_rate_pct"]

- question: "09:83:Q5"
  story: >
    Oversell incidents tracked. Orders ORD-900006 and ORD-900010 show cancellation/short shipment due
    to stock reasons (oversold = true in allocation decisions).
  checks:
    - tool: get_oversell_incidents
      args: {reason: ""}
      expect: ["cancelled", "stock"]

- question: "09:85:Q5"
  story: >
    Daily throughput from 2026-09-15 through 2026-10-07 shows 20 orders averaging 90 units,
    £100k+ daily revenue at risk from ransomware on warehouse systems.
  checks:
    - tool: get_daily_throughput_and_revenue_at_risk
      args: {date_from: "-30d"}
      expect: ["orders", "units", "revenue_gbp"]
