      expect: ["5184", "4651", "site_total_qty"]
    - tool: create_stock_transfer
      args: {from_site_id: DC2, to_site_id: ST145, sku: SKU-104963, qty_requested: 200, reason: rebalance}
      expect: ["STR-", "draft", "ST145"]
- question: "03:22:Q5"
