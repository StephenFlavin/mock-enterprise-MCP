# Scenarios for WMS
# Stage 1: 19 tools (initial build)
# Stage 2: 19 additional tools

- question: "01:4:Q3"
  story: >
    Cycle count planner uses calculate_count_priority_score to identify high-risk locations.
    get_historical_count_accuracy_by_location shows DC1 has 15% accuracy issue rate in zone C.
    create_cycle_count_task creates task CCT-900001. draft_cycle_count_sheet is generated.
  checks:
    - tool: calculate_count_priority_score
      args: {site_id: DC1}
      expect: ["priority_score", "DC1"]
    - tool: get_historical_count_accuracy_by_location
      args: {site_id: DC1}
      expect: ["accuracy_issue_pct", "DC1"]
    - tool: create_cycle_count_task
      args: {location_id: DC1-C-14-02, priority: 95}
      expect: ["CCT-", "planned"]
    - tool: draft_cycle_count_sheet
      args: {location_ids: "DC1-C-14-02"}
      expect: ["CYCLE COUNT", "DC1-C-14-02"]

- question: "01:4:Q4"
  story: >
    Goods receipts compared to ASNs. GR-900001 shows qty_received=950 vs ASN qty=1000 (-50 units).
    compare_receipts_to_asns shows variance by supplier. get_asn_timeliness_history shows
    supplier performance over 90 days with lead times and accuracy metrics.
  checks:
    - tool: compare_receipts_to_asns
      args: {date_from: "-60d"}
      expect: ["variance", "receipt_id"]
    - tool: get_asn_timeliness_history
      args: {date_from: "-90d"}
      expect: ["lead_time", "accuracy", "supplier"]

- question: "03:22:Q1"
  story: >
    Style 5520 stockout analysis. get_goods_receipts_for_product shows GR-900003 of 2000 units
    received Oct-1. get_dc_stock_history_for_product shows movements over 90-day period
    with receipts, picks, and ending balance tracking.
  checks:
    - tool: get_goods_receipts_for_product
      args: {sku: PF-220}
      expect: ["receipt_id", "qty_received"]
    - tool: get_dc_stock_history_for_product
      args: {sku: PF-220, date_from: "-90d"}
      expect: ["date", "units", "receipt"]

- question: "03:22:Q4"
  story: >
    14,000 units of K-1700 kettle at DC1. get_dc_stock_for_product shows 14000 on-hand in reserve zone.
    create_stock_transfer creates STR-900001 from DC1 to DC3 for 1000 units, reason=rebalance.
  checks:
    - tool: get_dc_stock_for_product
      args: {sku: K-1700, site_id: DC1}
      expect: ["on_hand", "location_id"]
    - tool: create_stock_transfer
      args: {from_site_id: DC1, to_site_id: DC3, sku: K-1700, qty_requested: 1000, reason: rebalance}
      expect: ["STR-", "draft"]

- question: "01:6:Q2"
  story: >
    DC1 storage utilisation: pick 68%, reserve 82%, bulk 91%. get_dc_utilisation shows
    occupied vs vacant positions by zone. Total building utilisation 78%.
  checks:
    - tool: get_dc_utilisation
      args: {site_id: DC1}
      expect: ["utilisation_pct", "DC1", "zone"]

- question: "07:67:Q4"
  story: >
    Bonded warehouse opportunity for duty deferral. get_bonded_warehouse_volumes shows
    5000 units at DC2 suitable for bonded storage, stock value £45,000.
  checks:
    - tool: get_bonded_warehouse_volumes
      args: {site_id: DC2}
      expect: ["units", "value", "stock"]

- question: "08:74:Q2"
  story: >
    Black Friday peak capacity planning. get_dc_daily_capacity shows DC1 can pick 8000 units/day
    but forecast predicts 8500/day. Daily breakdown shows orders_picked, units_picked, units_per_order.
  checks:
    - tool: get_dc_daily_capacity
      args: {site_id: DC1, date_from: "-7d"}
      expect: ["units_picked", "date", "orders"]

- question: "09:87:Q5"
  story: >
    DC1 cost analysis. get_dc_product_mix_and_volume shows 45000 units/month volume,
    40% apparel, 30% home goods. Average order 1.8 units.
  checks:
    - tool: get_dc_product_mix_and_volume
      args: {site_id: DC1}
      expect: ["volume", "category", "sku_count"]

- question: "01:4:Q1"
  story: >
    Bay C-14 variance. block_location creates LB-000001 to prevent picks/putaways.
    Reason: "Variance pending recount".
  checks:
    - tool: block_location
      args: {location_id: DC1-C-14-02, site_id: DC1, reason: "Variance pending recount"}
      expect: ["LB-", "blocked"]

- question: "03:22:Q5"
  story: >
    Out-of-stock rate trending up. get_dc_inbound_delays shows 8 receipts 3+ days late,
    representing 2000 units short from suppliers. Supplier SUP-0042 has most delays.
  checks:
    - tool: get_dc_inbound_delays
      args: {site_id: DC1, days_late_threshold: 3, date_from: "-90d"}
      expect: ["days_late", "receipt_id"]

- question: "04:40:Q1"
  story: >
    Packaging material evaluation. calculate_pallet_fill_by_pack_spec for PF-220 fan shows
    polybag spec: 4 units/pack, 100 packs/pallet = 400 units/pallet max.
  checks:
    - tool: calculate_pallet_fill_by_pack_spec
      args: {sku: PF-220}
      expect: ["units_per_pallet", "400"]

- question: "01:4:Q2_causes"
  story: >
    Adjustment classification. get_cause_code_definitions lists all cause codes and their
    intended use. CC-001 for counting errors, CC-003 for supplier shorts, CC-005 for system errors.
  checks:
    - tool: get_cause_code_definitions
      args: {}
      expect: ["cause_code", "description", "category"]
