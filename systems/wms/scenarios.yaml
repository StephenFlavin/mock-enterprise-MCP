# Scenarios for WMS stage 1 (19 tools)

- question: "01:4:Q3"
  story: >
    Cycle count planner has 3 days of counting capacity. Using list_locations_by_last_count_date,
    get_historical_count_accuracy_by_location, and calculate_count_priority_score, the highest priority
    locations are identified for counting. Tasks are created with priority scores.
  checks:
    - tool: calculate_count_priority_score
      args: {site_id: DC1}
      expect: ["priority_score", "DC1"]
    - tool: get_historical_count_accuracy_by_location
      args: {site_id: DC1}
      expect: ["accuracy_issue_pct", "DC1"]
    - tool: create_cycle_count_task
      args: {location_id: DC1-C-14-02, priority: 95}
      expect: ["CCT-", "planned"]
    - tool: draft_cycle_count_sheet
      args: {location_ids: "DC1-C-14-02"}
      expect: ["CYCLE COUNT", "DC1-C-14-02"]
    - tool: cancel_cycle_count_task
      args: {task_id: CCT-900001, cancel_reason: "Location blocked"}
      expect: ["cancelled"]

- question: "01:4:Q4"
  story: >
    Comparing goods receipts to ASN for recent weeks. Goods receipt GR-900001 of PF-220 shows
    qty_received=950 but ASN qty=1000, resulting in -50 unit variance. Supplier performance shows
    lead times and accuracy trends over 90 days.
  checks:
    - tool: compare_receipts_to_asns
      args: {date_from: "-60d"}
      expect: ["variance", "receipt_id"]
    - tool: get_asn_timeliness_history
      args: {date_from: "-90d"}
      expect: ["lead_time", "accuracy", "supplier"]

- question: "03:22:Q1"
  story: >
    Style 5520 had receipt history showing goods received for multiple SKUs at different times.
    DC stock history shows movements over 90 days prior to stockout issue.
  checks:
    - tool: get_goods_receipts_for_product
      args: {sku: PF-220}
      expect: ["receipt_id", "qty_received"]
    - tool: get_dc_stock_history_for_product
      args: {sku: PF-220, date_from: "-90d"}
      expect: ["date", "units", "receipt"]

- question: "03:22:Q4"
  story: >
    14,000 units of K-1700 kettle sit at DC1. Current DC stock query shows on-hand quantity
    by location. Rebalance transfer created from DC1 to DC3 for 1000 units.
  checks:
    - tool: get_dc_stock_for_product
      args: {sku: K-1700, site_id: DC1}
      expect: ["on_hand", "location_id"]
    - tool: create_stock_transfer
      args: {from_site_id: DC1, to_site_id: DC3, sku: K-1700, qty_requested: 1000, reason: rebalance}
      expect: ["STR-", "draft"]

- question: "01:6:Q2"
  story: >
    DC1 storage utilisation shows 78% overall. By zone: pick 68% full, reserve 82%, bulk 91%.
    Pallet positions occupied by category (apparel 4000, home 2000).
  checks:
    - tool: get_dc_utilisation
      args: {site_id: DC1}
      expect: ["utilisation_pct", "DC1", "zone"]

- question: "07:67:Q4"
  story: >
    Bonded warehouse volumes for duty deferral: 5000 units eligible stock at cost £45,000.
    Stock in DC2 reserve suitable for bonded storage.
  checks:
    - tool: get_bonded_warehouse_volumes
      args: {site_id: DC2}
      expect: ["units", "value", "bonded"]

- question: "08:74:Q2"
  story: >
    Black Friday peak forecast: DC1 daily capacity 8000 units/day picking. Actual orders forecast 8500/day.
    Capacity data by date shows daily limit of 500 orders/wave, 3 waves/day.
  checks:
    - tool: get_dc_daily_capacity
      args: {site_id: DC1, date_from: "-7d"}
      expect: ["units_picked", "date", "orders"]

- question: "09:87:Q5"
  story: >
    Northampton DC (DC1) product mix analysis. Volume handled 45,000 units/month.
    Mix shows 40% apparel, 30% home, 30% other categories.
  checks:
    - tool: get_dc_product_mix_and_volume
      args: {site_id: DC1}
      expect: ["volume", "category", "sku_count"]

- question: "01:4:Q1"
  story: >
    Bay C-14 (DC1-C-14-02) has stock accuracy issue. Stock movements over 90 days show receipts
    and picks. Location is blocked pending recount.
  checks:
    - tool: get_stock_movements_for_location
      args: {location_id: DC1-C-14-02, days: 90}
      expect: ["movement", "qty"]
    - tool: block_location
      args: {location_id: DC1-C-14-02, site_id: DC1, reason: "Variance pending recount"}
      expect: ["LB-", "blocked"]

- question: "03:22:Q5"
  story: >
    Out-of-stock rate up from 4% to 6.5%. DC inbound delays account for 0.8pp with receipts
    arriving 3+ days late. Supplier SUP-0042 has most delays.
  checks:
    - tool: get_dc_inbound_delays
      args: {site_id: DC1, days_late_threshold: 3, date_from: "-90d"}
      expect: ["days_late", "receipt_id"]

- question: "04:40:Q1"
  story: >
    Packaging material comparison for small appliances (PF-220 fan). Current polybag spec:
    4 units/pack, 100 packs/pallet = 400 units/pallet. Pallet fill calculation.
  checks:
    - tool: calculate_pallet_fill_by_pack_spec
      args: {sku: PF-220}
      expect: ["units_per_pallet", "pallet"]

- question: "01:4:Q1_cause"
  story: >
    Inventory adjustment cause codes help classify variance reasons. Reference list shows
    counting error, damage, supplier short, carrier damage, system error, expiry, theft.
  checks:
    - tool: get_cause_code_definitions
      args: {}
      expect: ["cause_code", "description", "category"]
