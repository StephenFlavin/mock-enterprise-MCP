      expect: ["DC3", "55.3", "88.5"]
- question: "04:40:Q1"
  story: >
    SKU-100532 has corrugated (250 per pallet), moulded pulp (200) and recycled plastic (400) pack specs.
  checks:
    - tool: calculate_pallet_fill_by_pack_spec
      args: {sku: SKU-100532, annual_units: 400000}
      expect: ["1600", "2000", "1000", "moulded_pulp"]
