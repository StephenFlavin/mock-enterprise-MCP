- question: "01:4:Q2"
  story: >
    Adjustment Q3 analysis. list_cycle_count_corrections shows 12 reversals and 28 corrections over £500.
    Clustering shows 8 adjustments in zone B on night shift, 6 in zone C on morning shift.
    get_cause_code_definitions helps classify causes. CC-001 used as catch-all for 15 items.
  checks:
    - tool: list_cycle_count_corrections
      args: {site_id: DC1, date_from: "-90d"}
      expect: ["correction_status", "variance", "location_id"]
    - tool: get_cause_code_definitions
      args: {category: counting_error}
      expect: ["cause_code", "description", "intended_use"]

- question: "01:8:Q1"
  story: >
    140 orders stuck in allocation_failed since 6am. list_orders_by_status shows order_id, lines, units.
    list_allocation_failure_reasons identifies 60 from insufficient_stock, 45 from location_unavailable,
    35 from configuration_error. SKUs affected: PF-220, K-1700, STY-5520.
    retry_order_allocation resolves the stuck orders.
  checks:
    - tool: list_orders_by_status
      args: {status: allocated, site_id: DC1, date_from: "-1d"}
      expect: ["order_id", "lines", "units"]
    - tool: list_allocation_failure_reasons
      args: {status: allocation_failed, date_from: "-1d"}
      expect: ["failure_reason", "order_count"]
    - tool: retry_order_allocation
      args: {reference_id: "ORD-2026-191217"}
      expect: ["new_status", "allocated"]

- question: "01:8:Q3"
  story: >
    WMS version 9.2 duplicate task issue. get_wms_version_and_patches shows all DC sites on v9.2-20261001,
    3 patches applied, status=Stable. list_replenishment_task_duplicates shows 8 duplicate replenishment
    tasks created after run on 2026-10-02 in zones A and B. Configuration change from wave cutoff
    adjustment is the likely cause from list_recent_configuration_changes.
  checks:
    - tool: get_wms_version_and_patches
      args: {}
      expect: ["wms_version", "patches_applied", "status"]
    - tool: list_replenishment_task_duplicates
      args: {site_id: DC1, date_from: "-30d"}
      expect: ["location_id", "task_status"]
    - tool: list_recent_configuration_changes
      args: {date_from: "-60d"}
      expect: ["change_type", "change_date"]

