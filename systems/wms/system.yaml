id: wms
name: Warehouse Management System (WMS)
instructions: >
  DC stock levels, cycle counting, goods receipts, and warehouse operations for Northampton, Daventry, Leeds and smaller DCs.
  Stock location ids look like DC1-C-14-02. Goods receipt ids look like GR-000123. Cycle count task ids look like CCT-000123.
  Stock transfer ids look like STR-000123.

tables:
  goods_receipts:
    key: receipt_id
    cols:
      receipt_id: {type: str, desc: "Goods receipt id, e.g. GR-000123"}
      po_id: {type: str, desc: "Purchase order being received"}
      site_id: {type: str, desc: "DC receiving, e.g. DC1"}
      sku: {type: str, desc: "Product being received"}
      qty_ordered: {type: int, desc: "Quantity ordered on the PO line (equals the quantity advised on the ASN)"}
      qty_received: {type: int, desc: "Quantity physically received"}
      qty_accepted: {type: int, desc: "Quantity accepted (received less damaged)"}
      received_at: {type: timestamp, desc: "Date and time of receipt"}
      received_by: {type: str, desc: "Employee id of receiving person"}
      dock: {type: str, desc: "Dock number, e.g. D07"}
      carrier_id: {type: str, desc: "Carrier that delivered"}
      batch_number: {type: str, desc: "Product batch/lot number if applicable"}
      expiry_date: {type: date, desc: "Product expiry date if applicable"}
      damage_qty: {type: int, desc: "Units damaged on receipt"}
      short_qty: {type: int, desc: "Units short on receipt against the ordered quantity"}
      updated_at: {type: timestamp, desc: "Last updated"}
      notes: {type: text, desc: "Goods-in notes, e.g. pallet count against ASN"}

  location_inventory:
    key: stock_id
    cols:
      stock_id: {type: str, desc: "Stock record id, e.g. LI-000123"}
      location_id: {type: str, desc: "DC bin location holding the stock, e.g. DC1-C-14-02"}
      site_id: {type: str, desc: "DC, e.g. DC1"}
      sku: {type: str, desc: "Product held"}
      lot_number: {type: str, desc: "Lot if tracked"}
      status: {type: enum, values: [on-hand, quarantine, damaged, expired, reserved, in-transit], desc: "WMS inventory status"}
      qty: {type: int, desc: "System quantity held in this status at the location"}
      updated_at: {type: timestamp, desc: "Last updated"}

  pallet_position_history:
    key: [week_start, site_id, zone, category]
    cols:
      week_start: {type: date, desc: "Monday of the week the snapshot was taken"}
      site_id: {type: str, desc: "DC"}
      zone: {type: str, desc: "Warehouse zone (pick, reserve, bulk, mezzanine, hazmat)"}
      category: {type: str, desc: "Product category held"}
      positions_occupied: {type: int, desc: "Pallet positions (reserve and bulk locations) holding this category"}

  cycle_count_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Cycle count task id, e.g. CCT-000123"}
      location_id: {type: str, desc: "DC bin location to count, e.g. DC1-C-14-02"}
      site_id: {type: str, desc: "DC, e.g. DC1"}
      status: {type: enum, values: [planned, released, completed, cancelled], desc: "Task status"}
      assigned_to: {type: str, desc: "Employee id assigned to count"}
      created_at: {type: timestamp, desc: "When task was created"}
      released_at: {type: timestamp, desc: "When released to handheld"}
      completed_at: {type: timestamp, desc: "When completed"}
      cancelled_at: {type: timestamp, desc: "When cancelled"}
      cancel_reason: {type: str, desc: "Reason for cancellation"}
      reason: {type: str, desc: "Why the count was requested, e.g. Recount after variance"}
      priority: {type: int, desc: "Priority score for counting order (higher = count sooner)"}
      updated_at: {type: timestamp, desc: "Last updated"}
      category: {type: str, desc: "Product category to count when the task covers a whole category at the DC rather than one bin"}
      scheduled_date: {type: date, desc: "Date the count is planned for"}

  cycle_count_results:
    key: result_id
    cols:
      result_id: {type: str, desc: "Cycle count result id, e.g. CCR-000123"}
      task_id: {type: str, desc: "Related cycle count task"}
      location_id: {type: str, desc: "DC bin location"}
      sku: {type: str, desc: "Product counted"}
      system_qty: {type: int, desc: "Quantity in system before count"}
      counted_qty: {type: int, desc: "Quantity physically counted"}
      variance: {type: int, desc: "counted_qty minus system_qty"}
      variance_pct: {type: float, desc: "Variance as percentage of system quantity"}
      counted_at: {type: timestamp, desc: "When the count was performed"}
      counted_by: {type: str, desc: "Employee id who counted"}
      accuracy_issue: {type: bool, desc: "True if the variance is 2% or more of system quantity"}
      reversed_within_48h: {type: bool, desc: "True if the count correction was reversed within 48 hours"}
      reversed_at: {type: timestamp, desc: "When the correction was reversed, if it was"}
      cause_code: {type: str, desc: "Cause code on the correction, e.g. cycle_count_variance or other"}
      lot_number: {type: str, desc: "Product lot if tracked"}
      condition: {type: str, desc: "Product condition noted (good, damaged, expired)"}
      updated_at: {type: timestamp, desc: "Last updated"}

  stock_movements:
    key: movement_id
    cols:
      movement_id: {type: str, desc: "Stock movement id, e.g. MOV-000123"}
      location_id: {type: str, desc: "DC bin location affected"}
      site_id: {type: str, desc: "DC"}
      sku: {type: str, desc: "Product moved"}
      movement_type: {type: enum, values: [receipt, putaway, pick, transfer, adjustment, return], desc: "Type of movement"}
      qty: {type: int, desc: "Quantity moved (positive for receipt/putaway/adjustment up, negative for pick/adjustment down)"}
      reference_id: {type: str, desc: "Receipt id, transfer id, order id or adjustment id"}
      moved_at: {type: timestamp, desc: "When movement occurred"}
      moved_by: {type: str, desc: "Employee id"}
      batch_number: {type: str, desc: "Product lot if applicable"}
      status: {type: str, desc: "Movement status (completed, reversed)"}
      updated_at: {type: timestamp, desc: "Last updated"}
      notes: {type: text, desc: "Reason or comment recorded with the movement"}

  stock_transfers:
    key: transfer_id
    cols:
      transfer_id: {type: str, desc: "Stock transfer order id, e.g. STR-000123"}
      from_site_id: {type: str, desc: "Source DC or store"}
      to_site_id: {type: str, desc: "Destination DC or store"}
      sku: {type: str, desc: "Product being transferred"}
      qty_requested: {type: int, desc: "Quantity requested for transfer"}
      qty_allocated: {type: int, desc: "Quantity allocated from source"}
      qty_shipped: {type: int, desc: "Quantity shipped"}
      qty_received: {type: int, desc: "Quantity received at destination"}
      created_at: {type: timestamp, desc: "When transfer was requested"}
      shipped_at: {type: timestamp, desc: "When shipped from source"}
      received_at: {type: timestamp, desc: "When received at destination"}
      status: {type: enum, values: [draft, confirmed, allocated, shipped, received, cancelled], desc: "Transfer status"}
      reason: {type: str, desc: "Reason for transfer (rebalance, stockout, disposal, clearance)"}
      created_by: {type: str, desc: "Employee id who created transfer"}
      updated_at: {type: timestamp, desc: "Last updated"}

  pack_specifications:
    key: pack_spec_id
    cols:
      pack_spec_id: {type: str, desc: "Pack spec id, e.g. PKS-000123"}
      sku: {type: str, desc: "Product"}
      pack_type: {type: str, desc: "Pack type (polybag, carton, hanging, tray, pouch)"}
      material: {type: str, desc: "Pack material (corrugated, moulded_pulp, recycled_plastic, plastic_film, hanger)"}
      units_per_pack: {type: int, desc: "Units in one pack (minimum allocation unit)"}
      packs_per_pallet: {type: int, desc: "Packs per pallet"}
      units_per_pallet: {type: int, desc: "Total units per pallet"}
      pallet_height_cm: {type: int, desc: "Pallet height in cm"}
      pallet_weight_kg: {type: float, desc: "Pallet weight in kg"}
      bonded_suitable: {type: bool, desc: "Can this SKU go in bonded storage"}
      created_at: {type: timestamp, desc: "When spec was created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  cause_codes:
    key: cause_code
    cols:
      cause_code: {type: str, desc: "Cause code, e.g. receiving_variance or other"}
      description: {type: str, desc: "Cause description"}
      category: {type: str, desc: "Cause category, e.g. receiving, picking, loss, catch_all"}
      intended_use: {type: text, desc: "When and why this code should be used"}
      catch_all: {type: bool, desc: "True for the catch-all code that should be rare"}

  location_blocks:
    key: block_id
    cols:
      block_id: {type: str, desc: "Block record id, e.g. LB-000123"}
      location_id: {type: str, desc: "DC bin location"}
      site_id: {type: str, desc: "DC"}
      reason: {type: str, desc: "Reason for blocking"}
      blocked_at: {type: timestamp, desc: "When the location was blocked"}
      blocked_by: {type: str, desc: "Employee who blocked it"}
      unblocked_at: {type: timestamp, desc: "When unblocked (if released)"}
      status: {type: enum, values: [blocked, released], desc: "Current status"}

  allocation_retries:
    key: retry_id
    cols:
      retry_id: {type: str, desc: "Retry record id, e.g. RETRY-000123"}
      order_id: {type: str, desc: "Order that was retried"}
      previous_status: {type: str, desc: "Status before retry"}
      new_status: {type: str, desc: "Status after retry (retry_queued until allocation runs)"}
      result: {type: str, desc: "Result of retry (queued, success, partial, failed)"}
      retried_at: {type: timestamp, desc: "When the retry was requested"}
      created_by: {type: str, desc: "Employee who initiated retry"}
      notes: {type: text, desc: "Notes on retry outcome"}
      updated_at: {type: timestamp, desc: "Last updated"}

  order_lines:
    key: [order_id, line_no]
    cols:
      order_id: {type: str, desc: "Customer order id, e.g. ORD-2026-0100001"}
      line_no: {type: int, desc: "Line number within the order"}
      site_id: {type: str, desc: "DC fulfilling the order"}
      sku: {type: str, desc: "Product on the line"}
      qty: {type: int, desc: "Units on the line"}
      status: {type: enum, values: [allocation_failed, allocated, picking, shipped], desc: "Line status"}
      status_at: {type: timestamp, desc: "When the line reached its current status"}
      failure_code: {type: str, desc: "Allocation failure code, e.g. PACK_UOM_MISMATCH, LOCATION_BLOCKED"}
      failure_detail: {type: text, desc: "Why allocation failed"}
      pick_zone: {type: str, desc: "Zone the line is picked from"}
      released_at: {type: timestamp, desc: "When released to the floor"}
      picked_at: {type: timestamp, desc: "When picked"}
      shipped_at: {type: timestamp, desc: "When shipped"}
      updated_at: {type: timestamp, desc: "Last updated"}

  pick_exceptions:
    key: exception_id
    cols:
      exception_id: {type: str, desc: "Exception id, e.g. EXC-000123"}
      site_id: {type: str, desc: "DC where it happened"}
      process_stage: {type: enum, values: [wave_release, picking, loading], desc: "Process stage"}
      exception_type: {type: enum, values: [late_wave, short_pick, loading_exception], desc: "Exception type"}
      to_site_id: {type: str, desc: "Destination store of the wave or load"}
      wave_id: {type: str, desc: "Wave id, e.g. W-DC1-0929-AM"}
      sku: {type: str, desc: "Product for a short pick"}
      expected_qty: {type: int, desc: "Quantity that should have been picked"}
      actual_qty: {type: int, desc: "Quantity actually picked"}
      delay_minutes: {type: int, desc: "Minutes late for a late wave or loading exception"}
      occurred_at: {type: timestamp, desc: "When it happened"}
      cause: {type: str, desc: "Recorded cause"}
      updated_at: {type: timestamp, desc: "Last updated"}

  configuration_changes:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change record id, e.g. CFG-000123"}
      scope: {type: str, desc: "DC the change applies to, or ALL for network-wide"}
      change_type: {type: str, desc: "Kind of change, e.g. wave_template, pack_specification, cycle_count"}
      parameter: {type: str, desc: "Parameter or rule that changed"}
      old_value: {type: str, desc: "Value before"}
      new_value: {type: str, desc: "Value after"}
      description: {type: text, desc: "What changed and why"}
      changed_at: {type: timestamp, desc: "When the change went live"}
      changed_by: {type: str, desc: "Employee id who made the change"}
      status: {type: str, desc: "applied, pending or rolled_back"}

  wms_patches:
    key: patch_id
    cols:
      patch_id: {type: str, desc: "Patch id, e.g. WMS-9.2.7"}
      version: {type: str, desc: "Version or patch level, e.g. 9.2.7"}
      patch_type: {type: enum, values: [release, fix, security, feature], desc: "Kind of patch"}
      status: {type: enum, values: [current, applied, available], desc: "current = installed build, applied = earlier patch, available = not installed"}
      released_at: {type: date, desc: "Vendor release date"}
      applied_at: {type: timestamp, desc: "When installed, if installed"}
      summary: {type: str, desc: "One-line summary"}
      details: {type: text, desc: "Contents of the patch and test notes"}
      fixes_known_issue: {type: text, desc: "Known issues fixed by this patch"}

  replenishment_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Replenishment task id, e.g. RPL-000123"}
      site_id: {type: str, desc: "DC"}
      sku: {type: str, desc: "Product being replenished"}
      to_location_id: {type: str, desc: "Pick face being replenished"}
      qty: {type: int, desc: "Quantity to move"}
      status: {type: str, desc: "Task status"}
      created_at: {type: timestamp, desc: "When the task was created (to the second)"}
      trigger_receipt_id: {type: str, desc: "Goods receipt that triggered the task"}
      created_by: {type: str, desc: "Creator, WMS-AUTO for system-created tasks"}

  handling_damage_reports:
    key: report_id
    cols:
      report_id: {type: str, desc: "Handling damage report id, e.g. HDR-000123"}
      site_id: {type: str, desc: "DC where the damage was logged"}
      sku: {type: str, desc: "Product damaged"}
      location_id: {type: str, desc: "Bin or area where the damage happened"}
      process_stage: {type: enum, values: [receiving, putaway, replenishment, picking, packing, loading], desc: "Warehouse process step where the damage happened"}
      damage_qty: {type: int, desc: "Units damaged"}
      cause: {type: text, desc: "What happened, as logged by the operative"}
      reported_at: {type: timestamp, desc: "When the damage was reported"}
      reported_by: {type: str, desc: "Employee id of the reporter"}

  wave_configurations:
    key: config_id
    cols:
      config_id: {type: str, desc: "Wave configuration id, e.g. WVC-000001"}
      site_id: {type: str, desc: "DC the configuration applies to"}
      channel: {type: str, desc: "Order channel served: ecommerce, store_replenishment or click_collect"}
      wave_template: {type: str, desc: "Wave template name, e.g. W-ECOM"}
      release_times: {type: str, desc: "Daily wave release times, e.g. 06:00, 10:00, 13:00"}
      wave_cutoff_time: {type: str, desc: "Order cut-off for the last wave of the day"}
      shipping_cutoff: {type: str, desc: "Time picked orders must be packed and staged for the first carrier collection"}
      waves_per_day: {type: int, desc: "Number of waves released per day"}
      picking_method: {type: str, desc: "Picking method used, e.g. wave picking with zone batching"}
      avg_orders_per_wave: {type: int, desc: "Average orders released per wave"}
      min_wave_size: {type: int, desc: "Minimum orders needed before a wave releases"}
      release_trigger: {type: str, desc: "What releases a wave: scheduled time or order count"}
      updated_at: {type: timestamp, desc: "When the configuration was last changed"}

  inventory_status_mapping:
    key: wms_status
    cols:
      wms_status: {type: str, desc: "Inventory status in the WMS, e.g. quarantine"}
      erp_status: {type: str, desc: "Status the interface maps it to in the ERP"}
      definition: {type: text, desc: "What the status means"}
      wms_counts_as_available: {type: bool, desc: "Whether WMS counts stock in this status as available to allocate"}
      erp_counts_in_book_stock: {type: bool, desc: "Whether ERP still counts stock in this status in its book stock"}
      note: {type: text, desc: "How the difference arises and when it clears"}
      sort_order: {type: int, desc: "Display order"}

  process_capacity:
    key: capacity_id
    cols:
      capacity_id: {type: str, desc: "Capacity row id, e.g. CAP-DC2-PACK"}
      site_id: {type: str, desc: "DC, e.g. DC2"}
      process: {type: enum, values: [receiving, picking, packing, despatch], desc: "Warehouse process"}
      rated_units_per_hour: {type: int, desc: "Rated throughput in units per hour at standard staffing"}
      shift_hours_per_day: {type: float, desc: "Productive hours per day on the normal shift pattern"}
      operating_days_per_week: {type: int, desc: "Days per week the process runs"}
      peak_extra_hours_per_day: {type: float, desc: "Extra hours a day available in peak with overtime or a added shift"}
      avg_utilisation_pct: {type: float, desc: "Average share of rated daily capacity used over the last 13 weeks"}
      peak_utilisation_pct: {type: float, desc: "Share of rated daily capacity used in the busiest week of last peak (over 100 means overtime was needed)"}
      limiting_factor: {type: text, desc: "Main physical or equipment constraint on the process"}
      updated_at: {type: timestamp, desc: "When the rating was last reviewed"}

  handling_rate_card:
    key: driver
    cols:
      driver: {type: str, desc: "Cost driver, e.g. pick_per_line"}
      rate_gbp: {type: float, desc: "Cost in GBP per unit of the driver"}
      unit: {type: str, desc: "What the rate applies to, e.g. order line"}
      basis: {type: text, desc: "How the rate was set"}
      updated_at: {type: timestamp, desc: "When the rate was last changed"}

  inbound_field_schema:
    key: field_id
    cols:
      field_id: {type: str, desc: "Field row id, e.g. IFS-001"}
      entity: {type: str, desc: "Inbound entity: ASN Header, ASN Line, Receipt, Pack Specification or ASN Pallet"}
      field_name: {type: str, desc: "Field name as the supplier ASN or receipt calls it"}
      field_type: {type: str, desc: "Data type, e.g. string, int, date"}
      requirement: {type: enum, values: [Required, Optional, Not held], desc: "Whether the WMS needs the field, treats it as optional, or does not hold it at all"}
      description: {type: text, desc: "What the field means"}
      wms_table: {type: str, desc: "WMS table that stores it, blank if none"}
      wms_column: {type: str, desc: "WMS column that stores it, blank if none"}
      wms_supported: {type: bool, desc: "True if the WMS stores this field today"}
      gap_note: {type: text, desc: "What is missing or how it is held today"}
      sort_order: {type: int, desc: "Display order"}

  rollback_requirements:
    key: requirement_id
    cols:
      requirement_id: {type: str, desc: "Requirement id, e.g. RBK-001"}
      data_type: {type: str, desc: "Kind of WMS data that must be dealt with in a rollback"}
      sequence: {type: int, desc: "Order in which it is rolled back"}
      reversible: {type: bool, desc: "True if the data can be cleanly reversed"}
      rollback_method: {type: text, desc: "How the data is reversed or restored"}
      depends_on: {type: text, desc: "What must be in place first"}
      est_hours: {type: float, desc: "Estimated hours to roll this back for one DC"}
      owner_role: {type: str, desc: "Role that owns the step"}
      point_of_no_return: {type: text, desc: "When the step can no longer be reversed"}

tools:
  - name: block_location
    desc: Place a hold on a bin location so no picks or putaways are directed to it. Returns the block record.
    kind: insert
    table: location_blocks
    id_prefix: LB-
    defaults: {status: blocked, blocked_by: "EMP-00112", blocked_at: "$as_of"}
    args:
      location_id: {required: true, desc: "DC bin location to hold, e.g. DC1-C-14-02"}
      site_id: {required: true, desc: "DC the bin is in"}
      reason: {required: true, desc: "Reason for blocking, e.g. Damaged racking, awaiting recount"}
      blocked_by: {desc: "Employee id placing the hold"}
    example: {location_id: DC1-C-14-02, site_id: DC1, reason: Awaiting recount}

  - name: calculate_count_priority_score
    desc: Rank bins to count first by stock value, count accuracy history and days since last count, skipping recently counted bins. Returns scores, highest first, with any planned task id.
    kind: sql
    args:
      site_id: {required: true}
      zone: {type: str, desc: "Warehouse zone filter, e.g. pick, reserve, mezzanine"}
      aisle: {type: str, desc: "Aisle letter filter, e.g. D"}
      exclude_counted_within_days: {type: int, default: 30, desc: "Skip bins counted in the last N days"}
      min_value_gbp: {type: float, desc: "Only bins holding at least this stock value in GBP"}
      history_days: {type: int, default: 180, desc: "Days of count history used for the accuracy measure"}
    sql: |
      WITH val AS (
        SELECT li.location_id, sum(li.qty * p.unit_cost_gbp) AS value_gbp
        FROM location_inventory li JOIN master.products p ON p.sku = li.sku
        WHERE li.site_id = $site_id GROUP BY li.location_id
      ), hist AS (
        SELECT cr.location_id, count(*) AS counted_lines, count(*) FILTER (WHERE cr.accuracy_issue) AS issue_lines,
               max(CAST(cr.counted_at AS DATE)) AS last_count_date
        FROM cycle_count_results cr JOIN master.locations l2 ON l2.location_id = cr.location_id
        WHERE l2.site_id = $site_id AND CAST(cr.counted_at AS DATE) >= CAST($as_of AS DATE) - CAST($history_days AS INT) * INTERVAL 1 DAY
        GROUP BY cr.location_id
      ), planned AS (
        SELECT location_id, min(task_id) AS planned_task_id FROM cycle_count_tasks WHERE status IN ('planned', 'released') GROUP BY location_id
      ), scored AS (
        SELECT l.location_id, l.zone, l.aisle, round(v.value_gbp) AS value_gbp, h.counted_lines,
               round(100.0 * h.issue_lines / NULLIF(h.counted_lines, 0), 1) AS issue_pct,
               round(100.0 * (coalesce(h.issue_lines, 0) + 0.15) / (coalesce(h.counted_lines, 0) + 3), 1) AS smoothed_issue_pct, h.last_count_date,
               datediff('day', h.last_count_date, CAST($as_of AS DATE)) AS days_since_count, pl.planned_task_id
        FROM master.locations l JOIN val v ON v.location_id = l.location_id
        LEFT JOIN hist h ON h.location_id = l.location_id LEFT JOIN planned pl ON pl.location_id = l.location_id
        WHERE l.site_id = $site_id AND ($zone IS NULL OR l.zone = $zone) AND ($aisle IS NULL OR l.aisle = upper($aisle))
          AND ($min_value_gbp IS NULL OR v.value_gbp >= $min_value_gbp)
      )
      SELECT location_id, zone, aisle, value_gbp, counted_lines, issue_pct AS accuracy_issue_pct, last_count_date, days_since_count, planned_task_id,
             round(least(value_gbp / 2500.0, 100) + smoothed_issue_pct * 0.5 + least(coalesce(days_since_count, 120), 120) / 6.0, 1) AS priority_score,
             'score = min(value_gbp / 2500, 100) + 0.5 * smoothed_accuracy_issue_pct + min(days_since_count, 120) / 6; never counted = 120 days' AS formula
      FROM scored
      WHERE days_since_count IS NULL OR days_since_count >= $exclude_counted_within_days
      ORDER BY priority_score DESC
    limit: 20
    example: {site_id: DC1}

  - name: calculate_pallet_fill_by_pack_spec
    desc: Units per pallet for each pack specification of a SKU (pack type and material), with pallets needed for an annual volume.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
      pack_type: {desc: "Pack type, e.g. carton, tray, pouch"}
      material: {desc: "Pack material: corrugated, moulded_pulp or recycled_plastic"}
      annual_units: {type: int, default: 100000, desc: "Annual volume to size pallets for"}
    sql: |
      SELECT pack_spec_id, sku, pack_type, material, units_per_pack, packs_per_pallet,
             units_per_pack * packs_per_pallet AS units_per_pallet, pallet_height_cm, pallet_weight_kg,
             $annual_units AS annual_units,
             CAST(ceil($annual_units * 1.0 / (units_per_pack * packs_per_pallet)) AS BIGINT) AS pallets_per_year,
             'units_per_pallet = units_per_pack * packs_per_pallet; pallets_per_year = ceil(annual_units / units_per_pallet)' AS formula
      FROM pack_specifications
      WHERE sku = $sku AND ($pack_type IS NULL OR pack_type = $pack_type) AND ($material IS NULL OR material = $material)
      ORDER BY units_per_pallet DESC
    limit: 10
    example: {sku: PF-220}

  - name: cancel_cycle_count_task
    desc: Cancel a planned or released cycle count task for a location. Returns the old and new status.
    kind: update
    table: cycle_count_tasks
    set: {status: cancelled, cancelled_at: $as_of}
    args:
      cancel_reason: {required: true, desc: "Reason for cancellation, e.g. Location blocked, duplicate count"}
    example: {task_id: CCT-900103, cancel_reason: Location blocked}

  - name: compare_receipts_to_asns
    desc: Line-level variance between received quantity and ASN quantity, or totals per supplier, carrier or dock. Negative variance = short shipment. Filter by supplier, carrier, site or variance.
    kind: sql
    args:
      supplier_id: {desc: "Filter by supplier"}
      carrier_id: {desc: "Filter by carrier that delivered"}
      site_id: {desc: "Filter by receiving DC"}
      variance: {type: enum, values: [any, short, over], default: any, desc: "short = received less than ASN, over = received more"}
      group_by: {type: enum, values: [line, supplier, carrier, dock], default: line, desc: "line = one row per receipt line; otherwise totals per supplier, carrier or dock"}
      date_from: {type: date, default: "-56d", desc: "Receipts from or after this date"}
      date_to: {type: date, desc: "Receipts up to this date (default today)"}
    sql: |
      WITH base AS (
        SELECT gr.receipt_id, gr.po_id, pur.supplier_id, s.name AS supplier_name, gr.carrier_id, c.name AS carrier_name, gr.site_id, gr.dock,
               gr.received_by, gr.sku, pol.qty_ordered AS asn_qty, gr.qty_received, gr.damage_qty,
               gr.qty_received - pol.qty_ordered AS variance_qty,
               round(100.0 * (gr.qty_received - pol.qty_ordered) / pol.qty_ordered, 1) AS variance_pct,
               round((gr.qty_received - pol.qty_ordered) * pr.unit_cost_gbp, 2) AS variance_value_gbp, gr.received_at, gr.notes
        FROM goods_receipts gr
        JOIN master.purchase_orders pur ON pur.po_id = gr.po_id
        JOIN master.po_lines pol ON pol.po_id = gr.po_id AND pol.sku = gr.sku
        JOIN master.products pr ON pr.sku = gr.sku
        JOIN master.suppliers s ON s.supplier_id = pur.supplier_id
        LEFT JOIN master.carriers c ON c.carrier_id = gr.carrier_id
        WHERE ($supplier_id IS NULL OR pur.supplier_id = $supplier_id) AND ($carrier_id IS NULL OR gr.carrier_id = $carrier_id)
          AND ($site_id IS NULL OR gr.site_id = $site_id)
          AND CAST(gr.received_at AS DATE) >= CAST($date_from AS DATE)
          AND CAST(gr.received_at AS DATE) <= COALESCE(CAST($date_to AS DATE), CAST($as_of AS DATE))
          AND ($variance IS NULL OR $variance = 'any' OR ($variance = 'short' AND gr.qty_received < pol.qty_ordered)
               OR ($variance = 'over' AND gr.qty_received > pol.qty_ordered))
      ), tot AS (
        SELECT coalesce(sum(-variance_value_gbp) FILTER (WHERE variance_qty < 0), 0) AS short_total FROM base
      ), u AS (
        SELECT 'line' AS grouped_by, receipt_id, po_id, supplier_id, supplier_name, carrier_id, carrier_name, site_id, dock, sku, 1 AS receipts,
               asn_qty, qty_received, variance_qty, variance_pct, variance_value_gbp,
               CASE WHEN variance_qty < 0 THEN -variance_value_gbp ELSE 0 END AS short_value_gbp, received_at, notes
        FROM base
        UNION ALL
        SELECT 'supplier', NULL, NULL, supplier_id, any_value(supplier_name), NULL, NULL, NULL, NULL, NULL, count(*),
               sum(asn_qty), sum(qty_received), sum(variance_qty), round(100.0 * sum(variance_qty) / sum(asn_qty), 1), sum(variance_value_gbp),
               coalesce(sum(-variance_value_gbp) FILTER (WHERE variance_qty < 0), 0), NULL, NULL
        FROM base GROUP BY supplier_id
        UNION ALL
        SELECT 'carrier', NULL, NULL, NULL, NULL, carrier_id, any_value(carrier_name), NULL, NULL, NULL, count(*),
               sum(asn_qty), sum(qty_received), sum(variance_qty), round(100.0 * sum(variance_qty) / sum(asn_qty), 1), sum(variance_value_gbp),
               coalesce(sum(-variance_value_gbp) FILTER (WHERE variance_qty < 0), 0), NULL, NULL
        FROM base GROUP BY carrier_id
        UNION ALL
        SELECT 'dock', NULL, NULL, NULL, NULL, NULL, NULL, site_id, dock, NULL, count(*),
               sum(asn_qty), sum(qty_received), sum(variance_qty), round(100.0 * sum(variance_qty) / sum(asn_qty), 1), sum(variance_value_gbp),
               coalesce(sum(-variance_value_gbp) FILTER (WHERE variance_qty < 0), 0), NULL, NULL
        FROM base GROUP BY site_id, dock
      )
      SELECT u.*, CASE WHEN tot.short_total > 0 THEN round(100.0 * u.short_value_gbp / tot.short_total, 1) END AS share_of_short_value_pct
      FROM u, tot
      WHERE u.grouped_by = coalesce($group_by, 'line')
      ORDER BY u.short_value_gbp DESC, u.variance_value_gbp
    limit: 100
    example: {}

  - name: create_cycle_count_task
    desc: "Create a count task: a recount of one bin location or a count of a whole product category at a DC. Returns the new task with status and assignment."
    kind: insert
    table: cycle_count_tasks
    id_prefix: CCT-
    defaults: {status: planned, priority: 50}
    args:
      site_id: {required: true, desc: "DC the count is for"}
      location_id: {desc: "DC bin location to count, e.g. DC1-C-14-02; leave blank for a category count"}
      category: {desc: "Product category to count across the DC, e.g. Small Appliances"}
      scheduled_date: {type: date, desc: "Date the count is planned for"}
      assigned_to: {desc: "Employee id to assign counting to"}
      priority: {type: int, desc: "Priority score, higher counts sooner"}
      reason: {desc: "Why the count is needed, e.g. Recount after variance"}
    example: {location_id: DC1-C-14-02, site_id: DC1, reason: Recount after variance}

  - name: create_stock_transfer
    desc: Creates a transfer order moving stock from one DC or store to another. Returns the new transfer with status and dates.
    kind: insert
    table: stock_transfers
    id_prefix: STR-
    defaults: {status: draft, qty_allocated: 0, qty_shipped: 0, qty_received: 0, created_by: "EMP-00112"}
