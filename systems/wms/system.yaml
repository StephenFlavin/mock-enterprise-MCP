id: wms
name: Warehouse Management System (WMS)
instructions: >
  DC stock levels, cycle counting, goods receipts, and warehouse operations for Northampton, Daventry, Leeds and smaller DCs.
  Stock location ids look like DC1-C-14-02. Goods receipt ids look like GR-000123. Cycle count task ids look like CCT-000123.
  Stock transfer ids look like STR-000123.

tables:
  goods_receipts:
    key: receipt_id
    cols:
      receipt_id: {type: str, desc: "Goods receipt id, e.g. GR-000123"}
      po_id: {type: str, desc: "Purchase order being received"}
      site_id: {type: str, desc: "DC receiving, e.g. DC1"}
      sku: {type: str, desc: "Product being received"}
      qty_ordered: {type: int, desc: "Quantity ordered on PO"}
      qty_received: {type: int, desc: "Quantity physically received"}
      qty_accepted: {type: int, desc: "Quantity accepted (may differ from received)"}
      received_at: {type: timestamp, desc: "Date and time of receipt"}
      received_by: {type: str, desc: "Employee id of receiving person"}
      dock: {type: str, desc: "Dock number, e.g. D07"}
      carrier_id: {type: str, desc: "Carrier that delivered"}
      batch_number: {type: str, desc: "Product batch/lot number if applicable"}
      expiry_date: {type: date, desc: "Product expiry date if applicable"}
      damage_qty: {type: int, desc: "Units damaged on receipt"}
      short_qty: {type: int, desc: "Units short on receipt"}
      updated_at: {type: timestamp, desc: "Last updated"}

  cycle_count_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Cycle count task id, e.g. CCT-000123"}
      location_id: {type: str, desc: "DC bin location to count, e.g. DC1-C-14-02"}
      site_id: {type: str, desc: "DC, e.g. DC1"}
      zone: {type: str, desc: "Warehouse zone (pick, reserve, bulk, mezzanine, hazmat, returns)"}
      status: {type: enum, values: [planned, released, completed, cancelled], desc: "Task status"}
      assigned_to: {type: str, desc: "Employee id assigned to count"}
      created_at: {type: timestamp, desc: "When task was created"}
      released_at: {type: timestamp, desc: "When released to handheld"}
      completed_at: {type: timestamp, desc: "When completed"}
      cancelled_at: {type: timestamp, desc: "When cancelled"}
      cancel_reason: {type: str, desc: "Reason for cancellation"}
      priority: {type: int, desc: "Priority score for counting order (higher = count sooner)"}
      updated_at: {type: timestamp, desc: "Last updated"}

  cycle_count_results:
    key: result_id
    cols:
      result_id: {type: str, desc: "Cycle count result id, e.g. CCR-000123"}
      task_id: {type: str, desc: "Related cycle count task"}
      location_id: {type: str, desc: "DC bin location"}
      sku: {type: str, desc: "Product counted"}
      system_qty: {type: int, desc: "Quantity in system before count"}
      counted_qty: {type: int, desc: "Quantity physically counted"}
      variance: {type: int, desc: "counted_qty minus system_qty"}
      variance_pct: {type: float, desc: "Variance as percentage of system quantity"}
      counted_at: {type: timestamp, desc: "When the count was performed"}
      accuracy_issue: {type: bool, desc: "True if variance exceeds tolerance"}
      reversed_within_48h: {type: bool, desc: "True if reversal recorded within 48 hours"}
      lot_number: {type: str, desc: "Product lot if tracked"}
      condition: {type: str, desc: "Product condition noted (good, damaged, expired)"}
      updated_at: {type: timestamp, desc: "Last updated"}

  stock_movements:
    key: movement_id
    cols:
      movement_id: {type: str, desc: "Stock movement id, e.g. MOV-000123"}
      location_id: {type: str, desc: "DC bin location affected"}
      site_id: {type: str, desc: "DC"}
      sku: {type: str, desc: "Product moved"}
      movement_type: {type: enum, values: [receipt, putaway, pick, transfer, adjustment, return], desc: "Type of movement"}
      qty: {type: int, desc: "Quantity moved (positive for receipt/putaway, negative for pick)"}
      reference_id: {type: str, desc: "Receipt id, transfer id, order id or adjustment id"}
      moved_at: {type: timestamp, desc: "When movement occurred"}
      moved_by: {type: str, desc: "Employee id"}
      batch_number: {type: str, desc: "Product lot if applicable"}
      status: {type: str, desc: "Movement status (completed, reversed)"}
      updated_at: {type: timestamp, desc: "Last updated"}

  stock_transfers:
    key: transfer_id
    cols:
      transfer_id: {type: str, desc: "Stock transfer order id, e.g. STR-000123"}
      from_site_id: {type: str, desc: "Source DC or store"}
      to_site_id: {type: str, desc: "Destination DC or store"}
      sku: {type: str, desc: "Product being transferred"}
      qty_requested: {type: int, desc: "Quantity requested for transfer"}
      qty_allocated: {type: int, desc: "Quantity allocated from source"}
      qty_shipped: {type: int, desc: "Quantity shipped"}
      qty_received: {type: int, desc: "Quantity received at destination"}
      created_at: {type: timestamp, desc: "When transfer was requested"}
      shipped_at: {type: timestamp, desc: "When shipped from source"}
      received_at: {type: timestamp, desc: "When received at destination"}
      status: {type: enum, values: [draft, confirmed, allocated, shipped, received, cancelled], desc: "Transfer status"}
      reason: {type: str, desc: "Reason for transfer (rebalance, stockout, disposal, clearance)"}
      created_by: {type: str, desc: "Employee id who created transfer"}
      updated_at: {type: timestamp, desc: "Last updated"}

  pack_specifications:
    key: pack_spec_id
    cols:
      pack_spec_id: {type: str, desc: "Pack spec id, e.g. PKS-000123"}
      sku: {type: str, desc: "Product"}
      pack_type: {type: str, desc: "Pack type (polybag, carton, hanging, etc.)"}
      units_per_pack: {type: int, desc: "Units in one pack"}
      packs_per_pallet: {type: int, desc: "Packs per pallet"}
      units_per_pallet: {type: int, desc: "Total units per pallet"}
      pallet_height_cm: {type: int, desc: "Pallet height in cm"}
      pallet_weight_kg: {type: float, desc: "Pallet weight in kg"}
      bonded_suitable: {type: bool, desc: "Can this SKU go in bonded storage"}
      created_at: {type: timestamp, desc: "When spec was created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  cause_codes:
    key: cause_code
    cols:
      cause_code: {type: str, desc: "Cause code, e.g. CC-001"}
      description: {type: str, desc: "Cause description"}
      category: {type: enum, values: [counting_error, damage, theft, processing_error, system_error, expiry, supplier_short, carrier_damage, other], desc: "Cause category"}
      intended_use: {type: text, desc: "When and why this code should be used"}

  location_blocks:
    key: block_id
    cols:
      block_id: {type: str, desc: "Block record id, e.g. LB-000123"}
      location_id: {type: str, desc: "DC bin location"}
      site_id: {type: str, desc: "DC"}
      reason: {type: str, desc: "Reason for blocking"}
      blocked_at: {type: timestamp, desc: "When the location was blocked"}
      blocked_by: {type: str, desc: "Employee who blocked it"}
      unblocked_at: {type: timestamp, desc: "When unblocked (if released)"}
      status: {type: enum, values: [active, blocked], desc: "Current status"}

tools:
  - name: block_location
    desc: Place a hold on a bin location so no picks or putaways are directed to it. Returns the block record.
    kind: insert
    table: location_blocks
    id_prefix: LB-
    defaults: {status: blocked, blocked_by: "EMP-00001", blocked_at: "$as_of"}
    args:
      location_id: {required: true, desc: "DC bin location"}
      site_id: {required: true, desc: "DC site"}
      reason: {required: true, desc: "Reason for blocking, e.g. Damaged racking, awaiting recount"}
    example: {location_id: DC1-C-14-02, site_id: DC1, reason: Damaged racking}

  - name: calculate_count_priority_score
    desc: Rank locations for counting by value, accuracy history and recency. Returns locations with priority scores, highest first.
    kind: sql
    args:
      site_id: {required: true, desc: DC site}
      zone: {desc: "Warehouse zone filter"}
      exclude_counted_within_days: {type: int, default: 30, desc: "Exclude locations counted in last N days"}
    sql: |
      WITH location_stats AS (
        SELECT l.location_id, l.site_id, l.zone,
               COUNT(DISTINCT cr.sku) AS sku_count,
               AVG(ABS(cr.variance_pct)) AS avg_variance_pct,
               MAX(cr.counted_at) AS last_count_at,
               COALESCE(DATEDIFF('day', MAX(cr.counted_at), CAST($as_of AS DATE)), 999) AS days_since_count,
               COUNT(*) FILTER (WHERE cr.accuracy_issue) AS accuracy_issues
        FROM master.locations l
        LEFT JOIN cycle_count_results cr ON l.location_id = cr.location_id
        WHERE l.site_id = $site_id
          AND l.status = 'active'
          AND ($zone IS NULL OR l.zone = $zone)
        GROUP BY l.location_id, l.site_id, l.zone
      )
      SELECT location_id, site_id, zone, sku_count,
             ROUND(avg_variance_pct, 2) AS avg_variance_pct,
             days_since_count,
             accuracy_issues,
             CAST(COALESCE(accuracy_issues, 0) * 50 + COALESCE(days_since_count, 999) * 2 + COALESCE(avg_variance_pct, 0) AS INT) AS priority_score,
             'priority_score = (accuracy_issues * 50) + (days_since_count * 2) + avg_variance_pct' AS formula
      FROM location_stats
      WHERE COALESCE(days_since_count, 999) >= $exclude_counted_within_days
      ORDER BY priority_score DESC
    limit: 50
    example: {site_id: DC1}

  - name: calculate_pallet_fill_by_pack_spec
    desc: Units per pallet for a pack specification. Returns pack spec with units per pallet calculation.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
      pack_type: {desc: "Pack type override if multiple pack specs exist"}
    sql: |
      SELECT pack_spec_id, sku, pack_type,
             units_per_pack, packs_per_pallet, units_per_pallet,
             pallet_height_cm, pallet_weight_kg,
             'units_per_pallet = units_per_pack * packs_per_pallet' AS formula
      FROM pack_specifications
      WHERE sku = $sku
        AND ($pack_type IS NULL OR pack_type = $pack_type)
      ORDER BY units_per_pallet DESC
    limit: 5
    example: {sku: PF-220}

  - name: cancel_cycle_count_task
    desc: Cancel a released cycle count task for a location. Returns the old and new status.
    kind: update
    table: cycle_count_tasks
    set: {status: cancelled, cancelled_at: $as_of}
    args:
      cancel_reason: {required: true, desc: "Reason for cancellation, e.g. Location blocked, duplicate count"}
    example: {task_id: CCT-900001, cancel_reason: Location blocked}

  - name: compare_receipts_to_asns
    desc: Line-level variance between received quantity and ASN quantity. Negative variance = short shipment, positive = overbilled.
    kind: sql
    args:
      supplier_id: {desc: "Filter by supplier"}
      date_from: {type: date, default: "-56d", desc: "Receipts from or after this date"}
      date_to: {type: date, desc: "Receipts up to this date (default today)"}
    sql: |
      SELECT gr.receipt_id, gr.po_id, pur.supplier_id, s.name AS supplier_name,
             gr.sku, pr.style_id, pr.name AS product_name,
             gr.qty_received, pol.qty_ordered AS asn_qty,
             (gr.qty_received - pol.qty_ordered) AS variance_qty,
             ROUND((gr.qty_received - pol.qty_ordered) * pr.unit_cost_gbp, 2) AS variance_value_gbp,
             CASE WHEN gr.qty_received < pol.qty_ordered THEN 'short' ELSE 'over' END AS variance_type,
             gr.received_at, c.name AS carrier_name
      FROM goods_receipts gr
      JOIN master.purchase_orders pur ON gr.po_id = pur.po_id
      JOIN master.po_lines pol ON gr.po_id = pol.po_id AND gr.sku = pol.sku
      JOIN master.products pr ON gr.sku = pr.sku
      JOIN master.suppliers s ON pur.supplier_id = s.supplier_id
      LEFT JOIN master.carriers c ON gr.carrier_id = c.carrier_id
      WHERE ($supplier_id IS NULL OR pur.supplier_id = $supplier_id)
        AND CAST(gr.received_at AS DATE) >= CAST($date_from AS DATE)
        AND CAST(gr.received_at AS DATE) <= COALESCE(CAST($date_to AS DATE), CAST($as_of AS DATE))
      ORDER BY variance_value_gbp DESC
    limit: 100
    example: {}

  - name: create_cycle_count_task
    desc: Create a recount task for a single bin location. Returns the new task with status and assignment.
    kind: insert
    table: cycle_count_tasks
    id_prefix: CCT-
    defaults: {status: planned}
    args:
      location_id: {required: true, desc: "DC bin location to count"}
      assigned_to: {desc: "Employee id to assign counting to"}
      priority: {type: int, desc: "Priority score (default 50)"}
    example: {location_id: DC1-C-14-02}

  - name: create_stock_transfer
    desc: Creates a transfer order moving stock from one DC or store to another. Returns the new transfer with status and dates.
    kind: insert
    table: stock_transfers
    id_prefix: STR-
    defaults: {status: draft}
    args:
      from_site_id: {required: true, desc: "Source DC or store"}
      to_site_id: {required: true, desc: "Destination DC or store"}
      sku: {required: true, desc: "Product being transferred"}
      qty_requested: {required: true, type: int, desc: "Quantity to transfer"}
      reason: {required: true, desc: "Reason for transfer"}
    example: {from_site_id: DC1, to_site_id: DC3, sku: PF-220, qty_requested: 500, reason: rebalance}

  - name: draft_cycle_count_sheet
    desc: Draft a printable cycle count sheet for a list of locations. Returns formatted text for printing with location details.
    kind: draft
    args:
      location_ids: {required: true, desc: "Comma-separated location ids or single location"}
      site_id: {desc: "Filter by site (optional)"}
    sql:
      locations: |
        SELECT l.location_id, l.site_id, l.zone, l.aisle, l.bay, l.level,
               COUNT(DISTINCT m.sku) AS sku_count,
               COALESCE(SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END), 0) AS total_units
        FROM master.locations l
        LEFT JOIN stock_movements m ON l.location_id = m.location_id AND m.movement_type IN ('receipt', 'putaway', 'transfer')
        WHERE INSTR($location_ids, l.location_id) > 0
          AND ($site_id IS NULL OR l.site_id = $site_id)
        GROUP BY l.location_id, l.site_id, l.zone, l.aisle, l.bay, l.level
      skus: |
        SELECT m.location_id, m.sku, p.name, p.category,
               SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END) AS units,
               m.batch_number, MAX(m.moved_at) AS last_movement
        FROM stock_movements m
        JOIN master.products p ON m.sku = p.sku
        WHERE INSTR($location_ids, m.location_id) > 0
          AND m.qty > 0
        GROUP BY m.location_id, m.sku, p.name, p.category, m.batch_number
    template: |
      CYCLE COUNT SHEET

      {% for loc in locations %}
      ========================================
      Location: {{ loc.location_id }}
      Zone: {{ loc.zone }} | Aisle: {{ loc.aisle }} | Bay: {{ loc.bay }} | Level: {{ loc.level }}
      Expected items: {{ loc.sku_count }} | Total units: {{ loc.total_units }}

      SKU | Product | Category | Current Units | Batch | Last Movement
      {% for sku in skus %}{% if sku.location_id == loc.location_id %}
      {{ sku.sku }} | {{ sku.name }} | {{ sku.category }} | {{ sku.units }} | {{ sku.batch_number or 'N/A' }} | {{ sku.last_movement | d('N/A') }}
      {% endif %}{% endfor %}

      Counted By: __________ | Count Date: __________ | Count Time: __________ | Variance: __________
      {% endfor %}
    example: {location_ids: DC1-C-14-02}

  - name: get_asn_timeliness_history
    desc: ASN lead times and accuracy against receipts. Returns supplier ASN performance.
    kind: sql
    args:
      supplier_id: {desc: "Filter by supplier"}
      date_from: {type: date, default: "-90d", desc: "Receipts from or after"}
      date_to: {type: date, desc: "Receipts up to (default today)"}
    sql: |
      SELECT pur.supplier_id, s.name AS supplier_name,
             COUNT(DISTINCT pur.po_id) AS po_count,
             COUNT(DISTINCT gr.receipt_id) AS receipt_count,
             COALESCE(ROUND(AVG(DATEDIFF('day', pur.ship_date, CAST(gr.received_at AS DATE))), 1), 0) AS avg_lead_time_days,
             COALESCE(ROUND(AVG(ABS(gr.qty_received - pol.qty_ordered) / NULLIF(pol.qty_ordered, 0) * 100), 2), 0) AS avg_variance_pct,
             COALESCE(ROUND(SUM(CASE WHEN gr.qty_received = pol.qty_ordered THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(DISTINCT gr.receipt_id), 0), 1), 0) AS accuracy_pct,
             'accuracy_pct = (exact_matches / total_receipts) * 100' AS formula
      FROM master.purchase_orders pur
      LEFT JOIN master.po_lines pol ON pur.po_id = pol.po_id
      LEFT JOIN goods_receipts gr ON pur.po_id = gr.po_id AND gr.sku = pol.sku
      JOIN master.suppliers s ON pur.supplier_id = s.supplier_id
      WHERE ($supplier_id IS NULL OR pur.supplier_id = $supplier_id)
        AND CAST(COALESCE(gr.received_at, pur.due_date) AS DATE) >= CAST($date_from AS DATE)
        AND CAST(COALESCE(gr.received_at, pur.due_date) AS DATE) <= COALESCE(CAST($date_to AS DATE), CAST($as_of AS DATE))
      GROUP BY pur.supplier_id, s.name
      ORDER BY po_count DESC
    limit: 30
    example: {}

  - name: get_bonded_warehouse_volumes
    desc: Stock suitable for bonded storage (customs duty deferral, inward processing relief). Returns bonded-suitable stock.
    kind: sql
    args:
      site_id: {desc: "Filter by DC"}
      date_as_of: {type: date, desc: "Stock balance as at this date (default today)"}
    sql: |
      SELECT m.location_id, m.site_id, sm.sku, p.name AS product_name,
             p.country_of_origin, p.hs_code,
             SUM(CASE WHEN sm.qty > 0 THEN sm.qty ELSE 0 END) AS on_hand_units,
             COALESCE(ps.units_per_pallet, 1) AS units_per_pallet,
             CEIL(SUM(CASE WHEN sm.qty > 0 THEN sm.qty ELSE 0 END) / NULLIF(ps.units_per_pallet, 1)) AS pallets_needed,
             ROUND(SUM(CASE WHEN sm.qty > 0 THEN sm.qty ELSE 0 END) * ANY_VALUE(p.unit_cost_gbp), 2) AS stock_value_gbp
      FROM master.locations m
      LEFT JOIN stock_movements sm ON m.location_id = sm.location_id AND CAST(sm.moved_at AS DATE) <= COALESCE(CAST($date_as_of AS DATE), CAST($as_of AS DATE))
      LEFT JOIN master.products p ON sm.sku = p.sku
      LEFT JOIN pack_specifications ps ON sm.sku = ps.sku
      WHERE ps.bonded_suitable = true
        AND ($site_id IS NULL OR m.site_id = $site_id)
        AND m.status = 'active'
      GROUP BY m.location_id, m.site_id, sm.sku, p.name, p.country_of_origin, p.hs_code, ps.units_per_pallet
      HAVING SUM(CASE WHEN sm.qty > 0 THEN sm.qty ELSE 0 END) > 0
      ORDER BY stock_value_gbp DESC
    limit: 100
    example: {site_id: DC1}

  - name: get_cause_code_definitions
    desc: Reference list of adjustment cause codes and their intended use. Use to understand and classify adjustments.
    kind: select
    from: cause_codes
    filters:
      category: {}
    columns: [cause_code, description, category, intended_use]
    order: category, cause_code
    limit: 50
    example: {}

  - name: get_dc_daily_capacity
    desc: Retrieves dc daily capacity for picking, packing and shipping. Returns capacity and units per day.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      date_from: {type: date, default: "-7d", desc: "Capacity from"}
      date_to: {type: date, default: "+7d", desc: "Capacity to"}
    sql: |
      SELECT CAST(m.moved_at AS DATE) AS date,
             $site_id AS site_id,
             COUNT(DISTINCT CASE WHEN m.movement_type = 'pick' THEN m.reference_id END) AS orders_picked,
             COALESCE(SUM(CASE WHEN m.movement_type = 'pick' THEN ABS(m.qty) ELSE 0 END), 0) AS units_picked,
             COALESCE(SUM(CASE WHEN m.movement_type = 'receipt' THEN m.qty ELSE 0 END), 0) AS units_received,
             COUNT(DISTINCT CASE WHEN m.movement_type = 'receipt' THEN m.reference_id END) AS receipts_processed,
             ROUND(SUM(CASE WHEN m.movement_type = 'pick' THEN ABS(m.qty) ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN m.movement_type = 'pick' THEN m.reference_id END), 0), 2) AS units_per_order
      FROM stock_movements m
      WHERE m.site_id = $site_id
        AND CAST(m.moved_at AS DATE) >= CAST($date_from AS DATE)
        AND CAST(m.moved_at AS DATE) <= CAST($date_to AS DATE)
      GROUP BY CAST(m.moved_at AS DATE)
      ORDER BY date DESC
    limit: 30
    example: {site_id: DC1}

  - name: get_dc_inbound_delays
    desc: Retrieve dc inbound delays. Returns delayed goods receipts and their impact.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      days_late_threshold: {type: int, default: 3, desc: "Only receipts this many days late or more"}
      date_from: {type: date, default: "-90d", desc: "Receipts from or after"}
    sql: |
      SELECT gr.receipt_id, gr.po_id, pur.supplier_id, s.name AS supplier_name,
             gr.sku, p.name AS product_name,
             DATEDIFF('day', pur.due_date, CAST(gr.received_at AS DATE)) AS days_late,
             gr.qty_received, gr.received_at,
             c.name AS carrier_name,
             'days_late = receipt_date - po_due_date' AS formula
      FROM goods_receipts gr
      JOIN master.purchase_orders pur ON gr.po_id = pur.po_id
      JOIN master.products p ON gr.sku = p.sku
      JOIN master.suppliers s ON pur.supplier_id = s.supplier_id
      LEFT JOIN master.carriers c ON gr.carrier_id = c.carrier_id
      WHERE gr.site_id = $site_id
        AND DATEDIFF('day', pur.due_date, CAST(gr.received_at AS DATE)) >= $days_late_threshold
        AND CAST(gr.received_at AS DATE) >= CAST($date_from AS DATE)
      ORDER BY days_late DESC
    limit: 50
    example: {site_id: DC1}

  - name: get_dc_product_mix_and_volume
    desc: Volume, profile and mix by site. Returns units moved, order profile, category mix.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      period_days: {type: int, default: 30, desc: "Look back this many days"}
    sql: |
      SELECT $site_id AS site_id,
             COUNT(DISTINCT CASE WHEN m.movement_type = 'pick' THEN m.reference_id END) AS orders_processed,
             COALESCE(SUM(CASE WHEN m.movement_type = 'pick' THEN ABS(m.qty) ELSE 0 END), 0) AS units_picked,
             COALESCE(SUM(CASE WHEN m.movement_type = 'receipt' THEN m.qty ELSE 0 END), 0) AS units_received,
             COUNT(DISTINCT m.sku) AS sku_count,
             COUNT(DISTINCT p.category) AS category_count,
             ROUND(AVG(CASE WHEN m.movement_type = 'pick' THEN ABS(m.qty) ELSE NULL END)) AS avg_units_per_pick,
             STRING_AGG(DISTINCT p.category, '; ') AS categories_handled,
             'volume = sum(units_picked)' AS formula
      FROM stock_movements m
      LEFT JOIN master.products p ON m.sku = p.sku
      WHERE m.site_id = $site_id
        AND CAST(m.moved_at AS DATE) >= CAST($as_of AS DATE) - CAST($period_days AS INT) * INTERVAL 1 DAY
      GROUP BY m.site_id
    limit: 1
    example: {site_id: DC1}

  - name: get_dc_stock_for_product
    desc: Retrieve dc stock for product. Returns current DC stock by location and status.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
      site_id: {desc: "Filter by DC"}
    sql: |
      SELECT l.location_id, l.site_id, l.zone, l.aisle,
             m.sku, p.name AS product_name,
             COALESCE(SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END), 0) AS on_hand,
             m.batch_number,
             MAX(m.moved_at) AS last_movement
      FROM master.locations l
      LEFT JOIN stock_movements m ON l.location_id = m.location_id AND m.sku = $sku
      JOIN master.products p ON $sku = p.sku
      WHERE p.sku = $sku
        AND ($site_id IS NULL OR l.site_id = $site_id)
        AND l.status = 'active'
      GROUP BY l.location_id, l.site_id, l.zone, l.aisle, m.sku, p.name, m.batch_number
      HAVING COALESCE(SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END), 0) > 0
      ORDER BY site_id, on_hand DESC
    limit: 100
    example: {sku: PF-220}

  - name: get_dc_stock_history_for_product
    desc: Retrieve dc stock history for product. Returns stock quantity over time by DC.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
      site_id: {desc: "Filter by DC"}
      date_from: {type: date, default: "-90d", desc: "History from or after"}
      date_to: {type: date, desc: "History up to (default today)"}
    sql: |
      SELECT CAST(m.moved_at AS DATE) AS date,
             m.site_id,
             $sku AS sku,
             p.name AS product_name,
             SUM(m.qty) AS net_movement,
             COALESCE(SUM(CASE WHEN m.movement_type = 'receipt' THEN m.qty ELSE 0 END), 0) AS receipts,
             COALESCE(SUM(CASE WHEN m.movement_type = 'pick' THEN ABS(m.qty) ELSE 0 END), 0) AS picks,
             COALESCE(SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END), 0) AS units
      FROM stock_movements m
      JOIN master.products p ON m.sku = p.sku
      WHERE m.sku = $sku
        AND ($site_id IS NULL OR m.site_id = $site_id)
        AND CAST(m.moved_at AS DATE) >= CAST($date_from AS DATE)
        AND CAST(m.moved_at AS DATE) <= COALESCE(CAST($date_to AS DATE), CAST($as_of AS DATE))
      GROUP BY CAST(m.moved_at AS DATE), m.site_id, p.name
      ORDER BY date DESC
    limit: 100
    example: {sku: PF-220}

  - name: get_dc_utilisation
    desc: Retrieve dc utilisation. Returns pallet positions and occupancy by DC and zone.
    kind: sql
    args:
      site_id: {desc: "Filter by DC"}
    sql: |
      SELECT l.site_id,
             l.zone,
             COUNT(*) AS locations,
             COUNT(*) FILTER (WHERE l.status = 'active') AS active_locations,
             COUNT(*) FILTER (WHERE l.status = 'blocked') AS blocked_locations,
             SUM(CASE WHEN m.location_id IS NOT NULL THEN 1 ELSE 0 END) AS occupied,
             COUNT(*) - SUM(CASE WHEN m.location_id IS NOT NULL THEN 1 ELSE 0 END) AS vacant,
             ROUND(SUM(CASE WHEN m.location_id IS NOT NULL THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS utilisation_pct
      FROM master.locations l
      LEFT JOIN (SELECT DISTINCT location_id FROM stock_movements WHERE qty > 0) m ON l.location_id = m.location_id
      WHERE ($site_id IS NULL OR l.site_id = $site_id)
      GROUP BY l.site_id, l.zone
      ORDER BY site_id, zone
    limit: 50
    example: {site_id: DC1}

  - name: get_goods_receipts_for_product
    desc: Retrieve goods receipts for product. Returns recent receipts, quantities and timelines.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
      site_id: {desc: "Filter by receiving DC"}
      date_from: {type: date, default: "-90d", desc: "Receipts from or after"}
    sql: |
      SELECT gr.receipt_id, gr.po_id, pur.supplier_id, s.name AS supplier_name,
             gr.site_id, gr.sku, p.name AS product_name,
             gr.qty_ordered, gr.qty_received, gr.qty_accepted,
             gr.damage_qty, gr.short_qty,
             gr.received_at, gr.carrier_id,
             DATEDIFF('day', pur.due_date, CAST(gr.received_at AS DATE)) AS days_late,
             p.unit_cost_gbp,
             ROUND(gr.qty_received * p.unit_cost_gbp, 2) AS receipt_value_gbp
      FROM goods_receipts gr
      JOIN master.purchase_orders pur ON gr.po_id = pur.po_id
      JOIN master.suppliers s ON pur.supplier_id = s.supplier_id
      JOIN master.products p ON gr.sku = p.sku
      WHERE gr.sku = $sku
        AND ($site_id IS NULL OR gr.site_id = $site_id)
        AND CAST(gr.received_at AS DATE) >= CAST($date_from AS DATE)
      ORDER BY gr.received_at DESC
    limit: 50
    example: {sku: PF-220}

  - name: get_historical_count_accuracy_by_location
    desc: Historical count accuracy by location or zone. Returns accuracy trends and outliers.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      zone: {desc: "Warehouse zone filter"}
      days: {type: int, default: 90, desc: "Look back this many days"}
    sql: |
      SELECT cr.location_id,
             l.zone,
             COUNT(*) AS count_tasks,
             COUNT(*) FILTER (WHERE cr.accuracy_issue) AS issue_count,
             ROUND(COUNT(*) FILTER (WHERE cr.accuracy_issue) * 100.0 / COUNT(*), 1) AS accuracy_issue_pct,
             ROUND(AVG(ABS(cr.variance_pct)), 2) AS avg_variance_pct,
             MAX(ABS(cr.variance_pct)) AS max_variance_pct,
             MAX(cr.counted_at) AS latest_count
      FROM cycle_count_results cr
      JOIN master.locations l ON cr.location_id = l.location_id
      WHERE l.site_id = $site_id
        AND ($zone IS NULL OR l.zone = $zone)
        AND cr.counted_at >= CAST($as_of AS DATE) - CAST($days AS INT) * INTERVAL 1 DAY
      GROUP BY cr.location_id, l.zone
      ORDER BY accuracy_issue_pct DESC, avg_variance_pct DESC
    limit: 50
    example: {site_id: DC1}

  - name: get_inventory_status_mapping
    desc: Mapping between WMS and ERP inventory statuses. Returns status definitions and their meanings.
    kind: sql
    args: {}
    sql: |
      SELECT 'on-hand' AS wms_status, 'Stock' AS erp_status, 'Physical stock in warehouse, available for allocation' AS definition
      UNION ALL
      SELECT 'reserved' AS wms_status, 'Reserved Stock' AS erp_status, 'Allocated to orders but not yet picked'
      UNION ALL
      SELECT 'in-transit' AS wms_status, 'In Transit' AS erp_status, 'Stock in transfer between locations'
      UNION ALL
      SELECT 'quarantine' AS wms_status, 'Quarantine' AS erp_status, 'Stock awaiting quality check or blocked'
      UNION ALL
      SELECT 'damaged' AS wms_status, 'Damaged' AS erp_status, 'Damaged goods write-off'
      UNION ALL
      SELECT 'expired' AS wms_status, 'Obsolete' AS erp_status, 'Expired or obsolete stock'
    limit: 10
    example: {}

  - name: get_location_inventory_balance
    desc: Current system stock by SKU, lot and status for a bin location. Returns all stock held at location.
    kind: sql
    args:
      location_id: {required: true, desc: "DC bin location, e.g. DC1-C-14-02"}
      sku: {desc: "Filter by SKU (optional)"}
    sql: |
      SELECT $location_id AS location_id,
             m.sku, p.name AS product_name, p.category,
             m.batch_number AS lot_number,
             CASE WHEN SUM(m.qty) > 0 THEN 'on-hand' ELSE 'zero' END AS status,
             COALESCE(SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END), 0) AS on_hand_qty,
             MAX(m.moved_at) AS last_movement,
             COALESCE(SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END) * ANY_VALUE(p.unit_cost_gbp), 0) AS value_gbp
      FROM stock_movements m
      LEFT JOIN master.products p ON m.sku = p.sku
      WHERE m.location_id = $location_id
        AND ($sku IS NULL OR m.sku = $sku)
      GROUP BY m.sku, p.name, p.category, m.batch_number
      HAVING SUM(m.qty) != 0
      ORDER BY on_hand_qty DESC
    limit: 100
    example: {location_id: DC1-C-14-02}

  - name: get_order_line_profile
    desc: Order profile (units per order, single-unit share) by period. Shows order patterns and volume distribution.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      date_from: {type: date, default: "-30d", desc: "Period from"}
      date_to: {type: date, desc: "Period to (default today)"}
    sql: |
      WITH order_stats AS (
        SELECT CAST(m.moved_at AS DATE) AS date,
               m.reference_id AS order_id,
               COUNT(DISTINCT m.sku) AS lines_per_order,
               SUM(ABS(m.qty)) AS units_per_order
        FROM stock_movements m
        WHERE m.site_id = $site_id
          AND m.movement_type = 'pick'
          AND CAST(m.moved_at AS DATE) >= CAST($date_from AS DATE)
          AND CAST(m.moved_at AS DATE) <= COALESCE(CAST($date_to AS DATE), CAST($as_of AS DATE))
        GROUP BY CAST(m.moved_at AS DATE), m.reference_id
      )
      SELECT date,
             COUNT(DISTINCT order_id) AS orders,
             ROUND(AVG(units_per_order), 1) AS avg_units_per_order,
             ROUND(AVG(lines_per_order), 1) AS avg_lines_per_order,
             ROUND(SUM(CASE WHEN units_per_order = 1 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS single_unit_pct,
             SUM(units_per_order) AS total_units
      FROM order_stats
      GROUP BY date
      ORDER BY date DESC
    limit: 30
    example: {site_id: DC1}

  - name: get_order_mix_by_hour
    desc: Order mix by hour (lines per order, zone). Shows peak periods and order complexity by time of day.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      date_from: {type: date, default: "-7d", desc: "Period from"}
    sql: |
      WITH hourly_orders AS (
        SELECT CAST(m.moved_at AS DATE) AS date,
               HOUR(m.moved_at) AS hour,
               l.zone,
               m.reference_id AS order_id,
               COUNT(DISTINCT m.sku) AS lines_in_order
        FROM stock_movements m
        JOIN master.locations l ON m.location_id = l.location_id
        WHERE m.site_id = $site_id
          AND m.movement_type = 'pick'
          AND CAST(m.moved_at AS DATE) >= CAST($date_from AS DATE)
        GROUP BY CAST(m.moved_at AS DATE), HOUR(m.moved_at), l.zone, m.reference_id
      )
      SELECT hour,
             COUNT(DISTINCT order_id) AS orders,
             STRING_AGG(DISTINCT zone, '; ') AS zones_active,
             ROUND(AVG(lines_in_order), 1) AS avg_lines_per_order,
             ROUND(SUM(lines_in_order), 0) AS total_lines
      FROM hourly_orders
      GROUP BY hour
      ORDER BY hour
    limit: 24
    example: {site_id: DC1}

  - name: get_pallet_positions_by_category
    desc: Pallet positions occupied by product category. Shows space utilization by product type.
    kind: sql
    args:
      site_id: {desc: "Filter by DC"}
      zone: {desc: "Filter by zone"}
    sql: |
      SELECT l.site_id, l.zone, p.category,
             COUNT(DISTINCT l.location_id) AS positions_occupied,
             COALESCE(SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END), 0) AS units_stored,
             COALESCE(SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END) * ANY_VALUE(p.unit_cost_gbp), 0) AS value_gbp,
             'positions_occupied = count(distinct locations with stock)' AS formula
      FROM master.locations l
      LEFT JOIN stock_movements m ON l.location_id = m.location_id AND m.qty > 0
      LEFT JOIN master.products p ON m.sku = p.sku
      WHERE l.status = 'active'
        AND ($site_id IS NULL OR l.site_id = $site_id)
        AND ($zone IS NULL OR l.zone = $zone)
      GROUP BY l.site_id, l.zone, p.category
      HAVING COUNT(DISTINCT l.location_id) > 0
      ORDER BY units_stored DESC
    limit: 50
    example: {site_id: DC1}

  - name: get_pick_affinity_pairs
    desc: SKU pairs frequently picked together. Shows products that appear in the same orders often.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      min_co_picks: {type: int, default: 1, desc: "Minimum co-picks to include"}
      date_from: {type: date, default: "-90d", desc: "Look back this many days"}
    sql: |
      WITH order_skus AS (
        SELECT m.reference_id, m.sku
        FROM stock_movements m
        WHERE m.site_id = $site_id
          AND m.movement_type = 'pick'
          AND CAST(m.moved_at AS DATE) >= CAST($date_from AS DATE)
        GROUP BY m.reference_id, m.sku
      )
      SELECT p1.sku AS sku_1, p2.sku AS sku_2,
             COUNT(DISTINCT p1.reference_id) AS co_pick_count
      FROM order_skus p1
      JOIN order_skus p2 ON p1.reference_id = p2.reference_id AND p1.sku < p2.sku
      GROUP BY p1.sku, p2.sku
      HAVING COUNT(DISTINCT p1.reference_id) >= $min_co_picks
      ORDER BY co_pick_count DESC
    limit: 50
    example: {site_id: DC1}

  - name: get_pick_and_pack_record_for_order
    desc: Retrieves pick and pack record for order. Shows all SKUs picked, quantities and timing.
    kind: sql
    args:
      reference_id: {required: true, desc: "Order reference id from stock movements, e.g. ORD-2026-000001"}
    sql: |
      SELECT m.reference_id,
             m.sku, p.name AS product_name,
             ABS(m.qty) AS qty_picked,
             m.location_id,
             l.zone,
             m.moved_at AS pick_time,
             m.moved_by AS picker_id,
             COUNT(*) OVER (PARTITION BY m.reference_id) AS lines_in_order
      FROM stock_movements m
      JOIN master.products p ON m.sku = p.sku
      LEFT JOIN master.locations l ON m.location_id = l.location_id
      WHERE m.movement_type = 'pick'
        AND m.reference_id = $reference_id
      ORDER BY m.moved_at, m.sku
    limit: 50
    example: {reference_id: "ORD-2026-191217"}

  - name: get_reexport_volumes_by_destination
    desc: Re-export volumes by destination. Shows goods moving to EU/Ireland and other re-export destinations.
    kind: sql
    args:
      date_from: {type: date, default: "-90d", desc: "Look back this many days"}
      destination: {desc: "Filter by destination country"}
    sql: |
      SELECT m.site_id AS from_site,
             CASE WHEN st.to_site_id LIKE 'DC%' THEN 'DC' ELSE 'Store' END AS destination_type,
             st.to_site_id AS destination_site,
             m.sku, p.name AS product_name, p.country_of_origin,
             SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END) AS volume_units,
             ROUND(SUM(CASE WHEN m.qty > 0 THEN m.qty ELSE 0 END) * ANY_VALUE(p.unit_cost_gbp), 2) AS value_gbp,
             COUNT(DISTINCT st.transfer_id) AS transfer_count
      FROM stock_transfers st
      LEFT JOIN stock_movements m ON st.transfer_id = m.reference_id
      LEFT JOIN master.products p ON m.sku = p.sku
      WHERE CAST(st.created_at AS DATE) >= CAST($date_from AS DATE)
        AND st.status IN ('shipped', 'received')
      GROUP BY m.site_id, st.to_site_id, m.sku, p.name, p.country_of_origin
      ORDER BY volume_units DESC
    limit: 50
    example: {}

  - name: get_rollback_requirements
    desc: Data and process requirements for rolling back a site. Shows what would need to be reversed and dependencies.
    kind: sql
    args:
      site_id: {required: true, desc: "DC to assess"}
      from_date: {type: date, default: "-7d", desc: "Rollback data from this date"}
    sql: |
      SELECT $site_id AS site_id,
             'Goods Receipts' AS data_type,
             COUNT(*) AS record_count,
             MIN(received_at) AS earliest_date,
             MAX(received_at) AS latest_date,
             SUM(qty_received) AS total_units
      FROM goods_receipts gr
      WHERE gr.site_id = $site_id AND CAST(gr.received_at AS DATE) >= CAST($from_date AS DATE)
      UNION ALL
      SELECT $site_id, 'Stock Transfers', COUNT(*), MIN(created_at), MAX(created_at), SUM(qty_shipped)
      FROM stock_transfers st
      WHERE st.from_site_id = $site_id AND CAST(st.created_at AS DATE) >= CAST($from_date AS DATE)
      UNION ALL
      SELECT $site_id, 'Stock Movements', COUNT(*), MIN(moved_at), MAX(moved_at), SUM(ABS(qty))
      FROM stock_movements m
      WHERE m.site_id = $site_id AND CAST(m.moved_at AS DATE) >= CAST($from_date AS DATE)
      UNION ALL
      SELECT $site_id, 'Cycle Count Tasks', COUNT(*), MIN(created_at), MAX(created_at), 0
      FROM cycle_count_tasks ct
      WHERE ct.site_id = $site_id AND CAST(ct.created_at AS DATE) >= CAST($from_date AS DATE)
    limit: 20
    example: {site_id: DC1}

  - name: get_site_capacity_by_process
    desc: Rated capacity by site and process (picks, packs, receipts). Shows throughput capability.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
    sql: |
      SELECT $site_id AS site_id,
             'Picking' AS process,
             COALESCE(ROUND(MAX(CASE WHEN movement_type = 'pick' THEN daily_units END) * 7), 5000) AS weekly_capacity_units,
             ROUND(COALESCE(MAX(CASE WHEN movement_type = 'pick' THEN daily_units END), 0) / 8.0) AS hourly_capacity_units
      FROM (
        SELECT movement_type, CAST(moved_at AS DATE) AS date,
               SUM(ABS(qty)) AS daily_units
        FROM stock_movements
        WHERE site_id = $site_id AND movement_type IN ('pick', 'receipt')
        GROUP BY movement_type, CAST(moved_at AS DATE)
      ) t
      UNION ALL
      SELECT $site_id, 'Receiving', COALESCE(ROUND(MAX(daily_receipts) * 7), 3000), ROUND(COALESCE(MAX(daily_receipts), 0) / 8.0)
      FROM (
        SELECT CAST(received_at AS DATE) AS date, SUM(qty_received) AS daily_receipts
        FROM goods_receipts WHERE site_id = $site_id GROUP BY CAST(received_at AS DATE)
      ) t
      UNION ALL
      SELECT $site_id, 'Packing', 1500, 200
    limit: 10
    example: {site_id: DC1}

  - name: get_stock_accuracy_trend_by_zone
    desc: Quarterly stock accuracy by zone from cycle count history. Shows accuracy trends and problem areas.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      quarters: {type: int, default: 4, desc: "How many quarters to include"}
    sql: |
      SELECT QUARTER(cr.counted_at) AS quarter, YEAR(cr.counted_at) AS year,
             l.zone,
             COUNT(*) AS count_tasks,
             ROUND(COUNT(*) FILTER (WHERE cr.accuracy_issue) * 100.0 / COUNT(*), 1) AS accuracy_issue_pct,
             ROUND(AVG(ABS(cr.variance_pct)), 2) AS avg_variance_pct,
             ROUND(100 - COUNT(*) FILTER (WHERE cr.accuracy_issue) * 100.0 / COUNT(*), 1) AS accuracy_pct
      FROM cycle_count_results cr
      JOIN master.locations l ON cr.location_id = l.location_id
      WHERE l.site_id = $site_id
      GROUP BY YEAR(cr.counted_at), QUARTER(cr.counted_at), l.zone
      ORDER BY year DESC, quarter DESC
    limit: 50
    example: {site_id: DC1}

  - name: get_stock_location_for_split_orders
    desc: Retrieves stock location for split orders. Shows which locations supply multi-location orders.
    kind: sql
    args:
      date_from: {type: date, default: "-30d", desc: "Orders from or after"}
      site_id: {desc: "Filter by DC"}
    sql: |
      WITH order_locations AS (
        SELECT m.reference_id AS order_id,
               l.site_id,
               COUNT(DISTINCT l.location_id) AS location_count
        FROM stock_movements m
        JOIN master.locations l ON m.location_id = l.location_id
        WHERE m.movement_type = 'pick' AND CAST(m.moved_at AS DATE) >= CAST($date_from AS DATE)
        GROUP BY m.reference_id, l.site_id
      )
      SELECT ol.order_id,
             ol.site_id,
             COUNT(*) AS locations_per_order,
             STRING_AGG(DISTINCT m.location_id, '; ') AS locations,
             STRING_AGG(DISTINCT l.zone, '; ') AS zones,
             SUM(ABS(m.qty)) AS total_units
      FROM order_locations ol
      JOIN stock_movements m ON ol.order_id = m.reference_id AND m.movement_type = 'pick'
      LEFT JOIN master.locations l ON m.location_id = l.location_id
      WHERE ol.location_count > 1 AND ($site_id IS NULL OR ol.site_id = $site_id)
      GROUP BY ol.order_id, ol.site_id
      ORDER BY total_units DESC
    limit: 50
    example: {}

  - name: get_stock_movements_for_location
    desc: Movement history (receipts, putaways, picks, moves) for a location over a date range. Shows all activity.
    kind: sql
    args:
      location_id: {required: true, desc: "DC bin location"}
      date_from: {type: date, default: "-90d", desc: "From date"}
      date_to: {type: date, desc: "To date (default today)"}
    sql: |
      SELECT m.movement_id,
             m.location_id,
             m.sku, p.name AS product_name,
             m.movement_type,
             m.qty,
             m.reference_id,
             m.moved_at,
             m.moved_by,
             m.status,
             m.batch_number
      FROM stock_movements m
      LEFT JOIN master.products p ON m.sku = p.sku
      WHERE m.location_id = $location_id
        AND CAST(m.moved_at AS DATE) >= CAST($date_from AS DATE)
        AND CAST(m.moved_at AS DATE) <= COALESCE(CAST($date_to AS DATE), CAST($as_of AS DATE))
      ORDER BY m.moved_at DESC
    limit: 200
    example: {location_id: DC1-C-14-02}

  - name: get_stock_movements_for_reexport_goods
    desc: Stock movements for re-exported goods. Shows movement trail for goods destined for re-export.
    kind: sql
    args:
      date_from: {type: date, default: "-90d", desc: "From date"}
    sql: |
      SELECT st.transfer_id,
             st.from_site_id,
             st.to_site_id,
             st.sku, p.name AS product_name,
             m.movement_id,
             m.movement_type,
             m.qty,
             m.location_id,
             l.zone,
             m.moved_at,
             st.status,
             st.reason
      FROM stock_transfers st
      LEFT JOIN stock_movements m ON st.transfer_id = m.reference_id
      LEFT JOIN master.products p ON st.sku = p.sku
      LEFT JOIN master.locations l ON m.location_id = l.location_id
      WHERE CAST(st.created_at AS DATE) >= CAST($date_from AS DATE)
        AND st.reason IN ('rebalance', 'export')
      ORDER BY st.created_at DESC, m.moved_at DESC
    limit: 100
    example: {}

  - name: get_storage_capacity_by_zone
    desc: Pallet position capacity and occupancy by zone. Shows utilization and available space.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
    sql: |
      SELECT l.site_id,
             l.zone,
             COUNT(*) AS capacity,
             COUNT(*) FILTER (WHERE l.status = 'active') AS active_positions,
             COUNT(*) FILTER (WHERE l.status = 'blocked') AS blocked_positions,
             SUM(CASE WHEN m.location_id IS NOT NULL THEN 1 ELSE 0 END) AS occupied,
             COUNT(*) - SUM(CASE WHEN m.location_id IS NOT NULL THEN 1 ELSE 0 END) AS available,
             ROUND(SUM(CASE WHEN m.location_id IS NOT NULL THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS occupancy_pct,
             'available = capacity - occupied' AS formula
      FROM master.locations l
      LEFT JOIN (SELECT DISTINCT location_id FROM stock_movements WHERE qty > 0) m ON l.location_id = m.location_id
      WHERE l.site_id = $site_id
      GROUP BY l.site_id, l.zone
      ORDER BY occupancy_pct DESC
    limit: 50
    example: {site_id: DC1}

  - name: get_units_shipped_by_period
    desc: Units, orders and lines shipped by period. Shows outbound volume and order metrics by time.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      date_from: {type: date, default: "-30d", desc: "From date"}
    sql: |
      SELECT CAST(m.moved_at AS DATE) AS date,
             COUNT(DISTINCT m.reference_id) AS orders_shipped,
             COUNT(DISTINCT m.sku) AS skus_shipped,
             SUM(ABS(m.qty)) AS units_shipped,
             COUNT(DISTINCT m.reference_id) * ROUND(AVG(ABS(m.qty)), 1) AS total_line_items,
             'units_shipped = sum(absolute qty for picks)' AS formula
      FROM stock_movements m
      WHERE m.site_id = $site_id
        AND m.movement_type = 'pick'
        AND CAST(m.moved_at AS DATE) >= CAST($date_from AS DATE)
      GROUP BY CAST(m.moved_at AS DATE)
      ORDER BY date DESC
    limit: 30
    example: {site_id: DC1}

  - name: get_warehouse_handling_damage_reports
    desc: Handling damage reports. Shows goods damaged during receipt or internal handling.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      date_from: {type: date, default: "-90d", desc: "From date"}
    sql: |
      SELECT gr.receipt_id,
             gr.site_id,
             gr.po_id,
             gr.sku, p.name AS product_name,
             gr.damage_qty,
             gr.short_qty,
             gr.dock,
             gr.carrier_id, c.name AS carrier_name,
             gr.received_at,
             ROUND(gr.damage_qty * p.unit_cost_gbp, 2) AS damage_value_gbp,
             'damage_value_gbp = damage_qty * sku_unit_cost' AS formula
      FROM goods_receipts gr
      LEFT JOIN master.products p ON gr.sku = p.sku
      LEFT JOIN master.carriers c ON gr.carrier_id = c.carrier_id
      WHERE gr.site_id = $site_id
        AND (gr.damage_qty > 0 OR gr.short_qty > 0)
        AND CAST(gr.received_at AS DATE) >= CAST($date_from AS DATE)
      ORDER BY damage_qty DESC, gr.received_at DESC
    limit: 50
    example: {site_id: DC1}

  - name: get_wave_configuration
    desc: Wave and release configuration and cut-off parameters. Shows current picking wave setup and timings.
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
    sql: |
      SELECT $site_id AS site_id,
             'E-commerce' AS channel,
             '06:00' AS wave_release_time,
             '14:00' AS wave_cutoff_time,
             '08:00' AS shipping_cutoff,
             3 AS waves_per_day,
             'Batch by zone' AS picking_method,
             15 AS avg_orders_per_wave
      UNION ALL
      SELECT $site_id, 'B2B', '08:00', '16:00', '17:00', 2, 'Wave by store', 25
      UNION ALL
      SELECT $site_id, 'Store Replenishment', '05:00', '11:00', '12:00', 1, 'Batch by aisle', 40
    limit: 10
    example: {site_id: DC1}

  - name: get_wms_inbound_field_schema
    desc: WMS inbound ASN and receipt data model. Documents required and optional fields for inbound processes.
    kind: sql
    args: {}
    sql: |
      SELECT 'ASN Header' AS entity, 'po_id' AS field_name, 'string' AS field_type, 'Required' AS requirement, 'Purchase order reference' AS description
      UNION ALL
      SELECT 'ASN Header', 'supplier_id', 'string', 'Required', 'Supplier sending goods'
      UNION ALL
      SELECT 'ASN Header', 'shipment_id', 'string', 'Required', 'Carrier shipment identifier'
      UNION ALL
      SELECT 'ASN Header', 'expected_delivery_date', 'date', 'Required', 'Promised delivery date'
      UNION ALL
      SELECT 'ASN Line', 'po_line_number', 'int', 'Required', 'Reference to PO line'
      UNION ALL
      SELECT 'ASN Line', 'sku', 'string', 'Required', 'Product identifier'
      UNION ALL
      SELECT 'ASN Line', 'qty_shipped', 'int', 'Required', 'Quantity in shipment'
      UNION ALL
      SELECT 'ASN Line', 'lot_number', 'string', 'Optional', 'Batch/lot reference if applicable'
      UNION ALL
      SELECT 'Receipt', 'receipt_id', 'string', 'Required', 'Auto-generated goods receipt'
      UNION ALL
