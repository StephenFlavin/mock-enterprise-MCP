# Scenarios for PO system - stage 1 tools (20 tools)

- question: "write:block_supplier"
  story: "Block PO-2026-004663 from supplier due to forced labour risk review"
  checks:
    - tool: block_purchase_orders_for_supplier
      args: {po_id: "PO-2026-004663", block_reason: "Forced labour risk - under review", blocked_by: "EMP-0001"}
      expect: ["BLK-", "active", "PO-2026-004663"]

- question: "write:block_factory"
  story: "Block orders from factory pending due diligence"
  checks:
    - tool: block_purchase_orders_for_factory
      args: {po_id: "PO-2026-006149", block_reason: "Supplier due diligence review", blocked_by: "EMP-0001"}
      expect: ["BLK-", "active"]

- question: "write:cancel_line"
  story: "Cancel line 1 on PO-2026-004663 due to demand reduction"
  checks:
    - tool: cancel_open_purchase_order_line
      args: {po_id: "PO-2026-004663", line_no: 1}
      expect: ["qty_ordered", "0"]

- question: "write:cancel_po"
  story: "Cancel entire PO-2026-004663 due to demand drop"
  checks:
    - tool: cancel_purchase_order
      args: {po_id: "PO-2026-004663"}
      expect: ["cancelled", "PO-2026-004663"]

- question: "write:create_po"
  story: "Create a new draft PO with supplier SUP-0001 for factory FAC-0001 to DC1 by sea"
  checks:
    - tool: create_purchase_order
      args: {supplier_id: "SUP-0068", factory_id: "FAC-0001", dest_site_id: "DC1", mode: "sea"}
      expect: ["PO-", "draft", "SUP-0001"]

- question: "write:create_requisition"
  story: "Create requisition for 10 motor bearings at DC1, cost £45.50 each"
  checks:
    - tool: create_purchase_requisition
      args: {site_id: "DC1", category: "Spare Parts", description: "Motor bearings for conveyor", qty: 10, unit_cost_gbp: 45.50, requested_by: "EMP-0001"}
      expect: ["REQ-", "submitted", "Motor bearings"]

- question: "write:delete_draft"
  story: "Delete draft PO that was not approved"
  checks:
    - tool: delete_draft_purchase_order
      args: {po_id: "PO-2026-004004"}
      expect: ["cancelled"]

- question: "read:expedite_cost"
  story: "Calculate expedite options for late order PO-2026-004663 (air, split, expedite shipping)"
  checks:
    - tool: calculate_expedite_cost_options
      args: {po_id: "PO-2026-004663"}
      expect: ["expedite_cost_gbp", "air_freight_cost_gbp", "split_shipment_cost_gbp"]

- question: "read:price_trend"
  story: "Get actual price trend for SKU-104522 from all past orders to detect supplier pricing"
  checks:
    - tool: get_actual_price_paid_trend_by_item
      args: {sku: "SKU-104522"}
      expect: ["SKU-104522", "order_date"]

- question: "read:historical_price"
  story: "Get historical unit price range for SKU-101022 to understand price volatility"
  checks:
    - tool: get_historical_unit_price_for_product
      args: {sku: "SKU-101022"}
      expect: ["min_unit_cost_gbp", "max_unit_cost_gbp", "avg_unit_cost_gbp"]

- question: "read:inbound_for_sku"
  story: "Find all inbound POs for SKU-104522 with expected delivery dates and suppliers"
  checks:
    - tool: get_inbound_purchase_orders_for_product
      args: {sku: "SKU-104522"}
      expect: ["SKU-104522", "supplier"]

- question: "read:moq_by_category"
  story: "Get minimum order quantities for Bedding category across suppliers"
  checks:
    - tool: get_minimum_order_quantities_for_category
      args: {category: "Bedding"}
      expect: ["minimum_order_quantity", "Bedding"]

- question: "read:nearshore_pilot"
  story: "Find purchase orders from nearshore pilot suppliers"
  checks:
    - tool: get_nearshore_pilot_orders
      args: {supplier_id: "SUP-0076"}
      expect: ["marker_id"]

- question: "read:commodity_commitments"
  story: "Get open commodity purchase commitments with remaining volumes"
  checks:
    - tool: get_open_commodity_commitments
      args: {}
      expect: ["commitment_id", "commodity"]

- question: "read:orders_for_supplier"
  story: "List all open POs for supplier SUP-0076 with delivery status"
  checks:
    - tool: get_open_orders_for_supplier
      args: {supplier_id: "SUP-0076"}
      expect: ["SUP-0076"]

- question: "read:orders_by_factory"
  story: "Get all open POs from factory with delivery dates"
  checks:
    - tool: get_open_purchase_orders_by_factory
      args: {factory_id: "FAC-0143"}
      expect: ["due_date"]

- question: "read:orders_by_origin"
  story: "Show all open POs for products made in China (CN)"
  checks:
    - tool: get_open_purchase_orders_by_material_origin
      args: {country_of_origin: "CN"}
      expect: ["CN"]

- question: "read:orders_supplier_sku"
  story: "Get open POs from SUP-0068 for SKU-104522 with quantities and delivery dates"
  checks:
    - tool: get_open_purchase_orders_by_supplier_and_sku
      args: {supplier_id: "SUP-0068", sku: "SKU-104522"}
      expect: ["SUP-0068", "SKU-104522"]

- question: "read:orders_for_product"
  story: "Find all open POs for product SKU-104522 across all suppliers"
  checks:
    - tool: get_open_purchase_orders_for_product
      args: {sku: "SKU-104522"}
      expect: ["SKU-104522"]

- question: "read:order_amendments"
  story: "Get change history for SUP-0068 orders (delivery dates, quantities, prices)"
  checks:
    - tool: get_order_change_history_for_supplier
      args: {supplier_id: "SUP-0068"}
      expect: ["amendment"]
