  - name: list_inbound_purchase_orders_by_week
    desc: Open inbound POs by expected arrival week, with units, landed value in GBP and main category; filter by DC.
    kind: sql
    args:
      dest_site_id: {}
      category: {desc: "Product category, e.g. Bedding"}
      date_from: {type: date, default: "-7d", desc: "Start of date range"}
      date_to: {type: date, default: "+90d", desc: "End of date range"}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , x AS (SELECT dl.po_id, dl.supplier_id, dl.dest_site_id, dl.confirmed_delivery_date, dl.due_date, pr.category,
                     sum(pl.qty_ordered) AS qty, sum(pl.qty_ordered * pr.unit_cost_gbp) AS val
              FROM dl JOIN master.po_lines pl ON pl.po_id = dl.po_id JOIN master.products pr ON pr.sku = pl.sku
              WHERE dl.status IN ('open','confirmed','shipped') AND dl.due_date >= CAST($date_from AS DATE) AND dl.due_date <= CAST($date_to AS DATE)
                AND ($dest_site_id IS NULL OR dl.dest_site_id = $dest_site_id) AND ($category IS NULL OR pr.category = $category)
              GROUP BY ALL),
        y AS (SELECT po_id, supplier_id, dest_site_id, due_date, sum(qty) AS total_units, round(sum(val), 2) AS value_gbp,
                     arg_max(category, val) AS main_category, count(DISTINCT category) AS category_count
              FROM x GROUP BY po_id, supplier_id, dest_site_id, due_date)
      SELECT CAST(date_trunc('week', due_date) AS DATE) AS week_start, po_id, supplier_id, dest_site_id, due_date, total_units, value_gbp,
