  - name: get_service_level_by_supplier
    desc: Service level by supplier. Shows on-time in-full (OTIF) performance.
    kind: sql
    args: {supplier_id: {required: true}}
    sql: |
      SELECT p.supplier_id, s.name AS supplier_name,
             count(p.po_id) AS total_orders,
             count(CASE WHEN CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE) <= CAST(p.due_date AS DATE)
                        THEN 1 END) AS on_time_orders,
             round(100.0 * count(CASE WHEN CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE) <= CAST(p.due_date AS DATE)
                                       THEN 1 END) / NULLIF(count(p.po_id), 0), 1) AS otif_pct
      FROM master.purchase_orders p
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
      LEFT JOIN supplier_confirmations sc ON sc.po_id = p.po_id AND sc.status = 'received'
      WHERE p.supplier_id = $supplier_id AND p.status IN ('received', 'closed', 'shipped')
      GROUP BY p.supplier_id, s.name
