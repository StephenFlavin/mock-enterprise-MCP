  - name: list_advance_shipping_notices
    desc: Supplier ASN lines with advised versus received quantity and variance, for a supplier or PO. Use variance=short to find short-received lines.
    kind: sql
    args:
      supplier_id: {}
      po_id: {}
      date_from: {type: date, default: "-56d", desc: "ASNs advised on or after this date"}
      status: {type: enum, values: [delivered, received], default: delivered, desc: "delivered = goods received, so variances are real; received = ASN logged, goods still in transit"}
      variance: {type: enum, values: [any, short, over], default: any, desc: "short = received below advised (negative variance); over = received above advised"}
    sql: |
      SELECT a.asn_id, a.po_id, a.supplier_id, s.name AS supplier_name, a.asn_number, a.advised_at, a.expected_delivery_date, a.status,
             l.po_line_no, l.sku, l.qty_advised, l.qty_received, l.qty_received - l.qty_advised AS variance_units,
             round(100.0 * (l.qty_received - l.qty_advised) / NULLIF(l.qty_advised, 0), 1) AS variance_pct, l.batch_no
      FROM advance_shipping_notices a JOIN asn_line_items l ON l.asn_id = a.asn_id LEFT JOIN master.suppliers s ON s.supplier_id = a.supplier_id
      WHERE a.status <> 'cancelled' AND a.status = $status AND ($supplier_id IS NULL OR a.supplier_id = $supplier_id) AND ($po_id IS NULL OR a.po_id = $po_id)
        AND CAST(a.advised_at AS DATE) >= CAST($date_from AS DATE)
        AND ($variance IS NULL OR $variance = 'any' OR ($variance = 'short' AND l.qty_received < l.qty_advised)
             OR ($variance = 'over' AND l.qty_received > l.qty_advised))
      ORDER BY a.advised_at DESC, a.asn_id, l.line_no
    limit: 100
    example: {}

  # ---------------- supplier performance, lead times, lead-time gap
  - name: get_quoted_vs_actual_lead_time_by_supplier
    desc: Quoted vs actual lead time by supplier, largest gap first. Omit supplier to rank all suppliers.
    kind: sql
    args:
      supplier_id: {}
      date_from: {type: date, default: "-365d", desc: "Orders received on or after this date"}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , po AS (SELECT dl.po_id, dl.supplier_id, datediff('day', dl.order_date, dl.due_date) AS promised_days,
                      datediff('day', dl.order_date, dl.received_date) AS actual_days, avg(pr.lead_time_days) AS quoted_days
               FROM dl JOIN master.po_lines pl ON pl.po_id = dl.po_id JOIN master.products pr ON pr.sku = pl.sku
               WHERE dl.received_date IS NOT NULL AND dl.received_date >= CAST($date_from AS DATE)
                 AND ($supplier_id IS NULL OR dl.supplier_id = $supplier_id)
               GROUP BY dl.po_id, dl.supplier_id, dl.order_date, dl.due_date, dl.received_date)
      SELECT po.supplier_id, s.name AS supplier_name, s.tier, count(*) AS order_count,
             round(avg(quoted_days), 1) AS avg_quoted_lead_time_days, round(avg(promised_days), 1) AS avg_promised_lead_time_days,
             round(avg(actual_days), 1) AS avg_actual_lead_time_days, round(avg(actual_days) - avg(quoted_days), 1) AS avg_gap_days
      FROM po LEFT JOIN master.suppliers s ON s.supplier_id = po.supplier_id
      GROUP BY po.supplier_id, s.name, s.tier
      HAVING count(*) >= 3
      ORDER BY avg_gap_days DESC
    limit: 30
    example: {supplier_id: "SUP-0022"}

  - name: get_supplier_lead_time_actuals
    desc: Actual order-to-receipt lead time by supplier with variability and recent-versus-earlier change. Omit supplier for all.
    kind: sql
    args:
      supplier_id: {}
      date_from: {type: date, default: "-540d", desc: "Orders received on or after this date"}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , po AS (SELECT dl.po_id, dl.supplier_id, datediff('day', dl.order_date, dl.received_date) AS lead,
                      dl.received_date >= CAST($as_of AS DATE) - INTERVAL 182 DAY AS recent, avg(pr.lead_time_days) AS quoted
               FROM dl JOIN master.po_lines pl ON pl.po_id = dl.po_id JOIN master.products pr ON pr.sku = pl.sku
               WHERE dl.received_date IS NOT NULL AND dl.received_date >= CAST($date_from AS DATE)
                 AND ($supplier_id IS NULL OR dl.supplier_id = $supplier_id)
               GROUP BY dl.po_id, dl.supplier_id, dl.order_date, dl.received_date)
      SELECT po.supplier_id, s.name AS supplier_name, count(*) AS orders, round(avg(lead), 1) AS avg_actual_lead_time_days,
             round(stddev(lead), 1) AS lead_time_stddev_days, round(avg(quoted), 1) AS avg_quoted_lead_time_days,
             round(avg(lead) FILTER (WHERE recent), 1) AS avg_lead_last_6_months, round(avg(lead) FILTER (WHERE NOT recent), 1) AS avg_lead_before,
             round(avg(lead) FILTER (WHERE recent) - avg(lead) FILTER (WHERE NOT recent), 1) AS change_days
      FROM po LEFT JOIN master.suppliers s ON s.supplier_id = po.supplier_id
      GROUP BY po.supplier_id, s.name
      HAVING count(*) >= 3
      ORDER BY abs(change_days) DESC NULLS LAST
    limit: 30
    example: {supplier_id: "SUP-0068"}

