  - name: get_purchase_price_variance_by_item
    desc: Purchase price variance by item, showing quoted vs actual prices per occurrence.
    kind: sql
    args: {sku: {required: true}}
    sql: |
      SELECT ph.sku, ph.occurrence, ph.order_date, ph.supplier_id, s.name AS supplier_name,
             round(ph.quoted_unit_cost_gbp, 2) AS quoted_unit_cost,
             round(ph.actual_unit_cost_gbp, 2) AS actual_unit_cost,
             round(ph.variance_pct, 1) AS variance_pct,
             ph.qty_ordered, ph.qty_received,
             round((ph.actual_unit_cost_gbp - ph.quoted_unit_cost_gbp) * ph.qty_received, 2) AS total_variance_gbp
      FROM po_price_history ph
      LEFT JOIN master.suppliers s ON s.supplier_id = ph.supplier_id
      WHERE ph.sku = $sku
      ORDER BY ph.order_date DESC
    limit: 50
    example: {sku: "SKU-100238"}

  - name: get_quoted_vs_actual_lead_time_by_supplier
    desc: Quoted vs actual lead time by supplier. Shows gap between promise and delivery.
    kind: sql
    args: {supplier_id: {required: true}}
    sql: |
      SELECT p.supplier_id, s.name AS supplier_name, count(p.po_id) AS order_count,
             round(avg(pr.lead_time_days), 1) AS avg_quoted_lead_time_days,
             round(avg(DATEDIFF('day', CAST(p.order_date AS DATE), CAST(p.due_date AS DATE))), 1) AS avg_promised_lead_time_days,
             round(avg(DATEDIFF('day', CAST(p.order_date AS DATE), CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE))), 1) AS avg_actual_lead_time_days,
             round(avg(DATEDIFF('day', CAST(p.order_date AS DATE), CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE))) -
                   avg(pr.lead_time_days), 1) AS avg_gap_days
      FROM master.purchase_orders p
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
      LEFT JOIN master.po_lines pl ON pl.po_id = p.po_id
      LEFT JOIN master.products pr ON pr.sku = pl.sku
      LEFT JOIN supplier_confirmations sc ON sc.po_id = p.po_id AND sc.status = 'received'
      WHERE p.supplier_id = $supplier_id AND p.status IN ('received', 'closed', 'shipped')
      GROUP BY p.supplier_id, s.name
    example: {supplier_id: "SUP-0068"}

