               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , ln AS (SELECT po_id, sum(qty_ordered) AS ordered, sum(qty_received) AS received FROM master.po_lines GROUP BY po_id)
      SELECT dl.po_id, dl.supplier_id, s.name AS supplier_name, dl.order_date, dl.due_date, dl.received_date,
             ln.ordered AS qty_ordered, ln.received AS qty_received, round(100.0 * ln.received / NULLIF(ln.ordered, 0), 1) AS fill_rate_pct,
             CASE WHEN dl.received_date IS NULL THEN 'Late - not yet received' WHEN dl.delay_days = 0 THEN 'On time' ELSE 'Late' END AS on_time_status,
             dl.delay_days AS days_late,
             CASE WHEN dl.received_date IS NOT NULL AND dl.delay_days = 0 AND ln.received >= ln.ordered THEN 'OTIF' ELSE 'Not OTIF' END AS otif_result
      FROM dl JOIN ln ON ln.po_id = dl.po_id LEFT JOIN master.suppliers s ON s.supplier_id = dl.supplier_id
      WHERE ($supplier_id IS NULL OR dl.supplier_id = $supplier_id) AND dl.due_date >= CAST($date_from AS DATE)
        AND (dl.status IN ('received','closed') OR dl.days_overdue IS NOT NULL)
      ORDER BY (CASE WHEN dl.received_date IS NOT NULL AND dl.delay_days = 0 AND ln.received >= ln.ordered THEN 1 ELSE 0 END), dl.delay_days DESC, dl.po_id
    limit: 50
