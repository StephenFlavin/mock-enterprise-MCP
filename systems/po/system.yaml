        AND ($sku IS NULL OR EXISTS (SELECT 1 FROM master.po_lines l WHERE l.po_id = p.po_id AND l.sku = $sku))
        AND ($due_date IS NULL OR p.due_date = CAST($due_date AS DATE))
        AND ($due_from IS NULL OR p.due_date >= CAST($due_from AS DATE)) AND ($due_to IS NULL OR p.due_date <= CAST($due_to AS DATE))
