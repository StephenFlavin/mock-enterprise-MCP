id: po
name: Purchase Order System
instructions: >
  Purchase orders, requisitions, supplier confirmations and order amendments.
  PO ids look like PO-2026-004001. Use it for order management, delivery tracking,
  price history, and supplier performance.

tables:
  purchase_requisitions:
    key: req_id
    cols:
      req_id: {type: str, desc: "Requisition, e.g. REQ-000123"}
      site_id: {type: str, desc: "Destination site (DC or store)"}
      category: {type: str, desc: "Item category, e.g. Spare Parts, Supplies"}
      description: {type: text, desc: "What is being requested"}
      qty: {type: int, desc: "Quantity required"}
      unit_cost_gbp: {type: float, desc: "Estimated unit cost in GBP"}
      priority: {type: enum, values: [low, medium, high, urgent], desc: "Priority level"}
      status: {type: enum, values: [draft, submitted, approved, rejected, ordered, received], desc: "Requisition status"}
      requested_by: {type: str, desc: "Employee ID who requested"}
      requested_at: {type: timestamp, desc: "When requested"}
      approved_by: {type: str, desc: "Employee ID who approved"}
      approved_at: {type: timestamp, desc: "When approved"}
      related_po_id: {type: str, desc: "PO raised from this requisition"}
      notes: {type: text, desc: "Additional notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  po_amendments:
    key: amendment_id
    cols:
      amendment_id: {type: str, desc: "Amendment, e.g. AMD-000123"}
      po_id: {type: str, desc: "Purchase order being amended"}
      line_no: {type: int, desc: "Line number if line-specific (NULL if PO-level)"}
      amendment_type: {type: enum, values: [delivery_date, ship_date, quantity, price, cancellation, other], desc: "Type of change"}
      old_value: {type: str, desc: "Previous value"}
      new_value: {type: str, desc: "New value"}
      reason: {type: text, desc: "Why the amendment was made"}
      requested_by: {type: str, desc: "Employee who requested"}
      requested_at: {type: timestamp, desc: "When requested"}
      approved_by: {type: str, desc: "Employee who approved"}
      approved_at: {type: timestamp, desc: "When approved"}
      status: {type: enum, values: [requested, approved, rejected, implemented], desc: "Amendment status"}
      supplier_confirmed_at: {type: timestamp, desc: "When supplier confirmed"}
      cost_impact_gbp: {type: float, desc: "Cost impact in GBP (positive = increase)"}
      updated_at: {type: timestamp, desc: "Last updated"}

  po_blocks:
    key: block_id
    cols:
      block_id: {type: str, desc: "Block record, e.g. BLK-000123"}
      po_id: {type: str, desc: "Purchase order held (blank = hold covers all open POs of the supplier or factory)"}
      supplier_id: {type: str, desc: "Supplier whose open POs are held"}
      factory_id: {type: str, desc: "Factory whose open POs are held"}
      block_type: {type: enum, values: [supplier, factory, other], desc: "Reason for block"}
      block_reason: {type: text, desc: "Why blocked, e.g. due diligence, compliance"}
      blocked_by: {type: str, desc: "Employee ID who applied block"}
      blocked_at: {type: timestamp, desc: "When blocked"}
      unblock_approval_required: {type: bool, desc: "Does unblock need approval"}
      unblocked_by: {type: str, desc: "Employee ID who unblocked"}
      unblocked_at: {type: timestamp, desc: "When unblocked"}
      status: {type: enum, values: [active, released, expired], desc: "Block status"}
      notes: {type: text, desc: "Additional notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  po_price_history:
    key: [po_id, line_no, occurrence]
    cols:
      po_id: {type: str, desc: "Purchase order"}
      line_no: {type: int, desc: "Line number"}
      sku: {type: str, desc: "SKU"}
      occurrence: {type: int, desc: "Occurrence number (1 = first PO for this SKU)"}
      order_date: {type: date, desc: "When PO was raised"}
      quoted_unit_cost: {type: float, desc: "Unit price on the PO line, in PO currency"}
      actual_unit_cost: {type: float, desc: "Unit price actually invoiced, in PO currency"}
      currency: {type: str, desc: "PO currency, e.g. USD"}
      qty_ordered: {type: int, desc: "Units ordered"}
      qty_received: {type: int, desc: "Units received"}
      variance_pct: {type: float, desc: "Price variance as percentage"}
      supplier_id: {type: str, desc: "Supplier"}
      invoice_date: {type: date, desc: "Invoice date"}
      received_date: {type: date, desc: "Goods receipt date"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_confirmations:
    key: confirmation_id
    cols:
      confirmation_id: {type: str, desc: "Confirmation record, e.g. CNF-000123"}
      po_id: {type: str, desc: "Purchase order"}
      supplier_id: {type: str, desc: "Supplier"}
      confirmation_type: {type: enum, values: [order, shipment, asn], desc: "Type of confirmation"}
      confirmed_ship_date: {type: date, desc: "Confirmed ex-factory date"}
      confirmed_delivery_date: {type: date, desc: "Confirmed delivery date"}
      status: {type: enum, values: [requested, received, superseded, rejected], desc: "Confirmation status"}
      requested_at: {type: timestamp, desc: "When requested"}
      received_at: {type: timestamp, desc: "When supplier replied"}
      notes: {type: text, desc: "Supplier notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  commodity_commitments:
    key: commitment_id
    cols:
      commitment_id: {type: str, desc: "Commitment record, e.g. COM-000123"}
      supplier_id: {type: str, desc: "Supplier"}
      commodity: {type: str, desc: "Commodity (e.g. Cotton, Polyester, Steel)"}
      start_date: {type: date, desc: "Commitment start date"}
      end_date: {type: date, desc: "Commitment end date"}
      volume_units: {type: int, desc: "Committed volume"}
      volume_uom: {type: str, desc: "Unit of measure (e.g. tonnes, meters)"}
      price_gbp_per_unit: {type: float, desc: "Committed price per unit"}
      used_to_date: {type: int, desc: "Units used so far"}
      remaining_volume: {type: int, desc: "Remaining committed volume"}
      status: {type: enum, values: [active, partially_used, fulfilled, expired], desc: "Commitment status"}
      notes: {type: text, desc: "Additional notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  advance_shipping_notices:
    key: asn_id
    cols:
      asn_id: {type: str, desc: "ASN record, e.g. ASN-000123"}
      po_id: {type: str, desc: "Purchase order"}
      supplier_id: {type: str, desc: "Supplier"}
      asn_number: {type: str, desc: "Supplier's ASN number"}
      shipment_id: {type: str, desc: "Related shipment ID"}
      advised_at: {type: timestamp, desc: "When ASN was received"}
      expected_delivery_date: {type: date, desc: "Expected delivery"}
      status: {type: enum, values: [received, delivered, cancelled], desc: "ASN status"}
      updated_at: {type: timestamp, desc: "Last updated"}

  asn_line_items:
    key: [asn_id, line_no]
    cols:
      asn_id: {type: str, desc: "Advance shipping notice"}
      line_no: {type: int, desc: "Line number"}
      po_line_no: {type: int, desc: "Corresponding PO line"}
      sku: {type: str, desc: "SKU"}
      qty_advised: {type: int, desc: "Quantity advised"}
      qty_received: {type: int, desc: "Quantity actually received"}
      batch_no: {type: str, desc: "Batch/lot number"}
      updated_at: {type: timestamp, desc: "Last updated"}

  nearshore_pilot_markers:
    key: marker_id
    cols:
      marker_id: {type: str, desc: "Marker record, e.g. MRK-000123"}
      po_id: {type: str, desc: "Purchase order in nearshore pilot"}
      supplier_id: {type: str, desc: "Nearshore pilot supplier"}
      pilot_program: {type: str, desc: "Pilot program name"}
      start_date: {type: date, desc: "When order entered pilot"}
      status: {type: enum, values: [active, completed, cancelled], desc: "Pilot status"}
      notes: {type: text, desc: "Pilot notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  po_approvals:
    key: approval_id
    cols:
      approval_id: {type: str, desc: "Approval request, e.g. APR-000001"}
      po_id: {type: str, desc: "Draft purchase order submitted for approval"}
      status: {type: enum, values: [submitted, approved, rejected], desc: "Approval status"}
      submitted_by: {type: str, desc: "Employee ID who submitted"}
      submitted_at: {type: timestamp, desc: "When submitted"}
      decided_by: {type: str, desc: "Employee ID who decided"}
      decided_at: {type: timestamp, desc: "When decided"}
      notes: {type: text, desc: "Approval notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  # ---------------- writes
  - name: block_purchase_orders_for_factory
    desc: Place a hold on all open POs of a factory (or one PO) pending audit, quality or compliance review. Returns the hold record.
    kind: insert
    table: po_blocks
    id_prefix: BLK-
    defaults: {block_type: factory, status: active, blocked_at: "$as_of", unblock_approval_required: true}
    args:
      factory_id: {required: true}
      po_id: {desc: "Hold only this PO; leave blank to hold every open PO of the factory"}
      block_reason: {required: true, desc: "Why blocked, e.g. audit failed, quality hold"}
      blocked_by: {required: true, desc: "Employee ID, e.g. EMP-00019"}
    example: {factory_id: "FAC-0021", block_reason: "Audit failed", blocked_by: "EMP-00019"}

  - name: block_purchase_orders_for_supplier
    desc: Place a hold on all open POs of a supplier (or one PO) pending review or remediation. Returns the hold record.
    kind: insert
    table: po_blocks
    id_prefix: BLK-
    defaults: {block_type: supplier, status: active, blocked_at: "$as_of", unblock_approval_required: true}
    args:
      supplier_id: {required: true}
      po_id: {desc: "Hold only this PO; leave blank to hold every open PO of the supplier"}
      block_reason: {required: true, desc: "Why blocked, e.g. compliance, forced labour risk"}
      blocked_by: {required: true, desc: "Employee ID, e.g. EMP-00019"}
    example: {supplier_id: "SUP-0076", block_reason: "Forced labour risk - under review", blocked_by: "EMP-00019"}

  - name: cancel_open_purchase_order_line
    desc: Cancels one open line on a purchase order by setting its ordered quantity to zero. Returns old and new quantity.
    kind: update
    table: master.po_lines
    set: {qty_ordered: 0}
    args:
      po_id: {required: true}
      line_no: {required: true, type: int}
    example: {po_id: "PO-2026-005575", line_no: 1}

  - name: cancel_purchase_order
    desc: Cancels an open purchase order that has not yet shipped. Returns old and new status.
    kind: update
    table: master.purchase_orders
    set: {status: cancelled}
    args:
      po_id: {required: true}
    example: {po_id: "PO-2026-005658"}

  - name: create_purchase_order
    desc: Creates a draft purchase order for a supplier, factory, destination and units. Returns the new PO with its id.
    kind: insert
    table: master.purchase_orders
    id_prefix: "PO-2026-"
    defaults: {status: draft, order_date: "$as_of", currency: GBP, incoterm: FOB}
    args:
      supplier_id: {required: true}
      factory_id: {required: true}
      dest_site_id: {required: true}
      total_units: {required: true, type: int, desc: "Units ordered"}
      total_value: {required: true, type: float, desc: "PO value in GBP (units x unit cost)"}
      mode: {type: enum, values: [sea, air, road, rail], default: sea, desc: "Inbound mode"}
      due_date: {type: date, default: "+60d", desc: "Required in DC by"}
      ship_date: {type: date, default: "+40d", desc: "Planned ex-factory date"}
    example: {supplier_id: "SUP-0022", factory_id: "FAC-0042", dest_site_id: "DC1", total_units: 2000, total_value: 24000}

  - name: create_purchase_requisition
    desc: Create a requisition for spare parts or supplies for approval. Returns the requisition with status.
    kind: insert
    table: purchase_requisitions
    id_prefix: REQ-
    defaults: {status: submitted}
    args:
      site_id: {required: true}
      category: {required: true}
      description: {required: true}
      qty: {required: true, type: int}
      unit_cost_gbp: {required: true, type: float}
      priority: {type: enum, values: [low, medium, high, urgent], default: medium}
      requested_by: {required: true, desc: "Employee ID, e.g. EMP-00019"}
    example: {site_id: "DC1", category: "Spare Parts", description: "Motor bearings for conveyor", qty: 10, unit_cost_gbp: 45.5, requested_by: "EMP-00019"}

  - name: delete_draft_purchase_order
    desc: Deletes a draft purchase order that has not been approved (marks it cancelled). Returns old and new status.
    kind: update
    table: master.purchase_orders
    set: {status: cancelled}
    args:
      po_id: {required: true}
    example: {po_id: "PO-2026-004317"}

  - name: release_purchase_order
    desc: Releases an approved draft purchase order to the supplier by making it open. Returns old and new status.
    kind: update
    table: master.purchase_orders
    set: {status: open}
    args:
      po_id: {required: true}
    example: {po_id: "PO-2026-004339"}

  - name: submit_purchase_order_for_approval
    desc: Submits a draft purchase order into the approval workflow. Returns the approval request.
    kind: insert
    table: po_approvals
    id_prefix: APR-
    defaults: {status: submitted}
    args:
      po_id: {required: true}
      submitted_by: {required: true, desc: "Employee ID, e.g. EMP-00019"}
      notes: {desc: "Note for the approver"}
    example: {po_id: "PO-2026-004339", submitted_by: "EMP-00019"}

  - name: update_purchase_order_delivery_date
    desc: Change the due-in-DC (delivery) date of a purchase order. Returns old and new dates.
    kind: update
    table: master.purchase_orders
    set: {due_date: "$due_date"}
    args:
      due_date: {type: date, required: true, desc: "New delivery date"}
    example: {po_id: "PO-2026-005575", due_date: "+30d"}

  - name: update_purchase_order_ship_date
    desc: Changes the planned ex-factory (ship) date on a purchase order. Returns old and new dates.
    kind: update
    table: master.purchase_orders
    set: {ship_date: "$ship_date"}
    args:
      ship_date: {type: date, required: true, desc: "New ship date"}
    example: {po_id: "PO-2026-005575", ship_date: "+20d"}

  - name: send_stock_confirmation_request_to_supplier
    desc: Sends a supplier a request to confirm stock and delivery dates for a PO. Returns the stored request.
    kind: insert
    table: supplier_confirmations
    id_prefix: CNF-
    defaults: {confirmation_type: order, status: requested}
    args:
      po_id: {required: true}
      supplier_id: {required: true}
      notes: {desc: "Message to the supplier"}
    example: {po_id: "PO-2026-005594", supplier_id: "SUP-0022"}

  # ---------------- delivery performance and order status (all share the same delivery logic)
  - name: list_open_purchase_orders_with_delay
    desc: Open POs running late (past due, not received), most overdue first, with supplier and days overdue.
    kind: sql
    args:
      supplier_id: {}
      dest_site_id: {}
      min_days_overdue: {type: int, default: 1, desc: "Only POs at least this many days overdue"}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      SELECT dl.po_id, dl.supplier_id, s.name AS supplier_name, dl.dest_site_id, dl.status, dl.due_date,
             dl.confirmed_delivery_date, dl.days_overdue, dl.delay_days, dl.total_units,
             round(dl.total_value, 2) AS order_value, dl.currency
      FROM dl LEFT JOIN master.suppliers s ON s.supplier_id = dl.supplier_id
      WHERE dl.days_overdue >= $min_days_overdue
        AND ($supplier_id IS NULL OR dl.supplier_id = $supplier_id)
        AND ($dest_site_id IS NULL OR dl.dest_site_id = $dest_site_id)
      ORDER BY dl.days_overdue DESC, dl.po_id
    limit: 50
    example: {}

  - name: get_supplier_on_time_delivery_history
    desc: Supplier delivery punctuality by order, showing promised, confirmed and actual dates and days late.
    kind: sql
    args:
      supplier_id: {required: true}
      date_from: {type: date, default: "-365d", desc: "Orders due on or after this date"}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , x AS (
        SELECT dl.po_id, dl.supplier_id, s.name AS supplier_name, dl.order_date, dl.due_date AS promised_date,
               dl.confirmed_delivery_date, dl.received_date AS actual_delivery_date,
               CASE WHEN dl.received_date IS NOT NULL THEN CASE WHEN dl.delay_days = 0 THEN 'On time' ELSE 'Late' END
                    ELSE 'Late - not yet received' END AS performance,
               dl.delay_days AS days_late, dl.status
        FROM dl LEFT JOIN master.suppliers s ON s.supplier_id = dl.supplier_id
        WHERE dl.supplier_id = $supplier_id AND dl.due_date >= CAST($date_from AS DATE)
          AND (dl.status IN ('received','closed') OR dl.days_overdue IS NOT NULL))
      SELECT x.*, round(100.0 * count(*) FILTER (WHERE performance = 'On time') OVER () / count(*) OVER (), 1) AS on_time_pct_all_rows
      FROM x ORDER BY promised_date DESC
    limit: 50
    example: {supplier_id: "SUP-0068"}

  - name: get_po_history_with_outcomes
    desc: PO history with promised, confirmed and actual receipt dates, delay days, amendments and outcome.
    kind: sql
    args:
      supplier_id: {}
      date_from: {type: date, default: "-365d", desc: "Orders placed on or after this date"}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , am AS (SELECT po_id, count(*) AS amendments FROM po_amendments GROUP BY po_id),
        cf AS (SELECT po_id, count(*) AS confirmations FROM supplier_confirmations GROUP BY po_id)
      SELECT dl.po_id, dl.supplier_id, dl.order_date, dl.due_date AS promised_delivery, dl.confirmed_delivery_date AS confirmed_delivery,
             dl.received_date AS actual_delivery, dl.delay_days, dl.status, dl.total_units,
             COALESCE(am.amendments, 0) AS amendments, COALESCE(cf.confirmations, 0) AS confirmations,
             CASE WHEN dl.received_date IS NOT NULL THEN CASE WHEN dl.delay_days = 0 THEN 'On time' ELSE 'Late' END
                  WHEN dl.days_overdue IS NOT NULL THEN 'Late - not yet received'
                  ELSE 'In progress' END AS delivery_outcome
      FROM dl LEFT JOIN am ON am.po_id = dl.po_id LEFT JOIN cf ON cf.po_id = dl.po_id
      WHERE dl.status IN ('open','confirmed','shipped','received','closed')
        AND ($supplier_id IS NULL OR dl.supplier_id = $supplier_id)
        AND dl.order_date >= CAST($date_from AS DATE)
      ORDER BY dl.order_date DESC, dl.po_id
    limit: 50
    example: {supplier_id: "SUP-0068"}

  - name: get_order_delay_history_for_factory
    desc: Delivery delays by factory, newest first, with promised and actual dates, days late and recorded delay reason.
    kind: sql
    args:
      factory_id: {required: true}
      date_from: {type: date, default: "-540d", desc: "Orders due on or after this date"}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , rsn AS (SELECT po_id, string_agg(DISTINCT reason, '; ') AS reason FROM po_amendments
                WHERE amendment_type IN ('delivery_date','ship_date') AND status IN ('approved','implemented') GROUP BY po_id)
      SELECT dl.po_id, dl.factory_id, dl.supplier_id, s.name AS supplier_name, dl.order_date, dl.due_date AS promised_delivery_date,
             dl.confirmed_delivery_date, dl.received_date AS actual_delivery_date, dl.delay_days AS days_late, dl.status,
             COALESCE(rsn.reason, 'None recorded') AS delay_reason
      FROM dl LEFT JOIN master.suppliers s ON s.supplier_id = dl.supplier_id LEFT JOIN rsn ON rsn.po_id = dl.po_id
      WHERE dl.factory_id = $factory_id AND dl.due_date >= CAST($date_from AS DATE)
        AND (dl.status IN ('received','closed') OR dl.days_overdue IS NOT NULL)
      ORDER BY dl.due_date DESC
    limit: 50
    example: {factory_id: "FAC-0104"}

  - name: get_order_delay_impact
    desc: Sales and stock impact of a late order, with delay days, DC cover and sales at risk.
    kind: sql
    args:
      po_id: {required: true}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , pl AS (SELECT sku, qty_ordered - qty_received AS qty_open FROM master.po_lines WHERE po_id = $po_id),
        sales AS (SELECT sku, sum(store_units + online_units) / 8.0 AS weekly_units FROM master.sales_weekly
                  WHERE week_start >= CAST($as_of AS DATE) - INTERVAL 56 DAY GROUP BY sku),
        stock AS (SELECT sku, sum(available) AS available FROM master.dc_stock GROUP BY sku),
        per AS (SELECT pl.sku, pl.qty_open, COALESCE(sales.weekly_units, 0) AS wk, COALESCE(stock.available, 0) AS avail,
                       pr.retail_price_gbp AS price
                FROM pl LEFT JOIN sales ON sales.sku = pl.sku LEFT JOIN stock ON stock.sku = pl.sku
                LEFT JOIN master.products pr ON pr.sku = pl.sku)
      SELECT dl.po_id, dl.supplier_id, s.name AS supplier_name, dl.dest_site_id, dl.status, dl.due_date,
             dl.confirmed_delivery_date AS confirmed_delivery, dl.days_overdue, dl.delay_days,
             dl.total_units, round(dl.total_value, 2) AS order_value, dl.currency,
             count(per.sku) AS sku_count, round(sum(per.wk), 0) AS weekly_sales_units,
             sum(per.avail) AS dc_available_units,
             round(sum(per.avail) / NULLIF(sum(per.wk), 0), 1) AS weeks_of_cover,
             round(sum(greatest(0, per.wk * dl.delay_days / 7.0 - per.avail)), 0) AS units_at_risk,
             round(sum(greatest(0, per.wk * dl.delay_days / 7.0 - per.avail) * per.price), 0) AS sales_at_risk_gbp,
             'units at risk = weekly sales x delay weeks - DC stock available; sales at risk = units at risk x retail price' AS formula
      FROM dl LEFT JOIN master.suppliers s ON s.supplier_id = dl.supplier_id LEFT JOIN per ON true
      WHERE dl.po_id = $po_id
      GROUP BY dl.po_id, dl.supplier_id, s.name, dl.dest_site_id, dl.status, dl.due_date, dl.confirmed_delivery_date,
               dl.days_overdue, dl.delay_days, dl.total_units, dl.total_value, dl.currency
    example: {po_id: "PO-2026-004072"}

