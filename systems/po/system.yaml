             count(DISTINCT pl.sku) AS sku_count
      FROM master.purchase_orders p
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
      LEFT JOIN master.po_lines pl USING (po_id)
      WHERE p.factory_id = $factory_id AND p.status IN ('open', 'confirmed')
      GROUP BY p.po_id, p.supplier_id, s.name, p.order_date, p.due_date, p.status, p.total_units, p.total_value
      ORDER BY p.due_date ASC
    limit: 50
    example: {factory_id: "FAC-0001"}

  - name: list_open_orders_by_origin
    desc: Open orders by origin country. Shows all inbound orders grouped by source country.
    kind: sql
    args: {country_of_origin: {}}
    sql: |
      SELECT DISTINCT p.po_id, p.supplier_id, s.name AS supplier_name, pr.country_of_origin,
             p.order_date, p.due_date, p.status, sum(pl.qty_ordered) AS total_qty,
             round(sum(pl.qty_ordered * pl.unit_cost), 2) AS order_value_gbp
      FROM master.purchase_orders p
      JOIN master.po_lines pl USING (po_id)
      JOIN master.products pr ON pr.sku = pl.sku
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
      WHERE p.status IN ('open', 'confirmed', 'shipped')
        AND ($country_of_origin IS NULL OR pr.country_of_origin = $country_of_origin)
      GROUP BY p.po_id, p.supplier_id, s.name, pr.country_of_origin, p.order_date, p.due_date, p.status
      ORDER BY p.due_date ASC
    limit: 50
    example: {}

  - name: list_open_orders_for_lines
    desc: Open order lines with status and delivery dates. For line-level order tracking.
    kind: sql
    args: {style_id: {}}
    sql: |
      SELECT p.po_id, pl.line_no, pl.sku, pr.name AS product_name, pr.style_id,
             pl.qty_ordered, pl.qty_received, round(pl.unit_cost, 2) AS unit_cost_gbp,
             p.supplier_id, p.factory_id, p.order_date, p.due_date, p.status
      FROM master.po_lines pl
      JOIN master.purchase_orders p ON p.po_id = pl.po_id
      LEFT JOIN master.products pr ON pr.sku = pl.sku
      WHERE p.status IN ('open', 'confirmed', 'shipped')
        AND ($style_id IS NULL OR pr.style_id = $style_id)
      ORDER BY p.due_date ASC
    limit: 100
    example: {}

  - name: list_open_orders_using_component
    desc: Open orders using a component/SKU. Shows all POs containing this item.
    kind: sql
    args: {sku: {required: true}}
    sql: |
      SELECT p.po_id, p.supplier_id, s.name AS supplier_name, p.factory_id,
             pl.line_no, pl.qty_ordered, pl.qty_received, round(pl.unit_cost, 2) AS unit_cost_gbp,
             p.order_date, p.due_date, p.status
      FROM master.po_lines pl
      JOIN master.purchase_orders p ON p.po_id = pl.po_id
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
      WHERE pl.sku = $sku AND p.status IN ('open', 'confirmed', 'shipped')
      ORDER BY p.due_date ASC
    limit: 50
    example: {sku: "SKU-101442"}

  - name: list_open_purchase_orders_with_delay
    desc: Open POs running late. Shows delays from promised to confirmed ship dates.
    kind: sql
    args: {}
    sql: |
      SELECT p.po_id, p.supplier_id, s.name AS supplier_name, p.order_date, p.ship_date,
             p.due_date, CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE) AS confirmed_delivery,
             DATEDIFF('day', CAST(p.due_date AS DATE), $as_of) AS days_overdue,
             p.total_units, round(p.total_value, 2) AS order_value_gbp, p.status
      FROM master.purchase_orders p
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
      LEFT JOIN supplier_confirmations sc ON sc.po_id = p.po_id AND sc.status = 'received'
      WHERE p.status IN ('open', 'confirmed', 'shipped')
        AND CAST(p.due_date AS DATE) < CAST($as_of AS DATE)
      ORDER BY p.due_date ASC
    limit: 50
    example: {}

  - name: list_purchase_orders_blocked_by_onboarding
    desc: POs blocked by onboarding. Shows orders held up by supplier qualification.
    kind: sql
    args: {}
    sql: |
      SELECT b.po_id, b.block_id, b.block_type, b.block_reason, p.supplier_id, s.name AS supplier_name,
             p.order_date, p.due_date, b.blocked_at, b.status
      FROM po_blocks b
      JOIN master.purchase_orders p ON p.po_id = b.po_id
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
      WHERE b.status = 'active'
        AND (b.block_reason ILIKE '%onboard%' OR b.block_type IN ('supplier', 'other'))
      ORDER BY b.blocked_at DESC
    limit: 50
    example: {}
