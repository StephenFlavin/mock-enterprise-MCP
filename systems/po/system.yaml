             round(sum(p.total_value), 2) AS total_exposure_gbp,
             round(avg(p.total_value), 2) AS avg_order_value_gbp,
             min(p.due_date) AS earliest_due_date,
             max(p.due_date) AS latest_due_date
      FROM master.purchase_orders p
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
