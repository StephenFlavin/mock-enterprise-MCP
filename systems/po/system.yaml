  - name: get_supplier_on_time_delivery_history
    desc: Supplier delivery punctuality history. Shows which orders were delivered on or late.
    kind: sql
    args: {supplier_id: {required: true}}
    sql: |
      SELECT p.po_id, p.supplier_id, s.name AS supplier_name, p.order_date, p.due_date,
             CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE) AS actual_delivery,
             CASE WHEN CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE) <= CAST(p.due_date AS DATE) THEN 'On Time'
                  ELSE 'Late' END AS performance,
             DATEDIFF('day', CAST(p.due_date AS DATE), CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE)) AS days_late,
             p.status
      FROM master.purchase_orders p
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
      LEFT JOIN supplier_confirmations sc ON sc.po_id = p.po_id AND sc.status = 'received'
      WHERE p.supplier_id = $supplier_id AND p.status IN ('received', 'closed', 'shipped')
      ORDER BY p.order_date DESC
