  - name: get_purchase_order_history_for_supplier
    desc: Supplier order history with confirmed vs actual ship dates, missed-ship flag and delivery delay, newest first.
    kind: sql
    args:
      supplier_id: {required: true}
      date_from: {type: date, default: "-365d", desc: "Orders placed on or after this date"}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , x AS (
        SELECT dl.po_id, dl.factory_id, dl.order_date, dl.confirmed_ship_date, dl.actual_ship_date,
               CASE WHEN dl.actual_ship_date IS NOT NULL THEN datediff('day', dl.confirmed_ship_date, dl.actual_ship_date) END AS ship_days_late,
               dl.due_date, dl.confirmed_delivery_date, dl.received_date, dl.delay_days AS delivery_days_late, dl.status,
               round(dl.total_value, 2) AS order_value, dl.currency
        FROM dl
        WHERE dl.supplier_id = $supplier_id AND dl.order_date >= CAST($date_from AS DATE)
          AND dl.status IN ('open','confirmed','shipped','received','closed')
          AND (dl.actual_ship_date IS NOT NULL OR dl.confirmed_ship_date < CAST($as_of AS DATE) - INTERVAL 2 DAY)),
      y AS (SELECT x.*, row_number() OVER (ORDER BY order_date DESC, po_id) AS rn,
                   CASE WHEN COALESCE(ship_days_late, datediff('day', confirmed_ship_date, CAST($as_of AS DATE))) > 2 THEN 'Yes' ELSE 'No' END AS missed_ship_date
            FROM x)
      SELECT y.* EXCLUDE (rn),
             count(*) FILTER (WHERE rn <= 10 AND missed_ship_date = 'Yes') OVER () AS missed_ship_dates_in_last_10_orders
      FROM y ORDER BY order_date DESC, po_id
    limit: 50
    example: {supplier_id: "SUP-0070"}

  - name: get_service_level_by_supplier
    desc: Supplier-level service summary - on-time %, in-full % and OTIF % over a period. Per-order detail is in get_supplier_on_time_in_full.
    kind: sql
    args:
      supplier_id: {required: true}
      date_from: {type: date, default: "-365d", desc: "Orders due on or after this date"}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , ln AS (SELECT po_id, sum(qty_ordered) AS ordered, sum(qty_received) AS received FROM master.po_lines GROUP BY po_id),
        x AS (SELECT dl.*, (dl.received_date IS NOT NULL AND dl.delay_days = 0) AS on_time,
                     (dl.received_date IS NOT NULL AND ln.received >= ln.ordered) AS in_full
              FROM dl JOIN ln ON ln.po_id = dl.po_id
              WHERE dl.supplier_id = $supplier_id AND dl.due_date >= CAST($date_from AS DATE)
                AND (dl.status IN ('received','closed') OR dl.days_overdue IS NOT NULL))
      SELECT x.supplier_id, s.name AS supplier_name, count(*) AS orders_measured,
             count(*) FILTER (WHERE on_time) AS on_time_orders, round(100.0 * count(*) FILTER (WHERE on_time) / count(*), 1) AS on_time_pct,
             count(*) FILTER (WHERE in_full) AS in_full_orders, round(100.0 * count(*) FILTER (WHERE in_full) / count(*), 1) AS in_full_pct,
             count(*) FILTER (WHERE on_time AND in_full) AS otif_orders,
             round(100.0 * count(*) FILTER (WHERE on_time AND in_full) / count(*), 1) AS otif_pct,
             round(avg(x.delay_days), 1) AS avg_days_late, count(*) FILTER (WHERE x.days_overdue IS NOT NULL) AS orders_overdue_now
      FROM x LEFT JOIN master.suppliers s ON s.supplier_id = x.supplier_id
      GROUP BY x.supplier_id, s.name
    example: {supplier_id: "SUP-0068"}

