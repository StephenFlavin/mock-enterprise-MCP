  - name: get_supplier_on_time_in_full
    desc: Supplier on time in full. Shows OTIF and fill rate by order.
    kind: sql
    args: {supplier_id: {required: true}}
    sql: |
      SELECT p.po_id, p.supplier_id, s.name AS supplier_name, p.order_date, p.due_date,
             sum(pl.qty_ordered) AS qty_ordered, sum(pl.qty_received) AS qty_received,
             CASE WHEN sum(pl.qty_received) >= sum(pl.qty_ordered) THEN 'Full'
                  WHEN sum(pl.qty_received) > 0 THEN 'Partial'
                  ELSE 'Empty' END AS fill_status,
             CASE WHEN CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE) <= CAST(p.due_date AS DATE) THEN 'On Time'
                  ELSE 'Late' END AS on_time_status,
             CASE WHEN CAST(COALESCE(sc.confirmed_delivery_date, p.due_date) AS DATE) <= CAST(p.due_date AS DATE) AND
                       sum(pl.qty_received) >= sum(pl.qty_ordered) THEN 'OTIF' ELSE 'Not OTIF' END AS otif_result
      FROM master.purchase_orders p
      LEFT JOIN master.po_lines pl ON pl.po_id = p.po_id
      LEFT JOIN master.suppliers s ON s.supplier_id = p.supplier_id
      LEFT JOIN supplier_confirmations sc ON sc.po_id = p.po_id AND sc.status = 'received'
      WHERE p.supplier_id = $supplier_id AND p.status IN ('received', 'closed', 'shipped')
      GROUP BY p.po_id, p.supplier_id, s.name, p.order_date, p.due_date, sc.confirmed_delivery_date, p.due_date
      ORDER BY p.order_date DESC
    limit: 50
    example: {supplier_id: "SUP-0068"}

  - name: get_supplier_open_order_exposure
