        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , v AS (SELECT po_id, sum((qty_ordered - qty_received) * pr.unit_cost_gbp) AS landed
              FROM master.po_lines l JOIN master.products pr ON pr.sku = l.sku GROUP BY po_id)
      SELECT dl.supplier_id, s.name AS supplier_name, count(*) AS open_order_count, sum(dl.total_units) AS total_units_committed,
             round(sum(dl.total_value), 2) AS total_exposure, dl.currency, round(sum(v.landed), 2) AS landed_exposure_gbp,
             round(avg(dl.total_value), 2) AS avg_order_value, count(*) FILTER (WHERE dl.days_overdue IS NOT NULL) AS overdue_orders,
             count(*) FILTER (WHERE dl.due_date BETWEEN CAST($as_of AS DATE) AND CAST($as_of AS DATE) + INTERVAL 30 DAY) AS due_next_30_days,
             min(dl.due_date) AS earliest_due_date, max(dl.due_date) AS latest_due_date
      FROM dl LEFT JOIN master.suppliers s ON s.supplier_id = dl.supplier_id LEFT JOIN v ON v.po_id = dl.po_id
      WHERE dl.supplier_id = $supplier_id AND dl.status IN ('open','confirmed','shipped')
      GROUP BY dl.supplier_id, s.name, dl.currency
    example: {supplier_id: "SUP-0068"}

  - name: get_supplier_supplied_items
    desc: Items supplied by a supplier with category, lead time, MOQ and units currently on open orders.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      WITH o AS (SELECT l.sku, sum(l.qty_ordered - l.qty_received) AS open_units FROM master.po_lines l
                 JOIN master.purchase_orders p ON p.po_id = l.po_id WHERE p.status IN ('open','confirmed','shipped') GROUP BY l.sku)
      SELECT pr.sku, pr.style_id, pr.name, pr.category, pr.subcategory, pr.supplier_id, pr.lead_time_days, pr.moq, pr.status,
             COALESCE(o.open_units, 0) AS units_on_open_orders
      FROM master.products pr LEFT JOIN o ON o.sku = pr.sku
      WHERE pr.supplier_id = $supplier_id AND pr.status IN ('active','new')
      ORDER BY pr.category, pr.sku
    limit: 100
    example: {supplier_id: "SUP-0068"}

  - name: get_order_change_history_for_supplier
    desc: Order amendments for a supplier by date and reason, with who requested them and how long before ship date.
    kind: sql
    args:
      supplier_id: {required: true}
      date_from: {type: date, default: "-540d", desc: "Amendments requested on or after this date"}
    sql: |
      SELECT pa.amendment_id, pa.po_id, pa.line_no, pa.amendment_type, pa.old_value, pa.new_value, pa.reason, pa.requested_by, pa.requested_at,
             datediff('day', CAST(pa.requested_at AS DATE), p.ship_date) AS days_before_ship_date, pa.status, pa.cost_impact_gbp
      FROM po_amendments pa JOIN master.purchase_orders p ON p.po_id = pa.po_id
      WHERE p.supplier_id = $supplier_id AND CAST(pa.requested_at AS DATE) >= CAST($date_from AS DATE)
      ORDER BY pa.requested_at DESC
    limit: 100
    example: {supplier_id: "SUP-0053"}

  - name: get_retrospective_price_adjustments
    desc: Supplier price amendments, flagging those requested after the goods shipped (retrospective), with old and new price.
    kind: sql
    args:
      supplier_id: {}
      date_from: {type: date, default: "-730d", desc: "Amendments requested on or after this date"}
    sql: |
      SELECT pa.amendment_id, pa.po_id, p.supplier_id, p.status AS po_status, p.ship_date, pa.old_value AS old_po_value, pa.new_value AS new_po_value,
             pa.reason, pa.requested_at, pa.status, pa.cost_impact_gbp,
             round(100.0 * (TRY_CAST(pa.new_value AS DOUBLE) / NULLIF(TRY_CAST(pa.old_value AS DOUBLE), 0) - 1), 2) AS adjustment_pct,
             CASE WHEN CAST(pa.requested_at AS DATE) > p.ship_date THEN 'Yes' ELSE 'No' END AS retrospective
      FROM po_amendments pa JOIN master.purchase_orders p ON p.po_id = pa.po_id
      WHERE pa.amendment_type = 'price' AND ($supplier_id IS NULL OR p.supplier_id = $supplier_id)
        AND CAST(pa.requested_at AS DATE) >= CAST($date_from AS DATE)
      ORDER BY pa.requested_at DESC
    limit: 50
    example: {}

  # ---------------- prices
  - name: get_actual_price_paid_trend_by_item
    desc: Actual unit price paid per order for a SKU over time, with quoted price and change from the first order.
    kind: sql
    args:
      sku: {required: true}
      date_from: {type: date, default: "-730d", desc: "Orders placed on or after this date"}
    sql: |
      SELECT ph.sku, ph.occurrence, ph.order_date, ph.po_id, ph.supplier_id, s.name AS supplier_name, ph.currency,
             round(ph.quoted_unit_cost, 2) AS quoted_unit_cost, round(ph.actual_unit_cost, 2) AS actual_unit_cost, round(ph.variance_pct, 1) AS variance_pct,
             round(100.0 * (ph.actual_unit_cost / first_value(ph.actual_unit_cost) OVER (ORDER BY ph.order_date, ph.po_id) - 1), 1) AS change_from_first_pct,
             ph.qty_ordered
      FROM po_price_history ph LEFT JOIN master.suppliers s ON s.supplier_id = ph.supplier_id
      WHERE ph.sku = $sku AND ph.order_date >= CAST($date_from AS DATE)
      ORDER BY ph.order_date, ph.po_id
    limit: 50
    example: {sku: "SKU-100238"}

  - name: get_historical_unit_price_for_product
    desc: Historical unit prices paid for a SKU from past orders - lowest, highest, average, first, latest and trend.
    kind: sql
    args:
      sku: {required: true}
      date_from: {type: date, default: "-730d", desc: "Orders placed on or after this date"}
    sql: |
      SELECT ph.sku, ph.currency, round(min(ph.actual_unit_cost), 2) AS min_unit_cost, round(max(ph.actual_unit_cost), 2) AS max_unit_cost,
             round(avg(ph.actual_unit_cost), 2) AS avg_unit_cost, count(DISTINCT ph.po_id) AS order_count,
             round(arg_min(ph.actual_unit_cost, ph.order_date), 2) AS first_unit_cost, round(arg_max(ph.actual_unit_cost, ph.order_date), 2) AS latest_unit_cost,
             round(100.0 * (arg_max(ph.actual_unit_cost, ph.order_date) / arg_min(ph.actual_unit_cost, ph.order_date) - 1), 1) AS trend_pct,
             sum(ph.qty_received) AS total_units_received
      FROM po_price_history ph
      WHERE ph.sku = $sku AND ph.order_date >= CAST($date_from AS DATE)
      GROUP BY ph.sku, ph.currency
    example: {sku: "SKU-100238"}

  - name: get_purchase_price_variance_by_item
    desc: Purchase price variance (invoiced vs PO price) by item for a SKU or category, largest cost impact first.
    kind: sql
    args:
      sku: {}
      category: {desc: "Product category, e.g. Small Appliances"}
      supplier_id: {}
      date_from: {type: date, default: "-365d", desc: "Orders placed on or after this date"}
    sql: |
      SELECT ph.sku, pr.name AS product_name, pr.category, pr.supplier_id, count(*) AS orders, round(avg(ph.quoted_unit_cost), 2) AS avg_quoted_unit_cost,
             round(avg(ph.actual_unit_cost), 2) AS avg_actual_unit_cost, min(ph.currency) AS currency,
             round(100.0 * (sum(ph.actual_unit_cost * ph.qty_ordered) / sum(ph.quoted_unit_cost * ph.qty_ordered) - 1), 2) AS variance_pct,
             round(sum((ph.actual_unit_cost / ph.quoted_unit_cost - 1) * ph.qty_ordered * pr.unit_cost_gbp), 0) AS approx_variance_gbp
      FROM po_price_history ph JOIN master.products pr ON pr.sku = ph.sku
      WHERE ($sku IS NULL OR ph.sku = $sku) AND ($category IS NULL OR pr.category = $category) AND ($supplier_id IS NULL OR pr.supplier_id = $supplier_id)
        AND ph.order_date >= CAST($date_from AS DATE)
      GROUP BY ph.sku, pr.name, pr.category, pr.supplier_id
      ORDER BY approx_variance_gbp DESC
    limit: 30
    example: {category: "Small Appliances"}

  - name: get_supplier_price_changes
    desc: Supplier price changes by SKU (first to latest invoiced price in the period), biggest-increase suppliers first.
    kind: sql
    args:
      supplier_id: {}
      date_from: {type: date, default: "-365d", desc: "Orders placed on or after this date"}
    sql: |
      WITH x AS (
        SELECT ph.supplier_id, ph.sku, ph.currency, count(*) AS orders, round(arg_min(ph.actual_unit_cost, ph.order_date), 2) AS first_unit_cost,
               round(arg_max(ph.actual_unit_cost, ph.order_date), 2) AS latest_unit_cost,
               100.0 * (arg_max(ph.actual_unit_cost, ph.order_date) / arg_min(ph.actual_unit_cost, ph.order_date) - 1) AS change_pct
        FROM po_price_history ph
        WHERE ($supplier_id IS NULL OR ph.supplier_id = $supplier_id) AND ph.order_date >= CAST($date_from AS DATE)
        GROUP BY ph.supplier_id, ph.sku, ph.currency HAVING count(*) >= 2)
      SELECT x.supplier_id, s.name AS supplier_name, x.sku, x.currency, x.orders, x.first_unit_cost, x.latest_unit_cost, round(x.change_pct, 1) AS change_pct,
             round(avg(x.change_pct) OVER (PARTITION BY x.supplier_id), 1) AS supplier_avg_change_pct
      FROM x LEFT JOIN master.suppliers s ON s.supplier_id = x.supplier_id
      ORDER BY supplier_avg_change_pct DESC, x.supplier_id, x.change_pct DESC
    limit: 100
    example: {}

  # ---------------- planning and volumes
  - name: get_minimum_order_quantities_for_category
    desc: Minimum order quantities for a product category or department, with lead time and typical recent order size.
    kind: sql
    args:
      category: {desc: "Product category, e.g. Bedding"}
      department: {type: str, desc: "Department, e.g. Home"}
    sql: |
      WITH o AS (SELECT l.sku, round(avg(l.qty_ordered), 0) AS avg_order_qty, count(*) AS orders_12m
                 FROM master.po_lines l JOIN master.purchase_orders p ON p.po_id = l.po_id
                 WHERE p.status IN ('open','confirmed','shipped','received','closed') AND p.order_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY GROUP BY l.sku)
      SELECT pr.category, pr.sku, pr.style_id, pr.name, pr.supplier_id, pr.moq AS minimum_order_quantity, pr.lead_time_days,
             o.avg_order_qty, o.orders_12m, round(100.0 * pr.moq / NULLIF(o.avg_order_qty, 0), 0) AS moq_pct_of_avg_order
      FROM master.products pr LEFT JOIN o ON o.sku = pr.sku
      WHERE pr.status = 'active' AND ($category IS NULL OR pr.category = $category) AND ($department IS NULL OR pr.department = $department)
      ORDER BY pr.sku
    limit: 100
    example: {category: "Bedding"}

  - name: get_nearshore_pilot_orders
    desc: Orders placed with nearshore pilot suppliers, with programme, status, due date, delay days and units.
    kind: sql
    args:
      supplier_id: {}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      SELECT m.marker_id, m.po_id, m.supplier_id, s.name AS supplier_name, s.country, m.pilot_program, m.status AS pilot_status, dl.order_date, dl.due_date,
             dl.received_date, dl.delay_days, dl.status AS po_status, dl.total_units, datediff('day', dl.order_date, COALESCE(dl.received_date, dl.due_date)) AS lead_time_days
      FROM nearshore_pilot_markers m JOIN dl ON dl.po_id = m.po_id LEFT JOIN master.suppliers s ON s.supplier_id = m.supplier_id
      WHERE ($supplier_id IS NULL OR m.supplier_id = $supplier_id)
      ORDER BY m.start_date DESC
    limit: 50
    example: {supplier_id: "SUP-0044"}

  - name: get_open_commodity_commitments
    desc: Open commodity purchase commitments (active or partly used, not expired) with remaining volume, price and value.
    kind: sql
    args:
      supplier_id: {}
      commodity: {}
    sql: |
      SELECT c.commitment_id, c.supplier_id, s.name AS supplier_name, c.commodity, c.start_date, c.end_date, c.volume_units, c.volume_uom,
             c.price_gbp_per_unit, c.used_to_date, c.remaining_volume, round(c.remaining_volume * c.price_gbp_per_unit, 0) AS remaining_value_gbp, c.status
      FROM commodity_commitments c LEFT JOIN master.suppliers s ON s.supplier_id = c.supplier_id
      WHERE c.status IN ('active','partially_used') AND c.end_date >= CAST($as_of AS DATE)
        AND ($supplier_id IS NULL OR c.supplier_id = $supplier_id) AND ($commodity IS NULL OR c.commodity = $commodity)
      ORDER BY c.end_date
    limit: 50
    example: {}

  - name: get_production_volumes_by_origin
    desc: Production volume by country of origin from open orders not yet shipped, with units, landed GBP value and share.
    kind: sql
    args:
      category: {desc: "Product category, e.g. Trousers"}
    sql: |
      SELECT pr.country_of_origin, count(DISTINCT p.po_id) AS po_count, sum(pl.qty_ordered) AS total_qty_ordered,
             round(sum(pl.qty_ordered * pr.unit_cost_gbp), 0) AS landed_value_gbp,
             round(100.0 * sum(pl.qty_ordered) / sum(sum(pl.qty_ordered)) OVER (), 1) AS share_of_units_pct
      FROM master.purchase_orders p JOIN master.po_lines pl ON pl.po_id = p.po_id JOIN master.products pr ON pr.sku = pl.sku
      WHERE p.status IN ('open','confirmed') AND ($category IS NULL OR pr.category = $category)
      GROUP BY pr.country_of_origin ORDER BY total_qty_ordered DESC
    limit: 50
    example: {}

  - name: get_volume_by_origin_region
    desc: Purchase volume by origin region and country over a period, with units, landed GBP value and share of total.
    kind: sql
    args:
      category: {desc: "Product category, e.g. Trousers"}
      date_from: {type: date, default: "-365d", desc: "Orders placed on or after this date"}
    sql: |
      SELECT CASE WHEN pr.country_of_origin = 'CN' THEN 'East Asia' WHEN pr.country_of_origin = 'VN' THEN 'South-East Asia'
                  WHEN pr.country_of_origin IN ('BD','IN') THEN 'South Asia' WHEN pr.country_of_origin = 'MX' THEN 'Americas' ELSE 'Europe' END AS region,
             pr.country_of_origin, count(DISTINCT p.po_id) AS po_count, sum(pl.qty_ordered) AS total_qty_ordered,
             round(sum(pl.qty_ordered * pr.unit_cost_gbp), 0) AS landed_value_gbp,
             round(100.0 * sum(pl.qty_ordered * pr.unit_cost_gbp) / sum(sum(pl.qty_ordered * pr.unit_cost_gbp)) OVER (), 1) AS share_of_value_pct
      FROM master.purchase_orders p JOIN master.po_lines pl ON pl.po_id = p.po_id JOIN master.products pr ON pr.sku = pl.sku
      WHERE p.status IN ('open','confirmed','shipped','received','closed') AND p.order_date >= CAST($date_from AS DATE)
        AND ($category IS NULL OR pr.category = $category)
      GROUP BY ALL ORDER BY landed_value_gbp DESC
    limit: 50
    example: {}

  - name: list_off_contract_purchase_orders
    desc: Recent POs placed off contract (non-preferred supplier tier, or air-freight expedite), newest first, with reason and total count.
    kind: sql
    args:
      supplier_id: {}
      date_from: {type: date, default: "-180d", desc: "Orders placed on or after this date"}
    sql: |
      WITH x AS (
        SELECT p.po_id, p.supplier_id, s.name AS supplier_name, s.tier, p.order_date, p.due_date, p.status, p.mode, p.total_units,
               round(p.total_value, 2) AS total_value, p.currency,
               CASE WHEN s.tier IN ('approved','probation') AND p.mode = 'air' THEN 'Non-preferred supplier and air-freight expedite'
                    WHEN s.tier IN ('approved','probation') THEN 'Non-preferred supplier (' || s.tier || ' tier)'
                    ELSE 'Air-freight expedite override' END AS off_contract_reason
        FROM master.purchase_orders p JOIN master.suppliers s ON s.supplier_id = p.supplier_id
        WHERE p.status IN ('open','confirmed','shipped','received','closed') AND p.order_date >= CAST($date_from AS DATE)
          AND ($supplier_id IS NULL OR p.supplier_id = $supplier_id)
          AND (s.tier IN ('approved','probation') OR p.mode = 'air'))
      SELECT x.*, count(*) OVER () AS total_off_contract_pos
      FROM x ORDER BY order_date DESC, po_id DESC
    limit: 50
    example: {}

  - name: list_purchase_orders_blocked_by_onboarding
    desc: POs held up by supplier onboarding (supplier still onboarding or blocked, or an onboarding hold), with hold reason, hold start and days on hold, longest-held first.
    kind: sql
    args: {}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      SELECT x.*, datediff('day', CAST(x.hold_since AS DATE), CAST($as_of AS DATE)) AS days_on_hold
      FROM (
        SELECT dl.po_id, dl.supplier_id, s.name AS supplier_name, s.status AS supplier_status, dl.status AS po_status, dl.order_date, dl.due_date,
               dl.total_units, greatest(datediff('day', dl.order_date, CAST($as_of AS DATE)), 0) AS days_since_order,
               (SELECT string_agg(DISTINCT b.block_reason, '; ') FROM po_blocks b WHERE b.status = 'active'
                  AND (b.po_id = dl.po_id OR (b.po_id IS NULL AND b.supplier_id = dl.supplier_id))) AS hold_reason,
               (SELECT min(b.blocked_at) FROM po_blocks b WHERE b.status = 'active'
                  AND (b.po_id = dl.po_id OR (b.po_id IS NULL AND b.supplier_id = dl.supplier_id))) AS hold_since
        FROM dl JOIN master.suppliers s ON s.supplier_id = dl.supplier_id
        WHERE dl.status IN ('draft','open','confirmed')
          AND (s.status IN ('onboarding','blocked') OR EXISTS (SELECT 1 FROM po_blocks b WHERE b.status = 'active' AND b.block_reason ILIKE '%onboard%'
                AND (b.po_id = dl.po_id OR (b.po_id IS NULL AND b.supplier_id = dl.supplier_id))))
      ) x
      ORDER BY x.hold_since NULLS LAST, x.order_date
    limit: 50
    example: {}

  - name: calculate_expedite_cost_options
    desc: Extra cost of expedite, split-air or full-air options for a late order, with cost per unit and days saved.
    kind: sql
    args:
      po_id: {required: true}
    sql: |
      WITH rc AS (
        SELECT po_id,
               max_by(confirmed_delivery_date, received_at) FILTER (WHERE confirmed_delivery_date IS NOT NULL) AS conf_delivery,
               max_by(confirmed_ship_date, received_at) FILTER (WHERE confirmed_ship_date IS NOT NULL) AS conf_ship
        FROM supplier_confirmations WHERE status = 'received' GROUP BY po_id
      ), d0 AS (
        SELECT p.po_id, p.supplier_id, p.factory_id, p.dest_site_id, p.order_date, p.ship_date, p.due_date, p.status, p.mode,
               p.total_units, p.total_value, p.currency,
               COALESCE(rc.conf_ship, p.ship_date) AS confirmed_ship_date,
               COALESCE(rc.conf_delivery, p.due_date) AS confirmed_delivery_date,
               sh.atd AS actual_ship_date,
               CASE WHEN p.status IN ('received','closed') THEN COALESCE(sh.ata, p.due_date) END AS received_date,
               CASE WHEN p.status IN ('open','confirmed','shipped') AND p.due_date < CAST($as_of AS DATE)
                    THEN datediff('day', p.due_date, CAST($as_of AS DATE)) END AS days_overdue
        FROM master.purchase_orders p
        LEFT JOIN rc ON rc.po_id = p.po_id
        LEFT JOIN master.shipments sh ON sh.po_id = p.po_id
      ), dl AS (
        SELECT d0.*,
               CASE WHEN status IN ('received','closed') THEN greatest(datediff('day', due_date, received_date), 0)
                    WHEN status IN ('open','confirmed','shipped')
                    THEN greatest(datediff('day', due_date, confirmed_delivery_date), COALESCE(days_overdue, 0), 0) END AS delay_days
        FROM d0
      )
      , w AS (SELECT l.po_id, sum(l.qty_ordered - l.qty_received) AS units, sum((l.qty_ordered - l.qty_received) * pr.weight_kg) AS kg,
                     sum((l.qty_ordered - l.qty_received) * pr.unit_cost_gbp) AS value_gbp
              FROM master.po_lines l JOIN master.products pr ON pr.sku = l.sku WHERE l.po_id = $po_id GROUP BY l.po_id),
        o AS (SELECT 'Expedite at factory (premium)' AS option, 0.08 * w.value_gbp AS extra, 5 AS days_saved, 'extra = 8% of landed value' AS formula, w.units, w.po_id FROM w
              UNION ALL SELECT 'Split: half by air', 0.5 * w.kg * 4.5, 12, 'extra = 50% of kg x GBP 4.50 per kg air rate', w.units, w.po_id FROM w
              UNION ALL SELECT 'Full air freight', w.kg * 4.5, 20, 'extra = kg x GBP 4.50 per kg air rate', w.units, w.po_id FROM w)
      SELECT dl.po_id, dl.supplier_id, dl.mode AS current_mode, dl.status, dl.due_date, dl.days_overdue, o.units AS units_outstanding, o.option,
             round(o.extra, 0) AS extra_cost_gbp, round(o.extra / NULLIF(o.units, 0), 2) AS extra_cost_per_unit_gbp, o.days_saved, o.formula
      FROM dl JOIN o ON o.po_id = dl.po_id WHERE dl.po_id = $po_id ORDER BY o.extra
