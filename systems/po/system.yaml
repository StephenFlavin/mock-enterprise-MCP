      status: {type: enum, values: [draft, open, confirmed, shipped, received, closed, cancelled], desc: "PO status"}
      dest_site_id: {}
      due_date: {type: date, desc: "Orders due on exactly this date"}
      due_from: {type: date, desc: "Orders due on or after this date"}
      due_to: {type: date, desc: "Orders due on or before this date"}
    sql: |
      SELECT p.po_id, p.supplier_id, p.dest_site_id, p.status, p.order_date, p.ship_date, p.due_date, p.total_units,
             round(p.total_value, 2) AS total_value, p.currency
      FROM master.purchase_orders p
      WHERE ($supplier_id IS NULL OR p.supplier_id = $supplier_id) AND ($status IS NULL OR p.status = $status)
