- question: "01:4:Q4"
  story: "Inventory manager compares goods receipts to ASN data from the last 8 weeks. Variance data shows SUP-0012 and SUP-0001 with material shortages; VAR-900001 is a short-ship of 50 units on SKU-100007 (£1,250 value) still within claim window; VAR-900003 shows damage (150 units, £1,800 value) on SKU-101904. Two claims are raised and a variance note is drafted to SUP-0012."
  checks:
    - tool: draft_supplier_variance_note
      args: {supplier_id: "SUP-0012", lookback_days: 56}
      expect: ["SUP-0012", "short-ship"]
    - tool: create_supplier_claim
      args: {po_id: "PO-2026-004003", supplier_id: "SUP-0012", claim_type: "short_ship", claim_amount_gbp: 1250, notes: "Short 50 units"}
      expect: ["CLM-"]
    - tool: send_supplier_variance_note
      args: {supplier_id: "SUP-0012", title: "Variance summary", content: "Short-shipping observed on recent orders"}
      expect: ["COM-"]
    - tool: get_supplier_available_stock
      args: {supplier_id: "SUP-0013"}
      expect: ["5000"]

