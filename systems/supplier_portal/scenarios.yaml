- question: "01:4:Q4"
  story: "Inventory manager compares goods receipts to ASN data from the last 8 weeks. Variance data shows SUP-0012 and SUP-0001 with material shortages; VAR-900001 is a short-ship of 50 units on SKU-100007 (£1,250 value) still within claim window; VAR-900003 shows damage (150 units, £1,800 value) on SKU-101904. Two claims are raised and a variance note is drafted to SUP-0012."
  checks:
    - tool: draft_supplier_variance_note
      args: {supplier_id: "SUP-0012", lookback_days: 56}
      expect: ["SUP-0012", "short-ship"]
    - tool: create_supplier_claim
      args: {po_id: "PO-2026-004003", supplier_id: "SUP-0012", claim_type: "short_ship", claim_amount_gbp: 1250, notes: "Short 50 units"}
      expect: ["CLM-"]
    - tool: get_supplier_available_stock
      args: {supplier_id: "SUP-0013"}
      expect: ["5000"]

- question: "01:10:Q2"
  story: "Automation engineer checks lead times for motor parts. Requests lead time data for part PF-220 from SUP-0013 (21 days, MOQ 500, £12.50/unit). This is needed for shutdown planning."
  checks:
    - tool: get_part_lead_time
      args: {supplier_id: "SUP-0013", sku: "PF-220"}
      expect: ["21", "500"]

- question: "02:13:Q4"
  story: "Air freight coordinator estimates budget based on current supplier delays. Multiple suppliers have active delays: SUP-0013 delayed 7 days on PF-220, SUP-0013 delayed 13 days on K-1700. Expected air freight requirement calculated from these delays."
  checks:
    - tool: get_supplier_delay_notices
      args: {status: "active"}
      expect: ["active", "7"]
    - tool: calculate_expected_air_requirement
      args: {}
      expect: ["delayed_orders"]

- question: "03:22:Q2"
  story: "Stock planner returns from leave and needs to identify critical stock shortages. SUP-0013 has PF-220 in stock (5,000 units) with 15,000 available capacity and 21-day lead time. SUP-0013 has K-1700 with 8,000 stock units and 12,000 available capacity."
  checks:
    - tool: get_supplier_available_stock
      args: {supplier_id: "SUP-0013"}
      expect: ["5000"]
    - tool: get_supplier_available_capacity
      args: {supplier_id: "SUP-0013"}
      expect: ["15000"]

- question: "03:24:Q1"
  story: "Supply planner reviews SUP-0001 supplier performance. Capacity report shows SUP-0001 has committed 22,000 units of capacity (73% utilised) on SKU-101904 with 14-day lead time and 200-unit MOQ. Multiple delays documented."
  checks:
    - tool: get_supplier_capacity_report
      args: {supplier_id: "SUP-0001"}
      expect: ["SKU-101904", "30000"]

- question: "03:24:Q2"
  story: "Supply planner faces 25,000-unit gap in week 44. Checks SUP-0001 capacity: 8,000 available units out of 30,000 total, 14-day lead time. Explores capacity commitments."
  checks:
    - tool: get_supplier_available_capacity
      args: {supplier_id: "SUP-0001", sku: "SKU-101904", from_date: "-0d", to_date: "+90d"}
      expect: ["8000"]
    - tool: get_supplier_capacity_commitments
      args: {supplier_id: "SUP-0001"}
      expect: ["SKU-101904"]

- question: "03:24:Q3"
  story: "Supply planner checks for component shortage alerts on zips and trims. Finds active supplier delay notices: DLY-900001 (PF-220, 7-day delay), DLY-900002 (K-1700, 13-day delay), DLY-900003 (SKU-100651, 7-day delay)."
  checks:
    - tool: get_supplier_delay_notices
      args: {status: "active"}
      expect: ["DLY-", "7", "13"]

- question: "04:33:Q1"
  story: "Sourcing manager investigates why Factory FAC-0107 is late on orders. Production report for FAC-0107 shows: utilisation at 85-92%, material inbound status delayed (cotton delayed by 3 days). Factory has 6-8 orders in progress."
  checks:
    - tool: get_factory_production_reports
      args: {factory_id: "FAC-0107", lookback_days: 30}
      expect: ["FAC-0107"]
    - tool: get_factory_material_inbound_status
      args: {factory_id: "FAC-0107"}
      expect: ["delayed"]

- question: "04:33:Q3"
  story: "Sourcing manager compares MOQ and lead times to support sourcing strategy. Factory FAC-0107 MOQ is 1,000 units with 35-day lead time for MOQ quantities. This affects order consolidation decisions."
  checks:
    - tool: get_factory_moq_terms
      args: {factory_id: "FAC-0107"}
      expect: ["1000", "35"]

- question: "04:33:Q4"
  story: "Sourcing manager checks capacity utilisation trends to identify overbooking. FAC-0107 shows utilisation at 85% and 92% over recent weeks. Year-on-year comparison shows capacity trends."
  checks:
    - tool: get_factory_capacity_utilisation
      args: {factory_id: "FAC-0107", lookback_months: 3}
      expect: ["FAC-0107"]
    - tool: compare_capacity_utilisation_year_on_year
      args: {factory_id: "FAC-0107"}
      expect: ["FAC-0107"]
    - tool: get_order_readiness_status
      args: {factory_id: "FAC-0107"}
      expect: ["FAC-0107"]

- question: "04:35:Q5"
  story: "SRM prepares Q3 business review pack for Supplier SUP-0001. Forecast accuracy shared with supplier is tracked in supply position data showing MOQ 200, lead time 14 days, capacity 30,000 units."
  checks:
    - tool: get_forecast_accuracy_shared_with_supplier
      args: {supplier_id: "SUP-0001", lookback_months: 6}
      expect: ["30000", "200"]

- question: "05:42:Q1"
  story: "QA technologist raises corrective action CAR-900001 against SUP-0001 for seven bulk lots that failed colourfastness testing. Root cause: dye house process drift. Supplier responded with corrective action plan."
  checks:
    - tool: create_supplier_corrective_action_request
      args: {supplier_id: "SUP-0001", sku: "SKU-101904", issue_type: "quality", severity: "high", description: "Colourfastness failure", due_date: "+14d"}
      expect: ["CAR-"]

- question: "05:46:Q7"
  story: "Ethical trade manager explores cotton supply chain traceability. Checks supplier base profile by country to understand which countries supply cotton and other materials. Uses Bangladesh as example."
  checks:
    - tool: get_supplier_base_profile_by_country
      args: {country: "BD", tier: "approved"}
      expect: ["BD", "approved"]

- question: "05:48:Q4"
  story: "ESG reporting analyst identifies suppliers with missing ESG submissions. Multiple suppliers have not submitted data. Draft chasers for SUP-0001 highlighting missing data."
  checks:
    - tool: draft_supplier_chaser_email
      args: {supplier_id: "SUP-0001"}
      expect: ["ESG", "submission"]

- question: "06:51:Q4"
  story: "NPD checks corrective action status on backpack zip failure. CAR-900002 was raised against SUP-0022 for zip pull strength failure. Supplier responded indicating they will revert to approved zip supplier."
  checks:
    - tool: get_supplier_corrective_action_response
      args: {corrective_action_id: "CAR-900002"}
      expect: ["responded"]

- question: "06:52:Q4"
  story: "Product designer needs fabric options for overshirt. Fabric mill lead time and stock: MAT-900001 (organic cotton 200GSM) has 45,000 units in stock, 35-day lead, £8.50/unit. MAT-900002 (recycled polyester) has 38,000 units, 28-day lead, £4.75/unit."
  checks:
    - tool: get_fabric_mill_lead_time_and_stock
      args: {material_id: "MAT-900001"}
      expect: ["200 GSM", "35", "45000"]

- question: "06:53:Q3"
  story: "Technical designer reviews sample comments from supplier. COM-900002 shows SUP-0022 comments on SKU-103164: shoulder seam position too far back. Need to send revised construction comments."
  checks:
    - tool: get_supplier_comments_on_sample
      args: {supplier_id: "SUP-0022", sku: "SKU-103164"}
      expect: ["shoulder"]

- question: "06:60:Q4"
  story: "R&D materials scientist checks if recycled material can scale to 2M metres a year. MAT-900002 (recycled polyester) has 150,000 monthly capacity (1.8M annual), 28-day lead time. Supplier SUP-0078 has capacity to support this volume."
  checks:
    - tool: get_supplier_capacity_for_material
      args: {material_id: "MAT-900002"}
      expect: ["150000", "28"]

- question: "07:63:Q1"
  story: "Supply chain finance analyst decomposes landed cost increase on top SKUs. Tracks supplier price changes and freight costs. Sends price query to SUP-0013 and SUP-0001 about the 7% increase observed."
  checks:
    - tool: get_supplier_available_stock
      args: {supplier_id: "SUP-0013"}
