- question: "01:4:Q4"
  story: "Inventory manager compares goods receipts to ASN data from the last 8 weeks. Variance data shows SUP-0001 and SUP-0003 with material shortages; VAR-900001 is a short-ship of 50 units on PF-220 (£1,250 value) still within claim window; VAR-900003 shows damage (150 units, £1,800 value) on STY-5520. Two claims are raised and a variance note is drafted to SUP-0001."
  checks:
    - tool: draft_supplier_variance_note
      args: {supplier_id: "SUP-0001", lookback_days: 56}
      expect: ["SUP-0001", "short-ship", "PF-220"]
    - tool: create_supplier_claim
      args: {po_id: "PO-2026-004512", supplier_id: "SUP-0001", claim_type: "short_ship", claim_amount_gbp: 1250, notes: "Short 50 units"}
      expect: ["CLM-", "1250"]
    - tool: get_supplier_available_stock
      args: {supplier_id: "SUP-0001", sku: "PF-220"}
      expect: ["5000", "21", "12.50"]

- question: "01:10:Q2"
  story: "Automation engineer checks lead times for motor parts. Requests lead time data for part PF-220 from SUP-0001 (21 days, MOQ 500, £12.50/unit). This is needed for shutdown planning on 19 October."
  checks:
    - tool: get_part_lead_time
      args: {supplier_id: "SUP-0001", sku: "PF-220"}
      expect: ["21", "500", "12.50"]

- question: "02:13:Q4"
  story: "Air freight coordinator estimates budget based on current supplier delays. Multiple suppliers have active delays: SUP-0001 delayed 7 days on PF-220, SUP-0002 delayed 13 days on K-1700. Expected air freight requirement calculated from these delays."
  checks:
    - tool: get_supplier_delay_notices
      args: {status: "active"}
      expect: ["7", "13", "active"]
    - tool: calculate_expected_air_requirement
      args: {}
      expect: ["delayed_orders", "air_freight_risk"]

- question: "03:22:Q2"
  story: "Stock planner returns from leave and needs to identify critical stock shortages. SUP-0001 has PF-220 in stock (5,000 units) with 15,000 available capacity and 21-day lead time. SUP-0002 has K-1700 with 8,000 stock units and 12,000 available capacity."
  checks:
    - tool: get_supplier_available_stock
      args: {supplier_id: "SUP-0001"}
      expect: ["5000", "PF-220"]
    - tool: get_supplier_available_capacity
      args: {supplier_id: "SUP-0001"}
      expect: ["15000", "50000"]

- question: "03:24:Q1"
  story: "Supply planner reviews SUP-0001 supplier performance. Capacity report shows SUP-0001 has committed 35,000 units of capacity (70% utilised) on PF-220 with 21-day lead time and 500-unit MOQ. Multiple delays documented."
  checks:
    - tool: get_supplier_capacity_report
      args: {supplier_id: "SUP-0001"}
      expect: ["PF-220", "35000"]

- question: "03:24:Q2"
  story: "Supply planner faces 25,000-unit gap in week 44 on core denim range. Checks SUP-0001 capacity: 15,000 available units out of 50,000 total, 21-day lead time. Explores capacity options."
  checks:
    - tool: get_supplier_available_capacity
      args: {supplier_id: "SUP-0001", sku: "PF-220", from_date: "2026-10-06", to_date: "2026-12-31"}
      expect: ["15000", "50000"]
    - tool: get_supplier_capacity_commitments
      args: {supplier_id: "SUP-0001"}
      expect: ["PF-220", "35000"]

- question: "03:24:Q3"
  story: "Supply planner checks for component shortage alerts on zips and trims. Finds active supplier delay notices: DLY-900001 (PF-220, 7-day delay), DLY-900002 (K-1700, 13-day delay), DLY-900003 (STY-T-4410, 7-day delay)."
  checks:
    - tool: get_supplier_delay_notices
      args: {status: "active"}
      expect: ["DLY-", "7", "13"]

- question: "04:33:Q1"
  story: "Sourcing manager investigates why Factory FAC-0107 is late on orders. Production report for FAC-0107 shows: week of 2026-10-07 utilisation at 85% (10,625 units produced), material inbound status delayed (cotton delayed by 3 days). Factory has 8-12 orders in progress."
  checks:
    - tool: get_factory_production_reports
      args: {factory_id: "FAC-0107", lookback_days: 30}
      expect: ["11500", "10625"]
    - tool: get_factory_material_inbound_status
      args: {factory_id: "FAC-0107"}
      expect: ["delayed", "cotton", "3 days"]

- question: "04:33:Q3"
  story: "Sourcing manager compares MOQ and lead times to support sourcing strategy. Factory FAC-0107 MOQ is 1,000 units with 35-day lead time for MOQ quantities. This affects order consolidation decisions."
  checks:
    - tool: get_factory_moq_terms
      args: {factory_id: "FAC-0107"}
      expect: ["1000", "35"]

- question: "04:33:Q4"
  story: "Sourcing manager checks capacity utilisation trends to identify overbooking. FAC-0107 shows week of 2026-10-07 at 85% utilisation (10,625 units, 12,500 capacity), up from 92% week prior. Year-on-year comparison shows capacity trends."
  checks:
    - tool: get_factory_capacity_utilisation
      args: {factory_id: "FAC-0107", lookback_months: 3}
      expect: ["85", "92"]
    - tool: compare_capacity_utilisation_year_on_year
      args: {factory_id: "FAC-0107"}
      expect: ["85", "92"]
    - tool: get_order_readiness_status
      args: {factory_id: "FAC-0107"}
      expect: ["6", "10625"]

- question: "04:35:Q5"
  story: "SRM prepares Q3 business review pack for Supplier SUP-0001. Forecast accuracy shared with supplier is tracked in supply position data showing MOQ 500, lead time 21 days, capacity 50,000 units."
  checks:
    - tool: get_forecast_accuracy_shared_with_supplier
      args: {supplier_id: "SUP-0001", lookback_months: 6}
      expect: ["50000", "500"]

- question: "05:42:Q1"
  story: "QA technologist raises corrective action CAR-900001 against SUP-0042 for seven bulk lots that failed colourfastness testing. Root cause: dye house process drift. Supplier responded with corrective action plan on 2026-09-30."
  checks:
    - tool: create_supplier_corrective_action_request
      args: {supplier_id: "SUP-0042", sku: "STY-5520", issue_type: "quality", severity: "high", description: "Colourfastness failure", due_date: "+14d"}
      expect: ["CAR-"]

- question: "05:46:Q7"
  story: "Ethical trade manager explores cotton supply chain traceability. Checks supplier base profile by country to understand which countries supply cotton. Uses SUP-0055 as example with Bangladesh operations."
  checks:
