- question: "06:60:Q4"
  story: "R&D materials scientist checks if recycled material can scale to 2M metres a year. MAT-900002 (recycled polyester) has 150,000 monthly capacity (1.8M annual), 28-day lead time. Supplier SUP-0078 has capacity to support this volume."
