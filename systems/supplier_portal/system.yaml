      title: {required: true}
      content: {required: true}
      deadline: {type: date, desc: "Response deadline (optional)"}
    example: {supplier_id: "SUP-0013", sku: "SKU-101904", title: "Backpack sample - seam comments", content: "Increase seam strength by 20%"}

  - name: send_supplier_chargeback_notice
