id: supplier_portal
name: Supplier Portal
instructions: >
  Supplier relationships, capacities, stock, quality issues, delays and communications.
  Claim ids look like CLM-000123, corrective action ids like CAR-000123. Supports both
  strategic supplier management and tactical operational issues. Use for capacity planning,
  delay management, quality escalations, ESG tracking, and fabric/material sourcing.

tables:
  supplier_variances:
    key: variance_id
    cols:
      variance_id: {type: str, desc: "Variance record, e.g. VAR-000123"}
      po_id: {type: str, desc: Purchase order}
      shipment_id: {type: str, desc: Shipment or ASN reference}
      supplier_id: {type: str, desc: Supplier}
      sku: {type: str, desc: Product}
      asn_quantity: {type: int, desc: Quantity on advance shipping notice}
      receipt_quantity: {type: int, desc: Quantity actually received}
      variance_units: {type: int, desc: "Difference (receipt - ASN)"}
      variance_reason: {type: str, desc: "Why: short-ship, damage, over-ship, system error, unknown"}
      variance_value_gbp: {type: float, desc: Cost impact of variance}
      is_claimable: {type: bool, desc: Whether this variance can be claimed}
      claim_window_days: {type: int, desc: "Days after receipt in which a claim can be raised (contract window)"}
      received_at: {type: date, desc: Receipt date}
      created_at: {type: timestamp, desc: Variance recorded}

  supplier_claims:
    key: claim_id
    cols:
      claim_id: {type: str, desc: "Claim, e.g. CLM-000123"}
      po_id: {type: str, desc: Purchase order}
      supplier_id: {type: str, desc: Supplier}
      variance_id: {type: str, desc: Related variance record}
      claim_type: {type: enum, values: [short_ship, damage, quality, other], desc: Type of claim}
      claim_amount_gbp: {type: float, desc: Claimed amount}
      status: {type: enum, values: [draft, submitted, accepted, rejected, settled], desc: Claim status}
      raised_at: {type: date, desc: Date claim raised}
      submitted_at: {type: date, desc: Date claim submitted to supplier}
      settled_amount_gbp: {type: float, desc: Amount settled if applicable}
      notes: {type: text, desc: Claim notes}
      created_by: {type: str, desc: Employee who raised claim}
      updated_at: {type: timestamp, desc: Last update}

  corrective_actions:
    key: corrective_action_id
    cols:
      corrective_action_id: {type: str, desc: "Corrective action request, e.g. CAR-000123"}
      supplier_id: {type: str, desc: Supplier}
      sku: {type: str, desc: Product affected}
      issue_type: {type: enum, values: [quality, compliance, delivery, other], desc: Issue category}
      severity: {type: enum, values: [high, medium, low], desc: Issue severity}
      description: {type: text, desc: What went wrong}
      root_cause: {type: str, desc: Supplier root cause analysis}
      corrective_actions: {type: text, desc: "Actions requested of the supplier, and what it commits to"}
      response_received: {type: bool, desc: Whether supplier has responded}
      response_date: {type: date, desc: When supplier responded}
      response_text: {type: text, desc: Supplier response}
      status: {type: enum, values: [open, responded, in_progress, closed, escalated], desc: CAR status}
      raised_at: {type: date, desc: Date CAR raised}
      due_date: {type: date, desc: Due date for response}
      closed_at: {type: date, desc: Date CAR closed}
      created_by: {type: str, desc: Employee who raised}
      updated_at: {type: timestamp, desc: Last update}

  supply_position:
    key: position_id
    cols:
      position_id: {type: str, desc: "Supply position record, e.g. SPP-000123"}
      supplier_id: {type: str, desc: Supplier}
      sku: {type: str, desc: Product or material}
      material_id: {type: str, desc: "Fabric/material id if not a product"}
      position_date: {type: date, desc: Date position is for}
      available_stock_units: {type: int, desc: Units available now}
      available_capacity_units: {type: int, desc: Production capacity available}
      committed_capacity_units: {type: int, desc: Capacity committed to other orders}
      total_capacity_units: {type: int, desc: Total monthly capacity}
      lead_time_days: {type: int, desc: Lead time to supply}
      moq_units: {type: int, desc: Minimum order quantity}
      price_gbp_per_unit: {type: float, desc: Unit price}
      currency: {type: str, desc: Invoice currency}
      updated_at: {type: timestamp, desc: When position was last updated}
      next_quarter_units: {type: int, desc: "Units we plan to buy from this supplier next quarter"}
      mto_lead_time_days: {type: int, desc: "Make-to-order lead time in days, blank if supplier cannot make this to order"}
      mto_moq_units: {type: int, desc: "Make-to-order minimum order quantity, blank if not offered"}

  supplier_delays:
    key: delay_notice_id
    cols:
      delay_notice_id: {type: str, desc: "Delay notice, e.g. DLY-000123"}
      supplier_id: {type: str, desc: Supplier}
      po_id: {type: str, desc: "Purchase order, if specific PO"}
      sku: {type: str, desc: "SKU affected, if material"}
      original_ship_date: {type: date, desc: Original commit}
      new_ship_date: {type: date, desc: Revised ship date}
      delay_days: {type: int, desc: Days of delay}
      reason: {type: str, desc: "Reason: capacity, materials, quality, other"}
      impact_assessment: {type: str, desc: Impact on our production/sales}
      notice_received_at: {type: date, desc: Date notice received}
      acknowledged: {type: bool, desc: Whether we acknowledged}
      contingency_plan: {type: str, desc: What we are doing about it}
      status: {type: enum, values: [active, mitigated, expired], desc: Status}
      created_at: {type: timestamp, desc: Created}
      material_type: {type: enum, values: [finished_goods, fabric, zip, trim, button, other], desc: "What is delayed: finished goods order, fabric, zips, trims, buttons"}
      material_id: {type: str, desc: "Material or component delayed, if not finished goods"}
      units_delayed: {type: int, desc: "Units delayed (finished units for finished goods, components otherwise)"}

  factory_operations:
    key: operation_id
    cols:
      operation_id: {type: str, desc: "Factory operation record, e.g. FOP-000123"}
      factory_id: {type: str, desc: Factory}
      period_start: {type: date, desc: Period start date}
      period_end: {type: date, desc: Period end date}
      capacity_units: {type: int, desc: Production capacity for period}
      utilisation_pct: {type: float, desc: "Percentage utilised (0-100)"}
      production_units: {type: int, desc: Units produced}
      orders_in_progress: {type: int, desc: Number of orders being produced}
      material_inbound_status: {type: enum, values: [on_track, delayed, critical], desc: Material supply status}
      material_inbound_notes: {type: text, desc: Details on material delays}
      moq_units: {type: int, desc: Minimum order quantity}
      moq_lead_time_days: {type: int, desc: Lead time for MOQ quantities}
      peak_capacity_units: {type: int, desc: Peak season capacity}
      sample_lead_time_days: {type: int, desc: Lead time for samples}
      certification_status: {type: str, desc: "OEKO-TEX, GOTS, ISO etc."}
      data_quality: {type: enum, values: [verified, estimated, missing], desc: Data quality flag}
      reported_at: {type: date, desc: Report date}
      created_at: {type: timestamp, desc: Created}

  material_supply:
    key: material_id
    cols:
      material_id: {type: str, desc: "Material/fabric id, e.g. MAT-000123 or sku"}
      supplier_id: {type: str, desc: Supplier or mill}
      material_name: {type: str, desc: "Fabric name, e.g. 200 GSM cotton drill"}
      material_type: {type: enum, values: [fabric, trim, zip, button, packaging, other], desc: Material type}
      lead_time_days: {type: int, desc: Typical lead time}
      moq_units: {type: int, desc: Minimum order quantity}
      price_gbp_per_unit: {type: float, desc: Unit price}
      stock_units_available: {type: int, desc: Current stock at supplier}
      stock_as_of: {type: date, desc: Date of stock snapshot}
      capacity_monthly_units: {type: int, desc: Monthly production capacity}
      width_cm: {type: float, desc: "Fabric width in cm"}
      composition: {type: str, desc: "Fiber content, e.g. 100% cotton"}
      certifications: {type: str, desc: "Certifications, e.g. OEKO-TEX, GOTS"}
      sustainability_notes: {type: text, desc: Sustainability/traceability info}
      last_updated: {type: timestamp, desc: Last updated}

  supplier_esg:
    key: esg_id
    cols:
      esg_id: {type: str, desc: "ESG record, e.g. ESG-000123"}
      supplier_id: {type: str, desc: Supplier}
      submission_year: {type: int, desc: "Reporting year, e.g. 2025"}
      submission_type: {type: enum, values: [esg_full, emissions_only, renewable_only], desc: What was submitted}
      submission_status: {type: enum, values: [not_submitted, submitted, pending_review, accepted, rejected, low_quality], desc: Submission status}
      submitted_date: {type: date, desc: Submission date}
      data_quality_score: {type: float, desc: "Data quality 0-100"}
      emissions_tonnes_co2e: {type: float, desc: Total emissions reported}
      renewable_pct: {type: float, desc: "% renewable electricity use"}
      water_usage_m3: {type: float, desc: Water usage in cubic metres"}
      waste_tonnes: {type: float, desc: Waste generated in tonnes}
      emissions_reduction_commitment_pct: {type: float, desc: "% reduction committed for next period"}
      emissions_reduction_target_year: {type: int, desc: Target year for emissions reduction}
      audit_evidence_provided: {type: bool, desc: Whether auditor evidence provided}
      evidence_quality: {type: enum, values: [verified, self_reported, missing], desc: Evidence quality}
      follow_up_needed: {type: bool, desc: Whether follow-up query needed}
      notes: {type: text, desc: Quality issues or follow-up queries}
      created_at: {type: timestamp, desc: Created}

  supplier_communications:
    key: communication_id
    cols:
      communication_id: {type: str, desc: "Communication record, e.g. COM-000123"}
      supplier_id: {type: str, desc: Supplier}
      sku: {type: str, desc: "SKU or order, if specific"}
      po_id: {type: str, desc: "PO, if related"}
      communication_type: {type: enum, values: [sample_comment, milestone_update, response_log, portal_access, fit_comment, message, price_increase_notice, chargeback_notice, document_request, expedite_request, price_query, variance_note], desc: Type}
      title: {type: str, desc: Subject or title}
      content: {type: text, desc: Message content or comment}
      from_party: {type: enum, values: [hv_to_supplier, supplier_to_hv], desc: Direction}
      response_time_hours: {type: float, desc: "How long supplier took to respond"}
      status: {type: enum, values: [sent, acknowledged, responded, closed], desc: Status}
      portal_page: {type: str, desc: "Portal page accessed, if access log"}
      accessed_at: {type: timestamp, desc: "When accessed, if access log"}
      deadline: {type: date, desc: Response deadline or fit comment deadline}
      overdue: {type: bool, desc: Whether deadline passed}
      created_at: {type: timestamp, desc: Created}
      updated_at: {type: timestamp, desc: Last updated}
      amount_gbp: {type: float, desc: "Amount the message is about, e.g. chargeback value"}
      quantity_units: {type: int, desc: "Units the message is about, e.g. units to expedite"}
      increase_pct: {type: float, desc: "Price increase asked for, percent, on price increase notices"}
      effective_date: {type: date, desc: "Date a price increase takes effect, on price increase notices"}

  part_supply:
    key: part_id
    cols:
      part_id: {type: str, desc: "Spare part id, e.g. SPR-900016"}
      part_name: {type: str, desc: "Part name, e.g. Conveyor drive motor (spare)"}
      asset_class: {type: str, desc: "Equipment class the part fits: conveyor, sorter, shuttle, motor, gearbox, sensor, forklift, reach_truck"}
      supplier_id: {type: str, desc: Supplier of the part}
      lead_time_days: {type: int, desc: Quoted supplier lead time in days}
      moq_units: {type: int, desc: Minimum order quantity}
      price_gbp_per_unit: {type: float, desc: Quoted unit price}
      stock_units_available: {type: int, desc: Units the supplier holds now}
      quoted_at: {type: date, desc: Date of the quote}

  ship_date_history:
    key: po_id
    cols:
      po_id: {type: str, desc: Purchase order}
      supplier_id: {type: str, desc: Supplier}
      factory_id: {type: str, desc: Factory that made the order}
      order_date: {type: date, desc: Date the order was placed}
      confirmed_ship_date: {type: date, desc: Ship date the supplier confirmed}
      actual_ship_date: {type: date, desc: Date the order actually left the factory}
      days_late: {type: int, desc: "Actual minus confirmed ship date, in days (0 = on time)"}

  supplier_forecasts:
    key: forecast_id
    cols:
      forecast_id: {type: str, desc: "Forecast record, e.g. FCS-000123"}
      supplier_id: {type: str, desc: Supplier the forecast was shared with}
      period_start: {type: date, desc: Start of the four-week period forecast}
      period_end: {type: date, desc: End of the period forecast}
      horizon_weeks: {type: int, desc: "How many weeks before the period the forecast was shared"}
      forecast_units: {type: int, desc: Units we forecast to the supplier}
      actual_units: {type: int, desc: Units actually required in the period}
      shared_at: {type: date, desc: Date the forecast was shared through the portal}

  material_origins:
    key: [material_id, origin_country]
    cols:
      material_id: {type: str, desc: "Material or fabric, e.g. MAT-900101"}
      origin_country: {type: str, desc: "Country the fibre comes from, ISO code, e.g. IN"}
      share_pct: {type: float, desc: "Share of the material's fibre from this country, 0-100"}

tools:
  - name: get_supplier_available_capacity
    desc: Spare production capacity by supplier and product category, largest first. Use to find who can take extra volume now.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional)"}
      category: {type: str, desc: "Product category, e.g. Trousers (optional)"}
      sku: {type: str, desc: "Product SKU (optional)"}
      min_available_units: {type: int, default: 0, desc: "Only suppliers with at least this much spare capacity"}
    sql: |
      WITH latest AS (
        SELECT sp.*, p.category
        FROM supply_position sp JOIN master.products p ON p.sku = sp.sku
        WHERE ($supplier_id IS NULL OR sp.supplier_id = $supplier_id)
          AND ($sku IS NULL OR sp.sku = $sku)
          AND ($category IS NULL OR lower(p.category) = lower($category))
        QUALIFY row_number() OVER (PARTITION BY sp.supplier_id, sp.sku ORDER BY sp.position_date DESC) = 1
      )
      SELECT l.supplier_id, s.name AS supplier_name, s.country, l.category, count(*) AS skus,
             sum(l.total_capacity_units) AS total_capacity_units,
             sum(l.committed_capacity_units) AS committed_capacity_units,
             sum(l.available_capacity_units) AS available_capacity_units,
             round(100.0 * sum(l.available_capacity_units) / NULLIF(sum(l.total_capacity_units), 0), 1) AS available_pct,
             round(avg(l.lead_time_days)) AS lead_time_days, max(l.position_date) AS position_date
      FROM latest l JOIN master.suppliers s ON s.supplier_id = l.supplier_id
      GROUP BY l.supplier_id, s.name, s.country, l.category
      HAVING sum(l.available_capacity_units) >= $min_available_units
      ORDER BY available_capacity_units DESC
    limit: 50
    example: {category: Trousers}

  - name: get_supplier_available_stock
    desc: Latest finished stock a supplier holds per SKU, with lead time and MOQ. Use to check whether an order can be expedited from stock.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional if sku is given)"}
      sku: {type: str, desc: "Product SKU (optional if supplier_id is given)"}
      min_stock_units: {type: int, default: 0, desc: "Only SKUs with at least this many units in stock"}
    sql: |
      SELECT * FROM (
        SELECT sp.supplier_id, s.name AS supplier_name, sp.sku, sp.available_stock_units,
               sp.lead_time_days, sp.moq_units, sp.price_gbp_per_unit, sp.position_date
        FROM supply_position sp
        JOIN master.suppliers s ON s.supplier_id = sp.supplier_id
        WHERE sp.sku IS NOT NULL
          AND ($supplier_id IS NULL OR sp.supplier_id = $supplier_id)
          AND ($sku IS NULL OR sp.sku = $sku)
        QUALIFY row_number() OVER (PARTITION BY sp.supplier_id, sp.sku ORDER BY sp.position_date DESC) = 1
      ) t
      WHERE available_stock_units >= $min_stock_units
      ORDER BY available_stock_units DESC, sku
    limit: 50
    example: {supplier_id: SUP-0034, sku: SKU-101260}

  - name: get_supplier_capacity_report
    desc: Capacity utilisation per supplier with change over the look-back period. Filter by supplier or material type such as fabric; highest utilisation first.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional)"}
      material_type: {type: enum, values: [fabric, trim, zip, button, other], desc: "Report on materials of this type (mills and component makers) instead of finished goods"}
      lookback_months: {type: int, default: 6, desc: "How many months of capacity snapshots to compare"}
    sql: |
      WITH snap AS (
        SELECT sp.supplier_id, COALESCE(sp.material_id, 'finished goods') AS item,
               COALESCE(max(m.material_name), 'All finished products') AS item_name, COALESCE(max(m.material_type), 'finished_goods') AS material_type, sp.position_date,
               sum(sp.total_capacity_units) AS total, sum(sp.committed_capacity_units) AS committed,
               sum(sp.available_capacity_units) AS available, round(avg(sp.lead_time_days)) AS lead_time_days
        FROM supply_position sp LEFT JOIN material_supply m ON m.material_id = sp.material_id
        WHERE ($supplier_id IS NULL OR sp.supplier_id = $supplier_id)
          AND ($material_type IS NULL OR m.material_type = $material_type)
          AND sp.position_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_months AS INT)) MONTH
        GROUP BY sp.supplier_id, item, sp.position_date
      ), r AS (
        SELECT *, row_number() OVER (PARTITION BY supplier_id, item ORDER BY position_date DESC) AS rn_new,
                  row_number() OVER (PARTITION BY supplier_id, item ORDER BY position_date) AS rn_old
        FROM snap
      )
      SELECT n.supplier_id, s.name AS supplier_name, n.item, n.item_name, n.material_type, n.position_date,
             n.total AS total_capacity_units, n.committed AS committed_capacity_units, n.available AS available_capacity_units,
             round(100.0 * n.committed / NULLIF(n.total, 0), 1) AS utilisation_pct,
             round(100.0 * o.committed / NULLIF(o.total, 0), 1) AS utilisation_pct_at_start,
             round(100.0 * n.committed / NULLIF(n.total, 0) - 100.0 * o.committed / NULLIF(o.total, 0), 1) AS change_pts,
             CASE WHEN 100.0 * n.committed / NULLIF(n.total, 0) - 100.0 * o.committed / NULLIF(o.total, 0) >= 5 THEN 'rising'
                  WHEN 100.0 * n.committed / NULLIF(n.total, 0) - 100.0 * o.committed / NULLIF(o.total, 0) <= -5 THEN 'falling'
                  ELSE 'flat' END AS utilisation_trend,
             n.lead_time_days
      FROM r n JOIN r o ON o.supplier_id = n.supplier_id AND o.item = n.item AND o.rn_old = 1
      JOIN master.suppliers s ON s.supplier_id = n.supplier_id
      WHERE n.rn_new = 1
      ORDER BY utilisation_pct DESC
    limit: 100
    example: {supplier_id: SUP-0070}

  - name: get_supplier_capacity_commitments
    desc: Supplier capacity committed versus still available, by product category or material, with annual headroom and next-quarter planned volume. Use to compare suppliers for sourcing awards.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional)"}
      category: {type: str, desc: "Product category, e.g. Bedding (optional)"}
      sku: {type: str, desc: "Product SKU (optional)"}
      material_type: {type: str, desc: "Material type, e.g. packaging or fabric (optional; shows materials instead of products)"}
      material: {type: str, desc: "Words in the material name, e.g. moulded pulp (optional)"}
    sql: |
      WITH latest AS (
        SELECT sp.supplier_id, sp.total_capacity_units, sp.committed_capacity_units, sp.available_capacity_units,
               sp.next_quarter_units, sp.lead_time_days, sp.moq_units, sp.position_date, sp.price_gbp_per_unit, p.category AS category
        FROM supply_position sp JOIN master.products p ON p.sku = sp.sku
        WHERE ($supplier_id IS NULL OR sp.supplier_id = $supplier_id)
          AND ($sku IS NULL OR sp.sku = $sku)
          AND ($category IS NULL OR lower(p.category) = lower($category))
          AND $material_type IS NULL AND $material IS NULL
        QUALIFY row_number() OVER (PARTITION BY sp.supplier_id, sp.sku ORDER BY sp.position_date DESC) = 1
        UNION ALL
        SELECT sp.supplier_id, sp.total_capacity_units, sp.committed_capacity_units, sp.available_capacity_units,
               sp.next_quarter_units, sp.lead_time_days, sp.moq_units, sp.position_date, sp.price_gbp_per_unit, m.material_name AS category
        FROM supply_position sp JOIN material_supply m ON m.material_id = sp.material_id
        WHERE ($supplier_id IS NULL OR sp.supplier_id = $supplier_id)
          AND $sku IS NULL AND $category IS NULL
          AND ($material_type IS NULL OR m.material_type = $material_type)
          AND ($material IS NULL OR lower(m.material_name) LIKE '%' || lower($material) || '%')
          AND ($material_type IS NOT NULL OR $material IS NOT NULL)
        QUALIFY row_number() OVER (PARTITION BY sp.supplier_id, sp.material_id ORDER BY sp.position_date DESC) = 1
      )
      SELECT l.supplier_id, s.name AS supplier_name, l.category, count(*) AS skus,
             sum(l.total_capacity_units) AS total_capacity_units,
             sum(l.committed_capacity_units) AS committed_capacity_units,
             sum(l.available_capacity_units) AS available_capacity_units,
             sum(l.available_capacity_units) * 12 AS available_capacity_units_per_year,
             round(100.0 * sum(l.committed_capacity_units) / NULLIF(sum(l.total_capacity_units), 0), 1) AS committed_pct,
             sum(l.next_quarter_units) AS next_quarter_units_planned,
             round(avg(l.lead_time_days)) AS lead_time_days, max(l.moq_units) AS moq_units,
             round(avg(l.price_gbp_per_unit), 2) AS price_gbp_per_unit, max(l.position_date) AS position_date
      FROM latest l JOIN master.suppliers s ON s.supplier_id = l.supplier_id
      GROUP BY l.supplier_id, s.name, l.category
      ORDER BY l.category, committed_pct
    limit: 50
    example: {category: Bedding}

  - name: get_supplier_base_profile_by_country
    desc: "Supplier base by country: supplier count by tier, annual spend, share of spend and factories. Filter by country, tier, status or fibre such as cotton to profile who supplies it."
    kind: sql
    args:
      country: {type: str, desc: "Supplier country code, e.g. IN (optional)"}
      tier: {type: str, desc: "Supplier tier: strategic, preferred, approved or probation (optional)"}
      status: {type: str, default: active, desc: "Supplier status, e.g. active"}
      fibre: {type: str, desc: "Only suppliers whose materials contain this fibre, e.g. cotton (optional)"}
    sql: |
      WITH sel AS (
        SELECT s.* FROM master.suppliers s
        WHERE ($country IS NULL OR s.country = upper($country))
          AND ($tier IS NULL OR s.tier = lower($tier))
          AND ($status IS NULL OR s.status = lower($status))
          AND ($fibre IS NULL OR s.supplier_id IN (SELECT m.supplier_id FROM material_supply m WHERE m.material_type = 'fabric' AND lower(m.composition) LIKE '%' || lower($fibre) || '%'))
      )
      SELECT sel.country, count(*) AS suppliers, sum(sel.annual_spend_gbp) AS annual_spend_gbp,
             round(100.0 * sum(sel.annual_spend_gbp) / sum(sum(sel.annual_spend_gbp)) OVER (), 1) AS share_of_spend_pct,
             count(*) FILTER (WHERE sel.tier = 'strategic') AS strategic, count(*) FILTER (WHERE sel.tier = 'preferred') AS preferred,
             count(*) FILTER (WHERE sel.tier = 'approved') AS approved, count(*) FILTER (WHERE sel.tier = 'probation') AS probation,
             (SELECT count(*) FROM master.factories f WHERE f.supplier_id IN (SELECT s2.supplier_id FROM sel s2 WHERE s2.country = sel.country)) AS factories,
             string_agg(sel.supplier_id, ', ' ORDER BY sel.annual_spend_gbp DESC) AS supplier_ids
      FROM sel
      GROUP BY sel.country
      ORDER BY suppliers DESC, annual_spend_gbp DESC, sel.country
    limit: 100
    example: {country: "BD", tier: "approved"}

  - name: get_part_lead_time
    desc: Supplier lead time, MOQ, price and stock for spare parts such as motors, gearboxes and sensors, longest lead time first.
    kind: select
    from: part_supply
    filters:
      asset_class: {}
      part_name: {op: like, desc: "Words in the part name, e.g. drive motor"}
      supplier_id: {}
      max_lead_time_days: {col: lead_time_days, op: "<=", desc: "Only parts quoted at this many days or fewer"}
    columns: [part_id, part_name, asset_class, supplier_id, lead_time_days, moq_units, price_gbp_per_unit, stock_units_available, quoted_at]
    order: lead_time_days DESC
    limit: 50
    example: {asset_class: motor}

  - name: get_supplier_delay_notices
    desc: Delay notices suppliers have raised, with new ship dates and reasons. Filter by supplier or material type such as zip or fabric.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional)"}
      material_type: {type: enum, values: [finished_goods, fabric, zip, trim, button, other], desc: "What is delayed (optional)"}
      status: {type: enum, values: [active, mitigated, expired], desc: "Delay status (optional)", default: active}
      min_delay_days: {type: int, default: 1, desc: "Only delays of at least this many days"}
      from_date: {type: date, default: "-60d", desc: "Notices received on or after this date"}
    sql: |
      SELECT d.delay_notice_id, d.supplier_id, s.name AS supplier_name, d.material_type, d.material_id, d.po_id, d.sku,
             d.units_delayed, d.original_ship_date, d.new_ship_date, d.delay_days, d.reason, d.impact_assessment,
             d.contingency_plan, d.status, d.notice_received_at
      FROM supplier_delays d JOIN master.suppliers s ON s.supplier_id = d.supplier_id
      WHERE ($supplier_id IS NULL OR d.supplier_id = $supplier_id)
        AND ($material_type IS NULL OR d.material_type = $material_type)
        AND ($status IS NULL OR d.status = $status)
        AND d.delay_days >= $min_delay_days
        AND d.notice_received_at >= CAST($from_date AS DATE)
      ORDER BY d.delay_days DESC, d.supplier_id
    limit: 50
    example: {material_type: zip}

  - name: get_factory_production_reports
    desc: Weekly factory production reports with capacity, output, utilisation, orders in progress and material inbound status. Use to see why a factory runs late.
    kind: sql
    args:
      factory_id: {required: true}
      lookback_days: {type: int, default: 90, desc: "Historical period"}
    sql: |
      SELECT factory_id, period_start, period_end, capacity_units, production_units,
             round(100 * production_units / NULLIF(capacity_units, 0), 1) AS output_pct,
             utilisation_pct, orders_in_progress, material_inbound_status, material_inbound_notes, moq_units, sample_lead_time_days
      FROM factory_operations
      WHERE factory_id = $factory_id
        AND period_start >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_days AS INT)) DAY
      ORDER BY period_start DESC
    limit: 52
    example: {factory_id: "FAC-0121"}

  - name: get_factory_capacity_utilisation
    desc: Monthly capacity utilisation per factory, highest first. Filter by factory or country and a minimum utilisation such as 90 to find overbooked factories.
    kind: sql
    args:
      factory_id: {}
      country: {type: str, desc: "Factory country code, e.g. BD (optional)"}
      min_utilisation_pct: {type: float, default: 0, desc: "Only months whose average utilisation is at least this, e.g. 90"}
      lookback_months: {type: int, default: 12, desc: "How many months of history"}
    sql: |
      SELECT o.factory_id, f.name AS factory_name, f.country, CAST(date_trunc('month', o.period_start) AS DATE) AS month,
             round(avg(o.utilisation_pct), 1) AS utilisation_pct, sum(o.capacity_units) AS capacity_units,
             sum(o.production_units) AS production_units, round(avg(o.orders_in_progress), 1) AS orders_in_progress,
             max(o.peak_capacity_units) AS peak_week_capacity_units
      FROM factory_operations o JOIN master.factories f ON f.factory_id = o.factory_id
      WHERE ($factory_id IS NULL OR o.factory_id = $factory_id)
        AND ($country IS NULL OR f.country = upper($country))
        AND o.period_start >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_months AS INT)) MONTH
        AND o.period_start <= CAST($as_of AS DATE)
      GROUP BY o.factory_id, f.name, f.country, CAST(date_trunc('month', o.period_start) AS DATE)
      HAVING avg(o.utilisation_pct) >= $min_utilisation_pct
      ORDER BY utilisation_pct DESC, o.factory_id, month
    limit: 200
    example: {factory_id: "FAC-0107"}

  - name: get_factory_material_inbound_status
    desc: Weekly material inbound status at a factory with delay and shortage notes. Use for production risk assessment.
    kind: sql
    args:
      factory_id: {required: true}
      lookback_days: {type: int, default: 90, desc: "Historical period"}
    sql: |
      SELECT factory_id, period_start, material_inbound_status, material_inbound_notes, orders_in_progress
      FROM factory_operations
      WHERE factory_id = $factory_id
        AND period_start >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_days AS INT)) DAY
      ORDER BY period_start DESC
    limit: 30
    example: {factory_id: "FAC-0121"}

  - name: get_factory_moq_terms
    desc: Latest minimum order quantity, MOQ lead time and sample lead time per factory. Filter by factory or country to compare sourcing options.
    kind: sql
    args:
      factory_id: {}
      country: {type: str, desc: "Factory country code, e.g. VN (optional)"}
    sql: |
      SELECT f.factory_id, f.name AS factory_name, f.country, f.status AS factory_status,
             o.moq_units, o.moq_lead_time_days, o.sample_lead_time_days, o.certification_status, o.reported_at
      FROM (
        SELECT * FROM factory_operations
        WHERE period_start <= CAST($as_of AS DATE)
        QUALIFY row_number() OVER (PARTITION BY factory_id ORDER BY period_start DESC) = 1
      ) o
      JOIN master.factories f ON f.factory_id = o.factory_id
      WHERE ($factory_id IS NULL OR o.factory_id = $factory_id)
        AND ($country IS NULL OR f.country = upper($country))
      ORDER BY f.country, o.moq_units, f.factory_id
    limit: 50
    example: {factory_id: "FAC-0066"}

  - name: get_order_readiness_status
    desc: "Latest production readiness per factory: orders in progress, spare capacity, material inbound status and a readiness call. Use to judge which factories can take pulled-forward orders."
    kind: sql
    args:
      factory_id: {}
      country: {type: str, desc: "Factory country code, e.g. BD (optional)"}
      min_utilisation_pct: {type: float, default: 0, desc: "Only factories at least this utilised in the latest week, e.g. 90"}
    sql: |
      SELECT o.factory_id, f.name AS factory_name, f.country, o.period_start, o.orders_in_progress, o.utilisation_pct,
             o.capacity_units, o.production_units, o.capacity_units - o.production_units AS spare_capacity_units,
             o.peak_capacity_units - o.production_units AS spare_peak_capacity_units,
             o.material_inbound_status, o.material_inbound_notes,
             CASE WHEN o.material_inbound_status = 'critical' THEN 'blocked: materials critical'
                  WHEN o.material_inbound_status = 'delayed' THEN 'at risk: materials delayed'
                  WHEN o.utilisation_pct >= 95 THEN 'at risk: no spare capacity'
                  ELSE 'ready' END AS readiness
      FROM (
        SELECT * FROM factory_operations
        WHERE period_start <= CAST($as_of AS DATE)
        QUALIFY row_number() OVER (PARTITION BY factory_id ORDER BY period_start DESC) = 1
      ) o
      JOIN master.factories f ON f.factory_id = o.factory_id
      WHERE ($factory_id IS NULL OR o.factory_id = $factory_id)
        AND ($country IS NULL OR f.country = upper($country))
        AND o.utilisation_pct >= $min_utilisation_pct
      ORDER BY o.utilisation_pct DESC, o.factory_id
    limit: 50
    example: {factory_id: "FAC-0107"}

  - name: get_fabric_mill_lead_time_and_stock
    desc: Return fabric mill lead time and stock. Use for material sourcing decisions.
    kind: sql
    args:
      material_id: {required: true}
      supplier_id: {type: str, desc: "Mill (optional)"}
    sql: |
      SELECT material_id, supplier_id, material_name, lead_time_days, moq_units,
             price_gbp_per_unit, stock_units_available, stock_as_of, capacity_monthly_units,
             composition, certifications
      FROM material_supply
      WHERE material_id = $material_id
        AND ($supplier_id IS NULL OR supplier_id = $supplier_id)
      ORDER BY stock_as_of DESC
    limit: 10
    example: {material_id: "MAT-900001"}

  - name: get_supplier_capacity_for_material
    desc: Return supplier capacity for material. Use to assess sourcing options.
    kind: sql
    args:
      material_id: {required: true}
      supplier_id: {type: str, desc: "Supplier/mill (optional)"}
    sql: |
      SELECT material_id, supplier_id, capacity_monthly_units, stock_units_available,
             lead_time_days, moq_units, certifications
      FROM material_supply
      WHERE material_id = $material_id
        AND ($supplier_id IS NULL OR supplier_id = $supplier_id)
      ORDER BY capacity_monthly_units DESC
    limit: 10
    example: {material_id: "MAT-900001"}

  - name: create_supplier_claim
    desc: Raise a short-shipment or damage claim against a supplier for a PO. Returns the new claim.
    kind: insert
    table: supplier_claims
    id_prefix: CLM-
    defaults: {status: submitted}
    args:
      po_id: {required: true}
      supplier_id: {required: true}
      claim_type: {required: true, desc: "short_ship, damage, quality, or other"}
