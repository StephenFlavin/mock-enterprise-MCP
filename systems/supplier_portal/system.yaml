      SELECT communication_id, supplier_id, sku, title, content, from_party,
             created_at, status
      FROM supplier_communications
      WHERE supplier_id = $supplier_id
        AND communication_type = 'sample_comment'
        AND ($sku IS NULL OR sku = $sku)
      ORDER BY created_at DESC
    limit: 50
    example: {supplier_id: "SUP-0022"}

  - name: get_supplier_corrective_action_response
    desc: Return supplier corrective action response. Use to track CAR progress.
