id: supplier_portal
name: Supplier Portal
instructions: >
  Supplier relationships, capacities, stock, quality issues, delays and communications.
  Claim ids look like CLM-000123, corrective action ids like CAR-000123. Supports both
  strategic supplier management and tactical operational issues. Use for capacity planning,
  delay management, quality escalations, ESG tracking, and fabric/material sourcing.

tables:
  supplier_variances:
    key: variance_id
    cols:
      variance_id: {type: str, desc: "Variance record, e.g. VAR-000123"}
      po_id: {type: str, desc: Purchase order}
      shipment_id: {type: str, desc: Shipment or ASN reference}
      supplier_id: {type: str, desc: Supplier}
      sku: {type: str, desc: Product}
      asn_quantity: {type: int, desc: Quantity on advance shipping notice}
      receipt_quantity: {type: int, desc: Quantity actually received}
      variance_units: {type: int, desc: "Difference (receipt - ASN)"}
      variance_reason: {type: str, desc: "Why: short-ship, damage, over-ship, system error, unknown"}
      variance_value_gbp: {type: float, desc: Cost impact of variance}
      is_claimable: {type: bool, desc: Whether this variance can be claimed}
      claim_window_days: {type: int, desc: Days remaining to claim}
      received_at: {type: date, desc: Receipt date}
      created_at: {type: timestamp, desc: Variance recorded}

  supplier_claims:
    key: claim_id
    cols:
      claim_id: {type: str, desc: "Claim, e.g. CLM-000123"}
      po_id: {type: str, desc: Purchase order}
      supplier_id: {type: str, desc: Supplier}
      variance_id: {type: str, desc: Related variance record}
      claim_type: {type: enum, values: [short_ship, damage, quality, other], desc: Type of claim}
      claim_amount_gbp: {type: float, desc: Claimed amount}
      status: {type: enum, values: [draft, submitted, accepted, rejected, settled], desc: Claim status}
      raised_at: {type: date, desc: Date claim raised}
      submitted_at: {type: date, desc: Date claim submitted to supplier}
      settled_amount_gbp: {type: float, desc: Amount settled if applicable}
      notes: {type: text, desc: Claim notes}
      created_by: {type: str, desc: Employee who raised claim}
      updated_at: {type: timestamp, desc: Last update}

  corrective_actions:
    key: corrective_action_id
    cols:
      corrective_action_id: {type: str, desc: "Corrective action request, e.g. CAR-000123"}
      supplier_id: {type: str, desc: Supplier}
      sku: {type: str, desc: Product affected}
      issue_type: {type: enum, values: [quality, compliance, delivery, other], desc: Issue category}
      severity: {type: enum, values: [high, medium, low], desc: Issue severity}
      description: {type: text, desc: What went wrong}
      root_cause: {type: str, desc: Supplier root cause analysis}
      corrective_actions: {type: text, desc: "Actions the supplier will take"}
      response_received: {type: bool, desc: Whether supplier has responded}
      response_date: {type: date, desc: When supplier responded}
      response_text: {type: text, desc: Supplier response}
      status: {type: enum, values: [open, responded, in_progress, closed, escalated], desc: CAR status}
      raised_at: {type: date, desc: Date CAR raised}
      due_date: {type: date, desc: Due date for response}
      closed_at: {type: date, desc: Date CAR closed}
      created_by: {type: str, desc: Employee who raised}
      updated_at: {type: timestamp, desc: Last update}

  supply_position:
    key: position_id
    cols:
      position_id: {type: str, desc: "Supply position record, e.g. SPP-000123"}
      supplier_id: {type: str, desc: Supplier}
      sku: {type: str, desc: Product or material}
      material_id: {type: str, desc: "Fabric/material id if not a product"}
      position_date: {type: date, desc: Date position is for}
      available_stock_units: {type: int, desc: Units available now}
      available_capacity_units: {type: int, desc: Production capacity available}
      committed_capacity_units: {type: int, desc: Capacity committed to other orders}
      total_capacity_units: {type: int, desc: Total monthly capacity}
      lead_time_days: {type: int, desc: Lead time to supply}
      moq_units: {type: int, desc: Minimum order quantity}
      price_gbp_per_unit: {type: float, desc: Unit price}
      currency: {type: str, desc: Invoice currency}
      updated_at: {type: timestamp, desc: When position was last updated}

  supplier_delays:
    key: delay_notice_id
    cols:
      delay_notice_id: {type: str, desc: "Delay notice, e.g. DLY-000123"}
      supplier_id: {type: str, desc: Supplier}
      po_id: {type: str, desc: "Purchase order, if specific PO"}
      sku: {type: str, desc: "SKU affected, if material"}
      original_ship_date: {type: date, desc: Original commit}
      new_ship_date: {type: date, desc: Revised ship date}
      delay_days: {type: int, desc: Days of delay}
      reason: {type: str, desc: "Reason: capacity, materials, quality, other"}
      impact_assessment: {type: str, desc: Impact on our production/sales}
      notice_received_at: {type: date, desc: Date notice received}
      acknowledged: {type: bool, desc: Whether we acknowledged}
      contingency_plan: {type: str, desc: What we are doing about it}
      status: {type: enum, values: [active, mitigated, expired], desc: Status}
      created_at: {type: timestamp, desc: Created}

  factory_operations:
    key: operation_id
    cols:
      operation_id: {type: str, desc: "Factory operation record, e.g. FOP-000123"}
      factory_id: {type: str, desc: Factory}
      period_start: {type: date, desc: Period start date}
      period_end: {type: date, desc: Period end date}
      capacity_units: {type: int, desc: Production capacity for period}
      utilisation_pct: {type: float, desc: "Percentage utilised (0-100)"}
      production_units: {type: int, desc: Units produced}
      orders_in_progress: {type: int, desc: Number of orders being produced}
      material_inbound_status: {type: enum, values: [on_track, delayed, critical], desc: Material supply status}
      material_inbound_notes: {type: text, desc: Details on material delays}
      moq_units: {type: int, desc: Minimum order quantity}
      moq_lead_time_days: {type: int, desc: Lead time for MOQ quantities}
      peak_capacity_units: {type: int, desc: Peak season capacity}
      sample_lead_time_days: {type: int, desc: Lead time for samples}
      certification_status: {type: str, desc: "OEKO-TEX, GOTS, ISO etc."}
      data_quality: {type: enum, values: [verified, estimated, missing], desc: Data quality flag}
      reported_at: {type: date, desc: Report date}
      created_at: {type: timestamp, desc: Created}

  material_supply:
    key: material_id
    cols:
      material_id: {type: str, desc: "Material/fabric id, e.g. MAT-000123 or sku"}
      supplier_id: {type: str, desc: Supplier or mill}
      material_name: {type: str, desc: "Fabric name, e.g. 200 GSM cotton drill"}
      material_type: {type: enum, values: [fabric, trim, zip, button, other], desc: Material type}
      lead_time_days: {type: int, desc: Typical lead time}
      moq_units: {type: int, desc: Minimum order quantity}
      price_gbp_per_unit: {type: float, desc: Unit price}
      stock_units_available: {type: int, desc: Current stock at supplier}
      stock_as_of: {type: date, desc: Date of stock snapshot}
      capacity_monthly_units: {type: int, desc: Monthly production capacity}
      width_cm: {type: float, desc: "Fabric width in cm"}
      composition: {type: str, desc: "Fiber content, e.g. 100% cotton"}
      certifications: {type: str, desc: "Certifications, e.g. OEKO-TEX, GOTS"}
      sustainability_notes: {type: text, desc: Sustainability/traceability info}
      last_updated: {type: timestamp, desc: Last updated}

  supplier_esg:
    key: esg_id
    cols:
      esg_id: {type: str, desc: "ESG record, e.g. ESG-000123"}
      supplier_id: {type: str, desc: Supplier}
      submission_year: {type: int, desc: "Reporting year, e.g. 2025"}
      submission_type: {type: enum, values: [esg_full, emissions_only, renewable_only], desc: What was submitted}
      submission_status: {type: enum, values: [not_submitted, submitted, pending_review, accepted, rejected, low_quality], desc: Submission status}
      submitted_date: {type: date, desc: Submission date}
      data_quality_score: {type: float, desc: "Data quality 0-100"}
      emissions_tonnes_co2e: {type: float, desc: Total emissions reported}
      renewable_pct: {type: float, desc: "% renewable electricity use"}
      water_usage_m3: {type: float, desc: Water usage in cubic metres"}
      waste_tonnes: {type: float, desc: Waste generated in tonnes}
      emissions_reduction_commitment_pct: {type: float, desc: "% reduction committed for next period"}
      emissions_reduction_target_year: {type: int, desc: Target year for emissions reduction}
      audit_evidence_provided: {type: bool, desc: Whether auditor evidence provided}
      evidence_quality: {type: enum, values: [verified, self_reported, missing], desc: Evidence quality}
      follow_up_needed: {type: bool, desc: Whether follow-up query needed}
      notes: {type: text, desc: Quality issues or follow-up queries}
      created_at: {type: timestamp, desc: Created}

  supplier_communications:
    key: communication_id
    cols:
      communication_id: {type: str, desc: "Communication record, e.g. COM-000123"}
      supplier_id: {type: str, desc: Supplier}
      sku: {type: str, desc: "SKU or order, if specific"}
      po_id: {type: str, desc: "PO, if related"}
      communication_type: {type: enum, values: [sample_comment, milestone_update, response_log, portal_access, fit_comment, message], desc: Type}
      title: {type: str, desc: Subject or title}
      content: {type: text, desc: Message content or comment}
      from_party: {type: enum, values: [hv_to_supplier, supplier_to_hv], desc: Direction}
      response_time_hours: {type: float, desc: "How long supplier took to respond"}
      status: {type: enum, values: [sent, acknowledged, responded, closed], desc: Status}
      portal_page: {type: str, desc: "Portal page accessed, if access log"}
      accessed_at: {type: timestamp, desc: "When accessed, if access log"}
      deadline: {type: date, desc: Response deadline or fit comment deadline}
      overdue: {type: bool, desc: Whether deadline passed}
      created_at: {type: timestamp, desc: Created}
      updated_at: {type: timestamp, desc: Last updated}

tools:
  - name: get_supplier_available_capacity
    desc: Retrieve supplier available capacity by material or product. Use to check if expediting is feasible.
    kind: sql
    args:
      supplier_id: {required: true}
      sku: {type: str, desc: "SKU (optional): restrict to specific product"}
      from_date: {type: date, default: "-0d", desc: "Available from date"}
      to_date: {type: date, default: "+90d", desc: "Available through date"}
    sql: |
      SELECT supplier_id, sku, available_capacity_units, committed_capacity_units, total_capacity_units,
             round(available_capacity_units * 100.0 / NULLIF(total_capacity_units, 0), 1) AS available_pct,
             lead_time_days, moq_units, price_gbp_per_unit
      FROM supply_position
      WHERE supplier_id = $supplier_id
        AND ($sku IS NULL OR sku = $sku)
        AND position_date >= CAST($from_date AS DATE)
      ORDER BY position_date, sku
    limit: 50
    example: {supplier_id: SUP-0001}

  - name: get_supplier_available_stock
    desc: Retrieve supplier available stock. Use to check if stock can be expedited.
    kind: sql
    args:
      supplier_id: {required: true}
      sku: {type: str, desc: "Product (optional)"}
    sql: |
      SELECT supplier_id, sku, available_stock_units, lead_time_days, moq_units,
             price_gbp_per_unit, position_date
      FROM supply_position
      WHERE supplier_id = $supplier_id
        AND ($sku IS NULL OR sku = $sku)
        AND available_stock_units > 0
      ORDER BY position_date DESC, sku
    limit: 50
    example: {supplier_id: SUP-0001}

  - name: get_supplier_capacity_report
    desc: Retrieve supplier capacity report including utilisation and commitment levels.
    kind: sql
    args:
      supplier_id: {required: true}
      lookback_months: {type: int, default: 6, desc: "How many months to look back"}
    sql: |
      SELECT supplier_id, sku, position_date, total_capacity_units, available_capacity_units,
             committed_capacity_units, round(100 * available_capacity_units / NULLIF(total_capacity_units, 0), 1) AS available_pct,
             lead_time_days, moq_units
      FROM supply_position
      WHERE supplier_id = $supplier_id
        AND position_date >= CAST($as_of AS DATE) - INTERVAL ($lookback_months) MONTH
      ORDER BY position_date DESC, sku
    limit: 100
    example: {supplier_id: SUP-0001}

  - name: get_supplier_capacity_commitments
    desc: Supplier capacity and commitments for a season or product. Use for sourcing decisions.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, sku, position_date,
             total_capacity_units, committed_capacity_units, available_capacity_units,
             round(100 * committed_capacity_units / NULLIF(total_capacity_units, 0), 1) AS committed_pct,
             moq_units, lead_time_days
      FROM supply_position
      WHERE supplier_id = $supplier_id
        AND position_date >= CAST($as_of AS DATE)
      ORDER BY position_date, sku
    limit: 50
    example: {supplier_id: SUP-0001}

  - name: get_supplier_base_profile_by_country
    desc: Supplier base profile by country and tier. Use to understand supply chain structure.
    kind: select
    from: master.suppliers
    filters:
      country: {}
      tier: {}
      status: {}
    columns: [supplier_id, name, country, category_focus, tier, status, annual_spend_gbp]
    order: annual_spend_gbp
    limit: 100
    example: {country: "BD", tier: "approved"}

  - name: get_part_lead_time
    desc: Supplier lead time and price for a part or material. Use for ordering and planning.
    kind: sql
    args:
      supplier_id: {required: true}
      sku: {type: str, desc: "SKU or material"}
    sql: |
      SELECT supplier_id, sku, lead_time_days, moq_units, price_gbp_per_unit,
             available_stock_units, position_date
      FROM supply_position
      WHERE supplier_id = $supplier_id AND sku = $sku
      ORDER BY position_date DESC LIMIT 1
    limit: 10
    example: {supplier_id: "SUP-0013", sku: "PF-220"}

  - name: get_supplier_delay_notices
    desc: Retrieve supplier delay notices. Use to identify at-risk orders and plan mitigations.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier (optional)"}
      status: {type: enum, values: [active, mitigated, expired], desc: "Delay status (optional)", default: active}
      min_delay_days: {type: int, default: 1, desc: "Only delays at least this many days"}
    sql: |
      SELECT delay_notice_id, supplier_id, po_id, original_ship_date, new_ship_date,
             delay_days, reason, impact_assessment, contingency_plan, status
      FROM supplier_delays
      WHERE ($supplier_id IS NULL OR supplier_id = $supplier_id)
        AND ($status IS NULL OR status = $status)
        AND delay_days >= $min_delay_days
      ORDER BY new_ship_date, supplier_id
    limit: 50
    example: {}

  - name: get_factory_production_reports
    desc: Factory production reports including status and output. Use to understand production progress.
    kind: sql
    args:
      factory_id: {required: true}
      lookback_days: {type: int, default: 90, desc: "Historical period"}
    sql: |
      SELECT factory_id, period_start, period_end, capacity_units, production_units,
             round(100 * production_units / NULLIF(capacity_units, 0), 1) AS output_pct,
             orders_in_progress, moq_units, sample_lead_time_days
      FROM factory_operations
      WHERE factory_id = $factory_id
        AND period_start >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_days AS INT)) DAY
      ORDER BY period_start DESC
    limit: 52
    example: {factory_id: "FAC-0107"}

  - name: get_factory_capacity_utilisation
    desc: Factory capacity utilisation by month. Use to identify overbooking or underutilisation.
    kind: sql
    args:
      factory_id: {required: true}
      lookback_months: {type: int, default: 12, desc: "How many months of history"}
    sql: |
      SELECT factory_id, period_start, period_end, capacity_units, production_units, utilisation_pct,
             orders_in_progress, peak_capacity_units
      FROM factory_operations
      WHERE factory_id = $factory_id
        AND period_start >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_months AS INT)) MONTH
      ORDER BY period_start DESC
    limit: 52
    example: {factory_id: "FAC-0107"}

  - name: get_factory_material_inbound_status
    desc: Material inbound status at a factory (delays, shortages). Use for production risk assessment.
    kind: sql
    args:
      factory_id: {required: true}
    sql: |
      SELECT factory_id, period_start, material_inbound_status, material_inbound_notes,
             orders_in_progress
      FROM factory_operations
      WHERE factory_id = $factory_id
        AND period_start >= CAST($as_of AS DATE) - INTERVAL 90 DAY
      ORDER BY period_start DESC
    limit: 30
    example: {factory_id: "FAC-0107"}

  - name: get_factory_moq_terms
    desc: Factory MOQ and commitment terms. Use for order sizing decisions.
    kind: sql
    args:
      factory_id: {required: true}
    sql: |
      SELECT factory_id, moq_units, moq_lead_time_days, sample_lead_time_days
      FROM factory_operations
      WHERE factory_id = $factory_id
      ORDER BY period_start DESC LIMIT 1
    limit: 10
    example: {factory_id: "FAC-0107"}

  - name: get_order_readiness_status
    desc: Production readiness status of an order. Use to track sample approvals and production progress.
    kind: sql
    args:
      factory_id: {required: true}
    sql: |
      SELECT factory_id, period_start, orders_in_progress, production_units,
             capacity_units, utilisation_pct
      FROM factory_operations
      WHERE factory_id = $factory_id
        AND period_start >= CAST($as_of AS DATE) - INTERVAL 90 DAY
      ORDER BY period_start DESC
    limit: 20
    example: {factory_id: "FAC-0107"}

  - name: get_fabric_mill_lead_time_and_stock
    desc: Return fabric mill lead time and stock. Use for material sourcing decisions.
    kind: sql
    args:
      material_id: {required: true}
      supplier_id: {type: str, desc: "Mill (optional)"}
    sql: |
      SELECT material_id, supplier_id, material_name, lead_time_days, moq_units,
             price_gbp_per_unit, stock_units_available, stock_as_of, capacity_monthly_units,
             composition, certifications
      FROM material_supply
      WHERE material_id = $material_id
        AND ($supplier_id IS NULL OR supplier_id = $supplier_id)
      ORDER BY stock_as_of DESC
    limit: 10
    example: {material_id: "MAT-900001"}

  - name: get_supplier_capacity_for_material
    desc: Return supplier capacity for material. Use to assess sourcing options.
    kind: sql
    args:
      material_id: {required: true}
      supplier_id: {type: str, desc: "Supplier/mill (optional)"}
    sql: |
      SELECT material_id, supplier_id, capacity_monthly_units, stock_units_available,
             lead_time_days, moq_units, certifications
      FROM material_supply
      WHERE material_id = $material_id
        AND ($supplier_id IS NULL OR supplier_id = $supplier_id)
      ORDER BY capacity_monthly_units DESC
    limit: 10
    example: {material_id: "MAT-900001"}

  - name: create_supplier_claim
    desc: Raise a short-shipment or damage claim against a supplier. Returns the new claim.
    kind: insert
    table: supplier_claims
    id_prefix: CLM-
    defaults: {status: draft}
    args:
      po_id: {required: true}
      supplier_id: {required: true}
      claim_type: {required: true, desc: "short_ship, damage, quality, or other"}
      claim_amount_gbp: {required: true}
      notes: {type: str, desc: "Claim details"}
      variance_id: {type: str, desc: "Related variance record"}
    example: {po_id: "PO-2026-004003", supplier_id: "SUP-0012", claim_type: short_ship, claim_amount_gbp: 1250.50, notes: "Short by 100 units"}

  - name: create_supplier_corrective_action_request
    desc: Creates a corrective action request against a supplier for a failed sample or test.
    kind: insert
    table: corrective_actions
    id_prefix: CAR-
    defaults: {status: open}
    args:
      supplier_id: {required: true}
      sku: {required: true}
      issue_type: {required: true}
      severity: {required: true}
      description: {required: true}
      due_date: {type: date, desc: "When supplier must respond"}
    example: {supplier_id: "SUP-0001", sku: "SKU-101904", issue_type: quality, severity: high, description: "Seam strength below spec", due_date: "+14d"}

  - name: draft_supplier_variance_note
    desc: Draft a note to a supplier explaining receipt-versus-ASN variances. Returns formatted note.
    kind: draft
    args:
      supplier_id: {required: true}
      lookback_days: {type: int, default: 56, desc: "Review period"}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      variances: SELECT * FROM supplier_variances WHERE supplier_id = $supplier_id
                 AND received_at >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_days AS INT)) DAY
                 ORDER BY received_at DESC
    template: |
      To: {{ supplier[0].name }}
      Ref: {{ supplier[0].supplier_id }}

      Variance Summary - Last {{ lookback_days }} Days

      We have reviewed receipts against your ASNs and identified the following variances:
      {% for v in variances %}
      - {{ v.po_id }}: {{ v.variance_units }} units ({{ v.variance_reason }})
      {% endfor %}

      Total variance value: £{{ variances | map(attribute='variance_value_gbp') | sum | money }}

      Please review and confirm corrective actions to prevent future issues.

      Regards,
      Harbour & Vale Supply Chain
    example: {supplier_id: "SUP-0001"}

  - name: draft_supplier_chaser_email
    desc: Draft chaser emails for missing or poor ESG data. Returns email text.
    kind: draft
    args:
      supplier_id: {required: true}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      esg: SELECT * FROM supplier_esg WHERE supplier_id = $supplier_id
           AND submission_status IN ('not_submitted', 'low_quality', 'rejected')
           ORDER BY submission_year DESC LIMIT 1
    template: |
      To: {{ supplier[0].name }}

      Subject: ESG Data Submission Required

      We are reaching out to request your ESG data submission for {{ esg[0].submission_year }}.

      {% if esg[0].submission_status == 'not_submitted' %}
      We have not yet received your submission. Please send by Friday.
      {% elif esg[0].submission_status == 'low_quality' %}
      Your previous submission has data quality issues noted below. Please resubmit with corrections:
      {{ esg[0].notes }}
      {% elif esg[0].submission_status == 'rejected' %}
      Your submission was rejected. Please address the following and resubmit:
      {{ esg[0].notes }}
      {% endif %}

      Contact your account manager with any questions.

      Regards,
      ESG Team
    example: {supplier_id: "SUP-0001"}

  - name: get_forecast_accuracy_shared_with_supplier
    desc: Accuracy of forecasts shared with a supplier. Use for forecast review meetings.
    kind: sql
    args:
      supplier_id: {required: true}
      lookback_months: {type: int, default: 6, desc: "Review period"}
    sql: |
      SELECT supplier_id, position_date, available_stock_units, moq_units,
             round(available_capacity_units * 100.0 / NULLIF(total_capacity_units, 0), 1) AS capacity_utilisation_pct
      FROM supply_position
      WHERE supplier_id = $supplier_id
        AND position_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_months AS INT)) MONTH
      ORDER BY position_date DESC
    limit: 52
    example: {supplier_id: "SUP-0001"}

  - name: get_supplier_comments_on_sample
    desc: Return supplier comments on sample. Use to understand sample feedback.
    kind: sql
    args:
      supplier_id: {required: true}
      sku: {type: str, desc: "SKU (optional)"}
    sql: |
      SELECT communication_id, supplier_id, sku, title, content, from_party,
             created_at, status
      FROM supplier_communications
      WHERE supplier_id = $supplier_id
        AND communication_type = 'sample_comment'
        AND ($sku IS NULL OR sku = $sku)
      ORDER BY created_at DESC
    limit: 50
    example: {supplier_id: "SUP-0001"}

  - name: get_supplier_corrective_action_response
    desc: Return supplier corrective action response. Use to track CAR progress.
    kind: sql
    args:
      corrective_action_id: {required: true}
    sql: |
      SELECT corrective_action_id, supplier_id, sku, issue_type, severity,
             description, response_received, response_date, response_text, status,
             raised_at, due_date
      FROM corrective_actions
      WHERE corrective_action_id = $corrective_action_id
    limit: 10
    example: {corrective_action_id: "CAR-900001"}

  - name: compare_capacity_utilisation_year_on_year
    desc: Capacity utilisation versus prior year. Use to see trends.
    kind: sql
    args:
      factory_id: {required: true}
      period_type: {type: enum, values: [month, quarter], default: month, desc: "Aggregation period"}
    sql: |
      SELECT factory_id, period_start, utilisation_pct, capacity_units, production_units
      FROM factory_operations
      WHERE factory_id = $factory_id
        AND period_start >= CAST($as_of AS DATE) - INTERVAL 24 MONTH
      ORDER BY period_start DESC
    limit: 26
    example: {factory_id: "FAC-0107"}

  - name: calculate_expected_air_requirement
    desc: Expected air freight requirement from delays and OTD. Use for air freight budgeting.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier (optional)"}
      lookback_days: {type: int, default: 90, desc: "Historical period for OTD"}
    sql: |
      SELECT supplier_id, COUNT(*) AS delayed_orders, AVG(delay_days) AS avg_delay_days,
             SUM(delay_days) AS total_delay_days,
             CASE WHEN AVG(delay_days) > 7 THEN 'high'
                  WHEN AVG(delay_days) > 3 THEN 'medium'
                  ELSE 'low' END AS air_freight_risk,
             'Air freight requirement = delayed_orders * avg_delay_days / lead_time' AS formula
      FROM supplier_delays
      WHERE ($supplier_id IS NULL OR supplier_id = $supplier_id)
        AND status IN ('active', 'mitigated')
      GROUP BY supplier_id
    limit: 50
    example: {}

