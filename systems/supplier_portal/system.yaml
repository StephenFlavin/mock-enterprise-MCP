  - name: get_supplier_ship_date_performance
    desc: How often a supplier missed its confirmed ship date in its latest orders versus the orders before, with on-time rate and trend. Use to assess delivery reliability.
    kind: sql
    args:
      supplier_id: {required: true}
      last_n_orders: {type: int, default: 10, desc: "Orders per comparison window"}
      grace_days: {type: int, default: 2, desc: "Days after the confirmed ship date still counted as on time"}
    sql: |
      WITH h AS (
        SELECT *, row_number() OVER (ORDER BY order_date DESC, po_id) AS rn
        FROM ship_date_history
        WHERE supplier_id = $supplier_id AND actual_ship_date IS NOT NULL
      ), w AS (
        SELECT *, CASE WHEN rn <= $last_n_orders THEN 'latest' WHEN rn <= 2 * $last_n_orders THEN 'previous' END AS period FROM h
      ), a AS (
        SELECT supplier_id, period, count(*) AS orders,
               count(*) FILTER (WHERE days_late > $grace_days) AS missed_ship_date,
               round(100.0 * count(*) FILTER (WHERE days_late > $grace_days) / count(*), 1) AS missed_pct,
               round(100.0 * count(*) FILTER (WHERE days_late <= $grace_days) / count(*), 1) AS on_time_pct,
               round(avg(days_late), 1) AS avg_days_late, max(days_late) AS worst_days_late,
               min(order_date) AS first_order_date, max(order_date) AS last_order_date
        FROM w WHERE period IS NOT NULL GROUP BY supplier_id, period
      )
      SELECT a.*, CASE WHEN a.period = 'latest' AND p.missed_pct IS NOT NULL THEN
                        CASE WHEN a.missed_pct > p.missed_pct THEN 'worsening' WHEN a.missed_pct < p.missed_pct THEN 'improving' ELSE 'stable' END END AS trend
      FROM a LEFT JOIN a p ON p.period = 'previous'
      ORDER BY a.period = 'previous'
    limit: 10
    example: {supplier_id: SUP-0070}

