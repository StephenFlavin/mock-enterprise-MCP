  - name: compare_capacity_utilisation_year_on_year
    desc: Factory utilisation per month or quarter against the same weeks a year earlier, with change in points. Filter by factory, country or minimum utilisation.
    kind: sql
    args:
      factory_id: {}
      country: {type: str, desc: "Factory country code, e.g. BD (optional)"}
      min_utilisation_pct: {type: float, default: 0, desc: "Only periods whose current average utilisation is at least this, e.g. 90"}
      period_type: {type: enum, values: [month, quarter], default: month, desc: "Aggregation period"}
      lookback_months: {type: int, default: 6, desc: "How many recent months to compare"}
    sql: |
      WITH wk AS (
        SELECT c.factory_id, c.period_start, c.utilisation_pct AS cur_util, p.utilisation_pct AS prior_util,
               c.production_units AS cur_prod, p.production_units AS prior_prod
        FROM factory_operations c
        JOIN factory_operations p ON p.factory_id = c.factory_id AND p.period_start = CAST(c.period_start - INTERVAL 364 DAY AS DATE)
        WHERE c.period_start >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_months AS INT)) MONTH
          AND c.period_start <= CAST($as_of AS DATE)
          AND ($factory_id IS NULL OR c.factory_id = $factory_id)
      )
      SELECT w.factory_id, f.name AS factory_name, f.country,
             CAST(CASE WHEN $period_type = 'quarter' THEN date_trunc('quarter', w.period_start) ELSE date_trunc('month', w.period_start) END AS DATE) AS period,
             round(avg(w.cur_util), 1) AS utilisation_pct, round(avg(w.prior_util), 1) AS utilisation_pct_year_earlier,
             round(avg(w.cur_util) - avg(w.prior_util), 1) AS change_pts, count(*) AS weeks_compared,
             sum(w.cur_prod) AS production_units, sum(w.prior_prod) AS production_units_year_earlier
      FROM wk w JOIN master.factories f ON f.factory_id = w.factory_id
      WHERE ($country IS NULL OR f.country = upper($country))
      GROUP BY w.factory_id, f.name, f.country,
               CAST(CASE WHEN $period_type = 'quarter' THEN date_trunc('quarter', w.period_start) ELSE date_trunc('month', w.period_start) END AS DATE)
      HAVING avg(w.cur_util) >= $min_utilisation_pct
      ORDER BY utilisation_pct DESC, w.factory_id, period
    limit: 200
    example: {factory_id: "FAC-0107"}

  - name: calculate_expected_air_requirement
    desc: Expected air freight requirement and cost from suppliers' active delays and their on-time shipping record, by supplier. Supports a what-if on delay improvement.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional)"}
      delay_improvement_pct: {type: float, default: 0, desc: "What-if: percentage by which current delays shorten, e.g. 20"}
      peak_horizon_days: {type: int, default: 90, desc: "Days ahead in which open orders still to ship are counted"}
      air_rate_per_kg_gbp: {type: float, default: 6.5, desc: "Air freight cost per kg in GBP"}
      avg_unit_weight_kg: {type: float, default: 0.6, desc: "Average shipped weight per unit in kg"}
    sql: |
      WITH otd AS (
        SELECT supplier_id, count(*) AS shipped_orders, count(*) FILTER (WHERE days_late <= 2) AS on_time_orders
        FROM (SELECT supplier_id, days_late,
                     row_number() OVER (PARTITION BY supplier_id ORDER BY order_date DESC, po_id) AS rn
              FROM ship_date_history WHERE actual_ship_date IS NOT NULL) h
        WHERE rn <= 10
        GROUP BY supplier_id
      ), d AS (
        SELECT supplier_id, count(*) AS delayed_orders, sum(units_delayed) AS delayed_units,
               round(avg(delay_days), 1) AS avg_delay_days,
               sum(units_delayed * least(1.0, delay_days * (1 - $delay_improvement_pct / 100.0) / 28.0)) AS air_units_from_delays
        FROM supplier_delays
        WHERE status = 'active' AND material_type = 'finished_goods'
          AND ($supplier_id IS NULL OR supplier_id = $supplier_id)
        GROUP BY supplier_id
      ), u AS (
        SELECT supplier_id, sum(total_units) AS open_units
        FROM master.purchase_orders
        WHERE status IN ('open', 'confirmed')
          AND ship_date >= CAST($as_of AS DATE)
          AND ship_date <= CAST($as_of AS DATE) + INTERVAL (CAST($peak_horizon_days AS INT)) DAY
        GROUP BY supplier_id
      ), x AS (
        SELECT d.supplier_id, d.delayed_orders, d.delayed_units, d.avg_delay_days,
               round(100.0 * o.on_time_orders / NULLIF(o.shipped_orders, 0), 1) AS otd_pct,
               d.air_units_from_delays,
               greatest(coalesce(u.open_units, 0) - d.delayed_units, 0)
                 * (1 - coalesce(1.0 * o.on_time_orders / NULLIF(o.shipped_orders, 0), 1)) * 0.3 AS air_units_from_otd_risk
        FROM d LEFT JOIN otd o ON o.supplier_id = d.supplier_id LEFT JOIN u ON u.supplier_id = d.supplier_id
      )
      SELECT x.supplier_id, s.name AS supplier_name, x.delayed_orders, x.delayed_units, x.avg_delay_days, x.otd_pct,
             round(x.air_units_from_delays) AS air_units_from_delays,
             round(x.air_units_from_otd_risk) AS air_units_from_otd_risk,
             round(x.air_units_from_delays + x.air_units_from_otd_risk) AS expected_air_units,
             round((x.air_units_from_delays + x.air_units_from_otd_risk) * $avg_unit_weight_kg * $air_rate_per_kg_gbp) AS expected_air_cost_gbp,
             round(sum((x.air_units_from_delays + x.air_units_from_otd_risk) * $avg_unit_weight_kg * $air_rate_per_kg_gbp) OVER ()) AS total_expected_air_cost_gbp,
             'air units = delayed units x min(1, delay days / 28) + open units still to ship x (1 - on-time rate of its last 10 shipped orders) x 30%; cost = air units x unit weight kg x rate per kg' AS formula
      FROM x JOIN master.suppliers s ON s.supplier_id = x.supplier_id
      ORDER BY expected_air_cost_gbp DESC
    limit: 50
    example: {}

  - name: get_supplier_emissions_commitments
    desc: Supplier emissions reduction commitments (percentage, target year, reported emissions, tonnes committed) from the latest submission, with a total. Use a supplier id or top suppliers by spend.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional)"}
      top_suppliers_by_spend: {type: int, desc: "Only the N suppliers with the highest annual spend, e.g. 20 (optional)"}
      target_year: {type: int, desc: "Only commitments for this target year, e.g. 2030 (optional)"}
    sql: |
      WITH ranked AS (
        SELECT s.supplier_id, s.name AS supplier_name, s.annual_spend_gbp, s.status IN ('exited', 'blocked') AS inactive,
               row_number() OVER (PARTITION BY s.status IN ('exited', 'blocked') ORDER BY s.annual_spend_gbp DESC, s.supplier_id) AS spend_rank
        FROM master.suppliers s
      ), latest AS (
        SELECT e.* FROM supplier_esg e WHERE e.emissions_tonnes_co2e IS NOT NULL
        QUALIFY row_number() OVER (PARTITION BY e.supplier_id ORDER BY e.submission_year DESC) = 1
      ), pick AS (
        SELECT r.spend_rank, r.supplier_id, r.supplier_name, r.annual_spend_gbp, l.submission_year, l.emissions_tonnes_co2e,
               l.emissions_reduction_commitment_pct, l.emissions_reduction_target_year,
               round(l.emissions_tonnes_co2e * l.emissions_reduction_commitment_pct / 100.0) AS committed_reduction_tonnes,
               l.renewable_pct, l.submission_status
        FROM ranked r LEFT JOIN latest l ON l.supplier_id = r.supplier_id
        WHERE ($supplier_id IS NULL OR r.supplier_id = $supplier_id)
          AND ($top_suppliers_by_spend IS NULL OR (NOT r.inactive AND r.spend_rank <= $top_suppliers_by_spend))
          AND ($target_year IS NULL OR l.emissions_reduction_target_year = $target_year)
          AND ($supplier_id IS NOT NULL OR $top_suppliers_by_spend IS NOT NULL OR l.supplier_id IS NOT NULL)
      )
      SELECT * FROM (
        SELECT 1 AS grp, spend_rank, supplier_id, supplier_name, annual_spend_gbp, submission_year, emissions_tonnes_co2e,
               emissions_reduction_commitment_pct, emissions_reduction_target_year, committed_reduction_tonnes, renewable_pct, submission_status
        FROM pick
        UNION ALL
        SELECT 2, NULL, 'TOTAL', count(*) || ' suppliers, ' || count(emissions_reduction_commitment_pct) || ' with a commitment, '
               || count(emissions_tonnes_co2e) || ' reporting emissions', sum(annual_spend_gbp), NULL, sum(emissions_tonnes_co2e),
               round(100.0 * sum(committed_reduction_tonnes) / NULLIF(sum(emissions_tonnes_co2e), 0), 1), NULL,
               sum(committed_reduction_tonnes), NULL, NULL
        FROM pick
      ) t
      ORDER BY grp, spend_rank
    limit: 60
    example: {supplier_id: "SUP-0013"}

  - name: get_supplier_expedite_options
    desc: Latest stock and spare capacity per SKU with the quickest expedite route. Use to see what a supplier can bring forward and in what quantity.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional if sku is given)"}
      sku: {type: str, desc: "Product SKU (optional if supplier_id is given)"}
    sql: |
      SELECT * FROM (
        SELECT sp.supplier_id, s.name AS supplier_name, sp.sku, sp.available_stock_units, sp.available_capacity_units,
               CASE WHEN sp.available_stock_units >= sp.moq_units THEN 'ship from stock'
                    WHEN sp.available_stock_units > 0 THEN 'part from stock, rest from production'
                    WHEN sp.available_capacity_units > 0 THEN 'production only'
                    ELSE 'none' END AS expedite_route,
               sp.lead_time_days, sp.moq_units, sp.price_gbp_per_unit, sp.position_date
        FROM supply_position sp JOIN master.suppliers s ON s.supplier_id = sp.supplier_id
        WHERE sp.sku IS NOT NULL
          AND ($supplier_id IS NULL OR sp.supplier_id = $supplier_id)
          AND ($sku IS NULL OR sp.sku = $sku)
        QUALIFY row_number() OVER (PARTITION BY sp.supplier_id, sp.sku ORDER BY sp.position_date DESC) = 1
      ) t
      WHERE expedite_route <> 'none'
      ORDER BY available_stock_units DESC, sku
    limit: 50
    example: {supplier_id: SUP-0034, sku: SKU-101260}

  - name: get_supplier_lead_time_and_moq
    desc: Lead time and MOQ per supplier and product category, with ranges across its SKUs. Filter by supplier, country or category to compare sourcing options.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional)"}
      country: {type: str, desc: "Supplier country code, e.g. PT (optional)"}
      category: {type: str, desc: "Product category, e.g. Outerwear (optional)"}
      sku: {type: str, desc: "Product (optional)"}
    sql: |
      WITH latest AS (
        SELECT sp.* FROM supply_position sp
        WHERE sp.sku IS NOT NULL
        QUALIFY row_number() OVER (PARTITION BY sp.supplier_id, sp.sku ORDER BY sp.position_date DESC) = 1
      )
      SELECT l.supplier_id, s.name AS supplier_name, s.country, s.tier, p.category, count(*) AS skus,
             min(l.lead_time_days) AS min_lead_time_days, round(avg(l.lead_time_days)) AS avg_lead_time_days,
             max(l.lead_time_days) AS max_lead_time_days, min(l.moq_units) AS min_moq_units, max(l.moq_units) AS max_moq_units,
             round(avg(l.price_gbp_per_unit), 2) AS avg_price_gbp_per_unit, max(l.position_date) AS position_date
      FROM latest l
      JOIN master.suppliers s ON s.supplier_id = l.supplier_id
      JOIN master.products p ON p.sku = l.sku
      WHERE ($supplier_id IS NULL OR l.supplier_id = $supplier_id)
        AND ($country IS NULL OR s.country = upper($country))
        AND ($category IS NULL OR lower(p.category) = lower($category))
        AND ($sku IS NULL OR l.sku = $sku)
      GROUP BY l.supplier_id, s.name, s.country, s.tier, p.category
      ORDER BY avg_lead_time_days, l.supplier_id, p.category
    limit: 50
    example: {supplier_id: "SUP-0013"}

  - name: get_supplier_make_to_order_lead_times
    desc: Whether a supplier can make a SKU to order, with make-to-order lead time and MOQ against its normal stock-order terms. Filter by supplier, SKU or category.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional)"}
      sku: {type: str, desc: "Product SKU (optional)"}
      category: {type: str, desc: "Product category, e.g. Knitwear (optional)"}
    sql: |
      SELECT sp.supplier_id, s.name AS supplier_name, sp.sku, p.name AS product_name, p.category,
             CASE WHEN sp.mto_lead_time_days IS NULL THEN 'no' ELSE 'yes' END AS make_to_order_available,
             sp.mto_lead_time_days, sp.mto_moq_units,
             sp.lead_time_days AS stock_order_lead_time_days, sp.moq_units AS stock_order_moq_units, sp.price_gbp_per_unit
      FROM supply_position sp
      JOIN master.products p ON p.sku = sp.sku
      JOIN master.suppliers s ON s.supplier_id = sp.supplier_id
      WHERE ($supplier_id IS NULL OR sp.supplier_id = $supplier_id)
        AND ($sku IS NULL OR sp.sku = $sku)
        AND ($category IS NULL OR lower(p.category) = lower($category))
      QUALIFY row_number() OVER (PARTITION BY sp.supplier_id, sp.sku ORDER BY sp.position_date DESC) = 1
      ORDER BY make_to_order_available DESC, sp.mto_lead_time_days, sp.sku
    limit: 50
    example: {sku: SKU-102898}

  - name: get_supplier_material_origin_mix
    desc: Where materials originate, e.g. cotton by country, as share of supplier capacity with the suppliers and materials involved. Filter by supplier, fibre or material type.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier or mill id (optional)"}
      fibre: {type: str, desc: "Fibre in the composition, e.g. cotton (optional)"}
      material_type: {type: str, desc: "Material type, e.g. fabric (optional)"}
    sql: |
      SELECT o.origin_country,
             CASE o.origin_country WHEN 'IN' THEN 'India' WHEN 'US' THEN 'United States' WHEN 'CN' THEN 'China' WHEN 'BR' THEN 'Brazil'
               WHEN 'AU' THEN 'Australia' WHEN 'TR' THEN 'Turkey' WHEN 'UZ' THEN 'Uzbekistan' WHEN 'EG' THEN 'Egypt' ELSE o.origin_country END AS origin_name,
             count(DISTINCT m.supplier_id) AS suppliers, count(DISTINCT m.material_id) AS materials,
             sum(round(o.share_pct * m.capacity_monthly_units / 100.0)) AS origin_capacity_units_month,
             round(100.0 * sum(o.share_pct * m.capacity_monthly_units) / sum(sum(o.share_pct * m.capacity_monthly_units)) OVER (), 1) AS share_of_capacity_pct,
             round(avg(o.share_pct), 1) AS avg_share_in_material_pct, string_agg(DISTINCT m.supplier_id, ', ') AS supplier_ids
      FROM material_origins o JOIN material_supply m ON m.material_id = o.material_id
      WHERE ($supplier_id IS NULL OR m.supplier_id = $supplier_id)
        AND ($fibre IS NULL OR lower(m.composition) LIKE '%' || lower($fibre) || '%')
        AND ($material_type IS NULL OR m.material_type = $material_type)
      GROUP BY o.origin_country
      ORDER BY share_of_capacity_pct DESC
    limit: 30
    example: {fibre: cotton}

  - name: get_supplier_milestone_updates
    desc: Return supplier milestone updates on product launches and samples. Use to track sample progress.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT communication_id, supplier_id, sku, po_id, title, content,
             from_party, created_at, status, deadline
      FROM supplier_communications
      WHERE supplier_id = $supplier_id
        AND communication_type = 'milestone_update'
      ORDER BY created_at DESC
    limit: 50
    example: {supplier_id: "SUP-0013"}

  - name: get_supplier_portal_access_log
    desc: Pages and records accessed in the supplier portal. Use for security and audit review.
    kind: sql
    args:
      supplier_id: {required: true}
      lookback_days: {type: int, default: 30, desc: "Historical period"}
    sql: |
      SELECT communication_id, supplier_id, portal_page, accessed_at, status
      FROM supplier_communications
      WHERE supplier_id = $supplier_id
        AND communication_type = 'portal_access'
        AND accessed_at >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_days AS INT)) DAY
      ORDER BY accessed_at DESC
    limit: 200
    example: {supplier_id: "SUP-0013"}

  - name: get_supplier_renewable_energy_status
    desc: Renewable electricity share per supplier from its latest ESG submission, with a spend-weighted total. Use a supplier id, or top active suppliers by spend such as 20.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional)"}
      top_suppliers_by_spend: {type: int, desc: "Only the N suppliers with the highest annual spend, e.g. 20 (optional)"}
    sql: |
      WITH ranked AS (
        SELECT s.supplier_id, s.name AS supplier_name, s.country, s.annual_spend_gbp, s.status IN ('exited', 'blocked') AS inactive,
               row_number() OVER (PARTITION BY s.status IN ('exited', 'blocked') ORDER BY s.annual_spend_gbp DESC, s.supplier_id) AS spend_rank
        FROM master.suppliers s
      ), latest AS (
        SELECT e.* FROM supplier_esg e WHERE e.renewable_pct IS NOT NULL
        QUALIFY row_number() OVER (PARTITION BY e.supplier_id ORDER BY e.submission_year DESC) = 1
      ), pick AS (
        SELECT r.spend_rank, r.supplier_id, r.supplier_name, r.country, r.annual_spend_gbp, l.submission_year, l.renewable_pct,
               l.submission_type, l.submission_status, l.audit_evidence_provided, l.evidence_quality
        FROM ranked r LEFT JOIN latest l ON l.supplier_id = r.supplier_id
        WHERE ($supplier_id IS NULL OR r.supplier_id = $supplier_id)
          AND ($top_suppliers_by_spend IS NULL OR (NOT r.inactive AND r.spend_rank <= $top_suppliers_by_spend))
          AND ($supplier_id IS NOT NULL OR $top_suppliers_by_spend IS NOT NULL OR l.supplier_id IS NOT NULL)
      )
      SELECT * FROM (
        SELECT 1 AS grp, spend_rank, supplier_id, supplier_name, country, annual_spend_gbp, submission_year, renewable_pct,
               submission_type, submission_status, audit_evidence_provided, evidence_quality
        FROM pick
        UNION ALL
        SELECT 2, NULL, 'TOTAL', 'All ' || count(*) || ' suppliers, spend-weighted renewable share (' || count(renewable_pct) || ' reporting)', NULL,
               sum(annual_spend_gbp), NULL, round(sum(renewable_pct * annual_spend_gbp) / NULLIF(sum(annual_spend_gbp) FILTER (WHERE renewable_pct IS NOT NULL), 0), 1),
               NULL, NULL, NULL, NULL
        FROM pick
      ) t
      ORDER BY grp, spend_rank
    limit: 60
    example: {supplier_id: "SUP-0013"}

  - name: get_supplier_response_times
    desc: Return supplier response times to fit comments and other enquiries. Use to assess supplier responsiveness.
    kind: sql
    args:
      supplier_id: {required: true}
      communication_type: {type: str, desc: "Type (optional)"}
    sql: |
      SELECT communication_id, supplier_id, communication_type, title, response_time_hours,
             deadline, overdue, created_at
      FROM supplier_communications
      WHERE supplier_id = $supplier_id
        AND response_time_hours IS NOT NULL
        AND ($communication_type IS NULL OR communication_type = $communication_type)
      ORDER BY response_time_hours DESC
    limit: 100
    example: {supplier_id: "SUP-0013"}

  - name: get_supplier_ship_date_performance
    desc: How often a supplier missed its confirmed ship date in its latest orders versus the orders before, with on-time rate and trend. Use to assess delivery reliability.
    kind: sql
    args:
      supplier_id: {required: true}
      last_n_orders: {type: int, default: 10, desc: "Orders per comparison window"}
      grace_days: {type: int, default: 2, desc: "Days after the confirmed ship date still counted as on time"}
    sql: |
      WITH h AS (
        SELECT *, row_number() OVER (ORDER BY order_date DESC, po_id) AS rn
        FROM ship_date_history
        WHERE supplier_id = $supplier_id AND actual_ship_date IS NOT NULL
      ), w AS (
        SELECT *, CASE WHEN rn <= $last_n_orders THEN 'latest' WHEN rn <= 2 * $last_n_orders THEN 'previous' END AS period FROM h
      ), a AS (
        SELECT supplier_id, period, count(*) AS orders,
               count(*) FILTER (WHERE days_late > $grace_days) AS missed_ship_date,
               round(100.0 * count(*) FILTER (WHERE days_late > $grace_days) / count(*), 1) AS missed_pct,
               round(100.0 * count(*) FILTER (WHERE days_late <= $grace_days) / count(*), 1) AS on_time_pct,
               round(avg(days_late), 1) AS avg_days_late, max(days_late) AS worst_days_late,
               min(order_date) AS first_order_date, max(order_date) AS last_order_date
        FROM w WHERE period IS NOT NULL GROUP BY supplier_id, period
      )
      SELECT a.*, CASE WHEN a.period = 'latest' AND p.missed_pct IS NOT NULL THEN
                        CASE WHEN a.missed_pct > p.missed_pct THEN 'worsening' WHEN a.missed_pct < p.missed_pct THEN 'improving' ELSE 'stable' END END AS trend
      FROM a LEFT JOIN a p ON p.period = 'previous'
      ORDER BY a.period = 'previous'
    limit: 10
    example: {supplier_id: SUP-0070}

  - name: get_supplier_data_evidence_status
    desc: "Evidence status of supplier-supplied sustainability data (emissions, renewable energy): verified, self-reported or missing, with supplier counts, spend share and data quality. For one supplier, its history."
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier id (optional; omit for all suppliers)"}
      submission_year: {type: int, desc: "Reporting year, default the latest year with data (optional)"}
    sql: |
      SELECT CASE WHEN $supplier_id IS NULL THEN 'all suppliers' ELSE e.supplier_id END AS scope, e.submission_year, e.evidence_quality,
             count(*) AS suppliers, sum(CASE WHEN e.audit_evidence_provided THEN 1 ELSE 0 END) AS with_auditor_evidence,
             round(100.0 * sum(s.annual_spend_gbp) / sum(sum(s.annual_spend_gbp)) OVER (PARTITION BY e.submission_year), 1) AS share_of_spend_pct,
             round(avg(e.data_quality_score), 1) AS avg_data_quality_score,
             sum(CASE WHEN e.follow_up_needed THEN 1 ELSE 0 END) AS follow_up_needed,
             CASE WHEN $supplier_id IS NULL THEN NULL ELSE max(e.notes) END AS notes
      FROM supplier_esg e JOIN master.suppliers s ON s.supplier_id = e.supplier_id
      WHERE ($supplier_id IS NULL OR e.supplier_id = $supplier_id)
        AND e.submission_year = COALESCE($submission_year, (SELECT x.submission_year FROM supplier_esg x WHERE $supplier_id IS NULL OR x.supplier_id = $supplier_id GROUP BY x.submission_year ORDER BY count(*) DESC, x.submission_year DESC LIMIT 1))
      GROUP BY CASE WHEN $supplier_id IS NULL THEN 'all suppliers' ELSE e.supplier_id END, e.submission_year, e.evidence_quality
      ORDER BY e.submission_year DESC, suppliers DESC
    limit: 20
    example: {supplier_id: "SUP-0013"}

  - name: get_supply_dependency_for_supplier
    desc: Next quarter's planned volume with a supplier by department, as a share of all planned supply in that department and overall. Use for supply risk.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      WITH latest AS (
        SELECT sp.supplier_id, sp.sku, sp.next_quarter_units, sp.price_gbp_per_unit, p.department
        FROM supply_position sp JOIN master.products p ON p.sku = sp.sku
        QUALIFY row_number() OVER (PARTITION BY sp.supplier_id, sp.sku ORDER BY sp.position_date DESC) = 1
      ), dept AS (
        SELECT department, sum(next_quarter_units) AS dept_total FROM latest GROUP BY department
      ), mine AS (
        SELECT supplier_id, department, count(*) AS skus, sum(next_quarter_units) AS units,
               round(sum(next_quarter_units * price_gbp_per_unit)) AS value_gbp
        FROM latest WHERE supplier_id = $supplier_id GROUP BY supplier_id, department
      )
      SELECT m.supplier_id, m.department, m.skus, m.units AS next_quarter_units, m.value_gbp AS next_quarter_value_gbp,
             d.dept_total AS department_total_units,
             round(100.0 * m.units / NULLIF(d.dept_total, 0), 1) AS share_of_department_pct,
             round(100.0 * m.units / (SELECT sum(next_quarter_units) FROM latest), 1) AS share_of_all_supply_pct
      FROM mine m JOIN dept d ON d.department = m.department
      ORDER BY m.units DESC
    limit: 20
    example: {supplier_id: SUP-0070}

  - name: list_supplier_esg_submissions
    desc: ESG submissions by supplier and status. Use to track ESG data collection and quality.
    kind: sql
    args:
      submission_status: {type: enum, values: [not_submitted, submitted, pending_review, accepted, rejected, low_quality], desc: "Filter by status (optional)"}
      min_data_quality: {type: float, default: 0, desc: "Minimum data quality score"}
    sql: |
      SELECT supplier_id, submission_year, submission_status, submitted_date, data_quality_score,
             emissions_tonnes_co2e, renewable_pct, follow_up_needed
      FROM supplier_esg
      WHERE ($submission_status IS NULL OR submission_status = $submission_status)
        AND data_quality_score >= $min_data_quality
      ORDER BY submission_year DESC, supplier_id
    limit: 100
    example: {}

  - name: search_alternative_suppliers
    desc: Alternative suppliers by category, country and tier with OTIF, risk rating and typical lead time. Use to find backups for a failing supplier.
    kind: sql
    args:
      category_focus: {type: str, desc: "Supplier category focus, e.g. Accessories"}
      country: {type: str, desc: "Country code, e.g. TR"}
      tier: {type: enum, values: [strategic, preferred, approved], desc: "Supplier tier (optional)"}
      status: {type: str, default: active, desc: "Supplier status"}
      exclude_supplier_id: {type: str, desc: "Supplier to leave out, e.g. the one being replaced"}
    sql: |
      WITH lt AS (
        SELECT supplier_id, round(avg(lead_time_days)) AS typical_lead_time_days, sum(available_capacity_units) AS available_capacity_units
        FROM (SELECT * FROM supply_position WHERE sku IS NOT NULL
              QUALIFY row_number() OVER (PARTITION BY supplier_id, sku ORDER BY position_date DESC) = 1) x
        GROUP BY supplier_id
      )
      SELECT s.supplier_id, s.name, s.country, s.category_focus, s.tier, s.status, s.otif_pct_12m, s.risk_rating,
             lt.typical_lead_time_days, lt.available_capacity_units
      FROM master.suppliers s LEFT JOIN lt ON lt.supplier_id = s.supplier_id
      WHERE ($category_focus IS NULL OR s.category_focus ILIKE '%' || $category_focus || '%')
        AND ($country IS NULL OR upper(s.country) = upper($country))
        AND ($tier IS NULL OR s.tier = $tier)
        AND ($status IS NULL OR s.status = $status)
        AND ($exclude_supplier_id IS NULL OR s.supplier_id <> $exclude_supplier_id)
      ORDER BY s.otif_pct_12m DESC, s.supplier_id
    limit: 50
    example: {category_focus: Accessories, exclude_supplier_id: SUP-0070}

  - name: search_approved_material_suppliers
    desc: Search for approved material suppliers by material type and certification. Use for material sourcing.
    kind: sql
    args:
      material_type: {required: true}
      certification: {type: str, desc: "Certification (optional)"}
      country: {type: str, desc: "Country (optional)"}
    sql: |
      SELECT DISTINCT m.supplier_id, m.material_type, m.material_name, m.certifications, m.capacity_monthly_units,
             m.price_gbp_per_unit, m.stock_units_available, s.name, s.country
      FROM material_supply m
      JOIN master.suppliers s ON s.supplier_id = m.supplier_id
      WHERE m.material_type = $material_type
        AND ($certification IS NULL OR m.certifications ILIKE '%' || $certification || '%')
        AND ($country IS NULL OR s.country = $country)
      ORDER BY m.capacity_monthly_units DESC
    limit: 50
    example: {material_type: fabric}

  - name: search_supplier_price_increase_notices
    desc: Price increase notices received from suppliers, with percentage asked, effective date and reason, largest first. Filter by supplier, category or size.
    kind: sql
    args:
      supplier_id: {type: str, desc: "Supplier (optional)"}
      category: {type: str, desc: "Supplier category focus, e.g. Womenswear (optional)"}
      min_increase_pct: {type: float, default: 0, desc: "Only notices asking at least this percentage"}
      from_date: {type: date, default: "-180d", desc: "From date"}
      to_date: {type: date, default: "+30d", desc: "To date"}
    sql: |
      SELECT c.communication_id, c.supplier_id, s.name AS supplier_name, s.country, s.category_focus, c.title, c.content,
             c.increase_pct, c.effective_date, CAST(c.created_at AS DATE) AS received_on
      FROM supplier_communications c JOIN master.suppliers s ON s.supplier_id = c.supplier_id
      WHERE c.communication_type = 'price_increase_notice'
        AND CAST(c.created_at AS DATE) >= CAST($from_date AS DATE)
        AND CAST(c.created_at AS DATE) <= CAST($to_date AS DATE)
        AND ($supplier_id IS NULL OR c.supplier_id = $supplier_id)
        AND ($category IS NULL OR lower(s.category_focus) = lower($category))
        AND COALESCE(c.increase_pct, 0) >= $min_increase_pct
      ORDER BY c.increase_pct DESC NULLS LAST, c.created_at DESC
    limit: 100
    example: {}

  - name: send_sample_comments_to_supplier
    desc: Sends revised construction comments on a sample to the supplier. Returns the communication record.
    kind: insert
