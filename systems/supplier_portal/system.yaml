  - name: draft_supplier_variance_note
    desc: Draft a note to a supplier listing its receipt-versus-ASN variances with claimable value and claim deadlines. Read-only, nothing is sent.
    kind: draft
    args:
      supplier_id: {required: true}
      lookback_days: {type: int, default: 56, desc: "Review period in days"}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      variances: SELECT v.variance_id, v.po_id, v.sku, v.asn_quantity, v.receipt_quantity, v.variance_units, v.variance_reason,
                        round(v.variance_value_gbp, 2) AS variance_value_gbp, v.received_at, v.is_claimable,
                        CAST(v.received_at AS DATE) + CAST(v.claim_window_days AS INTEGER) AS claim_deadline,
                        (CAST(v.received_at AS DATE) + CAST(v.claim_window_days AS INTEGER)) - CAST($as_of AS DATE) AS days_left,
                        (v.is_claimable AND (CAST(v.received_at AS DATE) + CAST(v.claim_window_days AS INTEGER)) >= CAST($as_of AS DATE)) AS inside_window
                 FROM supplier_variances v
                 WHERE v.supplier_id = $supplier_id AND v.variance_units <> 0
                   AND v.received_at >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_days AS INT)) DAY
                 ORDER BY v.received_at DESC, v.po_id
      totals: SELECT count(*) FILTER (WHERE v.variance_units < 0) AS short_lines,
                     coalesce(sum(v.variance_value_gbp) FILTER (WHERE v.variance_units < 0), 0) AS short_value_gbp,
                     count(*) FILTER (WHERE v.is_claimable AND (CAST(v.received_at AS DATE) + CAST(v.claim_window_days AS INTEGER)) >= CAST($as_of AS DATE)) AS open_claim_lines,
                     coalesce(sum(v.variance_value_gbp) FILTER (WHERE v.is_claimable AND (CAST(v.received_at AS DATE) + CAST(v.claim_window_days AS INTEGER)) >= CAST($as_of AS DATE)), 0) AS open_claim_value_gbp,
                     coalesce(sum(v.variance_value_gbp) FILTER (WHERE v.is_claimable AND (CAST(v.received_at AS DATE) + CAST(v.claim_window_days AS INTEGER)) < CAST($as_of AS DATE)), 0) AS expired_claim_value_gbp
              FROM supplier_variances v
              WHERE v.supplier_id = $supplier_id AND v.variance_units <> 0
                AND v.received_at >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_days AS INT)) DAY
    template: |
      To: Supplier manager, {{ supplier[0].name }} ({{ supplier[0].supplier_id }})
      Subject: Receipt variances against your ASNs, last {{ lookback_days }} days

      We have compared goods received against your advance shipping notices and found these variances:
      {% for v in variances %}
      - {{ v.po_id }} / {{ v.sku }}: ASN {{ v.asn_quantity }}, received {{ v.receipt_quantity }} ({{ v.variance_units }} units, {{ v.variance_reason }}), value £{{ "{:,.2f}".format(v.variance_value_gbp) }}, received {{ v.received_at }}.{% if v.is_claimable and v.inside_window %} Claim window open until {{ v.claim_deadline }} ({{ v.days_left }} days left).{% elif v.is_claimable %} Claim window closed on {{ v.claim_deadline }}.{% else %} Not claimable.{% endif %}

      {% endfor %}
      Short-shipped value in the period: £{{ "{:,.2f}".format(totals[0].short_value_gbp) }} over {{ totals[0].short_lines }} lines.
      Claimable inside the window: £{{ "{:,.2f}".format(totals[0].open_claim_value_gbp) }} over {{ totals[0].open_claim_lines }} lines; lines now outside the claim window: £{{ "{:,.2f}".format(totals[0].expired_claim_value_gbp) }}.

      Please confirm the cause of each shortfall and the corrective action to prevent a repeat. We will raise claims for the lines still inside the window.

      Regards,
      Harbour & Vale Supply Chain
    example: {supplier_id: SUP-0013}

  - name: draft_supplier_chaser_email
    desc: Draft chaser emails for missing or poor ESG data. Returns email text.
    kind: draft
    args:
      supplier_id: {required: true}
    sql:
      supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
      esg: SELECT * FROM supplier_esg WHERE supplier_id = $supplier_id
           AND submission_status IN ('not_submitted', 'low_quality', 'rejected')
           ORDER BY submission_year DESC LIMIT 1
    template: |
      To: {{ supplier[0].name }}

      Subject: ESG Data Submission Required

      We are reaching out to request your ESG data submission for {{ esg[0].submission_year }}.

      {% if esg[0].submission_status == 'not_submitted' %}
      We have not yet received your submission. Please send by Friday.
      {% elif esg[0].submission_status == 'low_quality' %}
      Your previous submission has data quality issues noted below. Please resubmit with corrections:
      {{ esg[0].notes }}
      {% elif esg[0].submission_status == 'rejected' %}
      Your submission was rejected. Please address the following and resubmit:
      {{ esg[0].notes }}
      {% endif %}

      Contact your account manager with any questions.

      Regards,
      ESG Team
    example: {supplier_id: "SUP-0013"}

  - name: get_forecast_accuracy_shared_with_supplier
    desc: "Accuracy of the volume forecasts we shared with a supplier, per four-week period: forecast against actual, error and bias. Use for supplier business reviews."
    kind: sql
    args:
      supplier_id: {required: true}
      lookback_months: {type: int, default: 6, desc: "Review period"}
    sql: |
      SELECT f.supplier_id, s.name AS supplier_name, f.period_start, f.period_end, f.horizon_weeks, f.forecast_units, f.actual_units,
             f.forecast_units - f.actual_units AS error_units,
             round(100.0 - 100.0 * abs(f.forecast_units - f.actual_units) / NULLIF(f.actual_units, 0), 1) AS accuracy_pct,
             round(100.0 * (f.forecast_units - f.actual_units) / NULLIF(f.actual_units, 0), 1) AS bias_pct,
             CASE WHEN f.forecast_units > f.actual_units THEN 'over-forecast' ELSE 'under-forecast' END AS direction,
             round(100.0 - 100.0 * sum(abs(f.forecast_units - f.actual_units)) OVER () / NULLIF(sum(f.actual_units) OVER (), 0), 1) AS period_accuracy_pct,
             'accuracy = 100 - |forecast - actual| / actual; bias > 0 means we over-forecast' AS formula
      FROM supplier_forecasts f JOIN master.suppliers s ON s.supplier_id = f.supplier_id
      WHERE f.supplier_id = $supplier_id
        AND f.period_start >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_months AS INT)) MONTH
        AND f.period_end < CAST($as_of AS DATE)
      ORDER BY f.period_start DESC
    limit: 52
    example: {supplier_id: "SUP-0036"}

  - name: get_supplier_comments_on_sample
    desc: Return supplier comments on sample. Use to understand sample feedback.
    kind: sql
    args:
      supplier_id: {required: true}
