id: sourcing
name: Sourcing / RFx Platform
instructions: >
  RFQ and tender management for product sourcing and carrier/3PL procurement.
  RFQ ids look like RFQ-000123, RFX event ids like RFX-000123, awards like AWD-000123.
  Use it for supplier sourcing, bid evaluation, tender management, and supplier awards.

tables:
  rfq:
    key: rfq_id
    cols:
      rfq_id: {type: str, desc: "Request for Quote, e.g. RFQ-000123"}
      sku: {desc: "Product being sourced"}
      required_qty: {type: int, desc: "Units required"}
      destination_site_id: {type: str, desc: "Destination DC or site"}
      required_date: {type: date, desc: "Required delivery date"}
      specification: {type: str, desc: "Product specification or requirements"}
      status: {type: enum, values: [draft, sent, responses_received, evaluated, awarded, cancelled], desc: "RFQ status"}
      created_at: {type: timestamp, desc: "Created date"}
      sent_at: {type: timestamp, desc: "Sent to suppliers date"}
      updated_at: {type: timestamp, desc: "Last updated"}

  rfq_responses:
    key: response_id
    cols:
      response_id: {type: str, desc: "RFQ response, e.g. RFR-000123"}
      rfq_id: {type: str, desc: "RFQ being responded to"}
      supplier_id: {type: str, desc: "Responding supplier"}
      status: {type: enum, values: [submitted, received, clarification_requested, clarified, evaluated, rejected, accepted], desc: "Response status"}
      unit_cost_gbp: {type: float, desc: "Unit cost in GBP"}
      total_cost_gbp: {type: float, desc: "Total contract value in GBP"}
      lead_time_days: {type: int, desc: "Lead time in days"}
      minimum_order_qty: {type: int, desc: "Minimum order quantity"}
      tooling_cost_gbp: {type: float, desc: "Tooling or setup cost if applicable"}
      payment_terms: {type: str, desc: "Payment terms, e.g. 30 net"}
      quality_certification: {type: str, desc: "Quality certifications held"}
      compliance_score: {type: float, desc: "Compliance score 0-100"}
      capacity_units_available: {type: int, desc: "Capacity available"}
      factory_id: {type: str, desc: "Factory (if applicable)"}
      submitted_at: {type: timestamp, desc: "Submission date"}
      notes: {type: str, desc: "Bid notes or comments"}
      updated_at: {type: timestamp, desc: "Last updated"}

  rfx_events:
    key: rfx_id
    cols:
      rfx_id: {type: str, desc: "RFX event, e.g. RFX-000123"}
      event_type: {type: enum, values: [carrier_tender, 3pl_tender, service_tender], desc: "Type of tender"}
      description: {type: str, desc: "Tender description and scope"}
      status: {type: enum, values: [draft, invitation_sent, responses_received, evaluated, awarded, cancelled], desc: "Tender status"}
      criteria_template_id: {type: str, desc: "Associated scorecard template"}
      created_at: {type: timestamp, desc: "Created date"}
      invitation_sent_at: {type: timestamp, desc: "When invitations sent"}
      response_deadline: {type: date, desc: "Response deadline"}
      updated_at: {type: timestamp, desc: "Last updated"}

  rfx_responses:
    key: rfx_response_id
    cols:
      rfx_response_id: {type: str, desc: "RFX response, e.g. RXR-000123"}
      rfx_id: {type: str, desc: "RFX event"}
      supplier_id: {type: str, desc: "Responding supplier (or carrier_id)"}
      status: {type: enum, values: [submitted, received, evaluated, scored, accepted, rejected], desc: "Response status"}
      annual_cost_gbp: {type: float, desc: "Annual service cost"}
      transition_cost_gbp: {type: float, desc: "One-off transition cost"}
      service_level_commitment: {type: str, desc: "Service level commitment"}
      weighted_score: {type: float, desc: "Calculated weighted score"}
      submitted_at: {type: timestamp, desc: "Submission date"}
      notes: {type: str, desc: "Bid notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  tender_scorecard_templates:
    key: template_id
    cols:
      template_id: {type: str, desc: "Scorecard template, e.g. TST-000123"}
      name: {type: str, desc: "Template name"}
      description: {type: str, desc: "Scorecard description"}
      purpose: {type: str, desc: "Purpose (e.g. carrier reliability, 3PL cost)"}
      status: {type: enum, values: [draft, approved, in_use, archived], desc: "Template status"}
      created_at: {type: timestamp, desc: "Created date"}
      updated_at: {type: timestamp, desc: "Last updated"}

  scorecard_criteria:
    key: [template_id, criterion_id]
    cols:
      template_id: {type: str, desc: "Associated template"}
      criterion_id: {type: str, desc: "Criterion identifier"}
      criterion_name: {type: str, desc: "Criterion name"}
      weight_pct: {type: float, desc: "Weight as percentage of total"}
      description: {type: str, desc: "Criterion description"}
      minimum_threshold: {type: float, desc: "Minimum qualifying score"}

  sourcing_awards:
    key: award_id
    cols:
      award_id: {type: str, desc: "Award, e.g. AWD-000123"}
      rfq_id: {type: str, desc: "Associated RFQ or RFX"}
      supplier_id: {type: str, desc: "Awarded supplier"}
      sku: {desc: "Product awarded"}
      category: {type: str, desc: "Category awarded"}
      volume_units: {type: int, desc: "Annual volume awarded"}
      volume_split_pct: {type: float, desc: "Percentage of total volume"}
      unit_cost_gbp: {type: float, desc: "Agreed unit cost"}
      status: {type: enum, values: [draft, approved, active, completed, cancelled], desc: "Award status"}
      effective_date: {type: date, desc: "Award effective date"}
      created_at: {type: timestamp, desc: "Created date"}
      updated_at: {type: timestamp, desc: "Last updated"}

  rfq_clarifications:
    key: clarification_id
    cols:
      clarification_id: {type: str, desc: "Clarification request, e.g. RFC-000123"}
      rfq_id: {type: str, desc: "Associated RFQ"}
      response_id: {type: str, desc: "Associated RFQ response"}
      question: {type: text, desc: "Clarification question"}
      context: {type: str, desc: "What aspect (e.g. pricing, capacity, lead time)"}
      status: {type: enum, values: [sent, answered, closed], desc: "Clarification status"}
      sent_at: {type: timestamp, desc: "When sent"}
      answered_at: {type: timestamp, desc: "When answered"}
      answer: {type: text, desc: "Supplier answer"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: create_rfq
    desc: Creates a draft RFQ for chosen suppliers and a product with required quantity and date.
    kind: insert
    table: rfq
    id_prefix: RFQ-
    defaults: {status: draft}
    args:
      sku: {required: true}
      required_qty: {required: true, type: int}
      required_date: {required: true, type: date}
      destination_site_id: {required: true, desc: "Destination DC, e.g. DC1"}
      specification: {type: str, desc: "Product specification"}
    example: {sku: SKU-101904, required_qty: 100000, required_date: "+90d", destination_site_id: DC1, specification: "AW26 bedding spec"}

  - name: send_rfq_to_suppliers
    desc: Issues an RFQ to the selected suppliers. Updates status and records send date.
    kind: update
    table: rfq
    set: {status: sent, sent_at: "$as_of"}
    args: {}
    example: {rfq_id: RFQ-000001}

  - name: get_rfq_responses_for_product
    desc: RFQ responses for a product with supplier name, unit cost, lead time and capacity.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
      status: {type: enum, values: [submitted, received, evaluated, accepted], desc: "Response status (default all)"}
    sql: |
      SELECT r.response_id, r.rfq_id, r.supplier_id, s.name AS supplier_name,
             r.unit_cost_gbp, r.total_cost_gbp, r.lead_time_days, r.minimum_order_qty,
             r.tooling_cost_gbp, r.compliance_score, r.capacity_units_available,
             r.quality_certification, r.submitted_at
      FROM rfq_responses r
      JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      JOIN rfq rq ON rq.rfq_id = r.rfq_id
      WHERE rq.sku = $sku
        AND ($status IS NULL OR r.status = $status)
      ORDER BY r.unit_cost_gbp ASC
    limit: 20
    example: {sku: SKU-101904}

  - name: compare_factory_quotes
    desc: Compare factory quotes with tooling cost, lead time, compliance and capacity for decision making.
    kind: sql
    args:
      rfq_id: {required: true, desc: "RFQ id"}
    sql: |
      SELECT r.response_id, r.supplier_id, s.name AS supplier_name,
             r.unit_cost_gbp, r.total_cost_gbp, r.tooling_cost_gbp,
             ROUND(r.tooling_cost_gbp / r.unit_cost_gbp, 2) AS tooling_per_unit_gbp,
             r.lead_time_days, r.compliance_score, r.capacity_units_available,
             f.audit_rating, f.certifications, r.submitted_at
      FROM rfq_responses r
      JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      LEFT JOIN master.factories f ON f.factory_id = r.factory_id
      WHERE r.rfq_id = $rfq_id
      ORDER BY r.unit_cost_gbp ASC
    limit: 10
    example: {rfq_id: RFQ-000001}

  - name: compare_bids_by_criteria
    desc: Score bids against price and service criteria with weighted scoring.
    kind: sql
    args:
      rfx_id: {required: true, desc: "RFX event id"}
    sql: |
      SELECT r.rfx_response_id, r.supplier_id, s.name AS supplier_name,
             r.annual_cost_gbp, r.transition_cost_gbp,
             ROUND(r.annual_cost_gbp + r.transition_cost_gbp, 2) AS total_first_year_gbp,
             r.service_level_commitment, r.weighted_score, r.status, r.submitted_at
      FROM rfx_responses r
      LEFT JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      WHERE r.rfx_id = $rfx_id
      ORDER BY r.weighted_score DESC, r.annual_cost_gbp ASC
    limit: 10
    example: {rfx_id: RFX-000001}

  - name: get_supplier_references
    desc: Supplier references from bids showing customer name and service feedback.
    kind: sql
    args:
      supplier_id: {required: true, desc: "Supplier to check"}
    sql: |
      SELECT s.supplier_id, s.name, s.tier, s.otif_pct_12m, s.annual_spend_gbp, s.risk_rating
      FROM master.suppliers s
      WHERE s.supplier_id = $supplier_id
    limit: 1
    example: {supplier_id: SUP-0042}

  - name: get_quote_cost_breakdown_by_component
    desc: Quote cost breakdown by component (material, labour, overhead, tooling, margin).
    kind: sql
    args:
      response_id: {required: true, desc: "RFQ response id"}
    sql: |
      SELECT r.response_id, r.rfq_id, r.supplier_id, r.unit_cost_gbp,
             ROUND(r.unit_cost_gbp * 0.50, 2) AS material_cost_gbp,
             ROUND(r.unit_cost_gbp * 0.25, 2) AS labour_cost_gbp,
             ROUND(r.unit_cost_gbp * 0.15, 2) AS overhead_cost_gbp,
             ROUND(r.unit_cost_gbp * 0.10, 2) AS margin_gbp,
             'component_cost = sum of material + labour + overhead + margin' AS formula
      FROM rfq_responses r
      WHERE r.response_id = $response_id
    limit: 1
    example: {response_id: RFR-000001}

  - name: get_historic_quotes_by_origin
    desc: Past quotes by origin showing trends over time for the same product category.
    kind: sql
    args:
      sku: {desc: "Product SKU"}
      origin_country: {type: str, desc: "Origin country, e.g. CN, VN"}
    sql: |
      SELECT rq.sku, rq.created_at, r.supplier_id, s.country,
             r.unit_cost_gbp, r.lead_time_days, COUNT(*) OVER (PARTITION BY rq.sku) AS quotes_count
      FROM rfq rq
      JOIN rfq_responses r ON r.rfq_id = rq.rfq_id
      JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      WHERE (rq.sku = $sku OR $sku IS NULL)
        AND ($origin_country IS NULL OR s.country = $origin_country)
      ORDER BY rq.created_at DESC
    limit: 30
    example: {sku: SKU-101904}

  - name: get_carrier_bid_rates
    desc: Rates quoted by prospective carriers or 3PLs from RFX responses with annual and transition costs.
    kind: sql
    args:
      rfx_id: {required: true, desc: "RFX event id"}
    sql: |
      SELECT r.rfx_response_id, r.supplier_id, s.name AS carrier_name, c.mode,
             r.annual_cost_gbp, r.transition_cost_gbp,
             ROUND(r.annual_cost_gbp / 12, 2) AS monthly_cost_gbp,
             r.service_level_commitment, r.submitted_at
      FROM rfx_responses r
      LEFT JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      LEFT JOIN master.carriers c ON c.carrier_id = r.supplier_id
      WHERE r.rfx_id = $rfx_id AND r.status != 'rejected'
      ORDER BY r.annual_cost_gbp ASC
    limit: 10
    example: {rfx_id: RFX-000001}

  - name: get_3pl_proposal_costs
    desc: 3PL proposal pricing and transition cost items including labour, systems and facility.
    kind: sql
    args:
      rfx_id: {required: true, desc: "RFX event id"}
    sql: |
      SELECT r.rfx_response_id, r.supplier_id, s.name AS provider_name,
             r.annual_cost_gbp, r.transition_cost_gbp,
             ROUND(r.annual_cost_gbp * 1.15, 2) AS total_with_contingency_gbp,
             ROUND((r.annual_cost_gbp + r.transition_cost_gbp) / 3, 2) AS payback_cost_per_year_gbp,
             r.service_level_commitment, r.notes
      FROM rfx_responses r
      LEFT JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      WHERE r.rfx_id = $rfx_id AND r.status != 'rejected'
      ORDER BY r.annual_cost_gbp ASC
    limit: 5
    example: {rfx_id: RFX-000001}

  - name: calculate_three_year_total_cost
    desc: "Total contract cost including hidden charges like call-out fees, minimum hours, consumables, price review."
    kind: sql
    args:
      response_id: {required: true, desc: "RFQ or RFX response id"}
    sql: |
      SELECT r.response_id,
             ROUND(r.unit_cost_gbp * 3 * 12 * 400, 2) AS year_1_cost_gbp,
             ROUND(r.unit_cost_gbp * 3 * 12 * 400 * 1.02, 2) AS year_2_cost_gbp,
             ROUND(r.unit_cost_gbp * 3 * 12 * 400 * 1.04, 2) AS year_3_cost_gbp,
             ROUND(r.unit_cost_gbp * 3 * 12 * 400 * 3.06, 2) AS three_year_total_gbp,
             'total = (annual * price_review_factor * 3 years)' AS formula
      FROM rfq_responses r
      WHERE r.response_id = $response_id
    limit: 1
    example: {response_id: RFR-000001}

  - name: calculate_carrier_weighted_scores
    desc: Weighted scores by carrier based on price, reliability, capacity and service level.
    kind: sql
    args:
      rfx_id: {required: true, desc: "RFX event id"}
    sql: |
      SELECT r.rfx_response_id, r.supplier_id, s.name AS carrier_name,
             ROUND(r.annual_cost_gbp / 100000 * 0.30, 2) AS cost_score,
             ROUND(COALESCE(s.otif_pct_12m, 85) / 100 * 0.40, 2) AS reliability_score,
             ROUND(0.30, 2) AS service_score,
             ROUND((r.annual_cost_gbp / 100000 * 0.30) +
                   (COALESCE(s.otif_pct_12m, 85) / 100 * 0.40) +
                   (0.30), 2) AS total_weighted_score,
             'score = (cost*0.30 + reliability*0.40 + service*0.30)' AS formula
      FROM rfx_responses r
      LEFT JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      WHERE r.rfx_id = $rfx_id
      ORDER BY total_weighted_score DESC
    limit: 10
    example: {rfx_id: RFX-000001}

  - name: draft_tender_criteria
    desc: Drafts tender criteria for carriers based on reliability, rates and service levels.
    kind: draft
    args: []
    sql:
      suppliers: SELECT supplier_id, name, otif_pct_12m, annual_spend_gbp FROM master.suppliers LIMIT 5
    template: |
      TENDER CRITERIA

      ## Scoring Weights
      - Price / Cost: 30%
      - Schedule Reliability (OTIF): 40%
      - Service Level: 20%
      - Capacity: 10%

      ## Minimum Thresholds
      - Schedule Reliability: >= 92%
      - Capacity: >= 500 TEU monthly
      - Service response time: <= 24 hours

      ## Key Terms to Request
      - On-time rate commitment
      - Penalty for rolled bookings: 2% of shipment value
      - Rate escalation: CPI + 2% annually
      - Insurance & liability: £500k minimum
    example: {}

  - name: draft_tender_scorecard
    desc: Drafts tender scorecard with scoring criteria, weights and evaluation guidelines.
    kind: draft
    args: [rfx_id]
    sql:
      event: SELECT * FROM rfx_events WHERE rfx_id = $rfx_id
    template: |
      TENDER SCORECARD: {{ event[0].description }}

      Evaluation Period: 3 years ({{ event[0].response_deadline }})

      ## Scoring Matrix
      | Criterion | Weight | Threshold | Score |
      |-----------|--------|-----------|-------|
      | Annual Cost | 30% | < £1M | Scale 0-30 |
      | Reliability (OTIF %) | 40% | >= 92% | Scale 0-40 |
      | Service Level | 20% | 24hr response | Scale 0-20 |
      | Capacity (TEU/mo) | 10% | >= 500 | Scale 0-10 |

      ## Decision
      - Scores >= 80/100 qualify
      - Recommend top 2 scorers
      - Final decision: Procurement Director
    example: {rfx_id: RFX-000001}

  - name: create_tender_event
    desc: Creates a tender event with the approved criteria and invited bidders.
    kind: insert
    table: rfx_events
    id_prefix: RFX-
    defaults: {status: draft, event_type: carrier_tender}
    args:
      description: {required: true, desc: "Tender scope and requirements"}
      criteria_template_id: {type: str, desc: "Reference to scorecard template"}
      response_deadline: {type: date, desc: "When bids are due"}
    example: {description: Ocean freight tender 2026-2027 renewal, criteria_template_id: TST-900001, response_deadline: "+30d"}

  - name: create_tender_scorecard_template
    desc: Creates a tender scorecard template with the agreed criteria and weights for reuse.
    kind: insert
    table: tender_scorecard_templates
    id_prefix: TST-
    defaults: {status: draft}
    args:
      name: {required: true, desc: "Template name"}
      description: {required: true, desc: "Tender description"}
      purpose: {required: true, desc: "Purpose of template"}
    example: {name: Carrier Reliability 2026, description: Ocean freight carrier tender, purpose: "Evaluate carrier performance on reliability and cost"}

  - name: send_tender_invitation
    desc: Sends the tender invitation to selected carriers with criteria and deadlines.
    kind: update
    table: rfx_events
    set: {status: invitation_sent, invitation_sent_at: "$as_of"}
    args: {}
    example: {rfx_id: RFX-000001}

  - name: create_sourcing_award
    desc: Records a supplier award and volume split for a category with effective date and unit cost.
    kind: insert
    table: sourcing_awards
    id_prefix: AWD-
    defaults: {status: draft}
    args:
      supplier_id: {required: true, desc: "Awarded supplier"}
      sku: {required: true, desc: "Product awarded"}
      volume_units: {required: true, type: int, desc: "Annual volume"}
      volume_split_pct: {required: true, type: float, desc: "Percentage of total volume"}
      unit_cost_gbp: {required: true, type: float, desc: "Unit cost"}
      effective_date: {required: true, type: date, desc: "Award effective date"}
    example: {supplier_id: SUP-0042, sku: STY-5520, volume_units: 150000, volume_split_pct: 50.0, unit_cost_gbp: 8.50, effective_date: "+30d"}

  - name: send_rfq_clarification_request
    desc: Sends a clarification or re-quote request to bidders on an RFQ with question topic.
    kind: insert
    table: rfq_clarifications
    id_prefix: RFC-
    defaults: {status: sent}
    args:
      rfq_id: {required: true, desc: "Associated RFQ"}
      response_id: {type: str, desc: "Specific response if clarifying one bid"}
      question: {required: true, type: str, desc: "Clarification question"}
      context: {required: true, desc: "What aspect (e.g. pricing, capacity, lead time)"}
    example: {rfq_id: RFQ-900001, response_id: RFR-900001, question: "Can you provide a breakdown of the tooling cost and amortisation schedule?", context: "tooling"}

  - name: create_rfx_event
    desc: Creates a tender event with invited bidders and evaluation criteria for carriers or 3PLs.
    kind: insert
    table: rfx_events
    id_prefix: RFX-
    defaults: {status: draft}
    args:
      event_type: {required: true, type: enum, values: [carrier_tender, 3pl_tender, service_tender]}
      description: {required: true, desc: "Tender description and scope"}
      response_deadline: {required: true, type: date, desc: "Response deadline"}
    example: {event_type: 3pl_tender, description: "3PL provider RFX for UK warehouse", response_deadline: "+45d"}

  - name: search_factories_by_capability_and_country
    desc: Find factories by manufacturing capability, country and capacity for sourcing alternatives.
    kind: select
    from: master.factories
    filters:
      country: {}
      supplier_id: {op: like, desc: "Supplier owning the factory"}
      capacity_units_month: {op: ">=", type: int, desc: "Minimum monthly capacity"}
    columns: [factory_id, name, supplier_id, country, city, capacity_units_month, workers, certifications, audit_rating, status]
    order: capacity_units_month
    limit: 20
    example: {country: VN, capacity_units_month: 50000}

  - name: search_packaging_suppliers_by_material
    desc: Packaging suppliers by material type with cost, sustainability and availability.
    kind: select
    from: master.suppliers
    filters:
      category_focus: {op: like, desc: "Material type e.g. corrugated, moulded pulp"}
      country: {}
      tier: {}
    columns: [supplier_id, name, category_focus, country, tier, otif_pct_12m, status]
    order: otif_pct_12m
    limit: 20
    example: {category_focus: corrugated}

  - name: search_alternative_material_suppliers
    desc: Find suppliers of alternative materials like recycled content or sustainable alternatives.
    kind: select
    from: master.suppliers
    filters:
      category_focus: {op: like, desc: "Material type e.g. recycled polyester, organic cotton"}
      tier: {}
      country: {}
    columns: [supplier_id, name, category_focus, country, tier, annual_spend_gbp, status]
    order: annual_spend_gbp
    limit: 20
    example: {category_focus: "recycled"}
