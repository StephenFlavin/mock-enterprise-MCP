id: sourcing
name: Sourcing / RFx Platform
instructions: >
  RFQs to suppliers and factories (RFQ-000123, responses RFR-000123), tenders for carriers, 3PLs and services
  (RFX-000123, bids RXR-000123), scorecard templates (TST-000123), awards (AWD-000123), factory capability
  and material/packaging supplier directories. Suppliers SUP-, factories FAC-, carriers CAR-.

tables:
  rfq:
    key: rfq_id
    cols:
      rfq_id: {type: str, desc: "Request for quote, e.g. RFQ-900001"}
      product_name: {type: str, desc: "Product description when there is no SKU yet, e.g. Insulated lunch box"}
      sku: {desc: "Product being sourced, blank for new products or ranges"}
      required_qty: {type: int, desc: "Units required"}
      destination_site_id: {type: str, desc: "Destination DC, e.g. DC1"}
      required_date: {type: date, desc: "Required delivery date"}
      expected_unit_cost_gbp: {type: float, desc: "Expected or target unit cost the buyer is benchmarking quotes against"}
      specification: {type: text, desc: "Specification or requirements sent to bidders"}
      invited_supplier_ids: {type: str, desc: "Comma-separated suppliers invited to quote, e.g. SUP-0058,SUP-0036"}
      status: {type: enum, values: [draft, sent, responses_received, evaluated, awarded, cancelled], desc: "RFQ status"}
      created_at: {type: timestamp, desc: "Created date"}
      issued_at: {type: timestamp, desc: "Date the RFQ was issued to suppliers"}
      updated_at: {type: timestamp, desc: "Last updated"}

  rfq_responses:
    key: response_id
    cols:
      response_id: {type: str, desc: "RFQ response, e.g. RFR-900001"}
      rfq_id: {type: str, desc: "RFQ being responded to"}
      supplier_id: {type: str, desc: "Responding supplier"}
      factory_id: {type: str, desc: "Factory that would make the product"}
      status: {type: enum, values: [submitted, received, clarification_requested, clarified, evaluated, rejected, accepted], desc: "Response status"}
      unit_cost_gbp: {type: float, desc: "Quoted unit cost in GBP (FOB)"}
      total_cost_gbp: {type: float, desc: "Quoted total value in GBP (unit cost x RFQ quantity)"}
      lead_time_days: {type: int, desc: "Quoted lead time in days"}
      minimum_order_qty: {type: int, desc: "Minimum order quantity"}
      tooling_cost_gbp: {type: float, desc: "One-off tooling or setup cost, 0 if none"}
      payment_terms: {type: str, desc: "Payment terms, e.g. 30 net"}
      quality_certification: {type: str, desc: "Certifications held by the factory"}
      compliance_score: {type: float, desc: "Compliance record score 0-100 from audits and documents supplied"}
      capacity_units_available: {type: int, desc: "Capacity the bidder can commit for this order"}
      capability_notes: {type: text, desc: "Capability and experience for this product, gaps and risks"}
      submitted_at: {type: timestamp, desc: "Submission date"}
      notes: {type: str, desc: "Buyer notes on the bid"}
      updated_at: {type: timestamp, desc: "Last updated"}

  quote_cost_components:
    key: [response_id, component]
    cols:
      response_id: {type: str, desc: "RFQ response the breakdown belongs to"}
      component: {type: enum, values: [material, labour, overhead_freight, tooling_amortised], desc: "Cost component of the unit price"}
      unit_cost_gbp: {type: float, desc: "Quoted cost of this component per unit"}
      expected_unit_cost_gbp: {type: float, desc: "Expected cost of this component per unit, from the buyer's own cost build-up"}

  rfx_events:
    key: rfx_id
    cols:
      rfx_id: {type: str, desc: "Tender event, e.g. RFX-900001"}
      event_type: {type: enum, values: [carrier_tender, 3pl_tender, service_tender], desc: "Type of tender"}
      description: {type: str, desc: "Tender description and scope"}
      lanes: {type: str, desc: "Lanes or sites in scope, e.g. Asia-Europe"}
      invited_carrier_ids: {type: str, desc: "Comma-separated carriers invited, e.g. CAR-006,CAR-007"}
      invited_bidders: {type: str, desc: "Comma-separated invited bidders that are not carriers (3PLs, contractors)"}
      term_years: {type: int, desc: "Contract term in years"}
      assumed_call_outs_per_year: {type: int, desc: "Call-outs a year assumed when pricing service tenders"}
      status: {type: enum, values: [draft, invitation_sent, responses_received, evaluated, awarded, cancelled], desc: "Tender status"}
      criteria_template_id: {type: str, desc: "Scorecard template used to evaluate bids"}
      created_at: {type: timestamp, desc: "Created date"}
      invitation_sent_at: {type: timestamp, desc: "When invitations were sent"}
      response_deadline: {type: date, desc: "Response deadline"}
      updated_at: {type: timestamp, desc: "Last updated"}

  rfx_responses:
    key: rfx_response_id
    cols:
      rfx_response_id: {type: str, desc: "Tender bid, e.g. RXR-900010"}
      rfx_id: {type: str, desc: "Tender event"}
      supplier_id: {type: str, desc: "Bidding supplier, blank when the bidder is a carrier or not in master data"}
      carrier_id: {type: str, desc: "Bidding carrier, blank for other bidders"}
      bidder_name: {type: str, desc: "Bidder name when it is a contractor or 3PL that is not in master data"}
      status: {type: enum, values: [submitted, received, evaluated, scored, accepted, rejected], desc: "Bid status"}
      annual_cost_gbp: {type: float, desc: "Annual price or service cost in GBP"}
      transition_cost_gbp: {type: float, desc: "One-off transition or mobilisation cost in GBP"}
      call_out_fee_gbp: {type: float, desc: "Fee per call-out in GBP, 0 if included"}
      consumables_gbp_per_year: {type: float, desc: "Consumables charged separately each year in GBP, 0 if included"}
      minimum_hours_per_week: {type: float, desc: "Minimum paid hours a week the bidder requires"}
      price_review_pct: {type: float, desc: "Annual price uplift clause in percent"}
      payment_terms: {type: str, desc: "Payment terms, e.g. Net 30"}
      service_level_pct: {type: float, desc: "Committed service level in percent, e.g. share of tasks done or deliveries on time"}
      service_level_commitment: {type: str, desc: "Service level wording"}
      submitted_at: {type: timestamp, desc: "Submission date"}
      notes: {type: str, desc: "Bid notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  rfx_response_scores:
    key: [rfx_response_id, criterion_key]
    cols:
      rfx_response_id: {type: str, desc: "Tender bid or baseline carrier scored"}
      criterion_key: {type: enum, values: [on_time, damage_loss, cost, compliance, tracking, sustainability], desc: "Scorecard criterion"}
      score: {type: float, desc: "Score 1 (poor) to 5 (excellent)"}
      evidence: {type: str, desc: "Evidence behind the score"}

  bid_references:
    key: reference_id
    cols:
      reference_id: {type: str, desc: "Reference check, e.g. REF-900001"}
      rfx_response_id: {type: str, desc: "Bid the reference was given for"}
      reference_customer: {type: str, desc: "Customer named as reference"}
      outcome: {type: enum, values: [positive, negative, declined], desc: "Result of the reference call"}
      feedback: {type: text, desc: "What the customer said about service"}
      checked_at: {type: timestamp, desc: "When the reference was checked"}

  tender_scorecard_templates:
    key: template_id
    cols:
      template_id: {type: str, desc: "Scorecard template, e.g. TST-900001"}
      name: {type: str, desc: "Template name"}
      description: {type: str, desc: "What the scorecard is for"}
      purpose: {type: str, desc: "Purpose, e.g. carrier reliability, 3PL cost"}
      criteria_weights: {type: text, desc: "Criteria with weights and minimum thresholds, e.g. On-time delivery 30%; Damage and loss 25%"}
      status: {type: enum, values: [draft, approved, in_use, archived], desc: "Template status"}
      created_at: {type: timestamp, desc: "Created date"}
      updated_at: {type: timestamp, desc: "Last updated"}

  scorecard_criteria:
    key: [template_id, criterion_id]
    cols:
      template_id: {type: str, desc: "Scorecard template, e.g. TST-900001"}
      criterion_id: {type: str, desc: "Criterion identifier"}
      criterion_name: {type: str, desc: "Criterion name"}
      weight_pct: {type: float, desc: "Weight as percentage of total"}
      minimum_score: {type: float, desc: "Minimum qualifying score on a 1-5 scale"}
      disqualifier: {type: str, desc: "Plain-English threshold that disqualifies a bidder"}
      required_term: {type: str, desc: "Contract term to ask bidders to commit to"}

  sourcing_awards:
    key: award_id
    cols:
      award_id: {type: str, desc: "Award, e.g. AWD-900001"}
      rfq_id: {type: str, desc: "RFQ the award follows"}
      supplier_id: {type: str, desc: "Awarded supplier"}
      sku: {desc: "Product awarded, blank for a range"}
      category: {type: str, desc: "Category awarded, e.g. Bedding"}
      volume_units: {type: int, desc: "Volume awarded in units"}
      volume_split_pct: {type: float, desc: "Share of the total category volume in percent"}
      unit_cost_gbp: {type: float, desc: "Agreed unit cost in GBP"}
      status: {type: enum, values: [draft, approved, active, completed, cancelled], desc: "Award status"}
      effective_date: {type: date, desc: "Award effective date"}
      created_at: {type: timestamp, desc: "Created date"}
      updated_at: {type: timestamp, desc: "Last updated"}

  rfq_clarifications:
    key: clarification_id
    cols:
      clarification_id: {type: str, desc: "Clarification request, e.g. RFC-900001"}
      rfq_id: {type: str, desc: "RFQ the question is about, blank for a tender"}
      response_id: {type: str, desc: "RFQ response being clarified"}
      rfx_id: {type: str, desc: "Tender event the question is about, blank for an RFQ"}
      rfx_response_id: {type: str, desc: "Tender bid being clarified"}
      question: {type: text, desc: "Clarification or re-quote request"}
      context: {type: str, desc: "Topic, e.g. pricing, capacity, lead time, specification"}
      status: {type: enum, values: [sent, answered, closed], desc: "Clarification status"}
      sent_at: {type: timestamp, desc: "When sent"}
      answered_at: {type: timestamp, desc: "When answered"}
      answer: {type: text, desc: "Bidder answer"}
      updated_at: {type: timestamp, desc: "Last updated"}

  factory_capabilities:
    key: [factory_id, capability]
    cols:
      factory_id: {type: str, desc: "Factory"}
      capability: {type: str, desc: "What the factory can make, e.g. technical outerwear with seam-sealing"}
      line_capacity_units_season: {type: int, desc: "Units a season the factory can commit on this line"}
      notes: {type: str, desc: "Experience, limits or caveats for this capability"}

  supplier_materials:
    key: [supplier_id, material]
    cols:
      supplier_id: {type: str, desc: "Supplier"}
      material: {type: str, desc: "Material or pack type supplied, e.g. mechanically recycled polyester, moulded pulp"}
      material_class: {type: enum, values: [alternative_fibre, packaging], desc: "Fibre alternatives or packaging"}
      recycled_content_pct: {type: float, desc: "Recycled content in percent, 0 for virgin"}
      certification: {type: str, desc: "Material certification, e.g. GRS"}
      price_premium_vs_virgin_pct: {type: float, desc: "Price premium over the virgin material in percent, blank for packaging"}
      lead_time_days: {type: int, desc: "Typical lead time in days"}
      available_capacity: {type: float, desc: "Capacity available to us each year, in capacity_unit"}
      capacity_unit: {type: str, desc: "Unit of available_capacity, e.g. tonnes, packs"}
      notes: {type: str, desc: "Supply notes"}

tools:
  - name: create_rfq
    desc: Creates a draft RFQ for a product or SKU with quantity, delivery date, destination and optional invited suppliers. Returns the new RFQ.
    kind: insert
    table: rfq
    id_prefix: RFQ-
    defaults: {status: draft}
    args:
      sku: {}
      product_name: {}
      required_qty: {required: true, type: int}
      required_date: {required: true, type: date}
      destination_site_id: {required: true}
      specification: {}
      invited_supplier_ids: {}
    example: {sku: SKU-101638, required_qty: 8000, required_date: "+90d", destination_site_id: DC1, specification: "Pilot run, woven trousers", invited_supplier_ids: "SUP-0058,SUP-0036"}

  - name: send_rfq_to_suppliers
    desc: Issues a draft RFQ to the chosen suppliers, sets its status to sent and records the issue date.
    kind: update
    table: rfq
    set: {status: sent, issued_at: "$as_of"}
    args:
      invited_supplier_ids: {required: true}
    example: {rfq_id: RFQ-900003, invited_supplier_ids: "SUP-0058,SUP-0036,SUP-0044"}

  - name: get_rfq_responses_for_product
    desc: Quotes received on RFQs for a product, by SKU, RFQ id or product name, with supplier, unit cost against expected, lead time, tooling, compliance and capacity.
    kind: sql
    args:
      sku: {}
      rfq_id: {}
      product_name: {type: str, desc: "Words in the product name, e.g. insulated lunch box"}
      status: {type: enum, values: [submitted, received, clarification_requested, clarified, evaluated, rejected, accepted], desc: "Response status, blank for all"}
    sql: |
      SELECT r.response_id, r.rfq_id, r.supplier_id, s.name AS supplier_name, r.factory_id,
             COALESCE(f.country, s.country) AS origin_country,
             r.unit_cost_gbp, rq.expected_unit_cost_gbp,
             ROUND(100.0 * (r.unit_cost_gbp / rq.expected_unit_cost_gbp - 1), 1) AS vs_expected_pct,
             r.total_cost_gbp, r.lead_time_days, r.minimum_order_qty, r.tooling_cost_gbp,
             r.compliance_score, r.capacity_units_available, r.capability_notes, r.status
      FROM rfq_responses r
      JOIN rfq rq ON rq.rfq_id = r.rfq_id
      JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      LEFT JOIN master.factories f ON f.factory_id = r.factory_id
      LEFT JOIN master.products p ON p.sku = rq.sku
      WHERE ($sku IS NULL OR rq.sku = $sku)
        AND ($rfq_id IS NULL OR rq.rfq_id = $rfq_id)
        AND ($product_name IS NULL OR len(list_filter(regexp_extract_all(lower($product_name), '[a-z0-9]+'),
              w -> NOT contains(lower(COALESCE(rq.product_name, p.name)), w))) = 0)
        AND ($status IS NULL OR r.status = $status)
      ORDER BY r.unit_cost_gbp ASC
    limit: 20
    example: {rfq_id: RFQ-900004}

  - name: compare_factory_quotes
    desc: Side-by-side factory quotes on one RFQ with tooling per unit at a chosen volume, price against target, lead time, capacity shortfall, compliance and audit grade.
    kind: sql
    args:
      rfq_id: {required: true}
      volume_units: {type: int, desc: "Volume to spread tooling over, e.g. 40000. Defaults to the RFQ quantity."}
    sql: |
      SELECT r.response_id, r.supplier_id, s.name AS supplier_name, r.factory_id, f.country,
             r.unit_cost_gbp, r.tooling_cost_gbp,
             COALESCE($volume_units, rq.required_qty) AS tooling_volume_units,
             ROUND(r.tooling_cost_gbp / COALESCE($volume_units, rq.required_qty), 3) AS tooling_per_unit_gbp,
             ROUND(r.unit_cost_gbp + r.tooling_cost_gbp / COALESCE($volume_units, rq.required_qty), 2) AS unit_price_incl_tooling_gbp,
             rq.expected_unit_cost_gbp AS target_unit_cost_gbp,
             ROUND(100.0 * ((r.unit_cost_gbp + r.tooling_cost_gbp / COALESCE($volume_units, rq.required_qty)) / rq.expected_unit_cost_gbp - 1), 1) AS vs_target_incl_tooling_pct,
             r.lead_time_days, r.capacity_units_available,
             GREATEST(rq.required_qty - r.capacity_units_available, 0) AS capacity_shortfall_units,
             r.compliance_score, f.audit_rating, f.certifications, r.capability_notes
      FROM rfq_responses r
      JOIN rfq rq ON rq.rfq_id = r.rfq_id
      JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      LEFT JOIN master.factories f ON f.factory_id = r.factory_id
      WHERE r.rfq_id = $rfq_id
      ORDER BY r.unit_cost_gbp ASC
    limit: 10
    example: {rfq_id: RFQ-900004, volume_units: 40000}

  - name: compare_bids_by_criteria
    desc: Compares the bids on a tender by three-year cost, hidden charges, service level and references, with weighted scores and rank. Weights are inputs.
    kind: sql
    args:
      rfx_id: {required: true}
      price_weight_pct: {type: float, default: 70, desc: "Weight on three-year cost, percent"}
      service_weight_pct: {type: float, default: 20, desc: "Weight on committed service level, percent"}
      references_weight_pct: {type: float, default: 10, desc: "Weight on share of positive references, percent"}
    sql: |
      WITH b AS (
        SELECT r.*, e.assumed_call_outs_per_year AS call_outs,
               ROUND(r.annual_cost_gbp * (1 + (1 + COALESCE(r.price_review_pct, 0) / 100) + pow(1 + COALESCE(r.price_review_pct, 0) / 100, 2))
                     + 3 * (COALESCE(r.consumables_gbp_per_year, 0) + COALESCE(e.assumed_call_outs_per_year, 0) * COALESCE(r.call_out_fee_gbp, 0))
                     + COALESCE(r.transition_cost_gbp, 0), 2) AS three_year_total_gbp
        FROM rfx_responses r JOIN rfx_events e ON e.rfx_id = r.rfx_id
        WHERE r.rfx_id = $rfx_id AND r.status != 'rejected'
      ), refs AS (
        SELECT rfx_response_id, count(*) AS n, count(*) FILTER (WHERE outcome = 'positive') AS pos
        FROM bid_references GROUP BY rfx_response_id
      ), sc AS (
        SELECT b.*, refs.n, refs.pos,
               100.0 * min(b.three_year_total_gbp) OVER () / b.three_year_total_gbp AS price_score,
               b.service_level_pct AS service_score,
               100.0 * refs.pos / refs.n AS references_score
        FROM b LEFT JOIN refs USING (rfx_response_id)
      )
      SELECT sc.rfx_response_id, COALESCE(sc.bidder_name, c.name, s.name) AS bidder,
             sc.annual_cost_gbp, sc.three_year_total_gbp,
             sc.call_out_fee_gbp, sc.consumables_gbp_per_year, sc.minimum_hours_per_week, sc.price_review_pct,
             sc.payment_terms, sc.service_level_pct,
             CASE WHEN sc.n IS NULL THEN 'none recorded' ELSE sc.pos || ' of ' || sc.n || ' positive' END AS references_summary,
             ROUND(sc.price_score, 1) AS price_score, ROUND(sc.service_score, 1) AS service_score,
             ROUND(sc.references_score, 1) AS references_score,
             ROUND((COALESCE($price_weight_pct, 70) * sc.price_score + COALESCE($service_weight_pct, 20) * COALESCE(sc.service_score, 0)
                    + CASE WHEN sc.n IS NULL THEN 0 ELSE COALESCE($references_weight_pct, 10) * sc.references_score END)
                   / (COALESCE($price_weight_pct, 70) + COALESCE($service_weight_pct, 20)
                      + CASE WHEN sc.n IS NULL THEN 0 ELSE COALESCE($references_weight_pct, 10) END), 1) AS weighted_score,
             'weighted_score = weighted average of price, service and references scores; price_score = 100 x lowest three-year cost / bid three-year cost' AS formula
      FROM sc
      LEFT JOIN master.suppliers s ON s.supplier_id = sc.supplier_id
      LEFT JOIN master.carriers c ON c.carrier_id = sc.carrier_id
      ORDER BY weighted_score DESC, sc.three_year_total_gbp ASC
    limit: 10
    example: {rfx_id: RFX-900004}

  - name: get_supplier_references
    desc: Reference checks recorded for the bids on a tender, with customer, outcome and feedback, weakest bidder first. Use to compare bidders' references.
    kind: sql
    args:
      rfx_id: {required: true}
      rfx_response_id: {}
    sql: |
      WITH refs AS (
        SELECT rf.*, r.rfx_id, COALESCE(r.bidder_name, c.name, s.name) AS bidder,
               count(*) OVER (PARTITION BY rf.rfx_response_id) AS n,
               count(*) FILTER (WHERE rf.outcome = 'positive') OVER (PARTITION BY rf.rfx_response_id) AS pos
        FROM bid_references rf
        JOIN rfx_responses r ON r.rfx_response_id = rf.rfx_response_id
        LEFT JOIN master.suppliers s ON s.supplier_id = r.supplier_id
        LEFT JOIN master.carriers c ON c.carrier_id = r.carrier_id
        WHERE r.rfx_id = $rfx_id AND ($rfx_response_id IS NULL OR r.rfx_response_id = $rfx_response_id)
      )
      SELECT rfx_response_id, bidder, pos || ' of ' || n || ' positive' AS references_summary,
             reference_customer, outcome, feedback
      FROM refs
      ORDER BY 1.0 * pos / n ASC, bidder, reference_customer
    limit: 40
    example: {rfx_id: RFX-900004}

  - name: get_quote_cost_breakdown_by_component
    desc: Cost breakdown of RFQ quotes by component (material, labour, overhead and freight, tooling) against expected cost, with the premium each component adds. Highest quote first.
    kind: sql
    args:
      rfq_id: {}
      response_id: {}
    sql: |
      SELECT r.response_id, r.supplier_id, s.name AS supplier_name, COALESCE(f.country, s.country) AS origin_country,
             r.unit_cost_gbp AS quote_unit_cost_gbp, q.component,
             q.unit_cost_gbp AS quoted_component_gbp, q.expected_unit_cost_gbp AS expected_component_gbp,
             ROUND(q.unit_cost_gbp - q.expected_unit_cost_gbp, 2) AS premium_gbp,
             ROUND(100.0 * (q.unit_cost_gbp - q.expected_unit_cost_gbp) / NULLIF(q.expected_unit_cost_gbp, 0), 1) AS premium_pct,
             ROUND(100.0 * (q.unit_cost_gbp - q.expected_unit_cost_gbp)
                   / NULLIF(sum(q.unit_cost_gbp - q.expected_unit_cost_gbp) OVER (PARTITION BY r.response_id), 0), 1) AS share_of_quote_premium_pct
      FROM quote_cost_components q
      JOIN rfq_responses r ON r.response_id = q.response_id
      JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      LEFT JOIN master.factories f ON f.factory_id = r.factory_id
      WHERE ($rfq_id IS NULL OR r.rfq_id = $rfq_id) AND ($response_id IS NULL OR r.response_id = $response_id)
      ORDER BY r.unit_cost_gbp DESC, r.response_id, premium_gbp DESC
    limit: 40
    example: {rfq_id: RFQ-900002}

  - name: get_historic_quotes_by_origin
    desc: Past quotes by origin country for a SKU or category, with quote date, unit cost and lead time, newest first. Use for price trends by origin.
    kind: sql
    args:
      sku: {}
      category: {type: str, desc: "Product category, e.g. Outerwear"}
      origin_country: {type: str, desc: "Origin country code, e.g. PT, TR, VN, CN"}
      date_from: {type: date, default: "-730d", desc: "Earliest quote date"}
    sql: |
      SELECT rq.sku, p.name AS product, COALESCE(f.country, s.country) AS origin_country,
             CAST(r.submitted_at AS DATE) AS quote_date, r.supplier_id, s.name AS supplier_name,
             r.unit_cost_gbp, r.lead_time_days, r.status,
             count(*) OVER (PARTITION BY COALESCE(f.country, s.country)) AS quotes_for_origin,
             ROUND(avg(r.unit_cost_gbp) OVER (PARTITION BY COALESCE(f.country, s.country)), 2) AS origin_avg_unit_cost_gbp
      FROM rfq_responses r
      JOIN rfq rq ON rq.rfq_id = r.rfq_id
      JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      LEFT JOIN master.factories f ON f.factory_id = r.factory_id
      JOIN master.products p ON p.sku = rq.sku
      WHERE rq.status IN ('awarded', 'evaluated', 'cancelled')
        AND CAST(r.submitted_at AS DATE) >= CAST($date_from AS DATE)
        AND ($sku IS NULL OR rq.sku = $sku)
        AND ($category IS NULL OR lower(p.category) = lower($category))
        AND ($origin_country IS NULL OR COALESCE(f.country, s.country) = upper($origin_country))
      ORDER BY origin_country, r.submitted_at DESC
    limit: 40
    example: {sku: SKU-102863}

  - name: get_carrier_bid_rates
    desc: Annual price, monthly price, transition cost and service commitment bid by each carrier or 3PL on a tender, cheapest first.
    kind: sql
    args:
      rfx_id: {required: true}
    sql: |
      SELECT r.rfx_response_id, COALESCE(r.bidder_name, c.name, s.name) AS bidder, r.carrier_id, c.mode,
             r.annual_cost_gbp, r.transition_cost_gbp,
             ROUND(r.annual_cost_gbp / 12, 2) AS monthly_cost_gbp,
             r.service_level_commitment, r.submitted_at
      FROM rfx_responses r
      LEFT JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      LEFT JOIN master.carriers c ON c.carrier_id = r.carrier_id
      WHERE r.rfx_id = $rfx_id AND r.status != 'rejected'
      ORDER BY r.annual_cost_gbp ASC
    limit: 10
    example: {rfx_id: RFX-900001}

  - name: get_3pl_proposal_costs
    desc: 3PL proposals on a tender with annual fees, one-off transition cost, first-year and three-year totals and service commitment, cheapest first.
    kind: sql
    args:
      rfx_id: {required: true}
    sql: |
      SELECT r.rfx_response_id, COALESCE(r.bidder_name, s.name) AS provider_name,
             r.annual_cost_gbp, r.transition_cost_gbp,
             ROUND(r.annual_cost_gbp + COALESCE(r.transition_cost_gbp, 0), 2) AS first_year_cost_gbp,
             ROUND(3 * r.annual_cost_gbp + COALESCE(r.transition_cost_gbp, 0), 2) AS three_year_cost_gbp,
             r.service_level_commitment, r.notes,
             'three_year_cost = 3 x annual cost + transition cost' AS formula
      FROM rfx_responses r
      LEFT JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      WHERE r.rfx_id = $rfx_id AND r.status != 'rejected'
      ORDER BY r.annual_cost_gbp ASC
    limit: 10
    example: {rfx_id: RFX-900003}

  - name: calculate_three_year_total_cost
    desc: Three-year cost of each bid on a tender including hidden charges (call-out fees, consumables, price review uplift, transition cost), cheapest first.
    kind: sql
    args:
      rfx_id: {required: true}
      call_outs_per_year: {type: int, desc: "Call-outs a year to price, if different from the tender assumption"}
    sql: |
      SELECT r.rfx_response_id, COALESCE(r.bidder_name, c.name, s.name) AS bidder,
             r.annual_cost_gbp AS headline_annual_gbp,
             ROUND(r.annual_cost_gbp * (1 + (1 + COALESCE(r.price_review_pct, 0) / 100) + pow(1 + COALESCE(r.price_review_pct, 0) / 100, 2)), 2) AS price_3y_with_review_gbp,
             ROUND(3 * COALESCE(r.consumables_gbp_per_year, 0), 2) AS consumables_3y_gbp,
             ROUND(3 * COALESCE($call_outs_per_year, e.assumed_call_outs_per_year, 0) * COALESCE(r.call_out_fee_gbp, 0), 2) AS call_out_fees_3y_gbp,
             COALESCE(r.transition_cost_gbp, 0) AS transition_cost_gbp,
             r.price_review_pct, r.minimum_hours_per_week,
             ROUND(r.annual_cost_gbp * (1 + (1 + COALESCE(r.price_review_pct, 0) / 100) + pow(1 + COALESCE(r.price_review_pct, 0) / 100, 2))
                   + 3 * (COALESCE(r.consumables_gbp_per_year, 0) + COALESCE($call_outs_per_year, e.assumed_call_outs_per_year, 0) * COALESCE(r.call_out_fee_gbp, 0))
                   + COALESCE(r.transition_cost_gbp, 0), 2) AS three_year_total_gbp,
             'total = annual price x (1 + (1+uplift) + (1+uplift)^2) + 3 x (consumables + call-outs x fee) + transition' AS formula
      FROM rfx_responses r
      JOIN rfx_events e ON e.rfx_id = r.rfx_id
      LEFT JOIN master.suppliers s ON s.supplier_id = r.supplier_id
      LEFT JOIN master.carriers c ON c.carrier_id = r.carrier_id
      WHERE r.rfx_id = $rfx_id AND r.status != 'rejected'
      ORDER BY three_year_total_gbp ASC
    limit: 10
    example: {rfx_id: RFX-900004}

  - name: calculate_carrier_weighted_scores
    desc: Weighted scorecard result (1-5) for each carrier bid or baseline on a tender, from stored criterion scores and the weights given, best first.
    kind: sql
    args:
      rfx_id: {required: true}
      on_time_weight_pct: {type: float, default: 30, desc: "Weight on on-time delivery, percent"}
      damage_loss_weight_pct: {type: float, default: 25, desc: "Weight on damage and loss performance, percent"}
      cost_weight_pct: {type: float, default: 20, desc: "Weight on cost per shipment, percent"}
      compliance_weight_pct: {type: float, default: 10, desc: "Weight on compliance and safety, percent"}
      tracking_weight_pct: {type: float, default: 10, desc: "Weight on tracking and EDI visibility, percent"}
      sustainability_weight_pct: {type: float, default: 5, desc: "Weight on sustainability, percent"}
    sql: |
      WITH w AS (
        SELECT * FROM (VALUES ('on_time', COALESCE($on_time_weight_pct, 30)), ('damage_loss', COALESCE($damage_loss_weight_pct, 25)),
                              ('cost', COALESCE($cost_weight_pct, 20)), ('compliance', COALESCE($compliance_weight_pct, 10)),
                              ('tracking', COALESCE($tracking_weight_pct, 10)), ('sustainability', COALESCE($sustainability_weight_pct, 5)))
               AS t(criterion_key, weight_pct)
      )
      SELECT r.rfx_response_id, r.carrier_id, COALESCE(c.name, r.bidder_name) AS carrier_name,
             max(s.score) FILTER (WHERE s.criterion_key = 'on_time') AS on_time,
             max(s.score) FILTER (WHERE s.criterion_key = 'damage_loss') AS damage_loss,
             max(s.score) FILTER (WHERE s.criterion_key = 'cost') AS cost,
             max(s.score) FILTER (WHERE s.criterion_key = 'compliance') AS compliance,
             max(s.score) FILTER (WHERE s.criterion_key = 'tracking') AS tracking,
             max(s.score) FILTER (WHERE s.criterion_key = 'sustainability') AS sustainability,
             ROUND(sum(s.score * w.weight_pct) / sum(w.weight_pct), 2) AS weighted_score,
             sum(w.weight_pct) AS total_weight_pct,
             'weighted_score = sum(criterion score x weight) / sum(weights), scores 1-5' AS formula
      FROM rfx_responses r
      JOIN rfx_response_scores s ON s.rfx_response_id = r.rfx_response_id
      JOIN w ON w.criterion_key = s.criterion_key
      LEFT JOIN master.carriers c ON c.carrier_id = r.carrier_id
      WHERE r.rfx_id = $rfx_id
      GROUP BY r.rfx_response_id, r.carrier_id, c.name, r.bidder_name
      ORDER BY weighted_score DESC
    limit: 10
    example: {rfx_id: RFX-900002}

  - name: draft_tender_criteria
    desc: Drafts tender criteria with weights, disqualifying thresholds and the reliability and rate terms to ask carriers for, from an approved scorecard template.
    kind: draft
    args:
      template_id: {default: TST-900001}
      lane: {type: str, desc: "Lane or scope for the heading, e.g. Asia-Europe"}
    sql:
      tpl: SELECT name, description FROM tender_scorecard_templates WHERE template_id = $template_id
      criteria: SELECT criterion_name, weight_pct, minimum_score, disqualifier, required_term FROM scorecard_criteria WHERE template_id = $template_id ORDER BY weight_pct DESC, criterion_id
    template: |
      TENDER CRITERIA: {{ tpl[0].name }}{% if lane %} ({{ lane }}){% endif %}

      {{ tpl[0].description }}

      ## Scoring criteria and weights
      {% for c in criteria %}
      - {{ c.criterion_name }}: {{ c.weight_pct|num(0) }}%. Minimum score {{ c.minimum_score|num(0) }} of 5. Disqualify if: {{ c.disqualifier }}.
      {% endfor %}

      ## Terms to ask bidders to commit to
      {% for c in criteria %}
      - {{ c.criterion_name }}: {{ c.required_term }}
      {% endfor %}
    example: {template_id: TST-900001, lane: Asia-Europe}

  - name: draft_tender_scorecard
    desc: Drafts a tender scorecard from an existing template, showing each criterion's weight, minimum score and disqualifier plus evaluation guidance. Use as the starting point for a new scorecard.
    kind: draft
    args:
      template_id: {default: TST-900002}
    sql:
      tpl: SELECT name, description, status FROM tender_scorecard_templates WHERE template_id = $template_id
      criteria: SELECT criterion_name, weight_pct, minimum_score, disqualifier FROM scorecard_criteria WHERE template_id = $template_id ORDER BY weight_pct DESC, criterion_id
    template: |
      TENDER SCORECARD: {{ tpl[0].name }} ({{ tpl[0].status }})

      {{ tpl[0].description }}

      ## Scoring matrix (score each criterion 1-5)
      | Criterion | Weight | Minimum score | Disqualify if |
      |-----------|--------|---------------|---------------|
      {% for c in criteria %}
      | {{ c.criterion_name }} | {{ c.weight_pct|num(0) }}% | {{ c.minimum_score|num(0) }} | {{ c.disqualifier }} |
      {% endfor %}

      ## Evaluation guidance
      - Weighted score = sum of (score x weight) / 100, out of 5.
      - A bid scoring below the minimum on any criterion is disqualified whatever its total.
      - Shortlist the top two weighted scores for final negotiation.
    example: {template_id: TST-900002}

