  - name: search_factories_by_capability_and_country
    desc: Finds approved factories by country, capability (e.g. denim wash, seam-sealing), certification and minimum line capacity a season, best audit grade first.
    kind: sql
    args:
      country: {type: str, desc: "Country code or name, e.g. VN, Portugal, TR"}
      capability: {type: str, desc: "Words describing what the factory makes, e.g. technical outerwear seam-sealing"}
      certification: {type: str, desc: "Certification held, e.g. OEKO-TEX, GOTS"}
      min_capacity_units_season: {type: int, desc: "Minimum units a season on the matching line"}
      status: {type: enum, values: [approved, conditional, suspended, delisted], default: approved, desc: "Factory approval status"}
    sql: |
      WITH cn(code, nm) AS (VALUES ('PT','portugal'),('TR','turkey'),('VN','vietnam'),('BD','bangladesh'),('IN','india'),
                                   ('CN','china'),('MX','mexico'),('IT','italy'),('PL','poland'),('FR','france'),('DE','germany'),('GB','united kingdom'))
      SELECT f.factory_id, f.name AS factory_name, f.supplier_id, s.name AS supplier_name, f.country, f.city,
             c.capability, c.line_capacity_units_season, f.capacity_units_month AS factory_capacity_units_month,
             f.certifications, f.audit_rating, f.last_audit_date, f.status, c.notes
      FROM factory_capabilities c
      JOIN master.factories f ON f.factory_id = c.factory_id
      JOIN master.suppliers s ON s.supplier_id = f.supplier_id
      WHERE ($country IS NULL OR f.country IN (SELECT code FROM cn WHERE code = upper($country) OR nm = lower($country)))
        AND ($capability IS NULL OR len(list_filter(regexp_extract_all(lower($capability), '[a-z0-9-]+'),
              w -> NOT contains(lower(c.capability), w))) = 0)
        AND ($certification IS NULL OR f.certifications ILIKE '%' || $certification || '%')
        AND ($min_capacity_units_season IS NULL OR c.line_capacity_units_season >= $min_capacity_units_season)
        AND ($status IS NULL OR f.status = $status)
      ORDER BY f.audit_rating ASC, c.line_capacity_units_season DESC, f.factory_id
    limit: 20
    example: {country: VN, capability: denim wash, min_capacity_units_season: 30000}

  - name: search_packaging_suppliers_by_material
    desc: Packaging suppliers by pack material (corrugated, moulded pulp, recycled plastic) with recycled content, lead time and capacity available to us a year.
    kind: sql
    args:
      material: {type: str, desc: "Pack material words, e.g. corrugated, moulded pulp, recycled plastic"}
      country: {type: str, desc: "Supplier country code, e.g. IN, TR"}
      min_capacity_packs_year: {type: int, desc: "Minimum packs a year available to us, e.g. 400000"}
    sql: |
      SELECT m.supplier_id, s.name AS supplier_name, s.country, m.material, m.recycled_content_pct, m.certification,
             m.lead_time_days, CAST(m.available_capacity AS BIGINT) AS available_packs_per_year,
             s.status AS supplier_status, s.otif_pct_12m, s.risk_rating, m.notes
      FROM supplier_materials m
      JOIN master.suppliers s ON s.supplier_id = m.supplier_id
      WHERE m.material_class = 'packaging' AND s.status NOT IN ('exited', 'blocked', 'suspended')
        AND ($material IS NULL OR len(list_filter(regexp_extract_all(lower($material), '[a-z0-9]+'),
              w -> NOT contains(lower(m.material), w))) = 0)
        AND ($country IS NULL OR s.country = upper($country))
        AND ($min_capacity_packs_year IS NULL OR m.available_capacity >= $min_capacity_packs_year)
      ORDER BY m.material, m.available_capacity DESC
    limit: 20
    example: {material: corrugated}

  - name: search_alternative_material_suppliers
    desc: Suppliers of recycled or alternative fibres (recycled polyester, chemically recycled, recycled nylon) with certification, price premium over virgin, lead time and capacity.
    kind: sql
    args:
      material: {type: str, desc: "Material words, e.g. recycled polyester, chemically recycled"}
      certification: {type: str, desc: "Certification, e.g. GRS"}
      max_price_premium_pct: {type: float, desc: "Highest acceptable price premium over virgin, percent"}
      country: {type: str, desc: "Supplier country code, e.g. IN, TR, DE"}
    sql: |
      SELECT m.supplier_id, s.name AS supplier_name, s.country, m.material, m.recycled_content_pct, m.certification,
             m.price_premium_vs_virgin_pct, m.lead_time_days, m.available_capacity AS available_capacity_tonnes_per_year,
             s.status AS supplier_status, s.otif_pct_12m, s.risk_rating, m.notes
      FROM supplier_materials m
      JOIN master.suppliers s ON s.supplier_id = m.supplier_id
      WHERE m.material_class = 'alternative_fibre' AND s.status NOT IN ('exited', 'blocked', 'suspended')
        AND ($material IS NULL OR len(list_filter(regexp_extract_all(lower($material), '[a-z0-9]+'),
              w -> NOT contains(lower(m.material), w))) = 0)
        AND ($certification IS NULL OR m.certification ILIKE '%' || $certification || '%')
        AND ($max_price_premium_pct IS NULL OR m.price_premium_vs_virgin_pct <= $max_price_premium_pct)
        AND ($country IS NULL OR s.country = upper($country))
      ORDER BY m.price_premium_vs_virgin_pct ASC, m.available_capacity DESC
    limit: 20
    example: {material: recycled polyester}
