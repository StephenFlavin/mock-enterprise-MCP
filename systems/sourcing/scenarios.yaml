# One entry per question row that uses this system's tools (see: python -m mockmcp brief sourcing).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:12:Q2"
  story: >
    Ocean tender for Asia-Europe: template TST-900001 holds the approved criteria (schedule reliability 30%, roll rate 20%, rates 30%)
    with the terms to ask for (80% reliability, maximum 8% rolled bookings with compensation). Carrier B is CAR-006 and C is CAR-007;
    the new tender is created with the template and invitations go to those two carriers.
  checks:
    - tool: draft_tender_criteria
      args: {template_id: TST-900001, lane: Asia-Europe}
      expect: ["Schedule reliability: 30%", "at least 80% schedule reliability", "8% rolled bookings", "Roll rate"]
    - tool: create_tender_event
      args: {description: "Ocean freight tender Asia-Europe renewal", criteria_template_id: TST-900001, lanes: Asia-Europe, invited_carrier_ids: "CAR-006,CAR-007", response_deadline: "+45d"}
      expect: ["RFX-900005", "TST-900001", "CAR-007"]
    - tool: send_tender_invitation
      args: {rfx_id: RFX-900005, invited_carrier_ids: "CAR-006,CAR-007"}
      expect: ["invitation_sent", "RFX-900005"]

- question: "02:20:Q6"
  story: >
    The old road carrier scorecard TST-900002 is price-led (price 40%). RFX-900002 holds the three current road carriers scored 1-5 on
    each criterion from the last 12 months (matching the TMS scorecard): with weights on-time 30, damage and loss 25, cost 20,
    compliance 10, tracking 10, sustainability 5, Midshires Transport (CAR-002) scores 3.6, Northline Haulage (CAR-001) 3.5
    and Pennine Freight (CAR-003) 2.95 because of its 94,193 pound incident cost.
  checks:
    - tool: draft_tender_scorecard
      args: {template_id: TST-900002}
      expect: ["Price | 40%", "On-time delivery | 30%"]
    - tool: calculate_carrier_weighted_scores
      args: {rfx_id: RFX-900002}
      expect: ["CAR-002", "3.6", "CAR-001", "3.5", "CAR-003", "2.95"]
    - tool: create_tender_scorecard_template
      args: {name: "Road carrier tender scorecard 2027", description: "Scorecard for the next road carrier tender", purpose: "Road carrier reliability claims and cost", criteria_weights: "On-time delivery 30%; Damage and loss 25%; Cost per shipment 20%; Compliance and safety 10%; Tracking and EDI 10%; Sustainability 5%"}
      expect: ["TST-900004", "Damage and loss 25%"]

- question: "04:32:Q3"
  story: >
    Bedding range RFQ-900001 (60,000 units) has quotes from SUP-0039 (38.90, 21 days, 57,600 spare), SUP-0004 (36.20, 14 days, 23,400 spare)
    and SUP-0011 (33.80, 75 days, 6,300 spare), matching the supplier portal capacities. A 70/30 split of SUP-0039 and SUP-0004 fits both
    capacities and is recorded as draft awards.
  checks:
    - tool: get_rfq_responses_for_product
      args: {rfq_id: RFQ-900001}
      expect: ["SUP-0039", "38.9", "57600", "SUP-0004", "36.2", "23400", "SUP-0011", "33.8", "6300"]
    - tool: create_sourcing_award
      args: {supplier_id: SUP-0039, category: Bedding, rfq_id: RFQ-900001, volume_units: 42000, volume_split_pct: 70, unit_cost_gbp: 38.9, effective_date: "+90d"}
      expect: ["AWD-900003", "42000", "Bedding"]

- question: "04:33:Q3"
  story: >
    Denim into Vietnam: three approved Vietnamese factories do denim with in-house wash and finishing (FAC-0017 80,000 a season, FAC-0066 60,000,
    FAC-0070 50,000). FAC-0129 only sews denim and outsources the wash, so it does not match the wash and finishing search. An RFQ for 120,000 jeans
    goes to the owning suppliers SUP-0008, SUP-0034 and SUP-0035.
  checks:
    - tool: search_factories_by_capability_and_country
      args: {country: VN, capability: denim wash, min_capacity_units_season: 30000}
      expect: ["FAC-0017", "FAC-0066", "FAC-0070", "80000"]
    - tool: create_rfq
      args: {product_name: "Core denim jeans", required_qty: 120000, required_date: "+120d", destination_site_id: DC1, invited_supplier_ids: "SUP-0008,SUP-0034,SUP-0035"}
      expect: ["RFQ-900007", "120000", "SUP-0034"]

- question: "04:33:Q6"
  story: >
    Moving cut-and-sew volume out of southern China: the approved Vietnamese factories with at least 100,000 units a season are FAC-0129
    (SUP-0069, audit A, 140,000), FAC-0104 (SUP-0056, audit B, 150,000) and FAC-0105 (SUP-0056, audit B, 110,000), so SUP-0069 and SUP-0056
    are the two best candidates.
  checks:
    - tool: search_factories_by_capability_and_country
      args: {country: VN, capability: cut-and-sew garments, min_capacity_units_season: 100000}
      expect: ["FAC-0129", "SUP-0069", "FAC-0104", "SUP-0056", "FAC-0105", "140000"]

- question: "04:34:Q1"
  story: >
    Fashion basics pilot: Portugal has FAC-0110 (SUP-0058, audit A, 120,000 a season) and FAC-0085; Turkey has FAC-0072 (SUP-0036, audit A, 100,000)
    and FAC-0042 that make woven trousers and dresses. Pilot RFQs of 8,000 units go to SUP-0058 and SUP-0036 for SKU-101638, SKU-102891 and SKU-101897.
  checks:
    - tool: search_factories_by_capability_and_country
      args: {country: PT, capability: woven trousers and dresses, min_capacity_units_season: 50000}
      expect: ["FAC-0110", "120000", "FAC-0085"]
    - tool: search_factories_by_capability_and_country
      args: {country: TR, capability: woven trousers and dresses, min_capacity_units_season: 50000}
      expect: ["FAC-0072", "100000", "FAC-0042"]
    - tool: create_rfq
      args: {sku: SKU-101638, required_qty: 8000, required_date: "+98d", destination_site_id: DC1, invited_supplier_ids: "SUP-0058,SUP-0036"}
      expect: ["RFQ-", "SKU-101638", "8000"]

- question: "04:34:Q2"
  story: >
    Technical outerwear with seam-sealing and OEKO-TEX at 30,000 units a season: FAC-0110 (PT, audit A, 54,000), FAC-0085 (PT, B, 35,000),
    FAC-0072 (TR, A, 42,000) and FAC-0125 (TR, D, exactly 30,000). Top three by audit grade are the suppliers SUP-0058, SUP-0036 and SUP-0044,
    who receive draft RFQ-900003.
  checks:
    - tool: search_factories_by_capability_and_country
      args: {country: PT, capability: technical outerwear seam-sealing, certification: OEKO-TEX, min_capacity_units_season: 30000}
      expect: ["FAC-0110", "54000", "FAC-0085", "35000"]
    - tool: search_factories_by_capability_and_country
      args: {country: TR, capability: technical outerwear seam-sealing, certification: OEKO-TEX, min_capacity_units_season: 30000}
      expect: ["FAC-0072", "42000", "FAC-0125"]
    - tool: send_rfq_to_suppliers
      args: {rfq_id: RFQ-900003, invited_supplier_ids: "SUP-0058,SUP-0036,SUP-0044"}
      expect: ["SUP-0044", "sent"]

- question: "04:34:Q5"
  story: >
    Nearshore coat SKU-102863 (RFQ-900002, expected cost 38.07): five quotes from 44.60 to 51.40, the highest from SUP-0058 at 35% above expected.
    Labour is the biggest driver (21.60 against 13.21 expected, 63% of the premium on the top quote); earlier rounds show Vietnam around 29 and
    Portugal around 36.
  checks:
    - tool: get_rfq_responses_for_product
      args: {rfq_id: RFQ-900002}
      expect: ["RFR-900004", "51.4", "35", "RFR-900008", "44.6"]
    - tool: get_quote_cost_breakdown_by_component
      args: {rfq_id: RFQ-900002}
      expect: ["labour", "8.39", "62.9", "tooling_amortised"]
    - tool: get_historic_quotes_by_origin
      args: {sku: SKU-102863}
      expect: ["VN", "28.95", "PT", "36.3"]
    - tool: send_rfq_clarification_request
      args: {rfq_id: RFQ-900002, response_id: RFR-900004, question: "Please re-quote on a simpler specification without the full lining", context: specification}
      expect: ["RFC-", "RFR-900004", "sent"]

- question: "04:37:Q1"
  story: >
    Four warehouse cleaning bids on RFX-900004 (24 call-outs a year assumed): CleanForce has the lowest headline price (98,000) but the second highest
    three-year cost (390,952.80) with 22,000 consumables, 180 call-outs and 6% uplift, and the weakest references (1 of 3 positive, 2 declined);
    Gleam Industrial is cheapest at 328,293.60; Meridian 361,182.40; BrightSpace 395,080.
  checks:
    - tool: compare_bids_by_criteria
      args: {rfx_id: RFX-900004}
      expect: ["Gleam Industrial Ltd", "328293.6", "1 of 3 positive", "Meridian Hygiene Group"]
    - tool: calculate_three_year_total_cost
      args: {rfx_id: RFX-900004}
      expect: ["390952.8", "361182.4", "395080", "66000"]
    - tool: get_supplier_references
      args: {rfx_id: RFX-900004}
      expect: ["CleanForce Services", "declined", "Wellingborough Logistics"]
    - tool: send_rfq_clarification_request
      args: {rfx_id: RFX-900004, rfx_response_id: RXR-900012, question: "Please confirm minimum staffing levels and how the price review clause works", context: service}
      expect: ["RFC-", "RXR-900012", "sent"]

- question: "04:39:Q6"
  story: >
    Recycled polyester suppliers with at most 20% premium: SUP-0001 (15%, RCS only, 2,500 tonnes, high risk), SUP-0032 (16%, GRS, 1,200 tonnes) and
    SUP-0004 (17.5%, GRS, 900 tonnes); chemically recycled (SUP-0070, SUP-0033) costs about 30% more so is excluded by the cap.
  checks:
    - tool: search_alternative_material_suppliers
      args: {material: polyester, max_price_premium_pct: 20}
      expect: ["SUP-0032", "16", "SUP-0004", "17.5", "SUP-0001", "2500"]
    - tool: search_alternative_material_suppliers
      args: {material: chemically recycled}
      expect: ["SUP-0070", "28.5", "SUP-0033", "31"]

- question: "04:40:Q1"
  story: >
    Small-appliance pack suppliers and capacity available to us (the indirect packaging suppliers): corrugated SUP-0081 (1,440,000 packs), recycled plastic
    SUP-0082 (450,000), moulded pulp SUP-0081 (120,000), so pulp cannot cover 400,000 packs a year.
  checks:
    - tool: search_packaging_suppliers_by_material
      args: {material: corrugated}
      expect: ["SUP-0081", "1440000", "corrugated"]
    - tool: search_packaging_suppliers_by_material
      args: {material: moulded pulp}
      expect: ["SUP-0081", "120000"]
    - tool: search_packaging_suppliers_by_material
      args: {material: recycled plastic}
      expect: ["SUP-0082", "450000"]

- question: "06:51:Q2"
  story: >
    Lunch box RFQ-900004 (60,000 units, target 3.20 FOB): Factory A SUP-0022 (FAC-0042) is lowest at 3.10 with 8,500 tooling but 60 days, capacity
    50,000 (10,000 short), no insulated lunch box experience and no audit documents; Factory B SUP-0010 3.25 and Factory C SUP-0012 3.40 with the
    best compliance score (90). At 40,000 units tooling adds 0.21, 0.19 and 0.23 a unit.
  checks:
    - tool: get_rfq_responses_for_product
      args: {product_name: insulated lunch box}
      expect: ["RFR-900009", "3.1", "RFR-900010", "3.25", "RFR-900011", "3.4"]
    - tool: compare_factory_quotes
      args: {rfq_id: RFQ-900004, volume_units: 40000}
      expect: ["8500", "0.21", "10000", "vacuum-insulated", "90"]

- question: "07:63:Q5"
  story: >
    Carrier and 3PL change: RFX-900001 holds the road carrier bids (CAR-001 incumbent, CAR-002 and CAR-003 challengers with transition costs) and
    RFX-900003 the three 3PL proposals with annual fees and transition costs.
  checks:
    - tool: get_carrier_bid_rates
      args: {rfx_id: RFX-900001}
      expect: ["CAR-002", "160000", "annual_cost_gbp", "transition_cost_gbp"]
    - tool: get_3pl_proposal_costs
      args: {rfx_id: RFX-900003}
      expect: ["Severn Valley Fulfilment", "95000", "three_year_cost_gbp"]
    - tool: create_rfx_event
      args: {event_type: 3pl_tender, description: "3PL provider tender for UK warehouse", response_deadline: "+45d", invited_bidders: "Northgate Contract Logistics,Severn Valley Fulfilment"}
      expect: ["RFX-", "Severn Valley Fulfilment"]
