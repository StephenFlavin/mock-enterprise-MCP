# One entry per question row that uses this system's tools (see: python -m mockmcp brief sourcing).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:12:Q2"
  story: >
    Carrier A (CAR-001) contract expires in January. Their schedule reliability is 92% OTIF on ocean freight lanes.
    Carriers B (CAR-002) and C (CAR-003) have submitted bids for 2026-2027 renewal (RFX-900001).
    The buyer drafts tender criteria with 40% weighting on reliability (92% threshold) and 30% on cost,
    then creates RFX-900001 as a carrier tender, and sends invitation to B and C to bid.
  checks:
    - tool: draft_tender_criteria
      args: {}
      expect: ["TENDER CRITERIA", "Schedule Reliability", "40%", "92%"]
    - tool: create_tender_event
      args: {description: "Ocean freight tender 2026-2027 renewal", response_deadline: "+30d"}
      expect: ["RFX-"]
    - tool: send_tender_invitation
      args: {rfx_id: RFX-900001}
      expect: ["invitation_sent", "RFX-900001"]

- question: "02:20:Q6"
  story: >
    The buyer creates a carrier scorecard template (TST-900001) with criteria for reliability (40%), cost (30%),
    service level (20%), and capacity (10%). The template is saved with minimum thresholds of 92% reliability,
    24-hour response time, and 500 TEU monthly capacity.
    They draft the scorecard and calculate weighted scores for current carriers on the RFX.
  checks:
    - tool: create_tender_scorecard_template
      args: {name: "Carrier Reliability 2026", description: "Carrier evaluation", purpose: "carrier reliability assessment"}
      expect: ["TST-"]
    - tool: draft_tender_scorecard
      args: {rfx_id: RFX-900001}
      expect: ["SCORECARD", "Reliability"]
    - tool: calculate_carrier_weighted_scores
      args: {rfx_id: RFX-900001}
      expect: ["weighted_score", "CAR-"]

- question: "04:32:Q3"
  story: >
    For AW26 bedding range (SKU-101904), three suppliers have bid on RFQ-900001:
    Supplier A (SUP-0001) at £8.50/unit lead time 45d, Supplier B (SUP-0002) at £9.20/unit 60d,
    Supplier C (SUP-0036) at £8.95/unit 50d with OEKO-TEX. The buyer creates sourcing awards
    splitting volume 50/50 to Suppliers A and C based on compliance and cost.
  checks:
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-101904}
      expect: ["SKU-101904", "8.50", "9.20", "8.95"]
    - tool: compare_factory_quotes
      args: {rfq_id: RFQ-900001}
      expect: ["SKU-101904", "SUP-0001", "SUP-0002", "SUP-0036"]
    - tool: create_sourcing_award
      args: {supplier_id: SUP-0001, sku: SKU-101904, volume_units: 100000, volume_split_pct: 50.0, unit_cost_gbp: 8.50, effective_date: "+30d"}
      expect: ["AWD-"]

- question: "04:33:Q3"
  story: >
    Currently 600k units of portable fans (PF-220) sourced from Bangladesh (SUP-0013 at £4.20/unit, 75d lead time).
    RFQ-900002 sent to Vietnam suppliers: SUP-0002 quotes £4.50/unit 65d and SUP-0008 quotes £4.65/unit 90d.
    The analysis shows Vietnam adds £0.30-£0.45/unit but saves 10-25 days lead time.
  checks:
    - tool: get_rfq_responses_for_product
      args: {sku: PF-220}
      expect: ["PF-220", "4.20", "4.50", "4.65"]
    - tool: get_historic_quotes_by_origin
      args: {sku: PF-220}
      expect: ["4.20", "PF-220"]

- question: "04:33:Q6"
  story: >
    Southern China faces new tariffs. RFQ-900002 for 600k denim units was sent to Vietnam factories.
    SUP-0002 (Vietnam) quotes £4.50 with 65d lead time. The search identifies Vietnamese factories
    with capacity and compliance ratings.
  checks:
    - tool: search_factories_by_capability_and_country
      args: {country: VN, capacity_units_month: 50000}
      expect: ["VN", "factory"]
    - tool: get_rfq_responses_for_product
      args: {sku: PF-220, status: received}
      expect: ["PF-220", "SUP-0002", "SUP-0008"]

- question: "04:34:Q1"
  story: >
    Fashion basics (SKU-101904 bedding) is evaluated for nearshore sourcing. RFQ-900007 sent to Portugal/Turkey.
    Portugal (SUP-0036) quotes £24.50/unit at 90d lead time.
    Turkey (SUP-0004) quotes £22.80/unit at 105d.
    Cost premium is 188% vs Bangladesh baseline of £8.50 but lead time improves to 90d vs 75d current.
  checks:
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-101904}
      expect: ["SKU-101904", "8.50", "24.50", "22.80"]
    - tool: search_factories_by_capability_and_country
      args: {country: PT}
      expect: ["PT", "factory"]

- question: "04:34:Q2"
  story: >
    Technical outerwear (SKU-100637) with seam-sealing and OEKO-TEX certification.
    RFQ-900003 responses: Portugal (SUP-0036) £22.50/unit 90d OEKO-TEX 95% compliance,
    Turkey (SUP-0004) £20.80/unit 105d 92% compliance, Morocco (SUP-0030) £19.50/unit 120d 88% compliance.
  checks:
    - tool: search_factories_by_capability_and_country
      args: {country: PT}
      expect: ["PT", "factory"]
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-100637}
      expect: ["SKU-100637", "22.50", "20.80", "19.50"]
    - tool: send_rfq_to_suppliers
      args: {rfq_id: RFQ-900007}
      expect: ["sent", "RFQ-900007"]

- question: "04:34:Q5"
  story: >
    Nearshore quotes for technical outerwear (SKU-100637) are 35% above target cost.
    RFQ-900003 responses show Portugal at £22.50/unit, Turkey at £20.80/unit (11% premium vs Bangladesh).
    Buyer reviews cost breakdown and identifies labour (25%), overhead (15%) and margin (10%) as drivers.
    Clarification requests sent to top 3 suppliers for component cost breakdown.
  checks:
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-100637}
      expect: ["SKU-100637", "22.50", "20.80"]
    - tool: get_quote_cost_breakdown_by_component
      args: {response_id: RFR-900007}
      expect: ["material_cost", "labour_cost", "overhead_cost"]
    - tool: get_historic_quotes_by_origin
      args: {sku: SKU-100637}
      expect: ["SKU-100637"]
    - tool: send_rfq_clarification_request
      args: {rfq_id: RFQ-900003, response_id: RFR-900007, question: "Can you break down the £22.50/unit cost by component?", context: "pricing"}
      expect: ["RFC-", "sent"]

- question: "04:37:Q1"
  story: >
    Four bids received for warehouse cleaning contract. The procurement manager uses compare_bids_by_criteria
    to score bids on price (30%), service levels (40%), references (20%), and risk (10%).
    Total 3-year costs calculated: Bid 1 = £150k (+ hidden call-out fees), Bid 2 = £145k, Bid 3 = £155k, Bid 4 = £140k.
    References show Bid 4 has weakest track record. Clarification requests sent to top 2 bidders.
  checks:
    - tool: compare_bids_by_criteria
      args: {rfx_id: RFX-900003}
      expect: ["service", "cost"]
    - tool: calculate_three_year_total_cost
      args: {response_id: RFR-900012}
      expect: ["year_1", "year_2", "year_3"]
    - tool: get_supplier_references
      args: {supplier_id: SUP-0043}
      expect: ["SUP-0043"]
    - tool: send_rfq_clarification_request
      args: {rfq_id: RFQ-900005, question: "What are your hidden costs - call-out fees, minimum hours, consumables?", context: "pricing"}
      expect: ["RFC-", "sent"]

- question: "04:39:Q6"
  story: >
    Raw materials buyer searches for alternative materials to virgin polyester.
    search_alternative_material_suppliers finds suppliers of recycled materials.
    Supply outlook shows 15-20% price premium but 30% reduction in carbon footprint.
  checks:
    - tool: search_alternative_material_suppliers
      args: {category_focus: material}
      expect: ["supplier"]

- question: "04:40:Q1"
  story: >
    Packaging buyer compares three materials for small-appliance packaging (400k units/year):
    Corrugated (SUP-0043) at £0.85/unit 30d lead time,
    Moulded pulp (SUP-0055) at £0.95/unit 35d lead time,
    Recycled plastic (SUP-0060) at £1.10/unit 40d lead time.
    RFQ-900005 sent. Supplier capacity available for all at required volumes.
    Total cost change per unit and damage rate impact assessed.
  checks:
    - tool: search_packaging_suppliers_by_material
      args: {category_focus: material}
      expect: ["supplier"]
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-100007}
      expect: ["0.85", "0.95", "1.10"]
    - tool: send_rfq_to_suppliers
      args: {rfq_id: RFQ-900005}
      expect: ["sent", "RFQ-900005"]

- question: "06:51:Q2"
  story: >
    New insulated lunch box (60k units, target £3.20 FOB). RFQ-900006 responses from three shortlisted factories:
    Factory A (FAC-0042) quotes £3.10/unit, £8,500 tooling, 60d lead time, 91% compliance,
    Factory B (FAC-0024) quotes £3.25/unit, £7,500 tooling, 50d lead time, 93% compliance (best),
    Factory C (FAC-0028) quotes £3.40/unit, £9,000 tooling, 45d lead time (fastest), 88% compliance.
    Buyer compares quotes and reviews factory compliance records.
  checks:
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-103157}
      expect: ["3.10", "3.25", "3.40"]
    - tool: compare_factory_quotes
      args: {rfq_id: RFQ-900006}
      expect: ["SKU-103157", "tooling"]
    - tool: get_supplier_references
      args: {supplier_id: SUP-0022}
      expect: ["SUP-0022"]

- question: "07:63:Q5"
  story: >
    Changing main carrier from A to B/C and evaluating 3PL RFX-900003 shows cost impact.
    Carrier A (CAR-001) annual cost £1,250,000 + £75,000 transition = £1,325,000 year 1.
    Carrier B (CAR-002) annual cost £1,100,000 + £95,000 transition = £1,195,000 year 1 (saves £130,000).
    3PL providers: A at £850,000 + £125k transition, B at £720,000 + £95k transition (best payback).
    Tender event RFX-900003 created to evaluate 3PLs with weighted scores calculated.
  checks:
    - tool: get_carrier_bid_rates
      args: {rfx_id: RFX-900001}
      expect: ["annual_cost", "transition_cost"]
    - tool: get_3pl_proposal_costs
      args: {rfx_id: RFX-900003}
      expect: ["annual_cost", "transition_cost"]
    - tool: calculate_three_year_total_cost
      args: {response_id: RFR-900001}
      expect: ["year_1", "year_2", "year_3"]
    - tool: calculate_carrier_weighted_scores
      args: {rfx_id: RFX-900001}
      expect: ["weighted_score", "CAR-"]
    - tool: create_rfx_event
      args: {event_type: "3pl_tender", description: "3PL tender evaluation", response_deadline: "+45d"}
      expect: ["RFX-"]
