    - tool: send_rfq_to_suppliers
      args: {rfq_id: RFQ-900005}
      expect: ["sent"]

- question: "06:51:Q2"
  story: >
    Lunch box factory quotes: RFQ-900006 for SKU-103157.
    Factory A (SUP-0022) £3.10, Factory B (SUP-0010) £3.25, Factory C (SUP-0012) £3.40.
    Compare with tooling costs and lead times.
  checks:
