    - tool: compare_factory_quotes
      args: {rfq_id: RFQ-900006}
      expect: ["tooling"]
    - tool: get_supplier_references
      args: {supplier_id: SUP-0022}
      expect: ["SUP-0022"]

- question: "07:63:Q5"
  story: >
    Carrier change impact: RFX-900001 ocean freight tender.
    Carrier costs with transition impact. Compare 3 bids.
    3PL evaluation on RFX-900003 with cost analysis.
  checks:
    - tool: get_carrier_bid_rates
      args: {rfx_id: RFX-900001}
      expect: ["annual_cost", "transition_cost"]
    - tool: get_3pl_proposal_costs
      args: {rfx_id: RFX-900003}
      expect: ["annual_cost", "transition_cost"]
    - tool: calculate_three_year_total_cost
      args: {response_id: RFR-900001}
      expect: ["year_1", "three_year"]
    - tool: calculate_carrier_weighted_scores
      args: {rfx_id: RFX-900001}
      expect: ["weighted_score", "Collins"]
    - tool: create_rfx_event
      args: {event_type: "3pl_tender", description: "3PL evaluation", response_deadline: "+45d"}
      expect: ["RFX-"]
