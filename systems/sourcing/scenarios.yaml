# One entry per question row that uses this system's tools (see: python -m mockmcp brief sourcing).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:12:Q2"
  story: >
    Carrier negotiations: RFX-900001 is a carrier tender for ocean freight 2026-2027.
    Draft tender criteria, create the RFX tender event, and send invitations to carriers.
  checks:
    - tool: draft_tender_criteria
      args: {}
      expect: ["TENDER CRITERIA", "Schedule Reliability", "92%"]
    - tool: create_tender_event
      args: {description: "Ocean freight 2026-2027", response_deadline: "+30d"}
      expect: ["RFX-"]
    - tool: send_tender_invitation
      args: {rfx_id: RFX-900001}
      expect: ["invitation_sent"]

- question: "02:20:Q6"
  story: >
    Create scorecard template TST-900001 with criteria weights.
    Draft the scorecard for RFX-900001 and calculate weighted scores for carriers.
  checks:
    - tool: create_tender_scorecard_template
      args: {name: "Carrier Template", description: "Evaluation", purpose: "assessment"}
      expect: ["TST-"]
    - tool: draft_tender_scorecard
      args: {rfx_id: RFX-900001}
      expect: ["SCORECARD", "Reliability"]
    - tool: calculate_carrier_weighted_scores
      args: {rfx_id: RFX-900001}
      expect: ["weighted_score", "Collins"]

- question: "04:32:Q3"
  story: >
    Bedding procurement: RFQ-900001 for SKU-101904 received 3 quotes.
    Brown Textiles at £8.50/unit, Harris at £9.20/unit, Brennan at £8.95/unit.
    Award split 50/50 to Brown and Brennan.
  checks:
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-101904}
      expect: ["Brown Textiles", "Harris Manufacturing", "Brennan Textiles", "8.5", "9.2", "8.95"]
    - tool: compare_factory_quotes
      args: {rfq_id: RFQ-900001}
      expect: ["Brown Textiles", "Harris"]
    - tool: create_sourcing_award
      args: {supplier_id: SUP-0001, sku: SKU-101904, volume_units: 100000, volume_split_pct: 50.0, unit_cost_gbp: 8.50, effective_date: "+30d"}
      expect: ["AWD-"]

- question: "04:33:Q3"
  story: >
    Denim sourcing: RFQ-900002 for PF-220 portable fans (600k units).
    Bangladesh baseline: Lynch Homewares £4.20/unit 75d lead time.
    Vietnam options: Harris at £4.50/unit 65d, Sheppard at £4.65/unit 90d.
  checks:
    - tool: get_rfq_responses_for_product
      args: {sku: PF-220}
      expect: ["Lynch Homewares", "Harris", "Sheppard", "4.2", "4.5", "4.65"]
    - tool: get_historic_quotes_by_origin
      args: {sku: PF-220}
      expect: ["PF-220"]

- question: "04:33:Q6"
  story: >
    China diversification: Vietnam factories for denim sourcing.
    Harris Manufacturing and Sheppard Products submit quotes on RFQ-900002.
  checks:
    - tool: search_factories_by_capability_and_country
      args: {country: VN}
      expect: ["factory", "VN"]
    - tool: get_rfq_responses_for_product
      args: {sku: PF-220, status: received}
      expect: ["Harris Manufacturing", "Sheppard"]

- question: "04:34:Q1"
  story: >
    Nearshore bedding: RFQ-900007 for SKU-101904 bedding nearshore pilot.
    Brennan Textiles (Portugal) £24.50/unit 90d, Collins Textiles (Turkey) £22.80/unit 105d.
  checks:
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-101904}
      expect: ["Brennan", "Collins", "24.5", "22.8"]
    - tool: search_factories_by_capability_and_country
      args: {country: PT}
      expect: ["factory"]

- question: "04:34:Q2"
  story: >
    Technical outerwear: RFQ-900003 for SKU-100637 trouser from 3 factories.
    Brennan (Portugal) £22.50 OEKO-TEX, Collins (Turkey) £20.80, supplier 30 (Morocco) £19.50.
  checks:
    - tool: search_factories_by_capability_and_country
      args: {country: TR}
      expect: ["factory"]
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-100637}
      expect: ["Brennan", "Collins", "22.5", "20.8", "19.5"]
    - tool: send_rfq_to_suppliers
      args: {rfq_id: RFQ-900007}
      expect: ["sent"]

- question: "04:34:Q5"
  story: >
    Nearshore cost analysis: RFQ-900003 responses show Portugal premium.
    Brennan at £22.50/unit, Collins at £20.80/unit vs baseline. Cost breakdown by component.
  checks:
    - tool: get_rfq_responses_for_product
      args: {sku: SKU-100637}
      expect: ["Brennan", "Collins", "22.5", "20.8"]
    - tool: get_quote_cost_breakdown_by_component
      args: {response_id: RFR-900007}
      expect: ["material_cost", "labour_cost", "margin"]
    - tool: get_historic_quotes_by_origin
      args: {sku: SKU-100637}
      expect: ["SKU-100637"]
    - tool: send_rfq_clarification_request
      args: {rfq_id: RFQ-900003, response_id: RFR-900007, question: "Cost breakdown?", context: "pricing"}
      expect: ["RFC-", "sent"]

- question: "04:37:Q1"
  story: >
    Warehouse cleaning bids: RFX-900003 has 3 proposals scored.
    Compare on price, service levels, references using RXR-900007, 900008, 900009.
    Calculate 3-year total cost.
  checks:
    - tool: compare_bids_by_criteria
      args: {rfx_id: RFX-900003}
      expect: ["service", "cost"]
    - tool: calculate_three_year_total_cost
      args: {response_id: RFR-900012}
      expect: ["year_1", "year_3"]
    - tool: get_supplier_references
      args: {supplier_id: SUP-0043}
      expect: ["SUP-0043"]
    - tool: send_rfq_clarification_request
      args: {rfq_id: RFQ-900005, question: "Hidden costs?", context: "pricing"}
      expect: ["RFC-", "sent"]

- question: "04:39:Q6"
  story: >
    Alternative materials: Search for specialist material suppliers.
  checks:
    - tool: search_alternative_material_suppliers
      args: {category_focus: Home}
      expect: ["supplier", "Home"]

- question: "04:40:Q1"
  story: >
    Packaging comparison: RFQ-900005 for SKU-100007 packaging.
