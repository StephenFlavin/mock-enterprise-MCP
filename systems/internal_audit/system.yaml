id: internal_audit
name: Internal Audit System
instructions: >
  Internal audit findings, control test results, remediation actions and fraud cases.
  Action ids look like ACT-000123, case ids like CASE-000123, engagement ids like ENG-000123.
  Use it for audit universe coverage, control test results, audit findings, fraud cases,
  remediation actions and closure evidence.

tables:
  audit_actions:
    key: action_id
    cols:
      action_id: {type: str, desc: "Audit action, e.g. ACT-000123"}
      description: {type: str, desc: "What needs to be fixed"}
      audit_area: {type: str, desc: "Area this action relates to, e.g. vendor controls"}
      owner_employee_id: {type: str, desc: "Employee assigned to fix it"}
      due_date: {type: date, desc: "Target completion date"}
      status: {type: enum, values: [open, completed, reopened, overdue], desc: "Status"}
      opened_at: {type: timestamp, desc: "When action was created"}
      closed_at: {type: timestamp, desc: "When action was closed"}
      evidence: {type: text, desc: "Closure evidence or notes"}
      updated_at: {type: timestamp, desc: "Last update"}
      status_changed_at: {type: timestamp, desc: "When the status last changed"}
      status_note: {type: text, desc: "Reason for the last status change, e.g. why reopened"}

  audit_cases:
    key: case_id
    cols:
      case_id: {type: str, desc: "Investigation case, e.g. CASE-000123"}
      finding_area: {type: str, desc: "Area of investigation, e.g. purchase orders"}
      description: {type: text, desc: "What was found"}
      risk_score: {type: int, desc: "Likelihood of control failure or fraud (1-100)"}
      opened_at: {type: timestamp, desc: "When case was opened"}
      status: {type: enum, values: [open, in_progress, closed, escalated], desc: "Case status"}
      assigned_to: {type: str, desc: "Employee assigned"}
      site_id: {type: str, desc: "Site involved, if applicable"}
      estimated_impact_gbp: {type: float, desc: "Estimated financial impact"}
      updated_at: {type: timestamp, desc: "Last update"}

  audit_engagements:
    key: engagement_id
    cols:
      engagement_id: {type: str, desc: "Audit engagement, e.g. ENG-000123"}
      audit_area: {type: str, desc: "Area being audited, e.g. inventory controls"}
      scope: {type: text, desc: "What the engagement covers"}
      site_id: {type: str, desc: "Site being audited, if applicable"}
      planned_start: {type: date, desc: "Planned start date"}
      planned_end: {type: date, desc: "Planned end date"}
      status: {type: enum, values: [planned, in_progress, completed, cancelled], desc: "Engagement status"}
      lead_auditor: {type: str, desc: "Employee leading the audit"}
      estimated_hours: {type: int, desc: "Estimated audit hours"}
      created_at: {type: timestamp, desc: "When engagement was created"}
      updated_at: {type: timestamp, desc: "Last update"}

  control_test_results:
    key: test_id
    cols:
      test_id: {type: str, desc: "Test result id, e.g. TST-000123"}
      site_id: {type: str, desc: "DC site"}
      control_area: {type: str, desc: "Area of control tested, e.g. stock count verification"}
      test_description: {type: str, desc: "What was tested"}
      result: {type: enum, values: [pass, fail, partial], desc: "Test result"}
      tested_date: {type: date, desc: "Date of test"}
      sample_size: {type: int, desc: "Number of items tested"}
      exceptions_found: {type: int, desc: "Number of exceptions"}
      root_cause: {type: str, desc: "Root cause if failed"}
      audit_action_id: {type: str, desc: "Related audit action if applicable"}
      created_at: {type: timestamp, desc: "When result was recorded"}

  audit_findings:
    key: finding_id
    cols:
      finding_id: {type: str, desc: "Finding, e.g. FND-000123"}
      site_id: {type: str, desc: "Site involved"}
      audit_area: {type: str, desc: "Area of finding, e.g. inventory controls"}
      description: {type: text, desc: "Description of finding"}
      severity: {type: enum, values: [high, medium, low], desc: "Severity rating"}
      audit_date: {type: date, desc: "Date of audit"}
      status: {type: enum, values: [open, in_remediation, resolved, accepted_risk], desc: "Status"}
      related_action_id: {type: str, desc: "Related audit action if any"}
      created_at: {type: timestamp, desc: "When finding was created"}

  fraud_cases:
    key: fraud_case_id
    cols:
      fraud_case_id: {type: str, desc: "Fraud case, e.g. FRD-000123"}
      case_type: {type: str, desc: "Fraud scheme type, e.g. duplicate invoice, vendor collusion"}
      description: {type: text, desc: "Description of the fraud"}
      detected_date: {type: date, desc: "Date fraud was detected"}
      site_id: {type: str, desc: "Site involved, if applicable"}
      estimated_loss_gbp: {type: float, desc: "Estimated financial loss"}
      status: {type: enum, values: [reported, under_investigation, closed, referred_to_authorities], desc: "Case status"}
      created_at: {type: timestamp, desc: "When case was created"}

  assurance_findings:
    key: assurance_finding_id
    cols:
      assurance_finding_id: {type: str, desc: "Assurance finding, e.g. ASSU-000123"}
      esg_category: {type: str, desc: "ESG category, e.g. Scope 2 emissions, energy efficiency"}
      description: {type: text, desc: "Finding description"}
      audit_date: {type: date, desc: "Date of audit or assurance review"}
      status: {type: enum, values: [open, addressed, under_review], desc: "Status"}
      finding_type: {type: str, desc: "Type, e.g. data quality, methodology, boundary"}
      created_at: {type: timestamp, desc: "When finding was created"}

  audit_universe:
    key: audit_area_id
    cols:
      audit_area_id: {type: str, desc: "Audit area identifier"}
      audit_area: {type: str, desc: "Name of audit area, e.g. vendor controls, stock accuracy"}
      description: {type: str, desc: "What this area covers"}
      risk_rating: {type: enum, values: [high, medium, low], desc: "Inherent risk"}
      last_audit_date: {type: date, desc: "Date of last audit"}
      audit_frequency_months: {type: int, desc: "Recommended frequency in months"}
      created_at: {type: timestamp, desc: "When added to universe"}

  audit_resource_plan:
    key: resource_plan_id
    cols:
      resource_plan_id: {type: str, desc: "Resource plan entry, e.g. RES-000123"}
      auditor_employee_id: {type: str, desc: "Auditor employee id"}
      period_start: {type: date, desc: "Start of the 4-week planning period"}
      capacity_hours: {type: int, desc: "Audit hours available in the period"}
      committed_pct: {type: int, desc: "Percentage of capacity already committed to planned work"}
      planned_areas: {type: str, desc: "Work already planned in the period"}
      created_at: {type: timestamp, desc: "When plan was created"}

tools:
  - name: search_internal_fraud_cases
    desc: Past internal fraud cases by scheme type, site or detection date, with how many cases of each scheme. Use to find the most common schemes.
    kind: sql
    args:
      case_type: {desc: "Type of fraud, e.g. duplicate invoice, fictitious vendor"}
      site_id: {}
      detected_from: {type: date, default: "-730d", desc: "Cases detected on or after"}
    sql: |
      SELECT fraud_case_id, case_type, description, detected_date, site_id, estimated_loss_gbp, status,
             count(*) OVER (PARTITION BY case_type) AS cases_of_this_type
      FROM fraud_cases
      WHERE ($case_type IS NULL OR case_type ILIKE '%' || $case_type || '%')
        AND ($site_id IS NULL OR site_id = $site_id)
        AND detected_date >= CAST($detected_from AS DATE)
      ORDER BY cases_of_this_type DESC, case_type, detected_date DESC
    limit: 50
    example: {}

  - name: get_assurance_findings
    desc: Prior assurance and audit findings on ESG data, methodology or boundary issues. Use to understand audit concerns about reported numbers.
    kind: sql
    args:
      esg_category: {desc: "ESG category, e.g. Scope 2 emissions"}
      finding_type: {desc: "Type of finding, e.g. data quality, methodology, boundary"}
      status: {desc: "Finding status: open, under_review or addressed"}
      audit_from: {type: date, desc: "Findings from reviews on or after this date"}
    sql: |
      SELECT assurance_finding_id, esg_category, finding_type, description, audit_date, status
      FROM assurance_findings
      WHERE ($esg_category IS NULL OR esg_category ILIKE '%' || $esg_category || '%')
        AND ($finding_type IS NULL OR finding_type ILIKE '%' || $finding_type || '%')
        AND ($status IS NULL OR status = $status)
        AND ($audit_from IS NULL OR audit_date >= CAST($audit_from AS DATE))
      ORDER BY audit_date DESC
    limit: 50
    example: {esg_category: Scope 2}

  - name: get_audit_universe_and_coverage
    desc: Audit universe with last audit date, months since audit, coverage status (never, overdue, due_soon, current) and open findings per area. Use to plan next year's audits.
    kind: sql
    args:
      risk_rating: {}
      coverage_status: {type: str, desc: "never, overdue, due_soon (due within 6 months) or current"}
    sql: |
      WITH u AS (
        SELECT audit_area_id, audit_area, description, risk_rating, last_audit_date, audit_frequency_months,
               CASE WHEN last_audit_date IS NULL THEN 'never'
                    WHEN last_audit_date + to_months(audit_frequency_months) < CAST($as_of AS DATE) THEN 'overdue'
                    WHEN last_audit_date + to_months(audit_frequency_months) < CAST($as_of AS DATE) + INTERVAL 183 DAY THEN 'due_soon'
                    ELSE 'current' END AS coverage_status,
               date_diff('month', last_audit_date, CAST($as_of AS DATE)) AS months_since_last_audit,
               last_audit_date + to_months(audit_frequency_months) AS next_due_date
        FROM audit_universe)
      SELECT u.*, (SELECT count(*) FROM audit_findings f WHERE f.audit_area = u.audit_area
                     AND f.status IN ('open', 'in_remediation')) AS open_findings
      FROM u
      WHERE ($risk_rating IS NULL OR risk_rating = $risk_rating)
        AND ($coverage_status IS NULL OR coverage_status = $coverage_status)
      ORDER BY last_audit_date ASC NULLS FIRST, audit_area
    limit: 100
    example: {}

  - name: get_dc_control_test_results
    desc: Control test results by site and control area with pass/fail, sample size and exceptions. Use to assess control strength at each DC.
    kind: sql
    args:
      site_id: {}
      result: {}
      control_area: {type: str, desc: "Control tested, e.g. stock count verification, inventory valuation, slow-stock provision"}
      tested_from: {type: date, default: "-90d", desc: "Tests from on or after"}
    sql: |
      SELECT test_id, site_id, control_area, test_description, result, tested_date,
             sample_size, exceptions_found, root_cause, audit_action_id
      FROM control_test_results
      WHERE ($site_id IS NULL OR site_id = $site_id)
        AND ($result IS NULL OR result = $result)
        AND ($control_area IS NULL OR control_area ILIKE '%' || $control_area || '%')
        AND tested_date >= CAST($tested_from AS DATE)
      ORDER BY site_id, control_area, tested_date DESC
    limit: 100
    example: {site_id: DC1}

  - name: get_internal_audit_resource_plan
    desc: Audit team capacity by auditor and 4-week period, with hours already committed, free hours and planned work. Use to size next year's plan.
    kind: sql
    args:
      auditor_employee_id: {}
      period_from: {type: date, default: "-28d", desc: "Planning periods starting on or after"}
      period_to: {type: date, default: "+400d", desc: "Planning periods starting on or before"}
    sql: |
      SELECT resource_plan_id, auditor_employee_id, period_start, capacity_hours, committed_pct,
             round(capacity_hours * (100 - committed_pct) / 100.0) AS free_hours, planned_areas
      FROM audit_resource_plan
      WHERE ($auditor_employee_id IS NULL OR auditor_employee_id = $auditor_employee_id)
        AND period_start >= CAST($period_from AS DATE)
        AND period_start <= CAST($period_to AS DATE)
      ORDER BY period_start, auditor_employee_id
    limit: 100
    example: {}

  - name: get_prior_audit_findings
    desc: Previous audit findings by site and audit area with severity, status and the related action. Use to assess control effectiveness trends.
    kind: sql
    args:
      site_id: {}
      audit_area: {desc: "Audit area, e.g. stock count accuracy, inventory valuation"}
      severity: {}
      status: {desc: "Finding status: open, in_remediation, resolved or accepted_risk"}
      audit_from: {type: date, desc: "Findings from audits on or after this date"}
    sql: |
      SELECT finding_id, site_id, audit_area, description, severity, audit_date, status, related_action_id
      FROM audit_findings
      WHERE ($site_id IS NULL OR site_id = $site_id)
        AND ($audit_area IS NULL OR audit_area ILIKE '%' || $audit_area || '%')
        AND ($severity IS NULL OR severity = $severity)
        AND ($status IS NULL OR status = $status)
        AND ($audit_from IS NULL OR audit_date >= CAST($audit_from AS DATE))
      ORDER BY audit_date DESC, finding_id
    limit: 100
    example: {site_id: DC1}

  - name: list_audit_actions
    desc: Audit actions with status, owner, due and closed dates. Filter by status, area or when opened (e.g. last year's actions).
    kind: sql
    args:
      status: {}
      audit_area: {}
      owner_employee_id: {}
      opened_from: {type: date, desc: "Actions opened on or after this date"}
      opened_to: {type: date, desc: "Actions opened on or before this date"}
      overdue_only: {type: bool, desc: "Show only open, overdue or reopened actions past their due date"}
    sql: |
      SELECT action_id, description, audit_area, owner_employee_id, due_date, status,
             CAST(opened_at AS DATE) AS opened_date, CAST(closed_at AS DATE) AS closed_date,
             CASE WHEN status IN ('open', 'overdue', 'reopened') AND due_date < CAST($as_of AS DATE) THEN 'YES' ELSE 'NO' END AS is_overdue
      FROM audit_actions
      WHERE ($status IS NULL OR status = $status)
        AND ($audit_area IS NULL OR audit_area ILIKE '%' || $audit_area || '%')
        AND ($owner_employee_id IS NULL OR owner_employee_id = $owner_employee_id)
        AND ($opened_from IS NULL OR CAST(opened_at AS DATE) >= CAST($opened_from AS DATE))
        AND ($opened_to IS NULL OR CAST(opened_at AS DATE) <= CAST($opened_to AS DATE))
        AND ($overdue_only IS NULL OR $overdue_only = FALSE
             OR (status IN ('open', 'overdue', 'reopened') AND due_date < CAST($as_of AS DATE)))
      ORDER BY due_date ASC, action_id
    limit: 100
    example: {status: completed}

  - name: get_action_evidence
    desc: Closure evidence and notes attached to audit actions, one action or all. Use to see what was claimed when an action was closed.
    kind: sql
    args:
      action_id: {}
      status: {}
      audit_area: {}
    sql: |
      SELECT action_id, description, audit_area, owner_employee_id, due_date, status,
             CAST(opened_at AS DATE) AS opened_date, CAST(closed_at AS DATE) AS closed_date, evidence, status_note
      FROM audit_actions
      WHERE ($action_id IS NULL OR action_id = $action_id)
        AND ($status IS NULL OR status = $status)
        AND ($audit_area IS NULL OR audit_area ILIKE '%' || $audit_area || '%')
        AND (evidence IS NOT NULL OR $action_id IS NOT NULL)
      ORDER BY closed_at DESC NULLS LAST, action_id
    limit: 50
    example: {action_id: ACT-900101}

  - name: search_control_test_results
    desc: Retest results linked to audit actions, with the action's status and whether the test came after closure. Use to check fixes held.
    kind: sql
    args:
      audit_action_id: {}
      result: {}
      site_id: {}
    sql: |
      SELECT t.test_id, t.audit_action_id, a.status AS action_status, CAST(a.closed_at AS DATE) AS action_closed_date,
             t.site_id, t.control_area, t.test_description, t.result, t.tested_date,
             t.sample_size, t.exceptions_found, t.root_cause,
             t.tested_date > CAST(a.closed_at AS DATE) AS tested_after_closure
      FROM control_test_results t JOIN audit_actions a ON a.action_id = t.audit_action_id
      WHERE ($audit_action_id IS NULL OR t.audit_action_id = $audit_action_id)
        AND ($result IS NULL OR t.result = $result)
        AND ($site_id IS NULL OR t.site_id = $site_id)
      ORDER BY t.audit_action_id, t.tested_date DESC
    limit: 100
    example: {audit_action_id: ACT-900101}

  - name: create_audit_case
    desc: Opens an investigation case for a finding with risk score and area. Returns the new case.
    kind: insert
    table: audit_cases
    id_prefix: CASE-
    defaults: {status: open, opened_at: $as_of}
    args:
      finding_area: {required: true, desc: "Area of investigation, e.g. purchase orders"}
      description: {required: true}
      risk_score: {type: int, required: true, desc: "Likelihood score 1-100"}
      site_id: {}
      assigned_to: {desc: "Employee id of the investigator, e.g. EMP-00101"}
      estimated_impact_gbp: {type: float}
    example: {finding_area: "Duplicate invoices", description: "Three invoices received for same PO from same vendor", risk_score: 75, estimated_impact_gbp: 15000}

  - name: create_audit_action
    desc: Logs a remediation action with owner and due date for fixing a finding. Returns the new action.
    kind: insert
    table: audit_actions
    id_prefix: ACT-
    defaults: {status: open, opened_at: $as_of, status_changed_at: $as_of}
    args:
      description: {required: true}
      audit_area: {required: true, desc: "Area this addresses, e.g. vendor controls"}
      owner_employee_id: {required: true}
      due_date: {type: date, required: true}
    example: {description: "Enforce dual approval on bank detail changes in the system", audit_area: "Vendor controls", owner_employee_id: "EMP-00085", due_date: "+30d"}

  - name: create_audit_engagement
    desc: Adds an engagement with audit area, scope and dates to the audit plan. Returns the new engagement.
    kind: insert
    table: audit_engagements
    id_prefix: ENG-
    defaults: {status: planned}
    args:
      audit_area: {required: true, desc: "Area to audit, e.g. inventory controls"}
      scope: {required: true}
      site_id: {}
      planned_start: {type: date}
      planned_end: {type: date}
      lead_auditor: {desc: "Employee id of the lead auditor, e.g. EMP-00101"}
      estimated_hours: {type: int}
    example: {audit_area: "Stock count accuracy", scope: "All three DCs: cycle count procedures, system reconciliation, variance investigation", planned_start: "+60d", planned_end: "+90d", lead_auditor: "EMP-00101", estimated_hours: 120}

  - name: update_audit_action_status
    desc: Changes an audit action's status (e.g. completed, reopened) with an optional reason. Returns old and new status.
    kind: update
    table: audit_actions
    set: {status: "{status}", status_changed_at: $as_of}
    args:
      status: {required: true, type: enum, values: [open, completed, reopened, overdue], desc: "New status"}
      status_note: {desc: "Reason for the change, e.g. retest failed so reopened"}
      evidence: {desc: "Closure evidence, when completing"}
    example: {action_id: ACT-900101, status: reopened, status_note: "Retest failed: variances not recounted"}
