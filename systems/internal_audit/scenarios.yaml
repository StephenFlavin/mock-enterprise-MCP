  story: Review DC control test results and prior audit findings to assess control strength at each site. The seed data shows DC1 had findings on stock count accuracy (high severity, opened March 2026) and payment authorization (high severity, opened Feb 2026). Recent control tests show DC1 passed stock count test (TST-900001, 30 samples, 0 exceptions) but failed payment authorization test with 3 exceptions (TST-900002). DC2 also failed vendor master changes test with 5 exceptions on bank detail approvals (TST-900004). DC3 had partial pass on stock count with location issues.
