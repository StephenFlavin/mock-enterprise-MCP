- question: "04:41:Q6"
  story: Fifteen past fraud cases; Fictitious vendor is the most common scheme (FRD-900001 to FRD-900005, 5 cases), then duplicate invoice (3), bank detail change fraud, order splitting and collusion (2 each), invoice manipulation (1).
  checks:
    - tool: search_internal_fraud_cases
      args: {}
      expect: ["Fictitious vendor", "Bank detail change fraud", "Duplicate invoice", "FRD-900001"]
    - tool: search_internal_fraud_cases
      args: {case_type: "duplicate"}
      expect: ["FRD-900008", "Duplicate invoice"]

- question: "05:48:Q2"
  story: Scope 2 assurance findings explain the fall: DC1-3 switched to market-based reporting without restating last year (ASSU-900001), DC6 left the boundary with comparatives not recalculated (ASSU-900002), REGO certificates do not cover all consumption (ASSU-900003).
  checks:
    - tool: get_assurance_findings
      args: {esg_category: "Scope 2"}
      expect: ["Methodology", "Boundary change", "ASSU-900001", "ASSU-900002", "DC6", "REGO"]
    - tool: get_assurance_findings
      args: {finding_type: "Boundary change"}
      expect: ["ASSU-900002", "open"]

- question: "07:68:Q1"
  story: Opening investigation cases for the top anomalies; the write returns the stored case with open status and an opened date.
  checks:
    - tool: create_audit_case
      args: {finding_area: "Duplicate invoices", description: "Three invoices from SUP-0005 for the same PO", risk_score: 75, site_id: DC1, assigned_to: EMP-00101, estimated_impact_gbp: 3500}
      expect: ["CASE-", "open", "Duplicate invoices", "3500"]

- question: "07:68:Q2"
  story: DC1 is weakest (stock count, cycle counting, valuation, provision and payment tests fail or partial); DC2 partial on cycle counts and provisions; DC3 mostly passes.
  checks:
    - tool: get_dc_control_test_results
      args: {site_id: DC1}
      expect: ["TST-900101", "fail", "spreadsheet", "recounted"]
    - tool: get_dc_control_test_results
      args: {site_id: DC3}
      expect: ["TST-900114", "wrong bin", "pass"]
    - tool: get_prior_audit_findings
      args: {audit_area: "Inventory valuation"}
      expect: ["FND-900109", "FND-900112", "spreadsheet"]

- question: "07:68:Q3"
  story: Four areas never audited, Fixed asset management is the oldest audited area, high findings are open in vendor onboarding and DC1 provisions, and capacity is reduced by a half-time secondment.
  checks:
    - tool: get_audit_universe_and_coverage
      args: {coverage_status: never}
      expect: ["Customs and import duty", "Supplier onboarding and due diligence", "ESG data and emissions reporting", "Store returns and refunds"]
    - tool: get_audit_universe_and_coverage
      args: {coverage_status: overdue}
      expect: ["Fixed asset management", "Journal entries", "Cash handling"]
    - tool: get_prior_audit_findings
      args: {severity: high, status: open}
      expect: ["FND-900108", "FND-900112"]
    - tool: get_internal_audit_resource_plan
      args: {}
      expect: ["EMP-00103", "Half-time", "EMP-00104"]
    - tool: create_audit_engagement
      args: {audit_area: "Supplier onboarding and due diligence", scope: "Pre-contract checks", planned_start: "+60d", planned_end: "+90d", lead_auditor: EMP-00101, estimated_hours: 160}
      expect: ["ENG-", "planned", "160"]

- question: "07:68:Q4"
  story: Last year's dual approval action (ACT-900102) closed on paper and DC2 retest fails; a new enforcement action is logged.
  checks:
    - tool: create_audit_action
      args: {description: "Enforce dual approval on vendor bank detail changes in the system", audit_area: "Bank detail changes", owner_employee_id: EMP-00085, due_date: "+30d"}
      expect: ["ACT-", "open", "dual approval", "EMP-00085"]

- question: "07:68:Q6"
  story: Seven actions closed last year; ACT-900101, ACT-900102 and ACT-900103 fail retests after closure, ACT-900107 has no retest, ACT-900104 to ACT-900106 are genuinely fixed.
  checks:
    - tool: list_audit_actions
      args: {status: completed}
      expect: ["ACT-900101", "ACT-900107", "completed"]
    - tool: search_control_test_results
      args: {result: fail}
      expect: ["ACT-900101", "ACT-900102", "ACT-900103", "fail"]
    - tool: get_action_evidence
      args: {action_id: ACT-900107}
      expect: ["No retest scheduled"]
    - tool: update_audit_action_status
      args: {action_id: ACT-900101, status: reopened, status_note: "Retest failed"}
      expect: ["reopened", "Retest failed"]
    - tool: list_audit_actions
      args: {status: reopened}
      expect: ["ACT-900101"]
