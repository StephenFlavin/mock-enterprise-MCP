# Scenarios for cost_model: one entry per question in the brief
- question: "01:9:Q4"
  story: >
    Northampton DC (DC1, 850,000 sq ft) is costed for three forklift controls. Pedestrian exclusion is 480,000 capex and
    32,000 a year for 50% fewer incidents; proximity sensors 310,000 and 46,000 a year for 58%; speed limiters 96,000 and
    9,000 a year for 38%. The site size comes from master data, so a site id is enough.
  checks:
    - tool: calculate_control_option_cost
      args: {site_id: DC1}
      expect: ["pedestrian_exclusion", "480000", "310000", "96000", "576000", "58"]

- question: "01:10:Q4"
  story: >
    The DC1 sorter AST-DC1-SRT (about 12 years old per fixed assets, replacement cost 2.74m in master) has three options.
    Over seven years: repair 2.02m with a 45% chance of a high-downtime year, overhaul 1.48m at 20%, replace 2.80m at 6%
    (52 weeks to deliver). With volume up 20% repair rises to 2.42m, overhaul 1.66m and replace 2.87m.
  checks:
    - tool: calculate_lifecycle_cost_options
      args: {asset_id: AST-DC1-SRT, evaluation_years: 7}
      expect: ["2742290", "2016000", "1483000", "2804061", "52"]
    - tool: calculate_lifecycle_cost_options
      args: {asset_id: AST-DC1-SRT, evaluation_years: 7, volume_growth_pct: 20}
      expect: ["2419200", "1663600", "2871261"]

- question: "04:32:Q1"
  story: >
    Supplier A (SUP-0060, 4.80) and Supplier B (SUP-0032, 4.10) quote the 750ml double-wall bottle (SKU-102590, a
    Drinkware stand-in). Should-cost at 50,000 units is 4.18 (tooling 0.28 over 14,000). Supplier A margin 0.69 against
    0.45 and labour 1.20 against 1.00 are out of line; Supplier B has no tooling and no freight (EXW) and a 0.75 margin,
    so its price is only plausible because of a cheaper 201 steel and 0.5 mm wall plus missing lines.
  checks:
    - tool: calculate_should_cost
      args: {sku: SKU-102590, volume_units: 50000}
      expect: ["4.18", "1.75", "0.28", "0.45"]
    - tool: compare_quotes_by_cost_component
      args: {sku: SKU-102590}
      expect: ["SUP-0060", "SUP-0032", "0.69", "NOT QUOTED"]
    - tool: draft_negotiation_questions_for_buyer
      args: {sku: SKU-102590, supplier_id: SUP-0060}
      expect: ["Supplier margin", "Labour"]

- question: "04:34:Q5"
  story: >
    Nearshore coat SKU-102863: five quotes from 44.60 to 51.40 against an expected 38.07. The highest, SUP-0058, is 35%
    above; labour is 21.60 against 13.21 and is 63% of its premium, then material 17%, overhead and freight 11% and new
    tooling 10%.
  checks:
    - tool: compare_quotes_by_cost_component
      args: {sku: SKU-102863, supplier_id: SUP-0058}
      expect: ["21.6", "13.21", "63", "35"]
    - tool: compare_quotes_by_cost_component
      args: {sku: SKU-102863, component_type: labour}
      expect: ["SUP-0037", "SUP-0079", "16.5"]

- question: "06:58:Q1"
  story: >
    Padded jacket quote (style STY-7731 stands in for PJ-2401, SKU-103157, SUP-0022, Turkey) is 28.52 against a
    should-cost of 23.41. Lines out of line: margin +48%, trims +32%, overhead +23%, labour +21%, fabric +14%.
    Turkish sewing labour is 4.50 an hour.
  checks:
    - tool: calculate_should_cost_for_style
      args: {style_id: STY-7731, volume_units: 50000}
      expect: ["23.41", "13", "5.3", "2.51"]
    - tool: compare_quote_lines_to_benchmarks
      args: {sku: SKU-103157, supplier_id: SUP-0022}
      expect: ["48.2", "31.8", "23.1", "20.8", "13.9"]
    - tool: get_labour_rates_by_country
      args: {country: TR, role: sewing}
      expect: ["4.5", "4.25"]
    - tool: draft_negotiation_questions_for_buyer
      args: {sku: SKU-103157, supplier_id: SUP-0022}
      expect: ["Margin", "Trims", "Overhead"]

- question: "06:58:Q3"
  story: >
    K-1700 costs 24.67 a unit so 8% is 1.97. Seven options exist (0.30 to 0.62 each). The LED ring removal is the only
    significant customer impact and the plastic lid is moderate. Five options with none or minor impact
    (CRO-900001, 3, 5, 6, 7) together save 2.05 a unit (8.3%), meeting the target.
  checks:
    - tool: list_cost_reduction_options
      args: {sku: K-1700}
      expect: ["CRO-900001", "0.62", "significant", "LED"]
    - tool: calculate_saving_per_cost_option
      args: {option_id: CRO-900004, volume_units: 10000}
      expect: ["5200", "2500", "significant"]
    - tool: calculate_combined_saving_for_options
      args: {sku: K-1700, option_ids: "CRO-900001;CRO-900003;CRO-900005;CRO-900006;CRO-900007"}
      expect: ["2.05", "8.3", "1.97", "true"]

- question: "06:58:Q5"
  story: >
    Labour rates today and 12 months ago: Vietnam sewing 2.50 (2.39 a year ago, +4.6%), Bangladesh 1.80 (1.74, +3.4%),
    Turkey 4.50 (4.25, +5.9%). Expected inflation is 4.5%, 3.5% and 6% so next season sewing is about 2.61, 1.86 and 4.77.
  checks:
    - tool: get_labour_rates_by_country
      args: {country: "VN,BD,TR", role: sewing}
      expect: ["2.5", "1.8", "4.5", "2.61", "1.86", "4.77", "5.9"]

- question: "09:87:Q2"
  story: >
    Five investment cases match the board initiatives (99m in total against an 80m envelope): automation 35m, nearshoring
    28m (high risk), digital planning 16m, network consolidation 12m, dual sourcing 8m. NPV, IRR and payback are computed
    from capex, benefit, build time, 10% discount and 25% tax. Nearshoring has the highest NPV (34.2m) and dual sourcing
    the shortest payback (2.9 years).
  checks:
    - tool: calculate_investment_return
      args: {}
      expect: ["INV-900003", "34213208", "INV-900005", "8427025", "INV-900002", "11922001"]
    - tool: calculate_investment_return
      args: {case_id: INV-900002}
      expect: ["35000000", "21.8", "4.6", "medium", "Digital Analytics"]

- question: "09:88:Q6"
  story: >
    Transport in-source (own fleet) versus outsource over five years: in-house 19.7m (5.2m capex plus 2.9m a year)
    against 17.0m outsourced (3.4m a year), outsourcing saves 2.7m. By part: store replenishment saves 1.75m and
    primary trunking 1.15m, but e-commerce last mile is 0.2m cheaper in-house and has significant control loss.
  checks:
    - tool: run_make_vs_buy_cost_model
      args: {activity: transport}
      expect: ["19700000", "17000000", "2700000", "1750000", "1150000", "significant", "26"]
    - tool: run_make_vs_buy_cost_model
      args: {activity: packaging}
      expect: ["packaging", "6250000", "5700000"]
