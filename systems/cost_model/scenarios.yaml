# Scenarios for cost_model system - one entry per question in the brief
- question: "01:9:Q4"
  story: >
    Health & safety is evaluating three forklift control options for cutting incidents at DC1 (Northampton, ~150,000 sqft).
    Pedestrian exclusion zones cost most upfront but provide 48% incident reduction.
    Proximity sensors cost less and offer 58% reduction with moderate risk.
    Speed limiters are cheapest with 38% reduction but limited effectiveness.
    The brief shows capex and opex for each option at this site size.
  checks:
    - tool: calculate_control_option_cost
      args: {control_type: proximity_sensor, site_size_sqft: 150000}
      expect: ["7500", "900", "58"]

- question: "01:10:Q4"
  story: >
    Automation engineer evaluates DC1 sorter (AST-DC1-SRT-01) which is 12 years old.
    Three options: keep repairing (£1500/year, 40% high downtime risk), major overhaul (£12k capex + £800/year, 20% risk, 5-year life),
    or replace (£45k capex + £400/year, 8% risk, 8-year life).
    Over 7 years, replacement TCO is lowest but overhaul is a good interim option.
  checks:
    - tool: calculate_lifecycle_cost_options
      args: {asset_id: "AST-DC1-SRT-01", evaluation_years: 7}
      expect: ["45000", "3000", "replace"]

- question: "04:32:Q1"
  story: >
    Category buyer is comparing three suppliers for the 750ml stainless steel bottle (K-1700).
    Supplier A quoted £4.80/unit (high labour, premium overhead).
    Supplier B quoted £4.10/unit (competitive across all components).
    Supplier C quoted £4.25/unit (mid-range).
    Our should-cost at 50,000 units is £2.30 (material £1.20 + labour £0.35 + overhead £0.25 + freight £0.15 + tooling £0.05 + margin £0.30).
    Comparing quotes by component shows where the gaps are.
  checks:
    - tool: calculate_should_cost
      args: {sku: "K-1700", volume_units: 50000}
      expect: ["2.30", "K-1700", "1.20"]
    - tool: compare_quotes_by_cost_component
      args: {sku: "K-1700"}
      expect: ["SUP-0001", "labour", "20"]

- question: "04:34:Q5"
  story: >
    Nearshore sourcing manager finds Turkish quotes 35% above expected.
    Comparison of nearshore (TR) vs Vietnam (VN) labour rates shows Turkey at £4.50-9.00/hour vs Vietnam £2.40-4.50/hour.
    Component breakdown shows labour premium is the main driver (8% of total cost vs 4% in Vietnam).
    Material costs similar but logistics slightly higher.
  checks:
    - tool: get_labour_rates_by_country
      args: {country: "TR"}
      expect: ["assembly", "5.00"]
    - tool: get_labour_rates_by_country
      args: {country: "VN"}
      expect: ["VN", "2.50"]

- question: "06:58:Q1"
  story: >
    Costing analyst breaks down the padded jacket quote.
    Fabric/trims are the largest component. Should-cost for style STY-5520 at 5,000 units shows fabric £0.85, labour £0.25, overhead £0.18.
    List of cost reduction options shows which lines look inflated and which customer-facing changes would help.
  checks:
    - tool: calculate_should_cost_for_style
      args: {style_id: "STY-5520"}
      expect: ["STY-5520"]
    - tool: list_cost_reduction_options
      args: {sku: "SKU-100234", status: "approved"}
      expect: ["saving", "customer"]

- question: "06:58:Q3"
  story: >
    To take 8% out of K-1700 cost (current £2.30), consider multiple options:
    Reduce wall thickness (£0.18/unit, 7.8%), simplify lid (£0.12/unit, 5.2%), use plastic base (£0.06/unit, 2.6%).
    Combined, these three options save £0.36/unit (15.7%), well above the 8% target.
    Wall thickness change has minor customer impact; others have moderate or none.
  checks:
    - tool: list_cost_reduction_options
      args: {sku: "K-1700"}
      expect: ["0.18", "wall"]
    - tool: calculate_combined_saving_for_options
      args: {sku: "K-1700", option_ids: "CRO-900001;CRO-900002;CRO-900004"}
      expect: ["0.36", "combined"]

- question: "06:58:Q5"
  story: >
    Labour rates by country show Vietnam sewing £2.50/hour with 4.5% annual inflation,
    Bangladesh £1.80/hour with 3.5% inflation, Turkey £4.50/hour with 6% inflation, UK £14.50/hour with 2.5% inflation.
    This explains why nearshoring to Turkey is limited to specific high-skill work, not general assembly.
    Vietnam remains competitive for volume production over the next 12 months.
  checks:
    - tool: get_labour_rates_by_country
      args: {country: "VN", role: "sewing"}
      expect: ["2.50", "VN"]
    - tool: get_labour_rates_by_country
      args: {country: "BD", role: "sewing"}
      expect: ["1.80", "BD"]

- question: "09:87:Q2"
  story: >
    Three major investments are under evaluation within £80m envelope:
    Nearshoring to Turkey (£2.5m capex, £750k annual benefit, NPV £1.35m, 22.5% IRR, 3.3 year payback, medium risk).
    Network restructure (£1.8m capex, £600k annual benefit, NPV £1.15m, 24.8% IRR, 3 year payback, high risk).
    Inventory optimization (£800k capex, £400k annual benefit, NPV £1.52m, 38.5% IRR, 2 year payback, low risk).
    These provide a sequenced roadmap based on risk and payback.
  checks:
    - tool: calculate_investment_return
      args: {case_id: "INV-900003"}
      expect: ["1350000", "22.5", "Nearshoring"]
    - tool: calculate_investment_return
      args: {case_id: "INV-900005"}
      expect: ["1520000", "38.5"]

- question: "09:88:Q6"
  story: >
    In-source vs outsource transport decision: own fleet costs £5.2m capex + £2.9m/year vs 3PL at £0 capex + £3.4m/year.
    Five-year TCO: in-house £19.7m vs outsourced £17m - outsourcing saves £2.7m but loses control.
    Breakeven is 5.2 years, so this is a financial toss-up but flexibility and control favour outsourcing for our volumes.
    Packaging operations show the opposite: in-house TCO £6.25m vs external £5.7m - slight outsource saving but with risk.
  checks:
    - tool: run_make_vs_buy_cost_model
      args: {activity: "transport"}
      expect: ["5200000", "2900000", "2.7"]
    - tool: run_make_vs_buy_cost_model
      args: {activity: "packaging"}
      expect: ["packaging", "1500000"]

- question: "04:32:Q1-followup"
  story: >
    Before negotiating with Supplier A, the buyer needs specific questions based on should-cost analysis.
    Their labour cost (£0.42/unit) is 20% above benchmark (£0.35), overhead at £0.30 is also 20% above.
    These are the two main pressure points. Freight and material are reasonable.
    Draft questions point to QC spend and facility efficiency as starting points for negotiation.
  checks:
    - tool: draft_negotiation_questions_for_buyer
      args: {sku: "K-1700", supplier_id: "SUP-0001"}
      expect: ["labour", "Should", "cost", "efficiency"]
