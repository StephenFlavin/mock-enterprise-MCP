id: cost_model
name: Cost Modelling Tool
instructions: >
  Cost analysis tools for sourcing, product engineering, supply chain strategy and capital investment.
  Build should-costs, compare quotes, model control options and evaluate make-vs-buy decisions.

tables:
  should_costs:
    key: cost_id
    cols:
      cost_id: {type: str, desc: "Should-cost id, e.g. SC-000123"}
      sku: {type: str, desc: "Product SKU, e.g. SKU-100234"}
      style_id: {type: str, desc: "Style, e.g. STY-5520"}
      volume_units: {type: int, desc: "Volume for this cost (base case)"}
      tooling_total_gbp: {type: float, desc: "One-off tooling cost in GBP, amortised over volume"}
      material_gbp: {type: float, desc: "Material cost per unit in GBP"}
      labour_gbp: {type: float, desc: "Labour cost per unit in GBP"}
      overhead_gbp: {type: float, desc: "Overhead allocation per unit in GBP"}
      freight_gbp: {type: float, desc: "Freight cost per unit in GBP"}
      tooling_per_unit_gbp: {type: float, desc: "Tooling amortised per unit in GBP"}
      margin_gbp: {type: float, desc: "Margin per unit in GBP"}
      total_gbp: {type: float, desc: "Total cost per unit in GBP"}
      region: {type: str, desc: "Manufacturing region, e.g. Vietnam, UK"}
      notes: {type: str, desc: "Notes on assumptions"}
      created_at: {type: timestamp, desc: "Calculation date"}

  cost_reduction_options:
    key: option_id
    cols:
      option_id: {type: str, desc: "Cost reduction option id, e.g. CRO-000123"}
      sku: {type: str, desc: "Product SKU, e.g. K-1700 or SKU-100234"}
      title: {type: str, desc: "Option title, e.g. Reduce wall thickness"}
      description: {type: str, desc: "Detailed description"}
      saving_gbp_per_unit: {type: float, desc: "Saving per unit in GBP"}
      saving_pct: {type: float, desc: "Saving as % of current unit cost"}
      implementation_cost_gbp: {type: float, desc: "Implementation cost in GBP"}
      customer_impact: {type: str, desc: "Likely customer impact: none, minor, moderate, significant"}
      status: {type: str, desc: "Status: proposed, tested, approved, implemented"}
      category: {type: str, desc: "Category: material, labour, overhead, design, packaging"}

  control_option_costs:
    key: control_id
    cols:
      control_id: {type: str, desc: "Control option id, e.g. CTL-000123"}
      control_type: {type: str, desc: "Type: pedestrian_exclusion, proximity_sensor, speed_limiter"}
      site_size_sqft: {type: int, desc: "DC floor area this cost tier was estimated for, in square feet"}
      capex_gbp: {type: float, desc: "Capital expenditure in GBP"}
      annual_opex_gbp: {type: float, desc: "Annual operating cost in GBP"}
      installation_weeks: {type: int, desc: "Installation duration in weeks"}
      incident_reduction_pct: {type: float, desc: "Expected reduction in incidents %"}
      notes: {type: str, desc: "Notes on assumptions"}

  lifecycle_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Lifecycle scenario id, e.g. LCS-000123"}
      asset_id: {type: str, desc: "Asset id"}
      option_type: {type: str, desc: "Type: repair, overhaul, replace"}
      capex_gbp: {type: float, desc: "Capital expenditure in GBP (0 for repair)"}
      annual_maintenance_gbp: {type: float, desc: "Annual maintenance cost in GBP"}
      implementation_weeks: {type: int, desc: "Weeks to deliver the option (0 for repair)"}
      expected_life_years: {type: int, desc: "Expected life in years"}
      downtime_risk_high_pct: {type: float, desc: "% chance of a high-downtime year"}
      downtime_cost_if_high_gbp: {type: float, desc: "Cost of one high-downtime year in GBP (lost throughput, manual labour, expediting)"}
      residual_value_gbp: {type: float, desc: "Residual value after life (0 for dispose)"}
      notes: {type: str, desc: "Notes on assumptions"}

  labour_rates:
    key: rate_id
    cols:
      rate_id: {type: str, desc: "Labour rate id, e.g. LR-000123"}
      country: {type: str, desc: "Country code: VN, BD, TR or GB"}
      role: {type: str, desc: "Role: sewing, assembly, finishing, inspection, supervision"}
      hourly_gbp: {type: float, desc: "Hourly rate in GBP"}
      annual_hours: {type: int, desc: "Annual productive hours per worker"}
      trend_pct_annual: {type: float, desc: "Annual inflation trend %"}
      date_from: {type: date, desc: "Effective from date"}
      date_to: {type: date, desc: "Effective to date"}

  quote_components:
    key: quote_line_id
    cols:
      quote_line_id: {type: str, desc: "Quote line id, e.g. QL-000123"}
      sku: {type: str, desc: "Product SKU, e.g. K-1700 or SKU-100234"}
      supplier_id: {type: str, desc: "Supplier"}
      component_type: {type: str, desc: "Quote line type, e.g. material, fabric, trims, labour, overhead, tooling, finish, freight, margin"}
      component_desc: {type: str, desc: "Component description"}
      cost_gbp_per_unit: {type: float, desc: "Cost per unit in GBP"}
      volume_units: {type: int, desc: "Volume at this cost"}
      benchmark_gbp_per_unit: {type: float, desc: "Benchmark cost per unit for comparison"}
      variance_pct: {type: float, desc: "Variance from benchmark %"}
      comments: {type: str, desc: "Comments on variance"}

  cost_benchmarks:
    key: benchmark_id
    cols:
      benchmark_id: {type: str, desc: "Benchmark id, e.g. BM-000123"}
      component_type: {type: str, desc: "Type: material, labour, overhead, freight"}
      product_category: {type: str, desc: "Product category, e.g. apparel, homeware"}
      region: {type: str, desc: "Manufacturing region"}
      description: {type: str, desc: "Benchmark description"}
      benchmark_gbp_per_unit: {type: float, desc: "Benchmark cost per unit in GBP"}
      low_gbp_per_unit: {type: float, desc: "Low end (25th percentile) in GBP"}
      high_gbp_per_unit: {type: float, desc: "High end (75th percentile) in GBP"}
      source: {type: str, desc: "Data source"}
      date_from: {type: date, desc: "Effective from date"}

  investment_cases:
    key: case_id
    cols:
      case_id: {type: str, desc: "Investment case id, e.g. INV-000123"}
      title: {type: str, desc: "Investment title"}
      description: {type: str, desc: "Investment description"}
      capex_gbp: {type: float, desc: "Total capital expenditure in GBP"}
      annual_benefit_gbp: {type: float, desc: "Annual benefit in GBP"}
      implementation_years: {type: float, desc: "Implementation period in years"}
      evaluation_years: {type: int, desc: "Evaluation horizon in years"}
      discount_rate_pct: {type: float, desc: "Discount rate %"}
      tax_rate_pct: {type: float, desc: "Corporate tax rate %"}
      sensitivity_upside_pct: {type: float, desc: "Upside scenario benefit increase %"}
      sensitivity_downside_pct: {type: float, desc: "Downside scenario benefit reduction %"}
      risk_rating: {type: str, desc: "Risk rating: low, medium, high"}
      dependencies: {type: str, desc: "Dependencies; semicolon separated"}

  make_vs_buy:
    key: case_id
    cols:
      case_id: {type: str, desc: "Make vs buy case id, e.g. MVB-000123"}
      activity: {type: str, desc: "Activity or part of it, e.g. transport, transport: primary trunking, packaging"}
      description: {type: str, desc: "Description"}
      capex_in_house_gbp: {type: float, desc: "In-house capex in GBP (for transport: buying and fitting out our own fleet)"}
      annual_cost_in_house_gbp: {type: float, desc: "In-house annual cost in GBP"}
      capex_outsourced_gbp: {type: float, desc: "Outsourced capex in GBP"}
      annual_cost_outsourced_gbp: {type: float, desc: "Outsourced annual cost in GBP"}
      flex_benefit: {type: str, desc: "Flexibility gained by outsourcing: high, medium, low"}
      quality_risk: {type: str, desc: "Service quality risk of outsourcing: low, medium, high"}
      control_loss: {type: str, desc: "Control lost by outsourcing: none, some, moderate, significant"}
      transition_weeks: {type: int, desc: "Transition period in weeks"}

tools:
  - name: calculate_should_cost
    desc: "Bottom-up should-cost per unit at a given volume: material, labour, overhead, freight, tooling and margin with total. Use for quote challenge and target pricing."
    kind: sql
    args:
      sku: {required: true}
      volume_units: {type: int, default: 10000, desc: "Order volume the cost is built for; tooling is amortised over it"}
      target_margin_pct: {type: float, desc: "Margin as % of cost; leave empty to use the base-case margin"}
    sql: |
      WITH b AS (
        SELECT s.*, s.margin_gbp / NULLIF(s.total_gbp - s.margin_gbp, 0) AS base_margin_ratio
        FROM should_costs s
        WHERE s.sku = $sku
        QUALIFY row_number() OVER (PARTITION BY s.region ORDER BY s.created_at DESC) = 1
      ), c AS (
        SELECT b.*,
          CASE WHEN b.tooling_total_gbp > 0 THEN b.tooling_total_gbp / $volume_units ELSE b.tooling_per_unit_gbp END AS tooling_pu
        FROM b
      ), d AS (
        SELECT c.*, c.material_gbp + c.labour_gbp + c.overhead_gbp + c.freight_gbp + c.tooling_pu AS subtotal,
          COALESCE($target_margin_pct / 100.0, c.base_margin_ratio) AS margin_ratio
        FROM c
      )
      SELECT
        d.cost_id, d.sku, d.region, $volume_units AS volume_units,
        round(d.material_gbp, 2) AS material_gbp, round(d.labour_gbp, 2) AS labour_gbp,
        round(d.overhead_gbp, 2) AS overhead_gbp, round(d.freight_gbp, 2) AS freight_gbp,
        round(d.tooling_pu, 2) AS tooling_per_unit_gbp,
        round(d.subtotal * d.margin_ratio, 2) AS margin_gbp,
        round(d.subtotal * (1 + d.margin_ratio), 2) AS total_gbp,
        round(d.margin_ratio * 100, 1) AS margin_pct_of_cost,
        d.notes,
        'total = (material + labour + overhead + freight + tooling) x (1 + margin%), tooling = ' ||
          coalesce(round(d.tooling_total_gbp)::VARCHAR, 'n/a') || ' / ' || $volume_units || ' units' AS formula
      FROM d
      ORDER BY d.created_at DESC
    limit: 5
    example: {sku: "SKU-102590", volume_units: 50000}

  - name: calculate_should_cost_for_style
    desc: "Bottom-up should-cost per unit for a style at a given volume: fabric and trims (material), labour, overhead, freight, tooling and margin, with total."
    kind: sql
    args:
      style_id: {required: true}
      volume_units: {type: int, default: 5000, desc: "Order volume the cost is built for; tooling is amortised over it"}
      target_margin_pct: {type: float, desc: "Margin as % of cost; leave empty to use the base-case margin"}
    sql: |
      WITH b AS (
        SELECT s.*, s.margin_gbp / NULLIF(s.total_gbp - s.margin_gbp, 0) AS base_margin_ratio
        FROM should_costs s
        WHERE s.style_id = $style_id
        QUALIFY row_number() OVER (PARTITION BY s.sku, s.region ORDER BY s.created_at DESC) = 1
      ), c AS (
        SELECT b.*,
          CASE WHEN b.tooling_total_gbp > 0 THEN b.tooling_total_gbp / $volume_units ELSE b.tooling_per_unit_gbp END AS tooling_pu
        FROM b
      ), d AS (
        SELECT c.*, c.material_gbp + c.labour_gbp + c.overhead_gbp + c.freight_gbp + c.tooling_pu AS subtotal,
          COALESCE($target_margin_pct / 100.0, c.base_margin_ratio) AS margin_ratio
        FROM c
      )
      SELECT
        d.cost_id, d.style_id, d.sku, d.region, $volume_units AS volume_units,
        round(d.material_gbp, 2) AS material_gbp, round(d.labour_gbp, 2) AS labour_gbp,
        round(d.overhead_gbp, 2) AS overhead_gbp, round(d.freight_gbp, 2) AS freight_gbp,
        round(d.tooling_pu, 2) AS tooling_per_unit_gbp,
        round(d.subtotal * d.margin_ratio, 2) AS margin_gbp,
        round(d.subtotal * (1 + d.margin_ratio), 2) AS total_gbp,
        round(d.margin_ratio * 100, 1) AS margin_pct_of_cost,
        d.notes,
        'total = (material + labour + overhead + freight + tooling) x (1 + margin%)' AS formula
      FROM d
      ORDER BY d.created_at DESC
    limit: 5
    example: {style_id: "STY-7731", volume_units: 50000}

  - name: list_cost_reduction_options
    desc: "List cost reduction options for a product with saving per unit, implementation cost and customer impact, biggest saving first. Use before pricing individual options."
    kind: select
    from: cost_reduction_options
    filters:
      sku: {}
      category: {op: like, desc: "Option category, e.g. material, design, packaging"}
      customer_impact: {desc: "Customer impact: none, minor, moderate, significant"}
      status: {desc: "Option status: proposed, tested, approved, implemented"}
    columns: [option_id, sku, title, description, saving_gbp_per_unit, saving_pct, implementation_cost_gbp, customer_impact, status, category]
    order: saving_gbp_per_unit DESC
    limit: 20
    example: {sku: "K-1700"}

  - name: calculate_saving_per_cost_option
    desc: "Saving from each cost reduction option on its own: per unit, total at volume, implementation cost, payback and customer impact. Give an option id or a sku."
    kind: sql
    args:
      option_id: {}
      sku: {}
      volume_units: {type: int, default: 10000, desc: "Annual volume the saving is applied to"}
    sql: |
      SELECT
        c.option_id, c.sku, c.title, c.saving_gbp_per_unit, c.saving_pct, c.customer_impact, c.status,
        $volume_units AS volume_units,
        round(c.saving_gbp_per_unit * $volume_units, 2) AS total_saving_gbp,
        c.implementation_cost_gbp,
        round(c.saving_gbp_per_unit * $volume_units - c.implementation_cost_gbp, 2) AS net_first_year_saving_gbp,
        CASE WHEN c.saving_gbp_per_unit > 0
          THEN round(c.implementation_cost_gbp / (c.saving_gbp_per_unit * $volume_units) * 12, 1) END AS payback_months,
        'saving = ' || round(c.saving_gbp_per_unit, 2) || ' per unit x ' || $volume_units || ' units = ' ||
        round(c.saving_gbp_per_unit * $volume_units, 2) AS formula
      FROM cost_reduction_options c
      WHERE ($option_id IS NULL OR c.option_id = $option_id) AND ($sku IS NULL OR c.sku = $sku)
      ORDER BY c.saving_gbp_per_unit DESC
    limit: 20
    example: {option_id: "CRO-900001"}

  - name: calculate_combined_saving_for_options
    desc: "Combined saving when several cost reduction options are applied together, against a target % of unit cost, with options customers may notice. Omit option_ids for all."
    kind: sql
    args:
      sku: {required: true}
      option_ids: {type: str, desc: "Semicolon-separated option ids, e.g. CRO-900001;CRO-900003; leave empty for every option on the sku"}
      volume_units: {type: int, default: 10000, desc: "Annual volume the saving is applied to"}
      target_saving_pct: {type: float, default: 8, desc: "Target saving as % of current unit cost"}
    sql: |
      WITH base AS (
        SELECT CAST(p.unit_cost_gbp AS DOUBLE) AS unit_cost FROM master.products p WHERE p.sku = $sku
      ), sel AS (
        SELECT c.* FROM cost_reduction_options c
        WHERE c.sku = $sku
          AND ($option_ids IS NULL OR list_contains(string_split(upper(replace(replace($option_ids, ' ', ''), ',', ';')), ';'), c.option_id))
      )
      SELECT
        string_agg(sel.title, '; ' ORDER BY sel.saving_gbp_per_unit DESC) AS options_combined,
        count(*) AS option_count,
        round(max(base.unit_cost), 2) AS current_unit_cost_gbp,
        round(sum(sel.saving_gbp_per_unit), 2) AS total_saving_gbp_per_unit,
        round(sum(sel.saving_gbp_per_unit) / max(base.unit_cost) * 100, 1) AS total_saving_pct,
        round(max(base.unit_cost) * $target_saving_pct / 100.0, 2) AS target_saving_gbp_per_unit,
        sum(sel.saving_gbp_per_unit) >= max(base.unit_cost) * $target_saving_pct / 100.0 AS meets_target,
        $volume_units AS volume_units,
        round(sum(sel.saving_gbp_per_unit) * $volume_units, 2) AS total_saving_gbp,
        round(sum(sel.implementation_cost_gbp), 2) AS total_implementation_cost_gbp,
        string_agg(CASE WHEN sel.customer_impact != 'none' THEN sel.title || ' (' || sel.customer_impact || ')' END, '; ') AS options_customers_may_notice,
        'total saving = sum of per-unit savings (' || round(sum(sel.saving_gbp_per_unit), 2) || ') x ' || $volume_units || ' units; options assumed independent' AS formula
      FROM sel CROSS JOIN base
    limit: 1
    example: {sku: "K-1700", option_ids: "CRO-900001;CRO-900003"}

  - name: calculate_control_option_cost
    desc: "Capex, annual opex, installation time, incident reduction and 3-year cost of forklift safety controls (pedestrian exclusion, proximity sensors, speed limiters) for a site's floor area."
    kind: sql
    args:
      site_id: {desc: "DC to scale to, e.g. DC1; its floor area is looked up"}
      site_size_sqft: {type: int, desc: "Floor area in square feet if no site_id is given"}
      control_type: {desc: "pedestrian_exclusion, proximity_sensor or speed_limiter; leave empty for all three"}
    sql: |
      WITH want AS (
        SELECT COALESCE($site_size_sqft, CAST((SELECT s.sqft FROM master.sites s WHERE s.site_id = $site_id) AS INTEGER)) AS sz
      )
      SELECT
        c.control_id, c.control_type,
        (SELECT sz FROM want) AS site_size_sqft,
        c.site_size_sqft AS costed_for_sqft,
        c.capex_gbp, c.annual_opex_gbp, c.installation_weeks, c.incident_reduction_pct,
        c.capex_gbp + c.annual_opex_gbp * 3 AS three_year_cost_gbp,
        round((c.capex_gbp + c.annual_opex_gbp * 3) / c.incident_reduction_pct, 0) AS three_year_cost_per_reduction_point_gbp,
        c.notes,
        'three_year_cost = capex + 3 x annual opex' AS formula
      FROM control_option_costs c
      WHERE ($control_type IS NULL OR c.control_type ILIKE split_part(replace(lower($control_type), ' ', '_'), '_', 1) || '%')
      QUALIFY (SELECT sz FROM want) IS NULL
        OR row_number() OVER (PARTITION BY c.control_type ORDER BY abs(c.site_size_sqft - (SELECT sz FROM want))) = 1
      ORDER BY c.control_type, c.site_size_sqft
    limit: 12
    example: {site_id: DC1}

  - name: compare_quotes_by_cost_component
    desc: "Line-by-line comparison of supplier quotes for a sku by cost component against benchmark, with each line's share of the premium and an outlier flag."
    kind: sql
    args:
      sku: {required: true}
      supplier_id: {}
      component_type: {desc: "Filter to one component type, e.g. labour, material, tooling"}
    sql: |
      WITH allq AS (
        SELECT q.*, q.cost_gbp_per_unit - q.benchmark_gbp_per_unit AS gap
        FROM quote_components q WHERE q.sku = $sku AND ($supplier_id IS NULL OR q.supplier_id = $supplier_id)
      ), tot AS (
        SELECT supplier_id, sum(cost_gbp_per_unit) AS quote_total, sum(benchmark_gbp_per_unit) AS bm_total, sum(gap) AS gap_total
        FROM allq GROUP BY supplier_id
      )
      SELECT
        a.supplier_id, s.name AS supplier_name, a.component_type, a.component_desc,
        round(a.cost_gbp_per_unit, 2) AS quote_gbp, round(a.benchmark_gbp_per_unit, 2) AS benchmark_gbp,
        round(a.gap, 2) AS gap_gbp,
        CASE WHEN a.benchmark_gbp_per_unit > 0 THEN round(a.gap / a.benchmark_gbp_per_unit * 100, 1) END AS variance_pct,
        CASE WHEN t.gap_total > 0 THEN round(a.gap / t.gap_total * 100, 0) END AS share_of_total_premium_pct,
        CASE
          WHEN a.cost_gbp_per_unit = 0 AND a.benchmark_gbp_per_unit > 0 THEN 'NOT QUOTED - check terms'
          WHEN a.benchmark_gbp_per_unit = 0 AND a.cost_gbp_per_unit > 0 THEN 'NOT IN BENCHMARK'
          WHEN a.gap / a.benchmark_gbp_per_unit > 0.20 THEN 'HIGH - check assumptions'
          WHEN a.gap / a.benchmark_gbp_per_unit > 0.10 THEN 'MEDIUM - worth exploring'
          WHEN a.gap / a.benchmark_gbp_per_unit < -0.10 THEN 'LOW - check spec or scope'
          ELSE 'OK'
        END AS flag,
        round(t.quote_total, 2) AS supplier_quote_total_gbp, round(t.bm_total, 2) AS benchmark_total_gbp,
        round(t.gap_total / t.bm_total * 100, 1) AS supplier_total_premium_pct,
        a.comments
      FROM allq a JOIN tot t USING (supplier_id) LEFT JOIN master.suppliers s ON s.supplier_id = a.supplier_id
      WHERE $component_type IS NULL OR a.component_type ILIKE '%' || $component_type || '%'
      ORDER BY t.quote_total DESC, a.supplier_id, a.gap DESC
    limit: 60
    example: {sku: "SKU-102863"}

  - name: compare_quote_lines_to_benchmarks
    desc: "Lines of one supplier's quote for a sku that are more than 10% away from benchmark or missing, most out of line first. Use to pick lines to push on."
    kind: sql
    args:
      sku: {required: true}
      supplier_id: {required: true}
    sql: |
      SELECT
        q.quote_line_id, q.component_type, q.component_desc,
        round(q.cost_gbp_per_unit, 2) AS quote_gbp,
        round(q.benchmark_gbp_per_unit, 2) AS benchmark_gbp,
        round(q.cost_gbp_per_unit - q.benchmark_gbp_per_unit, 2) AS gap_gbp,
        CASE WHEN q.benchmark_gbp_per_unit > 0
          THEN round((q.cost_gbp_per_unit - q.benchmark_gbp_per_unit) / q.benchmark_gbp_per_unit * 100, 1) END AS variance_pct,
        CASE
          WHEN q.cost_gbp_per_unit = 0 THEN 'NOT QUOTED'
          WHEN abs(q.cost_gbp_per_unit / q.benchmark_gbp_per_unit - 1) > 0.20 THEN 'SIGNIFICANT'
          ELSE 'NOTABLE'
        END AS severity,
        q.comments
      FROM quote_components q
      WHERE q.sku = $sku AND q.supplier_id = $supplier_id AND q.benchmark_gbp_per_unit > 0
        AND abs(q.cost_gbp_per_unit / q.benchmark_gbp_per_unit - 1) > 0.10
      ORDER BY abs(q.cost_gbp_per_unit / q.benchmark_gbp_per_unit - 1) DESC
    limit: 20
    example: {sku: "SKU-103157", supplier_id: "SUP-0022"}

  - name: get_labour_rates_by_country
    desc: "Current hourly labour rates by country and role (sewing, assembly, finishing, inspection, supervision) with the rate 12 months ago, the change and the projected rate next season."
    kind: sql
    args:
      country: {type: str, desc: "Country codes VN, BD, TR, GB or names, one or several, e.g. VN,BD,TR; leave empty for all"}
      role: {type: str, desc: "Role, e.g. sewing, assembly; leave empty for all"}
    sql: |
      WITH alias(code, nm) AS (
        VALUES ('VN','VN'),('VN','VIETNAM'),('BD','BD'),('BD','BANGLADESH'),('TR','TR'),('TR','TURKEY'),('TR','TURKIYE'),
               ('GB','GB'),('GB','UK'),('GB','BRITAIN'),('GB','UNITED KINGDOM')
      ), cur AS (
        SELECT * FROM labour_rates WHERE CAST($as_of AS DATE) BETWEEN date_from AND date_to
      ), prev AS (
        SELECT * FROM labour_rates WHERE CAST($as_of AS DATE) - INTERVAL 365 DAY BETWEEN date_from AND date_to
      )
      SELECT
        c.country, c.role, c.hourly_gbp AS current_hourly_gbp,
        p.hourly_gbp AS hourly_12m_ago_gbp,
        round((c.hourly_gbp / p.hourly_gbp - 1) * 100, 1) AS change_12m_pct,
        c.trend_pct_annual AS expected_annual_inflation_pct,
        round(c.hourly_gbp * (1 + c.trend_pct_annual / 100.0), 2) AS projected_next_season_hourly_gbp,
        round(c.hourly_gbp * c.annual_hours, 0) AS annual_cost_per_worker_gbp,
        c.date_from AS effective_from
      FROM cur c LEFT JOIN prev p ON p.country = c.country AND p.role = c.role
      WHERE ($country IS NULL OR c.country IN (
              SELECT a.code FROM alias a WHERE regexp_matches(upper($country), '\b' || a.nm || '\b')))
        AND ($role IS NULL OR c.role ILIKE '%' || $role || '%')
      ORDER BY c.country, c.role
    limit: 40
    example: {country: "VN,BD,TR"}

  - name: calculate_lifecycle_cost_options
    desc: "Compare repair, overhaul and replace for an asset over a horizon: capex, maintenance, expected downtime cost and risk, residual value, total cost and delivery time."
    kind: sql
    args:
      asset_id: {required: true}
      evaluation_years: {type: int, default: 7, desc: "Evaluation horizon in years"}
      volume_growth_pct: {type: float, default: 0, desc: "Volume growth over the horizon in %; raises maintenance and downtime costs"}
    sql: |
      WITH x AS (
        SELECT l.*, 1 + $volume_growth_pct / 100.0 AS g,
          l.downtime_risk_high_pct / 100.0 * l.downtime_cost_if_high_gbp * (1 + $volume_growth_pct / 100.0) AS annual_dt
        FROM lifecycle_scenarios l WHERE l.asset_id = $asset_id
      )
      SELECT
        x.scenario_id, x.asset_id, x.option_type, x.capex_gbp, x.implementation_weeks,
        x.annual_maintenance_gbp, x.downtime_risk_high_pct,
        round(x.annual_dt, 0) AS expected_annual_downtime_cost_gbp,
        $evaluation_years AS evaluation_years, $volume_growth_pct AS volume_growth_pct,
        x.expected_life_years,
        CASE WHEN x.expected_life_years >= $evaluation_years THEN 'yes' ELSE 'no, new spend needed after year ' || x.expected_life_years END AS lasts_whole_horizon,
        x.residual_value_gbp,
        round(x.capex_gbp + (x.annual_maintenance_gbp * x.g + x.annual_dt) * $evaluation_years - x.residual_value_gbp, 0) AS tco_gbp,
        'TCO = capex + (maintenance x volume factor + downtime risk x downtime cost x volume factor) x ' || $evaluation_years ||
          ' years - residual value' AS formula,
        x.notes
      FROM x
      ORDER BY tco_gbp
    limit: 5
    example: {asset_id: "AST-DC1-SRT", evaluation_years: 7}

  - name: calculate_investment_return
    desc: "NPV, IRR, payback and upside/downside NPV for an investment case, computed from capex, benefit, build time and discount rate. Omit case_id to rank all cases."
    kind: py
    fn: calc_investment_return
    args:
      case_id: {desc: "Investment case id, e.g. INV-900001; leave empty to compare every case"}
      discount_rate_pct: {type: float, desc: "Override the case discount rate, %"}
      benefit_change_pct: {type: float, default: 0, desc: "What-if change to annual benefit, % (e.g. -20)"}
    example: {case_id: "INV-900001"}

  - name: run_make_vs_buy_cost_model
    desc: "In-house versus outsourced total cost over a horizon (default 5 years): TCO each way, saving, breakeven, flexibility, control and transition time. Use activity transport for all transport options."
    kind: sql
    args:
      activity: {type: str, desc: "Activity or part of it, e.g. transport, packaging; leave empty for all"}
      horizon_years: {type: int, default: 5, desc: "Years to compare over"}
    sql: |
      WITH m AS (
        SELECT v.*,
          v.capex_in_house_gbp + v.annual_cost_in_house_gbp * $horizon_years AS tco_in,
          v.capex_outsourced_gbp + v.annual_cost_outsourced_gbp * $horizon_years AS tco_out
        FROM make_vs_buy v
        WHERE $activity IS NULL OR v.activity ILIKE '%' || $activity || '%'
      )
      SELECT
        m.case_id, m.activity, m.description,
        m.capex_in_house_gbp, m.annual_cost_in_house_gbp, m.capex_outsourced_gbp, m.annual_cost_outsourced_gbp,
        $horizon_years AS horizon_years,
        round(m.tco_in, 0) AS tco_in_house_gbp, round(m.tco_out, 0) AS tco_outsourced_gbp,
        round(m.tco_in - m.tco_out, 0) AS outsourcing_saving_gbp,
        CASE WHEN m.tco_out <= m.tco_in THEN 'outsource' ELSE 'in-house' END AS cheaper_option,
        CASE WHEN m.annual_cost_outsourced_gbp > m.annual_cost_in_house_gbp
          THEN round((m.capex_in_house_gbp - m.capex_outsourced_gbp) / (m.annual_cost_outsourced_gbp - m.annual_cost_in_house_gbp), 1) END AS years_until_in_house_is_cheaper,
        m.flex_benefit, m.quality_risk, m.control_loss, m.transition_weeks,
        'TCO = capex + annual cost x ' || $horizon_years || ' years; saving = in-house TCO - outsourced TCO' AS formula
      FROM m
      ORDER BY outsourcing_saving_gbp DESC
    limit: 10
    example: {activity: "transport"}

  - name: draft_negotiation_questions_for_buyer
    desc: "Draft negotiation questions for the buyer to put to a supplier on a sku: out-of-line quote lines first, then should-cost gap and generic cost-build questions."
    kind: draft
    args: [sku, supplier_id]
    sql:
      sup: SELECT name FROM master.suppliers WHERE supplier_id = $supplier_id
      sc: SELECT material_gbp + labour_gbp + overhead_gbp + freight_gbp + tooling_per_unit_gbp + margin_gbp AS total, volume_units FROM should_costs WHERE sku = $sku ORDER BY created_at DESC LIMIT 1
      quote: SELECT sum(cost_gbp_per_unit) AS total FROM quote_components WHERE sku = $sku AND supplier_id = $supplier_id
      outliers: SELECT component_type, component_desc, cost_gbp_per_unit, benchmark_gbp_per_unit, round((cost_gbp_per_unit / benchmark_gbp_per_unit - 1) * 100, 1) AS variance_pct, comments FROM quote_components WHERE sku = $sku AND supplier_id = $supplier_id AND benchmark_gbp_per_unit > 0 AND abs(cost_gbp_per_unit / benchmark_gbp_per_unit - 1) > 0.10 ORDER BY abs(cost_gbp_per_unit / benchmark_gbp_per_unit - 1) DESC
    template: |
      Questions for {{ sup[0].name if sup else supplier_id }} ({{ supplier_id }}) on {{ sku }}

      {% if quote and quote[0].total and sc %}Quoted {{ quote[0].total|money }} per unit against our should-cost of {{ sc[0].total|money }} at {{ sc[0].volume_units }} units.
      {% endif %}
      {% for o in outliers %}{{ loop.index }}. {{ o.component_type|capitalize }} ({{ o.component_desc }}): you quote {{ o.cost_gbp_per_unit|money }} against a benchmark of {{ o.benchmark_gbp_per_unit|money }}, {{ o.variance_pct|num(1) }}% {{ 'above' if o.variance_pct > 0 else 'below' }}. What is driving this?{% if o.comments %} ({{ o.comments }}){% endif %}

      {% endfor %}
      General questions:
      - Please walk us through the cost build and assumptions behind the quote at our volume.
      - What would change the price if we simplified the specification?
      - How are material and labour cost movements reflected, and what is fixed for the next 12 months?
      - Can you support the lines above with supporting data?
    example: {sku: "SKU-103157", supplier_id: "SUP-0022"}
