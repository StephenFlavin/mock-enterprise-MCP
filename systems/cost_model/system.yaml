id: cost_model
name: Cost Modelling Tool
instructions: >
  Cost analysis tools for sourcing, product engineering, supply chain strategy and capital investment.
  Build should-costs, compare quotes, model control options and evaluate make-vs-buy decisions.

tables:
  should_costs:
    key: cost_id
    cols:
      cost_id: {type: str, desc: "Should-cost id, e.g. SC-000123"}
      sku: {type: str, desc: "Product SKU, e.g. SKU-100234"}
      style_id: {type: str, desc: "Style, e.g. STY-5520"}
      volume_units: {type: int, desc: "Volume for this cost (base case)"}
      material_gbp: {type: float, desc: "Material cost per unit in GBP"}
      labour_gbp: {type: float, desc: "Labour cost per unit in GBP"}
      overhead_gbp: {type: float, desc: "Overhead allocation per unit in GBP"}
      freight_gbp: {type: float, desc: "Freight cost per unit in GBP"}
      tooling_per_unit_gbp: {type: float, desc: "Tooling amortised per unit in GBP"}
      margin_gbp: {type: float, desc: "Margin per unit in GBP"}
      total_gbp: {type: float, desc: "Total cost per unit in GBP"}
      region: {type: str, desc: "Manufacturing region, e.g. Vietnam, UK"}
      notes: {type: str, desc: "Notes on assumptions"}
      created_at: {type: timestamp, desc: "Calculation date"}

  cost_reduction_options:
    key: option_id
    cols:
      option_id: {type: str, desc: "Cost reduction option id, e.g. CRO-000123"}
      sku: {type: str, desc: "Product SKU"}
      title: {type: str, desc: "Option title, e.g. Reduce wall thickness"}
      description: {type: str, desc: "Detailed description"}
      saving_gbp_per_unit: {type: float, desc: "Saving per unit in GBP"}
      saving_pct: {type: float, desc: "Saving as % of current unit cost"}
      implementation_cost_gbp: {type: float, desc: "Implementation cost in GBP"}
      customer_impact: {type: str, desc: "Likely customer impact: none, minor, moderate, significant"}
      status: {type: str, desc: "Status: proposed, tested, approved, implemented"}
      category: {type: str, desc: "Category: material, labour, overhead, design, packaging"}

  control_option_costs:
    key: control_id
    cols:
      control_id: {type: str, desc: "Control option id, e.g. CTL-000123"}
      control_type: {type: str, desc: "Type: pedestrian_exclusion, proximity_sensor, speed_limiter"}
      site_size_sqft: {type: int, desc: "DC size in square feet"}
      capex_gbp: {type: float, desc: "Capital expenditure in GBP"}
      annual_opex_gbp: {type: float, desc: "Annual operating cost in GBP"}
      installation_weeks: {type: int, desc: "Installation duration in weeks"}
      incident_reduction_pct: {type: float, desc: "Expected reduction in incidents %"}
      notes: {type: str, desc: "Notes on assumptions"}

  lifecycle_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Lifecycle scenario id, e.g. LCS-000123"}
      asset_id: {type: str, desc: "Asset id"}
      option_type: {type: str, desc: "Type: repair, overhaul, replace"}
      capex_gbp: {type: float, desc: "Capital expenditure in GBP (0 for repair)"}
      annual_maintenance_gbp: {type: float, desc: "Annual maintenance cost in GBP"}
      expected_life_years: {type: int, desc: "Expected life in years"}
      downtime_risk_high_pct: {type: float, desc: "% chance of high downtime in year"}
      residual_value_gbp: {type: float, desc: "Residual value after life (0 for dispose)"}
      notes: {type: str, desc: "Notes on assumptions"}

  labour_rates:
    key: rate_id
    cols:
      rate_id: {type: str, desc: "Labour rate id, e.g. LR-000123"}
      country: {type: str, desc: "Country code, e.g. VN, BD, TR, GB"}
      role: {type: str, desc: "Role: sewing, assembly, finishing, inspection, supervision"}
      hourly_gbp: {type: float, desc: "Hourly rate in GBP"}
      annual_hours: {type: int, desc: "Annual productive hours per worker"}
      trend_pct_annual: {type: float, desc: "Annual inflation trend %"}
      date_from: {type: date, desc: "Effective from date"}
      date_to: {type: date, desc: "Effective to date"}

  quote_components:
    key: quote_line_id
    cols:
      quote_line_id: {type: str, desc: "Quote line id, e.g. QL-000123"}
      sku: {type: str, desc: "Product SKU"}
      supplier_id: {type: str, desc: "Supplier"}
      component_type: {type: str, desc: "Type: material, labour, overhead, freight, margin"}
      component_desc: {type: str, desc: "Component description"}
      cost_gbp_per_unit: {type: float, desc: "Cost per unit in GBP"}
      volume_units: {type: int, desc: "Volume at this cost"}
      benchmark_gbp_per_unit: {type: float, desc: "Benchmark cost per unit for comparison"}
      variance_pct: {type: float, desc: "Variance from benchmark %"}
      comments: {type: str, desc: "Comments on variance"}

  cost_benchmarks:
    key: benchmark_id
    cols:
      benchmark_id: {type: str, desc: "Benchmark id, e.g. BM-000123"}
      component_type: {type: str, desc: "Type: material, labour, overhead, freight"}
      product_category: {type: str, desc: "Product category, e.g. apparel, homeware"}
      region: {type: str, desc: "Manufacturing region"}
      description: {type: str, desc: "Benchmark description"}
      benchmark_gbp_per_unit: {type: float, desc: "Benchmark cost per unit in GBP"}
      low_gbp_per_unit: {type: float, desc: "Low end (25th percentile) in GBP"}
      high_gbp_per_unit: {type: float, desc: "High end (75th percentile) in GBP"}
      source: {type: str, desc: "Data source"}
      date_from: {type: date, desc: "Effective from date"}

  investment_cases:
    key: case_id
    cols:
      case_id: {type: str, desc: "Investment case id, e.g. INV-000123"}
      title: {type: str, desc: "Investment title"}
      description: {type: str, desc: "Investment description"}
      capex_gbp: {type: float, desc: "Total capital expenditure in GBP"}
      annual_benefit_gbp: {type: float, desc: "Annual benefit in GBP"}
      implementation_years: {type: float, desc: "Implementation period in years"}
      evaluation_years: {type: int, desc: "Evaluation horizon in years"}
      discount_rate_pct: {type: float, desc: "Discount rate %"}
      tax_rate_pct: {type: float, desc: "Corporate tax rate %"}
      npv_gbp: {type: float, desc: "Net present value in GBP"}
      irr_pct: {type: float, desc: "Internal rate of return %"}
      payback_years: {type: float, desc: "Payback period in years"}
      sensitivity_upside_pct: {type: float, desc: "Upside scenario benefit increase %"}
      sensitivity_downside_pct: {type: float, desc: "Downside scenario benefit reduction %"}
      risk_rating: {type: str, desc: "Risk rating: low, medium, high"}
      dependencies: {type: str, desc: "Dependencies; semicolon separated"}

  make_vs_buy:
    key: case_id
    cols:
      case_id: {type: str, desc: "Make vs buy case id, e.g. MVB-000123"}
      activity: {type: str, desc: "Activity, e.g. transport, packaging, assembly"}
      description: {type: str, desc: "Description"}
      capex_in_house_gbp: {type: float, desc: "In-house capex in GBP"}
      annual_cost_in_house_gbp: {type: float, desc: "In-house annual cost in GBP"}
      capex_outsourced_gbp: {type: float, desc: "Outsourced capex in GBP"}
      annual_cost_outsourced_gbp: {type: float, desc: "Outsourced annual cost in GBP"}
      breakeven_years: {type: float, desc: "Breakeven point in years"}
      five_year_tco_in_house_gbp: {type: float, desc: "5-year TCO in-house in GBP"}
      five_year_tco_outsourced_gbp: {type: float, desc: "5-year TCO outsourced in GBP"}
      savings_gbp: {type: float, desc: "Savings from outsourcing over 5 years in GBP"}
      flex_benefit: {type: str, desc: "Flexibility benefit: high, medium, low"}
      quality_risk: {type: str, desc: "Quality risk: low, medium, high"}
      control_loss: {type: str, desc: "Loss of control: none, some, significant"}
      transition_weeks: {type: int, desc: "Transition period in weeks"}

tools:
  - name: calculate_should_cost
    desc: "Bottom-up should-cost at a given volume. Returns cost breakdown by component (material, labour, overhead, freight, tooling, margin) with assumptions and total unit cost."
    kind: sql
    args:
      sku: {required: true}
      volume_units: {type: int, default: 10000}
      target_margin_pct: {type: float, default: 15, desc: "Target margin as % of total cost"}
    sql: |
      SELECT
        s.cost_id, s.sku, s.material_gbp, s.labour_gbp, s.overhead_gbp,
        s.freight_gbp, s.tooling_per_unit_gbp, s.margin_gbp, s.total_gbp,
        s.region, s.volume_units, s.notes,
        'cost = ' || round(s.material_gbp, 2) || ' + ' || round(s.labour_gbp, 2) || ' + ' ||
        round(s.overhead_gbp, 2) || ' + ' || round(s.freight_gbp, 2) || ' + ' ||
        round(s.tooling_per_unit_gbp, 2) || ' = ' || round(s.total_gbp, 2) AS formula
      FROM should_costs s
      WHERE s.sku = $sku
      ORDER BY s.created_at DESC
    limit: 5
    example: {sku: "K-1700"}

  - name: calculate_should_cost_for_style
    desc: "Bottom-up should-cost for a style at a given volume. Returns material, labour, overhead, freight and margin breakdown."
    kind: sql
    args:
      style_id: {required: true}
      volume_units: {type: int, default: 5000}
    sql: |
      SELECT
        s.cost_id, s.style_id, s.sku, s.material_gbp, s.labour_gbp, s.overhead_gbp,
        s.freight_gbp, s.tooling_per_unit_gbp, s.margin_gbp, s.total_gbp,
        s.region, s.volume_units, s.notes,
        'fabric+trims = ' || round(s.material_gbp, 2) || '; labour = ' || round(s.labour_gbp, 2) ||
        '; overhead = ' || round(s.overhead_gbp, 2) || '; total = ' || round(s.total_gbp, 2) AS formula
      FROM should_costs s
      WHERE s.style_id = $style_id
      ORDER BY s.created_at DESC
    limit: 3
    example: {style_id: "STY-5520"}

  - name: list_cost_reduction_options
    desc: "List cost reduction options for a product with individual savings and implementation cost. Ranked by saving."
    kind: select
    from: cost_reduction_options
    filters:
      sku: {}
      category: {op: like, desc: "Option category, e.g. material, labour"}
      status: {default: approved}
    columns: [option_id, title, description, saving_gbp_per_unit, saving_pct, implementation_cost_gbp, customer_impact, category]
    order: saving_gbp_per_unit DESC
    limit: 20
    example: {sku: "K-1700"}

  - name: calculate_saving_per_cost_option
    desc: "Saving from one cost reduction option: individual saving per unit, total saving at volume, and implementation cost. Shows customer impact."
    kind: sql
    args:
      option_id: {required: true}
      volume_units: {type: int, default: 10000}
    sql: |
      SELECT
        option_id, title, description, saving_gbp_per_unit, saving_pct, customer_impact,
        $volume_units AS volume_units, (saving_gbp_per_unit * $volume_units) AS total_saving_gbp,
        implementation_cost_gbp,
        CASE WHEN implementation_cost_gbp > 0
          THEN round((saving_gbp_per_unit * $volume_units - implementation_cost_gbp) / (saving_gbp_per_unit * $volume_units) * 100, 1)
          ELSE NULL
        END AS net_saving_pct_after_implementation,
        'saving = ' || round(saving_gbp_per_unit, 2) || ' per unit x ' || $volume_units || ' units = ' ||
        round(saving_gbp_per_unit * $volume_units, 2) AS formula
      FROM cost_reduction_options
      WHERE option_id = $option_id
    limit: 1
    example: {option_id: "CRO-900001"}

  - name: calculate_combined_saving_for_options
    desc: "Combined saving from multiple cost reduction options at volume. Shows total saving and identifies options with customer impact."
    kind: sql
    args:
      sku: {required: true}
      option_ids: {type: str, desc: "Semicolon-separated option ids, e.g. CRO-1;CRO-2;CRO-3"}
      volume_units: {type: int, default: 10000}
    sql: |
      WITH selected_options AS (
        SELECT DISTINCT
          c.option_id, c.title, c.saving_gbp_per_unit, c.customer_impact,
          c.implementation_cost_gbp
        FROM cost_reduction_options c
        WHERE c.sku = $sku
          AND (
            CASE
              WHEN $option_ids IS NOT NULL
              THEN position(c.option_id IN $option_ids) > 0
              ELSE TRUE
            END
          )
      )
      SELECT
        string_agg(title, '; ') AS options_combined,
        count(*) AS option_count,
        sum(saving_gbp_per_unit) AS total_saving_gbp_per_unit,
        $volume_units AS volume_units,
        round(sum(saving_gbp_per_unit) * $volume_units, 2) AS total_saving_gbp,
        string_agg(CASE WHEN customer_impact != 'none' THEN title || ' (' || customer_impact || ')' END, '; ') AS options_with_customer_impact,
        sum(implementation_cost_gbp) AS total_implementation_cost_gbp,
        'total saving = ' || round(sum(saving_gbp_per_unit), 2) || ' per unit x ' || $volume_units || ' = ' ||
        round(sum(saving_gbp_per_unit) * $volume_units, 2) AS formula
      FROM selected_options
    limit: 1
    example: {sku: "K-1700", option_ids: "CRO-900001;CRO-900002"}

  - name: calculate_control_option_cost
    desc: "Capex, opex and incident reduction for safety control options (pedestrian exclusion, proximity sensors, speed limiters) scaled to site size."
    kind: sql
    args:
      control_type: {desc: "Control type: pedestrian_exclusion, proximity_sensor, speed_limiter"}
      site_size_sqft: {type: int, desc: "DC size in square feet, e.g. 150000"}
    sql: |
      SELECT
        control_id, control_type, site_size_sqft, capex_gbp, annual_opex_gbp,
        installation_weeks, incident_reduction_pct,
        (capex_gbp + (annual_opex_gbp * 3)) AS three_year_tco_gbp,
        notes,
        'capex = ' || capex_gbp || '; opex = ' || annual_opex_gbp || '/year; ' ||
        'expected incident reduction = ' || incident_reduction_pct || '%' AS formula
      FROM control_option_costs
      WHERE control_type = $control_type
        AND ($site_size_sqft IS NULL OR site_size_sqft <= $site_size_sqft * 1.1)
      ORDER BY site_size_sqft DESC
    limit: 1
    example: {control_type: "proximity_sensor", site_size_sqft: 150000}

  - name: compare_quotes_by_cost_component
    desc: "Line-by-line comparison of quotes by cost component (material, labour, overhead, freight, margin). Shows variance from benchmark and flags outliers."
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT
        q.quote_line_id, q.supplier_id, q.component_type, q.component_desc,
        round(q.cost_gbp_per_unit, 2) AS quote_cost_gbp, round(q.benchmark_gbp_per_unit, 2) AS benchmark_gbp,
        round(q.variance_pct, 1) AS variance_pct,
        CASE
          WHEN q.variance_pct > 20 THEN 'HIGH - check assumptions'
          WHEN q.variance_pct > 10 THEN 'MEDIUM - worth exploring'
          WHEN q.variance_pct < -10 THEN 'INVESTIGATE - check for errors'
          ELSE 'OK'
        END AS flag,
        q.comments
      FROM quote_components q
      WHERE q.sku = $sku
      ORDER BY q.component_type, q.variance_pct DESC
    limit: 50
    example: {sku: "K-1700"}

  - name: compare_quote_lines_to_benchmarks
    desc: "Which lines in a quote look out of line compared to benchmarks? Returns lines with variance >10%, ranked by flag severity."
    kind: sql
    args:
      sku: {required: true}
      supplier_id: {required: true}
    sql: |
      SELECT
        q.quote_line_id, q.component_type, q.component_desc,
        round(q.cost_gbp_per_unit, 2) AS quote_gbp,
        round(q.benchmark_gbp_per_unit, 2) AS benchmark_gbp,
        round(q.variance_pct, 1) AS variance_pct,
        CASE
          WHEN abs(q.variance_pct) <= 5 THEN 'OK'
          WHEN abs(q.variance_pct) <= 10 THEN 'MINOR'
          WHEN abs(q.variance_pct) <= 20 THEN 'NOTABLE'
          ELSE 'SIGNIFICANT'
        END AS severity,
        q.comments
      FROM quote_components q
      WHERE q.sku = $sku AND q.supplier_id = $supplier_id
        AND abs(q.variance_pct) > 10
      ORDER BY
        CASE severity WHEN 'SIGNIFICANT' THEN 1 WHEN 'NOTABLE' THEN 2 WHEN 'MINOR' THEN 3 ELSE 4 END,
        abs(q.variance_pct) DESC
    limit: 20
    example: {sku: "K-1700", supplier_id: "SUP-0001"}

  - name: get_labour_rates_by_country
    desc: "Current labour rates by country and role (sewing, assembly, finishing, inspection, supervision) with annual inflation trend."
    kind: select
    from: labour_rates
    filters:
      country: {}
      role: {op: like, desc: "Role, e.g. sewing, assembly"}
      date_from: {col: date_from, op: "<=", default: "$as_of"}
    columns: [rate_id, country, role, hourly_gbp, annual_hours, trend_pct_annual, date_from]
    order: country, role
    limit: 30
    example: {country: "VN"}

  - name: calculate_lifecycle_cost_options
    desc: "Compare repair, overhaul and replace over a horizon. Returns TCO by option with downtime risk and residual value impacts."
    kind: sql
    args:
      asset_id: {required: true}
      evaluation_years: {type: int, default: 7, desc: "Evaluation horizon in years"}
    sql: |
      SELECT
        scenario_id, option_type, capex_gbp, annual_maintenance_gbp,
        expected_life_years, $evaluation_years AS evaluation_years, downtime_risk_high_pct,
        residual_value_gbp,
        (capex_gbp + (annual_maintenance_gbp * $evaluation_years) - residual_value_gbp) AS tco_gbp,
        'TCO = capex ' || capex_gbp || ' + maintenance (' || annual_maintenance_gbp || ' x ' ||
        $evaluation_years || ' years) - residual ' || residual_value_gbp || ' = ' ||
        (capex_gbp + (annual_maintenance_gbp * $evaluation_years) - residual_value_gbp) AS formula,
        notes
      FROM lifecycle_scenarios
      WHERE asset_id = $asset_id
      ORDER BY tco_gbp
    limit: 5
    example: {asset_id: "AST-DC1-SRT"}

  - name: calculate_investment_return
    desc: "NPV, payback and sensitivity for an investment case. Returns NPV, IRR, payback period and upside/downside scenarios."
    kind: sql
    args:
      case_id: {required: true}
    sql: |
      SELECT
        case_id, title, description,
        capex_gbp, annual_benefit_gbp, implementation_years,
        evaluation_years, discount_rate_pct, npv_gbp, irr_pct, payback_years,
        sensitivity_upside_pct, sensitivity_downside_pct,
        (npv_gbp * (1 + sensitivity_upside_pct / 100)) AS npv_upside_gbp,
        (npv_gbp * (1 + sensitivity_downside_pct / 100)) AS npv_downside_gbp,
        risk_rating, dependencies,
        'NPV = ' || round(npv_gbp, 0) || '; payback = ' || round(payback_years, 1) ||
        ' years; IRR = ' || round(irr_pct, 1) || '%' AS formula
      FROM investment_cases
      WHERE case_id = $case_id
    limit: 1
    example: {case_id: "INV-900001"}

  - name: run_make_vs_buy_cost_model
    desc: "5-year total cost of ownership comparison: in-house versus outsourced. Returns breakeven, TCO by option and transition risk."
    kind: sql
    args:
      activity: {desc: "Activity to evaluate, e.g. transport, packaging"}
    sql: |
      SELECT
        case_id, activity, description,
        capex_in_house_gbp, annual_cost_in_house_gbp,
        capex_outsourced_gbp, annual_cost_outsourced_gbp,
        five_year_tco_in_house_gbp, five_year_tco_outsourced_gbp,
        savings_gbp,
        breakeven_years, flex_benefit, quality_risk, control_loss,
        transition_weeks,
        'in-house TCO = ' || five_year_tco_in_house_gbp || '; outsourced = ' ||
        five_year_tco_outsourced_gbp || '; savings = ' || savings_gbp AS formula
      FROM make_vs_buy
      WHERE activity = $activity
    limit: 1
    example: {activity: "transport"}

  - name: draft_negotiation_questions_for_buyer
    desc: "Draft negotiation questions for buyer to ask supplier. Points to high-variance lines and suggests pressure points based on should-cost."
    kind: draft
    args: [sku, supplier_id]
    sql:
      should_cost: SELECT s.* FROM should_costs s WHERE s.sku = $sku ORDER BY s.created_at DESC LIMIT 1
      quotes: SELECT q.* FROM quote_components q WHERE q.sku = $sku AND q.supplier_id = $supplier_id ORDER BY q.component_type
      outliers: SELECT q.* FROM quote_components q WHERE q.sku = $sku AND q.supplier_id = $supplier_id AND abs(q.variance_pct) > 15 ORDER BY abs(q.variance_pct) DESC
    template: |
      Negotiation Questions for {{ supplier_id }}

      Based on our should-cost analysis, here are the key questions to raise:

      {% if outliers %}
      High-variance lines (>15% above benchmark):
      {% for line in outliers %}
      - {{ line.component_type }}: {{ line.component_desc }} - your quote is {{ line.variance_pct|num(1) }}% {{ 'above' if line.variance_pct > 0 else 'below' }} benchmark (£{{ line.benchmark_gbp_per_unit|money }} vs your £{{ line.cost_gbp_per_unit|money }})
        {% if line.comments %}• {{ line.comments }}{% endif %}
      {% endfor %}

      Question: Can you explain the cost drivers for these lines and explore ways to align with market rates?

      {% endif %}

      {% if should_cost %}
      Our should-cost at volume:
      - Material: £{{ should_cost.material_gbp|money }} per unit (your {% if quotes %}{{ (queries.quotes|selectattr('component_type', 'equalto', 'material')|map(attribute='cost_gbp_per_unit')|first) or 'TBD' }}{% endif %})
      - Labour: £{{ should_cost.labour_gbp|money }} per unit
      - Freight: £{{ should_cost.freight_gbp|money }} per unit
      - Total: £{{ should_cost.total_gbp|money }} per unit

      {% endif %}

      Key questions:
      1. Walk us through your cost build and assumptions at {{ should_cost.volume_units if should_cost else 'volume' }} units
      2. What efficiency gains can you achieve at higher volumes?
      3. Are there value engineering opportunities we should explore together?
      4. What's the supply and pricing stability outlook for key materials over the next 12 months?
      5. Can you provide benchmarking data to support the components that appear high?
    example: {sku: "K-1700", supplier_id: "SUP-0001"}
