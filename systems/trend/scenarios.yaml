# One entry per question row that uses this system's tools (see: python -m mockmcp brief trend).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "05:50:Q5"
  story: >
    Three major competitors disclosed significant risks from geopolitical, climate and regulatory factors.
    Inditex faces Middle East tensions (high impact). H&M disclosed water scarcity concerns (medium).
    Fast Retailing is investing heavily in EU CSDDD compliance (high). All have published adjustment actions.
  checks:
    - tool: search_competitor_risk_disclosures
      args: {risk_type: geopolitical}
      expect: ["Inditex", "Middle East tensions", "high"]
    - tool: search_competitor_risk_disclosures
      args: {risk_type: regulatory}
      expect: ["Fast Retailing", "CSDDD", "high"]

- question: "06:51:Q6"
  story: >
    Four innovative materials at different readiness levels exist. Recycled Polyester (mature, cost-2.5%).
    Performance Recycled Nylon (volume proven, cost+5.5%). Lab-Grown Leather (pilot, cost+45%).
    Mycelium Leather (experimental, cost+85%). Together they offer a range from low-cost proven to high-risk R&D.
  checks:
    - tool: search_innovative_materials
      args: {readiness_level: volume_proven}
      expect: ["Performance Recycled Nylon", "ECONYL"]
    - tool: search_innovative_materials
      args: {material_category: Sustainable}
      expect: ["Recycled Polyester", "mature"]
    - tool: search_innovative_materials
      args: {readiness_level: experimental}
      expect: ["Mycelium Leather", "Bolt Threads"]

- question: "06:52:Q1"
  story: >
    AW27 trend forecasts show Oversized Outerwear (TRD-000002) as high-confidence peak in Q4 2026 for UK.
    It is currently in peak lifecycle stage. Mood summary for design team shows key signals and market forecasts.
  checks:
    - tool: search_trend_forecasts_by_season
      args: {season: AW27}
      expect: ["Oversized", "peak", "Q4 2026"]
    - tool: get_trend_lifecycle_stage
      args: {name: Oversized Outerwear}
      expect: ["TRD-000002", "peak"]
    - tool: draft_mood_summary
      args: {trend_id: TRD-000002}
      expect: ["Oversized Outerwear", "peak"]

- question: "06:54:Q1"
  story: >
    K-1700 (1.7L kettle) sales have been dropping for 8 weeks. Week of Oct 4: 198 units, rating 3.5, return rate 7.2%.
    Week of Aug 9 (before drop): 338 units, rating 4.2, return rate 2.5%. Ratings and returns suggest quality issue.
    Dropoff is clearly visible in the trend data.
  checks:
    - tool: get_sales_trend_for_sku
      args: {sku: K-1700, weeks_back: 12}
      expect: ["K-1700", "198", "3.5"]
    - tool: get_sales_trend_for_sku
      args: {sku: K-1700}
      expect: ["338", "4.2"]

- question: "06:56:Q1"
  story: >
    Home and lifestyle trends are growing. Wellness & Recovery (TRD-000003) is in growing stage (8.3% market share UK).
    Search interest is strong (62 index), social mentions positive (1200 mentions, 72% positive sentiment).
    Oversized Outerwear is peak (TRD-000002, 28.9% market share).
    Insights note drafted showing trending categories and forecast data.
  checks:
    - tool: get_search_interest_by_term_and_market
      args: {term: wellness recovery, market: UK}
      expect: ["wellness recovery", "UK", "62"]
    - tool: get_social_mentions_trend
      args: {term: wellness recovery, market: UK}
      expect: ["wellness recovery", "UK", "1200", "72"]
    - tool: get_trend_lifecycle_stage
      args: {name: Wellness & Recovery}
      expect: ["growing", "TRD-000003"]
    - tool: draft_insights_note
      args: {category: Home, season: AW27}
      expect: ["Insights", "AW27"]

- question: "06:56:Q2"
  story: >
    Quiet Luxury (TRD-000001) search interest is falling (22 in UK, down from 35+ baseline).
    Social mentions declining (650 mentions, lowest confidence). Trend is in declining lifecycle stage.
    Forecasts show shift toward maximalism (medium confidence). It is being replaced by Oversized Outerwear signals.
  checks:
    - tool: get_search_interest_by_term_and_market
      args: {term: quiet luxury, market: UK}
      expect: ["quiet luxury", "22", "falling"]
    - tool: get_social_mentions_trend
      args: {term: quiet luxury, market: UK}
      expect: ["quiet luxury", "650", "58"]
    - tool: get_trend_lifecycle_stage
      args: {name: Quiet Luxury}
      expect: ["declining", "TRD-000001"]

- question: "06:56:Q3"
  story: >
    Competitor product launches by trend show mixed results. Zara's oversized outerwear launch (LCH-000001) was success.
    H&M's quiet luxury launch (LCH-000002) failed - market saturation and poor timing. COS wellness (LCH-000003) moderate.
    Uniqlo's oversized outerwear (LCH-000004) successful.
  checks:
    - tool: search_product_launches_by_trend
      args: {trend_id: TRD-000002}
      expect: ["Zara", "success"]
    - tool: search_product_launches_by_trend
      args: {trend_id: TRD-000001}
      expect: ["H&M", "failure", "saturation"]

- question: "06:56:Q4"
  story: >
    Oversized Outerwear (TRD-000002) is peak-stage with strong UK adoption (28.9% market share).
    Wellness & Recovery (TRD-000003) is growing (8.3% market share), trending well in search (62) and social (1200 mentions).
    Sustainable Materials (TRD-000004) steady across markets. Lead times vary by material readiness level.
  checks:
    - tool: get_trend_lifecycle_stage
      args: {name: Oversized Outerwear}
      expect: ["peak", "TRD-000002"]
    - tool: get_search_interest_by_term_and_market
      args: {term: wellness recovery}
      expect: ["wellness recovery"]

- question: "06:56:Q5"
  story: >
    Oversized silhouettes have historical precedent. First peak in 2008 (18 months). Current cycle started late 2024.
    Peak forecast is November 2026 with ~14 month total cycle. Historical data shows similar pattern length.
    Search interest currently at 78 (high and rising). Trend lifecycle stage is peak.
  checks:
    - tool: get_historical_silhouette_cycles
      args: {silhouette_name: oversized}
      expect: ["2008", "18", "2026"]
    - tool: get_trend_lifecycle_stage
      args: {name: Oversized Outerwear}
      expect: ["peak"]
    - tool: get_search_interest_by_term_and_market
      args: {term: oversized outerwear, market: UK}
      expect: ["78", "rising"]

- question: "06:56:Q7"
  story: >
    Top three categories by search: Oversized Outerwear (78 UK), Wellness Recovery (62 UK), Sustainable Fashion (58 UK).
    Social mentions align: Oversized (2100), Wellness (1200), Sustainable (1100). Quiet Luxury declining (22 search, 650 social).
    Market signals consistent across channels. Seasonal events show major lifts during Black Friday (280-350%) and holidays (450%).
  checks:
    - tool: get_search_interest_by_term_and_market
      args: {term: oversized outerwear, market: UK}
      expect: ["78"]
    - tool: get_social_mentions_trend
      args: {term: oversized outerwear, market: UK}
      expect: ["2100"]
    - tool: get_seasonal_events_calendar
      args: {event_name: Black Friday, market: UK}
      expect: ["280", "Black Friday"]

- question: "06:56:Q8"
  story: >
    Trend adoption by market shows US adoption lags UK. Oversized Outerwear: UK mainstream (28.9%),
    US early_adopter (15.2%, started Sep 2024 vs UK Sep 2024). Germany even later (12.1%, Oct 2024).
    US typically 4-8 weeks behind UK adoption. Germany 4-6 weeks behind US.
  checks:
    - tool: get_historical_trend_adoption_by_market
      args: {trend_id: TRD-000002}
      expect: ["UK", "mainstream", "28.9"]
    - tool: get_historical_trend_adoption_by_market
      args: {trend_id: TRD-000002, market: US}
      expect: ["15.2", "early_adopter"]

- question: "06:58:Q1"
  story: >
    Commodity price trends for materials in padded jacket. Cotton at 2.87/unit (up 15% YoY baseline 2.49).
    Polyester at 2.05/unit (up 10% baseline 1.86). Steel at 512.45 GBP/unit (stable). Labour cost proxies available.
    Data covers 12-month history and supports should-cost benchmarking.
  checks:
    - tool: get_commodity_price_trend
      args: {commodity: cotton}
      expect: ["cotton", "2.87"]
    - tool: get_commodity_price_trend
      args: {commodity: polyester}
      expect: ["polyester", "2.05"]

- question: "06:58:Q5"
  story: >
    Labour, material and freight costs by country over 12 months. Cotton up to 2.87 (from ~2.49).
    Polyester up to 2.05 (from ~1.86). Steel stable around 510 GBP/unit. Next season cost forecasts available.
  checks:
    - tool: get_commodity_price_trend
      args: {commodity: cotton, date_from: "-365d"}
      expect: ["cotton", "2.87", "USD"]

- question: "08:78:Q4"
  story: >
    Seasonal events calendar shows Black Friday in late November drives 280% sales lift in UK, 350% in US.
    Christmas season drives 450% in UK. Boxing Day drives 320%.
    These are the key events to plan competitor response and our own campaign timing around.
  checks:
    - tool: get_seasonal_events_calendar
      args: {event_name: Black Friday, market: UK}
      expect: ["Black Friday", "280"]
    - tool: get_seasonal_events_calendar
      args: {market: UK, event_type: Holiday}
      expect: ["Christmas", "450"]
