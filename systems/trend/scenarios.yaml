# One entry per question row that uses this system's tools (see: python -m mockmcp brief trend).
# story = what the generator plants; checks = tool calls whose output must contain every `expect` string.

- question: "05:50:Q5"
  story: >
    Nine competitor disclosures. Three are rated high impact within three years: Inditex (geopolitical, Red Sea shipping,
    nearshoring), Fast Retailing (regulatory, EU CSDDD, supplier traceability) and Primark (climate, factory heat and flooding,
    dual sourcing). H&M (climate) and others are medium or low.
  checks:
    - tool: search_competitor_risk_disclosures
      args: {impact_level: high, max_horizon_years: 3}
      expect: ["Inditex", "Red Sea", "CSDDD", "Primark", "Nearshoring"]
    - tool: search_competitor_risk_disclosures
      args: {risk_type: climate}
      expect: ["H&M", "Water scarcity"]

- question: "06:51:Q6"
  story: >
    Eleven materials and techniques. Volume-proven: Seamless 3D Knit Construction (-8% cost, -6% weight), Ultrasonic Welded Seams,
    Glass-Filled Recycled Polypropylene (-7% cost, -9% weight) and Performance Recycled Nylon. Experimental: Mycelium Leather,
    Algae-Based Foam and Aerogel Insulation Fill.
  checks:
    - tool: search_innovative_materials
      args: {readiness_level: volume_proven}
      expect: ["Seamless 3D Knit Construction", "Glass-Filled Recycled Polypropylene", "ECONYL"]
    - tool: search_innovative_materials
      args: {readiness_level: experimental}
      expect: ["Mycelium Leather", "Aerogel Insulation Fill", "Bolt Threads"]
    - tool: search_innovative_materials
      args: {max_cost_vs_standard_pct: 0}
      expect: ["Seamless 3D Knit Construction", "Recycled Polyester"]

- question: "06:52:Q1"
  story: >
    Womenswear AW27 forecasts cover colour (Chocolate Brown growing, Butter Yellow fading), material (Boucle and Textured Knits,
    Recycled Wool Blends emerging) and silhouette (Wide-Leg Tailoring growing, Oversized Outerwear at peak). Each trend names its
    driving segment, and the mood summary groups them by kind.
  checks:
    - tool: search_trend_forecasts_by_season
      args: {season: AW27, category: Womenswear}
      expect: ["Chocolate Brown", "Wide-Leg Tailoring", "Recycled Wool Blends", "SEG-001"]
    - tool: get_trend_lifecycle_stage
      args: {category: Womenswear, dimension: colour}
      expect: ["TRD-000009", "TRD-000010"]
    - tool: draft_mood_summary
      args: {season: AW27, category: Womenswear}
      expect: ["Colour", "Material", "Silhouette", "Chocolate Brown"]

- question: "06:54:Q1"
  story: >
    K-1700 held about 265 units a week at rating 4.3 and 2.4% returns until eight weeks ago, then fell to 172 units, rating 3.0 (2.8 in the latest week, as in the review ratings)
    and 7.5% returns. Its price rose from 69.99 to 70.99 in mid August and 77.99 in mid September (as in pricing); the latest week has a 69.99 promotion price. PF-220 stays steady.
  checks:
    - tool: get_sales_trend_for_sku
      args: {sku: K-1700}
      expect: ["172", "2.8", "7.5", "69.99"]
    - tool: get_sales_trend_for_sku
      args: {sku: PF-220}
      expect: ["PF-220"]

- question: "06:56:Q1"
  story: >
    Four Home trends. Dopamine Decor is the fastest-growing in the UK and US but a fad (already falling in Germany), driven by
    Trend Followers. Wellness & Recovery, Japandi Interiors and Sleep Sanctuary are structural. The insights note lists them.
  checks:
    - tool: get_search_interest_by_term_and_market
      args: {category: Home}
      expect: ["dopamine decor", "wellness recovery", "japandi", "Germany"]
    - tool: get_social_mentions_trend
      args: {category: Home}
      expect: ["dopamine decor", "sleep sanctuary"]
    - tool: get_trend_lifecycle_stage
      args: {category: Home}
      expect: ["fad", "structural", "SEG-005 Trend Followers"]
    - tool: draft_insights_note
      args: {category: Home, season: AW27}
      expect: ["Dopamine Decor", "Wellness & Recovery", "12-week search change"]

- question: "06:56:Q2"
  story: >
    Quiet luxury (TRD-000001) search has fallen about 49% in 12 weeks in the UK, with the US and Germany also down. The forecast
    says it is replaced by Bold Maximalism and the trend ends mid next year.
  checks:
    - tool: get_search_interest_by_term_and_market
      args: {term: quiet luxury, market: UK}
      expect: ["quiet luxury", "falling", "-49"]
    - tool: search_trend_forecasts_by_season
      args: {season: AW27, trend: quiet luxury}
      expect: ["bold maximalism", "TRD-000001"]
    - tool: get_trend_lifecycle_stage
      args: {name: quiet luxury}
      expect: ["declining", "TRD-000001"]

- question: "06:56:Q3"
  story: >
    Nine wellness and recovery launches (TRD-000003). Gaining traction: Weighted Sleep Blanket, Percussion Massage Gun, Recovery
    Slides. Flops: Infrared Sauna Blanket, Compression Recovery Boots, Cold Plunge Tub, mostly on price and space.
  checks:
    - tool: search_product_launches_by_trend
      args: {trend: wellness}
      expect: ["Weighted Sleep Blanket", "Infrared Sauna Blanket", "Cold Plunge Tub"]
    - tool: search_product_launches_by_trend
      args: {trend: wellness, success_metric: failure}
      expect: ["Compression Recovery Boots", "Bulky"]

- question: "06:56:Q4"
  story: >
    UK Home evidence: Dopamine Decor +107% search and +56% mentions but sentiment falling (fad). Wellness Recovery +44% search,
    +41% mentions; Sleep Sanctuary +33% and +31%; Japandi only +14%.
  checks:
    - tool: get_search_interest_by_term_and_market
      args: {category: Home, market: UK}
      expect: ["dopamine decor", "wellness recovery", "sleep sanctuary", "107.1"]
    - tool: get_social_mentions_trend
      args: {category: Home, market: UK}
      expect: ["dopamine decor", "wellness recovery", "-4"]

- question: "06:56:Q5"
  story: >
    Oversized Outerwear (TRD-000002) peaks around the following month and ends mid next year. UK search is flat near its peak,
    the US led by about 14 weeks and is already falling, Germany still rising. Earlier oversized cycles lasted 36 and 30 months
    for outerwear.
  checks:
    - tool: get_search_interest_by_term_and_market
      args: {term: oversized outerwear}
      expect: ["Germany", "falling", "rising"]
    - tool: get_trend_lifecycle_stage
      args: {name: oversized outerwear}
      expect: ["TRD-000002", "peak", "cyclical"]
    - tool: get_historical_silhouette_cycles
      args: {silhouette_name: oversized}
      expect: ["Outerwear", "36", "30", "markdown"]

- question: "06:56:Q7"
  story: >
    Top-category terms in the UK: Audio search +38% and social +44% (agree, rising); Footwear search -21% but social +26%;
    Jewellery search +33% but social -16% (diverge).
  checks:
    - tool: get_search_interest_by_term_and_market
      args: {term: footwear, market: UK}
      expect: ["footwear", "-20.8"]
    - tool: get_social_mentions_trend
      args: {term: jewellery, market: UK}
      expect: ["jewellery", "-15.8"]
    - tool: get_search_interest_by_term_and_market
      args: {term: audio, market: UK}
      expect: ["audio", "37.7"]

- question: "06:56:Q8"
  story: >
    Womenswear trends reach the US about 73 days before the UK (Germany and Australia lag it). Home trends reach Germany about 100
    days before the UK (US and Australia lag).
  checks:
    - tool: get_historical_trend_adoption_by_market
      args: {category: Womenswear}
      expect: ["US", "73", "Gorpcore"]
    - tool: get_historical_trend_adoption_by_market
      args: {category: Home, market: Germany}
      expect: ["Germany", "100", "Japandi Interiors"]
    - tool: get_historical_trend_adoption_by_market
      args: {trend_id: TRD-000002}
      expect: ["Oversized Outerwear", "Australia"]

- question: "06:58:Q1"
  story: >
    Padded-jacket inputs: down fill up about 28% over the year (58 USD per kg) and nylon up about 11% (3.10 USD per kg), with
    forward-curve rows for next season. Cotton, polyester, zinc and steel are also available.
  checks:
    - tool: get_commodity_price_trend
      args: {commodity: down}
      expect: ["down", "27.5", "Forward curve"]
    - tool: get_commodity_price_trend
      args: {commodity: nylon}
      expect: ["nylon", "10.8"]

- question: "06:58:Q5"
  story: >
    Cotton has risen about 20% over the year and polyester about 12%, and the forward curve shows further increases next season.
  checks:
    - tool: get_commodity_price_trend
      args: {commodity: cotton}
      expect: ["cotton", "USD", "Forward curve"]
    - tool: get_commodity_price_trend
      args: {commodity: polyester}
      expect: ["polyester", "per kg"]

- question: "08:78:Q4"
  story: >
    UK events: Black Friday & Cyber Monday (+280%), Christmas Season (+450%), Boxing Day Sale (+320%), Singles' Day and the
    Christmas delivery cut-off. Last year's Black Friday is available with an earlier start_date.
  checks:
    - tool: get_seasonal_events_calendar
      args: {market: UK}
      expect: ["Black Friday & Cyber Monday", "280", "Christmas Season", "Boxing Day Sale"]
    - tool: get_seasonal_events_calendar
      args: {event_name: Black Friday, start_date: -400d}
      expect: ["last year", "265"]
