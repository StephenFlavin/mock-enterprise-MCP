id: trend
name: Trend & Market Intelligence Platform
instructions: >
  Market trends, social signals, search interest and forecasts across product categories and regions.
  Trend ids look like TRD-000123. Use it for trend lifecycle tracking, market adoption patterns,
  product launch analysis, competitor risk disclosures, commodity price trends, and innovative materials.

tables:
  trends:
    key: trend_id
    cols:
      trend_id: {type: str, desc: "Trend id, e.g. TRD-000001"}
      name: {type: str, desc: "Trend name, e.g. Quiet Luxury"}
      category: {type: str, desc: "Category, e.g. Home, Womenswear, General"}
      dimension: {type: enum, values: [colour, material, silhouette, theme], desc: "What kind of trend it is"}
      region: {type: str, desc: "Primary region, e.g. UK, US, EU"}
      lifecycle_stage: {type: enum, values: [emerging, growing, peak, declining, fading], desc: "Lifecycle stage"}
      staying_power: {type: enum, values: [fad, cyclical, structural], desc: "Fad (short, sharp), cyclical (returns every few years) or structural (long-lasting shift)"}
      started_date: {type: date, desc: "When trend started gaining attention"}
      peak_date: {type: date, desc: "Estimated peak date"}
      forecast_end_date: {type: date, desc: "Forecast end date"}
      driving_segment: {type: str, desc: "Customer segment driving the trend, e.g. SEG-005 Trend Followers"}
      search_term: {type: str, desc: "Term used in the search interest and social mention series, e.g. quiet luxury"}
      description: {type: text, desc: "Trend description"}
      updated_at: {type: timestamp, desc: "Last updated"}

  market_search_interest:
    key: [term, market, week_ending]
    cols:
      term: {type: str, desc: "Search term, e.g. quiet luxury"}
      category: {type: str, desc: "Category of the term, e.g. Home, Womenswear, Electricals"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany"}
      week_ending: {type: date, desc: "Week ending date"}
      search_volume: {type: int, desc: "Search volume index 0-100"}
      trend_direction: {type: enum, values: [rising, stable, falling], desc: "Week-on-week direction"}
      updated_at: {type: timestamp, desc: "Last updated"}

  social_mentions:
    key: [term, market, week_ending]
    cols:
      term: {type: str, desc: "Topic/hashtag, e.g. oversized outerwear"}
      category: {type: str, desc: "Category of the term, e.g. Home, Womenswear, Electricals"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany"}
      week_ending: {type: date, desc: "Week ending date"}
      mention_count: {type: int, desc: "Number of mentions"}
      sentiment_pct_positive: {type: int, desc: "Positive sentiment percentage"}
      updated_at: {type: timestamp, desc: "Last updated"}

  sku_sales_trends:
    key: [sku, week_ending]
    cols:
      sku: {type: str, desc: "SKU"}
      week_ending: {type: date, desc: "Week ending date"}
      units_sold: {type: int, desc: "Units sold"}
      revenue_gbp: {type: float, desc: "Revenue in GBP"}
      avg_rating: {type: float, desc: "Average customer rating"}
      return_rate_pct: {type: float, desc: "Return rate percentage"}
      updated_at: {type: timestamp, desc: "Last updated"}

  commodity_prices:
    key: [commodity, date]
    cols:
      commodity: {type: str, desc: "Commodity, e.g. cotton, polyester, nylon, down, zinc, steel"}
      date: {type: date, desc: "Price date (weekly; future dates are forward-curve forecasts)"}
      price_per_unit: {type: float, desc: "Price per unit (see unit)"}
      currency: {type: str, desc: "Currency"}
      unit: {type: str, desc: "Price unit, e.g. per kg, per tonne"}
      source: {type: str, desc: "Data source; 'Forward curve (forecast)' for future dates"}
      updated_at: {type: timestamp, desc: "Last updated"}

  silhouette_cycles:
    key: silhouette_id
    cols:
      silhouette_id: {type: str, desc: "Silhouette id, e.g. SIL-000001"}
      silhouette_name: {type: str, desc: "Silhouette name, e.g. oversized, fitted, a-line"}
      category: {type: str, desc: "Category"}
      first_peak_year: {type: int, desc: "Year of first peak"}
      first_cycle_duration_months: {type: int, desc: "Duration of first cycle in months"}
      second_peak_year: {type: int, desc: "Year of second peak (0 if none)"}
      second_cycle_duration_months: {type: int, desc: "Duration of second cycle in months (0 if none)"}
      notes: {type: text, desc: "Historical notes, including the signals that preceded each peak"}

  trend_adoption:
    key: [trend_id, market]
    cols:
      trend_id: {type: str, desc: "Trend id, e.g. TRD-000001"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany, Australia"}
      adoption_start_date: {type: date, desc: "When trend adoption started in this market"}
      adoption_stage: {type: enum, values: [early_adopter, mainstream, saturated], desc: "Adoption stage"}
      market_share_pct: {type: float, desc: "Estimated market share percentage"}
      updated_at: {type: timestamp, desc: "Last updated"}

  product_launches:
    key: launch_id
    cols:
      launch_id: {type: str, desc: "Launch id, e.g. LCH-000101"}
      product_name: {type: str, desc: "Competitor product launched"}
      competitor_id: {type: str, desc: "Competitor or adjacent-industry brand name"}
      trend_id: {type: str, desc: "Trend id, e.g. TRD-000003"}
      launch_date: {type: date, desc: "Launch date"}
      category: {type: str, desc: "Product category"}
      price_gbp: {type: float, desc: "Launch price in GBP"}
      success_metric: {type: enum, values: [success, moderate, failure, unknown], desc: "Launch success"}
      traction_note: {type: text, desc: "Evidence of traction or lack of it"}
      failure_reason: {type: text, desc: "Reason if failed"}
      updated_at: {type: timestamp, desc: "Last updated"}

  competitor_risk_disclosures:
    key: disclosure_id
    cols:
      disclosure_id: {type: str, desc: "Disclosure id, e.g. CRD-000001"}
      competitor_id: {type: str, desc: "Competitor name"}
      risk_type: {type: enum, values: [geopolitical, climate, regulatory, supply_chain, other], desc: "Risk type"}
      disclosure_date: {type: date, desc: "Disclosure date"}
      horizon_years: {type: int, desc: "Years until the risk is expected to bite"}
      risk_description: {type: text, desc: "Risk description"}
      adjustment_action: {type: text, desc: "What competitor is doing about it"}
      impact_level: {type: enum, values: [high, medium, low], desc: "Estimated impact"}
      updated_at: {type: timestamp, desc: "Last updated"}

  innovative_materials:
    key: material_id
    cols:
      material_id: {type: str, desc: "Material id, e.g. MTL-000001"}
      material_name: {type: str, desc: "Material or technique name, e.g. recycled polyester"}
      material_category: {type: str, desc: "Category, e.g. Sustainable, Performance, Technical, Technique"}
      readiness_level: {type: enum, values: [experimental, pilot, volume_proven, mature], desc: "Readiness level"}
      primary_use: {type: str, desc: "Primary use case"}
      supplier_examples: {type: str, desc: "Example suppliers (semicolon-separated)"}
      cost_vs_standard_pct: {type: float, desc: "Unit cost difference vs standard material %, negative = cheaper"}
      weight_vs_standard_pct: {type: float, desc: "Weight difference vs standard material %, negative = lighter"}
      performance_benefits: {type: text, desc: "Key benefits"}
      compliance_impact: {type: str, desc: "Compliance or regulatory impact"}
      updated_at: {type: timestamp, desc: "Last updated"}

  seasonal_events:
    key: event_id
    cols:
      event_id: {type: str, desc: "Event id, e.g. EVT-000001"}
      event_name: {type: str, desc: "Event name, e.g. Black Friday"}
      event_type: {type: str, desc: "Type, e.g. Shopping, Holiday, Fashion"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany"}
      start_date: {type: date, desc: "Event start date"}
      end_date: {type: date, desc: "Event end date"}
      sales_lift_pct: {type: float, desc: "Typical sales lift percentage"}
      updated_at: {type: timestamp, desc: "Last updated"}

  trend_forecasts:
    key: forecast_id
    cols:
      forecast_id: {type: str, desc: "Forecast id, e.g. FCT-000001"}
      trend_id: {type: str, desc: "Trend id, e.g. TRD-000002"}
      season: {type: enum, values: [SS26, AW26, SS27, AW27, SS28, AW28], desc: "Season"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany"}
      forecast_text: {type: text, desc: "Forecast narrative"}
      confidence_level: {type: enum, values: [high, medium, low], desc: "Forecast confidence"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: search_competitor_risk_disclosures
    desc: Competitor risk disclosures with the action each competitor is taking. Filter by competitor, risk type, impact or time horizon; highest impact first.
    kind: select
    from: competitor_risk_disclosures
    filters:
      competitor_id: {op: like, desc: "Competitor name or part of it"}
      risk_type: {}
      impact_level: {}
      max_horizon_years: {col: horizon_years, op: "<=", type: int, desc: "Only risks expected within this many years"}
      disclosure_date: {col: disclosure_date, op: ">=", default: "-365d", desc: "Disclosures since"}
    columns: [disclosure_id, competitor_id, risk_type, disclosure_date, horizon_years, risk_description, adjustment_action, impact_level]
    order: "CASE impact_level WHEN 'high' THEN 0 WHEN 'medium' THEN 1 ELSE 2 END, disclosure_date DESC"
    limit: 100
    example: {risk_type: geopolitical}

  - name: search_innovative_materials
    desc: New materials and techniques with readiness level (experimental to mature), cost and weight versus standard, suppliers and compliance impact. Most proven first.
    kind: select
    from: innovative_materials
    filters:
      material_name: {op: like, desc: "Material name or part of it"}
      material_category: {op: like, desc: "Category, e.g. sustainable, technique, performance"}
      readiness_level: {}
      primary_use: {op: like, desc: "Use case"}
      max_cost_vs_standard_pct: {col: cost_vs_standard_pct, op: "<=", type: float, desc: "Only materials whose cost difference is at most this %, e.g. 0 for no dearer"}
      max_weight_vs_standard_pct: {col: weight_vs_standard_pct, op: "<=", type: float, desc: "Only materials whose weight difference is at most this %, e.g. -10 for 10% lighter"}
    columns: [material_id, material_name, material_category, readiness_level, primary_use, supplier_examples, cost_vs_standard_pct, weight_vs_standard_pct, performance_benefits, compliance_impact]
    order: "CASE readiness_level WHEN 'mature' THEN 0 WHEN 'volume_proven' THEN 1 WHEN 'pilot' THEN 2 ELSE 3 END, material_name"
    limit: 100
    example: {material_category: Sustainable}

  - name: search_trend_forecasts_by_season
    desc: Trend forecasts for a season with trend name, kind (colour, material, silhouette, theme), lifecycle stage and driving customer segment. Filter by category, market or trend.
    kind: sql
    args:
      season: {type: enum, values: [SS26, AW26, SS27, AW27, SS28, AW28], desc: "Season, e.g. AW27"}
      category: {desc: "Category, e.g. Womenswear, Home"}
      dimension: {type: enum, values: [colour, material, silhouette, theme], desc: "Kind of trend: colour, material, silhouette or theme"}
      trend: {desc: "Trend id (TRD-000002) or name, e.g. quiet luxury"}
      market: {desc: "Market, e.g. UK, US, Germany"}
      confidence_level: {type: enum, values: [high, medium, low], desc: "Forecast confidence"}
    sql: |
      SELECT f.forecast_id, f.trend_id, t.name AS trend_name, t.category, t.dimension, f.season, f.market, f.forecast_text,
             f.confidence_level, t.lifecycle_stage, t.staying_power, t.driving_segment
      FROM trend_forecasts f JOIN trends t ON t.trend_id = f.trend_id
      WHERE ($season IS NULL OR f.season = $season)
        AND ($category IS NULL OR lower(t.category) = lower($category))
        AND ($dimension IS NULL OR t.dimension = $dimension)
        AND ($trend IS NULL OR f.trend_id = upper($trend)
             OR lower(replace(t.name, ' & ', ' ')) LIKE '%' || lower(replace($trend, ' & ', ' ')) || '%')
        AND ($market IS NULL OR lower(f.market) = lower(CASE upper($market) WHEN 'DE' THEN 'Germany' WHEN 'GB' THEN 'UK' WHEN 'USA' THEN 'US' ELSE $market END))
        AND ($confidence_level IS NULL OR f.confidence_level = $confidence_level)
      ORDER BY t.category, t.dimension, CASE f.confidence_level WHEN 'high' THEN 0 WHEN 'medium' THEN 1 ELSE 2 END, f.forecast_id
    limit: 100
    example: {season: AW27, category: Womenswear}

  - name: get_trend_lifecycle_stage
    desc: Lifecycle stage and dates for trends (start, peak, forecast end), whether each is a fad, cyclical or structural, and its driving customer segment. Filter by name, category or kind.
    kind: select
    from: trends
    filters:
      trend_id: {op: like, desc: "Trend id, e.g. TRD-000002"}
      name: {op: like, desc: "Trend name, e.g. quiet luxury"}
      category: {desc: "Category, e.g. Womenswear, Home"}
      dimension: {}
      lifecycle_stage: {}
      staying_power: {}
    columns: [trend_id, name, category, dimension, lifecycle_stage, staying_power, started_date, peak_date, forecast_end_date, driving_segment, search_term, description]
    order: "category, CASE lifecycle_stage WHEN 'emerging' THEN 0 WHEN 'growing' THEN 1 WHEN 'peak' THEN 2 WHEN 'declining' THEN 3 ELSE 4 END, started_date DESC"
    limit: 30
    example: {name: quiet luxury}

  - name: get_sales_trend_for_sku
    desc: Weekly sales for one SKU, oldest first. Returns units, revenue, average price, rating, return rate and week-on-week unit change.
    kind: sql
    args:
      sku: {required: true}
      date_from: {type: date, default: "-180d", desc: "Sales from"}
    sql: |
      WITH w AS (
        SELECT sku, week_ending, units_sold, revenue_gbp, round(revenue_gbp / nullif(units_sold, 0), 2) AS avg_price_gbp,
               avg_rating, return_rate_pct,
               round(100.0 * (units_sold - lag(units_sold) OVER (ORDER BY week_ending)) / nullif(lag(units_sold) OVER (ORDER BY week_ending), 0), 1) AS units_change_wow_pct
        FROM sku_sales_trends WHERE sku = $sku
      )
      SELECT * FROM w WHERE week_ending >= CAST($date_from AS DATE) ORDER BY week_ending ASC
    limit: 100
    example: {sku: K-1700}

  - name: get_search_interest_by_term_and_market
    desc: Weekly search interest index (0-100) with 12-week change, by term and market. Omit term (optionally pass category) for a latest-week snapshot of every term.
    kind: sql
    args:
      term: {desc: "Search term or trend name, e.g. quiet luxury. Omit for all terms (latest week only)"}
      category: {desc: "Category of the terms, e.g. Home, Womenswear, Electricals"}
      market: {desc: "Market, e.g. UK, US, Germany. Omit for all three"}
      date_from: {type: date, default: "-180d", desc: "History from"}
    sql: |
      WITH s AS (
        SELECT term, category, market, week_ending, search_volume, trend_direction,
               round(100.0 * (search_volume - lag(search_volume, 12) OVER w) / nullif(lag(search_volume, 12) OVER w, 0), 1) AS change_12w_pct
        FROM market_search_interest
        WHERE ($term IS NULL OR lower(term) = lower($term)
               OR term IN (SELECT search_term FROM trends WHERE lower(replace(name, ' & ', ' ')) = lower(replace($term, ' & ', ' '))))
          AND ($category IS NULL OR lower(category) = lower($category))
          AND ($market IS NULL OR lower(market) = lower(CASE upper($market) WHEN 'DE' THEN 'Germany' WHEN 'GB' THEN 'UK' WHEN 'USA' THEN 'US' ELSE $market END))
        WINDOW w AS (PARTITION BY term, market ORDER BY week_ending)
      )
      SELECT term, category, market, week_ending, search_volume, trend_direction, change_12w_pct
      FROM s
      WHERE week_ending >= CAST($date_from AS DATE)
        AND ($term IS NOT NULL OR week_ending = (SELECT max(week_ending) FROM market_search_interest))
      ORDER BY term, market, week_ending ASC
    limit: 250
    example: {term: quiet luxury, market: UK}

  - name: get_social_mentions_trend
    desc: Weekly social mention counts and positive sentiment with 12-week change, by topic and market. Omit term (optionally pass category) for a latest-week snapshot of every topic.
    kind: sql
    args:
      term: {desc: "Topic, hashtag or trend name, e.g. oversized outerwear. Omit for all topics (latest week only)"}
      category: {desc: "Category of the topics, e.g. Home, Womenswear, Electricals"}
      market: {desc: "Market, e.g. UK, US, Germany. Omit for all three"}
      date_from: {type: date, default: "-180d", desc: "History from"}
    sql: |
      WITH s AS (
        SELECT term, category, market, week_ending, mention_count, sentiment_pct_positive,
               round(100.0 * (mention_count - lag(mention_count, 12) OVER w) / nullif(lag(mention_count, 12) OVER w, 0), 1) AS mentions_change_12w_pct,
               sentiment_pct_positive - lag(sentiment_pct_positive, 12) OVER w AS sentiment_change_12w_pts
        FROM social_mentions
        WHERE ($term IS NULL OR lower(term) = lower($term)
               OR term IN (SELECT search_term FROM trends WHERE lower(replace(name, ' & ', ' ')) = lower(replace($term, ' & ', ' '))))
          AND ($category IS NULL OR lower(category) = lower($category))
          AND ($market IS NULL OR lower(market) = lower(CASE upper($market) WHEN 'DE' THEN 'Germany' WHEN 'GB' THEN 'UK' WHEN 'USA' THEN 'US' ELSE $market END))
        WINDOW w AS (PARTITION BY term, market ORDER BY week_ending)
      )
      SELECT term, category, market, week_ending, mention_count, sentiment_pct_positive, mentions_change_12w_pct, sentiment_change_12w_pts
      FROM s
      WHERE week_ending >= CAST($date_from AS DATE)
        AND ($term IS NOT NULL OR week_ending = (SELECT max(week_ending) FROM social_mentions))
      ORDER BY term, market, week_ending ASC
    limit: 250
    example: {term: wellness recovery}

  - name: get_seasonal_events_calendar
    desc: Seasonal and shopping events with dates and typical sales lift by market, earliest first. Use to time promotions around Black Friday, Christmas and sales.
    kind: select
    from: seasonal_events
    filters:
      event_name: {op: like, desc: "Event name, e.g. Black Friday"}
      market: {}
      event_type: {op: like, desc: "Type, e.g. Shopping, Holiday"}
      start_date: {col: start_date, op: ">=", default: "-180d", desc: "Events starting on or after"}
      start_to: {col: start_date, op: "<=", type: date, desc: "Events starting on or before"}
    columns: [event_id, event_name, event_type, market, start_date, end_date, sales_lift_pct]
    order: start_date ASC
    limit: 50
    example: {market: UK}

  - name: get_commodity_price_trend
    desc: Weekly commodity price series (cotton, polyester, nylon, down, zinc, steel, nickel) with change versus a year earlier. Future dates are the forward-curve forecast for next season.
    kind: sql
    args:
      commodity: {required: true, desc: "Commodity, e.g. cotton, polyester, nylon, down, recycled polyester, zinc, steel, nickel"}
      date_from: {type: date, default: "-365d", desc: "Prices from"}
      date_to: {type: date, default: "+180d", desc: "Prices to; future dates are forecasts"}
    sql: |
      WITH c AS (
        SELECT commodity, date, price_per_unit, currency, unit, source,
               round(100.0 * (price_per_unit / lag(price_per_unit, 52) OVER (ORDER BY date) - 1), 1) AS change_vs_year_earlier_pct
        FROM commodity_prices
        WHERE lower(commodity) = lower($commodity)
      )
      SELECT * FROM c
      WHERE date >= CAST($date_from AS DATE) AND date <= CAST($date_to AS DATE)
      ORDER BY date ASC
    limit: 100
    example: {commodity: cotton}

  - name: get_historical_silhouette_cycles
    desc: Past cycles of a silhouette (oversized, fitted, maxi, wide-leg) with peak years, durations and the signals that preceded each peak. Use to predict when a silhouette peaks and fades.
    kind: select
    from: silhouette_cycles
    filters:
      silhouette_name: {op: like, desc: "Silhouette, e.g. oversized, fitted"}
      category: {op: like, desc: "Category, e.g. Outerwear, Knitwear"}
    columns: [silhouette_id, silhouette_name, category, first_peak_year, first_cycle_duration_months, second_peak_year, second_cycle_duration_months, notes]
    order: silhouette_name, category
    limit: 100
    example: {silhouette_name: oversized}

  - name: get_historical_trend_adoption_by_market
    desc: When each market adopted a trend. Returns start date, stage, share, days before the UK and the average lead per category. Pass trend_id or category.
    kind: sql
    args:
      trend_id: {desc: "Trend id, e.g. TRD-000002. Omit to compare all trends"}
      category: {desc: "Trend category, e.g. Womenswear, Home"}
      market: {desc: "Market, e.g. US, Germany, Australia"}
    sql: |
      WITH x AS (
        SELECT d.trend_id, t.name AS trend_name, t.category, d.market, d.adoption_start_date, d.adoption_stage, d.market_share_pct,
               date_diff('day', d.adoption_start_date, u.adoption_start_date) AS days_before_uk
        FROM trend_adoption d
        JOIN trends t ON t.trend_id = d.trend_id
        LEFT JOIN trend_adoption u ON u.trend_id = d.trend_id AND u.market = 'UK'
      ), y AS (
        SELECT *, round(avg(days_before_uk) OVER (PARTITION BY category, market), 0) AS avg_days_before_uk_in_category
        FROM x
      )
      SELECT trend_id, trend_name, category, market, adoption_start_date, adoption_stage, market_share_pct,
             days_before_uk, avg_days_before_uk_in_category
      FROM y
      WHERE ($trend_id IS NULL OR trend_id = upper($trend_id))
        AND ($category IS NULL OR lower(category) = lower($category))
        AND ($market IS NULL OR lower(market) = lower(CASE upper($market) WHEN 'DE' THEN 'Germany' WHEN 'GB' THEN 'UK' WHEN 'USA' THEN 'US' ELSE $market END))
      ORDER BY category, trend_id, adoption_start_date
    limit: 100
    example: {trend_id: TRD-000002}

  - name: search_product_launches_by_trend
    desc: Competitor and adjacent-industry product launches for a trend, with price, traction and failure reasons. Use to see which launches succeeded or flopped.
    kind: sql
    args:
      trend: {desc: "Trend id (TRD-000003) or name, e.g. wellness"}
      competitor_id: {desc: "Competitor or brand name, or part of it"}
      category: {desc: "Product category, e.g. Home"}
      success_metric: {type: enum, values: [success, moderate, failure, unknown], desc: "Launch outcome"}
      date_from: {type: date, default: "-365d", desc: "Launches since"}
    sql: |
      SELECT l.launch_id, l.product_name, l.competitor_id, l.trend_id, t.name AS trend_name, l.launch_date, l.category,
             l.price_gbp, l.success_metric, l.traction_note, l.failure_reason
      FROM product_launches l JOIN trends t ON t.trend_id = l.trend_id
      WHERE ($trend IS NULL OR l.trend_id = upper($trend)
             OR lower(replace(t.name, ' & ', ' ')) LIKE '%' || lower(replace($trend, ' & ', ' ')) || '%')
        AND ($competitor_id IS NULL OR lower(l.competitor_id) LIKE '%' || lower($competitor_id) || '%')
        AND ($category IS NULL OR lower(l.category) = lower($category))
        AND ($success_metric IS NULL OR l.success_metric = $success_metric)
        AND l.launch_date >= CAST($date_from AS DATE)
      ORDER BY l.launch_date DESC
    limit: 50
    example: {trend: wellness}

  - name: draft_mood_summary
    desc: Draft a design-team mood summary for a season and category, grouped into colour, material and silhouette trends with stage, customer segment and forecasts.
    kind: draft
    args:
      season: {type: enum, values: [SS26, AW26, SS27, AW27, SS28, AW28], default: AW27, desc: "Season, e.g. AW27"}
      category: {default: Womenswear, desc: "Category, e.g. Womenswear, Home"}
      trend_id: {desc: "Trend id to summarise just one trend, e.g. TRD-000009. Omit for the whole category"}
    sql:
      trends: |
        SELECT t.trend_id, t.name, t.dimension, t.lifecycle_stage, t.staying_power, t.started_date, t.peak_date, t.driving_segment,
               t.description,
               (SELECT string_agg(f.market || ': ' || f.forecast_text, ' | ') FROM trend_forecasts f
                 WHERE f.trend_id = t.trend_id AND f.season = $season) AS forecast
        FROM trends t
        WHERE lower(t.category) = lower($category) AND ($trend_id IS NULL OR t.trend_id = upper($trend_id))
          AND EXISTS (SELECT 1 FROM trend_forecasts f WHERE f.trend_id = t.trend_id AND f.season = $season)
        ORDER BY t.dimension, t.started_date DESC
    template: |
      # Mood summary: {{ category }} {{ season }}
      {% for dim in ['colour', 'material', 'silhouette', 'theme'] %}{% set rows = trends | selectattr('dimension', 'equalto', dim) | list %}{% if rows %}
      ## {{ dim | capitalize }}
      {% for t in rows %}- **{{ t.name }}** ({{ t.lifecycle_stage }}, {{ t.staying_power }}; started {{ t.started_date }}, peak {{ t.peak_date }}; segment {{ t.driving_segment }}): {{ t.description }}. Forecast: {{ t.forecast }}
      {% endfor %}{% endif %}{% endfor %}
      Ready for creative brief and mood board development.
    example: {season: AW27, category: Womenswear}

  - name: draft_insights_note
    desc: Draft an insights note for a category and season. Lists each trend with stage, fad or structural, driving segment, search growth by market and forecasts.
    kind: draft
    args:
      category: {required: true, desc: "Category, e.g. Womenswear, Home"}
      season: {required: true, type: enum, values: [SS26, AW26, SS27, AW27, SS28, AW28], desc: "Season, e.g. AW27"}
    sql:
      trends: |
        WITH s AS (
          SELECT term, market, week_ending, search_volume,
                 lag(search_volume, 12) OVER (PARTITION BY term, market ORDER BY week_ending) AS prev
          FROM market_search_interest
        ), latest AS (
          SELECT term,
                 max(search_volume) FILTER (WHERE market = 'UK') AS uk_now,
                 round(100.0 * (max(search_volume) FILTER (WHERE market = 'UK') - max(prev) FILTER (WHERE market = 'UK')) / nullif(max(prev) FILTER (WHERE market = 'UK'), 0), 0) AS uk_chg,
                 round(100.0 * (max(search_volume) FILTER (WHERE market = 'US') - max(prev) FILTER (WHERE market = 'US')) / nullif(max(prev) FILTER (WHERE market = 'US'), 0), 0) AS us_chg,
                 round(100.0 * (max(search_volume) FILTER (WHERE market = 'Germany') - max(prev) FILTER (WHERE market = 'Germany')) / nullif(max(prev) FILTER (WHERE market = 'Germany'), 0), 0) AS de_chg
          FROM s WHERE week_ending = (SELECT max(week_ending) FROM market_search_interest) GROUP BY term
        )
        SELECT t.trend_id, t.name, t.lifecycle_stage, t.staying_power, t.peak_date, t.forecast_end_date, t.driving_segment,
               l.uk_now, l.uk_chg, l.us_chg, l.de_chg
        FROM trends t LEFT JOIN latest l ON l.term = t.search_term
        WHERE lower(t.category) = lower($category) AND t.lifecycle_stage <> 'fading'
        ORDER BY l.uk_chg DESC NULLS LAST
      forecasts: |
        SELECT t.name, f.market, f.forecast_text FROM trend_forecasts f JOIN trends t ON t.trend_id = f.trend_id
        WHERE lower(t.category) = lower($category) AND f.season = $season ORDER BY t.name, f.market
    template: |
      # Insights: {{ category | capitalize }} - {{ season }}

      ## Trends (fastest-growing UK search first)
      {% for t in trends %}- **{{ t.name }}** ({{ t.trend_id }}): {{ t.lifecycle_stage }}, {{ t.staying_power }}; peak {{ t.peak_date }}, ends {{ t.forecast_end_date }}; driven by {{ t.driving_segment }}. 12-week search change: UK {{ t.uk_chg }}%, US {{ t.us_chg }}%, Germany {{ t.de_chg }}%.
      {% endfor %}
      ## Forecasts for {{ season }}
      {% for f in forecasts %}- {{ f.name }} ({{ f.market }}): {{ f.forecast_text }}
      {% endfor %}
      Ready for range planning and creative brief.
    example: {category: Home, season: AW27}
