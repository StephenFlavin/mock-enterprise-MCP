id: trend
name: Trend & Market Intelligence Platform
instructions: >
  Market trends, social signals, search interest and forecasts across product categories and regions.
  Trend ids look like TRD-000123. Use it for trend lifecycle tracking, market adoption patterns,
  product launch analysis, competitor risk disclosures, commodity price trends, and innovative materials.

tables:
  trends:
    key: trend_id
    cols:
      trend_id: {type: str, desc: "Trend id, e.g. TRD-000123"}
      name: {type: str, desc: "Trend name, e.g. Quiet Luxury"}
      category: {type: str, desc: "Category, e.g. Home, Womenswear, Wellness"}
      region: {type: str, desc: "Primary region, e.g. UK, US, EU"}
      lifecycle_stage: {type: enum, values: [emerging, growing, peak, declining, fading], desc: "Lifecycle stage"}
      started_date: {type: date, desc: "When trend started gaining attention"}
      peak_date: {type: date, desc: "Estimated peak date"}
      forecast_end_date: {type: date, desc: "Forecast end date"}
      description: {type: text, desc: "Trend description"}
      updated_at: {type: timestamp, desc: "Last updated"}

  market_search_interest:
    key: [term, market, week_ending]
    cols:
      term: {type: str, desc: "Search term, e.g. quiet luxury"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany"}
      week_ending: {type: date, desc: "Week ending date"}
      search_volume: {type: int, desc: "Search volume index 0-100"}
      trend_direction: {type: enum, values: [rising, stable, falling], desc: "Week-on-week direction"}
      updated_at: {type: timestamp, desc: "Last updated"}

  social_mentions:
    key: [term, market, week_ending]
    cols:
      term: {type: str, desc: "Topic/hashtag, e.g. oversized outerwear"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany"}
      week_ending: {type: date, desc: "Week ending date"}
      mention_count: {type: int, desc: "Number of mentions"}
      sentiment_pct_positive: {type: int, desc: "Positive sentiment percentage"}
      updated_at: {type: timestamp, desc: "Last updated"}

  sku_sales_trends:
    key: [sku, week_ending]
    cols:
      sku: {type: str, desc: "SKU"}
      week_ending: {type: date, desc: "Week ending date"}
      units_sold: {type: int, desc: "Units sold"}
      revenue_gbp: {type: float, desc: "Revenue in GBP"}
      avg_rating: {type: float, desc: "Average customer rating"}
      return_rate_pct: {type: float, desc: "Return rate percentage"}
      updated_at: {type: timestamp, desc: "Last updated"}

  commodity_prices:
    key: [commodity, date]
    cols:
      commodity: {type: str, desc: "Commodity, e.g. cotton, polyester, steel"}
      date: {type: date, desc: "Price date"}
      price_per_unit: {type: float, desc: "Price per unit (varies by commodity)"}
      currency: {type: str, desc: "Currency"}
      source: {type: str, desc: "Data source"}
      updated_at: {type: timestamp, desc: "Last updated"}

  silhouette_cycles:
    key: silhouette_id
    cols:
      silhouette_id: {type: str, desc: "Silhouette id, e.g. SIL-000001"}
      silhouette_name: {type: str, desc: "Silhouette name, e.g. oversized, fitted, a-line"}
      category: {type: str, desc: "Category"}
      first_peak_year: {type: int, desc: "Year of first peak"}
      first_cycle_duration_months: {type: int, desc: "Duration of first cycle in months"}
      second_peak_year: {type: int, desc: "Year of second peak (if any)"}
      second_cycle_duration_months: {type: int, desc: "Duration of second cycle (if any)"}
      notes: {type: text, desc: "Historical notes"}

  trend_adoption:
    key: [trend_id, market]
    cols:
      trend_id: {type: str, desc: "Trend id"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany"}
      adoption_start_date: {type: date, desc: "When trend adoption started"}
      adoption_stage: {type: enum, values: [early_adopter, mainstream, saturated], desc: "Adoption stage"}
      market_share_pct: {type: float, desc: "Estimated market share percentage"}
      updated_at: {type: timestamp, desc: "Last updated"}

  product_launches:
    key: launch_id
    cols:
      launch_id: {type: str, desc: "Launch id, e.g. LCH-000001"}
      sku: {type: str, desc: "SKU launched"}
      competitor_id: {type: str, desc: "Competitor name or identifier"}
      trend_id: {type: str, desc: "Trend category"}
      launch_date: {type: date, desc: "Launch date"}
      category: {type: str, desc: "Product category"}
      success_metric: {type: enum, values: [success, moderate, failure, unknown], desc: "Launch success"}
      failure_reason: {type: str, desc: "Reason if failed"}
      updated_at: {type: timestamp, desc: "Last updated"}

  competitor_risk_disclosures:
    key: disclosure_id
    cols:
      disclosure_id: {type: str, desc: "Disclosure id, e.g. CRD-000001"}
      competitor_id: {type: str, desc: "Competitor name"}
      risk_type: {type: enum, values: [geopolitical, climate, regulatory, supply_chain, other], desc: "Risk type"}
      disclosure_date: {type: date, desc: "Disclosure date"}
      risk_description: {type: text, desc: "Risk description"}
      adjustment_action: {type: str, desc: "What competitor is doing about it"}
      impact_level: {type: enum, values: [high, medium, low], desc: "Estimated impact"}
      updated_at: {type: timestamp, desc: "Last updated"}

  innovative_materials:
    key: material_id
    cols:
      material_id: {type: str, desc: "Material id, e.g. MTL-000001"}
      material_name: {type: str, desc: "Material name, e.g. recycled polyester"}
      material_category: {type: str, desc: "Category, e.g. Sustainable, Performance, Technical"}
      readiness_level: {type: enum, values: [experimental, pilot, volume_proven, mature], desc: "Readiness level"}
      primary_use: {type: str, desc: "Primary use case"}
      supplier_examples: {type: str, desc: "Example suppliers (comma-separated)"}
      cost_vs_standard_pct: {type: float, desc: "Cost difference vs standard material %"}
      performance_benefits: {type: text, desc: "Key benefits"}
      compliance_impact: {type: str, desc: "Compliance or regulatory impact"}
      updated_at: {type: timestamp, desc: "Last updated"}

  seasonal_events:
    key: event_id
    cols:
      event_id: {type: str, desc: "Event id, e.g. EVT-000001"}
      event_name: {type: str, desc: "Event name, e.g. Black Friday"}
      event_type: {type: str, desc: "Type, e.g. Shopping, Holiday, Fashion"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany"}
      start_date: {type: date, desc: "Event start date"}
      end_date: {type: date, desc: "Event end date"}
      sales_lift_pct: {type: float, desc: "Typical sales lift percentage"}
      updated_at: {type: timestamp, desc: "Last updated"}

  trend_forecasts:
    key: forecast_id
    cols:
      forecast_id: {type: str, desc: "Forecast id, e.g. FCT-000001"}
      trend_id: {type: str, desc: "Trend id"}
      season: {type: enum, values: [SS26, AW26, SS27, AW27, SS28, AW28], desc: "Season"}
      market: {type: str, desc: "Market, e.g. UK, US, Germany"}
      forecast_text: {type: text, desc: "Forecast narrative"}
      confidence_level: {type: enum, values: [high, medium, low], desc: "Forecast confidence"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: search_competitor_risk_disclosures
    desc: Competitor risk disclosures and actions. Search by competitor, risk type or impact. Returns ids and descriptions.
    kind: select
    from: competitor_risk_disclosures
    filters:
      competitor_id: {op: like, desc: "Competitor name or part of it"}
      risk_type: {}
      impact_level: {}
      disclosure_date: {col: disclosure_date, op: ">=", default: "-365d", desc: "Disclosures since"}
    columns: [disclosure_id, competitor_id, risk_type, disclosure_date, risk_description, adjustment_action, impact_level]
    order: disclosure_date DESC
    limit: 30
    example: {risk_type: geopolitical}

  - name: search_innovative_materials
    desc: Innovative materials by name, category or readiness level. Returns candidates with cost and compliance impact.
    kind: select
    from: innovative_materials
    filters:
      material_name: {op: like, desc: "Material name or part of it"}
      material_category: {op: like, desc: "Category, e.g. sustainable"}
      readiness_level: {}
      primary_use: {op: like, desc: "Use case"}
    columns: [material_id, material_name, material_category, readiness_level, primary_use, supplier_examples, cost_vs_standard_pct, performance_benefits, compliance_impact]
    order: readiness_level DESC, material_name
    limit: 30
    example: {material_category: Sustainable}

  - name: search_trend_forecasts_by_season
    desc: Trend forecasts for a season. Returns narrative forecasts by trend and market.
    kind: select
    from: trend_forecasts
    filters:
      season: {}
      trend_id: {op: like, desc: "Trend id or name"}
      market: {}
      confidence_level: {}
    columns: [forecast_id, trend_id, season, market, forecast_text, confidence_level]
    order: confidence_level DESC, trend_id
    limit: 30
    example: {season: AW27}

  - name: get_trend_lifecycle_stage
    desc: Current lifecycle stage and dates for a trend. Returns stage, start date, peak date and forecast end.
    kind: select
    from: trends
    filters:
      trend_id: {op: like, desc: "Trend id or name"}
      name: {op: like, desc: "Trend name, e.g. quiet luxury"}
      category: {}
      lifecycle_stage: {}
    columns: [trend_id, name, category, lifecycle_stage, started_date, peak_date, forecast_end_date, description]
    order: trend_id
    limit: 20
    example: {name: quiet luxury}

  - name: get_sales_trend_for_sku
    desc: Weekly sales trend for one SKU. Returns units, revenue, ratings and return rate by week, oldest first.
    kind: sql
    args:
      sku: {required: true, desc: "SKU"}
      weeks_back: {type: int, default: 26, desc: "Number of weeks of history"}
    sql: |
      SELECT sku, week_ending, units_sold, revenue_gbp, avg_rating, return_rate_pct
      FROM sku_sales_trends
      WHERE sku = $sku
        AND week_ending >= CAST($as_of AS DATE) - INTERVAL $weeks_back WEEK
      ORDER BY week_ending ASC
    limit: 30
    example: {sku: K-1700}

  - name: get_search_interest_by_term_and_market
    desc: Weekly search interest index for a term by market. Returns volume 0-100, trend direction by week.
    kind: sql
    args:
      term: {required: true, desc: "Search term, e.g. quiet luxury"}
      market: {desc: "Market, e.g. UK, US, Germany (default all)"}
      weeks_back: {type: int, default: 52, desc: "Number of weeks of history"}
    sql: |
      SELECT term, market, week_ending, search_volume, trend_direction
      FROM market_search_interest
      WHERE term = $term
        AND ($market IS NULL OR market = $market)
        AND week_ending >= CAST($as_of AS DATE) - INTERVAL $weeks_back WEEK
      ORDER BY market, week_ending ASC
    limit: 100
    example: {term: quiet luxury, market: UK}

  - name: get_social_mentions_trend
    desc: Weekly social mentions for a topic by market. Returns mention count and sentiment, oldest first.
    kind: sql
    args:
      term: {required: true, desc: "Topic or hashtag"}
      market: {desc: "Market, e.g. UK, US, Germany (default all)"}
      weeks_back: {type: int, default: 26, desc: "Number of weeks of history"}
    sql: |
      SELECT term, market, week_ending, mention_count, sentiment_pct_positive
      FROM social_mentions
      WHERE term = $term
        AND ($market IS NULL OR market = $market)
        AND week_ending >= CAST($as_of AS DATE) - INTERVAL $weeks_back WEEK
      ORDER BY market, week_ending ASC
    limit: 100
    example: {term: wellness recovery}

  - name: get_seasonal_events_calendar
    desc: Seasonal events and sales lifts by market and date. Returns events and typical sales impact.
    kind: select
    from: seasonal_events
    filters:
      event_name: {op: like, desc: "Event name, e.g. Black Friday"}
      market: {}
      event_type: {op: like, desc: "Type, e.g. Shopping, Holiday"}
      start_date: {col: start_date, op: ">=", default: "-180d", desc: "Events on or after"}
    columns: [event_id, event_name, event_type, market, start_date, end_date, sales_lift_pct]
    order: start_date DESC
    limit: 50
    example: {market: UK}

  - name: get_commodity_price_trend
    desc: Historical commodity prices by commodity and date. Returns price series for benchmarking and forecasting.
    kind: sql
    args:
      commodity: {required: true, desc: "Commodity, e.g. cotton, polyester, steel"}
      date_from: {type: date, default: "-365d", desc: "Prices from"}
      date_to: {type: date, default: "-1d", desc: "Prices to"}
    sql: |
      SELECT commodity, date, price_per_unit, currency, source
      FROM commodity_prices
      WHERE commodity = $commodity
        AND date >= CAST($date_from AS DATE)
        AND date <= CAST($date_to AS DATE)
      ORDER BY date ASC
    limit: 100
    example: {commodity: cotton}

  - name: get_historical_silhouette_cycles
    desc: Historical silhouette cycles with peak years and durations. For predicting when oversized will peak.
    kind: select
    from: silhouette_cycles
    filters:
      silhouette_name: {op: like, desc: "Silhouette, e.g. oversized, fitted"}
      category: {op: like, desc: "Category"}
    columns: [silhouette_id, silhouette_name, category, first_peak_year, first_cycle_duration_months, second_peak_year, second_cycle_duration_months, notes]
    order: silhouette_name
    limit: 30
    example: {silhouette_name: oversized}

  - name: get_historical_trend_adoption_by_market
    desc: When trends were adopted in each market. Returns adoption stage and typical market share for a trend.
    kind: sql
    args:
      trend_id: {required: true, desc: "Trend id"}
      market: {desc: "Market, e.g. UK, US, Germany (default all)"}
    sql: |
      SELECT trend_id, market, adoption_start_date, adoption_stage, market_share_pct
      FROM trend_adoption
      WHERE trend_id = $trend_id
        AND ($market IS NULL OR market = $market)
      ORDER BY adoption_start_date ASC
    limit: 30
    example: {trend_id: TRD-000001}

  - name: search_product_launches_by_trend
    desc: Product launches and competitor activity by trend. Returns launch success, failure reasons, and timing.
    kind: select
    from: product_launches
    filters:
      trend_id: {op: like, desc: "Trend id or name"}
      competitor_id: {op: like, desc: "Competitor name"}
      category: {op: like, desc: "Product category"}
      success_metric: {}
      launch_date: {col: launch_date, op: ">=", default: "-365d", desc: "Launches since"}
    columns: [launch_id, sku, competitor_id, trend_id, launch_date, category, success_metric, failure_reason]
    order: launch_date DESC
    limit: 50
    example: {trend_id: TRD-000001}

  - name: draft_mood_summary
    desc: Draft mood summary for design team. Generates narrative for key colour, material and silhouette trends.
    kind: draft
    args: [trend_id]
    sql:
      trend: SELECT * FROM trends WHERE trend_id = $trend_id LIMIT 1
      forecasts: SELECT season, market, forecast_text FROM trend_forecasts WHERE trend_id = $trend_id LIMIT 5
    template: |
      # Mood Summary: {{ trend[0].name }}

      **Lifecycle Stage:** {{ trend[0].lifecycle_stage }}
      **Category:** {{ trend[0].category }}
      **Region:** {{ trend[0].region }}

      {{ trend[0].description }}

      ## Key Signals
      - Trend started: {{ trend[0].started_date }}
      - Peak forecast: {{ trend[0].peak_date }}

      ## Market Forecasts
      {% for f in forecasts %}
      - **{{ f.season }} ({{ f.market }}):** {{ f.forecast_text }}
      {% endfor %}

      Ready for creative brief and mood board development.
    example: {trend_id: TRD-000002}

  - name: draft_insights_note
    desc: Draft insights note. Generates a narrative summary of trends, lifecycle stages and key signals.
    kind: draft
    args:
      category: {required: true, desc: "Category, e.g. Womenswear, Home"}
      season: {required: true, desc: "Season, e.g. AW27"}
    sql:
      trends: SELECT trend_id, name, lifecycle_stage FROM trends WHERE category = $category ORDER BY lifecycle_stage, started_date DESC LIMIT 10
      forecasts: SELECT forecast_text, market FROM trend_forecasts WHERE season = $season LIMIT 5
    template: |
      # Insights: {{ category | capitalize }} - {{ season }}

      ## Key Trends
      {% for t in trends %}
      - **{{ t.name }}** ({{ t.lifecycle_stage }})
      {% endfor %}

      ## Market Forecasts
      {% for f in forecasts %}
      - {{ f.market }}: {{ f.forecast_text }}
      {% endfor %}

      Ready for range planning and creative brief.
    example: {category: Womenswear, season: AW27}
