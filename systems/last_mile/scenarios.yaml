- question: "02:16:Q1"
  story: First-attempt success slips from about 94% to 89% over eight weeks. The drivers are CAR-013 DoorStep Couriers in UK North (courier ran out of time), rising address-not-found failures in postcode areas M4, L1 and M1 (address validation issue rates jump there), and a smaller rise in not-at-home failures on door delivery of PF-220. Customer-not-available is the largest cause by count but is flat.
  checks:
    - tool: get_first_attempt_success_trend
      args: {weeks: 8}
      expect: ["93.9", "88.8"]
    - tool: get_first_attempt_failures_by_dimension
      args: {dimension: courier}
      expect: ["CAR-013", "DoorStep Couriers", "-8.3"]
    - tool: get_first_attempt_failures_by_dimension
      args: {dimension: region}
      expect: ["UK North", "-7.6"]
    - tool: get_first_attempt_failures_by_dimension
      args: {dimension: product}
      expect: ["PF-220"]
    - tool: get_first_attempt_failures_by_dimension
      args: {dimension: delivery_option}
      expect: ["door", "86.6"]
    - tool: list_failed_delivery_reasons
      args: {}
      expect: ["Address not found", "Courier ran out of time", "Customer not available"]
    - tool: get_address_validation_failure_rate
      args: {}
      expect: ["M4", "L1", "44.6"]
    - tool: list_worst_postcodes_by_failed_delivery
      args: {}
      expect: ["M4", "Manchester", "35.1", "L1"]
    - tool: calculate_repeat_delivery_cost
      args: {weeks: 4}
      expect: ["Customer not available", "Address not found", "13118"]

- question: "02:16:Q2"
  story: In London, Courier A is CAR-011 SwiftParcel (65% of volume) and Courier B is CAR-012 ParcelPoint Express (15%). B is cheaper per drop (3.31 vs 3.86) but weaker on on-time (85.7% vs 90.5%), damage (2.34% vs 1.17%) and complaints (4.09% vs 2.18%). Rules RULE-900001..900003 hold the current London split; a trial for CAR-012 is created and then narrowed to north London postcodes.
  checks:
    - tool: get_courier_scorecard
      args: {region: London}
      expect: ["CAR-011", "CAR-012", "90.5", "85.7", "3.86", "3.31"]
    - tool: get_cost_per_drop_by_courier
      args: {region: London}
      expect: ["CAR-012", "3.31", "3.86"]
    - tool: get_damage_rate_by_courier
      args: {region: London}
      expect: ["CAR-012", "2.34", "1.17"]
    - tool: get_complaint_rate_by_courier
      args: {region: London}
      expect: ["CAR-012", "4.09", "2.18"]
    - tool: draft_courier_trial_plan
      args: {courier_id: CAR-012, volume_share_pct: 20, region: London}
      expect: ["COURIER TRIAL PLAN", "ParcelPoint Express", "SUCCESS CRITERIA", "EXIT CONDITIONS", "N7"]
    - tool: create_courier_allocation_rule
      args: {rule_name: "North London trial", courier_id: CAR-012, postcode_areas: "N1,N4,N7,N15,N16,NW1,E8", volume_share_pct: 20, region: London}
      expect: ["RULE-900005", "CAR-012", "trial", "20"]
    - tool: update_courier_allocation_rule
      args: {rule_id: RULE-900005, postcode_areas: "N1,N4,N7,N15,N16,NW1"}
      expect: ["RULE-900005", "N1,N4,N7,N15,N16,NW1"]

- question: "02:16:Q3"
  story: In the last two Nov-Dec peaks on-time performance was worst in Scotland and UK North (about 76% last peak vs 88% in London); the worst days were Cyber Monday and the week before Christmas. With 12% growth UK North and Scotland have the largest capacity shortfall against courier capacity.
  checks:
    - tool: get_historical_peak_delivery_performance
      args: {}
      expect: ["last_peak", "prior_peak", "Scotland", "UK North", "76.6"]
    - tool: list_worst_delivery_days
      args: {peak_season: last_peak}
      expect: ["Monday", "63.8", "Scotland"]
    - tool: calculate_courier_capacity_gap_by_region
      args: {growth_pct: 12}
      expect: ["UK North", "426", "477", "390", "135"]

- question: "02:16:Q4"
  story: London is the largest city by deliveries, with Birmingham, Manchester, Leeds and Dublin next. Announced low-emission zone, parking and delivery-window rules add most per drop in Dublin and Amsterdam and most in total in London.
  checks:
    - tool: get_delivery_volumes_by_city
      args: {}
      expect: ["London", "Birmingham", "Dublin", "2114"]
    - tool: calculate_cost_per_drop_impact
      args: {}
      expect: ["London", "0.75", "Dublin", "40.5", "Amsterdam"]

- question: "02:16:Q5"
  story: Tracking quality fell, mostly at CAR-013 DoorStep Couriers (final scan about 5.3 hours after the attempt vs 1.9 before, 21% updated after 12 hours); standard on-time fell from 88.0% to 82.6%. 112 attempts in the last two weeks have fewer than 3 scans, most of them CAR-013 in UK North.
  checks:
    - tool: list_orders_with_missed_scans
      args: {weeks: 2}
      expect: ["CAR-013", "UK North", "actual_scans"]
    - tool: get_delivery_promise_accuracy
      args: {}
      expect: ["standard", "82.6", "88"]
    - tool: get_tracking_update_latency
      args: {}
      expect: ["CAR-013", "5.3", "1.9", "20.9"]
