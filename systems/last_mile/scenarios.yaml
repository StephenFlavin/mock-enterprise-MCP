- question: "02:16:Q1"
  story: First-attempt delivery success declined from 93% to 88% over 8 weeks. The seed data plants delivery attempts with varying success rates across couriers (CAR-001, CAR-002), regions (London, UK North, Midlands), products (various SKUs), and delivery options (door, safe_place, locker). Failure reasons include address issues (10% of attempts in early period), customer unavailability (12%), and access problems. The tools will show the trend, break down failures by dimension, identify top failure reasons (address not found, customer not available), worst postcodes (N7, L1 with higher failure rates), and the cost of repeat deliveries.
  checks:
    - tool: get_first_attempt_success_trend
      args: {weeks: 8}
      expect: ["week_start", "total_attempts", "first_attempt_success", "success_rate_pct"]
    - tool: get_first_attempt_failures_by_dimension
      args: {weeks: 8}
      expect: ["courier_id", "region", "sku", "delivery_option", "failures", "failure_rate_pct"]
    - tool: list_failed_delivery_reasons
      args: {weeks: 8}
      expect: ["failure_reason", "failure_count", "Address", "Customer"]
    - tool: get_address_validation_failure_rate
      args: {weeks: 8}
      expect: ["postcode_area", "issue_type", "validation_issues"]
    - tool: list_worst_postcodes_by_failed_delivery
      args: {weeks: 8, min_attempts: 1}
      expect: ["postcode_area", "failure_rate_pct", "address_issues", "customer_unavailable"]
    - tool: calculate_repeat_delivery_cost
      args: {weeks: 8}
      expect: ["failure_reason", "failures", "total_repeat_cost_gbp", "formula"]

- question: "02:16:Q2"
  story: "Comparing Courier A (CAR-001, rating 4.2) and Courier B (CAR-002, rating 4.5) for London volume shift. The seed data includes 6 months of performance: CAR-001 has 7 attempts with 85% first-attempt success and CAR-002 has 6 attempts with 83% success. CAR-001 has damage_reported on 1 attempt, CAR-002 on 1 attempt. Both have complaint rates around 17%. CAR-001 average cost is £3.92/drop, CAR-002 is £4.08/drop. A north London trial rule (RULE-900003) is defined. The tools will compare scorecards, costs, damage rates, complaint rates, and generate a trial plan with success criteria. Updating the rule shows postcode area modification."
  checks:
    - tool: get_courier_scorecard
      args: {}
      expect: ["CAR-001", "CAR-002", "first_attempt_success_pct", "on_time_pct", "damage_rate_pct", "complaint_rate_pct", "avg_cost_per_drop_gbp"]
    - tool: get_cost_per_drop_by_courier
      args: {}
      expect: ["CAR-001", "CAR-002", "avg_cost_gbp", "min_cost_gbp", "max_cost_gbp"]
    - tool: get_damage_rate_by_courier
      args: {}
      expect: ["CAR-001", "CAR-002", "damage_rate_pct"]
    - tool: get_complaint_rate_by_courier
      args: {}
      expect: ["CAR-001", "CAR-002", "complaint_rate_pct"]
    - tool: draft_courier_trial_plan
      args: {courier_id: "CAR-002", trial_postcode_areas: "N1,N4,N7,N15", volume_share_pct: 20.0}
      expect: ["COURIER TRIAL PLAN", "Success Criteria", "EXIT CONDITIONS", "first-attempt success", "Cost per drop", "Damage rate"]
    - tool: create_courier_allocation_rule
      args: {rule_name: "North London trial", courier_id: "CAR-002", postcode_areas: "N1,N4,N7", volume_share_pct: 20.0, region: "London"}
      expect: ["RULE-", "North London trial", "active"]
    - tool: update_courier_allocation_rule
      args: {rule_id: "RULE-900003", postcode_areas: "N1,N4", volume_share_pct: 15.0}
      expect: ["RULE-900003"]

- question: "02:16:Q3"
  story: Peak delivery performance analysis and capacity planning. The seed data includes historical attempts from August-September (2 weeks ago) simulating a peak period. CAR-001 and other couriers show on-time performance around 85% during this period. Peak capacity data shows CAR-001 has 150,000 units/month, CAR-002 has 180,000, etc. The tools will show historical peak performance trends, identify worst delivery days (early October days with higher failure volumes), and calculate regional capacity gaps comparing forecast volumes to current courier capacity.
  checks:
    - tool: get_historical_peak_delivery_performance
      args: {years_back: 2}
      expect: ["year", "week_num", "attempts", "on_time_pct", "first_attempt_success_pct"]
    - tool: list_worst_delivery_days
      args: {weeks: 12, min_attempts: 1}
      expect: ["delivery_day", "day_of_week", "total_attempts", "failure_rate_pct"]
    - tool: calculate_courier_capacity_gap_by_region
      args: {forecast_volume: 10000}
      expect: ["region", "historical_peak_attempts", "current_weekly_capacity", "capacity_gap"]

- question: "02:16:Q4"
  story: Delivery volumes by city for regulatory impact analysis. The seed data plants delivery attempts across various London postcodes (SW1, W1, N1, etc.) representing different cities/areas. Tools will aggregate volumes by city and measure first-attempt success. Cost per drop impact of rules will show cost-benefit of allocation rule changes. The rule cost impact query will calculate total delivery cost under different allocation scenarios.
  checks:
    - tool: get_delivery_volumes_by_city
      args: {country: "GB"}
      expect: ["city", "orders", "delivery_attempts", "first_attempt_success_pct"]
    - tool: calculate_cost_per_drop_impact
      args: {rule_id: "RULE-900001"}
      expect: ["rule_id", "modelled_attempts", "avg_cost_per_drop_gbp", "total_cost_gbp", "formula"]

- question: "02:16:Q5"
  story: "Where is my order" (WISMO) contact spike analysis and proactive notifications. The seed data shows orders with missed scans - attempts with has_tracking_scans < 3 (ATT-900004, ATT-900006, etc.). Delivery promise accuracy is measured showing on-time rates by service level. Tracking update latency is calculated from scan timing data. Tools identify orders with insufficient scans that would benefit from proactive alerts, showing which scans are missing when they should have occurred.
  checks:
    - tool: get_delivery_promise_accuracy
      args: {delivery_service: "standard"}
      expect: ["delivery_service", "total_attempts", "on_time", "on_time_pct"]
    - tool: get_tracking_update_latency
      args: {weeks: 4}
      expect: ["tracked_attempts", "avg_hours_to_final_update"]
    - tool: list_orders_with_missed_scans
      args: {weeks: 12, min_expected_scans: 3}
      expect: ["order_id", "attempt_id", "courier_id", "actual_scans", "status"]
