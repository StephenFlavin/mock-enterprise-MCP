id: last_mile
name: Last-Mile Delivery Platform
instructions: >
  Customer order delivery tracking, courier performance and allocation. Track
  delivery attempts, first-attempt success, courier scorecards and capacity
  planning. Order ids look like ORD-2026-0123456. Parcel couriers are CAR-011 SwiftParcel,
  CAR-012 ParcelPoint Express, CAR-013 DoorStep Couriers, CAR-014 ContinentalPost. Rule ids look like RULE-900001.

tables:
  delivery_attempts:
    key: attempt_id
    cols:
      attempt_id: {type: str, desc: "Delivery attempt, e.g. ATT-000001"}
      order_id: {type: str, desc: "Customer order"}
      courier_id: {type: str, desc: "Parcel courier, e.g. CAR-011"}
      sku: {type: str, desc: "Main SKU in order"}
      postcode_area: {type: str, desc: "Postcode area: UK outward area such as N7 or M4, or EU code such as IE-D01"}
      city: {type: str, desc: "Delivery city, e.g. London, Manchester, Dublin"}
      country: {type: str, desc: "ISO country code of the delivery address, e.g. GB, IE, DE, NL"}
      region: {type: str, desc: "Delivery region: London, UK North, UK South, UK Midlands, Scotland, Ireland, Netherlands, Germany"}
      delivery_service: {type: enum, values: [standard, next_day, same_day], desc: "Delivery service promised"}
      delivery_option: {type: enum, values: [door, safe_place, locker, collect_point], desc: "Delivery option"}
      attempt_number: {type: int, desc: "1st, 2nd, etc."}
      promised_delivery_date: {type: date, desc: "Promised delivery date"}
      actual_delivery_date: {type: date, desc: "Actual delivery date (or null if failed)"}
      attempt_time: {type: timestamp, desc: "When delivery was attempted"}
      delivery_time: {type: timestamp, desc: "When successfully delivered"}
      status: {type: enum, values: [delivered, failed], desc: "Delivery outcome of this attempt"}
      failure_reason: {type: str, desc: "Why delivery failed"}
      address_issue: {type: bool, desc: "Address quality caused failure"}
      customer_availability: {type: bool, desc: "Customer not home/unavailable"}
      damage_reported: {type: bool, desc: "Damage reported after delivery"}
      complaint_raised: {type: bool, desc: "Customer complaint raised"}
      has_tracking_scans: {type: int, desc: "Number of tracking scans recorded (3 expected per attempt)"}
      cost_gbp: {type: float, desc: "Courier cost of this attempt (cost per drop), GBP"}
      updated_at: {type: timestamp, desc: "Last updated"}

  couriers:
    key: courier_id
    cols:
      courier_id: {type: str, desc: "Parcel courier, e.g. CAR-011 (master carrier id)"}
      name: {type: str, desc: "Courier company name"}
      mode: {type: enum, values: [road, parcel], desc: "Transport mode"}
      scope: {type: str, desc: "Coverage, e.g. UK domestic"}
      region: {type: str, desc: "Primary region"}
      peak_capacity_units_month: {type: int, desc: "Peak season monthly capacity"}
      rating: {type: float, desc: "Public rating (0-5)"}
      contract_end: {type: date, desc: "Current contract end date"}

  courier_allocation_rules:
    key: rule_id
    cols:
      rule_id: {type: str, desc: "Allocation rule, e.g. RULE-001"}
      rule_name: {type: str, desc: "Human-readable rule name"}
      courier_id: {type: str, desc: "Parcel courier, e.g. CAR-011"}
      postcode_areas: {type: str, desc: "Comma-separated postcode areas"}
      volume_share_pct: {type: float, desc: "Percentage of volume for this courier"}
      region: {type: str, desc: "Region this rule applies to"}
      status: {type: enum, values: [active, trial, archived], desc: "Rule status"}
      created_at: {type: timestamp, desc: "When rule was created"}
      updated_at: {type: timestamp, desc: "When rule was last changed"}
      trial_end_date: {type: date, desc: "Trial end date if status=trial"}

  delivery_scans:
    key: [attempt_id, scan_number]
    cols:
      attempt_id: {type: str, desc: "Delivery attempt"}
      scan_number: {type: int, desc: "Sequence of scans"}
      scanned_at: {type: timestamp, desc: "When scan was recorded"}
      location: {type: str, desc: "Scan location description"}
      event: {type: str, desc: "Event description, e.g. Out for delivery"}

  address_validation_issues:
    key: issue_id
    cols:
      issue_id: {type: str, desc: "Issue record, e.g. AVI-000001"}
      order_id: {type: str, desc: "Customer order"}
      postcode_area: {type: str, desc: "Postcode area"}
      issue_type: {type: enum, values: [no_match, partial_match, invalid_postcode, ambiguous, undeliverable], desc: "Type of validation issue"}
      validation_timestamp: {type: timestamp, desc: "When validation occurred"}
      resolved: {type: bool, desc: "Whether issue was resolved"}

  delivery_complaints:
    key: complaint_id
    cols:
      complaint_id: {type: str, desc: "Complaint record, e.g. CMPLT-000001"}
      order_id: {type: str, desc: "Customer order"}
      courier_id: {type: str, desc: "Parcel courier, e.g. CAR-011"}
      complaint_date: {type: timestamp, desc: "When complaint was raised"}
      issue_type: {type: str, desc: "Type of complaint"}
      resolved: {type: bool, desc: "Whether resolved"}


  courier_region_capacity:
    key: [courier_id, region]
    cols:
      courier_id: {type: str, desc: "Parcel courier, e.g. CAR-011"}
      region: {type: str, desc: "Region: London, UK North, UK South, UK Midlands, Scotland"}
      peak_weekly_capacity: {type: int, desc: "Parcels per week the courier can handle in this region in peak"}

  daily_performance:
    key: [perf_date, courier_id, region]
    cols:
      perf_date: {type: date, desc: "Delivery day"}
      courier_id: {type: str, desc: "Parcel courier, e.g. CAR-011"}
      region: {type: str, desc: "Region: London, UK North, UK South, UK Midlands, Scotland"}
      parcels: {type: int, desc: "Parcels due for delivery that day"}
      delivered_on_time: {type: int, desc: "Parcels delivered by the promised date"}
      delivered_late: {type: int, desc: "Parcels delivered after the promised date"}
      failed_first_attempt: {type: int, desc: "Parcels whose first attempt failed"}
      peak_season: {type: enum, values: [last_peak, prior_peak], desc: "last_peak = most recent Nov-Dec peak; prior_peak = the one before"}

  city_delivery_rules:
    key: rule_id
    cols:
      rule_id: {type: str, desc: "City rule, e.g. CDR-001"}
      city: {type: str, desc: "City the rule applies to, e.g. London"}
      country: {type: str, desc: "ISO country code, e.g. GB, IE, DE, NL"}
      rule_type: {type: enum, values: [low_emission_zone, parking, delivery_window, congestion_charge], desc: "Kind of regulation"}
      description: {type: text, desc: "What the rule requires"}
      effective_date: {type: date, desc: "When the rule starts to apply"}
      extra_cost_per_drop_gbp: {type: float, desc: "Estimated added cost per drop in GBP"}
      status: {type: enum, values: [in_force, announced, consultation], desc: "Stage of the rule"}

tools:
  - name: get_first_attempt_success_trend
    desc: First-attempt delivery success rate by week, newest first, with failure counts by cause. Use to see when and how fast success changed.
    kind: sql
    args:
      weeks: {type: int, default: 8, desc: "Number of weeks to show"}
      courier_id: {desc: "Limit to one courier (optional)"}
      region: {desc: "Limit to one region (optional)"}
    sql: |
      WITH b AS (
        SELECT d.*, CAST(date_diff('week', date_trunc('week', d.attempt_time), date_trunc('week', CAST($as_of AS TIMESTAMP))) AS INT) - 1 AS wk
        FROM delivery_attempts d
        WHERE d.attempt_number = 1
          AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($courier_id IS NULL OR d.courier_id = $courier_id)
          AND ($region IS NULL OR d.region = $region)
      )
      SELECT
        CAST(date_trunc('week', CAST($as_of AS TIMESTAMP)) AS DATE) - 7 * (wk + 1) AS week_starting,
        COUNT(*) AS first_attempts,
        COUNT(*) FILTER (WHERE status = 'delivered') AS first_attempt_successes,
        ROUND(100.0 * COUNT(*) FILTER (WHERE status = 'delivered') / COUNT(*), 1) AS success_rate_pct,
        COUNT(*) FILTER (WHERE address_issue) AS failed_address,
        COUNT(*) FILTER (WHERE customer_availability) AS failed_customer_unavailable,
        COUNT(*) FILTER (WHERE status = 'failed' AND NOT address_issue AND NOT customer_availability) AS failed_other
      FROM b
      WHERE wk < $weeks
      GROUP BY wk
      ORDER BY wk
    limit: 26
    example: {}

  - name: get_first_attempt_failures_by_dimension
    desc: First-attempt success for the latest weeks versus the weeks before, by courier, region, product or delivery option. Biggest increase in failures first - shows what changed.
    kind: sql
    args:
      dimension: {type: enum, values: [courier, region, product, delivery_option], required: true, desc: "What to break down by"}
      weeks: {type: int, default: 4, desc: "Length of the recent period; compared with the same number of weeks before it"}
      courier_id: {desc: "Limit to one courier (optional)"}
      region: {desc: "Limit to one region (optional)"}
      min_attempts: {type: int, default: 30, desc: "Hide values with fewer first attempts in the recent period"}
    sql: |
      WITH b AS (
        SELECT d.*, CAST(date_diff('week', date_trunc('week', d.attempt_time), date_trunc('week', CAST($as_of AS TIMESTAMP))) AS INT) - 1 AS wk,
          CASE $dimension WHEN 'courier' THEN d.courier_id WHEN 'region' THEN d.region
               WHEN 'product' THEN d.sku ELSE d.delivery_option END AS dim_value
        FROM delivery_attempts d
        WHERE d.attempt_number = 1
          AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($courier_id IS NULL OR d.courier_id = $courier_id)
          AND ($region IS NULL OR d.region = $region)
      ), agg AS (
        SELECT dim_value,
          COUNT(*) FILTER (WHERE wk < $weeks) AS attempts_recent,
          COUNT(*) FILTER (WHERE wk < $weeks AND status = 'failed') AS failures_recent,
          COUNT(*) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks) AS attempts_before,
          COUNT(*) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks AND status = 'failed') AS failures_before,
          COUNT(*) FILTER (WHERE wk < $weeks AND address_issue) AS address_failures_recent,
          COUNT(*) FILTER (WHERE wk < $weeks AND customer_availability) AS customer_failures_recent
        FROM b GROUP BY dim_value
      )
      SELECT
        a.dim_value AS value,
        CASE $dimension WHEN 'courier' THEN c.name WHEN 'product' THEN p.name ELSE NULL END AS name,
        a.attempts_recent AS first_attempts_recent,
        ROUND(100.0 * (a.attempts_recent - a.failures_recent) / a.attempts_recent, 1) AS success_pct_recent,
        a.attempts_before AS first_attempts_before,
        ROUND(100.0 * (a.attempts_before - a.failures_before) / NULLIF(a.attempts_before, 0), 1) AS success_pct_before,
        ROUND(100.0 * (a.attempts_recent - a.failures_recent) / a.attempts_recent
              - 100.0 * (a.attempts_before - a.failures_before) / NULLIF(a.attempts_before, 0), 1) AS change_pts,
        a.failures_recent, a.failures_before,
        a.failures_recent - a.failures_before AS extra_failures,
        a.address_failures_recent, a.customer_failures_recent
      FROM agg a
      LEFT JOIN couriers c ON $dimension = 'courier' AND c.courier_id = a.dim_value
      LEFT JOIN master.products p ON $dimension = 'product' AND p.sku = a.dim_value
      WHERE a.attempts_recent >= $min_attempts
      ORDER BY extra_failures DESC, change_pts ASC NULLS LAST
    limit: 30
    example: {dimension: courier}

  - name: list_failed_delivery_reasons
    desc: Reasons for failed first delivery attempts in the latest weeks versus the weeks before, with address and customer flags. Use to diagnose a success drop.
    kind: sql
    args:
      weeks: {type: int, default: 4, desc: "Length of the recent period; compared with the same number of weeks before it"}
      courier_id: {desc: "Limit to one courier (optional)"}
      region: {desc: "Limit to one region (optional)"}
    sql: |
      WITH b AS (
        SELECT d.*, CAST(date_diff('week', date_trunc('week', d.attempt_time), date_trunc('week', CAST($as_of AS TIMESTAMP))) AS INT) - 1 AS wk
        FROM delivery_attempts d
        WHERE d.attempt_number = 1 AND d.status = 'failed'
          AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($courier_id IS NULL OR d.courier_id = $courier_id)
          AND ($region IS NULL OR d.region = $region)
      )
      SELECT
        failure_reason,
        COUNT(*) FILTER (WHERE wk < $weeks) AS failures_recent,
        ROUND(100.0 * COUNT(*) FILTER (WHERE wk < $weeks) / NULLIF(SUM(COUNT(*) FILTER (WHERE wk < $weeks)) OVER (), 0), 1) AS pct_of_failures_recent,
        COUNT(*) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks) AS failures_before,
        COUNT(*) FILTER (WHERE wk < $weeks) - COUNT(*) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks) AS change,
        COUNT(*) FILTER (WHERE wk < $weeks AND address_issue) AS address_related_recent,
        COUNT(*) FILTER (WHERE wk < $weeks AND customer_availability) AS customer_related_recent
      FROM b
      WHERE wk < 2 * $weeks
      GROUP BY failure_reason
      ORDER BY failures_recent DESC
    limit: 20
    example: {}

  - name: get_address_validation_failure_rate
    desc: Share of orders with an address validation issue by postcode area, recent weeks versus the weeks before, with the main issue type.
    kind: sql
    args:
      postcode_area: {desc: "Limit to one postcode area, e.g. M4 (optional)"}
      weeks: {type: int, default: 4, desc: "Length of the recent period; compared with the same number of weeks before it"}
      min_orders: {type: int, default: 20, desc: "Hide postcode areas with fewer orders in the recent period"}
    sql: |
      WITH o AS (
        SELECT d.order_id, d.postcode_area,
          CAST(date_diff('week', date_trunc('week', d.attempt_time), date_trunc('week', CAST($as_of AS TIMESTAMP))) AS INT) - 1 AS wk
        FROM delivery_attempts d
        WHERE d.attempt_number = 1 AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($postcode_area IS NULL OR d.postcode_area = $postcode_area)
      ), j AS (
        SELECT o.postcode_area, o.wk, o.order_id, a.issue_id, a.issue_type, a.resolved
        FROM o LEFT JOIN address_validation_issues a ON a.order_id = o.order_id
      )
      SELECT
        postcode_area,
        COUNT(DISTINCT order_id) FILTER (WHERE wk < $weeks) AS orders_recent,
        COUNT(DISTINCT issue_id) FILTER (WHERE wk < $weeks) AS validation_issues_recent,
        ROUND(100.0 * COUNT(DISTINCT issue_id) FILTER (WHERE wk < $weeks) / NULLIF(COUNT(DISTINCT order_id) FILTER (WHERE wk < $weeks), 0), 1) AS issue_rate_pct_recent,
        ROUND(100.0 * COUNT(DISTINCT issue_id) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks) / NULLIF(COUNT(DISTINCT order_id) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks), 0), 1) AS issue_rate_pct_before,
        mode(issue_type) FILTER (WHERE wk < $weeks) AS main_issue_type,
        COUNT(DISTINCT issue_id) FILTER (WHERE wk < $weeks AND NOT resolved) AS unresolved_recent
      FROM j
      WHERE wk < 2 * $weeks
      GROUP BY postcode_area
      HAVING COUNT(DISTINCT order_id) FILTER (WHERE wk < $weeks) >= $min_orders
      ORDER BY issue_rate_pct_recent DESC
    limit: 20
    example: {}

  - name: list_worst_postcodes_by_failed_delivery
    desc: Postcode areas with the highest first-attempt failure rate in the latest weeks, versus the weeks before, with address, customer and courier causes.
    kind: sql
    args:
      weeks: {type: int, default: 4, desc: "Length of the recent period; compared with the same number of weeks before it"}
      min_attempts: {type: int, default: 20, desc: "Only areas with at least this many first attempts in the recent period"}
      region: {desc: "Limit to one region (optional)"}
      courier_id: {desc: "Limit to one courier (optional)"}
    sql: |
      WITH b AS (
        SELECT d.*, CAST(date_diff('week', date_trunc('week', d.attempt_time), date_trunc('week', CAST($as_of AS TIMESTAMP))) AS INT) - 1 AS wk
        FROM delivery_attempts d
        WHERE d.attempt_number = 1 AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($region IS NULL OR d.region = $region)
          AND ($courier_id IS NULL OR d.courier_id = $courier_id)
      )
      SELECT
        postcode_area,
        ANY_VALUE(city) AS city,
        ANY_VALUE(region) AS region,
        COUNT(*) FILTER (WHERE wk < $weeks) AS first_attempts_recent,
        COUNT(*) FILTER (WHERE wk < $weeks AND status = 'failed') AS failures_recent,
        ROUND(100.0 * COUNT(*) FILTER (WHERE wk < $weeks AND status = 'failed') / COUNT(*) FILTER (WHERE wk < $weeks), 1) AS failure_rate_pct_recent,
        ROUND(100.0 * COUNT(*) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks AND status = 'failed') / NULLIF(COUNT(*) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks), 0), 1) AS failure_rate_pct_before,
        COUNT(*) FILTER (WHERE wk < $weeks AND address_issue) AS address_failures,
        COUNT(*) FILTER (WHERE wk < $weeks AND customer_availability) AS customer_unavailable_failures,
        COUNT(*) FILTER (WHERE wk < $weeks AND status = 'failed' AND NOT address_issue AND NOT customer_availability) AS other_failures
      FROM b
      WHERE wk < 2 * $weeks
      GROUP BY postcode_area
      HAVING COUNT(*) FILTER (WHERE wk < $weeks) >= $min_attempts
      ORDER BY failure_rate_pct_recent DESC, failures_recent DESC
    limit: 15
    example: {}

  - name: calculate_repeat_delivery_cost
    desc: Repeat-delivery and extra-contact cost of first-attempt failures by cause, with the annual saving if each cause were fixed. Rank causes by saving.
    kind: sql
    args:
      weeks: {type: int, default: 4, desc: "Weeks of failures to analyse"}
      contacts_per_failure: {type: float, default: 0.5, desc: "Customer contacts generated per failed delivery"}
      cost_per_contact_gbp: {type: float, default: 4.0, desc: "Cost of handling one customer contact, GBP"}
    sql: |
      WITH f AS (
        SELECT d.failure_reason, COUNT(*) AS failures, AVG(d.cost_gbp) AS avg_cost
        FROM delivery_attempts d
        WHERE d.attempt_number = 1 AND d.status = 'failed'
          AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND d.attempt_time >= date_trunc('week', CAST($as_of AS TIMESTAMP)) - INTERVAL ($weeks * 7) DAY
        GROUP BY d.failure_reason
      ), c AS (
        SELECT failure_reason, failures, avg_cost,
          failures * avg_cost AS repeat_cost,
          failures * $contacts_per_failure AS contacts,
          failures * $contacts_per_failure * $cost_per_contact_gbp AS contact_cost
        FROM f
      )
      SELECT
        failure_reason,
        failures,
        ROUND(avg_cost, 2) AS avg_cost_per_drop_gbp,
        ROUND(repeat_cost, 2) AS repeat_delivery_cost_gbp,
        ROUND(contacts, 0) AS extra_contacts,
        ROUND(contact_cost, 2) AS contact_cost_gbp,
        ROUND(repeat_cost + contact_cost, 2) AS total_cost_gbp,
        ROUND((repeat_cost + contact_cost) * 52.0 / $weeks, 0) AS annual_saving_if_fixed_gbp,
        ROUND(SUM((repeat_cost + contact_cost) * 52.0 / $weeks) OVER (ORDER BY repeat_cost + contact_cost DESC), 0) AS cumulative_annual_saving_gbp,
        'total_cost = failures * avg_cost_per_drop + failures * contacts_per_failure * cost_per_contact; annual = total * 52 / weeks' AS formula
      FROM c
      ORDER BY total_cost_gbp DESC
    limit: 20
    example: {}

  - name: get_courier_scorecard
    desc: Courier scorecard over recent months - first-attempt success, on-time, damage and complaint rates, cost per drop. Filter by region for a like-for-like comparison.
    kind: sql
    args:
      courier_id: {desc: "Limit to one courier (optional)"}
      region: {desc: "Limit to one region, e.g. London (optional)"}
      months: {type: int, default: 6, desc: "Months of history"}
    sql: |
      SELECT
        d.courier_id,
        c.name AS courier_name,
        COUNT(*) FILTER (WHERE d.status = 'delivered') AS deliveries,
        ROUND(100.0 * COUNT(*) FILTER (WHERE d.attempt_number = 1 AND d.status = 'delivered') / NULLIF(COUNT(*) FILTER (WHERE d.attempt_number = 1), 0), 1) AS first_attempt_success_pct,
        ROUND(100.0 * COUNT(*) FILTER (WHERE d.status = 'delivered' AND d.actual_delivery_date <= d.promised_delivery_date) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 1) AS on_time_pct,
        ROUND(100.0 * COUNT(*) FILTER (WHERE d.damage_reported) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 2) AS damage_rate_pct,
        ROUND(100.0 * COUNT(*) FILTER (WHERE d.complaint_raised) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 2) AS complaint_rate_pct,
        ROUND(AVG(d.cost_gbp) FILTER (WHERE d.status = 'delivered'), 2) AS avg_cost_per_drop_gbp
      FROM delivery_attempts d
      LEFT JOIN couriers c ON d.courier_id = c.courier_id
      WHERE d.attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL ($months * 30) DAY
        AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
        AND ($courier_id IS NULL OR d.courier_id = $courier_id)
        AND ($region IS NULL OR d.region = $region)
      GROUP BY d.courier_id, c.name
      ORDER BY d.courier_id
    limit: 20
    example: {region: London}

  - name: get_cost_per_drop_by_courier
    desc: Average cost per delivered drop by courier over recent months, plus cost including failed attempts. Filter by region.
    kind: sql
    args:
      courier_id: {desc: "Limit to one courier (optional)"}
      region: {desc: "Limit to one region, e.g. London (optional)"}
      months: {type: int, default: 6, desc: "Months of history"}
    sql: |
      SELECT
        d.courier_id,
        c.name AS courier_name,
        COUNT(*) FILTER (WHERE d.status = 'delivered') AS deliveries,
        ROUND(AVG(d.cost_gbp) FILTER (WHERE d.status = 'delivered'), 2) AS avg_cost_per_drop_gbp,
        ROUND(MIN(d.cost_gbp) FILTER (WHERE d.status = 'delivered'), 2) AS min_cost_gbp,
        ROUND(MAX(d.cost_gbp) FILTER (WHERE d.status = 'delivered'), 2) AS max_cost_gbp,
        ROUND(SUM(d.cost_gbp) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 2) AS cost_per_delivery_incl_failed_attempts_gbp,
        ROUND(SUM(d.cost_gbp), 0) AS total_cost_gbp
      FROM delivery_attempts d
      LEFT JOIN couriers c ON d.courier_id = c.courier_id
      WHERE d.attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL ($months * 30) DAY
        AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
        AND ($courier_id IS NULL OR d.courier_id = $courier_id)
        AND ($region IS NULL OR d.region = $region)
      GROUP BY d.courier_id, c.name
      ORDER BY avg_cost_per_drop_gbp ASC
    limit: 20
    example: {region: London}

  - name: get_damage_rate_by_courier
    desc: Share of delivered parcels reported damaged, by courier over recent months. Filter by region.
    kind: sql
    args:
      courier_id: {desc: "Limit to one courier (optional)"}
      region: {desc: "Limit to one region, e.g. London (optional)"}
      months: {type: int, default: 6, desc: "Months of history"}
    sql: |
      SELECT
        d.courier_id,
        c.name AS courier_name,
        COUNT(*) FILTER (WHERE d.status = 'delivered') AS deliveries,
        COUNT(*) FILTER (WHERE d.damage_reported) AS damaged_parcels,
        ROUND(100.0 * COUNT(*) FILTER (WHERE d.damage_reported) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 2) AS damage_rate_pct
      FROM delivery_attempts d
      LEFT JOIN couriers c ON d.courier_id = c.courier_id
      WHERE d.attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL ($months * 30) DAY
        AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
        AND ($courier_id IS NULL OR d.courier_id = $courier_id)
        AND ($region IS NULL OR d.region = $region)
      GROUP BY d.courier_id, c.name
      ORDER BY damage_rate_pct DESC
    limit: 20
    example: {region: London}

  - name: get_complaint_rate_by_courier
    desc: Customer complaints per 100 delivered parcels by courier over recent months, with the main complaint type. Filter by region.
    kind: sql
    args:
      courier_id: {desc: "Limit to one courier (optional)"}
      region: {desc: "Limit to one region, e.g. London (optional)"}
      months: {type: int, default: 6, desc: "Months of history"}
    sql: |
      SELECT
        d.courier_id,
        c.name AS courier_name,
        COUNT(*) FILTER (WHERE d.status = 'delivered') AS deliveries,
        COUNT(*) FILTER (WHERE d.complaint_raised) AS complaints,
        ROUND(100.0 * COUNT(*) FILTER (WHERE d.complaint_raised) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 2) AS complaint_rate_pct,
        mode(m.issue_type) AS main_complaint_type
      FROM delivery_attempts d
      LEFT JOIN couriers c ON d.courier_id = c.courier_id
      LEFT JOIN delivery_complaints m ON m.order_id = d.order_id AND m.courier_id = d.courier_id AND d.complaint_raised
      WHERE d.attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL ($months * 30) DAY
        AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
        AND ($courier_id IS NULL OR d.courier_id = $courier_id)
        AND ($region IS NULL OR d.region = $region)
      GROUP BY d.courier_id, c.name
      ORDER BY complaint_rate_pct DESC
    limit: 20
    example: {region: London}

  - name: get_delivery_volumes_by_city
    desc: Delivery volumes, cost per drop and first-attempt success by UK and EU city, largest first. Use for regulatory impact planning.
    kind: sql
    args:
      country: {desc: "ISO country code, e.g. GB, IE, DE, NL (optional)"}
      months: {type: int, default: 6, desc: "Months of history"}
    sql: |
      SELECT
        d.city,
        d.country,
        COUNT(DISTINCT d.order_id) AS orders,
        ROUND(100.0 * COUNT(DISTINCT d.order_id) / SUM(COUNT(DISTINCT d.order_id)) OVER (), 1) AS share_of_orders_pct,
        COUNT(*) FILTER (WHERE d.status = 'delivered') AS drops,
        ROUND(AVG(d.cost_gbp) FILTER (WHERE d.status = 'delivered'), 2) AS avg_cost_per_drop_gbp,
        ROUND(100.0 * COUNT(*) FILTER (WHERE d.attempt_number = 1 AND d.status = 'delivered') / NULLIF(COUNT(*) FILTER (WHERE d.attempt_number = 1), 0), 1) AS first_attempt_success_pct
      FROM delivery_attempts d
      WHERE d.attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL ($months * 30) DAY
        AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
        AND ($country IS NULL OR d.country = $country)
      GROUP BY d.city, d.country
      ORDER BY orders DESC
    limit: 10
    example: {}

  - name: get_delivery_promise_accuracy
    desc: Share of delivered orders arriving by the promised date, by delivery service, latest weeks versus the weeks before. Filter by courier.
    kind: sql
    args:
      delivery_service: {desc: "Limit to one service: standard, next_day or same_day (optional)"}
      courier_id: {desc: "Limit to one courier (optional)"}
      weeks: {type: int, default: 4, desc: "Length of the recent period; compared with the same number of weeks before it"}
    sql: |
      WITH b AS (
        SELECT d.*, CAST(date_diff('week', date_trunc('week', d.attempt_time), date_trunc('week', CAST($as_of AS TIMESTAMP))) AS INT) - 1 AS wk
        FROM delivery_attempts d
        WHERE d.status = 'delivered' AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($delivery_service IS NULL OR d.delivery_service = $delivery_service)
          AND ($courier_id IS NULL OR d.courier_id = $courier_id)
      )
      SELECT
        delivery_service,
        COUNT(*) FILTER (WHERE wk < $weeks) AS delivered_recent,
        COUNT(*) FILTER (WHERE wk < $weeks AND actual_delivery_date <= promised_delivery_date) AS on_time_recent,
        ROUND(100.0 * COUNT(*) FILTER (WHERE wk < $weeks AND actual_delivery_date <= promised_delivery_date) / NULLIF(COUNT(*) FILTER (WHERE wk < $weeks), 0), 1) AS on_time_pct_recent,
        ROUND(100.0 * COUNT(*) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks AND actual_delivery_date <= promised_delivery_date) / NULLIF(COUNT(*) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks), 0), 1) AS on_time_pct_before,
        ROUND(AVG(date_diff('day', promised_delivery_date, actual_delivery_date)) FILTER (WHERE wk < $weeks AND actual_delivery_date > promised_delivery_date), 1) AS avg_days_late_recent
      FROM b
      WHERE wk < 2 * $weeks
      GROUP BY delivery_service
      ORDER BY delivery_service
    limit: 10
    example: {}

  - name: get_tracking_update_latency
    desc: Average hours from delivery attempt to the final tracking scan, by courier, latest weeks versus the weeks before, with share updated late.
    kind: sql
    args:
      weeks: {type: int, default: 4, desc: "Length of the recent period; compared with the same number of weeks before it"}
      courier_id: {desc: "Limit to one courier (optional)"}
      region: {desc: "Limit to one region (optional)"}
    sql: |
      WITH fin AS (
        SELECT attempt_id, MAX(scanned_at) AS final_scan
        FROM delivery_scans
        WHERE event IN ('Delivered', 'Delivery attempted - not delivered')
        GROUP BY attempt_id
      ), b AS (
        SELECT d.courier_id, d.attempt_time, f.final_scan,
          CAST(date_diff('week', date_trunc('week', d.attempt_time), date_trunc('week', CAST($as_of AS TIMESTAMP))) AS INT) - 1 AS wk
        FROM delivery_attempts d LEFT JOIN fin f ON f.attempt_id = d.attempt_id
        WHERE d.attempt_time <= CAST($as_of AS TIMESTAMP) - INTERVAL 1 DAY
          AND ($courier_id IS NULL OR d.courier_id = $courier_id)
          AND ($region IS NULL OR d.region = $region)
      )
      SELECT
        b.courier_id,
        c.name AS courier_name,
        COUNT(*) FILTER (WHERE wk < $weeks) AS attempts_recent,
        ROUND(AVG(date_diff('minute', attempt_time, final_scan) / 60.0) FILTER (WHERE wk < $weeks), 1) AS avg_hours_to_final_scan_recent,
        ROUND(AVG(date_diff('minute', attempt_time, final_scan) / 60.0) FILTER (WHERE wk >= $weeks AND wk < 2 * $weeks), 1) AS avg_hours_to_final_scan_before,
        ROUND(100.0 * COUNT(*) FILTER (WHERE wk < $weeks AND date_diff('minute', attempt_time, final_scan) > 720) / NULLIF(COUNT(*) FILTER (WHERE wk < $weeks), 0), 1) AS pct_updated_after_12h_recent,
        ROUND(100.0 * COUNT(*) FILTER (WHERE wk < $weeks AND final_scan IS NULL) / NULLIF(COUNT(*) FILTER (WHERE wk < $weeks), 0), 1) AS pct_no_final_scan_recent
      FROM b LEFT JOIN couriers c ON c.courier_id = b.courier_id
      WHERE wk < 2 * $weeks
      GROUP BY b.courier_id, c.name
      ORDER BY avg_hours_to_final_scan_recent DESC
    limit: 10
    example: {}

  - name: list_orders_with_missed_scans
    desc: Delivery attempts with fewer tracking scans than expected, newest first. Use to find orders for proactive delay alerts.
    kind: sql
    args:
      weeks: {type: int, default: 2, desc: "Attempts from the last N full weeks"}
      min_expected_scans: {type: int, default: 3, desc: "List attempts with fewer scans than this"}
      courier_id: {desc: "Limit to one courier (optional)"}
      region: {desc: "Limit to one region (optional)"}
    sql: |
      SELECT
        d.order_id,
        d.attempt_id,
        d.courier_id,
        d.region,
        d.postcode_area,
        d.delivery_service,
        d.status,
        COUNT(ds.scan_number) AS actual_scans,
        arg_max(ds.event, ds.scan_number) AS last_scan_event,
        d.promised_delivery_date,
        d.attempt_time
      FROM delivery_attempts d
      LEFT JOIN delivery_scans ds ON d.attempt_id = ds.attempt_id
      WHERE d.attempt_time >= date_trunc('week', CAST($as_of AS TIMESTAMP)) - INTERVAL ($weeks * 7) DAY
        AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
        AND ($courier_id IS NULL OR d.courier_id = $courier_id)
        AND ($region IS NULL OR d.region = $region)
      GROUP BY d.order_id, d.attempt_id, d.courier_id, d.region, d.postcode_area, d.delivery_service, d.status,
               d.promised_delivery_date, d.attempt_time
      HAVING COUNT(ds.scan_number) < $min_expected_scans
      ORDER BY d.attempt_time DESC
    limit: 100
    example: {}

  - name: get_historical_peak_delivery_performance
    desc: On-time and first-attempt failure rates in the last two Nov-Dec peaks by region, with busiest and worst weeks. Shows capacity stress points.
    kind: sql
    args:
      peak_season: {type: enum, values: [last_peak, prior_peak], desc: "One peak only: last_peak (most recent) or prior_peak (optional)"}
      region: {desc: "Limit to one region (optional)"}
    sql: |
      WITH w AS (
        SELECT peak_season, region, date_trunc('week', perf_date) AS wk,
          SUM(parcels) AS p, SUM(delivered_on_time) AS ot, SUM(failed_first_attempt) AS f,
          MIN(perf_date) AS d0, MAX(perf_date) AS d1
        FROM daily_performance
        WHERE ($peak_season IS NULL OR peak_season = $peak_season)
          AND ($region IS NULL OR region = $region)
        GROUP BY ALL
      )
      SELECT
        peak_season, region,
        MIN(d0) AS season_start, MAX(d1) AS season_end,
        SUM(p) AS parcels,
        ROUND(100.0 * SUM(ot) / SUM(p), 1) AS on_time_pct,
        ROUND(100.0 * SUM(f) / SUM(p), 1) AS first_attempt_failure_pct,
        MAX(p) AS busiest_week_parcels,
        ROUND(100.0 * MIN(ot * 1.0 / p), 1) AS worst_week_on_time_pct,
        CAST(arg_min(wk, ot * 1.0 / p) AS DATE) AS worst_week_start
      FROM w
      GROUP BY peak_season, region
      ORDER BY peak_season DESC, on_time_pct ASC
    limit: 20
    example: {}

  - name: list_worst_delivery_days
    desc: Worst delivery days in a peak season ranked by on-time rate, with volume, failures and the most affected region.
    kind: sql
    args:
      peak_season: {type: enum, values: [last_peak, prior_peak, all], default: last_peak, desc: "Which Nov-Dec peak to rank; last_peak = most recent"}
      region: {desc: "Limit to one region (optional)"}
      min_parcels: {type: int, default: 50, desc: "Only days with at least this many parcels"}
    sql: |
      WITH r AS (
        SELECT perf_date, region, SUM(parcels) AS p, SUM(delivered_on_time) AS ot,
          SUM(delivered_late) AS late, SUM(failed_first_attempt) AS f
        FROM daily_performance
        WHERE ($peak_season = 'all' OR peak_season = $peak_season)
          AND ($region IS NULL OR region = $region)
        GROUP BY perf_date, region
      )
      SELECT
        perf_date AS delivery_day,
        dayname(perf_date) AS day_of_week,
        SUM(p) AS parcels,
        SUM(late) AS late_parcels,
        ROUND(100.0 * SUM(ot) / SUM(p), 1) AS on_time_pct,
        ROUND(100.0 * SUM(f) / SUM(p), 1) AS first_attempt_failure_pct,
        arg_min(region, ot * 1.0 / p) AS most_affected_region,
        ROUND(100.0 * MIN(ot * 1.0 / p), 1) AS most_affected_region_on_time_pct
      FROM r
      GROUP BY perf_date
      HAVING SUM(p) >= $min_parcels
      ORDER BY on_time_pct ASC, parcels DESC
    limit: 10
    example: {}

  - name: calculate_cost_per_drop_impact
    desc: Added cost per drop and annual cost of announced city rules (low-emission zones, parking, delivery windows) by city, worst first.
    kind: sql
    args:
      city: {desc: "Limit to one city, e.g. London (optional)"}
      country: {desc: "ISO country code, e.g. GB, IE, DE, NL (optional)"}
      months_ahead: {type: int, default: 12, desc: "Include rules taking effect within this many months"}
    sql: |
      WITH vol AS (
        SELECT city, country, COUNT(*) FILTER (WHERE status = 'delivered') AS drops_6m,
               AVG(cost_gbp) FILTER (WHERE status = 'delivered') AS base_cost
        FROM delivery_attempts
        WHERE attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL 182 DAY AND attempt_time <= CAST($as_of AS TIMESTAMP)
        GROUP BY city, country
      ), r AS (
        SELECT city, COUNT(*) AS rules, SUM(extra_cost_per_drop_gbp) AS extra,
          string_agg(rule_type || ' from ' || CAST(effective_date AS VARCHAR), '; ' ORDER BY effective_date) AS rule_list
        FROM city_delivery_rules
        WHERE effective_date <= CAST($as_of AS DATE) + CAST($months_ahead * 30 AS INT)
          AND status <> 'in_force'
        GROUP BY city
      )
      SELECT
        v.city, v.country,
        v.drops_6m * 2 AS annual_drops,
        ROUND(v.base_cost, 2) AS current_cost_per_drop_gbp,
        r.rules AS new_rules,
        r.rule_list AS rules,
        ROUND(r.extra, 2) AS extra_cost_per_drop_gbp,
        ROUND(v.base_cost + r.extra, 2) AS new_cost_per_drop_gbp,
        ROUND(100.0 * r.extra / v.base_cost, 1) AS uplift_pct,
        ROUND(v.drops_6m * 2 * r.extra, 0) AS annual_cost_impact_gbp,
        'annual impact = annual_drops * sum of extra cost per drop of rules starting within the window' AS formula
      FROM vol v JOIN r ON lower(r.city) = lower(v.city)
      WHERE ($city IS NULL OR lower(v.city) = lower($city))
        AND ($country IS NULL OR v.country = $country)
      ORDER BY annual_cost_impact_gbp DESC
    limit: 15
    example: {}

  - name: calculate_courier_capacity_gap_by_region
    desc: Compares forecast peak weekly parcels per region (last peak's busiest week plus growth) with courier capacity, showing the shortfall and extra capacity needed.
    kind: sql
    args:
      growth_pct: {type: float, default: 12, desc: "Expected growth in peak volume over the last peak, percent"}
      buffer_pct: {type: float, default: 10, desc: "Safety buffer on forecast volume, percent"}
      peak_season: {type: enum, values: [last_peak, prior_peak], default: last_peak, desc: "Peak whose busiest week is the base"}
      region: {desc: "Limit to one region (optional)"}
    sql: |
      WITH w AS (
        SELECT region, date_trunc('week', perf_date) AS wk, SUM(parcels) AS p, SUM(delivered_on_time) AS ot
        FROM daily_performance
        WHERE peak_season = $peak_season AND ($region IS NULL OR region = $region)
        GROUP BY ALL
      ), pk AS (
        SELECT region, MAX(p) AS busiest_week, ROUND(100.0 * SUM(ot) / SUM(p), 1) AS season_on_time_pct
        FROM w GROUP BY region
      ), cap AS (
        SELECT region, SUM(peak_weekly_capacity) AS capacity FROM courier_region_capacity GROUP BY region
      )
      SELECT
        pk.region,
        pk.busiest_week AS last_peak_busiest_week_parcels,
        pk.season_on_time_pct AS last_peak_on_time_pct,
        CAST(ROUND(pk.busiest_week * (1 + $growth_pct / 100.0), 0) AS INT) AS forecast_peak_week_parcels,
        cap.capacity AS current_weekly_capacity,
        CAST(ROUND(pk.busiest_week * (1 + $growth_pct / 100.0) * (1 + $buffer_pct / 100.0), 0) AS INT) AS capacity_needed_with_buffer,
        CAST(ROUND(pk.busiest_week * (1 + $growth_pct / 100.0) - cap.capacity, 0) AS INT) AS shortfall_vs_forecast,
        GREATEST(CAST(ROUND(pk.busiest_week * (1 + $growth_pct / 100.0) * (1 + $buffer_pct / 100.0) - cap.capacity, 0) AS INT), 0) AS extra_capacity_needed,
        ROUND(100.0 * pk.busiest_week * (1 + $growth_pct / 100.0) / cap.capacity, 0) AS utilisation_pct,
        'needed = busiest_week * (1 + growth) * (1 + buffer); extra = needed - capacity' AS formula
      FROM pk JOIN cap ON cap.region = pk.region
      ORDER BY extra_capacity_needed DESC
    limit: 10
    example: {}

  - name: create_courier_allocation_rule
    desc: Create a courier allocation rule giving a courier a share of volume in given postcode areas. Defaults to a trial rule ending in six weeks.
    kind: insert
    table: courier_allocation_rules
    id_prefix: RULE-
    args:
      rule_name: {required: true, desc: "Name for the rule, e.g. London trial"}
      courier_id: {required: true, desc: "Courier to give the volume to, e.g. CAR-012"}
      postcode_areas: {required: true, desc: "Comma-separated postcode areas, e.g. N1,N4,N7"}
      volume_share_pct: {required: true, type: float, desc: "Percentage of the areas' volume moved to this courier"}
      region: {required: true, desc: "Region the rule applies to, e.g. London"}
      status: {type: enum, values: [active, trial], default: trial, desc: "Rule status"}
      trial_end_date: {type: date, default: "+42d", desc: "Trial end date (six weeks by default)"}
    example: {rule_name: "North London trial", courier_id: "CAR-012", postcode_areas: "N1,N4,N7", volume_share_pct: 20.0, region: "London"}

  - name: update_courier_allocation_rule
    desc: Change the volume share, postcode areas, status or end date of an existing allocation rule, for example to narrow a trial.
    kind: update
    table: courier_allocation_rules
    args:
      volume_share_pct: {type: float, desc: "New percentage of volume"}
      postcode_areas: {desc: "New postcode areas, comma-separated"}
      status: {type: enum, values: [active, trial, archived], desc: "New rule status"}
      trial_end_date: {type: date, desc: "New trial end date"}
    example: {rule_id: "RULE-900004", postcode_areas: "N1,N4", volume_share_pct: 15.0}

  - name: draft_courier_trial_plan
    desc: Draft a six-week courier trial plan with baseline, success criteria and exit conditions, based on current performance in the trial area.
    kind: draft
    args:
      courier_id: {required: true, desc: "Courier to trial, e.g. CAR-012"}
      volume_share_pct: {required: true, type: float, desc: "Percentage of the area's volume to move to the trial courier"}
      region: {default: London, desc: "Region for the trial"}
      trial_postcode_areas: {desc: "Comma-separated postcode areas for the trial; all areas in the region if blank"}
    sql:
      trial: |
        SELECT c.name, c.rating, COUNT(*) FILTER (WHERE d.status = 'delivered') AS deliveries,
          ROUND(100.0 * COUNT(*) FILTER (WHERE d.status = 'delivered' AND d.actual_delivery_date <= d.promised_delivery_date) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 1) AS on_time,
          ROUND(100.0 * COUNT(*) FILTER (WHERE d.damage_reported) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 2) AS damage,
          ROUND(100.0 * COUNT(*) FILTER (WHERE d.complaint_raised) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 2) AS complaints,
          ROUND(AVG(d.cost_gbp) FILTER (WHERE d.status = 'delivered'), 2) AS cost
        FROM couriers c LEFT JOIN delivery_attempts d ON d.courier_id = c.courier_id AND d.region = $region
          AND d.attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL 182 DAY AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($trial_postcode_areas IS NULL OR list_contains(string_split(replace($trial_postcode_areas, ' ', ''), ','), d.postcode_area))
        WHERE c.courier_id = $courier_id
        GROUP BY c.name, c.rating
      others: |
        SELECT COUNT(*) FILTER (WHERE d.status = 'delivered') AS deliveries,
          ROUND(100.0 * COUNT(*) FILTER (WHERE d.status = 'delivered' AND d.actual_delivery_date <= d.promised_delivery_date) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 1) AS on_time,
          ROUND(100.0 * COUNT(*) FILTER (WHERE d.damage_reported) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 2) AS damage,
          ROUND(100.0 * COUNT(*) FILTER (WHERE d.complaint_raised) / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 2) AS complaints,
          ROUND(AVG(d.cost_gbp) FILTER (WHERE d.status = 'delivered'), 2) AS cost
        FROM delivery_attempts d
        WHERE d.courier_id <> $courier_id AND d.region = $region
          AND d.attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL 182 DAY AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($trial_postcode_areas IS NULL OR list_contains(string_split(replace($trial_postcode_areas, ' ', ''), ','), d.postcode_area))
      volume: |
        SELECT ROUND(COUNT(*) FILTER (WHERE d.status = 'delivered') / 4.0, 0) AS weekly_drops
        FROM delivery_attempts d
        WHERE d.region = $region
          AND d.attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL 28 DAY AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($trial_postcode_areas IS NULL OR list_contains(string_split(replace($trial_postcode_areas, ' ', ''), ','), d.postcode_area))
      areas: |
        SELECT d.postcode_area, COUNT(*) FILTER (WHERE d.status = 'delivered') AS drops,
          ROUND(100.0 * COUNT(*) FILTER (WHERE d.courier_id = $courier_id AND d.status = 'delivered') / NULLIF(COUNT(*) FILTER (WHERE d.status = 'delivered'), 0), 0) AS trial_courier_share_pct
        FROM delivery_attempts d
        WHERE d.region = $region
          AND d.attempt_time > CAST($as_of AS TIMESTAMP) - INTERVAL 182 DAY AND d.attempt_time <= CAST($as_of AS TIMESTAMP)
          AND ($trial_postcode_areas IS NULL OR list_contains(string_split(replace($trial_postcode_areas, ' ', ''), ','), d.postcode_area))
        GROUP BY d.postcode_area ORDER BY drops DESC
    template: |
      COURIER TRIAL PLAN - {{ trial[0].name }} ({{ courier_id }}), rating {{ trial[0].rating }}/5
      Region: {{ region }}. Areas: {% if trial_postcode_areas %}{{ trial_postcode_areas }}{% else %}all areas in the region{% endif %}. Duration: 6 weeks. Volume moved: {{ volume_share_pct }}% of area volume, about {{ ((volume[0].weekly_drops or 0) * volume_share_pct / 100) | round(0) | int }} of {{ (volume[0].weekly_drops or 0) | int }} drops a week.

      BASELINE (last six months, same areas)
      - Trial courier: on-time {{ trial[0].on_time }}%, damage {{ trial[0].damage }}%, complaints {{ trial[0].complaints }}%, cost per drop GBP {{ trial[0].cost }} ({{ trial[0].deliveries }} drops)
      - Other couriers: on-time {{ others[0].on_time }}%, damage {{ others[0].damage }}%, complaints {{ others[0].complaints }}%, cost per drop GBP {{ others[0].cost }} ({{ others[0].deliveries }} drops)

      POSTCODE AREAS BY VOLUME (drops in six months, share already with trial courier)
      {% for a in areas %}- {{ a.postcode_area }}: {{ a.drops }} drops, {{ a.trial_courier_share_pct | int }}% with trial courier
      {% endfor %}
      SUCCESS CRITERIA (measured weekly against the other couriers in the same areas)
      1. On-time delivery at least {{ ((others[0].on_time or 90) - 1) | round(1) }}% (within 1 point of the current couriers)
      2. Cost per drop at most GBP {{ (others[0].cost or 0) | round(2) }}
      3. Damage rate at most {{ [((others[0].damage or 1) * 1.5), 1.5] | max | round(1) }}%
      4. Complaint rate at most {{ ((others[0].complaints or 2) + 0.5) | round(1) }}%
      5. At least {{ ((volume[0].weekly_drops or 0) * volume_share_pct / 100 * 6) | round(0) | int }} drops over the six weeks, so results are reliable

      EXIT CONDITIONS (stop or pause the trial)
      - On-time more than 4 points below the other couriers in any week, or below target two weeks in a row
      - Damage rate above {{ [((others[0].damage or 1) * 2.5), 2.5] | max | round(1) }}% in any week
      - Complaint rate above {{ ((others[0].complaints or 2) * 2) | round(1) }}% in any week
      - A courier service disruption or capacity failure affecting the trial areas
      Review weekly with the courier; decide on extending the share at week six.
    example: {courier_id: "CAR-012", volume_share_pct: 20.0}
