    - tool: get_returns_centre_capacity
      args: {}
      expect: ["date", "capacity_units_per_day", "staffing_needed"]

- question: "02:21:Q5"
  story: "Manager evaluates returns charge trial. Seed data includes trial records for GB and DE markets with charge amounts and baseline impact estimates."
