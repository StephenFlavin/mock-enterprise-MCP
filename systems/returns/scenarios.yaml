- question: "02:21:Q1"
  story: "The top five returned styles in the last 90 days are STY-5520 (dress, sizing), STY-T-4410 (trousers, tight at the hip), STY-4171 (footwear, sole separation), STY-4042 (knitwear, not as described) and K-1700's style STY-K-1700 (kettle defects). STY-5520 has 117 returns, 47% WRONG_SIZE, so the saving for a 10% cut is about 506 pounds a year."
  checks:
    - tool: list_top_returned_styles
      args: {limit_count: 5}
      expect: ["STY-5520", "STY-T-4410", "STY-4171", "STY-4042", "STY-K-1700"]
    - tool: get_return_reasons_by_style
      args: {style_id: "STY-5520"}
      expect: ["WRONG_SIZE", "Too large or too small", "47"]
    - tool: calculate_return_reduction_savings
      args: {style_id: "STY-5520", reduction_pct: 10}
      expect: ["505.89", "annualised_returns"]

- question: "02:21:Q2"
  story: "Audio (earbuds, headphones) returns older than 60 days follow rule DIS-900003 (recycled) and a legacy 90+ day recycle rule DIS-900004; recycling nets about -5 pounds per item while liquidating nets about +4, worth about 2,444 pounds a year. Brand risk is high for liquidation, low for recycling."
  checks:
    - tool: get_returns_grading_data
      args: {category: "Audio"}
      expect: ["Audio", "pct_of_category"]
    - tool: get_disposition_route_outcomes
      args: {category: "Audio"}
      expect: ["recycled", "60+ days", "liquidated", "high"]
    - tool: get_handling_cost_by_disposition_route
      args: {category: "Audio", route: "liquidated"}
      expect: ["liquidated", "8.2"]
    - tool: get_return_item_age_profile
      args: {category: "Audio"}
      expect: ["DIS-900003", "DIS-900004", "60+ days"]
    - tool: get_liquidator_recovery_rates
      args: {category: "Audio"}
      expect: ["Brightstock Liquidations", "38"]
    - tool: calculate_annual_disposition_change_value
      args: {category: "Audio", old_route: "recycled", new_route: "liquidated"}
      expect: ["2444", "-5.15"]
    - tool: update_disposition_rule
      args: {rule_id: "DIS-900003", disposition_route: "liquidated"}
      expect: ["recycled", "liquidated"]
    - tool: delete_disposition_rule
      args: {rule_id: "DIS-900004"}
      expect: ["DIS-900004"]

- question: "02:21:Q3"
  story: "Weekly history has a January peak of 947 returns in the week of 2026-01-05 (about 2.8 times the autumn baseline). The returns centre has flat capacity of 72 units a day and 6 staff for January, so forecast days exceed capacity and up to 11 agency staff are needed on the busiest day."
  checks:
    - tool: get_historical_weekly_returns
      args: {weeks_back: 52}
      expect: ["2026-01-05", "947", "true"]
    - tool: get_returns_centre_capacity
      args: {date_from: "+1d", date_to: "+130d", peak_only: true}
      expect: ["agency_staff_needed", "273.6", "17"]

- question: "02:21:Q4"
  story: "Practices for DE, FR and NL: DE destroys D/E items (KrWG duty of care), FR destroys unsold goods after 90 days (AGEC ban), NL refunds in 21 days (14 required). Others are marked review or compliant."
  checks:
    - tool: get_returns_handling_practices
      args: {country: "DE"}
      expect: ["destroyed", "conflict", "KrWG"]
    - tool: get_returns_handling_practices
      args: {country: "FR"}
      expect: ["90 days", "AGEC"]
    - tool: get_returns_handling_practices
      args: {country: "NL"}
      expect: ["21 days", "6:230s"]

- question: "02:21:Q5"
  story: "A return costs 7.85 pounds per order in DE against 5.98 in GB (international return shipping). A 4.99 charge in DE is estimated at a 16.5% cut in returns, 1% lower conversion and about 5,393 pounds net margin a year, scaled from the completed IE trial. No DE or NL trial exists yet."
  checks:
    - tool: get_return_cost_per_order
      args: {}
      expect: ["DE", "7.85", "5.98"]
    - tool: calculate_returns_charge_impact
      args: {market: "DE", charge_gbp: 4.99}
      expect: ["5393", "16.5", "IE trial"]
    - tool: draft_returns_charge_trial_plan
      args: {market: "DE", proposed_charge_gbp: 4.99}
      expect: ["Returns charge trial plan", "Market: DE", "completed"]
    - tool: create_returns_charge_trial
      args: {market: "NL", charge_gbp: 4.99, start_date: "+14d", end_date: "+84d"}
      expect: ["TRL-000002", "planned"]

