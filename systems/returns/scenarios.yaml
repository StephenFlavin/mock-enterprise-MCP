    - tool: get_return_cost_per_order
      args: {channel: "web"}
      expect: ["avg_handling_cost", "gbp", "channel"]
    - tool: calculate_returns_charge_impact
      args: {market: "GB", charge_gbp: 3.99}
      expect: ["impact", "charge", "gbp"]
    - tool: draft_returns_charge_trial_plan
      args: {market: "GB", proposed_charge_gbp: 3.99}
      expect: ["Returns Charge Trial", "Market"]
    - tool: create_returns_charge_trial
      args: {market: "FR", charge_gbp: 4.99, start_date: "+7d", end_date: "+91d"}
      expect: ["TRL"]

