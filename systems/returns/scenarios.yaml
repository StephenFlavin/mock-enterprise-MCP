- question: "02:21:Q1"
  story: "Manager asks about top returned styles to identify quality issues. Seed data includes multiple returns for STY-5520 and STY-7731 with WRONG_SIZE and DAMAGE reasons, showing high return volume."
  checks:
    - tool: list_top_returned_styles
      args: {category: "Apparel"}
      expect: ["STY-5520", "STY-7731", "return_count"]
    - tool: get_return_reasons_by_style
      args: {style_id: "STY-5520"}
      expect: ["WRONG_SIZE", "DAMAGE", "pct"]
    - tool: calculate_return_reduction_savings
      args: {style_id: "STY-5520", reduction_pct: 10}
      expect: ["annual_saving", "gbp"]

- question: "02:21:Q2"
  story: "For electronics (K-1700, PF-220), the tool compares disposition routes. Seed data shows items in grades A-D with different recovery rates and handling costs via refurbished vs liquidated routes. Older items show lower recovery rates."
  checks:
    - tool: get_returns_grading_data
      args: {category: "Electronics"}
      expect: ["Electronics", "condition_grade", "pct"]
    - tool: get_disposition_route_outcomes
      args: {route: "liquidated"}
      expect: ["liquidated", "avg_handling_cost_gbp", "avg_recovery_gbp"]
    - tool: get_handling_cost_by_disposition_route
      args: {route: "liquidated"}
      expect: ["liquidated", "return_count", "avg_cost_gbp"]
    - tool: get_return_item_age_profile
      args: {category: "Electronics"}
      expect: ["0-30 days", "31-60 days", "pct_of_total"]
    - tool: get_liquidator_recovery_rates
      args: {category: "Electronics"}
      expect: ["recovery_rate", "liquidator"]
    - tool: calculate_annual_disposition_change_value
      args: {category: "Electronics", old_route: "liquidated", new_route: "refurbished", annual_volume: 5000}
      expect: ["annual_benefit", "gbp"]

- question: "02:21:Q3"
  story: "Manager plans for January returns volume and staffing. Seed data includes returns centre capacity records for upcoming weeks showing peak requirements in November and December holidays."
