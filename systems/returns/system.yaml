id: returns
name: Returns Management System (RMS)
instructions: >
  Returned items, disposition routes, recovery analytics, and circularity pilots.
  Return ids look like RET-000123. Use it for return reasons, damage assessment,
  disposition routing (resale, repair, liquidation, recycle), recovery value,
  and take-back or repair pilots.

tables:
  returns:
    key: return_id
    cols:
      return_id: {type: str, desc: "Return record, e.g. RET-000123"}
      order_id: {type: str, desc: "Customer order, e.g. ORD-2026-0123456"}
      sku: {type: str, desc: "SKU being returned"}
      style_id: {type: str, desc: "Style, e.g. STY-5520"}
      return_date: {type: date, desc: When item was returned to us}
      return_reason_code: {type: str, desc: "Reason code, e.g. WRONG_SIZE, DAMAGE"}
      pack_type: {type: str, desc: "Pack type, e.g. polybag, carton, hanging"}
      item_age_days: {type: int, desc: "Age in days when returned"}
      condition_grade: {type: enum, values: [A, B, C, D, E], desc: "Condition A-E (A best)"}
      damage_code: {type: str, desc: "If damaged, damage type code"}
      category: {type: str, desc: "Product category"}
      channel: {type: enum, values: [web, app, click_collect, store], desc: "Sales channel"}
      disposition_route: {type: str, desc: "How item was handled (restocked, refurbished, liquidated, recycled)"}
      disposition_date: {type: date, desc: When disposition decision was made}
      recovery_gbp: {type: float, desc: "Recovery value if liquidated or resold"}
      handling_cost_gbp: {type: float, desc: "Cost to handle and disposition"}
      outcome: {type: enum, values: [restocked, refurbished, liquidated, recycled, destroyed], desc: "Final outcome"}
      updated_at: {type: timestamp, desc: Last updated}

  return_reasons:
    key: reason_code
    cols:
      reason_code: {type: str, desc: "Reason code, e.g. WRONG_SIZE"}
      description: {type: str, desc: "Full description"}
      category: {type: str, desc: "Category for grouping"}

  disposition_rules:
    key: rule_id
    cols:
      rule_id: {type: str, desc: "Rule id, e.g. DIS-000001"}
      product_category: {type: str, desc: "Product category this rule applies to"}
      min_age_days: {type: int, desc: "Minimum item age in days"}
      max_age_days: {type: int, desc: "Maximum item age in days"}
      disposition_route: {type: str, desc: "Route: restocked, refurbished, liquidated, recycled"}
      status: {type: enum, values: [active, archived], desc: "Rule status"}
      effective_from: {type: date, desc: "Date rule became effective"}
      updated_at: {type: timestamp, desc: Last updated}

  liquidator_rates:
    key: liquidator_id
    cols:
      liquidator_id: {type: str, desc: "Liquidator id, e.g. LQD-000001"}
      name: {type: str, desc: "Liquidator name"}
      product_category: {type: str, desc: "Category this rate applies to"}
      recovery_rate_pct: {type: float, desc: "Recovery as % of original cost"}
      payment_terms_days: {type: int, desc: "Payment terms"}
      effective_date: {type: date, desc: "When rate became effective"}

  returns_centre_capacity:
    key: [capacity_id, date]
    cols:
      capacity_id: {type: str, desc: "Capacity record id"}
      date: {type: date, desc: "Date"}
      capacity_units_per_day: {type: int, desc: "Processing capacity in units per day"}
      target_throughput_units: {type: int, desc: "Target units to process"}
      actual_throughput_units: {type: int, desc: "Actual units processed"}
      staffing_needed: {type: int, desc: "Staff headcount needed"}
      peak_day: {type: bool, desc: "Whether this is a peak day"}

  circularity_pilots:
    key: pilot_id
    cols:
      pilot_id: {type: str, desc: "Pilot id, e.g. PIL-000001"}
      pilot_type: {type: enum, values: [take_back, resale, repair], desc: "Type of pilot"}
      product_category: {type: str, desc: "Category being piloted"}
      start_date: {type: date, desc: "Pilot start date"}
      end_date: {type: date, desc: "Pilot end date"}
      status: {type: enum, values: [planned, active, completed, cancelled], desc: "Status"}
      units_collected: {type: int, desc: "Units collected via pilot"}
      units_outcome_a: {type: int, desc: "Units with outcome A"}
      units_outcome_b: {type: int, desc: "Units with outcome B"}
      units_outcome_c: {type: int, desc: "Units with outcome C"}
      recovery_gbp: {type: float, desc: "Total recovery value"}
      handling_cost_gbp: {type: float, desc: "Total handling cost"}
      updated_at: {type: timestamp, desc: Last updated}

  returns_charge_trials:
    key: trial_id
    cols:
      trial_id: {type: str, desc: "Trial id, e.g. TRL-000001"}
      market: {type: str, desc: "Market/country code"}
      charge_gbp: {type: float, desc: "Returns charge amount in GBP"}
      start_date: {type: date, desc: "Trial start date"}
      end_date: {type: date, desc: "Trial end date"}
      status: {type: enum, values: [planned, active, completed], desc: "Trial status"}
      units_returned: {type: int, desc: "Units returned during trial"}
      baseline_units_returned: {type: int, desc: "Baseline returns without charge"}
      impact_on_rate_pct: {type: float, desc: "% change in return rate"}
      impact_on_conversion_pct: {type: float, desc: "% change in conversion"}
      updated_at: {type: timestamp, desc: Last updated}

  pack_type_damage:
    key: [pack_type, category]
    cols:
      pack_type: {type: str, desc: "Pack type"}
      category: {type: str, desc: "Product category"}
      damage_rate_pct: {type: float, desc: "Damage rate as % of returns"}
      sample_size: {type: int, desc: "Number of returns sampled"}
      measured_from_date: {type: date, desc: "When measurement period started"}

  returns_handling_practices:
    key: practice_id
    cols:
      practice_id: {type: str, desc: "Practice id"}
      country: {type: str, desc: "ISO country code"}
      practice_description: {type: str, desc: "Description of practice"}
      regulatory_reference: {type: str, desc: "Regulation this relates to"}

  disposition_outcomes:
    key: [route, condition_grade]
    cols:
      route: {type: str, desc: "Disposition route"}
      condition_grade: {type: str, desc: "Condition grade"}
      avg_handling_cost_gbp: {type: float, desc: "Average handling cost"}
      avg_recovery_gbp: {type: float, desc: "Average recovery value"}
      avg_days_to_sale: {type: int, desc: "Average days to sell"}

tools:
  - name: get_historical_weekly_returns
    desc: Weekly returns volume by week for the last 52 weeks. Use to forecast capacity needs and staffing.
    kind: sql
    args:
      category: {type: str, desc: "Filter by category (default all)"}
      weeks_back: {type: int, default: 52, desc: "Number of weeks of history"}
    sql: |
      SELECT date_trunc('week', r.return_date) AS week_start,
             count(*) AS returns_count,
             round(sum(r.handling_cost_gbp), 2) AS total_handling_cost_gbp
      FROM returns r
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks_back AS INT) * 7) DAY
        AND ($category IS NULL OR r.category = $category)
      GROUP BY date_trunc('week', r.return_date)
      ORDER BY week_start DESC
    limit: 52
    example: {}

  - name: get_return_cost_per_order
    desc: Average return cost by channel and segment. Returns handling cost, recovery value and net cost per return.
    kind: sql
    args:
      channel: {}
      days_back: {type: int, default: 180, desc: "Days of history to include"}
    sql: |
      SELECT r.channel,
             count(*) AS returns_count,
             round(avg(r.handling_cost_gbp), 2) AS avg_handling_cost_gbp,
             round(avg(r.recovery_gbp), 2) AS avg_recovery_gbp,
             round(avg(r.handling_cost_gbp - COALESCE(r.recovery_gbp, 0)), 2) AS avg_net_cost_gbp,
             'net_cost = handling_cost - recovery' AS formula
      FROM returns r
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
        AND ($channel IS NULL OR r.channel = $channel)
      GROUP BY r.channel
    limit: 10
    example: {channel: web}

  - name: get_damage_rate_by_pack_type
    desc: Damage rate on return by pack type and category. Shows which packs have highest damage risk.
    kind: sql
    args:
      category: {type: str, desc: "Product category (default all)"}
    sql: |
      SELECT p.pack_type, p.category,
             round(p.damage_rate_pct, 1) AS damage_rate_pct,
             p.sample_size,
             p.measured_from_date
      FROM pack_type_damage p
      WHERE ($category IS NULL OR p.category = $category)
      ORDER BY p.damage_rate_pct DESC
    limit: 20
    example: {}

  - name: get_disposition_route_outcomes
    desc: Outcomes by disposition route (restocked, refurbished, liquidated, recycled). Shows recovery value and handling cost.
    kind: sql
    args:
      route: {type: str, desc: "Disposition route (default all)"}
      condition_grade: {type: str, desc: "Condition grade A-E (default all)"}
    sql: |
      SELECT d.route, d.condition_grade,
             round(d.avg_handling_cost_gbp, 2) AS avg_handling_cost_gbp,
             round(d.avg_recovery_gbp, 2) AS avg_recovery_gbp,
             d.avg_days_to_sale,
             round(d.avg_recovery_gbp - d.avg_handling_cost_gbp, 2) AS avg_net_value_gbp,
             'net = recovery - handling' AS formula
      FROM disposition_outcomes d
      WHERE ($route IS NULL OR d.route = $route)
        AND ($condition_grade IS NULL OR d.condition_grade = $condition_grade)
      ORDER BY d.avg_recovery_gbp DESC
    limit: 30
    example: {}

  - name: get_handling_cost_by_disposition_route
    desc: Actual handling cost by disposition route from returns processed in last 6 months.
    kind: sql
    args:
      route: {type: str, desc: "Disposition route (restocked, refurbished, liquidated, recycled)"}
    sql: |
      SELECT r.disposition_route,
             count(*) AS return_count,
             round(avg(r.handling_cost_gbp), 2) AS avg_cost_gbp,
             round(min(r.handling_cost_gbp), 2) AS min_cost_gbp,
             round(max(r.handling_cost_gbp), 2) AS max_cost_gbp,
             round(sum(r.handling_cost_gbp), 2) AS total_cost_gbp
      FROM returns r
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
        AND ($route IS NULL OR r.disposition_route = $route)
      GROUP BY r.disposition_route
      ORDER BY total_cost_gbp DESC
    limit: 10
    example: {route: liquidated}

  - name: get_return_item_age_profile
    desc: Distribution of returned items by age (days since purchase). Shows what % are 0-30, 31-60, 60+ days old.
    kind: sql
    args:
      category: {type: str, desc: "Product category (default all)"}
    sql: |
      SELECT CASE
               WHEN r.item_age_days <= 30 THEN '0-30 days'
               WHEN r.item_age_days <= 60 THEN '31-60 days'
               ELSE '60+ days'
             END AS age_band,
             count(*) AS return_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct_of_total
      FROM returns r
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
        AND ($category IS NULL OR r.category = $category)
      GROUP BY age_band
      ORDER BY age_band
    limit: 10
    example: {}

  - name: get_liquidator_recovery_rates
    desc: Recovery rates offered by liquidators by product category. Shows what % of cost we recover via liquidation.
    kind: sql
    args:
      category: {type: str, desc: "Product category (default all)"}
    sql: |
      SELECT l.name AS liquidator,
             l.product_category,
             round(l.recovery_rate_pct, 1) AS recovery_rate_pct,
             l.payment_terms_days,
             l.effective_date
      FROM liquidator_rates l
      WHERE ($category IS NULL OR l.product_category = $category)
      ORDER BY l.recovery_rate_pct DESC
    limit: 20
    example: {}

  - name: list_top_returned_styles
    desc: Top 10-20 returned styles by volume in last 90 days. Use to identify quality or fit issues.
    kind: sql
    args:
      category: {type: str, desc: "Filter by category (default all)"}
      limit_count: {type: int, default: 10, desc: "Number to return"}
    sql: |
      SELECT r.style_id,
             p.name AS style_name,
             count(*) AS return_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct_of_category_returns
      FROM returns r
      JOIN master.products p ON p.style_id = r.style_id
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL 90 DAY
        AND ($category IS NULL OR r.category = $category)
      GROUP BY r.style_id, p.name
      ORDER BY return_count DESC
      LIMIT CAST($limit_count AS INT)
    example: {category: "Apparel"}

  - name: get_return_reasons_by_style
    desc: Return reasons breakdown for a style. Shows which issues (sizing, quality, etc) are driving returns.
    kind: sql
    args:
      style_id: {required: true}
    sql: |
      SELECT r.style_id,
             r.return_reason_code,
             rr.description,
             count(*) AS return_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct
      FROM returns r
      LEFT JOIN return_reasons rr ON rr.reason_code = r.return_reason_code
      WHERE r.style_id = $style_id
        AND r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
      GROUP BY r.style_id, r.return_reason_code, rr.description
      ORDER BY return_count DESC
    limit: 20
    example: {style_id: "STY-5520"}

  - name: get_returns_grading_data
    desc: Condition grades on return by category for last 6 months. Shows % in A-E grades for resale assessment.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
    sql: |
      SELECT r.category,
             r.condition_grade,
             count(*) AS return_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct_of_category
      FROM returns r
      WHERE r.category = $category
        AND r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
      GROUP BY r.category, r.condition_grade
      ORDER BY r.condition_grade
    limit: 10
    example: {category: "Electronics"}

  - name: calculate_return_reduction_savings
    desc: Calculate annual savings from reducing returns for top styles. Returns impact on cost and inventory.
    kind: sql
    args:
      style_id: {required: true, desc: "Style to analyze"}
      reduction_pct: {type: float, default: 10, desc: "% reduction to assume"}
    sql: |
      SELECT $style_id AS style_id,
             count(r.return_id) AS current_returns,
             round(count(r.return_id) * CAST($reduction_pct AS FLOAT) / 100.0) AS returns_avoided,
             round(avg(r.handling_cost_gbp), 2) AS avg_handling_cost_gbp,
             round(count(r.return_id) * CAST($reduction_pct AS FLOAT) / 100.0 * avg(r.handling_cost_gbp), 2) AS annual_saving_gbp,
             'saving = avoided_returns * avg_cost' AS formula
      FROM returns r
      WHERE r.style_id = $style_id
        AND r.return_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY
    limit: 1
    example: {style_id: "STY-5520", reduction_pct: 15}

  - name: calculate_annual_disposition_change_value
    desc: Financial impact of changing disposition route. Returns savings from better recovery or lower handling cost.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
      old_route: {required: true, desc: "Current route (restocked, refurbished, liquidated, recycled)"}
      new_route: {required: true, desc: "Proposed route"}
      annual_volume: {type: int, default: 10000, desc: "Annual units affected"}
    sql: |
      SELECT $category AS category,
             $old_route AS old_route,
             $new_route AS new_route,
             CAST($annual_volume AS INT) AS annual_volume,
             round((SELECT avg_recovery_gbp - avg_handling_cost_gbp FROM disposition_outcomes
                    WHERE route = $new_route LIMIT 1) -
                   (SELECT avg_recovery_gbp - avg_handling_cost_gbp FROM disposition_outcomes
                    WHERE route = $old_route LIMIT 1), 2) * CAST($annual_volume AS INT) AS annual_benefit_gbp,
             'benefit = (new_route_value - old_route_value) * volume' AS formula
    limit: 1
    example: {category: "Electronics", old_route: "liquidated", new_route: "refurbished", annual_volume: 5000}

  - name: calculate_returns_charge_impact
    desc: Estimate effect of returns charge on return rate, conversion and margin. Compares with/without charge scenarios.
    kind: sql
    args:
      market: {required: true, desc: "Market/country"}
      charge_gbp: {required: true, type: float, desc: "Proposed charge amount"}
    sql: |
      SELECT $market AS market,
             CAST($charge_gbp AS FLOAT) AS charge_gbp,
             round(avg(r.handling_cost_gbp), 2) AS avg_return_cost_gbp,
             round(CAST($charge_gbp AS FLOAT) / avg(r.handling_cost_gbp) * 100.0, 1) AS charge_vs_cost_pct,
             round(avg(CASE WHEN r.outcome IN ('restocked', 'refurbished') THEN 1 ELSE 0 END) * 100.0, 1) AS baseline_resale_pct,
             round(avg(CASE WHEN r.outcome IN ('restocked', 'refurbished') THEN 1 ELSE 0 END) * 100.0 * 0.85, 1) AS projected_resale_pct_with_charge,
             'impact: charge reduces returns by estimated 15%' AS formula
      FROM returns r
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
    limit: 1
    example: {market: "GB", charge_gbp: 5.0}

  - name: get_returns_centre_capacity
    desc: Returns centre capacity and staffing needs by date. Shows utilization vs target for planning.
    kind: sql
    args:
      date_from: {type: date, default: "-14d", desc: "From date"}
      date_to: {type: date, default: "+14d", desc: "To date"}
    sql: |
      SELECT c.date,
             c.capacity_units_per_day,
             c.target_throughput_units,
             c.actual_throughput_units,
             round(COALESCE(100.0 * c.actual_throughput_units / c.target_throughput_units, 0), 1) AS utilization_pct,
             c.staffing_needed,
             c.peak_day
      FROM returns_centre_capacity c
      WHERE c.date >= CAST($date_from AS DATE) AND c.date <= CAST($date_to AS DATE)
      ORDER BY c.date
    limit: 60
    example: {}

  - name: get_circularity_volumes_by_outcome
    desc: Units collected, reused, repaired, recycled from take-back programs. Shows circular economy progress.
    kind: sql
    args:
      pilot_type: {type: enum, values: [take_back, resale, repair], desc: "Type of pilot (default all)"}
    sql: |
      SELECT CASE WHEN p.pilot_type = 'take_back' THEN 'Collected'
                  WHEN p.pilot_type = 'resale' THEN 'Reused'
                  WHEN p.pilot_type = 'repair' THEN 'Repaired'
                  ELSE 'Other'
             END AS outcome,
             sum(p.units_collected) AS total_units,
             sum(p.recovery_gbp) AS total_recovery_gbp,
             round(sum(p.recovery_gbp) / NULLIF(sum(p.units_collected), 0), 2) AS recovery_per_unit_gbp
      FROM circularity_pilots p
      WHERE p.status IN ('active', 'completed')
        AND ($pilot_type IS NULL OR p.pilot_type = $pilot_type)
      GROUP BY p.pilot_type
      ORDER BY outcome
    limit: 10
    example: {}

  - name: draft_pilot_plan
    desc: Draft plan for a take-back, resale or repair pilot including scope, targets and timeline.
    kind: draft
    args:
      pilot_type: {required: true, type: enum, values: [take_back, resale, repair], desc: "Type of pilot"}
      category: {required: true, desc: "Product category"}
      pilot_duration_weeks: {type: int, default: 12, desc: "Duration in weeks"}
    sql:
      grading: |
        SELECT r.category,
               r.condition_grade,
               count(*) AS return_count,
               round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct
        FROM returns r
        WHERE r.category = $category
          AND r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
        GROUP BY r.category, r.condition_grade
        ORDER BY r.condition_grade
      pilots: |
        SELECT p.pilot_type, p.product_category, avg(p.recovery_gbp) AS avg_recovery, avg(p.handling_cost_gbp) AS avg_cost
        FROM circularity_pilots p
        WHERE p.pilot_type = $pilot_type AND p.status IN ('active', 'completed')
        GROUP BY p.pilot_type, p.product_category
    template: |
      Pilot Plan: {{ pilot_type|title }} Program for {{ category }}

      Duration: {{ pilot_duration_weeks }} weeks

      Condition Distribution:
      {% for row in grading -%}
      - Grade {{ row.condition_grade }}: {{ row.pct }}% ({{ row.return_count }} units)
      {% endfor %}

      Benchmarks from similar pilots:
      {% for row in pilots -%}
      - Average recovery: £{{ row.avg_recovery|num(2) }} per unit
      - Average handling cost: £{{ row.avg_cost|num(2) }} per unit
      {% endfor %}

      Success metrics: Pilot viability determined by recovery exceeding handling cost.
    example: {pilot_type: take_back, category: "Electronics", pilot_duration_weeks: 12}

  - name: create_circularity_pilot
    desc: Create a take-back, resale or repair pilot record. Starts a new pilot in active status.
    kind: insert
    table: circularity_pilots
    id_prefix: PIL-
    defaults: {status: active}
    args:
      pilot_type: {required: true, type: enum, values: [take_back, resale, repair], desc: "Type of pilot"}
      product_category: {required: true, desc: "Category being piloted"}
      start_date: {required: true, type: date, desc: "Pilot start date"}
      end_date: {type: date, desc: "Expected end date"}
    example: {pilot_type: repair, product_category: "Electronics", start_date: "+7d", end_date: "+91d"}

  - name: draft_returns_charge_trial_plan
    desc: Draft plan for returns charge trial including market selection, charge amount and expected impact.
    kind: draft
    args:
      market: {required: true, desc: "Target market/country code"}
      proposed_charge_gbp: {required: true, type: float, desc: "Charge amount in GBP"}
    sql:
      baseline: |
        SELECT count(*) AS returns_count,
               round(avg(r.handling_cost_gbp), 2) AS avg_cost_gbp,
               round(sum(r.handling_cost_gbp), 2) AS total_cost_gbp
        FROM returns r
        WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
    template: |
      Returns Charge Trial Plan

      Market: {{ market|upper }}
      Proposed Charge: £{{ proposed_charge_gbp|num(2) }}

      Baseline (last 6 months):
      {% if baseline %}- Total returns: {{ baseline[0].returns_count }}
      - Average handling cost per return: £{{ baseline[0].avg_cost_gbp|num(2) }}
      - Total handling cost: £{{ baseline[0].total_cost_gbp|money }}
      {% endif %}

      Expected impact:
      - Return rate reduction: 10-15% estimated
      - Improved conversion rate
      - Enhanced customer consideration of purchases

      Trial duration: 8-12 weeks
    example: {market: "GB", proposed_charge_gbp: 3.99}

  - name: create_returns_charge_trial
    desc: Create a returns charge trial record in selected markets. Starts a new trial in active status.
    kind: insert
    table: returns_charge_trials
    id_prefix: TRL-
    defaults: {status: active}
    args:
      market: {required: true, desc: "Market/country code"}
      charge_gbp: {required: true, type: float, desc: "Charge amount"}
      start_date: {required: true, type: date, desc: "Trial start date"}
      end_date: {type: date, desc: "Trial end date"}
    example: {market: "GB", charge_gbp: 3.99, start_date: "+7d", end_date: "+91d"}

  - name: delete_disposition_rule
    desc: Delete a superseded disposition rule. Soft-deletes by archiving the rule.
    kind: update
    table: disposition_rules
    set: {status: archived}
    args: {}
    example: {rule_id: DIS-900001}

  - name: update_disposition_rule
    desc: Update a disposition rule to change the route for a product category and age band.
    kind: update
    table: disposition_rules
    set: {updated_at: "$as_of"}
    args:
      disposition_route: {required: true, desc: "New route (restocked, refurbished, liquidated, recycled)"}
    example: {rule_id: DIS-900001, disposition_route: liquidated}

  - name: get_returns_by_reason_code
    desc: Returns grouped by reason code. Use to identify patterns and quality issues.
    kind: sql
    args:
      reason_code: {type: str, desc: "Filter by reason code (default all)"}
      category: {type: str, desc: "Filter by category (default all)"}
    sql: |
      SELECT r.return_reason_code,
             rr.description,
             r.category,
             count(*) AS return_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct
      FROM returns r
      LEFT JOIN return_reasons rr ON rr.reason_code = r.return_reason_code
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL 90 DAY
        AND ($reason_code IS NULL OR r.return_reason_code = $reason_code)
        AND ($category IS NULL OR r.category = $category)
      GROUP BY r.return_reason_code, rr.description, r.category
      ORDER BY return_count DESC
    limit: 30
    example: {}

  - name: get_returns_condition_grading_by_category
    desc: Condition grades on return by category. Shows resale opportunity by condition.
    kind: sql
    args:
      category: {required: true, desc: "Product category"}
    sql: |
      SELECT r.category,
             r.condition_grade,
             count(*) AS return_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct_of_category
      FROM returns r
      WHERE r.category = $category
        AND r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
      GROUP BY r.category, r.condition_grade
      ORDER BY r.condition_grade
    limit: 10
    example: {category: "Electronics"}

  - name: calculate_cost_of_returns_by_error_type
    desc: Cost of returns by error type (data, quality, fulfillment). Shows cost per error category.
    kind: sql
    args:
      error_type: {type: str, desc: "Error type to analyze (default all)"}
    sql: |
      SELECT CASE r.return_reason_code
               WHEN 'WRONG_ITEM' THEN 'Fulfillment'
               WHEN 'DAMAGE_IN_TRANSIT' THEN 'Fulfillment'
               WHEN 'WRONG_SIZE' THEN 'Data'
               WHEN 'WRONG_COLOUR' THEN 'Data'
               WHEN 'DEFECT' THEN 'Quality'
               WHEN 'NOT_AS_DESCRIBED' THEN 'Data'
               ELSE 'Other'
             END AS error_type,
             count(*) AS return_count,
             round(sum(r.handling_cost_gbp), 2) AS total_handling_cost_gbp,
             round(sum(COALESCE(r.recovery_gbp, 0)), 2) AS total_recovery_gbp,
             round(sum(r.handling_cost_gbp - COALESCE(r.recovery_gbp, 0)), 2) AS total_net_cost_gbp,
             round(avg(r.handling_cost_gbp - COALESCE(r.recovery_gbp, 0)), 2) AS avg_net_cost_per_return_gbp,
             'net_cost = handling_cost - recovery' AS formula
      FROM returns r
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY
      GROUP BY error_type
      ORDER BY total_net_cost_gbp DESC
    limit: 10
    example: {}

  - name: get_return_reasons_for_product
    desc: Return reasons for a specific product (SKU). Use to identify quality or fitment issues.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
    sql: |
      SELECT r.sku,
             p.name,
             r.return_reason_code,
             rr.description,
             count(*) AS return_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct
      FROM returns r
      JOIN master.products p ON p.sku = r.sku
      LEFT JOIN return_reasons rr ON rr.reason_code = r.return_reason_code
      WHERE r.sku = $sku
        AND r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
      GROUP BY r.sku, p.name, r.return_reason_code, rr.description
      ORDER BY return_count DESC
    limit: 20
    example: {sku: "K-1700"}

  - name: get_return_reasons_for_sku
    desc: Return reasons breakdown for a SKU. Shows distribution of why customers return this product.
    kind: sql
    args:
      sku: {required: true, desc: "SKU"}
    sql: |
      SELECT r.sku,
             r.return_reason_code,
             rr.description,
             count(*) AS return_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct
      FROM returns r
      LEFT JOIN return_reasons rr ON rr.reason_code = r.return_reason_code
      WHERE r.sku = $sku
      GROUP BY r.sku, r.return_reason_code, rr.description
      ORDER BY return_count DESC
    limit: 20
    example: {sku: "PF-220"}

  - name: get_returns_rate_by_product
    desc: Return rate by product. Shows which SKUs have highest return rates vs peers.
    kind: sql
    args:
      category: {type: str, desc: "Filter by category (default all)"}
    sql: |
      SELECT r.sku,
             p.name,
             p.category,
             count(DISTINCT r.return_id) AS return_count,
             sum(r.handling_cost_gbp) AS total_handling_cost_gbp,
             round(avg(r.handling_cost_gbp), 2) AS avg_cost_per_return_gbp
      FROM returns r
      JOIN master.products p ON p.sku = r.sku
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
        AND ($category IS NULL OR p.category = $category)
      GROUP BY r.sku, p.name, p.category
      ORDER BY return_count DESC
    limit: 50
    example: {}

  - name: get_returns_rate_by_size_and_fit
    desc: Return rate by size for a style. Identifies sizing problems (too small, too large, wrong fit).
    kind: sql
    args:
      style_id: {required: true, desc: "Style to analyze"}
    sql: |
      SELECT r.style_id,
             p.size,
             count(*) AS return_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct_of_style_returns
      FROM returns r
      JOIN master.products p ON p.sku = r.sku
      WHERE r.style_id = $style_id
        AND r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
      GROUP BY r.style_id, p.size
      ORDER BY return_count DESC
    limit: 30
    example: {style_id: "STY-T-4410"}

  - name: get_returns_cost_by_channel
    desc: Return handling cost and volume by sales channel. Use to assess profitability by channel.
    kind: sql
    args:
      channel: {desc: "Filter by channel (web, app, click_collect, store) - default all"}
    sql: |
      SELECT r.channel,
             count(*) AS return_count,
             round(sum(r.handling_cost_gbp), 2) AS total_handling_cost_gbp,
             round(avg(r.handling_cost_gbp), 2) AS avg_cost_per_return_gbp,
             round(sum(r.recovery_gbp), 2) AS total_recovery_gbp,
             round(sum(r.handling_cost_gbp - COALESCE(r.recovery_gbp, 0)), 2) AS total_net_cost_gbp
      FROM returns r
      WHERE r.return_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
        AND ($channel IS NULL OR r.channel = $channel)
      GROUP BY r.channel
      ORDER BY total_net_cost_gbp DESC
    limit: 10
    example: {channel: web}

  - name: get_returns_handling_practices
    desc: Returns handling practices and compliance by country. Shows regulatory requirements.
    kind: sql
    args:
