- question: "03:23:Q2"
  story: >
    New product forecasting workflow with early sales alerts.
  checks:
    - tool: search_comparable_products
      args: {name_keywords: "kettle"}
      expect: ["SKU", "name", "category"]
    - tool: get_sales_history_for_products
      args: {category: "Home", period_start: "-52w", period_end: "-4w"}
      expect: ["sku", "units_sold"]
    - tool: run_new_product_forecast
      args: {sku: "SKU-100056", launch_date: "2026-10-13"}
      expect: ["SKU-100056", "forecast_units"]
    - tool: calculate_early_sales_trigger_thresholds
      args: {sku: "SKU-100056", launch_week: "2026-10-13"}
      expect: ["chase_threshold", "cancel_threshold"]
    - tool: create_forecast_override
      args: {category: "Home", week_start: "2026-10-13", week_end: "2026-10-19", override_pct: 0.0, override_type: "base_case", reason: "New product"}
      expect: ["OVR-", "Home"]
    - tool: create_early_sales_alert
      args: {sku: "SKU-100056", product_name: "Product", alert_type: "chase", trigger_threshold_pct: 70.0}
      expect: ["ALR-", "active"]

