# Scenarios for demand planning - Stage 1 tools only
- question: "03:23:Q5"
  story: >
    Style 5520 had stockouts in July (zero units). Demand history shows 280-290 units in adjacent weeks.
    Correction method: use average of pre/post (300 units). Adjustment applied for model retraining.
  checks:
    - tool: get_demand_history_for_sku
      args: {sku: "SKU-100056", period_start: "-52w", period_end: "-30d"}
      expect: ["SKU-100", "units_sold", "period_date"]
    - tool: calculate_lost_demand_for_sku
      args: {sku: "SKU-100056", period_start: "-90d", period_end: "-60d"}
      expect: ["total_lost_units", "estimated_lost_revenue"]
    - tool: calculate_corrected_demand_history
      args: {sku: "SKU-100056", period_start: "-90d", period_end: "-60d"}
      expect: ["corrected_units", "adjustment", "formula"]
    - tool: update_demand_history_adjustments
      args: {adjustment_id: "ADJ-900001", units_lost: 450, correction_method: "use average of pre/post"}
      expect: ["ADJ-900001"]

- question: "03:23:Q1"
  story: >
    Outerwear forecast bias was +18% last month. Decomposed by weather (6.2%), new launch (-3.1%),
    promotion (8.9%). Bias showing across markets.
  checks:
    - tool: get_forecast_bias_for_category
      args: {category: "Outerwear", period_start: "-13w", period_end: "-4w"}
      expect: ["Outerwear", "bias_pct"]
    - tool: get_forecast_error_decomposition
      args: {category: "Outerwear", period_start: "-13w", period_end: "-4w"}
      expect: ["error_driver", "error_pct"]
    - tool: get_forecast_bias_by_market
      args: {period_start: "-13w", period_end: "-4w"}
      expect: ["market", "bias_pct"]

- question: "03:30:Q2"
  story: >
    Forecasts show high error. Configuration change caused regression. Recommendation: rollback and tune instead.
  checks:
    - tool: list_forecasts_by_error_and_bias
      args: {mape_threshold_pct: 20.0, period_start: "-26w", period_end: "-4w"}
      expect: ["config_id", "mape_pct"]
    - tool: get_configuration_change_log
      args: {period_start: "-26w", period_end: "-4w"}
      expect: ["config_id", "config_name", "created_at", "status"]
    - tool: compare_forecast_accuracy_before_after_change
      args: {config_id: "CFG-000001", change_date: "2026-09-01"}
      expect: ["before_mape_pct", "after_mape_pct"]
    - tool: calculate_rollback_vs_tune_impact
      args: {config_id: "CFG-000001", period_start: "-26w", period_end: "-4w"}
      expect: ["recommendation"]
    - tool: update_forecast_model_settings
      args: {config_id: "CFG-000001", status: "archived", notes: "Rolled back"}
      expect: ["CFG-000001"]

- question: "03:30:Q3"
  story: >
    Vendor platform supports new product forecasting. Backtest accuracy vs live accuracy evidence.
  checks:
    - tool: get_forecast_vendor_capabilities
      args: {method_type: "exponential_smoothing"}
      expect: ["method_type"]
    - tool: get_current_forecast_method_for_item_type
      args: {item_type: "new_product"}
      expect: ["new_product", "method"]
    - tool: get_backtest_vs_live_accuracy_evidence
      args: {config_id: "CFG-000001"}
      expect: ["backtest_mape_pct", "live_mape_pct"]

- question: "03:30:Q4"
  story: >
    Forecasting by level comparison: store-SKU vs cluster level.
  checks:
    - tool: run_forecast_backtest
      args: {config_id: "CFG-000001", period_start: "-26w", period_end: "-4w"}
      expect: ["backtest_mape_pct", "items_backtested"]
    - tool: compare_forecast_accuracy_by_level
      args: {category: "Home", period_start: "-13w", period_end: "-4w"}
      expect: ["forecast_level", "mape_pct"]
    - tool: get_forecast_run_effort_metrics
      args: {period_start: "-13w", period_end: "-4w"}
      expect: ["active_configs", "skus_forecast"]

- question: "03:30:Q5"
  story: >
    History window change from 52 to 26 weeks for fashion. Backtest shows improvement.
  checks:
    - tool: run_forecast_backtest
      args: {config_id: "CFG-000002", period_start: "-26w", period_end: "-4w"}
      expect: ["backtest_mape_pct", "items_backtested"]
    - tool: compare_forecast_accuracy_by_history_window
      args: {category: "Outerwear", period_start: "-13w", period_end: "-4w"}
      expect: ["history_window_weeks", "mape_pct"]
    - tool: get_forecast_accuracy_by_category
      args: {period_start: "-13w", period_end: "-4w"}
      expect: ["category", "mape_pct"]
    - tool: create_forecast_model_configuration
      args: {config_name: "26-week fashion pilot", history_window_weeks: 26, method_type: "exponential_smoothing", item_type: "fast_mover", notes: "Testing"}
      expect: ["CFG-", "26-week"]

