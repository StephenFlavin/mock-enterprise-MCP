    Cotton demand risk: the fashion range sells about 25,300 units a week with 7.5% weekly variation; the weak week is 11.7% below
    average and forecast error is 8.0%, so a 10% shortfall against plan is realistic.
  checks:
  - tool: get_demand_forecast_variability
    args: {segment: fashion}
    expect: ["25327", "7.5", "22352", "-11.7", "8"]
- question: 05:50:Q1
  story: >
    Vietnam supplier exposure (the region in the risk events): ten Vietnamese suppliers carry about 5.2% of last year's revenue,
    led by SUP-0069 (Lee Apparel Co, 1.79m) and SUP-0008 (Sheppard Products Co, 1.55m); the rows are master-consistent.
  checks:
  - tool: get_revenue_dependency_by_supplier
    args: {country: VN}
    expect: ["SUP-0069", "1786900", "SUP-0008", "1554243", "5.2"]
  - tool: get_revenue_dependency_by_supplier
    args: {supplier_id: SUP-0008}
    expect: ["Sheppard Products Co", "1554243"]
- question: 06:54:Q4
  story: >
    SS27 pipeline: 12 items launching over the next seven weeks, about 20,000 units and 1.45m at list price in the first 12 weeks.
    Rust Lighting (PL-000008, supply high on a 105-day lead time and a 78.5% on-time supplier, draft) scores 80, Black Fragrance
    (PL-000021) 70 and White Outerwear S (PL-000029) 60.
  checks:
  - tool: get_pipeline_products_for_season
    args: {season: SS27}
    expect: ["PL-000008", "Rust Lighting", "80", "19998", "1454046", "PL-000021"]
  - tool: get_demand_forecast_for_pipeline_product
    args: {pipeline_id: PL-000008, weeks_ahead: 12}
    expect: ["1624", "1299", "1949", "129932"]
  - tool: calculate_pipeline_risk_score
    args: {pipeline_id: PL-000008}
    expect: ["80", "105-day lead time", "78.5", "draft"]
- question: 07:62:Q2
  story: >
    Next 52 weeks, all categories: base 2,803,899 units and 195.0m revenue; the scenarios the system holds are upside 3,365,805 units
    (234.0m) and downside 2,243,646 units (156.0m).
  checks:
  - tool: get_demand_forecast
    args: {}
    expect: ["2803899", "194962101", "3365805", "2243646", "155969302"]
  - tool: get_demand_forecast
    args: {category: Dresses}
    expect: ["Dresses", "108972", "5614040"]
- question: 07:62:Q3
  story: >
    DC1 (Northampton) outbound volume over the next 3 years: base 10,557,800 units (3.5% annual growth), upside 11,052,900 (7%),
    downside 9,943,200 (-1%); the busiest base week is 141,581 units.
  checks:
  - tool: get_site_volume_forecast
    args: {site_id: DC1, period_end: +156w}
    expect: ["10557800", "11052900", "9943200", "141581"]
- question: 07:63:Q3
  story: >
    Northern stores (UK North, 60 stores) peak profile: Black Friday week is 1.63 times the pre-peak week, 4,260 pallets and about 117,800
    units a day; DC1 serves 147 of the lanes and DC3 the rest.
  checks:
  - tool: get_peak_volume_profile
    args: {region: UK North}
    expect: ["black_friday_week", "4260", "1.63", "117828"]
  - tool: get_peak_volume_profile
    args: {region: UK North, origin_site_id: DC1}
    expect: ["2625", "1.63"]
- question: 07:70:Q2
  story: >
    18-month demand scenarios, all categories: base 4,225,478 units and 293.2m revenue; downside 20% lower (3,381,216 units, 58.6m
    less revenue) and upside 20% higher.
  checks:
  - tool: get_demand_scenarios
    args: {}
    expect: ["4225478", "3381216", "5072250", "293223133", "-58642756"]
  - tool: get_demand_scenarios
    args: {grain: quarter}
    expect: ["quarter_start", "downside", "upside"]
- question: 08:74:Q2
  story: >
    Peak daily orders: Black Friday is the busiest forecast day with 30,414 units (last year's Black Friday 28,633, up 6.2%), Cyber Monday
    28,117, and Christmas Eve drops to 9,698. A +15% traffic what-if lifts Black Friday to 34,976.
  checks:
  - tool: run_daily_order_volume_forecast
    args: {forecast_start: +6w, days_ahead: 50}
    expect: ["30414", "28633", "6.2", "28117"]
  - tool: run_daily_order_volume_forecast
    args: {forecast_start: +7w, days_ahead: 3, traffic_uplift_pct: 15}
    expect: ["34976"]
  - tool: get_daily_orders_history
    args: {period_start: -46w, period_end: -40w}
    expect: ["28633", "Friday", "order_date"]
