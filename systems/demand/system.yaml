id: demand
name: Demand Planning System
instructions: >
  Forecasts, demand history, accuracy metrics, and planning tools for retail demand.
  Forecast ids look like FC-000001. Use for weekly demand by SKU/category,
  forecast accuracy, override management, and new-product demand.

tables:
  demand_history:
    key: history_id
    cols:
      history_id: {type: str, desc: "Demand history record, e.g. DH-000123"}
      sku: {type: str, desc: SKU}
      category: {type: str, desc: Product category}
      period_date: {type: date, desc: "Week start (Monday)"}
      units_sold: {type: int, desc: Units sold in period}
      revenue_gbp: {type: float, desc: Revenue in GBP}
      demand_type: {type: enum, values: [actual, corrected], desc: Actual or corrected for stockout}
      correction_reason: {type: str, desc: Reason for correction}
      updated_at: {type: timestamp, desc: Last update}

  forecasts:
    key: forecast_id
    cols:
      forecast_id: {type: str, desc: "Forecast record, e.g. FC-000123"}
      config_id: {type: str, desc: Forecast configuration used}
      sku: {type: str, desc: SKU}
      category: {type: str, desc: Product category}
      forecast_week: {type: date, desc: Week starting Monday}
      units_forecast: {type: int, desc: Units forecast for the week}
      forecast_type: {type: enum, values: [base, upside, downside], desc: Scenario type}
      created_at: {type: timestamp, desc: When forecast was generated}

  forecast_configs:
    key: config_id
    cols:
      config_id: {type: str, desc: "Forecast configuration, e.g. CFG-000123"}
      config_name: {type: str, desc: "Configuration name, e.g. 52-week history"}
      history_window_weeks: {type: int, desc: Historical weeks used in calculation}
      method_type: {type: str, desc: "Method, e.g. exponential_smoothing"}
      item_type: {type: enum, values: [fast_mover, slow_mover, new_product], desc: Item classification}
      status: {type: enum, values: [active, test, archived], desc: Configuration status}
      created_at: {type: timestamp, desc: Created date}
      notes: {type: text, desc: Configuration notes}
      parameters: {type: text, desc: "Current model parameters, e.g. alpha=0.2; outlier_capping=off"}
      categories: {type: text, desc: "Categories the configuration covers, or all"}

  forecast_accuracy:
    key: accuracy_id
    cols:
      accuracy_id: {type: str, desc: "Accuracy record, e.g. ACC-000123"}
      config_id: {type: str, desc: Forecast configuration}
      period_start: {type: date, desc: Period start}
      period_end: {type: date, desc: Period end}
      sku: {type: str, desc: SKU}
      category: {type: str, desc: Category}
      forecast_level: {type: enum, values: [sku, category, regional, national, store_sku, cluster], desc: "Aggregation level, e.g. store_sku or cluster"}
      mape_pct: {type: float, desc: "Mean absolute percentage error %"}
      bias_pct: {type: float, desc: "Forecast bias %"}
      rmse: {type: int, desc: Root mean square error}

  forecast_errors:
    key: error_id
    cols:
      error_id: {type: str, desc: "Error record, e.g. ERR-000123"}
      sku: {type: str, desc: SKU}
      category: {type: str, desc: Category}
      period_start: {type: date, desc: Period start}
      period_end: {type: date, desc: Period end}
      error_driver: {type: str, desc: "Driver: weather, promotion, pricing, new_launch, store_cluster"}
      error_units: {type: int, desc: Units of error attributed}
      error_pct: {type: float, desc: "Percentage of total error"}
      explanation: {type: text, desc: Details about the error}

  forecast_bias:
    key: bias_id
    cols:
      bias_id: {type: str, desc: "Bias record, e.g. BI-000123"}
      sku: {type: str, desc: SKU}
      category: {type: str, desc: Category}
      market: {type: str, desc: "Market/region, e.g. UK North"}
      period_start: {type: date, desc: Period start}
      period_end: {type: date, desc: Period end}
      bias_pct: {type: float, desc: "Forecast bias %"}
      primary_driver: {type: str, desc: "Main driver of bias"}

  early_sales_data:
    key: sales_id
    cols:
      sales_id: {type: str, desc: "Early sales record, e.g. ES-000123"}
      sku: {type: str, desc: SKU}
      product_name: {type: str, desc: Product name}
      launch_date: {type: date, desc: Launch date}
      week_in_launch: {type: int, desc: Week since launch (1-based)}
      units_sold: {type: int, desc: Units sold in week}
      units_forecast: {type: int, desc: Forecast for week}
      velocity_index: {type: float, desc: "Actual vs forecast ratio"}

  early_sales_alerts:
    key: alert_id
    cols:
      alert_id: {type: str, desc: "Alert, e.g. ALR-000123"}
      sku: {type: str, desc: SKU}
      alert_type: {type: enum, values: [chase, cancel], desc: Alert trigger type}
      trigger_threshold_pct: {type: float, desc: "Velocity threshold, % of forecast sales to date"}
      trigger_units: {type: int, desc: "Cumulative units sold by the end of the watch window that fires the alert"}
      launch_date: {type: date, desc: Launch date the alert counts weeks from}
      monitor_weeks: {type: int, desc: "Weeks after launch the alert watches, e.g. 3"}
      status: {type: enum, values: [active, triggered, inactive], desc: Alert status}
      created_at: {type: timestamp, desc: Created date}

  pipeline_products:
    key: pipeline_id
    cols:
      pipeline_id: {type: str, desc: "Pipeline item, e.g. PL-000123"}
      sku: {type: str, desc: SKU}
      product_name: {type: str, desc: Product name}
      launch_date: {type: date, desc: Planned launch date}
      season: {type: str, desc: "Season code, e.g. AW26"}
      category: {type: str, desc: Category}
      supply_risk: {type: enum, values: [low, medium, high], desc: Supply-chain risk}
      demand_risk: {type: enum, values: [low, medium, high], desc: Demand/sales risk}
      risk_score: {type: float, desc: "Overall risk score 0-100"}
      status: {type: enum, values: [draft, approved, in_production, launched], desc: Status}

  promotion_effects:
    key: promo_id
    cols:
      promo_id: {type: str, desc: "Promotion effect record, e.g. PRM-000123"}
      sku: {type: str, desc: SKU}
      category: {type: str, desc: Category}
      promo_mechanic: {type: str, desc: "Mechanic type, e.g. percentage_off"}
      period_start: {type: date, desc: Promotion start}
      period_end: {type: date, desc: Promotion end}
      uplift_pct: {type: float, desc: "Sales uplift during promotion %"}
      cannibalisation_pct: {type: float, desc: "Units from other items %"}
      pull_forward_pct: {type: float, desc: "Units from future weeks %"}

  daily_orders:
    key: [order_date, channel, region]
    cols:
      order_date: {type: date, desc: Order date}
      channel: {type: enum, values: [web, app, click_collect, marketplace], desc: Sales channel}
      region: {type: str, desc: "Region, e.g. UK North"}
      units: {type: int, desc: Units ordered}
      value_gbp: {type: float, desc: Order value in GBP}

  forecast_overrides:
    key: override_id
    cols:
      override_id: {type: str, desc: "Override, e.g. OVR-000123"}
      sku: {type: str, desc: SKU}
      category: {type: str, desc: Category}
      week_start: {type: date, desc: Week starting Monday}
      week_end: {type: date, desc: Week ending Sunday}
      override_pct: {type: float, desc: "Uplift or downside percentage"}
      override_units: {type: int, desc: "Forecast units per week set by the override (base case loads)"}
      override_type: {type: enum, values: [uplift, base_case, downside], desc: Type of override}
      reason: {type: text, desc: Why override was created}
      created_at: {type: timestamp, desc: Created date}

  demand_history_adjustments:
    key: adjustment_id
    cols:
      adjustment_id: {type: str, desc: "Adjustment, e.g. ADJ-000123"}
      sku: {type: str, desc: SKU}
      period_start: {type: date, desc: Period start}
      period_end: {type: date, desc: Period end}
      stockout_cause: {type: str, desc: "Why stock ran out"}
      units_lost: {type: int, desc: Estimated lost units}
      correction_method: {type: str, desc: "How to correct history"}
      stockout_days: {type: int, desc: Days the SKU was unavailable in the affected stores}
      stores_affected: {type: int, desc: Number of stores out of stock}

  dc_flow_forecast:
    key: [week_start, site_id]
    cols:
      week_start: {type: date, desc: Week starting Monday}
      site_id: {type: str, desc: "Distribution centre, e.g. DC1"}
      region: {type: str, desc: "DC region, e.g. UK Midlands"}
      inbound_units: {type: int, desc: "Units received into the DC in the week, all channels"}
      outbound_units: {type: int, desc: "Units shipped out of the DC in the week, online orders plus store replenishment"}

  lane_volume_forecast:
    key: [lane, week_start]
    cols:
      lane: {type: str, desc: "Transport lane code, e.g. DC1-ST150"}
      week_start: {type: date, desc: Week starting Monday}
      origin_site_id: {type: str, desc: "Origin DC"}
      dest_site_id: {type: str, desc: "Destination store"}
      region: {type: str, desc: "Destination region, e.g. UK North"}
      week_label: {type: str, desc: "Peak week name, e.g. black_friday_week, christmas_week"}
      pallets_forecast: {type: int, desc: Pallets forecast to move on the lane in the week}
      units_forecast: {type: int, desc: Units forecast to move on the lane in the week}

  long_range_volume:
    key: [period_start, site_id, scenario]
    cols:
      period_start: {type: date, desc: "Start of the 13-week quarter"}
      site_id: {type: str, desc: "Distribution centre, e.g. DC1"}
      scenario: {type: enum, values: [base, upside, downside], desc: Volume scenario}
      units_forecast: {type: int, desc: Outbound units through the DC in the quarter}
      annual_growth_pct: {type: float, desc: Annual volume growth assumed by the scenario}

  returns_forecast:
    key: returns_week
    cols:
      returns_week: {type: date, desc: Week starting Monday}
      returns_units: {type: int, desc: "Expected units arriving at the returns centre, base case"}
      low_units: {type: int, desc: Low end of the range}
      high_units: {type: int, desc: High end of the range}
      returns_value_gbp: {type: float, desc: Retail value of the expected returns}
      driver: {type: str, desc: Main driver of the weekly volume}

  forecast_config_changes:
    key: change_id
    cols:
      change_id: {type: str, desc: "Configuration change, e.g. CCH-000123"}
      config_id: {type: str, desc: Forecast configuration that changed}
      changed_at: {type: timestamp, desc: When the change took effect}
      parameter: {type: str, desc: "Setting changed, e.g. outlier_capping"}
      old_value: {type: str, desc: Value before the change}
      new_value: {type: str, desc: Value after the change}
      change_source: {type: str, desc: "What triggered it, e.g. vendor upgrade or manual change"}
      notes: {type: text, desc: What the change does}

  forecast_backtests:
    key: backtest_id
    cols:
      backtest_id: {type: str, desc: "Backtest record, e.g. BT-000123"}
      config_id: {type: str, desc: Forecast configuration tested}
      forecast_level: {type: enum, values: [sku, category, regional, national, store_sku, cluster], desc: Aggregation level tested}
      category: {type: str, desc: Category tested, blank when the level spans categories}
      period_start: {type: date, desc: Start of the holdout period}
      period_end: {type: date, desc: End of the holdout period}
      mape_pct: {type: float, desc: "Backtest MAPE %"}
      bias_pct: {type: float, desc: "Backtest bias %"}
      items_backtested: {type: int, desc: Items or series in the backtest}

  forecast_run_metrics:
    key: run_id
    cols:
      run_id: {type: str, desc: "Forecast run, e.g. RUN-000123"}
      config_id: {type: str, desc: Forecast configuration run}
      forecast_level: {type: enum, values: [sku, category, regional, national, store_sku, cluster], desc: Aggregation level run}
      run_date: {type: date, desc: Week the production run took place}
      series_count: {type: int, desc: Time series forecast in the run}
      run_minutes: {type: int, desc: Elapsed run time in minutes}
      compute_cost_gbp: {type: float, desc: Compute cost of the run in GBP}
      data_volume_gb: {type: float, desc: Data processed in GB}
      planner_review_hours: {type: float, desc: Planner hours spent reviewing exceptions from the run}

  vendor_capabilities:
    key: capability_id
    cols:
      capability_id: {type: str, desc: "Vendor capability, e.g. VC-000123"}
      capability: {type: str, desc: What the forecasting platform can do}
      item_type: {type: enum, values: [fast_mover, slow_mover, new_product], desc: Item classification it applies to}
      method_type: {type: str, desc: "Method, e.g. croston_sba"}
      support_status: {type: enum, values: [supported, licensed_not_enabled, roadmap, not_supported], desc: Platform support}
      enabled_in_config: {type: str, desc: Forecast configuration using it, blank when unused}
      notes: {type: text, desc: Licence, evidence and limits}

  driver_impacts:
    key: impact_id
    cols:
      impact_id: {type: str, desc: "Driver impact, e.g. DRV-000123"}
      category: {type: str, desc: Product category}
      market: {type: str, desc: "Market, e.g. UK or Germany"}
      driver: {type: str, desc: "Driver: weather, consumer_confidence, holidays, competitor_action"}
      winter: {type: str, desc: "Which winter, e.g. last winter"}
      period_start: {type: date, desc: Start of the winter window}
      period_end: {type: date, desc: End of the winter window}
      impact_pct: {type: float, desc: "Effect on weekly category units versus baseline, % (negative lowers demand)"}
      notes: {type: text, desc: What happened}

  model_regressors:
    key: regressor_id
    cols:
      regressor_id: {type: str, desc: "Regressor, e.g. REG-000123"}
      regressor: {type: str, desc: Name of the external input}
      driver: {type: str, desc: "Driver it represents: weather, consumer_confidence, holidays, competitor_action, price, promotion"}
      regressor_type: {type: str, desc: "Kind of input, e.g. calendar, weather, macro"}
      markets: {type: str, desc: "Markets covered, e.g. UK"}
      status: {type: enum, values: [in_model, tested_not_adopted, not_in_model], desc: Whether the forecast model uses it}
      lag_weeks: {type: int, desc: Weeks the input leads demand}
      notes: {type: text, desc: Why it is or is not used}

  new_product_results:
    key: result_id
    cols:
      result_id: {type: str, desc: "Launch review, e.g. NPR-000123"}
      sku: {type: str, desc: Launched SKU}
      sop_cycle: {type: date, desc: S&OP cycle in which the launch forecast was reviewed}
      mape_pct: {type: float, desc: "New product forecast error in the cycle, %"}
      demand_error_pct: {type: float, desc: "Assumed rate of sale versus actual, % (positive means over-forecast)"}
      timing_slip_weeks: {type: int, desc: Weeks the launch landed later than planned}
      distribution_gap_pct: {type: float, desc: "Stores ranged below the plan, %"}
      notes: {type: text, desc: Review comment}

  category_history:
    key: [category, period_date]
    cols:
      category: {type: str, desc: Product category}
      period_date: {type: date, desc: "Week start (Monday), before the SKU history begins"}
      units_sold: {type: int, desc: Units sold in the category in the week}
      revenue_gbp: {type: float, desc: Revenue in GBP}

  category_forecasts:
    key: [category, forecast_week, forecast_type]
    cols:
      category: {type: str, desc: Product category}
      forecast_week: {type: date, desc: Week starting Monday}
      forecast_type: {type: enum, values: [base, upside, downside], desc: Scenario type}
      units_forecast: {type: int, desc: Category units forecast for the week}

tools:
  - name: calculate_corrected_demand_history
    desc: Correct demand history for stockout-distorted weeks. Returns original and corrected weekly units, the adjustment and the method, spreading lost units over the stockout days.
    kind: sql
    args:
      sku: {required: true, desc: SKU}
      period_start: {type: date, required: true, desc: Start of period to correct}
      period_end: {type: date, required: true, desc: End of period}
    sql: |
      WITH w AS (
        SELECT h.history_id, h.sku, h.period_date, h.units_sold, a.correction_method,
               a.units_lost * (date_diff('day', GREATEST(h.period_date, a.period_start),
                                         LEAST(h.period_date + 6, a.period_end)) + 1) * 1.0
                 / (date_diff('day', a.period_start, a.period_end) + 1) AS share
        FROM demand_history h
        LEFT JOIN demand_history_adjustments a ON a.sku = h.sku
          AND a.period_start <= h.period_date + 6 AND a.period_end >= h.period_date
        WHERE h.sku = $sku AND h.period_date >= CAST($period_start AS DATE) AND h.period_date <= CAST($period_end AS DATE))
      SELECT w.history_id, w.sku, w.period_date, w.units_sold AS original_units,
             w.units_sold + CAST(ROUND(COALESCE(SUM(w.share), 0), 0) AS INTEGER) AS corrected_units,
             CAST(ROUND(COALESCE(SUM(w.share), 0), 0) AS INTEGER) AS adjustment,
             COALESCE(string_agg(DISTINCT w.correction_method, '; '), 'none') AS method,
             'Corrected demand = original + lost units spread over the stockout days' AS formula
      FROM w GROUP BY w.history_id, w.sku, w.period_date, w.units_sold
      ORDER BY w.period_date
    limit: 53
    example: {sku: SKU-100056, period_start: -13w, period_end: $as_of}

  - name: calculate_early_sales_trigger_thresholds
    desc: Chase and cancel thresholds for a launch's first weeks, weekly and cumulative units, from comparable launches. Chase above the high curve, cancel below the low curve.
    kind: sql
    args:
      sku:
        required: true
        desc: "New product SKU, e.g. SKU-103423"
      launch_week:
        type: date
        required: true
        desc: Launch week start (Monday)
      weeks:
        type: int
        desc: Weeks after launch to watch
        default: 3
    sql: |
      WITH me AS (SELECT category FROM master.products WHERE sku = $sku),
      comp AS (
        SELECT p.sku, CAST(date_trunc('week', CAST(p.launch_date AS DATE)) AS DATE) AS lw
        FROM master.products p, me
        WHERE p.category = me.category AND p.sku <> $sku
          AND CAST(date_trunc('week', CAST(p.launch_date AS DATE)) AS DATE) >= (SELECT MIN(period_date) FROM demand_history)
          AND CAST(p.launch_date AS DATE) <= CAST($as_of AS DATE) - INTERVAL 28 DAY),
      curve AS (
        SELECT date_diff('week', c.lw, h.period_date) + 1 AS wk, c.sku, h.units_sold
        FROM comp c JOIN demand_history h ON h.sku = c.sku
        WHERE date_diff('week', c.lw, h.period_date) + 1 BETWEEN 1 AND $weeks),
      agg AS (
        SELECT wk, ROUND(AVG(units_sold), 0) AS base_units, ROUND(quantile_cont(units_sold, 0.25), 0) AS cancel_units,
               ROUND(quantile_cont(units_sold, 0.75), 0) AS chase_units
        FROM curve GROUP BY wk)
      SELECT $sku AS sku, a.wk AS week_in_launch,
             CAST(date_trunc('week', CAST($launch_week AS DATE)) AS DATE) + CAST((a.wk - 1) * 7 AS INTEGER) AS week_start,
             a.base_units, a.chase_units AS chase_threshold_units, a.cancel_units AS cancel_threshold_units,
             SUM(a.chase_units) OVER (ORDER BY a.wk) AS cumulative_chase_units,
             SUM(a.cancel_units) OVER (ORDER BY a.wk) AS cumulative_cancel_units,
             ROUND(SUM(a.chase_units) OVER (ORDER BY a.wk) * 100.0 / SUM(a.base_units) OVER (ORDER BY a.wk), 0) AS chase_pct_of_base,
             ROUND(SUM(a.cancel_units) OVER (ORDER BY a.wk) * 100.0 / SUM(a.base_units) OVER (ORDER BY a.wk), 0) AS cancel_pct_of_base,
             'chase if cumulative sales exceed the 75th percentile of comparable launches; cancel if below the 25th' AS formula
      FROM agg a ORDER BY a.wk
    example:
      sku: SKU-103423
      launch_week: +14w


  - name: calculate_lost_demand_for_sku
    desc: Estimated lost units and lost revenue from stockouts for a SKU over a period, one row per recorded stockout with its adjustment id, cause and the SKU's product status.
    kind: sql
    args:
      sku: {required: true, desc: SKU}
      period_start: {type: date, required: true, desc: Period start}
      period_end: {type: date, required: true, desc: Period end}
    sql: |
      SELECT a.adjustment_id, a.sku, p.name AS product_name, p.status AS product_status,
             a.period_start, a.period_end, a.stockout_cause, a.units_lost,
             ROUND(a.units_lost * (SELECT COALESCE(SUM(h.revenue_gbp) / NULLIF(SUM(h.units_sold), 0), 0)
                                   FROM demand_history h WHERE h.sku = a.sku), 0) AS estimated_lost_revenue_gbp,
             SUM(a.units_lost) OVER () AS total_lost_units,
             a.correction_method,
             'lost_units * avg_unit_price' AS formula
      FROM demand_history_adjustments a JOIN master.products p ON p.sku = a.sku
      WHERE a.sku = $sku AND a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE)
      ORDER BY a.period_start
    limit: 20
    example: {sku: PF-220, period_start: -13w, period_end: $as_of}

  - name: calculate_lost_sales_for_product
    desc: Lost units, revenue and margin from recorded stockouts for a SKU or style over a period, with stockout days, stores hit and cause.
    kind: sql
    args:
      sku:
        desc: "SKU, e.g. SKU-101904; blank for all SKUs of the style"
      style_id:
        desc: "Style id, e.g. STY-5520; blank to use sku"
      period_start:
        type: date
        desc: Period start
        default: -90d
      period_end:
        type: date
        desc: Period end
        default: $as_of
    sql: |
      SELECT a.sku, p.style_id,
             string_agg(DISTINCT a.stockout_cause, '; ') AS stockout_cause,
             MAX(a.stockout_days) AS stockout_days, MAX(a.stores_affected) AS stores_affected,
             SUM(a.units_lost) AS lost_units,
             ROUND(SUM(a.units_lost) * CAST(p.retail_price_gbp AS DOUBLE), 0) AS lost_revenue_gbp,
             ROUND(SUM(a.units_lost) * (CAST(p.retail_price_gbp AS DOUBLE) - CAST(p.unit_cost_gbp AS DOUBLE)), 0) AS lost_margin_gbp,
             'lost_revenue = lost_units * retail_price; lost_margin = lost_units * (retail_price - unit_cost)' AS formula
      FROM demand_history_adjustments a JOIN master.products p ON p.sku = a.sku
      WHERE ($sku IS NULL OR a.sku = $sku) AND ($style_id IS NULL OR p.style_id = $style_id)
        AND a.period_end >= CAST($period_start AS DATE) AND a.period_start <= CAST($period_end AS DATE)
      GROUP BY a.sku, p.style_id, p.retail_price_gbp, p.unit_cost_gbp
      ORDER BY lost_units DESC
    limit: 20
    example: {style_id: STY-5520}


  - name: calculate_pipeline_risk_score
    desc: Calculate risk score for pipeline products combining supply, demand and execution risk. Returns 0-100 score and key risk drivers.
    kind: sql
    args:
      pipeline_id: {required: true, desc: Pipeline product id}
    sql: |
      SELECT p.pipeline_id, p.sku, p.product_name, p.launch_date,
             ROUND((CASE p.supply_risk WHEN 'low' THEN 20 WHEN 'medium' THEN 50 ELSE 80 END +
                    CASE p.demand_risk WHEN 'low' THEN 20 WHEN 'medium' THEN 50 ELSE 80 END) / 2, 0) AS risk_score,
             p.supply_risk, p.demand_risk,
             'risk_score = (supply_risk + demand_risk) / 2' AS formula
      FROM pipeline_products p
      WHERE p.pipeline_id = $pipeline_id
    example: {pipeline_id: "PL-900001"}

  - name: calculate_rollback_vs_tune_impact
    desc: Compare rolling back a configuration's latest change with tuning it. Returns current and pre-change MAPE, expected MAPE and effort for each option, and a recommendation.
    kind: sql
    args:
      config_id: {required: true, desc: Configuration to evaluate}
      period_start: {type: date, required: true, desc: Test period start}
      period_end: {type: date, required: true, desc: Test period end}
    sql: |
      WITH last AS (
        SELECT MAX(CAST(ch.changed_at AS DATE)) AS changed_on, COUNT(*) FILTER (WHERE CAST(ch.changed_at AS DATE) = (
                 SELECT MAX(CAST(c2.changed_at AS DATE)) FROM forecast_config_changes c2 WHERE c2.config_id = $config_id)) AS params_changed,
               arg_max(ch.parameter, ch.changed_at) AS parameter
        FROM forecast_config_changes ch WHERE ch.config_id = $config_id),
      acc AS (
        SELECT AVG(a.mape_pct) FILTER (WHERE a.period_end >= last.changed_on) AS now_mape,
               AVG(a.mape_pct) FILTER (WHERE a.period_end < last.changed_on) AS pre_mape
        FROM forecast_accuracy a, last
        WHERE a.config_id = $config_id AND a.forecast_level = 'category'
          AND a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE))
      SELECT c.config_id, c.config_name, last.parameter AS latest_change, last.changed_on AS change_date,
             ROUND(acc.now_mape, 1) AS current_mape_pct,
             ROUND(acc.pre_mape, 1) AS pre_change_mape_pct,
             ROUND(acc.pre_mape, 1) AS rollback_expected_mape_pct,
             ROUND(acc.now_mape - (acc.now_mape - acc.pre_mape) * 0.5, 1) AS tune_expected_mape_pct,
             last.params_changed * 1 AS rollback_effort_days,
             10 AS tune_effort_days,
             CASE WHEN acc.now_mape - acc.pre_mape > 3 AND last.params_changed <= 2 THEN 'rollback' ELSE 'tune' END AS recommendation,
             'rollback restores the pre-change MAPE in 1 day per setting; tuning assumed to recover half the gap in about 10 days' AS formula
      FROM forecast_configs c, last, acc
      WHERE c.config_id = $config_id
    example: {config_id: CFG-000001, period_start: -26w, period_end: "$as_of"}

  - name: calculate_stock_out_risk
    desc: Calculate probability of stock-out based on forecast, lead time and variability. Returns risk score 0-100 and recommended safety stock.
    kind: sql
    args:
      sku: {required: true, desc: SKU}
      forecast_weeks: {type: int, desc: "Forecast horizon in weeks", default: 4}
    sql: |
      SELECT f.sku,
             ROUND(COALESCE(SUM(CASE WHEN f.units_forecast > 0 THEN f.units_forecast ELSE 0 END) / NULLIF(COUNT(*), 0), 0), 0) AS avg_weekly_demand,
             ROUND(COALESCE(STDDEV_POP(f.units_forecast), 0), 0) AS demand_std_dev,
             ROUND(COALESCE(STDDEV_POP(f.units_forecast), 0) / NULLIF(AVG(f.units_forecast), 0) * 100, 1) AS cv_pct,
             ROUND(LEAST(COALESCE(STDDEV_POP(f.units_forecast), 0) * 1.645, 100), 0) AS stock_out_risk_score,
             'risk_score = min(cv * forecast * 1.645, 100)' AS formula
      FROM forecasts f
      WHERE f.sku = $sku AND f.forecast_type = 'base'
      GROUP BY f.sku
      LIMIT $forecast_weeks
    example: {sku: "SKU-100056"}

  - name: compare_forecast_accuracy_before_after_change
    desc: Compare a configuration's accuracy before and after a change date. Returns MAPE and bias before and after, the change, and whether the difference is statistically significant.
    kind: sql
    args:
      config_id: {required: true, desc: Changed configuration}
      change_date: {type: date, required: true, desc: Date change was applied}
    sql: |
      WITH s AS (
        SELECT (a.period_end >= CAST($change_date AS DATE)) AS is_after, COUNT(*) AS n, AVG(a.mape_pct) AS m,
               VAR_SAMP(a.mape_pct) AS v, AVG(a.bias_pct) AS b
        FROM forecast_accuracy a WHERE a.config_id = $config_id AND a.forecast_level = 'category' GROUP BY 1),
      bef AS (SELECT * FROM s WHERE NOT is_after), aft AS (SELECT * FROM s WHERE is_after)
      SELECT c.config_id, c.config_name, CAST($change_date AS DATE) AS change_date,
             ROUND(bef.m, 1) AS before_mape_pct, ROUND(aft.m, 1) AS after_mape_pct,
             ROUND(aft.m - bef.m, 1) AS change_pts,
             ROUND((aft.m - bef.m) / NULLIF(bef.m, 0) * 100, 1) AS change_pct,
             ROUND(bef.b, 1) AS before_bias_pct, ROUND(aft.b, 1) AS after_bias_pct,
             bef.n AS observations_before, aft.n AS observations_after,
             ROUND((aft.m - bef.m) / NULLIF(sqrt(bef.v / bef.n + aft.v / aft.n), 0), 1) AS t_stat,
             CASE WHEN abs((aft.m - bef.m) / NULLIF(sqrt(bef.v / bef.n + aft.v / aft.n), 0)) > 2 THEN 'Yes' ELSE 'No' END AS significant,
             'change_pct = (after - before) / before * 100; significant when |t| > 2' AS formula
      FROM forecast_configs c, bef, aft
      WHERE c.config_id = $config_id
    example: {config_id: CFG-000001, change_date: -8w}

  - name: compare_forecast_accuracy_by_history_window
    desc: Compare forecast accuracy for different history windows (26-week vs 52-week). Returns MAPE by window for the same items.
    kind: sql
    args:
      category: {desc: "Product category"}
      period_start: {type: date, desc: Evaluation period start, default: "-52w"}
      period_end: {type: date, desc: Evaluation period end, default: "$as_of"}
    sql: |
      SELECT
             c.history_window_weeks,
             ROUND(AVG(a.mape_pct), 1) AS mape_pct,
             COUNT(DISTINCT a.sku) AS skus_evaluated,
             'Lower history window better for fashion, higher for stable categories' AS insight
      FROM forecast_configs c
      LEFT JOIN forecast_accuracy a ON c.config_id = a.config_id
        AND a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE)
      WHERE ($category IS NULL OR a.category = $category)
      GROUP BY c.history_window_weeks
      ORDER BY c.history_window_weeks
    example: {category: "Outerwear"}

  - name: compare_forecast_accuracy_by_level
    desc: Compare live forecast accuracy at different aggregation levels (store-SKU, cluster, SKU, category, regional) for an item type or category. Returns MAPE, bias and items by level.
    kind: sql
    args:
      category: {desc: Product category}
      item_type: {desc: "Item type: fast_mover, slow_mover, new_product"}
      period_start: {type: date, desc: Period start, default: "-13w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT a.forecast_level,
             ROUND(AVG(a.mape_pct), 1) AS mape_pct,
             ROUND(AVG(a.bias_pct), 1) AS bias_pct,
             COUNT(DISTINCT COALESCE(a.sku, a.category)) AS items_evaluated,
             'Aggregating to a higher level usually lowers error but hides store and cluster detail' AS insight
      FROM forecast_accuracy a JOIN forecast_configs c ON c.config_id = a.config_id
      WHERE ($category IS NULL OR a.category = $category)
        AND ($item_type IS NULL OR c.item_type = $item_type)
        AND a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE)
      GROUP BY a.forecast_level
      ORDER BY ROUND(AVG(a.mape_pct), 1)
    example: {category: Dresses}

  - name: create_early_sales_alert
    desc: Create a monitoring alert for a new product's early sales that fires when cumulative units cross a chase or cancel threshold. Returns the alert.
    kind: insert
    table: early_sales_alerts
    id_prefix: ALR-
    defaults:
      status: active
    args:
      sku:
        required: true
        desc: "New product SKU, e.g. SKU-103423"
      alert_type:
        required: true
        desc: chase or cancel
      trigger_units:
        required: true
        type: int
        desc: Cumulative units by the end of the watch window that fires the alert
      trigger_threshold_pct:
        type: float
        desc: Threshold as % of forecast sales to date
      launch_date:
        required: true
        type: date
        desc: Launch date the weeks are counted from
      monitor_weeks:
        type: int
        desc: Weeks after launch to watch
    example:
      sku: SKU-103423
      alert_type: chase
      trigger_units: 400
      trigger_threshold_pct: 130.0
      launch_date: +14w
      monitor_weeks: 3

  - name: create_forecast_model_configuration
    desc: Create a test forecast configuration with different parameters (e.g. different history window). Returns config id and parameters.
    kind: insert
    table: forecast_configs
    id_prefix: CFG-
    args:
      config_name: {required: true, desc: "Name, e.g. '26-week history'"}
      history_window_weeks: {required: true, type: int, desc: "Historical weeks to use, e.g. 26 or 52"}
      method_type: {required: true, desc: "Method like exponential_smoothing"}
      item_type: {required: true, desc: "fast_mover, slow_mover or new_product"}
      notes: {desc: Configuration notes}
    defaults: {status: test}
    example: {config_name: "26-week fashion test", history_window_weeks: 26, method_type: exponential_smoothing, item_type: fast_mover, notes: "Testing shorter window for fashion"}

  - name: create_forecast_override
    desc: Add a manual forecast override for a SKU or category and weeks, as a percentage uplift or downside, or as base-case units per week. Returns the stored override.
    kind: insert
    table: forecast_overrides
    id_prefix: OVR-
    args:
      sku:
        desc: "SKU the override applies to, e.g. SKU-103423; blank for a category-wide override"
      category:
        desc: Category
      week_start:
        required: true
        type: date
        desc: Week starting Monday
      week_end:
        required: true
        type: date
        desc: Week ending Sunday
      override_pct:
        type: float
        desc: Percentage uplift/downside, e.g. 25.0
      override_units:
        type: int
        desc: Forecast units per week, for a base case
      override_type:
        required: true
        desc: uplift, base_case or downside
      reason:
        required: true
        desc: Why override is needed
    example:
      category: Kitchenware
      week_start: $as_of
      week_end: +7d
      override_pct: 25.0
      override_type: uplift
      reason: 25% off promotion


  - name: get_backtest_vs_live_accuracy_evidence
    desc: Backtest versus live MAPE by forecast configuration and method, with the gap in points, showing whether backtests predict real performance. Leave config blank for all.
    kind: sql
    args:
      config_id: {desc: Forecast configuration; blank for all}
      method_type: {desc: "Forecast method, e.g. comparable_products"}
    sql: |
      WITH bt AS (
        SELECT b.config_id, ROUND(AVG(b.mape_pct), 1) AS backtest_mape_pct, SUM(b.items_backtested) AS items_backtested
        FROM forecast_backtests b GROUP BY b.config_id),
      live AS (
        SELECT a.config_id, ROUND(AVG(a.mape_pct), 1) AS live_mape_pct
        FROM forecast_accuracy a WHERE a.period_end >= CAST($as_of AS DATE) - INTERVAL 91 DAY GROUP BY a.config_id)
      SELECT c.config_id, c.config_name, c.method_type, c.item_type, bt.backtest_mape_pct, live.live_mape_pct,
             ROUND(live.live_mape_pct - bt.backtest_mape_pct, 1) AS gap_pts, bt.items_backtested,
             'Backtest = historical holdout; live = last 13 weeks in production' AS definition
      FROM forecast_configs c JOIN bt ON bt.config_id = c.config_id JOIN live ON live.config_id = c.config_id
      WHERE ($config_id IS NULL OR c.config_id = $config_id) AND ($method_type IS NULL OR c.method_type LIKE '%' || $method_type || '%')
      ORDER BY c.config_id
    example: {config_id: CFG-000004}

  - name: get_cannibalisation_and_pull_forward_estimates
    desc: Get cannibalisation and pull-forward effects for promotions. Shows incremental versus displaced sales.
    kind: sql
    args:
      promo_mechanic: {desc: "Promotion mechanic, e.g. percentage_off"}
      period_start: {type: date, desc: Period to analyze, default: "-52w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT p.promo_mechanic,
             ROUND(AVG(p.uplift_pct), 1) AS avg_uplift_pct,
             ROUND(AVG(p.cannibalisation_pct), 1) AS avg_cannibalisation_pct,
             ROUND(AVG(p.pull_forward_pct), 1) AS avg_pull_forward_pct,
             ROUND(AVG(p.uplift_pct) - AVG(p.cannibalisation_pct) - AVG(p.pull_forward_pct), 1) AS incremental_pct,
             'incremental = uplift - cannibalisation - pull_forward' AS formula
      FROM promotion_effects p
      WHERE ($promo_mechanic IS NULL OR p.promo_mechanic = $promo_mechanic)
        AND p.period_start >= CAST($period_start AS DATE) AND p.period_end <= CAST($period_end AS DATE)
      GROUP BY p.promo_mechanic
    example: {promo_mechanic: "percentage_off"}

  - name: get_cannibalisation_estimates_for_category
    desc: Get cannibalisation effect for promotions by category. Shows what % of uplift comes from other items.
    kind: sql
    args:
      category: {required: true, desc: Product category}
      period_start: {type: date, desc: Period start, default: "-52w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT p.category, p.promo_mechanic,
             ROUND(AVG(p.uplift_pct), 1) AS uplift_pct,
             ROUND(AVG(p.cannibalisation_pct), 1) AS cannibalisation_pct,
             ROUND(COALESCE(AVG(p.cannibalisation_pct), 0) / NULLIF(AVG(p.uplift_pct), 0) * 100, 1) AS cannib_of_uplift_pct,
             COUNT(*) AS promo_instances
      FROM promotion_effects p
      WHERE p.category = $category AND p.period_start >= CAST($period_start AS DATE) AND p.period_end <= CAST($period_end AS DATE)
      GROUP BY p.category, p.promo_mechanic
    example: {category: "Toiletries"}

  - name: get_category_demand_history_by_period
    desc: Units, revenue and average price by category for any past period, including earlier years, weekly, monthly or as one total per category. Leave category blank to compare all categories.
    kind: sql
    args:
      category: {desc: Product category; blank for all categories}
      period_start: {type: date, desc: Period start, default: "-26w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
      grain: {desc: "week, month or total (one row per category)", default: week}
    sql: |
      WITH h AS (
        SELECT category, period_date, SUM(units_sold) AS units, SUM(revenue_gbp) AS rev FROM demand_history GROUP BY category, period_date
        UNION ALL
        SELECT category, period_date, units_sold, revenue_gbp FROM category_history),
      f AS (
        SELECT category,
               CASE lower($grain) WHEN 'total' THEN CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE)
                    WHEN 'month' THEN CAST(date_trunc('month', period_date) AS DATE) ELSE period_date END AS period_date,
               units, rev
        FROM h
        WHERE ($category IS NULL OR category = $category)
          AND period_date >= CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE) AND period_date <= CAST($period_end AS DATE))
      SELECT f.category, f.period_date, SUM(f.units) AS units_sold, ROUND(SUM(f.rev), 0) AS revenue_gbp,
             ROUND(SUM(f.rev) / NULLIF(SUM(f.units), 0), 2) AS avg_price_gbp
      FROM f GROUP BY f.category, f.period_date
      ORDER BY f.period_date DESC, f.category
    limit: 60
    example: {category: Dresses}

  - name: get_category_forecast
    desc: Category demand forecast with base, upside and downside units, by week or as one total per category for a period. Leave category blank to see all categories.
    kind: sql
    args:
      category: {desc: Product category; blank for all categories}
      period_start: {type: date, desc: Forecast period start, default: "$as_of"}
      period_end: {type: date, desc: Forecast period end, default: "+12w"}
      grain: {desc: "week or total (one row per category)", default: week}
    sql: |
      SELECT f.category,
             CASE WHEN lower($grain) = 'total' THEN CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE) ELSE f.forecast_week END AS period_start,
             SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'base') AS base_units,
             SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'upside') AS upside_units,
             SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'downside') AS downside_units,
             COUNT(DISTINCT f.forecast_week) AS weeks
      FROM category_forecasts f
      WHERE ($category IS NULL OR f.category = $category)
        AND f.forecast_week >= CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE)
        AND f.forecast_week <= CAST($period_end AS DATE)
      GROUP BY f.category, 2
      ORDER BY period_start, f.category
    limit: 60
    example: {category: Audio}

  - name: get_configuration_change_log
    desc: Log of forecast configuration changes, newest first, showing when each setting changed, old and new values, and what triggered it (for example a vendor upgrade resetting a default).
    kind: sql
    args:
      config_id: {desc: Specific configuration}
      period_start: {type: date, desc: Changes since, default: "-26w"}
      period_end: {type: date, desc: Changes until, default: "$as_of"}
    sql: |
      SELECT ch.change_id, ch.config_id, c.config_name, ch.changed_at, ch.parameter, ch.old_value, ch.new_value,
             ch.change_source, ch.notes
      FROM forecast_config_changes ch JOIN forecast_configs c ON c.config_id = ch.config_id
      WHERE ($config_id IS NULL OR ch.config_id = $config_id)
        AND CAST(ch.changed_at AS DATE) >= CAST($period_start AS DATE) AND CAST(ch.changed_at AS DATE) <= CAST($period_end AS DATE)
      ORDER BY ch.changed_at DESC
    limit: 30
    example: {}

  - name: get_current_forecast_method_for_item_type
    desc: The active forecast method for an item type (fast mover, slow mover, new product) with history window, parameters and number of items using it.
    kind: sql
    args:
      item_type: {required: true, desc: "fast_mover, slow_mover or new_product"}
    sql: |
      SELECT c.item_type, c.config_id, c.config_name, c.method_type, c.history_window_weeks, c.parameters,
             CASE WHEN c.item_type = 'new_product' THEN (SELECT COUNT(*) FROM master.products WHERE status = 'new')
                  ELSE COUNT(DISTINCT f.sku) END AS items_using_method,
             'Active configuration for this item type' AS status
      FROM forecast_configs c
      LEFT JOIN forecasts f ON c.config_id = f.config_id
      WHERE c.item_type = $item_type AND c.status = 'active'
      GROUP BY c.item_type, c.config_id, c.config_name, c.method_type, c.history_window_weeks, c.parameters
    example: {item_type: new_product}

  - name: get_current_process_forecast_accuracy
    desc: Accuracy of the existing active forecasting process. Returns current MAPE by category.
    kind: sql
    args:
      period_start: {type: date, desc: Period start, default: "-13w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT a.forecast_level,
             ROUND(AVG(a.mape_pct), 1) AS mape_pct,
             ROUND(AVG(a.bias_pct), 1) AS bias_pct,
             COUNT(DISTINCT COALESCE(a.sku, a.category)) AS items,
             'Current live forecast accuracy' AS measure
      FROM forecast_accuracy a
      WHERE a.config_id IN (SELECT config_id FROM forecast_configs WHERE status = 'active')
        AND a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE)
      GROUP BY a.forecast_level
    example: {}

  - name: get_daily_orders_history
    desc: Retrieve daily orders history by channel and region. For capacity and fulfillment planning.
    kind: sql
    args:
      channel: {desc: "Sales channel: web, app, click_collect, marketplace"}
      region: {desc: "Region, e.g. UK North"}
      period_start: {type: date, desc: Period start, default: "-28d"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT o.order_date, o.channel, o.region,
             SUM(o.units) AS units,
             ROUND(SUM(o.value_gbp), 0) AS value_gbp,
             ROUND(SUM(o.value_gbp) / NULLIF(SUM(o.units), 0), 2) AS avg_order_value_gbp
      FROM daily_orders o
      WHERE ($channel IS NULL OR o.channel = $channel)
        AND ($region IS NULL OR o.region = $region)
        AND o.order_date >= CAST($period_start AS DATE) AND o.order_date <= CAST($period_end AS DATE)
      GROUP BY o.order_date, o.channel, o.region
      ORDER BY o.order_date DESC
    limit: 60
    example: {channel: web}

  - name: get_demand_history_for_sku
    desc: Retrieve demand history for a SKU by week. Returns actual and corrected demand with stockout flags.
    kind: sql
    args:
      sku: {required: true, desc: SKU}
      period_start: {type: date, desc: Period start, default: "-52w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT h.history_id, h.sku, h.period_date,
             h.units_sold, h.revenue_gbp,
             CASE WHEN h.demand_type = 'corrected' THEN 'Yes' ELSE 'No' END AS corrected,
             h.correction_reason
      FROM demand_history h
      WHERE h.sku = $sku AND h.period_date >= CAST($period_start AS DATE) AND h.period_date <= CAST($period_end AS DATE)
      ORDER BY h.period_date DESC
    limit: 110
    example: {sku: "PF-220"}

  - name: get_forecast_accuracy_by_category
    desc: Current forecast accuracy by category. Shows MAPE, bias and error distribution.
    kind: sql
    args:
      period_start: {type: date, desc: Period start, default: "-13w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT a.category,
             ROUND(AVG(a.mape_pct), 1) AS mape_pct,
             ROUND(AVG(a.bias_pct), 1) AS bias_pct,
             COUNT(DISTINCT a.sku) AS skus,
             'Lower MAPE = better accuracy' AS note
      FROM forecast_accuracy a
      WHERE a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE)
      GROUP BY a.category
      ORDER BY ROUND(AVG(a.mape_pct), 1) DESC
    limit: 30
    example: {}

  - name: get_forecast_bias_by_market
    desc: Forecast bias by market for a period and optional category, showing whether forecasts over or under-estimate (positive means over-forecast).
    kind: sql
    args:
      category:
        desc: Product category, e.g. Outerwear; blank for all
      period_start:
        type: date
        desc: Period start
        default: -13w
      period_end:
        type: date
        desc: Period end
        default: $as_of
    sql: |
      SELECT b.market,
             ROUND(AVG(b.bias_pct), 1) AS bias_pct,
             COUNT(*) AS observations,
             CASE WHEN AVG(b.bias_pct) > 10 THEN 'Overforecasting' WHEN AVG(b.bias_pct) < -10 THEN 'Underforecasting' ELSE 'Balanced' END AS bias_direction,
             mode(b.primary_driver) AS main_driver
      FROM forecast_bias b
      WHERE ($category IS NULL OR b.category = $category)
        AND b.period_end >= CAST($period_start AS DATE) AND b.period_start <= CAST($period_end AS DATE)
      GROUP BY b.market
      ORDER BY AVG(b.bias_pct) DESC
    limit: 20
    example:
      category: Outerwear


  - name: get_forecast_bias_for_category
    desc: Forecast bias for a category by week and overall (positive means over-forecast). For the split by driver use get_forecast_error_decomposition.
    kind: sql
    args:
      category:
        required: true
        desc: Product category
      period_start:
        type: date
        desc: Period start
        default: -4w
      period_end:
        type: date
        desc: Period end
        default: $as_of
    sql: |
      SELECT COALESCE(CAST(b.period_start AS VARCHAR), 'overall') AS week_start,
             ROUND(AVG(b.bias_pct), 1) AS bias_pct,
             COUNT(DISTINCT b.market) AS markets,
             CASE WHEN AVG(b.bias_pct) > 10 THEN 'Overforecasting' WHEN AVG(b.bias_pct) < -10 THEN 'Underforecasting' ELSE 'Balanced' END AS bias_direction
      FROM forecast_bias b
      WHERE b.category = $category
        AND b.period_end >= CAST($period_start AS DATE) AND b.period_start <= CAST($period_end AS DATE)
      GROUP BY ROLLUP(b.period_start)
      ORDER BY GROUPING(b.period_start), b.period_start
    limit: 20
    example:
      category: Outerwear


  - name: get_forecast_error_by_category
    desc: Forecast error and bias by category and period. Shows MAPE trends over time.
    kind: sql
    args:
      category: {desc: Product category}
      period_start: {type: date, desc: Period start, default: "-26w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT a.category, a.period_end,
             ROUND(AVG(a.mape_pct), 1) AS mape_pct,
             ROUND(AVG(a.bias_pct), 1) AS bias_pct,
             COUNT(DISTINCT a.sku) AS skus
      FROM forecast_accuracy a
      WHERE ($category IS NULL OR a.category = $category)
        AND a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE)
      GROUP BY a.category, a.period_end
      ORDER BY a.period_end DESC
    limit: 26
    example: {category: "Dresses"}

  - name: get_forecast_error_by_lead_time
    desc: Forecast error by supplier lead time. Shows whether shorter lead times improve accuracy.
    kind: sql
    args:
      category: {desc: Product category}
      period_start: {type: date, desc: Period start, default: "-52w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT
             CASE WHEN CAST(p.lead_time_days AS INT) < 30 THEN 'Short (< 30d)'
                  WHEN CAST(p.lead_time_days AS INT) < 60 THEN 'Medium (30-60d)'
                  ELSE 'Long (> 60d)' END AS lead_time_bucket,
             ROUND(AVG(a.mape_pct), 1) AS mape_pct,
             COUNT(DISTINCT a.sku) AS skus,
             'Shorter lead times typically = better forecast accuracy' AS insight
      FROM forecast_accuracy a
      JOIN master.products p ON a.sku = p.sku
      WHERE ($category IS NULL OR a.category = $category)
        AND a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE)
      GROUP BY lead_time_bucket, CAST(p.lead_time_days AS INT)
      ORDER BY CAST(p.lead_time_days AS INT)
    example: {category: "Audio"}

  - name: get_forecast_error_decomposition
    desc: Decompose forecast bias for a category by driver (weather, promotion, pricing, store cluster, new launches) in percentage points, units and explanation.
    kind: sql
    args:
      category:
        required: true
        desc: Product category
      period_start:
        type: date
        desc: Period start
        default: -4w
      period_end:
        type: date
        desc: Period end
        default: $as_of
    sql: |
      SELECT e.category, e.error_driver,
             ROUND(AVG(e.error_pct), 1) AS bias_points,
             ROUND(AVG(e.error_pct) * 100.0 / SUM(AVG(e.error_pct)) OVER (), 0) AS share_of_bias_pct,
             ROUND(SUM(AVG(e.error_pct)) OVER (), 1) AS total_bias_points,
             COALESCE(SUM(e.error_units), 0) AS total_error_units,
             MIN(e.explanation) AS explanation
      FROM forecast_errors e
      WHERE e.category = $category
        AND e.period_end >= CAST($period_start AS DATE) AND e.period_start <= CAST($period_end AS DATE)
      GROUP BY e.category, e.error_driver
      ORDER BY bias_points DESC
    example:
      category: Outerwear


  - name: get_forecast_model_settings
    desc: Current forecast model settings, method, history window and parameters, by item type and category, with the number of items using each configuration and its last change.
    kind: sql
    args:
      item_type: {desc: "Item type: fast_mover, slow_mover, new_product"}
      category: {desc: Product category}
      status: {desc: "Configuration status: active, test or archived", default: active}
    sql: |
      SELECT c.config_id, c.config_name, c.item_type, c.method_type, c.history_window_weeks, c.parameters, c.categories,
             c.status,
             CASE WHEN c.item_type = 'new_product' THEN (SELECT COUNT(*) FROM master.products WHERE status = 'new')
                  ELSE COUNT(DISTINCT f.sku) END AS items_using_config,
             (SELECT MAX(ch.changed_at) FROM forecast_config_changes ch WHERE ch.config_id = c.config_id) AS last_changed
      FROM forecast_configs c
      LEFT JOIN forecasts f ON c.config_id = f.config_id
      WHERE ($item_type IS NULL OR c.item_type = $item_type)
        AND ($category IS NULL OR c.categories = 'all' OR c.categories LIKE '%' || $category || '%')
        AND c.status = $status
      GROUP BY c.config_id, c.config_name, c.item_type, c.method_type, c.history_window_weeks, c.parameters, c.categories, c.status
      ORDER BY c.config_id
    example: {item_type: fast_mover}

  - name: get_forecast_run_effort_metrics
    desc: Effort to produce forecasts by aggregation level, with series count, run time, compute cost, data volume and planner review hours per weekly run. Compare levels for an item type.
    kind: sql
    args:
      item_type: {desc: "Item type: fast_mover, slow_mover, new_product"}
      period_start: {type: date, desc: Period start, default: "-13w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT m.forecast_level, c.item_type, COUNT(*) AS runs,
             CAST(ROUND(AVG(m.series_count), 0) AS BIGINT) AS series_per_run,
             ROUND(AVG(m.run_minutes), 0) AS avg_run_minutes,
             ROUND(AVG(m.compute_cost_gbp), 2) AS avg_compute_cost_gbp,
             ROUND(AVG(m.data_volume_gb), 1) AS avg_data_gb,
             ROUND(AVG(m.planner_review_hours), 1) AS avg_planner_review_hours,
             'Effort per weekly production run' AS note
      FROM forecast_run_metrics m JOIN forecast_configs c ON c.config_id = m.config_id
      WHERE ($item_type IS NULL OR c.item_type = $item_type)
        AND m.run_date >= CAST($period_start AS DATE) AND m.run_date <= CAST($period_end AS DATE)
      GROUP BY m.forecast_level, c.item_type
      ORDER BY avg_run_minutes DESC
    example: {}

  - name: get_forecast_vendor_capabilities
    desc: Forecasting platform capabilities by item type (new product, intermittent or slow item, regressors, hierarchy) with support status, whether switched on and which configuration uses it.
    kind: select
    from: vendor_capabilities
    filters:
      item_type: {}
      method_type: {op: like}
      support_status: {}
    columns: [capability_id, capability, item_type, method_type, support_status, enabled_in_config, notes]
    order: capability_id
    limit: 20
    example: {item_type: new_product}

  - name: get_historic_driver_impact_on_category
    desc: Effect of external drivers (weather, consumer confidence, holidays, competitor action) on a category's demand in past winters, by market, and whether the model already uses each.
    kind: sql
    args:
      category: {required: true, desc: Product category}
      market: {desc: "Market, UK or Germany; blank for both"}
      driver: {desc: "Driver: weather, consumer_confidence, holidays, competitor_action"}
      period_start: {type: date, desc: Earliest winter to include, default: "-104w"}
      period_end: {type: date, desc: Latest winter to include, default: "$as_of"}
    sql: |
      SELECT d.category, d.market, d.driver,
             ROUND(AVG(d.impact_pct), 1) AS avg_impact_pct,
             MIN(d.impact_pct) AS min_impact_pct, MAX(d.impact_pct) AS max_impact_pct,
             COUNT(*) AS winters,
             string_agg(d.winter || ' ' || CAST(d.impact_pct AS VARCHAR), '; ' ORDER BY d.period_start) AS by_winter,
             CASE WHEN EXISTS (SELECT 1 FROM model_regressors r WHERE r.driver = d.driver AND r.status = 'in_model'
                               AND r.markets LIKE '%' || d.market || '%') THEN 'Yes' ELSE 'No' END AS in_forecast_model
      FROM driver_impacts d
      WHERE d.category = $category
        AND ($market IS NULL OR lower(d.market) = lower($market))
        AND ($driver IS NULL OR d.driver LIKE '%' || lower($driver) || '%')
        AND d.period_end >= CAST($period_start AS DATE) AND d.period_start <= CAST($period_end AS DATE)
      GROUP BY d.category, d.market, d.driver
      ORDER BY d.market DESC, ABS(AVG(d.impact_pct)) DESC
    limit: 30
    example: {category: "Outerwear"}

  - name: get_new_product_forecast_accuracy
    desc: Forecast accuracy of recent new product launches, worst first, with the demand, timing and distribution assumption errors from the S&OP reviews and which assumptions were missed.
    kind: sql
    args:
      period_start: {type: date, desc: Earliest launch date, default: "-52w"}
      period_end: {type: date, desc: Latest launch date, default: "$as_of"}
    sql: |
      SELECT p.sku, p.product_name, p.category, p.launch_date, p.status,
             COUNT(*) AS cycles_reviewed,
             ROUND(AVG(r.mape_pct), 1) AS mape_pct,
             ROUND(AVG(r.demand_error_pct), 1) AS demand_error_pct,
             MAX(r.timing_slip_weeks) AS timing_slip_weeks,
             ROUND(AVG(r.distribution_gap_pct), 1) AS distribution_gap_pct,
             concat_ws(', ', CASE WHEN AVG(r.demand_error_pct) > 15 THEN 'demand' END,
                             CASE WHEN MAX(r.timing_slip_weeks) >= 1 THEN 'timing' END,
                             CASE WHEN AVG(r.distribution_gap_pct) > 10 THEN 'distribution' END) AS assumptions_missed,
             'Positive demand error = forecast above actual sales' AS note
      FROM pipeline_products p JOIN new_product_results r ON r.sku = p.sku
      WHERE p.status IN ('launched', 'in_production')
        AND p.launch_date >= CAST($period_start AS DATE) AND p.launch_date <= CAST($period_end AS DATE)
      GROUP BY p.sku, p.product_name, p.category, p.launch_date, p.status
      ORDER BY mape_pct DESC
    limit: 30
    example: {}

  - name: get_past_promotion_uplift_by_mechanic
    desc: Retrieve past promotion uplift by mechanic type. Shows typical uplift for different promotion types.
    kind: sql
    args:
      mechanic: {desc: "Promotion mechanic, e.g. percentage_off, bundle, buy_one_get_one"}
      category: {desc: Product category}
      period_start: {type: date, desc: Period start, default: "-104w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT p.promo_mechanic, p.category,
             ROUND(AVG(p.uplift_pct), 1) AS avg_uplift_pct,
             ROUND(MAX(p.uplift_pct), 1) AS max_uplift_pct,
             ROUND(MIN(p.uplift_pct), 1) AS min_uplift_pct,
             COUNT(*) AS instances
      FROM promotion_effects p
      WHERE ($mechanic IS NULL OR p.promo_mechanic = $mechanic)
        AND ($category IS NULL OR p.category = $category)
        AND p.period_start >= CAST($period_start AS DATE) AND p.period_end <= CAST($period_end AS DATE)
      GROUP BY p.promo_mechanic, p.category
      ORDER BY avg_uplift_pct DESC
    example: {mechanic: "percentage_off"}

  - name: get_peak_inbound_forecast
    desc: Forecast inbound receipts and outbound shipments by DC across the peak (Black Friday to end of December), with uplift on recent weeks and busiest week.
    kind: sql
    args:
      region:
        desc: "DC region, e.g. UK Midlands; blank for all DCs"
      site_id:
        desc: "Distribution centre, e.g. DC1; blank for all DCs"
      peak_start:
        type: date
        desc: Peak start, Black Friday week
        default: +7w
      peak_end:
        type: date
        desc: Peak end, end of December
        default: +12w
    sql: |
      WITH win AS (
        SELECT f.* FROM dc_flow_forecast f
        WHERE ($region IS NULL OR f.region = $region) AND ($site_id IS NULL OR f.site_id = $site_id)
          AND f.week_start >= CAST(date_trunc('week', CAST($peak_start AS DATE)) AS DATE)
          AND f.week_start <= CAST($peak_end AS DATE)),
      recent AS (
        SELECT f.site_id, SUM(f.inbound_units) AS inb, SUM(f.outbound_units) AS outb
        FROM dc_flow_forecast f
        WHERE f.week_start >= CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE) - INTERVAL 8 WEEK
          AND f.week_start < CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE)
          AND ($region IS NULL OR f.region = $region) AND ($site_id IS NULL OR f.site_id = $site_id)
        GROUP BY f.site_id),
      per_site AS (
        SELECT w.site_id, w.region, SUM(w.inbound_units) AS peak_inbound_units, SUM(w.outbound_units) AS peak_outbound_units,
               ROUND(AVG(w.inbound_units), 0) AS avg_weekly_inbound, COUNT(*) AS weeks,
               CAST(arg_max(w.week_start, w.inbound_units) AS VARCHAR) AS busiest_inbound_week,
               MAX(w.inbound_units) AS busiest_week_inbound_units,
               ROUND((AVG(w.inbound_units) / (MAX(r.inb) / 8.0) - 1) * 100, 0) AS inbound_uplift_pct_vs_last_8_weeks
        FROM win w JOIN recent r USING (site_id) GROUP BY w.site_id, w.region),
      wk AS (SELECT week_start, SUM(inbound_units) AS inb FROM win GROUP BY week_start),
      tot AS (
        SELECT 'ALL' AS site_id, 'All DCs' AS region, SUM(w.inbound_units) AS peak_inbound_units,
               SUM(w.outbound_units) AS peak_outbound_units,
               ROUND(SUM(w.inbound_units) / COUNT(DISTINCT w.week_start), 0) AS avg_weekly_inbound,
               COUNT(DISTINCT w.week_start) AS weeks,
               CAST((SELECT arg_max(week_start, inb) FROM wk) AS VARCHAR) AS busiest_inbound_week,
               (SELECT MAX(inb) FROM wk) AS busiest_week_inbound_units,
               ROUND((SUM(w.inbound_units) / COUNT(DISTINCT w.week_start) / ((SELECT SUM(inb) FROM recent) / 8.0) - 1) * 100, 0) AS inbound_uplift_pct_vs_last_8_weeks
        FROM win w)
      SELECT * FROM (SELECT * FROM tot UNION ALL SELECT * FROM per_site) u ORDER BY CASE WHEN u.site_id = 'ALL' THEN 0 ELSE 1 END, u.site_id
    limit: 10
    example: {}


  - name: get_peak_order_volume_forecast_by_region
    desc: Peak online order units and value by region with each region's share, busiest day and growth on last year's peak. Use for courier capacity by region.
    kind: sql
    args:
      peak_start:
        type: date
        desc: Peak start, Black Friday week
        default: +7w
      peak_end:
        type: date
        desc: Peak end, last pre-Christmas order day
        default: +11w
    sql: |
      WITH cur AS (
        SELECT o.region, o.order_date, SUM(o.units) AS units, SUM(o.value_gbp) AS value_gbp FROM daily_orders o
        WHERE o.order_date >= CAST(date_trunc('week', CAST($peak_start AS DATE)) AS DATE)
          AND o.order_date <= CAST(date_trunc('week', CAST($peak_end AS DATE)) AS DATE) + INTERVAL 6 DAY
        GROUP BY o.region, o.order_date),
      tot AS (
        SELECT region, SUM(units) AS units, SUM(value_gbp) AS value_gbp, arg_max(order_date, units) AS peak_day,
               MAX(units) AS peak_day_units FROM cur GROUP BY region),
      ly AS (
        SELECT o.region, SUM(o.units) AS units FROM daily_orders o
        WHERE o.order_date >= CAST(date_trunc('week', CAST($peak_start AS DATE)) AS DATE) - INTERVAL 364 DAY
          AND o.order_date <= CAST(date_trunc('week', CAST($peak_end AS DATE)) AS DATE) + INTERVAL 6 DAY - INTERVAL 364 DAY
        GROUP BY o.region)
      SELECT t.region, t.units AS units_forecast, ROUND(t.value_gbp, 0) AS value_gbp,
             ROUND(t.units * 100.0 / SUM(t.units) OVER (), 1) AS region_pct,
             CAST(t.peak_day AS VARCHAR) AS busiest_day, t.peak_day_units AS busiest_day_units,
             l.units AS last_year_units,
             ROUND((t.units * 1.0 / NULLIF(l.units, 0) - 1) * 100, 1) AS growth_vs_last_year_pct
      FROM tot t LEFT JOIN ly l USING (region)
      ORDER BY units_forecast DESC
    limit: 15
    example: {}


  - name: get_peak_volume_profile
    desc: Peak period volume profile by region. Shows weekly demand curve during peak season.
    kind: sql
    args:
      peak_start: {type: date, desc: "Peak start", default: "+8w"}
      peak_end: {type: date, desc: "Peak end", default: "+12w"}
    sql: |
      SELECT o.region, o.order_date,
             SUM(o.units) AS units,
             ROUND(SUM(o.value_gbp), 0) AS value_gbp
      FROM daily_orders o
      WHERE o.order_date >= CAST($peak_start AS DATE) AND o.order_date <= CAST($peak_end AS DATE)
      GROUP BY o.region, o.order_date
      ORDER BY o.region, o.order_date
    limit: 100
    example: {}

  - name: get_pipeline_products_for_season
    desc: Return pipeline products launching in a season. Shows product mix, risk and forecast.
    kind: sql
    args:
      season: {required: true, desc: "Season code, e.g. AW26"}
      status: {desc: "Status: draft, approved, in_production, launched"}
    sql: |
      SELECT p.pipeline_id, p.sku, p.product_name, p.launch_date,
             p.category, p.supply_risk, p.demand_risk, p.risk_score, p.status,
             COUNT(*) OVER () AS total_pipeline_items
      FROM pipeline_products p
      WHERE p.season = $season AND ($status IS NULL OR p.status = $status)
      ORDER BY p.risk_score DESC
    limit: 50
    example: {season: "AW26"}

  - name: get_return_forecast_by_week
    desc: Weekly returns forecast in units with low and high range, value, cumulative total and driver. Use for returns centre capacity and staffing.
    kind: sql
    args:
      week_start:
        type: date
        desc: First week to show; blank for next week
      weeks_ahead:
        type: int
        desc: Number of weeks to show
        default: 4
    sql: |
      SELECT r.returns_week AS week_start, CAST(r.returns_week + INTERVAL 6 DAY AS DATE) AS week_end,
             r.returns_units, r.low_units, r.high_units, r.returns_value_gbp,
             SUM(r.returns_units) OVER (ORDER BY r.returns_week) AS cumulative_returns_units,
             r.driver
      FROM returns_forecast r
      WHERE r.returns_week >= CAST(date_trunc('week', COALESCE(CAST($week_start AS DATE), CAST($as_of AS DATE) + INTERVAL 7 DAY)) AS DATE)
        AND r.returns_week < CAST(date_trunc('week', COALESCE(CAST($week_start AS DATE), CAST($as_of AS DATE) + INTERVAL 7 DAY)) AS DATE) + INTERVAL ($weeks_ahead * 7) DAY
      ORDER BY r.returns_week
    limit: 30
    example: {}


  - name: get_revenue_dependency_by_supplier
    desc: Revenue dependent on each supplier. Shows revenue at risk if supplier fails.
    kind: sql
    args:
      period_start: {type: date, desc: Period start, default: "-52w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT s.supplier_id, s.name,
             ROUND(SUM(h.revenue_gbp), 0) AS revenue_gbp,
             ROUND(SUM(h.revenue_gbp) * 100.0 / SUM(SUM(h.revenue_gbp)) OVER (), 1) AS revenue_pct
      FROM demand_history h
      JOIN master.products p ON h.sku = p.sku
      JOIN master.suppliers s ON p.supplier_id = s.supplier_id
      WHERE h.period_date >= CAST($period_start AS DATE) AND h.period_date <= CAST($period_end AS DATE)
      GROUP BY s.supplier_id, s.name
      ORDER BY revenue_gbp DESC
    limit: 50
    example: {}

  - name: get_sales_forecast_for_style
    desc: Weekly sales forecast for a style across all its SKUs, base with upside and downside range, value and cumulative base units.
    kind: sql
    args:
      style_id:
        required: true
        desc: "Style id, e.g. STY-7731"
      forecast_start:
        type: date
        desc: Forecast start
        default: $as_of
      weeks_ahead:
        type: int
        desc: Number of weeks to forecast
        default: 12
    sql: |
      SELECT f.forecast_week,
             SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'base') AS units_forecast,
             SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'downside') AS downside_units,
             SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'upside') AS upside_units,
             ROUND(SUM(f.units_forecast * CAST(p.retail_price_gbp AS DOUBLE)) FILTER (WHERE f.forecast_type = 'base'), 0) AS base_value_gbp,
             SUM(SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'base')) OVER (ORDER BY f.forecast_week) AS cumulative_base_units,
             COUNT(DISTINCT f.sku) AS skus
      FROM forecasts f JOIN master.products p ON p.sku = f.sku
      WHERE p.style_id = $style_id
        AND f.forecast_week >= CAST(date_trunc('week', CAST($forecast_start AS DATE)) AS DATE)
        AND f.forecast_week < CAST(date_trunc('week', CAST($forecast_start AS DATE)) AS DATE) + INTERVAL ($weeks_ahead * 7) DAY
      GROUP BY f.forecast_week
      ORDER BY f.forecast_week
    limit: 52
    example:
      style_id: STY-7731


  - name: get_sales_history_for_products
    desc: Weekly units and revenue by SKU for a category, style or single SKU, with weeks since launch. Use for comparable-product sales curves.
    kind: sql
    args:
      category:
        desc: Product category, e.g. Bags
      style_id:
        desc: "Style id, e.g. STY-8066"
      sku:
        desc: "SKU, e.g. SKU-103745"
      period_start:
        type: date
        desc: Period start
        default: -26w
      period_end:
        type: date
        desc: Period end
        default: $as_of
    sql: |
      SELECT h.sku, p.style_id, h.period_date, h.units_sold,
             ROUND(h.revenue_gbp, 0) AS revenue_gbp,
             ROUND(h.revenue_gbp / NULLIF(h.units_sold, 0), 2) AS price_gbp,
             date_diff('week', CAST(date_trunc('week', CAST(p.launch_date AS DATE)) AS DATE), h.period_date) + 1 AS weeks_since_launch
      FROM demand_history h JOIN master.products p ON p.sku = h.sku
      WHERE ($category IS NULL OR h.category = $category) AND ($style_id IS NULL OR p.style_id = $style_id)
        AND ($sku IS NULL OR h.sku = $sku)
        AND h.period_date >= CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE) AND h.period_date <= CAST($period_end AS DATE)
      ORDER BY h.sku, h.period_date
    limit: 200
    example:
      category: Bags
      period_start: -12w


  - name: get_site_volume_forecast
    desc: Throughput volume forecast for a DC or store. For capacity and resource planning.
    kind: sql
    args:
      site_id: {required: true, desc: "Site: DC1-DC5 or store"}
      period_start: {type: date, desc: "Period start", default: "$as_of"}
      period_end: {type: date, desc: "Period end", default: "+12w"}
    sql: |
      SELECT CAST($period_start AS DATE) AS period_start, CAST($period_end AS DATE) AS period_end,
             COALESCE(SUM(o.units), 0) AS units_forecast,
             ROUND(COALESCE(SUM(o.value_gbp), 0), 0) AS value_gbp,
             'Volume used for DC/store capacity planning' AS use_case
      FROM daily_orders o
      WHERE o.order_date >= CAST($period_start AS DATE) AND o.order_date <= CAST($period_end AS DATE)
    example: {site_id: "DC1"}

  - name: get_volume_forecast
    desc: Long-range outbound volume forecast by scenario (base, upside, downside) and plan year, optionally for one DC. Use for multi-year capacity and investment cases.
    kind: sql
    args:
      scenario:
        type: enum
        values: [base, upside, downside]
        desc: Volume scenario; blank for all three
      site_id:
        desc: "Distribution centre, e.g. DC1; blank for the whole network"
      period_start:
        type: date
        desc: Forecast period start
        default: $as_of
      period_end:
        type: date
        desc: Forecast period end, default seven years
        default: +2520d
    sql: |
      WITH q AS (
        SELECT v.scenario, v.period_start, v.annual_growth_pct, v.units_forecast,
               CAST(floor(date_diff('day', CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE), v.period_start) / 364.0) + 1 AS INTEGER) AS plan_year
        FROM long_range_volume v
        WHERE ($scenario IS NULL OR v.scenario = $scenario) AND ($site_id IS NULL OR v.site_id = $site_id)
          AND v.period_start >= CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE)
          AND v.period_start <= CAST($period_end AS DATE)),
      y AS (
        SELECT scenario, plan_year, CAST(MIN(period_start) AS VARCHAR) AS year_start, SUM(units_forecast) AS units_forecast,
               ROUND(SUM(units_forecast) / (COUNT(DISTINCT period_start) * 13.0), 0) AS avg_weekly_units,
               MAX(annual_growth_pct) AS annual_growth_assumption_pct
        FROM q GROUP BY scenario, plan_year)
      SELECT y.scenario, y.plan_year, y.year_start, y.units_forecast, y.avg_weekly_units,
             ROUND((y.units_forecast * 1.0 / FIRST_VALUE(y.units_forecast) OVER (PARTITION BY y.scenario ORDER BY y.plan_year) - 1) * 100, 1) AS growth_vs_year1_pct,
             y.annual_growth_assumption_pct
      FROM y ORDER BY CASE y.scenario WHEN 'base' THEN 0 WHEN 'upside' THEN 1 ELSE 2 END, y.plan_year
    limit: 40
    example: {site_id: DC1}

  - name: list_forecast_model_external_regressors
    desc: List the external inputs (weather, holidays, consumer confidence, competitor activity, price, promotion) the forecast model uses or has tested, by market, with status. Shows what outside data feeds the model.
    kind: select
    from: model_regressors
    filters:
      driver: {op: like, desc: "Driver: weather, consumer_confidence, holidays, competitor_action, price, promotion"}
      status: {desc: "in_model, tested_not_adopted or not_in_model"}
    columns: [regressor_id, regressor, driver, regressor_type, markets, status, lag_weeks, notes]
    order: regressor_id
    limit: 20
    example: {driver: weather}

  - name: list_forecasts_by_error_and_bias
    desc: Forecast series whose average error is above a threshold, worst first, with average bias and weeks measured, by configuration and category. Use to find forecasts to distrust.
    kind: sql
    args:
      mape_threshold_pct: {type: float, desc: Flag forecasts with average MAPE above this %, default: 25.0}
      period_start: {type: date, desc: Period start, default: "-13w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT a.config_id, c.config_name, a.category, a.sku, a.forecast_level,
             ROUND(AVG(a.mape_pct), 1) AS mape_pct,
             ROUND(AVG(a.bias_pct), 1) AS bias_pct,
             COUNT(*) AS weeks_measured,
             ROUND(MAX(a.mape_pct), 1) AS worst_week_mape_pct
      FROM forecast_accuracy a JOIN forecast_configs c ON c.config_id = a.config_id
      WHERE a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE)
      GROUP BY a.config_id, c.config_name, a.category, a.sku, a.forecast_level
      HAVING AVG(a.mape_pct) > $mape_threshold_pct
      ORDER BY mape_pct DESC
    limit: 50
    example: {}

  - name: list_new_product_launches
    desc: List new product launches by season. Shows launch dates, category and risk.
    kind: sql
    args:
      season: {required: true, desc: "Season code, e.g. AW26"}
      status: {type: enum, values: [draft, approved, in_production, launched], desc: "Status: draft, approved, in_production, launched"}
    sql: |
      SELECT p.pipeline_id, p.sku, p.product_name, p.launch_date,
             p.category, p.risk_score, p.status
      FROM pipeline_products p
      WHERE p.season = $season AND ($status IS NULL OR p.status = $status)
      ORDER BY p.launch_date
    limit: 100
    example: {season: "AW26"}

  - name: list_top_selling_skus
    desc: Top selling SKUs ranked by units or revenue over a period, with name, category, average weekly units and supplier lead time.
    kind: sql
    args:
      metric:
        type: enum
        values: [units, revenue]
        desc: Rank by units or revenue
        default: units
      category:
        desc: Product category, e.g. Outerwear; blank for all
      period_start:
        type: date
        desc: Period start
        default: -52w
      period_end:
        type: date
        desc: Period end
        default: $as_of
      limit_rows:
        type: int
        desc: Number of SKUs to return
        default: 200
    sql: |
      SELECT ROW_NUMBER() OVER (ORDER BY CASE WHEN $metric = 'revenue' THEN SUM(h.revenue_gbp) ELSE SUM(h.units_sold) END DESC) AS sales_rank,
             h.sku, p.name, p.category, SUM(h.units_sold) AS units_sold, ROUND(SUM(h.revenue_gbp), 0) AS revenue_gbp,
             ROUND(AVG(h.units_sold), 0) AS avg_weekly_units, COUNT(*) AS weeks_of_sales,
             p.lead_time_days AS supplier_lead_time_days
      FROM demand_history h JOIN master.products p ON p.sku = h.sku
      WHERE h.period_date >= CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE) AND h.period_date <= CAST($period_end AS DATE)
        AND ($category IS NULL OR h.category = $category)
      GROUP BY h.sku, p.name, p.category, p.lead_time_days
      ORDER BY sales_rank
      LIMIT $limit_rows
    limit: 200
    example: {limit_rows: 10}


  - name: run_daily_order_volume_forecast
    desc: Runs daily order volume forecast for e-commerce. Used for daily fulfillment capacity by day.
    kind: sql
    args:
      channel: {desc: "Sales channel"}
      region: {desc: "Region"}
      forecast_start: {type: date, desc: "Forecast start", default: "$as_of"}
      days_ahead: {type: int, desc: "Days to forecast", default: 7}
    sql: |
      SELECT o.order_date AS forecast_date,
             COALESCE(SUM(o.units), 0) AS units_forecast,
             ROUND(COALESCE(SUM(o.value_gbp), 0), 0) AS value_gbp,
             'Daily forecast for fulfillment capacity planning' AS use_case
      FROM daily_orders o
      WHERE ($channel IS NULL OR o.channel = $channel)
        AND ($region IS NULL OR o.region = $region)
        AND o.order_date >= CAST($forecast_start AS DATE)
        AND o.order_date < CAST($forecast_start AS DATE) + INTERVAL ($days_ahead) DAY
      GROUP BY o.order_date
      ORDER BY o.order_date
    example: {channel: "web"}

  - name: run_demand_scenario
    desc: Run a modelled demand scenario (base, upside or downside) for all categories or one. Applies an adjustment percentage to the base forecast, or uses the stored scenario forecast when none is given.
    kind: sql
    args:
      scenario_name: {required: true, desc: "Scenario: base, upside, downside"}
      scenario_adjustment_pct: {type: float, desc: "Percentage change applied to the base forecast, e.g. -8 for a downside"}
      category: {desc: Product category; blank for all categories}
      period_start: {type: date, desc: Period start, default: "$as_of"}
      period_end: {type: date, desc: Period end, default: "+12w"}
    sql: |
      SELECT CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE) AS period_start, CAST($period_end AS DATE) AS period_end,
             lower($scenario_name) AS scenario, COALESCE($category, 'All categories') AS category,
             SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'base') AS base_units,
             CASE WHEN $scenario_adjustment_pct IS NULL
                  THEN SUM(f.units_forecast) FILTER (WHERE f.forecast_type = lower($scenario_name))
                  ELSE ROUND(SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'base') * (1 + $scenario_adjustment_pct / 100.0), 0) END AS scenario_units,
             COALESCE($scenario_adjustment_pct,
                      ROUND((SUM(f.units_forecast) FILTER (WHERE f.forecast_type = lower($scenario_name)) * 100.0
                             / NULLIF(SUM(f.units_forecast) FILTER (WHERE f.forecast_type = 'base'), 0)) - 100, 1)) AS adjustment_pct,
             'Scenario analysis for S&OP planning' AS use_case
      FROM category_forecasts f
      WHERE ($category IS NULL OR f.category = $category)
        AND f.forecast_week >= CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE)
        AND f.forecast_week <= CAST($period_end AS DATE)
    example: {scenario_name: downside, scenario_adjustment_pct: -5.0}

  - name: run_forecast_backtest
    desc: Backtest accuracy of a forecast configuration on historical holdout data, by aggregation level, with the number of items backtested. Shows how well the model would have performed.
    kind: sql
    args:
      config_id: {required: true, desc: Configuration to backtest}
      category: {desc: Product category}
      period_start: {type: date, desc: Backtest period start, default: "-52w"}
      period_end: {type: date, desc: Backtest period end, default: "-4w"}
    sql: |
      SELECT c.config_id, c.config_name, c.method_type, b.forecast_level,
             ROUND(AVG(b.mape_pct), 1) AS backtest_mape_pct, ROUND(AVG(b.bias_pct), 1) AS backtest_bias_pct,
             SUM(b.items_backtested) AS items_backtested,
             'Backtest accuracy on historical holdout set' AS measure
      FROM forecast_configs c JOIN forecast_backtests b ON b.config_id = c.config_id
      WHERE c.config_id = $config_id AND ($category IS NULL OR b.category = $category)
        AND b.period_end >= CAST($period_start AS DATE) AND b.period_start <= CAST($period_end AS DATE)
      GROUP BY c.config_id, c.config_name, c.method_type, b.forecast_level
      ORDER BY backtest_mape_pct
    example: {config_id: CFG-000003}

  - name: run_key_account_order_forecast
    desc: Runs key account order forecast based on sell-through and current stock.
    kind: sql
    args:
      account_id: {desc: "Account/customer id"}
      period_start: {type: date, desc: "Period start", default: "$as_of"}
      weeks_ahead: {type: int, desc: "Weeks to forecast", default: 12}
    sql: |
      SELECT CAST($period_start AS DATE) AS period_start,
             CAST($period_start AS DATE) + INTERVAL ($weeks_ahead * 7) DAY AS period_end,
             COALESCE(SUM(f.units_forecast), 0) AS account_order_forecast_units,
             'Account forecast based on historical sell-through patterns' AS basis
      FROM forecasts f
      WHERE f.forecast_week >= CAST($period_start AS DATE)
        AND f.forecast_week < CAST($period_start AS DATE) + INTERVAL ($weeks_ahead * 7) DAY
    example: {}

  - name: run_new_product_forecast
    desc: Weekly base, low and high demand forecast for a new product from the launch curves of comparable products in its category. Returns weeks since launch.
    kind: sql
    args:
      sku:
        required: true
        desc: "New product SKU, e.g. SKU-103423"
      launch_date:
        required: true
        type: date
        desc: Launch date
      weeks_to_forecast:
        type: int
        desc: Weeks to forecast
        default: 12
    sql: |
      WITH me AS (SELECT category FROM master.products WHERE sku = $sku),
      comp AS (
        SELECT p.sku, CAST(date_trunc('week', CAST(p.launch_date AS DATE)) AS DATE) AS lw
        FROM master.products p, me
        WHERE p.category = me.category AND p.sku <> $sku
          AND CAST(date_trunc('week', CAST(p.launch_date AS DATE)) AS DATE) >= (SELECT MIN(period_date) FROM demand_history)
          AND CAST(p.launch_date AS DATE) <= CAST($as_of AS DATE) - INTERVAL 28 DAY),
      curve AS (
        SELECT date_diff('week', c.lw, h.period_date) + 1 AS wk, c.sku, h.units_sold
        FROM comp c JOIN demand_history h ON h.sku = c.sku
        WHERE date_diff('week', c.lw, h.period_date) + 1 BETWEEN 1 AND $weeks_to_forecast),
      agg AS (
        SELECT wk, ROUND(AVG(units_sold), 0) AS base_units, ROUND(quantile_cont(units_sold, 0.25), 0) AS low_units,
               ROUND(quantile_cont(units_sold, 0.75), 0) AS high_units, COUNT(DISTINCT sku) AS comparables
        FROM curve GROUP BY wk)
      SELECT $sku AS sku, a.wk AS week_in_launch,
             CAST(date_trunc('week', CAST($launch_date AS DATE)) AS DATE) + CAST((a.wk - 1) * 7 AS INTEGER) AS week_start,
             a.base_units, a.low_units, a.high_units,
             SUM(a.base_units) OVER (ORDER BY a.wk) AS cumulative_base_units,
             a.comparables, 'average of comparable launches; low and high are the 25th and 75th percentile' AS method
      FROM agg a ORDER BY a.wk
    limit: 52
    example:
      sku: SKU-103423
      launch_date: +14w


  - name: run_promotional_volume_forecast
    desc: Runs promotional volume forecast. Estimates units and revenue during promotion.
    kind: sql
    args:
      category: {required: true, desc: Product category}
      mechanic: {required: true, desc: "Promotion mechanic, e.g. percentage_off"}
      period_start: {type: date, required: true, desc: "Promo start"}
      period_end: {type: date, required: true, desc: "Promo end"}
    sql: |
      SELECT $category AS category, $mechanic AS mechanic,
             CAST($period_start AS DATE) AS promo_start,
             CAST($period_end AS DATE) AS promo_end,
             COALESCE(SUM(h.units_sold), 0) AS base_period_units,
             ROUND(COALESCE(SUM(h.units_sold) *
               (SELECT COALESCE(AVG(p.uplift_pct), 1.3) FROM promotion_effects p WHERE p.category = $category AND p.promo_mechanic = $mechanic), 0), 0) AS promo_volume_forecast
      FROM demand_history h
      WHERE h.category = $category
        AND h.period_date >= CAST($period_start AS DATE) - INTERVAL 4 WEEK
        AND h.period_date < CAST($period_start AS DATE)
    example: {category: "Kitchenware", mechanic: "percentage_off", period_start: "$as_of", period_end: "+7d"}

  - name: search_comparable_products
    desc: Find comparable products by any keyword in name or category, with price, launch date, 52-week units and units in the first 12 weeks on sale.
    kind: sql
    args:
      name_keywords:
        required: true
        desc: "Keywords matched against product name and category, any word, e.g. 'bag'"
      category:
        desc: Product category, e.g. Bags
    sql: |
      WITH kw AS (SELECT unnest(string_split(lower(trim($name_keywords)), ' ')) AS w),
      hs AS (SELECT MIN(period_date) AS first_week FROM demand_history)
      SELECT p.sku, p.style_id, p.name, p.category, p.status, CAST(p.retail_price_gbp AS DOUBLE) AS retail_price_gbp,
             p.launch_date, SUM(h.units_sold) AS units_sold_52w, ROUND(AVG(h.units_sold), 1) AS avg_weekly_units,
             COUNT(h.units_sold) AS weeks_of_sales,
             CASE WHEN CAST(p.launch_date AS DATE) >= (SELECT first_week FROM hs)
                  THEN SUM(h.units_sold) FILTER (WHERE h.period_date < CAST(date_trunc('week', CAST(p.launch_date AS DATE)) AS DATE) + INTERVAL 84 DAY) END AS units_first_12_weeks
      FROM master.products p JOIN demand_history h ON h.sku = p.sku
      WHERE EXISTS (SELECT 1 FROM kw WHERE kw.w <> '' AND (lower(p.name) LIKE '%' || kw.w || '%' OR lower(p.category) LIKE '%' || kw.w || '%'))
        AND ($category IS NULL OR p.category = $category)
        AND h.period_date >= CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE) - INTERVAL 52 WEEK
      GROUP BY p.sku, p.style_id, p.name, p.category, p.status, p.retail_price_gbp, p.launch_date
      ORDER BY units_sold_52w DESC
    limit: 20
    example:
      name_keywords: bag


  - name: update_demand_history_adjustments
    desc: Change the stored correction for a stockout, its lost units and correction method, so the corrected history feeds model retraining. Use the adjustment id from the lost demand calculation.
    kind: update
    table: demand_history_adjustments
    args:
      adjustment_id: {required: true}
      units_lost: {type: int, desc: Estimated lost units}
      correction_method: {required: true, desc: "Correction method, e.g. 'use average of pre/post'"}
    example: {adjustment_id: ADJ-900001, units_lost: 450, correction_method: use average of pre/post}

  - name: update_forecast_model_settings
    desc: Change a forecast configuration's status, notes or parameters, for example rolling back a setting to its previous value. Returns old and new settings.
    kind: update
    table: forecast_configs
    args:
      config_id: {required: true}
      status: {desc: "Status: active, test or archived"}
      parameters: {desc: "Full parameter string with the corrected value, e.g. alpha=0.2; outlier_capping=on"}
      notes: {desc: Update notes}
    example: {config_id: CFG-000001, parameters: "alpha=0.2; seasonality=multiplicative; outlier_capping=on", notes: Rolled back outlier capping}

  - name: get_demand_forecast
    desc: Demand forecast by category and period. Shows base case and upside/downside scenarios.
    kind: sql
    args:
      category: {required: true, desc: Product category}
      period_start: {type: date, desc: "Forecast period start", default: "$as_of"}
      period_end: {type: date, desc: "Forecast period end", default: "+12w"}
    sql: |
      SELECT f.category, f.forecast_week,
             f.forecast_type,
             SUM(f.units_forecast) AS units_forecast,
             ROUND(SUM(f.units_forecast) * 50, 0) AS value_gbp
      FROM forecasts f
      WHERE f.category = $category
        AND f.forecast_week >= CAST($period_start AS DATE)
        AND f.forecast_week <= CAST($period_end AS DATE)
      GROUP BY f.category, f.forecast_week, f.forecast_type
      ORDER BY f.forecast_week, f.forecast_type
    limit: 52
    example: {category: "Dresses"}

  - name: get_demand_forecast_for_pipeline_product
    desc: Demand forecast for pipeline (new) products. Shows launch window and sales ramp.
    kind: sql
    args:
      pipeline_id: {required: true, desc: Pipeline product id}
      weeks_ahead: {type: int, desc: "Weeks to forecast", default: 12}
    sql: |
      SELECT p.pipeline_id, p.sku, p.product_name, p.launch_date, p.category,
             ROUND(COALESCE(SUM(f.units_forecast) * 0.8, 0), 0) AS conservative_forecast,
             ROUND(COALESCE(SUM(f.units_forecast), 0), 0) AS base_forecast,
             ROUND(COALESCE(SUM(f.units_forecast) * 1.2, 0), 0) AS optimistic_forecast
      FROM pipeline_products p
      LEFT JOIN forecasts f ON p.category = f.category
        AND f.forecast_week >= p.launch_date
        AND f.forecast_week < p.launch_date + INTERVAL ($weeks_ahead * 7) DAY
      WHERE p.pipeline_id = $pipeline_id
      GROUP BY p.pipeline_id, p.sku, p.product_name, p.launch_date, p.category
    example: {pipeline_id: "PL-900001"}

  - name: get_demand_forecast_variability
    desc: Forecast error and demand variability by time window. Shows forecast uncertainty.
    kind: sql
    args:
      period_start: {type: date, desc: Period start, default: "-26w"}
      period_end: {type: date, desc: Period end, default: "$as_of"}
    sql: |
      SELECT 'Forecast Variability' AS metric,
             ROUND(AVG(a.mape_pct), 1) AS avg_error_pct,
             ROUND(AVG(a.bias_pct), 1) AS avg_bias_pct,
             ROUND(STDDEV_POP(a.mape_pct), 1) AS mape_std_dev,
             COUNT(DISTINCT a.sku) AS skus_analyzed,
             'Demand uncertainty increases with forecast horizon' AS note
      FROM forecast_accuracy a
      WHERE a.period_start >= CAST($period_start AS DATE) AND a.period_end <= CAST($period_end AS DATE)
    example: {}

  - name: get_demand_scenarios
    desc: Downside and upside demand scenarios. Shows impact of different market conditions.
    kind: sql
    args:
      category: {desc: Product category}
      period_start: {type: date, desc: Period start, default: "$as_of"}
      period_end: {type: date, desc: Period end, default: "+12w"}
    sql: |
      SELECT COALESCE(f.category, $category) AS category,
             f.forecast_type AS scenario,
             ROUND(SUM(f.units_forecast), 0) AS units_forecast,
             ROUND(SUM(f.units_forecast) / ((CAST($period_end AS DATE) - CAST($period_start AS DATE)) / 7), 0) AS avg_weekly_units,
             CASE f.forecast_type
               WHEN 'downside' THEN 'Pessimistic: 5-10% demand reduction'
               WHEN 'upside' THEN 'Optimistic: 3-5% demand increase'
               ELSE 'Base case: market as expected'
             END AS scenario_description
      FROM forecasts f
      WHERE ($category IS NULL OR f.category = $category)
        AND f.forecast_week >= CAST($period_start AS DATE)
        AND f.forecast_week <= CAST($period_end AS DATE)
      GROUP BY f.category, f.forecast_type
      ORDER BY scenario
    limit: 50
    example: {category: "Dresses"}

  - name: get_demand_variability_by_sku
    desc: Weekly demand variability by SKU (average, standard deviation, coefficient of variation, forecast error), fastest sellers first. Use top_n for the fastest N.
    kind: sql
    args:
      sku:
        desc: "SKU, e.g. SKU-104669; blank for all"
      category:
        desc: Product category
      top_n:
        type: int
        desc: Only the N fastest sellers by units over the period
      period_start:
        type: date
        desc: Period start
        default: -52w
      period_end:
        type: date
        desc: Period end
        default: $as_of
    sql: |
      WITH s AS (
        SELECT h.sku, h.category, SUM(h.units_sold) AS units_sold, AVG(h.units_sold) AS avg_wk,
               STDDEV_POP(h.units_sold) AS sd, COUNT(*) AS weeks
        FROM demand_history h
        WHERE ($category IS NULL OR h.category = $category)
          AND h.period_date >= CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE)
          AND h.period_date <= CAST($period_end AS DATE)
        GROUP BY h.sku, h.category HAVING COUNT(*) >= 13),
      ranked AS (SELECT s.*, ROW_NUMBER() OVER (ORDER BY s.units_sold DESC) AS sales_rank FROM s),
      err AS (
        SELECT f.sku, ROUND(AVG(ABS(f.units_forecast - h.units_sold) * 100.0 / NULLIF(h.units_sold, 0)), 1) AS mape
        FROM forecasts f JOIN demand_history h ON h.sku = f.sku AND h.period_date = f.forecast_week
        WHERE f.forecast_type = 'base' GROUP BY f.sku)
      SELECT r.sku, r.sales_rank, r.category, r.units_sold, ROUND(r.avg_wk, 0) AS avg_weekly_units,
             ROUND(r.sd, 0) AS std_dev, ROUND(r.sd / NULLIF(r.avg_wk, 0) * 100, 1) AS cv_pct,
             e.mape AS forecast_mape_pct,
             CASE WHEN r.sd / NULLIF(r.avg_wk, 0) > 0.5 THEN 'High' WHEN r.sd / NULLIF(r.avg_wk, 0) > 0.2 THEN 'Medium' ELSE 'Low' END AS variability_class,
             r.weeks AS weeks_of_history,
             p.lead_time_days AS supplier_lead_time_days
      FROM ranked r JOIN master.products p ON p.sku = r.sku LEFT JOIN err e ON e.sku = r.sku
      WHERE ($sku IS NULL OR r.sku = $sku) AND ($top_n IS NULL OR r.sales_rank <= $top_n)
      ORDER BY r.sales_rank
    limit: 100
    example: {top_n: 10}


  - name: get_forecast_by_week_for_product
    desc: Weekly forecast for one SKU, base with upside and downside, beside actual units sold for past weeks. Shows forecast accuracy and the demand path ahead.
    kind: sql
    args:
      sku:
        required: true
      period_start:
        type: date
        desc: First week
        default: -8w
      period_end:
        type: date
        desc: Last week
        default: +12w
    sql: |
      WITH fc AS (
        SELECT f.sku, f.forecast_week,
               MAX(f.units_forecast) FILTER (WHERE f.forecast_type = 'base') AS units_forecast,
               MAX(f.units_forecast) FILTER (WHERE f.forecast_type = 'upside') AS upside_units,
               MAX(f.units_forecast) FILTER (WHERE f.forecast_type = 'downside') AS downside_units
        FROM forecasts f
        WHERE f.sku = $sku
          AND f.forecast_week >= CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE)
          AND f.forecast_week <= CAST($period_end AS DATE)
        GROUP BY f.sku, f.forecast_week)
      SELECT fc.sku, fc.forecast_week, fc.units_forecast, fc.upside_units, fc.downside_units,
             h.units_sold AS actual_units,
             ROUND((h.units_sold - fc.units_forecast) * 100.0 / NULLIF(fc.units_forecast, 0), 1) AS actual_vs_forecast_pct,
             ROUND(fc.units_forecast * CAST(p.retail_price_gbp AS DOUBLE), 0) AS forecast_value_gbp,
             SUM(fc.units_forecast) OVER (ORDER BY fc.forecast_week) AS cumulative_forecast_units
      FROM fc JOIN master.products p ON p.sku = fc.sku
      LEFT JOIN demand_history h ON h.sku = fc.sku AND h.period_date = fc.forecast_week
      ORDER BY fc.forecast_week
    limit: 52
    example:
      sku: SKU-101904


  - name: get_peak_volume_forecast_by_lane
    desc: Peak pallets and units forecast per transport lane, with Black Friday week and Christmas week pallets and the busiest week. Busiest lanes first.
    kind: sql
    args:
      lane:
        desc: "Lane code, e.g. DC1-ST150; blank for all lanes"
      region:
        desc: "Destination region of the lane, e.g. UK North; blank for all"
      peak_start:
        type: date
        desc: Peak start, Monday of Black Friday week
        default: +7w
      peak_end:
        type: date
        desc: Peak end
        default: +11w
    sql: |
      SELECT l.lane, l.origin_site_id, l.region,
             SUM(l.pallets_forecast) AS peak_pallets, ROUND(AVG(l.pallets_forecast), 0) AS avg_weekly_pallets,
             SUM(l.pallets_forecast) FILTER (WHERE l.week_label = 'black_friday_week') AS black_friday_week_pallets,
             SUM(l.pallets_forecast) FILTER (WHERE l.week_label = 'christmas_week') AS christmas_week_pallets,
             MAX(l.pallets_forecast) AS busiest_week_pallets,
             CAST(arg_max(l.week_start, l.pallets_forecast) AS VARCHAR) AS busiest_week,
             SUM(l.units_forecast) AS peak_units
      FROM lane_volume_forecast l
      WHERE ($lane IS NULL OR l.lane = $lane) AND ($region IS NULL OR l.region = $region)
        AND l.week_start >= CAST(date_trunc('week', CAST($peak_start AS DATE)) AS DATE)
        AND l.week_start <= CAST($peak_end AS DATE)
      GROUP BY l.lane, l.origin_site_id, l.region
      ORDER BY avg_weekly_pallets DESC, l.lane
    limit: 30
    example: {}
