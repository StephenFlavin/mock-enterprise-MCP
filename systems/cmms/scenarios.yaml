# One entry per question row that uses this system's tools
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.
- question: "01:10:Q1"
  story: >
    Shuttle system at DC2 had 14 unplanned stoppages in September (STP-900001..STP-900014) with root causes including bearing
    failures (aisles 3, 2), seal degradation (aisles 7, 12), misalignment (aisle 11), and sensor/electrical faults. Total unplanned cost was £18,225
    across 75-210 minutes per stoppage. Most are predictable from vibration/temperature sensors. Top parts needed: motor bearings, oil seals, sprockets.
  checks:
    - tool: list_unplanned_stoppages
      args: {site_id: DC2, date_from: "-30d"}
      expect: ["STP-900001", "STP-900014", "Bearing failure", "Seal degradation", "14"]
    - tool: list_work_orders_for_asset
      args: {asset_id: AST-DC2-SHT-03}
      expect: ["WO-900001", "completed", "motor bearing"]
    - tool: get_spare_parts_stock
      args: {asset_class: motor}
      expect: ["SPR-900001", "SPR-900002", "Motor bearing", "Oil seal"]

- question: "01:10:Q2"
  story: >
    Conveyor network and sorter at DC1 show degrading condition. Sorter (AST-DC1-SRT) has run 87,234 hours with vibration 5.2 mm/s
    and oil analysis degrading (poor condition rating). Two planned work orders (WO-900003 and WO-900004) are scheduled for the shutdown
    on +14d to replace sorter rollers/sensors and drive motor/gearbox. Conveyor motors M01/M02 are good condition but M03 is fair
    and needs routine maintenance. Shutdown plan SHD-900001 covers 16 hours with estimated cost £8,500.
  checks:
    - tool: list_asset_run_hours
      args: {asset_id: AST-DC1-SRT}
      expect: ["87234", "poor", "degrading"]
    - tool: list_work_orders_for_asset
      args: {asset_id: AST-DC1-SRT, status: scheduled}
      expect: ["WO-900003", "WO-900004"]
    - tool: get_unplanned_failure_cost
      args: {asset_id: AST-DC1-SRT}
      expect: ["failure_count"]
    - tool: get_shutdown_plan
      args: {}
      expect: ["SHD-900001", "approved"]
    - tool: cancel_work_order
      args: {wo_id: WO-900005, cancel_reason: "Pushed to next shutdown cycle"}
      expect: ["cancelled"]

- question: "01:10:Q4"
  story: >
    Old sorter at DC1 (AST-DC1-SRT, installed ~2014, 12 years old) shows wear with maintenance cost trend increasing.
    Historical work orders show 3 breakdowns in 2 months (WO-900007, WO-900008, WO-900009) costing £3,000 total, plus planned maintenance
    scheduled for shutdown. Condition readings show poor rating with high vibration (5.2 mm/s) and degrading oil. Unplanned failure cost
    averages £1,500 per incident. Ongoing question: repair, overhaul, or replace?
  checks:
    - tool: get_asset_maintenance_cost_history
      args: {asset_id: AST-DC1-SRT}
      expect: ["unplanned_wos", "total_cost_gbp"]
    - tool: list_unplanned_stoppages
      args: {asset_id: AST-DC1-SRT, date_from: "-90d"}
      expect: ["AST-DC1-SRT"]
    - tool: list_asset_run_hours
      args: {asset_id: AST-DC1-SRT, condition_rating: poor}
      expect: ["87234", "poor", "degrading"]
