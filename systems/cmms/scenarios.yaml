# One entry per question row that uses this system's tools
- question: "01:10:Q1"
  story: >
    The DC2 shuttle system (AST-DC2-SHT, aisles 1-16) had 14 unplanned stoppages in the last month (STP-900001..STP-900014, no
    generated stoppages exist at DC2). Seal degradation (aisles 7 and 12, 300 min) and mechanical wear (285 min) lose the most time,
    then lubrication failure and bearing failure. Aisle 3 (AST-DC2-SHT-03) stopped twice (bearing failure on WO-900001, software glitch
    on WO-900103); the sensor and software faults all sit on software 4.3.0 shuttles. Each stoppage has a breakdown work order with the
    same downtime. Shuttle spares (SPR-900001, SPR-900002, SPR-900011) are at or below reorder level, the drive sprocket is out of stock.
  checks:
    - tool: list_unplanned_stoppages
      args: {asset_id: AST-DC2-SHT-03, date_from: "-40d"}
      expect: ["STP-900001", "Bearing failure", "Motor bearing", "Software glitch"]
    - tool: list_unplanned_stoppages
      args: {site_id: DC2}
      expect: ["14 rows", "Seal degradation", "Position sensor", "4.3.0"]
    - tool: list_work_orders_for_asset
      args: {asset_id: AST-DC2-SHT-03}
      expect: ["WO-900001", "completed", "Replace motor bearing assembly", "1.25"]
    - tool: get_unplanned_failure_cost
      args: {asset_id: AST-DC2-SHT-03, days: 40}
      expect: ["failure_count: 2", "total_downtime_hours: 2", "1386", "class_avg_planned_cost_gbp"]
    - tool: get_spare_parts_stock
      args: {asset_class: shuttle}
      expect: ["SPR-900001", "Shuttle oil seal kit", "out_of_stock", "at_or_below_reorder"]

- question: "01:10:Q2"
  story: >
    DC1 conveyor network and sorter. The sorter AST-DC1-SRT is poor (vibration 5.2 mm/s, oil degrading); gearbox G01 and motor M08 are
    poor, motor M03, gearbox G02 and sensor S09 fair, plus generated degraded assets G11 and M10. Shutdown SHD-900001 (16 h, approved,
    8,500 GBP) on 19 October has four work orders (WO-900003..WO-900006, 13 h committed, 3 h available), so a 1 h motor PM fits and a
    gearbox replacement does not. Creating or cancelling a work order on that date changes the committed hours. Planned versus unplanned cost
    comes from class averages in get_unplanned_failure_cost.
  checks:
    - tool: list_asset_run_hours
      args: {asset_id: AST-DC1-SRT}
      expect: ["51230", "poor", "degrading"]
    - tool: list_asset_run_hours
      args: {asset_id: AST-DC1-CNV}
      expect: ["AST-DC1-CNV-G01", "AST-DC1-CNV-M08", "AST-DC1-CNV-S09"]
    - tool: get_shutdown_plan
      args: {shutdown_date: "+12d"}
      expect: ["SHD-900001", "approved", "work_orders_planned: 4", "hours_available: 3"]
    - tool: list_work_orders_for_asset
      args: {asset_id: AST-DC1-SRT, status: scheduled}
      expect: ["WO-900003", "WO-900004"]
    - tool: get_unplanned_failure_cost
      args: {asset_id: AST-DC1-CNV-G01}
      expect: ["failure_count: 0", "class_avg_unplanned_cost_gbp", "saving_per_failure_avoided_gbp"]
    - tool: create_work_order
      args: {asset_id: AST-DC1-CNV-M03, priority: high, description: "Preventive maintenance", planned_date: "+12d", planned_hours: 1}
      expect: ["open", "AST-DC1-CNV-M03"]
    - tool: get_shutdown_plan
      args: {shutdown_date: "+12d"}
      expect: ["work_orders_planned: 5", "hours_available: 2"]
    - tool: cancel_work_order
      args: {wo_id: WO-900005, cancel_reason: "Pushed to next shutdown cycle"}
      expect: ["cancelled"]
    - tool: get_shutdown_plan
      args: {shutdown_date: "+12d"}
      expect: ["work_orders_planned: 4", "hours_available: 3"]

- question: "01:10:Q4"
  story: >
    The DC1 sorter (AST-DC1-SRT) costs more each year: seven years of completed work orders show breakdowns rising from 1 to 5 a year and
    yearly cost rising from about 5k to 16k. Three breakdowns in the last 90 days (WO-900007/8/9, repair 3,000 GBP, STP-900015..17,
    total stoppage cost 5,325 GBP including lost throughput) sit on top of that history. Condition is poor with high vibration.
  checks:
    - tool: get_asset_maintenance_cost_history
      args: {asset_id: AST-DC1-SRT}
      expect: ["total", "unplanned_wos", "2024", "2025"]
    - tool: list_unplanned_stoppages
      args: {asset_id: AST-DC1-SRT, date_from: "-90d"}
      expect: ["STP-900015", "STP-900016", "STP-900017", "Lubrication failure"]
    - tool: get_unplanned_failure_cost
      args: {asset_id: AST-DC1-SRT, days: 90}
      expect: ["failure_count: 3", "total_unplanned_cost_gbp: 5325", "class_avg_planned_cost_gbp"]
    - tool: list_asset_run_hours
      args: {asset_id: AST-DC1-SRT, condition_rating: poor}
      expect: ["51230", "poor", "degrading"]
