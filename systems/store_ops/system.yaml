id: store_ops
name: Store Operations Platform
instructions: >
  Store operations, KPI tracking, visits, improvement plans and inventory management.
  Store visit ids look like VIS-000123, action plan items are API-000123.
  Use it for store performance comparison, area manager visits, shelf availability,
  inventory tasks, and shrink control programmes.

tables:
  store_kpis:
    key: [site_id, month]
    cols:
      site_id: {type: str, desc: "Store id"}
      month: {type: date, desc: "Month (first day of month)"}
      shrink_pct: {type: float, desc: "Shrink as % of sales"}
      availability_pct: {type: float, desc: "Shelf availability %"}
      labour_cost_pct: {type: float, desc: "Labour cost as % of sales"}
      footfall: {type: int, desc: "Monthly footfall count"}
      sales_gbp: {type: float, desc: "Monthly sales in GBP"}
      margin_pct: {type: float, desc: "Gross margin %"}

  store_visits:
    key: visit_id
    cols:
      visit_id: {type: str, desc: "Store visit, e.g. VIS-000123"}
      site_id: {type: str, desc: "Store id"}
      employee_id: {type: str, desc: "Visiting manager employee id"}
      visit_date: {type: date, desc: "Date of visit"}
      visit_purpose: {type: str, desc: "Visit purpose, e.g. Quarterly review"}
      issues_found: {type: int, desc: "Number of issues identified"}
      actions_raised: {type: int, desc: "Number of actions raised"}
      duration_hours: {type: float, desc: "Duration of visit in hours"}
      status: {type: enum, values: [planned, completed, cancelled], desc: "Visit status"}
      notes: {type: str, desc: "Visit notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  action_plans:
    key: action_id
    cols:
      action_id: {type: str, desc: "Action plan item, e.g. API-000123"}
      site_id: {type: str, desc: "Store id"}
      title: {type: str, desc: "Action description"}
      owner: {type: str, desc: "Employee id responsible"}
      due_date: {type: date, desc: "Target completion date"}
      status: {type: enum, values: [open, in_progress, completed, cancelled], desc: "Status"}
      priority: {type: enum, values: [low, medium, high, urgent], desc: "Priority"}
      category: {type: str, desc: "Category, e.g. Shrink, Availability, Labour"}
      created_at: {type: timestamp, desc: "Created date"}
      completed_at: {type: timestamp, desc: "Completion date"}

  week_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Task id, e.g. TSK-000123"}
      site_id: {type: str, desc: "Store id"}
      week_start: {type: date, desc: "Week start date (YYYY-MM-DD)"}
      task_name: {type: str, desc: "Task description"}
      task_type: {type: str, desc: "Type, e.g. Delivery, Cycle Count, Replenishment"}
      employee_id: {type: str, desc: "Employee id"}
      scheduled_date: {type: date, desc: "Scheduled date"}
      scheduled_start_time: {type: str, desc: "Start time, e.g. 06:00"}
      scheduled_duration_hours: {type: float, desc: "Expected duration"}
      status: {type: enum, values: [scheduled, in_progress, completed, cancelled], desc: "Status"}
      notes: {type: str, desc: "Task notes"}

  cycle_count_tasks:
    key: cycle_id
    cols:
      cycle_id: {type: str, desc: "Cycle count task, e.g. CYC-000123"}
      site_id: {type: str, desc: "Store id"}
      sku: {type: str, desc: "Product SKU"}
      location_id: {type: str, desc: "Store location if applicable"}
      category: {type: str, desc: "Product category"}
      count_date: {type: date, desc: "Scheduled count date"}
      reason: {type: str, desc: "Reason for count, e.g. Shrink investigation"}
      status: {type: enum, values: [pending, completed, cancelled], desc: "Count status"}
      system_quantity: {type: int, desc: "System quantity before count"}
      counted_quantity: {type: int, desc: "Actual counted quantity"}
      variance: {type: int, desc: "Difference (counted - system)"}
      created_at: {type: timestamp, desc: "Created date"}

  shelf_availability_exceptions:
    key: exc_id
    cols:
      exc_id: {type: str, desc: "Exception id, e.g. SAE-000123"}
      site_id: {type: str, desc: "Store id"}
      sku: {type: str, desc: "Product SKU"}
      exception_date: {type: date, desc: "Date observed"}
      status: {type: enum, values: [open, resolved, cancelled], desc: "Status"}
      location: {type: str, desc: "Shelf location if known"}
      system_stock: {type: int, desc: "System stock quantity"}
      observed_on_shelf: {type: int, desc: "Observed on shelf"}
      likely_cause: {type: str, desc: "Cause, e.g. Backroom, Delivery, Audit"}
      created_at: {type: timestamp, desc: "Date created"}

  replenishment_priorities:
    key: [site_id, sku]
    cols:
      site_id: {type: str, desc: "Store id"}
      sku: {type: str, desc: "Product SKU"}
      priority_level: {type: int, desc: "Priority (1=highest, 5=lowest)"}
      reason: {type: str, desc: "Reason for priority"}
      effective_from: {type: date, desc: "Date priority applies from"}
      updated_at: {type: timestamp, desc: "Last updated"}

  click_collect_demand:
    key: [site_id, sku, date]
    cols:
      site_id: {type: str, desc: "Store id"}
      sku: {type: str, desc: "Product SKU"}
      date: {type: date, desc: "Date"}
      forecasted_demand: {type: int, desc: "Forecast units"}
      actual_demand: {type: int, desc: "Actual units"}
      reserved_quantity: {type: int, desc: "Reserved in-store quantity"}
      online_allocation: {type: int, desc: "Online allocation"}

  shrink_control_programmes:
    key: prog_id
    cols:
      prog_id: {type: str, desc: "Programme id, e.g. SCP-000123"}
      programme_name: {type: str, desc: "Programme name, e.g. RFID Tagging"}
      control_type: {type: str, desc: "Type, e.g. Tagging, Layout, Staffing, System"}
      description: {type: str, desc: "Programme description"}
      annual_cost_gbp: {type: float, desc: "Annual cost per store"}
      estimated_shrink_reduction_pct: {type: float, desc: "Expected shrink reduction %"}

  take_back_pilot_results:
    key: pilot_id
    cols:
      pilot_id: {type: str, desc: "Pilot id, e.g. TBP-000123"}
      site_id: {type: str, desc: "Store id"}
      pilot_start: {type: date, desc: "Pilot start date"}
      pilot_end: {type: date, desc: "Pilot end date"}
      backroom_space_sqft: {type: float, desc: "Backroom space used, sqft"}
      monthly_participation_pct: {type: float, desc: "Customer participation %"}
      items_collected: {type: int, desc: "Items collected per month"}
      total_weight_kg: {type: float, desc: "Average monthly weight kg"}
      carbon_savings_kg: {type: float, desc: "Estimated CO2 savings kg per month"}
      customer_satisfaction_score: {type: float, desc: "Satisfaction 1-5"}

  backroom_constraints:
    key: site_id
    cols:
      site_id: {type: str, desc: "Store id"}
      total_backroom_sqft: {type: float, desc: "Total backroom space in sqft"}
      available_sqft: {type: float, desc: "Currently available sqft"}
      racking_capacity_pallets: {type: int, desc: "Max pallets on racking"}
      bulk_floor_capacity_pallets: {type: int, desc: "Max pallets on floor"}
      chilled_space_sqft: {type: float, desc: "Chilled storage in sqft"}
      hazmat_compliance: {type: bool, desc: "Hazmat storage compliant"}
      take_back_space_available: {type: bool, desc: "Space for take-back programme"}

  plan_vs_actual:
    key: [site_id, month]
    cols:
      site_id: {type: str, desc: "Store id"}
      month: {type: date, desc: "Month (first day)"}
      sales_plan_gbp: {type: float, desc: "Planned sales"}
      sales_actual_gbp: {type: float, desc: "Actual sales"}
      variance_gbp: {type: float, desc: "Variance (actual - plan)"}
      variance_pct: {type: float, desc: "Variance %"}
      margin_plan_pct: {type: float, desc: "Planned margin %"}
      margin_actual_pct: {type: float, desc: "Actual margin %"}

  store_control_results:
    key: [site_id, prog_id, month]
    cols:
      site_id: {type: str, desc: "Store id"}
      prog_id: {type: str, desc: "Programme id"}
      month: {type: date, desc: "Month"}
      control_cost_gbp: {type: float, desc: "Cost of control"}
      shrink_reduction_gbp: {type: float, desc: "Shrink value reduction"}
      payback_ratio: {type: float, desc: "Payback ratio (reduction/cost)"}

tools:
  - name: get_channel_options_for_line
    desc: Retrieve channel options for line. Shows which sales channels suit this product.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
    sql: |
      SELECT $sku AS sku, 'Online' AS channel, 0.8 AS recommended_split UNION
      SELECT $sku AS sku, 'Retail' AS channel, 0.15 AS recommended_split UNION
      SELECT $sku AS sku, 'Outlet' AS channel, 0.05 AS recommended_split
    limit: 10
    example: {sku: "SKU-100007"}

  - name: list_stores_in_region
    desc: List all stores in a region, with basic site info and performance flags.
    kind: select
    from: master.sites
    filters:
      region: {}
      cluster: {}
      type: {default: store}
    columns: [site_id, name, format, cluster, city, sqft, status]
    order: site_id
    limit: 100
    example: {region: "UK North"}

  - name: search_sites
    desc: Find stores, DCs and offices by name, town, region or format; returns site ids.
    kind: select
    from: master.sites
    filters:
      name: {op: like, desc: "Site name or part of it"}
      city: {op: like, desc: "City name or part of it"}
      region: {}
      format: {}
      type: {default: store, values: [store, dc, office]}
    columns: [site_id, name, format, region, city, cluster, sqft, status]
    order: name
    limit: 50
    example: {name: "Northampton"}

  - name: get_store_cluster_members
    desc: Retrieves store cluster members. Lists all stores in the same cluster as a given store.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
    sql: |
      SELECT s1.site_id, s1.name, s1.cluster, s1.city, s1.format, s1.sqft
      FROM master.sites s1
      JOIN master.sites s2 ON s1.cluster = s2.cluster
      WHERE s2.site_id = $site_id AND s1.site_id != $site_id AND s1.type = 'store'
      ORDER BY s1.name
    limit: 50
    example: {site_id: ST214}

  - name: search_peer_stores_for_store
    desc: Searches for peer stores for store. Finds similar stores by format, region and size.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      limit_count: {type: int, default: 5, desc: "Number of peers to return"}
    sql: |
      SELECT s2.site_id, s2.name, s2.format, s2.city, s2.cluster, s2.sqft,
             abs(s1.sqft - s2.sqft) AS sqft_diff
      FROM master.sites s1
      JOIN master.sites s2 ON s1.format = s2.format AND s1.region = s2.region
      WHERE s1.site_id = $site_id AND s2.site_id != $site_id AND s1.type = 'store' AND s2.type = 'store'
      ORDER BY abs(s1.sqft - s2.sqft) ASC
      LIMIT $limit_count
    limit: 10
    example: {site_id: ST214}

  - name: compare_store_kpis_within_cluster
    desc: Compares store kpis within cluster. Shows this store vs cluster average for shrink, availability and labour.
    kind: sql
    args:
      site_id: {required: true}
      month: {type: date, default: "-1m"}
    sql: |
      SELECT site_id, month, shrink_pct, availability_pct, labour_cost_pct, sales_gbp, margin_pct
      FROM store_kpis
      WHERE site_id = $site_id
        AND month >= CAST($as_of AS DATE) - INTERVAL 35 DAY
        AND month <= CAST($as_of AS DATE)
      ORDER BY month DESC
      LIMIT 1
    example: {site_id: ST214}

  - name: compare_store_kpis_with_peers
    desc: Compares store kpis with peers. Shows store performance vs its peer stores.
    kind: sql
    args:
      site_id: {required: true}
      month: {type: date, default: "-1m"}
    sql: |
      SELECT k.site_id, k.shrink_pct, k.availability_pct, k.labour_cost_pct, k.sales_gbp
      FROM store_kpis k
      WHERE k.site_id = $site_id
        AND k.month >= CAST($as_of AS DATE) - INTERVAL 35 DAY
        AND k.month <= CAST($as_of AS DATE)
      ORDER BY k.shrink_pct
      LIMIT 10
    example: {site_id: ST214}

  - name: create_store_visit_task
    desc: Adds a store visit to the area manager's visit schedule. Returns the new visit task.
    kind: insert
    table: store_visits
    id_prefix: VIS-
    defaults: {status: planned}
    args:
      site_id: {required: true, desc: "Store id"}
      employee_id: {required: true, desc: "Visiting manager employee id"}
      visit_date: {type: date, required: true, desc: "Date of visit"}
      visit_purpose: {required: true, desc: "Visit purpose, e.g. Quarterly review"}
      duration_hours: {type: float, default: 4, desc: "Expected duration in hours"}
    example: {site_id: ST214, employee_id: EMP-00005, visit_date: "+7d", visit_purpose: "Quarterly performance review"}

  - name: create_store_action_plan_item
    desc: Adds an owned, dated action to the store improvement plan. Returns the new action.
    kind: insert
    table: action_plans
    id_prefix: API-
    defaults: {status: open}
    args:
      site_id: {required: true, desc: "Store id"}
      title: {required: true, desc: "Action description"}
      owner: {required: true, desc: "Employee id responsible"}
      due_date: {type: date, required: true, desc: "Target completion date"}
      priority: {default: medium, desc: "Priority level"}
      category: {desc: "Category, e.g. Shrink, Availability, Labour"}
    example: {site_id: ST214, title: "Implement RFID tagging", owner: "EMP-00005", due_date: "+30d", priority: high, category: Shrink}

  - name: draft_store_visit_action_plan
    desc: Draft an action plan for a store visit. Returns a formatted action plan with priorities.
    kind: draft
    args: [site_id]
    sql:
      kpis: |
        SELECT site_id, shrink_pct, availability_pct, labour_cost_pct, sales_gbp, margin_pct
        FROM store_kpis
        WHERE site_id = $site_id
        ORDER BY month DESC LIMIT 1
      recent_actions: |
        SELECT action_id, title, priority, due_date, status
        FROM action_plans
        WHERE site_id = $site_id AND status IN ('open', 'in_progress')
        ORDER BY priority DESC LIMIT 5
    template: |
      ACTION PLAN FOR {{ site_id }}
      Generated for store visit

      CURRENT PERFORMANCE:
      {% if kpis %}
      - Shrink: {{ kpis[0].shrink_pct | num(2) }}%
      - Shelf Availability: {{ kpis[0].availability_pct | num(2) }}%
      - Labour Cost: {{ kpis[0].labour_cost_pct | num(2) }}%
      - Monthly Sales: {{ kpis[0].sales_gbp | money }}
      - Margin: {{ kpis[0].margin_pct | num(2) }}%
      {% endif %}

      PRIORITY ACTIONS:
      {% for action in recent_actions %}
      - {{ action.title }} (Due: {{ action.due_date }}, {{ action.priority | upper }})
      {% endfor %}
    example: {site_id: ST214}

  - name: get_delivery_schedule_for_store
    desc: Retrieves delivery schedule for store. Shows planned deliveries for the week.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      week_start: {type: date, default: "-7d", desc: "Week start date (YYYY-MM-DD)"}
    sql: |
      SELECT t.task_id, t.task_name, t.scheduled_date, t.scheduled_start_time,
             t.scheduled_duration_hours, t.status, t.notes
      FROM week_tasks t
      WHERE t.site_id = $site_id
        AND t.task_type = 'Delivery'
        AND t.week_start = CAST($week_start AS DATE)
      ORDER BY t.scheduled_date, t.scheduled_start_time
    limit: 20
    example: {site_id: ST214}

  - name: get_task_list_for_store_week
    desc: Retrieves task list for store week. Shows all scheduled tasks including delivery, cycle counts and replenishment.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      week_start: {type: date, default: "-7d", desc: "Week start date (YYYY-MM-DD)"}
    sql: |
      SELECT t.task_id, t.task_name, t.task_type, t.employee_id,
             t.scheduled_date, t.scheduled_start_time, t.scheduled_duration_hours,
             t.status, t.notes
      FROM week_tasks t
      WHERE t.site_id = $site_id
        AND t.week_start = CAST($week_start AS DATE)
      ORDER BY t.scheduled_date, t.scheduled_start_time
    limit: 50
    example: {site_id: ST214}

  - name: reassign_task_to_employee
    desc: Moves a scheduled store task to a different team member. Returns the updated task.
    kind: update
    table: week_tasks
    set: {employee_id: "{employee_id}"}
    args:
      employee_id: {required: true, desc: "Employee id to reassign to"}
    example: {task_id: TSK-900001, employee_id: EMP-00015}

  - name: delete_task_from_store_week
    desc: Removes a scheduled task from a store's week plan. Returns status.
    kind: update
    table: week_tasks
    set: {status: cancelled}
    example: {task_id: TSK-000001}

  - name: create_cycle_count_task_for_store
    desc: Creates a cycle-count task for named lines or a category in a store. Returns the new count task.
    kind: insert
    table: cycle_count_tasks
    id_prefix: CYC-
    defaults: {status: pending}
    args:
      site_id: {required: true, desc: "Store id"}
      sku: {desc: "Single SKU to count"}
      category: {desc: "Product category to count"}
      count_date: {type: date, required: true, desc: "Scheduled count date"}
      reason: {required: true, desc: "Reason for count, e.g. Shrink investigation"}
    example: {site_id: ST214, sku: "SKU-100007", count_date: "+6d", reason: "High shrink anomaly"}

  - name: get_shelf_availability_exceptions_for_store
    desc: Retrieves shelf availability exceptions for store. Shows products with gaps on shelf.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      days_back: {type: int, default: 7, desc: "Days to look back"}
    sql: |
      SELECT exc_id, sku, exception_date, status, location, system_stock,
             observed_on_shelf, likely_cause
      FROM shelf_availability_exceptions
      WHERE site_id = $site_id
        AND exception_date >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
        AND status IN ('open', 'resolved')
      ORDER BY exception_date DESC
    limit: 50
    example: {site_id: ST214}

  - name: update_shelf_replenishment_priority_for_product
    desc: Raises a product's shelf replenishment priority so its gaps are filled first. Returns updated priority.
    kind: update
    table: replenishment_priorities
    set: {priority_level: "{priority_level}", reason: "{reason}", updated_at: "$as_of"}
    args:
      priority_level: {required: true, type: int, desc: "New priority (1=highest, 5=lowest)"}
      reason: {default: "Shelf gap response", desc: "Reason for priority change"}
    example: {site_id: ST214, sku: "SKU-100007", priority_level: 1}

  - name: get_click_and_collect_demand_for_product
    desc: Retrieves click and collect demand for product. Shows forecasted vs actual C&C demand by store.
    kind: sql
    args:
      sku: {required: true, desc: "Product SKU"}
      days_back: {type: int, default: 14, desc: "Days to look back"}
    sql: |
      SELECT sku, site_id, date, forecasted_demand, actual_demand, reserved_quantity,
             online_allocation
      FROM click_collect_demand
      WHERE sku = $sku
        AND date >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
      ORDER BY site_id, date DESC
    limit: 50
    example: {sku: "SKU-100007"}

  - name: get_shrink_control_programmes
    desc: Retrieves shrink control programmes. Lists available shrink reduction initiatives with costs and benefits.
    kind: select
    from: shrink_control_programmes
    filters:
      control_type: {}
    columns: [prog_id, programme_name, control_type, description, annual_cost_gbp, estimated_shrink_reduction_pct]
    order: prog_id
    limit: 20
    example: {}

  - name: get_control_costs_and_results_by_store
    desc: Retrieves control costs and results by store. Shows ROI of shrink controls at each store.
    kind: sql
    args:
      site_id: {desc: "Store id (default all)"}
      month: {type: date, default: "-1m", desc: "Month to report"}
    sql: |
      SELECT r.site_id, r.prog_id, p.programme_name, r.control_cost_gbp,
             r.shrink_reduction_gbp, r.payback_ratio
      FROM store_control_results r
      JOIN shrink_control_programmes p ON r.prog_id = p.prog_id
      WHERE ($site_id IS NULL OR r.site_id = $site_id)
        AND r.month = CAST($month AS DATE)
      ORDER BY r.payback_ratio DESC
    limit: 50
    example: {}

  - name: get_take_back_pilot_results
    desc: Results of take-back pilots. Shows participation, volume and carbon savings from each pilot.
    kind: select
    from: take_back_pilot_results
    filters:
      site_id: {}
      pilot_start: {col: pilot_start, op: ">=", default: "-365d"}
    columns: [pilot_id, site_id, pilot_start, pilot_end, monthly_participation_pct, items_collected,
              total_weight_kg, carbon_savings_kg, backroom_space_sqft]
    order: pilot_start
    limit: 20
    example: {}

  - name: get_store_backroom_space_constraints
    desc: Back-of-house space by store. Shows available backroom capacity and compliance status.
    kind: select
    from: backroom_constraints
    filters:
      site_id: {}
      take_back_space_available: {}
      hazmat_compliance: {}
    columns: [site_id, total_backroom_sqft, available_sqft, racking_capacity_pallets,
              bulk_floor_capacity_pallets, chilled_space_sqft, take_back_space_available]
    order: site_id
    limit: 100
    example: {}

  - name: calculate_take_back_programme_cost
    desc: Cost and volume model for store take-back rollout. Calculates investment and ROI for nationwide rollout.
    kind: sql
    args:
      pilot_site_id: {required: true, desc: "Reference pilot store site id"}
      rollout_store_count: {type: int, default: 100, desc: "Number of stores to roll out to"}
      participation_rate_pct: {type: float, default: 20, desc: "Expected participation rate %"}
    sql: |
      SELECT
        COUNT(DISTINCT s.site_id) AS stores_in_rollout,
        ROUND(AVG(b.total_backroom_sqft), 0) AS avg_store_backroom_sqft,
        (SELECT total_weight_kg FROM take_back_pilot_results WHERE site_id = $pilot_site_id ORDER BY pilot_end DESC LIMIT 1) AS avg_monthly_weight_kg,
        (SELECT annual_cost_gbp FROM shrink_control_programmes WHERE control_type = 'TakeBack' ORDER BY prog_id LIMIT 1) AS cost_per_store_gbp,
        ROUND((SELECT annual_cost_gbp FROM shrink_control_programmes WHERE control_type = 'TakeBack' ORDER BY prog_id LIMIT 1) * CAST($rollout_store_count AS FLOAT), 0) AS total_investment_gbp,
        ROUND(CAST($rollout_store_count AS FLOAT) * (SELECT total_weight_kg FROM take_back_pilot_results WHERE site_id = $pilot_site_id ORDER BY pilot_end DESC LIMIT 1) * 12 * 0.15, 0) AS annual_carbon_kg,
        'investment = cost_per_store * stores; carbon = avg_weight * stores * 12 * carbon_per_kg' AS formula
      FROM master.sites s
      JOIN backroom_constraints b ON s.site_id = b.site_id
      WHERE s.type = 'store' AND b.take_back_space_available = true
      LIMIT 1
    limit: 1
    example: {pilot_site_id: ST214, rollout_store_count: 100, participation_rate_pct: 20}

  - name: get_plan_vs_actual_by_store
    desc: Retrieves plan vs actual by store. Shows sales and margin variance by store for the period.
    kind: sql
    args:
      site_id: {desc: "Store id (default all)"}
      month: {type: date, default: "-1m", desc: "Month to report"}
    sql: |
      SELECT site_id, sales_plan_gbp, sales_actual_gbp, variance_gbp, variance_pct,
             margin_plan_pct, margin_actual_pct, month
      FROM plan_vs_actual
      WHERE ($site_id IS NULL OR site_id = $site_id)
        AND month = CAST($month AS DATE)
      ORDER BY variance_pct DESC
    limit: 100
    example: {}
