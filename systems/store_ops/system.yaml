id: store_ops
name: Store Operations Platform
instructions: >
  Store operations: monthly store KPIs and plan vs actual, peer and cluster comparison, area visits, action plans,
  week task plans, shelf gaps, cycle counts, shrink controls, take-back pilots, channel options.
  Ids: stores ST214, visits VIS-000123, actions API-000123, tasks TSK-000123.

tables:
  store_kpis:
    key: [site_id, month]
    cols:
      site_id: {type: str, desc: "Store id"}
      month: {type: date, desc: "Month (first day of month)"}
      shrink_pct: {type: float, desc: "Shrink as % of sales"}
      availability_pct: {type: float, desc: "Shelf availability %"}
      labour_cost_pct: {type: float, desc: "Labour cost as % of sales"}
      footfall: {type: int, desc: "Monthly footfall count"}
      sales_gbp: {type: float, desc: "Monthly sales in GBP"}
      margin_pct: {type: float, desc: "Gross margin %"}

  store_visits:
    key: visit_id
    cols:
      visit_id: {type: str, desc: "Store visit, e.g. VIS-000123"}
      site_id: {type: str, desc: "Store id"}
      employee_id: {type: str, desc: "Visiting manager employee id"}
      visit_date: {type: date, desc: "Date of visit"}
      visit_purpose: {type: str, desc: "Visit purpose, e.g. Quarterly review"}
      issues_found: {type: int, desc: "Number of issues identified"}
      actions_raised: {type: int, desc: "Number of actions raised"}
      duration_hours: {type: float, desc: "Duration of visit in hours"}
      status: {type: enum, values: [planned, completed, cancelled], desc: "Visit status"}
      notes: {type: str, desc: "Visit notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  action_plans:
    key: action_id
    cols:
      action_id: {type: str, desc: "Action plan item, e.g. API-000123"}
      site_id: {type: str, desc: "Store id"}
      title: {type: str, desc: "Action description"}
      employee_id: {type: str, desc: "Employee id of the action owner"}
      due_date: {type: date, desc: "Target completion date"}
      status: {type: enum, values: [open, in_progress, completed, cancelled], desc: "Status"}
      priority: {type: enum, values: [low, medium, high, urgent], desc: "Priority"}
      category: {type: str, desc: "Category, e.g. Shrink, Availability, Labour"}
      created_at: {type: timestamp, desc: "Created date"}
      completed_at: {type: timestamp, desc: "Completion date"}

  week_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Task id, e.g. TSK-000123"}
      site_id: {type: str, desc: "Store id"}
      week_start: {type: date, desc: "Week start date (YYYY-MM-DD)"}
      task_name: {type: str, desc: "Task description"}
      task_type: {type: str, desc: "Type, e.g. Delivery, Cycle Count, Replenishment"}
      employee_id: {type: str, desc: "Employee id"}
      scheduled_date: {type: date, desc: "Scheduled date"}
      scheduled_start_time: {type: str, desc: "Start time, e.g. 06:00"}
      scheduled_duration_hours: {type: float, desc: "Expected duration"}
      status: {type: enum, values: [scheduled, in_progress, completed, cancelled], desc: "Status"}
      notes: {type: str, desc: "Task notes"}

  cycle_count_tasks:
    key: cycle_id
    cols:
      cycle_id: {type: str, desc: "Cycle count task, e.g. CYC-000123"}
      site_id: {type: str, desc: "Store id"}
      sku: {type: str, desc: "Product SKU"}
      location_id: {type: str, desc: "Store location if applicable"}
      category: {type: str, desc: "Product category"}
      count_date: {type: date, desc: "Scheduled count date"}
      reason: {type: str, desc: "Reason for count, e.g. Shrink investigation"}
      status: {type: enum, values: [pending, completed, cancelled], desc: "Count status"}
      system_quantity: {type: int, desc: "System quantity before count"}
      counted_quantity: {type: int, desc: "Actual counted quantity"}
      variance: {type: int, desc: "Difference (counted - system)"}
      created_at: {type: timestamp, desc: "Created date"}

  shelf_availability_exceptions:
    key: exc_id
    cols:
      exc_id: {type: str, desc: "Exception id, e.g. SAE-000123"}
      site_id: {type: str, desc: "Store id"}
      sku: {type: str, desc: "Product SKU"}
      exception_date: {type: date, desc: "Date observed"}
      status: {type: enum, values: [open, resolved, cancelled], desc: "Status"}
      location: {type: str, desc: "Shelf location if known"}
      system_stock: {type: int, desc: "System stock quantity"}
      observed_on_shelf: {type: int, desc: "Observed on shelf"}
      backroom_units: {type: int, desc: "Units held in the back room for this line"}
      likely_cause: {type: str, desc: "Cause, e.g. Backroom, Delivery, Audit"}
      created_at: {type: timestamp, desc: "Date created"}

  replenishment_priorities:
    key: [site_id, sku]
    cols:
      site_id: {type: str, desc: "Store id"}
      sku: {type: str, desc: "Product SKU"}
      priority_level: {type: int, desc: "Priority (1=highest, 5=lowest)"}
      reason: {type: str, desc: "Reason for priority"}
      effective_from: {type: date, desc: "Date priority applies from"}
      updated_at: {type: timestamp, desc: "Last updated"}

  click_collect_demand:
    key: [site_id, sku, date]
    cols:
      site_id: {type: str, desc: "Store id"}
      sku: {type: str, desc: "Product SKU"}
      date: {type: date, desc: "Date"}
      forecasted_demand: {type: int, desc: "Forecast units"}
      actual_demand: {type: int, desc: "Actual units"}
      reserved_quantity: {type: int, desc: "Reserved in-store quantity"}
      online_allocation: {type: int, desc: "Online allocation"}

  shrink_control_programmes:
    key: prog_id
    cols:
      prog_id: {type: str, desc: "Programme id, e.g. SCP-0001"}
      programme_name: {type: str, desc: "Programme name, e.g. RFID Tagging"}
      control_type: {type: str, desc: "Type: Tagging, Layout, Staffing, Security, System or TakeBack"}
      description: {type: str, desc: "Programme description"}
      annual_cost_gbp: {type: float, desc: "Annual cost per store, GBP"}
      estimated_shrink_reduction_pct: {type: float, desc: "Business-case expected shrink reduction, % of shrink"}

  take_back_pilot_results:
    key: pilot_id
    cols:
      pilot_id: {type: str, desc: "Pilot id, e.g. TBP-000123"}
      site_id: {type: str, desc: "Store id"}
      pilot_start: {type: date, desc: "Pilot start date"}
      pilot_end: {type: date, desc: "Pilot end date"}
      backroom_space_sqft: {type: float, desc: "Backroom space used, sqft"}
      monthly_participation_pct: {type: float, desc: "Customer participation %"}
      items_collected: {type: int, desc: "Items collected per month"}
      total_weight_kg: {type: float, desc: "Average monthly weight kg"}
      carbon_savings_kg: {type: float, desc: "Estimated CO2 savings kg per month"}
      customer_satisfaction_score: {type: float, desc: "Satisfaction 1-5"}

  backroom_constraints:
    key: site_id
    cols:
      site_id: {type: str, desc: "Store id"}
      total_backroom_sqft: {type: float, desc: "Total backroom space in sqft"}
      available_sqft: {type: float, desc: "Currently available sqft"}
      racking_capacity_pallets: {type: int, desc: "Max pallets on racking"}
      bulk_floor_capacity_pallets: {type: int, desc: "Max pallets on floor"}
      chilled_space_sqft: {type: float, desc: "Chilled storage in sqft"}
      hazmat_compliance: {type: bool, desc: "Hazmat storage compliant"}
      take_back_space_available: {type: bool, desc: "Space for take-back programme"}

  plan_vs_actual:
    key: [site_id, month]
    cols:
      site_id: {type: str, desc: "Store id"}
      month: {type: date, desc: "Month (first day)"}
      sales_plan_gbp: {type: float, desc: "Planned sales"}
      sales_actual_gbp: {type: float, desc: "Actual sales"}
      variance_gbp: {type: float, desc: "Variance (actual - plan)"}
      variance_pct: {type: float, desc: "Variance %"}
      margin_plan_pct: {type: float, desc: "Planned margin %"}
      margin_actual_pct: {type: float, desc: "Actual margin %"}

  store_control_results:
    key: [site_id, prog_id, month]
    cols:
      site_id: {type: str, desc: "Store id"}
      prog_id: {type: str, desc: "Programme id"}
      month: {type: date, desc: "Month"}
      control_cost_gbp: {type: float, desc: "Cost of control"}
      shrink_reduction_gbp: {type: float, desc: "Shrink value reduction"}
      payback_ratio: {type: float, desc: "Payback ratio (reduction/cost)"}

  channel_options:
    key: [sku, channel]
    cols:
      sku: {type: str, desc: "Product SKU"}
      channel: {type: enum, values: [Retail, Online, Outlet, Wholesale], desc: "Clearance sales channel"}
      price_realisation_pct: {type: float, desc: "Price achieved as % of full retail price"}
      sell_through_pct: {type: float, desc: "Share of the stock the channel clears within 8 weeks, %"}
      weeks_to_clear: {type: int, desc: "Typical weeks to clear the line"}
      constraint_note: {type: str, desc: "Restriction on using this channel for the line"}

tools:
  - name: get_channel_options_for_line
    desc: Clearance channel options for one SKU (Retail, Online, Outlet, Wholesale) ranked by expected recovery, with price realisation, sell-through and constraints. Use for aged stock.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT o.sku, p.name, p.category, o.channel, o.price_realisation_pct, o.sell_through_pct,
             round(o.price_realisation_pct * o.sell_through_pct / 100, 1) AS expected_recovery_pct_of_full_price,
             o.weeks_to_clear, o.constraint_note,
             rank() OVER (ORDER BY o.price_realisation_pct * o.sell_through_pct DESC) AS channel_rank
      FROM channel_options o
      JOIN master.products p USING (sku)
      WHERE o.sku = $sku
      ORDER BY channel_rank, o.channel
    limit: 10
    example: {sku: "SKU-105054"}

  - name: list_stores_in_region
    desc: Stores in a region with latest shrink, availability, labour cost, sales vs plan and performance flags, worst sales variance first. Use to see which stores need attention.
    kind: sql
    args:
      region: {desc: "Region name, e.g. UK North, UK South, Scotland"}
      cluster: {desc: "Store cluster A, B, C or D"}
      format: {desc: "Store format, e.g. high_street, retail_park"}
    sql: |
      WITH m AS (
        SELECT month FROM store_kpis ORDER BY abs(date_diff('day', month, CAST($as_of AS DATE))) LIMIT 1)
      SELECT s.site_id, s.name, s.format, s.cluster, s.city, s.sqft, s.status,
             k.shrink_pct, k.availability_pct, k.labour_cost_pct, p.variance_pct AS sales_vs_plan_pct,
             coalesce(nullif(concat_ws('; ',
               CASE WHEN p.variance_pct < -5 THEN 'sales more than 5% below plan' END,
               CASE WHEN k.availability_pct < 94.5 THEN 'availability below 94.5%' END,
               CASE WHEN k.shrink_pct > 1.5 THEN 'shrink above 1.5%' END,
               CASE WHEN k.labour_cost_pct > 13.5 THEN 'labour cost above 13.5%' END), ''), 'on target') AS flags
      FROM master.sites s
      LEFT JOIN store_kpis k ON k.site_id = s.site_id AND k.month = (SELECT month FROM m)
      LEFT JOIN plan_vs_actual p ON p.site_id = s.site_id AND p.month = (SELECT month FROM m)
      WHERE s.type = 'store'
        AND ($region IS NULL OR lower(s.region) = lower($region))
        AND ($cluster IS NULL OR upper(s.cluster) = upper($cluster))
        AND ($format IS NULL OR lower(s.format) = lower($format))
      ORDER BY p.variance_pct, s.site_id
    limit: 100
    example: {region: "UK North"}

  - name: search_sites
    desc: Find stores, DCs and offices by name, town, region or format; returns site ids.
    kind: select
    from: master.sites
    filters:
      name: {op: like, desc: "Site name or part of it"}
      city: {op: like, desc: "City name or part of it"}
      region: {}
      format: {}
      type: {default: store, values: [store, dc, office]}
    columns: [site_id, name, format, region, city, cluster, sqft, status]
    order: name
    limit: 50
    example: {name: "Northampton", type: dc}

  - name: get_store_cluster_members
    desc: Other stores in the same cluster as a store, with latest shrink, availability and labour cost, most similar format and size first. Use to choose comparators.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      region: {desc: "Only members in this region, e.g. Scotland"}
    sql: |
      WITH m AS (
        SELECT month FROM store_kpis ORDER BY abs(date_diff('day', month, CAST($as_of AS DATE))) LIMIT 1)
      SELECT s1.site_id, s1.name, s1.cluster, s1.region, s1.city, s1.format, s1.sqft,
             abs(CAST(s1.sqft AS BIGINT) - CAST(s2.sqft AS BIGINT)) AS sqft_diff,
             k.shrink_pct, k.availability_pct, k.labour_cost_pct
      FROM master.sites s2
      JOIN master.sites s1 ON s1.cluster = s2.cluster AND s1.site_id <> s2.site_id AND s1.type = 'store'
      LEFT JOIN store_kpis k ON k.site_id = s1.site_id AND k.month = (SELECT month FROM m)
      WHERE s2.site_id = $site_id
        AND ($region IS NULL OR lower(s1.region) = lower($region))
      ORDER BY (s1.format = s2.format) DESC, sqft_diff, s1.site_id
    limit: 100
    example: {site_id: ST214}

  - name: search_peer_stores_for_store
    desc: The closest peer stores for a store, matched on format, cluster, region and size, with a match score. Use before comparing KPIs with peers.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      limit_count: {type: int, default: 5, desc: "Number of peers to return"}
    sql: |
      SELECT s2.site_id, s2.name, s2.format, s2.cluster, s2.region, s2.city, s2.sqft,
             abs(CAST(s1.sqft AS BIGINT) - CAST(s2.sqft AS BIGINT)) AS sqft_diff,
             (s1.format = s2.format)::INT * 2 + (s1.cluster = s2.cluster)::INT * 2 + (s1.region = s2.region)::INT AS peer_score,
             concat_ws(' + ', CASE WHEN s1.format = s2.format THEN 'same format' END,
                              CASE WHEN s1.cluster = s2.cluster THEN 'same cluster' END,
                              CASE WHEN s1.region = s2.region THEN 'same region' END) AS matches
      FROM master.sites s1
      JOIN master.sites s2 ON s2.type = 'store' AND s2.status = 'open' AND s2.country = s1.country AND s2.site_id <> s1.site_id
      WHERE s1.site_id = $site_id
      ORDER BY peer_score DESC, sqft_diff, s2.site_id
      LIMIT $limit_count
    limit: 20
    example: {site_id: ST214}

  - name: compare_store_kpis_within_cluster
    desc: One store against its whole cluster on shrink, availability and labour cost, with rank, cluster average and gap value in pounds a month. Use to find the biggest gap.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      month: {type: date, default: "today", desc: "Month to compare; the nearest month with data is used"}
    sql: |
      WITH m AS (
        SELECT month FROM store_kpis ORDER BY abs(date_diff('day', month, CAST($month AS DATE))) LIMIT 1),
      grp AS (
        SELECT s.site_id FROM master.sites s
        WHERE s.type = 'store' AND s.cluster = (SELECT cluster FROM master.sites WHERE site_id = $site_id)),
      base AS (
        SELECT k.site_id, k.sales_gbp, k.shrink_pct, k.availability_pct, k.labour_cost_pct
        FROM store_kpis k
        WHERE k.month = (SELECT month FROM m) AND k.site_id IN (SELECT site_id FROM grp)),
      long AS (
        SELECT site_id, sales_gbp, 'shrink_pct' AS metric, shrink_pct AS v, 'lower' AS better FROM base UNION ALL
        SELECT site_id, sales_gbp, 'availability_pct', availability_pct, 'higher' FROM base UNION ALL
        SELECT site_id, sales_gbp, 'labour_cost_pct', labour_cost_pct, 'lower' FROM base),
      ranked AS (
        SELECT *, rank() OVER (PARTITION BY metric ORDER BY CASE WHEN better = 'lower' THEN v ELSE -v END) AS rnk,
               count(*) OVER (PARTITION BY metric) AS of_stores,
               avg(v) OVER (PARTITION BY metric) AS cluster_avg,
               first_value(site_id) OVER (PARTITION BY metric ORDER BY CASE WHEN better = 'lower' THEN v ELSE -v END, site_id) AS best_store,
               first_value(v) OVER (PARTITION BY metric ORDER BY CASE WHEN better = 'lower' THEN v ELSE -v END, site_id) AS best_value
        FROM long)
      SELECT $site_id AS site_id, (SELECT month FROM m) AS month, r.metric, r.v AS store_value,
             round(r.cluster_avg, 2) AS cluster_avg, round(r.v - r.cluster_avg, 2) AS gap_vs_avg,
             r.better || ' is better' AS direction, r.rnk AS rank_1_is_best, r.of_stores AS stores_in_cluster,
             r.best_store, r.best_value,
             round(greatest(CASE WHEN r.better = 'lower' THEN r.v - r.cluster_avg ELSE r.cluster_avg - r.v END, 0) / 100 * r.sales_gbp) AS gap_value_gbp_per_month,
             'gap value = adverse gap in % points x monthly sales' AS formula
      FROM ranked r
      WHERE r.site_id = $site_id
      ORDER BY gap_value_gbp_per_month DESC
    limit: 10
    example: {site_id: ST214}

  - name: compare_store_kpis_with_peers
    desc: One store against its closest peer stores on shrink, availability, labour cost, margin, sales vs plan and sales per visitor, with gaps and rank. Use to see what differs.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      peer_count: {type: int, default: 5, desc: "Number of closest peer stores to compare with"}
      month: {type: date, default: "today", desc: "Month to compare; the nearest month with data is used"}
    sql: |
      WITH m AS (
        SELECT month FROM store_kpis ORDER BY abs(date_diff('day', month, CAST($month AS DATE))) LIMIT 1),
      peers AS (
        SELECT s2.site_id,
               (s1.format = s2.format)::INT * 2 + (s1.cluster = s2.cluster)::INT * 2 + (s1.region = s2.region)::INT AS peer_score,
               abs(CAST(s1.sqft AS BIGINT) - CAST(s2.sqft AS BIGINT)) AS sqft_diff
        FROM master.sites s1
        JOIN master.sites s2 ON s2.type = 'store' AND s2.status = 'open' AND s2.country = s1.country AND s2.site_id <> s1.site_id
        WHERE s1.site_id = $site_id
        ORDER BY peer_score DESC, sqft_diff, s2.site_id
        LIMIT $peer_count),
      base AS (
        SELECT k.site_id, k.sales_gbp, k.shrink_pct, k.availability_pct, k.labour_cost_pct, k.margin_pct,
               p.variance_pct AS sales_vs_plan_pct, round(k.sales_gbp / nullif(k.footfall, 0), 2) AS sales_per_visitor_gbp
        FROM store_kpis k
        JOIN plan_vs_actual p ON p.site_id = k.site_id AND p.month = k.month
        WHERE k.month = (SELECT month FROM m) AND (k.site_id = $site_id OR k.site_id IN (SELECT site_id FROM peers))),
      long AS (
        SELECT site_id, sales_gbp, 'shrink_pct' AS metric, shrink_pct AS v, 'lower' AS better FROM base UNION ALL
        SELECT site_id, sales_gbp, 'availability_pct', availability_pct, 'higher' FROM base UNION ALL
        SELECT site_id, sales_gbp, 'labour_cost_pct', labour_cost_pct, 'lower' FROM base UNION ALL
        SELECT site_id, sales_gbp, 'margin_pct', margin_pct, 'higher' FROM base UNION ALL
        SELECT site_id, sales_gbp, 'sales_vs_plan_pct', sales_vs_plan_pct, 'higher' FROM base UNION ALL
        SELECT site_id, sales_gbp, 'sales_per_visitor_gbp', sales_per_visitor_gbp, 'higher' FROM base),
      ranked AS (
        SELECT *, rank() OVER (PARTITION BY metric ORDER BY CASE WHEN better = 'lower' THEN v ELSE -v END) AS rnk,
               count(*) OVER (PARTITION BY metric) AS of_stores,
               avg(v) FILTER (WHERE site_id <> $site_id) OVER (PARTITION BY metric) AS peer_avg
        FROM long)
      SELECT $site_id AS site_id, (SELECT month FROM m) AS month, r.metric, r.v AS store_value,
             round(r.peer_avg, 2) AS peer_avg, round(r.v - r.peer_avg, 2) AS gap_vs_peer_avg,
             r.better || ' is better' AS direction, r.rnk AS rank_1_is_best, r.of_stores AS stores_compared,
             CASE WHEN r.metric IN ('shrink_pct', 'availability_pct', 'labour_cost_pct')
                  THEN round(greatest(CASE WHEN r.better = 'lower' THEN r.v - r.peer_avg ELSE r.peer_avg - r.v END, 0) / 100 * r.sales_gbp) END AS gap_value_gbp_per_month,
             (SELECT string_agg(site_id, ', ' ORDER BY peer_score DESC, sqft_diff) FROM peers) AS peers_used
      FROM ranked r
      WHERE r.site_id = $site_id
      ORDER BY r.metric
    limit: 10
    example: {site_id: ST214}

  - name: create_store_visit_task
    desc: Adds a store visit to the area manager's visit schedule. Returns the new visit task.
    kind: insert
    table: store_visits
    id_prefix: VIS-
    defaults: {status: planned, issues_found: 0, actions_raised: 0}
    args:
      site_id: {required: true, desc: "Store id"}
      employee_id: {required: true, desc: "Visiting manager employee id"}
      visit_date: {type: date, required: true, desc: "Date of visit"}
      visit_purpose: {required: true, desc: "Visit purpose, e.g. Quarterly review"}
      duration_hours: {type: float, default: 4, desc: "Expected duration in hours"}
      notes: {desc: "Agenda or reason for the visit"}
    example: {site_id: ST214, employee_id: EMP-00003, visit_date: "+7d", visit_purpose: "Recovery plan review"}

  - name: create_store_action_plan_item
    desc: Adds an owned, dated action to the store improvement plan. Returns the new action.
    kind: insert
    table: action_plans
    id_prefix: API-
    defaults: {status: open}
    args:
      site_id: {required: true, desc: "Store id"}
      title: {required: true, desc: "Action description"}
      employee_id: {required: true, desc: "Employee id of the action owner"}
      due_date: {type: date, required: true, desc: "Target completion date"}
      priority: {default: medium, desc: "Priority: low, medium, high or urgent"}
      category: {desc: "Category, e.g. Shrink, Availability, Labour"}
    example: {site_id: ST214, title: "Weekly Dresses count and floor walk", employee_id: "EMP-00536", due_date: "+30d", priority: high, category: Shrink}

  - name: draft_store_visit_action_plan
    desc: Draft an action plan for a store visit from the store's gaps against its five closest peers, plus its open actions. Nothing is saved or sent.
    kind: draft
    args:
      site_id: {required: true, desc: "Store id"}
      visit_date: {type: date, desc: "Planned visit date"}
    sql:
      store: |
        SELECT s.site_id, s.name, s.city, s.region, s.cluster FROM master.sites s WHERE s.site_id = $site_id
      kpis: |
        SELECT k.month, k.shrink_pct, k.availability_pct, k.labour_cost_pct, k.margin_pct, k.sales_gbp, p.variance_pct AS sales_vs_plan_pct
        FROM store_kpis k JOIN plan_vs_actual p ON p.site_id = k.site_id AND p.month = k.month
        WHERE k.site_id = $site_id ORDER BY k.month DESC LIMIT 1
      gaps: |
        WITH peers AS (
          SELECT s2.site_id,
                 (s1.format = s2.format)::INT * 2 + (s1.cluster = s2.cluster)::INT * 2 + (s1.region = s2.region)::INT AS peer_score,
                 abs(CAST(s1.sqft AS BIGINT) - CAST(s2.sqft AS BIGINT)) AS sqft_diff
          FROM master.sites s1
          JOIN master.sites s2 ON s2.type = 'store' AND s2.status = 'open' AND s2.country = s1.country AND s2.site_id <> s1.site_id
          WHERE s1.site_id = $site_id
          ORDER BY peer_score DESC, sqft_diff, s2.site_id LIMIT 5),
        lm AS (SELECT max(month) AS month FROM store_kpis WHERE month <= CAST($as_of AS DATE)),
        me AS (SELECT * FROM store_kpis WHERE site_id = $site_id AND month = (SELECT month FROM lm)),
        pe AS (SELECT avg(shrink_pct) AS sh, avg(availability_pct) AS av, avg(labour_cost_pct) AS lb
               FROM store_kpis WHERE site_id IN (SELECT site_id FROM peers) AND month = (SELECT month FROM lm))
        SELECT 'Shelf availability' AS area, 'Availability' AS category, me.availability_pct AS store_value, round(pe.av, 1) AS peer_avg,
               round(pe.av - me.availability_pct, 2) AS gap_pts, round((pe.av - me.availability_pct) / 100 * me.sales_gbp) AS gbp_per_month
        FROM me, pe WHERE pe.av > me.availability_pct
        UNION ALL
        SELECT 'Shrink', 'Shrink', me.shrink_pct, round(pe.sh, 2), round(me.shrink_pct - pe.sh, 2),
               round((me.shrink_pct - pe.sh) / 100 * me.sales_gbp) FROM me, pe WHERE me.shrink_pct > pe.sh
        UNION ALL
        SELECT 'Labour cost', 'Labour', me.labour_cost_pct, round(pe.lb, 1), round(me.labour_cost_pct - pe.lb, 2),
               round((me.labour_cost_pct - pe.lb) / 100 * me.sales_gbp) FROM me, pe WHERE me.labour_cost_pct > pe.lb
        ORDER BY gbp_per_month DESC
      actions: |
        SELECT action_id, title, priority, category, due_date, status
        FROM action_plans WHERE site_id = $site_id AND status IN ('open', 'in_progress')
        ORDER BY CASE priority WHEN 'urgent' THEN 1 WHEN 'high' THEN 2 WHEN 'medium' THEN 3 ELSE 4 END, due_date LIMIT 8
    template: |
      ACTION PLAN FOR {{ store[0].name }} ({{ site_id }}), {{ store[0].city }}, {{ store[0].region }}
      Visit date: {{ visit_date or 'to be confirmed' }}

      CURRENT PERFORMANCE ({{ kpis[0].month }}):
      - Sales vs plan: {{ kpis[0].sales_vs_plan_pct | num(1) }}%
      - Shrink: {{ kpis[0].shrink_pct | num(2) }}%
      - Shelf availability: {{ kpis[0].availability_pct | num(1) }}%
      - Labour cost: {{ kpis[0].labour_cost_pct | num(1) }}%
      - Gross margin: {{ kpis[0].margin_pct | num(1) }}%

      GAPS AGAINST THE FIVE CLOSEST PEER STORES (largest first, all within the store's control):
      {% for g in gaps %}
      {{ loop.index }}. {{ g.area }}: {{ g.store_value }} vs peers {{ g.peer_avg }} ({{ g.gap_pts }} pts worse, about {{ g.gbp_per_month | money }} a month)
      {% endfor %}

      OPEN ACTIONS TO REVIEW ON THE VISIT:
      {% for a in actions %}
      - {{ a.action_id }} {{ a.title }} ({{ a.category }}, {{ a.priority | upper }}, due {{ a.due_date }}, {{ a.status }})
      {% endfor %}
    example: {site_id: ST214}

  - name: get_delivery_schedule_for_store
    desc: Planned deliveries to a store for one week, with weekday, start time, duration and who receives them. Use for staffing and receiving plans.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      week_start: {type: date, default: "+7d", desc: "Any date in the week wanted (default is next week)"}
    sql: |
      SELECT t.task_id, t.task_name, strftime(t.scheduled_date, '%A') AS weekday, t.scheduled_date, t.scheduled_start_time,
             t.scheduled_duration_hours, t.employee_id, t.status, t.notes
      FROM week_tasks t
      WHERE t.site_id = $site_id
        AND t.task_type = 'Delivery'
        AND t.status <> 'cancelled'
        AND t.week_start = CAST(date_trunc('week', CAST($week_start AS DATE)) AS DATE)
      ORDER BY t.scheduled_date, t.scheduled_start_time
    limit: 20
    example: {site_id: ST214}

  - name: get_task_list_for_store_week
    desc: Every scheduled task in a store's week plan (deliveries, receiving, counts, replenishment, relabelling, training) with day, time, hours and owner.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      week_start: {type: date, default: "+7d", desc: "Any date in the week wanted (default is next week)"}
      task_type: {desc: "Only this type, e.g. Delivery, Receiving, Cycle Count, Replenishment, Relabel, Training"}
    sql: |
      SELECT t.task_id, t.task_name, t.task_type, strftime(t.scheduled_date, '%A') AS weekday, t.scheduled_date,
             t.scheduled_start_time, t.scheduled_duration_hours, t.employee_id, t.status, t.notes
      FROM week_tasks t
      WHERE t.site_id = $site_id
        AND t.week_start = CAST(date_trunc('week', CAST($week_start AS DATE)) AS DATE)
        AND ($task_type IS NULL OR lower(t.task_type) = lower($task_type))
      ORDER BY t.scheduled_date, t.scheduled_start_time, t.task_id
    limit: 50
    example: {site_id: ST214}

  - name: reassign_task_to_employee
    desc: Moves a scheduled store task to a different team member. Returns the updated task.
    kind: update
    table: week_tasks
    set: {employee_id: "{employee_id}"}
    args:
      employee_id: {required: true, desc: "Employee id to reassign to"}
    example: {task_id: TSK-900002, employee_id: EMP-00014}

  - name: delete_task_from_store_week
    desc: Removes a scheduled task from a store's week plan by marking it cancelled. Returns the updated task.
    kind: update
    table: week_tasks
    set: {status: cancelled}
    args:
      notes: {desc: "Reason for removing the task"}
    example: {task_id: TSK-900005, notes: "Relabel moved to next week"}

  - name: create_cycle_count_task_for_store
    desc: Creates a cycle-count task for named lines or a category in a store. Returns the new count task.
    kind: insert
    table: cycle_count_tasks
    id_prefix: CYC-
    defaults: {status: pending}
    args:
      site_id: {required: true, desc: "Store id"}
      sku: {desc: "Single SKU to count"}
      category: {desc: "Product category to count, e.g. Dresses"}
      count_date: {type: date, required: true, desc: "Scheduled count date"}
      reason: {required: true, desc: "Reason for count, e.g. Shrink investigation"}
    example: {site_id: ST214, category: Dresses, count_date: "+6d", reason: "Shrink investigation"}

  - name: get_shelf_availability_exceptions_for_store
    desc: Open or resolved shelf gaps at a store with SKU, system stock, units seen on shelf, units in the back room and likely cause. Use for availability problems.
    kind: sql
    args:
      site_id: {required: true, desc: "Store id"}
      days_back: {type: int, default: 14, desc: "Days to look back"}
      status: {type: enum, values: [open, resolved], default: open, desc: "Exception status"}
    sql: |
      SELECT e.exc_id, e.sku, p.name, e.exception_date, e.status, e.location, e.system_stock, e.observed_on_shelf,
             e.system_stock - e.observed_on_shelf AS gap_units, e.backroom_units, e.likely_cause
      FROM shelf_availability_exceptions e
      JOIN master.products p USING (sku)
      WHERE e.site_id = $site_id
        AND e.exception_date >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
        AND e.status = $status
      ORDER BY e.exception_date DESC, gap_units DESC
    limit: 50
    example: {site_id: ST214}

  - name: update_shelf_replenishment_priority_for_product
    desc: Raises a product's shelf replenishment priority at a store so its gaps are filled first. Returns the old and new priority.
    kind: update
    table: replenishment_priorities
    set: {priority_level: "{priority_level}", reason: "{reason}", effective_from: "$as_of", updated_at: "$as_of"}
    args:
      priority_level: {required: true, type: int, desc: "New priority (1=highest, 5=lowest)"}
      reason: {default: "Shelf gap response", desc: "Reason for priority change"}
    example: {site_id: ST214, sku: "SKU-100007", priority_level: 1}

  - name: get_click_and_collect_demand_for_product
    desc: Click-and-collect demand for a SKU by store over recent days, with forecast and actual units, latest reserved quantity, online allocation and network totals.
    kind: sql
    args:
      sku: {required: true}
      site_id: {desc: "Only this store"}
      days_back: {type: int, default: 14, desc: "Days to look back"}
    sql: |
      SELECT c.sku, c.site_id, count(*) AS days_with_data, sum(c.forecasted_demand) AS forecast_units, sum(c.actual_demand) AS actual_units,
             round(100.0 * (sum(c.actual_demand) - sum(c.forecasted_demand)) / nullif(sum(c.forecasted_demand), 0), 1) AS actual_vs_forecast_pct,
             round(sum(c.actual_demand) * 1.0 / count(*), 1) AS avg_daily_actual,
             arg_max(c.reserved_quantity, c.date) AS reserved_latest, arg_max(c.online_allocation, c.date) AS online_allocation_latest,
             sum(sum(c.actual_demand)) OVER () AS network_actual_units, sum(sum(c.forecasted_demand)) OVER () AS network_forecast_units
      FROM click_collect_demand c
      WHERE c.sku = $sku
        AND ($site_id IS NULL OR c.site_id = $site_id)
        AND c.date >= CAST($as_of AS DATE) - INTERVAL (CAST($days_back AS INT)) DAY
      GROUP BY c.sku, c.site_id
      ORDER BY actual_units DESC, c.site_id
    limit: 50
    example: {sku: "K-1700"}

  - name: get_shrink_control_programmes
    desc: Shrink control programmes (tagging, layout, staffing, security, system rules) with annual cost per store and expected shrink reduction. Use to compare control options.
    kind: select
    from: shrink_control_programmes
    filters:
      control_type: {desc: "Tagging, Layout, Staffing, Security, System or TakeBack"}
    columns: [prog_id, programme_name, control_type, description, annual_cost_gbp, estimated_shrink_reduction_pct]
    order: prog_id
    limit: 20
    example: {}

  - name: get_control_costs_and_results_by_store
    desc: Actual cost, shrink reduction and payback of each shrink control over recent months, per programme across stores or per store. Use for evidence of what works.
    kind: sql
    args:
      site_id: {desc: "Store id (default all stores)"}
      control_type: {desc: "Tagging, Layout, Staffing, Security or System"}
      months: {type: int, default: 12, desc: "Months of results to total"}
      group_by: {type: enum, values: [programme, store], default: programme, desc: "One row per programme, or per store and programme"}
    sql: |
      WITH win AS (
        SELECT DISTINCT month FROM store_control_results WHERE month <= CAST($as_of AS DATE)
        ORDER BY month DESC LIMIT CAST($months AS INT))
      SELECT CASE WHEN $group_by = 'store' THEN r.site_id ELSE 'all stores' END AS site_id, r.prog_id, p.programme_name, p.control_type,
             count(DISTINCT r.site_id) AS stores, round(sum(r.control_cost_gbp)) AS control_cost_gbp,
             round(sum(r.shrink_reduction_gbp)) AS shrink_reduction_gbp,
             round(sum(r.shrink_reduction_gbp) / nullif(sum(r.control_cost_gbp), 0), 2) AS pounds_saved_per_pound_spent,
             round(12.0 * sum(r.control_cost_gbp) / nullif(sum(r.shrink_reduction_gbp), 0), 1) AS payback_months_on_annual_basis
      FROM store_control_results r
      JOIN shrink_control_programmes p USING (prog_id)
      WHERE r.month IN (SELECT month FROM win)
        AND ($site_id IS NULL OR r.site_id = $site_id)
        AND ($control_type IS NULL OR lower(p.control_type) = lower($control_type))
      GROUP BY ALL
      ORDER BY pounds_saved_per_pound_spent DESC, 1, r.prog_id
    limit: 50
    example: {}

  - name: get_take_back_pilot_results
    desc: Take-back pilot results by store, with monthly participation, items collected, weight, carbon savings, backroom space used and customer satisfaction.
    kind: select
    from: take_back_pilot_results
    filters:
      site_id: {}
      pilot_start: {col: pilot_start, op: ">=", default: "-365d"}
    columns: [pilot_id, site_id, pilot_start, pilot_end, monthly_participation_pct, items_collected,
              total_weight_kg, carbon_savings_kg, backroom_space_sqft, customer_satisfaction_score]
    order: pilot_start
    limit: 20
    example: {}

  - name: get_store_backroom_space_constraints
    desc: Back-of-house space by store, largest free space first, with pallet capacity, hazmat compliance and whether take-back fits. Filter by country or region.
    kind: sql
    args:
      site_id: {desc: "Store id"}
      country: {desc: "Country code, e.g. GB for all UK stores"}
      region: {desc: "Region, e.g. UK North, Scotland"}
      take_back_space_available: {type: bool, desc: "Only stores that have (true) or lack (false) take-back space"}
      hazmat_compliance: {type: bool, desc: "Only stores that are (true) or are not (false) hazmat compliant"}
    sql: |
      SELECT b.site_id, s.name, s.region, b.total_backroom_sqft, b.available_sqft, b.racking_capacity_pallets,
             b.bulk_floor_capacity_pallets, b.chilled_space_sqft, b.hazmat_compliance, b.take_back_space_available
      FROM backroom_constraints b
      JOIN master.sites s USING (site_id)
      WHERE ($site_id IS NULL OR b.site_id = $site_id)
        AND ($region IS NULL OR lower(s.region) = lower($region))
        AND ($country IS NULL OR s.country = CASE WHEN upper($country) IN ('UK', 'UNITED KINGDOM') THEN 'GB' ELSE upper($country) END)
        AND ($take_back_space_available IS NULL OR b.take_back_space_available = $take_back_space_available)
        AND ($hazmat_compliance IS NULL OR b.hazmat_compliance = $hazmat_compliance)
      ORDER BY b.available_sqft DESC, b.site_id
    limit: 40
    example: {country: GB, take_back_space_available: true}

  - name: calculate_take_back_programme_cost
    desc: Cost, volume and carbon model for a take-back rollout to a country's stores, scaled from pilot results and participation rate. Returns inputs and results.
    kind: sql
    args:
      country: {default: GB, desc: "Country code of the stores in scope, e.g. GB for all UK stores"}
      participation_rate_pct: {type: float, desc: "Assumed customer participation %; default is the pilot average"}
      rollout_store_count: {type: int, desc: "Number of stores to roll out to; default is every store in the country"}
      pilot_site_id: {desc: "Base volumes on this one pilot store; default is the average of all pilots"}
    sql: |
      WITH pil AS (
        SELECT count(*) AS pilots, avg(monthly_participation_pct) AS pilot_participation_pct,
               avg(items_collected) AS items_per_store_month, avg(total_weight_kg) AS kg_per_store_month,
               avg(carbon_savings_kg) AS carbon_kg_per_store_month
        FROM take_back_pilot_results WHERE $pilot_site_id IS NULL OR site_id = $pilot_site_id),
      sc AS (
        SELECT count(*) AS stores_in_scope, count(*) FILTER (WHERE b.take_back_space_available) AS stores_with_space
        FROM master.sites s LEFT JOIN backroom_constraints b ON b.site_id = s.site_id
        WHERE s.type = 'store'
          AND s.country = CASE WHEN upper($country) IN ('UK', 'UNITED KINGDOM') THEN 'GB' ELSE upper($country) END),
      pr AS (SELECT annual_cost_gbp FROM shrink_control_programmes WHERE control_type = 'TakeBack' ORDER BY prog_id LIMIT 1),
      inp AS (
        SELECT pil.*, sc.*, pr.annual_cost_gbp,
               coalesce($rollout_store_count, sc.stores_in_scope) AS stores,
               coalesce($participation_rate_pct, pil.pilot_participation_pct) AS participation
        FROM pil, sc, pr)
      SELECT stores AS stores_in_rollout, stores_in_scope, stores_with_space AS stores_with_take_back_space,
             pilots AS pilots_used, round(pilot_participation_pct, 1) AS pilot_participation_pct,
             round(participation, 1) AS assumed_participation_pct,
             annual_cost_gbp AS annual_cost_per_store_gbp,
             round(stores * annual_cost_gbp) AS total_annual_cost_gbp,
             round(stores * items_per_store_month * participation / pilot_participation_pct) AS items_per_month,
             round(stores * kg_per_store_month * participation / pilot_participation_pct / 1000.0, 1) AS tonnes_per_month,
             round(stores * carbon_kg_per_store_month * participation / pilot_participation_pct * 12 / 1000.0, 1) AS carbon_saved_tonnes_per_year,
             round(stores * annual_cost_gbp / (stores * kg_per_store_month * participation / pilot_participation_pct * 12 / 1000.0)) AS cost_per_tonne_collected_gbp,
             'cost = stores x annual cost; volume = pilot volume per store x stores x assumed / pilot participation' AS formula
      FROM inp
    limit: 1
    example: {country: GB, participation_rate_pct: 20}

  - name: get_plan_vs_actual_by_store
    desc: Sales and margin plan vs actual by store, worst variance first, with region totals. Filter by region or store; months totals several months.
    kind: sql
    args:
      site_id: {desc: "Store id (default all stores)"}
      region: {desc: "Region, e.g. UK North"}
      month: {type: date, default: "today", desc: "Period end; the nearest month with data is used"}
      months: {type: int, default: 1, desc: "Number of months to total, ending at that month"}
    sql: |
      WITH m AS (
        SELECT month FROM plan_vs_actual ORDER BY abs(date_diff('day', month, CAST($month AS DATE))) LIMIT 1),
      sel AS (
        SELECT v.*, dense_rank() OVER (ORDER BY v.month DESC) AS rk
        FROM plan_vs_actual v WHERE v.month <= (SELECT month FROM m)),
      agg AS (
        SELECT a.site_id, s.name, s.region, min(a.month) AS from_month, max(a.month) AS to_month,
               round(sum(a.sales_plan_gbp)) AS sales_plan_gbp, round(sum(a.sales_actual_gbp)) AS sales_actual_gbp,
               round(sum(a.sales_actual_gbp - a.sales_plan_gbp)) AS variance_gbp,
               round(100.0 * sum(a.sales_actual_gbp - a.sales_plan_gbp) / sum(a.sales_plan_gbp), 1) AS variance_pct,
               round(sum(a.sales_plan_gbp * a.margin_plan_pct) / sum(a.sales_plan_gbp), 1) AS margin_plan_pct,
               round(sum(a.sales_actual_gbp * a.margin_actual_pct) / sum(a.sales_actual_gbp), 1) AS margin_actual_pct
        FROM sel a JOIN master.sites s ON s.site_id = a.site_id
        WHERE a.rk <= CAST($months AS INT)
          AND ($site_id IS NULL OR a.site_id = $site_id)
          AND ($region IS NULL OR lower(s.region) = lower($region))
        GROUP BY a.site_id, s.name, s.region)
      SELECT site_id, name, sales_plan_gbp, sales_actual_gbp, variance_gbp, variance_pct, margin_plan_pct, margin_actual_pct,
             from_month, to_month,
             sum(sales_plan_gbp) OVER () AS group_plan_gbp, sum(sales_actual_gbp) OVER () AS group_actual_gbp,
             sum(variance_gbp) OVER () AS group_variance_gbp,
             round(100.0 * sum(variance_gbp) OVER () / sum(sales_plan_gbp) OVER (), 1) AS group_variance_pct,
             count(*) OVER () AS stores_in_group
      FROM agg
      ORDER BY variance_gbp, site_id
    limit: 100
    example: {region: "UK North"}
