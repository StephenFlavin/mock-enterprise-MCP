id: web_analytics
name: Web Analytics Platform
instructions: >
  Website traffic analysis, conversion rates, search trends, marketing campaign
  performance, and customer funnel metrics for resale and new product launches.
  Trend ids like ST-000001, traffic and conversion data by day/channel/device.

tables:
  search_trends:
    key: trend_id
    cols:
      trend_id: {type: str, desc: "Search trend, e.g. ST-000001"}
      search_term: {type: str, desc: "Search term or keyword"}
      date: {type: date, desc: "Date of trend measurement"}
      volume: {type: int, desc: "Search volume for the term"}
      trend_direction: {type: enum, values: [up, stable, down], desc: "Trend direction"}
      category: {type: str, desc: "Product category, if relevant"}

  traffic_by_channel:
    key: [date, channel, device]
    cols:
      date: {type: date, desc: "Date of traffic"}
      channel: {type: enum, values: [organic, paid, direct, social, email, referral], desc: "Traffic channel"}
      device: {type: enum, values: [mobile, desktop, tablet], desc: "Device type"}
      sessions: {type: int, desc: "Number of sessions"}
      conversions: {type: int, desc: "Orders (conversions)"}
      revenue_gbp: {type: float, desc: "Revenue in GBP"}

  conversion_metrics:
    key: [date, postcode_area, delivery_option]
    cols:
      date: {type: date, desc: "Date of measurement"}
      postcode_area: {type: str, desc: "UK postcode area, e.g. M1, LS1"}
      delivery_option: {type: enum, values: [standard, next_day], desc: "Delivery promise shown to the shopper. next_day also covers pilot cells in areas where next-day is not yet live"}
      sessions: {type: int, desc: "Sessions shown this delivery promise"}
      orders: {type: int, desc: "Orders placed from those sessions"}
      conversion_rate: {type: float, desc: "Conversion rate percentage (orders / sessions)"}
      revenue_gbp: {type: float, desc: "Revenue in GBP for this segment"}

  marketing_activities:
    key: activity_id
    cols:
      activity_id: {type: str, desc: "Marketing activity, e.g. MA-000001"}
      range_id: {type: str, desc: "Style id or SKU for the range"}
      campaign_name: {type: str, desc: "Campaign name"}
      channel: {type: enum, values: [organic, paid, direct, social, email, referral], desc: "Campaign channel"}
      start_date: {type: date, desc: "Campaign start date"}
      end_date: {type: date, desc: "Campaign end date"}
      impressions: {type: int, desc: "Number of impressions"}
      clicks: {type: int, desc: "Number of clicks"}
      conversions: {type: int, desc: "Number of conversions"}
      revenue_gbp: {type: float, desc: "Campaign revenue in GBP"}
      spend_gbp: {type: float, desc: "Media and send cost in GBP"}
      status: {type: enum, values: [live, completed, ended_early], desc: "Campaign status; ended_early = cut before its planned end"}

  campaign_creatives:
    key: creative_id
    cols:
      creative_id: {type: str, desc: "Campaign creative, e.g. CC-000001"}
      campaign_name: {type: str, desc: "Campaign name"}
      creative_type: {type: enum, values: [image, video, text, carousel], desc: "Creative asset type"}
      test_variant: {type: str, desc: "Test variant identifier"}
      start_date: {type: date, desc: "First day the creative ran"}
      end_date: {type: date, desc: "Last day the creative ran"}
      impressions: {type: int, desc: "Number of impressions"}
      clicks: {type: int, desc: "Number of clicks"}
      conversions: {type: int, desc: "Number of conversions"}
      revenue_gbp: {type: float, desc: "Revenue from this creative in GBP"}
      engagement_rate_pct: {type: float, desc: "Engagement rate as percentage"}

  resale_funnel:
    key: [date, funnel_stage]
    cols:
      date: {type: date, desc: "Date of measurement"}
      funnel_stage: {type: enum, values: [views, item_added, checkout, purchase], desc: "Funnel stage"}
      user_count: {type: int, desc: "Number of users at this stage"}
      transaction_count: {type: int, desc: "Number of transactions"}
      items_listed: {type: int, desc: "Items listed for resale"}
      items_sold: {type: int, desc: "Items sold through resale"}
      gmv_gbp: {type: float, desc: "Gross merchandise value in GBP"}

  traffic_forecast:
    key: [date, channel]
    cols:
      date: {type: date, desc: "Forecast date"}
      channel: {type: enum, values: [organic, paid, direct, social, email, referral], desc: "Traffic channel"}
      forecast_volume: {type: int, desc: "Forecast sessions"}
      forecast_orders: {type: int, desc: "Forecast web orders"}
      forecast_revenue_gbp: {type: float, desc: "Forecasted revenue in GBP"}
      confidence_pct: {type: float, desc: "Forecast confidence percentage"}

tools:
  - name: list_active_disruptions
    desc: Active and monitored supply chain disruptions ranked by severity, with shipments and units in transit affected. Use for a weekly top-N.
    kind: sql
    args:
      status: {type: enum, values: [active, monitoring], desc: "Only this status; blank returns both"}
      severity: {type: enum, values: [low, medium, high, critical], desc: Only this severity}
      region: {type: str, desc: "Words in the region, e.g. Felixstowe or Bangladesh"}
      event_type: {}
    sql: |
      WITH hit AS (
        SELECT d.disruption_id, s.shipment_id, pur.total_units
        FROM disruptions d
        JOIN shipment_tracking s
          ON s.partner_id IS NULL AND s.status IN ('in_transit', 'at_port', 'customs_hold', 'delayed')
         AND (list_contains(string_split(d.affected_ports, ','), s.origin_port)
              OR list_contains(string_split(d.affected_ports, ','), s.dest_port))
        LEFT JOIN master.purchase_orders pur ON pur.po_id = s.po_id
        WHERE d.status IN ('active', 'monitoring')
      )
      SELECT d.disruption_id, d.event_type, d.region, d.severity, d.status, d.description,
             d.estimated_impact_days, d.reported_at, d.affected_ports,
             count(h.shipment_id) AS shipments_affected, coalesce(sum(h.total_units), 0) AS po_units_affected
      FROM disruptions d
      LEFT JOIN hit h ON h.disruption_id = d.disruption_id
      WHERE d.status IN ('active', 'monitoring')
        AND ($status IS NULL OR d.status = $status)
        AND ($severity IS NULL OR d.severity = $severity)
        AND ($region IS NULL OR d.region ILIKE '%' || $region || '%')
        AND ($event_type IS NULL OR d.event_type = $event_type)
      GROUP BY ALL
      ORDER BY CASE d.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END DESC,
               d.estimated_impact_days DESC, d.reported_at DESC
    limit: 20
    example: {}

  - name: list_new_disruptions_since
    desc: Disruptions reported since a date, latest first, with severity, status and affected ports. Use for what is new since last week.
    kind: select
    from: disruptions
    filters:
      reported_since: {col: reported_at, op: ">=", type: date, default: "-7d", desc: "Only disruptions reported on or after this date"}
      event_type: {}
      severity: {}
    columns: [disruption_id, event_type, region, severity, status, description, estimated_impact_days, reported_at, affected_ports]
    order: reported_at DESC
    limit: 50
    example: {}

  - name: get_predicted_eta_vs_planned_arrival
    desc: Shipments not yet arrived with predicted ETA versus planned arrival and days late, latest first. Use to find late inbound shipments.
    kind: sql
    args:
      status: {type: enum, values: [in_transit, at_port, customs_hold, delayed], desc: "Only this status; blank returns every shipment still on its way"}
      dest_site_id: {}
      carrier_id: {}
      min_days_late: {type: int, default: 1, desc: Only shipments predicted at least this many days behind planned arrival}
    sql: |
      SELECT s.shipment_id, s.po_id, sup.name AS po_supplier, s.carrier_id, s.mode, s.origin_port, s.dest_port,
             s.dest_site_id, s.planned_arrival, s.predicted_eta,
             CAST(s.predicted_eta AS DATE) - CAST(s.planned_arrival AS DATE) AS days_late,
             pur.total_units AS po_units, s.status, s.priority_flag
      FROM shipment_tracking s
      LEFT JOIN master.purchase_orders pur ON s.po_id = pur.po_id
      LEFT JOIN master.suppliers sup ON pur.supplier_id = sup.supplier_id
      WHERE s.partner_id IS NULL
        AND s.status IN ('in_transit', 'at_port', 'customs_hold', 'delayed')
        AND ($status IS NULL OR s.status = $status)
        AND ($dest_site_id IS NULL OR s.dest_site_id = $dest_site_id)
        AND ($carrier_id IS NULL OR s.carrier_id = $carrier_id)
        AND CAST(s.predicted_eta AS DATE) - CAST(s.planned_arrival AS DATE) >= $min_days_late
      ORDER BY days_late DESC, s.predicted_eta ASC
    limit: 30
    example: {}

  - name: get_disruption_impact_on_shipments
    desc: Shipments still on their way that pass through a disruption's affected ports, largest PO first, with units, delay and ETA.
    kind: sql
    args:
      disruption_id: {required: true}
    sql: |
      SELECT d.disruption_id, d.event_type, d.severity, d.estimated_impact_days, s.shipment_id, s.po_id,
             sup.name AS po_supplier, s.origin_port, s.dest_port, s.dest_site_id, s.status,
             s.planned_arrival, s.predicted_eta,
             CAST(s.predicted_eta AS DATE) - CAST(s.planned_arrival AS DATE) AS days_late,
             CAST(s.predicted_eta AS DATE) - CAST($as_of AS DATE) AS days_to_arrival,
             pur.total_units AS po_units, pur.total_value AS po_value, pur.currency
      FROM disruptions d
      JOIN shipment_tracking s
        ON s.partner_id IS NULL AND s.status IN ('in_transit', 'at_port', 'customs_hold', 'delayed')
       AND (list_contains(string_split(d.affected_ports, ','), s.origin_port)
            OR list_contains(string_split(d.affected_ports, ','), s.dest_port))
      LEFT JOIN master.purchase_orders pur ON s.po_id = pur.po_id
      LEFT JOIN master.suppliers sup ON pur.supplier_id = sup.supplier_id
      WHERE d.disruption_id = $disruption_id
      ORDER BY pur.total_units DESC, s.shipment_id
    limit: 30
    example: {disruption_id: DIS-900001}

  - name: get_ocean_transit_history_by_lane
    desc: Historical ocean sailings by lane, carrier and service with planned versus actual transit days and any disruption. Use for transit time modelling.
    kind: select
    from: transit_history
    filters:
      origin_port: {}
      dest_port: {}
      carrier_id: {}
      service: {}
      mode: {default: sea}
      from_date: {col: transit_date, op: ">=", type: date, default: "-180d", desc: Earliest sailing departure date}
    columns: [origin_port, dest_port, service, carrier_id, transit_date, transit_time_days, planned_days, variance_pct, disruption_id]
    order: transit_date DESC, origin_port, dest_port
    limit: 100
    example: {origin_port: CNSHA, dest_port: GBFXT}

  - name: get_port_congestion_history
    desc: Weekly port dwell hours, vessel queue and congestion level over time. Use for port capacity planning and delay modelling.
    kind: select
    from: port_congestion
    filters:
      port_code: {}
      from_date: {col: measurement_date, op: ">=", type: date, default: "-90d", desc: Earliest measurement date}
    columns: [port_code, measurement_date, avg_dwell_hours, max_dwell_hours, vessel_queue_length, congestion_level, notes]
    order: measurement_date DESC, port_code
    limit: 200
    example: {port_code: GBFXT}

  - name: get_order_shipment_status
    desc: Shipment status, ETA, days late and active disruptions for a purchase order, or for all shipments from an origin port or country.
    kind: sql
    args:
      po_id: {}
      origin_port: {}
      origin_country: {type: str, desc: "Origin country code, e.g. BD, VN, CN"}
      status: {type: enum, values: [booked, in_transit, at_port, customs_hold, delayed, delivered], desc: "Only this status; blank returns shipments not yet delivered"}
    sql: |
      SELECT s.po_id, s.shipment_id, sup.name AS po_supplier, pt.country AS origin_country, s.origin_port,
             s.dest_port, s.dest_site_id, s.mode, s.status, s.planned_arrival, s.predicted_eta, s.actual_arrival,
             CAST(s.predicted_eta AS DATE) - CAST(s.planned_arrival AS DATE) AS days_late,
             pur.total_units AS po_units,
             (SELECT string_agg(d.disruption_id || ' ' || d.event_type || ' (' || d.severity || ')', '; ' ORDER BY d.disruption_id)
              FROM disruptions d
              WHERE d.status IN ('active', 'monitoring')
                AND (list_contains(string_split(d.affected_ports, ','), s.origin_port)
                     OR list_contains(string_split(d.affected_ports, ','), s.dest_port))) AS active_disruptions
      FROM shipment_tracking s
      LEFT JOIN master.ports pt ON pt.port_code = s.origin_port
      LEFT JOIN master.purchase_orders pur ON pur.po_id = s.po_id
      LEFT JOIN master.suppliers sup ON sup.supplier_id = pur.supplier_id
      WHERE s.partner_id IS NULL
        AND ($po_id IS NULL OR s.po_id = $po_id)
        AND ($origin_port IS NULL OR s.origin_port = $origin_port)
        AND ($origin_country IS NULL OR pt.country = upper($origin_country))
        AND (($status IS NULL AND ($po_id IS NOT NULL OR s.status <> 'delivered')) OR s.status = $status)
      ORDER BY s.predicted_eta, s.shipment_id
    limit: 30
    example: {origin_country: BD}

  - name: get_in_transit_stock_for_batch
    desc: Units of a SKU's manufacturing batches still on the water or at port, with shipment, destination and ETA. Optional batch filter.
    kind: sql
    args:
      sku: {required: true}
      batch_number: {type: str, desc: "Manufacturer batch number, e.g. BATCH-PF220-2509-A"}
    sql: |
      SELECT b.batch_number, b.sku, b.factory_id, b.manufacturing_date, b.units_shipped AS units_in_transit,
             sum(b.units_shipped) OVER (PARTITION BY b.batch_number) AS batch_units_in_transit,
             b.shipment_id, b.status AS batch_status, s.po_id, s.carrier_id, s.origin_port, s.dest_port,
             s.dest_site_id, s.planned_arrival, s.predicted_eta, s.status AS shipment_status, b.batch_id
      FROM shipment_batches b
      JOIN shipment_tracking s ON b.shipment_id = s.shipment_id
      WHERE b.sku = $sku
        AND ($batch_number IS NULL OR b.batch_number = $batch_number)
        AND b.status IN ('in_transit', 'at_port', 'hold')
      ORDER BY b.batch_number, s.predicted_eta
    limit: 50
    example: {sku: PF-220}

  - name: get_shipment_tracking_for_franchise
    desc: Shipments to a franchise partner with status, planned versus predicted arrival and days late, open ones first. Use to see lead time and delays.
    kind: sql
    args:
      partner_id: {required: true}
    sql: |
      SELECT prt.partner_id, prt.name AS franchise_name, s.shipment_id, s.franchise_order_id, s.mode,
             s.origin_port, s.dest_port, s.departure_date, s.planned_arrival, s.predicted_eta, s.actual_arrival,
             CAST(coalesce(s.actual_arrival, s.predicted_eta) AS DATE) - CAST(s.departure_date AS DATE) AS transit_days,
             CAST(coalesce(s.actual_arrival, s.predicted_eta) AS DATE) - CAST(s.planned_arrival AS DATE) AS days_late,
             s.status, s.priority_flag
      FROM shipment_tracking s
      JOIN master.partners prt ON prt.partner_id = s.partner_id
      WHERE s.partner_id = $partner_id
      ORDER BY (s.status = 'delivered'), s.planned_arrival DESC
    limit: 30
    example: {partner_id: PTN-011}

  - name: calculate_planning_buffer_savings
    desc: Planning buffer days a lane needs from historical delays versus the current buffer, and the days saved if ETA accuracy improves.
    kind: sql
    args:
      origin_port: {required: true}
      dest_port: {required: true}
      service: {type: str, desc: "Service name, e.g. FAL9; blank covers every service on the lane"}
      eta_improvement_pct: {type: float, default: 50, desc: "What-if: percent by which better ETA prediction cuts delay variability"}
    sql: |
      WITH h AS (
        SELECT transit_time_days - planned_days AS delay_days
        FROM transit_history
        WHERE origin_port = $origin_port AND dest_port = $dest_port AND mode = 'sea'
          AND transit_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
          AND ($service IS NULL OR service = $service)
      ), stats AS (
        SELECT count(*) AS sailings, round(avg(delay_days), 1) AS avg_delay_days,
               round(100.0 * count(*) FILTER (WHERE delay_days > 1) / count(*), 0) AS pct_sailings_late,
               round(greatest(quantile_cont(delay_days, 0.9), 0), 1) AS buffer_needed_days
        FROM h
      ), cur AS (
        SELECT min(current_buffer_days) AS current_buffer_days, min(accuracy_score) AS accuracy_score
        FROM planning_buffers
        WHERE origin_port = $origin_port AND dest_port = $dest_port AND ($service IS NULL OR service = $service)
      )
      SELECT $origin_port AS origin_port, $dest_port AS dest_port, coalesce($service, 'all') AS service,
             st.sailings, st.avg_delay_days, st.pct_sailings_late, c.current_buffer_days, c.accuracy_score,
             st.buffer_needed_days AS buffer_needed_today_days, $eta_improvement_pct AS eta_improvement_pct,
             round(st.buffer_needed_days * (1 - $eta_improvement_pct / 100.0), 1) AS buffer_needed_with_better_eta_days,
             round(st.buffer_needed_days * $eta_improvement_pct / 100.0, 1) AS buffer_days_saved,
             'buffer needed = 90th percentile of (actual - planned transit days); with better ETAs = buffer needed * (1 - improvement); saved = difference' AS formula
      FROM stats st CROSS JOIN cur c
    limit: 1
    example: {origin_port: CNSHA, dest_port: GBFXT}

  - name: update_shipment_priority
    desc: Flag or unflag a shipment as priority for expedited handling by the control tower. Returns the old and new flag.
    kind: update
    table: shipment_tracking
    set: {priority_flag: "{priority_flag}", priority_reason: "{priority_reason}", updated_at: "$as_of"}
    args:
      priority_flag: {type: bool, required: true, desc: "True to flag as priority, false to clear"}
      priority_reason: {type: str, desc: "Why it is priority, e.g. stockout risk on core SKUs"}
    example: {shipment_id: SHP-0000132, priority_flag: true, priority_reason: Stockout risk}
