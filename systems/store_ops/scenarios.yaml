# One entry per question row that uses this system's tools
- question: "03:29:Q5"
  story: >
    The three biggest lines of stock older than 180 days are SKU-105054 (Personal Care), SKU-101253 (Smart Home, lithium
    battery) and SKU-100658 (Small Appliances). Retail suits the first (53% of full price recovered), Outlet the second
    (51%; Online is restricted by the battery), Online the third (45.3%).
  checks:
    - tool: get_channel_options_for_line
      args: {sku: "SKU-105054"}
      expect: ["Retail", "53", "markdown event"]
    - tool: get_channel_options_for_line
      args: {sku: "SKU-101253"}
      expect: ["Outlet", "51", "Lithium battery"]
    - tool: get_channel_options_for_line
      args: {sku: "SKU-100658"}
      expect: ["Online", "45.3"]

- question: "05:49:Q3"
  story: >
    Three pilots (ST214, ST001, ST008) averaged 23% participation. 215 UK stores are in scope and 169 have take-back space.
    At 20% participation the rollout costs 967500 a year (4500 per store), collects about 132 tonnes a month and saves about
    303 tonnes of carbon a year.
  checks:
    - tool: get_take_back_pilot_results
      args: {}
      expect: ["TBP-900001", "TBP-900002", "TBP-900003", "28"]
    - tool: get_store_backroom_space_constraints
      args: {country: GB, take_back_space_available: true}
      expect: ["of 169 rows", "available_sqft"]
    - tool: calculate_take_back_programme_cost
      args: {country: GB, participation_rate_pct: 20}
      expect: ["215", "967500", "132.1", "302.9"]

- question: "08:71:Q1"
  story: >
    Store ST214 shrink is highest in Dresses. The manager raises a Dresses stock count and adds an owned action to the
    store plan, which already holds four open actions.
  checks:
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, category: Dresses, count_date: "+5d", reason: "Shrink investigation"}
      expect: ["CYC-", "Dresses", "pending"]
    - tool: create_store_action_plan_item
      args: {site_id: ST214, title: "Weekly Dresses count and floor walk", employee_id: "EMP-00536", due_date: "+14d", priority: high, category: Shrink}
      expect: ["API-900006", "EMP-00536", "Dresses"]

- question: "08:71:Q2"
  story: >
    Three best sellers at ST214 have shelf gaps. SKU-100007 (112 units) and K-1700 (84 units) are sitting in the back room;
    SKU-100014 is a short delivery with nothing in the back room. Counts are raised and priority bumped to 1 for the two
    back-room lines only.
  checks:
    - tool: get_shelf_availability_exceptions_for_store
      args: {site_id: ST214}
      expect: ["SKU-100007", "K-1700", "SKU-100014", "112", "84", "short delivery"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, sku: "SKU-100007", count_date: "+5d", reason: "Shelf gap, stock in back room"}
      expect: ["CYC-", "SKU-100007"]
    - tool: update_shelf_replenishment_priority_for_product
      args: {site_id: ST214, sku: "K-1700", priority_level: 1}
      expect: ["K-1700", "3 → 1"]

- question: "08:71:Q3"
  story: >
    ST214 next week has two deliveries (Tuesday from DC1, Friday from DC2, both 06:00), receiving tasks after each, and a
    Saturday relabel job that is not time critical. The Tuesday receiving task TSK-900002 moves to EMP-00014 and the relabel
    job TSK-900005 is removed.
  checks:
    - tool: get_delivery_schedule_for_store
      args: {site_id: ST214}
      expect: ["Tuesday", "Friday", "06:00", "Northampton", "Daventry"]
    - tool: get_task_list_for_store_week
      args: {site_id: ST214}
      expect: ["TSK-900002", "TSK-900005", "Saturday", "Relabel"]
    - tool: reassign_task_to_employee
      args: {task_id: TSK-900002, employee_id: EMP-00014}
      expect: ["EMP-00012", "EMP-00014"]
    - tool: delete_task_from_store_week
      args: {task_id: TSK-900005}
      expect: ["scheduled", "cancelled"]
    - tool: get_task_list_for_store_week
      args: {site_id: ST214, task_type: Relabel}
      expect: ["TSK-900005", "cancelled"]

- question: "08:71:Q5"
  story: >
    ST214 is second worst of 90 cluster B stores on shrink (1.01% vs 0.85% average) and on labour cost (12.2% vs 11.2%) and
    second worst on availability (94.2% vs 96.18%). Availability is the biggest gap in pounds (about 1460 a month).
  checks:
    - tool: get_store_cluster_members
      args: {site_id: ST214}
      expect: ["ST206", "ST215", "retail_park", "availability_pct"]
    - tool: compare_store_kpis_within_cluster
      args: {site_id: ST214}
      expect: ["availability_pct", "94.2", "96.18", "89", "90", "1460"]

- question: "08:73:Q1"
  story: >
    ST214 has been below plan for six months (-7.8% last month) while its five closest peers (ST206, ST209, ST202, ST072,
    ST146) are on plan. Availability is the biggest controllable gap (94.2% vs 96.34% for peers, about 1578 a month).
  checks:
    - tool: search_peer_stores_for_store
      args: {site_id: ST214, limit_count: 5}
      expect: ["ST206", "ST209", "ST202", "same format + same cluster + same region"]
    - tool: compare_store_kpis_with_peers
      args: {site_id: ST214}
      expect: ["availability_pct", "96.34", "sales_vs_plan_pct", "-7.8", "1578"]
    - tool: draft_store_visit_action_plan
      args: {site_id: ST214, visit_date: "+3d"}
      expect: ["ACTION PLAN", "Shelf availability", "1,578", "API-900002"]

- question: "08:73:Q2"
  story: >
    The three weakest UK North stores are ST143, ST142 and ST150 (31%, 19% and 7% below plan). Visits are added for each.
  checks:
    - tool: create_store_visit_task
      args: {site_id: ST143, employee_id: EMP-00003, visit_date: "+14d", visit_purpose: "Recovery plan review"}
      expect: ["VIS-900004", "ST143", "planned"]
    - tool: create_store_visit_task
      args: {site_id: ST142, employee_id: EMP-00003, visit_date: "+14d", visit_purpose: "Recovery plan review"}
      expect: ["ST142"]
    - tool: create_store_visit_task
      args: {site_id: ST150, employee_id: EMP-00003, visit_date: "+14d", visit_purpose: "Recovery plan review"}
      expect: ["ST150"]

- question: "08:73:Q3"
  story: >
    UK North has 60 stores. Only ST143, ST142 and ST150 are flagged below target (sales more than 5% below plan, plus low
    availability, high shrink or high labour cost). ST150 is also flagged for labour cost.
  checks:
    - tool: list_stores_in_region
      args: {region: "UK North"}
      expect: ["60 rows", "ST143", "ST142", "ST150", "sales more than 5% below plan", "labour cost above 13.5%"]

- question: "08:73:Q4"
  story: >
    UK North last month: 59 stores, plan 4,017,600 vs actual 3,999,201, a shortfall of 18,403 (-0.5%), driven by ST143
    (-11,100), ST142 (-6,500) and ST150 (-4,600).
  checks:
    - tool: get_plan_vs_actual_by_store
      args: {region: "UK North"}
      expect: ["ST143", "-11100", "ST142", "-6500", "ST150", "-4600", "-18403"]

- question: "08:74:Q6"
  story: >
    K-1700 click-and-collect demand over the last week was 680 units against a 525 forecast (+30%) across eight stores, led
    by ST001 (128 units).
  checks:
    - tool: get_click_and_collect_demand_for_product
      args: {sku: "K-1700", days_back: 14}
      expect: ["ST001", "128", "680", "525"]

- question: "08:79:Q2"
  story: >
    Per pound spent, POS system rules save 1.80 (payback about 7 months) and tagging 1.53, layout 0.54, security guarding
    0.22 and enhanced staffing 0.14 (payback about 86 months).
  checks:
    - tool: get_shrink_control_programmes
      args: {}
      expect: ["Tagging", "Layout", "Staffing", "Security", "System", "15300"]
    - tool: get_control_costs_and_results_by_store
      args: {}
      expect: ["POS System Rules", "1.8", "6.7", "Enhanced Staffing", "0.14", "85.7"]
    - tool: get_control_costs_and_results_by_store
      args: {site_id: ST214, group_by: store}
      expect: ["ST214", "SCP-0001", "SCP-0002"]
