# One entry per question row that uses this system's tools
- question: "03:29:Q5"
  story: >
    Store 214 has K-1700 kettles (PF-220 portable fans and STY-5520 apparel) with high inventory age.
    Cycle counts show 27-unit variance on kettles (125 system vs 98 actual). The channel options tool
    identifies which outlets suit these items best. A markdown event is created then deleted.
  checks:
    - tool: get_channel_options_for_line
      args: {sku: "K-1700"}
      expect: ["K-1700", "channel"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, sku: "K-1700", count_date: "2026-10-15", reason: "Pre-markdown verification"}
      expect: ["CYC-", "pending"]

- question: "05:49:Q3"
  story: >
    Take-back pilot at ST214 (June-Sept 2026) collected 1250 items/month at 680kg,
    saving 125kg CO2 monthly with 22.5% participation. Backroom has 180 sqft available.
    Nationwide rollout would involve 100 stores, with annual cost model calculated at £300k investment
    targeting 1800+ tonnes CO2 savings.
  checks:
    - tool: get_take_back_pilot_results
      args: {}
      expect: ["ST214", "1250", "125"]
    - tool: get_store_backroom_space_constraints
      args: {take_back_space_available: true}
      expect: ["ST214", "ST001"]
    - tool: calculate_take_back_programme_cost
      args: {pilot_site_id: ST214, rollout_store_count: 100, participation_rate_pct: 20}
      expect: ["stores_in_rollout", "investment"]

- question: "08:71:Q1"
  story: >
    Store 214 shrink is 4.8% (up from 4.2% last month), high for the cluster.
    Three recent cycle counts (CYC-900001 to 900003) on kettles, fans and apparel show
    variances of -27, -11, -11 units. Action plan items API-900001 and API-900002 address
    RFID tagging and daily floor walks. Cluster peer is ST001 (shrink 2.0%).
  checks:
    - tool: create_store_action_plan_item
      args: {site_id: ST214, title: "Urgent: Review receiving process", owner: "EMP-0047", due_date: "2026-10-20", priority: urgent, category: Shrink}
      expect: ["API-", "open"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, category: "Homewares", count_date: "2026-10-13", reason: "Monday shrink investigation"}
      expect: ["CYC-", "pending"]

- question: "08:71:Q2"
  story: >
    Store 214 has shelf gaps on three lines: K-1700 kettles (system 125, shelf 8),
    PF-220 fans (87, 0), STY-5520 apparel (156, 45). Two (kettles and fans) are in backroom.
    Cycle counts created and both products bumped to priority 1 for replenishment.
  checks:
    - tool: get_shelf_availability_exceptions_for_store
      args: {site_id: ST214}
      expect: ["K-1700", "PF-220", "STY-5520"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, sku: "K-1700", count_date: "2026-10-13", reason: "Shelf gap - backroom stock check"}
      expect: ["CYC-", "K-1700"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, sku: "PF-220", count_date: "2026-10-13", reason: "Shelf gap - backroom stock check"}
      expect: ["CYC-", "PF-220"]
    - tool: update_shelf_replenishment_priority_for_product
      args: {site_id: ST214, sku: "K-1700", new_priority: 1}
      expect: ["K-1700", "1"]
    - tool: update_shelf_replenishment_priority_for_product
      args: {site_id: ST214, sku: "PF-220", new_priority: 1}
      expect: ["PF-220", "1"]

- question: "08:71:Q3"
  story: >
    Store 214 next week (starting 2026-10-06) has deliveries Tuesday and Friday, plus cycle count
    and replenishment tasks. Five tasks scheduled (TSK-900001 to 900005): two deliveries,
    one cycle count, one replenishment, one training. Priya is on Saturday; Saturday and Sunday
    task reassignments and cancellations happen.
  checks:
    - tool: get_delivery_schedule_for_store
      args: {site_id: ST214, week_start: "2026-10-06"}
      expect: ["Tuesday", "Friday", "Delivery"]
    - tool: get_task_list_for_store_week
      args: {site_id: ST214, week_start: "2026-10-06"}
      expect: ["TSK-", "scheduled"]
    - tool: reassign_task_to_employee
      args: {task_id: TSK-900001, employee_id: EMP-0065}
      expect: ["EMP-0065"]
    - tool: delete_task_from_store_week
      args: {task_id: TSK-900005}
      expect: ["cancelled"]

- question: "08:71:Q5"
  story: >
    Store 214 shrink 4.8%, availability 89.2%, labour cost 15.2% (Oct 2026).
    Cluster contains ST008 (shrink 3.6%, availability 90.8%, labour 13.8%) and two others.
    Peer ST001 (same format) has shrink 2.0%, availability 96.1%, labour 11.8%.
    ST001 clearly outperforms on all metrics.
  checks:
    - tool: get_store_cluster_members
      args: {site_id: ST214}
      expect: ["site_id", "cluster"]
    - tool: compare_store_kpis_within_cluster
      args: {site_id: ST214, month: "2026-10-01"}
      expect: ["ST214", "4.8", "cluster_avg"]
    - tool: compare_store_kpis_with_peers
      args: {site_id: ST214, month: "2026-10-01"}
      expect: ["ST214", "ST001", "2.0"]

- question: "08:73:Q1"
  story: >
    Store 214 below target for six months. Five peer stores identified (same format/region).
    Comparison shows ST214 vs peers on staffing, availability, competition and stock.
    Visit scheduled for Thursday by EMP-0047 (VIS-900001 on 2026-10-03 already shows recent visit).
    Draft action plan generated with priorities for first 30 days.
  checks:
    - tool: search_peer_stores_for_store
      args: {site_id: ST214, limit_count: 5}
      expect: ["site_id", "format"]
    - tool: compare_store_kpis_with_peers
      args: {site_id: ST214}
      expect: ["shrink", "availability", "labour"]
    - tool: create_store_visit_task
      args: {site_id: ST214, employee_id: EMP-0047, visit_date: "2026-10-17", visit_purpose: "Recovery plan review", duration_hours: 5}
      expect: ["VIS-", "planned"]
    - tool: draft_store_visit_action_plan
      args: {site_id: ST214}
      expect: ["ACTION PLAN", "ST214", "Shrink", "Availability"]

- question: "08:73:Q2"
  story: >
    Region includes stores in UK North cluster. Three stores below target added to visit list:
    ST214 (high shrink, low availability), ST008 (moderate shrink), and one other.
    Recovery plan messages sent. Patterns show shrink/labour trade-offs.
  checks:
    - tool: list_stores_in_region
      args: {region: "UK North"}
      expect: ["site_id", "UK North"]
    - tool: create_store_visit_task
      args: {site_id: ST214, employee_id: EMP-0047, visit_date: "2026-10-20", visit_purpose: "Recovery plan follow-up"}
      expect: ["VIS-"]

- question: "08:73:Q3"
  story: >
    Region stores ranked by priority score for next quarter. Top five get stock rebalancing.
    ST001 ranks highest (cluster A, strong performance). Bottom performers identified for
    focused investment. Visit list updated accordingly.
  checks:
    - tool: list_stores_in_region
      args: {region: "UK North", cluster: "A"}
      expect: ["site_id", "format"]

- question: "08:73:Q4"
  story: >
    Region sales tracking for period. Plan vs actual shows ST214 -9.2% variance in Oct (£12k miss),
    ST001 +1.2% (on track). Variance drivers point to staffing and availability gaps at ST214.
  checks:
    - tool: get_plan_vs_actual_by_store
      args: {site_id: ST214, month: "2026-10-01"}
      expect: ["118000", "-12000", "-9.2"]
    - tool: get_plan_vs_actual_by_store
      args: {month: "2026-10-01"}
      expect: ["ST214", "ST001"]

- question: "08:74:Q6"
  story: >
    K-1700 kettles hot-selling item. Click & Collect demand forecast vs actual, channel margin,
    and stock position drive allocation. 20% held for C&C, online capped to match. After three days,
    C&C hold released if unsold.
  checks:
    - tool: get_click_and_collect_demand_for_product
      args: {sku: "K-1700"}
      expect: ["K-1700", "forecasted", "actual"]

- question: "08:79:Q2"
  story: >
    Shrink control programmes evaluated: RFID tagging (£2500/store, 15% reduction, ROI 1.25x at ST214),
    layout (£5000, 12% reduction, ROI 0.54x at ST001), staffing (£15000, 8% reduction, ROI 0.12-0.15x).
    RFID and system rules have best payback. ST214 RFID costing £2800/month with £3500 shrink saving.
  checks:
    - tool: get_shrink_control_programmes
      args: {}
      expect: ["SCP-", "RFID", "Tagging"]
    - tool: get_control_costs_and_results_by_store
      args: {site_id: ST214, month: "2026-10-01"}
      expect: ["SCP-0001", "2800", "3500", "1.25"]
    - tool: get_control_costs_and_results_by_store
      args: {month: "2026-10-01"}
      expect: ["payback_ratio", "ST214", "ST001"]
