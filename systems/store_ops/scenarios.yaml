# One entry per question row that uses this system's tools
- question: "03:29:Q5"
  story: >
    Store 214 has old stock in SKU-100007 kettles. Multiple cycle counts show variances.
    The replenishment priority is raised to direct stock to high-shrink categories.
  checks:
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, sku: "SKU-100007", count_date: "2026-10-15", reason: "Pre-markdown verification"}
      expect: ["CYC-", "pending"]

- question: "05:49:Q3"
  story: >
    Take-back pilot at ST214 (June-Sept 2026) collected 1250 items/month at 680kg,
    saving 125kg CO2 monthly with 22.5% participation. Backroom has 180 sqft available.
    Nationwide rollout would involve 100 stores, with annual cost model calculated
    targeting 1800+ tonnes CO2 savings.
  checks:
    - tool: get_take_back_pilot_results
      args: {}
      expect: ["ST214", "1250", "125"]
    - tool: get_store_backroom_space_constraints
      args: {take_back_space_available: true}
      expect: ["site_id"]
    - tool: calculate_take_back_programme_cost
      args: {pilot_site_id: ST214, rollout_store_count: 100, participation_rate_pct: 20}
      expect: ["stores_in_rollout", "investment"]

- question: "08:71:Q1"
  story: >
    Store 214 shrink is high. Three recent cycle counts show variances on products.
    Action plan items address RFID tagging and daily floor walks. Peer ST001 has better shrink.
  checks:
    - tool: create_store_action_plan_item
      args: {site_id: ST214, title: "Urgent: Review receiving process", owner: "EMP-00005", due_date: "+20d", priority: urgent, category: Shrink}
      expect: ["API-", "open"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, category: "Homewares", count_date: "+6d", reason: "Monday shrink investigation"}
      expect: ["CYC-", "pending"]

- question: "08:71:Q2"
  story: >
    Store 214 has shelf gaps on three lines. Two are in backroom.
    Cycle counts created and both products bumped to priority 1 for replenishment.
  checks:
    - tool: get_shelf_availability_exceptions_for_store
      args: {site_id: ST214}
      expect: ["SKU-100007", "SKU-100014", "SKU-100021"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, sku: "SKU-100007", count_date: "+6d", reason: "Shelf gap - backroom stock check"}
      expect: ["CYC-", "SKU-100007"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, sku: "SKU-100014", count_date: "+6d", reason: "Shelf gap - backroom stock check"}
      expect: ["CYC-", "SKU-100014"]
    - tool: update_shelf_replenishment_priority_for_product
      args: {site_id: ST214, sku: "SKU-100007", priority_level: 1}
      expect: ["SKU-100007", "1"]
    - tool: update_shelf_replenishment_priority_for_product
      args: {site_id: ST214, sku: "SKU-100014", priority_level: 1}
      expect: ["SKU-100014", "1"]

- question: "08:71:Q3"
  story: >
    Store 214 next week has deliveries Tuesday and Friday, plus cycle count
    and replenishment tasks. Five tasks scheduled. Reassignments and cancellations happen.
  checks:
    - tool: get_delivery_schedule_for_store
      args: {site_id: ST214, week_start: "2026-10-06"}
      expect: ["Delivery", "scheduled"]
    - tool: get_task_list_for_store_week
      args: {site_id: ST214, week_start: "2026-10-06"}
      expect: ["TSK-", "scheduled"]
    - tool: reassign_task_to_employee
      args: {task_id: TSK-900001, employee_id: EMP-00015}
      expect: ["EMP-00015"]
    - tool: delete_task_from_store_week
      args: {task_id: TSK-900005}
      expect: ["cancelled"]

- question: "08:71:Q5"
  story: >
    Store 214 shrink 4.8%, availability 89.2%, labour cost 15.2%.
    Cluster contains ST008 and others. Peer ST001 outperforms on all metrics.
  checks:
    - tool: get_store_cluster_members
      args: {site_id: ST214}
      expect: ["site_id"]
    - tool: compare_store_kpis_within_cluster
      args: {site_id: ST214, month: "2026-10-01"}
      expect: ["ST214", "cluster_avg"]
    - tool: compare_store_kpis_with_peers
      args: {site_id: ST214, month: "2026-10-01"}
      expect: ["shrink_pct"]

- question: "08:73:Q1"
  story: >
    Store 214 below target for six months. Five peer stores identified.
    Visit scheduled for Thursday by EMP-00005. Action plan generated.
  checks:
    - tool: search_peer_stores_for_store
      args: {site_id: ST214, limit_count: 5}
      expect: ["site_id"]
    - tool: compare_store_kpis_with_peers
      args: {site_id: ST214}
      expect: ["shrink_pct"]
    - tool: create_store_visit_task
      args: {site_id: ST214, employee_id: EMP-00005, visit_date: "+7d", visit_purpose: "Recovery plan review", duration_hours: 5}
      expect: ["VIS-", "planned"]
    - tool: draft_store_visit_action_plan
      args: {site_id: ST214}
      expect: ["ACTION PLAN", "ST214"]

- question: "08:73:Q2"
  story: >
