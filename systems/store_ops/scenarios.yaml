    - tool: create_store_visit_task
      args: {site_id: ST214, employee_id: EMP-00005, visit_date: "+7d", visit_purpose: "Recovery plan follow-up"}
      expect: ["VIS-"]

- question: "08:73:Q3"
  story: >
    Region stores ranked by priority score. Top five get stock rebalancing.
    Visit list updated accordingly.
  checks:
