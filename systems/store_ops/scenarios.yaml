# One entry per question row that uses this system's tools
- question: "03:29:Q5"
  story: >
    Store 214 has old stock. Cycle counts show variances on SKU-100007.
    Channel options are retrieved and replenishment priority is raised.
  checks:
    - tool: get_channel_options_for_line
      args: {sku: "SKU-100007"}
      expect: ["SKU-100007", "channel"]
    - tool: update_shelf_replenishment_priority_for_product
      args: {site_id: ST214, sku: "SKU-100007", priority_level: 1}
      expect: ["SKU-100007", "1"]

- question: "05:49:Q3"
  story: >
    Take-back pilot at ST214 collected items monthly.
    Backroom has space available.
    Nationwide rollout would involve stores.
  checks:
    - tool: get_take_back_pilot_results
      args: {}
      expect: ["pilot_id"]
    - tool: get_store_backroom_space_constraints
      args: {take_back_space_available: true}
      expect: ["site_id"]
    - tool: calculate_take_back_programme_cost
      args: {pilot_site_id: ST214, rollout_store_count: 100, participation_rate_pct: 20}
      expect: ["investment"]

- question: "08:71:Q1"
  story: >
    Store 214 shrink is high. Cycle counts show variances.
    Action plan items address RFID tagging. Peer ST001 comparison performed.
  checks:
    - tool: create_store_action_plan_item
      args: {site_id: ST214, title: "Review receiving process", owner: "EMP-00005", due_date: "+20d", priority: urgent, category: Shrink}
      expect: ["API-"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, category: "Homewares", count_date: "+6d", reason: "Shrink investigation"}
      expect: ["CYC-"]

- question: "08:71:Q2"
  story: >
    Store 214 has shelf gaps on SKU-100007 and SKU-100014.
    Cycle counts created and products bumped to priority 1.
  checks:
    - tool: get_shelf_availability_exceptions_for_store
      args: {site_id: ST214}
      expect: ["SKU-100007", "SKU-100014"]
    - tool: create_cycle_count_task_for_store
      args: {site_id: ST214, sku: "SKU-100007", count_date: "+6d", reason: "Shelf gap"}
      expect: ["CYC-"]
    - tool: update_shelf_replenishment_priority_for_product
      args: {site_id: ST214, sku: "SKU-100007", priority_level: 1}
      expect: ["SKU-100007"]

- question: "08:71:Q3"
  story: >
    Store 214 next week has deliveries and tasks scheduled.
    Tasks reassigned and one cancelled.
  checks:
    - tool: get_task_list_for_store_week
      args: {site_id: ST214, week_start: "-7d"}
      expect: ["task_id"]
    - tool: reassign_task_to_employee
      args: {task_id: TSK-900001, employee_id: EMP-00015}
      expect: ["EMP-00015"]
    - tool: delete_task_from_store_week
      args: {task_id: TSK-900005}
      expect: ["cancelled"]

- question: "08:71:Q5"
  story: >
    Store 214 vs cluster comparison and peer comparison performed.
  checks:
    - tool: get_store_cluster_members
      args: {site_id: ST214}
      expect: ["site_id"]
    - tool: compare_store_kpis_within_cluster
      args: {site_id: ST214, month: "-1m"}
      expect: ["site_id"]
    - tool: compare_store_kpis_with_peers
      args: {site_id: ST214, month: "-1m"}
      expect: ["site_id"]

- question: "08:73:Q1"
