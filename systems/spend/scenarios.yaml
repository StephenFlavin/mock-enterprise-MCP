- question: "04:36:Q1"
  story: Preferred-supplier share in Home category dropped from 82% (Apr) to 70% (Sep). Spend going to SUP-0010 and SUP-0011, moving from preferred to non-preferred status.
  checks:
    - tool: get_preferred_supplier_share_trend
      args: {category: "Home"}
      expect: ["Home", "82", "70", "preferred_share_pct"]
    - tool: list_spend_by_supplier_and_category
      args: {category: "Home"}
      expect: ["SUP-0001", "Home", "period"]
    - tool: calculate_price_variance_vs_contract
      args: {supplier_id: "SUP-0070"}
      expect: ["SUP-0070"]

- question: "04:36:Q2"
  story: Consolidation analysis for Home category. Home consolidation initiative reports 150k saving target, realised 145k. Renegotiation initiative reports 80k, realised 48k. Historic rates show consolidation achieves 80-85%.
  checks:
    - tool: list_spend_by_supplier_and_category
      args: {category: "Home"}
      expect: ["Home", "SUP-0001"]
    - tool: calculate_consolidation_savings
      args: {category: "Home", consolidation_target_pct: 80}
      expect: ["total_category_spend_gbp", "conservative_saving_gbp", "optimistic_saving_gbp"]
    - tool: calculate_renegotiation_recovery
      args: {category: "Home"}
      expect: ["annual_spend_gbp", "conservative_recovery_gbp", "aggressive_recovery_gbp"]
    - tool: get_historic_savings_realisation_rates
      args: {initiative_type: "consolidation"}
      expect: ["consolidation", "realisation_rate_pct", "initiatives_count"]
    - tool: create_savings_initiative
      args: {name: "Test initiative", category: "Home", initiative_type: "consolidation", reported_saving_gbp: 100000, target_completion_date: "+90d"}
      expect: ["INIT-", "Test initiative", "planned"]

- question: "04:36:Q3"
  story: Last year's savings tracking. Completed initiatives show variance between reported and realised. INIT-900001 reported 150k, realised 145k (96.7%). INIT-900002 reported 80k, realised 48k (60%).
  checks:
    - tool: list_reported_savings_initiatives
      args: {status: "completed"}
      expect: ["INIT-900001", "INIT-900002", "completed"]
    - tool: calculate_realised_savings
      args: {category: "Home"}
      expect: ["initiatives_count", "reported_total_gbp", "realised_total_gbp", "realisation_rate_pct"]
    - tool: compare_reported_vs_realised_savings
      args: {status: "completed"}
      expect: ["INIT-900001", "145000", "reported_saving_gbp"]

- question: "04:36:Q4"
  story: Price overpayment analysis. SKU-101442 paid at 39.50 vs benchmark 36.95 (6.9% overpay). SKU-103955 paid 26.20 vs contract 24.85 (5.4% overpay).
  checks:
    - tool: compare_price_paid_to_benchmark
      args: {category: "Footwear"}
      expect: ["SKU-101442", "39.5", "6.9"]

- question: "04:36:Q6"
  story: Expected price increases. SUP-0001 shows raw materials index rising from 102.3 to 106.2 (3.8% increase). Labour index rises 100.0 to 103.0 (3.0%). Overall expected increase ~3.4%.
  checks:
    - tool: calculate_expected_price_increase_by_supplier
      args: {supplier_id: "SUP-0001"}
      expect: ["SUP-0001", "raw_materials_index", "labour_index"]

- question: "04:37:Q3"
  story: Facilities spend (Home category) over budget. Recurring vs one-off analysis. SUP-0001 has 6 invoices per month (recurring). SUP-0010 starts with 2 invoices (one-off) then increases to 4 (becoming recurring).
  checks:
    - tool: list_spend_by_supplier_and_category
      args: {category: "Home"}
      expect: ["Home", "SUP-0001"]
    - tool: classify_spend_one_off_vs_recurring
      args: {supplier_id: "SUP-0001"}
      expect: ["recurring_pct", "classification_rule"]

- question: "04:34:Q7"
  story: Nearshore supplier SUP-0010 commitment tracking. Forecast volume 7500 units in Sep, actual 7100 (commitment 94.7%). Similar pattern for SUP-0011.
  checks:
    - tool: get_nearshore_spend_and_forecast_volume
      args: {supplier_id: "SUP-0010"}
      expect: ["SUP-0010", "7100", "7500", "94.7"]

- question: "04:32:Q7"
  story: Annual review with SUP-0001 (cookware). Payment terms benchmark for Home in CN is 60 days. Market standard captured.
  checks:
    - tool: get_payment_terms_benchmark
      args: {category: "Home", supplier_country: "CN"}
      expect: ["60", "market_standard_days"]
    - tool: get_supplier_spend_by_category
      args: {supplier_id: "SUP-0001"}
      expect: ["SUP-0001", "Home", "spend_gbp"]

- question: "04:32:Q8"
  story: Margin decline. Renegotiation recovery potential for Home category estimated at 3-8% of spend, or 45k-120k GBP.
  checks:
    - tool: calculate_renegotiation_recovery
      args: {category: "Home"}
      expect: ["conservative_recovery_gbp", "aggressive_recovery_gbp"]

- question: "04:35:Q3"
  story: Too many suppliers in Home. Consolidation of Home category to 80% preferred share could save 5-12% through reduced tail spend and management overhead.
  checks:
    - tool: get_supplier_spend_by_category
      args: {supplier_id: "SUP-0001"}
      expect: ["SUP-0001", "Home"]
    - tool: calculate_consolidation_savings
      args: {category: "Home", consolidation_target_pct: 80}
      expect: ["total_category_spend_gbp", "conservative_saving_gbp"]

- question: "04:32:Q5"
  story: Currency exposure. Suppliers by currency breakdown for FX impact analysis. SUP-0001, SUP-0002 exposed to GBP/CNY moves. Indexed data shows cost inflation risk.
  checks:
    - tool: get_supplier_spend_by_category
      args: {supplier_id: "SUP-0001"}
      expect: ["SUP-0001", "Home"]

- question: "04:32:Q6"
  story: Supplier in trouble risk check. SUP-0001 supplies Home category (top supplier). Category spend share analysis shows SUP-0001 concentration at 19% of Home spend (Aug 2026).
  checks:
    - tool: get_spend_by_supplier
      args: {category: "Home"}
      expect: ["SUP-0001", "Home", "total_spend_gbp"]

- question: "04:36:Q5"
  story: Vendor master cleanup / consolidation. Spend by supplier over 24 months. SUP-0001, SUP-0002, SUP-0010, SUP-0011 are key suppliers. 24-month spend data available.
  checks:
    - tool: get_spend_by_supplier
      args: {category: "Home", periods: 24}
      expect: ["SUP-0001", "total_spend_gbp"]
