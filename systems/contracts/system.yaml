  - name: draft_negotiation_brief
    desc: Drafts a negotiation brief for a carrier or supplier contract with current terms, performance, open cases and terms to seek. Give contract_id, carrier_id or supplier_id.
    kind: draft
    args: [contract_id, carrier_id, supplier_id]
    sql:
      contract: |
        SELECT c.contract_id, c.contract_type, c.party_id, c.status, c.start_date, c.end_date, c.renewal_notice_days, c.auto_renewal,
               COALESCE(car.name, sup.name, c.party_name) AS party_label, car.mode AS carrier_mode,
               sup.tier, sup.otif_pct_12m, sup.annual_spend_gbp, sup.payment_terms_days
        FROM contracts c
        LEFT JOIN master.carriers car ON c.party_type = 'carrier_id' AND car.carrier_id = c.party_id
        LEFT JOIN master.suppliers sup ON c.party_type = 'supplier_id' AND sup.supplier_id = c.party_id
        WHERE c.contract_id = COALESCE($contract_id, (SELECT c2.contract_id FROM contracts c2
                 WHERE c2.party_id = COALESCE($carrier_id, $supplier_id) AND c2.status IN ('active', 'draft')
                 ORDER BY c2.end_date DESC LIMIT 1))
      clauses: |
        SELECT cc.clause_type, cc.title, json_extract_string(cc.content, '$.summary') AS summary
        FROM contract_clauses cc
        WHERE cc.contract_id = COALESCE($contract_id, (SELECT c2.contract_id FROM contracts c2
                 WHERE c2.party_id = COALESCE($carrier_id, $supplier_id) AND c2.status IN ('active', 'draft')
                 ORDER BY c2.end_date DESC LIMIT 1))
          AND cc.clause_type IN ('service_level', 'rate_review', 'price_review', 'volume_commitment', 'termination',
                                 'renewal', 'liability', 'claim_window', 'payment_terms', 'penalty', 'chargeback')
        ORDER BY cc.clause_type
      rates: |
        SELECT rc.service_type, rc.lane, rc.rate_unit, rc.base_rate_gbp
        FROM rate_cards rc
        WHERE rc.status = 'active' AND rc.contract_id = COALESCE($contract_id, (SELECT c2.contract_id FROM contracts c2
                 WHERE c2.party_id = COALESCE($carrier_id, $supplier_id) AND c2.status IN ('active', 'draft')
                 ORDER BY c2.end_date DESC LIMIT 1))
        ORDER BY rc.service_type
      breaches: |
        SELECT b.breach_date, b.description, b.status FROM contract_breaches b
        WHERE b.contract_id = COALESCE($contract_id, (SELECT c2.contract_id FROM contracts c2
                 WHERE c2.party_id = COALESCE($carrier_id, $supplier_id) AND c2.status IN ('active', 'draft')
                 ORDER BY c2.end_date DESC LIMIT 1))
        ORDER BY b.breach_date DESC LIMIT 5
      cases: |
        SELECT n.case_id, n.case_type, n.description, n.status FROM negotiation_cases n
        WHERE n.status IN ('open', 'in_progress') AND n.contract_id = COALESCE($contract_id, (SELECT c2.contract_id FROM contracts c2
                 WHERE c2.party_id = COALESCE($carrier_id, $supplier_id) AND c2.status IN ('active', 'draft')
                 ORDER BY c2.end_date DESC LIMIT 1))
    template: |
      NEGOTIATION BRIEF - {{ contract[0].party_label }} ({{ contract[0].party_id }})
      Contract {{ contract[0].contract_id }} ({{ contract[0].contract_type }}, {{ contract[0].status }}), ends {{ contract[0].end_date }}.
      Notice to end or renegotiate: {{ contract[0].renewal_notice_days }} days before expiry; auto-renewal: {{ contract[0].auto_renewal }}.
      {% if contract[0].tier %}
      Supplier profile: {{ contract[0].tier }} tier, annual spend {{ contract[0].annual_spend_gbp | money }}, OTIF 12m {{ contract[0].otif_pct_12m }}%, payment terms {{ contract[0].payment_terms_days }} days.
      {% endif %}

      Current rates:
      {% for r in rates %}
      - {{ r.service_type }}{% if r.lane %} ({{ r.lane }}){% endif %}: {{ r.base_rate_gbp }} {{ r.rate_unit }}
      {% endfor %}

      Current contract terms and what to seek:
      {% set asks = {
        'service_level': 'Raise the service target and add service credits or an exit right when it is missed',
        'rate_review': 'Cap annual increases, index fuel to a published benchmark and lengthen notice of changes',
        'price_review': 'Cap annual increases and tie any rise to a published index with evidence',
        'volume_commitment': 'Cut the minimum volume or shortfall charge, and allow flex for a trial or volume shift',
        'termination': 'Shorten our termination notice and add a right to exit for repeated service failure',
        'renewal': 'Replace automatic renewal with a decision point and shorten the renewal term',
        'liability': 'Raise the liability limit and reduce exclusions',
        'claim_window': 'Extend the claim time limits',
        'payment_terms': 'Hold or extend our payment terms',
        'penalty': 'Increase late-delivery penalties',
        'chargeback': 'Widen chargebacks to cover expedite and air freight costs'} %}
      {% for cl in clauses %}
      - {{ cl.title }} ({{ cl.clause_type }}): {{ cl.summary }}
        Seek: {{ asks[cl.clause_type] }}.
      {% endfor %}

      Logged breaches:
      {% for b in breaches %}
      - {{ b.breach_date }}: {{ b.description }} ({{ b.status }})
      {% else %}
      - none logged
      {% endfor %}

      Open negotiation cases:
      {% for n in cases %}
      - {{ n.case_id }} {{ n.case_type }}: {{ n.description }} ({{ n.status }})
      {% else %}
      - none open
      {% endfor %}
    example: {carrier_id: CAR-003}

  - name: update_contract_negotiation_position
    desc: Records the current negotiation position on a contract. Returns the position record.
    kind: insert
    table: contract_negotiation_positions
    id_prefix: POS-
