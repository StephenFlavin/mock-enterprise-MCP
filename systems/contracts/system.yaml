  - name: get_contract_price_for_service
    desc: Contracted price for a service from rate cards or price lists. Use for quoting.
    kind: sql
    args:
      contract_id: {required: true}
      service_type: {type: str, desc: "Service type (optional)"}
    sql: |
      SELECT c.contract_id, c.party_id, rc.rate_card_id, rc.base_rate_gbp, rc.currency,
             rc.surcharges_json, rc.effective_from, rc.effective_to
      FROM contracts c
      LEFT JOIN rate_cards rc ON c.contract_id = rc.contract_id
      WHERE c.contract_id = $contract_id
        AND rc.status = 'active'
        AND rc.effective_from <= $as_of
      ORDER BY rc.effective_from DESC
      LIMIT 10
    example: {contract_id: CTR-900001}

