id: contracts
name: Contract Management System
instructions: >
  Supplier, carrier and customer contracts with terms, clauses, rates and renewals.
  Contract ids look like CTR-000123. Use it for contract terms, pricing, liability,
  claims windows, renewal alerts and breach tracking.

tables:
  contracts:
    key: contract_id
    cols:
      contract_id: {type: str, desc: "Contract id, e.g. CTR-000123"}
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency], desc: Contract type}
      party_type: {type: str, desc: "Type of counterparty: supplier_id, carrier_id, customer_id, partner_id, or employee_id"}
      party_id: {type: str, desc: "Counterparty id: supplier_id, carrier_id, customer_id, partner_id, or employee_id"}
      owner_id: {type: str, desc: "Business owner (employee_id)"}
      start_date: {type: date, desc: Contract start date}
      end_date: {type: date, desc: Contract end date}
      renewal_notice_days: {type: int, desc: "Days before end_date to give notice"}
      auto_renewal: {type: bool, desc: "Auto-renews on expiry if true"}
      status: {type: enum, values: [draft, active, expired, terminated, archived], desc: Contract status}
      created_at: {type: timestamp, desc: When created}
      updated_at: {type: timestamp, desc: Last updated}

  contract_clauses:
    key: [contract_id, clause_id]
    cols:
      contract_id: {type: str, desc: "Contract"}
      clause_id: {type: str, desc: "Clause identifier within contract"}
      clause_type: {type: enum, values: [liability, payment_terms, renewal, price_review, force_majeure, termination, claim_window, short_shipment, chargeback, rate_review, service_level, penalty, ip_protection, other], desc: Clause type}
      title: {type: str, desc: "Clause title"}
      content: {type: text, desc: "Full clause text"}
      created_at: {type: timestamp, desc: When added}

  contract_breaches:
    key: breach_id
    cols:
      breach_id: {type: str, desc: "Breach record, e.g. BRH-000123"}
      contract_id: {type: str, desc: "Affected contract"}
      breach_date: {type: date, desc: "Date of breach"}
      description: {type: str, desc: "What happened"}
      impact: {type: str, desc: "Impact description"}
      status: {type: enum, values: [logged, under_review, remediated, disputed, escalated], desc: Breach status}
      created_at: {type: timestamp, desc: When logged}
      updated_at: {type: timestamp, desc: Last updated}

  contract_disputes:
    key: dispute_id
    cols:
      dispute_id: {type: str, desc: "Dispute id, e.g. DSP-000123"}
      contract_id: {type: str, desc: "Related contract"}
      account_id: {type: str, desc: "Account being disputed (supplier/customer id)"}
      dispute_type: {type: enum, values: [penalty, chargeback, claim, overcharge, other], desc: Dispute type}
      amount_gbp: {type: float, desc: "Disputed amount in GBP"}
      description: {type: str, desc: "Dispute details"}
      status: {type: enum, values: [raised, under_review, settled, rejected], desc: Dispute status}
      created_at: {type: timestamp, desc: When raised}
      updated_at: {type: timestamp, desc: Last updated}

  negotiation_cases:
    key: case_id
    cols:
      case_id: {type: str, desc: "Negotiation case, e.g. NGT-000123"}
      contract_id: {type: str, desc: "Contract being negotiated"}
      case_type: {type: enum, values: [renewal, rate_review, new_deal, amendment, exit], desc: Case type}
      description: {type: str, desc: "Negotiation objective"}
      status: {type: enum, values: [open, in_progress, closed_agreed, closed_rejected, closed_no_deal], desc: Case status}
      opened_at: {type: timestamp, desc: When case opened}
      closed_at: {type: timestamp, desc: When case closed}

  rate_cards:
    key: rate_card_id
    cols:
      rate_card_id: {type: str, desc: "Rate card, e.g. RTC-000123"}
      card_type: {type: enum, values: [carrier, agency, freight_forwarder], desc: Rate card type}
      party_id: {type: str, desc: "Carrier/agency id"}
      contract_id: {type: str, desc: "Related contract"}
      effective_from: {type: date, desc: "Effective from date"}
      effective_to: {type: date, desc: "Effective to date"}
      base_rate_gbp: {type: float, desc: "Base rate in GBP"}
      currency: {type: str, desc: "Currency if not GBP"}
      surcharges_json: {type: text, desc: "Surcharge details as JSON"}
      notice_period_days: {type: int, desc: "Notice period for changes"}
      status: {type: enum, values: [active, superseded, archived], desc: Rate card status}
      created_at: {type: timestamp, desc: When created}

  price_lists:
    key: price_list_id
    cols:
      price_list_id: {type: str, desc: "Price list, e.g. PRL-000123"}
      list_type: {type: enum, values: [customer_prices, agency_rates, supplier_costs], desc: Price list type}
      contract_id: {type: str, desc: "Related contract"}
      party_id: {type: str, desc: "Customer/supplier/agency id"}
      effective_from: {type: date, desc: "Effective from date"}
      effective_to: {type: date, desc: "Effective to date"}
      list_currency: {type: str, desc: "Currency, e.g. GBP"}
      terms_json: {type: text, desc: "Payment and delivery terms as JSON"}
      status: {type: enum, values: [active, superseded, archived], desc: Price list status}
      created_at: {type: timestamp, desc: When created}

  renewal_alerts:
    key: alert_id
    cols:
      alert_id: {type: str, desc: "Alert id, e.g. ALR-000123"}
      contract_id: {type: str, desc: "Contract to renew"}
      alert_date: {type: date, desc: "Date to send alert"}
      status: {type: enum, values: [scheduled, triggered, dismissed, completed], desc: Alert status}
      created_at: {type: timestamp, desc: When created"}
      sent_at: {type: timestamp, desc: When alert was sent}

  contract_negotiation_positions:
    key: position_id
    cols:
      position_id: {type: str, desc: "Position record, e.g. POS-000123"}
      contract_id: {type: str, desc: "Contract"}
      case_id: {type: str, desc: "Related negotiation case"}
      position_type: {type: enum, values: [offer, counter, fallback, agreed], desc: Position type}
      terms: {type: text, desc: "Terms being negotiated"}
      notes: {type: str, desc: "Notes on position"}
      recorded_at: {type: timestamp, desc: "When recorded"}

  contract_drafts:
    key: draft_id
    cols:
      draft_id: {type: str, desc: "Draft contract, e.g. DRF-000123"}
      draft_type: {type: enum, values: [new_supplier, new_carrier, new_customer, renewal, amendment], desc: Draft type}
      template_id: {type: str, desc: "Template used"}
      selected_clauses: {type: text, desc: "Clause ids selected as JSON array"}
      counterparty_id: {type: str, desc: "Intended counterparty"}
      created_at: {type: timestamp, desc: "When created"}
      status: {type: enum, values: [draft, finalized, rejected], desc: Draft status}

tools:
  # Stage 1 tools (20-21 to implement)

  - name: get_carrier_contract_rates
    desc: Contracted carrier rates and accessorials for a lane or service. Use to compare invoices to contract.
    kind: sql
    args:
      carrier_id: {required: true}
      contract_id: {}
      service_type: {type: str, desc: "Service type, e.g. pallet, container (optional)"}
    sql: |
      SELECT rc.rate_card_id, rc.party_id, c.contract_id, c.start_date, c.end_date,
             rc.base_rate_gbp, rc.surcharges_json, rc.notice_period_days, rc.effective_from, rc.effective_to
      FROM rate_cards rc
      LEFT JOIN contracts c ON c.contract_id = rc.contract_id
      WHERE rc.party_id = $carrier_id
        AND rc.card_type = 'carrier'
        AND ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND rc.status = 'active'
        AND rc.effective_from <= $as_of
      ORDER BY rc.effective_from DESC
    limit: 20
    example: {carrier_id: CAR-007}

  - name: get_contract_claim_time_limits
    desc: Claim time window and short-shipment terms from contracts. Use to check if claims are still valid.
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, cc.clause_type, cc.title, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type IN ('claim_window', 'short_shipment')
    limit: 20
    example: {contract_id: CTR-900001}

  - name: get_contract_coverage_by_category
    desc: Share of category spend under contract vs off-contract. Use to see coverage gaps.
    kind: sql
    args:
      category: {type: str, desc: "Product category or service type"}
      contract_id: {}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status, c.start_date, c.end_date,
             count(*) AS items_covered,
             'coverage analysis by category' AS analysis_type
      FROM contracts c
      WHERE ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND c.status IN ('active', 'draft')
      GROUP BY c.contract_id, c.party_id, c.contract_type, c.status, c.start_date, c.end_date
      ORDER BY c.contract_id
    limit: 20
    example: {category: "logistics services"}

  - name: get_carrier_liability_terms
    desc: Carrier liability limits and claim time limits. Use to assess claim value and risk.
    kind: sql
    args:
      carrier_id: {required: true}
      contract_id: {}
    sql: |
      SELECT c.contract_id, c.party_id, cc.clause_type, cc.title, cc.content,
             COALESCE(CAST(json_extract_string(cc.content, 'limit_gbp') AS FLOAT), 0) AS liability_limit_gbp
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.party_id = $carrier_id
        AND ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND c.status = 'active'
        AND cc.clause_type = 'liability'
    limit: 20
    example: {carrier_id: CAR-002}

  - name: get_carrier_contract_rate_review_clauses
    desc: Rate review and surcharge clauses in carrier contracts. Use to forecast rate changes.
    kind: sql
    args:
      carrier_id: {required: true}
      contract_id: {}
    sql: |
      SELECT c.contract_id, c.party_id, cc.clause_type, cc.title, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.party_id = $carrier_id
        AND ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND c.status = 'active'
        AND cc.clause_type IN ('price_review', 'rate_review')
    limit: 20
    example: {carrier_id: CAR-007}

  - name: get_agency_rate_card
    desc: Agency rates, mark-ups and notice terms from price lists. Use to quote customers or compare options.
    kind: sql
    args:
      agency_id: {required: true, desc: "Agency or partner id"}
      contract_id: {}
    sql: |
      SELECT pl.price_list_id, pl.party_id, pl.contract_id, pl.effective_from, pl.effective_to,
             pl.list_currency, pl.terms_json, c.party_id AS agency_name
      FROM price_lists pl
      LEFT JOIN contracts c ON pl.contract_id = c.contract_id
      WHERE pl.party_id = $agency_id
        AND pl.list_type IN ('agency_rates', 'supplier_costs')
        AND pl.status = 'active'
        AND pl.effective_from <= $as_of
      ORDER BY pl.effective_from DESC
    limit: 20
    example: {agency_id: SUP-0001}

  - name: get_agreed_price_list
    desc: Agreed customer price list and terms from contracts. Use for quoting and checking compliance.
    kind: sql
    args:
      customer_id: {required: true}
      contract_id: {}
    sql: |
      SELECT pl.price_list_id, pl.contract_id, pl.list_type AS customer_prices, pl.effective_from, pl.effective_to,
             pl.list_currency, pl.terms_json, c.status AS contract_status
      FROM price_lists pl
      LEFT JOIN contracts c ON pl.contract_id = c.contract_id
      WHERE pl.party_id = $customer_id
        AND pl.list_type = 'customer_prices'
        AND pl.status = 'active'
        AND pl.effective_from <= $as_of
      ORDER BY pl.effective_from DESC
    limit: 20
    example: {customer_id: CUS-002512}

  - name: calculate_liability_exposure
    desc: Estimate liability under a limitation clause. Use to assess risk and insurance needs.
    kind: sql
    args:
      contract_id: {required: true}
      volume_units: {type: int, desc: "Volume or transaction count"}
      unit_value_gbp: {type: float, desc: "Value per unit"}
    sql: |
      SELECT c.contract_id, c.party_id,
             COALESCE(CAST(json_extract_string(cc.content, 'limit_gbp') AS FLOAT), 1000000) AS liability_limit_gbp,
             $volume_units AS assumed_volume,
             $unit_value_gbp AS unit_value,
             ($volume_units * $unit_value_gbp) AS total_exposure_gbp,
             LEAST(($volume_units * $unit_value_gbp), COALESCE(CAST(json_extract_string(cc.content, 'limit_gbp') AS FLOAT), 1000000)) AS capped_liability_gbp,
             'liability = min(total_exposure, contract_limit)' AS formula
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type = 'liability'
      LIMIT 1
    example: {contract_id: CTR-900005, volume_units: 100, unit_value_gbp: 1000}

  - name: calculate_recoverable_claim_value
    desc: Claim value recoverable under carrier liability terms. Use to assess claimable damage.
    kind: sql
    args:
      contract_id: {required: true}
      damage_value_gbp: {type: float, desc: "Claimed damage value in GBP"}
    sql: |
      SELECT c.contract_id, c.party_id,
             $damage_value_gbp AS claimed_value_gbp,
             COALESCE(CAST(json_extract_string(cc.content, 'limit_gbp') AS FLOAT), $damage_value_gbp) AS liability_limit_gbp,
             LEAST($damage_value_gbp, COALESCE(CAST(json_extract_string(cc.content, 'limit_gbp') AS FLOAT), $damage_value_gbp)) AS recoverable_value_gbp,
             CASE WHEN CAST(json_extract_string(cc.content, 'subject_to_deductible') AS BOOL) THEN
               GREATEST(LEAST($damage_value_gbp, COALESCE(CAST(json_extract_string(cc.content, 'limit_gbp') AS FLOAT), $damage_value_gbp)) -
                        COALESCE(CAST(json_extract_string(cc.content, 'deductible_gbp') AS FLOAT), 0), 0)
             ELSE
               LEAST($damage_value_gbp, COALESCE(CAST(json_extract_string(cc.content, 'limit_gbp') AS FLOAT), $damage_value_gbp))
             END AS net_recoverable_gbp,
             'recoverable = min(claimed, limit) - deductible' AS formula
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type = 'liability'
      LIMIT 1
    example: {contract_id: CTR-900001, damage_value_gbp: 5000}

  - name: calculate_short_shipment_penalties
    desc: Calculates short shipment penalties under contract terms. Use to compute claims value.
    kind: sql
    args:
      contract_id: {required: true}
      expected_units: {type: int, desc: "Expected units"}
      received_units: {type: int, desc: "Units actually received"}
    sql: |
      SELECT c.contract_id, c.party_id,
             $expected_units AS expected_units,
             $received_units AS received_units,
             ($expected_units - $received_units) AS short_units,
             ROUND(CAST(($expected_units - $received_units) AS FLOAT) / $expected_units * 100, 2) AS short_pct,
             COALESCE(CAST(json_extract_string(cc.content, 'penalty_gbp_per_unit') AS FLOAT), 0) AS penalty_per_unit_gbp,
             COALESCE(CAST(json_extract_string(cc.content, 'penalty_gbp_per_unit') AS FLOAT), 0) * ($expected_units - $received_units) AS total_penalty_gbp,
             'penalty = short_units * penalty_rate' AS formula
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type = 'short_shipment'
      LIMIT 1
    example: {contract_id: CTR-900003, expected_units: 1000, received_units: 950}

  - name: calculate_fine_exposure_by_account
    desc: Calculates fine exposure by account under penalty clauses. Use to assess risk.
    kind: sql
    args:
      contract_id: {required: true}
      account_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, $account_id AS account_id,
             count(*) AS penalty_clauses,
             round(sum(COALESCE(CAST(json_extract_string(cc.content, 'max_penalty_gbp') AS FLOAT), 0)), 2) AS total_max_exposure_gbp,
             'exposure = sum(max penalties)' AS formula
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type = 'penalty'
      GROUP BY c.contract_id, c.party_id
    example: {contract_id: CTR-900004, account_id: CUS-002512}

  - name: calculate_commitment_risk_scenarios
    desc: Downside cost of volume commitments under demand scenarios. Use to assess volume risk.
    kind: py
    fn: calc_commitment_risk
    args:
      contract_id: {required: true}
      base_volume_units: {type: int, desc: "Base annual volume in units"}
      pessimistic_volume_pct: {type: int, desc: "Pessimistic scenario as % of base", default: 70}
      unit_cost_gbp: {type: float, desc: "Unit cost in GBP"}
    example: {contract_id: CTR-000001, base_volume_units: 10000, unit_cost_gbp: 5}

  - name: calculate_contract_risk_ranking
    desc: Rank contracts by clause-based risk score. Use to prioritize contract review work.
    kind: sql
    args:
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency], desc: "Filter by contract type (optional)"}
      limit_rows: {type: int, desc: "Return top N", default: 20}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status,
             count(DISTINCT cc.clause_type) AS clause_count,
             CASE WHEN cc.clause_type IN ('liability', 'force_majeure', 'termination') THEN 1 ELSE 0 END AS risk_flags,
             ROW_NUMBER() OVER (ORDER BY count(*) DESC) AS risk_rank
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE ($contract_type IS NULL OR c.contract_type = $contract_type)
        AND c.status IN ('active', 'draft')
      GROUP BY c.contract_id, c.party_id, c.contract_type, c.status, cc.clause_type
      ORDER BY risk_rank
      LIMIT $limit_rows
    example: {}

  - name: compare_contract_to_standard_terms
    desc: Deviation list of a contract versus standard terms. Use for contract review and redline.
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, cc.clause_type, cc.title, cc.content,
             'non-standard deviation' AS deviation_type
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
      ORDER BY cc.clause_type
    limit: 30
    example: {contract_id: CTR-000001}

  # Write tools for stage 1

  - name: create_contract_draft
    desc: Creates a draft agreement record from a template and chosen clauses. Returns the new draft id.
    kind: insert
    table: contract_drafts
    id_prefix: DRF-
    defaults: {status: draft}
    args:
      draft_type: {required: true}
      template_id: {required: true}
      selected_clauses: {type: str, desc: "Clause ids as JSON array"}
      counterparty_id: {required: true}
    example: {draft_type: new_supplier, template_id: TMT-001, selected_clauses: '["c1", "c2"]', counterparty_id: SUP-0042}

  - name: create_contract_breach_record
    desc: Logs a breach or delay event against a contract. Returns the new breach record.
    kind: insert
    table: contract_breaches
    id_prefix: BRH-
    defaults: {status: logged}
    args:
      contract_id: {required: true}
      breach_date: {required: true, type: date}
      description: {required: true}
      impact: {type: str}
    example: {contract_id: CTR-900001, breach_date: "-30d", description: "Late delivery", impact: "Store stockout"}

  - name: create_contract_renewal_alert
    desc: Sets an alert ahead of a contract notice or renewal date. Returns the alert id.
    kind: insert
    table: renewal_alerts
    id_prefix: ALR-
    defaults: {status: scheduled}
    args:
      contract_id: {required: true}
      alert_date: {required: true, type: date}
    example: {contract_id: CTR-900001, alert_date: "+30d"}

  - name: create_negotiation_case
    desc: Opens a renegotiation case against a contract. Returns the new case id.
    kind: insert
    table: negotiation_cases
    id_prefix: NGT-
    defaults: {status: open}
    args:
      contract_id: {required: true}
      case_type: {required: true}
      description: {required: true}
    example: {contract_id: CTR-000001, case_type: rate_review, description: "Request 5% discount"}

  - name: create_penalty_dispute_for_account
    desc: Lodges a dispute against a penalty charged to an account. Returns the dispute id.
    kind: insert
    table: contract_disputes
    id_prefix: DSP-
    defaults: {status: raised}
    args:
      contract_id: {required: true}
      account_id: {required: true}
      dispute_type: {required: true}
      amount_gbp: {required: true, type: float}
      description: {required: true}
    example: {contract_id: CTR-000001, account_id: SUP-0001, dispute_type: penalty, amount_gbp: 500, description: "Penalty not contractually justified"}

  - name: archive_contract_record
    desc: Archives an expired or unused contract record. Returns old and new status.
    kind: update
    table: contracts
    set: {status: archived}
    args: {}
    example: {contract_id: CTR-900005}

  - name: draft_negotiation_brief
    desc: Drafts a carrier negotiation brief with terms to seek. Returns formatted text brief.
    kind: draft
    args: [contract_id, carrier_id]
    sql:
      contract: "SELECT * FROM contracts WHERE contract_id = $contract_id LIMIT 1"
      current_rates: "SELECT * FROM rate_cards WHERE contract_id = $contract_id ORDER BY effective_from DESC LIMIT 5"
      breaches: "SELECT * FROM contract_breaches WHERE contract_id = $contract_id AND status = 'logged' LIMIT 10"
    template: |
      NEGOTIATION BRIEF

      Carrier: {{ carrier_id }}
      Contract: {{ contract[0].contract_id }}
      Current Status: {{ contract[0].status }}
      End Date: {{ contract[0].end_date }}

      Current Rates:
      {% for rate in current_rates %}
      - {{ rate.rate_card_id }}: £{{ rate.base_rate_gbp }}
      {% endfor %}

      Recent Breaches:
      {% for breach in breaches %}
      - {{ breach.breach_date }}: {{ breach.description }}
      {% endfor %}

      Negotiation Objectives:
      - Confirm volume commitments
      - Review accessorial charges
      - Establish service level targets
    example: {contract_id: CTR-000001, carrier_id: CAR-007}

  - name: update_contract_negotiation_position
    desc: Records the current negotiation position on a contract. Returns the position record.
    kind: insert
    table: contract_negotiation_positions
    id_prefix: POS-
    args:
      contract_id: {required: true}
      case_id: {type: str}
      position_type: {required: true}
      terms: {required: true, type: str, desc: "Terms being proposed"}
      notes: {type: str}
    example: {contract_id: CTR-000001, position_type: offer, terms: "5% rate reduction", notes: "Counter to their initial ask"}

  # Stage 2 tools (20 to implement)

  - name: get_contract_liability_clause
    desc: Liability and cap clauses of a contract. Use to assess exposure and insurance needs.
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, cc.clause_type, cc.title, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type = 'liability'
      ORDER BY cc.clause_id
    limit: 10
    example: {contract_id: CTR-900005}

  - name: get_contract_notice_periods
    desc: Notice periods required for each contract. Use to track renewal deadlines.
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.end_date,
             c.renewal_notice_days, c.auto_renewal,
             CAST(c.end_date AS DATE) - INTERVAL (c.renewal_notice_days) DAY AS notice_deadline
      FROM contracts c
      WHERE c.contract_id = $contract_id
    limit: 1
    example: {contract_id: CTR-900001}

  - name: get_contract_owner
