    example: {contract_id: CTR-000001, position_type: offer, terms: "5% rate reduction", notes: "Counter to their initial ask"}

  # Stage 2 tools (20 to implement)

  - name: get_contract_liability_clause
    desc: Liability and cap clauses of a contract. Use to assess exposure and insurance needs.
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, cc.clause_type, cc.title, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type = 'liability'
      ORDER BY cc.clause_id
    limit: 10
    example: {contract_id: CTR-000042}

  - name: get_contract_notice_periods
    desc: Renewal notice days, notice deadline and termination-for-convenience notice per contract. Give one contract_id, or filter by counterparty id and/or type; shortest renewal notice first.
    kind: sql
    args:
      contract_id: {}
      party_id: {type: str, desc: "Counterparty id to match, e.g. CAR-001 or SUP-0013 (optional)"}
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency, service], desc: "Contract type (optional)"}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status, c.end_date,
             c.renewal_notice_days, c.auto_renewal,
             CAST(CAST(c.end_date AS DATE) - INTERVAL (c.renewal_notice_days) DAY AS DATE) AS notice_deadline,
             max(CASE WHEN cc.clause_type = 'termination' THEN TRY_CAST(json_extract_string(cc.content, '$.for_convenience_notice_days') AS INT) END) AS termination_for_convenience_notice_days,
             max(CASE WHEN cc.clause_type = 'price_review' THEN TRY_CAST(json_extract_string(cc.content, '$.notice_days') AS INT) END) AS price_review_notice_days
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND ($contract_id IS NOT NULL OR c.status IN ('active', 'draft'))
        AND ($contract_type IS NULL OR c.contract_type = $contract_type)
        AND ($party_id IS NULL OR c.party_id = $party_id)
      GROUP BY ALL
      ORDER BY c.renewal_notice_days, c.end_date
    limit: 100
    example: {contract_id: CTR-000101}

  - name: get_contract_owner
    desc: Business owner of a contract with name, role and department. Use to identify who manages it.
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status, c.owner_id, e.name AS owner_name, e.role AS owner_role, e.department AS owner_department
      FROM contracts c
      LEFT JOIN master.employees e ON e.employee_id = c.owner_id
      WHERE c.contract_id = $contract_id
    limit: 1
    example: {contract_id: CTR-000101}

  - name: get_contract_payment_terms
    desc: Contract payment terms and remedies clauses (late-payment interest, right to suspend deliveries, termination for non-payment). Give a contract_id, or a counterparty id such as a customer or supplier.
    kind: sql
    args:
      contract_id: {}
      party_id: {type: str, desc: "Counterparty id, e.g. CUS-000016 or SUP-0013 (optional if contract_id given)"}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status, cc.clause_type, cc.title, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE ($contract_id IS NOT NULL OR $party_id IS NOT NULL)
        AND ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND ($party_id IS NULL OR c.party_id = $party_id)
        AND cc.clause_type IN ('payment_terms', 'penalty', 'termination')
      ORDER BY c.contract_id, cc.clause_type
    limit: 20
    example: {contract_id: CTR-000101}

  - name: get_contract_price_for_service
    desc: Contracted unit price and surcharges for a service (e.g. racking inspection, maintenance) from rate cards, by site. Use to compare with market prices.
    kind: sql
    args:
      service_type: {type: str, desc: "Service to match, e.g. racking inspection, racking maintenance (optional)"}
      contract_id: {}
      site_id: {}
    sql: |
      SELECT c.contract_id, c.party_name, c.site_id, rc.rate_card_id, rc.service_type, rc.rate_unit,
             rc.base_rate_gbp, rc.surcharges_json AS surcharges, rc.effective_from, rc.effective_to, c.end_date AS contract_end
      FROM contracts c
      JOIN rate_cards rc ON c.contract_id = rc.contract_id
      WHERE rc.status = 'active'
        AND ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND ($site_id IS NULL OR c.site_id = $site_id)
        AND ($service_type IS NULL OR rc.service_type ILIKE '%' || $service_type || '%' OR c.title ILIKE '%' || $service_type || '%')
        AND CAST(rc.effective_from AS DATE) <= CAST($as_of AS DATE)
        AND CAST(rc.effective_to AS DATE) >= CAST($as_of AS DATE)
      ORDER BY rc.service_type, c.site_id
    limit: 20
    example: {service_type: racking}

  - name: get_contract_remedies_clauses
    desc: "Remedies for a contract breach: late-delivery penalties, termination and cancellation rights, force majeure, service credits and chargebacks. Use to see actions available for a breach."
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, cc.clause_type, cc.title, cc.content
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type IN ('termination', 'penalty', 'force_majeure', 'service_level', 'chargeback')
      ORDER BY cc.clause_type
    limit: 20
    example: {contract_id: CTR-000101}

  - name: get_contract_renewal_terms
    desc: Renewal and auto-renewal terms. Use to plan contract continuity.
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, c.end_date, c.renewal_notice_days, c.auto_renewal,
             cc.clause_type, cc.title, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type IN ('renewal', 'termination')
      ORDER BY cc.clause_type
    limit: 10
    example: {contract_id: CTR-000106}

  - name: get_contract_terms
    desc: Key terms, service levels and clauses of a contract, found by contract id or by counterparty id (carrier, supplier). Use to see what a contract commits us to.
    kind: sql
    args:
      contract_id: {}
      party_id: {}
      clause_type: {type: str, desc: "Only this clause type, e.g. service_level, termination (optional)"}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status, c.start_date, c.end_date,
             c.renewal_notice_days, c.auto_renewal, cc.clause_type, cc.title,
             json_extract_string(cc.content, '$.summary') AS summary, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND ($party_id IS NULL OR c.party_id = $party_id)
        AND ($contract_id IS NOT NULL OR $party_id IS NOT NULL)
        AND ($clause_type IS NULL OR cc.clause_type = $clause_type)
        AND c.status IN ('active', 'draft', 'expired')
      ORDER BY c.contract_id, cc.clause_type
    limit: 40
    example: {party_id: CAR-003}

  - name: get_contract_terms_for_supplier
    desc: Price list terms (MOQ, tooling, incoterm, lead time) plus price review, renewal and other clauses of a supplier's contract. Use to understand supplier obligations.
    kind: sql
    args:
      supplier_id: {required: true}
      clause_type: {type: str, desc: "Only this clause type, e.g. price_review (optional)"}
    sql: |
      SELECT c.contract_id, c.party_id AS supplier_id, c.status, c.start_date, c.end_date,
             'price_list' AS clause_type, 'Price list and commercial terms' AS title, pl.terms_json AS content
      FROM contracts c
      JOIN price_lists pl ON pl.contract_id = c.contract_id AND pl.status = 'active'
      WHERE c.party_id = $supplier_id AND c.contract_type = 'supplier' AND c.status IN ('active', 'draft', 'expired')
        AND ($clause_type IS NULL OR $clause_type = 'price_list')
      UNION ALL
      SELECT c.contract_id, c.party_id, c.status, c.start_date, c.end_date,
             cc.clause_type, cc.title, cc.content
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.party_id = $supplier_id AND c.contract_type = 'supplier' AND c.status IN ('active', 'draft', 'expired')
        AND ($clause_type IS NULL OR cc.clause_type = $clause_type)
        AND cc.clause_type IN ('price_review', 'renewal', 'termination', 'payment_terms', 'force_majeure',
                               'service_level', 'volume_commitment', 'penalty', 'other')
      ORDER BY 1, 6
    limit: 30
    example: {supplier_id: SUP-0004}

  - name: get_existing_franchise_agreement_terms
    desc: Retrieves existing franchise agreement terms. Use for franchise renewals.
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status, c.start_date, c.end_date,
             cc.clause_type, cc.title, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND c.contract_type = 'franchise'
      ORDER BY cc.clause_type
    limit: 20
    example: {contract_id: CTR-900006}

  - name: get_penalty_terms_for_customer
    desc: Retrieves a customer's penalty terms (fill-rate, on-time and short-shipment fines, tolerances, per-unit rates and caps). Use to calculate exposure.
    kind: sql
    args:
      customer_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, c.status,
             cc.clause_id, cc.clause_type, cc.title, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.party_id = $customer_id
        AND c.contract_type = 'customer'
        AND cc.clause_type IN ('penalty', 'short_shipment')
      ORDER BY c.contract_id, cc.clause_type, cc.clause_id
    limit: 20
    example: {customer_id: CUS-002512}

  - name: get_standard_terms_template
    desc: Our standard terms by clause (test, standard value, risk level and apparel norm) used as the baseline for contract review. Filter by clause type.
    kind: select
    from: standard_terms
    filters:
      contract_type: {default: supplier, desc: "Contract type the standard applies to, e.g. supplier"}
      clause_type: {desc: "Only this clause, e.g. liability"}
    columns: [term_id, contract_type, clause_type, field, operator, standard_value, standard_position, risk_level, apparel_note]
    order: term_id
    limit: 30
    example: {clause_type: liability}

  - name: get_supplier_chargeback_clauses
    desc: Chargeback and late-delivery penalty clauses of a supplier contract, including air freight recharge. Use for cost recovery.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id AS supplier_id, c.status, cc.clause_type, cc.title,
             CAST(json_extract_string(cc.content, '$.air_freight_recharge_pct') AS DOUBLE) AS air_freight_recharge_pct,
             json_extract_string(cc.content, '$.recharge_trigger') AS recharge_trigger,
             CAST(json_extract_string(cc.content, '$.late_delivery_pct_per_week') AS DOUBLE) AS late_delivery_pct_per_week,
             CAST(json_extract_string(cc.content, '$.cap_pct') AS DOUBLE) AS cap_pct,
             json_extract_string(cc.content, '$.summary') AS summary
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.party_id = $supplier_id
        AND c.contract_type = 'supplier'
        AND cc.clause_type IN ('chargeback', 'penalty')
      ORDER BY c.contract_id, cc.clause_type
    limit: 20
    example: {supplier_id: SUP-0023}

  - name: get_supplier_claim_terms
    desc: Claim time limits (shortage, damage, quality) and short-shipment tolerance and remedy in a supplier's contract. Pass a receipt date to see if the claim window is still open.
    kind: sql
    args:
      supplier_id: {required: true}
      receipt_date: {type: date, desc: "Goods receipt date, to test whether a shortage claim is still inside the window (optional)"}
    sql: |
      SELECT c.contract_id, c.party_id AS supplier_id, c.status, cc.clause_type, cc.title,
             CAST(json_extract_string(cc.content, '$.shortage_claim_days') AS INT) AS shortage_claim_days,
             CAST(json_extract_string(cc.content, '$.damage_claim_days') AS INT) AS damage_claim_days,
             CAST(json_extract_string(cc.content, '$.quality_claim_days') AS INT) AS quality_claim_days,
             CAST(json_extract_string(cc.content, '$.tolerance_pct') AS DOUBLE) AS short_ship_tolerance_pct,
             json_extract_string(cc.content, '$.remedy') AS remedy,
             CASE WHEN $receipt_date IS NULL OR cc.clause_type <> 'claim_window' THEN NULL
                  ELSE date_diff('day', CAST($receipt_date AS DATE), CAST($as_of AS DATE)) END AS days_since_receipt,
             CASE WHEN $receipt_date IS NULL OR cc.clause_type <> 'claim_window' THEN NULL
                  ELSE date_diff('day', CAST($receipt_date AS DATE), CAST($as_of AS DATE))
                       <= CAST(json_extract_string(cc.content, '$.shortage_claim_days') AS INT) END AS shortage_claim_window_open,
             json_extract_string(cc.content, '$.summary') AS summary
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.party_id = $supplier_id
        AND c.contract_type = 'supplier'
        AND cc.clause_type IN ('claim_window', 'short_shipment')
      ORDER BY c.contract_id, cc.clause_type
    limit: 20
    example: {supplier_id: SUP-0013}

  - name: get_supplier_contract_terms_on_tariff_risk
    desc: Supplier contract terms on tariff and duty risk (who bears a duty change, sharing, price-review and force-majeure clauses) with the supplier's origin country and incoterm. Use to manage tariff exposure.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, c.status, s.country AS origin_country, s.incoterm,
             cc.clause_type, cc.title, cc.content
      FROM contracts c
      JOIN master.suppliers s ON s.supplier_id = c.party_id
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.party_id = $supplier_id
        AND c.contract_type = 'supplier'
        AND (cc.clause_type IN ('price_review', 'force_majeure', 'termination')
             OR (cc.clause_type = 'other' AND cc.content ILIKE '%tariff%'))
      ORDER BY c.contract_id, CASE WHEN cc.clause_type = 'other' THEN 0 ELSE 1 END, cc.clause_type
    limit: 20
    example: {supplier_id: SUP-0001}

  - name: get_supplier_funding_terms_for_promotion
    desc: A supplier's promotional funding terms (share of promotion cost it funds, caps, claim window, conditions) from its active contract. Use to calculate promotion ROI.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, c.status, c.end_date,
             cc.clause_type, cc.title, cc.content
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.party_id = $supplier_id
        AND c.contract_type = 'supplier'
        AND c.status IN ('active', 'draft')
        AND cc.clause_type = 'other'
        AND cc.content ILIKE '%promotional funding%'
      ORDER BY c.contract_id, cc.clause_id
    limit: 20
    example: {supplier_id: SUP-0074}

  - name: list_contracts_by_supplier_spend
    desc: Active contracts ranked by annual spend with price review cap, force majeure suspension, termination notice and renewal notice per contract. Use to prioritise renegotiations.
    kind: sql
    args:
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency, service], default: supplier, desc: "Contract type to rank"}
      limit_rows: {type: int, desc: "Return top N", default: 30}
    sql: |
      WITH agg AS (
        SELECT c.contract_id, c.party_id, c.party_name, c.status, c.annual_value_gbp, c.start_date, c.end_date,
               c.renewal_notice_days, c.auto_renewal,
               max(CASE WHEN cc.clause_type = 'price_review' THEN json_extract_string(cc.content, '$.frequency') END) AS price_review_frequency,
               max(CASE WHEN cc.clause_type = 'price_review' THEN TRY_CAST(json_extract_string(cc.content, '$.max_increase_pct') AS DOUBLE) END) AS price_review_max_increase_pct,
               max(CASE WHEN cc.clause_type = 'force_majeure' THEN TRY_CAST(json_extract_string(cc.content, '$.max_suspension_days') AS INT) END) AS force_majeure_suspension_days,
               max(CASE WHEN cc.clause_type = 'termination' THEN TRY_CAST(json_extract_string(cc.content, '$.for_convenience_notice_days') AS INT) END) AS termination_notice_days
        FROM contracts c
        LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
        WHERE c.contract_type = $contract_type AND c.status = 'active'
        GROUP BY ALL
      )
      SELECT row_number() OVER (ORDER BY annual_value_gbp DESC NULLS LAST, contract_id) AS spend_rank, *
      FROM agg
      ORDER BY spend_rank
      LIMIT $limit_rows
    limit: 30
    example: {contract_type: supplier, limit_rows: 30}

  - name: list_contracts_expiring_within_period
    desc: Contracts whose end date falls in a period, with notice deadline, auto-renewal trap flag, owner, annual value and recent orders. Use status expired to find lapsed contracts.
    kind: sql
    args:
      date_from: {type: date, default: "-0d", desc: "Period start"}
      date_to: {type: date, default: "+90d", desc: "Period end"}
      status: {type: enum, values: [active, draft, expired, terminated, archived], desc: "Contract status; default active and draft"}
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency, service], desc: "Contract type (optional)"}
    sql: |
      WITH act AS (
        SELECT supplier_id, max(CAST(order_date AS DATE)) AS last_order_date,
               count(*) FILTER (WHERE CAST(order_date AS DATE) >= CAST($as_of AS DATE) - INTERVAL 90 DAY) AS orders_last_90d
        FROM master.purchase_orders WHERE status <> 'cancelled' GROUP BY supplier_id
      )
      SELECT c.contract_id, c.contract_type, c.party_id, c.party_name, c.status, c.end_date,
             c.renewal_notice_days, CAST(CAST(c.end_date AS DATE) - INTERVAL (c.renewal_notice_days) DAY AS DATE) AS notice_deadline,
             c.auto_renewal,
             CASE WHEN c.status NOT IN ('active', 'draft') THEN 'not live'
                  WHEN c.auto_renewal AND CAST(c.end_date AS DATE) - INTERVAL (c.renewal_notice_days) DAY < CAST($as_of AS DATE) THEN 'AUTO-RENEWAL TRAP: notice date already passed'
                  WHEN c.auto_renewal AND CAST(c.end_date AS DATE) - INTERVAL (c.renewal_notice_days) DAY <= CAST($as_of AS DATE) + INTERVAL 14 DAY THEN 'AUTO-RENEWAL TRAP: notice date within 14 days'
                  WHEN c.auto_renewal THEN 'auto-renews, notice date later'
                  ELSE 'no auto-renewal' END AS renewal_flag,
             c.owner_id, c.annual_value_gbp,
             CASE WHEN c.contract_type <> 'supplier' THEN 'n/a' WHEN COALESCE(a.orders_last_90d, 0) > 0 THEN 'in use' ELSE 'not in use' END AS usage,
             a.last_order_date, COALESCE(a.orders_last_90d, 0) AS orders_last_90d
      FROM contracts c
      LEFT JOIN act a ON a.supplier_id = c.party_id AND c.contract_type = 'supplier'
      WHERE CAST(c.end_date AS DATE) BETWEEN CAST($date_from AS DATE) AND CAST($date_to AS DATE)
        AND (($status IS NULL AND c.status IN ('active', 'draft')) OR c.status = $status)
        AND ($contract_type IS NULL OR c.contract_type = $contract_type)
      ORDER BY c.end_date ASC
    limit: 60
    example: {date_to: "+12m"}

  - name: list_contracts_with_non_standard_terms
    desc: Supplier contracts with deviations from our standard terms, with deviation counts and the worst clauses. Filter by end date to see which need legal input.
    kind: sql
    args:
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency, service], default: supplier, desc: "Contract type (standard terms exist for supplier contracts)"}
      ends_from: {type: date, desc: "Only contracts ending on or after this date (optional)"}
      ends_to: {type: date, desc: "Only contracts ending on or before this date (optional)"}
    sql: |
      WITH c AS (
        SELECT * FROM contracts WHERE status IN ('active', 'draft') AND contract_type = $contract_type
          AND ($ends_from IS NULL OR CAST(end_date AS DATE) >= CAST($ends_from AS DATE))
          AND ($ends_to IS NULL OR CAST(end_date AS DATE) <= CAST($ends_to AS DATE))
      ), dev AS (
        SELECT c.contract_id, c.party_id, c.party_name, c.status, c.end_date, c.renewal_notice_days, c.owner_id,
               st.clause_type, st.field, st.risk_score, st.risk_level,
               CASE WHEN cc.clause_type IS NULL THEN st.required
                    WHEN json_extract_string(cc.content, '$.' || st.field) IS NULL THEN true
                    WHEN st.operator = '>=' THEN TRY_CAST(json_extract_string(cc.content, '$.' || st.field) AS DOUBLE) < TRY_CAST(st.standard_value AS DOUBLE)
                    WHEN st.operator = '<=' THEN TRY_CAST(json_extract_string(cc.content, '$.' || st.field) AS DOUBLE) > TRY_CAST(st.standard_value AS DOUBLE)
                    ELSE NOT list_contains(string_split(lower(st.standard_value), '|'), lower(json_extract_string(cc.content, '$.' || st.field))) END AS deviates
        FROM c JOIN standard_terms st ON st.contract_type = c.contract_type
        LEFT JOIN contract_clauses cc ON cc.contract_id = c.contract_id AND cc.clause_type = st.clause_type
      )
      SELECT d.contract_id, d.party_id, d.party_name, d.status, d.end_date, d.renewal_notice_days, d.owner_id,
             count(*) AS deviations,
             count(*) FILTER (WHERE d.risk_level = 'high') AS high_risk_deviations,
             sum(d.risk_score) AS total_risk_score,
             string_agg(d.clause_type || '.' || d.field, '; ' ORDER BY d.risk_score DESC) AS deviating_terms
      FROM dev d
      WHERE d.deviates
      GROUP BY ALL
      ORDER BY total_risk_score DESC, d.end_date
    limit: 50
    example: {ends_to: "+6m"}

  - name: search_contract_clauses
    desc: Search clauses across contracts by type, keyword, counterparty or contract type. Returns the clause terms; use to find specific terms such as IP protection.
    kind: sql
    args:
      clause_type: {type: enum, values: [liability, payment_terms, renewal, price_review, force_majeure, termination, claim_window, short_shipment, chargeback, rate_review, service_level, penalty, ip_protection, volume_commitment, other], desc: "Clause type (optional)"}
      keyword: {type: str, desc: "Keyword search in clause title or content (optional)"}
      party_id: {desc: "Counterparty id, e.g. a supplier_id (optional)"}
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency, service], desc: "Contract type (optional)"}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type,
             cc.clause_id, cc.clause_type, cc.title, cc.content
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.status IN ('active', 'draft')
        AND ($clause_type IS NULL OR cc.clause_type = $clause_type)
        AND ($party_id IS NULL OR c.party_id = $party_id)
        AND ($contract_type IS NULL OR c.contract_type = $contract_type)
        AND ($keyword IS NULL OR cc.title ILIKE '%' || $keyword || '%' OR cc.content ILIKE '%' || $keyword || '%')
      ORDER BY c.contract_id, cc.clause_type
    limit: 100
    example: {clause_type: ip_protection}

