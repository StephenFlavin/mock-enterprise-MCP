id: contracts
name: Contract Management System
instructions: >
  Supplier, carrier and customer contracts with terms, clauses, rates and renewals.
  Contract ids look like CTR-000123. Use it for contract terms, pricing, liability,
  claims windows, renewal alerts and breach tracking.

tables:
  contracts:
    key: contract_id
    cols:
      contract_id: {type: str, desc: "Contract id, e.g. CTR-000123"}
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency, service], desc: Contract type}
      party_type: {type: str, desc: "Type of counterparty: supplier_id, carrier_id, customer_id, partner_id, or service_provider"}
      party_id: {type: str, desc: "Counterparty id: supplier_id, carrier_id, customer_id or partner_id (blank for a service provider)"}
      party_name: {type: str, desc: "Counterparty name"}
      title: {type: str, desc: "Contract title"}
      category: {type: str, desc: "Product category or service covered"}
      site_id: {type: str, desc: "Site covered, for site-specific service contracts"}
      owner_id: {type: str, desc: "Business owner (employee_id)"}
      start_date: {type: date, desc: Contract start date}
      end_date: {type: date, desc: Contract end date}
      renewal_notice_days: {type: int, desc: "Days before end_date to give notice"}
      auto_renewal: {type: bool, desc: "Auto-renews on expiry if true"}
      status: {type: enum, values: [draft, active, expired, terminated, archived], desc: Contract status}
      annual_value_gbp: {type: float, desc: "Approximate annual contract value in GBP"}
      created_at: {type: timestamp, desc: When created}
      updated_at: {type: timestamp, desc: Last updated}

  contract_clauses:
    key: [contract_id, clause_id]
    cols:
      contract_id: {type: str, desc: "Contract"}
      clause_id: {type: str, desc: "Clause identifier within contract"}
      clause_type: {type: enum, values: [liability, payment_terms, renewal, price_review, force_majeure, termination, claim_window, short_shipment, chargeback, rate_review, service_level, penalty, ip_protection, volume_commitment, other], desc: Clause type}
      title: {type: str, desc: "Clause title"}
      content: {type: text, desc: "Clause terms as JSON, with a plain-English summary field"}
      created_at: {type: timestamp, desc: When added}

  contract_breaches:
    key: breach_id
    cols:
      breach_id: {type: str, desc: "Breach record, e.g. BRH-000123"}
      contract_id: {type: str, desc: "Affected contract"}
      breach_date: {type: date, desc: "Date of breach"}
      description: {type: str, desc: "What happened"}
      impact: {type: str, desc: "Impact description"}
      status: {type: enum, values: [logged, under_review, remediated, disputed, escalated], desc: Breach status}
      created_at: {type: timestamp, desc: When logged}
      updated_at: {type: timestamp, desc: Last updated}

  contract_disputes:
    key: dispute_id
    cols:
      dispute_id: {type: str, desc: "Dispute id, e.g. DSP-000123"}
      contract_id: {type: str, desc: "Related contract"}
      account_id: {type: str, desc: "Account being disputed (supplier/customer id)"}
      dispute_type: {type: enum, values: [penalty, chargeback, claim, overcharge, other], desc: Dispute type}
      amount_gbp: {type: float, desc: "Disputed amount in GBP"}
      description: {type: str, desc: "Dispute details"}
      status: {type: enum, values: [raised, under_review, settled, rejected], desc: Dispute status}
      created_at: {type: timestamp, desc: When raised}
      updated_at: {type: timestamp, desc: Last updated}

  negotiation_cases:
    key: case_id
    cols:
      case_id: {type: str, desc: "Negotiation case, e.g. NGT-000123"}
      contract_id: {type: str, desc: "Contract being negotiated"}
      case_type: {type: enum, values: [renewal, rate_review, new_deal, amendment, exit], desc: Case type}
      description: {type: str, desc: "Negotiation objective"}
      status: {type: enum, values: [open, in_progress, closed_agreed, closed_rejected, closed_no_deal], desc: Case status}
      opened_at: {type: timestamp, desc: When case opened}
      closed_at: {type: timestamp, desc: When case closed}

  rate_cards:
    key: rate_card_id
    cols:
      rate_card_id: {type: str, desc: "Rate card, e.g. RTC-000123"}
      card_type: {type: enum, values: [carrier, agency, freight_forwarder, service], desc: Rate card type}
      party_id: {type: str, desc: "Carrier/agency id"}
      contract_id: {type: str, desc: "Related contract"}
      service_type: {type: str, desc: "Service priced, e.g. pallet, 40ft container, racking inspection"}
      lane: {type: str, desc: "Lane, region or site covered"}
      rate_unit: {type: str, desc: "What the base rate is per, e.g. per pallet, per inspector-day"}
      effective_from: {type: date, desc: "Effective from date"}
      effective_to: {type: date, desc: "Effective to date"}
      base_rate_gbp: {type: float, desc: "Base rate in GBP per rate_unit"}
      currency: {type: str, desc: "Currency if not GBP"}
      surcharges_json: {type: text, desc: "Surcharges and accessorial charges as JSON"}
      notice_period_days: {type: int, desc: "Notice period for changes"}
      status: {type: enum, values: [active, superseded, archived], desc: Rate card status}
      created_at: {type: timestamp, desc: When created}

  price_lists:
    key: price_list_id
    cols:
      price_list_id: {type: str, desc: "Price list, e.g. PRL-000123"}
      list_type: {type: enum, values: [customer_prices, agency_rates, supplier_costs], desc: Price list type}
      contract_id: {type: str, desc: "Related contract"}
      party_id: {type: str, desc: "Customer/supplier/agency id"}
      effective_from: {type: date, desc: "Effective from date"}
      effective_to: {type: date, desc: "Effective to date"}
      list_currency: {type: str, desc: "Currency, e.g. GBP"}
      terms_json: {type: text, desc: "Payment and delivery terms as JSON"}
      status: {type: enum, values: [active, superseded, archived], desc: Price list status}
      created_at: {type: timestamp, desc: When created}

  renewal_alerts:
    key: alert_id
    cols:
      alert_id: {type: str, desc: "Alert id, e.g. ALR-000123"}
      contract_id: {type: str, desc: "Contract to renew"}
      alert_date: {type: date, desc: "Date to send alert"}
      status: {type: enum, values: [scheduled, triggered, dismissed, completed], desc: Alert status}
      created_at: {type: timestamp, desc: When created}
      triggered_at: {type: timestamp, desc: When alert was triggered}

  contract_negotiation_positions:
    key: position_id
    cols:
      position_id: {type: str, desc: "Position record, e.g. POS-000123"}
      contract_id: {type: str, desc: "Contract"}
      case_id: {type: str, desc: "Related negotiation case"}
      position_type: {type: enum, values: [offer, counter, fallback, agreed], desc: Position type}
      terms: {type: text, desc: "Terms being negotiated"}
      notes: {type: str, desc: "Notes on position"}
      recorded_at: {type: timestamp, desc: "When recorded"}

  contract_drafts:
    key: draft_id
    cols:
      draft_id: {type: str, desc: "Draft contract, e.g. DRF-000123"}
      draft_type: {type: enum, values: [new_supplier, new_carrier, new_customer, renewal, amendment, framework], desc: Draft type}
      template_id: {type: str, desc: "Template used"}
      selected_clauses: {type: text, desc: "Clause ids selected as JSON array"}
      counterparty_id: {type: str, desc: "Intended counterparty"}
      description: {type: str, desc: "What the draft is for"}
      created_at: {type: timestamp, desc: "When created"}
      status: {type: enum, values: [draft, finalized, rejected], desc: Draft status}

  standard_terms:
    key: term_id
    cols:
      term_id: {type: str, desc: "Standard term, e.g. STD-03"}
      contract_type: {type: str, desc: "Contract type the standard applies to, e.g. supplier"}
      clause_type: {type: str, desc: "Clause the standard term belongs to"}
      field: {type: str, desc: "Field inside the clause that is compared, e.g. limit_gbp"}
      operator: {type: str, desc: "Standard test on the field: >= minimum, <= maximum, = one of the | separated values"}
      standard_value: {type: str, desc: "Standard value of the field"}
      required: {type: bool, desc: "True if a contract must contain the clause; false if the term applies only when the clause is present"}
      standard_position: {type: text, desc: "Plain-English standard position"}
      risk_score: {type: int, desc: "Risk weight of a deviation, 1 (minor) to 10 (severe)"}
      risk_level: {type: enum, values: [high, medium, low], desc: "Risk level of a deviation"}
      apparel_note: {type: text, desc: "What is normal in the apparel industry for this term"}

tools:
  # Stage 1 tools (20-21 to implement)

  - name: get_carrier_contract_rates
    desc: Contracted carrier rates and accessorial charges by service type and lane. Use to compare invoices to contract.
    kind: sql
    args:
      carrier_id: {required: true}
      contract_id: {}
      service_type: {type: str, desc: "Service type to match, e.g. pallet, container, parcel (optional)"}
      lane: {type: str, desc: "Lane or region to match, e.g. UK North (optional)"}
    sql: |
      SELECT rc.rate_card_id, rc.party_id AS carrier_id, rc.contract_id, rc.service_type, rc.lane,
             rc.rate_unit, rc.base_rate_gbp, rc.surcharges_json AS surcharges_and_accessorials,
             rc.notice_period_days, rc.effective_from, rc.effective_to
      FROM rate_cards rc
      WHERE rc.party_id = $carrier_id
        AND rc.card_type IN ('carrier', 'freight_forwarder')
        AND ($contract_id IS NULL OR rc.contract_id = $contract_id)
        AND ($service_type IS NULL OR rc.service_type ILIKE '%' || $service_type || '%')
        AND ($lane IS NULL OR rc.lane ILIKE '%' || $lane || '%')
        AND rc.status = 'active'
        AND CAST(rc.effective_from AS DATE) <= CAST($as_of AS DATE)
        AND CAST(rc.effective_to AS DATE) >= CAST($as_of AS DATE)
      ORDER BY rc.service_type, rc.effective_from DESC
    limit: 20
    example: {carrier_id: CAR-002}

  - name: get_contract_claim_time_limits
    desc: Claim time limits in days (damage, shortage, overcharge) and short-shipment terms per contract. Use to check claims are still valid.
    kind: sql
    args:
      contract_id: {}
      party_id: {}
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency, service], desc: "Filter by contract type (optional)"}
    sql: |
      SELECT c.contract_id, c.contract_type, c.party_id, c.status, cc.clause_type, cc.title,
             CAST(json_extract_string(cc.content, '$.damage_claim_days') AS INT) AS damage_claim_days,
             CAST(json_extract_string(cc.content, '$.shortage_claim_days') AS INT) AS shortage_claim_days,
             CAST(json_extract_string(cc.content, '$.overcharge_claim_days') AS INT) AS overcharge_claim_days,
             CAST(json_extract_string(cc.content, '$.tolerance_pct') AS DOUBLE) AS short_ship_tolerance_pct,
             json_extract_string(cc.content, '$.summary') AS summary
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND ($party_id IS NULL OR c.party_id = $party_id)
        AND ($contract_type IS NULL OR c.contract_type = $contract_type)
        AND c.status IN ('active', 'draft', 'expired')
        AND cc.clause_type IN ('claim_window', 'short_shipment')
      ORDER BY c.contract_type, c.contract_id, cc.clause_type
    limit: 30
    example: {party_id: CAR-002}

  - name: get_contract_coverage_by_category
    desc: Share of purchase spend with suppliers under contract versus off contract, per category or supplier. Use to find contract gaps.
    kind: sql
    args:
      category: {type: str, desc: "Product category, e.g. Knitwear (all categories if blank)"}
      group_by: {type: enum, values: [category, supplier], default: category, desc: "One row per category, or per supplier within it"}
      date_from: {type: date, default: "-365d", desc: Start of the spend period}
      date_to: {type: date, default: "-0d", desc: End of the spend period}
    sql: |
      WITH lines AS (
        SELECT p.category, pur.supplier_id, CAST(pur.order_date AS DATE) AS order_date,
               l.qty_ordered * l.unit_cost AS value_gbp
        FROM master.po_lines l
        JOIN master.purchase_orders pur ON pur.po_id = l.po_id
        JOIN master.products p ON p.sku = l.sku
        WHERE CAST(pur.order_date AS DATE) BETWEEN CAST($date_from AS DATE) AND CAST($date_to AS DATE)
          AND pur.status <> 'cancelled'
          AND ($category IS NULL OR lower(p.category) = lower($category))
      ), tagged AS (
        SELECT l.*,
               EXISTS (SELECT 1 FROM contracts c
                       WHERE c.contract_type = 'supplier' AND c.party_id = l.supplier_id
                         AND c.status IN ('active', 'expired', 'terminated')
                         AND l.order_date BETWEEN CAST(c.start_date AS DATE) AND CAST(c.end_date AS DATE)) AS on_contract,
               COALESCE((SELECT c2.status FROM contracts c2 WHERE c2.contract_type = 'supplier' AND c2.party_id = l.supplier_id
                         ORDER BY c2.end_date DESC LIMIT 1), 'none') AS latest_contract_status
        FROM lines l
      )
      SELECT t.category,
             CASE WHEN $group_by = 'supplier' THEN t.supplier_id ELSE 'all suppliers' END AS supplier,
             CASE WHEN $group_by = 'supplier' THEN t.latest_contract_status ELSE NULL END AS latest_contract_status,
             round(sum(t.value_gbp)) AS spend_gbp,
             round(COALESCE(sum(t.value_gbp) FILTER (WHERE t.on_contract), 0)) AS on_contract_gbp,
             round(COALESCE(sum(t.value_gbp) FILTER (WHERE NOT t.on_contract), 0)) AS off_contract_gbp,
             round(100.0 * COALESCE(sum(t.value_gbp) FILTER (WHERE t.on_contract), 0) / sum(t.value_gbp), 1) AS on_contract_pct
      FROM tagged t
      GROUP BY ALL
      ORDER BY t.category, off_contract_gbp DESC, spend_gbp DESC
    limit: 40
    example: {category: Knitwear}

  - name: get_carrier_liability_terms
    desc: Carrier liability limit, deductible, excluded packaging and damage claim time limit. Use to assess claim value and risk.
    kind: sql
    args:
      carrier_id: {required: true}
      contract_id: {}
    sql: |
      SELECT c.contract_id, c.party_id AS carrier_id, c.status, cc.clause_type, cc.title,
             CAST(json_extract_string(cc.content, '$.limit_gbp') AS DOUBLE) AS liability_limit_gbp,
             json_extract_string(cc.content, '$.limit_basis') AS limit_basis,
             CAST(json_extract_string(cc.content, '$.deductible_gbp') AS DOUBLE) AS deductible_gbp,
             json_extract_string(cc.content, '$.excluded_package_types') AS excluded_package_types,
             CAST(json_extract_string(cc.content, '$.damage_claim_days') AS INT) AS damage_claim_days,
             json_extract_string(cc.content, '$.summary') AS summary
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.party_id = $carrier_id
        AND ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND c.status = 'active'
        AND cc.clause_type IN ('liability', 'claim_window')
      ORDER BY c.contract_id, cc.clause_type
    limit: 20
    example: {carrier_id: CAR-004}

  - name: get_carrier_contract_rate_review_clauses
    desc: Rate review and surcharge clauses of carrier contracts, with maximum increase and notice. Use to forecast rate rises and who may push hardest.
    kind: sql
    args:
      carrier_id: {}
      contract_id: {}
    sql: |
      SELECT c.contract_id, c.party_id AS carrier_id, car.name AS carrier_name, car.mode,
             c.end_date, c.auto_renewal, cc.clause_type,
             CAST(json_extract_string(cc.content, '$.max_increase_pct') AS DOUBLE) AS max_increase_pct,
             json_extract_string(cc.content, '$.effective_month') AS increase_effective_month,
             CAST(json_extract_string(cc.content, '$.notice_days') AS INT) AS notice_days,
             json_extract_string(cc.content, '$.fuel_surcharge') AS fuel_surcharge_basis,
             json_extract_string(cc.content, '$.summary') AS summary
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      LEFT JOIN master.carriers car ON car.carrier_id = c.party_id
      WHERE c.contract_type = 'carrier'
        AND ($carrier_id IS NULL OR c.party_id = $carrier_id)
        AND ($contract_id IS NULL OR c.contract_id = $contract_id)
        AND c.status = 'active'
        AND cc.clause_type IN ('price_review', 'rate_review')
      ORDER BY max_increase_pct DESC NULLS FIRST, c.party_id
    limit: 30
    example: {carrier_id: CAR-011}

  - name: get_agency_rate_card
    desc: Temporary-labour agency charge rates per hour by site and role, with mark-up, night and overtime uplifts, assignment minimums and notice terms. Use to cost agency labour against recruitment.
    kind: sql
    args:
      site_id: {type: str, desc: "Site the labour is for, e.g. DC1 (optional)"}
      role: {type: str, desc: "Role to match, e.g. Picker/Packer or Warehouse Operative (optional)"}
      agency_id: {type: str, desc: "Agency party id, if the agency is a master party (optional)"}
      contract_id: {}
    sql: |
      SELECT rc.rate_card_id, rc.contract_id, c.party_name AS agency_name, rc.lane AS site_id, rc.service_type AS role,
             rc.rate_unit, rc.base_rate_gbp AS charge_rate_gbp, rc.surcharges_json AS markup_uplifts_and_notice_terms,
             rc.notice_period_days AS cancellation_notice_days, rc.effective_from, rc.effective_to
      FROM rate_cards rc
      JOIN contracts c ON c.contract_id = rc.contract_id
      WHERE rc.card_type = 'agency'
        AND rc.status = 'active'
        AND ($site_id IS NULL OR rc.lane = $site_id)
        AND ($role IS NULL OR rc.service_type ILIKE '%' || $role || '%')
        AND ($agency_id IS NULL OR rc.party_id = $agency_id)
        AND ($contract_id IS NULL OR rc.contract_id = $contract_id)
        AND CAST(rc.effective_from AS DATE) <= CAST($as_of AS DATE)
        AND CAST(rc.effective_to AS DATE) >= CAST($as_of AS DATE)
      ORDER BY rc.lane, rc.service_type
    limit: 20
    example: {site_id: DC1}

  - name: get_agreed_price_list
    desc: Agreed customer price list and terms from contracts. Use for quoting and checking compliance.
    kind: sql
    args:
      customer_id: {required: true}
      contract_id: {}
    sql: |
      SELECT pl.price_list_id, pl.contract_id, pl.list_type AS customer_prices, pl.effective_from, pl.effective_to,
             pl.list_currency, pl.terms_json, c.status AS contract_status
      FROM price_lists pl
      LEFT JOIN contracts c ON pl.contract_id = c.contract_id
      WHERE pl.party_id = $customer_id
        AND pl.list_type = 'customer_prices'
        AND pl.status = 'active'
        AND pl.effective_from <= $as_of
      ORDER BY pl.effective_from DESC
    limit: 20
    example: {customer_id: CUS-002512}

  - name: calculate_liability_exposure
    desc: "Estimate loss exposure under a contract's limitation clause for an assumed volume and unit loss: what the cap covers and what we bear. Use to assess insurance needs."
    kind: sql
    args:
      contract_id: {required: true}
      volume_units: {required: true, type: int, desc: "Units affected by the claim"}
      unit_value_gbp: {required: true, type: float, desc: "Loss per unit in GBP"}
    sql: |
      SELECT c.contract_id, c.party_id,
             json_extract_string(cc.content, '$.limit_basis') AS limit_basis,
             TRY_CAST(json_extract_string(cc.content, '$.limit_gbp') AS DOUBLE) AS liability_limit_gbp,
             json_extract_string(cc.content, '$.product_safety_uncapped') AS product_safety_uncapped,
             $volume_units AS assumed_volume,
             $unit_value_gbp AS unit_value,
             round($volume_units * $unit_value_gbp, 2) AS total_exposure_gbp,
             round(LEAST($volume_units * $unit_value_gbp, COALESCE(TRY_CAST(json_extract_string(cc.content, '$.limit_gbp') AS DOUBLE), $volume_units * $unit_value_gbp)), 2) AS recoverable_under_cap_gbp,
             round(GREATEST($volume_units * $unit_value_gbp - COALESCE(TRY_CAST(json_extract_string(cc.content, '$.limit_gbp') AS DOUBLE), $volume_units * $unit_value_gbp), 0), 2) AS borne_by_us_gbp,
             'recoverable = min(total exposure, liability cap); borne by us = exposure - recoverable' AS formula
      FROM contracts c
      JOIN contract_clauses cc ON c.contract_id = cc.contract_id AND cc.clause_type = 'liability'
      WHERE c.contract_id = $contract_id
      LIMIT 1
    example: {contract_id: CTR-000042, volume_units: 100, unit_value_gbp: 1000}

  - name: calculate_recoverable_claim_value
    desc: Net claim value recoverable under a carrier liability clause after limit, deductible, packaging exclusions and claim time limit. Use before filing a damage claim.
    kind: sql
    args:
      contract_id: {}
      carrier_id: {desc: "Carrier id, used to find its active contract when contract_id is not given"}
      damage_value_gbp: {required: true, type: float, desc: "Claimed damage value in GBP"}
      package_type: {type: str, desc: "Packaging of the damaged goods, e.g. carton, polybag, hanging (optional)"}
      claim_age_days: {type: int, desc: "Days since delivery when the claim is lodged (optional)"}
    sql: |
      WITH target AS (
        SELECT c.contract_id, c.party_id FROM contracts c
        WHERE c.contract_id = COALESCE($contract_id, (SELECT c2.contract_id FROM contracts c2
                                                      WHERE c2.party_id = $carrier_id AND c2.status = 'active' LIMIT 1))
      ), liab AS (
        SELECT cc.contract_id,
               CAST(json_extract_string(cc.content, '$.limit_gbp') AS DOUBLE) AS limit_gbp,
               COALESCE(CAST(json_extract_string(cc.content, '$.deductible_gbp') AS DOUBLE), 0) AS deductible_gbp,
               COALESCE(json_extract_string(cc.content, '$.excluded_package_types'), '[]') AS excluded
        FROM contract_clauses cc JOIN target t USING (contract_id) WHERE cc.clause_type = 'liability'
      ), win AS (
        SELECT cc.contract_id, CAST(json_extract_string(cc.content, '$.damage_claim_days') AS INT) AS damage_claim_days
        FROM contract_clauses cc JOIN target t USING (contract_id) WHERE cc.clause_type = 'claim_window'
      )
      SELECT t.contract_id, t.party_id AS carrier_id,
             $damage_value_gbp AS claimed_value_gbp,
             l.limit_gbp AS liability_limit_gbp,
             l.deductible_gbp,
             w.damage_claim_days,
             CASE WHEN $package_type IS NOT NULL AND l.excluded ILIKE '%"' || $package_type || '"%' THEN 'not recoverable: packaging type excluded'
                  WHEN $claim_age_days IS NOT NULL AND w.damage_claim_days IS NOT NULL AND $claim_age_days > w.damage_claim_days THEN 'not recoverable: outside claim time limit'
                  ELSE 'recoverable' END AS claim_status,
             CASE WHEN ($package_type IS NOT NULL AND l.excluded ILIKE '%"' || $package_type || '"%')
                    OR ($claim_age_days IS NOT NULL AND w.damage_claim_days IS NOT NULL AND $claim_age_days > w.damage_claim_days) THEN 0
                  ELSE GREATEST(LEAST($damage_value_gbp, COALESCE(l.limit_gbp, $damage_value_gbp)) - l.deductible_gbp, 0) END AS net_recoverable_gbp,
             'recoverable = min(claimed, liability limit) - deductible; zero if packaging excluded or claim late' AS formula
      FROM target t
      JOIN liab l USING (contract_id)
      LEFT JOIN win w USING (contract_id)
    example: {carrier_id: CAR-004, damage_value_gbp: 425}

  - name: calculate_short_shipment_penalties
    desc: Short shipment penalty for one order line under the contract's tolerance and per-unit penalty; units within tolerance are free. Use to compute claims value.
    kind: sql
    args:
      contract_id: {required: true}
      expected_units: {type: int, required: true, desc: "Units ordered or expected"}
      received_units: {type: int, required: true, desc: "Units actually delivered or received"}
    sql: |
      WITH t AS (
        SELECT c.contract_id, c.party_id,
               COALESCE(TRY_CAST(json_extract_string(cc.content, '$.tolerance_pct') AS DOUBLE), 0) AS tolerance_pct,
               COALESCE(TRY_CAST(json_extract_string(cc.content, '$.penalty_gbp_per_unit') AS DOUBLE), 0) AS penalty_per_unit_gbp
        FROM contracts c
        JOIN contract_clauses cc ON c.contract_id = cc.contract_id
        WHERE c.contract_id = $contract_id AND cc.clause_type = 'short_shipment'
        LIMIT 1
      )
      SELECT t.contract_id, t.party_id,
             $expected_units AS expected_units,
             $received_units AS received_units,
             greatest($expected_units - $received_units, 0) AS short_units,
             ROUND(greatest($expected_units - $received_units, 0) * 100.0 / nullif($expected_units, 0), 2) AS short_pct,
             t.tolerance_pct,
             ROUND($expected_units * t.tolerance_pct / 100.0, 2) AS tolerance_units,
             t.penalty_per_unit_gbp,
             ROUND(greatest(greatest($expected_units - $received_units, 0) - $expected_units * t.tolerance_pct / 100.0, 0), 2) AS chargeable_short_units,
             ROUND(greatest(greatest($expected_units - $received_units, 0) - $expected_units * t.tolerance_pct / 100.0, 0) * t.penalty_per_unit_gbp, 2) AS total_penalty_gbp,
             'penalty = (short_units - expected_units * tolerance_pct / 100) * penalty_per_unit' AS formula
      FROM t
    example: {contract_id: CTR-000001, expected_units: 1000, received_units: 950}
  - name: calculate_fine_exposure_by_account
    desc: Calculates fine exposure by account under penalty clauses. Use to assess risk.
    kind: sql
    args:
      contract_id: {required: true}
      account_id: {required: true}
    sql: |
      SELECT c.contract_id, c.party_id, $account_id AS account_id,
             count(*) AS penalty_clauses,
             round(sum(COALESCE(CAST(json_extract_string(cc.content, 'max_penalty_gbp') AS FLOAT), 0)), 2) AS fine_exposure_gbp,
             'exposure = sum(max penalties)' AS formula
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.contract_id = $contract_id
        AND cc.clause_type = 'penalty'
      GROUP BY c.contract_id, c.party_id
    example: {contract_id: CTR-900004, account_id: CUS-002512}

  - name: calculate_commitment_risk_scenarios
    desc: Downside cost of a volume commitment under demand scenarios, using the contract's commitment and take-or-pay terms. Give contract_id or supplier_id.
    kind: py
    fn: calc_commitment_risk
    args:
      contract_id: {}
      supplier_id: {}
      base_volume_units: {required: true, type: int, desc: "Forecast annual volume in units"}
      unit_cost_gbp: {required: true, type: float, desc: "Unit cost in GBP"}
      commitment_pct: {type: float, desc: "Committed share of forecast, in percent (defaults to the contract's commitment)"}
      pessimistic_volume_pct: {type: int, desc: "Pessimistic demand as % of forecast", default: 70}
    example: {supplier_id: SUP-0044, base_volume_units: 400000, unit_cost_gbp: 9.5}

  - name: calculate_contract_risk_ranking
    desc: Rank active contracts by a clause-based risk score from price review, force majeure and termination terms. Use top_by_spend to rank only the largest contracts.
    kind: sql
    args:
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency, service], default: supplier, desc: "Contract type to rank"}
      top_by_spend: {type: int, desc: "Only score the N contracts with the highest annual value, e.g. 30 (optional)"}
      limit_rows: {type: int, desc: "Return top N", default: 20}
    sql: |
      WITH base AS (
        SELECT c.contract_id, c.party_id, c.party_name, c.contract_type, c.annual_value_gbp, c.renewal_notice_days, c.auto_renewal,
               row_number() OVER (ORDER BY c.annual_value_gbp DESC NULLS LAST, c.contract_id) AS spend_rank
        FROM contracts c WHERE c.status = 'active' AND c.contract_type = $contract_type
      ), clauses AS (
        SELECT b.*,
               bool_or(cc.clause_type = 'price_review') AS has_price_review,
               max(CASE WHEN cc.clause_type = 'price_review' THEN TRY_CAST(json_extract_string(cc.content, '$.max_increase_pct') AS DOUBLE) END) AS price_review_max_increase_pct,
               max(CASE WHEN cc.clause_type = 'force_majeure' THEN TRY_CAST(json_extract_string(cc.content, '$.max_suspension_days') AS DOUBLE) END) AS force_majeure_suspension_days,
               max(CASE WHEN cc.clause_type = 'termination' THEN TRY_CAST(json_extract_string(cc.content, '$.for_convenience_notice_days') AS DOUBLE) END) AS termination_notice_days
        FROM base b LEFT JOIN contract_clauses cc ON cc.contract_id = b.contract_id
        WHERE $top_by_spend IS NULL OR b.spend_rank <= $top_by_spend
        GROUP BY ALL
      ), scored AS (
        SELECT k.*,
               CASE WHEN NOT COALESCE(k.has_price_review, false) THEN 0 WHEN k.price_review_max_increase_pct IS NULL THEN 5
                    ELSE least(k.price_review_max_increase_pct, 10) / 2 END AS price_exposure_pts,
               COALESCE(k.force_majeure_suspension_days, 0) / 30 AS force_majeure_pts,
               COALESCE(k.termination_notice_days, 0) / 60 AS termination_pts
        FROM clauses k
      )
      SELECT row_number() OVER (ORDER BY round(price_exposure_pts + force_majeure_pts + termination_pts, 1) DESC, annual_value_gbp DESC) AS risk_rank,
             contract_id, party_id, party_name, annual_value_gbp, spend_rank,
             price_review_max_increase_pct, force_majeure_suspension_days, termination_notice_days, renewal_notice_days,
             round(price_exposure_pts, 1) AS price_exposure_pts, round(force_majeure_pts, 1) AS force_majeure_pts, round(termination_pts, 1) AS termination_pts,
             round(price_exposure_pts + force_majeure_pts + termination_pts, 1) AS risk_score,
             'risk = min(max price increase %, 10)/2 (uncapped = 5) + force majeure suspension days/30 + convenience termination notice days/60' AS formula
      FROM scored
      ORDER BY risk_rank
      LIMIT $limit_rows
    example: {top_by_spend: 30}

  - name: compare_contract_to_standard_terms
    desc: Deviations of a supplier contract from our standard terms, ranked by risk, with the apparel-industry norm for each. Use for contract review and redlines.
    kind: sql
    args:
      contract_id: {required: true}
    sql: |
      WITH c AS (
        SELECT * FROM contracts WHERE ($contract_id IS NOT NULL AND contract_id = $contract_id)
      ), dev AS (
        SELECT c.contract_id, c.party_id, st.term_id, st.clause_type, st.field, st.standard_position, st.risk_score, st.risk_level, st.apparel_note,
               json_extract_string(cc.content, '$.' || st.field) AS actual,
               cc.clause_type IS NULL AS clause_missing,
               CASE WHEN cc.clause_type IS NULL THEN st.required
                    WHEN json_extract_string(cc.content, '$.' || st.field) IS NULL THEN true
                    WHEN st.operator = '>=' THEN TRY_CAST(json_extract_string(cc.content, '$.' || st.field) AS DOUBLE) < TRY_CAST(st.standard_value AS DOUBLE)
                    WHEN st.operator = '<=' THEN TRY_CAST(json_extract_string(cc.content, '$.' || st.field) AS DOUBLE) > TRY_CAST(st.standard_value AS DOUBLE)
                    ELSE NOT list_contains(string_split(lower(st.standard_value), '|'), lower(json_extract_string(cc.content, '$.' || st.field))) END AS deviates,
               st.operator
        FROM c JOIN standard_terms st ON st.contract_type = c.contract_type
        LEFT JOIN contract_clauses cc ON cc.contract_id = c.contract_id AND cc.clause_type = st.clause_type
      )
      SELECT d.contract_id, d.party_id, d.clause_type, d.field AS term, d.standard_position AS our_standard,
             COALESCE(d.actual, CASE WHEN d.clause_missing THEN 'clause missing' ELSE 'not stated or uncapped' END) AS contract_value,
             CASE WHEN d.clause_missing THEN 'clause missing'
                  WHEN d.actual IS NULL THEN 'not stated or uncapped'
                  WHEN d.operator = '>=' THEN 'below our minimum'
                  WHEN d.operator = '<=' THEN 'above our maximum'
                  ELSE 'differs from standard' END AS deviation,
             d.risk_level, d.risk_score, d.apparel_note AS apparel_industry_norm
      FROM dev d
      WHERE d.deviates
      ORDER BY d.risk_score DESC, d.clause_type, d.field
    limit: 30
    example: {contract_id: CTR-000072}

