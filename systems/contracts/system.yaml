  - name: list_contracts_by_supplier_spend
    desc: Contracts ranked by supplier spend. Use to prioritize renegotiations.
    kind: sql
    args:
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency], desc: "Filter by type (optional)"}
      limit_rows: {type: int, desc: "Return top N", default: 30}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status,
             c.start_date, c.end_date,
             count(*) AS clause_count
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE ($contract_type IS NULL OR c.contract_type = $contract_type)
        AND c.status IN ('active', 'draft')
      GROUP BY c.contract_id, c.party_id, c.contract_type, c.status, c.start_date, c.end_date
      ORDER BY c.contract_id DESC
      LIMIT $limit_rows
    example: {contract_type: supplier, limit_rows: 30}

  - name: list_contracts_expiring_within_period
    desc: Contracts expiring in a period. Use to plan renewals and procurement.
    kind: sql
    args:
      date_from: {type: date, default: "-0d", desc: "Period start"}
      date_to: {type: date, default: "+90d", desc: "Period end"}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status,
             c.end_date, c.renewal_notice_days,
             CAST(c.end_date AS DATE) - INTERVAL (c.renewal_notice_days) DAY AS notice_deadline
      FROM contracts c
      WHERE CAST(c.end_date AS DATE) BETWEEN CAST($date_from AS DATE) AND CAST($date_to AS DATE)
        AND c.status IN ('active', 'draft')
      ORDER BY c.end_date ASC
    limit: 50
    example: {date_to: "+12m"}

  - name: list_contracts_with_non_standard_terms
    desc: Contracts flagged for non-standard terms. Use to identify risk and negotiation opportunities.
    kind: sql
    args:
      contract_type: {type: enum, values: [supplier, carrier, customer, franchise, agency], desc: "Filter by type (optional)"}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type, c.status,
             count(DISTINCT cc.clause_type) AS clause_count,
             string_agg(DISTINCT cc.clause_type, ', ') AS clause_types
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE ($contract_type IS NULL OR c.contract_type = $contract_type)
        AND c.status IN ('active', 'draft')
        AND cc.clause_type NOT IN ('payment_terms', 'renewal')
      GROUP BY c.contract_id, c.party_id, c.contract_type, c.status
      ORDER BY c.contract_id
    limit: 50
    example: {}

  - name: search_contract_clauses
    desc: Search clauses across contracts by type or keyword. Use to find specific terms.
    kind: sql
    args:
      clause_type: {type: enum, values: [liability, payment_terms, renewal, price_review, force_majeure, termination, claim_window, short_shipment, chargeback, rate_review, service_level, penalty, ip_protection, other], desc: "Clause type (optional)"}
      keyword: {type: str, desc: "Keyword search in clause title or content (optional)"}
    sql: |
      SELECT c.contract_id, c.party_id, c.contract_type,
             cc.clause_id, cc.clause_type, cc.title, cc.content
      FROM contracts c
      LEFT JOIN contract_clauses cc ON c.contract_id = cc.contract_id
      WHERE c.status IN ('active', 'draft')
        AND ($clause_type IS NULL OR cc.clause_type = $clause_type)
        AND ($keyword IS NULL OR cc.title ILIKE '%' || $keyword || '%' OR cc.content ILIKE '%' || $keyword || '%')
      ORDER BY c.contract_id, cc.clause_type
    limit: 50
    example: {clause_type: liability}
