    - tool: get_contract_renewal_terms
      args: {contract_id: CTR-900002}
      expect: ["auto_renewal", "renewal_notice_days"]
    - tool: get_contract_owner
      args: {contract_id: CTR-900002}
      expect: ["EMP-00002", "CAR-007"]
    - tool: create_contract_renewal_alert
      args: {contract_id: CTR-900002, alert_date: "+60d"}
      expect: ["ALR-", "scheduled"]

