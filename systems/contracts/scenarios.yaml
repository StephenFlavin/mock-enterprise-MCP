      args: {contract_id: CTR-900002, carrier_id: CAR-007}
      expect: ["NEGOTIATION BRIEF"]

- question: "04:38:Q3"
  story: >
    Record our negotiation position as POS-900001 on CTR-900001 case NGT-900001. Position type is "offer"
    with 5% rate reduction + volume commitment terms recorded.
  checks:
    - tool: update_contract_negotiation_position
      args: {contract_id: CTR-900001, case_id: NGT-900001, position_type: offer, terms: "5% reduction", notes: "Initial offer"}
      expect: ["POS-", "offer"]

- question: "01:4:Q4"
  story: >
    Inventory cycle counter comparing goods receipts to ASNs. Finds SUP-0001 short-shipped on 8 occasions
