# PLM scenarios for stage 1 tools (17 tools implemented in plm)
# These test the specific tools we built, using seed data planted for each question story

- question: "02:14:Q2"
  story: >
    Padded gilet (SKU-100154) BOM shows 100% polyester shell and liner.
    Query returns both components with quantities and suppliers.
  checks:
    - tool: get_bill_of_materials_for_product
      args: {sku: SKU-100154}
      expect: ["component_name", "line_no"]

- question: "02:14:Q5"
  story: >
    Vietnam garment (STY-5520) fabric origin shows China mill with Vietnam cutting.
    Fabric spec query returns origin country VN and mill country CN.
  checks:
    - tool: get_fabric_origin_by_style
      args: {style_id: STY-5520}
      expect: ["VN", "origin_country"]

- question: "04:32:Q4"
  story: >
    750ml bottle (K-1700) cost breakdown shows stainless steel body (8.50 GBP) as highest cost component.
    BOM with cost and percentage share is returned.
  checks:
    - tool: get_product_bom_and_cost_breakdown
      args: {sku: K-1700}
      expect: ["Stainless Steel Body", "line_cost_gbp", "pct_of_total"]

- question: "04:38:Q5"
  story: >
    Co-development projects exist in PLM showing supplier partnerships and IP terms.
    CODEV-900003 with SUP-0042 has proprietary dyeing process.
  checks:
    - tool: get_dye_lot_and_process_changes_for_lots
      args: {material_id: MAT-POL-100, dye_date_from: "-90d"}
      expect: ["dye_lot_id", "process_name", "test_status"]

- question: "04:39:Q4"
  story: >
    Polyester appears in multiple product BOMs across categories.
    Query shows products using polyester material (SKU-100154, SKU-100007, SKU-100574).
  checks:
    - tool: get_bill_of_materials_for_product
      args: {sku: SKU-100007}
      expect: ["Polyester Fabric", "line_no", "100% polyester"]

- question: "05:42:Q1"
  story: >
    Pink polyester blouse dye lots DYE-900001 through DYE-900005 show dye house effect.
    DYES-A dye house lots (900001-900002, 900004-900005) failed fastness tests.
    DYES-B dye house lots (900003, 900006) passed.
  checks:
    - tool: get_dye_lot_and_process_changes_for_lots
      args: {material_id: MAT-POL-100, dye_date_from: "-90d"}
      expect: ["DYES-A", "DYES-B", "fastness_rubbing", "test_status"]
    - tool: get_material_batches_for_product
      args: {sku: SKU-100007}
      expect: ["batch_id", "test_status", "failed"]

- question: "05:42:Q2"
  story: >
    Shoe sole specifications show peel strength requirement >2.5 N/mm which is critical.
    Sole separation issues traced to material batch test failures.
  checks:
    - tool: get_material_batches_for_product
      args: {sku: SKU-100301}
      expect: ["BATCH-SHOE-002", "BATCH-SHOE-003", "failed"]

- question: "05:42:Q3"
  story: >
    Multiple products assigned regulated categories for kids sleepwear, electronics, bottles.
    Fabric origin and material specs support compliance requirements.
  checks:
    - tool: get_fabric_origin_by_style
      args: {style_id: STY-4535}
      expect: ["origin_country", "fabric_name"]

- question: "05:42:Q5"
  story: >
    Shoe sole separation batches BATCH-SHOE-002 through BATCH-SHOE-004 all failed in July-August.
    All from same supplier SUP-0009 factory FAC-0115 with test_status failed.
  checks:
    - tool: get_material_batches_for_product
      args: {sku: SKU-100301}
      expect: ["BATCH-SHOE-002", "BATCH-SHOE-003", "BATCH-SHOE-004", "failed"]

- question: "05:44:Q1"
  story: >
    Children's water bottle (K-1700) specifications include food contact material requirements
    and size chart showing 350ml-750ml variants.
  checks:
    - tool: get_fabric_specs_from_materials_library
      args: {style_id: STY-4535}
      expect: ["fabric_spec_id", "fabric_name"]

- question: "05:44:Q2"
  story: >
    Leather bag (SKU-101813) BOM shows leather from SUP-0008 FAC-0105.
    Batch BATCH-LEATHER-002 failed chromium VI test showing supplier material issue.
  checks:
    - tool: get_bill_of_materials_with_suppliers
      args: {sku: SKU-101813}
      expect: ["Leather", "supplier_name", "factory_name"]
    - tool: get_material_batch_traceability
      args: {batch_id: BATCH-LEATHER-002}
      expect: ["batch_id", "test_status", "failed"]

- question: "05:44:Q3"
  story: >
    Blended fabric volumes and textile products show multiple materials and categories.
    Query returns composition by category for supply planning.
  checks:
    - tool: get_blended_fabric_volumes_by_category
      args: {}
      expect: ["category", "product_count"]

- question: "05:44:Q4"
  story: >
    Waterproof outerwear (SKU-100154) uses PFAS coating as water-resistant material.
    Material specs query returns fabric properties and sustainability score.
  checks:
    - tool: get_material_specs
      args: {name: polyester}
      expect: ["name", "fiber_content", "sustainability_score"]

- question: "05:44:Q5"
  story: >
    Smart water bottle (SKU-102590) requires electrical safety certification.
    Fabric specifications from materials library support product sourcing.
  checks:
    - tool: get_fabric_specs_from_materials_library
      args: {style_id: STY-4012}
      expect: ["fabric_spec_id", "material_id"]

- question: "05:47:Q1"
  story: >
    Portable fan with battery (PF-220) from factory FAC-0101 has lithium battery from SUP-0002.
    Product batch query shows factory and production materials.
  checks:
    - tool: get_product_batch_and_factory_for_sku
      args: {sku: PF-220}
      expect: ["factory_id", "FAC-0101", "battery"]
    - tool: get_bill_of_materials_with_suppliers
      args: {sku: PF-220}
      expect: ["Lithium Battery Pack", "supplier_name"]

- question: "05:49:Q2"
  story: >
    Blended fabric volumes show different materials and their usage by category.
    Query aggregates volume data for sustainability assessment.
  checks:
    - tool: get_blended_fabric_volumes_by_category
      args: {}
      expect: ["product_count", "fiber_blends"]

- question: "06:51:Q6"
  story: >
    Materials in the library show readiness levels from experimental to production.
    Query material readiness levels to find production-ready materials.
  checks:
    - tool: get_material_readiness_level
      args: {readiness_level: production}
      expect: ["readiness_level", "production"]

- question: "06:52:Q2"
  story: >
    Product design attributes distinguish products by features like breathable, stretch, water-resistant.
    Query returns attribute data for performance analysis.
  checks:
    - tool: get_product_design_attributes
      args: {category: Outerwear}
      expect: ["design_attributes", "name"]

- question: "06:52:Q4"
  story: >
    Fabric specs from materials library show fiber content, weight, certifications and sustainability.
    Overshirt fabric selection uses this data for cost and performance tradeoff.
  checks:
    - tool: get_fabric_specs_from_materials_library
      args: {style_id: STY-4102}
      expect: ["fiber_content", "gsm", "sustainability_score"]

- question: "06:52:Q5"
  story: >
    Best-selling jeans (SKU-100574) change request created for comfort improvements.
    Tool creates and stores change request for design update in next version.
  checks:
    - tool: create_product_change_request
      args: {sku: SKU-100574, change_type: design, change_description: "Add comfort feature", reason: "Customer demand"}
      expect: ["CHG-", "open"]

- question: "06:53:Q1"
  story: >
    Trouser grade rules for size 14 show hip width specification and tolerance.
    Change in hip grading updates the spec for better fit.
  checks:
    - tool: get_blended_fabric_volumes_by_category
      args: {}
      expect: ["category", "fiber_blends"]

- question: "06:53:Q2"
  story: >
    Size chart for women's jeans shows XS-XL waist and inseam measurements.
    Query returns chart data for anthropometric comparison.
  checks:
    - tool: get_fabric_specs_from_materials_library
      args: {}
      expect: ["fabric_name", "mill_country"]

- question: "06:53:Q4"
  story: >
    Shrinkage tolerance for knit is set in tech pack based on fabric tests.
    Update tolerance updates the specification for quality control.
  checks:
    - tool: get_material_specs
      args: {}
      expect: ["name", "material_type"]

- question: "06:54:Q2"
  story: >
    Range planning archives completed products from active range.
    Archive removes from PLM and range planning for end-of-life products.
  checks:
    - tool: archive_product_in_plm
      args: {sku: K-1700}
      expect: ["discontinued"]

- question: "06:58:Q3"
  story: >
    Cost reduction analysis uses BOM breakdown to identify components for cost cutting.
    Query shows component costs and percentage share of total cost.
  checks:
    - tool: get_product_bill_of_materials
      args: {sku: SKU-100574}
      expect: ["line_no", "unit_cost_gbp", "component_name"]

- question: "06:60:Q3"
  story: >
    Recycled nylon material specs show properties including abrasion resistance.
    Material library specs support comparison with reference fabrics.
  checks:
    - tool: get_material_specs
      args: {name: nylon}
      expect: ["name", "fiber_content"]

- question: "06:60:Q5"
  story: >
    Candidate materials in pilot pass tests and move to production.
    Archive removes experimental materials that failed from active candidates.
  checks:
    - tool: archive_candidate_material
      args: {candidate_id: CAND-901004}
      expect: ["archived", "readiness_level"]

# Stage 2 tools: 17 new tools for PLM (2026-10-07)

- question: "05:42:Q2"
  story: >
    Shoe sole specifications show peel strength requirement > 2.5 N/mm which is critical for durability.
    Query tolerances for SKU-100301 returns measurement points and shrinkage limits.
  checks:
    - tool: get_product_specification_tolerances
      args: {sku: "SKU-100301"}
      expect: ["peel_adhesion", "shrinkage_tolerances", "2.5"]

- question: "05:44:Q1"
  story: >
    Children's water bottle K-1700 specifications include size chart (350ml, 500ml, 750ml).
    Query returns complete product specifications with measurement points.
  checks:
    - tool: get_product_specifications
      args: {sku: "K-1700"}
      expect: ["350ml", "size_chart", "test_requirements"]

- question: "06:53:Q2"
  story: >
    Women's trousers size chart shows measurements for sizes 8-18 with hip and inseam dimensions.
    Query returns size chart for range with all measurement specifications.
  checks:
    - tool: get_size_chart_for_range
      args: {sku: "SKU-100637"}
      expect: ["Trousers Size Chart", "89", "95.5"]

- question: "06:53:Q1"
  story: >
    Trousers style T-4410 grade rules show tight tolerance (A grade 60%), standard (B grade 35%), acceptable (C grade 5%).
    Query returns size specs and grade definitions for production quality tiers.
  checks:
    - tool: get_size_spec_and_grade_rules_for_style
      args: {style_id: "STY-T-4410"}
      expect: ["grade_rules", "Grade A", "tolerance_cm", "hip"]

- question: "06:60:Q3"
  story: >
    Recycled nylon yarn construction shows fiber content, weight per meter and abrasion resistance.
    Query returns yarn and construction details for comparison with reference materials.
  checks:
    - tool: get_yarn_and_construction_details
      args: {style_id: "STY-5520"}
      expect: ["fiber_content", "gsm", "abrasion_cycles"]

- question: "06:60:Q5"
  story: >
    Candidate materials CAND-901001 through CAND-901004 are in pilot and experimental phases.
    Query lists candidates with test status and readiness levels.
  checks:
    - tool: list_candidate_materials
      args: {}
      expect: ["candidate_id", "readiness_level", "test_status"]

- question: "04:38:Q5"
  story: >
    Co-development project CODEV-900003 with SUP-0042 develops proprietary dyeing process.
    Query lists projects showing investment, IP terms and materials developed.
  checks:
    - tool: list_co_development_projects
      args: {}
      expect: ["project_id", "supplier_id", "ip_ownership", "investment_gbp"]

- question: "04:39:Q4"
  story: >
    Polyester material MAT-POL-100 is used in multiple products across categories.
    Query returns all products using polyester showing SKUs, styles and categories.
  checks:
    - tool: list_products_by_material
      args: {material_id: "MAT-POL-100"}
      expect: ["sku", "category", "name"]

- question: "05:46:Q4"
  story: >
    Vietnam garments use Chinese fabric (origin CN) but are cut/sewn in Vietnam (VN).
    Query returns products by material and origin country showing sourcing details.
  checks:
    - tool: list_products_by_origin_country_and_material
      args: {material_id: "MAT-POL-100", origin_country: "CN"}
      expect: ["origin_country", "mill_country", "sku"]

- question: "05:42:Q3"
  story: >
    Kids' sleepwear products K-1700 and others are assigned regulated categories.
    Query lists products by regulated category showing compliance status and audit dates.
  checks:
    - tool: list_products_by_regulated_category
      args: {category_name: "Kids Sleepwear"}
      expect: ["category_name", "compliance_status", "test_required"]

- question: "05:47:Q1"
  story: >
    Portable fan PF-220 uses lithium battery component shared with other products.
    Query returns all products using same battery component showing suppliers and costs.
  checks:
    - tool: list_products_using_component
      args: {component_id: "MAT-LI-BATTERY"}
      expect: ["sku", "component_name", "supplier_id"]

- question: "05:44:Q2"
  story: >
    Leather bag SKU-101813 uses batch BATCH-LEATHER-002 which failed chromium VI test.
    Query returns products using same material batch for supply chain trace.
  checks:
    - tool: list_products_using_material
      args: {batch_id: "BATCH-LEATHER-002"}
      expect: ["sku", "batch_id", "batch_date"]

- question: "05:44:Q8"
  story: >
    PFAS is a restricted substance in waterproof outerwear products.
    Query lists products containing restricted substances showing concentration and regulation status.
  checks:
    - tool: list_products_using_substance
      args: {list_type: "restricted"}
      expect: ["substance_name", "concentration_pct", "list_type"]

- question: "08:77:Q4"
  story: >
    Imported small appliances cost shock requires alternative specifications.
    Query searches alternative specs for product to enable cost reduction.
  checks:
    - tool: search_alternative_specifications_for_product
      args: {sku: "K-1700"}
      expect: ["spec_type", "spec_version"]

- question: "06:53:Q1"
  story: >
    Size 14 hip fit issues (too tight) are resolved by updating grade rules.
    Tool updates grade definitions for style T-4410 increasing grade A tolerance.
  checks:
    - tool: update_grade_rules_for_style
      args: {sku: "SKU-100637", spec_type: "grade_rules", grade_definitions: "[{\"grade\": \"A\", \"tolerance_cm\": 0.7}]"}
      expect: ["grade_definitions", "tolerance_cm"]

- question: "05:44:Q8"
  story: >
    PFAS restricted materials are flagged as under review pending replacement.
    Tool updates material compliance status to restrict usage of affected materials.
  checks:
    - tool: update_material_compliance_status
      args: {material_id: "MAT-POL-100", compliance_status: "under_review"}
      expect: ["compliance_status", "under_review"]

- question: "06:53:Q4"
  story: >
    Knit fabric shrinkage tolerance is set to -2% wash, -1% dry clean based on tests.
    Tool updates tolerance specification in tech pack for quality control.
  checks:
    - tool: update_tolerance_in_tech_pack
      args: {sku: "SKU-100637", spec_type: "tolerances", shrinkage_tolerances: "{\"wash\": \"-2%\", \"dry_clean\": \"-1%\"}"}
      expect: ["shrinkage_tolerances", "wash"]

- question: "05:44:Q6"
  story: >
    Toys and kids products assigned regulated categories to track recall risk.
    Query lists products by regulated category showing compliance and audit history.
  checks:
    - tool: list_products_by_regulated_category
      args: {}
      expect: ["category_name", "compliance_status"]

- question: "05:44:Q7"
  story: >
    Product labelling specifications checked against Germany and France requirements.
    Query returns product specifications including composition and size information.
  checks:
    - tool: get_product_specifications
      args: {sku: "K-1700"}
      expect: ["sku", "spec_type"]
