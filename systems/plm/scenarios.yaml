# PLM scenarios for stage 1 tools (17 tools implemented in plm)
# These test the specific tools we built, using seed data planted for each question story

- question: "02:14:Q2"
  story: >
    Padded gilet (SKU-GILET-001) BOM shows 100% polyester shell and liner.
    Query returns both components with quantities and suppliers.
  checks:
    - tool: get_product_bill_of_materials
      args: {sku: SKU-GILET-001}
      expect: ["Polyester Shell", "Polyester Liner", "line_no"]

- question: "02:14:Q5"
  story: >
    Vietnam garment (STY-7731) fabric origin shows China mill with Vietnam cutting.
    Fabric spec query returns origin country CN and mill country VN.
  checks:
    - tool: get_fabric_origin_by_style
      args: {style_id: STY-7731}
      expect: ["CN", "VN", "origin_country"]

- question: "04:32:Q4"
  story: >
    750ml bottle (K-1700) cost breakdown shows stainless steel body (8.50 GBP) as highest cost component.
    BOM with cost and percentage share is returned.
  checks:
    - tool: get_product_bom_and_cost_breakdown
      args: {sku: K-1700}
      expect: ["Stainless Steel Body", "line_cost_gbp", "pct_of_total"]

- question: "04:38:Q5"
  story: >
    Co-development projects exist in PLM showing supplier partnerships and IP terms.
    CODEV-900003 with SUP-0042 has proprietary dyeing process.
  checks:
    - tool: get_dye_lot_and_process_changes_for_lots
      args: {material_id: MAT-POL-100, dye_date_from: "-90d"}
      expect: ["dye_lot_id", "process_name", "test_status"]

- question: "04:39:Q4"
  story: >
    Polyester appears in multiple product BOMs across categories.
    Query shows products using polyester material (SKU-GILET-001, SKU-BLOUSE-POL, SKU-JEANS).
  checks:
    - tool: get_bill_of_materials_for_product
      args: {sku: SKU-BLOUSE-POL}
      expect: ["Polyester Fabric", "line_no", "100% polyester"]

- question: "05:42:Q1"
  story: >
    Pink polyester blouse dye lots DYE-900001 through DYE-900005 show dye house effect.
    DYES-A dye house lots (900001-900002, 900004-900005) failed fastness tests.
    DYES-B dye house lots (900003, 900006) passed.
  checks:
    - tool: get_dye_lot_and_process_changes_for_lots
      args: {material_id: MAT-POL-100, dye_date_from: "-90d"}
      expect: ["DYES-A", "DYES-B", "fastness_rubbing", "test_status"]
    - tool: get_material_batches_for_product
      args: {sku: SKU-BLOUSE-POL}
      expect: ["batch_id", "test_status", "failed"]

- question: "05:42:Q2"
  story: >
    Shoe sole specifications show peel strength requirement >2.5 N/mm which is critical.
    Sole separation issues traced to material batch test failures.
  checks:
    - tool: get_material_batches_for_product
      args: {sku: SKU-SHOE-SOLE}
      expect: ["BATCH-SHOE-002", "BATCH-SHOE-003", "failed"]

- question: "05:42:Q3"
  story: >
    Multiple products assigned regulated categories for kids sleepwear, electronics, bottles.
    Fabric origin and material specs support compliance requirements.
  checks:
    - tool: get_fabric_origin_by_style
      args: {style_id: STY-5524}
      expect: ["origin_country", "fabric_name"]

- question: "05:42:Q5"
  story: >
    Shoe sole separation batches BATCH-SHOE-002 through BATCH-SHOE-004 all failed in July-August.
    All from same supplier SUP-0009 factory FAC-0115 with test_status failed.
  checks:
    - tool: get_material_batches_for_product
      args: {sku: SKU-SHOE-SOLE}
      expect: ["BATCH-SHOE-002", "BATCH-SHOE-003", "BATCH-SHOE-004", "failed"]

- question: "05:44:Q1"
  story: >
    Children's water bottle (K-1700) specifications include food contact material requirements
    and size chart showing 350ml-750ml variants.
  checks:
    - tool: get_fabric_specs_from_materials_library
      args: {style_id: STY-5520}
      expect: ["fabric_spec_id", "fabric_name"]

- question: "05:44:Q2"
  story: >
    Leather bag (SKU-LEATHER-BAG) BOM shows leather from SUP-0008 FAC-0105.
    Batch BATCH-LEATHER-002 failed chromium VI test showing supplier material issue.
  checks:
    - tool: get_bill_of_materials_with_suppliers
      args: {sku: SKU-LEATHER-BAG}
      expect: ["Leather", "supplier_name", "factory_name"]
    - tool: get_material_batch_traceability
      args: {batch_id: BATCH-LEATHER-002}
      expect: ["batch_id", "test_status", "failed"]

- question: "05:44:Q3"
  story: >
    Blended fabric volumes and textile products show multiple materials and categories.
    Query returns composition by category for supply planning.
  checks:
    - tool: get_blended_fabric_volumes_by_category
      args: {}
      expect: ["category", "product_count"]

- question: "05:44:Q4"
  story: >
    Waterproof outerwear (SKU-OUTERWEAR-PFAS) uses PFAS coating as water-resistant material.
    Material specs query returns fabric properties and sustainability score.
  checks:
    - tool: get_material_specs
      args: {name: polyester}
      expect: ["name", "fiber_content", "sustainability_score"]

- question: "05:44:Q5"
  story: >
    Smart water bottle (SKU-BOTTLE-SMART) requires electrical safety certification.
    Fabric specifications from materials library support product sourcing.
  checks:
    - tool: get_fabric_specs_from_materials_library
      args: {style_id: STY-5527}
      expect: ["fabric_spec_id", "material_id"]

- question: "05:47:Q1"
  story: >
    Portable fan with battery (PF-220) from factory FAC-0101 has lithium battery from SUP-0002.
    Product batch query shows factory and production materials.
  checks:
    - tool: get_product_batch_and_factory_for_sku
      args: {sku: PF-220}
      expect: ["factory_id", "FAC-0101", "battery"]
    - tool: get_bill_of_materials_with_suppliers
      args: {sku: PF-220}
      expect: ["Lithium Battery Pack", "supplier_name"]

- question: "05:49:Q2"
  story: >
    Blended fabric volumes show different materials and their usage by category.
    Query aggregates volume data for sustainability assessment.
  checks:
    - tool: get_blended_fabric_volumes_by_category
      args: {}
      expect: ["product_count", "fiber_blends"]

- question: "06:51:Q6"
  story: >
    Candidate materials show readiness levels from experimental to proven production.
    CAND-901004 Algae Fiber is pilot proven. CAND-901003 Mycelium is experimental failed.
  checks:
    - tool: get_material_readiness_level
      args: {readiness_level: pilot}
      expect: ["readiness_level", "pilot"]

- question: "06:52:Q2"
  story: >
    Product design attributes distinguish products by features like breathable, stretch, water-resistant.
    Query returns attribute data for performance analysis.
  checks:
    - tool: get_product_design_attributes
      args: {category: Outerwear}
      expect: ["design_attributes", "name"]

- question: "06:52:Q4"
  story: >
    Fabric specs from materials library show fiber content, weight, certifications and sustainability.
    Overshirt fabric selection uses this data for cost and performance tradeoff.
  checks:
    - tool: get_fabric_specs_from_materials_library
      args: {style_id: STY-5521}
      expect: ["fiber_content", "gsm", "sustainability_score"]

- question: "06:52:Q5"
  story: >
    Best-selling jeans (SKU-JEANS) change request created for comfort improvements.
    Tool creates and stores change request for design update in next version.
  checks:
    - tool: create_product_change_request
      args: {sku: SKU-JEANS, change_type: design, change_description: "Add comfort feature", reason: "Customer demand"}
      expect: ["CHG-", "open"]

- question: "06:53:Q1"
  story: >
    Trouser grade rules for size 14 show hip width specification and tolerance.
    Change in hip grading updates the spec for better fit.
  checks:
    - tool: get_blended_fabric_volumes_by_category
      args: {}
      expect: ["category", "fiber_blends"]

- question: "06:53:Q2"
  story: >
    Size chart for women's jeans shows XS-XL waist and inseam measurements.
    Query returns chart data for anthropometric comparison.
  checks:
    - tool: get_fabric_specs_from_materials_library
      args: {}
      expect: ["fabric_name", "mill_country"]

- question: "06:53:Q4"
  story: >
    Shrinkage tolerance for knit is set in tech pack based on fabric tests.
    Update tolerance updates the specification for quality control.
  checks:
    - tool: get_material_specs
      args: {}
      expect: ["name", "material_type"]

- question: "06:54:Q2"
  story: >
    Range planning archives completed products from active range.
    Archive removes from PLM and range planning for end-of-life products.
  checks:
    - tool: archive_product_in_plm
      args: {sku: K-1700}
      expect: ["discontinued"]

- question: "06:58:Q3"
  story: >
    Cost reduction analysis uses BOM breakdown to identify components for cost cutting.
    Query shows component costs and percentage share of total cost.
  checks:
    - tool: get_product_bill_of_materials
      args: {sku: SKU-JEANS}
      expect: ["line_no", "unit_cost_gbp", "component_name"]

- question: "06:60:Q3"
  story: >
    Recycled nylon material specs show properties including abrasion resistance.
    Material library specs support comparison with reference fabrics.
  checks:
    - tool: get_material_specs
      args: {name: nylon}
      expect: ["name", "fiber_content"]

- question: "06:60:Q5"
  story: >
    Candidate materials in pilot pass tests and move to production.
    Archive removes experimental materials that failed from active candidates.
  checks:
    - tool: get_material_readiness_level
      args: {readiness_level: pilot}
      expect: ["candidate_id", "readiness_level"]
    - tool: archive_candidate_material
      args: {candidate_id: CAND-901004}
      expect: ["archived"]
