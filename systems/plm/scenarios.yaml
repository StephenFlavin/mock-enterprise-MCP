# PLM scenarios for stage 1 tools (17 tools)
- question: "02:14:Q2"
  story: >
    Padded gilet with 100% polyester shell and 100% polyester knit fleece liner (SKU-GILET-001) is being classified for customs.
    The tool returns the detailed BOM showing shell and liner materials, quantities and suppliers.
  checks:
    - tool: get_product_bill_of_materials
      args: {sku: SKU-GILET-001}
      expect: ["Polyester Shell", "Polyester Liner", "line_no", "quantity"]

- question: "02:14:Q5"
  story: >
    A garment from Vietnam (SKU-GARMENT-VN, style STY-7731) with fabric from China needs origin classification.
    Fabric origin query returns China (CN) as origin_country and Vietnam (VN) as mill_country.
  checks:
    - tool: get_fabric_origin_by_style
      args: {style_id: STY-7731}
      expect: ["CN", "VN", "origin_country", "mill_country"]

- question: "04:32:Q4"
  story: >
    Cost breakdown query for 750ml insulated bottle (K-1700) shows component costs and margin impact.
    Stainless steel body (8.50 GBP) is largest cost, silicone straw and cap are smaller components.
  checks:
    - tool: get_product_bom_and_cost_breakdown
      args: {sku: K-1700}
      expect: ["Stainless Steel Body", "8.50", "line_cost_gbp", "pct_of_total"]

- question: "04:38:Q5"
  story: >
    Co-development projects with suppliers (CODEV-900001 to CODEV-900005) show IP ownership terms and investment.
    CODEV-900003 with SUP-0042 has proprietary dyeing process owned by Harbour & Vale.
  checks:
    - tool: list_co_development_projects
      args: {supplier_id: SUP-0042}
      expect: ["CODEV-900003", "Dyeing", "ip_ownership"]

- question: "04:39:Q4"
  story: >
    Polyester is used in multiple products (SKU-GILET-001, SKU-BLOUSE-POL, SKU-JEANS) and a 20% price rise impacts margins.
    Query shows products using polyester material by category.
  checks:
    - tool: get_bill_of_materials
      args: {sku: SKU-BLOUSE-POL}
      expect: ["Polyester Fabric", "100% polyester", "line_no"]

- question: "05:42:Q1"
  story: >
    Seven pink polyester blouse (SKU-BLOUSE-POL) dye lots failed colourfastness to rubbing over two months.
    Dye lots DYE-900001 through DYE-900005 show pattern: process_name "Exhaust", dye_house "DYES-A" failed,
    while DYE-900003 with "DYES-B" passed. DYE-900006 with "DYES-B" also passed.
  checks:
    - tool: get_dye_lot_and_process_changes_for_lots
      args: {material_id: MAT-POL-100, dye_date_from: "2026-08-01"}
      expect: ["DYE-900001", "DYES-A", "failed", "fastness_rubbing"]
    - tool: get_material_batches_for_product
      args: {sku: SKU-BLOUSE-POL}
      expect: ["BATCH-BLOUSE-001", "BATCH-BLOUSE-002", "failed"]

- question: "05:42:Q2"
  story: >
    Athletic shoe lot (BATCH-SHOE-001) passed tests but zip strength is 4% under spec.
    Product specifications show requirements for product SKU-SHOE-SOLE.
  checks:
    - tool: get_product_specifications
      args: {sku: SKU-SHOE-SOLE}
      expect: ["test_requirements", "peel_strength"]

- question: "05:42:Q3"
  story: >
    Kids sleepwear products (SKU-SLEEPWEAR) are in regulated category "children_sleepwear"
    with flammability requirements BS 5722 (UK), EN 14878 (EU), 16 CFR 1615 (US).
  checks:
    - tool: list_products_by_regulated_category
      args: {category_name: "children_sleepwear", region: "UK"}
      expect: ["SKU-SLEEPWEAR", "BS 5722", "REGCAT-CHILD-001"]

- question: "05:42:Q5"
  story: >
    Shoe sole separation issues traced to material batches BATCH-SHOE-002, BATCH-SHOE-003, BATCH-SHOE-004
    all from SUP-0009 FAC-0115, all with test_status "failed" and from July-August 2026.
  checks:
    - tool: get_material_batches_for_product
      args: {sku: SKU-SHOE-SOLE}
      expect: ["BATCH-SHOE-002", "BATCH-SHOE-003", "BATCH-SHOE-004", "failed", "2026-07"]

- question: "05:44:Q1"
  story: >
    Children's insulated water bottle (K-1700) specifications include food contact material requirements
    and testing for lead, cadmium. Bottle comes in three sizes: 350ml, 500ml, 750ml.
  checks:
    - tool: get_product_specifications
      args: {sku: K-1700}
      expect: ["size_chart", "test_requirements", "Food contact material"]

- question: "05:44:Q2"
  story: >
    Leather handbag (SKU-LEATHER-BAG) BOM shows leather from SUP-0008 FAC-0105.
    Batch BATCH-LEATHER-002 failed for chromium VI. Material batch traceability shows the batch
    and products using it.
  checks:
    - tool: get_bill_of_materials_with_suppliers
      args: {sku: SKU-LEATHER-BAG}
      expect: ["Leather", "SUP-0008", "factory_name"]
    - tool: get_material_batch_traceability
      args: {batch_id: "BATCH-LEATHER-002"}
      expect: ["BATCH-LEATHER-002", "chromium", "failed"]

- question: "05:44:Q3"
  story: >
    Multiple products across categories are assigned regulated categories.
    Query shows which product categories are affected (sleepwear, electronics, bottles).
  checks:
    - tool: list_products_by_regulated_category
      args: {}
      expect: ["SKU-SLEEPWEAR", "SKU-BOTTLE-SMART", "PF-220"]

- question: "05:44:Q4"
  story: >
    Waterproof outerwear (SKU-OUTERWEAR-PFAS) contains PFAS substances (PFOA, PFCs) at 0.1-0.2% concentration.
    Query shows products using PFAS substances that will be restricted.
  checks:
    - tool: list_products_using_substance
      args: {substance_id: "CAS-000-51"}
      expect: ["SKU-OUTERWEAR-PFAS", "PFOA", "restricted"]

- question: "05:44:Q5"
  story: >
    Smart water bottle (SKU-BOTTLE-SMART) specifications show it requires certification
    in EU and UK, with electrical safety EN 60950-1 and battery requirements UN38.3.
  checks:
    - tool: get_product_specifications
      args: {sku: SKU-BOTTLE-SMART}
      expect: ["electrical_safety", "EN 60950-1", "UN38.3"]

- question: "05:47:Q1"
  story: >
    Portable fan with lithium battery (PF-220) from factory FAC-0101 has BOM showing
    Li-ion 2600mAh battery from SUP-0002. Query shows batch and factory for SKU.
  checks:
    - tool: get_product_batch_and_factory_for_sku
      args: {sku: "PF-220"}
      expect: ["PF-220", "FAC-0101", "battery", "Li-ion"]
    - tool: get_bill_of_materials_with_suppliers
      args: {sku: "PF-220"}
      expect: ["Lithium Battery Pack", "SUP-0002"]

- question: "05:49:Q2"
  story: >
    Blended fabric query for poly-cotton blends shows volumes by category.
    Multiple BOMs include polyester or cotton fabric components with blended compositions.
  checks:
    - tool: get_blended_fabric_volumes_by_category
      args: {}
      expect: ["category", "product_count", "total_meters", "fiber_blends"]

- question: "06:51:Q6"
  story: >
    Candidate materials in pilot and experimental phases show readiness levels.
    CAND-901004 (Algae Fiber) is proven at production scale with passed tests.
    CAND-901003 (Mycelium Leather) failed and is experimental.
  checks:
    - tool: get_material_readiness_level
      args: {readiness_level: "pilot"}
      expect: ["CAND-901001", "CAND-901004", "readiness_level"]

- question: "06:52:Q2"
  story: >
    Product design attributes (design_attributes JSON field) show features like breathable, stretch, water-resistant
    that differentiate top vs bottom performers. Query returns attribute list for products.
  checks:
    - tool: get_product_design_attributes
      args: {category: "Outerwear"}
      expect: ["design_attributes", "color", "main_material"]

- question: "06:52:Q4"
  story: >
    Fabric specs for overshirt materials from materials library show fiber content, weight, durability.
    Query returns fabric specifications including sustainability score and test results.
  checks:
    - tool: get_fabric_specs_from_materials_library
      args: {style_id: "STY-5521"}
      expect: ["fiber_content", "gsm", "sustainability_score"]

- question: "06:52:Q5"
  story: >
    Best-selling jeans (SKU-JEANS, style STY-5528) change request created for sizing improvements.
    Request CHG-900002 captures customer feedback about comfort features.
  checks:
    - tool: create_product_change_request
      args: {sku: SKU-JEANS, change_type: design, change_description: "Add hidden comfort waistband panel", reason: "Customer feedback"}
      expect: ["CHG-", "open", "approved"]

- question: "06:53:Q1"
  story: >
    Style T-4410 size 14 trousers have grade rules with hip measurement 96cm ±2mm.
    Product specification shows size chart and grade definitions (A/B/C tolerance levels).
    Change request CHG-900001 updates the hip specification.
  checks:
    - tool: get_product_specifications
      args: {sku: "STY-T-4410", spec_type: "size_chart"}
      expect: ["14", "grade_rules", "hip"]
    - tool: update_grade_rules_for_style
      args: {sku: "STY-T-4410", grade_adjustment: "+3mm for size 16"}
      expect: ["STY-T-4410", "updated"]

- question: "06:53:Q2"
  story: >
    Size chart for women's range (SKU-JEANS) shows UK measurements in XS-XL and waist/inseam dimensions.
    Query returns size chart specifications for comparison with body measurement data.
  checks:
    - tool: get_product_specifications
      args: {sku: SKU-JEANS, spec_type: "size_chart"}
      expect: ["XS", "waist", "inseam", "women"]

- question: "06:53:Q4"
  story: >
    Shrinkage tolerance for knit is set based on fabric test results and factory capability.
    Update tolerance change request CHG-900003 updates the tech pack shrinkage specification.
  checks:
    - tool: update_tolerance_in_tech_pack
      args: {sku: K-1700, tolerance_type: "shrinkage", new_value: "±1.5%"}
      expect: ["K-1700", "tolerance", "updated"]

- question: "06:54:Q2"
  story: >
    Range planning review determines which products to archive. SKU-100234 is deleted.
    Archive product CHG removes it from active PLM and range planning.
  checks:
    - tool: archive_product_in_plm
      args: {sku: SKU-100234, archive_reason: "End of season clearance"}
      expect: ["discontinued", "archive"]

- question: "06:58:Q3"
  story: >
    Cost reduction analysis for product uses BOM breakdown. Query shows component costs
    and cost_gbp totals for each line to identify where to cut 8%.
  checks:
    - tool: get_bill_of_materials_for_product
      args: {sku: SKU-JEANS}
      expect: ["line_no", "unit_cost_gbp", "quantity"]

- question: "06:60:Q3"
  story: >
    Recycled nylon fabric failed abrasion tests. Material specs query shows properties
    and yarn construction details for the trial material.
  checks:
    - tool: get_material_specs
      args: {name: "nylon", material_type: "fabric"}
      expect: ["fiber_content", "abrasion_cycles", "test"]

- question: "06:60:Q5"
  story: >
    Candidate materials pilot selection: CAND-901001 (Recycled Polyester) and CAND-901004 (Algae Fiber)
    pass pilot tests and go to production. CAND-901003 (Mycelium) fails and is archived.
    Archive candidate material removes it from active pilots.
  checks:
    - tool: list_candidate_materials
      args: {readiness_level: "pilot"}
      expect: ["CAND-901001", "CAND-901004", "test_status"]
    - tool: archive_candidate_material
      args: {candidate_id: "CAND-901003", reason: "Failed durability tests"}
      expect: ["CAND-901003", "archived"]
