id: plm
name: Product Lifecycle Management (PLM)
instructions: >
  Product design, specifications, materials and change management. Tech packs, BOMs, fabric specs,
  material batches with traceability, dye lots, tolerances, size charts and grade rules.
  Product ids are SKUs (e.g. SKU-100234, PF-220, K-1700). Change request ids look like CHG-000123.

tables:
  product_tech_pack:
    key: sku
    desc: Product technical specifications, design attributes and composition summary
    cols:
      sku: {type: str, desc: "SKU, e.g. SKU-100234"}
      style_id: {type: str, desc: "Style, e.g. STY-5520"}
      name: {type: str, desc: Product name}
      department: {type: str, desc: "Department, e.g. Womenswear, Home"}
      category: {type: str, desc: "Category, e.g. Dresses, Bedding"}
      subcategory: {type: str, desc: Subcategory}
      supplier_id: {type: str, desc: "Primary supplier, e.g. SUP-0042"}
      factory_id: {type: str, desc: "Primary factory, e.g. FAC-0107"}
      color: {type: str, desc: "Color description"}
      main_material: {type: str, desc: "Primary material, e.g. 100% polyester"}
      material_composition: {type: text, desc: "Full composition description"}
      design_attributes: {type: text, desc: "Key design features (JSON list)"}
      lead_time_days: {type: int, desc: "Manufacturing lead time in days"}
      status: {type: enum, values: [active, new, clearance, discontinued], desc: "Product status"}
      created_at: {type: timestamp, desc: "Date created in PLM"}
      updated_at: {type: timestamp, desc: "Last updated"}

  bill_of_materials:
    key: [sku, line_no]
    desc: Product bill of materials with components, materials and suppliers
    cols:
      sku: {type: str, desc: "SKU"}
      line_no: {type: int, desc: "Line number in BOM"}
      component_type: {type: enum, values: [fabric, trim, component, packing], desc: "Component type"}
      component_id: {type: str, desc: "Component/material id or supplier part number"}
      component_name: {type: str, desc: "Component description"}
      material_name: {type: str, desc: "Material or material blend"}
      supplier_id: {type: str, desc: "Supplier of this component"}
      factory_id: {type: str, desc: "Factory sourcing this component"}
      quantity: {type: float, desc: "Quantity per garment/unit"}
      unit: {type: str, desc: "Unit of measure (m, kg, pcs)"}
      unit_cost_gbp: {type: float, desc: "Component cost in GBP"}
      lead_time_days: {type: int, desc: "Lead time for this component"}
      notes: {type: str, desc: "Special notes or requirements"}

  material_library:
    key: material_id
    desc: Material specifications, properties and sourcing
    cols:
      material_id: {type: str, desc: "Material id, e.g. MAT-001234"}
      name: {type: str, desc: "Material name"}
      material_type: {type: enum, values: [fabric, yarn, leather, trim, component], desc: "Material type"}
      fiber_content: {type: text, desc: "Fiber composition, e.g. 100% polyester"}
      mill_id: {type: str, desc: "Primary mill supplier"}
      supplier_id: {type: str, desc: "Material supplier"}
      gsm: {type: float, desc: "Weight grams/m² for fabrics"}
      weight_kg_per_meter: {type: float, desc: "Weight per meter for yarn"}
      width_cm: {type: float, desc: "Fabric width in cm"}
      color: {type: str, desc: "Material color"}
      certifications: {type: text, desc: "Certifications (GOTS, OEKO-TEX, etc)"}
      sustainability_score: {type: int, desc: "Sustainability rating 1-5"}
      compliance_status: {type: enum, values: [approved, restricted, under_review, banned], desc: "Compliance status"}
      readiness_level: {type: enum, values: [production, pilot, experimental, archived], desc: "Maturity level"}
      unit_cost_gbp: {type: float, desc: "Cost per unit"}
      lead_time_days: {type: int, desc: "Lead time from supplier"}
      stock_kg: {type: float, desc: "Current stock in kg"}
      created_at: {type: timestamp, desc: "Date added to library"}

  material_batches:
    key: batch_id
    desc: Production batches of materials with traceability
    cols:
      batch_id: {type: str, desc: "Material batch id, e.g. BATCH-001234"}
      material_id: {type: str, desc: "Material in this batch"}
      supplier_id: {type: str, desc: "Supplier"}
      factory_id: {type: str, desc: "Mill or factory that produced it"}
      batch_date: {type: date, desc: "Production/dyeing date"}
      quantity_kg: {type: float, desc: "Batch size in kg"}
      quantity_meters: {type: float, desc: "Batch size in meters (for fabrics)"}
      color_lot: {type: str, desc: "Color lot number"}
      dye_house: {type: str, desc: "Dye house if applicable"}
      test_status: {type: enum, values: [passed, failed, in_progress, on_hold], desc: "Quality test status"}
      test_date: {type: date, desc: "Date tested"}
      traceability_notes: {type: text, desc: "Upstream traceability info"}
      used_in_skus: {type: text, desc: "SKUs using this batch (JSON list)"}
      status: {type: enum, values: [active, used, archived], desc: "Batch status"}
      created_at: {type: timestamp, desc: "Date created"}

  dye_lots:
    key: dye_lot_id
    desc: Dye lot tracking with mill, dye house and process changes
    cols:
      dye_lot_id: {type: str, desc: "Dye lot id, e.g. DYE-001234"}
      batch_id: {type: str, desc: "Material batch id"}
      fabric_material: {type: str, desc: "Fabric being dyed"}
      mill_id: {type: str, desc: "Mill id"}
      dye_house: {type: str, desc: "Dye house name"}
      color_description: {type: str, desc: "Color name/description"}
      dye_date: {type: date, desc: "Date of dyeing"}
      process_name: {type: str, desc: "Dyeing process (e.g. continuous, exhaust)"}
      process_chemicals: {type: text, desc: "Key chemicals used"}
      process_changes: {type: text, desc: "Changes from standard process"}
      temperature_c: {type: float, desc: "Dye temperature in Celsius"}
      duration_minutes: {type: int, desc: "Process duration in minutes"}
      yield_pct: {type: float, desc: "Yield percentage"}
      fastness_rubbing: {type: str, desc: "Rubbing fastness test result (1-5)"}
      fastness_washing: {type: str, desc: "Washing fastness test result"}
      test_status: {type: enum, values: [passed, failed, in_progress], desc: "Test status"}
      notes: {type: text, desc: "Process notes or issues"}

  fabric_specs:
    key: fabric_spec_id
    desc: Fabric specifications with properties and origins
    cols:
      fabric_spec_id: {type: str, desc: "Fabric spec id, e.g. FAB-001234"}
      material_id: {type: str, desc: "Material id"}
      style_id: {type: str, desc: "Style id"}
      fabric_name: {type: str, desc: "Fabric name"}
      fiber_content: {type: text, desc: "Fiber composition"}
      weave: {type: str, desc: "Weave type (e.g. plain, twill)"}
      gsm: {type: float, desc: "Weight in grams/m²"}
      width_cm: {type: float, desc: "Fabric width in cm"}
      mill_id: {type: str, desc: "Mill id"}
      mill_country: {type: str, desc: "Mill location country code"}
      origin_country: {type: str, desc: "Country of origin code"}
      supplier_id: {type: str, desc: "Supplier id"}
      color: {type: str, desc: "Color"}
      shrinkage_pct: {type: float, desc: "Expected shrinkage %"}
      tensile_strength: {type: float, desc: "Tensile strength (N)"}
      tear_strength: {type: float, desc: "Tear strength (N)"}
      pilling_resistance: {type: str, desc: "Pilling rating (1-5)"}
      abrasion_cycles: {type: int, desc: "Abrasion resistance in cycles"}
      cost_per_meter_gbp: {type: float, desc: "Cost per meter"}
      lead_time_days: {type: int, desc: "Lead time"}
      certifications: {type: text, desc: "Certifications"}
      sustainability_score: {type: int, desc: "Sustainability 1-5"}

  product_specifications:
    key: [sku, spec_type]
    desc: Product-specific specifications, tolerances, size charts and grade rules
    cols:
      sku: {type: str, desc: "SKU"}
      spec_type: {type: enum, values: [size_chart, grade_rules, tolerances, test_requirements], desc: "Type of spec"}
      spec_name: {type: str, desc: "Name of specification"}
      spec_version: {type: int, desc: "Version number"}
      content: {type: text, desc: "Specification content (JSON)"}
      applicable_sizes: {type: text, desc: "Sizes this applies to (JSON list)"}
      applicable_fits: {type: text, desc: "Fits this applies to (JSON list)"}
      measurement_points: {type: text, desc: "Measurement specifications (JSON)"}
      shrinkage_tolerances: {type: text, desc: "Shrinkage limits (JSON)"}
      grade_definitions: {type: text, desc: "Grade definitions (JSON)"}
      notes: {type: text, desc: "Notes"}
      created_at: {type: timestamp, desc: "Created date"}
      updated_at: {type: timestamp, desc: "Last updated"}

  candidate_materials:
    key: candidate_id
    desc: Candidate materials in pilot or experimental phase
    cols:
      candidate_id: {type: str, desc: "Candidate id, e.g. CAND-001234"}
      material_name: {type: str, desc: "Material name"}
      material_type: {type: enum, values: [fabric, yarn, trim, component], desc: "Type"}
      fiber_content: {type: text, desc: "Composition"}
      supplier_id: {type: str, desc: "Supplier"}
      readiness_level: {type: enum, values: [experimental, pilot, proven, archived], desc: "Maturity"}
      test_status: {type: enum, values: [planned, in_progress, completed, passed, failed], desc: "Test status"}
      cost_savings_pct: {type: float, desc: "Estimated cost savings %"}
      weight_reduction_pct: {type: float, desc: "Weight reduction %"}
      sustainability_benefit: {type: text, desc: "Sustainability benefits"}
      pilot_date_start: {type: date, desc: "Pilot start date"}
      pilot_date_end: {type: date, desc: "Expected pilot end"}
      test_plan: {type: text, desc: "Test plan (JSON)"}
      test_results: {type: text, desc: "Test results summary"}
      notes: {type: text, desc: "Technical notes"}
      archived_at: {type: timestamp, desc: "Archive date"}

  co_development_projects:
    key: project_id
    desc: Co-development projects with suppliers
    cols:
      project_id: {type: str, desc: "Project id, e.g. CODEV-001234"}
      project_name: {type: str, desc: "Project name"}
      supplier_id: {type: str, desc: "Supplier partner"}
      factory_id: {type: str, desc: "Factory involved"}
      category: {type: str, desc: "Product category"}
      scope: {type: text, desc: "Project scope"}
      status: {type: enum, values: [planning, active, completed, terminated], desc: "Status"}
      start_date: {type: date, desc: "Project start"}
      target_date: {type: date, desc: "Target completion"}
      actual_completion: {type: date, desc: "Actual completion"}
      investment_gbp: {type: float, desc: "Investment in GBP"}
      cost_savings_gbp: {type: float, desc: "Realized savings"}
      target_cost_reduction_pct: {type: float, desc: "Target cost reduction %"}
      materials_developed: {type: text, desc: "Materials developed (JSON list)"}
      ip_ownership: {type: text, desc: "IP ownership terms"}
      notes: {type: text, desc: "Notes"}

  product_change_requests:
    key: change_request_id
    desc: Product change requests for next versions
    cols:
      change_request_id: {type: str, desc: "Change request id, e.g. CHG-001234"}
      sku: {type: str, desc: "SKU being changed"}
      change_type: {type: enum, values: [material, design, size, grade, specification, other], desc: "Type of change"}
      change_description: {type: text, desc: "What to change"}
      reason: {type: text, desc: "Business reason for change"}
      impact_assessment: {type: text, desc: "Impact of change (JSON)"}
      requested_by: {type: str, desc: "Employee id"}
      requested_at: {type: timestamp, desc: "Request date"}
      status: {type: enum, values: [open, approved, in_progress, implemented, rejected], desc: "Status"}
      priority: {type: enum, values: [low, medium, high, urgent], desc: "Priority"}
      target_implementation: {type: date, desc: "Target date"}
      notes: {type: text, desc: "Notes"}
      updated_at: {type: timestamp, desc: "Last updated"}

  product_substances:
    key: [sku, substance_id]
    desc: Substances and regulated materials in products
    cols:
      sku: {type: str, desc: "SKU"}
      substance_id: {type: str, desc: "Substance id (CAS number or similar)"}
      substance_name: {type: str, desc: "Substance name"}
      concentration_pct: {type: float, desc: "Concentration %"}
      component: {type: str, desc: "Component containing it"}
      regulation: {type: str, desc: "Applicable regulation"}
      list_type: {type: enum, values: [restricted, candidate, banned, monitored], desc: "Restriction type"}
      status: {type: enum, values: [active, phasing_out, restricted, banned], desc: "Status"}
      notes: {type: text, desc: "Notes"}

  product_regulated_categories:
    key: [sku, category_id]
    desc: Regulatory category assignments for products
    cols:
      sku: {type: str, desc: "SKU"}
      category_id: {type: str, desc: "Regulated category id"}
      category_name: {type: str, desc: "Category name (e.g. kids_sleepwear, toys, electronics)"}
      region: {type: str, desc: "Region (UK, EU, US, AU, etc)"}
      regulations: {type: text, desc: "Applicable regulations (JSON list)"}
      compliance_status: {type: enum, values: [compliant, review, non_compliant], desc: "Compliance status"}
      test_required: {type: bool, desc: "Testing required"}
      last_audit_date: {type: date, desc: "Last audit date"}
      notes: {type: text, desc: "Notes"}

tools:
  - name: archive_candidate_material
    desc: Archives a candidate material so it is removed from the active pilot list.
    kind: update
    table: candidate_materials
    set: {readiness_level: archived, archived_at: "$as_of"}
    args: []
    example: {candidate_id: CAND-901004}

  - name: archive_product_in_plm
    desc: Archives a product record so it drops out of active range planning.
    kind: update
    table: product_tech_pack
    set: {status: discontinued}
    args: []
    example: {sku: K-1700}

  - name: create_product_change_request
    desc: Creates a change request on a product for the next version.
    kind: insert
    table: product_change_requests
    id_prefix: CHG-
    defaults: {status: open, priority: medium}
    args:
      sku: {required: true}
      change_type: {required: true}
      change_description: {required: true}
      reason: {required: true}
    example: {sku: SKU-JEANS, change_type: design, change_description: "Add comfort waistband", reason: "Customer feedback"}

  - name: get_bill_of_materials_for_product
    desc: Return bill of materials for product.
    kind: select
    from: bill_of_materials
    filters:
      sku: {}
    order: line_no
    example: {sku: K-1700}

  - name: get_bill_of_materials_with_suppliers
    desc: BOM with component and material suppliers
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT b.sku, b.line_no, b.component_type, b.component_name, b.material_name,
             s.name AS supplier_name, f.name AS factory_name,
             b.quantity, b.unit, b.unit_cost_gbp, b.lead_time_days
      FROM bill_of_materials b
      LEFT JOIN master.suppliers s ON s.supplier_id = b.supplier_id
      LEFT JOIN master.factories f ON f.factory_id = b.factory_id
      WHERE b.sku = $sku
      ORDER BY b.line_no
    example: {sku: K-1700}

  - name: get_blended_fabric_volumes_by_category
    desc: Volumes of blended fabrics by category
    kind: sql
    args:
      category: {desc: "Product category, e.g. Dresses (optional)", type: str}
      date_from: {type: date, default: "-90d", desc: "Period start"}
    sql: |
      SELECT p.category, COUNT(DISTINCT p.sku) AS product_count,
             SUM(CAST(b.quantity AS FLOAT)) AS total_meters,
             AVG(m.gsm) AS avg_gsm,
             STRING_AGG(DISTINCT m.fiber_content, '; ') AS fiber_blends
      FROM bill_of_materials b
      JOIN product_tech_pack p ON p.sku = b.sku
      LEFT JOIN material_library m ON m.material_id = b.component_id
      WHERE b.component_type = 'fabric'
        AND m.fiber_content ILIKE '%' || '%' ||  '%'
        AND ($category IS NULL OR p.category = $category)
        AND p.created_at >= CAST($date_from AS DATE)
      GROUP BY p.category
      ORDER BY total_meters DESC
    limit: 20
    example: {}

  - name: get_dye_lot_and_process_changes_for_lots
    desc: Dye lot, mill, dye house and process changes
    kind: sql
    args:
      material_id: {type: str, desc: "Material id (optional)"}
      dye_date_from: {type: date, default: "-60d", desc: "Dye date on or after"}
    sql: |
      SELECT d.dye_lot_id, d.batch_id, d.fabric_material, d.mill_id, d.dye_house,
             d.color_description, d.dye_date, d.process_name, d.process_changes,
             d.temperature_c, d.duration_minutes, d.fastness_rubbing, d.fastness_washing,
             d.test_status, d.notes
      FROM dye_lots d
      WHERE ($material_id IS NULL OR d.fabric_material = $material_id)
        AND d.dye_date >= CAST($dye_date_from AS DATE)
      ORDER BY d.dye_date DESC
    limit: 50
    example: {}

  - name: get_fabric_origin_by_style
    desc: Fabric origin by style
    kind: sql
    args:
      style_id: {required: true}
    sql: |
      SELECT DISTINCT f.fabric_name, f.fiber_content, f.mill_id, f.mill_country,
             f.origin_country, f.supplier_id, f.color, f.gsm, f.width_cm, f.certifications
      FROM fabric_specs f
      WHERE f.style_id = $style_id
      ORDER BY f.fabric_name
    example: {style_id: "STY-5520"}

  - name: get_fabric_specs_from_materials_library
    desc: Return fabric specs from materials library.
    kind: select
    from: fabric_specs
    filters:
      fabric_spec_id: {}
      style_id: {}
      material_id: {}
    order: fabric_name
    example: {style_id: "STY-5520"}

  - name: get_material_batch_traceability
    desc: Upstream and downstream batch traceability
    kind: sql
    args:
      batch_id: {required: true}
    sql: |
      SELECT mb.batch_id, mb.material_id, ml.name AS material_name,
             mb.supplier_id, s.name AS supplier_name, mb.factory_id, f.name AS factory_name,
             mb.batch_date, mb.quantity_kg, mb.color_lot, mb.dye_house,
             mb.test_status, mb.test_date, mb.traceability_notes,
             mb.used_in_skus AS products_using_batch
      FROM material_batches mb
      LEFT JOIN material_library ml ON ml.material_id = mb.material_id
      LEFT JOIN master.suppliers s ON s.supplier_id = mb.supplier_id
      LEFT JOIN master.factories f ON f.factory_id = mb.factory_id
      WHERE mb.batch_id = $batch_id
    example: {batch_id: "BATCH-LEATHER-002"}

  - name: get_material_batches_for_product
    desc: Material batches used by a product
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT DISTINCT mb.batch_id, mb.material_id, ml.name AS material_name,
             mb.supplier_id, s.name AS supplier_name, mb.factory_id,
             mb.batch_date, mb.quantity_kg, mb.test_status, mb.dye_house, mb.color_lot
      FROM material_batches mb
      JOIN material_library ml ON ml.material_id = mb.material_id
      LEFT JOIN master.suppliers s ON s.supplier_id = mb.supplier_id
      WHERE mb.used_in_skus LIKE '%' || $sku || '%'
      ORDER BY mb.batch_date DESC
    limit: 50
    example: {sku: SKU-SHOE-SOLE}

  - name: get_material_readiness_level
    desc: Return material readiness level and status for production capability assessment.
    kind: select
    from: material_library
    filters:
      material_id: {}
      readiness_level: {}
    columns: [material_id, name, readiness_level, fiber_content, supplier_id, lead_time_days, compliance_status]
    example: {readiness_level: production}

  - name: get_material_specs
    desc: Return material specs including composition, weight and properties for sourcing.
    kind: select
    from: material_library
    filters:
      material_id: {}
      name: {op: like}
      material_type: {}
      supplier_id: {}
    columns: [material_id, name, material_type, fiber_content, gsm, width_cm, mill_id, color, certifications, sustainability_score]
    order: name
    example: {name: polyester}

  - name: get_product_batch_and_factory_for_sku
    desc: Batches, factory and production dates for a SKU
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT p.sku, p.name, p.factory_id, f.name AS factory_name, f.country,
             mb.batch_id, mb.material_id, ml.name AS material_name,
             mb.batch_date, mb.quantity_kg, mb.test_status
      FROM product_tech_pack p
      LEFT JOIN master.factories f ON f.factory_id = p.factory_id
      LEFT JOIN bill_of_materials b ON b.sku = p.sku
      LEFT JOIN material_batches mb ON mb.material_id LIKE b.component_id || '%'
      LEFT JOIN material_library ml ON ml.material_id = mb.material_id
      WHERE p.sku = $sku
      ORDER BY mb.batch_date DESC
    limit: 50
    example: {sku: "PF-220"}

  - name: get_product_bill_of_materials
    desc: Product materials and composition
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT b.sku, b.line_no, b.component_type, b.component_name, b.material_name,
             b.quantity, b.unit, b.unit_cost_gbp, b.notes
      FROM bill_of_materials b
      WHERE b.sku = $sku
      ORDER BY b.line_no
    example: {sku: K-1700}

  - name: get_product_bom_and_cost_breakdown
    desc: BOM and cost breakdown showing component costs and contribution to total
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT b.line_no, b.component_type, b.component_name, b.material_name,
             b.quantity, b.unit, b.unit_cost_gbp,
             ROUND(b.quantity * b.unit_cost_gbp, 2) AS line_cost_gbp,
             ROUND(100.0 * b.quantity * b.unit_cost_gbp / SUM(b.quantity * b.unit_cost_gbp) OVER(), 1) AS pct_of_total
      FROM bill_of_materials b
      WHERE b.sku = $sku
      ORDER BY line_cost_gbp DESC
    example: {sku: K-1700}

  - name: get_product_design_attributes
    desc: Return product design attributes and features for performance analysis.
    kind: select
    from: product_tech_pack
    filters:
      sku: {}
      category: {}
      department: {}
    columns: [sku, name, color, main_material, design_attributes, status]
    example: {sku: SKU-JEANS}
