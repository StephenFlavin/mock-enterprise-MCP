  - name: remove_carrier_from_lane_allocation
    desc: "Removes a carrier from a lane's allocation."
    kind: update
    table: carriers_lanes
    set: {status: blocked}
    args: []
    example: {carrier_id: "CAR-003", lane: "DC1-ST214"}

  - name: run_tender_award_scenario
    desc: "Reallocates road volume after a tender: exited carriers' shipments move to the others pro rata; returns cost and on-time."
    kind: sql
    args:
      exit_carrier_ids: {type: list, required: true, desc: "Carriers to exit, e.g. CAR-003"}
      period_start: {type: date, default: "-90d", desc: "Volume and performance basis"}
    sql: |
      WITH b AS (
        SELECT cp.carrier_id, SUM(cp.shipments_count) AS shipments, SUM(cp.total_cost_gbp) AS cost,
               100.0 * SUM(cp.on_time_count) / SUM(cp.shipments_count) AS on_time
        FROM carrier_performance cp WHERE cp.period_start >= CAST($period_start AS DATE) GROUP BY 1),
      k AS (SELECT * FROM b WHERE NOT list_contains($exit_carrier_ids, carrier_id)),
      mv AS (SELECT COALESCE(SUM(shipments), 0) AS moved FROM b WHERE list_contains($exit_carrier_ids, carrier_id)),
      r AS (
        SELECT k.carrier_id, k.shipments AS current_shipments,
               ROUND(k.shipments + mv.moved * k.shipments / (SELECT SUM(shipments) FROM k), 0) AS scenario_shipments,
               ROUND(k.on_time, 1) AS on_time_pct, ROUND(k.cost / k.shipments, 0) AS cost_per_shipment_gbp
        FROM k, mv)
      SELECT r.carrier_id, c.name AS carrier, r.current_shipments, r.scenario_shipments, r.on_time_pct, r.cost_per_shipment_gbp FROM r
      LEFT JOIN master.carriers c USING (carrier_id)
      UNION ALL
      SELECT 'TOTAL', 'before: ' || ROUND((SELECT SUM(cost) FROM b), 0) || ' GBP, ' || ROUND((SELECT SUM(on_time * shipments) / SUM(shipments) FROM b), 1) || '% on time',
             (SELECT SUM(shipments) FROM b), SUM(scenario_shipments), ROUND(SUM(on_time_pct * scenario_shipments) / SUM(scenario_shipments), 1),
             ROUND(SUM(cost_per_shipment_gbp * scenario_shipments) / SUM(scenario_shipments), 0) FROM r
      ORDER BY 1
    limit: 20
    example: {exit_carrier_ids: "CAR-003"}

  - name: get_shipment_volumes_by_lane
    desc: "Shipment volumes by lane and carrier over a period."
    kind: sql
    args:
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT s.lane, s.carrier_id, c.name AS carrier_name,
             COUNT(*) AS shipments,
             SUM(s.units) AS total_units,
             SUM(s.pallets) AS total_pallets,
             ROUND(SUM(s.freight_cost_gbp), 2) AS total_cost_gbp
      FROM shipments s
      LEFT JOIN master.carriers c ON c.carrier_id = s.carrier_id
      WHERE s.actual_departure >= CAST($period_start AS DATE)
      GROUP BY s.lane, s.carrier_id, c.name
      ORDER BY total_cost_gbp DESC
    limit: 200
    example: {}

  - name: get_contracted_capacity_by_lane
    desc: "Contracted carrier capacity by lane and week."
    kind: select
    from: carriers_lanes
    filters:
      lane: {desc: "Lane code, blank for all"}
      status: {default: active, desc: "Allocation status"}
    columns: [lane, carrier_id, mode, weekly_capacity_trips, weekly_capacity_pallets, rate_per_trip_gbp]
    order: lane
    limit: 100
    example: {lane: "DC1-ST001"}

  - name: get_load_volumes_by_lane
    desc: Historic shipments, pallets and delivery windows for one or more lanes over recent weeks, with weekly averages.
    kind: sql
    args:
      lanes: {type: list, required: true, desc: "Lane codes, e.g. DC1-ST150,DC1-ST151"}
      weeks_back: {type: int, default: 13, desc: "Number of weeks to analyse"}
    sql: |
      SELECT s.lane, COUNT(*) AS shipments, SUM(s.pallets) AS pallets, SUM(s.units) AS units,
             ROUND(SUM(s.pallets) / $weeks_back, 1) AS avg_pallets_per_week,
             ROUND(AVG(s.fill_rate_pct), 1) AS avg_fill_rate_pct,
             ROUND(SUM(s.freight_cost_gbp), 0) AS freight_cost_gbp,
             'next day, planned arrival date' AS delivery_window
      FROM shipments s
      WHERE list_contains($lanes, s.lane) AND s.actual_departure IS NOT NULL
        AND s.actual_departure >= CAST($as_of AS DATE) - (INTERVAL ($weeks_back) WEEK)
      GROUP BY s.lane
      ORDER BY s.lane
    limit: 60
    example: {lanes: "DC1-ST150,DC1-ST151"}

  - name: get_dwell_time_by_node
    desc: Average weekly dwell hours at ports and DCs for a period, with the change from the earlier period.
    kind: sql
    args:
      node_type: {type: enum, values: [port, hub, depot, dc], desc: "Node type, blank for all"}
      period_start: {type: date, default: "-35d", desc: "Recent period start; compared with the same length before"}
    sql: |
      WITH n AS (SELECT * FROM node_dwell WHERE $node_type IS NULL OR node_type = $node_type)
      SELECT n.node_type, n.node, SUM(n.visits) FILTER (WHERE n.week_start >= CAST($period_start AS DATE) - INTERVAL 6 DAY) AS visits,
             ROUND(AVG(n.avg_dwell_hours) FILTER (WHERE n.week_start >= CAST($period_start AS DATE) - INTERVAL 6 DAY), 1) AS avg_dwell_hours,
             ROUND(AVG(n.avg_dwell_hours) FILTER (WHERE n.week_start < CAST($period_start AS DATE) - INTERVAL 6 DAY), 1) AS earlier_avg_dwell_hours,
             ROUND(AVG(n.avg_dwell_hours) FILTER (WHERE n.week_start >= CAST($period_start AS DATE) - INTERVAL 6 DAY)
                   - AVG(n.avg_dwell_hours) FILTER (WHERE n.week_start < CAST($period_start AS DATE) - INTERVAL 6 DAY), 1) AS change_hours
      FROM n GROUP BY 1, 2 ORDER BY change_hours DESC NULLS LAST
    limit: 30
    example: {}

  - name: get_freight_cost_by_sku
    desc: Inbound freight allocated to SKUs by units on each shipment, with cost per unit and change versus the prior period.
    kind: sql
    args:
      sku: {}
      supplier_id: {}
      period_start: {type: date, default: "-90d", desc: "Analysis period start (prior period is the same length before)"}
      top_n: {type: int, default: 20, desc: "Number of top SKUs by freight cost"}
    sql: |
      WITH a AS (
        SELECT l.sku, p.supplier_id, s.actual_departure, l.units,
               s.freight_cost_gbp * l.units / SUM(l.units) OVER (PARTITION BY l.shipment_id) AS freight
        FROM shipment_lines l JOIN shipments s USING (shipment_id) JOIN master.products p ON p.sku = l.sku
        WHERE s.actual_departure IS NOT NULL AND ($sku IS NULL OR l.sku = $sku) AND ($supplier_id IS NULL OR p.supplier_id = $supplier_id)),
      c AS (SELECT sku, supplier_id, SUM(units) AS units, SUM(freight) AS freight FROM a
            WHERE CAST(actual_departure AS DATE) >= CAST($period_start AS DATE) GROUP BY 1, 2),
      q AS (SELECT sku, SUM(units) AS units, SUM(freight) AS freight FROM a
            WHERE CAST(actual_departure AS DATE) >= CAST($period_start AS DATE) - CAST(CAST($as_of AS DATE) - CAST($period_start AS DATE) AS INTEGER) * INTERVAL 1 DAY
              AND CAST(actual_departure AS DATE) < CAST($period_start AS DATE) GROUP BY 1)
      SELECT c.sku, c.supplier_id, c.units, ROUND(c.freight, 0) AS freight_cost_gbp, ROUND(c.freight / c.units, 3) AS freight_per_unit_gbp,
             ROUND(q.freight / q.units, 3) AS prior_freight_per_unit_gbp,
             ROUND(100.0 * (c.freight / c.units) / (q.freight / q.units) - 100, 1) AS change_pct
      FROM c LEFT JOIN q USING (sku) ORDER BY c.freight DESC
    limit: 50
    example: {}

  - name: get_freight_cost_from_tms
    desc: Freight cost from the transport system by carrier or week for a period, with shipment and unit counts.
    kind: sql
    args:
      group_by: {type: enum, values: [carrier_id, week], default: carrier_id, desc: "Grouping"}
      period_start: {type: date, default: "-28d", desc: "Departures from this date"}
      period_end: {type: date, default: "+0d", desc: "Departures up to this date"}
    sql: |
      SELECT CASE $group_by WHEN 'week' THEN CAST(CAST(date_trunc('week', s.actual_departure) AS DATE) AS VARCHAR) ELSE s.carrier_id END AS grouped_by,
             COUNT(*) AS shipments, SUM(s.units) AS units, ROUND(SUM(s.freight_cost_gbp), 0) AS freight_cost_gbp
      FROM shipments s
      WHERE s.actual_departure IS NOT NULL
        AND CAST(date_trunc('week', s.actual_departure) AS DATE) BETWEEN CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE) AND CAST(date_trunc('week', CAST($period_end AS DATE)) AS DATE)
      GROUP BY 1 ORDER BY freight_cost_gbp DESC
    limit: 60
    example: {}

  - name: get_inland_leg_transit_variance
    desc: Variance of road transit legs versus planned arrival by lane, in days, for a period.
    kind: sql
    args:
      lane: {desc: "Lane code, blank for all"}
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT s.lane, COUNT(*) AS shipments,
             ROUND(AVG(CAST(s.actual_arrival AS DATE) - CAST(s.planned_arrival AS DATE)), 2) AS avg_days_variance,
             ROUND(STDDEV(CAST(s.actual_arrival AS DATE) - CAST(s.planned_arrival AS DATE)), 2) AS stddev_days,
             COUNT(*) FILTER (WHERE CAST(s.actual_arrival AS DATE) <= CAST(s.planned_arrival AS DATE)) AS on_time_count
      FROM shipments s
      WHERE s.mode = 'road' AND s.po_id IS NOT NULL AND s.actual_arrival IS NOT NULL AND ($lane IS NULL OR s.lane = $lane)
        AND s.actual_arrival >= CAST($period_start AS DATE)
      GROUP BY s.lane ORDER BY avg_days_variance DESC
    limit: 50
    example: {}

  - name: get_long_haul_shipments
    desc: "Long-haul shipments by lane: overseas legs or road legs above a distance, with cost per unit."
    kind: sql
    args:
      mode: {type: enum, values: [ocean, air, road, rail], default: ocean, desc: "Transport mode"}
      period_start: {type: date, default: "-90d", desc: "Departures from this date"}
    sql: |
      SELECT s.lane, s.mode, COUNT(*) AS shipments, SUM(s.units) AS units, ROUND(SUM(s.weight_kg), 0) AS weight_kg,
             ROUND(SUM(s.freight_cost_gbp), 0) AS freight_cost_gbp, ROUND(SUM(s.freight_cost_gbp) / SUM(s.units), 3) AS cost_per_unit_gbp
      FROM shipments s
      WHERE s.mode = $mode AND s.actual_departure >= CAST($period_start AS DATE)
      GROUP BY s.lane, s.mode ORDER BY freight_cost_gbp DESC
    limit: 50
    example: {mode: "ocean"}

  - name: get_on_time_delivery_by_account
    desc: On-time delivery and late deliveries by receiving account (store), worst first. TMS holds store deliveries only.
    kind: sql
    args:
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT s.dest_site_id AS account, st.name AS account_name, COUNT(*) AS deliveries,
             COUNT(*) FILTER (WHERE s.delay_minutes IS NULL OR s.delay_minutes <= 0) AS on_time_deliveries,
             ROUND(100.0 * COUNT(*) FILTER (WHERE s.delay_minutes IS NULL OR s.delay_minutes <= 0) / COUNT(*), 1) AS on_time_pct,
             ROUND(AVG(s.delay_minutes) FILTER (WHERE s.delay_minutes > 0), 0) AS avg_delay_minutes_when_late
      FROM shipments s LEFT JOIN master.sites st ON st.site_id = s.dest_site_id
      WHERE s.actual_arrival >= CAST($period_start AS DATE) AND s.origin_site_id LIKE 'DC%' AND s.dest_site_id LIKE 'ST%'
      GROUP BY s.dest_site_id, st.name HAVING COUNT(*) >= 5
      ORDER BY on_time_pct ASC, deliveries DESC
    limit: 50
    example: {}

  - name: get_outbound_transport_cost_by_channel
    desc: Outbound transport cost by channel (stores, online) with cost per unit and per shipment for a period.
    kind: sql
    args:
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT CASE WHEN s.mode = 'parcel' THEN 'online' ELSE 'stores' END AS channel, COUNT(*) AS shipments, SUM(s.units) AS units,
             ROUND(SUM(s.freight_cost_gbp), 0) AS total_cost_gbp, ROUND(SUM(s.freight_cost_gbp) / SUM(s.units), 2) AS cost_per_unit_gbp,
             ROUND(AVG(s.freight_cost_gbp), 2) AS avg_cost_per_shipment_gbp
      FROM shipments s
      WHERE s.origin_site_id LIKE 'DC%' AND s.mode IN ('road', 'parcel') AND s.actual_departure >= CAST($period_start AS DATE)
      GROUP BY 1 ORDER BY total_cost_gbp DESC
    limit: 10
    example: {}

  - name: get_parcel_volumes_by_service
    desc: "Parcel volumes, units and cost per parcel by carrier and service level."
    kind: sql
    args:
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT s.carrier_id, c.name AS carrier_name, s.service_level, COUNT(*) AS parcels, SUM(s.units) AS total_units,
             ROUND(SUM(s.freight_cost_gbp), 2) AS cost_gbp, ROUND(AVG(s.freight_cost_gbp), 2) AS cost_per_parcel_gbp
      FROM shipments s LEFT JOIN master.carriers c ON c.carrier_id = s.carrier_id
      WHERE s.mode = 'parcel' AND s.actual_departure >= CAST($period_start AS DATE)
      GROUP BY s.carrier_id, c.name, s.service_level ORDER BY parcels DESC
    limit: 50
    example: {period_start: "-90d"}
  - name: get_reverse_logistics_cost_by_category
    desc: Returns transport cost, units, cost per unit and net recovery by product category for a period.
    kind: sql
    args:
      category: {desc: "Department, e.g. Womenswear, Home, Electricals; blank for all"}
      period_start: {type: date, default: "-90d", desc: "Period start"}
    sql: |
      SELECT rl.category, SUM(rl.return_units) AS return_units, ROUND(SUM(rl.transport_cost_gbp), 0) AS transport_cost_gbp,
             ROUND(SUM(rl.transport_cost_gbp) / SUM(rl.return_units), 2) AS transport_cost_per_unit_gbp,
             ROUND(SUM(rl.processing_cost_gbp), 0) AS processing_cost_gbp, ROUND(SUM(rl.resale_value_gbp), 0) AS resale_value_gbp,
             ROUND(SUM(rl.resale_value_gbp - rl.transport_cost_gbp - rl.processing_cost_gbp), 0) AS net_recovery_gbp
      FROM reverse_logistics rl
      WHERE ($category IS NULL OR lower(rl.category) = lower($category)) AND rl.period_start >= CAST($period_start AS DATE) - INTERVAL 6 DAY
      GROUP BY rl.category ORDER BY net_recovery_gbp DESC
    limit: 20
    example: {period_start: "-90d"}

  - name: get_store_delivery_cost_by_route
    desc: "Delivery cost per store by origin DC and lane: loads, cost, cost per pallet. Filter by region to compare DCs."
    kind: sql
    args:
      origin_site_id: {desc: "Distribution centre, e.g. DC1"}
      region: {type: str, desc: "Store region, e.g. UK North or Scotland"}
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT s.origin_site_id, s.dest_site_id, st.name AS store, s.lane, COUNT(*) AS shipments_count,
             ROUND(SUM(s.freight_cost_gbp), 2) AS total_cost_gbp, ROUND(AVG(s.freight_cost_gbp), 2) AS avg_cost_per_drop,
             ROUND(SUM(s.freight_cost_gbp) / NULLIF(SUM(s.pallets), 0), 2) AS cost_per_pallet_gbp
      FROM shipments s JOIN master.sites st ON st.site_id = s.dest_site_id
      WHERE s.origin_site_id LIKE 'DC%' AND s.mode = 'road' AND s.dest_site_id LIKE 'ST%'
        AND ($origin_site_id IS NULL OR s.origin_site_id = $origin_site_id) AND ($region IS NULL OR lower(st.region) = lower($region))
        AND s.actual_departure >= CAST($period_start AS DATE)
      GROUP BY s.origin_site_id, s.dest_site_id, st.name, s.lane ORDER BY total_cost_gbp DESC
    limit: 100
    example: {origin_site_id: "DC1", period_start: "-28d"}

  - name: get_tms_freight_cost_by_shipment
    desc: "Freight cost and shipment-to-order links per shipment."
    kind: select
    from: shipments
    filters:
      order_id: {desc: "Order id, blank for all"}
      status: {desc: "Shipment status, blank for all"}
    columns: [shipment_id, order_id, carrier_id, freight_cost_gbp, units, fill_rate_pct]
    order: freight_cost_gbp DESC
    limit: 1000
    example: {}

  - name: get_transport_spend_by_lane
    desc: "Transport cost and volume by lane and mode."
    kind: sql
    args:
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT s.lane, s.mode,
             COUNT(*) AS shipments,
             SUM(s.units) AS units,
             SUM(s.pallets) AS pallets,
             ROUND(SUM(s.freight_cost_gbp), 2) AS cost_gbp,
             ROUND(SUM(s.freight_cost_gbp) / NULLIF(SUM(s.pallets), 0), 2) AS cost_per_pallet_gbp
      FROM shipments s
      WHERE s.actual_departure >= CAST($period_start AS DATE)
      GROUP BY s.lane, s.mode
      ORDER BY cost_gbp DESC
    limit: 200
    example: {}

  - name: get_carrier_scorecard
    desc: "Carrier scorecard for a period: on-time, fill rate, cost per shipment, incidents and claims net of recovery."
    kind: sql
    args:
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      WITH p AS (
        SELECT carrier_id, ROUND(100.0 * SUM(on_time_count) / SUM(shipments_count), 1) AS on_time_pct, ROUND(AVG(fill_rate_avg_pct), 1) AS fill_rate_pct,
               ROUND(SUM(total_cost_gbp) / SUM(shipments_count), 0) AS cost_per_shipment_gbp, SUM(shipments_count) AS shipments
        FROM carrier_performance WHERE period_start >= CAST($period_start AS DATE) - INTERVAL 6 DAY GROUP BY 1),
      i AS (
        SELECT carrier_id, COUNT(*) AS incidents, ROUND(SUM(claim_value_gbp - recovery_value_gbp + extra_cost_gbp), 0) AS incident_cost_gbp
        FROM carrier_incidents WHERE incident_date >= CAST($period_start AS DATE) GROUP BY 1)
      SELECT p.carrier_id, c.name AS carrier_name, p.shipments, p.on_time_pct, p.fill_rate_pct, p.cost_per_shipment_gbp,
             COALESCE(i.incidents, 0) AS incidents, COALESCE(i.incident_cost_gbp, 0) AS incident_cost_gbp
      FROM p LEFT JOIN i USING (carrier_id) LEFT JOIN master.carriers c ON c.carrier_id = p.carrier_id ORDER BY p.on_time_pct DESC
    limit: 50
    example: {}

  - name: get_carrier_spend_and_volume
    desc: "Carrier spend and volume over a period."
    kind: sql
    args:
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT s.carrier_id, c.name AS carrier_name,
             COUNT(*) AS shipments,
             SUM(s.units) AS units,
             ROUND(SUM(s.freight_cost_gbp), 2) AS spend_gbp,
             ROUND(SUM(s.freight_cost_gbp) / NULLIF(SUM(s.units), 0), 2) AS cost_per_unit_gbp
      FROM shipments s
      LEFT JOIN master.carriers c ON c.carrier_id = s.carrier_id
      WHERE s.actual_departure >= CAST($period_start AS DATE)
      GROUP BY s.carrier_id, c.name
      ORDER BY spend_gbp DESC
    limit: 100
    example: {}

  - name: get_predicted_vs_actual_arrivals_by_lane
    desc: "Planned versus actual arrival by lane: average days late, share late and early. Use for ETA accuracy."
    kind: sql
    args:
      lane: {desc: "Lane code, e.g. CNSHA-GBFXT; blank for all"}
      mode: {type: enum, values: [ocean, air, road, rail], desc: "Transport mode, blank for all"}
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT s.lane, s.mode, COUNT(*) AS shipments,
             ROUND(AVG(DATEDIFF('day', CAST(s.planned_arrival AS DATE), CAST(s.actual_arrival AS DATE))), 2) AS variance_days,
             ROUND(100.0 * COUNT(*) FILTER (WHERE CAST(s.actual_arrival AS DATE) = CAST(s.planned_arrival AS DATE)) / COUNT(*), 1) AS on_time_pct,
             ROUND(100.0 * COUNT(*) FILTER (WHERE CAST(s.actual_arrival AS DATE) < CAST(s.planned_arrival AS DATE)) / COUNT(*), 1) AS early_pct,
             ROUND(100.0 * COUNT(*) FILTER (WHERE CAST(s.actual_arrival AS DATE) > CAST(s.planned_arrival AS DATE)) / COUNT(*), 1) AS late_pct,
             MAX(lb.planning_buffer_days) AS planning_buffer_days
      FROM shipments s LEFT JOIN lane_buffers lb ON lb.buffer_lane = s.lane
      WHERE s.po_id IS NOT NULL AND s.actual_arrival IS NOT NULL AND ($lane IS NULL OR s.lane = $lane) AND ($mode IS NULL OR s.mode = $mode)
        AND s.actual_arrival >= CAST($period_start AS DATE)
      GROUP BY s.lane, s.mode HAVING COUNT(*) >= 3 ORDER BY variance_days DESC
    limit: 50
    example: {mode: ocean}

  - name: get_prior_peak_capacity_utilisation
    desc: Pallets shipped per lane in last year's peak (Black Friday to Christmas) against today's contracted weekly capacity.
    kind: sql
    args:
      lane: {desc: "Lane code, blank for all"}
      peak_start: {type: date, default: "-315d", desc: "Monday of last year's Black Friday week"}
      weeks: {type: int, default: 5, desc: "Peak weeks to include"}
    sql: |
      WITH w AS (
        SELECT s.lane, CAST(date_trunc('week', s.actual_departure) AS DATE) AS wk, COUNT(*) AS shipments, SUM(s.pallets) AS pallets,
               AVG(s.fill_rate_pct) AS fill
        FROM shipments s
        WHERE s.actual_departure >= CAST($peak_start AS DATE) AND s.actual_departure < CAST($peak_start AS DATE) + (INTERVAL ($weeks) WEEK)
          AND ($lane IS NULL OR s.lane = $lane)
        GROUP BY 1, 2),
      cap AS (SELECT lane, SUM(weekly_capacity_pallets) AS contracted FROM carriers_lanes WHERE status = 'active' GROUP BY 1)
      SELECT w.lane, SUM(w.shipments) AS peak_shipments, SUM(w.pallets) AS peak_pallets, MAX(w.pallets) AS busiest_week_pallets,
             ROUND(AVG(w.fill), 1) AS avg_fill_rate_pct, cap.contracted AS contracted_weekly_pallets,
             ROUND(100.0 * MAX(w.pallets) / cap.contracted, 0) AS utilisation_pct, 'last year peak' AS source
      FROM w LEFT JOIN cap USING (lane) GROUP BY w.lane, cap.contracted ORDER BY utilisation_pct DESC NULLS LAST
    limit: 50
    example: {lane: "DC1-ST214"}

  - name: list_carrier_incidents_for_period
    desc: "Carrier service failures and incidents for a period."
    kind: select
    from: carrier_incidents
    filters:
      carrier_id: {desc: "Carrier id, blank for all"}
      incident_type: {desc: "Incident type, blank for all"}
      incident_date: {op: ">=", type: date, default: "-90d", desc: "Incidents from this date"}
    columns: [incident_id, carrier_id, lane, incident_type, incident_date, claim_value_gbp, status]
    order: incident_date DESC
    limit: 100
    example: {}

  - name: get_carrier_service_failure_costs
    desc: "Cost of carrier service failures by incident type or carrier: claims net of recovery plus extra cost, largest first."
    kind: sql
    args:
      group_by: {type: enum, values: [incident_type, carrier_id], default: incident_type, desc: "Grouping"}
      period_start: {type: date, default: "-365d", desc: "Analysis period start"}
    sql: |
      SELECT CASE $group_by WHEN 'carrier_id' THEN ci.carrier_id ELSE ci.incident_type END AS grouped_by,
             COUNT(*) AS incidents, ROUND(SUM(ci.claim_value_gbp - ci.recovery_value_gbp), 0) AS unrecovered_claims_gbp,
             ROUND(SUM(ci.extra_cost_gbp), 0) AS extra_cost_gbp,
             ROUND(SUM(ci.claim_value_gbp - ci.recovery_value_gbp + ci.extra_cost_gbp), 0) AS total_cost_gbp
      FROM carrier_incidents ci
      WHERE ci.incident_date >= CAST($period_start AS DATE)
      GROUP BY 1 ORDER BY total_cost_gbp DESC
    limit: 30
    example: {}

  - name: search_carriers
    desc: "Find carriers and forwarders by name or mode; returns carrier ids."
    kind: select
    from: master.carriers
    filters:
      name: {op: like, desc: "Carrier name or part of it"}
      mode: {desc: "Transport mode, blank for all"}
    columns: [carrier_id, name, mode, scope, country]
    order: name
    limit: 50
    example: {}

  - name: get_shipments_by_lane_and_mode
    desc: "Shipments by lane and mode to analyze multi-mode routing."
    kind: sql
    args:
      period_start: {type: date, default: "-90d", desc: "Analysis period start"}
    sql: |
      SELECT s.lane, s.mode,
             COUNT(*) AS shipments_count,
             SUM(s.units) AS units,
             ROUND(SUM(s.freight_cost_gbp), 2) AS freight_cost
      FROM shipments s
      WHERE s.actual_departure >= CAST($period_start AS DATE)
      GROUP BY s.lane, s.mode
      ORDER BY freight_cost DESC
    limit: 200
    example: {period_start: "-90d"}

  - name: create_carrier_trial_allocation
    desc: "Creates a trial allocation sending a share of selected lanes' volume to a named carrier."
    kind: insert
    table: allocation_scenarios
    id_prefix: "TRL-"
    defaults: {scenario_type: trial_allocation, status: draft}
    args:
      lanes_affected: {required: true, desc: "Comma-separated lane codes"}
      carriers_involved: {required: true, desc: "Comma-separated carrier ids in allocation"}
      volume_units: {type: int, required: true, desc: "Volume units for trial"}
      share_pct: {type: int, required: true, desc: "Share of the lanes' volume moved in the trial, e.g. 40"}
      description: {required: true, desc: "Scenario description"}
    example: {lanes_affected: "DC1-ST001,DC1-ST002", carriers_involved: "CAR-001", volume_units: 5000, share_pct: 40, description: "Trial with CAR-001"}
