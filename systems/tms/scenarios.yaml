# Stage 1 tools: Test scenarios for the 21 tools

- question: "01:4:Q4"
  story: "User needs inbound shipment details for a specific PO. Seed data includes SHP-900009 and SHP-900010 (ocean freight from Asia) linked to PO-2026-004001 and PO-2026-004003, with carriers CAR-001 through CAR-004, planned/actual arrivals to DC1."
  checks:
    - tool: get_carrier_for_inbound_shipment
      args: {po_id: "PO-2026-004001"}
      expect: ["SHP-900009", "ocean", "delivered"]

- question: "01:6:Q5"
  story: "Late outbound departures analysis showing lanes and delays."
  checks:
    - tool: list_late_outbound_departures
      args: {date_from: "-30d"}
      expect: ["days_late", "carrier"]

- question: "02:11:Q1"
  story: "Lane performance summary shows CAR-007 on DC1-ST214 achieved 94-95% on-time, CAR-008 77-82%, CAR-009 80-85% over last 4 weeks. Cost per shipment averaged 250-270 GBP."
  checks:
    - tool: get_lane_performance_summary
      args: {lane: "DC1-ST214", period_start: "-28d"}
      expect: ["DC1-ST214", "on_time_pct", "fill_rate_avg_pct"]
    - tool: list_shipment_exceptions_by_lane
      args: {status: delayed}
      expect: ["exception_count", "lane"]

- question: "02:11:Q2"
  story: "Lane fill rate trend shows DC1-ST214 averaging 82-89% utilisation over 12 weeks, with variation from 80-96% and weekly costs 3400-5600 GBP."
  checks:
    - tool: get_lane_fill_rate_trend
      args: {lane: "DC1-ST214"}
      expect: ["fill_rate_pct", "weekly_cost_gbp", "period_start"]

- question: "02:11:Q3"
  story: "Plan and route management with carrier reassignment. SHP-900001 originally on CAR-007, can be reassigned to CAR-008. Routes show M62 breach details for hours limits."
  checks:
    - tool: reassign_shipment_to_carrier
      args: {shipment_id: "SHP-900001", carrier_id: "CAR-008", reason: "backup"}
      expect: ["SHP-900001", "CAR-008"]

- question: "02:11:Q4"
  story: "Carrier on-time performance varies by lane and period. CAR-007 leads at 95%, CAR-008 at 77-82%, showing performance opportunity."
  checks:
    - tool: get_carrier_on_time_performance
      args: {lane: "DC1-ST214"}
      expect: ["CAR-007", "95", "CAR-008", "77"]

- question: "02:11:Q5"
  story: "Trial allocation scenario created for lanes DC1-ST214, DC1-ST215 moving volume to CAR-012."
  checks:
    - tool: create_carrier_trial_allocation
      args: {lanes_affected: "DC1-ST214,DC1-ST215", carriers_involved: "CAR-012", volume_units: 4000, description: "Trial with CAR-012"}
      expect: ["trial_allocation", "draft"]

- question: "01:8:Q5"
