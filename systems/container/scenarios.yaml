# One entry per question row that uses this system's tools
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string

- question: "02:12:Q4"
  story: >
    Rotterdam (NLRTM) is congested with a 132 hour berth wait and 14 vessels at anchor; Hamburg (DEHAM) is the
    overspill port with a 46 hour wait. Every other port waits under 45 hours.
  checks:
    - tool: get_port_congestion_status
      args: {region: "Northern Europe"}
      expect: ["Rotterdam", "132", "Hamburg", "46"]

- question: "02:12:Q6"
  story: >
    Valencia (ESVLC) and Piraeus (GRPIR) are open with waits of 6 and 10 hours. The Valencia to Daventry (DIRFT)
    rail leg runs 82.6% on time, Piraeus to DIRFT only 64.7%. Via Rotterdam the Asia-UK lane averages 4.9 days late,
    via Valencia plus rail 0.9 days.
  checks:
    - tool: get_port_congestion_status
      args: {region: "Southern Europe"}
      expect: ["ESVLC", "GRPIR", "6", "10"]
    - tool: get_rail_leg_reliability
      args: {destination_port: "DIRFT"}
      expect: ["82.6", "64.7"]
    - tool: get_transit_time_history_by_route
      args: {route_code: "Asia-UK"}
      expect: ["NLRTM", "4.9", "ESVLC", "0.9"]

- question: "02:19:Q2"
  story: >
    Next two weeks: Rotterdam congestion until the 19th, a 48 hour Hamburg dockworker strike and a typhoon
    forecast for Yantian (CNYTN). Vessel CONT-VESSEL-900001 (140 containers) is anchored at Rotterdam. Past weather
    events at East Asian ports lasted 3 to 4 days and added 3.5 to 5.5 days of lead time.
  checks:
    - tool: get_port_status_and_congestion
      args: {days_ahead: 14}
      expect: ["NLRTM", "DEHAM", "strike", "CNYTN", "Typhoon"]
    - tool: list_vessels_and_containers_in_transit
      args: {eta_to: "+14d"}
      expect: ["CONT-VESSEL-900001", "anchored", "140"]
    - tool: get_container_value
      args: {vessel_id: "CONT-VESSEL-900001"}
      expect: ["CONT-000037", "50102"]
    - tool: get_historical_disruption_durations
      args: {event_type: "weather", region: "East Asia"}
      expect: ["CNYTN", "CNSHA"]
    - tool: get_historical_weather_disruption_lead_times
      args: {region: "East Asia"}
      expect: ["5.5", "3.5"]

- question: "02:19:Q3"
  story: >
    CONT-VESSEL-900001 has been anchored at Rotterdam for 6 days with no berth ETA and carries 140 real Asia-UK
    containers (about £2.9m). Waiting 10 more days costs £91,000 (14 days to delivery), transshipping £109,200
    (7 days), flying 30% of units £105,120 (2 days). The last Rotterdam congestion event (DISR-000011) cost £172,860.
  checks:
    - tool: get_vessel_position_and_status
      args: {vessel_id: "CONT-VESSEL-900001"}
      expect: ["anchored", "NLRTM", "140"]
    - tool: list_containers_on_vessel
      args: {vessel_id: "CONT-VESSEL-900001"}
      expect: ["CONT-000037", "NLRTM", "DC1"]
    - tool: get_container_sku_contents
      args: {container_id: "CONT-000037"}
      expect: ["SKU-101498", "860", "Ivory Audio"]
    - tool: calculate_option_cost_and_service_impact
      args: {vessel_id: "CONT-VESSEL-900001", delay_days: 10}
      expect: ["91000", "109200", "105120"]
    - tool: get_past_disruption_costs
      args: {event_type: "congestion", affected_port: "NLRTM"}
      expect: ["172860", "63720", "demurrage"]

- question: "02:19:Q4"
  story: >
    Asia-UK carrier ETAs: Pacific Star Shipping (CAR-006) is only 30.2% within a day and on average 37 hours
    late, Meridian 73%, Oceanic 89.8%. Rotterdam dwell climbed from about 38 hours to 94 hours over eight weeks.
  checks:
    - tool: get_carrier_eta_update_accuracy
      args: {route: "Asia-UK"}
      expect: ["Pacific Star Shipping", "30.2", "42.7"]
    - tool: get_port_dwell_time_history
      args: {port_code: "NLRTM"}
      expect: ["94.3", "high"]

- question: "02:19:Q5"
  story: >
    180 containers route through Rotterdam: the 140 on the anchored vessel (transshipping to UK DCs) plus 40
    discharging for DC4, worth about £3.76m in total across DC1 to DC4.
  checks:
    - tool: list_inbound_containers_via_port
      args: {port_code: "NLRTM"}
      expect: ["180", "DC1", "DC4", "CONT-VESSEL-900001"]

- question: "05:50:Q1"
  story: >
    Exposed ports are Rotterdam (congested), Hamburg (strike notified), Yantian (typhoon forecast) and Nhava Sheva
    (Red Sea advisory). SHP-0000114 (INNSA via Hamburg to DC1, £1.08m) is the most valuable exposed shipment.
  checks:
    - tool: list_shipments_through_affected_ports
      args: {}
      expect: ["SHP-0000114", "1081330", "NLRTM", "DEHAM", "CNYTN"]
    - tool: get_port_exposure_by_region
      args: {region: "Asia"}
      expect: ["VNSGN", "CNYTN", "INNSA"]

- question: "05:50:Q2"
  story: >
    114 containers (14 shipments) load at Ho Chi Minh City (VNSGN), worth about £2.78m, mostly for DC1; the largest
    is SHP-0000709 (£651,706). 41 SKUs are on the water from VNSGN, the biggest lines 5000 units each.
  checks:
    - tool: list_shipments_through_port
      args: {port_code: "VNSGN"}
      expect: ["SHP-0000709", "651706", "DC1"]
    - tool: get_in_transit_inventory_by_sku
      args: {port_code: "VNSGN"}
      expect: ["SKU-101246", "5000"]

- question: "05:50:Q7"
  story: >
    Past typhoons and cyclones added 5.5 days (Yantian), 6 days (Ho Chi Minh City), 5 days (Chittagong) of lead time.
    In-flight containers load mainly at VNSGN (114), INNSA (111) and CNYTN (97).
  checks:
    - tool: get_port_exposure_by_region
      args: {region: "Asia"}
      expect: ["VNSGN", "114", "CNYTN", "97"]
    - tool: get_historical_weather_disruption_lead_times
      args: {}
      expect: ["VNSGN", "5.5", "BDCGP"]
