# One entry per question row that uses this system's tools
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string

- question: "02:12:Q4"
  story: >
    Rolled bookings analysis for Asia–Europe freight. The system tracks port congestion
    and carrier performance. Rotterdam is severely congested with 12 vessels waiting.
    Multiple containers are delayed due to port congestion impacts.
  checks:
    - tool: get_port_congestion_status
      args: {port_code: "ROT"}
      expect: ["Rotterdam", "high", "36", "12"]

- question: "02:12:Q6"
  story: >
    Northern European port congestion vs alternative routes through Southern Europe and rail.
    Rotterdam shows high congestion vs Valencia which is open with low wait times.
    Rail reliability from Valencia to Hamburg shows 80% on-time performance.
  checks:
    - tool: get_port_congestion_status
      args: {port_code: "ROT"}
      expect: ["congested", "high"]
    - tool: get_port_congestion_status
      args: {port_code: "VAL"}
      expect: ["open", "low"]
    - tool: get_rail_leg_reliability
      args: {origin_port: "VAL"}
      expect: ["80", "VAL"]

- question: "02:19:Q2"
  story: >
    Control tower risk assessment. Vessel CONT-VESSEL-900001 is anchored at Rotterdam with
    140 containers waiting for berth. The port shows high congestion. High-value containers
    include PF-220 units worth up to 25,500 GBP. A weather disruption affected Rotterdam
    from Oct 1-6 lasting 5 days.
  checks:
    - tool: list_vessels_and_containers_in_transit
      args: {}
      expect: ["CONT-VESSEL-900001", "anchored", "140"]
    - tool: get_port_status_and_congestion
      args: {port_code: "ROT"}
      expect: ["high", "congested"]
    - tool: get_vessel_position_and_status
      args: {vessel_id: "CONT-VESSEL-900001"}
      expect: ["anchored", "ROT"]
    - tool: get_historical_disruption_durations
      args: {event_type: "weather"}
      expect: ["weather", "Rotterdam"]

- question: "02:19:Q3"
  story: >
    Vessel CONT-VESSEL-900001 is anchored at Rotterdam with 140 containers. Container CONT-900001
    carries 250 units of PF-220 (value 21,250 GBP) plus other SKUs totaling 45,000 GBP.
    Previous disruption costs show demurrage averaging 600 GBP per container. Analysis shows
    air freight option costs approximately 35% of container value (15,750 GBP for CONT-900001).
  checks:
    - tool: list_containers_on_vessel
      args: {vessel_id: "CONT-VESSEL-900001"}
      expect: ["CONT-900001", "140", "at_port"]
    - tool: get_container_sku_contents
      args: {container_id: "CONT-900001"}
      expect: ["PF-220", "250", "21250"]
    - tool: get_container_value
      args: {container_id: "CONT-900001"}
      expect: ["45000"]
    - tool: get_past_disruption_costs
      args: {}
      expect: ["demurrage", "600"]
    - tool: calculate_option_cost_and_service_impact
      args: {container_id: "CONT-900001", option_type: "air"}
      expect: ["air", "45000"]

- question: "02:19:Q4"
  story: >
    ETA accuracy analysis for Asia-UK lane. Historical predictions show carrier ETAs consistently
    20-30 hours late. Route Asia-UK had 9 transits tracked with average 3-day delays.
    Predictions made on 2026-09-20 for CONT-VESSEL-900001 estimated Oct 8, 12:00 which
    matched actual arrival perfectly.
  checks:
    - tool: get_carrier_eta_update_accuracy
      args: {route: "Asia-UK"}
      expect: ["Asia-UK"]
    - tool: get_transit_time_history_by_route
      args: {route_code: "China-Europe"}
      expect: ["China-Europe", "4.0"]

- question: "02:19:Q5"
  story: >
    Port closure scenario: HCM closure from Oct 5-11 affects multiple containers routed through
    that port. 45 containers are affected by the closure. Containers through HCM destined for
    DC1 include shipments with high-value electronics. The closure lasts 6 days.
  checks:
    - tool: list_inbound_containers_via_port
      args: {port_code: "HCM"}
      expect: ["HCM"]
    - tool: get_historical_disruption_durations
      args: {event_type: "closure", region: "Southeast Asia"}
      expect: ["closure", "6"]

- question: "05:50:Q1"
  story: >
    Weekly supply chain risk briefing. Current disruptions: HCM port closure, ROT congestion,
    SIN strike. Shipments affected through these ports include DC1 and DC2 inbound containers.
    Region exposure shows Southeast Asia disruptions affecting 45-52 containers with
    Northern Europe congestion affecting 28-35 containers.
  checks:
    - tool: list_shipments_through_affected_ports
      args: {}
      expect: ["closed", "congested"]
    - tool: get_port_exposure_by_region
      args: {}
      expect: ["Southeast Asia"]

- question: "05:50:Q2"
  story: >
    Port closure impact scenario: HCM closure 6 weeks. 45 containers affected. Average container
    value 42,000 GBP. High-value SKUs include PF-220 (portable fans), K-1700 (kettles),
    STY-5520 (garments). In-transit inventory shows 250-500 units per SKU across affected containers.
    Rail alternative via VAL shows 80% reliability.
  checks:
    - tool: list_shipments_through_port
      args: {port_code: "HCM"}
      expect: ["HCM"]
    - tool: get_in_transit_inventory_by_sku
      args: {sku: "PF-220"}
      expect: ["PF-220"]
    - tool: get_rail_leg_reliability
      args: {origin_port: "VAL"}
      expect: ["80"]

- question: "05:50:Q7"
  story: >
    Weather impact on production peak. Historical weather disruption in Southeast Asia (Oct 5 typhoon)
    lasted 6 days affecting 45 containers. Similar events show average 4-day route delays.
    Port exposure by region shows Southeast Asia has highest concentration with 52 containers
    at Singapore facing strike disruptions. Rail alternative reliability shows 80% on-time
    for Valencia route.
  checks:
    - tool: get_port_exposure_by_region
      args: {}
      expect: ["Southeast Asia"]
    - tool: get_historical_weather_disruption_lead_times
      args: {region: "Southeast Asia"}
      expect: ["weather"]
    - tool: get_rail_leg_reliability
      args: {origin_port: "VAL"}
      expect: ["80"]
