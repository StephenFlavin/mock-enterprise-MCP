- question: "04:40:Q1"
  story: >
    Packaging buyer needs to compare three materials for small-appliance packaging (corrugated, moulded pulp, recycled plastic).
    We seeded samples for PF-220 (portable fan) in all three materials: SAM-900001 (corrugated), SAM-900002 (moulded pulp),
    and SAM-900003 (recycled plastic), all received and approved in early September.
    The buyer will raise a sample request for the chosen material.
  checks:
    - tool: list_launch_products_by_season
      args: {season: "SS27"}
      expect: ["PRD-900002", "critical", "at_risk"]
    - tool: create_sample_request
      args: {sku: "PF-220", style_id: "STY-PF-220", supplier_id: "SUP-0013", required_by_date: "+21d", pack_material: "corrugated"}
      expect: ["SAM-", "requested"]

- question: "06:51:Q1"
  story: >
    New product developer is chasing spring (SS27) launches at risk. We seeded two critical spring products:
    STY-K-1700 (kettle, planned 2026-03-01, high risk) and STY-PF-220 (small appliance pack, planned 2026-02-15, critical risk).
    Both have delayed milestones and open sample approvals showing delays from suppliers.
    The developer will check critical path milestones and sample approval status, then draft a launch meeting update.
  checks:
    - tool: list_launch_products_by_season
      args: {season: "SS27", status: "at_risk"}
      expect: ["PRD-900001", "PRD-900002", "critical"]
    - tool: get_critical_path_milestones_for_product
      args: {style_id: "STY-K-1700"}
      expect: ["MLS-900003", "delayed", "factory_commitment"]
    - tool: get_sample_approval_status_for_product
      args: {sku: "K-1700"}
      expect: ["pending"]
    - tool: draft_launch_meeting_update
      args: {style_id: "STY-K-1700"}
      expect: ["SS27", "at_risk"]

- question: "06:51:Q4"
  story: >
    Technical team is reviewing a backpack (STY-4012) sample that failed zip pull strength test.
    We seeded the backpack with three sample rounds: Round 1 rejected (zip pull failure), Round 2 also rejected (same failure),
    and Round 3 currently submitted and pending (RND-900003, RND-900004, RND-900005).
    The team will reject the current round and request resubmission from the factory.
  checks:
    - tool: list_launch_products_by_season
      args: {season: "SS27"}
      expect: ["PRD-900002", "critical"]
    - tool: reject_sample_for_style
      args: {round_id: "RND-900005", rejection_reason: "Zip pull strength test failed again"}
      expect: ["rejected"]

- question: "06:53:Q5"
  story: >
    Technical designer is tracking open fit comments. We seeded multiple styles with open fit feedback:
    STY-5520 (sleeve length and waist seam comments), STY-BKP-001 (shoulder point comment) both with open comments
    and deadlines in early/mid October (around 2-3 weeks out from 2026-10-07).
    The designer will check open fit comments and sample deadlines for the next two weeks.
  checks:
    - tool: list_styles_with_open_fit_comments
      args: {}
      expect: ["STY-5520", "STY-BKP-001", "open"]
    - tool: get_sample_deadlines_by_style
      args: {days_ahead: 14}
      expect: ["STY-BKP-001", "RND-900005"]

- question: "06:54:Q4"
  story: >
    Product manager is assessing launch readiness for the product pipeline.
    We seeded launch readiness signals for STY-5520 and STY-PKG-001 showing mixed signals:
    STY-5520 has moderate trend validation (0.75) and demand signal (0.65) but supplier risk (0.45).
    STY-PKG-001 shows strong trend validation (0.85) and demand (0.70) but sourcing constraints (0.60).
    The manager will pull readiness signals to predict sales and identify risks.
  checks:
    - tool: get_launch_readiness_signals_for_product
      args: {style_id: "STY-5520"}
      expect: ["trend_validation", "demand_signal", "0.75"]
    - tool: get_launch_readiness_signals_for_product
      args: {style_id: "STY-PKG-001"}
      expect: ["trend_validation", "0.85"]

- question: "06:56:Q4"
  story: >
    Trend analyst is picking three trends to act on and needs lead times to plan test orders.
    We seeded lead times by category: Bedding (49-63 days), Womenswear (52-59 days), Home (45-52 days).
    The analyst will check lead times for planning test orders and then create test order requests
    for the trends they approve (e.g., a test order for a home trend).
  checks:
    - tool: get_standard_lead_times_by_category
      args: {category: "Bedding"}
      expect: ["49", "56"]
    - tool: create_test_order_request
      args: {sku: "K-1700", style_id: "STY-7731", volume_units: 500, purpose: "trend_validation"}
      expect: ["TST-", "requested"]
