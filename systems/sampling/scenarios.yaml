- question: "04:40:Q1"
  story: >
    The packaging buyer compares corrugated, moulded pulp and recycled plastic for small-appliance packaging.
    Pack samples for K-1700 (1.7L kettle, STY-K-1700, supplier SUP-0013, factory FAC-0027) were received in all
    three materials (SAM-900001 to SAM-900003). The buyer raises a sample request for the chosen pack.
  checks:
    - tool: create_sample_request
      args: {sku: "K-1700", style_id: "STY-K-1700", supplier_id: "SUP-0013", factory_id: "FAC-0027", pack_material: "moulded_pulp", required_by_date: "+21d"}
      expect: ["SAM-", "requested", "moulded_pulp", "FAC-0027"]

- question: "06:51:Q1"
  story: >
    SS27 (spring 2027) pipeline has three at-risk launches. STY-4578 is supplier driven (factory commitment overdue,
    no open approval), STY-6227 is held up by our own overdue sample approval, and STY-8286 had a late sample
    submission and is awaiting approval. STY-4012 and STY-8975 are on track.
  checks:
    - tool: list_launch_products_by_season
      args: {season: "SS27", status: "at_risk"}
      expect: ["PRD-900001", "PRD-900002", "PRD-900003", "critical"]
    - tool: list_launch_products_by_season
      args: {season: "SS27", status: "at_risk", open_approvals_only: true}
      expect: ["STY-6227", "STY-8286"]
    - tool: get_critical_path_milestones_for_product
      args: {style_id: "STY-4578"}
      expect: ["MLS-900003", "factory_commitment", "supplier"]
    - tool: get_critical_path_milestones_for_product
      args: {style_id: "STY-6227"}
      expect: ["MLS-900007", "sample_approval", "internal"]
    - tool: get_sample_approval_status_for_product
      args: {sku: "SKU-103115"}
      expect: ["RND-900003", "pending"]
    - tool: draft_launch_meeting_update
      args: {season: "SS27"}
      expect: ["STY-4578", "STY-6227", "STY-8286", "overdue"]

- question: "06:51:Q4"
  story: >
    The new backpack (master style STY-9509, SKU-106363 Black Backpack, SUP-0021, FAC-0041) failed zip pull strength in
    round 1 (RND-900007) and round 2 (RND-900008), both rejected, and again in round 3 (RND-900009, submitted, pending; the lab
    measured 126 N against 140 N). The developer rejects round 3 and asks the factory to resubmit.
  checks:
    - tool: get_sample_approval_status_for_product
      args: {sku: "SKU-106363"}
      expect: ["RND-900009", "RND-900008", "RND-900007", "Zip pull strength test failed", "SUP-0021"]
    - tool: reject_sample_for_style
      args: {round_id: "RND-900009", rejection_reason: "Zip pull strength test failed again"}
      expect: ["rejected", "resubmission_requested"]
    - tool: get_sample_approval_status_for_product
      args: {sku: "SKU-106363"}
      expect: ["Zip pull strength test failed again"]

- question: "06:53:Q5"
  story: >
    Four SS27 styles have open fit comments: STY-6227 (2 comments, deadline in 3 days, not yet submitted), STY-8286
    (deadline in 7 days, submitted awaiting approval), STY-4012 (deadline in 9 days, not yet submitted) and STY-8975
    (deadline over three weeks away, so outside a two-week window).
  checks:
    - tool: list_styles_with_open_fit_comments
      args: {}
      expect: ["STY-6227", "STY-8286", "STY-4012", "STY-8975", "Cooper Trading"]
    - tool: list_styles_with_open_fit_comments
      args: {deadline_within_days: 14}
      expect: ["STY-6227", "STY-4012"]
    - tool: get_sample_deadlines_by_style
      args: {days_ahead: 14}
      expect: ["RND-900003", "RND-900004", "RND-900005", "not yet submitted"]

- question: "06:54:Q4"
  story: >
    Launch readiness signals for the SS27 pipeline. STY-8724 (SKU-105005 Rust Lighting, the riskiest item of the demand pipeline,
    risk score 80) is the riskiest: supplier_risk climbed 0.62, 0.80, 0.93 from 34 weeks before launch, so the warning was visible
    months early. STY-4578 has a late factory commitment (supplier_risk 0.88); other styles have low risk signals.
  checks:
    - tool: get_launch_readiness_signals_for_product
      args: {style_id: "STY-8724"}
      expect: ["SIG-900104", "0.93", "higher = riskier"]
    - tool: get_launch_readiness_signals_for_product
      args: {season: "SS27", signal_type: "supplier_risk"}
      expect: ["STY-8724", "STY-4578", "STY-8286", "STY-8975"]

- question: "06:56:Q4"
  story: >
    Standard lead times are derived from master product lead times per category and supplier. For the home range,
    Storage has a 45 day median against 56 for Lighting. The analyst then raises a test order for storage SKU-104564.
  checks:
    - tool: get_standard_lead_times_by_category
      args: {category: "Storage"}
      expect: ["SUP-0025", "45", "14"]
    - tool: get_standard_lead_times_by_category
      args: {department: "Home"}
      expect: ["Lighting", "Storage", "Towels"]
    - tool: create_test_order_request
      args: {sku: "SKU-104564", style_id: "STY-8491", volume_units: 500, purpose: "trend_validation"}
      expect: ["TST-", "requested", "500"]
