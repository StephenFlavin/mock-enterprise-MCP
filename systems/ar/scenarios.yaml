# One entry per question row that uses this system's tools (see: python -m mockmcp brief ar).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "07:65:Q1"
  story: >
    Hartley & Reed Ltd (CUS-900001) is a reliable wholesale customer with strong payment history (95-98% on-time).
    Current balance £150k against £200k credit limit. Recent invoices (INV-2026-900002, INV-2026-900003) were paid on time
    (62-day average). Credit score 72, no active disputes. They have credit insurance cover (INS-900001, £200k via Atradius).
    Credit recommendation is to maintain or increase the limit.
  checks:
    - tool: get_customer_account_summary
      args: {customer_id: CUS-900001}
      expect: ["CUS-900001", "72", "medium", "150000", "200000"]
    - tool: get_customer_payment_history
      args: {customer_id: CUS-900001, months: 12}
      expect: ["CUS-900001", "95", "125000"]
    - tool: get_credit_insurance_cover
      args: {customer_id: CUS-900001}
      expect: ["INS-900001", "Atradius", "200000", "90"]
    - tool: calculate_credit_limit_recommendation
      args: {customer_id: CUS-900001}
      expect: ["CUS-900001", "200000", "Maintain"]

- question: "07:65:Q2"
  story: >
    Invoice INV-2026-900001 (£480k for CUS-900002) is in dispute on hold: dispute reason is "Pricing discrepancy -
    invoice shows £480k but PO was £420k" (60k overage). Placed on dispute hold 2026-10-05. Need to examine invoice
    lines and determine fair settlement. The invoice details show Textiles - Batch X1024 at £240/unit for 2000 units.
  checks:
    - tool: get_sales_order_and_invoice
      args: {invoice_id: INV-2026-900001}
      expect: ["INV-2026-900001", "480000", "Textiles", "disputed", "on_hold"]
    - tool: list_overdue_invoices
      args: {min_days_overdue: 1}
      expect: ["INV-2026-900001", "480000", "on_hold"]
    - tool: update_invoice_dispute_status
      args: {invoice_id: INV-2026-900001, dispute_status: on_hold, dispute_reason: "Pricing discrepancy - invoice shows £480k but PO was £420k"}
      expect: ["on_hold"]

- question: "07:65:Q3"
  story: >
    Portfolio has £1,045,500 open receivables. CUS-900001 (£150k, reliable 95% on-time), CUS-900002 (£480k, disputed),
    CUS-900003 (£154.5k, 75+ days overdue), CUS-900005 (£145k, good payer), CUS-900006 (£135k, excellent), CUS-900007 (£89k),
    CUS-900009 (£28k part-paid), CUS-900010 (£156k), CUS-900012 (£18k), CUS-900013 (£135k). Bad debt provision is £68.5k
    (ECL at 2/5/15/35% by aging). Forecast weekly collections over 8 weeks based on historical on-time percentages.
  checks:
    - tool: get_open_receivables_ledger
      args: {}
      expect: ["overdue", "open", "balance_due_gbp"]
    - tool: get_bad_debt_provision
      args: {}
      expect: ["68500", "ECL by ageing bucket", "4200", "32600"]
    - tool: calculate_collections_forecast
      args: {weeks_ahead: 8}
      expect: ["week_start", "expected_collection_gbp", "forecast"]
    - tool: calculate_expected_credit_loss
      args: {}
      expect: ["0-30 days", "31-60 days", "61-90 days", "90+ days", "ecl_pct", "ECL"]

- question: "07:65:Q4"
  story: >
    Overdue invoices requiring collection action: INV-2026-900001 (£480k, disputed), INV-2026-900004 (£89.5k, 75+ days),
    INV-2026-900005 (£28k, part-paid, overdue), INV-2026-900006 (£145k, overdue), INV-2026-900014 (£65k, overdue).
    Send collection reminders (dunning notices) to worst offenders by amount: CUS-900002 (£480k), CUS-900005 (£145k),
    CUS-900010 (£156k unpaid).
  checks:
    - tool: list_overdue_invoices
      args: {min_days_overdue: 1}
      expect: ["overdue", "balance_due_gbp", "INV-2026-900001"]
    - tool: get_overdue_trend_by_customer
      args: {days: 90}
      expect: ["overdue_gbp", "snapshot_date"]
    - tool: get_customer_exposure_summary
      args: {customer_id: CUS-900002}
      expect: ["CUS-900002", "480000", "invoiced_gbp"]
    - tool: send_payment_reminder
      args: {customer_id: CUS-900002, invoice_id: INV-2026-900001, reminder_type: first_notice, message: "Invoice INV-2026-900001 for £480,000 is now significantly overdue. Please contact us immediately regarding payment or dispute resolution."}
      expect: ["sent", "first_notice"]

- question: "07:65:Q5"
  story: >
    Customer CUS-900003 is 75+ days overdue on £154.5k (invoices INV-2026-900004 £89.5k and INV-2026-900014 £65k).
    Credit score is 45 (critical risk). Already has history of late payments (35-25% on-time). Place on credit hold
    to prevent new orders. However, customer has £20k order (ORD-2026-0900099) that should ship - needs hold release
    for that specific order.
  checks:
    - tool: get_customer_account_summary
      args: {customer_id: CUS-900003}
      expect: ["CUS-900003", "critical", "overdue"]
    - tool: get_overdue_trend_by_customer
      args: {customer_id: CUS-900003, days: 90}
      expect: ["CUS-900003", "overdue_gbp"]
    - tool: update_customer_credit_hold
      args: {customer_id: CUS-900003, credit_held: true, credit_hold_reason: "75 days overdue"}
      expect: ["true"]
    - tool: list_overdue_invoices
      args: {min_days_overdue: 60}
      expect: ["INV-2026-900004", "INV-2026-900014"]
