# One entry per question row that uses this system's tools (see: python -m mockmcp brief ar).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "07:65:Q1"
  story: >
    Customer CUS-900001 is a reliable wholesale customer with strong payment history (95-98% on-time).
    Current balance £150k against £200k credit limit. Recent invoices were paid on time (62-day average).
    Credit score 72, no active disputes. Credit recommendation is to maintain or increase the limit.
  checks:
    - tool: get_customer_account_summary
      args: {customer_id: CUS-900001}
      expect: ["CUS-900001", "72", "medium"]
    - tool: get_customer_payment_history
      args: {customer_id: CUS-900001}
      expect: ["CUS-900001", "95"]
    - tool: get_credit_insurance_cover
      args: {customer_id: CUS-900001}
      expect: ["policy_id"]
    - tool: calculate_credit_limit_recommendation
      args: {customer_id: CUS-900001}
      expect: ["CUS-900001", "Maintain"]

- question: "07:65:Q2"
  story: >
    Invoice INV-2026-900001 (£480k) is in dispute on hold: pricing discrepancy.
    Need to examine invoice lines and determine fair settlement.
  checks:
    - tool: get_sales_order_and_invoice
      args: {invoice_id: INV-2026-900001}
      expect: ["INV-2026-900001", "480000"]
    - tool: list_overdue_invoices
      args: {min_days_overdue: 1}
      expect: ["INV-2026-900001", "480000", "overdue"]
    - tool: update_invoice_dispute_status
      args: {invoice_id: INV-2026-900001, dispute_status: on_hold, dispute_reason: "Pricing discrepancy"}
      expect: ["Updated", "INV-2026-900001"]

- question: "07:65:Q3"
  story: >
    Portfolio has open receivables with bad debt provision calculated using ECL (2/5/15/35% by aging).
    Forecast weekly collections over 8 weeks based on historical on-time percentages.
  checks:
    - tool: get_open_receivables_ledger
      args: {}
      expect: ["open", "overdue"]
    - tool: get_bad_debt_provision
      args: {}
      expect: ["amount_gbp", "by_"]
    - tool: calculate_collections_forecast
      args: {weeks_ahead: 8}
      expect: ["expected_collection_gbp"]
    - tool: calculate_expected_credit_loss
      args: {}
      expect: ["total_exposure_gbp"]

- question: "07:65:Q4"
  story: >
    Multiple overdue invoices requiring collection action. Send collection reminders (dunning notices).
  checks:
    - tool: list_overdue_invoices
      args: {min_days_overdue: 1}
      expect: ["overdue", "balance_due_gbp"]
    - tool: get_overdue_trend_by_customer
      args: {days: 90}
      expect: ["customer_id", "overdue_gbp"]
    - tool: send_payment_reminder
      args: {customer_id: CUS-900001, invoice_id: INV-2026-900002, reminder_type: first_notice, message: "Payment required"}
      expect: ["sent", "reminder_id"]

- question: "07:65:Q5"
  story: >
    Customer CUS-900003 is 75+ days overdue on multiple invoices (INV-2026-900004, INV-2026-900014).
    Critical risk. Place on credit hold to prevent new orders.
  checks:
    - tool: get_customer_account_summary
      args: {customer_id: CUS-900003}
      expect: ["CUS-900003", "critical"]
    - tool: get_overdue_trend_by_customer
      args: {customer_id: CUS-900003, days: 90}
      expect: ["CUS-900003", "overdue_gbp"]
    - tool: update_customer_credit_hold
      args: {customer_id: CUS-900003, credit_held: true, credit_hold_reason: "75 days overdue"}
      expect: ["Updated"]
    - tool: list_overdue_invoices
      args: {min_days_overdue: 60}
      expect: ["INV-2026-900004", "overdue"]
