id: ar
name: Accounts Receivable System
instructions: >
  Customer invoices, payments, credit management and bad-debt provisioning for wholesale and B2B.
  Invoice ids look like INV-2026-000123. Customer ids are CUS-004512 style. Use for credit decisions,
  cash forecasting, dispute resolution and collection prioritization.

tables:
  invoices:
    key: invoice_id
    cols:
      invoice_id: {type: str, desc: "Invoice, e.g. INV-2026-000123"}
      customer_id: {type: str, desc: Customer}
      order_id: {type: str, desc: "Sales order, e.g. ORD-2026-0123456"}
      invoice_date: {type: date, desc: Invoice date}
      due_date: {type: date, desc: Payment due date}
      amount_gbp: {type: float, desc: Total invoice amount in GBP}
      paid_amount_gbp: {type: float, desc: Amount paid to date in GBP}
      status: {type: enum, values: [open, part_paid, paid, overdue, written_off], desc: Invoice status}
      dispute_status: {type: enum, values: [none, disputed, on_hold, resolved], desc: Dispute status}
      dispute_reason: {type: str, desc: "If disputed, why"}
      created_at: {type: timestamp, desc: When invoice was created}
      updated_at: {type: timestamp, desc: Last updated}

  invoice_lines:
    key: [invoice_id, line_no]
    cols:
      invoice_id: {type: str, desc: Invoice}
      line_no: {type: int, desc: Line number}
      sku: {type: str, desc: Product SKU}
      description: {type: str, desc: Line item description}
      qty: {type: int, desc: Quantity}
      unit_price_gbp: {type: float, desc: Unit price in GBP}
      line_total_gbp: {type: float, desc: Line total (qty × unit_price)}

  payments:
    key: payment_id
    cols:
      payment_id: {type: str, desc: "Payment, e.g. PAY-2026-000123"}
      customer_id: {type: str, desc: Customer}
      invoice_id: {type: str, desc: "Related invoice, if specified"}
      amount_gbp: {type: float, desc: Payment amount in GBP}
      payment_date: {type: date, desc: Date received}
      received_date: {type: date, desc: Date recorded in system}
      payment_method: {type: enum, values: [bank_transfer, cheque, credit_card, direct_debit, cash], desc: Payment method}
      reference: {type: str, desc: "Payment reference, e.g. BACS ref or cheque no"}
      notes: {type: str, desc: Payment notes}

  customer_accounts:
    key: customer_id
    cols:
      customer_id: {type: str, desc: Customer}
      credit_limit_gbp: {type: float, desc: Current credit limit in GBP}
      credit_held: {type: bool, desc: Credit hold status}
      credit_hold_reason: {type: str, desc: "If held, reason for hold"}
      current_balance_gbp: {type: float, desc: Current outstanding balance in GBP}
      payment_terms_days: {type: int, desc: Standard payment terms in days}
      credit_score: {type: int, desc: Internal credit score 0-100}
      account_status: {type: enum, values: [active, inactive, suspended], desc: Account status}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: Credit risk rating}
      average_dpo_days: {type: float, desc: Historical average days to pay}
      updated_at: {type: timestamp, desc: Last updated}

  credit_insurance:
    key: policy_id
    cols:
      policy_id: {type: str, desc: "Policy, e.g. INS-00001"}
      customer_id: {type: str, desc: Customer insured}
      insurer: {type: str, desc: Insurance company name}
      cover_limit_gbp: {type: float, desc: Cover limit in GBP}
      cover_percentage_pct: {type: float, desc: Percentage of invoice covered}
      policy_start: {type: date, desc: Policy start date}
      policy_end: {type: date, desc: Policy end date}
      status: {type: enum, values: [active, expired, lapsed, cancelled], desc: Policy status}
      updated_at: {type: timestamp, desc: Last updated}

  bad_debt_provisions:
    key: provision_id
    cols:
      provision_id: {type: str, desc: "Provision, e.g. BDP-2026-00001"}
      as_of_date: {type: date, desc: Date the provision is calculated for}
      methodology: {type: str, desc: "Provision methodology, e.g. 'ECL by aging bucket'"}
      amount_gbp: {type: float, desc: Total bad debt provision in GBP}
      by_0_30_days_gbp: {type: float, desc: Provision for 0-30 days overdue}
      by_31_60_days_gbp: {type: float, desc: Provision for 31-60 days overdue}
      by_61_90_days_gbp: {type: float, desc: Provision for 61-90 days overdue}
      by_over_90_days_gbp: {type: float, desc: Provision for 90+ days overdue}
      created_at: {type: timestamp, desc: When calculated}

  payment_reminders:
    key: reminder_id
    cols:
      reminder_id: {type: str, desc: "Reminder/dunning, e.g. DUN-2026-00001"}
      customer_id: {type: str, desc: Customer}
      invoice_id: {type: str, desc: Invoice reminder relates to}
      reminder_type: {type: enum, values: [first_notice, second_notice, final_notice, escalation], desc: Reminder type}
      message: {type: text, desc: Message text sent or to be sent}
      sent_date: {type: date, desc: When sent (null if draft)}
      status: {type: enum, values: [draft, sent, bounced, acknowledged], desc: Status}
      created_at: {type: timestamp, desc: When created}

  collection_history:
    key: [customer_id, recorded_on]
    cols:
      customer_id: {type: str, desc: Customer}
      recorded_on: {type: date, desc: Date recorded}
      invoices_in_period: {type: int, desc: Number of invoices in period}
      amount_invoiced_gbp: {type: float, desc: Total invoiced in period}
      amount_paid_gbp: {type: float, desc: Amount paid in period}
      days_to_pay_avg: {type: float, desc: Average days to pay}
      on_time_pct: {type: float, desc: Percentage of invoices paid on time}
      notes: {type: str, desc: Collection notes}

tools:
  - name: get_customer_account_summary
    desc: Customer balance, credit limit, ageing and payment terms. Use to review account health quickly.
    kind: sql
    args:
      customer_id: {required: true}
    sql: |
      SELECT c.customer_id, mc.name, c.credit_limit_gbp, c.current_balance_gbp,
             c.payment_terms_days, c.credit_held, c.credit_hold_reason, c.credit_score,
             c.risk_rating, c.average_dpo_days,
             COALESCE(sum(CASE WHEN i.status IN ('open', 'overdue') THEN i.amount_gbp - i.paid_amount_gbp ELSE 0 END), 0) AS overdue_0_30_gbp,
             COALESCE(sum(CASE WHEN i.status = 'overdue' AND $as_of - i.due_date > 30 THEN i.amount_gbp - i.paid_amount_gbp ELSE 0 END), 0) AS overdue_30_plus_gbp
      FROM customer_accounts c
      LEFT JOIN master.customers mc ON mc.customer_id = c.customer_id
      LEFT JOIN invoices i ON i.customer_id = c.customer_id
      WHERE c.customer_id = $customer_id
      GROUP BY c.customer_id, mc.name, c.credit_limit_gbp, c.current_balance_gbp,
               c.payment_terms_days, c.credit_held, c.credit_hold_reason, c.credit_score,
               c.risk_rating, c.average_dpo_days
    limit: 1
    example: {customer_id: CUS-004512}

  - name: get_customer_exposure_summary
    desc: Total exposure including unbilled orders, current invoiced amount and credit headroom.
    kind: sql
    args:
      customer_id: {required: true}
    sql: |
      SELECT c.customer_id, mc.name, c.credit_limit_gbp,
             COALESCE(sum(i.amount_gbp - i.paid_amount_gbp), 0) AS invoiced_gbp,
             COALESCE(sum(CASE WHEN o.status IN ('placed','picking','shipped') THEN o.value_gbp ELSE 0 END), 0) AS unbilled_orders_gbp,
             (c.credit_limit_gbp - COALESCE(sum(i.amount_gbp - i.paid_amount_gbp), 0) -
              COALESCE(sum(CASE WHEN o.status IN ('placed','picking','shipped') THEN o.value_gbp ELSE 0 END), 0)) AS available_credit_gbp
      FROM customer_accounts c
      LEFT JOIN master.customers mc ON mc.customer_id = c.customer_id
      LEFT JOIN invoices i ON i.customer_id = c.customer_id AND i.status != 'paid'
      LEFT JOIN master.orders o ON o.customer_id = c.customer_id AND o.status IN ('placed','picking','shipped')
      WHERE c.customer_id = $customer_id
      GROUP BY c.customer_id, mc.name, c.credit_limit_gbp
    limit: 1
    example: {customer_id: CUS-004512}

  - name: get_customer_payment_history
    desc: Payment behaviour and days-to-pay trend over last 12 months. Use to assess reliability.
    kind: sql
    args:
      customer_id: {required: true}
      months: {type: int, default: 12, desc: "Look back this many months"}
    sql: |
      SELECT
        ch.customer_id,
        ch.recorded_on,
        ch.invoices_in_period,
        ch.amount_invoiced_gbp,
        ch.amount_paid_gbp,
        ch.days_to_pay_avg,
        ch.on_time_pct,
        ROUND(ch.amount_paid_gbp / NULLIF(ch.amount_invoiced_gbp, 0) * 100, 1) AS payment_ratio_pct
      FROM collection_history ch
      WHERE ch.customer_id = $customer_id
        AND ch.recorded_on >= CAST($as_of AS DATE) - INTERVAL (CAST($months AS INT) * 30) DAY
      ORDER BY ch.recorded_on DESC
    limit: 52
    example: {customer_id: CUS-004512}

  - name: get_historical_collection_patterns
    desc: Historic collection timing by customer over 24 months. Use for cash forecasting.
    kind: sql
    args:
      customer_id: {required: true}
    sql: |
      SELECT customer_id, recorded_on, days_to_pay_avg, on_time_pct, amount_paid_gbp
      FROM collection_history
      WHERE customer_id = $customer_id
        AND recorded_on >= CAST($as_of AS DATE) - INTERVAL 730 DAY
      ORDER BY recorded_on ASC
    limit: 100
    example: {customer_id: CUS-004512}

  - name: get_open_receivables_ledger
    desc: Open receivables by customer and due date. Shows balance due, days overdue, payment terms.
    kind: sql
    args:
      site_id: {}
      min_amount_gbp: {type: float, default: 0}
      order_by: {type: enum, values: [due_date, amount, customer], default: due_date}
    sql: |
      SELECT i.invoice_id, i.customer_id, mc.name AS customer_name,
             i.invoice_date, i.due_date, i.amount_gbp, i.paid_amount_gbp,
             i.amount_gbp - i.paid_amount_gbp AS balance_due_gbp,
             CAST($as_of AS DATE) - i.due_date AS days_overdue,
             i.status, i.dispute_status, c.payment_terms_days
      FROM invoices i
      JOIN customer_accounts c ON c.customer_id = i.customer_id
      LEFT JOIN master.customers mc ON mc.customer_id = i.customer_id
      WHERE i.status IN ('open', 'overdue', 'part_paid')
        AND i.amount_gbp - i.paid_amount_gbp >= $min_amount_gbp
      ORDER BY
        CASE WHEN $order_by = 'due_date' THEN i.due_date END ASC,
        CASE WHEN $order_by = 'amount' THEN i.amount_gbp - i.paid_amount_gbp END DESC,
        CASE WHEN $order_by = 'customer' THEN mc.name END ASC
    limit: 100
    example: {}

  - name: list_overdue_invoices
    desc: Overdue invoices by customer with ageing buckets. Shows how far behind each invoice is.
    kind: sql
    args:
      min_days_overdue: {type: int, default: 1}
      order_by: {type: enum, values: [days_overdue, amount, customer], default: days_overdue}
    sql: |
      SELECT i.invoice_id, i.customer_id, mc.name AS customer_name,
             i.invoice_date, i.due_date, i.amount_gbp, i.paid_amount_gbp,
             i.amount_gbp - i.paid_amount_gbp AS balance_due_gbp,
             CAST($as_of AS DATE) - i.due_date AS days_overdue,
             CASE WHEN CAST($as_of AS DATE) - i.due_date <= 30 THEN '0-30'
                  WHEN CAST($as_of AS DATE) - i.due_date <= 60 THEN '31-60'
                  WHEN CAST($as_of AS DATE) - i.due_date <= 90 THEN '61-90'
                  ELSE '90+' END AS ageing_bucket,
             i.status, i.dispute_status
      FROM invoices i
      LEFT JOIN master.customers mc ON mc.customer_id = i.customer_id
      WHERE i.status IN ('open', 'overdue')
        AND (i.amount_gbp - i.paid_amount_gbp > 0)
        AND CAST($as_of AS DATE) - i.due_date >= $min_days_overdue
      ORDER BY
        CASE WHEN $order_by = 'days_overdue' THEN CAST($as_of AS DATE) - i.due_date END DESC,
        CASE WHEN $order_by = 'amount' THEN i.amount_gbp - i.paid_amount_gbp END DESC,
        CASE WHEN $order_by = 'customer' THEN mc.name END ASC
    limit: 100
    example: {}

  - name: get_overdue_trend_by_customer
    desc: Overdue balance trend by customer over time. Use to identify worsening patterns.
    kind: sql
    args:
      customer_id: {}
      days: {type: int, default: 90}
    sql: |
      WITH dates AS (
        SELECT CAST($as_of AS DATE) - INTERVAL (row_number() over () * 7) DAY AS snapshot_date
        FROM (SELECT * FROM invoices LIMIT 100)
      ),
      snapshots AS (
        SELECT d.snapshot_date, i.customer_id, mc.name,
               COALESCE(sum(CASE WHEN i.due_date <= d.snapshot_date AND i.status IN ('open','overdue') THEN i.amount_gbp - i.paid_amount_gbp ELSE 0 END), 0) AS overdue_gbp
        FROM dates d
        CROSS JOIN invoices i
        LEFT JOIN master.customers mc ON mc.customer_id = i.customer_id
        WHERE ($customer_id IS NULL OR i.customer_id = $customer_id)
          AND d.snapshot_date >= CAST($as_of AS DATE) - INTERVAL CAST($days AS INT) DAY
        GROUP BY d.snapshot_date, i.customer_id, mc.name
      )
      SELECT snapshot_date, customer_id, name, overdue_gbp
      FROM snapshots
      WHERE overdue_gbp > 0
      ORDER BY customer_id, snapshot_date DESC
    limit: 200
    example: {}

  - name: get_sales_order_and_invoice
    desc: Order, invoice and price lines for an invoice. Use to resolve billing disputes.
    kind: sql
    args:
      invoice_id: {required: true}
    sql: |
      SELECT i.invoice_id, i.order_id, i.customer_id, mc.name AS customer_name,
             i.invoice_date, i.due_date, i.amount_gbp, i.paid_amount_gbp, i.status,
             il.line_no, il.sku, il.description, il.qty, il.unit_price_gbp, il.line_total_gbp,
             p.name AS product_name, p.category, p.supplier_id
      FROM invoices i
      LEFT JOIN master.customers mc ON mc.customer_id = i.customer_id
      LEFT JOIN invoice_lines il ON il.invoice_id = i.invoice_id
      LEFT JOIN master.products p ON p.sku = il.sku
      WHERE i.invoice_id = $invoice_id
      ORDER BY il.line_no
    limit: 50
    example: {invoice_id: INV-2026-900001}

  - name: get_bad_debt_provision
    desc: Current bad-debt provision and methodology. Shows total and breakdown by ageing bucket.
    kind: sql
    args:
      as_of: {type: date, desc: "Date of provision (default today)"}
    sql: |
      SELECT provision_id, as_of_date, methodology, amount_gbp,
             by_0_30_days_gbp, by_31_60_days_gbp, by_61_90_days_gbp, by_over_90_days_gbp,
             created_at
      FROM bad_debt_provisions
      WHERE as_of_date = CASE WHEN $as_of IS NULL THEN CAST($as_of AS DATE) ELSE CAST($as_of AS DATE) END
      ORDER BY created_at DESC
    limit: 1
    example: {}

  - name: get_credit_insurance_cover
    desc: Credit insurance policy cover for a customer. Shows limit, percentage covered and expiry.
    kind: sql
    args:
      customer_id: {required: true}
    sql: |
      SELECT policy_id, customer_id, mc.name, insurer, cover_limit_gbp, cover_percentage_pct,
             policy_start, policy_end, status,
             CAST($as_of AS DATE) BETWEEN policy_start AND policy_end AS is_current
      FROM credit_insurance
      LEFT JOIN master.customers mc ON mc.customer_id = credit_insurance.customer_id
      WHERE customer_id = $customer_id
      ORDER BY policy_end DESC
    limit: 10
    example: {customer_id: CUS-004512}

  - name: calculate_credit_limit_recommendation
    desc: Recommended credit limit from score and exposure. Returns current limit, recommendation and justification.
    kind: sql
    args:
      customer_id: {required: true}
    sql: |
      SELECT c.customer_id, mc.name,
             c.credit_score, c.risk_rating, c.average_dpo_days,
             c.credit_limit_gbp AS current_limit_gbp,
             COALESCE(sum(i.amount_gbp - i.paid_amount_gbp), 0) AS current_exposure_gbp,
             CASE WHEN c.credit_score >= 80 AND c.risk_rating = 'low' THEN c.credit_limit_gbp * 1.2
                  WHEN c.credit_score >= 70 AND c.risk_rating IN ('low', 'medium') THEN c.credit_limit_gbp * 1.0
                  WHEN c.credit_score >= 60 AND c.risk_rating = 'medium' THEN c.credit_limit_gbp * 0.8
                  WHEN c.credit_score >= 50 OR c.risk_rating = 'high' THEN c.credit_limit_gbp * 0.6
                  ELSE c.credit_limit_gbp * 0.4 END AS recommended_limit_gbp,
             CASE WHEN c.credit_score >= 80 AND c.risk_rating = 'low' THEN 'Score and payment history support increase'
                  WHEN c.credit_score >= 70 THEN 'Maintain current limit'
                  WHEN c.credit_score >= 60 THEN 'Consider reduction to manage risk'
                  ELSE 'High risk; recommend significant reduction' END AS justification,
             'limit = base * risk_factor' AS formula
      FROM customer_accounts c
      LEFT JOIN master.customers mc ON mc.customer_id = c.customer_id
      LEFT JOIN invoices i ON i.customer_id = c.customer_id AND i.status IN ('open', 'overdue')
      WHERE c.customer_id = $customer_id
      GROUP BY c.customer_id, mc.name, c.credit_score, c.risk_rating, c.average_dpo_days,
               c.credit_limit_gbp
    limit: 1
    example: {customer_id: CUS-004512}

  - name: calculate_collections_forecast
    desc: Expected weekly cash collections with range. Returns forecast by week with confidence interval.
    kind: sql
    args:
      weeks_ahead: {type: int, default: 8}
    sql: |
      WITH open_inv AS (
        SELECT i.customer_id, i.due_date, i.amount_gbp - i.paid_amount_gbp AS balance_gbp,
               ch.days_to_pay_avg, ch.on_time_pct
        FROM invoices i
        LEFT JOIN collection_history ch ON ch.customer_id = i.customer_id
        WHERE i.status IN ('open', 'overdue', 'part_paid')
          AND i.amount_gbp - i.paid_amount_gbp > 0
      ),
      weekly_forecast AS (
        SELECT date_trunc('week',
                 CAST($as_of AS DATE) + INTERVAL CAST(row_number() over () * 7 AS INT) DAY) AS week_start,
               COALESCE(sum(balance_gbp * (ch.on_time_pct / 100.0)), 0) AS expected_collection_gbp,
               round(COALESCE(sum(balance_gbp * (ch.on_time_pct / 100.0)), 0) * 0.8, 0) AS lower_range_gbp,
               round(COALESCE(sum(balance_gbp * (ch.on_time_pct / 100.0)), 0) * 1.2, 0) AS upper_range_gbp
        FROM open_inv
        CROSS JOIN collection_history ch
        WHERE ch.customer_id = open_inv.customer_id
        GROUP BY week_start
        LIMIT CAST($weeks_ahead AS INT)
      )
      SELECT week_start, expected_collection_gbp, lower_range_gbp, upper_range_gbp,
             'forecast = open_balance * historical_on_time_pct ±20%' AS formula
      FROM weekly_forecast
      ORDER BY week_start
    limit: 12
    example: {}

  - name: calculate_expected_credit_loss
    desc: Expected credit loss by ageing bucket or customer. Returns ECL %, amount and risk factors.
    kind: sql
    args:
      customer_id: {}
    sql: |
      SELECT
        CASE WHEN $customer_id IS NULL THEN 'portfolio' ELSE i.customer_id END AS customer_id,
        CASE WHEN CAST($as_of AS DATE) - i.due_date <= 30 THEN '0-30 days'
             WHEN CAST($as_of AS DATE) - i.due_date <= 60 THEN '31-60 days'
             WHEN CAST($as_of AS DATE) - i.due_date <= 90 THEN '61-90 days'
             ELSE '90+ days' END AS ageing_bucket,
        COALESCE(sum(i.amount_gbp - i.paid_amount_gbp), 0) AS total_exposure_gbp,
        CASE WHEN CAST($as_of AS DATE) - i.due_date <= 30 THEN 0.02
             WHEN CAST($as_of AS DATE) - i.due_date <= 60 THEN 0.05
             WHEN CAST($as_of AS DATE) - i.due_date <= 90 THEN 0.15
             ELSE 0.35 END AS ecl_pct,
        round(COALESCE(sum(i.amount_gbp - i.paid_amount_gbp), 0) *
              CASE WHEN CAST($as_of AS DATE) - i.due_date <= 30 THEN 0.02
                   WHEN CAST($as_of AS DATE) - i.due_date <= 60 THEN 0.05
                   WHEN CAST($as_of AS DATE) - i.due_date <= 90 THEN 0.15
                   ELSE 0.35 END, 2) AS ecl_amount_gbp,
        'ECL = exposure × probability_of_default' AS formula
      FROM invoices i
      WHERE i.status IN ('open', 'overdue')
        AND i.amount_gbp - i.paid_amount_gbp > 0
        AND ($customer_id IS NULL OR i.customer_id = $customer_id)
      GROUP BY CASE WHEN $customer_id IS NULL THEN 'portfolio' ELSE i.customer_id END,
               CASE WHEN CAST($as_of AS DATE) - i.due_date <= 30 THEN '0-30 days'
                    WHEN CAST($as_of AS DATE) - i.due_date <= 60 THEN '31-60 days'
                    WHEN CAST($as_of AS DATE) - i.due_date <= 90 THEN '61-90 days'
                    ELSE '90+ days' END
      ORDER BY
        CASE WHEN CAST($as_of AS DATE) - i.due_date <= 30 THEN 1
             WHEN CAST($as_of AS DATE) - i.due_date <= 60 THEN 2
             WHEN CAST($as_of AS DATE) - i.due_date <= 90 THEN 3
             ELSE 4 END
    limit: 50
    example: {}

  - name: send_payment_reminder
    desc: Sends a dunning or chaser notice for overdue invoices to customer. Creates draft/sent reminder record.
    kind: insert
    table: payment_reminders
    id_prefix: DUN-
    defaults: {status: sent, reminder_type: first_notice}
    args:
      customer_id: {required: true}
      invoice_id: {}
      reminder_type: {required: true, desc: "first_notice, second_notice, final_notice, escalation"}
      message: {required: true, type: text}
    example: {customer_id: CUS-900001, invoice_id: INV-2026-900001, reminder_type: first_notice, message: "We note that invoice INV-2026-900001 for £25,000 remains outstanding. Please remit payment within 5 days."}

  - name: update_customer_credit_hold
    desc: Places or lifts a credit hold on a customer. Returns before/after hold status.
    kind: update
    table: customer_accounts
    set: {}
    args:
      credit_held: {required: true, type: bool}
      credit_hold_reason: {type: str}
    example: {customer_id: CUS-900001, credit_held: true, credit_hold_reason: 75 days overdue}

  - name: update_customer_credit_limit
    desc: Changes a customer's credit limit. Returns old and new limits with effective date.
    kind: update
    table: customer_accounts
    set: {}
    args:
      credit_limit_gbp: {required: true, type: float}
    example: {customer_id: CUS-900001, credit_limit_gbp: 150000}

  - name: update_invoice_dispute_status
    desc: Marks an invoice as disputed or on dispute hold. Returns old and new status.
    kind: update
    table: invoices
    set: {}
    args:
      dispute_status: {required: true, type: enum, values: [none, disputed, on_hold, resolved]}
      dispute_reason: {type: str}
    example: {invoice_id: INV-2026-900001, dispute_status: on_hold, dispute_reason: Pricing discrepancy}
