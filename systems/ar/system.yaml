id: ar
name: Accounts Receivable System
instructions: >
  Customer invoices, payments, credit management and bad-debt provisioning for wholesale and B2B.
  Invoice ids look like INV-2026-000123. Customer ids are CUS-004512 style. Use for credit decisions,
  cash forecasting, dispute resolution and collection prioritization.

tables:
  invoices:
    key: invoice_id
    cols:
      invoice_id: {type: str, desc: "Invoice, e.g. INV-2026-000123"}
      customer_id: {type: str, desc: Customer}
      order_id: {type: str, desc: "Sales order, e.g. ORD-2026-0123456"}
      invoice_date: {type: date, desc: Invoice date}
      due_date: {type: date, desc: Payment due date}
      amount_gbp: {type: float, desc: Total invoice amount in GBP}
      paid_amount_gbp: {type: float, desc: Amount paid to date in GBP}
      status: {type: enum, values: [open, part_paid, paid, overdue, written_off], desc: Invoice status}
      dispute_status: {type: enum, values: [none, disputed, on_hold, resolved], desc: Dispute status}
      dispute_reason: {type: str, desc: "If disputed, why"}
      created_at: {type: timestamp, desc: When invoice was created}
      updated_at: {type: timestamp, desc: Last updated}

  invoice_lines:
    key: [invoice_id, line_no]
    cols:
      invoice_id: {type: str, desc: Invoice}
      line_no: {type: int, desc: Line number}
      sku: {type: str, desc: Product SKU}
      description: {type: str, desc: Line item description}
      qty: {type: int, desc: Quantity}
      unit_price_gbp: {type: float, desc: Unit price in GBP}
      line_total_gbp: {type: float, desc: Line total (qty × unit_price)}

  payments:
    key: payment_id
    cols:
      payment_id: {type: str, desc: "Payment, e.g. PAY-2026-000123"}
      customer_id: {type: str, desc: Customer}
      invoice_id: {type: str, desc: "Related invoice, if specified"}
      amount_gbp: {type: float, desc: Payment amount in GBP}
      payment_date: {type: date, desc: Date received}
      received_date: {type: date, desc: Date recorded in system}
      payment_method: {type: enum, values: [bank_transfer, cheque, credit_card, direct_debit, cash], desc: Payment method}
      reference: {type: str, desc: "Payment reference, e.g. BACS ref or cheque no"}
      notes: {type: str, desc: Payment notes}

  customer_accounts:
    key: customer_id
    cols:
      customer_id: {type: str, desc: Customer}
      credit_limit_gbp: {type: float, desc: Current credit limit in GBP}
      credit_held: {type: bool, desc: Credit hold status}
      credit_hold_reason: {type: str, desc: "If held, reason for hold"}
      current_balance_gbp: {type: float, desc: Current outstanding balance in GBP}
      payment_terms_days: {type: int, desc: Standard payment terms in days}
      credit_score: {type: int, desc: Internal credit score 0-100}
      account_status: {type: enum, values: [active, inactive, suspended], desc: Account status}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: Credit risk rating}
      average_dpo_days: {type: float, desc: Historical average days to pay}
      updated_at: {type: timestamp, desc: Last updated}

  credit_insurance:
    key: policy_id
    cols:
      policy_id: {type: str, desc: "Policy, e.g. INS-00001"}
      customer_id: {type: str, desc: Customer insured}
      insurer: {type: str, desc: Insurance company name}
      cover_limit_gbp: {type: float, desc: Cover limit in GBP}
      cover_percentage_pct: {type: float, desc: Percentage of invoice covered}
      policy_start: {type: date, desc: Policy start date}
      policy_end: {type: date, desc: Policy end date}
      status: {type: enum, values: [active, expired, lapsed, cancelled], desc: Policy status}
      updated_at: {type: timestamp, desc: Last updated}

  bad_debt_provisions:
    key: provision_id
    cols:
      provision_id: {type: str, desc: "Provision, e.g. BDP-2026-00001"}
      as_of_date: {type: date, desc: Date the provision is calculated for}
      methodology: {type: str, desc: "Provision methodology, e.g. 'ECL by aging bucket'"}
      amount_gbp: {type: float, desc: Total bad debt provision in GBP}
      by_0_30_days_gbp: {type: float, desc: Provision for 0-30 days overdue}
      by_31_60_days_gbp: {type: float, desc: Provision for 31-60 days overdue}
      by_61_90_days_gbp: {type: float, desc: Provision for 61-90 days overdue}
      by_over_90_days_gbp: {type: float, desc: Provision for 90+ days overdue}
      created_at: {type: timestamp, desc: When calculated}

  payment_reminders:
    key: reminder_id
    cols:
      reminder_id: {type: str, desc: "Reminder/dunning, e.g. DUN-2026-00001"}
      customer_id: {type: str, desc: Customer}
      invoice_id: {type: str, desc: Invoice reminder relates to}
      reminder_type: {type: enum, values: [first_notice, second_notice, final_notice, escalation], desc: Reminder type}
      message: {type: text, desc: Message text sent or to be sent}
      sent_date: {type: date, desc: When sent (null if draft)}
      status: {type: enum, values: [draft, sent, bounced, acknowledged], desc: Status}
      created_at: {type: timestamp, desc: When created}

  collection_history:
    key: [customer_id, recorded_on]
    cols:
      customer_id: {type: str, desc: Customer}
      recorded_on: {type: date, desc: Date recorded}
      invoices_in_period: {type: int, desc: Number of invoices in period}
      amount_invoiced_gbp: {type: float, desc: Total invoiced in period}
      amount_paid_gbp: {type: float, desc: Amount paid in period}
      days_to_pay_avg: {type: float, desc: Average days to pay}
      on_time_pct: {type: float, desc: Percentage of invoices paid on time}
      notes: {type: str, desc: Collection notes}

tools:
  - name: get_customer_account_summary
    desc: Customer balance, credit limit, ageing buckets, hold status, disputed amount and insurance cover. Use to review one account's health quickly.
    kind: sql
    args:
      customer_id: {required: true}
    sql: |
      SELECT c.customer_id, c.account_status, c.credit_limit_gbp, c.current_balance_gbp,
             c.credit_limit_gbp - c.current_balance_gbp AS headroom_gbp,
             c.payment_terms_days, c.credit_held, c.credit_hold_reason, c.credit_score,
             c.risk_rating, c.average_dpo_days,
             COALESCE(a.not_due, 0) AS not_yet_due_gbp,
             COALESCE(a.od_1_30, 0) AS overdue_1_30_gbp,
             COALESCE(a.od_31_60, 0) AS overdue_31_60_gbp,
             COALESCE(a.od_61_90, 0) AS overdue_61_90_gbp,
             COALESCE(a.od_90_plus, 0) AS overdue_90_plus_gbp,
             COALESCE(a.overdue, 0) AS total_overdue_gbp,
             a.max_days_overdue,
             COALESCE(a.disputed, 0) AS disputed_gbp,
             ins.cover_limit_gbp AS insurance_cover_limit_gbp, ins.cover_percentage_pct AS insurance_cover_pct
      FROM customer_accounts c
      LEFT JOIN (
        SELECT customer_id,
               sum(CASE WHEN due_date >= CAST($as_of AS DATE) THEN bal ELSE 0 END) AS not_due,
               sum(CASE WHEN CAST($as_of AS DATE) - due_date BETWEEN 1 AND 30 THEN bal ELSE 0 END) AS od_1_30,
               sum(CASE WHEN CAST($as_of AS DATE) - due_date BETWEEN 31 AND 60 THEN bal ELSE 0 END) AS od_31_60,
               sum(CASE WHEN CAST($as_of AS DATE) - due_date BETWEEN 61 AND 90 THEN bal ELSE 0 END) AS od_61_90,
               sum(CASE WHEN CAST($as_of AS DATE) - due_date > 90 THEN bal ELSE 0 END) AS od_90_plus,
               sum(CASE WHEN due_date < CAST($as_of AS DATE) THEN bal ELSE 0 END) AS overdue,
               max(CAST($as_of AS DATE) - due_date) AS max_days_overdue,
               sum(CASE WHEN dispute_status IN ('disputed', 'on_hold') THEN bal ELSE 0 END) AS disputed
        FROM (SELECT customer_id, due_date, dispute_status, amount_gbp - paid_amount_gbp AS bal
              FROM invoices WHERE status IN ('open', 'overdue', 'part_paid')) x
        GROUP BY customer_id
      ) a ON a.customer_id = c.customer_id
      LEFT JOIN (
        SELECT customer_id, max(cover_limit_gbp) AS cover_limit_gbp, max(cover_percentage_pct) AS cover_percentage_pct
        FROM credit_insurance
        WHERE status = 'active' AND CAST($as_of AS DATE) BETWEEN policy_start AND policy_end
        GROUP BY customer_id
      ) ins ON ins.customer_id = c.customer_id
      WHERE c.customer_id = $customer_id
    limit: 1
    example: {customer_id: CUS-000016}

  - name: get_customer_exposure_summary
    desc: Total exposure per customer, largest first. Unpaid invoices plus unbilled orders, overdue part and credit headroom. Leave customer_id empty for the biggest exposures.
    kind: sql
    args:
      customer_id: {desc: "Limit to one customer, e.g. CUS-000016; leave empty to rank all"}
    sql: |
      WITH inv AS (
        SELECT customer_id, sum(amount_gbp - paid_amount_gbp) AS invoiced_gbp,
               sum(CASE WHEN due_date < CAST($as_of AS DATE) THEN amount_gbp - paid_amount_gbp ELSE 0 END) AS overdue_gbp
        FROM invoices WHERE status IN ('open', 'overdue', 'part_paid') GROUP BY customer_id
      ), ord AS (
        SELECT customer_id, sum(value_gbp) AS unbilled_orders_gbp
        FROM master.orders WHERE status IN ('placed', 'picking', 'shipped') GROUP BY customer_id
      )
      SELECT c.customer_id, c.risk_rating, c.credit_limit_gbp,
             round(COALESCE(inv.invoiced_gbp, 0), 2) AS invoiced_gbp,
             round(COALESCE(inv.overdue_gbp, 0), 2) AS overdue_gbp,
             round(COALESCE(ord.unbilled_orders_gbp, 0), 2) AS unbilled_orders_gbp,
             round(COALESCE(inv.invoiced_gbp, 0) + COALESCE(ord.unbilled_orders_gbp, 0), 2) AS total_exposure_gbp,
             round(c.credit_limit_gbp - COALESCE(inv.invoiced_gbp, 0) - COALESCE(ord.unbilled_orders_gbp, 0), 2) AS available_credit_gbp
      FROM customer_accounts c
      LEFT JOIN inv ON inv.customer_id = c.customer_id
      LEFT JOIN ord ON ord.customer_id = c.customer_id
      WHERE ($customer_id IS NULL OR c.customer_id = $customer_id)
      ORDER BY total_exposure_gbp DESC
    limit: 20
    example: {}

  - name: get_customer_payment_history
    desc: Monthly payment behaviour for one customer, newest first - days to pay, days late against terms, on-time % and paid vs invoiced. Use to see whether payment is improving or worsening.
    kind: sql
    args:
      customer_id: {required: true}
      months: {type: int, default: 12, desc: "Look back this many months"}
    sql: |
      SELECT ch.customer_id, ch.recorded_on, ch.invoices_in_period, ch.amount_invoiced_gbp, ch.amount_paid_gbp,
             ch.days_to_pay_avg, round(ch.days_to_pay_avg - c.payment_terms_days, 1) AS days_late_avg,
             ch.on_time_pct,
             round(ch.amount_paid_gbp / NULLIF(ch.amount_invoiced_gbp, 0) * 100, 1) AS payment_ratio_pct
      FROM collection_history ch
      JOIN customer_accounts c ON c.customer_id = ch.customer_id
      WHERE ch.customer_id = $customer_id
        AND ch.recorded_on >= CAST($as_of AS DATE) - CAST($months * 30 AS INTEGER)
      ORDER BY ch.recorded_on DESC
    limit: 60
    example: {customer_id: CUS-000034}

  - name: get_historical_collection_patterns
    desc: Collection timing per customer over 24 months - average days to pay, days late against terms, on-time %, recent vs prior-year lateness. Worst late payers first; use for cash forecasting.
    kind: sql
    args:
      customer_id: {desc: "Limit to one customer, e.g. CUS-000034; leave empty for all"}
      min_avg_days_late: {type: float, default: 0, desc: "Only customers whose 24-month average lateness is at least this many days"}
    sql: |
      WITH h AS (
        SELECT ch.customer_id, ch.recorded_on, ch.days_to_pay_avg, ch.on_time_pct, c.payment_terms_days, c.risk_rating
        FROM collection_history ch JOIN customer_accounts c ON c.customer_id = ch.customer_id
        WHERE ($customer_id IS NULL OR ch.customer_id = $customer_id)
          AND ch.recorded_on >= CAST($as_of AS DATE) - 730
      )
      SELECT customer_id, any_value(risk_rating) AS risk_rating, any_value(payment_terms_days) AS payment_terms_days,
             round(avg(days_to_pay_avg), 1) AS avg_days_to_pay,
             round(avg(days_to_pay_avg - payment_terms_days), 1) AS avg_days_late,
             round(avg(on_time_pct), 1) AS avg_on_time_pct,
             round(avg(CASE WHEN recorded_on >= CAST($as_of AS DATE) - 90 THEN days_to_pay_avg - payment_terms_days END), 1) AS recent_3m_days_late,
             round(avg(CASE WHEN recorded_on < CAST($as_of AS DATE) - 365 THEN days_to_pay_avg - payment_terms_days END), 1) AS prior_year_days_late,
             count(*) AS periods_covered
      FROM h
      GROUP BY customer_id
      HAVING avg(days_to_pay_avg - payment_terms_days) >= $min_avg_days_late
      ORDER BY avg_days_late DESC
    limit: 50
    example: {min_avg_days_late: 5}

  - name: get_open_receivables_ledger
    desc: Open receivables ledger, one row per unpaid invoice with balance due, due date, days overdue, dispute status and customer risk. Filter by customer or amount; use for collections timing.
    kind: sql
    args:
      customer_id: {desc: "Limit to one customer, e.g. CUS-000016; leave empty for all"}
      min_amount_gbp: {type: float, default: 0, desc: "Only balances due of at least this amount"}
      order_by: {type: enum, values: [due_date, amount, customer], default: due_date, desc: "Sort by"}
    sql: |
      SELECT i.invoice_id, i.customer_id, c.risk_rating, c.credit_score,
             i.invoice_date, i.due_date, i.amount_gbp, i.paid_amount_gbp,
             round(i.amount_gbp - i.paid_amount_gbp, 2) AS balance_due_gbp,
             CAST($as_of AS DATE) - i.due_date AS days_overdue,
             i.status, i.dispute_status, c.payment_terms_days
      FROM invoices i
      JOIN customer_accounts c ON c.customer_id = i.customer_id
      WHERE i.status IN ('open', 'overdue', 'part_paid')
        AND ($customer_id IS NULL OR i.customer_id = $customer_id)
        AND i.amount_gbp - i.paid_amount_gbp >= $min_amount_gbp
      ORDER BY CASE WHEN $order_by = 'amount' THEN -(i.amount_gbp - i.paid_amount_gbp) ELSE 0 END,
               CASE WHEN $order_by = 'customer' THEN i.customer_id ELSE '' END,
               i.due_date
    limit: 100
    example: {min_amount_gbp: 50000}

  - name: list_overdue_invoices
    desc: Overdue balances by customer with ageing buckets, oldest days overdue and disputed amount, largest first. Set group_by invoice for one row per invoice.
    kind: sql
    args:
      min_days_overdue: {type: int, default: 1, desc: "Minimum days overdue"}
      customer_id: {desc: "Limit to one customer, e.g. CUS-000016; leave empty for all"}
      group_by: {type: enum, values: [customer, invoice], default: customer, desc: "One row per customer or per invoice"}
    sql: |
      SELECT i.customer_id,
             CASE WHEN $group_by = 'invoice' THEN i.invoice_id END AS invoice_id,
             any_value(c.risk_rating) AS risk_rating,
             count(*) AS overdue_invoices,
             round(sum(i.amount_gbp - i.paid_amount_gbp), 2) AS balance_due_gbp,
             max(CAST($as_of AS DATE) - i.due_date) AS days_overdue,
             round(sum(CASE WHEN CAST($as_of AS DATE) - i.due_date <= 30 THEN i.amount_gbp - i.paid_amount_gbp ELSE 0 END), 2) AS bucket_0_30_gbp,
             round(sum(CASE WHEN CAST($as_of AS DATE) - i.due_date BETWEEN 31 AND 60 THEN i.amount_gbp - i.paid_amount_gbp ELSE 0 END), 2) AS bucket_31_60_gbp,
             round(sum(CASE WHEN CAST($as_of AS DATE) - i.due_date BETWEEN 61 AND 90 THEN i.amount_gbp - i.paid_amount_gbp ELSE 0 END), 2) AS bucket_61_90_gbp,
             round(sum(CASE WHEN CAST($as_of AS DATE) - i.due_date > 90 THEN i.amount_gbp - i.paid_amount_gbp ELSE 0 END), 2) AS bucket_90_plus_gbp,
             round(sum(CASE WHEN i.dispute_status IN ('disputed', 'on_hold') THEN i.amount_gbp - i.paid_amount_gbp ELSE 0 END), 2) AS disputed_gbp
      FROM invoices i
      JOIN customer_accounts c ON c.customer_id = i.customer_id
      WHERE i.status IN ('open', 'overdue', 'part_paid')
        AND i.amount_gbp - i.paid_amount_gbp > 0
        AND ($customer_id IS NULL OR i.customer_id = $customer_id)
        AND CAST($as_of AS DATE) - i.due_date >= $min_days_overdue
      GROUP BY i.customer_id, CASE WHEN $group_by = 'invoice' THEN i.invoice_id END
      ORDER BY balance_due_gbp DESC
    limit: 100
    example: {}

  - name: get_overdue_trend_by_customer
    desc: Overdue balance per customer now and 4, 8 and 12 weeks ago with change and trend (worsening, stable, improving), biggest overdue first. Use to spot who is getting worse.
    kind: sql
    args:
      customer_id: {desc: "Limit to one customer, e.g. CUS-000016; leave empty for all"}
      min_overdue_gbp: {type: float, default: 0, desc: "Only customers overdue by at least this much now"}
    sql: |
      WITH snaps AS (
        SELECT k, CAST($as_of AS DATE) - k AS d FROM (VALUES (0), (28), (56), (84)) AS t(k)
      ), ps AS (
        SELECT i.invoice_id, i.customer_id, i.amount_gbp, i.due_date, s.k, s.d,
               COALESCE(sum(p.amount_gbp), 0) AS paid_to_date
        FROM invoices i
        CROSS JOIN snaps s
        LEFT JOIN payments p ON p.invoice_id = i.invoice_id AND p.payment_date <= s.d
        WHERE ($customer_id IS NULL OR i.customer_id = $customer_id)
          AND i.invoice_date <= s.d AND i.due_date < s.d
        GROUP BY i.invoice_id, i.customer_id, i.amount_gbp, i.due_date, s.k, s.d
      ), w AS (
        SELECT customer_id,
               sum(CASE WHEN k = 0 THEN amount_gbp - paid_to_date ELSE 0 END) AS now_gbp,
               sum(CASE WHEN k = 28 THEN amount_gbp - paid_to_date ELSE 0 END) AS w4_gbp,
               sum(CASE WHEN k = 56 THEN amount_gbp - paid_to_date ELSE 0 END) AS w8_gbp,
               sum(CASE WHEN k = 84 THEN amount_gbp - paid_to_date ELSE 0 END) AS w12_gbp
        FROM ps GROUP BY customer_id
      )
      SELECT w.customer_id, c.risk_rating,
             round(w.now_gbp, 2) AS overdue_now_gbp, round(w.w4_gbp, 2) AS overdue_4w_ago_gbp,
             round(w.w8_gbp, 2) AS overdue_8w_ago_gbp, round(w.w12_gbp, 2) AS overdue_12w_ago_gbp,
             round(w.now_gbp - w.w4_gbp, 2) AS change_vs_4w_gbp, round(w.now_gbp - w.w12_gbp, 2) AS change_vs_12w_gbp,
             CASE WHEN w.now_gbp > w.w4_gbp * 1.15 AND w.now_gbp - w.w12_gbp > 10000 THEN 'worsening'
                  WHEN w.now_gbp < w.w4_gbp * 0.85 THEN 'improving' ELSE 'stable' END AS trend
      FROM w JOIN customer_accounts c ON c.customer_id = w.customer_id
      WHERE w.now_gbp >= $min_overdue_gbp AND (w.now_gbp > 0 OR w.w4_gbp > 0 OR w.w12_gbp > 0)
      ORDER BY w.now_gbp DESC
    limit: 50
    example: {}

  - name: get_sales_order_and_invoice
    desc: Invoice header with dispute status and reason, order id, balance and every price line (SKU, qty, unit price). Use to resolve billing disputes.
    kind: sql
    args:
      invoice_id: {required: true}
    sql: |
      SELECT i.invoice_id, i.order_id, i.customer_id,
             i.invoice_date, i.due_date, i.amount_gbp, i.paid_amount_gbp,
             round(i.amount_gbp - i.paid_amount_gbp, 2) AS balance_due_gbp,
             i.status, i.dispute_status, i.dispute_reason,
             il.line_no, il.sku, il.description, il.qty, il.unit_price_gbp, il.line_total_gbp
      FROM invoices i
      LEFT JOIN invoice_lines il ON il.invoice_id = i.invoice_id
      WHERE i.invoice_id = $invoice_id
      ORDER BY il.line_no
    limit: 50
    example: {invoice_id: INV-2026-009876}

  - name: get_bad_debt_provision
    desc: Booked bad-debt provision with methodology and split by ageing bucket. Returns the latest booking, or the latest on or before provision_date.
    kind: sql
    args:
      provision_date: {type: date, desc: "Provision as at this date; leave empty for the latest booked"}
    sql: |
      SELECT provision_id, as_of_date, methodology, amount_gbp,
             by_0_30_days_gbp, by_31_60_days_gbp, by_61_90_days_gbp, by_over_90_days_gbp,
             created_at
      FROM bad_debt_provisions
      WHERE as_of_date <= COALESCE(CAST($provision_date AS DATE), CAST($as_of AS DATE))
      ORDER BY as_of_date DESC
    limit: 1
    example: {}

  - name: get_credit_insurance_cover
    desc: Credit insurance policies for a customer, newest first. Shows insurer, cover limit, percentage covered, expiry and whether the policy is current.
    kind: sql
    args:
      customer_id: {required: true}
    sql: |
      SELECT policy_id, customer_id, insurer, cover_limit_gbp, cover_percentage_pct,
             policy_start, policy_end, status,
             CAST($as_of AS DATE) BETWEEN policy_start AND policy_end AND status = 'active' AS is_current,
             policy_end - CAST($as_of AS DATE) AS days_to_expiry
      FROM credit_insurance
      WHERE customer_id = $customer_id
      ORDER BY policy_end DESC
    limit: 10
    example: {customer_id: CUS-000034}

  - name: calculate_credit_limit_recommendation
    desc: Recommended credit limit from credit score, risk rating, exposure and overdue. Returns current limit, recommendation, headroom after change and justification.
    kind: sql
    args:
      customer_id: {required: true}
    sql: |
      WITH e AS (
        SELECT customer_id, sum(amount_gbp - paid_amount_gbp) AS exposure,
               sum(CASE WHEN due_date < CAST($as_of AS DATE) THEN amount_gbp - paid_amount_gbp ELSE 0 END) AS overdue
        FROM invoices WHERE status IN ('open', 'overdue', 'part_paid') GROUP BY customer_id
      ), f AS (
        SELECT c.*, COALESCE(e.exposure, 0) AS exposure, COALESCE(e.overdue, 0) AS overdue,
               CASE WHEN c.credit_score >= 80 AND c.risk_rating = 'low' THEN 1.2
                    WHEN c.credit_score >= 70 AND c.risk_rating IN ('low', 'medium') THEN 1.0
                    WHEN c.credit_score >= 60 AND c.risk_rating = 'medium' THEN 0.8
                    WHEN c.credit_score >= 50 OR c.risk_rating = 'high' THEN 0.6
                    ELSE 0.4 END AS risk_factor
        FROM customer_accounts c LEFT JOIN e ON e.customer_id = c.customer_id
        WHERE c.customer_id = $customer_id
      )
      SELECT customer_id, credit_score, risk_rating, average_dpo_days, payment_terms_days,
             credit_limit_gbp AS current_limit_gbp,
             round(exposure, 2) AS current_exposure_gbp, round(overdue, 2) AS overdue_gbp,
             risk_factor,
             round(credit_limit_gbp * risk_factor / 5000) * 5000 AS recommended_limit_gbp,
             round(credit_limit_gbp * risk_factor / 5000) * 5000 - round(exposure, 2) AS headroom_after_change_gbp,
             CASE WHEN risk_factor >= 1.2 THEN 'Strong credit: increase limit'
                  WHEN risk_factor >= 1.0 THEN 'Maintain current limit'
                  WHEN risk_factor >= 0.8 THEN 'Consider reduction to manage risk'
                  ELSE 'High risk: recommend significant reduction' END ||
             CASE WHEN credit_limit_gbp * risk_factor < exposure THEN '; exposure already exceeds the recommended limit, so no new credit until balances fall'
                  ELSE '' END AS justification,
             'recommended = current_limit x risk_factor (score and rating band), rounded to 5,000' AS formula
      FROM f
    limit: 1
    example: {customer_id: CUS-000034}

  - name: calculate_collections_forecast
    desc: Expected cash collections by week for the next N weeks with low and high range, from open invoices, each customer's recent lateness and collection likelihood. Disputed invoices excluded.
    kind: sql
    args:
      weeks_ahead: {type: int, default: 8, desc: "Forecast this many weeks ahead"}
    sql: |
      WITH cust AS (
        SELECT c.customer_id,
               COALESCE((SELECT avg(h.days_to_pay_avg) FROM collection_history h
                         WHERE h.customer_id = c.customer_id AND h.recorded_on >= CAST($as_of AS DATE) - 120), c.average_dpo_days)
                 - c.payment_terms_days AS late_days,
               COALESCE((SELECT avg(h.on_time_pct) FROM collection_history h
                         WHERE h.customer_id = c.customer_id AND h.recorded_on >= CAST($as_of AS DATE) - 120), 80) AS on_time
        FROM customer_accounts c
      ), o AS (
        SELECT i.invoice_id, i.amount_gbp - i.paid_amount_gbp AS bal, i.due_date, i.dispute_status, k.late_days, k.on_time,
               CAST($as_of AS DATE) - i.due_date AS days_overdue
        FROM invoices i JOIN cust k ON k.customer_id = i.customer_id
        WHERE i.status IN ('open', 'overdue', 'part_paid') AND i.amount_gbp - i.paid_amount_gbp > 0
      ), e AS (
        SELECT *,
               GREATEST(CAST($as_of AS DATE) + 1, due_date + CAST(round(GREATEST(late_days, 0)) AS INTEGER)) AS exp_date,
               CASE WHEN dispute_status IN ('disputed', 'on_hold') THEN 0
                    ELSE LEAST(0.98, 0.5 + on_time / 200.0) * CASE WHEN days_overdue > 90 THEN 0.5 WHEN days_overdue > 60 THEN 0.8 ELSE 1.0 END END AS prob,
               0.05 + (1 - on_time / 100.0) * 0.3 AS spread
        FROM o
      ), wk AS (
        SELECT CAST((exp_date - CAST($as_of AS DATE) - 1) / 7 AS INTEGER) + 1 AS week_num,
               count(*) FILTER (WHERE prob > 0) AS invoices_expected,
               sum(bal * prob) AS expected, sum(bal * GREATEST(0, prob - spread)) AS low, sum(bal * LEAST(1, prob + spread)) AS high
        FROM e GROUP BY 1
      )
      SELECT w.week_num, CAST($as_of AS DATE) + (w.week_num - 1) * 7 + 1 AS week_from,
             COALESCE(wk.invoices_expected, 0) AS invoices_expected,
             round(COALESCE(wk.low, 0), 0) AS lower_range_gbp,
             round(COALESCE(wk.expected, 0), 0) AS expected_collection_gbp,
             round(COALESCE(wk.high, 0), 0) AS upper_range_gbp,
             round(sum(COALESCE(wk.expected, 0)) OVER (ORDER BY w.week_num), 0) AS cumulative_expected_gbp,
             (SELECT round(sum(bal), 0) FROM e WHERE prob = 0) AS disputed_excluded_gbp,
             'expected = sum(balance x collection_probability) in the week due_date + customer recent days late falls; range = probability +/- spread by on-time %' AS formula
      FROM range(1, $weeks_ahead + 1) AS w(week_num)
      LEFT JOIN wk ON wk.week_num = w.week_num
      ORDER BY w.week_num
    limit: 26
    example: {}

  - name: calculate_expected_credit_loss
    desc: Expected credit loss on the open ledger by ageing bucket or by customer, with ECL %, amount, high-risk and disputed exposure, and a total row. Compare with get_bad_debt_provision.
    kind: sql
    args:
      customer_id: {desc: "Limit to one customer, e.g. CUS-000016; leave empty for the portfolio"}
      group_by: {type: enum, values: [bucket, customer], default: bucket, desc: "Rows per ageing bucket or per customer"}
    sql: |
      WITH b AS (
        SELECT i.customer_id, c.risk_rating, i.dispute_status, i.amount_gbp - i.paid_amount_gbp AS bal,
               CASE WHEN CAST($as_of AS DATE) - i.due_date <= 30 THEN 1 WHEN CAST($as_of AS DATE) - i.due_date <= 60 THEN 2
                    WHEN CAST($as_of AS DATE) - i.due_date <= 90 THEN 3 ELSE 4 END AS bk,
               CASE WHEN CAST($as_of AS DATE) - i.due_date <= 30 THEN 0.02 WHEN CAST($as_of AS DATE) - i.due_date <= 60 THEN 0.05
                    WHEN CAST($as_of AS DATE) - i.due_date <= 90 THEN 0.15 ELSE 0.35 END AS rate
        FROM invoices i JOIN customer_accounts c ON c.customer_id = i.customer_id
        WHERE i.status IN ('open', 'overdue', 'part_paid') AND i.amount_gbp - i.paid_amount_gbp > 0
          AND ($customer_id IS NULL OR i.customer_id = $customer_id)
      ), g AS (
        SELECT CASE WHEN $group_by = 'customer' OR $customer_id IS NOT NULL THEN customer_id ELSE 'portfolio' END AS customer_id,
               CASE WHEN $group_by = 'customer' THEN 'all' ELSE CASE bk WHEN 1 THEN '0-30 days (incl. not yet due)' WHEN 2 THEN '31-60 days' WHEN 3 THEN '61-90 days' ELSE '90+ days' END END AS ageing_bucket,
               CASE WHEN $group_by = 'customer' THEN 0 ELSE bk END AS ord,
               sum(bal) AS exposure, sum(bal * rate) AS ecl,
               sum(bal) FILTER (WHERE risk_rating IN ('high', 'critical')) AS high_risk,
               sum(bal) FILTER (WHERE dispute_status IN ('disputed', 'on_hold')) AS disputed
        FROM b GROUP BY ALL
      )
      SELECT customer_id, ageing_bucket, round(exposure, 2) AS total_exposure_gbp,
             round(ecl / exposure * 100, 1) AS ecl_pct, round(ecl, 2) AS ecl_amount_gbp,
             round(COALESCE(high_risk, 0), 2) AS high_risk_exposure_gbp, round(COALESCE(disputed, 0), 2) AS disputed_exposure_gbp,
             'ECL = exposure x loss rate (0-30d 2%, 31-60d 5%, 61-90d 15%, 90+ 35%)' AS formula
      FROM (
        SELECT *, CASE WHEN $group_by = 'customer' THEN -ecl ELSE ord END AS srt FROM g
        UNION ALL
        SELECT 'portfolio' AS customer_id, 'TOTAL' AS ageing_bucket, 9 AS ord, sum(exposure), sum(ecl), sum(high_risk), sum(disputed), 1e12 AS srt FROM g
      ) z
      ORDER BY srt
    limit: 60
    example: {}

  - name: send_payment_reminder
    desc: Sends a dunning or chaser notice to a customer for an overdue invoice and records it as sent. Use after choosing who to chase.
    kind: insert
    table: payment_reminders
    id_prefix: DUN-
    defaults: {status: sent, sent_date: $as_of}
    args:
      customer_id: {required: true}
      invoice_id: {desc: "Overdue invoice being chased, e.g. INV-2026-000903"}
      reminder_type: {required: true, type: enum, values: [first_notice, second_notice, final_notice, escalation], desc: "Notice stage"}
      message: {required: true, type: text, desc: "Reminder message text"}
    example: {customer_id: CUS-000016, invoice_id: INV-2026-000903, reminder_type: second_notice, message: "Invoice INV-2026-000903 for GBP 62,400 is overdue. Please remit payment within 5 days."}

  - name: update_customer_credit_hold
