# One entry per question row that uses this system's tools
- question: "01:4:Q2"
  story: >
    A layout change happened in mid-August at DC1. Between 1 July and 30 September, new starters
    (NST-900001..005 at DC1 started in August, NST-900011..013 in early September) plus the shift
    roster changes help explain cycle count variations and near-miss patterns reported in Q3.
    The cycle counter needs to know if August starters were well-trained before checking.
  checks:
    - tool: get_shift_roster_by_date
      args: {site_id: DC1, roster_date: "-49d"}
      expect: ["DC1", "early", "77", "64"]
    - tool: list_new_starters_by_period
      args: {site_id: DC1, labour_type: permanent, start_date_from: "-63d", start_date_to: "-35d"}
      expect: ["NST-900001", "NST-900004"]

- question: "01:6:Q1"
  story: >
    DC1 cost per unit went up 9% in September vs August. Seed labour hours show permanent hours rose from
    1750 to 1850 (5.7%), but overtime jumped from 190 to 380 hours (100%) and agency jumped from 125 to 280 (124%).
    The mix shift to more overtime and agency drove labour cost up. Checking weeks before and after shows the cost jump clearly.
  checks:
    - tool: get_labour_hours_by_type
      args: {site_id: DC1, date_from: "-70d", date_to: "-60d"}
      expect: ["permanent", "1750.0", "overtime", "190.0"]
    - tool: get_labour_hours_by_type
      args: {site_id: DC1, date_from: "-60d", date_to: "-50d"}
      expect: ["permanent", "1810.0", "overtime", "320.0", "agency", "240.0"]

- question: "01:6:Q3"
  story: >
    For the late shift vs peak planning, labour productivity by shift shows data split by overtime
    and agency. Overtime hours increased significantly. Pick operations and error rates support the fatigue risk
    assessment. Agency labour requests can be created for future capacity.
  checks:
    - tool: get_labour_productivity_by_shift
      args: {site_id: DC1, process_type: picking, date_from: "-60d", date_to: "-50d"}
      expect: ["picking", "overtime", "177", "agency", "152"]
    - tool: get_overtime_hours_by_shift
      args: {site_id: DC1, date_from: "-60d", date_to: "-50d"}
      expect: ["DC1", "304", "7068"]
    - tool: create_agency_labour_request
      args: {site_id: DC1, shift_type: late, date_from: "+14d", date_to: "+21d", quantity_required: 15, labour_type: operative}
      expect: ["ALR-", "draft", "DC1", "late"]

- question: "01:6:Q5"
  story: >
    Store service fell Q5. Labour productivity by shift shows reduced picking rates on overtime,
    indicating the late/night shift is the bottleneck and labour constraints are causing delays.
  checks:
    - tool: get_labour_productivity_by_shift
      args: {site_id: DC1, process_type: picking, date_from: "-49d", date_to: "-42d"}
      expect: ["picking", "permanent", "239", "units_per_hour"]

- question: "01:8:Q5"
  story: >
    Comparing wave vs batch vs discrete pick methods for e-commerce: historical data shows
    batch method achieves higher picks/hour than wave, which beats discrete. Switching to batching
    could improve picking rates.
  checks:
    - tool: get_pick_rates_by_method
      args: {site_id: DC1, pick_method: wave, date_from: "-90d", date_to: "-70d"}
      expect: ["wave", "pick-a"]
    - tool: get_pick_rates_by_method
      args: {site_id: DC1, pick_method: batch, date_from: "-90d", date_to: "-70d"}
      expect: ["batch", "pick-a"]
    - tool: get_pick_rates_by_method
      args: {site_id: DC1, pick_method: discrete, date_from: "-90d", date_to: "-70d"}
      expect: ["discrete", "pick-a"]

- question: "01:9:Q1"
  story: >
    Exposure hours for safety analysis across all DCs and processes. Labour hours split by permanent, overtime and agency,
    all exposure-rated for incident analysis over the past 12 weeks.
  checks:
    - tool: get_exposure_hours_by_site
      args: {site_id: DC1, date_from: "-84d"}
      expect: ["DC1", "receiving", "permanent", "labour_hours"]

- question: "01:9:Q3"
  story: >
    Forklift-pedestrian near misses rose in Q3 with increased new starters and shift pattern changes.
    Data shows new starter intake throughout August and September across DCs.
    Check roster dates and new starter intake to identify the pattern.
  checks:
    - tool: get_shift_roster_by_date
      args: {site_id: DC1, roster_date: "-49d", shift_type: early}
      expect: ["DC1", "77", "64", "early"]
    - tool: list_new_starters_by_period
      args: {site_id: DC1, start_date_from: "-91d"}
      expect: ["NST-900001", "NST-900011"]

- question: "01:9:Q5"
  story: >
    Agency workers by site: DC1 has active agency labour from multiple suppliers. Historical data shows
    filled and confirmed requests across different sites and shifts in recent weeks.
  checks:
    - tool: list_agency_workers_by_site
      args: {site_id: DC1, date_from: "-91d", date_to: "+0d"}
      expect: ["DC1", "total_headcount", "avg_cost_per_hour_gbp"]

- question: "02:21:Q3"
  story: >
    Returns staffing planning: productivity standards for receiving at DC1 are 180 units/hour.
    The calculate_returns_staffing_requirement tool projects forward to estimate operatives needed
    for forecast volumes over the next 12 weeks, accounting for standard productivity rates.
  checks:
    - tool: get_labour_productivity_standards
      args: {site_id: DC1, process_type: receiving}
      expect: ["receiving", "operative", "180"]
    - tool: calculate_returns_staffing_requirement
      args: {site_id: DC1}
      expect: ["operatives_required", "formula", "week_start"]
    - tool: create_agency_labour_request
      args: {site_id: DC1, shift_type: night, date_from: "+21d", date_to: "+35d", quantity_required: 10, labour_type: operative}
      expect: ["ALR-", "draft", "night"]

- question: "07:63:Q3"
  story: >
    Cross-dock vs DC for northern stores: handling rates show different cost profiles for
    DC operations (receiving, putaway, picking, packing, shipping) vs cross-dock operations.
    Network cost comparison depends on these rates and volume mix.
  checks:
    - tool: get_dc_handling_rates
      args: {site_id: DC1}
      expect: ["DC1", "dc_receiving", "cost_per_unit_gbp"]
    - tool: get_cross_dock_handling_rates
      args: {}
      expect: ["cross_dock", "cost_per_unit_gbp"]

- question: "09:87:Q5"
  story: >
    Northampton (DC1) cost per unit 18% above average: DC labour productivity analysis over recent weeks
    shows permanent, overtime, and agency productivity splits across processes. Compare DC1 vs DC2, DC3 productivity.
  checks:
    - tool: get_dc_labour_productivity
      args: {site_id: DC1, date_from: "-60d", date_to: "-20d"}
      expect: ["DC1", "picking", "permanent", "units_per_hour"]
    - tool: get_dc_labour_productivity
      args: {site_id: DC2, date_from: "-60d", date_to: "-20d"}
      expect: ["DC2", "picking"]

- question: "09:88:Q2"
  story: >
    Daventry (DC2) productivity below other DCs. Labour productivity analysis shows DC2 picking rates
    in recent weeks. Compare against DC1 and DC3 to identify the gap.
  checks:
    - tool: get_dc_labour_productivity
      args: {site_id: DC2, date_from: "-60d", date_to: "-50d"}
      expect: ["DC2", "picking", "permanent", "units_per_hour"]
    - tool: get_dc_labour_productivity
      args: {site_id: DC3, date_from: "-60d", date_to: "-50d"}
      expect: ["DC3", "picking"]

- question: "09:88:Q4"
  story: >
    Peak capacity: productivity rates by site and role show standard 240 units/hour for picking operatives
    at DC1. Actual rates in past 8 weeks average around 239.7 (week 2026-09-14), close to standard.
    Volume forecast drives headcount need.
  checks:
    - tool: get_productivity_rates_by_site_and_role
      args: {site_id: DC1, process_type: picking}
      expect: ["DC1", "picking", "operative", "240", "actual_units_per_hour"]

- question: "09:89:Q1"
  story: >
    Peak staffing by site/week. Productivity rates show operatives needed based on forecast and standard rates.
    Picking standard 240 units/hour across DCs. Requisition timing depends on lead times.
  checks:
    - tool: get_productivity_rates_by_site_and_role
      args: {}
      expect: ["standard_units_per_hour", "actual_units_per_hour"]

- question: "09:89:Q2"
  story: >
    Corby turnover (DC3): shift pattern data shows DC3's operating pattern including early, late, and night shifts
    with overtime levels. Exit interviews and pay data combine with shift patterns to diagnose turnover drivers.
  checks:
    - tool: get_shift_pattern_and_overtime
      args: {site_id: DC3}
      expect: ["DC3", "flexible", "shift_hours", "overtime"]

- question: "09:89:Q4"
  story: >
    Hire vs agency vs overtime: cost per productive hour by labour type shows trade-offs between
    permanent, agency and overtime labour. Quality error rates by labour type show permanent staff
    have lower error rates than agency or overtime staff, supporting retention/hire decisions.
  checks:
    - tool: get_cost_per_productive_hour_by_labour_type
      args: {site_id: DC1, date_from: "-60d", date_to: "-50d"}
      expect: ["permanent", "agency", "overtime", "cost_per_productive_hour_gbp"]
    - tool: get_quality_error_rate_by_labour_type
      args: {site_id: DC1, date_from: "-60d", date_to: "-50d"}
      expect: ["permanent", "overtime", "agency", "error_rate_pct"]
