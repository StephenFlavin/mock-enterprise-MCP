# One entry per question row that uses this system's tools
- question: "01:4:Q2"
  story: >
    A layout change happened in mid-August at DC1. Between July and October, new starters
    plus shift roster changes help explain cycle count variations. The cycle counter needs to know
    if new starters were well-trained before checking patterns.
  checks:
    - tool: get_shift_roster_by_date
      args: {site_id: DC1}
      expect: ["DC1", "early", "scheduled_count"]
    - tool: list_new_starters_by_period
      args: {site_id: DC1, labour_type: permanent}
      expect: ["starter_id", "start_date", "training_complete"]

- question: "01:6:Q1"
  story: >
    DC1 cost per unit went up in recent months. Labour hours show shifts in permanent, overtime,
    and agency labour mix. The mix shift to more overtime and agency drove labour cost up.
  checks:
    - tool: get_labour_hours_by_type
      args: {site_id: DC1}
      expect: ["week_start", "permanent", "overtime", "agency", "cost_gbp"]

- question: "01:6:Q3"
  story: >
    For shift planning, labour productivity by shift shows data split by overtime and agency.
    Overtime levels increased significantly. Pick operations and error rates support fatigue risk assessment.
    Agency labour requests can be created for future capacity.
  checks:
    - tool: get_labour_productivity_by_shift
      args: {site_id: DC1, process_type: picking}
      expect: ["picking", "permanent", "units_per_hour"]
    - tool: get_overtime_hours_by_shift
      args: {site_id: DC1}
      expect: ["DC1", "total_hours", "total_cost_gbp"]
    - tool: create_agency_labour_request
      args: {site_id: DC1, shift_type: late, date_from: "+14d", date_to: "+21d", quantity_required: 15, labour_type: operative}
      expect: ["ALR-", "draft", "DC1", "late"]

- question: "01:6:Q5"
  story: >
    Store service analysis uses labour productivity by shift to identify bottlenecks.
    Different shifts show different productivity rates affecting throughput.
  checks:
    - tool: get_labour_productivity_by_shift
      args: {site_id: DC1, process_type: picking}
      expect: ["picking", "labour_type", "units_per_hour"]

- question: "01:8:Q5"
  story: >
    Comparing wave vs batch vs discrete pick methods for e-commerce: historical data shows
    batch method achieves higher picks/hour than wave, which beats discrete.
  checks:
    - tool: get_pick_rates_by_method
      args: {site_id: DC1, pick_method: wave}
      expect: ["wave", "picks_per_hour"]
    - tool: get_pick_rates_by_method
      args: {site_id: DC1, pick_method: batch}
      expect: ["batch", "picks_per_hour"]
    - tool: get_pick_rates_by_method
      args: {site_id: DC1, pick_method: discrete}
      expect: ["discrete", "picks_per_hour"]

- question: "01:9:Q1"
  story: >
    Exposure hours for safety analysis across all DCs and processes. Labour hours split by
    permanent, overtime and agency, all exposure-rated for incident analysis.
  checks:
    - tool: get_exposure_hours_by_site
      args: {site_id: DC1}
      expect: ["DC1", "labour_type", "labour_hours"]

- question: "01:9:Q3"
  story: >
    Near miss analysis with layout changes and new starter intake data. Roster and staffing
    data help identify causal patterns in safety events.
  checks:
    - tool: get_shift_roster_by_date
      args: {site_id: DC1}
      expect: ["DC1", "shift_type", "scheduled_count"]
    - tool: list_new_starters_by_period
      args: {site_id: DC1}
      expect: ["starter_id", "start_date", "labour_type"]

- question: "01:9:Q5"
  story: >
    Agency workers by site: DC1 has active agency labour from multiple suppliers.
    Historical data shows filled and confirmed requests.
  checks:
    - tool: list_agency_workers_by_site
      args: {site_id: DC1}
      expect: ["date_from", "site_id", "total_headcount"]

- question: "02:21:Q3"
  story: >
    Returns staffing planning: productivity standards for receiving show labour rates per hour.
    The calculate_returns_staffing_requirement tool projects forward to estimate operatives needed
    for forecast volumes over the next weeks.
  checks:
    - tool: get_labour_productivity_standards
      args: {site_id: DC1, process_type: receiving}
      expect: ["receiving", "operative", "standard_units_per_hour"]
    - tool: calculate_returns_staffing_requirement
      args: {site_id: DC1}
      expect: ["operatives_required", "formula"]
    - tool: create_agency_labour_request
      args: {site_id: DC1, shift_type: night, date_from: "+21d", date_to: "+35d", quantity_required: 10, labour_type: operative}
      expect: ["ALR-", "night"]

- question: "07:63:Q3"
  story: >
    Cross-dock vs DC for northern stores: handling rates show different cost profiles for
    DC operations (receiving, putaway, picking, packing, shipping) vs cross-dock operations.
  checks:
    - tool: get_dc_handling_rates
      args: {site_id: DC1}
      expect: ["DC1", "cost_per_unit_gbp"]
    - tool: get_cross_dock_handling_rates
      args: {}
      expect: ["cross_dock", "cost_per_unit_gbp"]

- question: "09:87:Q5"
  story: >
    DC cost analysis: DC labour productivity shows productivity by site across processes.
    Compare DCs to identify gaps and improvement opportunities.
  checks:
    - tool: get_dc_labour_productivity
      args: {site_id: DC1}
      expect: ["DC1", "units_per_hour"]
    - tool: get_dc_labour_productivity
      args: {site_id: DC2}
      expect: ["DC2", "units_per_hour"]

- question: "09:88:Q2"
  story: >
    DC productivity analysis: labour productivity shows picking rates and other process metrics
    for comparison across sites.
  checks:
    - tool: get_dc_labour_productivity
      args: {site_id: DC2}
      expect: ["DC2", "picking", "units_per_hour"]
    - tool: get_dc_labour_productivity
      args: {site_id: DC3}
      expect: ["DC3", "picking"]

- question: "09:88:Q4"
  story: >
    Peak capacity planning: productivity rates by site and role show standard and actual
    productivity for capacity calculations.
  checks:
    - tool: get_productivity_rates_by_site_and_role
      args: {site_id: DC1, process_type: picking}
      expect: ["standard_units_per_hour", "actual_units_per_hour"]

- question: "09:89:Q1"
  story: >
    Peak staffing analysis: productivity rates by site/role support workforce planning.
  checks:
    - tool: get_productivity_rates_by_site_and_role
      args: {}
      expect: ["standard_units_per_hour"]

- question: "09:89:Q2"
  story: >
    Turnover analysis: shift pattern data shows DC operating patterns including early, late,
    and night shifts with overtime levels.
  checks:
    - tool: get_shift_pattern_and_overtime
      args: {site_id: DC3}
      expect: ["DC3", "pattern_name", "overtime_hours_avg"]

- question: "09:89:Q4"
  story: >
    Hire vs agency vs overtime: cost per productive hour shows trade-offs between permanent, agency
    and overtime labour. Quality error rates show labour type differences in performance.
  checks:
    - tool: get_cost_per_productive_hour_by_labour_type
      args: {site_id: DC1}
      expect: ["permanent", "agency", "overtime"]
    - tool: get_quality_error_rate_by_labour_type
      args: {site_id: DC1}
      expect: ["permanent", "overtime", "agency", "error_rate_pct"]
