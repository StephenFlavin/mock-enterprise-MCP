id: esg
name: Carbon & ESG Reporting Platform
instructions: 'Emissions tracking, reduction planning and ESG reporting for carbon,
  energy and sustainability metrics. Covers Scope 1, 2 and 3 emissions. Emission factors
  look like EF-2026-0045. Initiatives look like INI-2026-0023. Claims like CLM-2026-0014.

  '
tables:
  emissions:
    key: emission_id
    cols:
      emission_id:
        type: str
        desc: Emission record, e.g. EMS-000123
      scope:
        type: enum
        values:
        - '1'
        - '2'
        - '3'
        desc: 'GHG scope: 1 Direct, 2 Electricity, 3 Indirect'
      category:
        type: str
        desc: Emission category, e.g. purchased_electricity, transport, materials
      sku:
        type: str
        desc: Product SKU if product-level, null for company-wide
      supplier_id:
        type: str
        desc: Supplier if Scope 3, null otherwise
      tonnes_co2e:
        type: float
        desc: Emissions in tonnes CO2e
      is_measured:
        type: bool
        desc: True if measured (primary data), False if estimated
      measurement_date:
        type: date
        desc: Period end date for this emission
      emission_factor_id:
        type: str
        desc: Emission factor used, e.g. EF-2026-0045
      notes:
        type: str
        desc: Data source or assumptions
      updated_at:
        type: timestamp
        desc: Last updated
  emission_factors:
    key: factor_id
    cols:
      factor_id:
        type: str
        desc: Emission factor, e.g. EF-2026-0045
      factor_name:
        type: str
        desc: Description, e.g. UK grid electricity (2026)
      material:
        type: str
        desc: Material category, e.g. polyester, cotton, recycled_polyester
      transport_mode:
        type: str
        desc: Transport mode if applicable, e.g. air, sea, truck
      kg_co2e_per_unit:
        type: float
        desc: Emission factor value (kg CO2e per unit)
      unit:
        type: str
        desc: Unit measured, e.g. kg, tonne, kwh, km
      source:
        type: str
        desc: Factor source, e.g. DEFRA, ICAO, supplier
      version:
        type: int
        desc: Version number
      data_quality_rating:
        type: enum
        values:
        - A
        - B
        - C
        - D
        desc: A=primary, B=measured, C=estimated, D=proxy
      valid_from:
        type: date
        desc: When this factor is valid from
      valid_to:
        type: date
        desc: When this factor expires
      region:
        type: str
        desc: Region if applicable, e.g. UK, EU, Asia
  reduction_targets:
    key: target_id
    cols:
      target_id:
        type: str
        desc: Target, e.g. TRG-000123
      scope:
        type: enum
        values:
        - '1'
        - '2'
        - '3'
        desc: GHG scope
      baseline_year:
        type: int
        desc: Baseline year
      baseline_tonnes_co2e:
        type: float
        desc: Baseline emissions
      target_year:
        type: int
        desc: Target year
      target_tonnes_co2e:
        type: float
        desc: Target emissions
      reduction_pct:
        type: float
        desc: Reduction percentage from baseline
      pathway:
        type: str
        desc: Pathway name, e.g. SBTi 1.5C, Paris Aligned
      status:
        type: enum
        values:
        - active
        - achieved
        - paused
        - abandoned
        desc: Target status
      notes:
        type: str
        desc: Target assumptions or notes
  reduction_initiatives:
    key: initiative_id
    cols:
      initiative_id:
        type: str
        desc: Initiative, e.g. INI-2026-0023
      name:
        type: str
        desc: Initiative name
      description:
        type: text
        desc: Initiative description
      scope:
        type: enum
        values:
        - '1'
        - '2'
        - '3'
        desc: Scope addressed
      category:
        type: str
        desc: Category, e.g. renewable_energy, recycled_materials, logistics
      expected_savings_tonnes:
        type: float
        desc: Expected CO2e saving
      cost_gbp:
        type: float
        desc: Implementation cost
      start_date:
        type: date
        desc: Planned start
      completion_date:
        type: date
        desc: Planned completion
      status:
        type: enum
        values:
        - planned
        - in_progress
        - completed
        - paused
        desc: Status
      feasibility_rating:
        type: enum
        values:
        - high
        - medium
        - low
        desc: Feasibility to implement
      actual_savings_tonnes:
        type: float
        desc: Actual savings if completed
      created_at:
        type: timestamp
        desc: Creation date
      updated_at:
        type: timestamp
        desc: Last updated
  esg_data_gaps:
    key: gap_id
    cols:
      gap_id:
        type: str
        desc: Data gap, e.g. GAP-000123
      metric:
        type: str
        desc: ESG metric name, e.g. Scope3_supplier_emissions
      description:
        type: str
        desc: What data is missing
      materiality_score:
        type: float
        desc: Materiality score (0-100)
      regulatory_impact:
        type: enum
        values:
        - high
        - medium
        - low
        desc: Reporting impact
      coverage_pct:
        type: float
        desc: '% of emissions currently covered'
      effort_to_close:
        type: enum
        values:
        - easy
        - medium
        - hard
        desc: Effort to close
      priority:
        type: enum
        values:
        - critical
        - high
        - medium
        - low
        desc: Priority
      identified_date:
        type: date
        desc: When gap identified
      target_close_date:
        type: date
        desc: Target closure date
      status:
        type: enum
        values:
        - open
        - in_progress
        - closed
        desc: Gap status
      created_at:
        type: timestamp
        desc: Creation date
  supplier_submissions:
    key: submission_id
    cols:
      submission_id:
        type: str
        desc: Submission, e.g. SUB-000123
      supplier_id:
        type: str
        desc: Supplier
      submission_date:
        type: date
        desc: Submission date
      deadline_date:
        type: date
        desc: Requested deadline
      data_quality_score:
        type: int
        desc: Quality score (0-100)
      completeness_pct:
        type: float
        desc: '% of required fields completed'
      has_scope1:
        type: bool
        desc: Has Scope 1 data
      has_scope2:
        type: bool
        desc: Has Scope 2 data
      has_scope3:
        type: bool
        desc: Has Scope 3 data
      status:
        type: enum
        values:
        - pending
        - received
        - under_review
        - approved
        - rejected
        desc: Submission status
      notes:
        type: str
        desc: Quality issues or notes
      updated_at:
        type: timestamp
        desc: Last updated
  claims_register:
    key: claim_id
    cols:
      claim_id:
        type: str
        desc: Claim, e.g. CLM-2026-0014
      claim_text:
        type: text
        desc: The sustainability claim
      product_category:
        type: str
        desc: Product category if applicable
      risk_level:
        type: enum
        values:
        - high
        - medium
        - low
        desc: Greenwashing risk
      substantiation_available:
        type: bool
        desc: Have evidence
      evidence_path:
        type: str
        desc: Path to evidence file
      review_status:
        type: enum
        values:
        - pending
        - approved
        - amend
        - drop
        desc: Review outcome
      reviewed_by:
        type: str
        desc: Employee who reviewed
      reviewed_date:
        type: date
        desc: Review date
      notes:
        type: str
        desc: Review findings
      created_at:
        type: timestamp
        desc: Creation date
      updated_at:
        type: timestamp
        desc: Last updated
  data_requests:
    key: request_id
    cols:
      request_id:
        type: str
        desc: Request, e.g. REQ-000123
      supplier_id:
        type: str
        desc: Supplier
      request_date:
        type: date
        desc: When requested
      deadline_date:
        type: date
        desc: Deadline for response
      scopes_requested:
        type: str
        desc: Scopes needed, e.g. 1,2,3
      status:
        type: enum
        values:
        - sent
        - received
        - overdue
        - cancelled
        desc: Request status
      notes:
        type: str
        desc: Special instructions
      sent_at:
        type: timestamp
        desc: When sent
  scope2_history:
    key:
    - year
    - site_id
    cols:
      year:
        type: int
        desc: Fiscal year
      site_id:
        type: str
        desc: Site/DC
      kwh_consumed:
        type: float
        desc: Electricity consumed (kWh)
      emissions_tonnes_co2e:
        type: float
        desc: Scope 2 emissions
      factor_kg_per_kwh:
        type: float
        desc: Grid factor used (kg CO2e/kWh)
      factor_source:
        type: str
        desc: Factor source
      method:
        type: enum
        values:
        - location_based
        - market_based
        - combined
        desc: Calculation method
      boundary:
        type: enum
        values:
        - fully_owned
        - equity_share
        desc: Ownership boundary
      updated_at:
        type: timestamp
        desc: Last updated
  transport_factors:
    key:
    - lane_id
    - period_start
    cols:
      lane_id:
        type: str
        desc: Transport lane, e.g. Europe-Asia-sea
      period_start:
        type: date
        desc: Period starting
      transport_mode:
        type: enum
        values:
        - air
        - sea
        - truck
        - rail
        desc: Mode of transport
      origin:
        type: str
        desc: Origin port/location
      destination:
        type: str
        desc: Destination port/location
      factor_kg_per_tonne_km:
        type: float
        desc: Emission factor (kg CO2e per tonne-km)
      factor_source:
        type: str
        desc: Factor source, e.g. ICAO, DEFRA
      version:
        type: int
        desc: Version of factor
      status:
        type: enum
        values:
        - active
        - superseded
        desc: Current status
      updated_at:
        type: timestamp
        desc: Last updated
  regulations:
    key: regulation_id
    cols:
      regulation_id:
        type: str
        desc: Regulation, e.g. REG-UK-TCFD
      name:
        type: str
        desc: Regulation name
      jurisdiction:
        type: str
        desc: Jurisdiction, e.g. UK, EU, global
      requirement_type:
        type: str
        desc: Type, e.g. carbon_disclosure, energy_efficiency
      description:
        type: text
        desc: Requirement description
      applies_to_us:
        type: bool
        desc: Does it apply to Harbour & Vale
      effective_date:
        type: date
        desc: When it takes effect
      scopes_covered:
        type: str
        desc: Scopes covered, e.g. 1,2,3
      data_required:
        type: text
        desc: Data requirements
      url:
        type: str
        desc: Reference URL
tools:
- name: get_emissions_by_scope_and_category
  desc: Emissions split by Scope (1, 2, 3) and category (e.g. transport, materials).
    Includes measured vs estimated flags.
  kind: sql
  args:
    scope:
      type: int
      desc: GHG scope (1, 2 or 3, default all)
    category:
      type: str
      desc: Emission category
    measurement_date_from:
      col: measurement_date
      op: '>='
      type: date
      default: -365d
  sql: "SELECT scope, category,\n       round(sum(tonnes_co2e), 2) AS total_tonnes_co2e,\n\
    \       count(*) FILTER (WHERE is_measured = TRUE) AS measured_records,\n    \
    \   count(*) FILTER (WHERE is_measured = FALSE) AS estimated_records,\n      \
    \ round(100.0 * count(*) FILTER (WHERE is_measured = TRUE) / count(*), 1) AS measured_pct\n\
    FROM emissions\nWHERE ($scope IS NULL OR scope = $scope)\n  AND ($category IS\
    \ NULL OR category = $category)\n  AND measurement_date >= CAST($measurement_date_from\
    \ AS DATE)\nGROUP BY scope, category\nORDER BY total_tonnes_co2e DESC\n"
  limit: 50
  example: {}
- name: get_emissions_by_product_category
  desc: Product-level emissions by category (e.g. apparel, footwear, accessories).
    Use to identify hotspots.
  kind: sql
  args:
    measurement_date_from:
      col: measurement_date
      op: '>='
      type: date
      default: -365d
  sql: "SELECT e.sku, p.category, p.name,\n       round(sum(e.tonnes_co2e), 2) AS\
    \ total_tonnes_co2e,\n       count(*) AS records\nFROM emissions e\nLEFT JOIN\
    \ master.products p ON p.sku = e.sku\nWHERE e.sku IS NOT NULL\n  AND e.measurement_date\
    \ >= CAST($measurement_date_from AS DATE)\nGROUP BY e.sku, p.category, p.name\n\
    ORDER BY total_tonnes_co2e DESC\n"
  limit: 50
  example: {}
- name: get_emissions_by_supplier
  desc: Scope 3 emissions attributed to each supplier, measured or estimated. Shows
    your supply chain footprint.
  kind: sql
  args:
    measurement_date_from:
      col: measurement_date
      op: '>='
      type: date
      default: -365d
  sql: "SELECT e.supplier_id, s.name,\n       round(sum(e.tonnes_co2e), 2) AS total_tonnes_co2e,\n\
    \       count(*) FILTER (WHERE e.is_measured = TRUE) AS measured_records,\n  \
    \     count(*) FILTER (WHERE e.is_measured = FALSE) AS estimated_records\nFROM\
    \ emissions e\nLEFT JOIN master.suppliers s ON s.supplier_id = e.supplier_id\n\
    WHERE e.scope = 3 AND e.supplier_id IS NOT NULL\n  AND e.measurement_date >= CAST($measurement_date_from\
    \ AS DATE)\nGROUP BY e.supplier_id, s.name\nORDER BY total_tonnes_co2e DESC\n"
  limit: 100
  example: {}
- name: get_emissions_data_coverage
  desc: Share of emissions backed by primary data versus estimates. Shows data quality
    by scope.
  kind: sql
  sql: "SELECT scope,\n       round(sum(tonnes_co2e), 2) AS total_tonnes_co2e,\n \
    \      round(100.0 * sum(CASE WHEN is_measured THEN tonnes_co2e ELSE 0 END) /\
    \ sum(tonnes_co2e), 1) AS measured_pct,\n       count(*) FILTER (WHERE is_measured\
    \ = TRUE) AS measured_count,\n       count(*) FILTER (WHERE is_measured = FALSE)\
    \ AS estimated_count\nFROM emissions\nGROUP BY scope\nORDER BY scope\n"
  limit: 10
  example: {}
- name: get_emission_factor_data_quality
  desc: Quality rating and source of an emission factor. Ranges from A (primary) to
    D (proxy).
  kind: sql
  args:
    factor_id:
      required: true
  sql: "SELECT factor_id, factor_name, material, transport_mode, kg_co2e_per_unit,\
    \ unit,\n       source, version, data_quality_rating, valid_from, valid_to, region\n\
    FROM emission_factors\nWHERE factor_id = $factor_id\n"
  limit: 1
  example:
    factor_id: EF-2026-0045
- name: get_emission_factors_applied
  desc: Emission factors used in latest calculations and their versions. Shows which
    factors drive your footprint.
  kind: sql
  sql: "SELECT DISTINCT e.emission_factor_id, f.factor_name, f.data_quality_rating,\n\
    \       round(sum(e.tonnes_co2e), 2) AS total_tonnes_co2e_using_factor,\n    \
    \   count(*) AS usage_count\nFROM emissions e\nJOIN emission_factors f ON f.factor_id\
    \ = e.emission_factor_id\nWHERE e.emission_factor_id IS NOT NULL\nGROUP BY e.emission_factor_id,\
    \ f.factor_name, f.data_quality_rating\nORDER BY total_tonnes_co2e_using_factor\
    \ DESC\n"
  limit: 50
  example: {}
- name: get_emission_factors_applied_to_transport
  desc: Transport emission factors by mode (air, sea, truck, rail) and period. Shows
    which factors apply to each lane.
  kind: sql
  args:
    transport_mode:
      desc: Filter by mode (air, sea, truck, rail)
    period_from:
      col: period_start
      op: '>='
      type: date
      default: -365d
  sql: "SELECT lane_id, transport_mode, origin, destination, period_start,\n     \
    \  factor_kg_per_tonne_km, factor_source, version, status\nFROM transport_factors\n\
    WHERE ($transport_mode IS NULL OR transport_mode = $transport_mode)\n  AND period_start\
    \ >= CAST($period_from AS DATE)\n  AND status = 'active'\nORDER BY period_start\
    \ DESC, lane_id\n"
  limit: 50
  example: {}
- name: get_data_request_deadline
  desc: Supplier data request deadlines for ESG submissions. Shows which suppliers
    are overdue or upcoming.
  kind: sql
  args:
    status:
      type: enum
      values:
      - sent
      - received
      - overdue
      - cancelled
      desc: Filter by status
  sql: "SELECT r.request_id, r.supplier_id, s.name,\n       r.request_date, r.deadline_date,\
    \ r.scopes_requested,\n       r.status,\n       CASE WHEN r.deadline_date < CAST($as_of\
    \ AS DATE) AND r.status = 'sent' THEN 'OVERDUE' ELSE r.status END AS effective_status\n\
    FROM data_requests r\nLEFT JOIN master.suppliers s ON s.supplier_id = r.supplier_id\n\
    WHERE ($status IS NULL OR r.status = $status)\nORDER BY r.deadline_date ASC\n"
  limit: 100
  example: {}
- name: calculate_emissions_trajectory_gap
  desc: Gap between projected emissions and a reduction target pathway. Shows if you're
    on track.
  kind: sql
  args:
    target_id:
      required: true
    projection_method:
      type: str
      default: linear
      desc: 'Projection method: linear or current_trend'
  sql: "WITH target_data AS (\n  SELECT scope, baseline_year, baseline_tonnes_co2e,\
    \ target_year, target_tonnes_co2e, reduction_pct\n  FROM reduction_targets\n \
    \ WHERE target_id = $target_id\n),\nlatest_emissions AS (\n  SELECT scope, round(sum(tonnes_co2e),\
    \ 2) AS latest_tonnes_co2e, MAX(measurement_date) AS latest_date\n  FROM emissions\n\
    \  WHERE scope = (SELECT scope FROM target_data LIMIT 1)\n  GROUP BY scope\n)\n\
    SELECT\n  t.target_id,\n  t.scope,\n  t.baseline_year,\n  t.baseline_tonnes_co2e,\n\
    \  t.target_year,\n  t.target_tonnes_co2e,\n  e.latest_tonnes_co2e,\n  round(t.target_tonnes_co2e\
    \ - e.latest_tonnes_co2e, 2) AS gap_tonnes_co2e,\n  round(100.0 * (t.target_tonnes_co2e\
    \ - e.latest_tonnes_co2e) / e.latest_tonnes_co2e, 1) AS gap_pct,\n  e.latest_date,\n\
    \  'gap = target - latest' AS formula\nFROM target_data t\nCROSS JOIN latest_emissions\
    \ e\n"
  limit: 1
  example:
    target_id: TRG-000123
- name: calculate_abatement_cost_per_tonne
  desc: Cost per tonne CO2e abated for a reduction lever or initiative. Compare cost-effectiveness
    of options.
  kind: sql
  args:
    initiative_id:
      required: true
  sql: "SELECT initiative_id, name, scope, category,\n       expected_savings_tonnes,\
    \ cost_gbp,\n       round(cost_gbp / expected_savings_tonnes, 2) AS cost_per_tonne_gbp,\n\
    \       cost_gbp, expected_savings_tonnes,\n       'cost_per_tonne = cost_gbp\
    \ / savings_tonnes' AS formula\nFROM reduction_initiatives\nWHERE initiative_id\
    \ = $initiative_id\n  AND expected_savings_tonnes > 0\n"
  limit: 1
  example:
    initiative_id: INI-2026-0023
- name: calculate_avoided_emissions_from_reuse
  desc: Emissions avoided by reuse or resale versus new production. Quantifies circular
    economy benefits.
  kind: sql
  args:
    sku:
      required: true
    reuse_volume_units:
      type: float
      required: true
      desc: Units diverted to reuse
    virgin_factor_kg_co2e_per_unit:
      type: float
      required: true
      desc: Emission factor for new production
    reuse_factor_kg_co2e_per_unit:
      type: float
      default: 0.1
      desc: Residual factor for reuse (transport, processing)
  sql: "SELECT\n  $sku AS sku,\n  $reuse_volume_units AS reuse_volume_units,\n  round($virgin_factor_kg_co2e_per_unit\
    \ * $reuse_volume_units / 1000.0, 2) AS virgin_production_co2e_tonnes,\n  round($reuse_factor_kg_co2e_per_unit\
    \ * $reuse_volume_units / 1000.0, 2) AS reuse_processing_co2e_tonnes,\n  round(($virgin_factor_kg_co2e_per_unit\
    \ - $reuse_factor_kg_co2e_per_unit) * $reuse_volume_units / 1000.0, 2) AS avoided_emissions_tonnes,\n\
    \  'avoided = (virgin - reuse) * volume / 1000' AS formula\n"
  limit: 1
  example:
    sku: K-1700
    reuse_volume_units: 1000
    virgin_factor_kg_co2e_per_unit: 2.5
- name: calculate_esg_data_gap_materiality
  desc: Rank ESG data gaps by materiality score and reporting impact. Guides where
    to focus data improvement.
  kind: sql
  sql: "SELECT gap_id, metric, description,\n       materiality_score, regulatory_impact,\
    \ coverage_pct,\n       effort_to_close, priority,\n       identified_date, target_close_date,\
    \ status\nFROM esg_data_gaps\nORDER BY materiality_score DESC, priority DESC\n"
  limit: 50
  example: {}
- name: calculate_scope2_reconciliation
  desc: Year-on-year Scope 2 reconciliation showing bridge from prior year (activity,
    factor, method, boundary).
  kind: sql
  args:
    site_id:
      desc: Site to reconcile (default all)
  sql: "SELECT h1.year, h1.site_id, h1.kwh_consumed, h1.factor_kg_per_kwh, h1.emissions_tonnes_co2e,\n\
    \       CASE WHEN h2.year IS NOT NULL\n        THEN round(h1.emissions_tonnes_co2e\
    \ - h2.emissions_tonnes_co2e, 2)\n        ELSE NULL END AS prior_year_variance,\n\
    \       CASE WHEN h2.year IS NOT NULL AND h2.emissions_tonnes_co2e > 0\n     \
    \   THEN round(100.0 * (h1.emissions_tonnes_co2e - h2.emissions_tonnes_co2e) /\
    \ h2.emissions_tonnes_co2e, 1)\n        ELSE NULL END AS variance_pct,\n     \
    \  h1.method, h1.boundary, h1.factor_source\nFROM scope2_history h1\nLEFT JOIN\
    \ scope2_history h2 ON h2.site_id = h1.site_id AND h2.year = h1.year - 1\nWHERE\
    \ ($site_id IS NULL OR h1.site_id = $site_id)\nORDER BY h1.year DESC, h1.site_id\n"
  limit: 50
  example: {}
- name: calculate_supplier_engagement_priority_score
  desc: Priority score combining supplier emissions, spend and readiness to engage.
    Guides engagement strategy.
  kind: sql
  args:
    limit_to:
      type: int
      default: 20
      desc: Return top N suppliers
  sql: "SELECT e.supplier_id, s.name,\n       round(sum(e.tonnes_co2e), 2) AS emissions_tonnes_co2e,\n\
    \       round(sum(e.tonnes_co2e) / (SELECT sum(tonnes_co2e) FROM emissions WHERE\
    \ scope = 3) * 100.0, 1) AS emissions_pct,\n       round((sum(e.tonnes_co2e) /\
    \ 100.0) * 0.5 + 50, 1) AS priority_score,\n       'priority = (emissions/100)*0.5\
    \ + 50' AS formula\nFROM emissions e\nLEFT JOIN master.suppliers s ON s.supplier_id\
    \ = e.supplier_id\nWHERE e.scope = 3 AND e.supplier_id IS NOT NULL\nGROUP BY e.supplier_id,\
    \ s.name\nORDER BY priority_score DESC\nLIMIT $limit_to\n"
  limit: 100
  example:
    limit_to: 10
- name: create_sustainability_initiative
  desc: Create a reduction initiative record with expected savings, cost and timeline.
    Use for emissions reduction planning.
  kind: insert
  table: reduction_initiatives
  id_prefix: INI-
  defaults:
    status: planned
  args:
    name:
      required: true
      desc: Initiative name
    description:
      type: str
      desc: Full description
    scope:
      required: true
      type: int
      desc: Scope (1, 2 or 3)
    category:
      required: true
