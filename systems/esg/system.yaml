- name: update_transport_emission_factor_for_lane
  desc: Correct the emission factor on one lane and factor period. Requires lane_id and period_start; returns old and new factor.
  kind: update
  table: transport_factors
  args:
    factor_kg_per_tonne_km:
      type: float
      required: true
      desc: Corrected emission factor (kg CO2e per tonne-km)
    status:
      type: str
      desc: active or superseded (leave blank to keep)
    notes:
      type: str
      desc: Why the factor was corrected
  example:
