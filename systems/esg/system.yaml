id: esg
name: Carbon & ESG Reporting Platform
instructions: 'Emissions tracking, reduction planning and ESG reporting for carbon, energy and sustainability metrics. Covers Scope 1, 2 and 3 emissions. Emission factors look like EF-2026-0045. Initiatives
  look like INI-2026-0023. Claims like CLM-2026-0014.

  '
tables:
  emissions:
    key: emission_id
    cols:
      emission_id:
        type: str
        desc: Emission record, e.g. EMS-000123
      scope:
        type: enum
        values:
        - '1'
        - '2'
        - '3'
        desc: 'GHG scope: 1 Direct, 2 Electricity, 3 Indirect'
      category:
        type: str
        desc: Emission category, e.g. purchased_electricity, transport, materials
      ghg_category:
        type: str
        desc: 'GHG Protocol category, e.g. Cat 1 Purchased goods: raw materials'
      value_chain_stage:
        type: str
        desc: upstream, own operations or downstream
      sku:
        type: str
        desc: Product SKU if product-level, null for company-wide
      supplier_id:
        type: str
        desc: Supplier if Scope 3, null otherwise
      site_id:
        type: str
        desc: Site for Scope 1 and 2 records, e.g. DC1
      tonnes_co2e:
        type: float
        desc: Emissions in tonnes CO2e
      is_measured:
        type: bool
        desc: True if measured (primary data), False if estimated
      measurement_date:
        type: date
        desc: Period end date for this emission
      fiscal_year:
        type: int
        desc: Reporting year, e.g. 2026
      emission_factor_id:
        type: str
        desc: Emission factor used, e.g. EF-2026-0045
      notes:
        type: str
        desc: Data source or assumptions
      updated_at:
        type: timestamp
        desc: Last updated
  emission_factors:
    key: factor_id
    cols:
      factor_id:
        type: str
        desc: Emission factor, e.g. EF-2026-0045
      factor_name:
        type: str
        desc: Description, e.g. UK grid electricity (2026)
      material:
        type: str
        desc: Material category, e.g. polyester, cotton, recycled_polyester
      transport_mode:
        type: str
        desc: Transport mode if applicable, e.g. air, sea, truck
      kg_co2e_per_unit:
        type: float
        desc: Emission factor value (kg CO2e per unit)
      unit:
        type: str
        desc: Unit measured, e.g. kg, tonne, kwh, km
      source:
        type: str
        desc: Factor source, e.g. DEFRA, ICAO, supplier
      version:
        type: int
        desc: Version number
      data_quality_rating:
        type: enum
        values:
        - A
        - B
        - C
        - D
        desc: A=primary, B=measured, C=estimated, D=proxy
      valid_from:
        type: date
        desc: When this factor is valid from
      valid_to:
        type: date
        desc: When this factor expires
      region:
        type: str
        desc: Region if applicable, e.g. UK, EU, Asia
      uncertainty_pct:
        type: float
        desc: Typical uncertainty of the factor, percent
  reduction_targets:
    key: target_id
    cols:
      target_id:
        type: str
        desc: Target, e.g. TRG-000123
      scope:
        type: enum
        values:
        - '1'
        - '2'
        - '3'
        desc: GHG scope
      baseline_year:
        type: int
        desc: Baseline year
      baseline_tonnes_co2e:
        type: float
        desc: Baseline emissions
      target_year:
        type: int
        desc: Target year
      target_tonnes_co2e:
        type: float
        desc: Target emissions
      reduction_pct:
        type: float
        desc: Reduction percentage from baseline
      pathway:
        type: str
        desc: Pathway name, e.g. SBTi 1.5C, Paris Aligned
      status:
        type: enum
        values:
        - active
        - achieved
        - paused
        - abandoned
        desc: Target status
      notes:
        type: str
        desc: Target assumptions or notes
  reduction_initiatives:
    key: initiative_id
    cols:
      initiative_id:
        type: str
        desc: Initiative, e.g. INI-2026-0023
      name:
        type: str
        desc: Initiative name
      description:
        type: text
        desc: Initiative description
      scope:
        type: enum
        values:
        - '1'
        - '2'
        - '3'
        desc: Scope addressed
      category:
        type: str
        desc: Category, e.g. renewable_energy, recycled_materials, logistics
      expected_savings_tonnes:
        type: float
        desc: Expected CO2e saving
      cost_gbp:
        type: float
        desc: Implementation cost
      start_date:
        type: date
        desc: Planned start
      completion_date:
        type: date
        desc: Planned completion
      status:
        type: enum
        values:
        - planned
        - in_progress
        - completed
        - paused
        desc: Status
      feasibility_rating:
        type: enum
        values:
        - high
        - medium
        - low
        desc: Feasibility to implement
      actual_savings_tonnes:
        type: float
        desc: Actual savings if completed
      created_at:
        type: timestamp
        desc: Creation date
      updated_at:
        type: timestamp
        desc: Last updated
  esg_data_gaps:
    key: gap_id
    cols:
      gap_id:
        type: str
        desc: Data gap, e.g. GAP-000123
      metric:
        type: str
        desc: ESG metric name, e.g. Scope3_supplier_emissions
      description:
        type: str
        desc: What data is missing
      materiality_score:
        type: float
        desc: Materiality score (0-100)
      regulatory_impact:
        type: enum
        values:
        - high
        - medium
        - low
        desc: Reporting impact
      coverage_pct:
        type: float
        desc: '% of emissions currently covered'
      effort_to_close:
        type: enum
        values:
        - easy
        - medium
        - hard
        desc: Effort to close
      priority:
        type: enum
        values:
        - critical
        - high
        - medium
        - low
        desc: Priority
      identified_date:
        type: date
        desc: When gap identified
      target_close_date:
        type: date
        desc: Target closure date
      status:
        type: enum
        values:
        - open
        - in_progress
        - closed
        desc: Gap status
      required_by:
        type: str
        desc: Rules that require this data, e.g. CSRD ESRS E1
      created_at:
        type: timestamp
        desc: Creation date
  supplier_submissions:
    key: submission_id
    cols:
      submission_id:
        type: str
        desc: Submission, e.g. SUB-000123
      supplier_id:
        type: str
        desc: Supplier
      submission_date:
        type: date
        desc: Submission date
      deadline_date:
        type: date
        desc: Requested deadline
      data_quality_score:
        type: int
        desc: Quality score (0-100)
      completeness_pct:
        type: float
        desc: '% of required fields completed'
      has_scope1:
        type: bool
        desc: Has Scope 1 data
      has_scope2:
        type: bool
        desc: Has Scope 2 data
      has_scope3:
        type: bool
        desc: Has Scope 3 data
      status:
        type: enum
        values:
        - pending
        - received
        - under_review
        - approved
        - rejected
        desc: Submission status
      notes:
        type: str
        desc: Quality issues or notes
      updated_at:
        type: timestamp
        desc: Last updated
  claims_register:
    key: claim_id
    cols:
      claim_id:
        type: str
        desc: Claim, e.g. CLM-2026-0014
      claim_text:
        type: text
        desc: The sustainability claim
      product_category:
        type: str
        desc: Product category if applicable
      risk_level:
        type: enum
        values:
        - high
        - medium
        - low
        desc: Greenwashing risk
      substantiation_available:
        type: bool
        desc: Have evidence
      evidence_path:
        type: str
        desc: Path to evidence file
      review_status:
        type: enum
        values:
        - pending
        - approved
        - amend
        - drop
        desc: Review outcome
      reviewed_by:
        type: str
        desc: Employee who reviewed
      reviewed_date:
        type: date
        desc: Review date
      notes:
        type: str
        desc: Review findings
      created_at:
        type: timestamp
        desc: Creation date
      updated_at:
        type: timestamp
        desc: Last updated
  data_requests:
    key: request_id
    cols:
      request_id:
        type: str
        desc: Request, e.g. REQ-000123
      supplier_id:
        type: str
        desc: Supplier
      request_date:
        type: date
        desc: When requested
      deadline_date:
        type: date
        desc: Deadline for response
      scopes_requested:
        type: str
        desc: Scopes needed, e.g. 1,2,3
      status:
        type: enum
        values:
        - sent
        - received
        - overdue
        - cancelled
        desc: Request status
      notes:
        type: str
        desc: Special instructions
      sent_at:
        type: timestamp
        desc: When sent
  scope2_history:
    key:
    - year
    - site_id
    cols:
      year:
        type: int
        desc: Fiscal year
      site_id:
        type: str
        desc: Site/DC
      kwh_consumed:
        type: float
        desc: Electricity consumed (kWh)
      emissions_tonnes_co2e:
        type: float
        desc: Scope 2 emissions
      factor_kg_per_kwh:
        type: float
        desc: Grid factor used (kg CO2e/kWh)
      factor_source:
        type: str
        desc: Factor source
      method:
        type: enum
        values:
        - location_based
        - market_based
        - combined
        desc: Calculation method
      boundary:
        type: enum
        values:
        - fully_owned
        - equity_share
        desc: Ownership boundary
      updated_at:
        type: timestamp
        desc: Last updated
      grid_factor_kg_per_kwh:
        type: float
        desc: Location-based grid factor for the year, kg CO2e per kWh
      emission_factor_id:
        type: str
        desc: Emission factor applied, e.g. EF-2026-0040
      in_boundary:
        type: bool
        desc: True if the site is inside the Scope 2 reporting boundary
      notes:
        type: text
        desc: Method or boundary change explanation
  transport_factors:
    key:
    - lane_id
    - period_start
    cols:
      lane_id:
        type: str
        desc: Transport lane, e.g. Europe-Asia-sea
      period_start:
        type: date
        desc: Period starting
      transport_mode:
        type: enum
        values:
        - air
        - sea
        - truck
        - rail
        desc: Mode of transport
      origin:
        type: str
        desc: Origin port/location
      destination:
        type: str
        desc: Destination port/location
      factor_kg_per_tonne_km:
        type: float
        desc: Emission factor (kg CO2e per tonne-km)
      factor_source:
        type: str
        desc: Factor source, e.g. ICAO, DEFRA
      version:
        type: int
        desc: Version of factor
      status:
        type: enum
        values:
        - active
        - superseded
        desc: Current status
      updated_at:
        type: timestamp
        desc: Last updated
      corridor:
        type: str
        desc: Trade corridor, e.g. Asia-Europe
      notes:
        type: text
        desc: Source or correction notes
  regulations:
    key: regulation_id
    cols:
      regulation_id:
        type: str
        desc: Regulation, e.g. REG-UK-TCFD
      name:
        type: str
        desc: Regulation name
      jurisdiction:
        type: str
        desc: Jurisdiction, e.g. UK, EU, global
      requirement_type:
        type: str
        desc: Type, e.g. carbon_disclosure, energy_efficiency
      description:
        type: text
        desc: Requirement description
      applies_to_us:
        type: bool
        desc: Does it apply to Harbour & Vale
      effective_date:
        type: date
        desc: When it takes effect
      scopes_covered:
        type: str
        desc: Scopes covered, e.g. 1,2,3
      data_required:
        type: text
        desc: Data requirements
      url:
        type: str
        desc: Reference URL
      in_scope_reason:
        type: text
        desc: Why the rule applies or does not apply to us
  emissions_annual:
    key:
    - year
    - scope
    cols:
      year:
        type: int
        desc: Reporting year, e.g. 2023
      scope:
        type: enum
        values:
        - '1'
        - '2'
        - '3'
        desc: GHG scope
      tonnes_co2e:
        type: float
        desc: Annual emissions in tonnes CO2e
      basis:
        type: str
        desc: Basis of the figure, e.g. reported inventory
  esg_gap_tasks:
    key: task_id
    cols:
      task_id:
        type: str
        desc: Task, e.g. TSK-000001
      gap_id:
        type: str
        desc: ESG data gap the task closes, e.g. GAP-000001
      description:
        type: text
        desc: What the task will do
      priority:
        type: str
        desc: critical, high, medium or low
      due_date:
        type: date
        desc: Due date
      employee_id:
        type: str
        desc: Owner employee, e.g. EMP-00010
      status:
        type: str
        desc: open, in_progress or done
      created_at:
        type: timestamp
        desc: Created
      updated_at:
        type: timestamp
        desc: Last updated
  transport_emissions:
    key:
    - lane_id
    - month_start
    cols:
      lane_id:
        type: str
        desc: Lane, e.g. CNSHA-GBFXT-SEA
      month_start:
        type: date
        desc: First day of the month
      tonnes_shipped:
        type: float
        desc: Tonnes shipped on the lane in the month
      distance_km:
        type: float
        desc: Lane distance in km
      tonne_km:
        type: float
        desc: Tonne-km = tonnes x km
      updated_at:
        type: timestamp
        desc: Last updated
  platform_modules:
    key: module
    cols:
      module:
        type: str
        desc: Platform module, e.g. Carbon accounting
      scopes_supported:
        type: str
        desc: Scopes supported
      frameworks:
        type: str
        desc: Frameworks covered, e.g. CSRD ESRS E1-E5
      status:
        type: str
        desc: live, not_licensed, planned or not_available
      addon_quote_gbp:
        type: float
        desc: Add-on quote in GBP, 0 if included or not quoted
      notes:
        type: text
        desc: Capability notes
  supplier_sbti:
    key: supplier_id
    cols:
      supplier_id:
        type: str
        desc: Supplier, e.g. SUP-0001
      sbti_status:
        type: str
        desc: targets_set, committed or none
      target_ambition:
        type: str
        desc: Target ambition, e.g. 1.5C
      target_year:
        type: int
        desc: Target year
      status_date:
        type: date
        desc: Date of the status
      notes:
        type: text
        desc: Notes
tools:
- name: get_emissions_by_scope_and_category
  desc: Emissions by Scope (1, 2, 3), GHG category and value-chain stage, with measured versus estimated tonnes. Use for the value-chain breakdown.
  kind: sql
  args:
    scope:
      type: int
      desc: GHG scope (1, 2 or 3, default all)
    category:
      type: str
      desc: Emission category, e.g. materials, inbound_transport, fleet
    measurement_date_from:
      type: date
      default: -365d
      desc: Start of the period
  sql: "SELECT e.scope, e.category, e.ghg_category, e.value_chain_stage,\n       round(sum(e.tonnes_co2e), 1) AS total_tonnes_co2e,\n       round(100.0 * sum(e.tonnes_co2e) / sum(sum(e.tonnes_co2e)) OVER\
    \ (), 1) AS share_of_total_pct,\n       round(coalesce(sum(e.tonnes_co2e) FILTER (WHERE e.is_measured), 0), 1) AS measured_tonnes,\n       round(coalesce(sum(e.tonnes_co2e) FILTER (WHERE NOT e.is_measured),\
    \ 0), 1) AS estimated_tonnes,\n       round(100.0 * coalesce(sum(e.tonnes_co2e) FILTER (WHERE e.is_measured), 0) / sum(e.tonnes_co2e), 1) AS measured_pct,\n       count(*) AS records\nFROM emissions\
    \ e\nWHERE ($scope IS NULL OR CAST(e.scope AS VARCHAR) = CAST($scope AS VARCHAR))\n  AND ($category IS NULL OR e.category = $category)\n  AND e.measurement_date >= CAST($measurement_date_from AS DATE)\n\
    GROUP BY e.scope, e.category, e.ghg_category, e.value_chain_stage\nORDER BY total_tonnes_co2e DESC\n"
  limit: 50
  example: {}
- name: get_emissions_by_product_category
  desc: Cradle-to-gate (materials and processing) emissions of purchased products by department and category, or by SKU. Use to find product hotspots.
  kind: sql
  args:
    department:
      type: str
      desc: Department, e.g. Womenswear, Menswear, Kids, Home, Electricals
    category:
      type: str
      desc: Product category, e.g. Knitwear, Outerwear
    group_by:
      type: enum
      values:
      - category
      - sku
      default: category
      desc: Group by product category, or by individual SKU
    measurement_date_from:
      type: date
      default: -365d
      desc: Start of the period
  sql: "SELECT p.department, p.category,\n       CASE WHEN $group_by = 'sku' THEN e.sku ELSE NULL END AS sku,\n       CASE WHEN $group_by = 'sku' THEN any_value(p.name) ELSE NULL END AS product_name,\n\
    \       round(sum(e.tonnes_co2e), 1) AS total_tonnes_co2e,\n       round(100.0 * sum(e.tonnes_co2e) / sum(sum(e.tonnes_co2e)) OVER (), 1) AS share_of_product_emissions_pct,\n       round(100.0 * coalesce(sum(e.tonnes_co2e)\
    \ FILTER (WHERE e.is_measured), 0) / sum(e.tonnes_co2e), 1) AS measured_pct,\n       count(DISTINCT e.sku) AS skus\nFROM emissions e\nJOIN master.products p ON p.sku = e.sku\nWHERE e.sku IS NOT NULL\n\
    \  AND ($department IS NULL OR lower(p.department) = lower($department))\n  AND ($category IS NULL OR lower(p.category) = lower($category))\n  AND e.measurement_date >= CAST($measurement_date_from AS\
    \ DATE)\nGROUP BY 1, 2, 3\nORDER BY total_tonnes_co2e DESC\n"
  limit: 40
  example: {}
- name: get_emissions_by_supplier
  desc: Scope 3 emissions attributed to each supplier with measured versus estimated split and share of Scope 3, largest first. Use top_n for the top suppliers.
  kind: sql
  args:
    top_n:
      type: int
      default: 100
      desc: Return only the top N suppliers by emissions
    measurement_date_from:
      type: date
      default: -365d
      desc: Start of the period
  sql: "WITH tot AS (SELECT sum(tonnes_co2e) AS s3 FROM emissions\n             WHERE CAST(scope AS VARCHAR) = '3' AND measurement_date >= CAST($measurement_date_from AS DATE)),\nx AS (\n  SELECT e.supplier_id,\
    \ any_value(s.name) AS name, any_value(s.country) AS country,\n         sum(e.tonnes_co2e) AS t,\n         coalesce(sum(e.tonnes_co2e) FILTER (WHERE e.is_measured), 0) AS mt\n  FROM emissions e\n  LEFT\
    \ JOIN master.suppliers s ON s.supplier_id = e.supplier_id\n  WHERE CAST(e.scope AS VARCHAR) = '3' AND e.supplier_id IS NOT NULL\n    AND e.measurement_date >= CAST($measurement_date_from AS DATE)\n\
    \  GROUP BY e.supplier_id)\nSELECT row_number() OVER (ORDER BY x.t DESC) AS rank, x.supplier_id, x.name, x.country,\n       round(x.t, 1) AS total_tonnes_co2e,\n       round(100.0 * x.t / tot.s3, 1)\
    \ AS share_of_scope3_pct,\n       round(100.0 * sum(x.t) OVER (ORDER BY x.t DESC) / tot.s3, 1) AS cumulative_share_pct,\n       round(x.mt, 1) AS measured_tonnes, round(x.t - x.mt, 1) AS estimated_tonnes,\n\
    \       round(100.0 * x.mt / x.t, 1) AS measured_pct\nFROM x CROSS JOIN tot\nORDER BY x.t DESC\nLIMIT $top_n\n"
  limit: 100
  example:
    top_n: 20
- name: get_emissions_data_coverage
  desc: Share of emissions (by tonnes) backed by primary measured data versus estimates, by scope or by scope and category. Shows data-quality gaps.
  kind: sql
  args:
    scope:
      type: int
      desc: GHG scope (1, 2 or 3, default all)
    group_by:
      type: enum
      values:
      - scope
      - category
      default: scope
      desc: One row per scope, or per scope and category
    measurement_date_from:
      type: date
      default: -365d
      desc: Start of the period
  sql: "SELECT e.scope,\n       CASE WHEN $group_by = 'category' THEN e.category ELSE 'all categories' END AS category,\n       round(sum(e.tonnes_co2e), 1) AS total_tonnes_co2e,\n       round(100.0 * coalesce(sum(e.tonnes_co2e)\
    \ FILTER (WHERE e.is_measured), 0) / sum(e.tonnes_co2e), 1) AS measured_pct,\n       round(100.0 - 100.0 * coalesce(sum(e.tonnes_co2e) FILTER (WHERE e.is_measured), 0) / sum(e.tonnes_co2e), 1) AS estimated_pct,\n\
    \       count(*) FILTER (WHERE e.is_measured) AS measured_records,\n       count(*) FILTER (WHERE NOT e.is_measured) AS estimated_records\nFROM emissions e\nWHERE ($scope IS NULL OR CAST(e.scope AS\
    \ VARCHAR) = CAST($scope AS VARCHAR))\n  AND e.measurement_date >= CAST($measurement_date_from AS DATE)\nGROUP BY e.scope, 2\nORDER BY e.scope, total_tonnes_co2e DESC\n"
  limit: 40
  example: {}
- name: get_emission_factor_data_quality
  desc: Quality rating (A primary to D proxy), source, version, region and uncertainty of one emission factor. Use after searching factors by material.
  kind: sql
  args:
    factor_id:
      required: true
  sql: "SELECT factor_id, factor_name, material, region, kg_co2e_per_unit, unit, source, version,\n       data_quality_rating,\n       CASE data_quality_rating WHEN 'A' THEN 'A: primary or regulator-published'\
    \ WHEN 'B' THEN 'B: peer-reviewed LCA or industry database'\n            WHEN 'C' THEN 'C: secondary or generic data' ELSE 'D: proxy or spend-based estimate' END AS rating_meaning,\n       uncertainty_pct,\
    \ valid_from, valid_to\nFROM emission_factors\nWHERE factor_id = $factor_id\n"
  limit: 1
  example:
    factor_id: EF-2026-0003
- name: get_emission_factors_applied
  desc: Emission factors applied in the inventory by scope and year, with factor version, source, rating and tonnes. Use to see which factors drive a footprint.
  kind: sql
  args:
    scope:
      type: int
      desc: GHG scope (1, 2 or 3, default all)
    year:
      type: int
      desc: Reporting year, e.g. 2026 (default all years)
  sql: "WITH u AS (\n  SELECT CAST(e.scope AS VARCHAR) AS scope, e.fiscal_year AS year, e.emission_factor_id AS fid,\n         sum(e.tonnes_co2e) AS tonnes, count(*) AS n\n  FROM emissions e\n  WHERE e.emission_factor_id\
    \ IS NOT NULL AND CAST(e.scope AS VARCHAR) <> '2'\n  GROUP BY 1, 2, 3\n  UNION ALL\n  SELECT '2', h.year, h.emission_factor_id, sum(h.emissions_tonnes_co2e), count(*)\n  FROM scope2_history h GROUP\
    \ BY 1, 2, 3)\nSELECT u.scope, u.year, f.factor_id, f.factor_name, f.version, f.source, f.data_quality_rating,\n       f.kg_co2e_per_unit, f.unit, f.region, round(u.tonnes, 1) AS tonnes_co2e_using_factor,\
    \ u.n AS usage_count\nFROM u JOIN emission_factors f ON f.factor_id = u.fid\nWHERE ($scope IS NULL OR u.scope = CAST($scope AS VARCHAR))\n  AND ($year IS NULL OR u.year = $year)\nORDER BY u.year DESC,\
    \ u.scope, u.tonnes DESC\n"
  limit: 60
  example:
    scope: 2
- name: get_emission_factors_applied_to_transport
  desc: Transport emission factors by lane, mode, corridor and version period, including superseded ones. Shows which factor applies to each lane.
  kind: sql
  args:
    transport_mode:
      type: str
      desc: Filter by mode (air, sea, truck)
    corridor:
      type: str
      desc: Trade corridor, e.g. Asia-Europe, Americas-Europe, Intra-Europe
    lane_id:
      type: str
      desc: Lane, e.g. CNSHA-GBFXT-SEA
    status:
      type: str
      desc: active or superseded (default both)
    period_from:
      type: date
      default: -540d
      desc: Earliest factor period start
  sql: "SELECT lane_id, transport_mode, corridor, origin, destination, period_start,\n       factor_kg_per_tonne_km, factor_source, version, status, notes\nFROM transport_factors\nWHERE ($transport_mode\
    \ IS NULL OR transport_mode = $transport_mode)\n  AND ($corridor IS NULL OR lower(corridor) = lower($corridor))\n  AND ($lane_id IS NULL OR lane_id = $lane_id)\n  AND ($status IS NULL OR status = $status)\n\
    \  AND period_start >= CAST($period_from AS DATE)\nORDER BY lane_id, period_start\n"
  limit: 40
  example:
    corridor: Asia-Europe
- name: get_data_request_deadline
  desc: Supplier ESG data request deadlines with status, overdue flag and scopes requested. Shows who is overdue and when the open requests are due.
  kind: sql
  args:
    status:
      type: enum
      values:
      - sent
      - received
      - overdue
      - cancelled
      desc: Filter by status
    supplier_id: {}
  sql: "SELECT r.request_id, r.supplier_id, s.name, r.request_date, r.deadline_date, r.scopes_requested, r.status,\n       CASE WHEN r.deadline_date < CAST($as_of AS DATE) AND r.status IN ('sent', 'overdue')\
    \ THEN 'OVERDUE' ELSE r.status END AS effective_status,\n       CAST(r.deadline_date AS DATE) - CAST($as_of AS DATE) AS days_to_deadline\nFROM data_requests r\nLEFT JOIN master.suppliers s ON s.supplier_id\
    \ = r.supplier_id\nWHERE ($status IS NULL OR r.status = $status)\n  AND ($supplier_id IS NULL OR r.supplier_id = $supplier_id)\nORDER BY r.deadline_date, r.supplier_id\n"
  limit: 100
  example: {}
- name: calculate_emissions_trajectory_gap
  desc: Gap between projected emissions in the target year and a reduction target, with planned initiative savings and the remaining gap. Use for on-track checks.
  kind: sql
  args:
    target_id:
      required: true
    projection_method:
      type: enum
      values:
      - linear
      - current_trend
      default: linear
      desc: linear continues the baseline-to-latest rate; current_trend uses the last three years
  sql: "WITH t AS (SELECT * FROM reduction_targets WHERE target_id = $target_id),\nc AS (SELECT max(e.fiscal_year) AS yr, sum(e.tonnes_co2e) AS tonnes\n      FROM emissions e, t\n      WHERE CAST(e.scope\
    \ AS VARCHAR) = CAST(t.scope AS VARCHAR)\n        AND e.measurement_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY),\np AS (SELECT a.tonnes_co2e AS tonnes FROM emissions_annual a, t, c\n      WHERE\
    \ CAST(a.scope AS VARCHAR) = CAST(t.scope AS VARCHAR) AND a.year = c.yr - 3),\ni AS (SELECT coalesce(sum(r.expected_savings_tonnes), 0) AS planned\n      FROM reduction_initiatives r, t\n      WHERE\
    \ CAST(r.scope AS VARCHAR) = CAST(t.scope AS VARCHAR) AND r.status IN ('planned', 'in_progress')),\nm AS (SELECT t.target_id, t.scope, t.pathway, t.baseline_year, t.baseline_tonnes_co2e, c.yr AS latest_year,\n\
    \             c.tonnes AS latest, t.target_year, t.target_tonnes_co2e AS target,\n             CASE WHEN $projection_method = 'current_trend' THEN (c.tonnes - p.tonnes) / 3.0\n                  ELSE\
    \ (c.tonnes - t.baseline_tonnes_co2e) / (c.yr - t.baseline_year) END AS annual_change,\n             i.planned\n      FROM t, c, p, i)\nSELECT target_id, scope, pathway, baseline_year, baseline_tonnes_co2e,\
    \ latest_year,\n       round(latest, 1) AS latest_tonnes_co2e, target_year, target AS target_tonnes_co2e,\n       $projection_method AS projection_method,\n       round(annual_change, 1) AS annual_change_tonnes,\n\
    \       round(latest + annual_change * (target_year - latest_year), 1) AS projected_tonnes_in_target_year,\n       round(latest + annual_change * (target_year - latest_year) - target, 1) AS gap_tonnes_co2e,\n\
    \       round(100.0 * (latest + annual_change * (target_year - latest_year) - target) / target, 1) AS gap_pct_of_target,\n       round((latest - target) / (target_year - latest_year), 1) AS required_annual_reduction_tonnes,\n\
    \       round(planned, 1) AS planned_initiative_savings_tonnes,\n       round(latest + annual_change * (target_year - latest_year) - target - planned, 1) AS gap_after_planned_initiatives,\n       'gap\
    \ = projected - target; projected = latest + annual_change * years_left' AS formula\nFROM m\n"
  limit: 1
  example:
    target_id: TRG-000003
- name: calculate_abatement_cost_per_tonne
  desc: Cost per tonne CO2e abated for an initiative, or a what-if lever from savings and cost. Scales by reach to compare levers.
  kind: sql
  args:
    initiative_id:
      type: str
      desc: Initiative to cost, e.g. INI-2026-0005 (optional if savings and cost are given)
    expected_savings_tonnes:
      type: float
      desc: Savings in tonnes CO2e at full reach (overrides the initiative)
    cost_gbp:
      type: float
      desc: Cost in GBP at full reach (overrides the initiative)
    reach_pct:
      type: float
      default: 100
      desc: Share of the lever achieved, e.g. 50 if only half the suppliers switch
    fixed_cost_pct:
      type: float
      default: 0
      desc: Share of cost that does not shrink with reach
  sql: "WITH b AS (SELECT initiative_id, name, scope, category, feasibility_rating, expected_savings_tonnes AS s, cost_gbp AS c\n           FROM reduction_initiatives WHERE initiative_id = $initiative_id),\n\
    m AS (SELECT (SELECT initiative_id FROM b) AS initiative_id,\n             coalesce((SELECT name FROM b), 'What-if lever') AS lever,\n             (SELECT feasibility_rating FROM b) AS feasibility_rating,\n\
    \             coalesce($expected_savings_tonnes, (SELECT s FROM b)) AS s_full,\n             coalesce($cost_gbp, (SELECT c FROM b)) AS c_full)\nSELECT initiative_id, lever, feasibility_rating,\n   \
    \    round(s_full, 1) AS savings_tonnes_full_reach, round(c_full, 0) AS cost_gbp_full_reach, $reach_pct AS reach_pct,\n       round(s_full * $reach_pct / 100.0, 1) AS savings_tonnes_at_reach,\n    \
    \   round(c_full * ($fixed_cost_pct / 100.0 + (1 - $fixed_cost_pct / 100.0) * $reach_pct / 100.0), 0) AS cost_gbp_at_reach,\n       round(c_full * ($fixed_cost_pct / 100.0 + (1 - $fixed_cost_pct / 100.0)\
    \ * $reach_pct / 100.0) / (s_full * $reach_pct / 100.0), 2) AS cost_per_tonne_gbp,\n       'cost_per_tonne = cost_at_reach / savings_at_reach' AS formula\nFROM m\nWHERE s_full > 0 AND c_full IS NOT\
    \ NULL AND $reach_pct > 0\n"
  limit: 1
  example:
    initiative_id: INI-2026-0005
- name: calculate_avoided_emissions_from_reuse
  desc: Emissions avoided by reuse or resale versus new production. Quantifies circular economy benefits.
  kind: sql
  args:
    sku:
      required: true
    reuse_volume_units:
      type: float
      required: true
      desc: Units diverted to reuse
    virgin_factor_kg_co2e_per_unit:
      type: float
      required: true
      desc: Emission factor for new production
    reuse_factor_kg_co2e_per_unit:
      type: float
      default: 0.1
      desc: Residual factor for reuse (transport, processing)
  sql: "SELECT\n  $sku AS sku,\n  $reuse_volume_units AS reuse_volume_units,\n  round($virgin_factor_kg_co2e_per_unit * $reuse_volume_units / 1000.0, 2) AS virgin_production_co2e_tonnes,\n  round($reuse_factor_kg_co2e_per_unit\
    \ * $reuse_volume_units / 1000.0, 2) AS reuse_processing_co2e_tonnes,\n  round(($virgin_factor_kg_co2e_per_unit - $reuse_factor_kg_co2e_per_unit) * $reuse_volume_units / 1000.0, 2) AS avoided_emissions_tonnes,\n\
    \  'avoided = (virgin - reuse) * volume / 1000' AS formula\n"
  limit: 1
  example:
    sku: K-1700
    reuse_volume_units: 1000
    virgin_factor_kg_co2e_per_unit: 2.5
- name: calculate_esg_data_gap_materiality
  desc: Rank ESG data gaps by impact (materiality, missing coverage, regulatory weight), with effort to close. Use to find the biggest gap.
  kind: sql
  args:
    status:
      type: str
      desc: open or in_progress (default all)
  sql: "WITH x AS (\n  SELECT gap_id, metric, description, materiality_score, regulatory_impact, coverage_pct, effort_to_close, priority,\n         required_by, status, target_close_date,\n         round(materiality_score\
    \ * (100 - coverage_pct) / 100.0 *\n               CASE regulatory_impact WHEN 'high' THEN 1.0 WHEN 'medium' THEN 0.7 ELSE 0.4 END, 1) AS impact_score\n  FROM esg_data_gaps WHERE ($status IS NULL OR\
    \ status = $status))\nSELECT rank() OVER (ORDER BY impact_score DESC) AS impact_rank, *,\n       'impact = materiality x (100 - coverage)/100 x regulatory weight (high 1, medium 0.7, low 0.4)' AS formula\n\
    FROM x ORDER BY impact_score DESC\n"
  limit: 20
  example: {}
- name: calculate_scope2_reconciliation
  desc: 'Year-on-year Scope 2 bridge from the prior year to the reported total: activity, grid factor, method and boundary effects. Use to explain a Scope 2 change.'
  kind: sql
  args:
    year:
      type: int
      desc: Year to reconcile to its prior year (default latest)
    site_id:
      desc: Limit to one site (default all sites)
  sql: "WITH yr AS (SELECT coalesce($year, max(year)) AS y FROM scope2_history),\nj AS (\n  SELECT c.site_id, c.kwh_consumed AS k1, p.kwh_consumed AS k0, c.emissions_tonnes_co2e AS e1, p.emissions_tonnes_co2e\
    \ AS e0,\n         c.factor_kg_per_kwh AS f1, p.factor_kg_per_kwh AS f0, c.grid_factor_kg_per_kwh AS g1,\n         c.in_boundary AS b1, p.in_boundary AS b0, c.method AS m1, p.method AS m0\n  FROM scope2_history\
    \ c\n  JOIN yr ON c.year = yr.y\n  JOIN scope2_history p ON p.site_id = c.site_id AND p.year = c.year - 1\n  WHERE ($site_id IS NULL OR c.site_id = $site_id)),\ns AS (\n  SELECT e0, e1,\n         CASE\
    \ WHEN b0 AND b1 THEN (k1 - k0) * f0 / 1000.0 ELSE 0 END AS activity,\n         CASE WHEN b0 AND b1 THEN (CASE WHEN m1 = m0 THEN f1 ELSE g1 END - f0) * k1 / 1000.0 ELSE 0 END AS grid_factor,\n     \
    \    CASE WHEN b0 AND b1 AND m1 <> m0 THEN (f1 - g1) * k1 / 1000.0 ELSE 0 END AS method_change,\n         CASE WHEN b0 AND NOT b1 THEN -e0 WHEN b1 AND NOT b0 THEN e1 ELSE 0 END AS boundary_change FROM\
    \ j),\nt AS (SELECT sum(e0) AS e0, sum(activity) AS a, sum(grid_factor) AS f, sum(method_change) AS m, sum(boundary_change) AS b, sum(e1) AS e1 FROM s)\nSELECT 1 AS step, (SELECT y - 1 FROM yr) AS prior_year,\
    \ 'Prior year reported' AS bridge_item, round(e0, 1) AS tonnes_co2e,\n       NULL AS pct_of_prior_year, 'Reported Scope 2 in the prior year' AS explanation FROM t\nUNION ALL SELECT 2, NULL, 'Activity\
    \ (kWh) change', round(a, 1), round(100.0 * a / e0, 1), 'Change in electricity use at the prior-year factor, sites in boundary both years' FROM t\nUNION ALL SELECT 3, NULL, 'Grid factor change', round(f,\
    \ 1), round(100.0 * f / e0, 1), 'Change in the location-based grid emission factor' FROM t\nUNION ALL SELECT 4, NULL, 'Method change', round(m, 1), round(100.0 * m / e0, 1), 'Location-based to market-based\
    \ (supplier-specific factor) at sites that switched' FROM t\nUNION ALL SELECT 5, NULL, 'Boundary change', round(b, 1), round(100.0 * b / e0, 1), 'Sites entering or leaving the reporting boundary' FROM\
    \ t\nUNION ALL SELECT 6, NULL, 'Rounding / other', round(e1 - e0 - a - f - m - b, 1), NULL, 'Unexplained residual' FROM t\nUNION ALL SELECT 7, (SELECT y FROM yr), 'Current year reported', round(e1,\
    \ 1), round(100.0 * (e1 - e0) / e0, 1), 'Reported Scope 2 this year; pct is the total change versus prior year' FROM t\nORDER BY step\n"
  limit: 10
  example: {}
- name: calculate_supplier_engagement_priority_score
  desc: Rank suppliers for emissions engagement by score combining Scope 3 emissions, annual spend and readiness (data submitted), with SBTi status.
  kind: sql
  args:
    limit_to:
      type: int
      default: 20
      desc: Return top N suppliers
  sql: "WITH tot AS (SELECT sum(tonnes_co2e) AS s3 FROM emissions\n             WHERE CAST(scope AS VARCHAR) = '3' AND measurement_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY),\nem AS (SELECT supplier_id,\
    \ sum(tonnes_co2e) AS t,\n              coalesce(sum(tonnes_co2e) FILTER (WHERE is_measured), 0) AS mt\n       FROM emissions\n       WHERE CAST(scope AS VARCHAR) = '3' AND supplier_id IS NOT NULL\n\
    \         AND measurement_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY\n       GROUP BY supplier_id),\nsb AS (SELECT supplier_id, max(completeness_pct) AS c FROM supplier_submissions GROUP BY supplier_id),\n\
    x AS (SELECT em.supplier_id, s.name, s.country, em.t, em.mt, s.annual_spend_gbp,\n             coalesce(nullif(sb.c, 0), 20) AS readiness, coalesce(q.sbti_status, 'none') AS sbti_status\n      FROM\
    \ em\n      JOIN master.suppliers s ON s.supplier_id = em.supplier_id\n      LEFT JOIN sb ON sb.supplier_id = em.supplier_id\n      LEFT JOIN supplier_sbti q ON q.supplier_id = em.supplier_id),\ny AS\
    \ (SELECT x.*, round(100 * (0.5 * x.t / max(x.t) OVER () + 0.3 * x.annual_spend_gbp / max(x.annual_spend_gbp) OVER ()\n                               + 0.2 * x.readiness / 100.0), 1) AS priority_score\
    \ FROM x)\nSELECT row_number() OVER (ORDER BY y.priority_score DESC, y.t DESC) AS priority_rank, y.supplier_id, y.name, y.country,\n       round(y.t, 1) AS emissions_tonnes_co2e, round(100.0 * y.t /\
    \ tot.s3, 1) AS emissions_pct_of_scope3,\n       round(100.0 * (y.t - y.mt) / y.t, 1) AS estimated_pct,\n       y.annual_spend_gbp, y.readiness AS readiness_pct, y.sbti_status, y.priority_score,\n \
    \      'score = 100 x (0.5 x emissions/max + 0.3 x spend/max + 0.2 x readiness/100)' AS formula\nFROM y CROSS JOIN tot\nORDER BY y.priority_score DESC, y.t DESC\nLIMIT $limit_to\n"
  limit: 100
  example:
    limit_to: 10
- name: create_sustainability_initiative
  desc: Create a reduction initiative record with expected savings, cost and timeline. Use for emissions reduction planning.
  kind: insert
  table: reduction_initiatives
  id_prefix: INI-2026-
  defaults:
    status: planned
  args:
    name:
      required: true
      desc: Initiative name
    scope:
      required: true
      type: int
      desc: Scope (1, 2 or 3)
    category:
      required: true
      desc: Category, e.g. renewable_energy, recycled_materials
    expected_savings_tonnes:
      required: true
      type: float
      desc: Expected CO2e savings
    cost_gbp:
      type: float
      desc: Implementation cost
    start_date:
      type: date
      desc: Planned start date
    completion_date:
      type: date
      desc: Planned completion date
    feasibility_rating:
      type: str
      desc: high, medium or low
  example:
    name: Switch to sea freight
    scope: 3
    category: transport
    expected_savings_tonnes: 500
    cost_gbp: 50000
    feasibility_rating: high
- name: create_esg_data_gap_task
  desc: Create a task to close an ESG data gap, linked to the gap, with priority and due date. Returns the new task.
  kind: insert
  table: esg_gap_tasks
  id_prefix: TSK-
  defaults:
    status: open
  args:
    gap_id:
      required: true
      desc: Gap to close, e.g. GAP-000001
    description:
      required: true
      desc: What the task will do
    priority:
      type: str
      desc: critical, high, medium or low
    due_date:
      type: date
      desc: Due date
    employee_id: {}
  example:
    gap_id: GAP-000001
    description: Collect primary Scope 3 data from top suppliers
    priority: high
    due_date: +90d
- name: create_claims_review_ticket
  desc: Raise a review ticket for a sustainability claim. Track compliance and greenwashing risk.
  kind: insert
  table: claims_register
  id_prefix: CLM-2026-
  defaults:
    review_status: pending
  args:
    claim_text:
      required: true
      desc: The claim to review
    product_category:
      desc: Product category if applicable
    risk_level:
      required: true
      type: str
      desc: high, medium or low
    evidence_path:
      type: str
      desc: Path to evidence file
  example:
    claim_text: Made from 100% recycled polyester
    product_category: apparel
    risk_level: medium
    evidence_path: files/polyester_cert.pdf
- name: get_emissions_data_quality_flags
  desc: Individual emission records flagged Measured or Estimated, largest first. Filter by scope, category, supplier or flag to see which numbers are estimates.
  kind: sql
  args:
    scope:
      type: int
      desc: GHG scope (1, 2 or 3, default all)
    category:
      type: str
      desc: Emission category, e.g. materials, processing
    supplier_id: {}
    is_measured:
      type: bool
      desc: true for measured records only, false for estimated only
  sql: "SELECT e.emission_id, e.scope, e.category, e.supplier_id, e.sku, e.site_id, e.tonnes_co2e,\n       CASE WHEN e.is_measured THEN 'Measured' ELSE 'Estimated' END AS quality_flag,\n       e.measurement_date,\
    \ e.notes\nFROM emissions e\nWHERE ($scope IS NULL OR CAST(e.scope AS VARCHAR) = CAST($scope AS VARCHAR))\n  AND ($category IS NULL OR e.category = $category)\n  AND ($supplier_id IS NULL OR e.supplier_id\
    \ = $supplier_id)\n  AND ($is_measured IS NULL OR e.is_measured = $is_measured)\nORDER BY e.tonnes_co2e DESC\n"
  limit: 50
  example:
    scope: 3
- name: get_emissions_history_by_year
  desc: Annual emissions by scope since the baseline year with change versus baseline. Shows progress toward targets year by year.
  kind: sql
  args:
    scope:
      type: int
      desc: GHG scope (1, 2 or 3, default all)
  sql: "WITH u AS (\n  SELECT year, CAST(scope AS VARCHAR) AS scope, tonnes_co2e FROM emissions_annual\n  UNION ALL\n  SELECT fiscal_year, CAST(scope AS VARCHAR), sum(tonnes_co2e) FROM emissions\n  WHERE\
    \ measurement_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY GROUP BY 1, 2),\nb AS (SELECT CAST(scope AS VARCHAR) AS scope, min(baseline_year) AS by FROM reduction_targets GROUP BY 1)\nSELECT u.year,\
    \ u.scope, round(u.tonnes_co2e, 1) AS annual_emissions_tonnes,\n       round(bu.tonnes_co2e, 1) AS baseline_tonnes, b.by AS baseline_year,\n       round(100.0 * (u.tonnes_co2e - bu.tonnes_co2e) / bu.tonnes_co2e,\
    \ 1) AS change_vs_baseline_pct\nFROM u\nJOIN b ON b.scope = u.scope\nJOIN u bu ON bu.scope = u.scope AND bu.year = b.by\nWHERE ($scope IS NULL OR u.scope = CAST($scope AS VARCHAR))\nORDER BY u.scope,\
    \ u.year\n"
  limit: 30
  example:
    scope: 3
- name: get_emissions_reduction_targets
  desc: Emissions reduction targets by scope with baseline, target year, pathway, validation status and notes. Shows commitments and alignment.
  kind: sql
  args:
    scope:
      type: int
      desc: GHG scope (1, 2 or 3, default all)
  sql: "SELECT target_id, scope, baseline_year, baseline_tonnes_co2e, target_year, target_tonnes_co2e,\n       reduction_pct, pathway, status, notes\nFROM reduction_targets\nWHERE ($scope IS NULL OR CAST(scope\
    \ AS VARCHAR) = CAST($scope AS VARCHAR))\nORDER BY scope, target_year\n"
  limit: 20
  example: {}
- name: get_emissions_vs_target
  desc: Latest twelve months of emissions compared to each reduction target, with variance and on-track status. Shows progress per scope.
  kind: sql
  args:
    scope:
      type: int
      desc: GHG scope (1, 2 or 3, default all)
  sql: "WITH l AS (SELECT CAST(scope AS VARCHAR) AS scope, round(sum(tonnes_co2e), 1) AS latest_tonnes\n           FROM emissions WHERE measurement_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY GROUP\
    \ BY 1)\nSELECT t.target_id, t.scope, t.target_year, t.baseline_tonnes_co2e, t.target_tonnes_co2e, l.latest_tonnes,\n       round(l.latest_tonnes - t.target_tonnes_co2e, 1) AS variance_tonnes,\n   \
    \    round(100.0 * (t.baseline_tonnes_co2e - l.latest_tonnes) / t.baseline_tonnes_co2e, 1) AS reduction_achieved_pct,\n       t.reduction_pct AS reduction_required_pct,\n       CASE WHEN l.latest_tonnes\
    \ <= t.target_tonnes_co2e THEN 'ON TRACK' ELSE 'OFF TRACK' END AS status\nFROM reduction_targets t\nLEFT JOIN l ON l.scope = CAST(t.scope AS VARCHAR)\nWHERE ($scope IS NULL OR CAST(t.scope AS VARCHAR)\
    \ = CAST($scope AS VARCHAR))\nORDER BY t.scope, t.target_year\n"
  limit: 20
  example: {}
- name: get_esg_data_coverage_by_metric
  desc: Data coverage percentage by ESG metric with materiality, regulatory impact, effort to close and the rules that require it. Lowest coverage first.
  kind: sql
  args:
    regulatory_impact:
      type: str
      desc: high, medium or low (default all)
    metric:
      type: str
      desc: Part of a metric name, e.g. Scope3
  sql: "SELECT gap_id, metric, coverage_pct, materiality_score, regulatory_impact, effort_to_close, priority, required_by, status\nFROM esg_data_gaps\nWHERE ($regulatory_impact IS NULL OR regulatory_impact\
    \ = $regulatory_impact)\n  AND ($metric IS NULL OR metric ILIKE '%' || $metric || '%')\nORDER BY coverage_pct ASC\n"
  limit: 20
  example: {}
- name: get_esg_platform_capabilities
  desc: Modules and reporting frameworks the ESG platform supports, with availability (live, not licensed, planned) and add-on quote.
  kind: sql
  args:
    status:
      type: str
      desc: live, not_licensed, planned or not_available (default all)
    framework:
      type: str
      desc: Part of a framework name, e.g. CSRD
  sql: "SELECT module, scopes_supported, frameworks, status, addon_quote_gbp, notes\nFROM platform_modules\nWHERE ($status IS NULL OR status = $status)\n  AND ($framework IS NULL OR frameworks ILIKE '%'\
    \ || $framework || '%')\nORDER BY CASE status WHEN 'live' THEN 1 WHEN 'not_licensed' THEN 2 WHEN 'planned' THEN 3 ELSE 4 END, module\n"
  limit: 20
  example: {}
- name: get_planned_reduction_initiatives
  desc: Reduction initiatives with expected savings, cost, timing, status and feasibility, largest savings first. Filter by scope or status.
  kind: sql
  args:
    status:
      type: str
      desc: planned, in_progress or completed (default all)
    scope:
      type: int
      desc: GHG scope (1, 2 or 3, default all)
  sql: "SELECT initiative_id, name, scope, category, expected_savings_tonnes, cost_gbp,\n       round(cost_gbp / nullif(expected_savings_tonnes, 0), 0) AS cost_per_tonne_gbp,\n       start_date, completion_date,\
    \ status, feasibility_rating, actual_savings_tonnes\nFROM reduction_initiatives\nWHERE ($status IS NULL OR status = $status)\n  AND ($scope IS NULL OR CAST(scope AS VARCHAR) = CAST($scope AS VARCHAR))\n\
    ORDER BY expected_savings_tonnes DESC\n"
  limit: 50
  example:
    scope: 3
- name: get_scope2_emissions_by_period
  desc: Scope 2 by year and method (location-based, market-based) with a reported total per year, kWh and boundary. Use year or site_id for detail.
  kind: sql
  args:
    year:
      type: int
      desc: Filter by year, e.g. 2026
    site_id:
      desc: Show one site instead of totals
  sql: "WITH d AS (SELECT * FROM scope2_history WHERE ($year IS NULL OR year = $year) AND ($site_id IS NULL OR site_id = $site_id))\nSELECT year, 'ALL SITES' AS site_id, method, boundary, count(*) AS sites,\
    \ sum(kwh_consumed) AS kwh_consumed,\n       round(sum(emissions_tonnes_co2e), 1) AS emissions_tonnes_co2e,\n       round(sum(CASE WHEN in_boundary THEN kwh_consumed * grid_factor_kg_per_kwh / 1000.0\
    \ ELSE 0 END), 1) AS location_based_tonnes\nFROM d WHERE $site_id IS NULL GROUP BY year, method, boundary\nUNION ALL\nSELECT year, 'TOTAL REPORTED', 'all', 'all', count(*) FILTER (WHERE in_boundary),\
    \ sum(kwh_consumed) FILTER (WHERE in_boundary),\n       round(sum(emissions_tonnes_co2e), 1),\n       round(sum(CASE WHEN in_boundary THEN kwh_consumed * grid_factor_kg_per_kwh / 1000.0 ELSE 0 END),\
    \ 1)\nFROM d WHERE $site_id IS NULL GROUP BY year\nUNION ALL\nSELECT year, site_id, method, boundary, 1, kwh_consumed, emissions_tonnes_co2e,\n       round(CASE WHEN in_boundary THEN kwh_consumed *\
    \ grid_factor_kg_per_kwh / 1000.0 ELSE 0 END, 1)\nFROM d WHERE $site_id IS NOT NULL\nORDER BY year DESC, site_id\n"
  limit: 60
  example:
    year: 2026
- name: get_scope2_method_and_boundary_changes
  desc: 'Scope 2 change log: sites and years where the method (location or market-based) or reporting boundary changed, with explanation.'
  kind: sql
  args:
    year:
      type: int
      desc: Filter by year, e.g. 2026
    site_id: {}
  sql: "WITH x AS (\n  SELECT year, site_id, method, boundary, factor_source, factor_kg_per_kwh, notes,\n         LAG(method) OVER (PARTITION BY site_id ORDER BY year) AS prior_method,\n         LAG(boundary)\
    \ OVER (PARTITION BY site_id ORDER BY year) AS prior_boundary,\n         LAG(emissions_tonnes_co2e) OVER (PARTITION BY site_id ORDER BY year) AS prior_tonnes,\n         emissions_tonnes_co2e AS tonnes\n\
    \  FROM scope2_history)\nSELECT year, site_id,\n       CASE WHEN method <> prior_method THEN 'Method change' ELSE '' END AS method_change_flag, prior_method, method,\n       CASE WHEN boundary <> prior_boundary\
    \ THEN 'Boundary change' ELSE '' END AS boundary_change_flag, prior_boundary, boundary,\n       prior_tonnes, tonnes, factor_source, notes\nFROM x\nWHERE (method <> prior_method OR boundary <> prior_boundary)\n\
    \  AND ($year IS NULL OR year = $year) AND ($site_id IS NULL OR site_id = $site_id)\nORDER BY year DESC, site_id\n"
  limit: 30
  example: {}
- name: get_submission_data_quality_scores
  desc: Supplier ESG submissions with quality score, completeness, scopes provided and status, lowest quality first. Shows who has not submitted.
  kind: sql
  args:
    supplier_id: {}
    status:
      type: str
      desc: pending, received, under_review or approved (default all)
    max_quality_score:
      type: int
      desc: Only submissions scoring at or below this (0-100)
  sql: "SELECT b.submission_id, b.supplier_id, s.name, b.submission_date, b.deadline_date, b.data_quality_score,\n       b.completeness_pct, b.has_scope1, b.has_scope2, b.has_scope3, b.status, b.notes\n\
    FROM supplier_submissions b\nLEFT JOIN master.suppliers s ON s.supplier_id = b.supplier_id\nWHERE ($supplier_id IS NULL OR b.supplier_id = $supplier_id)\n  AND ($status IS NULL OR b.status = $status)\n\
    \  AND ($max_quality_score IS NULL OR b.data_quality_score <= $max_quality_score)\nORDER BY b.data_quality_score ASC, b.supplier_id\n"
  limit: 100
  example: {}
- name: get_substantiation_evidence_for_claim
  desc: Evidence held for a sustainability claim. Shows whether claim is substantiated.
  kind: sql
  args:
    claim_id:
      required: true
  sql: "SELECT claim_id, claim_text, product_category, substantiation_available,\n       evidence_path, risk_level, review_status, notes\nFROM claims_register\nWHERE claim_id = $claim_id\n"
  limit: 1
  example:
    claim_id: CLM-2026-0001
- name: get_supplier_science_based_target_status
  desc: SBTi status per supplier (targets_set, committed, none) with ambition and target year. Filter by supplier or status.
  kind: sql
  args:
    supplier_id: {}
    status:
      type: str
      desc: targets_set, committed or none (default all)
  sql: "SELECT q.supplier_id, s.name, q.sbti_status, q.target_ambition, q.target_year, q.status_date, q.notes\nFROM supplier_sbti q\nLEFT JOIN master.suppliers s ON s.supplier_id = q.supplier_id\nWHERE\
    \ ($supplier_id IS NULL OR q.supplier_id = $supplier_id)\n  AND ($status IS NULL OR q.sbti_status = $status)\nORDER BY CASE q.sbti_status WHEN 'targets_set' THEN 1 WHEN 'committed' THEN 2 ELSE 3 END,\
    \ q.supplier_id\n"
  limit: 100
  example: {}
- name: get_transport_emissions_intensity_trend
  desc: Monthly transport emissions and intensity (kg CO2e per tonne shipped) by lane and in total, with the emission factor applied and its change. Use to find what drove a rise.
  kind: sql
  args:
    transport_mode:
      type: str
      desc: Filter by mode (air, sea, truck)
    corridor:
      type: str
      desc: Trade corridor, e.g. Asia-Europe, Americas-Europe, Intra-Europe
    lane_id:
      type: str
      desc: Lane, e.g. CNSHA-GBFXT-SEA
    period_from:
      type: date
      default: -270d
      desc: Earliest month
  sql: "WITH j AS (\n  SELECT t.month_start, t.lane_id, f.transport_mode, f.corridor, t.tonnes_shipped, t.tonne_km,\n         f.factor_kg_per_tonne_km AS factor, f.version, f.factor_source,\n         t.tonne_km\
    \ * f.factor_kg_per_tonne_km / 1000.0 AS tco2e\n  FROM transport_emissions t\n  ASOF JOIN transport_factors f ON t.lane_id = f.lane_id AND t.month_start >= f.period_start\n  WHERE ($transport_mode IS\
    \ NULL OR f.transport_mode = $transport_mode)\n    AND ($corridor IS NULL OR lower(f.corridor) = lower($corridor))\n    AND ($lane_id IS NULL OR t.lane_id = $lane_id)),\nl AS (SELECT month_start, lane_id,\
    \ transport_mode, corridor, tonnes_shipped, round(tonne_km / 1e6, 2) AS million_tonne_km,\n             factor AS factor_kg_per_tonne_km, version, factor_source, round(tco2e, 1) AS emissions_tonnes_co2e,\n\
    \             round(tco2e * 1000.0 / tonnes_shipped, 1) AS kg_co2e_per_tonne_shipped,\n             LAG(factor) OVER (PARTITION BY lane_id ORDER BY month_start) AS prior_month_factor\n      FROM j\n\
    \      UNION ALL\n      SELECT month_start, 'ALL LANES', 'all', 'all', sum(tonnes_shipped), round(sum(tonne_km) / 1e6, 2), NULL, NULL, NULL,\n             round(sum(tco2e), 1), round(sum(tco2e) * 1000.0\
    \ / sum(tonnes_shipped), 1), NULL\n      FROM j GROUP BY month_start)\nSELECT month_start, lane_id, transport_mode, corridor, tonnes_shipped, million_tonne_km, factor_kg_per_tonne_km, version,\n   \
    \    emissions_tonnes_co2e, kg_co2e_per_tonne_shipped, prior_month_factor,\n       round(100.0 * (factor_kg_per_tonne_km - prior_month_factor) / prior_month_factor, 1) AS factor_change_pct\nFROM l\n\
    WHERE month_start >= CAST($period_from AS DATE)\nORDER BY month_start DESC, CASE WHEN lane_id = 'ALL LANES' THEN 0 ELSE 1 END, lane_id\n"
  limit: 90
  example:
    corridor: Asia-Europe
- name: list_in_scope_reporting_regulations
  desc: Reporting rules that apply to Harbour & Vale with effective dates, scopes covered, data required and why we are in scope. Set include_not_applicable to see the rest.
  kind: sql
  args:
    jurisdiction:
      type: str
      desc: UK, EU, US or global (default all)
    include_not_applicable:
      type: bool
      default: false
      desc: Also list rules that do not apply to us
  sql: "SELECT regulation_id, name, jurisdiction, requirement_type, effective_date, scopes_covered, applies_to_us,\n       in_scope_reason, data_required, description\nFROM regulations\nWHERE ($include_not_applicable\
    \ OR applies_to_us = TRUE)\n  AND ($jurisdiction IS NULL OR lower(jurisdiction) = lower($jurisdiction))\nORDER BY effective_date\n"
  limit: 50
  example: {}
- name: search_emission_factors_by_material
  desc: Emission factors by material (cotton, organic_cotton, polyester, recycled_polyester) with region, rating and uncertainty. Returns ids for quality checks.
  kind: select
  from: emission_factors
  filters:
    material:
      op: like
      desc: Material name or part of it (e.g. polyester, cotton)
    region:
      desc: Region (UK, EU, Asia, Global)
    data_quality_rating:
      desc: Quality rating (A, B, C, D)
  columns:
  - factor_id
  - factor_name
  - material
  - region
  - kg_co2e_per_unit
  - unit
  - source
  - version
  - data_quality_rating
  - uncertainty_pct
  - valid_from
  - valid_to
  order: material, region
  limit: 50
  example:
    material: polyester
- name: update_claim_review_status
