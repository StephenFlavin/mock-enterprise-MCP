    category: transport
    expected_savings_tonnes: 500
    cost_gbp: 50000
    feasibility_rating: high
- name: create_esg_data_gap_task
  desc: Create a task to close an ESG data gap. Track data improvement initiatives.
  kind: insert
  table: esg_data_gaps
  id_prefix: GAP-
  defaults:
    status: open
    priority: medium
  args:
    metric:
      required: true
      desc: ESG metric name
    description:
      required: true
      desc: What data is missing
    materiality_score:
      type: float
      desc: Materiality (0-100)
    regulatory_impact:
      type: str
      desc: high, medium or low
    coverage_pct:
      type: float
      desc: Current coverage %
    effort_to_close:
      type: str
      desc: easy, medium or hard
    priority:
      type: str
      desc: critical, high, medium or low
    target_close_date:
      type: date
      desc: Target closure date
  example:
    metric: Scope3_supplier_emissions
    description: Supplier Scope 3 data collection
    materiality_score: 85
    regulatory_impact: high
    coverage_pct: 30
    effort_to_close: hard
    priority: high
    target_close_date: +90d
- name: create_claims_review_ticket
  desc: Raise a review ticket for a sustainability claim. Track compliance and greenwashing
    risk.
  kind: insert
  table: claims_register
  id_prefix: CLM-
  defaults:
    review_status: pending
  args:
    claim_text:
      required: true
      desc: The claim to review
    product_category:
      desc: Product category if applicable
    risk_level:
      required: true
      type: str
      desc: high, medium or low
    evidence_path:
      type: str
      desc: Path to evidence file
  example:
