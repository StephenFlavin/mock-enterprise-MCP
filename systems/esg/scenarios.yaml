- question: "05:45:Q1"
  story: Scope 3 FY26 is about 86,000 t. Materials (33,800 t) and processing dominate; Footwear and Knitwear are the top product categories; SUP-0057 (Hunt Apparel) and SUP-0074 are the top suppliers and 100% estimated. Materials are fully estimated, only about 18% of Scope 3 is measured.
  checks:
    - tool: get_emissions_by_scope_and_category
      args: {scope: 3}
      expect: ["materials", "33799.6", "estimated_tonnes"]
    - tool: get_emissions_by_product_category
      args: {}
      expect: ["Footwear", "Knitwear"]
    - tool: get_emissions_by_supplier
      args: {top_n: 5}
      expect: ["SUP-0057", "SUP-0074", "8064.7"]
    - tool: get_emissions_data_quality_flags
      args: {scope: 3, is_measured: false}
      expect: ["Estimated"]
- question: "05:45:Q3"
  story: Scope 3 target TRG-000003 (70,000 t by 2030, baseline 100,000 t). Latest 86,135 t; linear projection misses by 6,892 t; planned and in-progress Scope 3 initiatives total 5,080 t leaving 1,812 t.
  checks:
    - tool: get_emissions_reduction_targets
      args: {scope: 3}
      expect: ["TRG-000003", "submitted"]
    - tool: get_emissions_history_by_year
      args: {scope: 3}
      expect: ["2020", "100000"]
    - tool: calculate_emissions_trajectory_gap
      args: {target_id: TRG-000003}
      expect: ["6891.8", "5080", "1811.8"]
    - tool: get_planned_reduction_initiatives
      args: {scope: 3}
      expect: ["INI-2026-0005"]
- question: "05:45:Q2"
  story: Top 20 suppliers account for 53.2% of Scope 3. Abatement cost is computed from what-if savings and cost, or from an initiative, with a reach percentage.
  checks:
    - tool: get_emissions_by_supplier
      args: {top_n: 20}
      expect: ["53.2", "SUP-0057"]
    - tool: calculate_abatement_cost_per_tonne
      args: {expected_savings_tonnes: 6000, cost_gbp: 2100000}
      expect: ["350"]
    - tool: calculate_abatement_cost_per_tonne
      args: {initiative_id: INI-2026-0005, reach_pct: 50}
      expect: ["625", "210000"]
    - tool: create_sustainability_initiative
      args: {name: "Shift air freight to sea", scope: 3, category: logistics, expected_savings_tonnes: 2600, cost_gbp: 180000, feasibility_rating: high}
      expect: ["INI-2026", "planned"]
- question: "05:45:Q4"
  story: Scope 1 and 2 targets are validated on a 1.5C pathway; the Scope 3 target is well-below 2C and only submitted. Only about 18% of Scope 3 is measured.
  checks:
    - tool: get_emissions_reduction_targets
      args: {}
      expect: ["well-below 2C", "validated"]
    - tool: get_emissions_data_coverage
      args: {scope: 3}
      expect: ["17.9"]
- question: "05:45:Q5"
  story: Recycled polyester (Asia) 2.6 vs virgin 6.4; organic cotton India 3.1 vs conventional 5.9. Recycled polyester Asia is rated D from supplier data with 45% uncertainty.
  checks:
    - tool: search_emission_factors_by_material
      args: {material: polyester, region: Asia}
      expect: ["EF-2026-0003", "2.6", "6.4"]
    - tool: get_emission_factor_data_quality
      args: {factor_id: EF-2026-0003}
      expect: ["supplier_data", "D: proxy", "45"]
- question: "05:45:Q6"
  story: Four Asia-Europe sea lanes and MXZLO-GBFXT-SEA picked up a bulk-imported factor 0.0215 (about 2.5x too high) from the period starting three months ago, so intensity rose while volume moved to sea. Correcting the CNSHA lane restores 0.0086.
  checks:
    - tool: get_transport_emissions_intensity_trend
      args: {corridor: Asia-Europe}
      expect: ["ALL LANES", "0.0215", "CNSHA-GBFXT-SEA"]
    - tool: get_emission_factors_applied_to_transport
      args: {corridor: Asia-Europe}
      expect: ["TEU-km", "bulk import"]
    - tool: update_transport_emission_factor_for_lane
      args: {lane_id: CNSHA-GBFXT-SEA, version: 2, factor_kg_per_tonne_km: 0.0086}
      expect: ["0.0215", "0.0086"]
- question: "05:45:Q7"
  story: Priority score combines emissions, spend and readiness. Top 10 includes SUP-0049 and SUP-0038 (SBTi targets set) and SUP-0072 (committed only).
  checks:
    - tool: calculate_supplier_engagement_priority_score
      args: {limit_to: 10}
      expect: ["SUP-0057", "92.3", "SUP-0049"]
    - tool: get_supplier_science_based_target_status
      args: {status: targets_set}
      expect: ["SUP-0049", "SUP-0038"]
- question: "05:48:Q1"
