- question: "05:45:Q1"
  story: "Sustainability manager needs emissions breakdown. Data shows Scope 1, 2, 3 emissions across multiple categories (fleet, purchased_electricity, transport, materials). Mix of measured (primary data) and estimated records showing data quality."
  checks:
    - tool: get_emissions_by_scope_and_category
      args: {}
      expect: ["1", "2", "3", "tonnes_co2e", "measured", "estimated"]
    - tool: get_emissions_by_product_category
      args: {}
      expect: ["category", "total_tonnes_co2e", "records"]
    - tool: get_emissions_by_supplier
      args: {}
      expect: ["supplier_id", "tonnes_co2e", "measured", "estimated"]
    - tool: get_emissions_data_coverage
      args: {}
      expect: ["scope", "total_tonnes_co2e", "measured_pct"]

- question: "05:45:Q2"
  story: "Comparing three reduction levers: air to sea freight shift, recycled polyester adoption, and supplier renewable energy. Emission factors show costs and feasibility."
  checks:
    - tool: get_emissions_by_supplier
      args: {}
      expect: ["tonnes_co2e"]
    - tool: calculate_abatement_cost_per_tonne
      args: {initiative_id: "INI-2026-0001"}
      expect: ["cost_per_tonne_gbp", "formula"]
    - tool: create_sustainability_initiative
      args: {name: "Sea freight switch", scope: 3, category: "transport", expected_savings_tonnes: 500, feasibility_rating: "high"}
      expect: ["initiative_id", "INI-2026"]

- question: "05:45:Q3"
  story: "Will we meet 2030 Scope 3 target? Trajectory analysis shows current emissions against targets and gap to close."
  checks:
    - tool: calculate_emissions_trajectory_gap
      args: {target_id: "TRG-000003"}
      expect: ["gap", "tonnes", "pct"]

- question: "05:48:Q1"
  story: "ESG data gap analysis shows biggest gaps and materiality. Multiple gaps identified with effort ratings and priorities."
  checks:
    - tool: calculate_esg_data_gap_materiality
      args: {}
      expect: ["gap_id", "metric", "materiality", "priority"]
    - tool: create_esg_data_gap_task
      args: {metric: "Scope3_completeness", description: "Missing Scope 3 data", materiality_score: 85, regulatory_impact: "high", coverage_pct: 50, effort_to_close: "hard", priority: "critical", target_close_date: "+90d"}
      expect: ["gap_id", "GAP-"]

- question: "05:48:Q2"
  story: "Scope 2 fell 15% YoY. Reconciliation shows whether it's real or method/boundary change. Data shows year-over-year comparison with factors and methods."
  checks:
    - tool: calculate_scope2_reconciliation
      args: {}
      expect: ["prior_year_variance", "variance_pct", "method", "boundary"]
    - tool: get_emission_factors_applied
      args: {}
      expect: ["factor_id", "factor_name", "quality", "total_tonnes"]

- question: "05:48:Q4"
  story: "Supplier ESG submissions tracking. Multiple suppliers with quality scores and deadlines. Some overdue, some pending."
  checks:
    - tool: get_data_request_deadline
      args: {}
      expect: ["supplier_id", "deadline", "status"]

- question: "05:48:Q6"
  story: "Greenwashing risk review. Claims register has various claims with risk levels. Raise tickets and track status."
  checks:
    - tool: create_claims_review_ticket
      args: {claim_text: "Made from 100% recycled polyester", product_category: "apparel", risk_level: "medium"}
      expect: ["claim_id", "CLM-"]

- question: "05:45:Q6"
  story: "Transport emissions intensity trend. Check if data is accurate or methodology issue. Show factors by mode and lane."
  checks:
    - tool: get_emission_factors_applied_to_transport
      args: {}
      expect: ["lane_id", "factor", "mode"]

- question: "05:45:Q7"
  story: "Supplier engagement prioritization. Identify top suppliers by emissions and engagement potential."
  checks:
    - tool: calculate_supplier_engagement_priority_score
      args: {limit_to: 10}
      expect: ["supplier_id", "priority_score", "emissions"]

- question: "05:49:Q3"
  story: "Reuse/resale program carbon benefits. Calculate avoided emissions from diverting product to reuse vs new production."
  checks:
    - tool: calculate_avoided_emissions_from_reuse
      args: {sku: "K-1700", reuse_volume_units: 1000, virgin_factor_kg_co2e_per_unit: 2.5}
      expect: ["avoided_emissions", "tonnes", "formula"]

- question: "get_emission_factor_data_quality"
  story: "Emission factor library query. Look up specific factor data quality and rating."
  checks:
    - tool: get_emission_factor_data_quality
      args: {factor_id: "EF-2026-0001"}
      expect: ["factor_id", "data_quality", "source", "valid"]

- question: "05:45:Q4"
  story: "SBTi requirements research. Data shows current reduction targets against SBTi 1.5C pathway. Coverage metrics show data completeness for reporting."
  checks:
    - tool: get_emissions_reduction_targets
      args: {}
      expect: ["target_id", "scope", "target_year", "pathway"]
    - tool: get_emissions_data_coverage
      args: {}
      expect: ["scope", "measured_pct"]

- question: "05:45:Q5"
  story: "Emission factors by material. Search for polyester and cotton factors with data quality ratings. Shows region-specific variations."
  checks:
    - tool: search_emission_factors_by_material
      args: {material: "polyester"}
      expect: ["factor_id", "material", "kg_co2e", "region", "quality"]
    - tool: get_emission_factor_data_quality
      args: {factor_id: "EF-2026-0001"}
      expect: ["data_quality_rating", "source"]

- question: "05:48:Q3"
  story: "Supply chain disclosure metrics and data coverage. Shows which ESG metrics are covered and evidence requirements for assurance."
  checks:
    - tool: get_emissions_data_coverage
      args: {}
      expect: ["scope", "total_tonnes", "measured"]
    - tool: get_esg_data_coverage_by_metric
      args: {}
      expect: ["metric", "coverage"]

- question: "05:48:Q5"
  story: "Upcoming regulations and platform capabilities. List of in-scope regulations with dates and what the platform can support."
  checks:
    - tool: list_in_scope_reporting_regulations
      args: {}
      expect: ["regulation_id", "name", "jurisdiction", "effective_date"]
    - tool: get_esg_platform_capabilities
      args: {}
      expect: ["module", "frameworks"]

- question: "09:87:Q1"
  story: "Executive scorecard: emissions against targets show progress on sustainability commitments. Platform provides emissions_vs_target metrics."
  checks:
    - tool: get_emissions_vs_target
      args: {}
      expect: ["target_id", "target_year", "latest", "variance"]

