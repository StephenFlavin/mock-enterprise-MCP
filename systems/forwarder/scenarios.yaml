- question: "02:12:Q4"
  story: "Freight forwarder tracking rolled bookings from Q3 2026. Three ocean bookings were rolled (OBK-900003, OBK-900004, OBK-900007) due to vessel blank sailing or equipment shortage. The query returns rolled bookings with dates, container counts, and reasons. Related demurrage charges total GBP 4,555 across rolled and delivered shipments."
  checks:
    - tool: list_rolled_bookings
      args: {}
      expect: ["OBK-900003", "OBK-900004", "OBK-900007", "rolled"]
    - tool: get_demurrage_and_detention_for_bookings
      args: {}
      expect: ["demurrage", "detention", "CHG-900001", "1250"]

- question: "02:12:Q5"
  story: "Freight forwarder planning ahead for Q4 2026 bookings. Upcoming planned bookings (OBK-900010 through OBK-900013) are booked for future sailings. The system tracks these and allows updates to different sailings or cancellations. OBK-900012 has 9 containers booked to GBFXT with upcoming sailing."
  checks:
    - tool: list_planned_bookings
      args: {}
      expect: ["OBK-900010", "OBK-900011", "OBK-900012", "booked"]
    - tool: update_booking_sailing
      args: {booking_id: OBK-900010, planned_sailing: "+21d"}
      expect: ["OBK-900010"]
    - tool: cancel_ocean_booking
      args: {booking_id: OBK-900013}
      expect: ["OBK-900013", "cancelled"]

- question: "02:12:Q6"
  story: "Freight forwarder analyzing historical container volumes on the Asia-to-UK route to compare with alternative Mediterranean routing. The system returns monthly volume data for SGSIN-GBFXT and SGSIN-NLRTM routes showing typical 5-12 containers per booking over the past 12 months."
  checks:
    - tool: get_historical_container_volumes_by_route
      args: {dest_port: GBFXT}
      expect: ["GBFXT", "booking_count", "total_containers"]
    - tool: get_transshipment_options
      args: {origin_port: SGSIN, dest_port: GBFXT}
      expect: ["direct", "transship", "routing_option", "estimated_days"]

- question: "02:13:Q1"
  story: "Air freight coordinator considering airfreighting Style 7731 due to late factory exit. Creating new air freight booking for 3000 units."
  checks:
    - tool: create_air_freight_booking
      args: {po_id: PO-2026-005912, carrier_id: CAR-008, origin_airport: HKHKG, dest_airport: LHR, units: 3000, planned_departure: "+2d", planned_arrival: "+3d", cost_gbp: 48000}
      expect: ["ABK-", "booked"]

- question: "02:13:Q2"
  story: "Air freight spend analysis over past quarter. Invoices are categorized by reason code with delayed_factory and late_arrival being the main drivers. Multiple carriers are invoiced."
  checks:
    - tool: list_air_freight_invoices
      args: {}
      expect: ["invoice_id", "reason_code"]
    - tool: list_air_freight_invoices
      args: {reason_code: delayed_factory}
      expect: ["delayed_factory"]

- question: "02:13:Q5"
  story: "Air freight coordinator comparing delivery date probabilities for urgent shipment needed in 12 days. The system provides probability estimates for sea direct, air express, and sea-air transship routing options. Cut-off times are calculated from booking records."
  checks:
    - tool: calculate_delivery_date_probability
      args: {origin_port: SGSIN, dest_port: GBFXT, required_date: "+12d"}
      expect: ["routing_option", "probability_pct", "sea_direct", "air_express"]
    - tool: get_booking_cut_off_times
      args: {booking_id: OBK-900001}
      expect: ["OBK-900001", "cut_off_date", "hours"]
    - tool: draft_forwarder_booking_request
      args: {po_id: PO-2026-005912}
      expect: ["BOOKING REQUEST", "PO-2026-005912"]

- question: "02:19:Q1"
  story: "Control tower analyst identifying in-transit shipments and sending expedite requests for urgent cases. System creates expedite events to notify forwarder of priority shipments."
  checks:
    - tool: send_expedite_request_to_forwarder
      args: {booking_id: OBK-900006, reason: "Store stockout risk"}
      expect: ["EVT-", "expedite_request"]
    - tool: list_rolled_bookings
      args: {}
      expect: ["rolled"]

- question: "02:19:Q3"
  story: "Control tower analyzing port congestion impact. The system provides transshipment options showing alternative routing with comparable transit times and costs."
  checks:
    - tool: get_transshipment_options
      args: {origin_port: SGSIN, dest_port: GBFXT, mode: sea}
      expect: ["routing_option", "estimated_cost_gbp", "estimated_days"]

- question: "08:80:Q2"
  story: "International market manager managing franchise order priorities. Update shipment priority to urgent or hold for franchise orders."
  checks:
    - tool: update_shipment_priority_for_franchise_order
      args: {booking_id: OBK-900012, priority: urgent}
      expect: ["OBK-900012"]
    - tool: list_planned_bookings
      args: {}
      expect: ["planned_sailing"]
