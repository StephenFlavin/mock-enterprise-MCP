scenarios:
  - question: "02:12:Q2"
    story: "Freight forwarder tracking rolled bookings from Q3 2026. Three ocean bookings were rolled (OBK-900003, OBK-900004, OBK-900007) due to vessel blank sailing or equipment shortage. The query returns rolled bookings with dates, container counts, and reasons. Related demurrage charges total GBP 4,555 across rolled and delivered shipments."
    checks:
      - tool: list_rolled_bookings
        args: {}
        expect: ["OBK-900003", "OBK-900004", "OBK-900007", "rolled"]
      - tool: get_demurrage_and_detention_for_bookings
        args: {}
        expect: ["demurrage", "detention", "CHG-900001", "1250"]

  - question: "02:12:Q5"
    story: "Freight forwarder planning ahead for Q4 2026 bookings. Upcoming planned bookings (OBK-900010 through OBK-900013) are booked for future sailings. The system tracks these and allows updates to different sailings or cancellations. OBK-900012 has 9 containers booked to GBFXT on 2026-10-17."
    checks:
      - tool: list_planned_bookings
        args: {}
        expect: ["OBK-900010", "OBK-900011", "OBK-900012", "booked", "2026-10"]
      - tool: update_booking_sailing
        args: {booking_id: OBK-900010, new_sailing: "2026-10-19", reason: "Blank sailing avoided"}
        expect: ["OBK-900010"]
      - tool: cancel_ocean_booking
        args: {booking_id: OBK-900013, reason: "Order postponed"}
        expect: ["OBK-900013", "cancelled"]

  - question: "02:12:Q6"
    story: "Freight forwarder analyzing historical container volumes on the Asia-to-UK route to compare with alternative Mediterranean routing. The system returns monthly volume data for SGSIN-GBFXT and SGSIN-NLRTM routes showing typical 5-12 containers per booking over the past 12 months."
    checks:
      - tool: get_historical_container_volumes_by_route
        args: {dest_port: GBFXT}
        expect: ["GBFXT", "booking_count", "total_containers"]
      - tool: get_transshipment_options
        args: {origin_port: SGSIN, dest_port: GBFXT}
        expect: ["direct", "transship", "routing_option", "estimated_days"]

  - question: "02:13:Q1"
    story: "Air freight coordinator considering airfreighting Style 7731 due to late factory exit. ABK-900003 already booked 6000 units on 2026-09-29 departure, arriving 2026-10-01 at cost of GBP 96,000 (GBP 16 per unit)."
    checks:
      - tool: create_air_freight_booking
        args: {style_id: STY-7731, carrier_id: CAR-008, origin_airport: HKHKG, dest_airport: LHR, units: 3000, planned_departure: "+2d", planned_arrival: "+3d", cost_gbp: 48000}
        expect: ["ABK-", "booked"]
      - tool: list_air_freight_bookings
        args: {style_id: STY-7731}
        expect: ["ABK-900003", "STY-7731"]

  - question: "02:13:Q2"
    story: "Air freight spend analysis for Q3 2026 (Jul-Sep). Total air freight invoices across four carriers show GBP 347,000 spend over the period. Invoiced amounts: CAR-008 GBP 145,000 (delayed_factory), CAR-009 GBP 98,000 (late_arrival), CAR-010 GBP 62,000 (promotional_surge), CAR-008 GBP 42,000 (supply_issue). Most avoidable spend from delayed_factory (40%) and late_arrival (25%) reasons."
    checks:
      - tool: list_air_freight_invoices
        args: {}
        expect: ["INV-900001", "INV-900002", "INV-900003", "INV-900004", "145000", "delayed_factory"]
      - tool: list_air_freight_invoices
        args: {reason_code: delayed_factory}
        expect: ["INV-900001", "delayed_factory", "145000"]

  - question: "02:13:Q5"
    story: "Air freight coordinator comparing delivery date probabilities for 500 units needed in 12 days from Dhaka. The system provides probability estimates for sea direct (85% at 12 days), air express (70%), and sea-air transship (75%). Cut-off times are calculated from the booking record. ABK-900005 shows cut-off details with cargo cut-off 24 hours before departure and docs 48 hours before."
    checks:
      - tool: calculate_delivery_date_probability
        args: {origin_port: SGSIN, dest_port: GBFXT, required_date: "+12d"}
        expect: ["routing_option", "probability_pct", "sea_direct", "air_express"]
      - tool: get_booking_cut_off_times
        args: {booking_id: ABK-900005}
        expect: ["ABK-900005", "cut_off_date", "hours"]
      - tool: draft_forwarder_booking_request
        args: {po_id: PO-2026-003505}
        expect: ["BOOKING REQUEST", "PO-2026-003505"]

  - question: "02:19:Q1"
    story: "Control tower analyst identifying late in-transit shipments for expediting. OBK-900006 and OBK-900008 are in transit with expedite events requested (EVT-900001, EVT-900003) showing stockout risks and promotional window closures."
    checks:
      - tool: send_expedite_request_to_forwarder
        args: {booking_id: OBK-900006, reason: "Store stockout risk"}
        expect: ["EVT-", "expedite_request", "OBK-900006"]
      - tool: list_rolled_bookings
        args: {}
        expect: ["rolled", "OBK-900003"]

  - question: "02:19:Q3"
    story: "Control tower analyzing Rotterdam port congestion impact. The system provides transshipment options showing alternative routing via Cyprus (DEWCY) with rail connection, with comparable transit times (12-16 days) and adjusted costs."
    checks:
      - tool: get_transshipment_options
        args: {origin_port: SGSIN, dest_port: GBFXT, mode: sea}
        expect: ["transship", "routing_option", "estimated_cost_gbp", "estimated_days"]

  - question: "08:80:Q2"
    story: "International market manager managing franchise order priorities. Update shipment priority to urgent or hold for franchise orders using update_shipment_priority_for_franchise_order to manage core line vs overstock."
    checks:
      - tool: update_shipment_priority_for_franchise_order
        args: {booking_id: OBK-900012, priority_level: urgent, reason: "Franchise core lines stockout"}
        expect: ["OBK-900012"]
      - tool: list_planned_bookings
        args: {}
        expect: ["planned_sailing", "2026-10"]
