# Tax & Duty system scenarios: one entry per question that uses our tools
# Questions listed in: python -m mockmcp brief tax_duty

- question: "02:14:Q1"
  story: >
    Current duty rates on HS 6110 (cotton knit tops) from Vietnam, Bangladesh and Turkey into UK are 10%, 12% and 10%
    respectively with VAT at 20%. Vietnam has preferential 8% rate under CPTPP. Per £10,000 of goods, duty ranges
    from £800-£1,200, VAT from £2,040-£2,400. No changes in last 12 months.
  checks:
    - tool: get_current_duty_rates
      args: {hs_code: "6110", destination_market: UK}
      expect: ["VN", "BD", "TR", "CPTPP"]
    - tool: calculate_duty_per_value
      args: {hs_code: "6110", origin_country: VN, declared_value_gbp: 10000}
      expect: ["duty_gbp", "vat_gbp", "10000"]

- question: "02:14:Q2"
  story: >
    Padded gilet classification: HS 6110 or 6111 both apply. At 80,000 units and £50/unit gives duty £40,000
    (6110 at 10%) vs £48,000 (6111 at 12%), difference £8,000.
  checks:
    - tool: calculate_duty_difference_between_codes
      args: {hs_code_1: "6110", hs_code_2: "6111", origin_country: VN, units: 80000, unit_cost_gbp: 50}
      expect: ["duty_difference_gbp", "80000"]

- question: "02:14:Q3"
  story: >
    Eleven shipments from same supplier held at customs. Vietnam origin, 7 cleared entries from past 365 days
    with declared value £280,000, duty paid £28,000, reassessment exposure £5,600.
  checks:
    - tool: calculate_duty_reassessment_exposure
      args: {origin_country: VN, days_back: 365}
      expect: ["entries_at_risk", "exposure_gbp"]

- question: "02:14:Q4"
  story: >
    15% tariff on Vietnam footwear (HS 6110) goes ahead. Annual import value £1,000,000 at current 10% rate costs
    £100,000/year. New rate £250,000/year: increase of £150,000. Options: origin shift to Indonesia, margin recovery.
  checks:
    - tool: calculate_tariff_cost_impact
      args: {hs_code: "6110", origin_country: VN, current_rate_pct: 10, new_rate_pct: 25, annual_import_value_gbp: 1000000}
      expect: ["duty_increase_gbp"]

- question: "02:14:Q7"
  story: >
    Bonded warehouse for goods re-exported to Ireland/EU: annual re-export value £5,000,000 defers duty of £750,000.
    Cash flow benefit at 45-day dwell and 5% financing: ~£46,000/year.
  checks:
    - tool: calculate_duty_deferral_benefit
      args: {scenario_id: "TSC-900001", annual_re_export_value_gbp: 5000000, avg_dwell_days: 45}
      expect: ["duty_deferred_gbp", "cash_flow_benefit_gbp"]
    - tool: calculate_cash_flow_benefit
      args: {annual_import_value_gbp: 5000000, avg_deferral_days: 45, financing_rate_pct: 5}
      expect: ["financing_saving_gbp"]

- question: "02:14:Q8"
  story: >
    De minimis changes on cross-border D2C at £62 average basket: UK threshold £135 (no VAT if <£135).
    At £62, no VAT charged. EU threshold £150 with 17% duty if <£150.
  checks:
    - tool: calculate_import_duty_and_vat_per_order
      args: {destination_market: UK, basket_value_gbp: 62}
      expect: ["estimated_duty_gbp", "estimated_vat_gbp", "62"]
    - tool: calculate_low_value_parcel_impact
      args: {destination_market: EU, parcel_volume_count: 10000, avg_value_gbp: 62}
      expect: ["vat_impact_gbp"]

- question: "04:32:Q5"
  story: >
    Lighting tariff rates by category and origin (UK): Portugal 0% (EU), Vietnam 10%, China 15%.
    Price-sensitive margin. Tariff scenarios show Vietnam exposed to 15% scenario.
  checks:
    - tool: get_tariff_rates_for_category_origin
      args: {category: "Lighting", destination_market: UK}
      expect: ["origin_country", "duty_rate_pct"]

- question: "04:33:Q3"
  story: >
    Denim sourcing analysis: Vietnam tariff rates on HS 6110 (denim) into UK: 10% vs Bangladesh 12%.
    Volume 600k units/year, Vietnam preferred. Lead time shorter, compliance risk lower.
  checks:
    - tool: get_tariff_rates_for_category_origin
      args: {category: "Trousers", origin_country: VN, destination_market: UK}
      expect: ["duty_rate_pct", "origin_country"]

- question: "04:33:Q6"
  story: >
    Tariff scenario analysis on China footwear. Scenario TSC-900002 shows duty increase:
    volume £3m, duty impact £300k, probability 40%. Mitigation to Vietnam or Indonesia.
  checks:
    - tool: get_tariff_scenario_rates
      args: {scenario_id: "TSC-900002"}
      expect: ["scenario_name", "duty_rate_change_pct"]

- question: "04:34:Q3"
  story: >
    Landed cost: Portugal has zero duty (UK/EU), Vietnam 10%. At 50,000 units £30 FOB,
    Portugal wins £130k (7.3%). Sensitive to freight and FX.
  checks:
    - tool: get_tariff_rates_for_commodity_code
      args: {hs_code: "6110", destination_market: UK}
      expect: ["duty_rate_pct", "origin_country"]

- question: "06:58:Q2"
  story: >
    Landed cost scenario: 30k units. Duty rate by HS and origin (UK, 10% Vietnam denim).
    Vietnam cheapest at £45 landed vs Portugal £44, China £52 (20% duty). Freight changes swing winner.
  checks:
    - tool: get_duty_rate_by_hs_code_and_origin
      args: {hs_code: "6110", origin_country: VN, destination_market: UK}
      expect: ["duty_rate_pct"]

- question: "06:58:Q6"
  story: >
    Tariff contingency: if tariffs change mid-season on imported appliances. Current duty 8%,
    scenario shows +3% likely. Building contingency at £3m volume, £240k swing.
  checks:
    - tool: get_duty_rate_by_hs_code_and_origin
      args: {hs_code: "85165829", origin_country: CN, destination_market: UK}
      expect: ["hs_code", "origin_country"]

- question: "07:62:Q1"
  story: >
    Gross margin bridge: duty cost trend shows last 6 months Vietnam denim £28k to £35k swings.
    Trend flattened after tariff stabilisation. Mitigation: shift locked in at 10% rate.
  checks:
    - tool: get_duty_cost_trend
      args: {origin_country: VN, date_from: "-180d"}
      expect: ["origin_country", "total_duty_gbp"]

- question: "07:63:Q1"
  story: >
    Top 100 SKUs landed cost up 7%: decomposed as 2% FX, 1% freight, 2% duty, 0.5% insurance, 1.5% supplier price.
    Controllable: 1% freight, 2% duty (origin shift), 1.5% price.
  checks:
    - tool: get_duty_and_insurance_by_sku
      args: {sku: "SKU-100070", destination_market: UK}
      expect: ["duty_per_unit_gbp", "insurance_gbp"]

- question: "07:67:Q1"
  story: >
    LE-HK TP policy: 12% mark-up, sourcing/QC/logistics functions. Documentation incomplete (missing comparables).
    Exposure £450k if audit. Files: functional analysis held, comparables/TP study due by Nov 30.
  checks:
    - tool: get_transfer_pricing_policy
      args: {entity_id: "LE-HK"}
      expect: ["LE-HK", "incomplete"]
    - tool: list_transfer_pricing_documentation
      args: {entity_id: "LE-HK"}
      expect: ["TPD-900001", "held"]
    - tool: calculate_transfer_pricing_exposure
      args: {entity_id: "LE-HK", annual_profit_gbp: 500000, challenge_probability_pct: 25}
      expect: ["exposure_gbp", "interest_and_penalties_gbp"]

- question: "07:67:Q2"
  story: >
    10% tariff increase on Turkey: current duty 10-12%, scenario TSC-900001 shows increase to 15-27%.
    Annual import £5m gives duty increase £250k-£750k. Origin shift to Portugal (zero) or Vietnam (10%).
  checks:
    - tool: get_current_duty_rates
      args: {hs_code: "63026131", destination_market: UK}
      expect: ["TR", "duty_rate_pct"]
    - tool: get_import_volumes_by_origin
      args: {origin_country: TR, date_from: "-365d"}
      expect: ["origin_country", "total_import_value_gbp"]
    - tool: calculate_duty_impact_scenario
      args: {scenario_id: "TSC-900001"}
      expect: ["scenario_name", "estimated_duty_impact_gbp"]

- question: "07:67:Q3"
  story: >
    Low-value parcel rules: UK threshold £135 (no VAT if <£135), EU £150. Current: 10,000 parcels/month at £62 average.
    UK saves £124k/year. EU saves £170k vs old threshold.
  checks:
    - tool: calculate_low_value_parcel_impact
      args: {parcel_volume_count: 10000, avg_value_gbp: 62, destination_market: EU}
      expect: ["vat_impact_gbp", "10000"]
    - tool: calculate_import_duty_and_vat_per_order
      args: {destination_market: EU, basket_value_gbp: 62}
      expect: ["estimated_duty_gbp"]

- question: "07:67:Q4"
  story: >
    Duty relief options: annual duty £500k on Vietnam imports at 15% average rate. Drawback saves £75k,
    first-sale £37.5k, bonded warehouse £75k (re-export). Easiest: drawback, but high audit risk.
  checks:
    - tool: get_duty_paid_by_entry
      args: {origin_country: VN, date_from: "-365d"}
      expect: ["entry_id", "duty_paid_gbp"]
    - tool: calculate_duty_saving_estimate
      args: {relief_type: drawback, annual_re_export_gbp: 5000000}
      expect: ["estimated_annual_saving_gbp"]
    - tool: calculate_duty_saving_estimate
      args: {relief_type: bonded_warehouse, annual_re_export_gbp: 5000000}
      expect: ["estimated_annual_saving_gbp"]

- question: "07:67:Q5"
  story: >
    LE-PL Q3 VAT return: box 6 £90k vs expected £80k, variance +£10k. Investigation shows 3 miscoded transactions
    (posted as S when should be Z/E). Correction recodes VTX-900001, reducing box 6 by ~£6k.
  checks:
    - tool: get_vat_return_summary
      args: {entity_id: "LE-PL", period: "2026-Q3"}
      expect: ["box_6_gbp", "variance_gbp"]
    - tool: compare_vat_return_to_expectation
      args: {entity_id: "LE-PL", period: "2026-Q3"}
      expect: ["variance_gbp", "actual_net_gbp"]
    - tool: list_vat_transactions_by_entity
      args: {entity_id: "LE-PL", period: "2026-Q3"}
      expect: ["vat_code"]

- question: "07:67:Q6"
  story: >
    Tax incentives: automation DC investment £500k qualifies for 20% relief = £90k tax benefit.
    Renewable energy £300k investment = £70k at 25% rate. Both applied by deadlines.
  checks:
    - tool: calculate_incentive_value
      args: {incentive_id: "INC-900001"}
      expect: ["estimated_relief_gbp"]

- question: "08:77:Q4"
  story: >
    6% tariff on small appliances from 1 January: HS 85165829 current 8%, new +6% = 14%.
    Landed cost impact on £3m volume: £180k extra duty/year. Recommend 3% price increase.
  checks:
    - tool: get_tariff_rates_for_commodity_code
      args: {hs_code: "85165829", destination_market: UK}
      expect: ["duty_rate_pct"]

- question: "08:80:Q1"
  story: >
    Poland and Czechia market entry: both in EU, zero intra-EU tariffs. Labelling: local language, CE marking.
    Typical retail margins 50-60%. Price-sensitive consumers, local brands strong.
  checks:
    - tool: get_import_rules_and_tariffs_for_market
      args: {destination_market: EU}
      expect: ["EU", "hs_codes_configured"]
    - tool: get_import_rules_and_tariffs_for_market
      args: {destination_market: UK}
      expect: ["UK", "hs_codes_configured"]

- question: "08:80:Q6"
  story: >
    Mexico subsidiary vs franchise: subsidiary = full tax compliance, transfer pricing, ownership/control.
    Franchise = royalty flow (15-20%), simpler structure. Recommend subsidiary at scale >£10m.
  checks:
    - tool: get_tax_treatment_of_subsidiary_vs_franchise
      args: {destination_market: MX}
      expect: ["Subsidiary", "Franchise"]

- question: "01:1:CUSTOM"
  story: >
    Create tax compliance task: LE-HK transfer pricing functional analysis due in 30 days,
    assigned to EMP-0042, high priority.
  checks:
    - tool: create_tax_compliance_task
      args: {task_type: documentation, description: "Prepare transfer pricing functional analysis for LE-HK", entity_id: "LE-HK", assigned_to: "EMP-0042", due_date: "+30d"}
      expect: ["task_id", "TCT-", "open"]
