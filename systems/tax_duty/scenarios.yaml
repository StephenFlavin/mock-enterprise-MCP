# Tax & Duty system scenarios: one entry per question that uses our tools
# Questions listed in: python -m mockmcp brief tax_duty

- question: "02:14:Q1"
  story: >
    HS 6110 into the UK: Vietnam 10% (8% under CPTPP), Bangladesh 12% (0% under DCTS), Turkey 12% (9% under the UK-Turkey FTA).
    No change in the last 12 months into the UK or EU. Into the US, Vietnam and Bangladesh each went up in the last 12 months
    (Vietnam 10% to 15%). Per 10,000 of goods into the UK: duty 1,000 / 1,200 / 1,200, VAT 2,200 / 2,240 / 2,240.
  checks:
    - tool: get_current_duty_rates
      args: {hs_code: "6110", origin_country: "VN,BD,TR"}
      expect: ["CPTPP", "DCTS (LDC)", "UK-Turkey FTA", "Changed in last 12 months: was 10.0% until"]
    - tool: calculate_duty_per_value
      args: {hs_code: "6110", origin_country: "VN,BD,TR", destination_market: UK}
      expect: ["1000", "1200", "2200", "2240"]

- question: "02:14:Q2"
  story: >
    Padded gilet: HS 6110 (knitted, 10% from Vietnam) versus 6202 (woven padded, 12%). At 80,000 units and 50 per unit
    (4,000,000 of goods) duty is 400,000 versus 480,000: a difference of 80,000, so 6110 is cheaper.
  checks:
    - tool: calculate_duty_difference_between_codes
      args: {hs_code_1: "6110", hs_code_2: "6202", origin_country: VN, units: 80000, unit_cost_gbp: 50}
      expect: ["duty_difference_gbp: 80000", "code_1_duty_gbp: 400000", "code_2_duty_gbp: 480000", "cheaper_code: 6110"]

- question: "02:14:Q3"
  story: >
    Supplier SUP-0052 (Bangladesh, kids' wear, HS 6209): eleven recent entries held by customs, all because the preference
    (0% under DCTS) was claimed without proof of origin. Earlier cleared entries carry the same issue. Exposure if reassessed
    is the standard 12% on the declared value, held and cleared.
  checks:
    - tool: calculate_duty_reassessment_exposure
      args: {supplier_id: SUP-0052, date_from: "-60d"}
      expect: ["held_entries: 11", "SUP-0052", "preference claimed without valid proof of origin"]
    - tool: calculate_duty_reassessment_exposure
      args: {supplier_id: SUP-0052}
      expect: ["held_entries: 11", "exposure_on_cleared_entries_gbp", "total_exposure_gbp"]

- question: "02:14:Q4"
  story: >
    Footwear (HS 6403) from Vietnam into the UK pays 6% today. A 15 point additional tariff takes it to 21%: on a 4m annual
    buy the duty rises from 240,000 to 840,000 (+600,000). Indonesia pays 8% (5% under DCTS).
  checks:
    - tool: calculate_tariff_cost_impact
      args: {hs_code: "6403", origin_country: VN, additional_tariff_pct: 15, annual_import_value_gbp: 4000000}
      expect: ["current_rate_pct: 6", "new_rate_pct: 21", "duty_increase_gbp: 600000"]
    - tool: calculate_tariff_cost_impact
      args: {hs_code: "6403", origin_country: ID, additional_tariff_pct: 15, annual_import_value_gbp: 4000000}
      expect: ["current_rate_pct: 8", "new_rate_pct: 23", "duty_increase_gbp: 600000"]

- question: "02:14:Q7"
  story: >
    Goods re-exported to Ireland and the EU: 5m a year under a bonded warehouse or IPR suspends duty at our effective
    rate (about 6.8% over the last 12 months), and a 45 day dwell at 5% financing is worth a small cash-flow benefit.
  checks:
    - tool: calculate_duty_deferral_benefit
      args: {annual_re_export_value_gbp: 5000000, avg_dwell_days: 45, financing_rate_pct: 5}
      expect: ["duty_suspended_per_year_gbp", "cash_flow_benefit_per_year_gbp", "duty_rate_pct_used"]
    - tool: calculate_cash_flow_benefit
      args: {annual_import_value_gbp: 5000000, avg_deferral_days: 45, financing_rate_pct: 5}
      expect: ["annual_financing_saving_gbp", "average_deferred_duty_gbp"]

- question: "02:14:Q8"
  story: >
    A 62 basket into the UK pays no duty today (relief below 135) and 12.40 VAT. When the relief is removed it pays 7.44
    duty and 13.89 VAT: 7.44 extra duty and 1.49 extra VAT per order.
  checks:
    - tool: calculate_import_duty_and_vat_per_order
      args: {destination_market: UK, basket_value_gbp: 62}
      expect: ["duty_now_gbp: 0", "vat_now_gbp: 12.4", "duty_after_gbp: 7.44", "extra_duty_per_order_gbp: 7.44", "extra_vat_per_order_gbp: 1.49"]
    - tool: calculate_import_duty_and_vat_per_order
      args: {destination_market: EU, basket_value_gbp: 62}
      expect: ["duty_threshold_now_gbp: 150", "extra_duty_per_order_gbp: 7.44"]

- question: "04:32:Q5"
  story: >
    Home department (housewares) goods are all HS 6302. UK duty by origin: China 15%, Bangladesh 12% (0% DCTS),
    Portugal and other EU origins 0%, Turkey 12% (9% under the FTA). Scenarios add risk on China, Turkey and Vietnam.
  checks:
    - tool: get_tariff_rates_for_category_origin
      args: {category: housewares, destination_market: UK}
      expect: ["6302", "CN", "15", "UK-Turkey FTA"]

- question: "04:33:Q3"
  story: >
    Denim is the Trousers category (HS 6203 men, 6204 women). UK duty from Vietnam 10% (8% CPTPP) versus Bangladesh 12% (0% DCTS).
  checks:
    - tool: get_tariff_rates_for_category_origin
      args: {category: denim, origin_country: VN, destination_market: UK}
      expect: ["6203", "6204", "CPTPP", "8"]
    - tool: get_tariff_rates_for_category_origin
      args: {category: denim, origin_country: BD, destination_market: UK}
      expect: ["DCTS (LDC)", "12"]

- question: "04:33:Q6"
  story: >
    Scenario TSC-900002: new tariffs on China-origin goods, +15 points at 40% probability. China imports of about 45m a year
    at a 12.5% effective rate would rise to 27.5% (about 6.8m extra duty). Alternatives: Bangladesh (0% preference), Vietnam 5.8%.
  checks:
    - tool: get_tariff_scenario_rates
      args: {origin_country: CN}
      expect: ["TSC-900002", "rate_after_change_pct", "VN 5.8%", "BD 0.0%"]

- question: "04:34:Q3"
  story: >
    Wool coat (men's outerwear, HS 6203): UK duty from Vietnam 10% (8% CPTPP) versus Portugal 0% (UK-EU trade agreement).
  checks:
    - tool: get_tariff_rates_for_category_origin
      args: {category: Outerwear, origin_country: PT, destination_market: UK}
      expect: ["PT", "6203", "0"]
    - tool: get_tariff_rates_for_category_origin
      args: {category: Outerwear, origin_country: VN, destination_market: UK}
      expect: ["VN", "10", "CPTPP"]

- question: "06:58:Q2"
  story: >
    Costing for HS 62038567 (matched to heading 6203) into the UK by origin: Portugal 0%, Vietnam 10% (8% CPTPP), Turkey 12%
    (9%), China 15%. Origins with a pending tariff scenario are flagged.
  checks:
    - tool: get_duty_rate_by_hs_code_and_origin
      args: {hs_code: "62038567"}
      expect: ["PT", "VN", "CPTPP", "CN", "Safeguard duty on Vietnam-origin goods"]
    - tool: get_duty_rate_by_hs_code_and_origin
      args: {hs_code: "62038567", origin_country: VN}
      expect: ["10", "8", "CPTPP"]

- question: "06:58:Q6"
  story: >
    Small appliances (HS 85165829, heading 8516) from China pay 11% into the UK, with two pending scenarios: +15 points at 40%
    (all China goods) and +10 points at 30% (China electricals).
  checks:
    - tool: get_duty_rate_by_hs_code_and_origin
      args: {hs_code: "85165829", origin_country: CN}
      expect: ["CN", "11", "Additional 10% tariff on China-origin electricals", "30"]

- question: "07:62:Q1"
  story: >
    Duty paid by month for the last six complete months. UK womenswear from China (HS 6204) paid 12% until the rate rose three
    points about 100 days ago and 15% since, so the monthly average steps from 12% to 15%.
  checks:
    - tool: get_duty_cost_trend
      args: {date_from: "-180d"}
      expect: ["total_duty_gbp", "avg_duty_rate_pct", "rate_change_vs_prior_month_pts"]
    - tool: get_duty_cost_trend
      args: {origin_country: CN, category: Womenswear, destination_market: UK}
      expect: ["CN", "Womenswear", "12", "15", "3"]

- question: "07:63:Q1"
  story: >
    SKU-101897 (China, HS 6204, unit cost 11.74, one of the biggest landed-cost risers): duty per unit is 1.76 now, up from 1.41, because the China rate went from
    12% to 15% about 100 days ago. Recent entries paid the new rate. Insurance is about 0.5% of cost.
  checks:
    - tool: get_duty_and_insurance_by_sku
      args: {sku: "SKU-101897"}
      expect: ["duty_per_unit_gbp: 1.76", "previous_duty_per_unit_gbp: 1.41", "previous_duty_rate_pct: 12", "actual_duty_per_unit_last_90_days_gbp: 1.76", "insurance_per_unit_gbp"]

- question: "07:67:Q1"
  story: >
    LE-HK 12% mark-up against a 6-10% benchmark: 2 points above, exposure 450,000 tax plus 45,000 interest; comparables
    study and TP study are missing. LE-PL 10% against 5-9%: 150,000 exposure, documents complete. LE-UK 8% within range.
    The write creates a compliance task for a missing document.
  checks:
    - tool: get_transfer_pricing_policy
      args: {}
      expect: ["LE-HK", "Above benchmark range", "Documentation gaps", "LE-UK", "Within benchmark range"]
    - tool: list_transfer_pricing_documentation
      args: {entity_id: "LE-HK"}
      expect: ["TPD-900002", "comparables study", "missing", "TPD-900001", "held"]
    - tool: calculate_transfer_pricing_exposure
      args: {entity_id: "LE-HK"}
      expect: ["additional_tax_open_years_gbp: 450000", "interest_gbp: 45000", "total_exposure_gbp: 495000"]
    - tool: create_tax_compliance_task
      args: {task_type: documentation, description: "Prepare comparables study for LE-HK", entity_id: "LE-HK", assigned_to: "EMP-00085", due_date: "+30d", priority: high}
      expect: ["TCT-", "open", "LE-HK", "EMP-00085", "high"]

- question: "07:67:Q2"
  story: >
    Turkey: about 25m of imports over the last 12 months at a 9.7% effective duty rate (HS 6302, 6204 and 6203). A 10 point
    tariff adds about 2.5m of duty a year (scenario TSC-900001, 50% probability); mitigation is Portugal or Vietnam.
  checks:
    - tool: get_current_duty_rates
      args: {hs_code: "6204", destination_market: UK, origin_country: TR}
      expect: ["TR", "12", "UK-Turkey FTA"]
    - tool: get_import_volumes_by_origin
      args: {origin_country: TR}
      expect: ["TR", "6302", "total_import_value_gbp"]
    - tool: calculate_duty_impact_scenario
      args: {origin_country: TR, tariff_increase_pct: 10}
      expect: ["TSC-900001", "extra_duty_per_year_gbp", "Portugal"]

- question: "07:67:Q3"
  story: >
    Low-value parcels: UK duty relief below 135 and EU below 150 are being removed; the US relief has already gone.
    At 120,000 parcels a year at 62 each, extra duty is about 893k in the UK and the EU, plus VAT on that duty.
  checks:
    - tool: calculate_low_value_parcel_impact
      args: {parcel_volume_count: 120000, avg_value_gbp: 62}
      expect: ["UK", "EU", "US", "extra_duty_per_year_gbp", "892800"]
    - tool: calculate_import_duty_and_vat_per_order
      args: {destination_market: EU, basket_value_gbp: 62}
      expect: ["duty_now_gbp: 0", "extra_duty_per_order_gbp: 7.44"]

- question: "07:67:Q4"
  story: >
    Duty paid on cleared entries over the last 12 months is about 2m on Vietnam imports alone. Relief estimates use our own
    effective duty rate (about 6.8%): drawback on 5m re-exported saves about 341k; first-sale on 20m of purchases saves about
    108k; drawback is the easiest, first-sale carries the highest audit risk.
  checks:
    - tool: get_duty_paid_by_entry
      args: {origin_country: VN}
      expect: ["total_duty_in_selection_gbp", "entries_in_selection", "VN"]
    - tool: calculate_duty_saving_estimate
      args: {relief_type: drawback, annual_re_export_gbp: 5000000}
      expect: ["estimated_annual_saving_gbp: 341500", "Easiest"]
    - tool: calculate_duty_saving_estimate
      args: {relief_type: first_sale, annual_purchase_gbp: 20000000}
      expect: ["estimated_annual_saving_gbp: 109280", "High"]
    - tool: calculate_duty_saving_estimate
      args: {relief_type: bonded_warehouse, annual_re_export_gbp: 5000000}
      expect: ["estimated_annual_saving_gbp: 341500"]

- question: "07:67:Q5"
  story: >
    LE-PL Q3: net VAT 600,000 above expectation. Drivers: three non-EU export sales (VTX-000205, VTX-000206, VTX-000207) posted
    at the standard rate instead of zero (379,500), one manual sales accrual posted twice (VTX-000209, 150,500) and an October
    invoice booked into Q3 (VTX-000210, 70,000). LE-UK is within its normal range. Correcting the codes shows in the comparison.
  checks:
    - tool: get_vat_return_summary
      args: {entity_id: "LE-PL", period: "2026-Q3"}
      expect: ["variance_gbp: 600000", "High variance - investigate", "prior_box_6_gbp"]
    - tool: compare_vat_return_to_expectation
      args: {entity_id: "LE-PL", period: "2026-Q3"}
      expect: ["miscoded_postings_gbp: 379500", "duplicate_postings_gbp: 150500", "timing_gbp: 70000", "volume_or_unexplained_gbp: 0"]
    - tool: list_vat_transactions_by_entity
      args: {entity_id: "LE-PL", period: "2026-Q3", issue: any}
      expect: ["VTX-000205", "VTX-000206", "VTX-000207", "miscoded: should be Z", "duplicate posting", "timing: belongs to 2026-Q4"]
    - tool: update_vat_code_on_transaction
      args: {vat_txn_id: "VTX-000205", corrected_to_code: "Z"}
      expect: ["corrected", "Z"]
    - tool: compare_vat_return_to_expectation
      args: {entity_id: "LE-PL", period: "2026-Q3"}
      expect: ["corrections_already_posted_gbp: 207000", "variance_after_corrections_gbp: 393000"]

- question: "07:67:Q6"
  story: >
    Incentives: DC automation relief at DC1 (500k planned, 90k relief) and DC2 (1.2m, 216k), renewable energy at DC3 (300k, 70k)
    and DC1 (450k, 100k, already applied). Deadlines and conditions are returned.
  checks:
    - tool: calculate_incentive_value
      args: {incentive_type: automation}
      expect: ["INC-900001", "90000", "INC-900002", "216000", "application_deadline"]
    - tool: calculate_incentive_value
      args: {incentive_type: renewable, site_id: DC3}
      expect: ["INC-900003", "70000", "certified"]

- question: "08:77:Q4"
  story: >
    Small appliances (HS 85165829): UK duty 8% from Mexico, India, Turkey and Indonesia, 6% Vietnam, 11% China, 0% EU origins;
    pending scenarios are shown against each origin.
  checks:
    - tool: get_tariff_rates_for_commodity_code
      args: {hs_code: "85165829", destination_market: UK}
      expect: ["MX", "8", "CN", "11", "pending_scenario"]

- question: "08:80:Q1"
  story: >
    Poland (23% import VAT) and Czechia (21%) are in the EU customs territory: EU duty rates apply, UK-origin goods 0% with
    proof of origin; EORI, VAT registration or fiscal representative and customs declaration are needed.
  checks:
    - tool: get_import_rules_and_tariffs_for_market
      args: {destination_market: PL}
      expect: ["Poland", "EU", "23", "EORI", "UK-origin goods enter at 0%"]
    - tool: get_import_rules_and_tariffs_for_market
      args: {destination_market: CZ}
      expect: ["Czechia", "21", "EORI"]

- question: "08:80:Q6"
  story: >
    Mexico: a subsidiary pays 30% corporate tax, 10% dividend withholding, has transfer pricing duties and costs 150k to set up;
    a franchise gives royalty income with 10% treaty withholding and a lighter structure (40k set-up), but the group keeps brand risk.
  checks:
    - tool: get_tax_treatment_of_subsidiary_vs_franchise
      args: {destination_market: MX}
      expect: ["subsidiary", "franchise", "150000", "40000", "royalty_withholding_pct", "liquidation"]
