# One entry per question row that uses this system's tools
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string

- question: "01:10:Q1"
  story: >
    DC1 shuttle system had 14 unplanned stoppages in September (last month). Gearbox and motor bearing
    failures dominated, causing 420 and 380 units of throughput loss respectively. The root causes are
    normal wear (predictable from run hours) and lack of maintenance (oil temperature). Fault logs FLT-900001
    through FLT-900014 capture these. Software versions were 3.2 and 3.3 at time of fault.
  checks:
    - tool: get_fault_log_entries
      args: {site_id: DC1, severity: critical, date_from: "-30d"}
      expect: ["MOTOR-001", "GEARBOX-002", "Motor bearing failure", "Gearbox oil temperature", "420", "380"]
    - tool: get_throughput_loss_for_stoppage
      args: {site_id: DC1, date_from: "-30d"}
      expect: ["FLT-900001", "420", "105", "FLT-900002", "380"]
    - tool: get_equipment_software_versions
      args: {site_id: DC1, asset_class: motor}
      expect: ["AST-DC1-CNV-M01", "3.3"]
    - tool: get_equipment_software_versions
      args: {site_id: DC1, asset_class: gearbox}
      expect: ["AST-DC1-CNV-G01", "3.2"]

- question: "01:10:Q2"
  story: >
    Conveyor network, sorter, and motor/gearbox/sensor components at DC1 are tracked. Controllers run
    software 3.2-3.4 and device firmware 1.8-2.0. The gearbox (AST-DC1-CNV-G01) is in degraded status
    with software 3.2, last updated June. Fault log shows gearbox temperature failures (FLT-900001, FLT-900006)
    with 105-150 minute durations and high replacement cost impact (350-420 units throughput loss).
  checks:
    - tool: get_equipment_software_versions
      args: {site_id: DC1}
      expect: ["AST-DC1-CNV", "3.3", "AST-DC1-SRT", "3.4", "AST-DC1-CNV-M01", "AST-DC1-CNV-G01"]
    - tool: get_equipment_software_versions
      args: {site_id: DC1, status: degraded}
      expect: ["AST-DC1-CNV-G01", "degraded"]
    - tool: get_fault_log_entries
      args: {site_id: DC1, fault_code: GEARBOX}
      expect: ["GEARBOX-002", "FLT-900001", "105", "420"]

- question: "01:10:Q3"
  story: >
    AMR fleet firmware versions: DC1 has 8 robots (robot-001 to robot-008), with 3 running firmware 4.7
    (robot-002, robot-005, robot-007) and 5 running 4.6 (robot-001, robot-003, robot-004, robot-006, robot-008).
    DC2 and DC3 similarly split. Ready for upgrade assessment.
  checks:
    - tool: get_amr_fleet_firmware_versions
      args: {site_id: DC1, firmware_version: "4.7"}
      expect: ["robot-002", "4.7", "robot-005", "robot-007"]
    - tool: get_amr_fleet_firmware_versions
      args: {site_id: DC1, firmware_version: "4.6"}
      expect: ["robot-001", "4.6", "robot-003", "robot-004", "robot-006", "robot-008"]
    - tool: get_amr_fleet_firmware_versions
      args: {site_id: DC1}
      expect: ["robot-", "DC1", "firmware_version"]

- question: "01:10:Q5"
  story: >
    Robot throughput at DC1 drops ~15% between 2-4pm (14:00-16:00) from typical 160 units/hour to 125-130.
    Traffic density peaks at 72-78% during 14:00-16:00 vs 45-50% at other times. Congestion events jump
    from 0-1 to 4-7. Current charging windows run 14:00-16:00. Moving to 18:00-20:00 avoids peak throughput
    impact. Update CHG-900003 (DC1, 14:00-16:00) to 18:00-20:00.
  checks:
    - tool: get_robot_throughput_by_hour
      args: {site_id: DC1, date_from: "-7d"}
      expect: ["14:59:59", "125", "128", "130", "132", "throughput_units"]
    - tool: get_robot_traffic_congestion
      args: {site_id: DC1, date_from: "-7d"}
      expect: ["72", "75", "78", "congestion_events", "14:59:59", "15:59:59"]
    - tool: get_fleet_charging_schedule
      args: {site_id: DC1}
      expect: ["14:00", "16:00", "CHG-900003", "robots_in_slot"]
    - tool: update_fleet_charging_schedule
      args: {schedule_id: CHG-900003, start_time: "18:00", end_time: "20:00"}
      expect: ["18:00", "20:00"]
    - tool: get_fleet_charging_schedule
      args: {site_id: DC1}
      expect: ["18:00", "20:00", "CHG-900003"]
