# One entry per question row that uses this system's tools
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string

- question: "08:80:Q2"
  story: >
    Dubai franchise (PTN-011) is out of stock on core range lines (SKU-100028, SKU-100035, SKU-100042,
    SKU-100091, SKU-100098 all at 35-52 units vs target 100-130) but overstocked on non-core items
    (SKU-100007, 100014, 100021, 100049, 100056 all at 280-350 units vs target 70-90). The franchise
    has two open orders: FRO-900001 (1250 units, expected in about two weeks) and FRO-900002 (800 units, expected
    2026-10-15). We hold the non-core overstock lines (FRO-900001 lines 3-5) and expedite core range
    (FRO-900001 lines 1-2).
  checks:
    - tool: get_franchise_order_history
      args: {partner_id: PTN-011}
      expect: ["FRO-900001", "FRO-900002", "open"]
    - tool: compare_core_range_cover_vs_forecast
      args: {partner_id: PTN-011}
      expect: ["overstock", "understock", "SKU-100028", "SKU-100007"]
    - tool: compare_core_range_cover_vs_forecast
      args: {partner_id: PTN-011, is_core_range: true}
      expect: ["SKU-100028", "understock", "SKU-100098"]
    - tool: get_partner_stock_position
      args: {partner_id: PTN-011}
      expect: ["PTN-011", "understock", "overstock"]
    - tool: update_franchise_order_hold
      args: {order_id: FRO-900001, hold_reason: "Expedite core range only"}
      expect: ["FRO-900001", "HLD-", "Expedite"]

- question: "08:80:Q5"
  story: >
    Portfolio review of franchise partners. PTN-013 (compliance 55, 8 stockouts, GBP 75k overstock, 22% margin)
    and PTN-014 (compliance 58, 6 stockouts, GBP 82k overstock) are the two worst active partners; PTN-011
    (68) is next. PTN-016 is ended in master and is excluded from the intervention list. Notices go to
    PTN-013 and PTN-014.
  checks:
    - tool: get_franchise_partner_scorecard
      args: {}
      expect: ["PTN-013", "PTN-014", "PTN-012"]
    - tool: list_partners_needing_intervention
      args: {min_compliance_score: 75}
      expect: ["PTN-013", "PTN-014", "PTN-011"]
    - tool: send_partner_performance_notice
      args: {partner_id: PTN-013, notice_type: compliance_warning, content: "Your compliance score has fallen below 75%. Please review inventory procedures."}
      expect: ["PNC-", "PTN-013", "sent"]
    - tool: send_partner_performance_notice
      args: {partner_id: PTN-014, notice_type: intervention_notice, content: "High overstock levels detected. Please adjust ordering to match sales velocity."}
      expect: ["PNC-", "PTN-014", "sent"]
