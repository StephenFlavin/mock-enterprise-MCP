id: identity
name: Identity & Security Platform
instructions: >
  Security alerts, vulnerability scan findings, authentication logs, user sessions, and third-party connections.
  Alert ids look like ALT-000123, incident ids like INC-000456. Use it for security triage, incident investigation,
  auth log analysis, and third-party risk assessment.

tables:
  security_alerts:
    key: alert_id
    cols:
      alert_id: {type: str, desc: "Alert id, e.g. ALT-000123"}
      source_system: {type: str, desc: "System generating the alert, e.g. siem, endpoint, network"}
      alert_type: {type: str, desc: "Alert type, e.g. failed_login_spike, data_exfil, privilege_escalation"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Alert severity level"}
      asset_id: {type: str, desc: "Asset or system affected"}
      user_id: {type: str, desc: "User involved if applicable"}
      raised_at: {type: timestamp, desc: "When alert was raised"}
      description: {type: str, desc: "Alert description"}
      status: {type: enum, values: [open, investigating, resolved, false_positive], desc: "Alert status"}
      closed_at: {type: timestamp, desc: "When alert was closed"}
      disposition_reason: {type: str, desc: "Why closed (if closed)"}
      updated_at: {type: timestamp, desc: "Last updated"}

  vulnerability_scan_findings:
    key: finding_id
    cols:
      finding_id: {type: str, desc: "Finding id, e.g. VUL-000123"}
      asset_id: {type: str, desc: "Asset or system with vulnerability"}
      site_id: {type: str, desc: "Site where asset is located"}
      cve_id: {type: str, desc: "CVE identifier, e.g. CVE-2024-1234"}
      vulnerability_title: {type: str, desc: "Vulnerability name"}
      cvss_score: {type: float, desc: "CVSS score 0-10"}
      cvss_vector: {type: str, desc: "CVSS vector string"}
      is_externally_exposed: {type: bool, desc: "Whether asset is externally accessible"}
      is_exploited_in_wild: {type: bool, desc: "Whether CVE has known public exploits"}
      is_patched: {type: bool, desc: "Whether the patch has been applied"}
      patch_available_since: {type: date, desc: "When a patch was released"}
      affected_software: {type: str, desc: "Software/version affected"}
      current_version: {type: str, desc: "Current installed version"}
      patched_version: {type: str, desc: "First patched version"}
      discovered_date: {type: date, desc: "When vulnerability was discovered"}
      last_scanned: {type: date, desc: "Most recent scan date"}
      remediation_status: {type: enum, values: [unpatched, patch_available, patched], desc: "Patch status"}
      updated_at: {type: timestamp, desc: "Last updated"}

  alert_dispositions:
    key: disposition_id
    cols:
      disposition_id: {type: str, desc: "Disposition record id"}
      alert_type: {type: str, desc: "Type of alert this disposition applies to"}
      source_system: {type: str, desc: "Source system"}
      past_disposition: {type: enum, values: [false_positive, benign, incident, unknown], desc: "How past alerts were resolved"}
      count: {type: int, desc: "Number of past alerts of this type and source with this disposition"}
      last_occurrence_date: {type: date, desc: "Most recent occurrence"}

  auth_logs:
    key: log_id
    cols:
      log_id: {type: str, desc: "Log entry id"}
      timestamp: {type: timestamp, desc: "When the auth event occurred"}
      user_id: {type: str, desc: "Employee or third-party user id"}
      username: {type: str, desc: "Login username"}
      source_ip: {type: str, desc: "IP address of the login"}
      source_location: {type: str, desc: "Inferred location of IP"}
      authentication_method: {type: str, desc: "Method used: password, mfa, sso, cert"}
      result: {type: enum, values: [success, failed, mfa_required, mfa_failed, blocked], desc: "Authentication result"}
      reason: {type: str, desc: "Reason for failure if applicable"}
      system_accessed: {type: str, desc: "System being accessed, e.g. edi_portal, vendor_portal, payroll_system"}
      session_id: {type: str, desc: "Session id if authenticated"}
      updated_at: {type: timestamp, desc: "When log entry was recorded"}

  user_sessions:
    key: session_id
    cols:
      session_id: {type: str, desc: "User session identifier"}
      user_id: {type: str, desc: "Employee or third-party user id"}
      username: {type: str, desc: "Username"}
      user_type: {type: enum, values: [employee, supplier, partner, contractor], desc: "Type of user"}
      started_at: {type: timestamp, desc: "Session start time"}
      ended_at: {type: timestamp, desc: "Session end time"}
      source_ip: {type: str, desc: "IP address"}
      source_location: {type: str, desc: "Inferred location"}
      system_accessed: {type: str, desc: "Primary system accessed"}
      actions_count: {type: int, desc: "Number of actions in session"}
      data_accessed_systems: {type: str, desc: "Semicolon-separated systems accessed"}
      data_viewed_records: {type: str, desc: "Types of records accessed, e.g. bank_details, po_lines"}
      is_suspicious: {type: bool, desc: "Flagged as suspicious"}
      block_reason: {type: str, desc: "If blocked, why"}

  third_party_connections:
    key: connection_id
    cols:
      connection_id: {type: str, desc: "Connection id, e.g. CON-000123"}
      connection_name: {type: str, desc: "Name of the third party"}
      connection_type: {type: enum, values: [supplier, partner, vendor, contractor], desc: "Type of connection"}
      supplier_id: {type: str, desc: "Supplier id if applicable"}
      partner_id: {type: str, desc: "Partner id if applicable"}
      carrier_id: {type: str, desc: "Carrier id if applicable"}
      primary_purpose: {type: str, desc: "Primary reason for connection"}
      connection_established: {type: date, desc: "When connection was established"}
      connection_status: {type: enum, values: [active, inactive, onboarding, deactivating], desc: "Connection status"}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Overall risk rating"}
      data_scope: {type: str, desc: "Semicolon-separated data types accessed"}
      systems_accessed: {type: str, desc: "Semicolon-separated systems with access"}
      privileged_access: {type: bool, desc: "Has elevated/admin privileges"}
      updated_at: {type: timestamp, desc: "Last updated"}

  connection_controls:
    key: [connection_id, control_type]
    cols:
      connection_id: {type: str, desc: "Connection id"}
      control_type: {type: str, desc: "Type of control, e.g. mfa, ip_allowlist, data_encryption, logging"}
      control_name: {type: str, desc: "Specific control, e.g. Duo MFA, IP restrict to 203.0.113.0/24"}
      is_enabled: {type: bool, desc: "Whether control is active"}
      enabled_date: {type: date, desc: "When control was enabled"}
      audit_trail: {type: bool, desc: "Whether all actions are logged"}
      last_verified: {type: date, desc: "Last verification date"}
      effectiveness_rating: {type: str, desc: "Effectiveness: low, medium, high"}

  connection_access_privileges:
    key: [connection_id, system_id]
    cols:
      connection_id: {type: str, desc: "Connection id"}
      system_id: {type: str, desc: "System granted access to, e.g. edi_portal"}
      privilege_level: {type: enum, values: [read_only, read_write, admin], desc: "Access level"}
      data_scope: {type: str, desc: "Semicolon-separated data types accessible"}
      scope_description: {type: str, desc: "English description of access"}
      access_granted_date: {type: date, desc: "When access was granted"}
      access_reviewed_date: {type: date, desc: "When access was last reviewed"}
      requires_approval_for: {type: str, desc: "What actions require additional approval"}
      audit_events_enabled: {type: bool, desc: "All events logged"}

  unpatched_systems:
    key: [system_id, cve_id]
    cols:
      system_id: {type: str, desc: "System or asset id"}
      system_name: {type: str, desc: "System name"}
      site_id: {type: str, desc: "Site id if applicable"}
      cve_id: {type: str, desc: "CVE identifier"}
      vulnerability_title: {type: str, desc: "Vulnerability description"}
      cvss_score: {type: float, desc: "CVSS severity score"}
      is_externally_exposed: {type: bool, desc: "Accessible from internet"}
      patch_available: {type: bool, desc: "Whether patch exists"}
      days_unpatched: {type: int, desc: "Days since patch was available"}
      business_criticality: {type: enum, values: [low, medium, high, critical], desc: "Impact if compromised"}
      exploitability: {type: enum, values: [low, medium, high], desc: "Ease of exploitation"}

  security_incidents:
    key: incident_id
    cols:
      incident_id: {type: str, desc: "Incident id, e.g. INC-000123"}
      alert_ids: {type: str, desc: "Semicolon-separated alert ids that triggered incident"}
      incident_type: {type: str, desc: "Type: breach, compromise, malware, data_exfil, etc."}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Incident severity"}
      description: {type: str, desc: "Incident summary"}
      user_involved: {type: str, desc: "User id if known"}
      systems_affected: {type: str, desc: "Semicolon-separated systems affected"}
      created_at: {type: timestamp, desc: "When incident was created"}
      detected_at: {type: timestamp, desc: "When incident was detected"}
      contained_at: {type: timestamp, desc: "When containment actions taken"}
      status: {type: enum, values: [open, investigating, contained, closed], desc: "Incident status"}
      summary_for_ciso: {type: text, desc: "Executive summary"}
      containment_actions: {type: str, desc: "Actions taken to contain"}
      updated_at: {type: timestamp, desc: "Last updated"}

  user_accounts:
    key: user_id
    cols:
      user_id: {type: str, desc: "User account id"}
      username: {type: str, desc: "Login username"}
      user_type: {type: enum, values: [employee, supplier, partner, contractor], desc: "Type of account"}
      supplier_id: {type: str, desc: "Supplier the account belongs to, for supplier users"}
      name: {type: str, desc: "User full name"}
      status: {type: enum, values: [active, locked, disabled, suspended], desc: "Account status"}
      locked_at: {type: timestamp, desc: "When account was locked"}
      lock_reason: {type: str, desc: "Why account was locked"}
      is_privileged: {type: bool, desc: "Has elevated permissions"}
      mfa_enabled: {type: bool, desc: "Multi-factor auth enabled"}
      last_login: {type: timestamp, desc: "Last successful login"}
      failed_login_count: {type: int, desc: "Recent failed login attempts"}
      created_at: {type: timestamp, desc: "Account creation date"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: list_open_security_alerts
    desc: Open security alerts with severity, asset and user, most severe first then newest. Use for daily triage.
    kind: sql
    args:
      status: {default: open, type: enum, values: [open, investigating, resolved, false_positive], desc: "Alert status"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Only this severity"}
      asset_id: {}
      alert_type: {desc: "Alert type, e.g. failed_login_spike, data_exfiltration, malware_detected"}
      raised_from: {type: date, default: "-7d", desc: "Alerts raised on or after"}
    sql: |
      SELECT a.alert_id, a.alert_type, a.severity, a.source_system, a.asset_id, a.user_id, a.raised_at,
             a.description, a.status, a.disposition_reason
      FROM security_alerts a
      WHERE ($status IS NULL OR a.status = $status)
        AND ($severity IS NULL OR a.severity = $severity)
        AND ($asset_id IS NULL OR a.asset_id = $asset_id)
        AND ($alert_type IS NULL OR a.alert_type = $alert_type)
        AND CAST(a.raised_at AS DATE) >= CAST($raised_from AS DATE)
      ORDER BY CASE a.severity WHEN 'critical' THEN 1 WHEN 'high' THEN 2 WHEN 'medium' THEN 3 ELSE 4 END,
               a.raised_at DESC
    limit: 50
    example: {}

  - name: list_vulnerability_scan_findings
    desc: Unpatched scanner findings with CVSS, asset, exposure, exploited-in-the-wild flag and age in days. Worst first.
    kind: sql
    args:
      asset_id: {}
      site_id: {}
      is_externally_exposed: {type: bool, desc: "True for externally exposed findings only; omit for all"}
      is_exploited_in_wild: {type: bool, desc: "True for findings with known exploits only; omit for all"}
      min_cvss: {type: float, default: 5.0, desc: "Minimum CVSS score"}
    sql: |
      SELECT f.finding_id, f.asset_id, f.site_id, f.cve_id, f.vulnerability_title, f.cvss_score,
             f.is_externally_exposed, f.is_exploited_in_wild, f.remediation_status,
             f.discovered_date, date_diff('day', f.discovered_date, CAST($as_of AS DATE)) AS age_days,
             f.patch_available_since,
             CASE WHEN f.patch_available_since IS NULL THEN NULL
                  ELSE date_diff('day', f.patch_available_since, CAST($as_of AS DATE)) END AS days_since_patch_available
      FROM vulnerability_scan_findings f
      WHERE f.cvss_score >= $min_cvss
        AND f.remediation_status IN ('unpatched', 'patch_available')
        AND ($asset_id IS NULL OR f.asset_id = $asset_id)
        AND ($site_id IS NULL OR f.site_id = $site_id)
        AND ($is_externally_exposed IS NULL OR f.is_externally_exposed = $is_externally_exposed)
        AND ($is_exploited_in_wild IS NULL OR f.is_exploited_in_wild = $is_exploited_in_wild)
      ORDER BY f.is_exploited_in_wild DESC, f.is_externally_exposed DESC, f.cvss_score DESC, f.discovered_date
    limit: 50
    example: {}

  - name: get_alert_false_positive_history
    desc: Past dispositions of similar alerts by type and source, with the false positive percentage. Omit alert_type for all types.
    kind: sql
    args:
      alert_type: {desc: "Alert type, e.g. failed_login_spike, data_exfiltration, malware_detected"}
      source_system: {desc: "Source system, e.g. siem, endpoint, network"}
    sql: |
      SELECT alert_type, source_system,
             sum(count) FILTER (WHERE past_disposition = 'false_positive') AS false_positive_count,
             sum(count) FILTER (WHERE past_disposition = 'benign') AS benign_count,
             sum(count) FILTER (WHERE past_disposition = 'incident') AS confirmed_incident_count,
             sum(count) AS total_count,
             round(100.0 * sum(count) FILTER (WHERE past_disposition = 'false_positive') / sum(count), 1) AS false_positive_pct,
             max(last_occurrence_date) AS most_recent
      FROM alert_dispositions
      WHERE ($alert_type IS NULL OR alert_type = $alert_type)
        AND ($source_system IS NULL OR source_system = $source_system)
      GROUP BY alert_type, source_system
      ORDER BY false_positive_pct DESC
    limit: 20
    example: {alert_type: failed_login_spike}

  - name: search_auth_logs
    desc: Authentication events by user, IP, time window and result, newest first. Use to investigate suspicious logins.
    kind: sql
    args:
      user_id: {}
      source_ip: {}
      result: {type: enum, values: [success, failed, mfa_required, mfa_failed, blocked], desc: "Filter by auth result"}
      logged_from: {type: timestamp, default: "-14d", desc: "Events on or after"}
      logged_to: {type: timestamp, desc: "Events on or before (end of day if only a date is given)"}
      system_accessed: {desc: "System accessed, e.g. edi_portal, vendor_portal, wms"}
    sql: |
      SELECT log_id, timestamp, user_id, username, source_ip, source_location,
             authentication_method, result, reason, system_accessed, session_id
      FROM auth_logs
      WHERE ($user_id IS NULL OR user_id = $user_id)
        AND ($source_ip IS NULL OR source_ip = $source_ip)
        AND ($result IS NULL OR result = $result)
        AND ($system_accessed IS NULL OR system_accessed = $system_accessed)
        AND timestamp >= CAST($logged_from AS TIMESTAMP)
        AND ($logged_to IS NULL OR timestamp < CAST($logged_to AS TIMESTAMP) + INTERVAL 1 DAY)
      ORDER BY timestamp DESC
    limit: 100
    example: {user_id: SUPP-00001}

  - name: get_user_session_history
    desc: Sessions and actions taken by a user account, with systems and record types accessed. Newest first.
    kind: sql
    args:
      user_id: {required: true, desc: "User account id, e.g. SUPP-00001 or EMP-00109"}
      started_from: {type: timestamp, default: "-14d", desc: "Sessions on or after"}
    sql: |
      SELECT session_id, user_id, username, user_type, started_at, ended_at,
             source_ip, source_location, system_accessed, actions_count,
             data_accessed_systems, data_viewed_records, is_suspicious, block_reason
      FROM user_sessions
      WHERE user_id = $user_id
        AND started_at >= CAST($started_from AS TIMESTAMP)
      ORDER BY started_at DESC
    limit: 50
    example: {user_id: SUPP-00001}

  - name: list_controls_in_place_for_connection
    desc: Controls on third-party connections (MFA, IP allow-list, encryption, logging) and whether each is enabled. Omit connection_id for all.
    kind: sql
    args:
      connection_id: {desc: "Connection id, e.g. CON-900001; omit for all connections"}
      control_type: {desc: "Control type: mfa, ip_allowlist, data_encryption, logging"}
      is_enabled: {type: bool, desc: "False to list only controls that are missing"}
    sql: |
      SELECT c.connection_id, t.connection_name, c.control_type, c.control_name, c.is_enabled,
             c.enabled_date, c.audit_trail, c.last_verified, c.effectiveness_rating
      FROM connection_controls c
      JOIN third_party_connections t ON t.connection_id = c.connection_id
      WHERE ($connection_id IS NULL OR c.connection_id = $connection_id)
        AND ($control_type IS NULL OR c.control_type = $control_type)
        AND ($is_enabled IS NULL OR c.is_enabled = $is_enabled)
      ORDER BY c.connection_id, c.is_enabled, c.control_type
    limit: 60
    example: {connection_id: CON-900001}

  - name: get_connection_access_privileges
    desc: Systems, privilege level and data scope of third-party accounts, admin first. Omit connection_id for all.
    kind: sql
    args:
      connection_id: {desc: "Connection id, e.g. CON-900001; omit for all connections"}
      privilege_level: {type: enum, values: [read_only, read_write, admin], desc: "Only this access level"}
    sql: |
      SELECT c.connection_id, c.connection_name, c.risk_rating, c.privileged_access,
             p.system_id, p.privilege_level, p.data_scope, p.scope_description,
             p.access_granted_date, p.access_reviewed_date, p.audit_events_enabled
      FROM connection_access_privileges p
      JOIN third_party_connections c ON c.connection_id = p.connection_id
      WHERE ($connection_id IS NULL OR p.connection_id = $connection_id)
        AND ($privilege_level IS NULL OR p.privilege_level = $privilege_level)
      ORDER BY p.connection_id,
               CASE p.privilege_level WHEN 'admin' THEN 1 WHEN 'read_write' THEN 2 ELSE 3 END
    limit: 60
    example: {connection_id: CON-900001}

  - name: get_unpatched_exposure_by_system
    desc: Per system, count of unpatched and externally exposed CVEs with worst CVSS and criticality. Use for ransomware risk.
    kind: sql
    args:
      site_id: {}
      min_cvss: {type: float, default: 7.0, desc: "Minimum CVSS score"}
      is_externally_exposed: {type: bool, desc: "True to count only externally exposed CVEs; omit for all"}
    sql: |
      SELECT u.system_id, u.system_name, u.site_id, u.business_criticality,
             count(*) AS total_unpatched_cves,
             count(*) FILTER (WHERE u.is_externally_exposed) AS externally_exposed_count,
             count(*) FILTER (WHERE u.patch_available) AS patchable_count,
             round(avg(u.cvss_score), 1) AS avg_cvss,
             max(u.cvss_score) AS max_cvss,
             max(u.days_unpatched) AS max_days_unpatched,
             string_agg(DISTINCT u.cve_id, '; ') AS cve_list
      FROM unpatched_systems u
      WHERE u.cvss_score >= $min_cvss
        AND ($site_id IS NULL OR u.site_id = $site_id)
        AND ($is_externally_exposed IS NULL OR u.is_externally_exposed = $is_externally_exposed)
      GROUP BY u.system_id, u.system_name, u.site_id, u.business_criticality
      ORDER BY externally_exposed_count DESC, max_cvss DESC,
               CASE u.business_criticality WHEN 'critical' THEN 1 WHEN 'high' THEN 2 WHEN 'medium' THEN 3 ELSE 4 END
    limit: 50
    example: {}

  - name: create_security_incident
    desc: Opens a security incident record linked to alerts. Returns the new incident id.
    kind: insert
    table: security_incidents
    id_prefix: INC-
    defaults: {status: open, detected_at: "$as_of"}
    args:
      alert_ids: {required: true, desc: "Semicolon-separated alert ids, e.g. ALT-900002"}
      incident_type: {required: true, desc: "Type: breach, compromise, malware, data_exfil"}
      severity: {required: true, type: enum, values: [low, medium, high, critical], desc: "Incident severity"}
      description: {required: true, desc: "Incident summary"}
      user_involved: {desc: "User account id if known, e.g. SUPP-00001"}
      systems_affected: {desc: "Semicolon-separated systems affected, e.g. edi_portal;vendor_portal"}
    example: {alert_ids: "ALT-900002", incident_type: "data_exfil", severity: "critical", description: "Supplier account accessed bank details from unusual location", user_involved: "SUPP-00001", systems_affected: "edi_portal;vendor_portal"}

  - name: update_security_alert_status
    desc: Closes a security alert as resolved or false positive with a reason. Returns old and new status.
    kind: update
    table: security_alerts
    set: {status: "{status}", closed_at: "$as_of"}
    args:
      status: {required: true, type: enum, values: [resolved, false_positive], desc: "New status"}
      disposition_reason: {required: true, desc: "Why alert is being closed"}
    example: {alert_id: "ALT-900006", status: "false_positive", disposition_reason: "User forgot password after leave"}

  - name: block_user_account
    desc: Locks a user account and records the reason. Returns the locked account.
    kind: update
    table: user_accounts
    set: {status: locked, locked_at: "$as_of"}
    args:
      lock_reason: {required: true, desc: "Why account is locked"}
    example: {user_id: "SUPP-00001", lock_reason: "Suspected compromise"}
