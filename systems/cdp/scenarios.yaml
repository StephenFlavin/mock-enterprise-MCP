# One entry per question row that uses this system's tools (see: python -m mockmcp brief cdp).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:21:Q5"
  story: >
    Fast Fashion Hunters (SEG-002) have a 24.5% return rate and 55% sensitivity to return charges,
    making them the most affected segment. Essential Buyers (SEG-004) also show high sensitivity at 62%.
    Premium Loyalists (SEG-001) are least affected at 8.5% return rate and 25% charge sensitivity.
  checks:
    - tool: get_customer_segment_return_behaviour
      args: {segment_id: SEG-002}
      expect: ["Fast Fashion Hunters", "24.5", "55"]
    - tool: get_customer_segment_return_behaviour
      args: {segment_id: SEG-004}
      expect: ["Essential Buyers", "11.8", "62"]

- question: "03:27:Q6"
  story: >
    Essential Buyers (SEG-004) have 58% stockout sensitivity with 28,000 customers and £280 annual spend,
    exposing £4.5M in annual revenue to stockout risk. They should be the priority for protection.
    Premium Loyalists (SEG-001) have only 15% sensitivity despite higher spend.
  checks:
    - tool: get_customer_segment_exposure_to_stockouts
      args: {segment_id: SEG-004}
      expect: ["Essential Buyers", "58", "4547200"]
    - tool: get_customer_segment_exposure_to_stockouts
      args: {segment_id: SEG-001}
      expect: ["Premium Loyalists", "15"]

- question: "03:29:Q3"
  story: >
    Fast Fashion Hunters (SEG-002) show 68% markdown wait propensity with 2.1x conversion elasticity,
    creating high risk of training them to wait. Trend Followers (SEG-005) also show 55% propensity.
    Premium Loyalists (SEG-001) at 12% propensity are safe from this training effect.
  checks:
    - tool: get_customer_markdown_wait_behaviour
      args: {segment_id: SEG-002}
      expect: ["Fast Fashion Hunters", "68", "2.1"]
    - tool: get_customer_markdown_wait_behaviour
      args: {segment_id: SEG-001}
      expect: ["Premium Loyalists", "12"]

- question: "05:49:Q4"
  story: >
    Conscious Shoppers (SEG-003) have 62% resale participation with no identified barriers.
    Most other segments have low participation: Fast Fashion Hunters limited by effort (12%),
    Essential Buyers by awareness (3%), Premium Loyalists by price sensitivity (5%).
  checks:
    - tool: get_customer_segment_participation
      args: {segment_id: SEG-003}
      expect: ["Conscious Shoppers", "62", "5084"]
    - tool: get_customer_segment_participation
      args: {segment_id: SEG-002}
      expect: ["Fast Fashion Hunters", "effort", "5400"]
    - tool: get_customer_segment_participation
      args: {segment_id: SEG-004}
      expect: ["Essential Buyers", "awareness", "840"]

- question: "06:52:Q1"
  story: >
    Segments are mostly women: Trend Followers (SEG-005, 76% female, ages 16-28, colour and silhouette led)
    and Fast Fashion Hunters (SEG-002, 72% female) are the most relevant to women's AW27 trends.
  checks:
    - tool: get_customer_segment_profile
      args: {segment_id: SEG-005}
      expect: ["Trend Followers", "76", "colour and silhouette"]
    - tool: get_customer_segment_profile
      args: {segment_id: SEG-002}
      expect: ["Fast Fashion Hunters", "72"]

- question: "06:52:Q6"
  story: >
    Outdoor Explorers (SEG-006, ages 25-34) buy outdoor clothing in the UK (waterproof shells, value) and
    Germany (durability, sustainable fabrics).
  checks:
    - tool: get_customer_segment_profile
      args: {category: outdoor, age_from: 25, age_to: 34}
      expect: ["Outdoor Explorers", "waterproof", "durability", "sustainable"]

- question: "06:56:Q1"
  story: >
    Home Nesters (SEG-007, 21,000 customers, ages 28-45, UK/DE/US) are the main driver of home and
    lifestyle trend demand.
  checks:
    - tool: get_customer_segment_profile
      args: {category: home}
      expect: ["Home Nesters", "21000", "28", "45"]

- question: "06:56:Q3"
  story: >
    Wellness Seekers (SEG-008, ages 30-50, 9,500 customers, high spend tier) are the segment buying
    wellness and recovery products.
  checks:
    - tool: get_customer_segment_profile
      args: {category: wellness}
      expect: ["Wellness Seekers", "30", "50", "9500"]

- question: "06:56:Q4"
  story: >
    For the home range, Home Nesters (SEG-007) are the driver segment; in the UK they want natural
    textures, layered textiles and scented candles.
  checks:
    - tool: get_customer_segment_profile
      args: {category: home, market: UK}
      expect: ["Home Nesters", "natural textures", "scented candles"]
