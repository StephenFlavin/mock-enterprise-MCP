# One entry per question row that uses this system's tools (see: python -m mockmcp brief customer_service).

- question: "02:16:Q5"
  story: >
    WISMO contacts ramp from about 5 a day to about 8.5 a day, so the last 4 weeks are about 30% up on the 4 before
    (216 contacts, +30.9%). Missed scans drive the rise (share of WISMO from about 20% to about 40%, roughly 80 vs 42
    in the last 28 days), while delayed delivery, tracking gaps and tracking-update issues are flat. Rule NTF-000001
    (missed scan delay alert, 45% prevention rate) is inactive and is the one to turn on; NTF-000003 (tracking gap) is already active.
  checks:
    - tool: get_wismo_contact_trend
      args: {weeks_back: 8}
      expect: ["30.9", "216", "pct_change_vs_prior_4_weeks"]
    - tool: get_wismo_contacts_by_reason
      args: {date_from: "-28d"}
      expect: ["Missed scan", "Delayed delivery", "prior_period_contacts"]
    - tool: calculate_notification_impact_estimate
      args: {rule_type: "missed_scan_alert"}
      expect: ["NTF-000001", "Missed scan delay alert", "45", "estimated_contacts_prevented"]
    - tool: update_notification_rule
      args: {rule_id: "NTF-000001", status: "active", estimated_contacts_prevented: 33}
      expect: ["inactive → active"]
    - tool: calculate_notification_impact_estimate
      args: {rule_type: "missed_scan_alert"}
      expect: ["active"]

- question: "04:40:Q3"
  story: >
    Glass breakage claims are 14 in the last 30 days against 10 in the 30 days before (+40%). K-1700 (1.7L Glass
    Kettle) is worst with 6 claims (3 before), then SKU-104123 and SKU-100091. Flat background of non-glass damage
    (torn seams, water damage, dented cartons) on apparel and bedding is excluded by the glass filter.
  checks:
    - tool: get_damage_claims_by_item
      args: {date_from: "-30d", damage_type: "glass"}
      expect: ["K-1700", "SKU-104123", "ALL ITEMS", "prior_period_claims", "40"]
    - tool: get_damage_claims_by_item
      args: {date_from: "-30d", damage_type: "glass", sku: "K-1700"}
      expect: ["K-1700", "Small Appliances"]

- question: "05:42:Q2"
  story: >
    Zip strength complaints rise over 90 days on trouser style STY-T-4410: 11 on SKU-100651 (the lot's SKU, mostly high
    severity, two critical safety-related reports of a cut finger and a scratched child's leg), 4 on SKU-100637 and 3 on
    SKU-100644 (one more pinching injury), plus a few on dress style STY-5520. Other defect types are background noise.
  checks:
    - tool: search_complaints_by_defect_type
      args: {defect_type: "zip strength", sku: "SKU-100651"}
      expect: ["SKU-100651", "critical", "total_safety_related", "sharp edge"]
    - tool: search_complaints_by_defect_type
      args: {defect_type: "zip", style_id: "STY-T-4410", safety_related: true}
      expect: ["SKU-100637", "SKU-100651", "true"]

- question: "06:59:Q4"
  story: >
    Product data errors on listings drive 129 contacts in 90 days: compatibility errors cost most (58 contacts, about
    £3,836, e.g. cookware not induction compatible), then dimensions (47) and materials (24). Cookware is the worst
    category, then Small Appliances (plug/voltage), Bedding (duvet dimensions), Lighting and Footwear.
  checks:
    - tool: search_customer_service_contacts_by_issue
      args: {group_by: "error_type"}
      expect: ["compatibility", "dimensions", "materials", "3835.72"]
    - tool: search_customer_service_contacts_by_issue
      args: {group_by: "category"}
      expect: ["Cookware", "Small Appliances", "Bedding"]
    - tool: search_customer_service_contacts_by_issue
      args: {issue_keyword: "induction", category: "Cookware"}
      expect: ["induction hob", "SKU-100805"]
