# One entry per question row that uses this system's tools (see: python -m mockmcp brief customer_service).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:16:Q5"
  story: >
    From mid-September to early October, WISMO (where-is-my-order) contacts for DC1 orders have increased.
    Issues are split between missed scans (CSC-900001, CSC-900004, CSC-900007, CSC-900011, CSC-900014),
    tracking gaps (CSC-900002, CSC-900008, CSC-900012), and delayed delivery (CSC-900003, CSC-900006, CSC-900009, CSC-900013).
    Tracking gap alert rule (NTF-000003) is already active. We enable the missed scan alert rule (NTF-000001)
    to reduce these contacts by an estimated 35%.
  checks:
    - tool: get_wismo_contact_trend
      args: {weeks_back: 4}
      expect: ["Missed scan", "Tracking gap", "Delayed"]
    - tool: get_wismo_contacts_by_reason
      args: {date_from: "-30d"}
      expect: ["Missed scan", "Tracking gap"]
    - tool: calculate_notification_impact_estimate
      args: {rule_type: "missed_scan_alert", date_from: "-30d"}
      expect: ["missed_scan_alert", "prevented"]
    - tool: update_notification_rule
      args: {rule_id: "NTF-000001", status: "active", estimated_contacts_prevented: 120}
      expect: ["inactive → active"]

- question: "04:40:Q3"
  story: >
    Glass product breakage increased significantly in late September and early October. Damage claims
    show multiple broken glass items: K-1700 kettles (CLM-900001, CLM-900002, CLM-900003, CLM-900008),
    drinking glass sets (CLM-900004, CLM-900010), wine glasses (CLM-900005), and vases (CLM-900009).
    This is up from baseline, representing a 40% increase. The pattern points to carrier handling or
    packaging vulnerability on glass items.
  checks:
    - tool: get_damage_claims_by_item
      args: {date_from: "-60d", damage_type: "glass"}
      expect: ["K-1700", "Broken glass", "Glass", "5"]
    - tool: get_damage_claims_by_item
      args: {date_from: "-60d"}
      expect: ["Broken glass", "claim_count"]

- question: "05:42:Q2"
  story: >
    A quality issue has emerged with Style 5520 zip strength. Six complaints came in from late September
    through early October (CMP-900001, CMP-900002, CMP-900003, CMP-900004, CMP-900005, CMP-900006),
    reporting zip failures ranging from breaking after a few wears, to teeth separating, to complete
    slider failure. This pattern appears across multiple production batches and suggests a manufacturing
    or material issue.
  checks:
    - tool: search_complaints_by_defect_type
      args: {defect_type: "zip strength", date_from: "-90d"}
      expect: ["STY-5520", "Zip strength", "CMP-900001", "high"]
    - tool: search_complaints_by_defect_type
      args: {defect_type: "zip", date_from: "-30d"}
      expect: ["Zip", "strength"]

- question: "06:59:Q4"
  story: >
    Product data errors are driving customer complaints and contacts. Issues include:
    (1) Style 5520 zip strength defects causing multiple complaints (CMP-900001-CMP-900006),
    (2) Glass product breakage with damage claims (CLM-900001-CLM-900005, CLM-900007-CLM-900010),
    (3) Various product quality complaints (CMP-900007 colour mismatch, CMP-900008 fit, CMP-900009 material).
    These errors cost us in claim payouts (over £350 GBP in damage claims), staff time, and customer
    reputation. Search shows contacts by issue keyword for analysis.
  checks:
    - tool: search_customer_service_contacts_by_issue
      args: {issue_keyword: "zip", reason: "complaint", date_from: "-90d"}
      expect: ["CSC-900021", "CSC-900022", "CSC-900023"]
    - tool: search_customer_service_contacts_by_issue
      args: {issue_keyword: "tracking", reason: "wismo", date_from: "-30d"}
      expect: ["wismo", "Missed scan"]
