# One entry per question row that uses this system's tools (see: python -m mockmcp brief yms).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.
- question: "01:6:Q2"
  story: >
    Two low-priority inbound POs for DC1 are booked next Tuesday: PO-2026-004674 (APT-900001)
    and PO-2026-005926 (APT-900002, SS26 carry-over). The manager pushes both back a week and cancels the bookings.
  checks:
    - tool: cancel_inbound_appointment
      args: {appointment_id: APT-900002, cancel_reason: PO pushed back a week}
      expect: ["booked → cancelled"]
    - tool: cancel_inbound_appointment
      args: {appointment_id: APT-900001, cancel_reason: PO pushed back a week}
      expect: ["APT-900001", "booked → cancelled"]
- question: "01:6:Q5"
  story: >
    From three weeks ago, Midshires Transport (CAR-002) trailers into DC1 have arrived 75-190 minutes late (10 arrivals,
    ARR-900100..109), which is part of why store service fell over the last three weeks.
  checks:
    - tool: list_late_inbound_trailers
      args: {site_id: DC1, min_minutes_late: 60}
      expect: ["Midshires Transport", "ARR-900103", "190"]
