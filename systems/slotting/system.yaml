id: slotting
name: Slotting & Layout Tool
instructions: >
  DC warehouse layout, zone slotting, product placement and crossing-point safety.
  Layout change ids look like LYT-000123. Use it for zone utilisation, travel distance,
  re-slotting impact analysis, and safety hotspots in aisles and crossing points.

tables:
  layout_zones:
    key: zone_id
    cols:
      zone_id: {type: str, desc: "Zone identifier, e.g. DC1-PICK-A"}
      site_id: {type: str, desc: DC}
      zone_name: {type: str, desc: "Zone name, e.g. Pick zone A"}
      zone_type: {type: enum, values: [pick, reserve, bulk, mezzanine, hazmat, returns], desc: Zone type}
      aisle_count: {type: int, desc: Number of aisles in the zone}
      aisles: {type: str, desc: "Comma-separated aisle numbers in the zone, e.g. 1,2,3,4"}
      total_locations: {type: int, desc: Total bin locations in zone}
      active_locations: {type: int, desc: Active locations currently used}
      avg_travel_distance_m: {type: float, desc: Average travel distance from dispatch to zone in metres}
      created_date: {type: date, desc: Zone configured date}

  layout_changes:
    key: layout_change_id
    cols:
      layout_change_id: {type: str, desc: "Layout change, e.g. LYT-000123"}
      site_id: {type: str, desc: DC}
      change_type: {type: enum, values: [aisle_relayout, zone_merge, zone_split, product_consolidation, automation_install], desc: Type of layout change}
      affected_zones: {type: str, desc: "Comma-separated zone ids affected, e.g. DC1-PICK-A,DC1-PICK-B"}
      affected_aisles: {type: str, desc: "Comma-separated aisle numbers affected, e.g. 5,6"}
      description: {type: str, desc: "Change description, e.g. Relocated clearance stock from reserve to bulk"}
      effective_date: {type: date, desc: "Date layout change went live"}
      planned_date: {type: date, desc: "Planned effective date"}
      estimated_moves: {type: int, desc: Estimated product moves required}
      actual_moves: {type: int, desc: Actual moves completed}
      completion_pct: {type: int, desc: Percentage completion}
      status: {type: enum, values: [planned, in_progress, completed, cancelled], desc: Change status}
      estimated_effort_hours: {type: float, desc: "Estimated labour hours"}
      actual_effort_hours: {type: float, desc: "Actual labour hours recorded"}
      notes: {type: str, desc: Execution notes}
      updated_at: {type: timestamp, desc: Last updated}

  zone_metrics:
    key: [site_id, zone_id, measured_date]
    cols:
      site_id: {type: str, desc: DC}
      zone_id: {type: str, desc: "Zone, e.g. DC1-PICK-A"}
      measured_date: {type: date, desc: Measurement date}
      utilisation_pct: {type: float, desc: "Space utilisation %, based on active/total locations"}
      avg_travel_distance_m: {type: float, desc: "Average metres from dispatch to zone"}
      picks_per_hour: {type: float, desc: "Picks per labour hour in zone"}
      sku_count: {type: int, desc: Number of different SKUs slotted in zone}
      total_on_hand: {type: int, desc: Total units on hand in zone}
      velocity_class: {type: enum, values: [A, B, C], desc: Zone velocity classification}
      congestion_score: {type: float, desc: "Congestion metric 0-100 based on picks and space"}

  crossing_points:
    key: crossing_id
    cols:
      crossing_id: {type: str, desc: "Crossing point id, e.g. XPT-DC1-001"}
      site_id: {type: str, desc: DC}
      location_description: {type: str, desc: "Where it is, e.g. Crossing point A1, aisle 3/4 junction"}
      aisle_a: {type: str, desc: "Aisle number on one side, e.g. 3"}
      aisle_b: {type: str, desc: "Aisle number on other side, e.g. 4"}
      zone_id: {type: str, desc: "Zone containing this crossing, e.g. DC1-PICK-A"}
      fk_pedestrian_crossing: {type: bool, desc: True if forklift and pedestrian cross here}
      incidents_q3: {type: int, desc: "Near misses or incidents in Q3"}
      incidents_q2: {type: int, desc: "Near misses or incidents in Q2"}
      traffic_score: {type: enum, values: [low, medium, high], desc: Forklift and pedestrian traffic level}
      has_proximity_sensor: {type: bool, desc: "Whether proximity sensor is installed"}
      has_speed_limiter: {type: bool, desc: "Whether speed limiter zone is active"}
      visibility_rating: {type: enum, values: [excellent, good, fair, poor], desc: Sight lines rating}

tools:
  - name: list_layout_changes
    desc: Layout and zone changes with effective dates, zones, aisles and status, newest first. Filter by site, zone, aisle or date range.
    kind: select
    from: layout_changes
    filters:
      site_id: {}
      change_type: {}
      status: {}
      affected_zones: {op: like, desc: "Zone id, e.g. DC1-PICK-B"}
      affected_aisles: {op: like, desc: "Aisle number, e.g. 7"}
      effective_from: {col: effective_date, op: ">=", type: date, default: "-90d", desc: "Effective on or after"}
      effective_to: {col: effective_date, op: "<=", type: date, desc: "Effective on or before"}
    columns: [layout_change_id, site_id, change_type, affected_zones, affected_aisles, description, effective_date, status, completion_pct, estimated_moves, actual_moves, notes]
    order: effective_date DESC
    limit: 30
    example: {site_id: DC1}

  - name: get_site_layout_summary
    desc: Per-zone layout for a site (aisles, locations, crossing points, forklift-pedestrian crossings, sensor and limiter coverage, Q3 incidents) with site size and totals.
    kind: sql
    args:
      site_id: {required: true}
    sql: |
      WITH cp AS (
        SELECT zone_id,
               count(*) AS crossing_points,
               count(*) FILTER (WHERE fk_pedestrian_crossing) AS fk_ped_crossings,
               count(*) FILTER (WHERE has_proximity_sensor) AS with_proximity_sensor,
               count(*) FILTER (WHERE has_speed_limiter) AS with_speed_limiter,
               sum(incidents_q3) AS incidents_q3,
               sum(incidents_q2) AS incidents_q2,
               string_agg(crossing_id || ' ' || location_description || ' (' || incidents_q3 || ' in Q3)', '; ' ORDER BY incidents_q3 DESC) AS crossings
        FROM crossing_points WHERE site_id = $site_id GROUP BY zone_id
      ), tot AS (
        SELECT sum(aisle_count) AS site_aisles, sum(total_locations) AS site_locations, count(*) AS site_zones
        FROM layout_zones WHERE site_id = $site_id
      ), tcp AS (
        SELECT count(*) AS site_crossing_points,
               count(*) FILTER (WHERE fk_pedestrian_crossing) AS site_fk_ped_crossings,
               count(*) FILTER (WHERE has_proximity_sensor) AS site_with_proximity_sensor,
               count(*) FILTER (WHERE has_speed_limiter) AS site_with_speed_limiter,
               sum(incidents_q3) AS site_incidents_q3, sum(incidents_q2) AS site_incidents_q2
        FROM crossing_points WHERE site_id = $site_id
      )
      SELECT z.site_id, s.name AS site_name, s.sqft AS site_sqft, z.zone_id, z.zone_name, z.zone_type,
             z.aisle_count, z.aisles, z.total_locations, z.active_locations,
             coalesce(cp.crossing_points, 0) AS crossing_points,
             coalesce(cp.fk_ped_crossings, 0) AS fk_ped_crossings,
             coalesce(cp.with_proximity_sensor, 0) AS with_proximity_sensor,
             coalesce(cp.with_speed_limiter, 0) AS with_speed_limiter,
             coalesce(cp.incidents_q3, 0) AS incidents_q3, coalesce(cp.incidents_q2, 0) AS incidents_q2,
             cp.crossings,
             tot.site_zones, tot.site_aisles, tot.site_locations,
             tcp.site_crossing_points, tcp.site_fk_ped_crossings, tcp.site_with_proximity_sensor,
             tcp.site_with_speed_limiter, tcp.site_incidents_q3, tcp.site_incidents_q2
      FROM layout_zones z
      JOIN master.sites s ON s.site_id = z.site_id
      LEFT JOIN cp ON cp.zone_id = z.zone_id
      CROSS JOIN tot CROSS JOIN tcp
      WHERE z.site_id = $site_id
      ORDER BY incidents_q3 DESC, z.zone_id
    limit: 20
    example: {site_id: DC1}

  - name: get_dc_layout_utilisation
    desc: Space utilisation, travel distance, picks per hour and congestion by zone for a site, against the all-DC average for the same zone type. For site layout structure use get_site_layout_summary.
    kind: sql
    args:
      site_id: {required: true}
      measured_from: {type: date, default: "-30d", desc: "Metrics measured on or after"}
    sql: |
      WITH net AS (
        SELECT z.zone_type,
               avg(m.utilisation_pct) AS util, avg(m.avg_travel_distance_m) AS travel,
               avg(m.picks_per_hour) AS pph, avg(m.congestion_score) AS cong
        FROM zone_metrics m JOIN layout_zones z ON z.zone_id = m.zone_id
        WHERE m.measured_date >= CAST($measured_from AS DATE)
        GROUP BY z.zone_type
      ), mine AS (
        SELECT m.zone_id,
               avg(m.utilisation_pct) AS util, avg(m.avg_travel_distance_m) AS travel,
               avg(m.picks_per_hour) AS pph, avg(m.congestion_score) AS cong,
               max(m.sku_count) AS sku_count, max(m.total_on_hand) AS total_units_on_hand,
               count(*) AS measurements
        FROM zone_metrics m
        WHERE m.site_id = $site_id AND m.measured_date >= CAST($measured_from AS DATE)
        GROUP BY m.zone_id
      )
      SELECT z.site_id, z.zone_id, z.zone_name, z.zone_type,
             round(mine.util, 1) AS avg_utilisation_pct, round(net.util, 1) AS network_utilisation_pct,
             round(mine.travel, 1) AS avg_travel_distance_m, round(net.travel, 1) AS network_travel_distance_m,
             round(mine.pph, 1) AS avg_picks_per_hour, round(net.pph, 1) AS network_picks_per_hour,
             round(mine.cong, 1) AS avg_congestion_score, round(net.cong, 1) AS network_congestion_score,
             mine.sku_count, mine.total_units_on_hand, mine.measurements
      FROM layout_zones z
      JOIN mine ON mine.zone_id = z.zone_id
      JOIN net ON net.zone_type = z.zone_type
      ORDER BY z.zone_type, z.zone_id
    limit: 20
    example: {site_id: DC1}

  - name: calculate_reslotting_effort
    desc: Estimate moves, labour hours and working days to re-slot a site, phased zone by zone from historic move rates. Use for how long re-slotting takes.
    kind: sql
    args:
      site_id: {required: true}
      zone_id: {desc: "Limit to one zone, e.g. DC1-PICK-A"}
      move_pct: {type: float, default: 30, desc: "Share of active locations to move, %"}
      crew_size: {type: int, default: 6, desc: "People working the re-slot each day"}
      hourly_rate_gbp: {type: float, default: 17, desc: "Loaded labour cost per hour, GBP"}
    sql: |
      WITH hist AS (
        SELECT coalesce(
                 (SELECT sum(actual_moves) / sum(actual_effort_hours) FROM layout_changes
                  WHERE site_id = $site_id AND status = 'completed' AND actual_effort_hours > 0),
                 (SELECT sum(actual_moves) / sum(actual_effort_hours) FROM layout_changes
                  WHERE status = 'completed' AND actual_effort_hours > 0)) AS moves_per_hour
      ), zs AS (
        SELECT z.*, z.active_locations * $move_pct / 100.0 AS moves, h.moves_per_hour
        FROM layout_zones z CROSS JOIN hist h
        WHERE z.site_id = $site_id AND ($zone_id IS NULL OR z.zone_id = $zone_id)
      ), ph AS (
        SELECT *, moves / moves_per_hour AS hours,
               row_number() OVER (ORDER BY CASE zone_type WHEN 'pick' THEN 1 WHEN 'reserve' THEN 2 WHEN 'bulk' THEN 3 ELSE 4 END, zone_id) AS phase
        FROM zs
      ), cal AS (
        SELECT *, hours / ($crew_size * 7.5) AS days,
               sum(hours / ($crew_size * 7.5)) OVER (ORDER BY phase) AS end_day_raw
        FROM ph
      )
      SELECT site_id, phase, zone_id, zone_name, zone_type, active_locations,
             $move_pct AS move_pct, round(moves) AS estimated_moves,
             round(moves_per_hour, 1) AS historic_moves_per_labour_hour,
             round(hours, 1) AS labour_hours, round(days, 1) AS working_days,
             round(end_day_raw - days, 1) AS start_day, round(end_day_raw, 1) AS end_day,
             round(hours * $hourly_rate_gbp) AS labour_cost_gbp,
             round(sum(moves) OVER ()) AS total_moves_all_phases,
             round(sum(hours) OVER (), 1) AS total_hours_all_phases,
             round(sum(days) OVER (), 1) AS total_days_all_phases,
             round(sum(hours) OVER () * $hourly_rate_gbp) AS total_cost_gbp,
             'moves = active_locations * move_pct; hours = moves / historic moves per labour hour; days = hours / (crew_size * 7.5)' AS formula
      FROM cal
      ORDER BY phase
    limit: 20
    example: {site_id: DC1}
