id: slotting
name: Slotting & Layout Tool
instructions: >
  DC warehouse layout, zone slotting, product placement and crossing-point safety.
  Layout change ids look like LYT-000123. Use it for zone utilisation, travel distance,
  re-slotting impact analysis, and safety hotspots in aisles and crossing points.

tables:
  layout_zones:
    key: zone_id
    cols:
      zone_id: {type: str, desc: "Zone identifier, e.g. DC1-PICK-A"}
      site_id: {type: str, desc: DC}
      zone_name: {type: str, desc: "Zone name, e.g. Pick zone A"}
      zone_type: {type: enum, values: [pick, reserve, bulk, mezzanine, hazmat, returns], desc: Zone type}
      aisle_count: {type: int, desc: Number of aisles in the zone}
      aisle_letters: {type: str, desc: "Comma-separated aisle letters, e.g. A,B,C,D"}
      total_locations: {type: int, desc: Total bin locations in zone}
      active_locations: {type: int, desc: Active locations currently used}
      avg_travel_distance_m: {type: float, desc: Average travel distance from dispatch to zone in metres}
      created_date: {type: date, desc: Zone configured date}

  layout_changes:
    key: layout_change_id
    cols:
      layout_change_id: {type: str, desc: "Layout change, e.g. LYT-000123"}
      site_id: {type: str, desc: DC}
      change_type: {type: enum, values: [aisle_relayout, zone_merge, zone_split, product_consolidation, automation_install], desc: Type of layout change}
      affected_zones: {type: str, desc: "Comma-separated zone ids affected, e.g. DC1-PICK-A,DC1-PICK-B"}
      affected_aisles: {type: str, desc: "Comma-separated aisles affected, e.g. A,B,C"}
      description: {type: str, desc: "Change description, e.g. Relocated clearance stock from reserve to bulk"}
      effective_date: {type: date, desc: "Date layout change went live"}
      planned_date: {type: date, desc: "Planned effective date"}
      estimated_moves: {type: int, desc: Estimated product moves required}
      actual_moves: {type: int, desc: Actual moves completed}
      completion_pct: {type: int, desc: Percentage completion}
      status: {type: enum, values: [planned, in_progress, completed, cancelled], desc: Change status}
      estimated_effort_hours: {type: float, desc: "Estimated labour hours"}
      actual_effort_hours: {type: float, desc: "Actual labour hours recorded"}
      notes: {type: str, desc: Execution notes}
      updated_at: {type: timestamp, desc: Last updated}

  zone_metrics:
    key: [site_id, zone_id, measured_date]
    cols:
      site_id: {type: str, desc: DC}
      zone_id: {type: str, desc: "Zone, e.g. DC1-PICK-A"}
      measured_date: {type: date, desc: Measurement date}
      utilisation_pct: {type: float, desc: "Space utilisation %, based on active/total locations"}
      avg_travel_distance_m: {type: float, desc: "Average metres from dispatch to zone"}
      picks_per_hour: {type: float, desc: "Picks per labour hour in zone"}
      sku_count: {type: int, desc: Number of different SKUs slotted in zone}
      total_on_hand: {type: int, desc: Total units on hand in zone}
      velocity_class: {type: enum, values: [A, B, C], desc: Zone velocity classification}
      congestion_score: {type: float, desc: "Congestion metric 0-100 based on picks and space"}

  crossing_points:
    key: crossing_id
    cols:
      crossing_id: {type: str, desc: "Crossing point identifier, e.g. XPT-DC1-001"}
      site_id: {type: str, desc: DC}
      location_description: {type: str, desc: "Where it is, e.g. Aisle C/D intersection"}
      aisle_a: {type: str, desc: "Aisle letter on one side, e.g. C"}
      aisle_b: {type: str, desc: "Aisle letter on other side, e.g. D"}
      zone_id: {type: str, desc: "Zone containing this crossing, e.g. DC1-PICK-A"}
      fk_pedestrian_crossing: {type: bool, desc: True if forklift and pedestrian cross here}
      incidents_q3: {type: int, desc: "Near misses or incidents in Q3"}
      incidents_q2: {type: int, desc: "Near misses or incidents in Q2"}
      traffic_score: {type: float, desc: "Estimated daily traffic count, high/medium/low"}
      has_proximity_sensor: {type: bool, desc: "Whether proximity sensor is installed"}
      has_speed_limiter: {type: bool, desc: "Whether speed limiter zone is active"}
      visibility_rating: {type: enum, values: [excellent, good, fair, poor], desc: Sight lines rating}

tools:
  - name: list_layout_changes
    desc: Layout and zone changes with effective dates. Filter by site, zone or date range.
    kind: select
    from: layout_changes
    filters:
      site_id: {}
      change_type: {}
      affected_zones: {op: like, desc: "Zone id or aisle, e.g. DC1-PICK-A or aisle C"}
      status: {default: completed}
      effective_from: {col: effective_date, op: ">=", type: date, default: "-90d", desc: "Effective on or after"}
    columns: [layout_change_id, site_id, change_type, affected_zones, affected_aisles, description, effective_date, estimated_moves, actual_moves]
    order: effective_date
    limit: 30
    example: {site_id: DC1}

  - name: get_site_layout_summary
    desc: Site layout with zones, aisles, crossing-point locations. Shows layout structure and safety hotspots.
    kind: sql
    args:
      site_id: {required: true, desc: "DC, e.g. DC1"}
    sql: |
      SELECT z.site_id, z.zone_id, z.zone_name, z.zone_type, z.aisle_count, z.aisle_letters,
             z.total_locations, z.active_locations, z.avg_travel_distance_m,
             count(DISTINCT cp.crossing_id) AS crossing_point_count,
             sum(CASE WHEN cp.fk_pedestrian_crossing THEN 1 ELSE 0 END) AS fk_ped_crossings,
             sum(cp.incidents_q3) AS total_incidents_q3
      FROM layout_zones z
      LEFT JOIN crossing_points cp ON cp.zone_id = z.zone_id AND cp.site_id = z.site_id
      WHERE z.site_id = $site_id
      GROUP BY z.zone_id, z.site_id, z.zone_name, z.zone_type, z.aisle_count, z.aisle_letters,
               z.total_locations, z.active_locations, z.avg_travel_distance_m
      ORDER BY z.zone_type, z.zone_id
    limit: 20
    example: {site_id: DC1}

  - name: get_dc_layout_utilisation
    desc: Space utilisation and travel distance by zone for a site. Shows efficiency and congestion.
    kind: sql
    args:
      site_id: {required: true, desc: "DC, e.g. DC1"}
      measured_from: {col: measured_date, op: ">=", type: date, default: "-30d", desc: "Metrics on or after"}
    sql: |
      SELECT z.site_id, z.zone_id, z.zone_name, z.zone_type,
             round(avg(m.utilisation_pct), 1) AS avg_utilisation_pct,
             round(avg(m.avg_travel_distance_m), 1) AS avg_travel_distance_m,
             round(avg(m.picks_per_hour), 1) AS avg_picks_per_hour,
             round(avg(m.congestion_score), 1) AS avg_congestion_score,
             max(m.sku_count) AS sku_count,
             max(m.total_on_hand) AS total_units_on_hand
      FROM layout_zones z
      LEFT JOIN zone_metrics m ON m.zone_id = z.zone_id AND m.site_id = z.site_id
      WHERE z.site_id = $site_id
        AND ($measured_from IS NULL OR m.measured_date >= CAST($measured_from AS DATE))
      GROUP BY z.zone_id, z.site_id, z.zone_name, z.zone_type
      ORDER BY z.zone_type, avg_utilisation_pct DESC
    limit: 20
    example: {site_id: DC1}

  - name: calculate_reslotting_effort
    desc: Estimate moves and labour for re-slotting, phased by zone. Helps plan layout change impact.
    kind: sql
    args:
      site_id: {required: true, desc: "DC, e.g. DC1"}
      phase_days: {type: int, desc: "Replan across N-day phases (default 7)", default: 7}
    sql: |
      SELECT z.site_id, z.zone_id, z.zone_name,
             z.total_locations,
             round(z.total_locations * 0.35, 0) AS estimated_moves,
             round(z.avg_travel_distance_m * z.aisle_count * 1.5, 0) AS total_distance_metres,
             round((z.total_locations * 0.35) / (z.aisle_count * 8), 1) AS estimated_effort_hours,
             round((z.total_locations * 0.35) / (z.aisle_count * 8) / $phase_days, 1) AS hours_per_day_phased,
             round((z.total_locations * 0.35) * 12, 0) AS estimated_cost_gbp,
             'effort = (moves * distance) / (aisles * 8) / phase_days' AS formula
      FROM layout_zones z
      WHERE z.site_id = $site_id
      ORDER BY estimated_effort_hours DESC
    limit: 20
    example: {site_id: DC1}
