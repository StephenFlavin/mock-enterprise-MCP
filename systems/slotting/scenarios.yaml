# One entry per question row that uses this system's tools
- question: "01:4:Q2"
  story: >
    On 31 August, DC1 relocated clearance stock and rearranged pick zones (LYT-000001, LYT-000002, LYT-000003)
    affecting aisles A, E, H. This coincided with increased inventory adjustments in those zones
    in late August and September. The layout_changes table shows these changes completed on schedule.
  checks:
    - tool: list_layout_changes
      args: {site_id: DC1, change_type: product_consolidation}
      expect: ["LYT-000001", "LYT-000002", "Relocated clearance"]
    - tool: list_layout_changes
      args: {site_id: DC1, effective_from: "-30d"}
      expect: ["completed", "DC1"]

- question: "01:8:Q2"
  story: >
    WMS analyst needs to know re-slotting effort for DC1 after a stock consolidation.
    calculate_reslotting_effort shows estimated moves of 700-900 units per zone across
    the four pick and reserve zones, with 40-75 labour hours per zone.
  checks:
    - tool: calculate_reslotting_effort
      args: {site_id: DC1, phase_days: 7}
      expect: ["DC1", "estimated_moves", "hours_per_day_phased"]
    - tool: calculate_reslotting_effort
      args: {site_id: DC1}
      expect: ["DC1-P-B", "DC1-P-C", "DC1-R-D"]

- question: "01:9:Q3"
  story: >
    Q3 near-miss incidents in DC1 increased significantly. get_site_layout_summary shows
    three pick zone crossing points (XPT-DC1-001, XPT-DC1-002) with 4-6 Q3 incidents each,
    concentrated after the 31 August layout change. Pick zones have 2-3 crossing points each
    with fk_pedestrian_crossings enabled.
  checks:
    - tool: list_layout_changes
      args: {site_id: DC1, effective_from: "-60d"}
      expect: ["LYT-000001", "LYT-000002", "LYT-000003", "31 August"]
    - tool: get_site_layout_summary
      args: {site_id: DC1}
      expect: ["DC1", "crossing_point_count", "fk_ped_crossings", "incidents_q3"]

- question: "01:9:Q4"
  story: >
    Health & safety officer compares safety control options across DCs. get_site_layout_summary
    for DC1 shows crossing points with current visibility ratings and sensor/limiter status.
    Most DC1 crossing points have good visibility but no proximity sensors (only 1-2 installed),
    while DC2/DC3 have minimal sensors. Suggests phased rollout starting at high-traffic zones.
  checks:
    - tool: get_site_layout_summary
      args: {site_id: DC1}
      expect: ["DC1", "zone_count", "crossing", "visibility"]
    - tool: get_site_layout_summary
      args: {site_id: DC2}
      expect: ["DC2", "crossing_point_count"]

- question: "09:87:Q5"
  story: >
    Chief supply chain officer investigates why DC1 cost per unit is 18% above network average.
    get_dc_layout_utilisation shows DC1 zones averaging 88-92% utilisation (higher than typical),
    pick zones with 50-65 picks/hour, and congestion scores 65-75 (high). This explains higher
    labour costs and travel distance overhead.
  checks:
    - tool: get_dc_layout_utilisation
      args: {site_id: DC1, measured_from: "-30d"}
      expect: ["DC1", "utilisation_pct", "avg_travel_distance_m", "congestion"]
    - tool: get_dc_layout_utilisation
      args: {site_id: DC1}
      expect: ["88", "89", "90", "91", "92"]

- question: "09:88:Q2"
  story: >
    Operations director checks productivity at Daventry (DC2) vs other DCs.
    get_dc_layout_utilisation shows DC2 pick zones at 65-72% utilisation (lower than DC1/DC3),
    40-50 picks/hour (vs 55-65 at peers), and 85-110m average travel distance (10% higher).
    Layout efficiency is a contributor to productivity gap.
  checks:
    - tool: get_dc_layout_utilisation
      args: {site_id: DC2}
      expect: ["DC2", "utilisation_pct", "picks_per_hour", "travel_distance"]
    - tool: get_dc_layout_utilisation
      args: {site_id: DC2, measured_from: "-30d"}
      expect: ["DC2", "avg_utilisation", "travel_distance_m"]
