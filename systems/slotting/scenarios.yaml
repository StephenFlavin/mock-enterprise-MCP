# One entry per question row that uses this system's tools
- question: "01:4:Q2"
  story: >
    DC1 made four layout changes in Q3: aisle 7 became a one-way forklift lane (LYT-000004, about 11 weeks ago), then on 31 Aug
    clearance stock was consolidated into pick zones A and B and the reserve zone relaid (LYT-000001, LYT-000002, LYT-000003).
    A further aisle 7 relay (LYT-000005) is in progress. Other DCs only have minor tidy-ups.
  checks:
    - tool: list_layout_changes
      args: {site_id: DC1, effective_from: "-100d"}
      expect: ["LYT-000001", "LYT-000002", "LYT-000003", "LYT-000004", "DC1-PICK-A", "Relocated clearance stock"]
    - tool: list_layout_changes
      args: {site_id: DC1, change_type: product_consolidation, effective_from: "-100d"}
      expect: ["LYT-000001", "LYT-000002"]

- question: "01:8:Q2"
  story: >
    Re-slotting 30% of DC1 active locations is about 2,429 moves at the site's historic 11.3 moves per labour hour: 214.5 hours,
    4.8 working days for a crew of six, phased pick A, pick B, reserve, bulk, hazmat.
  checks:
    - tool: calculate_reslotting_effort
      args: {site_id: DC1, move_pct: 30, crew_size: 6}
      expect: ["DC1-PICK-A", "DC1-RESERVE-A", "2429", "214.5", "4.8"]
    - tool: calculate_reslotting_effort
      args: {site_id: DC1, zone_id: DC1-PICK-A}
      expect: ["DC1-PICK-A", "641", "56.6"]

- question: "01:9:Q3"
  story: >
    Q3 DC1 layout changes: aisle 7 one-way lane (LYT-000004, July), 31 Aug consolidation of pick zones A and B (aisles 3, 5, 6),
    and aisle 7 closed for a relay (LYT-000005, in progress). Crossing-point hotspots: aisle 7 (5), B2 (4), A1 (3), aisle 3 (2).
  checks:
    - tool: list_layout_changes
      args: {site_id: DC1, affected_aisles: "7"}
      expect: ["LYT-000004", "LYT-000005", "in_progress", "Aisle 7 being relaid"]
    - tool: get_site_layout_summary
      args: {site_id: DC1}
      expect: ["XPT-DC1-003", "XPT-DC1-002", "XPT-DC1-001", "5 in Q3"]

- question: "01:9:Q4"
  story: >
    DC1 (850,000 sq ft) has 5 zones, 14 aisles, 7 crossing points of which 5 are forklift-pedestrian crossings; only 2 (bulk and
    hazmat) have proximity sensors, none has a speed limiter, and the Q3 hotspots have no controls. DC2 has no sensors.
  checks:
    - tool: get_site_layout_summary
      args: {site_id: DC1}
      expect: ["850000", "site_crossing_points", "7", "14", "Crossing point B2"]
    - tool: get_site_layout_summary
      args: {site_id: DC2}
      expect: ["DC2", "DC2-PICK-A"]

- question: "09:87:Q5"
  story: >
    DC1 pick zones run at 88.8% and 89.8% utilisation against a 79% network average, with longer travel in pick zone B (54.3 m
    against 42.4 m) and congestion of 70-73 against 59.4: layout is a real cost contributor.
  checks:
    - tool: get_dc_layout_utilisation
      args: {site_id: DC1}
      expect: ["DC1-PICK-A", "DC1-PICK-B", "88.8", "89.8", "54.3", "network_utilisation_pct"]

- question: "09:88:Q2"
  story: >
    Daventry layout is not the cause of low productivity: pick zone utilisation is 67.9% (network 79%), travel 42.0 m (network
    42.4 m), picks per hour 55.7 against 59.0 and congestion 48.2, so only a minor layout effect.
  checks:
    - tool: get_dc_layout_utilisation
      args: {site_id: DC2}
      expect: ["DC2-PICK-A", "67.9", "55.7", "42"]
