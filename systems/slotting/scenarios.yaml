# One entry per question row that uses this system's tools
- question: "01:4:Q2"
  story: >
    About five weeks ago, DC1 relocated clearance stock and rearranged pick zones (LYT-000001, LYT-000002, LYT-000003)
    affecting aisles A, E, H. This coincided with increased inventory adjustments in those zones.
    The layout_changes table shows these product consolidation changes.
  checks:
    - tool: list_layout_changes
      args: {site_id: DC1, change_type: product_consolidation}
      expect: ["LYT-000001", "LYT-000002", "Relocated clearance"]
    - tool: list_layout_changes
      args: {site_id: DC1, effective_from: "-60d"}
      expect: ["DC1-PICK-A", "product_consolidation"]

- question: "01:8:Q2"
  story: >
    WMS analyst needs to know re-slotting effort for DC1 after a stock consolidation.
    calculate_reslotting_effort shows estimated moves of 700-900 units per zone across
    the four pick and reserve zones, with 40-75 labour hours per zone.
  checks:
    - tool: calculate_reslotting_effort
      args: {site_id: DC1, phase_days: 7}
      expect: ["DC1", "estimated_moves", "hours_per_day_phased"]
    - tool: calculate_reslotting_effort
      args: {site_id: DC1}
      expect: ["DC1-PICK-A", "DC1-PICK-B", "DC1-RESERVE-A"]

- question: "01:9:Q3"
  story: >
    Q3 near-miss incidents in DC1 increased significantly. get_site_layout_summary shows
    pick zone crossing points with Q3 incidents,
    concentrated after the layout change about five weeks ago. Pick zones have crossing points with pedestrian activity.
  checks:
    - tool: list_layout_changes
      args: {site_id: DC1, effective_from: "-60d"}
      expect: ["LYT-000001", "LYT-000002", "LYT-000003"]
    - tool: get_site_layout_summary
      args: {site_id: DC1}
      expect: ["DC1", "zone_count", "fk_ped_crossings", "incidents_q3"]

- question: "01:9:Q4"
  story: >
    Health & safety officer compares safety control options across DCs. get_site_layout_summary
    for DC1 shows crossing points with current visibility ratings and sensor/limiter status.
    Most DC1 crossing points have good visibility but limited proximity sensors,
    while DC2/DC3 have fewer sensors. Suggests phased rollout starting at high-traffic zones.
  checks:
    - tool: get_site_layout_summary
      args: {site_id: DC1}
      expect: ["DC1", "zone_count", "visibility"]
    - tool: get_site_layout_summary
      args: {site_id: DC2}
      expect: ["DC2", "zone_count"]

- question: "09:87:Q5"
  story: >
    Chief supply chain officer investigates why DC1 cost per unit is 18% above network average.
    get_dc_layout_utilisation shows DC1 zones averaging 85-91% utilisation (higher than typical),
    pick zones with 55-65 picks/hour, and congestion scores 50-65 (high). This explains higher
    labour costs and travel distance overhead.
  checks:
    - tool: get_dc_layout_utilisation
      args: {site_id: DC1, measured_from: "-30d"}
      expect: ["DC1", "avg_utilisation_pct", "avg_travel_distance_m", "avg_congestion"]
    - tool: get_dc_layout_utilisation
      args: {site_id: DC1}
      expect: ["DC1-PICK-A", "DC1-PICK-B", "88", "90"]

- question: "09:88:Q2"
  story: >
    Operations director checks productivity at Daventry (DC2) vs other DCs.
    get_dc_layout_utilisation shows DC2 pick zones at 65-70% utilisation (lower than DC1/DC3),
    45-60 picks/hour (vs 55-65 at peers), and 42-44m average travel distance.
    Layout efficiency is a contributor to productivity gap.
  checks:
    - tool: get_dc_layout_utilisation
      args: {site_id: DC2}
      expect: ["DC2", "avg_utilisation_pct", "avg_picks_per_hour", "avg_travel_distance_m"]
    - tool: get_dc_layout_utilisation
      args: {site_id: DC2, measured_from: "-30d"}
      expect: ["DC2-PICK-F", "DC2-PICK-A", "66", "68", "67"]
