# One entry per question row that uses this system's tools (see: python -m mockmcp brief board).
- question: "07:70:Q1"
  story: >
    The CFO is evaluating £50m capital allocation across 6 strategic options: new DC (INIT-900001), automation (INIT-900006),
    store refits (INIT-900003), e-commerce hub (INIT-900008), nearshoring (INIT-900002), and US market entry (INIT-900005).
    Strategic assumptions (ASSUM-900001 through ASSUM-900010) show key value drivers like revenue growth (5%), automation ROI (15%),
    and 15% recession risk. The capital options range from £8m to £50m investment with payback periods of 1.6 to 4.2 years.
    A board paper is created (AGENDA-900001) for the next board meeting.
  checks:
    - tool: get_strategic_plan_assumptions
      args: {}
      expect: ["General CPI inflation rate", "3.5", "Automation ROI", "confidence_level"]
    - tool: get_strategic_plan_assumptions
      args: {assumption_category: revenue}
      expect: ["Total revenue growth", "revenue", "E-commerce channel growth", "base_value"]
    - tool: create_board_agenda_item
      args: {board_meeting_date: "+21d", paper_title: "Capital Allocation Strategy £50m", paper_summary: "Six strategic options with risk-adjusted returns and sensitivity to 10% revenue miss.", paper_type: capital_allocation}
      expect: ["AGENDA-", "board_meeting_date", "Capital Allocation"]

- question: "09:87:Q2"
  story: >
    The Chief Supply Chain Officer is planning £80m supply chain investments over three years. Strategic initiatives include
    Northampton automation (INIT-900001, £35m, 2.1y payback), Nearshoring (INIT-900002, £28m, high risk, 1.8y payback),
    Network consolidation (INIT-900004, £12m, medium risk), and Dual sourcing (INIT-900007, £8m, low risk). Total available budget
    is £80m. Approved initiatives total £66m; the nearshoring proposal (£28m, high risk) must be sequenced after
    approval. If budget drops to £50m, lower-ROI items like network consolidation or dual sourcing would be deferred.
  checks:
    - tool: list_strategic_initiatives
      args: {status: approved}
      expect: ["Northampton", "approved", "Store Refit", "Digital"]
    - tool: list_strategic_initiatives
      args: {status: proposed}
      expect: ["Nearshoring", "US Market", "Fulfillment"]
    - tool: list_strategic_initiatives
      args: {category: sourcing}
      expect: ["Dual Sourcing", "Nearshoring", "28000000"]
    - tool: list_strategic_initiatives
      args: {}
      expect: ["Network Consolidation", "18000000", "45000000"]

- question: "09:87:Q4"
  story: >
    The Chief Supply Chain Officer wants to benchmark our strategic direction against leading retailers.
    Our core priorities (PRI-900001 through PRI-900005) show focus on supply chain resilience (£80m),
    automation (£60m), market expansion (£45m), digital transformation (£25m), and sustainability (£35m).
    This demonstrates positioning on capacity, cost, and competitive advantage that aligns with
    retail industry trends in the 2026 environment.
  checks:
    - tool: get_company_strategic_priorities
      args: {}
      expect: ["Supply Chain Resilience", "Automation", "Market Expansion", "Digital"]
    - tool: get_company_strategic_priorities
      args: {status: active}
      expect: ["80000000", "Resilience", "Efficiency", "FY27-FY29"]
