# One entry per question row that uses this system's tools (see: python -m mockmcp brief board).
- question: "07:70:Q1"
  story: >
    The CFO weighs £50m across new DC (INIT-900009), automation (INIT-900001), store refits (INIT-900003), e-commerce
    (INIT-900008), nearshoring (INIT-900002) and new markets (INIT-900005). The plan assumptions to challenge are the
    low-confidence, high-sensitivity ones: recession probability (ASSUM-900010), new market contribution (ASSUM-900003)
    and freight inflation (ASSUM-900006). The board paper is added with create_board_agenda_item.
  checks:
    - tool: get_strategic_plan_assumptions
      args: {confidence_level: low}
      expect: ["Recession probability", "New market contribution year 1", "Freight rate inflation"]
    - tool: get_strategic_plan_assumptions
      args: {assumption_category: revenue}
      expect: ["Total revenue growth baseline", "E-commerce channel growth", "ASSUM-900003"]
    - tool: create_board_agenda_item
      args: {board_meeting_date: "+21d", paper_title: "Capital Allocation Strategy £50m", paper_summary: "Six strategic options with risk-adjusted returns and sensitivity to a 10% revenue miss.", paper_type: capital_allocation}
      expect: ["AGENDA-000001", "Capital Allocation Strategy", "pending"]

- question: "09:87:Q2"
  story: >
    Supply chain initiatives total £99m against an £80m envelope: DC1 automation INIT-900001 (£35m, 2.1y), nearshoring
    INIT-900002 (£28m, high risk, 1.8y), network consolidation INIT-900004 (£12m), dual sourcing INIT-900007 (£8m) and
    digital analytics INIT-900006 (£16m). INIT-900006 is the biggest dependency (automation, nearshoring and e-commerce
    all need it); nearshoring also needs dual sourcing.
  checks:
    - tool: list_strategic_initiatives
      args: {}
      expect: ["INIT-900001", "INIT-900002", "INIT-900004", "INIT-900006", "INIT-900007", "35000000", "28000000"]
    - tool: list_strategic_initiatives
      args: {category: sourcing}
      expect: ["Dual Sourcing", "Nearshoring", "INIT-900006 Digital Analytics Platform"]
    - tool: list_strategic_initiatives
      args: {status: approved}
      expect: ["Northampton", "Store Refit", "Digital Analytics"]

- question: "09:87:Q4"
  story: >
    Our own strategic priorities PRI-900001..900005: supply chain resilience (£80m, dual sourcing and nearshoring),
    automation and efficiency (£60m), market expansion (£45m), sustainability (£35m) and digital transformation (£25m),
    to compare with what leading retailers do.
  checks:
    - tool: get_company_strategic_priorities
      args: {}
      expect: ["Supply Chain Resilience", "Automation and Efficiency", "Digital Transformation", "80000000"]
    - tool: get_company_strategic_priorities
      args: {category: efficiency}
      expect: ["PRI-900003", "60000000"]
