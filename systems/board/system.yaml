id: board
name: Strategy & Board Reporting Tool
instructions: >
  Strategic priorities, board-level targets, planned initiatives and board agenda management.
  Agenda items are added by id (e.g. AGENDA-000123); initiatives are tracked with owners and status.
  Use it for capital investment review, strategic roadmaps and board papers.

tables:
  strategic_priorities:
    key: priority_id
    cols:
      priority_id: {type: str, desc: "Strategic priority, e.g. PRI-000001"}
      name: {type: str, desc: Priority name}
      description: {type: str, desc: Description of the priority}
      category: {type: enum, values: [growth, efficiency, risk_mitigation, transformation, market_expansion], desc: Priority category}
      target_outcome: {type: str, desc: Desired outcome}
      financial_target_gbp: {type: float, desc: "Financial target in GBP, if applicable"}
      timeframe: {type: str, desc: "Timeframe e.g. FY27, 3-year plan"}
      status: {type: enum, values: [active, under_review, paused, completed], desc: Current status}
      updated_at: {type: timestamp, desc: Last updated}

  strategic_initiatives:
    key: initiative_id
    cols:
      initiative_id: {type: str, desc: "Initiative id, e.g. INIT-000001"}
      name: {type: str, desc: Initiative name}
      description: {type: str, desc: Initiative description}
      category: {type: enum, values: [infrastructure, automation, network_redesign, digital, sourcing, retail_experience, supply_chain, market_entry], desc: Initiative category}
      owner_id: {type: str, desc: Responsible person (employee id)}
      status: {type: enum, values: [proposed, approved, in_progress, completed, deferred], desc: Initiative status}
      expected_return_gbp: {type: float, desc: "Expected financial return in GBP"}
      required_investment_gbp: {type: float, desc: "Required investment in GBP"}
      risk_level: {type: enum, values: [low, medium, high], desc: Risk assessment}
      timeline_months: {type: int, desc: Estimated timeline in months}
      dependencies: {type: text, desc: "Key dependencies (comma-separated initiative ids or external factors)"}
      payback_period_years: {type: float, desc: "Payback period in years"}
      updated_at: {type: timestamp, desc: Last updated}

  strategic_plan_assumptions:
    key: assumption_id
    cols:
      assumption_id: {type: str, desc: "Assumption id, e.g. ASSUM-000001"}
      assumption_category: {type: enum, values: [revenue, cost, inflation, market, economic, regulatory, technology], desc: Assumption category}
      description: {type: str, desc: Description of the assumption}
      base_value: {type: float, desc: "Base assumption value (%, amount, rate)"}
      value_unit: {type: str, desc: "Unit of the value (%, GBP, months, etc)"}
      confidence_level: {type: enum, values: [high, medium, low], desc: "Confidence in the assumption"}
      sensitivity_to_change_pct: {type: float, desc: "% change in outcome per 1% change in this assumption"}
      rationale: {type: text, desc: Justification for the assumption}
      updated_at: {type: timestamp, desc: Last updated}

  board_agenda_items:
    key: agenda_item_id
    cols:
      agenda_item_id: {type: str, desc: "Agenda item id, e.g. AGENDA-000001"}
      board_meeting_date: {type: date, desc: Board meeting date}
      paper_title: {type: str, desc: Title of the board paper}
      paper_summary: {type: str, desc: Summary of paper content}
      paper_type: {type: enum, values: [capital_allocation, strategic_review, risk_review, financial, operational, governance], desc: Type of paper}
      status: {type: enum, values: [pending, scheduled, presented, deferred], desc: Status on agenda}
      added_at: {type: timestamp, desc: When added to agenda}

tools:
  - name: get_company_strategic_priorities
    desc: Strategic priorities and board-level targets. Use to understand company direction and compare external benchmarks.
    kind: select
    from: strategic_priorities
    filters:
      category: {}
      status: {default: active}
    columns: [priority_id, name, description, category, target_outcome, financial_target_gbp, timeframe, status]
    order: priority_id
    limit: 20
    example: {}

  - name: get_strategic_plan_assumptions
    desc: "Strategic plan assumptions underlying capital decisions: revenue, cost, inflation, market. Shows sensitivity to change."
    kind: select
    from: strategic_plan_assumptions
    filters:
      assumption_category: {}
      confidence_level: {}
    columns: [assumption_id, assumption_category, description, base_value, value_unit, confidence_level, sensitivity_to_change_pct, rationale]
    order: assumption_category
    limit: 50
    example: {}

  - name: list_strategic_initiatives
    desc: "Approved and proposed strategic initiatives with owners, expected return, investment, risk and dependencies."
    kind: sql
    args:
      status: {type: enum, values: [proposed, approved, in_progress, completed, deferred], desc: "Filter by status (default all approved/proposed)"}
      category: {type: enum, values: [infrastructure, automation, network_redesign, digital, sourcing, retail_experience, supply_chain, market_entry]}
      owner_id: {type: str, desc: "Employee id (filter by owner, if any)"}
    sql: |
      SELECT initiative_id, name, description, category, owner_id, status, expected_return_gbp,
             required_investment_gbp, risk_level, timeline_months, dependencies, payback_period_years, updated_at
      FROM strategic_initiatives
      WHERE ($status IS NULL OR status = $status)
        AND ($category IS NULL OR category = $category)
        AND ($owner_id IS NULL OR owner_id = $owner_id)
      ORDER BY status DESC, expected_return_gbp DESC, required_investment_gbp ASC
    limit: 50
    example: {}

  - name: create_board_agenda_item
    desc: Adds a paper to the board meeting agenda. Returns the new agenda item.
    kind: insert
    table: board_agenda_items
    id_prefix: AGENDA-
    args:
      board_meeting_date: {type: date, required: true, desc: "Board meeting date"}
      paper_title: {required: true, desc: "Title of the board paper"}
      paper_summary: {required: true, desc: "Summary of the paper"}
      paper_type: {required: true, desc: "Type: capital_allocation, strategic_review, risk_review, financial, operational, governance"}
    example: {board_meeting_date: "+21d", paper_title: "FY27 Capital Allocation Strategy", paper_summary: "Recommendation on £50m allocation across five strategic options with risk-adjusted returns.", paper_type: capital_allocation}
