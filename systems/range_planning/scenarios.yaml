# One entry per question row that uses this system's tools (see: python -m mockmcp brief range_planning).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "06:54:Q2"
  story: >
    A product manager is reviewing the range plan for autumn/winter. They've identified 5 products
    to action: K-1700 (core kettle) for extending the line (PRP-900001), PF-220 portable fan (experimental,
    PRP-900002) and SKU-101904 (growth dress, PRP-900003) for refresh, and SKU-103157 (clearance, PRP-900004)
    for deletion. They check the strategic roles and calculate impact, then approve and update the first plan
    to extend K-1700 (approved by EMP-00010).
  checks:
    - tool: get_product_strategic_role
      args: {sku: K-1700}
      expect: ["K-1700", "core"]
    - tool: get_product_strategic_role
      args: {sku: PF-220}
      expect: ["PF-220", "experimental"]
    - tool: calculate_range_action_impact
      args: {sku: "K-1700", action: "extend", current_price_gbp: 77.99}
      expect: ["extend", "15%", "margin"]
    - tool: update_product_range_status
      args: {plan_id: "PRP-900001", status: "approved", approved_by: "EMP-00010"}
      expect: ["draft", "approved"]

- question: "06:54:Q3"
  story: >
    A product manager searches for whitespace in small kitchen appliances. The system identifies
    RGP-900001 (Small Kitchen Appliances gap of £285k opportunity with 7 competitors and only 12 SKUs
    in our range). The manager sees this is the biggest gap in kitchenware.
  checks:
    - tool: list_range_gaps_by_category
      args: {category: "Small Kitchen"}
      expect: ["RGP-900001", "Small Kitchen Appliances", "285000", "7", "12"]
    - tool: list_range_gaps_by_category
      args: {}
      expect: ["opportunity_size_gbp"]

- question: "06:56:Q4"
  story: >
    An analyst evaluates trends and needs to calculate minimum test order volumes. For small kitchen
    appliances with a 45-day lead time and 8-week test period, they calculate the minimum viable
    volume is 100 units/week * 8 weeks / 8 = 100 total units (medium risk formula).
  checks:
    - tool: calculate_minimum_test_order_volume
      args: {category: "Small Kitchen Appliances", lead_time_days: 45, test_duration_weeks: 8}
      expect: ["100", "lead time", "medium risk"]
    - tool: calculate_minimum_test_order_volume
      args: {category: "Heating", lead_time_days: 25}
      expect: ["lead time <= 30", "50 units"]

- question: "06:56:Q7"
  story: >
    An analyst identifies that smart home heating is under-supplied and creates a range gap request
    (RQR-900002 was created by EMP-00456 on 2026-09-10). The system shows it's been approved and
    investigated. Later, another gap request for sustainable kitchenware (RQR-900003) was created and
    investigated by EMP-00789.
  checks:
    - tool: create_range_gap_request
      args: {category: "Smart Textiles", reason: "High social media mentions; 5 competitors; seasonal trend", created_by: "EMP-00123"}
      expect: ["submitted"]
    - tool: list_range_gaps_by_category
      args: {category: "Heating"}
      expect: ["Smart Home Heating"]

- question: "07:63:Q7"
  story: >
    A supply chain finance analyst flags two small SKUs that cost more to serve than they earn.
    PF-220 (portable fan, £2.15 cost to serve vs £1.80 revenue, losing £0.35/unit, RVW-900001) and
    SKU-100098 (£4.50 cost to serve vs £3.20 revenue, losing £1.30/unit, RVW-900002) are both open
    review tasks owned by EMP-00013. A third task (RVW-900003) for SKU-100637 was completed with
    a refresh recommendation.
  checks:
    - tool: create_sku_review_task
      args: {sku: "K-1700", reason: "High cost to serve relative to revenue; review for repricing or delisting", owner: "EMP-00013"}
      expect: ["open"]
    - tool: list_range_gaps_by_category
      args: {}
      expect: ["gap_id", "opportunity"]
