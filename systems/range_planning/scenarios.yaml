# One entry per question row that uses this system's tools (see: python -m mockmcp brief range_planning).

- question: "06:54:Q2"
  story: >
    Range plan entries are drafted for K-1700 (core kettle, extend), PF-220 (experimental fan, refresh), SKU-101904 (growth
    dress, reprice) and two clearance-status tops proposed for deletion: SKU-103640 (strategic role clearance, deleting loses
    about £45.5k margin a year) and SKU-101876 (strategic role core, so excluded from deletion once the user asks; deleting
    would lose about £49.6k). The PM checks roles and impact, then approves K-1700 and SKU-103640.
  checks:
    - tool: get_product_strategic_role
      args: {sku: SKU-101876}
      expect: ["SKU-101876", "core"]
    - tool: get_product_strategic_role
      args: {sku: SKU-103640}
      expect: ["SKU-103640", "clearance"]
    - tool: calculate_range_action_impact
      args: {sku: SKU-103640, action: delete}
      expect: ["delete", "-45518", "SKU-103640"]
    - tool: update_product_range_status
      args: {sku: SKU-103640, status: approved, approved_by: EMP-00010}
      expect: ["draft", "approved", "EMP-00010"]

- question: "06:54:Q3"
  story: >
    Small Appliances (small kitchen appliances) has eight UK segments in range_gaps. Multi cookers (RGP-900001, £4.2m
    opportunity, 19% growth) and countertop ovens (RGP-900002, £2.4m) are high-feasibility with no SKU of ours; soup makers
    (RGP-900003, 41% margin, only Argos) is the best margin. Air fryers are the biggest market but crowded (11 competitors, low).
  checks:
    - tool: list_range_gaps_by_category
      args: {category: small kitchen appliances}
      expect: ["Multi cookers and pressure cookers", "4200000", "Soup makers", "Argos", "Air fryers"]
    - tool: list_range_gaps_by_category
      args: {category: small kitchen appliances, fill_feasibility: high}
      expect: ["RGP-900001", "RGP-900002", "RGP-900003"]

- question: "06:56:Q4"
  story: >
    The home trend (Lighting is the fastest growing UK home category) needs a test order. Lighting has 20 active SKUs selling
    about 66 units a week each; with a 50-day lead time and an 8-week test the minimum test order is 320 units costing about £9.8k.
  checks:
    - tool: calculate_minimum_test_order_volume
      args: {category: Lighting, lead_time_days: 50, test_duration_weeks: 8}
      expect: ["Lighting", "320", "9789", "lead_time_buffer_pct: 20"]
    - tool: calculate_minimum_test_order_volume
      args: {category: Bedding}
      expect: ["Bedding", "minimum_test_units"]

- question: "06:56:Q7"
  story: >
    Audio is under-supplied relative to interest (search +38%, social +44%; gap RGP-900101 with 21 SKUs). The analyst raises a
    range gap request for Audio, which is stored as submitted and then appears alongside the seeded requests.
  checks:
    - tool: list_range_gaps_by_category
      args: {category: audio}
      expect: ["RGP-900101", "Audio", "1200000"]
    - tool: create_range_gap_request
      args: {category: Audio, reason: "Search interest up 38% and social mentions up 44% but a thin range", created_by: EMP-00010}
      expect: ["RQR-", "Audio", "submitted", "EMP-00010"]

- question: "07:63:Q7"
  story: >
    Small SKUs losing money after cost to serve (cost_allocation: SKU-105775 -£3.89 a unit, SKU-104830 -£2.96). The finance analyst
    flags them for range review with owner EMP-00013; an earlier task RVW-900001 already exists for SKU-100077.
  checks:
    - tool: create_sku_review_task
      args: {sku: SKU-105775, reason: "Loses £3.89 per unit after cost to serve", owner: EMP-00013, recommendation: reprice}
      expect: ["RVW-", "SKU-105775", "open", "EMP-00013", "reprice"]
    - tool: create_sku_review_task
      args: {sku: SKU-104830, reason: "Loses £2.96 per unit after cost to serve", owner: EMP-00013}
      expect: ["SKU-104830", "open"]
