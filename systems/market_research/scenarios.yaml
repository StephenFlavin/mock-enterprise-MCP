- question: "05:49:Q4"
  story: "We need to understand why customers aren't using the resale programme. Survey data shows awareness issues, effort barriers, and price concerns. Seed includes SR-900001 to SR-900005 with low ratings for resale topic."
  checks:
    - tool: search_survey_responses_by_topic
      args: {topic: resale}
      expect: ["SR-900001", "resale programme", "2"]

- question: "06:52:Q6"
  story: "Product designers want to know what 25-34 year olds want from outdoor clothing and how UK differs from Germany. Seed includes survey responses SR-900006 to SR-900009 split by region with age_group 25-34."
  checks:
    - tool: search_survey_results_by_segment
      args: {topic: "outdoor clothing", respondent_age_group: "25-34"}
      expect: ["25-34", "response_count", "avg_rating"]
    - tool: compare_survey_results_by_market
      args: {topic: "outdoor clothing", region_1: UK, region_2: Germany}
      expect: ["UK", "Germany", "rating"]

- question: "06:53:Q2"
  story: "Technical designers need typical body measurements for women in Germany, France and UK, and how they compare to our size chart. Seed includes AM-900001-900018 with female measurements, and SC-900001 onwards with our size charts."
  checks:
    - tool: search_anthropometric_survey_data
      args: {country: GB, gender: female}
      expect: ["GB", "female", "chest_cm"]
    - tool: compare_size_chart_to_body_measurements
      args: {category: womenswear, country: GB}
      expect: ["chest_diff", "waist_diff", "hip_diff"]

- question: "06:54:Q3"
  story: "Product manager seeks whitespace in small kitchen appliances. Market data shows market size and growth by category. Seed includes MKT-900007 and MKT-900010 for kitchen appliances in Spain and Japan with different margins."
  checks:
    - tool: search_market_size_by_category
      args: {category: "kitchen"}
      expect: ["market_size_gbp", "growth_pct_yoy"]

- question: "06:56:Q6"
  story: "Trend analyst compares consumer priorities under cost pressures across age groups and regions. Seed includes SR-900010 to SR-900014 with consumer priorities topic split by age and region."
  checks:
    - tool: search_survey_results_by_segment
      args: {topic: consumer}
      expect: ["respondent_region", "response_count"]
    - tool: compare_survey_results_by_market
      args: {topic: consumer, region_1: UK, region_2: Spain}
      expect: ["rating_difference"]

- question: "08:71:Q4"
  story: "Store manager checks what might affect trade next month. Seed includes local events and road works near a store (ST214) in October and November."
  checks:
    - tool: search_local_events_near_store
      args: {site_id: ST214}
      expect: ["ST214", "festival", "event_date"]
    - tool: search_road_works_near_store
      args: {site_id: ST214}
      expect: ["ST214", "start_date", "significant congestion"]

- question: "08:73:Q1"
  story: "Area manager needs local competitor activity for Store 214. Seed includes LC-900001 to LC-900004 showing various competitors and activities near ST214."
  checks:
    - tool: get_local_competitor_activity_for_store
      args: {site_id: ST214}
      expect: ["ST214", "competitor_name", "distance_m"]

- question: "08:80:Q1"
  story: "International manager plans market entry to Poland and Czechia. Needs consumer preferences and retail margins. Seed includes MKT-900001 to MKT-900004 with Poland and Czechia data showing margins around 32-35%."
  checks:
    - tool: get_consumer_preferences_and_price_points
      args: {country: Poland, category: home}
      expect: ["Poland", "consumer_preference_notes"]
    - tool: get_typical_retail_margins_for_market
      args: {country: Czechia, category: outdoor}
      expect: ["Czechia", "typical_retail_margin_pct"]

- question: "08:80:Q3"
  story: "Manager decides what to sell in Japan by checking market size, pack formats and local competition. Seed includes MKT-900008-900010 for Japan with pack format information."
  checks:
    - tool: get_market_size_and_pack_formats_for_country
      args: {country: Japan}
      expect: ["Japan", "typical_pack_formats"]
    - tool: search_local_competitors_in_market
      args: {site_id: ST001}
      expect: ["competitor_name", "distance_m"]

- question: "08:80:Q4"
  story: "Manager evaluates Spain expansion investment. Needs market size, growth and comparable launch results. Seed includes MKT-900005-900006 for Spain with growth 9-11%, and LNC-900001-900003 with comparable launches."
  checks:
    - tool: get_market_size_and_growth_for_country
      args: {country: Spain}
      expect: ["Spain", "growth_pct_yoy", "market_size_gbp"]
    - tool: get_comparable_market_launch_results
      args: {country: Spain}
      expect: ["Spain", "total_units_sold", "total_revenue_gbp"]
