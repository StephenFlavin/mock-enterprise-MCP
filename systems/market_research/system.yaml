id: market_research
name: Market Research Platform
instructions: >
  Market research data: consumer surveys, market sizing, competitor intelligence, and local events.
  Use it for consumer preferences, market opportunities, anthropometric data, and local impact analysis.

tables:
  survey_responses:
    key: response_id
    cols:
      response_id: {type: str, desc: "Survey response id, e.g. SR-000123"}
      topic: {type: str, desc: "Survey topic, e.g. resale programme, outdoor clothing preferences"}
      respondent_age_group: {type: str, desc: "Age group, e.g. 25-34"}
      respondent_region: {type: str, desc: "Region, e.g. UK, Germany, France, Spain"}
      respondent_gender: {type: str, desc: "Gender, e.g. male, female"}
      response_rating: {type: int, desc: "Rating 1-5"}
      response_text: {type: str, desc: "Narrative response"}
      response_date: {type: date, desc: "Response date"}

  anthropometric_measurements:
    key: measurement_id
    cols:
      measurement_id: {type: str, desc: "Measurement id, e.g. AM-000123"}
      country: {type: str, desc: "Country code, e.g. GB, DE, FR"}
      gender: {type: str, desc: "Gender, e.g. female, male"}
      age_group: {type: str, desc: "Age group, e.g. 20-30"}
      sample_size: {type: int, desc: "Number of respondents"}
      chest_cm: {type: float, desc: "Average chest measurement"}
      waist_cm: {type: float, desc: "Average waist measurement"}
      hip_cm: {type: float, desc: "Average hip measurement"}
      height_cm: {type: float, desc: "Average height"}
      survey_date: {type: date, desc: "Survey date"}

  product_size_charts:
    key: size_chart_id
    cols:
      size_chart_id: {type: str, desc: "Size chart id, e.g. SC-000123"}
      category: {type: str, desc: "Product category, e.g. womenswear, menswear"}
      size_label: {type: str, desc: "Size, e.g. XS, S, M, L, XL"}
      chest_cm: {type: float, desc: "Chest measurement"}
      waist_cm: {type: float, desc: "Waist measurement"}
      hip_cm: {type: float, desc: "Hip measurement"}
      length_cm: {type: float, desc: "Length measurement"}

  market_data:
    key: market_id
    cols:
      market_id: {type: str, desc: "Market id, e.g. MKT-000123"}
      country: {type: str, desc: "Country, e.g. Poland, Spain, Japan"}
      category: {type: str, desc: "Product category, e.g. home, outdoor clothing, small kitchen appliances"}
      market_size_gbp: {type: float, desc: "Annual market size in GBP"}
      growth_pct_yoy: {type: float, desc: "Year-on-year growth percentage"}
      typical_pack_formats: {type: str, desc: "Common pack formats, semicolon-separated"}
      typical_retail_margin_pct: {type: float, desc: "Typical retail margin percentage"}
      consumer_preference_notes: {type: str, desc: "Key consumer preferences"}
      currency: {type: str, desc: "Local currency if different from GBP"}
      data_date: {type: date, desc: "Date of data"}

  local_competitors:
    key: competitor_id
    cols:
      competitor_id: {type: str, desc: "Competitor id, e.g. LC-000123"}
      site_id: {type: str, desc: "Store location"}
      competitor_name: {type: str, desc: "Competitor name"}
      category_focus: {type: str, desc: "Category focus, e.g. premium, discount, online"}
      distance_m: {type: int, desc: "Distance in metres"}
      last_observed_activity: {type: str, desc: "Recent activity, e.g. price reduction, new opening"}
      last_observed_date: {type: date, desc: "Date of observation"}

  local_events:
    key: event_id
    cols:
      event_id: {type: str, desc: "Event id, e.g. EV-000123"}
      site_id: {type: str, desc: "Store location"}
      event_type: {type: str, desc: "Event type, e.g. festival, market, sports event"}
      event_date: {type: date, desc: "Event date"}
      expected_visitor_impact: {type: str, desc: "Expected impact on store, e.g. high footfall increase"}

  road_works:
    key: roadwork_id
    cols:
      roadwork_id: {type: str, desc: "Roadwork id, e.g. RW-000123"}
      site_id: {type: str, desc: "Store location"}
      start_date: {type: date, desc: "Start date"}
      end_date: {type: date, desc: "End date"}
      location_description: {type: str, desc: "Where, e.g. main access road, nearby junction"}
      expected_impact: {type: str, desc: "Expected impact description"}

  market_launches:
    key: launch_id
    cols:
      launch_id: {type: str, desc: "Launch id, e.g. LNC-000123"}
      country: {type: str, desc: "Country launched"}
      category: {type: str, desc: "Product category"}
      launch_date: {type: date, desc: "Launch date"}
      total_units_sold: {type: int, desc: "Units sold in first year"}
      total_revenue_gbp: {type: float, desc: "Revenue in GBP"}
      breakeven_weeks: {type: int, desc: "Weeks to break even"}

tools:
  - name: search_survey_responses_by_topic
    desc: "Survey responses on a topic. Filter by topic, age group or region."
    kind: select
    from: survey_responses
    filters:
      topic: {op: like}
      respondent_age_group: {op: like}
      respondent_region: {}
    order: response_date DESC
    limit: 50
    example: {topic: resale}

  - name: search_survey_results_by_segment
    desc: "Segment analysis: survey responses aggregated by age group and region. Shows counts and rating trends."
    kind: sql
    args:
      topic: {required: true}
      respondent_age_group: {}
      respondent_region: {}
    sql: |
      SELECT respondent_age_group, respondent_region, count(*) AS response_count,
             round(avg(response_rating), 1) AS avg_rating
      FROM survey_responses
      WHERE topic ILIKE '%' || $topic || '%'
        AND ($respondent_age_group IS NULL OR respondent_age_group = $respondent_age_group)
        AND ($respondent_region IS NULL OR respondent_region = $respondent_region)
      GROUP BY respondent_age_group, respondent_region
      ORDER BY response_count DESC
    limit: 20
    example: {topic: "outdoor clothing"}

  - name: compare_survey_results_by_market
    desc: "Compare survey responses between two regions for the same topic. Shows preference differences."
    kind: sql
    args:
      topic: {required: true}
      region_1: {type: str, required: true, desc: "First region to compare"}
      region_2: {type: str, required: true, desc: "Second region to compare"}
    sql: |
      SELECT
        r1.respondent_age_group, r1.respondent_region AS region_1, r1.avg_rating AS rating_region_1,
        r2.respondent_region AS region_2, r2.avg_rating AS rating_region_2,
        round(r2.avg_rating - r1.avg_rating, 1) AS rating_difference
      FROM (
        SELECT respondent_age_group, respondent_region, avg(response_rating) AS avg_rating
        FROM survey_responses
        WHERE topic ILIKE '%' || $topic || '%' AND respondent_region = $region_1
        GROUP BY respondent_age_group, respondent_region
      ) r1
      FULL OUTER JOIN (
        SELECT respondent_age_group, respondent_region, avg(response_rating) AS avg_rating
        FROM survey_responses
        WHERE topic ILIKE '%' || $topic || '%' AND respondent_region = $region_2
        GROUP BY respondent_age_group, respondent_region
      ) r2 ON r1.respondent_age_group = r2.respondent_age_group
      ORDER BY r1.respondent_age_group, rating_difference DESC
    limit: 20
    example: {topic: "outdoor clothing", region_1: UK, region_2: Germany}

  - name: search_anthropometric_survey_data
    desc: "Body measurements by country, gender and age group from anthropometric surveys. For size chart comparison."
    kind: select
    from: anthropometric_measurements
    filters:
      country: {}
      gender: {}
      age_group: {}
    order: survey_date DESC
    limit: 50
    example: {country: GB, gender: female}

  - name: compare_size_chart_to_body_measurements
    desc: "Compare our size charts to actual consumer body measurements. Shows fit gaps."
    kind: sql
    args:
      category: {required: true, desc: "Product category, e.g. womenswear"}
      country: {required: true, desc: "Country code, e.g. GB"}
    sql: |
      SELECT
        sc.size_label, am.age_group, am.gender,
        am.chest_cm AS actual_chest, sc.chest_cm AS chart_chest,
        round(sc.chest_cm - am.chest_cm, 1) AS chest_diff,
        am.waist_cm AS actual_waist, sc.waist_cm AS chart_waist,
        round(sc.waist_cm - am.waist_cm, 1) AS waist_diff,
        am.hip_cm AS actual_hip, sc.hip_cm AS chart_hip,
        round(sc.hip_cm - am.hip_cm, 1) AS hip_diff
      FROM product_size_charts sc
      CROSS JOIN anthropometric_measurements am
      WHERE sc.category ILIKE '%' || $category || '%'
        AND am.country = $country
      ORDER BY sc.size_label, am.gender, am.age_group
    limit: 50
    example: {category: womenswear, country: GB}

  - name: search_market_size_by_category
    desc: "Market size and growth by category and country. Shows opportunities and typical margins."
    kind: select
    from: market_data
    filters:
      category: {op: like}
      country: {}
    order: market_size_gbp DESC
    limit: 50
    example: {category: "kitchen"}

  - name: get_market_size_and_growth_for_country
    desc: "Market size, growth and key metrics for all categories in one country."
    kind: select
    from: market_data
    filters:
      country: {}
    order: market_size_gbp DESC
    limit: 20
    example: {country: Spain}

  - name: get_market_size_and_pack_formats_for_country
    desc: "Market size and typical pack formats for a country and category."
    kind: sql
    args:
      country: {required: true}
      category: {}
    sql: |
      SELECT country, category, market_size_gbp, growth_pct_yoy, typical_pack_formats
      FROM market_data
      WHERE country = $country
        AND ($category IS NULL OR category ILIKE '%' || $category || '%')
      ORDER BY market_size_gbp DESC
    limit: 20
    example: {country: Japan}

  - name: get_typical_retail_margins_for_market
    desc: "Typical retail margins for a market (country and category)."
    kind: sql
    args:
      country: {required: true}
      category: {required: true}
    sql: |
      SELECT country, category, typical_retail_margin_pct, market_size_gbp, growth_pct_yoy
      FROM market_data
      WHERE country = $country AND category ILIKE '%' || $category || '%'
      LIMIT 10
    example: {country: Poland, category: home}

  - name: get_consumer_preferences_and_price_points
    desc: "Consumer preferences and typical retail margins for a market (country and category)."
    kind: sql
    args:
      country: {required: true}
      category: {required: true}
    sql: |
      SELECT country, category, consumer_preference_notes, typical_retail_margin_pct, market_size_gbp
      FROM market_data
      WHERE country = $country AND category ILIKE '%' || $category || '%'
      LIMIT 10
    example: {country: Poland, category: home}

  - name: get_comparable_market_launch_results
    desc: "Comparable market launch results: units, revenue and payback for similar categories and countries."
    kind: select
    from: market_launches
    filters:
      country: {}
      category: {op: like}
    order: launch_date DESC
    limit: 50
    example: {country: Spain}

  - name: search_local_competitors_in_market
    desc: "Competitors active in a region or near a specific store, with recent activity."
    kind: select
    from: local_competitors
    filters:
      site_id: {}
      category_focus: {op: like}
    order: last_observed_date DESC
    limit: 30
    example: {site_id: ST214}

  - name: get_local_competitor_activity_for_store
    desc: "Local competitor activity summary for a store: names, categories, distance and recent moves."
    kind: select
    from: local_competitors
    filters:
      site_id: {}
    order: distance_m ASC
    limit: 20
    example: {site_id: ST214}

  - name: search_local_events_near_store
    desc: "Local events near a store: festivals, markets, sports events that could affect footfall."
    kind: select
    from: local_events
    filters:
      site_id: {}
      event_type: {op: like}
    order: event_date ASC
    limit: 30
    example: {site_id: ST214}

  - name: search_road_works_near_store
    desc: "Roadworks near a store that could affect access, with duration and impact."
    kind: select
    from: road_works
    filters:
      site_id: {}
    order: start_date ASC
    limit: 20
    example: {site_id: ST214}
