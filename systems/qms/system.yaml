id: qms
name: Quality Management System (QMS)
instructions: >
  Quality inspections, incidents and supplier corrective actions for inbound products from factories.
  Incident ids look like INC-000123, lot ids like LOT-000123, CAR ids like CAR-000123.
  Use it for factory quality scorecards, defect trends, inspection measurements vs tolerance, and supplier quality holds and corrective actions.

tables:
  production_lots:
    key: lot_id
    cols:
      lot_id: {type: str, desc: "Production lot, e.g. LOT-000123"}
      sku: {type: str, desc: "SKU"}
      factory_id: {type: str, desc: "Factory that produced the lot"}
      po_id: {type: str, desc: "Purchase order"}
      qty_produced: {type: int, desc: "Units produced"}
      produced_at: {type: date, desc: "Production date"}
      status: {type: enum, values: [produced, in_inspection, released, reworked, rejected], desc: "Lot status"}
      lot_disposition: {type: enum, values: [pending, released, rework, reject], desc: "QA disposition"}
      created_at: {type: timestamp, desc: "When lot was created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  quality_inspections:
    key: inspection_id
    cols:
      inspection_id: {type: str, desc: "Inspection record, e.g. INS-000123"}
      lot_id: {type: str, desc: "Production lot being inspected"}
      factory_id: {type: str, desc: "Factory"}
      inspection_type: {type: enum, values: [inline, final, pre_production, sample], desc: "Inspection type"}
      units_inspected: {type: int, desc: "Units in sample"}
      defects_found: {type: int, desc: "Number of defects"}
      pass_fail: {type: enum, values: [pass, fail, conditional], desc: "Pass/fail result"}
      scheduled_at: {type: timestamp, desc: "Scheduled inspection time (if booking)"}
      inspected_at: {type: timestamp, desc: "When inspection was performed"}
      created_at: {type: timestamp, desc: "When record created"}

  inspection_measurements:
    key: measurement_id
    cols:
      measurement_id: {type: str, desc: "Measurement record"}
      inspection_id: {type: str, desc: "Inspection"}
      lot_id: {type: str, desc: "Production lot"}
      measurement_type: {type: str, desc: "E.g. chest_width, inseam, colour_value"}
      actual_value: {type: float, desc: "Measured value"}
      spec_value: {type: float, desc: "Target specification value"}
      tolerance_lower: {type: float, desc: "Lower tolerance bound"}
      tolerance_upper: {type: float, desc: "Upper tolerance bound"}
      unit: {type: str, desc: "Measurement unit, e.g. mm, points"}
      pass: {type: bool, desc: "Within tolerance"}
      created_at: {type: timestamp, desc: "When measured"}

  quality_incidents:
    key: incident_id
    cols:
      incident_id: {type: str, desc: "Quality incident, e.g. INC-000123"}
      sku: {type: str, desc: "SKU affected (if specific)"}
      factory_id: {type: str, desc: "Factory (if source-specific)"}
      lot_id: {type: str, desc: "Production lot (if specific)"}
      issue_description: {type: text, desc: "What went wrong"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Severity level"}
      status: {type: enum, values: [open, investigating, resolved, closed], desc: "Investigation status"}
      created_at: {type: timestamp, desc: "When incident was raised"}
      updated_at: {type: timestamp, desc: "Last updated"}

  quality_holds:
    key: hold_id
    cols:
      hold_id: {type: str, desc: "Quality hold, e.g. HLD-000123"}
      sku: {type: str, desc: "SKU on hold"}
      lot_id: {type: str, desc: "Lot on hold (if specific)"}
      hold_reason: {type: text, desc: "Why hold was placed"}
      status: {type: enum, values: [active, released, expired], desc: "Hold status"}
      related_incident_id: {type: str, desc: "Related incident if any"}
      created_at: {type: timestamp, desc: "When hold placed"}
      released_at: {type: timestamp, desc: "When hold lifted"}
      updated_at: {type: timestamp, desc: "Last updated"}

  quality_investigations:
    key: investigation_id
    cols:
      investigation_id: {type: str, desc: "Investigation, e.g. INV-000123"}
      related_incident_id: {type: str, desc: "Related incident"}
      scope: {type: text, desc: "What is being investigated"}
      status: {type: enum, values: [open, in_progress, on_hold, closed], desc: "Investigation status"}
      findings: {type: text, desc: "Root cause and findings"}
      created_at: {type: timestamp, desc: "When investigation started"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_corrective_actions:
    key: car_id
    cols:
      car_id: {type: str, desc: "Corrective action request, e.g. CAR-000123"}
      supplier_id: {type: str, desc: "Supplier"}
      factory_id: {type: str, desc: "Factory if specific"}
      issue_description: {type: text, desc: "The quality issue"}
      requested_action: {type: text, desc: "What supplier should do"}
      status: {type: enum, values: [draft, sent, acknowledged, in_progress, closed], desc: "CAR status"}
      created_at: {type: timestamp, desc: "When created"}
      sent_at: {type: timestamp, desc: "When sent to supplier"}
      updated_at: {type: timestamp, desc: "Last updated"}

  factory_quality_scorecards:
    key: scorecard_id
    cols:
      scorecard_id: {type: str, desc: "Scorecard"}
      factory_id: {type: str, desc: "Factory"}
      period: {type: date, desc: "Reporting period (week start)"}
      total_units_inspected: {type: int, desc: "Total units inspected in period"}
      defects_found: {type: int, desc: "Total defects"}
      defect_rate_pct: {type: float, desc: "Defect rate percentage"}
      pass_rate_pct: {type: float, desc: "Pass rate percentage"}
      critical_defects: {type: int, desc: "Number of critical issues"}
      on_time_delivery_pct: {type: float, desc: "On-time delivery %"}
      risk_score: {type: float, desc: "Composite risk score 0-100"}
      created_at: {type: timestamp, desc: "When created"}

  pack_damage_tracking:
    key: damage_id
    cols:
      damage_id: {type: str, desc: "Damage record"}
      sku: {type: str, desc: "SKU"}
      pack_type: {type: str, desc: "Packaging type, e.g. polybag, carton, rigid_box"}
      period: {type: date, desc: "Reporting period (week start)"}
      units_shipped: {type: int, desc: "Units shipped in this pack type"}
      units_damaged: {type: int, desc: "Units damaged on arrival"}
      damage_rate_pct: {type: float, desc: "Damage percentage"}
      damage_type: {type: str, desc: "E.g. crushed, water_damaged, leaking"}
      created_at: {type: timestamp, desc: "When recorded"}

  quality_reviews:
    key: review_id
    cols:
      review_id: {type: str, desc: "QA review, e.g. REV-000123"}
      style_id: {type: str, desc: "Style under review"}
      review_type: {type: str, desc: "E.g. fit, durability, appearance"}
      status: {type: enum, values: [open, in_progress, closed], desc: "Review status"}
      findings: {type: text, desc: "Review findings"}
      created_at: {type: timestamp, desc: "When opened"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: calculate_factory_quality_risk_score
    desc: Composite quality risk score per factory. Combines defect rate, critical issues and trend data.
    kind: sql
    args:
      factory_id: {required: true}
      period_weeks: {type: int, default: 12, desc: "Number of weeks to analyse"}
    sql: |
      WITH recent AS (
        SELECT factory_id, defect_rate_pct, critical_defects, pass_rate_pct, risk_score
        FROM factory_quality_scorecards
        WHERE factory_id = $factory_id
          AND period >= CAST($as_of AS DATE) - INTERVAL (CAST($period_weeks AS INT) * 7) DAY
        ORDER BY period DESC
      )
      SELECT $factory_id AS factory_id,
             ROUND(AVG(defect_rate_pct), 1) AS avg_defect_rate_pct,
             COUNT(*) AS weeks_data,
             MAX(defect_rate_pct) AS peak_defect_rate_pct,
             ROUND(AVG(critical_defects), 1) AS avg_critical_per_week,
             ROUND(MAX(risk_score), 0) AS current_risk_score,
             'score = max(defect_rate_pct, critical_defects_weighted)' AS formula
      FROM recent
    example: {factory_id: FAC-0001}

  - name: calculate_measurement_deviation_vs_tolerance
    desc: Calculate deviation of actual measurement from spec vs tolerance. Shows if within spec and by how much.
    kind: sql
    args:
      lot_id: {required: true}
      measurement_type: {required: true, desc: "E.g. chest_width, inseam"}
    sql: |
      SELECT m.measurement_id, m.measurement_type, m.actual_value, m.spec_value,
             m.tolerance_lower, m.tolerance_upper,
             ROUND(m.actual_value - m.spec_value, 2) AS deviation_from_spec,
             ROUND(((m.actual_value - m.spec_value) / (m.tolerance_upper - m.tolerance_lower)) * 100, 1) AS pct_of_tolerance,
             m.pass AS within_tolerance,
             m.unit,
             'deviation = actual - spec; pct_tolerance = deviation / tolerance_band * 100' AS formula
      FROM inspection_measurements m
      WHERE m.lot_id = $lot_id AND m.measurement_type = $measurement_type
      ORDER BY m.created_at DESC
    example: {lot_id: LOT-900001, measurement_type: chest_width}

  - name: calculate_recommended_tolerance
    desc: Calculate recommended tolerance based on factory process capability and shrinkage/stretch behaviour.
    kind: py
    fn: calculate_recommended_tolerance
    args:
      factory_id: {required: true}
      material: {required: true, desc: "Material type, e.g. cotton, polyester"}
      measurement_type: {required: true, desc: "E.g. length, width"}
    example: {factory_id: FAC-0107, material: cotton, measurement_type: length}

  - name: create_inspection_booking
    desc: Book an additional inspection at a factory.
    kind: insert
    table: quality_inspections
    id_prefix: INS-
    defaults: {inspection_type: inline, pass_fail: pending}
    args:
      lot_id: {required: true}
      factory_id: {required: true}
      units_inspected: {type: int, required: true}
      scheduled_at: {type: timestamp, required: true, desc: "When to inspect (e.g. +5d at 09:00)"}
    example: {lot_id: LOT-900001, factory_id: FAC-0001, units_inspected: 50, scheduled_at: "+5d"}

  - name: create_quality_hold_for_sku
    desc: Place a quality hold on a SKU or batch pending investigation.
    kind: insert
    table: quality_holds
    id_prefix: HLD-
    defaults: {status: active}
    args:
      sku: {required: true}
      hold_reason: {required: true, desc: "Why the hold is placed"}
      lot_id: {}
      related_incident_id: {}
    example: {sku: K-1700, hold_reason: "Defect pattern detected; investigating root cause"}

  - name: create_quality_incident
    desc: Open a quality incident record for a defect or issue.
    kind: insert
    table: quality_incidents
    id_prefix: INC-
    defaults: {status: open, severity: medium}
    args:
      sku: {}
      factory_id: {}
      lot_id: {}
      issue_description: {required: true}
    example: {sku: PF-220, factory_id: FAC-0107, issue_description: "Sole separation failures in returns"}

  - name: create_quality_investigation
    desc: Open a quality investigation on items or a supplier.
    kind: insert
    table: quality_investigations
    id_prefix: INV-
    defaults: {status: open}
    args:
      related_incident_id: {}
      scope: {required: true, desc: "What is being investigated"}
    example: {scope: "Glass item breakage claims up 40% — packaging vs carrier vs handling"}

  - name: create_quality_review_request
    desc: Create a QA review request for named styles.
    kind: insert
    table: quality_reviews
    id_prefix: REV-
    defaults: {status: open}
    args:
      style_id: {required: true}
      review_type: {required: true, desc: "E.g. fit, durability, appearance, top_returns"}
    example: {style_id: STY-5520, review_type: fit}

  - name: create_supplier_corrective_action_request
    desc: Create a corrective action request record against a supplier.
    kind: insert
    table: supplier_corrective_actions
    id_prefix: CAR-
    defaults: {status: draft}
    args:
      supplier_id: {required: true}
      factory_id: {}
      issue_description: {required: true}
      requested_action: {required: true}
    example: {supplier_id: SUP-0042, issue_description: "Colourfastness test failures in polyester blouses", requested_action: "Audit dye house process and supplier controls"}

  - name: draft_root_cause_report
    desc: Draft a root cause report for a quality failure or stock discrepancy.
    kind: draft
    args:
      analysis_context: {type: str, required: true, desc: "Brief context for the analysis, e.g. SKU, date range, or issue type"}
    sql:
      incidents: SELECT incident_id, issue_description, severity, created_at FROM quality_incidents WHERE issue_description LIKE CONCAT('%', $analysis_context, '%') ORDER BY created_at DESC LIMIT 5
      holds: SELECT hold_id, hold_reason, created_at FROM quality_holds WHERE hold_reason LIKE CONCAT('%', $analysis_context, '%') ORDER BY created_at DESC LIMIT 3
    template: |
      ROOT CAUSE ANALYSIS REPORT
      Generated: {{ as_of }}
      Prepared by: Quality Team

      Issue Summary:
      Analysis focus: {{ analysis_context }}

      Related Incidents:
      {% for i in incidents %}
      - {{ i.incident_id }} ({{ i.severity }}): {{ i.issue_description }}
      {% endfor %}

      Related Holds:
      {% for h in holds %}
      - {{ h.hold_id }}: {{ h.hold_reason }}
      {% endfor %}

      Root Cause:
      [To be completed after investigation]

      Recommended Actions:
      [To be completed after investigation]

      Contact: Quality Team
    example: {analysis_context: "stock discrepancy"}

  - name: draft_supplier_corrective_action_request
    desc: Draft a corrective action request for supplier.
    kind: draft
    args:
      car_id: {required: true}
    sql:
      car: SELECT car_id, supplier_id, factory_id, issue_description, requested_action FROM supplier_corrective_actions WHERE car_id = $car_id
      supplier: SELECT name, country FROM master.suppliers WHERE supplier_id = (SELECT supplier_id FROM supplier_corrective_actions WHERE car_id = $car_id LIMIT 1)
    template: |
      CORRECTIVE ACTION REQUEST

      To: {{ supplier[0].name }}
      From: Harbour & Vale Quality Team
      Date: {{ as_of }}
      Reference: {{ car[0].car_id }}

      Issue:
      {{ car[0].issue_description }}

      Requested Actions:
      {{ car[0].requested_action }}

      Please confirm receipt and provide:
      1. Root cause analysis
      2. Corrective action plan with timelines
      3. Preventive measures for future

      Deadline for response: 5 business days
    example: {car_id: CAR-900001}

  - name: draft_supplier_notification
    desc: Draft a quality notification to affected suppliers.
    kind: draft
    args:
      incident_id: {required: true, desc: "Quality incident requiring supplier notification"}
    sql:
      incident: SELECT incident_id, sku, factory_id, issue_description, severity FROM quality_incidents WHERE incident_id = $incident_id
      factory: SELECT name, supplier_id FROM master.factories WHERE factory_id = (SELECT factory_id FROM quality_incidents WHERE incident_id = $incident_id LIMIT 1)
    template: |
      QUALITY NOTIFICATION

      Date: {{ as_of }}
      Reference: {{ incident[0].incident_id }}
      Severity: {{ incident[0].severity }}

      Dear Supplier,

      We are notifying you of a quality issue that may affect products you supply:

      SKU: {{ incident[0].sku }}
      Issue: {{ incident[0].issue_description }}

      This notification is issued to alert you to:
      - Potential impact on customer satisfaction
      - Possible returns or claims
      - Need for investigation and corrective action

      Please contact our quality team immediately.

      Regards,
      Quality Management Team
    example: {incident_id: INC-900001}

  - name: get_damage_rate_by_pack_type
    desc: Damage rate by pack type. Returns damage data for cost-benefit analysis of packaging options.
    kind: sql
    args:
      sku: {}
      pack_type: {}
      period_weeks: {type: int, default: 12, desc: "Weeks of history"}
    sql: |
      SELECT pack_type, SUM(units_shipped) AS total_units_shipped, SUM(units_damaged) AS total_units_damaged,
             ROUND(100.0 * SUM(units_damaged) / NULLIF(SUM(units_shipped), 0), 2) AS damage_rate_pct,
             COUNT(*) AS periods_tracked
      FROM pack_damage_tracking
      WHERE ($sku IS NULL OR sku = $sku)
        AND ($pack_type IS NULL OR pack_type = $pack_type)
        AND period >= CAST($as_of AS DATE) - INTERVAL (CAST($period_weeks AS INT) * 7) DAY
      GROUP BY pack_type
      ORDER BY damage_rate_pct DESC
    limit: 20
    example: {pack_type: carton}

  - name: get_factory_defect_inspection_results
    desc: Inline and final inspection results by factory. Shows defect trends and pass rates.
    kind: sql
    args:
      factory_id: {required: true}
      inspection_type: {type: enum, values: [inline, final, pre_production, sample], default: inline, desc: "Inspection type"}
      date_from: {type: date, default: "-60d", desc: "Start date for results"}
    sql: |
      SELECT qi.inspection_id, qi.lot_id, qi.inspection_type, qi.units_inspected, qi.defects_found,
             ROUND(100.0 * qi.defects_found / NULLIF(qi.units_inspected, 0), 1) AS defect_pct,
             qi.pass_fail, qi.inspected_at,
             pl.sku, pl.produced_at
      FROM quality_inspections qi
      JOIN production_lots pl ON pl.lot_id = qi.lot_id
      WHERE qi.factory_id = $factory_id
        AND qi.inspection_type = $inspection_type
        AND qi.inspected_at >= CAST($date_from AS DATE)
      ORDER BY qi.inspected_at DESC
    limit: 50
    example: {factory_id: FAC-0001, inspection_type: inline}

  - name: get_factory_defect_rate_trend
    desc: Defect rate trend by factory over time. Shows weekly defect percentages to identify patterns and improvements.
    kind: sql
    args:
      factory_id: {required: true}
      weeks: {type: int, default: 12, desc: "Number of weeks of history"}
    sql: |
      SELECT factory_id, period, defect_rate_pct, total_units_inspected, defects_found,
             pass_rate_pct, critical_defects, risk_score
      FROM factory_quality_scorecards
      WHERE factory_id = $factory_id
        AND period >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
      ORDER BY period DESC
    limit: 52
    example: {factory_id: FAC-0001, weeks: 12}

  - name: get_factory_process_capability
    desc: Factory process capability metrics. Shows defect rates, pass rates and trend over 12 weeks.
    kind: sql
    args:
      factory_id: {required: true}
    sql: |
      SELECT factory_id,
             ROUND(AVG(defect_rate_pct), 1) AS avg_defect_rate_pct,
             ROUND(MIN(defect_rate_pct), 1) AS best_defect_rate_pct,
             ROUND(MAX(defect_rate_pct), 1) AS worst_defect_rate_pct,
             ROUND(AVG(pass_rate_pct), 1) AS avg_pass_rate_pct,
             COUNT(*) AS weeks_tracked,
             ROUND(AVG(risk_score), 1) AS avg_risk_score
      FROM factory_quality_scorecards
      WHERE factory_id = $factory_id
        AND period >= CAST($as_of AS DATE) - INTERVAL 84 DAY
      GROUP BY factory_id
    example: {factory_id: FAC-0001}

  - name: get_inspection_measurements_for_style
    desc: Inspection measurements for a style. Returns actual vs spec values across all lots and inspections.
    kind: sql
    args:
      style_id: {required: true}
      measurement_type: {}
    sql: |
      SELECT im.measurement_id, im.inspection_id, im.lot_id, pl.sku,
             p.style_id,
             im.measurement_type, im.actual_value, im.spec_value,
             im.tolerance_lower, im.tolerance_upper, im.unit,
             ROUND(im.actual_value - im.spec_value, 2) AS deviation,
             im.pass AS within_tolerance, im.created_at
      FROM inspection_measurements im
      JOIN production_lots pl ON im.lot_id = pl.lot_id
      JOIN master.products p ON p.sku = pl.sku
      WHERE p.style_id = $style_id
        AND ($measurement_type IS NULL OR im.measurement_type = $measurement_type)
      ORDER BY im.created_at DESC
    limit: 100
    example: {style_id: "STY-5520"}

  - name: get_production_lot_details
    desc: Production lot details including factory, SKU, status and disposition. Use to trace quality issues back to source.
    kind: sql
    args:
      lot_id: {required: true}
    sql: |
      SELECT pl.lot_id, pl.sku, pl.factory_id, pl.po_id, pl.qty_produced,
             pl.produced_at, pl.status, pl.lot_disposition, pl.created_at, pl.updated_at,
             COUNT(DISTINCT qi.inspection_id) AS inspections_count,
             COUNT(DISTINCT im.measurement_id) AS measurements_count
      FROM production_lots pl
      LEFT JOIN quality_inspections qi ON qi.lot_id = pl.lot_id
      LEFT JOIN inspection_measurements im ON im.lot_id = pl.lot_id
      WHERE pl.lot_id = $lot_id
      GROUP BY pl.lot_id, pl.sku, pl.factory_id, pl.po_id, pl.qty_produced,
               pl.produced_at, pl.status, pl.lot_disposition, pl.created_at, pl.updated_at
    example: {lot_id: LOT-900001}

  - name: get_quality_defects_for_sku
    desc: Quality defects and issues for a SKU. Lists incidents, holds and defect trends for investigation.
    kind: sql
    args:
      sku: {required: true}
      weeks: {type: int, default: 12, desc: "Weeks of history to review"}
    sql: |
      SELECT qi.incident_id, qi.sku, qi.factory_id, qi.lot_id, qi.issue_description,
             qi.severity, qi.status, qi.created_at,
             COUNT(DISTINCT qh.hold_id) AS holds_related
      FROM quality_incidents qi
      LEFT JOIN quality_holds qh ON qh.related_incident_id = qi.incident_id
      WHERE qi.sku = $sku
        AND qi.created_at >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
      GROUP BY qi.incident_id, qi.sku, qi.factory_id, qi.lot_id, qi.issue_description,
               qi.severity, qi.status, qi.created_at
      ORDER BY qi.created_at DESC
    limit: 50
    example: {sku: K-1700}

  - name: get_supplier_qa_results_by_style
    desc: Supplier QA results for a style. Shows inspection results and pass rates across supplier factories.
    kind: sql
    args:
      style_id: {required: true}
    sql: |
      SELECT DISTINCT f.factory_id, f.supplier_id, s.name AS supplier_name,
             COUNT(DISTINCT qi.inspection_id) AS total_inspections,
             ROUND(100.0 * COUNT(CASE WHEN qi.pass_fail = 'pass' THEN 1 END) / NULLIF(COUNT(qi.inspection_id), 0), 1) AS pass_rate_pct,
             ROUND(AVG(CAST(qi.defects_found AS FLOAT) / NULLIF(qi.units_inspected, 0)) * 100, 1) AS avg_defect_rate_pct
      FROM quality_inspections qi
      JOIN production_lots pl ON qi.lot_id = pl.lot_id
      JOIN master.products p ON p.sku = pl.sku
      JOIN master.factories f ON f.factory_id = qi.factory_id
      JOIN master.suppliers s ON s.supplier_id = f.supplier_id
      WHERE p.style_id = $style_id
        AND qi.inspected_at >= CAST($as_of AS DATE) - INTERVAL 90 DAY
      GROUP BY f.factory_id, f.supplier_id, s.name
      ORDER BY pass_rate_pct DESC
    example: {style_id: STY-5520}

  - name: get_supplier_quality_incidents
    desc: Quality incidents for a supplier. Shows all incidents linked to supplier's factories and products.
    kind: sql
    args:
      supplier_id: {required: true}
      weeks: {type: int, default: 12, desc: "Weeks of history"}
    sql: |
      SELECT qi.incident_id, qi.sku, qi.factory_id, f.name AS factory_name,
             f.supplier_id, qi.issue_description, qi.severity, qi.status, qi.created_at
      FROM quality_incidents qi
      INNER JOIN master.factories f ON f.factory_id = qi.factory_id
      WHERE f.supplier_id = $supplier_id
        AND qi.created_at >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
      ORDER BY qi.created_at DESC
    limit: 50
    example: {supplier_id: "SUP-0001"}

  - name: get_supplier_quality_record
    desc: Supplier defect and inspection record. Shows defect rate, pass rate and incident history over 12 weeks.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT s.supplier_id, s.name,
             COUNT(DISTINCT qi.inspection_id) AS total_inspections,
             SUM(qi.units_inspected) AS total_units_inspected,
             SUM(qi.defects_found) AS total_defects,
             ROUND(100.0 * SUM(qi.defects_found) / NULLIF(SUM(qi.units_inspected), 0), 1) AS defect_rate_pct,
             COUNT(DISTINCT qi.lot_id) AS lots_inspected,
             COUNT(DISTINCT inc.incident_id) AS total_incidents,
             COUNT(DISTINCT qh.hold_id) AS active_holds
      FROM master.suppliers s
      JOIN master.factories f ON f.supplier_id = s.supplier_id
      LEFT JOIN quality_inspections qi ON qi.factory_id = f.factory_id
                                       AND qi.inspected_at >= CAST($as_of AS DATE) - INTERVAL 84 DAY
      LEFT JOIN production_lots pl ON qi.lot_id = pl.lot_id
      LEFT JOIN quality_incidents inc ON inc.factory_id = f.factory_id
                                      AND inc.created_at >= CAST($as_of AS DATE) - INTERVAL 84 DAY
      LEFT JOIN quality_holds qh ON qh.status = 'active'
                                 AND qh.created_at >= CAST($as_of AS DATE) - INTERVAL 84 DAY
      WHERE s.supplier_id = $supplier_id
      GROUP BY s.supplier_id, s.name
    example: {supplier_id: SUP-0001}

  - name: list_factory_quality_scorecards
    desc: Quality scorecards by factory. Lists weekly performance data for inspection and risk assessment.
    kind: select
    from: factory_quality_scorecards
    filters:
      factory_id: {}
      period_from: {col: period, op: ">=", default: "-90d"}
    columns: [scorecard_id, factory_id, period, defect_rate_pct, pass_rate_pct, risk_score, total_units_inspected, defects_found]
    order: period DESC
    limit: 20
    example: {factory_id: FAC-0001}

  - name: list_preproduction_sample_acceptance_criteria
    desc: Preproduction sample acceptance criteria by style. Lists acceptance thresholds for sample testing.
    kind: draft
    args:
      style_id: {required: true}
    sql:
      review: SELECT review_id, style_id, review_type, status, findings FROM quality_reviews WHERE style_id = $style_id AND review_type = 'pre_production'
    template: |
      PREPRODUCTION SAMPLE ACCEPTANCE CRITERIA

      Style: {{ style_id }}
      Date: {{ as_of }}

      Sample Requirements:
      - Minimum sample size: 3 pieces
      - Test methods: Inspection of fit, finish, material quality, packaging, and labeling
      - Acceptance criteria: 0 defects of critical nature allowed, maximum 1 minor defect

      Visual Inspection Checklist:
      - Stitching quality and consistency
      - Material color and print accuracy
      - Measurement compliance with tech pack
      - Packaging presentation and labeling

      Functional Testing (where applicable):
      - Zip/button functionality
      - Elastic integrity
      - Seam strength
      - Care label legibility

      Quality Standards:
      - ISO/IEC 17025 accredited testing where required
      - Test reports must be provided before PO release
      - Any failures require immediate corrective action discussion

      {% if review %}
      Previous Reviews:
      {% for r in review %}
      - {{ r.review_id }} ({{ r.review_type }}): {{ r.findings }}
      {% endfor %}
      {% endif %}

      Contact: Quality Team
    example: {style_id: STY-5520}

  - name: search_knowledge_base_for_tolerance_standards
    desc: Search knowledge base for tolerance standards. Returns industry and internal standards for measurement specifications.
    kind: draft
    args:
      search_term: {required: true, desc: "Search term, e.g. 'cotton shrinkage', 'zip strength', 'colour fastness'"}
      material: {desc: "Optional: material type, e.g. cotton, polyester, silk"}
    sql:
      standards: SELECT 'Standard document' AS title, 'ISO 3759 for knit shrinkage' AS content UNION ALL SELECT 'AATCC Test Method 135', 'Dimensional change in automatic home laundering of fabric specimens'
    template: |
      TOLERANCE STANDARDS SEARCH RESULTS

      Query: {{ search_term }}
      Search Date: {{ as_of }}

      Relevant Industry Standards:
      1. ISO 3759:2011 - Preparation, marking and measurement of flat knitted fabric and related products for testing dimensions
      2. AATCC Test Method 135 - Dimensional changes of fabric after laundering
      3. BS 5441:1988 - Method for assessment of fabric drape
      4. ASTM D6775-12 - Standard Guide for Care Symbols for Textile Wearing Apparel

      Common Tolerance Ranges by Material:
      - Cotton wovens: ±2.5% on length and width
      - Cotton knits: ±3.0% on length and width (post-wash)
      - Polyester blends: ±2.0% on length and width
      - Silk: ±1.5% (delicate; minimize washing)

      ZIP/BUTTON STRENGTH STANDARDS:
      - Zip pull strength: ≥100N minimum
      - Button shank strength: ≥15N minimum
      - Snap strength: ≥50N minimum

      FOR COLOUR FASTNESS:
      - ISO 105-C06:2010 - Color fastness to domestic/commercial laundering
      - Minimum Grade 3 for most products
      - Grade 4 minimum for premium ranges
      - Rub fastness (AATCC 8): Grade 3+ minimum

      Internal Company Guidelines:
      - Standard tolerance band: ±5% of specification value
      - Tighter tolerances (±2%) for premium or technical products
      - Looser tolerances (±7%) only with buyer approval

      Contact: Quality Assurance Team
    example: {search_term: "cotton shrinkage"}

  - name: send_supplier_corrective_action_request
    desc: Send a corrective action request to the supplier. Updates status from draft to sent.
    kind: update
    table: supplier_corrective_actions
    set: {status: sent, sent_at: "$as_of"}
    args:
      car_id: {required: true}
    example: {car_id: CAR-900001}

  - name: send_supplier_notification
    desc: Send a quality notification to a supplier. Records the notification as sent.
    kind: insert
    table: supplier_corrective_actions
    id_prefix: SPN-
    defaults: {status: sent}
    args:
      supplier_id: {required: true}
      factory_id: {}
      issue_description: {required: true}
      requested_action: {required: true, desc: "Action requested from supplier"}
    example: {supplier_id: SUP-0001, issue_description: "Chromium VI test failure - regulatory notification", requested_action: "Audit leather supplier and provide material batch certificates"}

  - name: update_lot_disposition
    desc: Set production lot disposition to release, rework or reject. Updates lot status accordingly.
    kind: py
    fn: update_lot_disposition
    args:
      lot_id: {required: true}
      disposition: {required: true, type: enum, values: [release, rework, reject], desc: "QA disposition decision"}
    example: {lot_id: LOT-900001, disposition: release}
