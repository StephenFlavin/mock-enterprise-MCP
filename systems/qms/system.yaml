id: qms
name: Quality Management System (QMS)
instructions: >
  Quality inspections, incidents and supplier corrective actions for inbound products from factories.
  Incident ids look like INC-000123, lot ids like LOT-000123, CAR ids like CAR-000123.
  Use it for factory quality scorecards, defect trends, inspection measurements vs tolerance, and supplier quality holds and corrective actions.

tables:
  production_lots:
    key: lot_id
    cols:
      lot_id: {type: str, desc: "Production lot, e.g. LOT-000123"}
      sku: {type: str, desc: "SKU"}
      batch_id: {type: str, desc: "Material or dye batch the lot was made from, e.g. BATCH-POL-PINK-001"}
      factory_id: {type: str, desc: "Factory that produced the lot"}
      po_id: {type: str, desc: "Purchase order"}
      qty_produced: {type: int, desc: "Units produced"}
      produced_at: {type: date, desc: "Production date"}
      status: {type: enum, values: [produced, in_inspection, released, reworked, rejected], desc: "Lot status"}
      lot_disposition: {type: enum, values: [pending, release, rework, reject], desc: "QA disposition"}
      created_at: {type: timestamp, desc: "When lot was created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  quality_inspections:
    key: inspection_id
    cols:
      inspection_id: {type: str, desc: "Inspection record, e.g. INS-000123"}
      lot_id: {type: str, desc: "Production lot being inspected"}
      factory_id: {type: str, desc: "Factory"}
      inspection_type: {type: enum, values: [inline, final, pre_production, sample], desc: "Inspection type"}
      units_inspected: {type: int, desc: "Units in sample"}
      defects_found: {type: int, desc: "Number of defects"}
      pass_fail: {type: enum, values: [pending, pass, fail, conditional], desc: "Result; pending for a booked inspection not yet done"}
      scheduled_at: {type: timestamp, desc: "Scheduled inspection time (if booking)"}
      inspected_at: {type: timestamp, desc: "When inspection was performed"}
      created_at: {type: timestamp, desc: "When record created"}
      notes: {type: text, desc: "Booking reason or inspector notes"}

  inspection_measurements:
    key: measurement_id
    cols:
      measurement_id: {type: str, desc: "Measurement record"}
      inspection_id: {type: str, desc: "Inspection"}
      lot_id: {type: str, desc: "Production lot"}
      measurement_type: {type: str, desc: "E.g. chest_width, inseam, colour_value"}
      actual_value: {type: float, desc: "Measured value"}
      spec_value: {type: float, desc: "Target specification value"}
      tolerance_lower: {type: float, desc: "Lower tolerance bound"}
      tolerance_upper: {type: float, desc: "Upper tolerance bound"}
      unit: {type: str, desc: "Measurement unit, e.g. mm, points"}
      pass: {type: bool, desc: "Within tolerance"}
      created_at: {type: timestamp, desc: "When measured"}

  quality_incidents:
    key: incident_id
    cols:
      incident_id: {type: str, desc: "Quality incident, e.g. INC-000123"}
      sku: {type: str, desc: "SKU affected (if specific)"}
      factory_id: {type: str, desc: "Factory (if source-specific)"}
      lot_id: {type: str, desc: "Production lot (if specific)"}
      issue_description: {type: text, desc: "What went wrong"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Severity level"}
      status: {type: enum, values: [open, investigating, resolved, closed], desc: "Investigation status"}
      created_at: {type: timestamp, desc: "When incident was raised"}
      updated_at: {type: timestamp, desc: "Last updated"}

  quality_holds:
    key: hold_id
    cols:
      hold_id: {type: str, desc: "Quality hold, e.g. HLD-000123"}
      sku: {type: str, desc: "SKU on hold"}
      lot_id: {type: str, desc: "Lot on hold (if specific)"}
      site_id: {type: str, desc: "DC where the held stock sits (if known)"}
      qty_held: {type: int, desc: "Units held (if known)"}
      hold_reason: {type: text, desc: "Why hold was placed"}
      status: {type: enum, values: [active, released, expired], desc: "Hold status"}
      related_incident_id: {type: str, desc: "Related incident if any"}
      created_at: {type: timestamp, desc: "When hold placed"}
      released_at: {type: timestamp, desc: "When hold lifted"}
      updated_at: {type: timestamp, desc: "Last updated"}

  quality_investigations:
    key: investigation_id
    cols:
      investigation_id: {type: str, desc: "Investigation, e.g. INV-000123"}
      related_incident_id: {type: str, desc: "Related incident"}
      sku: {type: str, desc: "SKU under investigation (if specific)"}
      supplier_id: {type: str, desc: "Supplier under investigation (if specific)"}
      scope: {type: text, desc: "What is being investigated"}
      status: {type: enum, values: [open, in_progress, on_hold, closed], desc: "Investigation status"}
      findings: {type: text, desc: "Root cause and findings"}
      created_at: {type: timestamp, desc: "When investigation started"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_corrective_actions:
    key: car_id
    cols:
      car_id: {type: str, desc: "Corrective action request, e.g. CAR-000123"}
      supplier_id: {type: str, desc: "Supplier"}
      factory_id: {type: str, desc: "Factory if specific"}
      sku: {type: str, desc: "SKU the request is about (if specific)"}
      issue_description: {type: text, desc: "The quality issue"}
      requested_action: {type: text, desc: "What supplier should do"}
      status: {type: enum, values: [draft, sent, acknowledged, in_progress, closed], desc: "CAR status"}
      created_at: {type: timestamp, desc: "When created"}
      sent_on: {type: timestamp, desc: "When sent to supplier (blank while draft)"}
      due_date: {type: date, desc: "Date the supplier must respond by"}
      updated_at: {type: timestamp, desc: "Last updated"}

  supplier_notifications:
    key: notification_id
    cols:
      notification_id: {type: str, desc: "Quality notification, e.g. SPN-000123"}
      supplier_id: {type: str, desc: "Supplier notified"}
      factory_id: {type: str, desc: "Factory concerned (if specific)"}
      lot_id: {type: str, desc: "Production lot concerned (if specific)"}
      incident_id: {type: str, desc: "Related quality incident (if any)"}
      issue_description: {type: text, desc: "What the supplier is told went wrong"}
      requested_action: {type: text, desc: "Action requested from the supplier"}
      status: {type: enum, values: [sent], desc: "Notification status"}
      sent_at: {type: timestamp, desc: "When the notification was sent"}
      created_at: {type: timestamp, desc: "When recorded"}

  factory_quality_scorecards:
    key: scorecard_id
    cols:
      scorecard_id: {type: str, desc: "Scorecard"}
      factory_id: {type: str, desc: "Factory"}
      period: {type: date, desc: "Reporting period (week start)"}
      total_units_inspected: {type: int, desc: "Total units inspected in period"}
      defects_found: {type: int, desc: "Total defects"}
      defect_rate_pct: {type: float, desc: "Defect rate percentage"}
      pass_rate_pct: {type: float, desc: "Pass rate percentage"}
      critical_defects: {type: int, desc: "Number of critical issues"}
      on_time_delivery_pct: {type: float, desc: "On-time delivery %"}
      risk_score: {type: float, desc: "Weekly risk score 0-100: 6 x defect rate + 9 x critical defects + 0.3 x late-delivery %"}
      created_at: {type: timestamp, desc: "When created"}

  pack_damage_tracking:
    key: damage_id
    cols:
      damage_id: {type: str, desc: "Damage record"}
      sku: {type: str, desc: "SKU"}
      pack_type: {type: str, desc: "Packaging type or material, e.g. polybag, carton, rigid_box, corrugated, moulded_pulp"}
      channel: {type: enum, values: [store, ecommerce], desc: "Sales channel the units shipped to"}
      period: {type: date, desc: "Reporting period (week start)"}
      units_shipped: {type: int, desc: "Units shipped in this pack type"}
      units_damaged: {type: int, desc: "Units damaged on arrival"}
      damage_rate_pct: {type: float, desc: "Damage percentage"}
      damage_type: {type: str, desc: "E.g. crushed, water_damaged, leaking"}
      created_at: {type: timestamp, desc: "When recorded"}

  sample_acceptance_criteria:
    key: criterion_id
    cols:
      criterion_id: {type: str, desc: "Acceptance criterion, e.g. SAC-000001"}
      product_type: {type: str, desc: "Product type the test applies to, e.g. insulated lunch box, or general for all products"}
      test_name: {type: str, desc: "Test or inspection a preproduction sample must pass"}
      requirement: {type: text, desc: "Threshold the sample must meet"}
      method: {type: str, desc: "Test method or standard"}
      severity: {type: enum, values: [critical, major, minor], desc: "Failure severity; a critical failure blocks PO release"}

  quality_reviews:
    key: review_id
    cols:
      review_id: {type: str, desc: "QA review, e.g. REV-000123"}
      style_id: {type: str, desc: "Style under review"}
      review_type: {type: str, desc: "E.g. fit, durability, appearance"}
      status: {type: enum, values: [open, in_progress, closed], desc: "Review status"}
      reason: {type: text, desc: "Why the review was requested"}
      findings: {type: text, desc: "Review findings"}
      created_at: {type: timestamp, desc: "When opened"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: calculate_factory_quality_risk_score
    desc: Composite quality risk score per factory from defect rate, critical defects, late delivery and trend, highest risk first. Omit factory_id to rank all factories.
    kind: sql
    args:
      factory_id: {}
      period_weeks: {type: int, default: 12, desc: "Number of weeks to analyse"}
    sql: |
      WITH w AS (
        SELECT factory_id, period, defect_rate_pct, critical_defects, risk_score, on_time_delivery_pct,
               CASE WHEN period > CAST($as_of AS DATE) - INTERVAL 28 DAY THEN 1 ELSE 0 END AS recent
        FROM factory_quality_scorecards
        WHERE ($factory_id IS NULL OR factory_id = $factory_id)
          AND period >= CAST($as_of AS DATE) - INTERVAL (CAST($period_weeks AS INT) * 7) DAY
      ), agg AS (
        SELECT factory_id, count(*) AS weeks_data,
               round(avg(defect_rate_pct), 1) AS avg_defect_rate_pct,
               round(avg(defect_rate_pct) FILTER (WHERE recent = 1), 1) AS recent_defect_rate_pct,
               round(avg(defect_rate_pct) FILTER (WHERE recent = 0), 1) AS earlier_defect_rate_pct,
               round(avg(critical_defects) FILTER (WHERE recent = 1), 1) AS recent_critical_per_week,
               round(avg(on_time_delivery_pct) FILTER (WHERE recent = 1), 1) AS recent_on_time_pct,
               round(avg(risk_score) FILTER (WHERE recent = 1), 1) AS recent_weekly_risk
        FROM w GROUP BY factory_id
      )
      SELECT a.factory_id, f.name AS factory_name, f.supplier_id, a.weeks_data, a.avg_defect_rate_pct,
             a.recent_defect_rate_pct, a.earlier_defect_rate_pct,
             round(a.recent_defect_rate_pct - COALESCE(a.earlier_defect_rate_pct, a.recent_defect_rate_pct), 1) AS defect_trend_pp,
             a.recent_critical_per_week, a.recent_on_time_pct, a.recent_weekly_risk,
             round(least(100, a.recent_weekly_risk + 5 * greatest(a.recent_defect_rate_pct - COALESCE(a.earlier_defect_rate_pct, a.recent_defect_rate_pct), 0)), 1) AS risk_score,
             'risk_score = last 4 weeks average weekly risk + 5 x rise in defect rate (points) vs earlier weeks, capped at 100' AS formula
      FROM agg a JOIN master.factories f ON f.factory_id = a.factory_id
      ORDER BY risk_score DESC, a.factory_id
    limit: 10
    example: {factory_id: FAC-0087}

  - name: calculate_measurement_deviation_vs_tolerance
    desc: Calculate deviation of actual measurement from spec vs tolerance. Shows if within spec and by how much.
    kind: sql
    args:
      lot_id: {required: true}
      measurement_type: {required: true, desc: "E.g. chest_width, inseam"}
    sql: |
      SELECT m.measurement_id, m.measurement_type, m.actual_value, m.spec_value,
             m.tolerance_lower, m.tolerance_upper,
             ROUND(m.actual_value - m.spec_value, 2) AS deviation_from_spec,
             ROUND(((m.actual_value - m.spec_value) / (m.tolerance_upper - m.tolerance_lower)) * 100, 1) AS pct_of_tolerance,
             m.pass AS within_tolerance,
             m.unit,
             'deviation = actual - spec; pct_tolerance = deviation / tolerance_band * 100' AS formula
      FROM inspection_measurements m
      WHERE m.lot_id = $lot_id AND m.measurement_type = $measurement_type
      ORDER BY m.created_at DESC
    example: {lot_id: LOT-900004, measurement_type: hip_width}

  - name: calculate_recommended_tolerance
    desc: Calculate recommended tolerance based on factory process capability and shrinkage/stretch behaviour.
    kind: py
    fn: calculate_recommended_tolerance
    args:
      factory_id: {required: true}
      material: {required: true, desc: "Material type, e.g. cotton, polyester"}
      measurement_type: {required: true, desc: "E.g. length, width"}
    example: {factory_id: FAC-0107, material: cotton, measurement_type: length}

  - name: create_inspection_booking
    desc: Book an additional inspection (inline by default) at a factory for a future date. Returns the booking with its inspection id.
    kind: insert
    table: quality_inspections
    id_prefix: INS-
    defaults: {pass_fail: pending}
    args:
      factory_id: {required: true}
      scheduled_at: {type: timestamp, required: true, desc: "When to inspect (e.g. +5d)"}
      inspection_type: {type: enum, values: [inline, final, pre_production, sample], default: inline, desc: "Inspection type"}
      lot_id: {}
      units_inspected: {type: int, default: 100, desc: "Planned sample size in units"}
      notes: {desc: "Why the extra inspection is booked"}
    example: {factory_id: FAC-0001, scheduled_at: "+5d", notes: "Rising defect rate"}

  - name: create_quality_hold_for_sku
    desc: Place a quality hold on a SKU or batch pending investigation.
    kind: insert
    table: quality_holds
    id_prefix: HLD-
    defaults: {status: active}
    args:
      sku: {required: true}
      hold_reason: {required: true, desc: "Why the hold is placed"}
      lot_id: {}
      related_incident_id: {}
    example: {sku: K-1700, hold_reason: "Defect pattern detected; investigating root cause"}

  - name: create_quality_incident
    desc: Open a quality incident record for a defect or issue.
    kind: insert
    table: quality_incidents
    id_prefix: INC-
    defaults: {status: open, severity: medium}
    args:
      sku: {}
      factory_id: {}
      lot_id: {}
      issue_description: {required: true}
    example: {sku: PF-220, factory_id: FAC-0107, issue_description: "Sole separation failures in returns"}

  - name: create_quality_investigation
    desc: Open a quality investigation on an item (sku), a supplier or an incident, with its scope. Returns the new investigation.
    kind: insert
    table: quality_investigations
    id_prefix: INV-
    defaults: {status: open}
    args:
      scope: {required: true, desc: "What is being investigated"}
      sku: {}
      supplier_id: {}
      related_incident_id: {}
    example: {sku: K-1700, scope: "Glass breakage claims up 40% - packaging vs carrier vs handling"}

  - name: create_quality_review_request
    desc: Open a QA review request for one style, with the review type and why it is needed. Call once per style.
    kind: insert
    table: quality_reviews
    id_prefix: REV-
    defaults: {status: open}
    args:
      style_id: {required: true}
      review_type: {required: true, desc: "E.g. fit, durability, appearance, top_returns"}
      reason: {}
    example: {style_id: STY-5520, review_type: top_returns, reason: "Top returned style"}

  - name: create_supplier_corrective_action_request
    desc: Create a draft corrective action request against a supplier, optionally for a factory and SKU. Send it with send_supplier_corrective_action_request.
    kind: insert
    table: supplier_corrective_actions
    id_prefix: CAR-
    defaults: {status: draft}
    args:
      supplier_id: {required: true}
      factory_id: {}
      sku: {}
      issue_description: {required: true}
      requested_action: {required: true}
      due_date: {type: date, default: "+14d", desc: "Date the supplier must respond by"}
    example: {supplier_id: SUP-0064, factory_id: FAC-0121, sku: SKU-100007, issue_description: "Colourfastness to rubbing failures on polyester blouse lots", requested_action: "Audit the dye house process and provide root cause analysis"}

  - name: draft_root_cause_report
    desc: Draft a root cause report for a stock discrepancy or quality failure, showing stock currently on quality hold by site, hold history and open incidents.
    kind: draft
    args:
      analysis_context: {type: str, required: true, desc: "What is being analysed, e.g. ERP vs WMS stock gap"}
      site_id: {}
    sql:
      held: >
        SELECT h.site_id, count(*) AS holds, sum(h.qty_held) AS units, round(sum(h.qty_held * p.unit_cost_gbp), 2) AS value_gbp
        FROM quality_holds h JOIN master.products p ON p.sku = h.sku
        WHERE h.status = 'active' AND h.qty_held > 0 AND ($site_id IS NULL OR h.site_id = $site_id)
        GROUP BY h.site_id ORDER BY value_gbp DESC
      top: >
        SELECT h.hold_id, h.sku, p.name, h.site_id, h.qty_held, round(h.qty_held * p.unit_cost_gbp) AS value_gbp, CAST(h.created_at AS DATE) AS placed_on
        FROM quality_holds h JOIN master.products p ON p.sku = h.sku
        WHERE h.status = 'active' AND h.qty_held > 0 AND ($site_id IS NULL OR h.site_id = $site_id)
        ORDER BY value_gbp DESC LIMIT 5
      waves: >
        SELECT CAST(h.created_at AS DATE) AS placed_on, count(*) AS holds, sum(h.qty_held) AS units, round(sum(h.qty_held * p.unit_cost_gbp), 2) AS value_gbp,
               count(*) FILTER (WHERE h.status = 'active') AS still_active
        FROM quality_holds h JOIN master.products p ON p.sku = h.sku
        WHERE h.qty_held > 0 AND h.created_at >= CAST($as_of AS DATE) - INTERVAL 180 DAY
        GROUP BY CAST(h.created_at AS DATE) HAVING count(*) >= 5 ORDER BY placed_on DESC
      incidents: >
        SELECT DISTINCT i.incident_id, i.severity, i.status, i.issue_description, i.created_at
        FROM quality_incidents i JOIN quality_holds h ON h.related_incident_id = i.incident_id
        WHERE h.status = 'active' AND h.qty_held > 0 AND ($site_id IS NULL OR h.site_id = $site_id)
        ORDER BY i.created_at DESC LIMIT 5
    template: |
      ROOT CAUSE ANALYSIS REPORT
      Generated: {{ as_of }}
      Prepared by: Quality Team
      Subject: {{ analysis_context }}

      1. Stock on quality hold (WMS status quarantine)
      {% for h in held %}- {{ h.site_id }}: {{ h.holds }} holds, {{ h.units }} units, {{ h.value_gbp | money }}
      {% endfor %}
      Total on hold: {{ held | sum(attribute='holds') }} holds, {{ held | sum(attribute='units') }} units, {{ held | sum(attribute='value_gbp') | money }}.
      Largest holds:
      {% for t in top %}- {{ t.hold_id }} {{ t.sku }} ({{ t.name }}) at {{ t.site_id }}: {{ t.qty_held }} units, {{ t.value_gbp | money }}, placed {{ t.placed_on }}
      {% endfor %}

      2. Is it recurring? Large hold waves (5 or more holds placed on one day) in the last 180 days
      {% for w in waves %}- {{ w.placed_on }}: {{ w.holds }} holds, {{ w.units }} units, {{ w.value_gbp | money }} ({{ w.still_active }} still active)
      {% endfor %}

      3. Incidents behind the active holds
      {% for i in incidents %}- {{ i.incident_id }} ({{ i.severity }}, {{ i.status }}): {{ i.issue_description }}
      {% endfor %}

      Finding:
      Stock on quality hold is shown by the WMS as quarantine and excluded from available stock, but the ERP interface keeps it in book stock until the QA release is confirmed. The held value above is therefore part of the ERP-WMS difference until the holds are released or written off.

      Recommended actions:
      1. Release or write off the active holds above and confirm the release to ERP.
      2. Make the QA release step post to ERP when a hold is placed, so the two systems agree.

      Contact: Quality Team
    example: {analysis_context: "ERP vs WMS stock gap"}

  - name: draft_supplier_corrective_action_request
    desc: Draft a corrective action request to a supplier listing its failed lots, units produced and failed tests from the last weeks. Optionally limit to one SKU.
    kind: draft
    args:
      supplier_id: {required: true}
      sku: {}
      weeks: {type: int, default: 12, desc: "Weeks of failed inspections to include"}
    sql:
      sup: SELECT supplier_id, name, country FROM master.suppliers WHERE supplier_id = $supplier_id
      lots: >
        SELECT pl.lot_id, COALESCE(pl.batch_id, '-') AS batch_id, pl.sku, pl.factory_id, pl.qty_produced, CAST(qi.inspected_at AS DATE) AS inspected_on,
               qi.defects_found, qi.units_inspected,
               COALESCE((SELECT string_agg(m.measurement_type || ' ' || CAST(m.actual_value AS VARCHAR) || ' ' || m.unit || ' vs spec ' || CAST(m.spec_value AS VARCHAR), '; ')
                         FROM inspection_measurements m WHERE m.lot_id = pl.lot_id AND NOT m.pass), 'defects found at inspection') AS failed_tests
        FROM quality_inspections qi
        JOIN production_lots pl ON pl.lot_id = qi.lot_id
        JOIN master.factories f ON f.factory_id = pl.factory_id
        WHERE f.supplier_id = $supplier_id AND qi.pass_fail = 'fail' AND ($sku IS NULL OR pl.sku = $sku)
          AND qi.inspection_type = 'final'
          AND qi.inspected_at >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
        ORDER BY qi.inspected_at
    template: |
      CORRECTIVE ACTION REQUEST (DRAFT)

      To: {{ sup[0].name }} ({{ sup[0].supplier_id }})
      From: Harbour & Vale Quality Team
      Date: {{ as_of }}

      Issue:
      {{ lots | length }} lots failed final inspection in the last {{ weeks }} weeks, {{ lots | sum(attribute='qty_produced') }} units produced in total:
      {% for l in lots %}- {{ l.lot_id }} (batch {{ l.batch_id }}, {{ l.sku }}, {{ l.factory_id }}, {{ l.qty_produced }} units), inspected {{ l.inspected_on }}: {{ l.defects_found }} of {{ l.units_inspected }} units defective; {{ l.failed_tests }}
      {% endfor %}

      Requested actions:
      1. Contain: stop shipping from the affected lots and quarantine unshipped stock.
      2. Root cause analysis covering raw material, process changes and the dye house or sub-contractor involved.
      3. Corrective and preventive action plan with dates.
      4. Evidence of retest results on the next three lots before shipment.

      Please confirm receipt and respond within 14 days.
    example: {supplier_id: SUP-0064}

  - name: draft_supplier_notification
    desc: Draft a quality notification to affected suppliers.
    kind: draft
    args:
      incident_id: {required: true, desc: "Quality incident requiring supplier notification"}
    sql:
      incident: SELECT incident_id, sku, factory_id, lot_id, issue_description, severity FROM quality_incidents WHERE incident_id = $incident_id
      factory: SELECT factory_id, name, supplier_id FROM master.factories WHERE factory_id = (SELECT factory_id FROM quality_incidents WHERE incident_id = $incident_id LIMIT 1)
    template: |
      QUALITY NOTIFICATION

      Date: {{ as_of }}
      Reference: {{ incident[0].incident_id }}
      Severity: {{ incident[0].severity }}

      To: {{ factory[0].name }} ({{ factory[0].factory_id }}), supplier {{ factory[0].supplier_id }}

      Dear Supplier,

      We are notifying you of a quality issue that may affect products you supply:

      SKU: {{ incident[0].sku }}
      Lot: {{ incident[0].lot_id }}
      Issue: {{ incident[0].issue_description }}

      This notification is issued to alert you to:
      - Potential impact on customer satisfaction
      - Possible returns or claims
      - Need for investigation and corrective action

      Please contact our quality team immediately.

      Regards,
      Quality Management Team
    example: {incident_id: INC-900001}

  - name: get_damage_rate_by_pack_type
    desc: Damage rate by pack type or material, for a SKU or product category and sales channel. Use to compare packaging options on breakage.
    kind: sql
    args:
      sku: {}
      category: {desc: "Product category, e.g. Small Appliances"}
      pack_type: {}
      channel: {}
      period_weeks: {type: int, default: 12, desc: "Weeks of history"}
    sql: |
      SELECT d.pack_type, SUM(d.units_shipped) AS total_units_shipped, SUM(d.units_damaged) AS total_units_damaged,
             ROUND(100.0 * SUM(d.units_damaged) / NULLIF(SUM(d.units_shipped), 0), 2) AS damage_rate_pct,
             COUNT(DISTINCT d.sku) AS skus_tracked, COUNT(DISTINCT d.period) AS weeks_tracked
      FROM pack_damage_tracking d JOIN master.products p ON p.sku = d.sku
      WHERE ($sku IS NULL OR d.sku = $sku)
        AND ($category IS NULL OR lower(p.category) = lower($category))
        AND ($pack_type IS NULL OR lower(d.pack_type) = lower($pack_type))
        AND ($channel IS NULL OR d.channel = $channel)
        AND d.period >= CAST($as_of AS DATE) - INTERVAL (CAST($period_weeks AS INT) * 7) DAY
      GROUP BY d.pack_type
      ORDER BY damage_rate_pct DESC
    limit: 20
    example: {category: Small Appliances}

  - name: get_factory_defect_inspection_results
    desc: Inline and final inspection results by factory. Shows defect trends and pass rates.
    kind: sql
    args:
      factory_id: {required: true}
      inspection_type: {type: enum, values: [inline, final, pre_production, sample], default: inline, desc: "Inspection type"}
      date_from: {type: date, default: "-60d", desc: "Start date for results"}
    sql: |
      SELECT qi.inspection_id, qi.lot_id, qi.inspection_type, qi.units_inspected, qi.defects_found,
             ROUND(100.0 * qi.defects_found / NULLIF(qi.units_inspected, 0), 1) AS defect_pct,
             qi.pass_fail, qi.inspected_at,
             pl.sku, pl.produced_at
      FROM quality_inspections qi
      JOIN production_lots pl ON pl.lot_id = qi.lot_id
      WHERE qi.factory_id = $factory_id
        AND qi.inspection_type = $inspection_type
        AND qi.inspected_at >= CAST($date_from AS DATE)
      ORDER BY qi.inspected_at DESC
    limit: 50
    example: {factory_id: FAC-0001, inspection_type: inline}

  - name: get_factory_defect_rate_trend
    desc: Weekly defect rate trend for one factory with the change on the previous week, newest first. Use to see whether a factory is improving or worsening.
    kind: sql
    args:
      factory_id: {required: true}
      weeks: {type: int, default: 12, desc: "Number of weeks of history"}
    sql: |
      SELECT s.factory_id, f.name AS factory_name, s.period, s.defect_rate_pct,
             round(s.defect_rate_pct - lag(s.defect_rate_pct) OVER (PARTITION BY s.factory_id ORDER BY s.period), 1) AS change_vs_prev_week_pp,
             s.total_units_inspected, s.defects_found, s.pass_rate_pct, s.critical_defects, s.risk_score
      FROM factory_quality_scorecards s JOIN master.factories f ON f.factory_id = s.factory_id
      WHERE s.factory_id = $factory_id
        AND s.period >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
      ORDER BY s.period DESC
    limit: 52
    example: {factory_id: FAC-0087, weeks: 12}

  - name: get_factory_process_capability
    desc: Factory process capability metrics. Shows defect rates, pass rates and trend over 12 weeks.
    kind: sql
    args:
      factory_id: {required: true}
    sql: |
      SELECT factory_id,
             ROUND(AVG(defect_rate_pct), 1) AS avg_defect_rate_pct,
             ROUND(MIN(defect_rate_pct), 1) AS best_defect_rate_pct,
             ROUND(MAX(defect_rate_pct), 1) AS worst_defect_rate_pct,
             ROUND(AVG(pass_rate_pct), 1) AS avg_pass_rate_pct,
             COUNT(*) AS weeks_tracked,
             ROUND(AVG(risk_score), 1) AS avg_risk_score
      FROM factory_quality_scorecards
      WHERE factory_id = $factory_id
        AND period >= CAST($as_of AS DATE) - INTERVAL 84 DAY
      GROUP BY factory_id
    example: {factory_id: FAC-0001}

  - name: get_inspection_measurements_for_style
    desc: Inspection measurements for a style. Returns actual vs spec values across all lots and inspections.
    kind: sql
    args:
      style_id: {required: true}
      sku: {desc: "Restrict to one size/colour SKU of the style, e.g. size 14"}
      measurement_type: {}
    sql: |
      SELECT im.measurement_id, im.inspection_id, im.lot_id, pl.sku,
             p.style_id,
             im.measurement_type, im.actual_value, im.spec_value,
             im.tolerance_lower, im.tolerance_upper, im.unit,
             ROUND(im.actual_value - im.spec_value, 2) AS deviation,
             im.pass AS within_tolerance, im.created_at
      FROM inspection_measurements im
      JOIN production_lots pl ON im.lot_id = pl.lot_id
      JOIN master.products p ON p.sku = pl.sku
      WHERE p.style_id = $style_id
        AND ($sku IS NULL OR pl.sku = $sku)
        AND ($measurement_type IS NULL OR im.measurement_type = $measurement_type)
      ORDER BY im.created_at DESC
    limit: 100
    example: {style_id: "STY-5520"}

  - name: get_production_lot_details
    desc: Production lots with factory, supplier, SKU, batch, units produced, disposition, inspection results and failed measurements. Filter by lot, SKU, style, factory or batch.
    kind: sql
    args:
      lot_id: {}
      sku: {}
      factory_id: {}
      style_id: {type: str, desc: "Style id, e.g. STY-4012"}
      batch_id: {desc: "Material or dye batch, e.g. BATCH-POL-PINK-001"}
      failed_only: {type: bool, desc: "True to list only lots with a failed inspection"}
      date_from: {type: date, default: "-90d", desc: "Produced on or after this date (ignored when lot_id is given)"}
    sql: |
      SELECT pl.lot_id, pl.batch_id, pl.sku, p.name AS product_name, pl.factory_id, f.name AS factory_name, f.supplier_id,
             pl.po_id, pl.qty_produced, pl.produced_at, pl.status, pl.lot_disposition,
             (SELECT count(*) FROM quality_inspections qi WHERE qi.lot_id = pl.lot_id AND qi.pass_fail <> 'pending') AS inspections,
             (SELECT count(*) FROM quality_inspections qi WHERE qi.lot_id = pl.lot_id AND qi.pass_fail = 'fail') AS failed_inspections,
             (SELECT string_agg(m.measurement_type || ' ' || CAST(m.actual_value AS VARCHAR) || ' ' || m.unit || ' (spec ' || CAST(m.spec_value AS VARCHAR) || ')', '; ')
                FROM inspection_measurements m WHERE m.lot_id = pl.lot_id AND NOT m.pass) AS failed_measurements,
             (SELECT count(*) FROM quality_holds h WHERE h.lot_id = pl.lot_id AND h.status = 'active') AS active_holds
      FROM production_lots pl
      JOIN master.products p ON p.sku = pl.sku
      JOIN master.factories f ON f.factory_id = pl.factory_id
      WHERE ($lot_id IS NULL OR pl.lot_id = $lot_id)
        AND ($sku IS NULL OR pl.sku = $sku)
        AND ($factory_id IS NULL OR pl.factory_id = $factory_id)
        AND ($style_id IS NULL OR p.style_id = $style_id)
        AND ($batch_id IS NULL OR pl.batch_id = $batch_id)
        AND (NOT COALESCE($failed_only, false) OR EXISTS (SELECT 1 FROM quality_inspections qf WHERE qf.lot_id = pl.lot_id AND qf.pass_fail = 'fail'))
        AND ($lot_id IS NOT NULL OR pl.produced_at >= CAST($date_from AS DATE))
      ORDER BY pl.produced_at, pl.lot_id
    limit: 50
    example: {lot_id: LOT-900009}

  - name: get_quality_defects_for_sku
    desc: Quality defects and issues for a SKU. Lists incidents, holds and defect trends for investigation.
    kind: sql
    args:
      sku: {required: true}
      weeks: {type: int, default: 12, desc: "Weeks of history to review"}
    sql: |
      SELECT qi.incident_id, qi.sku, qi.factory_id, qi.lot_id, qi.issue_description,
             qi.severity, qi.status, qi.created_at,
             COUNT(DISTINCT qh.hold_id) AS holds_related
      FROM quality_incidents qi
      LEFT JOIN quality_holds qh ON qh.related_incident_id = qi.incident_id
      WHERE qi.sku = $sku
        AND qi.created_at >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
      GROUP BY qi.incident_id, qi.sku, qi.factory_id, qi.lot_id, qi.issue_description,
               qi.severity, qi.status, qi.created_at
      ORDER BY qi.created_at DESC
    limit: 50
    example: {sku: SKU-100007}

  - name: get_supplier_qa_results_by_style
    desc: Supplier QA results for a style, per factory and supplier. Returns inspections, defect rate, pass rate and open incidents over recent weeks.
    kind: sql
    args:
      style_id: {required: true, desc: "Style id, e.g. STY-5520"}
      weeks: {type: int, default: 13, desc: "Weeks of inspections to include"}
    sql: |
      SELECT f.factory_id, f.name AS factory_name, f.supplier_id, s.name AS supplier_name,
             count(*) AS inspections, sum(qi.units_inspected) AS units_inspected, sum(qi.defects_found) AS defects_found,
             round(100.0 * sum(qi.defects_found) / nullif(sum(qi.units_inspected), 0), 1) AS defect_rate_pct,
             round(100.0 * count(*) FILTER (WHERE qi.pass_fail = 'pass') / count(*), 1) AS pass_rate_pct,
             count(*) FILTER (WHERE qi.pass_fail = 'fail') AS failed_inspections,
             (SELECT count(*) FROM quality_incidents qn JOIN master.products p2 ON p2.sku = qn.sku
               WHERE p2.style_id = $style_id AND qn.status IN ('open', 'investigating')) AS open_incidents
      FROM quality_inspections qi
      JOIN production_lots pl ON pl.lot_id = qi.lot_id
      JOIN master.products p ON p.sku = pl.sku
      JOIN master.factories f ON f.factory_id = pl.factory_id
      JOIN master.suppliers s ON s.supplier_id = f.supplier_id
      WHERE p.style_id = $style_id AND qi.pass_fail <> 'pending'
        AND qi.inspected_at >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
      GROUP BY f.factory_id, f.name, f.supplier_id, s.name
      ORDER BY defect_rate_pct DESC
    example: {style_id: STY-5520}

  - name: get_supplier_quality_incidents
    desc: Quality incidents for a supplier, newest first, across its factories and products. Optionally filter by severity or status.
    kind: sql
    args:
      supplier_id: {required: true}
      weeks: {type: int, default: 12, desc: "Weeks of history"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Only incidents of this severity"}
      status: {type: enum, values: [open, investigating, resolved, closed], desc: "Only incidents with this status"}
    sql: |
      SELECT qn.incident_id, qn.sku, p.name AS product_name, f.factory_id, f.name AS factory_name, f.supplier_id,
             qn.lot_id, qn.issue_description, qn.severity, qn.status, qn.created_at
      FROM quality_incidents qn
      LEFT JOIN master.products p ON p.sku = qn.sku
      JOIN master.factories f ON f.factory_id = COALESCE(qn.factory_id, p.factory_id)
      WHERE f.supplier_id = $supplier_id
        AND qn.created_at >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
        AND ($severity IS NULL OR qn.severity = $severity)
        AND ($status IS NULL OR qn.status = $status)
      ORDER BY qn.created_at DESC
    limit: 50
    example: {supplier_id: SUP-0053, weeks: 26}

  - name: get_supplier_quality_record
    desc: "Supplier defect and inspection record over recent weeks: defect rate, pass rate, incidents and active holds. Optionally restrict to one product category."
    kind: sql
    args:
      supplier_id: {required: true}
      weeks: {type: int, default: 12, desc: "Weeks of history"}
      category: {desc: "Product category to restrict to, e.g. Bedding"}
    sql: |
      WITH sup_f AS (SELECT factory_id FROM master.factories WHERE supplier_id = $supplier_id),
      ins AS (
        SELECT qi.lot_id, qi.units_inspected, qi.defects_found, qi.pass_fail
        FROM quality_inspections qi
        JOIN production_lots pl ON pl.lot_id = qi.lot_id
        JOIN master.products p ON p.sku = pl.sku
        WHERE pl.factory_id IN (SELECT factory_id FROM sup_f) AND qi.pass_fail <> 'pending'
          AND qi.inspected_at >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
          AND ($category IS NULL OR lower(p.category) = lower($category))
      ), inc AS (
        SELECT qn.incident_id, qn.severity, qn.status
        FROM quality_incidents qn
        LEFT JOIN master.products p ON p.sku = qn.sku
        JOIN master.factories f ON f.factory_id = COALESCE(qn.factory_id, p.factory_id)
        WHERE f.supplier_id = $supplier_id
          AND qn.created_at >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks AS INT) * 7) DAY
          AND ($category IS NULL OR lower(p.category) = lower($category))
      ), hld AS (
        SELECT h.hold_id FROM quality_holds h JOIN master.products p ON p.sku = h.sku
        WHERE p.supplier_id = $supplier_id AND h.status = 'active'
          AND ($category IS NULL OR lower(p.category) = lower($category))
      )
      SELECT s.supplier_id, s.name AS supplier_name, s.country,
             (SELECT count(*) FROM ins) AS inspections,
             (SELECT count(DISTINCT lot_id) FROM ins) AS lots_inspected,
             (SELECT sum(units_inspected) FROM ins) AS units_inspected,
             (SELECT sum(defects_found) FROM ins) AS defects_found,
             round(100.0 * (SELECT sum(defects_found) FROM ins) / nullif((SELECT sum(units_inspected) FROM ins), 0), 1) AS defect_rate_pct,
             round(100.0 * (SELECT count(*) FROM ins WHERE pass_fail = 'pass') / nullif((SELECT count(*) FROM ins), 0), 1) AS pass_rate_pct,
             (SELECT count(*) FROM inc) AS incidents,
             (SELECT count(*) FROM inc WHERE severity IN ('high', 'critical')) AS high_or_critical_incidents,
             (SELECT count(*) FROM inc WHERE status IN ('open', 'investigating')) AS open_incidents,
             (SELECT count(*) FROM hld) AS active_holds
      FROM master.suppliers s WHERE s.supplier_id = $supplier_id
    example: {supplier_id: SUP-0039, category: Bedding}

  - name: list_factory_quality_scorecards
    desc: Weekly quality scorecards (defect rate, pass rate, critical defects, on-time delivery, risk score). Omit factory_id to list the riskiest factory-weeks first.
    kind: sql
    args:
      factory_id: {}
      period_from: {type: date, default: "-28d", desc: "Earliest week to include (YYYY-MM-DD or e.g. -90d)"}
      min_risk_score: {type: float, desc: "Only weeks with at least this risk score"}
    sql: |
      SELECT s.scorecard_id, s.factory_id, f.name AS factory_name, s.period, s.defect_rate_pct, s.pass_rate_pct, s.critical_defects,
             s.on_time_delivery_pct, s.risk_score, s.total_units_inspected, s.defects_found
      FROM factory_quality_scorecards s JOIN master.factories f ON f.factory_id = s.factory_id
      WHERE ($factory_id IS NULL OR s.factory_id = $factory_id)
        AND s.period >= CAST($period_from AS DATE)
        AND ($min_risk_score IS NULL OR s.risk_score >= CAST($min_risk_score AS DOUBLE))
      ORDER BY CASE WHEN $factory_id IS NULL THEN s.risk_score ELSE 0 END DESC, s.period DESC, s.factory_id
    limit: 20
    example: {factory_id: FAC-0087}

  - name: list_preproduction_sample_acceptance_criteria
    desc: Preproduction sample acceptance criteria by style or product type. Lists the tests, thresholds and severity a sample must meet before a PO is released, plus any earlier pre-production reviews of the style.
    kind: draft
    args:
      style_id: {desc: "Style id, e.g. STY-5520, to include its earlier pre-production reviews"}
      product_type: {desc: "Product type for type-specific tests, e.g. insulated lunch box; general criteria always apply"}
    sql:
      criteria: |
        SELECT criterion_id, product_type, test_name, requirement, method, severity FROM sample_acceptance_criteria
        WHERE product_type = 'general' OR ($product_type IS NOT NULL AND lower(product_type) = lower($product_type))
        ORDER BY CASE WHEN product_type = 'general' THEN 1 ELSE 0 END, criterion_id
      review: SELECT review_id, style_id, review_type, status, findings FROM quality_reviews WHERE $style_id IS NOT NULL AND style_id = $style_id AND review_type = 'pre_production'
    template: |
      PREPRODUCTION SAMPLE ACCEPTANCE CRITERIA

      Style: {{ style_id or '-' }}
      Product type: {{ product_type or 'general' }}
      Date: {{ as_of }}

      Release rule: the PO is released only when every critical test below passes on the preproduction sample (minimum 3 pieces);
      any critical failure needs a corrective action discussion and a resubmitted sample.

      {% for c in criteria %}
      - [{{ c.severity }}] {{ c.test_name }} ({{ c.product_type }}): {{ c.requirement }} Method: {{ c.method }}.
      {% endfor %}

      {% if review %}
      Previous Reviews:
      {% for r in review %}
      - {{ r.review_id }} ({{ r.review_type }}): {{ r.findings }}
      {% endfor %}
      {% endif %}

      Contact: Quality Team
    example: {style_id: STY-5520}

  - name: search_knowledge_base_for_tolerance_standards
    desc: Search knowledge base for tolerance standards. Returns industry and internal standards for measurement specifications.
    kind: draft
    args:
      search_term: {required: true, desc: "Search term, e.g. 'cotton shrinkage', 'zip strength', 'colour fastness'"}
      material: {desc: "Optional: material type, e.g. cotton, polyester, silk"}
    sql:
      standards: SELECT 'Standard document' AS title, 'ISO 3759 for knit shrinkage' AS content UNION ALL SELECT 'AATCC Test Method 135', 'Dimensional change in automatic home laundering of fabric specimens'
    template: |
      TOLERANCE STANDARDS SEARCH RESULTS

      Query: {{ search_term }}
      Search Date: {{ as_of }}

      Relevant Industry Standards:
      1. ISO 3759:2011 - Preparation, marking and measurement of flat knitted fabric and related products for testing dimensions
      2. AATCC Test Method 135 - Dimensional changes of fabric after laundering
      3. BS 5441:1988 - Method for assessment of fabric drape
      4. ASTM D6775-12 - Standard Guide for Care Symbols for Textile Wearing Apparel

      Common Tolerance Ranges by Material:
      - Cotton wovens: ±2.5% on length and width
      - Cotton knits: ±3.0% on length and width (post-wash)
      - Polyester blends: ±2.0% on length and width
      - Silk: ±1.5% (delicate; minimize washing)

      ZIP/BUTTON STRENGTH STANDARDS:
      - Zip pull strength: ≥100N minimum
      - Button shank strength: ≥15N minimum
      - Snap strength: ≥50N minimum

      FOR COLOUR FASTNESS:
      - ISO 105-C06:2010 - Color fastness to domestic/commercial laundering
      - Minimum Grade 3 for most products
      - Grade 4 minimum for premium ranges
      - Rub fastness (AATCC 8): Grade 3+ minimum

      Internal Company Guidelines:
      - Standard tolerance band: ±5% of specification value
      - Tighter tolerances (±2%) for premium or technical products
      - Looser tolerances (±7%) only with buyer approval

      Contact: Quality Assurance Team
    example: {search_term: "cotton shrinkage"}

  - name: send_supplier_corrective_action_request
    desc: Send a drafted corrective action request to the supplier. Sets its status from draft to sent and records the send time.
    kind: update
    table: supplier_corrective_actions
    set: {status: sent, sent_on: "$as_of"}
    args:
      car_id: {required: true}
    example: {car_id: CAR-900001}

  - name: send_supplier_notification
    desc: Send a quality notification to a supplier or factory about an issue, lot or incident, and record it as sent.
    kind: insert
    table: supplier_notifications
    id_prefix: SPN-
    defaults: {status: sent}
    args:
      supplier_id: {required: true}
      factory_id: {}
      lot_id: {}
      incident_id: {}
      issue_description: {required: true}
      requested_action: {required: true, desc: "Action requested from the supplier"}
    example: {supplier_id: SUP-0036, factory_id: FAC-0072, lot_id: LOT-900016, issue_description: "Lot rejected: zip strength 4% under specification", requested_action: "Investigate zip supplier and confirm corrective action"}

  - name: update_lot_disposition
    desc: Set a production lot's QA disposition to release, rework or reject. Returns the old and new disposition.
    kind: update
    table: production_lots
    args:
      lot_disposition: {required: true, type: enum, values: [release, rework, reject], desc: "QA disposition decision"}
    example: {lot_id: LOT-900001, lot_disposition: reject}
