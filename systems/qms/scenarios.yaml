    args:
      search_term: zip strength
    expect:
    - STD-900008
    - zip
    - strength
- question: 06:53:Q1
  story: >-
    Returns show 'too tight at hip' for size 14 trousers (style T-4410). Size 14 (SKU-100651, FAC-0072) lots run small at the hip: LOT-900004 has a hip_width of 94.1 cm against a 95.5 cm spec with a 94.5-96.5 cm tolerance
    band, and four earlier lots read 94.1-94.6 cm (four of the five out of tolerance, all low).
  checks:
  - tool: calculate_measurement_deviation_vs_tolerance
    args:
      lot_id: LOT-900004
      measurement_type: hip_width
    expect:
    - MSR-900010
    - deviation
    - '94.1'
- question: 06:53:Q4
  story: 'Setting tolerance for a new knit product. Factory process capability is evaluated (FAC-0001 has 12-week pass rate of 80-88%). Recommended tolerance calculated based on material shrinkage and factory
    capability.

    '
  checks:
  - tool: calculate_recommended_tolerance
    args:
      factory_id: FAC-0001
      material: cotton
      measurement_type: shrinkage
      construction: knit
    expect:
    - recommended_tolerance_pct
    - FAC-0001
    - pass_rate
    - STD-900001
