# One entry per question row that uses this system's tools (see: python -m mockmcp brief qms).
# Stage 1 of 2: these scenarios exercise only the 14 stage 1 tools.

- question: "01:8:Q4"
  story: >
    Stock discrepancy of £1.2m found between ERP and WMS systems. Root cause analysis needed to identify whether
    it's a timing issue, status mapping problem, or real discrepancy. Quality incidents and holds are reviewed
    to rule out quality-related inventory blocks.
  checks:
    - tool: draft_root_cause_report
      args: {analysis_context: "stock discrepancy"}
      expect: ["ROOT CAUSE ANALYSIS", "Quality Team", "Incidents", "Holds"]

- question: "02:21:Q1"
  story: >
    Returns forecast shows 200 units expected next week. Reverse logistics team is investigating top returned styles.
    Top five returning styles are sent for QA review to determine if quality is a driver of returns (vs sizing/expectation).
    Styles STY-5520 and STY-7731 are opened for top-returns review.
  checks:
    - tool: create_quality_review_request
      args: {style_id: STY-5520, review_type: top_returns}
      expect: ["REV-", "open", "STY-5520"]
    - tool: create_quality_review_request
      args: {style_id: STY-7731, review_type: top_returns}
      expect: ["REV-", "open", "STY-7731"]

- question: "04:40:Q1"
  story: >
    Packaging buyer comparing corrugated carton, moulded pulp, and recycled plastic for small-appliance packaging.
    Damage rate is a key input to total cost calculation. Last 12 weeks of damage data by pack type shows carton at 1.7%,
    rigid_box at 0.4%, and polybag at 6.8%.
  checks:
    - tool: get_damage_rate_by_pack_type
      args: {pack_type: carton, period_weeks: 12}
      expect: ["carton", "damage_rate_pct", "total_units_shipped"]
    - tool: get_damage_rate_by_pack_type
      args: {pack_type: rigid_box, period_weeks: 12}
      expect: ["rigid_box", "damage_rate_pct"]
    - tool: get_damage_rate_by_pack_type
      args: {pack_type: polybag, period_weeks: 12}
      expect: ["polybag", "damage_rate_pct"]

- question: "04:40:Q3"
  story: >
    Breakage on glass items is up 40%. Quality investigation opened to determine root cause: is it packaging,
    carrier handling, or warehouse handling? Investigation INV-900004 tracks the multi-factor analysis.
  checks:
    - tool: create_quality_investigation
      args: {scope: "Glass item breakage claims up 40% — packaging vs carrier vs handling"}
      expect: ["INV-", "open", "breakage"]

- question: "04:40:Q6"
  story: >
    Competitor analysis of e-commerce packaging includes benchmarking damage rates. QMS provides historical
    damage tracking by pack type to understand cost implications of different approaches.
  checks:
    - tool: get_damage_rate_by_pack_type
      args: {period_weeks: 12}
      expect: ["damage_rate_pct", "periods_tracked"]

- question: "05:42:Q5"
  story: >
    Complaints about shoe sole separation are up over three months. Factory defect inspection results show
    multiple batches from FAC-0003 have sole separation failures. Incident INC-900004 is opened and affected
    batches LOT-900008 are placed on hold.
  checks:
    - tool: get_factory_defect_inspection_results
      args: {factory_id: FAC-0003, inspection_type: inline, date_from: "-60d"}
      expect: ["inspection_id", "INS-", "LOT-"]
    - tool: create_quality_incident
      args: {sku: SKU-100014, factory_id: FAC-0003, issue_description: "Sole separation failures in returns"}
      expect: ["INC-", "sole separation", "open"]

- question: "05:44:Q2"
  story: >
    Leather bag failed chromium VI test. Incident INC-900001 was raised. Supplier notification drafted and sent
    to the tannery to inform them of the regulatory issue. Traceability and batch holding follows.
  checks:
    - tool: draft_supplier_notification
      args: {incident_id: INC-900001}
      expect: ["QUALITY NOTIFICATION", "Quality issue", "Quality Team"]
    - tool: create_quality_incident
      args: {issue_description: "Chromium VI test failure - regulatory risk"}
      expect: ["INC-", "incident_id", "open"]

- question: "06:53:Q1"
  story: >
    Returns show "too tight at hip" for size 14 trousers (style T-4410). Inspection measurements are compared
    against tolerance. Lot LOT-900004 measurements show deviation from spec, particularly in chest_width where
    actual is 98.2mm vs 100.0mm spec with tolerance band of 95-105mm.
  checks:
    - tool: calculate_measurement_deviation_vs_tolerance
      args: {lot_id: LOT-900004, measurement_type: chest_width}
      expect: ["measurement_id", "MSR-", "deviation", "actual_value"]

- question: "06:53:Q4"
  story: >
    Setting tolerance for a new knit product. Factory process capability is evaluated (FAC-0001 has 12-week
    pass rate of 80-88%). Recommended tolerance calculated based on material shrinkage and factory capability.
  checks:
    - tool: calculate_recommended_tolerance
      args: {factory_id: FAC-0001, material: cotton, measurement_type: length}
      expect: ["recommended_tolerance_mm", "FAC-0001", "pass_rate"]

- question: "06:54:Q1"
  story: >
    Sales and ratings for best-selling 1.7L kettle (K-1700) have been dropping for eight weeks. Quality hold
    placed on affected batch pending investigation of potential quality defects as driver of the decline.
  checks:
    - tool: create_quality_hold_for_sku
      args: {sku: K-1700, hold_reason: "Defect pattern detected; investigating root cause"}
      expect: ["HLD-", "K-1700", "active"]

- question: "06:55:Q3"
  story: >
    Packaging designer comparing rigid box vs flexible pouch for new product. Total cost per unit includes
    freight, pallet fill, and damage. Damage rate by pack type shows rigid_box at 0.4% vs polybag at 6.8%,
    which significantly impacts total cost.
  checks:
    - tool: get_damage_rate_by_pack_type
      args: {pack_type: rigid_box, period_weeks: 12}
      expect: ["rigid_box", "damage_rate_pct"]
    - tool: get_damage_rate_by_pack_type
      args: {pack_type: polybag, period_weeks: 12}
      expect: ["polybag", "damage_rate_pct"]

- question: "04:32:Q3"
  story: >
    Category buyer comparing three suppliers on landed cost, lead time, quality record, and capacity for
    bedding range. Quality record from QMS shows supplier SUP-0001 has 2.1% defect rate over 12 weeks with
    0 critical issues, SUP-0002 has 3.5% defect rate with 2 critical issues. Supplier SUP-0001 selected for award.
  checks:
    - tool: get_supplier_quality_record
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001", "defect_rate_pct", "total_inspections"]
    - tool: get_supplier_quality_record
      args: {supplier_id: SUP-0002}
      expect: ["SUP-0002", "defect_rate_pct", "total_inspections"]

- question: "04:32:Q6"
  story: >
    Category buyer monitoring suppliers for risk alerts. SUP-0001 quality incidents show 1 critical safety
    issue (Battery connector defect) in the last 12 weeks at FAC-0001. SUP-0002 shows 2 high-severity issues
    (zipper strength, sole separation) across FAC-0002 and FAC-0003. Quality incidents retrieved to assess reliance.
  checks:
    - tool: get_supplier_quality_incidents
      args: {supplier_id: SUP-0001, weeks: 12}
      expect: ["SUP-0001", "incident_id", "INC-", "factory"]
    - tool: get_supplier_quality_incidents
      args: {supplier_id: SUP-0002, weeks: 12}
      expect: ["SUP-0002", "incident_id", "INC-"]

- question: "04:34:Q6"
  story: >
    Sourcing manager comparing nearshore and Asian suppliers on quality and reaction time. Nearshore pilot
    suppliers (SUP-0001 at FAC-0002) show 2.1% defect rate vs Asian baseline. QMS quality records for
    SKU-101897 show supplier pass rates and defect trends for performance comparison.
  checks:
    - tool: search_knowledge_base_for_tolerance_standards
      args: {search_term: "quality standards"}
      expect: ["TOLERANCE", "industry", "standards"]

- question: "04:35:Q1"
  story: >
    Supplier relationship manager investigating SUP-0001 performance decline over two quarters. Quality
    incidents show 2 critical/high-severity issues in the last 12 weeks related to factory FAC-0001.
    Supplier quality record shows overall defect trends and incident count to assess recovery prospects.
  checks:
    - tool: get_supplier_quality_record
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001", "total_incidents", "defect_rate_pct"]
    - tool: get_supplier_quality_incidents
      args: {supplier_id: SUP-0001, weeks: 12}
      expect: ["INC-", "SUP-0001"]

- question: "05:42:Q1"
  story: >
    QA technologist reviewing seven bulk lots of dress that failed colourfastness to rubbing test
    over two months. Lots LOT-900009 through LOT-900015 all from FAC-0002 show colourfastness failures below
    spec. Production lot details show all seven are from SKU-101897/SKU-101904/SKU-101911 and supplier SUP-0001.
    CAR-900005 sent to supplier requesting dye house audit. Hold placed on unshipped stock.
  checks:
    - tool: get_production_lot_details
      args: {lot_id: LOT-900009}
      expect: ["LOT-900009", "SKU-101897", "FAC-0002", "qty_produced"]
    - tool: get_inspection_measurements_for_style
      args: {style_id: "STY-5520"}
      expect: ["colourfastness", "actual_value", "spec_value"]
    - tool: send_supplier_corrective_action_request
      args: {car_id: CAR-900005}
      expect: ["CAR-900005", "sent"]

- question: "05:42:Q2"
  story: >
    QA technologist evaluating LOT-900016 which passed inline inspection but zip strength measured 96N
    (4% under 100N spec). Zip strength is within tolerance band (95-105N) but below ideal. Decision needed
    on release, rework, or reject. Lot disposition updated to release with condition.
  checks:
    - tool: get_inspection_measurements_for_style
      args: {style_id: "STY-T-4410", measurement_type: zip_strength}
      expect: ["zip_strength", "actual_value", "spec_value"]
    - tool: update_lot_disposition
      args: {lot_id: LOT-900016, disposition: release}
      expect: ["DSP-", "LOT-900016", "release"]

- question: "05:42:Q4"
  story: >
    QA technologist forecasting factory risks for next season. Factory quality scorecards over 12 weeks show
    FAC-0001 with highest risk score (average 52.0) and worst defect rate trend (8.3% peak). FAC-0002 performs
    well (18% average risk). Inspection bookings placed for additional inline inspections at top three riskiest
    factories: FAC-0001, FAC-0002, and FAC-0003.
  checks:
    - tool: list_factory_quality_scorecards
      args: {factory_id: FAC-0001}
      expect: ["FAC-0001", "risk_score", "defect_rate_pct"]
    - tool: get_factory_defect_rate_trend
      args: {factory_id: FAC-0001, weeks: 12}
      expect: ["FAC-0001", "period", "defect_rate_pct"]
    - tool: create_inspection_booking
      args: {lot_id: LOT-900001, factory_id: FAC-0001, units_inspected: 50, scheduled_at: "+5d"}
      expect: ["INS-", "LOT-900001", "scheduled_at"]

- question: "06:51:Q2"
  story: >
    New product developer comparing three factories on tooling cost, capability, lead time and compliance.
    Factory compliance record pulled from QMS factory_quality_scorecards showing FAC-0001 with average
    pass rate 85% over 12 weeks. Preproduction sample acceptance criteria defined: 3 piece sample minimum
    with zero critical defects, max 1 minor defect allowed. All samples tested to ISO standards.
  checks:
    - tool: list_preproduction_sample_acceptance_criteria
      args: {style_id: "STY-5520"}
      expect: ["ACCEPTANCE CRITERIA", "sample", "visual inspection"]
    - tool: get_factory_process_capability
      args: {factory_id: FAC-0001}
      expect: ["FAC-0001", "avg_pass_rate_pct", "avg_defect_rate_pct"]

- question: "06:51:Q4"
  story: >
    Technical designer evaluating backpack sample that failed zip pull strength test. Search knowledge base
    for failure modes and zip strength standards. Standard zip strength spec is 100N minimum, so 96N failure
    requires either retest or corrective action request to supplier.
  checks:
    - tool: search_knowledge_base_for_tolerance_standards
      args: {search_term: "zip strength"}
      expect: ["STANDARDS", "zip", "strength"]
