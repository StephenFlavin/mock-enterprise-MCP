- question: 05:42:Q1
  story: Seven pink polyester blouse lots (LOT-900009 to LOT-900015, BATCH-POL-PINK-001 to 007, SKU-100007/14/21, style STY-4012) from FAC-0121 (SUP-0064 Wright Garments Group) failed rubbing fastness (grade
    2-3 vs 4); 4,200 units produced. Earlier lots on the old recipe passed. The CAR is drafted, created as draft and then sent.
  checks:
  - tool: get_production_lot_details
    args:
      style_id: STY-4012
      failed_only: true
      date_from: -60d
    expect:
    - LOT-900009
    - BATCH-POL-PINK-007
    - FAC-0121
    - SUP-0064
    - colourfastness_to_rubbing
  - tool: draft_supplier_corrective_action_request
    args:
      supplier_id: SUP-0064
    expect:
    - Wright Garments Group
    - 7 lots
    - 4200 units
    - BATCH-POL-PINK-004
  - tool: create_supplier_corrective_action_request
    args:
      supplier_id: SUP-0064
      factory_id: FAC-0121
      sku: SKU-100007
      issue_description: Colourfastness to rubbing failures on seven polyester blouse lots
      requested_action: Dye house audit and root cause analysis
    expect:
    - CAR-900005
    - draft
    - FAC-0121
  - tool: send_supplier_corrective_action_request
    args:
      car_id: CAR-900005
    expect:
    - CAR-900005
    - sent
- question: 05:42:Q2
