# One entry per question row that uses this system's tools (see: python -m mockmcp brief qms).

- question: 01:8:Q4
  story: 'The £1.2m ERP-WMS gap is partly stock under quality hold: 15 active holds put 24,338 units (about £1.05m) at DC1 and DC3 into WMS quarantine, which ERP still books as stock. Two earlier hold waves
    show it recurs. draft_root_cause_report totals the holds by site, lists the largest and the earlier waves.'
  checks:
  - tool: draft_root_cause_report
    args:
      analysis_context: ERP vs WMS stock gap
    expect:
    - ROOT CAUSE ANALYSIS
    - 24338 units
    - 1,050,008
    - 'DC3: 7 holds'
    - 'DC1: 8 holds'
    - SKU-103661
    - 6 holds
- question: 02:21:Q1
  story: 'Supplier QA for the top returned styles: STY-5520 (FAC-0002, SUP-0001) is worst at 6.8% defects and about 13% pass rate (zips); STY-7731 (FAC-0042) is clean at 1.5%; T-4410, PF-220 and K-1700
    sit in between. A QA review is then opened per style.'
  checks:
  - tool: get_supplier_qa_results_by_style
    args:
      style_id: STY-5520
    expect:
    - FAC-0002
    - SUP-0001
    - '6.8'
  - tool: get_supplier_qa_results_by_style
    args:
      style_id: STY-7731
    expect:
    - FAC-0042
    - SUP-0022
    - '1.5'
  - tool: create_quality_review_request
    args:
      style_id: STY-5520
      review_type: top_returns
    expect:
    - REV-
    - open
    - STY-5520
  - tool: create_quality_review_request
    args:
      style_id: STY-7731
      review_type: top_returns
    expect:
    - REV-
    - open
    - STY-7731
