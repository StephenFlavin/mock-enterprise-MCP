    notified.
  checks:
  - tool: get_production_lot_details
    args:
      lot_id: LOT-900016
    expect:
    - LOT-900016
    - FAC-0072
    - SUP-0036
    - pending
  - tool: update_lot_disposition
    args:
      lot_id: LOT-900016
      lot_disposition: reject
    expect:
    - LOT-900016
    - pending
    - reject
  - tool: send_supplier_notification
