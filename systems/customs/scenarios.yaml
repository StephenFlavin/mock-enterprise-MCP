- question: "02:13:Q5"
  story: A shipment from India with HS 3004 medicines is checked for dangerous goods restrictions. The check_dangerous_goods_restrictions tool returns any restrictions on medicines from this route.
  checks:
    - tool: check_dangerous_goods_restrictions
      args: {hs_code: "3004", origin_country: India, destination_country: GB}
      expect: ["licensed", "UN3082"]

- question: "02:14:Q1"
  story: "Tariff rates are retrieved for HS 6110 (cotton knit tops) from Vietnam, Bangladesh and Turkey to GB. The system returns current duty rates and shows preferential rates available under UK-Vietnam agreement."
  checks:
    - tool: get_additional_tariffs_and_trade_remedies
      args: {hs_code: "6110"}
      expect: ["REM-910001", "Vietnam", "US reciprocal"]

- question: "02:14:Q2"
  story: "A padded gilet classification is reviewed. The draft_classification_evidence_checklist tool generates a checklist for HS 6110, showing required documentation for customs authority review."
  checks:
    - tool: draft_classification_evidence_checklist
      args: {hs_code: "6110"}
      expect: ["HS Code", "6110", "bill of materials", "commercial invoices"]

- question: "02:14:Q2 (continued)"
  story: "A binding ruling application is created for the padded gilet. The create_binding_ruling_application tool creates a draft application comparing HS 6114 and 6204."
  checks:
    - tool: create_binding_ruling_application
      args: {product_description: "Padded gilet with detachable liner", hs_code_applied: "6114", hs_code_alternative: "6204", argument_for_applied: "Composite garment", argument_for_alternative: "Separate garments"}
      expect: ["BRG-"]

- question: "02:14:Q3"
  story: "Eleven shipments from SUP-0052 (Heath Products, Bangladesh, kids' wear HS 6209) are held at customs because the UK DCTS preference was claimed without an origin declaration or fabric origin statement (Chinese fabric); same supplier as the tax_duty and factory_audit stories. The draft_corrective_action_plan tool generates action plan text based on outstanding holds for a supplier."
  checks:
    - tool: draft_corrective_action_plan
      args: {supplier_id: SUP-0052}
      expect: ["Corrective Action Plan", "SUP-0052", "HLD-910004", "origin"]

- question: "02:14:Q5"
  story: "Preferential eligibility for Vietnam apparel is checked. The get_required_origin_documents tool returns required documents for UK-Vietnam trade agreement."
  checks:
    - tool: get_required_origin_documents
      args: {origin_country: Vietnam, destination_country: GB}
      expect: ["certificate_of_origin", "Vietnam"]

- question: "02:14:Q7"
  story: "Inward processing relief is investigated. The create_customs_authorisation_application creates a draft IPR authorisation. Later, get_customs_authorisation_conditions returns the conditions for approved authorisations."
  checks:
    - tool: create_customs_authorisation_application
      args: {auth_type: inward_processing, supplier_id: SUP-0001, description: "IPR for re-export goods", conditions_text: "Standard conditions"}
      expect: ["AUTH-"]
    - tool: get_customs_authorisation_conditions
      args: {auth_id: AUTH-900002}
      expect: ["approved", "bonded_warehouse"]

- question: "02:14:Q8"
  story: >
    De minimis thresholds by destination: GB 135 (relief due to go on 2027-04-01), the US exemption (about 630) withdrawn on
    2026-07-01, and the EU 150 EUR (about 130) exemption in Germany, France and Ireland due to go on 2027-07-01, the same dates
    as tax_duty market_rules.
  checks:
    - tool: get_de_minimis_thresholds_by_country
      args: {country_code: GB}
      expect: ["GB", "135", "due to be removed"]
    - tool: get_de_minimis_thresholds_by_country
      args: {}
      expect: ["630", "withdrawn", "130", "still applies", "change_effective_date"]

- question: "05:46:Q6"
  story: "Import volumes for cotton (HS 6110) from high-risk regions are reviewed. The calculate_volume_share_by_origin tool shows that Vietnam represents 20% of total volume. Then get_import_volumes_by_hs_code_and_origin retrieves monthly volumes by origin."
  checks:
    - tool: calculate_volume_share_by_origin
      args: {hs_code: "6110"}
      expect: ["volume_share", "origin_country"]
    - tool: get_import_volumes_by_hs_code_and_origin
      args: {hs_prefix: "6110", origin_country: Vietnam}
      expect: ["6110", "Vietnam", "quantity_units"]

- question: "07:67:Q4"
  story: "Duty drawback opportunities are identified. The create_duty_drawback_claim tool creates a draft claim for duty saved on re-exported goods. The get_first_sale_candidates tool identifies transactions eligible for first-sale valuation."
  checks:
    - tool: get_first_sale_candidates
      args: {date_from: "-180d"}
      expect: ["eligible_for_first_sale"]
    - tool: create_duty_drawback_claim
      args: {declaration_id: DEC-900001, claim_amount_gbp: 2500.00, reason: "Goods re-exported to Ireland"}
      expect: ["DBC-"]

- question: "08:80:Q2"
  story: "A franchise order is delayed. The get_customs_clearance_status_for_shipments tool returns that SHP-900001 was cleared. The get_lead_time_to_destination tool shows Dhaka-London sea lead time."
  checks:
    - tool: get_customs_clearance_status_for_shipments
      args: {po_id: PO-2026-004001}
      expect: ["SHP-", "clearance_status"]
    - tool: get_lead_time_to_destination
      args: {origin_port: Dhaka, destination_port: London, mode: sea}
      expect: ["lead_time_days", "32"]

- question: "Customs declarations check"
  story: "Declaration DEC-900001 for shipment SHP-900001 containing cotton knits from Vietnam is checked. The tool returns the full declaration with HS code 6110, quantity, value and duty amount."
  checks:
    - tool: get_customs_declaration_details
      args: {declaration_id: DEC-900001}
      expect: ["DEC-900001", "6110", "cleared"]

- question: "Customs queries check"
  story: "Queries on supplier SUP-0002 are retrieved to understand customs issues. The tool returns recent queries on classification and valuation matters."
  checks:
    - tool: get_customs_query_correspondence
      args: {supplier_id: SUP-0002}
      expect: ["query_type", "description"]

- question: "02:13:Q3"
  story: "Air freight coordinator checks dangerous goods restrictions for batteries from Dhaka to London. The search_dangerous_goods_restrictions tool returns any licensed or prohibited status for relevant HS codes."
  checks:
    - tool: search_dangerous_goods_restrictions
      args: {origin_country: Bangladesh, destination_country: GB}
      expect: ["restriction_type", "description"]

- question: "02:14:Q4"
  story: "Tariff impact of 15% footwear tariff from Vietnam is analyzed. The get_tariff_rates_by_hs_code_and_country tool returns current rates for footwear (HS 6204) from Vietnam to GB."
  checks:
    - tool: get_tariff_rates_by_hs_code_and_country
      args: {hs_code: "6403", origin_country: Vietnam, destination_country: GB}
      expect: ["6403", "Vietnam", "UK-Vietnam FTA"]

- question: "02:14:Q6"
  story: "Forced-labour import risks are reviewed. The list_customs_detentions tool returns recent holds and seizures at the border, showing classification and documentation issues."
  checks:
    - tool: list_customs_detentions
      args: {date_from: "-180d"}
      expect: ["hold_id", "hold_reason"]

- question: "05:43:Q4"
  story: "Factory audit findings require corrective action planning. The draft_corrective_action_plan tool generates action plan for supplier SUP-0001 with outstanding holds."
  checks:
    - tool: draft_corrective_action_plan
      args: {factory_id: FAC-0001}
      expect: ["Corrective Action Plan", "FAC-0001", "HLD-910204"]

- question: "05:46:Q4"
  story: "Due diligence exposure for cotton is assessed. The get_import_volumes_by_hs_code_and_origin tool returns monthly volumes for HS 6110 from various origins including Bangladesh."
  checks:
    - tool: get_import_volumes_by_hs_code_and_origin
      args: {hs_prefix: "61", period_from: "-12m"}
      expect: ["6109", "China", "quantity_units"]

- question: "07:67:Q2"
  story: "Tariff mitigation options for Turkey goods are explored. The search_preferential_origin_rules tool shows which routes and products qualify for preferential treatment."
  checks:
    - tool: search_preferential_origin_rules
      args: {trade_agreement: "CPTPP"}
      expect: ["trade_agreement", "eligibility_criteria"]

- question: "07:67:Q7"
  story: "Retrospective price adjustment on PO-2026-004001 requires amendment of prior customs declarations. The list_affected_customs_declarations tool returns all declarations for that PO, then submit_customs_declaration_amendment is used to file amendments."
  checks:
    - tool: list_affected_customs_declarations
      args: {po_id: "PO-2026-004001", date_from: "-6m"}
      expect: ["declaration_id", "declared_value_gbp"]
    - tool: submit_customs_declaration_amendment
      args: {declaration_id: DEC-900001, amendment_type: "valuation", description: "Correction for retrospective price adjustment"}
      expect: ["AMN-"]

- question: "07:67:Q8"
  story: "Classification positions are reviewed for risk. The list_classification_positions tool returns positions with high risk ratings. The search_classification_rulings tool shows prior rulings on similar codes. Finally, submit_binding_ruling_application updates a ruling to submitted status."
  checks:
    - tool: list_classification_positions
      args: {risk_rating: high}
      expect: ["position_id", "risk_rating"]
    - tool: search_classification_rulings
      args: {}
      expect: ["ruling_id", "status"]
    - tool: submit_binding_ruling_application
      args: {ruling_id: BRG-900001}
      expect: ["submitted"]
