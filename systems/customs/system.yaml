id: customs
name: Customs & Trade Compliance System
instructions: >
  Trade agreements, tariff rates, HS codes, origin rules, binding rulings and customs declarations.
  Use it for duty calculations, classification evidence, tariff changes, preferential eligibility
  and tracking customs holds. Declaration ids look like DEC-000123.

tables:
  customs_declarations:
    key: declaration_id
    cols:
      declaration_id: {type: str, desc: "Customs declaration, e.g. DEC-000123"}
      shipment_id: {type: str, desc: "Shipment id"}
      po_id: {type: str, desc: "Purchase order"}
      supplier_id: {type: str, desc: "Supplier"}
      origin_country: {type: str, desc: "Country of origin"}
      destination_country: {type: str, desc: "Destination country"}
      hs_code: {type: str, desc: "HS code applied, e.g. 6110"}
      product_description: {type: str, desc: "Product description"}
      quantity: {type: int, desc: "Quantity in units"}
      declared_value_gbp: {type: float, desc: "Declared customs value in GBP"}
      duty_amount_gbp: {type: float, desc: "Duty amount in GBP"}
      claimed_preference: {type: str, desc: "Trade agreement preference claimed, if any"}
      status: {type: enum, values: [pending, cleared, queried, held, amended, rejected], desc: "Declaration status"}
      declared_at: {type: timestamp, desc: "When declared"}
      cleared_at: {type: timestamp, desc: "When cleared"}
      query_id: {type: str, desc: "Related customs query if any"}
      updated_at: {type: timestamp, desc: "Last updated"}

  shipments:
    key: shipment_id
    cols:
      shipment_id: {type: str, desc: "Shipment, e.g. SHP-000123"}
      po_id: {type: str, desc: "Purchase order"}
      supplier_id: {type: str, desc: "Supplier"}
      origin_country: {type: str, desc: "Country of origin"}
      destination: {type: str, desc: "Destination, e.g. DC1"}
      ship_date: {type: date, desc: "Date shipped"}
      expected_arrival: {type: date, desc: "Expected arrival date"}
      actual_arrival: {type: date, desc: "Actual arrival date"}
      clearance_status: {type: enum, values: [pending, cleared, held, released], desc: "Customs clearance status"}
      hold_reason: {type: str, desc: "Reason if held"}
      cleared_at: {type: timestamp, desc: "When cleared by customs"}
      lead_time_days: {type: int, desc: "Actual lead time in days"}
      updated_at: {type: timestamp, desc: "Last updated"}
      destination_country: {type: str, desc: "Country the goods are cleared into, e.g. GB or UAE"}
      partner_id: {type: str, desc: "Franchise partner receiving the shipment, if any"}

  customs_queries:
    key: query_id
    cols:
      query_id: {type: str, desc: "Query, e.g. QRY-000123"}
      declaration_id: {type: str, desc: "Related declaration"}
      supplier_id: {type: str, desc: "Supplier involved"}
      query_date: {type: date, desc: "When query raised"}
      query_type: {type: enum, values: [classification, valuation, origin, documentation, other], desc: "Type of query"}
      description: {type: str, desc: "Query description"}
      response_date: {type: date, desc: "When response received"}
      response_text: {type: text, desc: "Customs authority response"}
      resolved_at: {type: date, desc: "When resolved"}

  customs_holds:
    key: hold_id
    cols:
      hold_id: {type: str, desc: "Hold, e.g. HLD-000123"}
      shipment_id: {type: str, desc: "Shipment on hold"}
      declaration_id: {type: str, desc: "Declaration on hold"}
      supplier_id: {type: str, desc: "Supplier"}
      hold_date: {type: date, desc: "Date of hold"}
      hold_reason: {type: enum, values: [classification, valuation, origin, dangerous_goods, documentation, forced_labour], desc: "Reason for hold"}
      hold_type: {type: enum, values: [hold, detention, seizure], desc: "Routine clearance hold, or legal detention or seizure at the border"}
      legal_basis: {type: str, desc: "Law or order behind a detention, if any"}
      destination_country: {type: str, desc: "Market where goods were held"}
      goods_description: {type: str, desc: "Goods held"}
      resolved_at: {type: date, desc: "When resolved"}
      resolution_notes: {type: str, desc: "How resolved"}
      financial_impact_gbp: {type: float, desc: "Financial impact of hold"}

  hs_codes:
    key: hs_code
    cols:
      hs_code: {type: str, desc: "HS code, e.g. 6110"}
      description: {type: str, desc: "Code description"}
      category: {type: str, desc: "Category name"}
      base_duty_rate_pct: {type: float, desc: "Base MFN duty rate"}
      classification_guidance: {type: text, desc: "Classification guidance"}
      keywords: {type: str, desc: "Extra search words"}
      evidence_required: {type: text, desc: "Evidence to hold for this classification, separated by semicolons"}
      updated_at: {type: timestamp, desc: "Last updated"}

  tariffs:
    key: tariff_id
    cols:
      tariff_id: {type: str, desc: "Tariff, e.g. TAR-000123"}
      hs_code: {type: str, desc: "HS code"}
      origin_country: {type: str, desc: "Country of origin"}
      destination_country: {type: str, desc: "Destination country"}
      base_rate_pct: {type: float, desc: "Base MFN rate"}
      preferential_rate_pct: {type: float, desc: "Preferential rate if applicable"}
      effective_from: {type: date, desc: "Effective from"}
      effective_to: {type: date, desc: "Effective to"}
      trade_agreement: {type: str, desc: "Trade agreement if preferential"}

  tariff_changes:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change, e.g. CHG-000123"}
      hs_code: {type: str, desc: "HS code"}
      origin_country: {type: str, desc: "Country affected"}
      destination_country: {type: str, desc: "Importing market: GB, EU or US"}
      old_rate_pct: {type: float, desc: "Previous rate"}
      new_rate_pct: {type: float, desc: "New rate"}
      change_date: {type: date, desc: "Date of announcement"}
      effective_date: {type: date, desc: "When effective"}
      reason: {type: str, desc: "Reason for change"}

  additional_remedies:
    key: remedy_id
    cols:
      remedy_id: {type: str, desc: "Remedy, e.g. REM-000123"}
      hs_code: {type: str, desc: "HS code"}
      origin_country: {type: str, desc: "Country of origin"}
      destination_country: {type: str, desc: "Destination"}
      remedy_type: {type: enum, values: [safeguard, anti_dumping, countervailing, other], desc: "Remedy type"}
      additional_rate_pct: {type: float, desc: "Additional duty rate"}
      effective_from: {type: date, desc: "Effective from"}
      effective_to: {type: date, desc: "Effective to"}
      description: {type: str, desc: "Remedy description"}

  origin_rules:
    key: rule_id
    cols:
      rule_id: {type: str, desc: "Rule, e.g. ORG-000123"}
      destination_country: {type: str, desc: "Importing market"}
      how_to_qualify: {type: text, desc: "What the exporter must change or provide to qualify"}
      hs_code: {type: str, desc: "HS code"}
      origin_country: {type: str, desc: "Country of origin"}
      trade_agreement: {type: str, desc: "Trade agreement"}
      rule_description: {type: text, desc: "Rule description"}
      value_content_threshold_pct: {type: float, desc: "Regional value content threshold"}
      required_documents: {type: str, desc: "Required proof documents"}
      eligibility_criteria: {type: text, desc: "Eligibility criteria"}

  de_minimis_thresholds:
    key: country_code
    cols:
      country_code: {type: str, desc: "Country, e.g. GB, DE, US"}
      country_name: {type: str, desc: "Country name"}
      threshold_gbp: {type: float, desc: "Current duty de minimis threshold in GBP (0 = no exemption)"}
      previous_threshold_gbp: {type: float, desc: "Threshold before the latest change in GBP"}
      change_notes: {type: text, desc: "What changed and how duty and VAT now apply"}
      effective_from: {type: date, desc: "Effective from"}
      effective_to: {type: date, desc: "Effective to"}

  dangerous_goods_restrictions:
    key: restriction_id
    cols:
      restriction_id: {type: str, desc: "Restriction, e.g. DGR-000123"}
      hs_code: {type: str, desc: "HS code"}
      material_code: {type: str, desc: "Material code or UN number"}
      origin_country: {type: str, desc: "Origin country if specific"}
      destination_country: {type: str, desc: "Destination if specific"}
      restriction_type: {type: enum, values: [prohibited, licensed, limited], desc: "Type of restriction"}
      description: {type: str, desc: "Restriction details"}
      transport_mode: {type: str, desc: "air, sea or all"}
      updated_at: {type: timestamp, desc: "Last updated"}

  binding_rulings:
    key: ruling_id
    cols:
      ruling_id: {type: str, desc: "Ruling, e.g. BRG-000123"}
      jurisdiction: {type: str, desc: "UK or EU"}
      ruling_reference: {type: str, desc: "Authority reference, blank for our own applications"}
      status: {type: enum, values: [draft, submitted, approved, rejected], desc: "Status"}
      product_description: {type: str, desc: "Product description"}
      hs_code_applied: {type: str, desc: "Applied HS code"}
      hs_code_alternative: {type: str, desc: "Alternative HS code"}
      duty_difference_pct: {type: float, desc: "Duty difference between codes"}
      argument_for_applied: {type: text, desc: "Argument for applied code"}
      argument_for_alternative: {type: text, desc: "Argument for alternative"}
      created_date: {type: date, desc: "Created date"}
      submitted_date: {type: date, desc: "Submitted date"}
      decided_date: {type: date, desc: "Decision date"}
      ruling_decision: {type: str, desc: "Ruling decision if approved"}
      effective_from: {type: date, desc: "Effective from"}

  customs_authorisations:
    key: auth_id
    cols:
      auth_id: {type: str, desc: "Authorisation, e.g. AUTH-000123"}
      status: {type: enum, values: [draft, submitted, approved, rejected, active, inactive], desc: "Status"}
      auth_type: {type: enum, values: [inward_processing, bonded_warehouse, temporary_admission], desc: "Type"}
      supplier_id: {type: str, desc: "Supplier applying"}
      description: {type: str, desc: "Authorisation description"}
      created_date: {type: date, desc: "Created date"}
      submitted_date: {type: date, desc: "Submitted date"}
      decided_date: {type: date, desc: "Decision date"}
      conditions_text: {type: text, desc: "Conditions"}
      valid_from: {type: date, desc: "Valid from"}
      valid_to: {type: date, desc: "Valid to"}

  duty_drawback_claims:
    key: claim_id
    cols:
      claim_id: {type: str, desc: "Claim, e.g. DBC-000123"}
      status: {type: enum, values: [draft, submitted, approved, rejected, paid], desc: "Status"}
      po_id: {type: str, desc: "Purchase order"}
      declaration_id: {type: str, desc: "Declaration claimed"}
      claim_amount_gbp: {type: float, desc: "Claimed amount in GBP"}
      created_date: {type: date, desc: "Created date"}
      submitted_date: {type: date, desc: "Submitted date"}
      decided_date: {type: date, desc: "Decision date"}
      paid_date: {type: date, desc: "Paid date"}
      reason: {type: str, desc: "Reason for claim"}

  classification_positions:
    key: position_id
    cols:
      position_id: {type: str, desc: "Position, e.g. POS-000123"}
      sku: {type: str, desc: "SKU"}
      hs_code: {type: str, desc: "HS code applied"}
      status: {type: enum, values: [active, review, weakest], desc: "Status"}
      valuation_method: {type: enum, values: [transaction_value, identical_goods, similar_goods, deductive, computed, fallback], desc: "Valuation method"}
      risk_rating: {type: enum, values: [low, medium, high], desc: "Risk rating"}
      created_date: {type: date, desc: "Created date"}
      last_reviewed_date: {type: date, desc: "Last reviewed"}
      notes: {type: str, desc: "Notes"}

  first_sale_transactions:
    key: transaction_id
    cols:
      transaction_id: {type: str, desc: "Transaction, e.g. FST-000123"}
      po_id: {type: str, desc: "Purchase order"}
      sku: {type: str, desc: "SKU"}
      supplier_id: {type: str, desc: "Supplier"}
      price_gbp: {type: float, desc: "Price in GBP"}
      transaction_date: {type: date, desc: "Transaction date"}
      original_buyer_name: {type: str, desc: "Original buyer name"}
      first_sale_purchase_price_gbp: {type: float, desc: "First sale purchase price"}
      our_purchase_price_gbp: {type: float, desc: "Our purchase price"}
      eligible_for_first_sale: {type: bool, desc: "Eligible for first-sale valuation"}
      evidence_held: {type: bool, desc: "Evidence of first sale held"}

  lead_times:
    key: route_id
    cols:
      route_id: {type: str, desc: "Route, e.g. RT-000123"}
      origin_port: {type: str, desc: "Origin port/city"}
      destination_port: {type: str, desc: "Destination port/city"}
      origin_country: {type: str, desc: "Origin country"}
      destination_country: {type: str, desc: "Destination country"}
      mode: {type: enum, values: [air, sea, rail], desc: "Transport mode"}
      lead_time_days: {type: int, desc: "Lead time in days"}
      variance_days: {type: int, desc: "Variance in days"}
      last_updated: {type: date, desc: "Last updated"}

  required_origin_documents:
    key: doc_id
    cols:
      doc_id: {type: str, desc: "Document type, e.g. DOC-000123"}
      origin_country: {type: str, desc: "Country of origin"}
      destination_country: {type: str, desc: "Destination country"}
      trade_agreement: {type: str, desc: "Trade agreement if applicable"}
      document_type: {type: enum, values: [certificate_of_origin, invoice, packing_list, bill_of_lading, manufacturing_statement, other], desc: "Document type"}
      required: {type: bool, desc: "Is required"}
      issuing_body: {type: str, desc: "Issuing body"}
      validity_period_months: {type: int, desc: "Validity period in months"}

  import_volumes:
    key: volume_id
    cols:
      volume_id: {type: str, desc: "Volume record, e.g. VOL-000123"}
      hs_code: {type: str, desc: "HS code"}
      origin_country: {type: str, desc: "Country of origin"}
      destination_country: {type: str, desc: "Destination"}
      period_month: {type: str, desc: "Period YYYY-MM"}
      quantity_units: {type: int, desc: "Quantity in units"}
      value_gbp: {type: float, desc: "Value in GBP"}
      duty_paid_gbp: {type: float, desc: "Duty paid in GBP"}

  broker_amendment_requests:
    key: request_id
    cols:
      request_id: {type: str, desc: "Request, e.g. BAR-000123"}
      declaration_id: {type: str, desc: "Declaration to amend"}
      supplier_id: {type: str, desc: "Supplier involved"}
      amendment_type: {type: str, desc: "Type of amendment needed"}
      description: {type: text, desc: "Amendment description"}
      status: {type: enum, values: [sent, acknowledged, completed, rejected], desc: "Status"}
      sent_date: {type: date, desc: "When sent"}
      completed_date: {type: date, desc: "When completed"}

  declaration_amendments:
    key: amendment_id
    cols:
      amendment_id: {type: str, desc: "Amendment, e.g. AMN-000123"}
      declaration_id: {type: str, desc: "Original declaration"}
      amendment_type: {type: str, desc: "Type of amendment"}
      description: {type: text, desc: "Amendment details"}
      status: {type: enum, values: [draft, submitted, approved, rejected], desc: "Status"}
      submitted_date: {type: date, desc: "When submitted"}
      approved_date: {type: date, desc: "When approved"}
      created_date: {type: date, desc: "When created"}

  customs_procedure_rules:
    key: rule_id
    cols:
      rule_id: {type: str, desc: "Rule, e.g. CPR-000123"}
      procedure_type: {type: enum, values: [inward_processing, bonded_warehouse], desc: "Procedure"}
      topic: {type: enum, values: [eligibility, duty_benefit, cash_flow, admin_burden, volume_threshold, conditions, audit_risk], desc: "Topic"}
      jurisdiction: {type: str, desc: "UK"}
      rule_text: {type: text, desc: "Rule or condition"}

tools:
  # Stage 1 - 17 read tools for queries
  - name: calculate_volume_share_by_origin
    desc: Share of import volume by material origin region. Use for due diligence and supply chain risk.
    kind: sql
    args:
      hs_code: {required: true}
      period_from: {type: date, default: "-12m", desc: "Period from"}
    sql: |
      SELECT hs_code, origin_country,
             sum(quantity_units) AS quantity_units,
             sum(value_gbp) AS value_gbp,
             round(100.0 * sum(quantity_units) / sum(sum(quantity_units)) OVER (PARTITION BY hs_code), 1) AS volume_share_pct,
             'volume_share = origin_volume / total_volume * 100' AS formula
      FROM import_volumes
      WHERE hs_code = $hs_code AND period_month >= strftime(CAST($period_from AS DATE), '%Y-%m')
      GROUP BY hs_code, origin_country
      ORDER BY quantity_units DESC
    limit: 50
    example: {hs_code: "6110"}

  - name: check_dangerous_goods_restrictions
    desc: Dangerous-goods restrictions for a shipment lane, optionally by HS code and transport mode. Returns prohibited, licensed or limited status.
    kind: sql
    args:
      origin_country: {required: true, desc: "Country name, e.g. Bangladesh"}
      destination_country: {required: true, desc: "Country name or code, e.g. GB"}
      hs_code: {desc: "HS code, e.g. 8414. Blank returns every restriction on the lane"}
      transport_mode: {desc: "air or sea. Blank includes all"}
    sql: |
      SELECT restriction_id, hs_code, material_code, restriction_type, transport_mode, description, origin_country, destination_country
      FROM dangerous_goods_restrictions
      WHERE lower(origin_country) = lower($origin_country)
        AND lower(destination_country) = lower($destination_country)
        AND ($hs_code IS NULL OR hs_code = $hs_code)
        AND ($transport_mode IS NULL OR transport_mode IN ($transport_mode, 'all'))
      ORDER BY hs_code, restriction_type
    limit: 20
    example: {origin_country: Bangladesh, destination_country: GB, hs_code: "8414"}

  - name: create_binding_ruling_application
    desc: Creates a draft binding tariff ruling application for a product with the two candidate codes and arguments. Returns the new ruling id.
    kind: insert
    table: binding_rulings
    id_prefix: BRG-
    defaults: {status: draft, jurisdiction: UK}
    args:
      product_description: {required: true}
      hs_code_applied: {required: true}
      hs_code_alternative: {required: true}
      argument_for_applied: {required: true}
      argument_for_alternative: {required: true}
      duty_difference_pct: {type: float, desc: "Duty rate difference between the two codes in percentage points"}
      jurisdiction: {type: str, desc: "UK or EU"}
    example: {product_description: "Padded gilet with detachable liner", hs_code_applied: "6202", hs_code_alternative: "6110", argument_for_applied: "Padded outer garment", argument_for_alternative: "Fleece liner gives knitted character", duty_difference_pct: 0.5}

  - name: create_customs_authorisation_application
    desc: Creates a draft application for a customs authorisation such as inward processing relief or bonded warehouse. Returns the new auth id.
    kind: insert
    table: customs_authorisations
    id_prefix: AUTH-
    defaults: {status: draft}
    args:
      auth_type: {required: true, desc: "inward_processing, bonded_warehouse or temporary_admission"}
      description: {required: true}
      conditions_text: {desc: "Proposed scope and conditions, e.g. goods and re-export destinations"}
      supplier_id: {desc: "Supplier or processor involved, if any"}
    example: {auth_type: inward_processing, description: "IPR for goods re-exported to Ireland and the EU", conditions_text: "Re-export to IE and EU within 6 months"}

  - name: create_duty_drawback_claim
    desc: Creates a draft duty drawback claim. Returns the new claim id.
    kind: insert
    table: duty_drawback_claims
    id_prefix: DBC-
    defaults: {status: draft}
    args:
      declaration_id: {required: true}
      po_id: {desc: "Purchase order of the declaration claimed"}
      claim_amount_gbp: {required: true}
      reason: {required: true}
    example: {declaration_id: DEC-900001, claim_amount_gbp: 2500.00, reason: "Goods re-exported"}

  - name: draft_classification_evidence_checklist
    desc: Drafts the evidence checklist to hold for a classification, from the HS code's guidance and required evidence. Returns checklist text.
    kind: draft
    args: [hs_code]
    sql:
      code: SELECT * FROM hs_codes WHERE hs_code = $hs_code
    template: |
      # Classification Evidence Checklist
      {% if code %}
      HS Code: {{ code[0].hs_code }} - {{ code[0].description }}

      Evidence to hold:
      {% for e in code[0].evidence_required.split(';') %}
      - {{ e.strip() }}
      {% endfor %}

      Classification guidance: {{ code[0].classification_guidance }}
      {% else %}
      HS code {{ hs_code }} is not in the classification table. Use search_hs_codes to find the code.
      {% endif %}
    example: {hs_code: "6202"}

  - name: draft_corrective_action_plan
    desc: Drafts a corrective action plan for a supplier, or a factory via its supplier, from customs holds and queries. Returns plan text.
    kind: draft
    args:
      supplier_id: {}
      factory_id: {}
    sql:
      fac: SELECT f.factory_id, f.name, f.country, f.audit_rating, f.last_audit_date, f.supplier_id FROM master.factories f WHERE f.factory_id = $factory_id
      supplier: SELECT s.supplier_id, s.name FROM master.suppliers s WHERE s.supplier_id = COALESCE($supplier_id, (SELECT supplier_id FROM master.factories WHERE factory_id = $factory_id))
      holds: SELECT hold_id, declaration_id, hold_reason, hold_date, financial_impact_gbp, resolution_notes FROM customs_holds WHERE supplier_id = COALESCE($supplier_id, (SELECT supplier_id FROM master.factories WHERE factory_id = $factory_id)) AND resolved_at IS NULL ORDER BY hold_date
      queries: SELECT hold_reason, count(*) AS n, sum(financial_impact_gbp) AS impact FROM customs_holds WHERE supplier_id = COALESCE($supplier_id, (SELECT supplier_id FROM master.factories WHERE factory_id = $factory_id)) AND resolved_at IS NULL GROUP BY hold_reason ORDER BY n DESC
    template: |
      # Corrective Action Plan

      Supplier: {{ supplier[0].name }} ({{ supplier[0].supplier_id }})
      {% if fac %}
      Factory: {{ fac[0].name }} ({{ fac[0].factory_id }}), {{ fac[0].country }}, last audit rating {{ fac[0].audit_rating }} on {{ fac[0].last_audit_date }}
      {% endif %}

      Open customs holds ({{ holds | length }}):
      {% for h in holds %}
      - {{ h.hold_id }} / {{ h.declaration_id }}: {{ h.hold_reason }}, held {{ h.hold_date }}, impact {{ h.financial_impact_gbp | money }}
      {% endfor %}
      {% if queries %}
      Main cause: {{ queries[0].hold_reason }} ({{ queries[0].n }} holds, {{ queries[0].impact | money }}).
      {% endif %}

      Actions:
      1. Supplier: provide the documents and corrections that resolve each open hold (main cause above) within 14 days.
      2. Broker: amend the open declarations and answer the customs queries once the proof is in.
      3. Supplier: hold shipments until documents are checked before dispatch.
      4. Compliance: review past declarations of this supplier for the same issue and quantify reassessment exposure.
      5. Review progress weekly until all holds are released.

      Timeline: 30 days to close open holds, 90 days to verify controls.
    example: {supplier_id: SUP-0008}

  - name: get_additional_tariffs_and_trade_remedies
    desc: Additional tariffs and trade remedies (safeguard, anti-dumping, countervailing, reciprocal) by HS code, origin and destination market, current only.
    kind: sql
    args:
      hs_code: {required: true}
      origin_country: {desc: "Country name, e.g. Vietnam"}
      destination_country: {desc: "GB, EU or US. Blank returns all markets"}
    sql: |
      SELECT remedy_id, hs_code, origin_country, destination_country, remedy_type, additional_rate_pct,
             effective_from, effective_to, description
      FROM additional_remedies
      WHERE hs_code = $hs_code
        AND ($destination_country IS NULL OR destination_country = $destination_country)
        AND ($origin_country IS NULL OR origin_country = $origin_country)
        AND (effective_to IS NULL OR effective_to >= CAST($as_of AS DATE))
      ORDER BY destination_country, origin_country, effective_from DESC
    limit: 30
    example: {hs_code: "6110"}

  - name: get_customs_authorisation_conditions
    desc: Conditions and validity of customs authorisations such as inward processing relief or bonded warehouse, by id, type or status.
    kind: sql
    args:
      auth_id: {}
      auth_type: {type: str, desc: "inward_processing, bonded_warehouse or temporary_admission"}
      status: {type: str, desc: "e.g. approved, draft"}
    sql: |
      SELECT auth_id, auth_type, status, description, conditions_text, valid_from, valid_to
      FROM customs_authorisations
      WHERE ($auth_id IS NULL OR auth_id = $auth_id)
        AND ($auth_type IS NULL OR auth_type = $auth_type)
        AND ($status IS NULL OR status = $status)
      ORDER BY status, valid_from DESC
    limit: 20
    example: {auth_type: bonded_warehouse}

  - name: get_customs_clearance_status_for_shipments
    desc: Retrieves customs clearance status for shipments by purchase order, franchise partner or destination country, with days from arrival to clearance. Shows whether goods are held.
    kind: sql
    args:
      po_id: {}
      partner_id: {desc: "Franchise partner, e.g. PTN-011"}
      destination_country: {type: str, desc: "Country cleared into, e.g. GB or UAE. Blank returns all"}
      date_from: {type: date, default: "-30d", desc: "Shipped from this date"}
    sql: |
      SELECT shipment_id, po_id, partner_id, supplier_id, destination_country, clearance_status, hold_reason,
             ship_date, actual_arrival, cleared_at,
             date_diff('day', actual_arrival, CAST(cleared_at AS DATE)) AS days_to_clear,
             lead_time_days
      FROM shipments
      WHERE ($po_id IS NULL OR po_id = $po_id)
        AND ($partner_id IS NULL OR partner_id = $partner_id)
        AND ($destination_country IS NULL OR destination_country = $destination_country)
        AND ship_date >= CAST($date_from AS DATE)
      ORDER BY ship_date DESC
    limit: 50
    example: {date_from: "-14d"}

  - name: get_customs_declaration_details
    desc: Declaration contents and codes including product, value, duty amount and status.
    kind: sql
    args:
      declaration_id: {required: true}
    sql: |
      SELECT declaration_id, shipment_id, po_id, hs_code, product_description, quantity, claimed_preference,
             declared_value_gbp, duty_amount_gbp, status, declared_at, cleared_at
      FROM customs_declarations
      WHERE declaration_id = $declaration_id
    limit: 1
    example: {declaration_id: DEC-900001}

  - name: get_customs_query_correspondence
    desc: Customs queries and responses for a declaration. Returns query history and resolution status.
    kind: sql
    args:
      declaration_id: {}
      supplier_id: {}
      date_from: {type: date, default: "-90d", desc: "From this date"}
    sql: |
      SELECT query_id, declaration_id, query_date, query_type, description,
             response_date, response_text, resolved_at
      FROM customs_queries
      WHERE ($declaration_id IS NULL OR declaration_id = $declaration_id)
        AND ($supplier_id IS NULL OR supplier_id = $supplier_id)
        AND query_date >= CAST($date_from AS DATE)
      ORDER BY query_date DESC
    limit: 50
    example: {supplier_id: SUP-0002}

  - name: get_de_minimis_thresholds_by_country
    desc: De minimis duty thresholds by destination country with the previous threshold and what changed. Orders under it avoid duty.
    kind: select
    from: de_minimis_thresholds
    filters:
      country_code: {}
      country_name: {op: like}
    columns: [country_code, country_name, threshold_gbp, previous_threshold_gbp, effective_from, effective_to, change_notes]
    order: country_name
    limit: 50
    example: {country_code: US}

  - name: get_first_sale_candidates
    desc: Transactions eligible for first-sale valuation. Use for duty minimisation where applicable.
    kind: sql
    args:
      po_id: {}
      date_from: {type: date, default: "-180d", desc: "From this date"}
    sql: |
      SELECT transaction_id, po_id, sku, supplier_id, price_gbp, transaction_date,
             first_sale_purchase_price_gbp, our_purchase_price_gbp,
             round(our_purchase_price_gbp - first_sale_purchase_price_gbp, 2) AS value_reduction_per_unit_gbp,
             round(100.0 * (our_purchase_price_gbp - first_sale_purchase_price_gbp) / our_purchase_price_gbp, 1) AS value_reduction_pct,
             eligible_for_first_sale, evidence_held
      FROM first_sale_transactions
      WHERE ($po_id IS NULL OR po_id = $po_id)
        AND transaction_date >= CAST($date_from AS DATE)
        AND eligible_for_first_sale = true
      ORDER BY transaction_date DESC
    limit: 50
    example: {date_from: "-180d"}

  - name: get_import_volumes_by_hs_code_and_origin
    desc: Import volumes and value by HS code (prefix, e.g. 61 or 6109) and origin over a period, totalled per code and origin. Set monthly for months.
    kind: sql
    args:
      hs_prefix: {type: str, desc: "HS code or prefix, e.g. 6109 or 61. Blank returns all"}
      origin_country: {desc: "Country name, e.g. China"}
      period_from: {type: date, default: "-12m", desc: "From this period"}
      monthly: {type: bool, desc: "True for one row per month"}
    sql: |
      SELECT hs_code, origin_country,
             CASE WHEN $monthly IS TRUE THEN period_month ELSE 'total' END AS period,
             sum(quantity_units) AS quantity_units, round(sum(value_gbp), 0) AS value_gbp, round(sum(duty_paid_gbp), 0) AS duty_paid_gbp
      FROM import_volumes
      WHERE ($hs_prefix IS NULL OR hs_code LIKE $hs_prefix || '%')
        AND ($origin_country IS NULL OR origin_country = $origin_country)
        AND period_month >= strftime(CAST($period_from AS DATE), '%Y-%m')
      GROUP BY ALL
      ORDER BY value_gbp DESC, period DESC
    limit: 100
    example: {hs_prefix: "61"}

  - name: get_lead_time_to_destination
    desc: Retrieves lead time to destination by origin, mode and lane. Use for urgency decisions.
    kind: sql
    args:
      origin_port: {required: true}
      destination_port: {required: true}
      mode: {}
    sql: |
      SELECT route_id, origin_port, destination_port, origin_country, destination_country,
             mode, lead_time_days, variance_days
      FROM lead_times
      WHERE origin_port = $origin_port
        AND destination_port = $destination_port
        AND ($mode IS NULL OR mode = $mode)
      ORDER BY lead_time_days ASC
    limit: 10
    example: {origin_port: Dhaka, destination_port: London}

  - name: get_required_origin_documents
    desc: Proof-of-origin documents and who issues them, to claim preferential rates by origin, destination and trade agreement.
    kind: sql
    args:
      origin_country: {required: true, desc: "Country name, e.g. Vietnam"}
      destination_country: {desc: "GB, EU or US. Blank returns all"}
      trade_agreement: {}
    sql: |
      SELECT doc_id, origin_country, destination_country, trade_agreement, document_type,
             required, issuing_body, validity_period_months
      FROM required_origin_documents
      WHERE origin_country = $origin_country
        AND ($destination_country IS NULL OR destination_country = $destination_country)
        AND ($trade_agreement IS NULL OR trade_agreement = $trade_agreement)
      ORDER BY destination_country, required DESC, document_type
    limit: 30
    example: {origin_country: Vietnam, destination_country: GB}

  # Stage 2 - 17 new tools

  - name: search_hs_codes
    desc: Candidate HS codes for a product by words in description, category or code fragment. Returns duty rate and classification guidance.
    kind: sql
    args:
      description: {type: str, desc: "Product words, e.g. padded gilet. Any word may match"}
      hs_code: {desc: "HS code or fragment, e.g. 61"}
      category: {}
    sql: |
      SELECT hs_code, description, category, base_duty_rate_pct, classification_guidance
      FROM hs_codes
      WHERE ($hs_code IS NULL OR hs_code LIKE $hs_code || '%')
        AND ($category IS NULL OR lower(category) = lower($category))
        AND ($description IS NULL OR list_bool_or([(description || ' ' || keywords) ILIKE '%' || w || '%' FOR w IN string_split(lower(regexp_replace($description, 's?\\b(for|a|the|with|of)\\b', '', 'g')), ' ') IF length(w) > 2]))
      ORDER BY hs_code
    limit: 20
    example: {description: gilet}

  - name: get_tariff_rates_by_hs_code_and_country
    desc: Current tariff rates by HS code and country pair. Returns base and preferential rates and trade agreement. Leave countries blank for all.
    kind: sql
    args:
      hs_code: {required: true}
      origin_country: {desc: "Country name, e.g. Vietnam"}
      destination_country: {desc: "GB, EU or US"}
    sql: |
      SELECT hs_code, origin_country, destination_country, base_rate_pct, preferential_rate_pct,
             trade_agreement, effective_from, effective_to
      FROM tariffs
      WHERE hs_code = $hs_code
        AND ($origin_country IS NULL OR origin_country = $origin_country)
        AND ($destination_country IS NULL OR destination_country = $destination_country)
        AND (effective_to IS NULL OR effective_to >= CAST($as_of AS DATE))
      ORDER BY origin_country, destination_country
    limit: 50
    example: {hs_code: "6110", origin_country: Vietnam, destination_country: GB}

  - name: get_tariff_change_history
    desc: Tariff changes for an HS code with old and new rates, effective dates and reasons. Includes announced future changes.
    kind: sql
    args:
      hs_code: {required: true}
      origin_country: {desc: "Country name, e.g. Vietnam"}
      destination_country: {desc: "GB, EU or US. Blank returns all"}
      date_from: {type: date, default: "-12m", desc: "Announced from this date"}
    sql: |
      SELECT change_id, hs_code, origin_country, destination_country, old_rate_pct, new_rate_pct,
             change_date, effective_date, reason
      FROM tariff_changes
      WHERE hs_code = $hs_code
        AND ($origin_country IS NULL OR origin_country = $origin_country)
        AND ($destination_country IS NULL OR destination_country = $destination_country)
        AND change_date >= CAST($date_from AS DATE)
      ORDER BY destination_country, origin_country, effective_date DESC
    limit: 50
    example: {hs_code: "6110"}

  - name: get_rules_of_origin_for_hs_code
    desc: Rules of origin for an HS code (chapter-level rules match too) and trade agreement, with how to qualify and proof documents.
    kind: sql
    args:
      hs_code: {required: true}
      origin_country: {desc: "Country name, e.g. Vietnam"}
      trade_agreement: {}
    sql: |
      SELECT rule_id, hs_code, origin_country, destination_country, trade_agreement, rule_description,
             value_content_threshold_pct, required_documents, eligibility_criteria, how_to_qualify
      FROM origin_rules
      WHERE $hs_code LIKE hs_code || '%'
        AND ($origin_country IS NULL OR origin_country = $origin_country)
        AND ($trade_agreement IS NULL OR trade_agreement = $trade_agreement)
      ORDER BY origin_country, trade_agreement, length(hs_code) DESC
    limit: 20
    example: {hs_code: "6110", origin_country: Vietnam}

  - name: search_preferential_trade_agreements
    desc: Trade agreements giving preferential rates by origin and destination market, with the preferential rate for an HS code if given.
    kind: sql
    args:
      origin_country: {desc: "Country name, e.g. Vietnam"}
      destination_country: {desc: "GB, EU or US. Blank returns all"}
      hs_code: {}
    sql: |
      SELECT trade_agreement, origin_country, destination_country, hs_code, base_rate_pct, preferential_rate_pct
      FROM tariffs
      WHERE preferential_rate_pct IS NOT NULL AND trade_agreement IS NOT NULL
        AND ($origin_country IS NULL OR origin_country = $origin_country)
        AND ($destination_country IS NULL OR destination_country = $destination_country)
        AND ($hs_code IS NULL OR hs_code = $hs_code)
        AND (effective_to IS NULL OR effective_to >= CAST($as_of AS DATE))
      ORDER BY origin_country, destination_country, hs_code
    limit: 40
    example: {origin_country: Vietnam, destination_country: GB}

  - name: search_preferential_origin_rules
    desc: Origin rules qualifying for preferential rates by country and product type. Returns RVC and required documentation.
    kind: sql
    args:
      trade_agreement: {}
      origin_country: {}
      hs_code: {desc: "HS code, e.g. 6110. Chapter-level rules (e.g. 61) also match"}
    sql: |
      SELECT rule_id, trade_agreement, origin_country, hs_code, rule_description,
             value_content_threshold_pct, required_documents, eligibility_criteria
      FROM origin_rules
      WHERE ($trade_agreement IS NULL OR trade_agreement = $trade_agreement)
        AND ($origin_country IS NULL OR origin_country = $origin_country)
        AND ($hs_code IS NULL OR $hs_code LIKE hs_code || '%')
      ORDER BY trade_agreement, origin_country
    limit: 30
    example: {trade_agreement: "UK-Vietnam"}

  - name: search_dangerous_goods_restrictions
    desc: Dangerous-goods restrictions for a lane by origin, destination, HS code, material or mode. Covers lithium batteries, flammables and aerosols.
    kind: sql
    args:
      origin_country: {desc: "Country name, e.g. Bangladesh"}
      destination_country: {desc: "Country name or code, e.g. GB"}
      hs_code: {}
      material: {type: str, desc: "Words in material or description, e.g. battery or UN3480"}
      transport_mode: {desc: "air or sea. Blank includes all"}
    sql: |
      SELECT restriction_id, hs_code, material_code, restriction_type, transport_mode, description, origin_country, destination_country
      FROM dangerous_goods_restrictions
      WHERE ($origin_country IS NULL OR lower(origin_country) = lower($origin_country))
        AND ($destination_country IS NULL OR lower(destination_country) = lower($destination_country))
        AND ($hs_code IS NULL OR hs_code = $hs_code)
        AND ($material IS NULL OR (material_code || ' ' || description) ILIKE '%' || $material || '%')
        AND ($transport_mode IS NULL OR transport_mode IN ($transport_mode, 'all'))
      ORDER BY origin_country, hs_code, restriction_type
    limit: 30
    example: {origin_country: Bangladesh, destination_country: GB, material: battery}

  - name: list_classification_positions
    desc: Our tariff classifications and valuation positions by SKU or risk rating. Shows classification risk and method used.
    kind: sql
    args:
      sku: {}
      risk_rating: {}
      status: {}
    sql: |
      SELECT position_id, sku, hs_code, status, valuation_method, risk_rating,
             created_date, last_reviewed_date, notes
      FROM classification_positions
      WHERE ($sku IS NULL OR sku = $sku)
        AND ($risk_rating IS NULL OR risk_rating = $risk_rating)
        AND ($status IS NULL OR status = $status)
      ORDER BY CASE status WHEN 'weakest' THEN 0 WHEN 'review' THEN 1 ELSE 2 END,
               CASE risk_rating WHEN 'high' THEN 0 WHEN 'medium' THEN 1 ELSE 2 END, last_reviewed_date DESC
    limit: 50
    example: {risk_rating: high}

  - name: search_classification_rulings
    desc: Issued binding classification rulings (UK and EU) by HS code, jurisdiction or product words. Returns code, arguments and decision.
    kind: sql
    args:
      hs_code_applied: {}
      jurisdiction: {desc: "UK or EU. Blank returns both"}
      keyword: {type: str, desc: "Words in product description, e.g. padded gilet"}
      status: {desc: "Default approved and rejected decisions; pass draft or submitted for our own applications"}
    sql: |
      SELECT ruling_id, jurisdiction, ruling_reference, status, product_description, hs_code_applied, hs_code_alternative,
             duty_difference_pct, argument_for_applied, argument_for_alternative,
             created_date, submitted_date, decided_date, ruling_decision, effective_from
      FROM binding_rulings
      WHERE ($hs_code_applied IS NULL OR hs_code_applied = $hs_code_applied)
        AND ($jurisdiction IS NULL OR jurisdiction = upper($jurisdiction))
        AND ($keyword IS NULL OR list_bool_or([product_description ILIKE '%' || w || '%' FOR w IN string_split(lower($keyword), ' ') IF length(w) > 2]))
        AND (($status IS NULL AND status IN ('approved','rejected')) OR status = $status)
      ORDER BY created_date DESC
    limit: 30
    example: {keyword: gilet}

  - name: list_customs_holds_by_supplier
    desc: Customs holds grouped by supplier, most holds first. Shows total and still-open hold counts, reasons and financial impact.
    kind: sql
    args:
      date_from: {type: date, default: "-90d", desc: "Holds from this date"}
      open_only: {type: bool, desc: "True to count only unresolved holds"}
    sql: |
      SELECT supplier_id, count(*) AS hold_count,
             count(*) FILTER (WHERE resolved_at IS NULL) AS open_holds,
             string_agg(DISTINCT hold_reason, '; ') AS hold_reasons,
             sum(financial_impact_gbp) AS total_financial_impact_gbp,
             max(hold_date) AS most_recent_hold_date
      FROM customs_holds
      WHERE hold_date >= CAST($date_from AS DATE) AND hold_type = 'hold'
        AND ($open_only IS NOT TRUE OR resolved_at IS NULL)
      GROUP BY supplier_id
      ORDER BY hold_count DESC
    limit: 50
    example: {date_from: "-60d"}

  - name: list_customs_detentions
    desc: Legal border detentions and seizures (e.g. forced-labour orders) with legal basis, goods, outcome and impact. Not routine clearance holds.
    kind: sql
    args:
      supplier_id: {}
      hold_reason: {desc: "e.g. forced_labour, dangerous_goods"}
      destination_country: {desc: "GB, EU or US"}
      date_from: {type: date, default: "-180d", desc: "From this date"}
    sql: |
      SELECT hold_id, hold_type, supplier_id, hold_date, destination_country, hold_reason, legal_basis,
             goods_description, resolved_at, resolution_notes, financial_impact_gbp
      FROM customs_holds
      WHERE hold_date >= CAST($date_from AS DATE) AND hold_type IN ('detention', 'seizure')
        AND ($supplier_id IS NULL OR supplier_id = $supplier_id)
        AND ($hold_reason IS NULL OR hold_reason = $hold_reason)
        AND ($destination_country IS NULL OR destination_country = $destination_country)
      ORDER BY hold_date DESC
    limit: 50
    example: {hold_reason: forced_labour}

  - name: list_historic_declarations_by_supplier
    desc: Historic customs declarations for a supplier. Shows all declarations, status, values and duty amounts.
    kind: sql
    args:
      supplier_id: {required: true}
      status: {}
      date_from: {type: date, default: "-12m", desc: "From this date"}
    sql: |
      SELECT declaration_id, shipment_id, po_id, hs_code, product_description, claimed_preference,
             quantity, declared_value_gbp, duty_amount_gbp, status, declared_at, cleared_at
      FROM customs_declarations
      WHERE supplier_id = $supplier_id
        AND ($status IS NULL OR status = $status)
        AND declared_at >= CAST($date_from AS DATE)
      ORDER BY declared_at DESC
    limit: 100
    example: {supplier_id: SUP-0002}

  - name: list_affected_customs_declarations
    desc: Declarations affected by a retrospective price adjustment on a PO. Returns impacted declarations with the amendment deadline (3 years from declaration) and whether each is still inside it.
    kind: sql
    args:
      po_id: {required: true}
      date_from: {type: date, default: "-6m", desc: "Declarations from this date"}
    sql: |
      SELECT declaration_id, shipment_id, po_id, supplier_id, hs_code,
             declared_value_gbp, duty_amount_gbp, status, declared_at,
             CAST(CAST(declared_at AS DATE) + INTERVAL 3 YEAR AS DATE) AS amend_by,
             CAST(CAST(declared_at AS DATE) + INTERVAL 3 YEAR AS DATE) >= CAST($as_of AS DATE) AS inside_time_limit
      FROM customs_declarations
      WHERE po_id = $po_id
        AND declared_at >= CAST($date_from AS DATE)
      ORDER BY declared_at DESC
    limit: 50
    example: {po_id: "PO-2026-004001"}

  - name: search_bonded_warehouse_and_ipr_rules
    desc: Rules for bonded warehouse and inward processing relief by topic (eligibility, duty benefit, cash flow, admin burden, volume threshold, conditions, audit risk).
    kind: sql
    args:
      procedure_type: {type: str, desc: "bonded_warehouse or inward_processing. Blank returns both"}
      topic: {type: str, desc: "e.g. admin_burden, audit_risk, volume_threshold"}
    sql: |
      SELECT rule_id, procedure_type, topic, jurisdiction, rule_text
      FROM customs_procedure_rules
      WHERE ($procedure_type IS NULL OR procedure_type = $procedure_type)
        AND ($topic IS NULL OR topic = $topic)
      ORDER BY procedure_type, topic
    limit: 40
    example: {procedure_type: inward_processing}

  - name: send_broker_amendment_request
    desc: Sends customs broker a request to amend open declarations. Returns request id and status.
    kind: insert
    table: broker_amendment_requests
    id_prefix: BAR-
    defaults: {status: sent, sent_date: "$as_of"}
    args:
      declaration_id: {required: true}
      supplier_id: {required: true}
      amendment_type: {required: true, desc: "e.g. valuation, classification, documentation"}
      description: {required: true}
    example: {declaration_id: DEC-900002, supplier_id: SUP-0002, amendment_type: "valuation", description: "Adjust declared value based on updated invoice"}

  - name: submit_binding_ruling_application
    desc: Submits an application for binding tariff or valuation ruling. Updates status to submitted with submission date.
    kind: update
    table: binding_rulings
    set: {status: submitted, submitted_date: "$as_of"}
    args: {}
    example: {ruling_id: BRG-900001}

  - name: submit_customs_declaration_amendment
    desc: Files an amendment to a lodged customs declaration. Returns new amendment record with submission details.
    kind: insert
    table: declaration_amendments
    id_prefix: AMN-
    defaults: {status: submitted, submitted_date: "$as_of"}
    args:
      declaration_id: {required: true}
      amendment_type: {required: true, desc: "e.g. value, classification, origin"}
      description: {required: true}
    example: {declaration_id: DEC-900001, amendment_type: "valuation", description: "Correct declared value per retrospective price adjustment"}
