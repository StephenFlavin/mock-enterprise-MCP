# One entry per question row that uses this system's tools
- question: "04:32:Q5"
  story: >
    Housewares buyer needs FX forward curve for GBP/USD and GBP/EUR for three margin scenarios
    and current hedge cover by currency (USD, EUR). HDG-9001 covers USD at 75%, HDG-9003 covers
    EUR at 80%, with forward rates rising for next 6 months.
  checks:
    - tool: get_fx_forward_curve
      args: {currency_pair: "GBP/USD"}
      expect: ["1.27", "forward", "12"]
    - tool: get_fx_hedge_cover_by_currency
      args: {currency: USD}
      expect: ["7500000", "60"]

- question: "04:32:Q8"
  story: >
    Buyer needs FX rate history for small appliances margin analysis over last 90 days.
    GBP/USD rates ranged 1.2650-1.2750 showing 2.5% variance in cost of goods from FX.
  checks:
    - tool: get_fx_rates_history
      args: {currency_pair: "GBP/USD", date_from: "-90d"}
      expect: ["GBP/USD", "spot_rate"]

- question: "04:34:Q3"
  story: >
    Sourcing manager building landed cost model for wool coat Vietnam vs Portugal needs
    GBP/USD forward curve to model landed costs under different freight scenarios and
    5% sterling move scenarios.
  checks:
    - tool: get_fx_forward_curve
      args: {currency_pair: "GBP/USD"}
      expect: ["forward", "forward_rate", "1.27"]

- question: "04:34:Q4"
  story: >
    Sourcing manager comparing Morocco vs Turkey needs FX rate history for GBP/EUR
    over past 6 months to assess currency risk for European sourcing.
  checks:
    - tool: get_fx_rates_history
      args: {currency_pair: "GBP/EUR", date_from: "-180d"}
      expect: ["GBP/EUR", "1.18"]

- question: "04:39:Q2"
  story: >
    Commodities buyer considering hedging 60% of 4,200 tonnes cotton requirement needs
    hedging instrument quotes for forwards and options to compare costs, and hedge scenarios
    at 50%, 75%, 100% ratios for £5m notional exposure.
  checks:
    - tool: get_hedging_instrument_quotes
      args: {currency_pair: "GBP/USD", maturity_months: 3}
      expect: ["forward", "option", "cost_gbp"]
    - tool: calculate_hedge_scenarios
      args: {currency_pair: "GBP/USD", notional_gbp: 5000000, maturity_months: 3}
      expect: ["50%", "75%", "100%", "total_cost"]

- question: "06:58:Q2"
  story: >
    Costing analyst needs FX forward rates for landed cost comparison across origins
    (Vietnam, Portugal, India) to determine volume-optimal sourcing at 30k units under
    different freight and FX scenarios.
  checks:
    - tool: get_fx_forward_rates
      args: {currency_pair: "GBP/USD", forward_date: "+90d"}
      expect: ["forward_rate", "points", "GBP/USD"]

- question: "06:58:Q4"
  story: >
    Costing analyst comparing actual vs costed cost last season (AW26) finds cost
    increased 2.3% due to FX. GBP/USD moved from 1.28 to 1.27 (1% impact) plus
    supplier cost increase 1.3%. Margin lost £47k on housewares range.
  checks:
    - tool: get_fx_rate_history
      args: {currency_pair: "GBP/USD", date_from: "-90d"}
      expect: ["spot_rate", "1.27"]

- question: "07:61:Q2"
  story: >
    Financial controller traces £340k UK/Poland intercompany mismatch. FX rates for
    GBP/PLN over last 60 days show 2.8% variance (2026-08-06 to 2026-10-05) that explains
    £156k of timing variance.
  checks:
    - tool: get_fx_rates_for_period
      args: {currency_pair: "GBP/USD", date_from: "-60d"}
      expect: ["spot_rate", "rate_date"]

- question: "07:62:Q1"
  story: >
    FP&A analyst needs to decompose 1.4 point gross margin drop YoY. USD exposure of £7.5m
    with 60% hedge cover was only partially protected from 2% FX movement, costing
    £60k on COGS (60% unhedged exposure × 2% move).
  checks:
    - tool: get_fx_impact_on_cogs
      args: {currency: USD, fx_move_pct: 2}
      expect: ["net_cogs_impact", "GBP"]

- question: "07:62:Q5"
  story: >
    FP&A analyzes 10% sterling fall against dollar impact. Current USD hedge book shows
    £10m exposure with £7.5m hedged (HDG-9001 forward at 1.27), covering 75% on near term.
    10% move would cost £250k unhedged exposure, with hedge ratio providing £90k protection.
  checks:
    - tool: get_fx_hedge_book
      args: {status: open}
      expect: ["HDG-9001", "GBP/USD", "open"]
    - tool: get_hedge_cover_ratio
      args: {currency: USD}
      expect: ["60", "hedged"]
    - tool: calculate_fx_sensitivity
      args: {currency: USD, fx_move_pct: 10}
      expect: ["pl_impact", "GBP", "total"]

- question: "07:66:Q1"
  story: >
    Treasury needs full 12-month exposure forecast by currency (USD £7.5m, EUR £2.5m,
    INR £1.6m) with current hedge cover (60%, 55%, 50%) and hedge gaps. 5% move impacts:
    USD £375k unhedged, EUR £112k unhedged. Biggest gap is USD month 6 (only 75% covered).
  checks:
    - tool: get_currency_exposure_forecast
      args: {}
      expect: ["currency", "net_exposure", "exposure_month"]
    - tool: get_hedge_cover_ratio
      args: {currency: USD}
      expect: ["coverage", "net_exposure"]
    - tool: calculate_fx_sensitivity
      args: {currency: USD, fx_move_pct: 5}
      expect: ["pl_impact", "exposure_month"]
    - tool: calculate_hedge_gap
      args: {currency: USD, target_hedge_ratio_pct: 75}
      expect: ["gap", "target_hedged", "under-hedged"]
    - tool: submit_hedge_trade_for_approval
      args: {currency_pair: "GBP/USD", exposure_gbp: 1000000, hedge_ratio_pct: 15, instrument_type: forward, cost_gbp: 2500}
      expect: ["APR-", "pending"]

- question: "07:66:Q3"
  story: >
    Treasury debates raising USD hedge ratio from 60% to 80% (£5m extra hedge).
    Current forward 1m (INSTR-001) costs £2500, option (INSTR-005) costs £6500.
    At 80% cover, forward costs £4167, option £10833. Need to decide instrument tradeoff.
  checks:
    - tool: get_hedge_cover_ratio
      args: {currency: USD}
      expect: ["coverage_pct", "60"]
    - tool: get_hedge_instrument_pricing
      args: {currency_pair: "GBP/USD", maturity_months: 3}
      expect: ["forward", "option", "cost_gbp"]
    - tool: calculate_hedge_scenarios
      args: {currency_pair: "GBP/USD", notional_gbp: 7500000, maturity_months: 3}
      expect: ["scenario 75%", "scenario 100%", "cost"]
    - tool: get_currency_exposure_forecast
      args: {currency: USD}
      expect: ["exposure_month", "USD"]
    - tool: submit_hedge_trade_for_approval
      args: {currency_pair: "GBP/USD", exposure_gbp: 5000000, hedge_ratio_pct: 80, instrument_type: forward, cost_gbp: 12500}
      expect: ["APR-", "pending"]

- question: "07:66:Q4"
  story: >
    FX gain/loss £1.1m off budget. £1.65m realised gain (closed hedges) but £950k
    unrealised loss (open hedges: HDG-9001 at +45k, HDG-9002 at -12.5k, HDG-9005 at +15k).
    Hedge effectiveness 88%/82%/85%, suggesting programme is working but timing mismatches.
  checks:
    - tool: get_hedge_effectiveness_report
      args: {}
      expect: ["effectiveness", "unrealised", "HDG-9"]
