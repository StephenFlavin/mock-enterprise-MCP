# One entry per question row that uses this system's tools
- question: "04:32:Q5"
  story: >
    Housewares buyer needs FX forward curve for GBP/USD and GBP/EUR for three margin scenarios
    and current hedge cover by currency (USD, EUR). USD 12-month cover 60.3%, EUR 67.2%,
    with forward rates for sterling falling about 1.8% (USD) and 2% (EUR) over 12 months.
  checks:
    - tool: get_fx_forward_curve
      args: {currency_pair: "GBP/USD"}
      expect: ["forward_rate", "forward_date", "GBP/USD"]
    - tool: get_fx_hedge_cover_by_currency
      args: {currency: USD}
      expect: ["154100000", "60.3"]

- question: "04:32:Q8"
  story: >
    Buyer needs FX rate history for small appliances margin analysis over last 90 days.
    GBP/USD fell from about 1.345 a year ago to 1.27 (-5.6%).
  checks:
    - tool: get_fx_rates_history
      args: {currency_pair: "GBP/USD", date_from: "-365d"}
      expect: ["GBP/USD", "-5.56"]

- question: "04:34:Q3"
  story: >
    Sourcing manager building landed cost model for wool coat Vietnam vs Portugal needs
    GBP/USD forward curve to model landed costs under different freight scenarios and
    5% sterling move scenarios.
  checks:
    - tool: get_fx_forward_curve
      args: {currency_pair: "GBP/USD"}
      expect: ["1.2471"]

- question: "04:34:Q4"
  story: >
    Sourcing manager comparing Morocco vs Turkey needs FX rate history for GBP/EUR
    (GBP/TRY lira weakens 15% in six months, GBP/MAD dirham stable +1%) over past 6 months to assess currency risk for European sourcing.
  checks:
    - tool: get_fx_rates_history
      args: {currency_pair: "GBP/TRY", date_from: "-180d"}
      expect: ["GBP/TRY", "15.16"]

- question: "04:39:Q2"
  story: >
    Commodities buyer considering hedging 60% of 4,200 tonnes cotton requirement needs
    hedging instrument quotes for forwards and options to compare costs, and hedge scenarios
    at 50%, 75%, 100% ratios for £5m notional exposure.
  checks:
    - tool: get_hedging_instrument_quotes
      args: {currency_pair: "GBP/USD", maturity_months: 12}
      expect: ["forward", "option", "26000"]
    - tool: calculate_hedge_scenarios
      args: {currency_pair: "GBP/USD", notional_gbp: 6000000, maturity_months: 12}
      expect: ["6300", "8400", "hedging_cost_gbp"]

- question: "06:58:Q2"
  story: >
    Costing analyst needs FX forward rates for landed cost comparison across origins
    (Vietnam, Portugal, India) to determine volume-optimal sourcing at 30k units under
    different freight and FX scenarios.
  checks:
    - tool: get_fx_forward_rates
      args: {currency_pair: "GBP/USD", forward_to: "+180d"}
      expect: ["1.2586", "points", "GBP/USD"]

- question: "06:58:Q4"
  story: >
    Costing analyst comparing actual vs costed cost last season (AW26) finds cost
    increased 2.3% due to FX. GBP/USD moved from 1.335 to 1.27 (-4.9%) over the season, so dollar costs rose in sterling terms.
  checks:
    - tool: get_fx_rate_history
      args: {currency_pair: "GBP/USD", date_from: "-240d"}
      expect: ["-4.88", "1.2700"]

- question: "07:61:Q2"
  story: >
    Financial controller traces £340k UK/Poland intercompany mismatch. GBP/PLN moves from 5.00 to 5.14 (+2.9%) over the last 60 days.
  checks:
    - tool: get_fx_rates_for_period
      args: {currency_pair: "GBP/PLN", date_from: "-60d"}
      expect: ["5.1400", "2.94"]

- question: "07:62:Q1"
  story: >
    FP&A analyst needs to decompose 1.4 point gross margin drop YoY. Sterling fell 5.6% against USD; 12-month USD exposure £154.1m at 60.3% cover leaves £3.4m net COGS impact.
  checks:
    - tool: get_fx_impact_on_cogs
      args: {currency: USD}
      expect: ["8560474", "3400852.63", "-5.56"]

- question: "07:62:Q5"
  story: >
    FP&A analyzes 10% sterling fall against dollar impact. Current USD hedge book shows
    exposure with hedges covering the position. 10% move would impact unhedged portion
    while hedge ratio provides protection on covered portion.
  checks:
    - tool: get_fx_hedge_book
      args: {status: open}
      expect: ["HDG-9001", "92900000"]
    - tool: get_hedge_cover_ratio
      args: {currency: USD}
      expect: ["60.3", "hedged_gbp"]
    - tool: calculate_fx_sensitivity
      args: {currency: USD, fx_move_pct: -10}
      expect: ["-6121990"]

- question: "07:66:Q1"
  story: >
    Treasury needs full 12-month exposure forecast by currency (USD £154.1m, EUR £28.4m)
    with USD cover 60.3% and EUR 67.2%. Biggest gap vs 75% target is USD month 6 (17.5m exposure at 45% cover, gap £5.23m).
  checks:
    - tool: get_currency_exposure_forecast
      args: {}
      expect: ["USD", "EUR", "17500000"]
    - tool: get_hedge_cover_ratio
      args: {currency: USD}
      expect: ["hedge_coverage_pct", "net_exposure_gbp"]
    - tool: calculate_fx_sensitivity
      args: {currency: USD, fx_move_pct: -5}
      expect: ["-3060995"]
    - tool: calculate_hedge_gap
      args: {currency: USD, target_hedge_ratio_pct: 75}
      expect: ["5232500", "under-hedged"]
    - tool: submit_hedge_trade_for_approval
      args: {currency_pair: "GBP/USD", exposure_gbp: 1000000, hedge_ratio_pct: 15, instrument_type: forward, cost_gbp: 2500}
      expect: ["APR-", "pending"]

- question: "07:66:Q3"
  story: >
    Treasury debates raising USD hedge ratio from current level to 80%. Different instruments
    have different costs and protection profiles. Need to compare forward vs option costs
    and decide on optimal instrument mix.
  checks:
    - tool: get_hedge_cover_ratio
      args: {currency: USD}
      expect: ["60.3", "USD"]
    - tool: get_hedge_instrument_pricing
      args: {currency_pair: "GBP/USD", maturity_months: 12}
      expect: ["forward", "market_price", "1400"]
    - tool: calculate_hedge_scenarios
      args: {currency_pair: "GBP/USD", maturity_months: 12}
      expect: ["172592", "proposed", "ratio_pct"]
    - tool: get_currency_exposure_forecast
      args: {currency: USD}
      expect: ["exposure_month", "USD", "17500000"]
    - tool: submit_hedge_trade_for_approval
      args: {currency_pair: "GBP/USD", exposure_gbp: 5000000, hedge_ratio_pct: 80, instrument_type: forward, cost_gbp: 12500}
      expect: ["APR-", "pending"]

- question: "07:66:Q4"
  story: >
    FX gain/loss £1.1m off budget. The hedge book holds open forwards and options (HDG-9001...) with
    effectiveness 80-98% and small mark-to-market, plus matured hedges HDG-9900..9903.
  checks:
    - tool: get_hedge_effectiveness_report
      args: {}
      expect: ["effectiveness", "unrealised", "HDG-9", "highly effective"]
