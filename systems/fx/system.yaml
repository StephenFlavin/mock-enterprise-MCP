id: fx
name: FX & Hedging Platform
instructions: >
  FX rates, forwards and hedges for treasury. Currency pairs (GBP/USD, GBP/EUR, GBP/PLN, GBP/TRY, GBP/MAD),
  spot and forward rates, open hedge positions, and hedge effectiveness. Hedge ids look like
  HDG-000123. Use it for exposure forecasts, hedge scenarios, and FX impact analysis.

tables:
  fx_rates:
    key: [currency_pair, rate_date]
    cols:
      currency_pair: {type: str, desc: "Currency pair, e.g. GBP/USD"}
      rate_date: {type: date, desc: "Date of the rate"}
      spot_rate: {type: float, desc: "Spot FX rate"}
      bid_rate: {type: float, desc: "Bid rate"}
      ask_rate: {type: float, desc: "Ask rate"}
      volatility_pct: {type: float, desc: "Historical volatility %"}

  fx_forward_rates:
    key: [currency_pair, forward_date]
    cols:
      currency_pair: {type: str, desc: "Currency pair, e.g. GBP/USD"}
      forward_date: {type: date, desc: "Settlement date"}
      forward_rate: {type: float, desc: "Forward FX rate"}
      points: {type: float, desc: "Forward points"}
      bid_rate: {type: float, desc: "Bid rate"}
      ask_rate: {type: float, desc: "Ask rate"}

  hedge_positions:
    key: hedge_id
    cols:
      hedge_id: {type: str, desc: "Hedge position, e.g. HDG-000123"}
      currency_pair: {type: str, desc: "Currency pair"}
      exposure_amount: {type: float, desc: "Exposure amount in home currency (GBP)"}
      hedge_amount: {type: float, desc: "Hedged amount in the foreign currency (notional_gbp x hedge_rate)"}
      instrument_type: {type: enum, values: [forward, option, collar, swap], desc: "Instrument type"}
      hedge_rate: {type: float, desc: "Hedge rate"}
      strike_price: {type: float, desc: "Option strike (options only)"}
      maturity_date: {type: date, desc: "Maturity or settlement date"}
      effectiveness_pct: {type: float, desc: "Hedge effectiveness %"}
      status: {type: enum, values: [open, closed, matured, unwound], desc: "Hedge status"}
      notional_gbp: {type: float, desc: "Notional value in GBP"}
      mark_to_market_gbp: {type: float, desc: "Current market value"}
      created_at: {type: timestamp, desc: "Creation date"}
      matured_at: {type: timestamp, desc: "Maturity date/time"}

  currency_exposure:
    key: [currency, exposure_month]
    cols:
      currency: {type: str, desc: "Currency, e.g. USD"}
      exposure_month: {type: date, desc: "Month of exposure (first day)"}
      payable_exposure_gbp: {type: float, desc: "Payable exposure in GBP"}
      receivable_exposure_gbp: {type: float, desc: "Receivable exposure in GBP"}
      net_exposure_gbp: {type: float, desc: "Net exposure in GBP"}
      hedge_coverage_pct: {type: float, desc: "% of exposure currently hedged"}
      base_rate: {type: float, desc: "Base FX rate for period"}
      forecast_status: {type: enum, values: [confirmed, forecast, budget], desc: "Confidence level"}

  hedge_instruments:
    key: instrument_id
    cols:
      instrument_id: {type: str, desc: "Instrument id, e.g. INSTR-001"}
      instrument_type: {type: enum, values: [forward, option, collar, swap], desc: "Type"}
      currency_pair: {type: str, desc: "Currency pair"}
      maturity_months: {type: int, desc: "Maturity in months"}
      market_price: {type: float, desc: "Market price or rate"}
      bid_price: {type: float, desc: "Bid price"}
      ask_price: {type: float, desc: "Ask price"}
      cost_pct: {type: float, desc: "Cost or premium as % of notional"}
      cost_gbp: {type: float, desc: "Cost or premium in GBP per 1,000,000 GBP notional"}
      protection_level_pct: {type: float, desc: "Share of the hedged amount protected against sterling falling, %"}
      terms: {type: text, desc: "What the instrument does if sterling strengthens"}
      last_quoted_at: {type: timestamp, desc: "Last quote time"}

  hedge_approval_queue:
    key: approval_id
    cols:
      approval_id: {type: str, desc: "Approval request, e.g. APR-000123"}
      hedge_id: {type: str, desc: "Related hedge id"}
      currency_pair: {type: str, desc: "Currency pair"}
      exposure_gbp: {type: float, desc: "Exposure amount"}
      hedge_ratio_pct: {type: float, desc: "Proposed hedge ratio %"}
      instrument_type: {type: enum, values: [forward, option, collar, swap], desc: "Instrument type"}
      cost_gbp: {type: float, desc: "Estimated cost"}
      hedge_month: {type: date, desc: "Exposure month the trade covers"}
      rationale: {type: text, desc: "Why the trade is proposed"}
      requested_at: {type: timestamp, desc: "Request timestamp"}
      status: {type: enum, values: [pending, approved, rejected, executed], desc: "Approval status"}
      approved_by: {type: str, desc: "Approver employee id"}
      approved_at: {type: timestamp, desc: "Approval timestamp"}

tools:
  - name: get_fx_rates_history
    desc: Daily spot rates for a currency pair, latest first, with the move since the period start. Use for rate trends.
    kind: sql
    args:
      currency_pair: {required: true, desc: "Currency pair, e.g. GBP/USD, GBP/EUR, GBP/PLN, GBP/TRY, GBP/MAD"}
      date_from: {type: date, default: "-90d", desc: "Rates from this date onwards"}
      date_to: {type: date, desc: "Rates up to this date"}
    sql: |
      SELECT currency_pair, rate_date, printf('%.4f', spot_rate) AS spot_rate, printf('%.4f', bid_rate) AS bid_rate, printf('%.4f', ask_rate) AS ask_rate, volatility_pct,
             printf('%.4f', first_value(spot_rate) OVER (ORDER BY rate_date)) AS period_start_rate,
             round((spot_rate / first_value(spot_rate) OVER (ORDER BY rate_date) - 1) * 100, 2) AS sterling_move_since_start_pct
      FROM fx_rates
      WHERE currency_pair = $currency_pair AND rate_date >= CAST($date_from AS DATE)
        AND ($date_to IS NULL OR rate_date <= CAST($date_to AS DATE))
      ORDER BY rate_date DESC
    limit: 300
    example: {currency_pair: "GBP/USD"}

  - name: get_fx_rate_history
    desc: Spot rates for a currency pair over a period, latest first, with rate at period start and change since. Use for costing and margin comparisons.
    kind: sql
    args:
      currency_pair: {required: true, desc: "Currency pair, e.g. GBP/USD, GBP/EUR"}
      date_from: {type: date, default: "-90d", desc: "Start date"}
      date_to: {type: date, desc: "End date"}
    sql: |
      SELECT currency_pair, rate_date, printf('%.4f', spot_rate) AS spot_rate, printf('%.4f', bid_rate) AS bid_rate, printf('%.4f', ask_rate) AS ask_rate, volatility_pct,
             printf('%.4f', first_value(spot_rate) OVER (ORDER BY rate_date)) AS period_start_rate,
             round((spot_rate / first_value(spot_rate) OVER (ORDER BY rate_date) - 1) * 100, 2) AS sterling_move_since_start_pct,
             'sterling_move = spot / period_start_rate - 1 (negative = sterling weaker, imports dearer)' AS formula
      FROM fx_rates
      WHERE currency_pair = $currency_pair
        AND rate_date >= CAST($date_from AS DATE)
        AND ($date_to IS NULL OR rate_date <= CAST($date_to AS DATE))
      ORDER BY rate_date DESC
    limit: 300
    example: {currency_pair: "GBP/USD"}

  - name: get_fx_rates_for_period
    desc: Spot and mid rates for a currency pair between two dates, with move since start. Use to value transactions by posting date.
    kind: sql
    args:
      currency_pair: {required: true, desc: "Currency pair, e.g. GBP/PLN, GBP/EUR, GBP/USD"}
      date_from: {type: date, default: "-90d", desc: "Period start"}
      date_to: {type: date, desc: "Period end"}
    sql: |
      SELECT currency_pair, rate_date, printf('%.4f', spot_rate) AS spot_rate, printf('%.4f', (bid_rate + ask_rate) / 2) AS mid_rate, volatility_pct,
             printf('%.4f', first_value(spot_rate) OVER (ORDER BY rate_date)) AS period_start_rate,
             round((spot_rate / first_value(spot_rate) OVER (ORDER BY rate_date) - 1) * 100, 2) AS sterling_move_since_start_pct,
             'mid_rate = (bid + ask) / 2; move = spot / period_start_rate - 1' AS formula
      FROM fx_rates
      WHERE currency_pair = $currency_pair
        AND rate_date >= (CAST($date_from AS DATE) - CAST((isodow(CAST($as_of AS DATE)) + 4) % 7 AS INTEGER) * INTERVAL 1 DAY)
        AND ($date_to IS NULL OR rate_date <= CAST($date_to AS DATE))
      ORDER BY rate_date DESC
    limit: 300
    example: {currency_pair: "GBP/PLN"}

  - name: get_fx_forward_rates
    desc: Forward rates by settlement date for a currency pair (GBP/USD or GBP/EUR) with spot and forward discount. Use for costing and hedging.
    kind: sql
    args:
      currency_pair: {required: true, desc: "Currency pair, GBP/USD or GBP/EUR"}
      forward_to: {type: date, default: "+180d", desc: "Latest settlement date"}
    sql: |
      SELECT f.currency_pair, f.forward_date, printf('%.4f', f.forward_rate) AS forward_rate, f.points, printf('%.4f', f.bid_rate) AS bid_rate, printf('%.4f', f.ask_rate) AS ask_rate,
             (SELECT printf('%.4f', s.spot_rate) FROM fx_rates s WHERE s.currency_pair = f.currency_pair AND s.rate_date <= CAST($as_of AS DATE)
              ORDER BY s.rate_date DESC LIMIT 1) AS spot_rate,
             round((f.forward_rate / (SELECT s.spot_rate FROM fx_rates s WHERE s.currency_pair = f.currency_pair AND s.rate_date <= CAST($as_of AS DATE)
              ORDER BY s.rate_date DESC LIMIT 1) - 1) * 100, 2) AS forward_vs_spot_pct
      FROM fx_forward_rates f
      WHERE f.currency_pair = $currency_pair
        AND f.forward_date >= CAST($as_of AS DATE)
        AND f.forward_date <= CAST($forward_to AS DATE)
      ORDER BY f.forward_date ASC
    limit: 24
    example: {currency_pair: "GBP/USD"}

  - name: get_fx_forward_curve
    desc: Forward curve for the next 12 months for one currency pair, or all pairs, with spot and forward discount. Use for margin scenarios.
    kind: sql
    args:
      currency_pair: {desc: "Currency pair, e.g. GBP/USD or GBP/EUR; omit for both"}
    sql: |
      SELECT f.currency_pair, f.forward_date, printf('%.4f', f.forward_rate) AS forward_rate, f.points,
             (SELECT printf('%.4f', s.spot_rate) FROM fx_rates s WHERE s.currency_pair = f.currency_pair AND s.rate_date <= CAST($as_of AS DATE)
              ORDER BY s.rate_date DESC LIMIT 1) AS spot_rate,
             round((f.forward_rate / (SELECT s.spot_rate FROM fx_rates s WHERE s.currency_pair = f.currency_pair AND s.rate_date <= CAST($as_of AS DATE)
              ORDER BY s.rate_date DESC LIMIT 1) - 1) * 100, 2) AS forward_vs_spot_pct
      FROM fx_forward_rates f
      WHERE ($currency_pair IS NULL OR f.currency_pair = $currency_pair)
        AND f.forward_date >= CAST($as_of AS DATE)
        AND f.forward_date <= CAST($as_of AS DATE) + INTERVAL 12 MONTH
      ORDER BY f.currency_pair, f.forward_date ASC
    limit: 48
    example: {currency_pair: "GBP/USD"}

  - name: get_fx_hedge_book
    desc: Open FX hedges by currency pair, instrument, rate and maturity with notional and mark-to-market, plus total notional per pair.
    kind: sql
    args:
      currency_pair: {desc: "Currency pair, e.g. GBP/USD"}
      status: {type: enum, values: [open, closed, matured, unwound], default: open, desc: "Position status"}
      maturity_from: {type: date, desc: "Maturity on or after"}
    sql: |
      SELECT hedge_id, currency_pair, instrument_type, printf('%.4f', hedge_rate) AS hedge_rate, printf('%.4f', strike_price) AS strike_price, maturity_date, notional_gbp,
             hedge_amount, mark_to_market_gbp, effectiveness_pct, status,
             sum(notional_gbp) OVER (PARTITION BY currency_pair) AS pair_total_notional_gbp,
             sum(mark_to_market_gbp) OVER (PARTITION BY currency_pair) AS pair_total_mtm_gbp
      FROM hedge_positions
      WHERE ($currency_pair IS NULL OR currency_pair = $currency_pair)
        AND status = $status
        AND ($maturity_from IS NULL OR maturity_date >= CAST($maturity_from AS DATE))
      ORDER BY currency_pair, maturity_date ASC
    limit: 100
    example: {currency_pair: "GBP/USD"}

  - name: get_fx_hedge_cover_by_currency
    desc: One row per currency with 12-month net exposure, hedged and unhedged amounts and overall cover %. Use for a quick cover summary.
    kind: sql
    args:
      currency: {desc: "Currency, e.g. USD"}
    sql: |
      SELECT currency, count(*) AS months, round(sum(net_exposure_gbp), 2) AS net_exposure_gbp,
             round(sum(net_exposure_gbp * hedge_coverage_pct / 100.0), 2) AS hedged_gbp,
             round(sum(net_exposure_gbp * (100.0 - hedge_coverage_pct) / 100.0), 2) AS unhedged_gbp,
             round(100.0 * sum(net_exposure_gbp * hedge_coverage_pct / 100.0) / sum(net_exposure_gbp), 1) AS cover_pct,
             min(hedge_coverage_pct) AS lowest_month_cover_pct,
             arg_min(exposure_month, hedge_coverage_pct) AS lowest_cover_month,
             'cover_pct = hedged / net exposure over the next 12 months' AS formula
      FROM currency_exposure
      WHERE ($currency IS NULL OR currency = $currency)
        AND exposure_month >= CAST($as_of AS DATE)
        AND exposure_month <= CAST($as_of AS DATE) + INTERVAL 12 MONTH
      GROUP BY currency
      ORDER BY currency
    limit: 10
    example: {currency: USD}

  - name: get_currency_exposure_forecast
    desc: Net currency exposure by currency and month for the next 12 months, with payables, receivables and cover. Use to find exposed months.
    kind: sql
    args:
      currency: {desc: "Currency, e.g. USD; omit for all currencies"}
    sql: |
      SELECT currency, exposure_month, payable_exposure_gbp, receivable_exposure_gbp,
             net_exposure_gbp, hedge_coverage_pct, printf('%.4f', base_rate) AS base_rate, forecast_status
      FROM currency_exposure
      WHERE ($currency IS NULL OR currency = $currency)
        AND exposure_month >= CAST($as_of AS DATE)
        AND exposure_month <= CAST($as_of AS DATE) + INTERVAL 12 MONTH
      ORDER BY currency, exposure_month ASC
    limit: 60
    example: {}

  - name: get_hedge_cover_ratio
    desc: Hedged percentage by currency and month with hedged and unhedged amounts and the 12-month weighted cover. Use for gaps by month.
    kind: sql
    args:
      currency: {desc: "Currency, e.g. USD; omit for all currencies"}
    sql: |
      SELECT currency, exposure_month, net_exposure_gbp, hedge_coverage_pct,
             round(net_exposure_gbp * hedge_coverage_pct / 100.0, 2) AS hedged_gbp,
             round(net_exposure_gbp * (100.0 - hedge_coverage_pct) / 100.0, 2) AS unhedged_gbp,
             round(100.0 * sum(net_exposure_gbp * hedge_coverage_pct / 100.0) OVER (PARTITION BY currency)
                   / sum(net_exposure_gbp) OVER (PARTITION BY currency), 1) AS weighted_cover_12m_pct,
             'cover_ratio = hedged / net_exposure' AS formula
      FROM currency_exposure
      WHERE ($currency IS NULL OR currency = $currency)
        AND exposure_month >= CAST($as_of AS DATE)
        AND exposure_month <= CAST($as_of AS DATE) + INTERVAL 12 MONTH
      ORDER BY currency, exposure_month ASC
    limit: 60
    example: {currency: USD}

  - name: get_hedge_instrument_pricing
    desc: Forward, option, collar and swap pricing and terms by maturity for a currency pair; cost per 1m GBP. Use to compare instruments.
    kind: sql
    args:
      currency_pair: {required: true, desc: "Currency pair, GBP/USD or GBP/EUR"}
      maturity_months: {type: int, desc: "Maturity in months: 1, 3, 6 or 12; omit for all"}
    sql: |
      SELECT instrument_id, instrument_type, currency_pair, maturity_months, printf('%.4f', market_price) AS market_price,
             cost_pct, cost_gbp AS cost_gbp_per_1m_notional, protection_level_pct, terms, last_quoted_at
      FROM hedge_instruments
      WHERE currency_pair = $currency_pair
        AND ($maturity_months IS NULL OR maturity_months = CAST($maturity_months AS INT))
      ORDER BY maturity_months, cost_pct
    limit: 40
    example: {currency_pair: "GBP/USD", maturity_months: 12}

  - name: get_hedging_instrument_quotes
    desc: Dealer bid/ask quotes and cost for forwards and options by maturity, cheapest first. Use to price a hedge before trading.
    kind: sql
    args:
      currency_pair: {required: true, desc: "Currency pair, GBP/USD or GBP/EUR"}
      maturity_months: {type: int, default: 3, desc: "Maturity in months: 1, 3, 6 or 12"}
      instrument_type: {type: enum, values: [forward, option, collar, swap], desc: "Only this instrument"}
    sql: |
      SELECT instrument_id, instrument_type, maturity_months, printf('%.4f', market_price) AS market_price, printf('%.4f', bid_price) AS bid_price, printf('%.4f', ask_price) AS ask_price,
             cost_pct, cost_gbp AS cost_gbp_per_1m_notional, protection_level_pct, last_quoted_at
      FROM hedge_instruments
      WHERE currency_pair = $currency_pair
        AND maturity_months = CAST($maturity_months AS INT)
        AND ($instrument_type IS NULL OR instrument_type = $instrument_type)
      ORDER BY cost_pct ASC
    limit: 20
    example: {currency_pair: "GBP/USD", maturity_months: 12}

  - name: calculate_fx_sensitivity
    desc: P&L impact by month of a sterling move against hedge cover, before and after hedges, with totals per currency.
    kind: sql
    args:
      currency: {desc: "Currency, e.g. USD; omit for all currencies"}
      fx_move_pct: {type: float, default: -10, desc: "Sterling move against the currency in %: -10 = sterling falls 10%, 5 = rises 5%"}
      months_ahead: {type: int, default: 12, desc: "Forecast months ahead"}
    sql: |
      SELECT c.currency, c.exposure_month, c.net_exposure_gbp, c.hedge_coverage_pct,
             round(c.net_exposure_gbp * $fx_move_pct / 100.0, 2) AS pl_before_hedges_gbp,
             round(-c.net_exposure_gbp * c.hedge_coverage_pct / 100.0 * $fx_move_pct / 100.0, 2) AS hedge_gain_gbp,
             round(c.net_exposure_gbp * (100.0 - c.hedge_coverage_pct) / 100.0 * $fx_move_pct / 100.0, 2) AS net_pl_impact_gbp,
             round(sum(c.net_exposure_gbp * $fx_move_pct / 100.0) OVER (PARTITION BY c.currency), 2) AS total_before_hedges_gbp,
             round(sum(c.net_exposure_gbp * (100.0 - c.hedge_coverage_pct) / 100.0 * $fx_move_pct / 100.0) OVER (PARTITION BY c.currency), 2) AS total_net_pl_impact_gbp,
             'net P&L = net exposure * (1 - cover) * sterling move; negative = loss (payables cost more when sterling falls)' AS formula
      FROM currency_exposure c
      WHERE ($currency IS NULL OR c.currency = $currency)
        AND c.exposure_month >= CAST($as_of AS DATE)
        AND c.exposure_month <= CAST($as_of AS DATE) + INTERVAL ($months_ahead) MONTH
      ORDER BY c.currency, c.exposure_month ASC
    limit: 60
    example: {currency: USD, fx_move_pct: -5}

  - name: calculate_hedge_gap
    desc: Under- or over-hedged amount by currency and month against a target ratio, biggest gap first, with the month's rank.
    kind: sql
    args:
      currency: {desc: "Currency, e.g. USD; omit for all currencies"}
      target_hedge_ratio_pct: {type: int, default: 75, desc: "Target hedge ratio %"}
    sql: |
      SELECT currency, exposure_month, net_exposure_gbp, hedge_coverage_pct,
             round(net_exposure_gbp * $target_hedge_ratio_pct / 100.0, 2) AS target_hedged_gbp,
             round(net_exposure_gbp * hedge_coverage_pct / 100.0, 2) AS current_hedged_gbp,
             round(net_exposure_gbp * ($target_hedge_ratio_pct - hedge_coverage_pct) / 100.0, 2) AS gap_gbp,
             CASE WHEN hedge_coverage_pct < $target_hedge_ratio_pct THEN 'under-hedged'
                  WHEN hedge_coverage_pct > $target_hedge_ratio_pct THEN 'over-hedged'
                  ELSE 'on-target' END AS gap_status,
             rank() OVER (ORDER BY net_exposure_gbp * ($target_hedge_ratio_pct - hedge_coverage_pct) DESC) AS gap_rank,
             'gap = net exposure * (target - current cover); positive = hedge more' AS formula
      FROM currency_exposure
      WHERE ($currency IS NULL OR currency = $currency)
        AND exposure_month >= CAST($as_of AS DATE)
        AND exposure_month <= CAST($as_of AS DATE) + INTERVAL 12 MONTH
      ORDER BY gap_gbp DESC
    limit: 60
    example: {currency: USD, target_hedge_ratio_pct: 75}

  - name: calculate_hedge_scenarios
    desc: Cost and protection of hedging a GBP notional at 50%, 75%, 100% and your current and proposed ratios with one instrument.
    kind: sql
    args:
      currency_pair: {required: true, desc: "Currency pair, e.g. GBP/USD"}
      notional_gbp: {type: float, desc: "Exposure to hedge in GBP; omit to use the next 12 months' net exposure for the currency"}
      maturity_months: {type: int, default: 12, desc: "Hedge maturity in months: 1, 3, 6 or 12"}
      instrument_type: {type: enum, values: [forward, option, collar, swap], default: forward, desc: "Instrument to price"}
      current_ratio_pct: {type: int, default: 60, desc: "Current hedge ratio %"}
      proposed_ratio_pct: {type: int, default: 80, desc: "Proposed hedge ratio %"}
    sql: |
      WITH n AS (
        SELECT COALESCE($notional_gbp, (SELECT sum(net_exposure_gbp) FROM currency_exposure
                 WHERE currency = substr($currency_pair, 5) AND exposure_month >= CAST($as_of AS DATE)
                   AND exposure_month <= CAST($as_of AS DATE) + INTERVAL 12 MONTH)) AS notional
      ), i AS (
        SELECT cost_pct, protection_level_pct FROM hedge_instruments
        WHERE currency_pair = $currency_pair AND maturity_months = CAST($maturity_months AS INT) AND instrument_type = $instrument_type
      ), r AS (
        SELECT DISTINCT x AS ratio_pct FROM (VALUES (50), (75), (100), (CAST($current_ratio_pct AS INT)), (CAST($proposed_ratio_pct AS INT))) t(x)
      )
      SELECT $currency_pair AS currency_pair, $instrument_type AS instrument_type, CAST($maturity_months AS INT) AS maturity_months,
             r.ratio_pct,
             CASE WHEN r.ratio_pct = $current_ratio_pct THEN 'current' WHEN r.ratio_pct = $proposed_ratio_pct THEN 'proposed' ELSE '' END AS label,
             round(n.notional, 2) AS notional_gbp,
             round(n.notional * r.ratio_pct / 100.0, 2) AS hedged_gbp,
             i.cost_pct,
             round(n.notional * r.ratio_pct / 100.0 * i.cost_pct / 100.0, 2) AS hedging_cost_gbp,
             round(n.notional * (100 - r.ratio_pct) / 100.0 * 0.10, 2) AS loss_if_sterling_falls_10pct_gbp,
             CASE WHEN $instrument_type = 'option' THEN 0.0
                  WHEN $instrument_type = 'collar' THEN round(n.notional * r.ratio_pct / 100.0 * 0.05, 2)
                  ELSE round(n.notional * r.ratio_pct / 100.0 * 0.10, 2) END AS forgone_gain_if_sterling_rises_10pct_gbp,
             i.protection_level_pct,
             'cost = hedged * cost_pct; unhedged loss = notional * (1 - ratio) * 10%; forgone gain = hedged * 10% (none for options, above a 5% band for collars)' AS formula
      FROM r CROSS JOIN n CROSS JOIN i
      ORDER BY r.ratio_pct
    limit: 10
    example: {currency_pair: "GBP/USD", notional_gbp: 5000000}

  - name: get_fx_impact_on_cogs
    desc: COGS impact by currency of a sterling move over the last year, or a given move, gross and net of hedges on the next 12 months.
    kind: sql
    args:
      currency: {desc: "Currency, e.g. USD; omit for all currencies"}
      fx_move_pct: {type: float, desc: "Sterling move in %, e.g. -10; omit to use the actual move since period_from"}
      period_from: {type: date, default: "-365d", desc: "Start of the period over which the actual sterling move is measured"}
    sql: |
      WITH r AS (
        SELECT currency_pair, arg_min(spot_rate, rate_date) AS start_rate, arg_max(spot_rate, rate_date) AS end_rate
        FROM fx_rates WHERE rate_date >= (CAST($period_from AS DATE) - CAST((isodow(CAST($as_of AS DATE)) + 4) % 7 AS INTEGER) * INTERVAL 1 DAY) AND rate_date <= CAST($as_of AS DATE) GROUP BY currency_pair
      ), e AS (
        SELECT currency, sum(net_exposure_gbp) AS net, sum(net_exposure_gbp * hedge_coverage_pct / 100.0) AS hedged
        FROM currency_exposure
        WHERE ($currency IS NULL OR currency = $currency) AND exposure_month >= CAST($as_of AS DATE)
          AND exposure_month <= CAST($as_of AS DATE) + INTERVAL 12 MONTH
        GROUP BY currency
      )
      SELECT e.currency, printf('%.4f', r.start_rate) AS start_rate, printf('%.4f', r.end_rate) AS end_rate,
             round((r.end_rate / r.start_rate - 1) * 100, 2) AS actual_sterling_move_pct,
             COALESCE($fx_move_pct, round((r.end_rate / r.start_rate - 1) * 100, 2)) AS move_used_pct,
             round(e.net, 2) AS annual_net_exposure_gbp,
             round(e.hedged / e.net, 4) AS hedge_ratio,
             round(-e.net * COALESCE($fx_move_pct, (r.end_rate / r.start_rate - 1) * 100) / 100.0, 2) AS gross_cogs_impact_gbp,
             round(e.hedged * COALESCE($fx_move_pct, (r.end_rate / r.start_rate - 1) * 100) / 100.0, 2) AS hedge_offset_gbp,
             round(-(e.net - e.hedged) * COALESCE($fx_move_pct, (r.end_rate / r.start_rate - 1) * 100) / 100.0, 2) AS net_cogs_impact_gbp,
             'net COGS impact = -(exposure - hedged) * sterling move; positive = COGS up' AS formula
      FROM e JOIN r ON r.currency_pair = 'GBP/' || e.currency
      ORDER BY e.currency
    limit: 10
    example: {currency: USD}

  - name: get_hedge_effectiveness_report
    desc: Hedge accounting effectiveness. Returns realised and unrealised P&L and hedge efficiency ratio.
    kind: sql
    args:
      currency_pair: {desc: "Currency pair"}
      period_from: {type: date, default: "-90d", desc: "Period start (hedges created on or after)"}
      status: {type: enum, values: [open, closed, matured, unwound], desc: "Only hedges with this status; omit for all"}
    sql: |
      SELECT h.hedge_id, h.currency_pair, h.instrument_type, printf('%.4f', h.hedge_rate) AS hedge_rate,
             h.maturity_date, h.effectiveness_pct,
             CASE WHEN h.status = 'open' THEN 0.0 ELSE round(h.mark_to_market_gbp, 2) END AS realised_pl_gbp,
             CASE WHEN h.status = 'open' THEN round(h.mark_to_market_gbp, 2) ELSE 0.0 END AS unrealised_pl_gbp,
             round(h.effectiveness_pct / 100.0, 2) AS hedge_efficiency_ratio,
             h.status,
             CASE WHEN h.effectiveness_pct >= 80 THEN 'highly effective'
                  WHEN h.effectiveness_pct >= 60 THEN 'effective'
                  ELSE 'needs review' END AS effectiveness_status,
             round(sum(CASE WHEN h.status = 'open' THEN 0.0 ELSE h.mark_to_market_gbp END) OVER (), 2) AS total_realised_pl_gbp,
             round(sum(CASE WHEN h.status = 'open' THEN h.mark_to_market_gbp ELSE 0.0 END) OVER (), 2) AS total_unrealised_pl_gbp,
             round(sum(h.effectiveness_pct * h.notional_gbp) OVER () / sum(h.notional_gbp) OVER (), 1) AS notional_weighted_effectiveness_pct,
             'effectiveness = hedge_pl / exposure_pl' AS formula
      FROM hedge_positions h
      WHERE ($currency_pair IS NULL OR h.currency_pair = $currency_pair)
        AND h.created_at >= (CAST($period_from AS DATE) - CAST((isodow(CAST($as_of AS DATE)) + 4) % 7 AS INTEGER) * INTERVAL 1 DAY)
        AND ($status IS NULL OR h.status = $status)
      ORDER BY h.created_at DESC
    limit: 50
    example: {}

  - name: submit_hedge_trade_for_approval
    desc: Submit a proposed hedge trade for treasury approval. Returns the approval request id.
    kind: insert
    table: hedge_approval_queue
    id_prefix: APR-
    defaults: {status: pending, requested_at: "$as_of"}
    args:
      currency_pair: {required: true, desc: "Currency pair, e.g. GBP/USD"}
      exposure_gbp: {required: true, type: float, desc: "Exposure amount in GBP"}
      hedge_ratio_pct: {required: true, type: int, desc: "Proposed hedge ratio %"}
      instrument_type: {required: true, type: enum, values: [forward, option, collar, swap], desc: "Instrument type"}
      cost_gbp: {required: true, type: float, desc: "Estimated cost in GBP"}
      hedge_month: {type: date, desc: "Exposure month the trade covers"}
      rationale: {type: str, desc: "Why the trade is proposed"}
    example: {currency_pair: "GBP/USD", exposure_gbp: 5000000, hedge_ratio_pct: 75, instrument_type: forward, cost_gbp: 12500}
