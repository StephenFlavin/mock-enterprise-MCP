id: packaging_design
name: Packaging Design System
instructions: >
  Packaging specifications, materials, costs and technical data for product packaging.
  Pack spec ids look like PKS-000123. Covers cartons, pouches, rigid boxes, trays and more.
  Use it for pack costs, pallet fill, material specs, design changes and tech requirements.

tables:
  pack_specs:
    key: pack_spec_id
    cols:
      pack_spec_id: {type: str, desc: "Pack specification, e.g. PKS-000123"}
      sku: {desc: "Product SKU"}
      style_id: {desc: "Style id"}
      pack_type: {type: enum, values: [carton, pouch, rigid_box, tray, moulded_pulp, bag, polybag, hanging], desc: "Type of packaging"}
      material: {type: enum, values: [corrugated, moulded_pulp, recycled_plastic, rigid_plastic, paper, kraft, polybag], desc: "Primary material"}
      primary_supplier_id: {desc: "Main supplier of this pack"}
      height_mm: {type: int, desc: "Pack height in mm"}
      width_mm: {type: int, desc: "Pack width in mm"}
      depth_mm: {type: int, desc: "Pack depth in mm"}
      wall_thickness_mm: {type: float, desc: "Wall thickness in mm"}
      weight_g: {type: float, desc: "Pack weight in grams"}
      unit_cost_gbp: {type: float, desc: "Current cost per unit"}
      pallet_fill_units: {type: int, desc: "Units per pallet"}
      recycled_content_pct: {type: float, desc: "Percentage recycled content"}
      recyclable: {type: bool, desc: "Is it recyclable at end of life"}
      design_features: {type: text, desc: "Construction features, e.g. ribbing, inserts, corner clearance"}
      status: {type: enum, values: [active, obsolete, testing, archived], desc: "Status"}
      created_at: {type: timestamp, desc: "When spec was created"}
      updated_at: {type: timestamp, desc: "Last change"}

  pack_materials:
    key: material_id
    cols:
      material_id: {type: str, desc: "Material code, e.g. MAT-000123"}
      material: {type: str, desc: "Material code as used in pack_specs, e.g. moulded_pulp"}
      material_name: {type: str, desc: "Material name, e.g. Corrugated Cardboard"}
      supplier_id: {desc: "Primary supplier"}
      base_weight_g: {type: float, desc: "Base weight per unit in grams"}
      recycled_content_pct: {type: float, desc: "Percentage recycled content"}
      unit_cost_gbp: {type: float, desc: "Cost per unit at standard volume"}
      standard_volume: {type: int, desc: "Volume for quoted cost"}
      lead_time_days: {type: int, desc: "Lead time in days"}
      status: {type: str, desc: "Material status"}
      properties: {type: text, desc: "Material properties, strengths and weaknesses"}

  pack_quotes:
    key: quote_id
    cols:
      quote_id: {type: str, desc: "Quote id, e.g. QT-000123"}
      pack_spec_id: {desc: "Pack specification"}
      supplier_id: {desc: "Supplier providing quote"}
      unit_cost_gbp: {type: float, desc: "Cost per unit"}
      volume_units: {type: int, desc: "Volume for this quote"}
      moq_units: {type: int, desc: "Minimum order quantity"}
      lead_time_days: {type: int, desc: "Lead time in days"}
      valid_from: {type: date, desc: "Quote valid from"}
      valid_until: {type: date, desc: "Quote valid until"}
      notes: {type: str, desc: "Any special notes"}

  tech_packs:
    key: tech_pack_id
    cols:
      tech_pack_id: {type: str, desc: "Tech pack id, e.g. TP-000123"}
      style_id: {desc: "Style id"}
      construction_details: {type: str, desc: "Construction specification"}
      seam_strength_n: {type: float, desc: "Required seam strength in Newtons"}
      water_resistance_spec: {type: str, desc: "Water resistance requirement"}
      zip_pull_strength_n: {type: float, desc: "Zip pull strength in Newtons"}
      test_requirements: {type: str, desc: "Test methods required"}
      notes: {type: text, desc: "Technical notes"}
      status: {type: str, desc: "Status"}
      updated_at: {type: timestamp, desc: "Last updated"}

  ecommerce_specs:
    key: ecom_spec_id
    cols:
      ecom_spec_id: {type: str, desc: "E-commerce spec id, e.g. EC-000123"}
      sku: {desc: "Product SKU"}
      pack_type: {type: str, desc: "Type of packaging used"}
      protective_material: {type: str, desc: "Protective material inside, e.g. air pillows, kraft paper"}
      unit_cost_gbp: {type: float, desc: "Cost per package"}
      packing_notes: {type: text, desc: "Special packing instructions"}
      damage_rate_pct: {type: float, desc: "Observed damage rate"}
      updated_at: {type: timestamp, desc: "Last updated"}

  pack_change_history:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change record id, e.g. CHG-000123"}
      pack_spec_id: {desc: "Pack specification changed"}
      change_type: {type: str, desc: "Type of change, e.g. dimension, material, cost"}
      old_value: {type: str, desc: "Previous value"}
      new_value: {type: str, desc: "New value"}
      reason: {type: str, desc: "Reason for change"}
      changed_by: {type: str, desc: "Employee id who made change"}
      changed_at: {type: timestamp, desc: "When the change was made"}

  material_weights_by_market:
    key: weight_record_id
    cols:
      weight_record_id: {type: str, desc: "Record id, e.g. WGT-000123"}
      sku: {desc: "Product SKU"}
      material: {type: str, desc: "Material type"}
      market_country: {type: str, desc: "Market/country, e.g. UK, FR, DE, ES"}
      weight_g: {type: float, desc: "Pack weight in grams"}
      updated_at: {type: timestamp, desc: "Last updated"}

  pack_options:
    key: option_id
    cols:
      option_id: {type: str, desc: "Option id, e.g. PKO-000123"}
      sku: {desc: "Product SKU"}
      pack_spec_id: {desc: "Pack specification this option is costed on"}
      option_name: {type: str, desc: "Name of option, e.g. rigid box, flexible pouch"}
      pack_type: {type: str, desc: "Type of pack"}
      material: {type: str, desc: "Material used"}
      unit_cost_gbp: {type: float, desc: "Cost per unit"}
      pallet_fill_units: {type: int, desc: "Units per pallet"}
      shelf_appeal: {type: str, desc: "Visual appeal rating"}
      protection_level: {type: str, desc: "Level of protection"}
      recyclability: {type: str, desc: "End-of-life recyclability"}
      notes: {type: text, desc: "Notes on this option"}

  carton_specs:
    key: carton_id
    cols:
      carton_id: {type: str, desc: "Carton spec id, e.g. CTN-000123"}
      pack_spec_id: {desc: "Parent pack spec"}
      height_mm: {type: int, desc: "Carton height in mm"}
      width_mm: {type: int, desc: "Carton width in mm"}
      depth_mm: {type: int, desc: "Carton depth in mm"}
      wall_thickness_mm: {type: float, desc: "Wall thickness in mm"}
      unit_cost_gbp: {type: float, desc: "Cost per carton"}
      pallet_units: {type: int, desc: "Cartons per pallet"}
      crush_strength_kpa: {type: float, desc: "Crush strength in kPa"}
      status: {type: str, desc: "Status"}
      updated_at: {type: timestamp, desc: "Last updated"}

  channel_packaging_costs:
    key: channel_cost_id
    cols:
      channel_cost_id: {type: str, desc: "Record id, e.g. CC-000123"}
      sku: {desc: "Product SKU"}
      channel: {type: enum, values: [stores, online, wholesale], desc: "Sales channel"}
      fiscal_year: {type: str, desc: "Financial year of the actuals, e.g. FY26"}
      orders: {type: int, desc: "Orders (stores: replenishment orders) packed in the year"}
      units: {type: int, desc: "Units packed in the year"}
      cost_gbp_per_order: {type: float, desc: "Packaging cost per order"}
      cost_gbp_per_unit: {type: float, desc: "Packaging cost per unit"}
      packing_labour_pct: {type: float, desc: "Labour as % of total"}
      total_cost_gbp: {type: float, desc: "Total packaging cost for the year"}
      updated_at: {type: timestamp, desc: "Last updated"}

  packaging_portfolio:
    key: portfolio_id
    cols:
      portfolio_id: {type: str, desc: "Portfolio record id, e.g. POR-000123"}
      sku: {desc: "Product SKU"}
      style_id: {desc: "Style id"}
      primary_pack_type: {type: str, desc: "Primary packaging type"}
      alt_pack_types: {type: str, desc: "Alternative packs available"}
      sustainability_notes: {type: text, desc: "Sustainability considerations"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: get_packaging_spec_for_product
    desc: "Pack specifications for a product or category with material, supplier, size, unit cost, pallet fill, recycled content and recyclability. Use to compare pack options."
    kind: sql
    args:
      sku: {}
      category: {desc: "Product category, e.g. Small Appliances"}
      pack_type: {}
      material: {}
      status: {}
    sql: |
      SELECT ps.pack_spec_id, ps.sku, p.name AS product_name, ps.pack_type, ps.material, ps.primary_supplier_id,
             ps.height_mm, ps.width_mm, ps.depth_mm, ps.weight_g, ps.unit_cost_gbp, ps.pallet_fill_units,
             ps.recycled_content_pct, ps.recyclable, ps.status
      FROM pack_specs ps JOIN master.products p ON p.sku = ps.sku
      WHERE ($sku IS NULL OR ps.sku = $sku)
        AND ($category IS NULL OR p.category = $category)
        AND ($pack_type IS NULL OR ps.pack_type = $pack_type)
        AND ($material IS NULL OR ps.material = $material)
        AND ($status IS NULL OR ps.status = $status)
      ORDER BY ps.sku, ps.unit_cost_gbp
    limit: 20
    example: {sku: "SKU-100532"}

  - name: get_packaging_weights_by_material_and_market
    desc: "Packaging weight in grams per unit by material and market (UK, FR, DE, ES). Use for EPR fee and packaging tax calculations."
    kind: sql
    args:
      sku: {}
      category: {desc: "Product category, e.g. Small Appliances"}
      material: {}
      market_country: {}
    sql: |
      SELECT w.weight_record_id, w.sku, p.name AS product_name, w.material, w.market_country, w.weight_g, w.updated_at
      FROM material_weights_by_market w JOIN master.products p ON p.sku = w.sku
      WHERE ($sku IS NULL OR w.sku = $sku)
        AND ($category IS NULL OR p.category = $category)
        AND ($material IS NULL OR w.material = $material)
        AND ($market_country IS NULL OR w.market_country = upper($market_country))
      ORDER BY w.sku, w.material, w.market_country
    limit: 50
    example: {sku: "SKU-100532", market_country: UK}

  - name: get_packaging_spec_change_history
    desc: "Pack spec change log (material, thickness, supplier, dimensions) with dates, reasons and SKU. Use to see what changed on a product's pack."
    kind: sql
    args:
      sku: {}
      pack_spec_id: {}
      change_type: {type: str, desc: "Type of change, e.g. material, supplier, dimension, wall_thickness"}
      changed_from: {type: date, default: "-90d", desc: "Only changes on or after this date"}
    sql: |
      SELECT h.change_id, h.pack_spec_id, ps.sku, p.name AS product_name, h.change_type, h.old_value, h.new_value,
             h.reason, h.changed_by, h.changed_at
      FROM pack_change_history h
      JOIN pack_specs ps ON ps.pack_spec_id = h.pack_spec_id
      JOIN master.products p ON p.sku = ps.sku
      WHERE ($sku IS NULL OR ps.sku = $sku)
        AND ($pack_spec_id IS NULL OR h.pack_spec_id = $pack_spec_id)
        AND ($change_type IS NULL OR h.change_type = $change_type)
        AND CAST(h.changed_at AS DATE) >= CAST($changed_from AS DATE)
      ORDER BY h.changed_at DESC, h.change_id
    limit: 50
    example: {sku: "K-1700"}

  - name: get_current_ecommerce_pack_specs
    desc: "Current e-commerce pack for a product or category with protective material, cost per pack and damage rate, worst damage first. Use to review how we ship online."
    kind: sql
    args:
      sku: {}
      category: {desc: "Product category, e.g. Small Appliances"}
      protective_material: {type: str, desc: "Protective material inside, e.g. air pillows, kraft paper"}
    sql: |
      SELECT e.ecom_spec_id, e.sku, p.name AS product_name, p.category, e.pack_type, e.protective_material,
             e.unit_cost_gbp, e.damage_rate_pct, e.packing_notes
      FROM ecommerce_specs e JOIN master.products p ON p.sku = e.sku
      WHERE ($sku IS NULL OR e.sku = $sku)
        AND ($category IS NULL OR p.category = $category)
        AND ($protective_material IS NULL OR e.protective_material ILIKE '%' || $protective_material || '%')
      ORDER BY e.damage_rate_pct DESC, e.sku
    limit: 20
    example: {sku: "K-1700"}

  - name: get_tech_pack_for_style
    desc: "Tech pack for a style with construction details, seam strength, water resistance, zip pull strength and required tests. Use to check what a sample must meet."
    kind: select
    from: tech_packs
    filters:
      style_id: {}
    columns: [tech_pack_id, style_id, construction_details, seam_strength_n, water_resistance_spec, zip_pull_strength_n, test_requirements, notes, status, updated_at]
    order: tech_pack_id
    limit: 5
    example: {style_id: "STY-7731"}

  - name: get_pack_dimensions_and_specs
    desc: "Pack dimensions, wall thickness, weight and design features (ribbing, inserts) for a product's packs. Use to review pack design."
    kind: sql
    args:
      pack_spec_id: {}
      sku: {}
      material: {}
      pack_type: {}
    sql: |
      SELECT ps.pack_spec_id, ps.sku, ps.pack_type, ps.material, ps.height_mm, ps.width_mm, ps.depth_mm,
             ps.wall_thickness_mm, ps.weight_g, ps.design_features, ps.unit_cost_gbp, ps.status
      FROM pack_specs ps
      WHERE ($pack_spec_id IS NULL OR ps.pack_spec_id = $pack_spec_id)
        AND ($sku IS NULL OR ps.sku = $sku)
        AND ($material IS NULL OR ps.material = $material)
        AND ($pack_type IS NULL OR ps.pack_type = $pack_type)
      ORDER BY ps.sku, ps.pack_spec_id
    limit: 20
    example: {sku: "SKU-100658", material: moulded_pulp}

  - name: get_material_specs_for_pack
    desc: "Material specs for a pack spec: material properties, recycled content, supplier, lead time and standard cost. Use with pack dimensions."
    kind: sql
    args:
      pack_spec_id: {required: true}
    sql: |
      SELECT ps.pack_spec_id, ps.material, pm.material_id, pm.material_name, pm.supplier_id, pm.base_weight_g,
             pm.recycled_content_pct, pm.unit_cost_gbp AS material_unit_cost_gbp, pm.lead_time_days,
             pm.properties, ps.wall_thickness_mm, ps.unit_cost_gbp AS pack_cost_gbp
      FROM pack_specs ps LEFT JOIN pack_materials pm ON pm.material = ps.material
      WHERE ps.pack_spec_id = $pack_spec_id
    limit: 5
    example: {pack_spec_id: "PKS-900011"}

  - name: get_pack_cost_quotes
    desc: "Supplier quotes for a pack spec or product with volume tiers, MOQ and lead times, cheapest first."
    kind: sql
    args:
      pack_spec_id: {}
      sku: {}
      supplier_id: {}
    sql: |
      SELECT q.quote_id, q.pack_spec_id, ps.sku, ps.pack_type, ps.material, q.supplier_id, q.unit_cost_gbp,
             q.volume_units, q.moq_units, q.lead_time_days, q.valid_until, q.notes
      FROM pack_quotes q JOIN pack_specs ps ON ps.pack_spec_id = q.pack_spec_id
      WHERE ($pack_spec_id IS NULL OR q.pack_spec_id = $pack_spec_id)
        AND ($sku IS NULL OR ps.sku = $sku)
        AND ($supplier_id IS NULL OR q.supplier_id = $supplier_id)
      ORDER BY q.pack_spec_id, q.volume_units
    limit: 20
    example: {pack_spec_id: "PKS-900009"}

  - name: calculate_unit_cost_of_pack_change
    desc: "Unit cost after changing pack dimensions, wall thickness or adding ribbing material. Returns current and new cost per unit and the difference."
    kind: sql
    args:
      pack_spec_id: {required: true}
      new_height_mm: {type: int, desc: "New height in mm (optional)"}
      new_width_mm: {type: int, desc: "New width in mm (optional)"}
      new_depth_mm: {type: int, desc: "New depth in mm (optional)"}
      new_wall_thickness_mm: {type: float, desc: "New wall thickness in mm (optional)"}
      added_rib_material_pct: {type: float, desc: "Extra material added by ribbing, % of current (optional)"}
    sql: |
      WITH x AS (
        SELECT ps.*,
               COALESCE($new_height_mm, ps.height_mm) AS h2, COALESCE($new_width_mm, ps.width_mm) AS w2,
               COALESCE($new_depth_mm, ps.depth_mm) AS d2,
               COALESCE($new_wall_thickness_mm, ps.wall_thickness_mm) AS t2,
               COALESCE($added_rib_material_pct, 0) AS rib
        FROM pack_specs ps WHERE ps.pack_spec_id = $pack_spec_id
      ), y AS (
        SELECT *, ((h2 * w2 + h2 * d2 + w2 * d2) * t2 * (1 + rib / 100.0))
                  / ((height_mm * width_mm + height_mm * depth_mm + width_mm * depth_mm) * wall_thickness_mm) AS material_ratio
        FROM x
      )
      SELECT pack_spec_id, material, height_mm, width_mm, depth_mm, wall_thickness_mm,
             h2 AS new_height_mm, w2 AS new_width_mm, d2 AS new_depth_mm, t2 AS new_wall_thickness_mm,
             rib AS added_rib_material_pct, round(material_ratio, 3) AS material_use_ratio,
             unit_cost_gbp AS current_cost_gbp,
             round(unit_cost_gbp * (0.3 + 0.7 * material_ratio), 2) AS new_cost_gbp,
             round(unit_cost_gbp * (0.3 + 0.7 * material_ratio) - unit_cost_gbp, 2) AS cost_change_per_unit_gbp,
             round((0.3 + 0.7 * material_ratio - 1) * 100, 1) AS cost_change_pct,
             'new_cost = current_cost * (30% fixed + 70% * material_use_ratio); material_use_ratio = new surface area * wall * (1 + rib%) / current surface area * wall' AS formula
      FROM y
    limit: 1
    example: {pack_spec_id: "PKS-900011", new_wall_thickness_mm: 4.5}

  - name: get_packaging_option_specs
    desc: "Alternative pack options for a product (rigid box, pouch, tray) with cost, pallet fill, shelf appeal, protection and recyclability."
    kind: select
    from: pack_options
    filters:
      sku: {}
      option_name: {op: like, desc: "Option name, e.g. rigid box or pouch"}
    columns: [option_id, sku, pack_spec_id, option_name, pack_type, material, unit_cost_gbp, pallet_fill_units, shelf_appeal, protection_level, recyclability, notes]
    order: unit_cost_gbp
    limit: 10
    example: {sku: "SKU-100091"}

  - name: calculate_pallet_fill_for_pack
    desc: "Units per pallet and pallets needed for a volume, optionally with all pack dimensions reduced by a percentage. Use for pallet-fill effect of resizing."
    kind: sql
    args:
      pack_spec_id: {required: true}
      volume_units: {type: int, default: 400000, desc: "Total units needed"}
      size_reduction_pct: {type: float, default: 0, desc: "Reduce height, width and depth by this percentage"}
    sql: |
      WITH s AS (
        SELECT pack_spec_id, sku, pack_type, height_mm AS h, width_mm AS w, depth_mm AS d, pallet_fill_units AS u,
               CAST(round(height_mm * (1 - $size_reduction_pct / 100.0)) AS INT) AS h2,
               CAST(round(width_mm * (1 - $size_reduction_pct / 100.0)) AS INT) AS w2,
               CAST(round(depth_mm * (1 - $size_reduction_pct / 100.0)) AS INT) AS d2
        FROM pack_specs WHERE pack_spec_id = $pack_spec_id
      ), g AS (
        SELECT *,
          greatest(floor(1200.0 / w) * floor(1000.0 / d), floor(1200.0 / d) * floor(1000.0 / w)) * floor(1800.0 / h) AS g_old,
          greatest(floor(1200.0 / w2) * floor(1000.0 / d2), floor(1200.0 / d2) * floor(1000.0 / w2)) * floor(1800.0 / h2) AS g_new
        FROM s
      ), n AS (
        SELECT *, CASE WHEN $size_reduction_pct = 0 THEN u ELSE CAST(round(u * g_new / NULLIF(g_old, 0)) AS INT) END AS u_new FROM g
      )
      SELECT pack_spec_id, sku, pack_type, h AS height_mm, w AS width_mm, d AS depth_mm,
             $size_reduction_pct AS size_reduction_pct, h2 AS new_height_mm, w2 AS new_width_mm, d2 AS new_depth_mm,
             $volume_units AS requested_units,
             u AS units_per_pallet_current, u_new AS units_per_pallet_new,
             CAST(ceil($volume_units * 1.0 / u) AS INT) AS pallets_needed_current,
             CAST(ceil($volume_units * 1.0 / u_new) AS INT) AS pallets_needed_new,
             CAST(ceil($volume_units * 1.0 / u) AS INT) - CAST(ceil($volume_units * 1.0 / u_new) AS INT) AS pallets_saved,
             round((u_new - u) * 100.0 / u, 1) AS pallet_fill_change_pct,
             'pallets_needed = ceil(requested_units / units_per_pallet); units_per_pallet_new = current * (units on a 1200x1000 pallet stacked to 1800 mm at new size / at current size)' AS formula
      FROM n
    limit: 1
    example: {pack_spec_id: "PKS-900001", size_reduction_pct: 10}

  - name: calculate_total_cost_per_unit_by_pack_option
    desc: "Total cost per unit for a pack option: pack, freight per pallet and expected damage. Run once per option to compare them."
    kind: sql
    args:
      option_id: {required: true}
      volume_units: {type: int, default: 400000, desc: "Annual volume"}
      freight_cost_gbp_per_pallet: {type: float, default: 150, desc: "Freight cost per pallet on the lane"}
      expected_damage_rate_pct: {type: float, desc: "Expected damage rate; if omitted uses 1.0 for high, 2.0 for medium, 3.5 for low protection"}
    sql: |
      WITH o AS (
        SELECT po.*, p.unit_cost_gbp AS product_cost_gbp,
               COALESCE($expected_damage_rate_pct, CASE po.protection_level WHEN 'high' THEN 1.0 WHEN 'medium' THEN 2.0 ELSE 3.5 END) AS dmg
        FROM pack_options po LEFT JOIN master.products p ON p.sku = po.sku
        WHERE po.option_id = $option_id
      )
      SELECT option_id, sku, option_name, material, protection_level, recyclability, unit_cost_gbp AS pack_cost_gbp,
             pallet_fill_units, $freight_cost_gbp_per_pallet AS freight_cost_gbp_per_pallet,
             round($freight_cost_gbp_per_pallet / pallet_fill_units, 2) AS freight_cost_per_unit_gbp,
             dmg AS damage_rate_pct, product_cost_gbp,
             round(dmg / 100.0 * (product_cost_gbp + unit_cost_gbp), 2) AS damage_cost_per_unit_gbp,
             round(unit_cost_gbp + $freight_cost_gbp_per_pallet / pallet_fill_units + dmg / 100.0 * (product_cost_gbp + unit_cost_gbp), 2) AS total_cost_per_unit_gbp,
             round($volume_units * (unit_cost_gbp + $freight_cost_gbp_per_pallet / pallet_fill_units + dmg / 100.0 * (product_cost_gbp + unit_cost_gbp)), 0) AS annual_total_cost_gbp,
             'total = pack_cost + freight_per_pallet / pallet_fill + damage_rate * (product_cost + pack_cost)' AS formula
      FROM o
    limit: 1
    example: {option_id: "PKO-900001"}

  - name: get_carton_specs
    desc: "Carton dimensions, wall thickness, cost, cartons per pallet and crush strength for a pack spec or product."
    kind: sql
    args:
      pack_spec_id: {}
      sku: {}
    sql: |
      SELECT c.carton_id, c.pack_spec_id, ps.sku, c.height_mm, c.width_mm, c.depth_mm, c.wall_thickness_mm,
             c.unit_cost_gbp, c.pallet_units, c.crush_strength_kpa, c.status
      FROM carton_specs c JOIN pack_specs ps ON ps.pack_spec_id = c.pack_spec_id
      WHERE ($pack_spec_id IS NULL OR c.pack_spec_id = $pack_spec_id)
        AND ($sku IS NULL OR ps.sku = $sku)
      ORDER BY c.carton_id
    limit: 10
    example: {pack_spec_id: "PKS-900001"}

  - name: calculate_carton_cost_at_new_dimensions
    desc: "Carton cost per unit after shrinking all dimensions by a percentage, with new dimensions, board saving and annual saving."
    kind: sql
    args:
      carton_id: {required: true}
      size_reduction_pct: {type: float, default: 10, desc: "Size reduction percentage"}
      volume_units: {type: int, default: 400000, desc: "Annual cartons"}
    sql: |
      WITH c AS (
        SELECT *, 1 - $size_reduction_pct / 100.0 AS k FROM carton_specs WHERE carton_id = $carton_id
      )
      SELECT carton_id, pack_spec_id, height_mm, width_mm, depth_mm, unit_cost_gbp AS current_cost_gbp,
             CAST(round(height_mm * k) AS INT) AS new_height_mm, CAST(round(width_mm * k) AS INT) AS new_width_mm,
             CAST(round(depth_mm * k) AS INT) AS new_depth_mm,
             round(unit_cost_gbp * (0.3 + 0.7 * k * k), 2) AS new_cost_gbp,
             round(unit_cost_gbp - unit_cost_gbp * (0.3 + 0.7 * k * k), 2) AS saving_per_unit_gbp,
             round($volume_units * (unit_cost_gbp - unit_cost_gbp * (0.3 + 0.7 * k * k)), 0) AS annual_saving_gbp,
             CAST($size_reduction_pct AS VARCHAR) || '% reduction in each dimension' AS change_description,
             'new_cost = current_cost * (30% fixed + 70% * (1 - reduction)^2); board area scales with the square of the size' AS formula
      FROM c
    limit: 1
    example: {carton_id: "CTN-900001"}

  - name: update_carton_dimensions_in_pack_spec
    desc: "Updates carton dimensions in the packaging specification. Saves new height, width and depth for the pack spec."
    kind: update
    table: pack_specs
    set: {updated_at: "$as_of"}
    args:
      height_mm: {type: int, required: true, desc: "New height in mm"}
      width_mm: {type: int, required: true, desc: "New width in mm"}
      depth_mm: {type: int, required: true, desc: "New depth in mm"}
    example: {pack_spec_id: "PKS-900001", height_mm: 225, width_mm: 180, depth_mm: 135}

  - name: get_own_packaging_portfolio
    desc: "Our packs in use per product with category, alternatives, sustainability notes and last-52-week units. Use for sustainability and product-mix reviews."
    kind: sql
    args:
      sku: {}
      style_id: {}
      category: {desc: "Product category, e.g. Small Appliances"}
    sql: |
      SELECT pf.portfolio_id, pf.sku, p.name AS product_name, p.category, pf.style_id, pf.primary_pack_type,
             pf.alt_pack_types, pf.sustainability_notes,
             COALESCE(s.units_52w, 0) AS units_last_52w
      FROM packaging_portfolio pf
      JOIN master.products p ON p.sku = pf.sku
      LEFT JOIN (SELECT sku, sum(store_units + online_units) AS units_52w FROM master.sales_weekly GROUP BY sku) s ON s.sku = pf.sku
      WHERE ($sku IS NULL OR pf.sku = $sku)
        AND ($style_id IS NULL OR pf.style_id = $style_id)
        AND ($category IS NULL OR p.category = $category)
      ORDER BY units_last_52w DESC, pf.sku
    limit: 50
    example: {category: "Small Appliances"}

  - name: get_packaging_cost_by_channel
    desc: "Packaging cost per order and per unit by channel (stores, online, wholesale) from actuals, with total spend and packing labour share. Filter by SKU or category."
    kind: sql
    args:
      fiscal_year: {type: str, default: FY26, desc: "Financial year of actuals, e.g. FY26"}
      channel: {}
      sku: {}
      category: {desc: "Product category, e.g. Small Appliances"}
    sql: |
      SELECT cp.channel, cp.fiscal_year, count(DISTINCT cp.sku) AS skus, sum(cp.orders) AS orders, sum(cp.units) AS units,
             round(sum(cp.total_cost_gbp), 0) AS packaging_cost_gbp,
             round(sum(cp.total_cost_gbp) / sum(cp.orders), 2) AS cost_gbp_per_order,
             round(sum(cp.total_cost_gbp) / sum(cp.units), 3) AS cost_gbp_per_unit,
             round(sum(cp.total_cost_gbp * cp.packing_labour_pct) / sum(cp.total_cost_gbp), 1) AS packing_labour_pct
      FROM channel_packaging_costs cp JOIN master.products p ON p.sku = cp.sku
      WHERE cp.fiscal_year = $fiscal_year
        AND ($channel IS NULL OR cp.channel = $channel)
        AND ($sku IS NULL OR cp.sku = $sku)
        AND ($category IS NULL OR p.category = $category)
      GROUP BY cp.channel, cp.fiscal_year
      ORDER BY CASE cp.channel WHEN 'stores' THEN 1 WHEN 'online' THEN 2 ELSE 3 END
    limit: 5
    example: {fiscal_year: FY26}
