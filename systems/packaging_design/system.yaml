id: packaging_design
name: Packaging Design System
instructions: >
  Packaging specifications, materials, costs and technical data for product packaging.
  Pack spec ids look like PKS-000123. Covers cartons, pouches, rigid boxes, trays and more.
  Use it for pack costs, pallet fill, material specs, design changes and tech requirements.

tables:
  pack_specs:
    key: pack_spec_id
    cols:
      pack_spec_id: {type: str, desc: "Pack specification, e.g. PKS-000123"}
      sku: {desc: "Product SKU"}
      style_id: {desc: "Style id"}
      pack_type: {type: enum, values: [carton, pouch, rigid_box, tray, moulded_pulp, bag, polybag], desc: "Type of packaging"}
      material: {type: enum, values: [corrugated, moulded_pulp, recycled_plastic, rigid_plastic, paper, kraft, polybag], desc: "Primary material"}
      primary_supplier_id: {desc: "Main supplier of this pack"}
      height_mm: {type: int, desc: "Pack height in mm"}
      width_mm: {type: int, desc: "Pack width in mm"}
      depth_mm: {type: int, desc: "Pack depth in mm"}
      wall_thickness_mm: {type: float, desc: "Wall thickness in mm"}
      weight_gbp: {type: float, desc: "Pack weight in grams"}
      unit_cost_gbp: {type: float, desc: "Current cost per unit"}
      pallet_fill_units: {type: int, desc: "Units per pallet"}
      recycled_content_pct: {type: float, desc: "Percentage recycled content"}
      recyclable: {type: bool, desc: "Is it recyclable at end of life"}
      status: {type: enum, values: [active, obsolete, testing, archived], desc: "Status"}
      created_at: {type: timestamp, desc: "When spec was created"}
      updated_at: {type: timestamp, desc: "Last change"}

  pack_materials:
    key: material_id
    cols:
      material_id: {type: str, desc: "Material code, e.g. MAT-000123"}
      material_name: {type: str, desc: "Material name, e.g. Corrugated Cardboard"}
      supplier_id: {desc: "Primary supplier"}
      base_weight_gbp: {type: float, desc: "Base weight per unit"}
      recycled_content_pct: {type: float, desc: "Percentage recycled content"}
      unit_cost_gbp: {type: float, desc: "Cost per unit at standard volume"}
      standard_volume: {type: int, desc: "Volume for quoted cost"}
      lead_time_days: {type: int, desc: "Lead time in days"}
      status: {type: str, desc: "Material status"}

  pack_quotes:
    key: quote_id
    cols:
      quote_id: {type: str, desc: "Quote id, e.g. QT-000123"}
      pack_spec_id: {desc: "Pack specification"}
      supplier_id: {desc: "Supplier providing quote"}
      unit_cost_gbp: {type: float, desc: "Cost per unit"}
      volume_units: {type: int, desc: "Volume for this quote"}
      moq_units: {type: int, desc: "Minimum order quantity"}
      lead_time_days: {type: int, desc: "Lead time in days"}
      valid_from: {type: date, desc: "Quote valid from"}
      valid_until: {type: date, desc: "Quote valid until"}
      notes: {type: str, desc: "Any special notes"}

  tech_packs:
    key: tech_pack_id
    cols:
      tech_pack_id: {type: str, desc: "Tech pack id, e.g. TP-000123"}
      style_id: {desc: "Style id"}
      construction_details: {type: str, desc: "Construction specification"}
      seam_strength_n: {type: float, desc: "Required seam strength in Newtons"}
      water_resistance_spec: {type: str, desc: "Water resistance requirement"}
      zip_pull_strength_n: {type: float, desc: "Zip pull strength in Newtons"}
      test_requirements: {type: str, desc: "Test methods required"}
      notes: {type: text, desc: "Technical notes"}
      status: {type: str, desc: "Status"}
      updated_at: {type: timestamp, desc: "Last updated"}

  ecommerce_specs:
    key: ecom_spec_id
    cols:
      ecom_spec_id: {type: str, desc: "E-commerce spec id, e.g. EC-000123"}
      sku: {desc: "Product SKU"}
      pack_type: {type: str, desc: "Type of packaging used"}
      protective_material: {type: str, desc: "Protective material inside, e.g. air pillows, kraft paper"}
      unit_cost_gbp: {type: float, desc: "Cost per package"}
      packing_notes: {type: text, desc: "Special packing instructions"}
      damage_rate_pct: {type: float, desc: "Observed damage rate"}
      updated_at: {type: timestamp, desc: "Last updated"}

  pack_change_history:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change record id, e.g. CHG-000123"}
      pack_spec_id: {desc: "Pack specification changed"}
      change_type: {type: str, desc: "Type of change, e.g. dimension, material, cost"}
      old_value: {type: str, desc: "Previous value"}
      new_value: {type: str, desc: "New value"}
      reason: {type: str, desc: "Reason for change"}
      changed_by: {type: str, desc: "Employee id who made change"}
      changed_at: {type: timestamp, desc: "When the change was made"}

  material_weights_by_market:
    key: weight_record_id
    cols:
      weight_record_id: {type: str, desc: "Record id, e.g. WGT-000123"}
      sku: {desc: "Product SKU"}
      material: {type: str, desc: "Material type"}
      market_country: {type: str, desc: "Market/country, e.g. UK, FR, DE, ES"}
      weight_gbp: {type: float, desc: "Pack weight in grams"}
      updated_at: {type: timestamp, desc: "Last updated"}

  pack_options:
    key: option_id
    cols:
      option_id: {type: str, desc: "Option id, e.g. PKO-000123"}
      product_id: {desc: "Product/SKU"}
      option_name: {type: str, desc: "Name of option, e.g. rigid box, flexible pouch"}
      pack_type: {type: str, desc: "Type of pack"}
      material: {type: str, desc: "Material used"}
      unit_cost_gbp: {type: float, desc: "Cost per unit"}
      pallet_fill_units: {type: int, desc: "Units per pallet"}
      shelf_appeal: {type: str, desc: "Visual appeal rating"}
      protection_level: {type: str, desc: "Level of protection"}
      recyclability: {type: str, desc: "End-of-life recyclability"}
      notes: {type: text, desc: "Notes on this option"}

  carton_specs:
    key: carton_id
    cols:
      carton_id: {type: str, desc: "Carton spec id, e.g. CTN-000123"}
      pack_spec_id: {desc: "Parent pack spec"}
      height_mm: {type: int, desc: "Carton height in mm"}
      width_mm: {type: int, desc: "Carton width in mm"}
      depth_mm: {type: int, desc: "Carton depth in mm"}
      wall_thickness_mm: {type: float, desc: "Wall thickness in mm"}
      unit_cost_gbp: {type: float, desc: "Cost per carton"}
      pallet_units: {type: int, desc: "Cartons per pallet"}
      crush_strength_kpa: {type: float, desc: "Crush strength in kPa"}
      status: {type: str, desc: "Status"}
      updated_at: {type: timestamp, desc: "Last updated"}

  channel_packaging_costs:
    key: channel_cost_id
    cols:
      channel_cost_id: {type: str, desc: "Record id, e.g. CC-000123"}
      sku: {desc: "Product SKU"}
      channel: {type: enum, values: [stores, online, wholesale], desc: "Sales channel"}
      cost_gbp_per_order: {type: float, desc: "Packaging cost per order"}
      cost_gbp_per_unit: {type: float, desc: "Packaging cost per unit"}
      packing_labour_pct: {type: float, desc: "Labour as % of total"}
      updated_at: {type: timestamp, desc: "Last updated"}

  packaging_portfolio:
    key: portfolio_id
    cols:
      portfolio_id: {type: str, desc: "Portfolio record id, e.g. POR-000123"}
      sku: {desc: "Product SKU"}
      style_id: {desc: "Style id"}
      primary_pack_type: {type: str, desc: "Primary packaging type"}
      alt_pack_types: {type: str, desc: "Alternative packs available"}
      sustainability_notes: {type: text, desc: "Sustainability considerations"}
      updated_at: {type: timestamp, desc: "Last updated"}

tools:
  - name: get_packaging_spec_for_product
    desc: Pack specification for a product. Returns dimensions, material, supplier and cost.
    kind: select
    from: pack_specs
    filters:
      sku: {}
      pack_type: {}
      material: {}
      status: {default: active}
    columns: [pack_spec_id, sku, pack_type, material, primary_supplier_id, height_mm, width_mm, depth_mm, unit_cost_gbp, pallet_fill_units, recyclable]
    order: pack_spec_id
    limit: 10
    example: {sku: "SKU-100091"}

  - name: get_packaging_weights_by_material_and_market
    desc: Packaging weight by material type and market. Use to compare materials across regions.
    kind: select
    from: material_weights_by_market
    filters:
      sku: {}
      material: {}
      market_country: {}
    columns: [weight_record_id, sku, material, market_country, weight_gbp, updated_at]
    order: market_country
    limit: 20
    example: {sku: "SKU-100091", market_country: UK}

  - name: get_packaging_spec_change_history
    desc: Pack spec change log. Shows all changes to pack specs with dates and reasons.
    kind: select
    from: pack_change_history
    filters:
      pack_spec_id: {}
      change_type: {}
      changed_from: {col: changed_at, op: ">=", type: date, default: "-90d"}
    columns: [change_id, pack_spec_id, change_type, old_value, new_value, reason, changed_at]
    order: changed_at DESC
    limit: 50
    example: {pack_spec_id: "PKS-900008"}

  - name: get_current_ecommerce_pack_specs
    desc: Current e-commerce pack specifications. Returns protective materials, costs and damage rates.
    kind: select
    from: ecommerce_specs
    filters:
      sku: {}
      pack_type: {}
    columns: [ecom_spec_id, sku, pack_type, protective_material, unit_cost_gbp, damage_rate_pct, packing_notes]
    order: sku
    limit: 20
    example: {sku: "SKU-100091"}

  - name: get_tech_pack_for_style
    desc: Return tech pack for style. Returns construction, test requirements and specifications.
    kind: select
    from: tech_packs
    filters:
      style_id: {}
    columns: [tech_pack_id, style_id, construction_details, seam_strength_n, water_resistance_spec, zip_pull_strength_n, test_requirements]
    order: tech_pack_id
    limit: 5
    example: {style_id: "STY-5520"}

  - name: get_pack_dimensions_and_specs
    desc: Return pack dimensions and specs. Shows height, width, depth and wall thickness.
    kind: select
    from: pack_specs
    filters:
      pack_spec_id: {}
      sku: {}
    columns: [pack_spec_id, sku, pack_type, material, height_mm, width_mm, depth_mm, wall_thickness_mm, weight_gbp]
    order: pack_spec_id
    limit: 10
    example: {sku: "SKU-100091"}

  - name: get_material_specs_for_pack
    desc: Return material specs for pack. Returns material properties, cost and supplier.
    kind: sql
    args:
      pack_spec_id: {required: true}
    sql: |
      SELECT ps.pack_spec_id, ps.material, pm.material_id, pm.material_name, pm.supplier_id,
             pm.base_weight_gbp, pm.recycled_content_pct, pm.unit_cost_gbp, pm.lead_time_days
      FROM pack_specs ps
      LEFT JOIN pack_materials pm ON ps.material = pm.material_name
      WHERE ps.pack_spec_id = $pack_spec_id
    limit: 5
    example: {pack_spec_id: "PKS-900001"}

  - name: get_pack_cost_quotes
    desc: Return pack cost quotes. Shows supplier quotes with volume tiers and lead times.
    kind: select
    from: pack_quotes
    filters:
      pack_spec_id: {}
      supplier_id: {}
    columns: [quote_id, pack_spec_id, supplier_id, unit_cost_gbp, volume_units, moq_units, lead_time_days, valid_until]
    order: unit_cost_gbp
    limit: 20
    example: {pack_spec_id: "PKS-900001"}

  - name: calculate_unit_cost_of_pack_change
    desc: Calculate unit cost of pack change. Returns current vs new cost and total savings.
    kind: sql
    args:
      pack_spec_id: {required: true}
      new_height_mm: {type: int, desc: "New height in mm (optional)"}
      new_width_mm: {type: int, desc: "New width in mm (optional)"}
      new_depth_mm: {type: int, desc: "New depth in mm (optional)"}
      new_wall_thickness_mm: {type: float, desc: "New wall thickness in mm (optional)"}
    sql: |
      SELECT pack_spec_id,
             unit_cost_gbp AS current_cost_gbp,
             round(unit_cost_gbp * 0.95, 2) AS estimated_new_cost_gbp,
             round(unit_cost_gbp * 0.05, 2) AS estimated_saving_per_unit_gbp,
             'estimated_saving = current_cost * 5% per mm reduction' AS formula
      FROM pack_specs
      WHERE pack_spec_id = $pack_spec_id
    limit: 1
    example: {pack_spec_id: "PKS-900001"}

  - name: get_packaging_option_specs
    desc: Return packaging option specs. Shows alternative pack options with costs and properties.
    kind: select
    from: pack_options
    filters:
      product_id: {}
      option_name: {}
    columns: [option_id, product_id, option_name, pack_type, material, unit_cost_gbp, pallet_fill_units, shelf_appeal, protection_level, recyclability]
    order: unit_cost_gbp
    limit: 10
    example: {product_id: "SKU-100091"}

  - name: calculate_pallet_fill_for_pack
    desc: Calculate pallet fill for pack. Returns units per pallet and pallets needed for volume.
    kind: sql
    args:
      pack_spec_id: {required: true}
      volume_units: {type: int, default: 400000, desc: "Total units needed"}
    sql: |
      SELECT pack_spec_id, pallet_fill_units,
             $volume_units AS requested_units,
             CEIL(CAST($volume_units AS FLOAT) / pallet_fill_units) AS pallets_needed,
             round($volume_units / CAST(pallet_fill_units AS FLOAT) * 100, 0) AS pallet_utilization_pct,
             'pallets_needed = ceil(requested_units / pallet_fill_units)' AS formula
      FROM pack_specs
      WHERE pack_spec_id = $pack_spec_id
    limit: 1
    example: {pack_spec_id: "PKS-900001", volume_units: 400000}

  - name: calculate_total_cost_per_unit_by_pack_option
    desc: Calculate total cost per unit by pack option. Includes pack, freight and damage.
    kind: sql
    args:
      option_id: {required: true}
      volume_units: {type: int, default: 400000, desc: "Annual volume"}
      freight_cost_gbp_per_pallet: {type: float, default: 150, desc: "Freight per pallet"}
      expected_damage_rate_pct: {type: float, default: 1.5, desc: "Expected damage rate"}
    sql: |
      SELECT option_id, pack_type, material, unit_cost_gbp,
             round($freight_cost_gbp_per_pallet / 200, 2) AS freight_cost_per_unit_gbp,
             round(unit_cost_gbp * $expected_damage_rate_pct / 100, 2) AS damage_cost_per_unit_gbp,
             round(unit_cost_gbp + ($freight_cost_gbp_per_pallet / 200) + (unit_cost_gbp * $expected_damage_rate_pct / 100), 2) AS total_cost_per_unit_gbp,
             'total = pack_cost + freight + damage' AS formula
      FROM pack_options
      WHERE option_id = $option_id
    limit: 1
    example: {option_id: "PKO-900001"}

  - name: get_carton_specs
    desc: Return carton specs. Shows dimensions, wall thickness, cost and crush strength.
    kind: select
    from: carton_specs
    filters:
      pack_spec_id: {}
    columns: [carton_id, pack_spec_id, height_mm, width_mm, depth_mm, wall_thickness_mm, unit_cost_gbp, pallet_units, crush_strength_kpa]
    order: carton_id
    limit: 10
    example: {pack_spec_id: "PKS-900001"}

  - name: calculate_carton_cost_at_new_dimensions
    desc: Calculate carton cost at new dimensions. Shows cost impact of dimension changes.
    kind: sql
    args:
      carton_id: {required: true}
      size_reduction_pct: {type: float, default: 10, desc: "Size reduction percentage"}
    sql: |
      SELECT carton_id, unit_cost_gbp AS current_cost_gbp,
             round(unit_cost_gbp * (100 - $size_reduction_pct) / 100, 2) AS estimated_cost_at_new_size_gbp,
             round(unit_cost_gbp * $size_reduction_pct / 100, 2) AS estimated_saving_gbp,
             CAST($size_reduction_pct AS TEXT) || '% reduction in dimensions' AS change_description,
             'new_cost = current_cost * (100 - reduction_pct) / 100' AS formula
      FROM carton_specs
      WHERE carton_id = $carton_id
    limit: 1
    example: {carton_id: "CTN-900001"}

  - name: update_carton_dimensions_in_pack_spec
    desc: Updates carton dimensions in the packaging specification. Saves new height/width/depth.
    kind: update
    table: pack_specs
    set: {updated_at: "$as_of"}
    args:
      height_mm: {type: int, desc: "New height in mm"}
      width_mm: {type: int, desc: "New width in mm"}
      depth_mm: {type: int, desc: "New depth in mm"}
    example: {pack_spec_id: "PKS-900001", height_mm: 200, width_mm: 150, depth_mm: 100}

  - name: get_own_packaging_portfolio
    desc: Return own packaging portfolio. Shows all packs in use and sustainability notes.
    kind: select
    from: packaging_portfolio
    filters:
      sku: {}
      style_id: {}
    columns: [portfolio_id, sku, style_id, primary_pack_type, alt_pack_types, sustainability_notes]
    order: sku
    limit: 50
    example: {}

  - name: get_packaging_cost_by_channel
    desc: Packaging cost per order or unit by channel. Shows stores, online and wholesale costs.
    kind: select
    from: channel_packaging_costs
    filters:
      sku: {}
      channel: {}
    columns: [channel_cost_id, sku, channel, cost_gbp_per_order, cost_gbp_per_unit, packing_labour_pct]
    order: channel
    limit: 20
    example: {sku: "SKU-100091", channel: online}
