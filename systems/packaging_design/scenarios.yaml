# One entry per question row that uses this system's tools (see: python -m mockmcp brief packaging_design).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "04:40:Q1"
  story: >
    Small appliance SKU-100532 (STY-4301) has three packs: corrugated carton PKS-900001 (0.85 GBP, 280 per pallet,
    70% recycled), moulded pulp tray PKS-900002 (0.92 GBP, 240 per pallet, 95% recycled) and recycled plastic
    clamshell PKS-900003 (0.78 GBP, 400 per pallet, 80% recycled). Costs and recycled content match the costing system.
  checks:
    - tool: get_packaging_spec_for_product
      args: {sku: "SKU-100532"}
      expect: ["PKS-900001", "0.85", "PKS-900002", "0.92", "240", "95", "PKS-900003", "0.78", "400"]
    - tool: get_packaging_spec_for_product
      args: {sku: "SKU-100532", material: moulded_pulp}
      expect: ["PKS-900002", "0.92"]
    - tool: get_packaging_spec_for_product
      args: {category: "Small Appliances", material: recycled_plastic}
      expect: ["PKS-900003", "0.78"]

- question: "04:40:Q2"
  story: >
    Packaging weights for SKU-100532 in the UK, France, Germany and Spain: corrugated 45 g, moulded pulp 52 g,
    recycled plastic 38 g, identical in each market and equal to the pack spec weights.
  checks:
    - tool: get_packaging_weights_by_material_and_market
      args: {sku: "SKU-100532", market_country: UK}
      expect: ["WGT-900001", "45", "corrugated", "52", "moulded_pulp", "38", "recycled_plastic"]
    - tool: get_packaging_weights_by_material_and_market
      args: {sku: "SKU-100532", material: moulded_pulp}
      expect: ["52", "FR", "DE", "ES", "UK"]

- question: "04:40:Q3"
  story: >
    Glass items with pack changes in the last 90 days: K-1700 (PKS-900020) went from double-wall to single-wall
    corrugated and inner corner clearance fell from 25 to 12 mm; SKU-100091 (PKS-900008) moved from corrugated to
    1.8 mm recycled plastic and pack supplier SUP-0081 (corrugated) to SUP-0082 (film and plastics); SKU-104123 (PKS-900021) lost its card cell divider
    and changed pack supplier from SUP-0082 to SUP-0081. SKU-100532 had no pack change.
  checks:
    - tool: get_packaging_spec_change_history
      args: {sku: "K-1700"}
      expect: ["CHG-900004", "double-wall", "single-wall", "12 mm"]
    - tool: get_packaging_spec_change_history
      args: {sku: "SKU-100091"}
      expect: ["CHG-900001", "CHG-900002", "1.8 mm", "CHG-900003", "SUP-0082"]
    - tool: get_packaging_spec_change_history
      args: {sku: "SKU-104123"}
      expect: ["CHG-900006", "CHG-900007", "divider"]
    - tool: get_packaging_spec_change_history
      args: {pack_spec_id: "PKS-900008", change_type: material}
      expect: ["CHG-900001", "recycled plastic"]

- question: "04:40:Q6"
  story: >
    Current e-commerce packs for small appliances: K-1700 glass kettle in a single-wall carton wrapped in kraft paper
    only (EC-900007, 3.4% damage), SKU-100532 carton with tissue (2.1%), SKU-100658 carton with expanded foam (1.8%).
  checks:
    - tool: get_current_ecommerce_pack_specs
      args: {category: "Small Appliances"}
      expect: ["EC-900007", "kraft paper", "3.4", "EC-900002", "2.1", "EC-900003", "expanded foam", "1.8"]
    - tool: get_current_ecommerce_pack_specs
      args: {sku: "SKU-100091"}
      expect: ["EC-900001", "air pillows", "1.85"]

- question: "06:51:Q4"
  story: >
    Backpack style STY-9509 (SKU-106363, the same backpack as the test lab sample rounds): tech pack TP-900001 requires 140 N zip
    pull strength with the approved #8 coil zip, slider lug 1.4 mm and puller riveted to the lug; seams 95 N.
  checks:
    - tool: get_tech_pack_for_style
      args: {style_id: "STY-9509"}
      expect: ["TP-900001", "140", "#8 coil", "1.4 mm", "riveted", "95"]

- question: "06:53:Q3"
  story: >
    Technical jacket STY-7731: tech pack TP-900002 requires 110 N seam strength, water-resistant bonded nylon thread,
    12 stitches per inch, all main seams taped 20 mm and hydrostatic head of 1000 mm.
  checks:
    - tool: get_tech_pack_for_style
      args: {style_id: "STY-7731"}
      expect: ["TP-900002", "110", "bonded nylon", "12 stitches per inch", "taped", "1000 mm"]

- question: "06:55:Q2"
  story: >
    Moulded pulp tray PKS-900011 (SKU-100658): 220x180x140 mm, 3.5 mm wall, flat unribbed walls, no base ribs, 0.92 GBP.
    Pulp is brittle at base corners when unribbed. A 4.5 mm wall costs 1.10 (+0.18); ribs adding 6% material cost 0.96 (+0.04).
  checks:
    - tool: get_pack_dimensions_and_specs
      args: {sku: "SKU-100658", material: moulded_pulp}
      expect: ["PKS-900011", "220", "180", "140", "3.5", "no base ribs"]
    - tool: get_material_specs_for_pack
      args: {pack_spec_id: "PKS-900011"}
      expect: ["Moulded Pulp", "brittle", "SUP-0081"]
    - tool: calculate_unit_cost_of_pack_change
      args: {pack_spec_id: "PKS-900011", new_wall_thickness_mm: 4.5}
      expect: ["0.92", "1.1", "0.18"]
    - tool: calculate_unit_cost_of_pack_change
      args: {pack_spec_id: "PKS-900011", added_rib_material_pct: 6}
      expect: ["0.96", "0.04"]

- question: "06:55:Q3"
  story: >
    New product SKU-100091: rigid box PKO-900001 (PKS-900009, 1.25 GBP, 180 per pallet, high protection, not
    recyclable) versus flexible pouch PKO-900002 (PKS-900012, 0.68 GBP, 450 per pallet, medium protection, recyclable).
    At 150 GBP per pallet freight the total is 2.42 GBP per unit for the box and 1.67 for the pouch.
  checks:
    - tool: get_packaging_option_specs
      args: {sku: "SKU-100091"}
      expect: ["PKO-900001", "rigid box", "1.25", "high", "PKO-900002", "flexible pouch", "0.68", "fully recyclable"]
    - tool: get_pack_cost_quotes
      args: {sku: "SKU-100091"}
      expect: ["QT-900008", "1.15", "QT-900011", "0.64"]
    - tool: calculate_pallet_fill_for_pack
      args: {pack_spec_id: "PKS-900009", volume_units: 400000}
      expect: ["180", "2223"]
    - tool: calculate_pallet_fill_for_pack
      args: {pack_spec_id: "PKS-900012", volume_units: 400000}
      expect: ["450", "889"]
    - tool: calculate_total_cost_per_unit_by_pack_option
      args: {option_id: "PKO-900001"}
      expect: ["2.42", "0.83", "formula"]
    - tool: calculate_total_cost_per_unit_by_pack_option
      args: {option_id: "PKO-900002"}
      expect: ["1.67", "0.33"]

- question: "06:55:Q4"
  story: >
    Carton CTN-900001 on PKS-900001 is 250x200x150 mm at 0.85 GBP with 280 per pallet. Shrinking each dimension 10%
    gives 225x180x135 mm at 0.74 GBP (saves 0.11 per carton, 45,220 GBP a year at 400,000), 336 per pallet
    (+20%) and 238 fewer pallets. The update writes the new dimensions to the pack spec.
  checks:
    - tool: get_carton_specs
      args: {pack_spec_id: "PKS-900001"}
      expect: ["CTN-900001", "250", "200", "150", "0.85", "280"]
    - tool: calculate_carton_cost_at_new_dimensions
      args: {carton_id: "CTN-900001", size_reduction_pct: 10}
      expect: ["0.74", "0.11", "225", "180", "135", "45220"]
    - tool: calculate_pallet_fill_for_pack
      args: {pack_spec_id: "PKS-900001", volume_units: 400000, size_reduction_pct: 10}
      expect: ["336", "1429", "1191", "238"]
    - tool: update_carton_dimensions_in_pack_spec
      args: {pack_spec_id: "PKS-900001", height_mm: 225, width_mm: 180, depth_mm: 135}
      expect: ["250", "225", "180", "135"]
    - tool: get_packaging_spec_for_product
      args: {sku: "SKU-100532", material: corrugated}
      expect: ["PKS-900001", "225", "180", "135"]

- question: "06:55:Q5"
  story: >
    Own packaging portfolio for small appliances: K-1700 (11,844 units in the last 52 weeks), SKU-100532 and
    SKU-100658, all in 70% recycled corrugated cartons with moulded pulp (95% recycled) or recycled PET alternatives.
  checks:
    - tool: get_own_packaging_portfolio
      args: {category: "Small Appliances"}
      expect: ["POR-900006", "K-1700", "11844", "POR-900001", "70% recycled", "95% recycled", "POR-900002"]

- question: "07:63:Q2"
  story: >
    FY26 packaging cost by channel matches the cost-to-serve pools: stores 3.5M GBP (7.29 per replenishment order,
    0.036 per unit), online 12.0M GBP (1.52 per order, 0.63 per unit, 36% packing labour), wholesale 1.0M GBP
    (110.63 per order, 0.045 per unit).
  checks:
    - tool: get_packaging_cost_by_channel
      args: {fiscal_year: "FY26"}
      expect: ["stores", "3500000", "7.29", "online", "12000000", "1.52", "0.63", "wholesale", "1000000"]
    - tool: get_packaging_cost_by_channel
      args: {channel: online, category: "Small Appliances"}
      expect: ["online", "FY26"]
