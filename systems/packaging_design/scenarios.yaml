# One entry per question row that uses this system's tools (see: python -m mockmcp brief packaging_design).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "04:40:Q1"
  story: >
    Small appliance SKU-100532 (STY-4301) is currently packed in corrugated carton (PKS-900001, 0.65 GBP).
    We have three alternatives seeded: moulded pulp tray (PKS-900002, 0.82 GBP, 80% recycled) and
    recycled plastic pouch (PKS-900003, 1.15 GBP, 100% recycled). Compare the three options on cost,
    pallet fill, and recyclability to find the best choice for 400,000 units per year.
  checks:
    - tool: get_packaging_spec_for_product
      args: {sku: "SKU-100532"}
      expect: ["PKS-900001", "corrugated", "0.65", "PKS-900002", "PKS-900003"]
    - tool: get_packaging_spec_for_product
      args: {sku: "SKU-100532", material: moulded_pulp}
      expect: ["PKS-900002", "0.82"]
    - tool: get_packaging_spec_for_product
      args: {sku: "SKU-100532", material: recycled_plastic}
      expect: ["PKS-900003", "1.15"]

- question: "04:40:Q2"
  story: >
    For EPR fee and recycled-content mandate analysis in UK, France, Germany and Spain,
    we need the packaging weights for SKU-100532 (small appliance). Three material options have been
    seeded with consistent weights across markets: corrugated 45g, moulded pulp 52g, recycled plastic 38g.
  checks:
    - tool: get_packaging_weights_by_material_and_market
      args: {sku: "SKU-100532", market_country: UK}
      expect: ["WGT-900001", "45", "corrugated", "UK"]
    - tool: get_packaging_weights_by_material_and_market
      args: {sku: "SKU-100532", material: moulded_pulp}
      expect: ["52", "moulded_pulp", "FR", "DE", "ES"]
    - tool: get_packaging_weights_by_material_and_market
      args: {sku: "SKU-100532"}
      expect: ["corrugated", "moulded_pulp", "recycled_plastic"]

- question: "04:40:Q3"
  story: >
    Glass item breakage is up 40%. To investigate, we look at SKU-100091 (personal care item with glass components).
    Spec change history shows critical changes over past 60 days: material changed from corrugated to recycled plastic
    (PKS-900008 CHG-900001), wall thickness reduced from 2.0mm to 1.8mm (CHG-900002), and supplier changed from SUP-0020 to SUP-0021 (CHG-900003).
    These changes may have reduced protective capability, contributing to the 40% breakage increase.
  checks:
    - tool: get_packaging_spec_change_history
      args: {pack_spec_id: "PKS-900008"}
      expect: ["CHG-900001", "material", "CHG-900002", "wall_thickness", "CHG-900003", "supplier"]
    - tool: get_packaging_spec_change_history
      args: {pack_spec_id: "PKS-900008", change_type: material}
      expect: ["corrugated", "recycled_plastic", "Cost reduction"]
    - tool: get_packaging_spec_change_history
      args: {pack_spec_id: "PKS-900008", changed_from: "-60d"}
      expect: ["CHG-900001", "CHG-900002", "CHG-900003"]

- question: "04:40:Q6"
  story: >
    E-commerce packaging comparison shows our current specifications. SKU-100091 uses rigid box with air pillows
    (EC-900001, 1.85 GBP, 1.2% damage rate). SKU-100532 uses carton with tissue (EC-900002, 0.95 GBP, 2.1% damage).
    SKU-100658 uses expanded foam cushioning (EC-900003, 1.45 GBP, 1.8% damage). Retailers with best e-commerce
    results often use protective materials matching product fragility.
  checks:
    - tool: get_current_ecommerce_pack_specs
      args: {sku: "SKU-100091"}
      expect: ["EC-900001", "air pillows", "1.85", "1.2"]
    - tool: get_current_ecommerce_pack_specs
      args: {sku: "SKU-100532"}
      expect: ["EC-900002", "kraft paper", "0.95", "2.1"]
    - tool: get_current_ecommerce_pack_specs
      args: {}
      expect: ["EC-900001", "EC-900002", "EC-900003"]

- question: "06:51:Q4"
  story: >
    Backpack sample (STY-5520) failed zip pull strength test. Tech pack TP-900001 specifies 140N minimum.
    The failure likely indicates the zip mechanism or its attachment points are weak. Construction
    uses double-stitched seams (seam strength 95N required) but the zip pull strength is the critical failure point.
  checks:
    - tool: get_tech_pack_for_style
      args: {style_id: "STY-5520"}
      expect: ["TP-900001", "zip_pull_strength_n", "140"]
    - tool: get_tech_pack_for_style
      args: {style_id: "STY-5520"}
      expect: ["Double-stitched", "95", "IP65"]

- question: "06:53:Q3"
  story: >
    Technical jacket (STY-7731) sample missed spec on seam strength and water resistance.
    Tech pack TP-900002 specifies seam strength 110N and IP67 water resistance (1000mm column test).
    Construction uses premium seam technique with water-resistant thread, but first sample
    failed to meet these targets, requiring investigation of construction quality.
  checks:
    - tool: get_tech_pack_for_style
      args: {style_id: "STY-7731"}
      expect: ["TP-900002", "110", "seam_strength_n", "IP67"]
    - tool: get_tech_pack_for_style
      args: {style_id: "STY-7731"}
      expect: ["water-resistant thread", "shoulder attachment"]

- question: "06:55:Q2"
  story: >
    Moulded pulp trays (PKS-900011 for STY-4420) are cracking in drop tests. Pack dimensions are 220x180x140mm
    with 3.5mm wall thickness. Material specs show moulded pulp is brittle at certain thicknesses.
    Wall thickness increase or ribbing pattern changes could improve crush strength and reduce cracking.
  checks:
    - tool: get_pack_dimensions_and_specs
      args: {sku: "SKU-100658"}
      expect: ["PKS-900011", "220", "180", "140", "3.5", "moulded_pulp"]
    - tool: get_material_specs_for_pack
      args: {pack_spec_id: "PKS-900011"}
      expect: ["moulded_pulp", "Moulded Pulp"]
    - tool: calculate_unit_cost_of_pack_change
      args: {pack_spec_id: "PKS-900011"}
      expect: ["current_cost_gbp", "estimated_saving"]

- question: "06:55:Q3"
  story: >
    Two packaging options compete for new product SKU-100091: rigid box (PKO-900001, rigid plastic, 1.25 GBP, 180 units/pallet, high appeal)
    versus flexible pouch (PKO-900002, recycled plastic, 0.68 GBP, 450 units/pallet, medium appeal).
    Rigid box offers better protection and shelf appeal; pouch is 46% cheaper and more sustainable.
    Total cost comparison at 400,000 units includes freight (150 GBP/pallet), damage rates, and recyclability impact.
  checks:
    - tool: get_packaging_option_specs
      args: {product_id: "SKU-100091"}
      expect: ["PKO-900001", "rigid_box", "1.25", "high"]
    - tool: get_packaging_option_specs
      args: {product_id: "SKU-100091"}
      expect: ["PKO-900002", "flexible pouch", "0.68", "fully recyclable"]
    - tool: calculate_pallet_fill_for_pack
      args: {pack_spec_id: "PKS-900009", volume_units: 400000}
      expect: ["180", "2223", "pallet"]
    - tool: get_pack_cost_quotes
      args: {pack_spec_id: "PKS-900009"}
      expect: ["QT-900005", "unit_cost_gbp", "1.2"]
    - tool: calculate_total_cost_per_unit_by_pack_option
      args: {option_id: "PKO-900001"}
      expect: ["total_cost_per_unit_gbp", "formula"]

- question: "06:55:Q4"
  story: >
    Carton dimension reduction: current carton (CTN-900001) is 250x200x150mm, costing 0.65 GBP, with 250 units per pallet.
    A 10% reduction to 225x180x135mm (CTN-900002) costs 0.57 GBP and allows 280 units per pallet (12% improvement).
    Testing needed to confirm drop and crush test compliance at new dimensions. Update to carton spec approved after testing passes.
  checks:
    - tool: get_carton_specs
      args: {pack_spec_id: "PKS-900001"}
      expect: ["CTN-900001", "250", "200", "150", "0.65"]
    - tool: calculate_carton_cost_at_new_dimensions
      args: {carton_id: "CTN-900001", size_reduction_pct: 10}
      expect: ["0.65", "estimated_saving", "10"]
    - tool: calculate_pallet_fill_for_pack
      args: {pack_spec_id: "PKS-900001", volume_units: 400000}
      expect: ["pallet", "250", "1600"]
    - tool: update_carton_dimensions_in_pack_spec
      args: {pack_spec_id: "PKS-900001", height_mm: 225, width_mm: 180, depth_mm: 135}
      expect: ["225", "180", "135"]

- question: "06:55:Q5"
  story: >
    Packaging portfolio shows our current mixes. SKU-100532 primary pack is corrugated (40% recycled), alternative pouch (100% recycled).
    SKU-100658 uses carton (40% recycled) and tray option. Best retailers have shifted to 80%+ recycled or fully compostable options.
    Our sustainability notes identify which SKUs are priority for upgrade: personal care (100% recycled target) and
    appliances (explore moulded pulp alternatives).
  checks:
    - tool: get_own_packaging_portfolio
      args: {}
      expect: ["POR-900001", "SKU-100532", "carton", "tray"]
    - tool: get_own_packaging_portfolio
      args: {sku: "SKU-100658"}
      expect: ["POR-900002", "carton", "40% recycled"]
    - tool: get_own_packaging_portfolio
      args: {style_id: "STY-4301"}
      expect: ["75% recycled", "alternative"]

- question: "07:63:Q2"
  story: >
    Cost-to-serve by channel for FY26 actuals. Packaging costs vary significantly:
    Stores channel: SKU-100532 costs 0.15 GBP per unit (CC-900001). Online channel costs 0.25 GBP per unit
    with higher packing labour (CC-900002, 35%). Wholesale is minimal at 0.08 GBP per unit (CC-900003).
    Online profitability is at risk due to packaging labour costs (35% of total). SKU-100658 shows similar pattern.
    SKU-100091 (premium item) has highest packaging cost per unit (0.35 GBP online vs 0.20 GBP stores).
  checks:
    - tool: get_packaging_cost_by_channel
      args: {sku: "SKU-100532", channel: stores}
      expect: ["CC-900001", "0.15", "15"]
    - tool: get_packaging_cost_by_channel
      args: {sku: "SKU-100532", channel: online}
      expect: ["CC-900002", "0.25", "35"]
    - tool: get_packaging_cost_by_channel
      args: {sku: "SKU-100658"}
      expect: ["CC-900004", "CC-900005", "CC-900006"]
    - tool: get_packaging_cost_by_channel
      args: {sku: "SKU-100091"}
      expect: ["0.35", "online", "40"]
