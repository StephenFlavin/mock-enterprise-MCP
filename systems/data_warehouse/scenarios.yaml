- question: 09:81:Q1
  story: >
    OTIF fell from 94.0% to 89.0% between the four weeks before and the four weeks after the definition change (no grace day, from
    the first September week). Inbound mode truck explains almost all of it (94.1% to 84.3%) and three suppliers, SUP-0079,
    SUP-0037 and SUP-0030 (Portuguese and Turkish road hauliers), carry 88% of the drop; Friday and Monday arrivals fall hardest.
    Sea, air and rail barely move.
  checks:
    - tool: get_otif_by_dimension
      args: {group_by: inbound_mode}
      expect: ["truck", "84.3", "94.1", "total_otif_pct_prior"]
    - tool: get_otif_by_dimension
      args: {group_by: supplier_id}
      expect: ["SUP-0079", "SUP-0037", "SUP-0030", "-13"]
    - tool: get_otif_by_dimension
      args: {group_by: weekday}
      expect: ["Fri", "Mon", "83.1"]
    - tool: get_otif_by_dimension
      args: {group_by: week}
      expect: ["93.2", "94.3", "89.1", "89"]
