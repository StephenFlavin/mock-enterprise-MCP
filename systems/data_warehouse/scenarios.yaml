- question: 09:81:Q4
  story: >
    The warehouse holds staging copies of the three source systems: wms_order_costs (pick, pack, handling per order),
    tms_shipment_costs (freight per shipment; split orders have several) and erp_order_headers (revenue and charges), keyed by order_id
    and joinable to master.orders. ORD-2026-0108564 is split over two shipments (11.75 and 11.44). The cost-per-order SQL can be tested
    with run_sql_query and saved with create_warehouse_view.
  checks:
    - tool: search_data_catalogue
      args: {query: freight}
      expect: ["tms_shipment_costs", "One row per shipment"]
    - tool: get_table_schema
      args: {table_name: wms_order_costs}
      expect: ["order_id", "handling_cost_gbp", "total_cost_gbp"]
    - tool: run_sql_query
      args: {query: "SELECT o.order_id, w.total_cost_gbp AS wms_cost, t.freight, t.shipments, e.revenue_gbp FROM master.orders o JOIN wms_order_costs w USING (order_id) JOIN (SELECT order_id, sum(freight_cost_gbp) AS freight, count(*) AS shipments FROM tms_shipment_costs GROUP BY order_id) t USING (order_id) JOIN erp_order_headers e USING (order_id) WHERE o.order_id = 'ORD-2026-0108564'"}
      expect: ["ORD-2026-0108564", "1.31", "23.19", "59.57"]
    - tool: create_warehouse_view
      args: {view_name: cost_per_order, sql_query: "SELECT w.order_id, w.total_cost_gbp + coalesce(sum(t.freight_cost_gbp), 0) AS cost FROM wms_order_costs w LEFT JOIN tms_shipment_costs t USING (order_id) GROUP BY w.order_id, w.total_cost_gbp", description: Cost per order}
      expect: ["VIEW-", "cost_per_order", "active"]
