id: data_warehouse
name: Data Warehouse / Lakehouse
instructions: >
  Analytics and reporting data warehouse for sales, KPIs, product performance, inventory and supply chain metrics.
  Product ids are SKUs (e.g. SKU-100234), styles are STY-…, categories are like "Dresses", "Home".
  Use it for sales analysis, OTIF tracking, markdown rates, inventory reconciliation and warehouse schema information.

tables:
  product_sales_fact:
    key: [date, sku, site_id, size]
    cols:
      date: {type: date, desc: "Sales date"}
      sku: {type: str, desc: "Product SKU"}
      style_id: {type: str, desc: "Style id"}
      category: {type: str, desc: "Product category"}
      market: {type: str, desc: "Market/country, e.g. UK, DE, US"}
      site_id: {type: str, desc: "Store or sales channel"}
      size: {type: str, desc: "Product size"}
      units_sold: {type: int, desc: "Units sold"}
      sales_gbp: {type: float, desc: "Sales revenue in GBP"}
      cost_gbp: {type: float, desc: "Landed cost in GBP"}
      markdown_gbp: {type: float, desc: "Markdown discount in GBP"}
      customer_segment: {type: str, desc: "Customer segment"}

  product_kpi_history:
    key: [date, kpi_name]
    cols:
      date: {type: date, desc: "Date of KPI measurement"}
      kpi_name: {type: str, desc: "KPI name, e.g. OTIF, markdown_rate"}
      kpi_value: {type: float, desc: "KPI value"}
      period_type: {type: enum, values: [daily, weekly, monthly], desc: "Period aggregation"}
      target_value: {type: float, desc: "Target value for this KPI"}
      variance_pct: {type: float, desc: "Variance from target in %"}

  otif_metrics:
    key: [week, supplier_id, category, site_id, inbound_mode]
    cols:
      week: {type: date, desc: "Week start date (Monday)"}
      supplier_id: {type: str, desc: "Supplier id"}
      category: {type: str, desc: "Product category"}
      site_id: {type: str, desc: "Receiving DC"}
      inbound_mode: {type: str, desc: "Inbound mode, e.g. sea, air, truck, rail"}
      weekday: {type: str, desc: "Day of week"}
      on_time_units: {type: int, desc: "Units delivered on time"}
      total_units: {type: int, desc: "Total units delivered"}
      otif_pct: {type: float, desc: "On-time-in-full percentage"}
      early_units: {type: int, desc: "Units delivered early"}
      late_units: {type: int, desc: "Units delivered late"}

  product_markdown_rate:
    key: [sku, period_type, period]
    cols:
      sku: {type: str, desc: "Product SKU"}
      style_id: {type: str, desc: "Style id"}
      category: {type: str, desc: "Product category"}
      period_type: {type: enum, values: [daily, weekly, monthly, quarterly, annual], desc: "Period type"}
      period: {type: str, desc: "Period identifier, e.g. 2026-Q3"}
      units_sold: {type: int, desc: "Units sold in period"}
      full_price_units: {type: int, desc: "Units sold at full price"}
      markdown_units: {type: int, desc: "Units sold at markdown"}
      markdown_rate_pct: {type: float, desc: "Markdown rate %"}
      avg_markdown_depth_pct: {type: float, desc: "Average markdown depth %"}
      lead_time_days: {type: int, desc: "Lead time in days"}
      cumulative_markdown_gbp: {type: float, desc: "Total markdown value"}

  product_launch_history:
    key: launch_id
    cols:
      launch_id: {type: str, desc: "Launch id, e.g. LNC-000123"}
      sku: {type: str, desc: "Product SKU"}
      style_id: {type: str, desc: "Style id"}
      category: {type: str, desc: "Product category"}
      launch_date: {type: date, desc: "Launch date"}
      initial_allocation_units: {type: int, desc: "Initial allocation units"}
      units_sold_week1: {type: int, desc: "Units sold in week 1"}
      units_sold_month1: {type: int, desc: "Units sold in first month"}
      forecast_vs_actual_pct: {type: float, desc: "Forecast accuracy %"}
      sell_through_rate_pct: {type: float, desc: "Sell-through rate %"}
      peak_week_demand_units: {type: int, desc: "Peak week demand"}
      status: {type: enum, values: [planned, launched, evergreen, discontinued], desc: "Launch status"}

  inventory_balance_reconciliation:
    key: [date, site_id, sku]
    cols:
      date: {type: date, desc: "Reconciliation date"}
      site_id: {type: str, desc: "DC site"}
      sku: {type: str, desc: "Product SKU"}
      wms_units: {type: int, desc: "WMS reported units"}
      erp_units: {type: int, desc: "ERP reported units"}
      finance_units: {type: int, desc: "Finance system units"}
      physical_count_units: {type: int, desc: "Physical inventory count"}
      wms_erp_variance: {type: int, desc: "WMS minus ERP variance"}
      erp_finance_variance: {type: int, desc: "ERP minus finance variance"}
      category: {type: str, desc: "Variance category: timing, definitional, error"}
      variance_explanation: {type: str, desc: "Explanation of variance"}
      adjustment_required: {type: bool, desc: "Whether adjustment is needed"}

  product_performance_metrics:
    key: [sku, period]
    cols:
      sku: {type: str, desc: "Product SKU"}
      style_id: {type: str, desc: "Style id"}
      category: {type: str, desc: "Product category"}
      period: {type: str, desc: "Period, e.g. 2026-Q3"}
      units_sold: {type: int, desc: "Total units sold"}
      sales_gbp: {type: float, desc: "Total sales GBP"}
      margin_gbp: {type: float, desc: "Gross margin GBP"}
      margin_pct: {type: float, desc: "Gross margin %"}
      markdown_rate_pct: {type: float, desc: "Markdown rate %"}
      in_stock_rate_pct: {type: float, desc: "In-stock rate %"}
      velocity_rank: {type: int, desc: "Sales velocity rank"}
      strategic_role: {type: str, desc: "Strategic role: core, growth, strategic, clearance"}
      recommend_action: {type: str, desc: "Recommended action: extend, refresh, reprice, delete"}
      return_rate_pct: {type: float, desc: "Return rate %"}

  warehouse_data_catalogue:
    key: table_name
    cols:
      table_name: {type: str, desc: "Table name"}
      table_type: {type: enum, values: [fact, dimension, master, view], desc: "Table type"}
      description: {type: str, desc: "Table description"}
      row_count: {type: int, desc: "Approximate row count"}
      grain: {type: str, desc: "Table grain, e.g. one row per sku/date"}
      primary_key: {type: str, desc: "Primary key columns"}
      last_updated: {type: timestamp, desc: "Last data refresh"}
      refresh_frequency: {type: str, desc: "Refresh frequency, e.g. daily"}

  warehouse_column_index:
    key: [table_name, column_name]
    cols:
      table_name: {type: str, desc: "Table name"}
      column_name: {type: str, desc: "Column name"}
      column_type: {type: str, desc: "Data type"}
      description: {type: str, desc: "Column description"}
      source_system: {type: str, desc: "Source system"}

  saved_warehouse_views:
    key: view_id
    cols:
      view_id: {type: str, desc: "View id, e.g. VIEW-000123"}
      view_name: {type: str, desc: "View name for reference"}
      sql_query: {type: text, desc: "SQL query for the view"}
      created_at: {type: timestamp, desc: "When view was created"}
      created_by: {type: str, desc: "User who created the view"}
      description: {type: str, desc: "View purpose"}
      status: {type: enum, values: [active, archived], desc: "View status"}

tools:
  - name: search_data_catalogue
    desc: Search tables and columns in the warehouse by name, type or content. Returns table names and schema details.
    kind: select
    from: warehouse_data_catalogue
    filters:
      table_name: {op: like, desc: "Table name or part of it"}
      table_type: {}
    columns: [table_name, table_type, description, grain, primary_key, refresh_frequency]
    order: table_name
    example: {table_name: sales}

  - name: get_table_schema
    desc: Get columns, keys and grain of any table in the warehouse.
    kind: sql
    args:
      table_name: {required: true, desc: "Table name to describe"}
    sql: |
      SELECT c.table_name, c.column_name, c.column_type, c.description, c.source_system
      FROM warehouse_column_index c
      WHERE c.table_name = $table_name
      ORDER BY c.table_name, c.column_name
    limit: 100
    example: {table_name: product_sales_fact}

  - name: run_sql_query
    desc: Run a read-only SQL query against warehouse tables and master data. For analysis or custom aggregations.
    kind: sql
    args:
      query: {type: text, required: true, desc: "Read-only SQL query"}
    sql: "$query"
    limit: 1000
    example: {query: "SELECT sku, sum(units_sold) FROM product_sales_fact GROUP BY sku LIMIT 10"}

  - name: list_top_products_by_sales_for_category
    desc: Top products by sales for a category. Returns SKU, style, units and revenue, ranked by sales.
    kind: sql
    args:
      category: {required: true}
      market: {desc: "Market/country, default all"}
      period_days: {type: int, default: 90, desc: "Days back, default last 90"}
      limit_rows: {type: int, default: 20, desc: "Number of products to return"}
    sql: |
      SELECT p.sku, p.style_id, p.category, sum(p.units_sold) AS units_sold,
             sum(p.sales_gbp) AS sales_gbp, sum(p.markdown_gbp) AS markdown_gbp
      FROM product_sales_fact p
      WHERE p.category = $category
        AND ($market IS NULL OR p.market = $market)
        AND p.date >= CAST($as_of AS DATE) - INTERVAL $period_days DAY
      GROUP BY p.sku, p.style_id, p.category
      ORDER BY sales_gbp DESC
    limit: 50
    example: {category: "Dresses"}

  - name: list_products_ranked_by_sales_for_season
    desc: Products ranked by sales for a trading season. Returns rank, SKU, units and revenue.
    kind: sql
    args:
      season: {required: true, values: [SS, AW], desc: "Trading season"}
      top_n: {type: int, default: 50, desc: "Top N products"}
    sql: |
      SELECT row_number() OVER (ORDER BY sum(p.sales_gbp) DESC) AS rank,
             p.sku, p.style_id, p.category, sum(p.units_sold) AS units_sold,
             sum(p.sales_gbp) AS sales_gbp
      FROM product_sales_fact p
      JOIN master.calendar c ON c.date = p.date
      WHERE c.season = $season
      GROUP BY p.sku, p.style_id, p.category
      ORDER BY rank
    limit: 100
    example: {season: SS}

  - name: get_sales_by_category_and_market
    desc: Total sales by category and market for a period. Returns units, revenue and margin.
    kind: sql
    args:
      category: {}
      market: {}
      period_from: {type: date, default: "-90d"}
      period_to: {type: date, default: "+0d"}
    sql: |
      SELECT p.category, p.market, sum(p.units_sold) AS units_sold,
             sum(p.sales_gbp) AS sales_gbp, sum(p.cost_gbp) AS cost_gbp,
             round(sum(p.sales_gbp) - sum(p.cost_gbp), 2) AS margin_gbp,
             round(100.0 * (sum(p.sales_gbp) - sum(p.cost_gbp)) / nullif(sum(p.sales_gbp), 0), 1) AS margin_pct
      FROM product_sales_fact p
      WHERE ($category IS NULL OR p.category = $category)
        AND ($market IS NULL OR p.market = $market)
        AND p.date >= CAST($period_from AS DATE) AND p.date <= CAST($period_to AS DATE)
      GROUP BY p.category, p.market
      ORDER BY sales_gbp DESC
    limit: 100
    example: {category: "Dresses", market: UK}

  - name: get_sales_by_size_for_style
    desc: Sales breakdown by size for a style. Returns units, revenue and return data.
    kind: sql
    args:
      style_id: {required: true}
      period_days: {type: int, default: 90}
    sql: |
      SELECT p.style_id, p.size, sum(p.units_sold) AS units_sold,
             sum(p.sales_gbp) AS sales_gbp, sum(p.cost_gbp) AS cost_gbp,
             round(100.0 * sum(p.units_sold) / nullif(sum(sum(p.units_sold)) OVER (), 0), 1) AS pct_of_total
      FROM product_sales_fact p
      WHERE p.style_id = $style_id
        AND p.date >= CAST($as_of AS DATE) - INTERVAL $period_days DAY
      GROUP BY p.style_id, p.size
      ORDER BY units_sold DESC
    limit: 50
    example: {style_id: "STY-5520"}

  - name: get_sales_mix_by_item
    desc: Sales mix showing each product's contribution to category total and YoY comparison.
    kind: sql
    args:
      category: {required: true}
      market: {desc: "Market, default all"}
    sql: |
      SELECT p.sku, p.style_id, sum(p.units_sold) AS units_sold,
             sum(p.sales_gbp) AS sales_gbp,
             round(100.0 * sum(p.sales_gbp) / sum(sum(p.sales_gbp)) OVER (PARTITION BY p.category), 1) AS pct_of_category,
             sum(p.markdown_gbp) AS markdown_gbp,
             round(100.0 * sum(p.markdown_gbp) / nullif(sum(p.sales_gbp), 0), 1) AS markdown_rate_pct
      FROM product_sales_fact p
      WHERE p.category = $category
        AND ($market IS NULL OR p.market = $market)
        AND p.date >= CAST($as_of AS DATE) - INTERVAL 90 DAY
      GROUP BY p.sku, p.style_id, p.category
      ORDER BY sales_gbp DESC
    limit: 100
    example: {category: "Dresses"}

  - name: get_product_sales_rank
    desc: Sales rank for a product. Returns its position among all products and its category.
    kind: sql
    args:
      sku: {required: true}
      period_days: {type: int, default: 90}
    sql: |
      WITH ranked AS (
        SELECT p.sku, sum(p.sales_gbp) AS sales_gbp,
               row_number() OVER (ORDER BY sum(p.sales_gbp) DESC) AS overall_rank,
               row_number() OVER (PARTITION BY p.category ORDER BY sum(p.sales_gbp) DESC) AS category_rank,
               p.category
        FROM product_sales_fact p
        WHERE p.date >= CAST($as_of AS DATE) - INTERVAL $period_days DAY
        GROUP BY p.sku, p.category
      )
      SELECT sku, category, sales_gbp, overall_rank, category_rank FROM ranked WHERE sku = $sku
    limit: 1
    example: {sku: "SKU-100234"}

  - name: list_product_performance_for_range
    desc: Product performance metrics for a range review. Returns sales, margin, markdown and strategic role.
    kind: sql
    args:
      category: {desc: "Filter by category"}
      period: {type: str, default: "-90d", desc: "Period for metrics"}
      strategic_role: {desc: "Filter by role: core, growth, strategic, clearance"}
    sql: |
      SELECT p.sku, p.style_id, p.category, sum(p.units_sold) AS units_sold,
             sum(p.sales_gbp) AS sales_gbp, sum(p.cost_gbp) AS cost_gbp,
             round(sum(p.sales_gbp) - sum(p.cost_gbp), 2) AS margin_gbp,
             round(100.0 * (sum(p.sales_gbp) - sum(p.cost_gbp)) / nullif(sum(p.sales_gbp), 0), 1) AS margin_pct,
             round(100.0 * sum(p.markdown_gbp) / nullif(sum(p.sales_gbp), 0), 1) AS markdown_rate_pct,
             pm.strategic_role, pm.recommend_action
      FROM product_sales_fact p
      LEFT JOIN product_performance_metrics pm ON pm.sku = p.sku
      WHERE ($category IS NULL OR p.category = $category)
        AND p.date >= CAST($as_of AS DATE) - INTERVAL 90 DAY
      GROUP BY p.sku, p.style_id, p.category, pm.strategic_role, pm.recommend_action
      ORDER BY sales_gbp DESC
    limit: 200
    example: {category: "Dresses"}

  - name: get_product_markdown_rate_history
    desc: Markdown rate history by product over time. Shows trend and seasonal patterns.
    kind: select
    from: product_markdown_rate
    filters:
      sku: {required: true}
      period_type: {default: monthly}
    columns: [sku, style_id, period, markdown_rate_pct, units_sold, markdown_units, lead_time_days]
    order: period
    limit: 52
    example: {sku: "SKU-100234"}

  - name: get_markdown_rate_by_lead_time
    desc: Average markdown rate by lead-time band. Shows relationship between lead time and markdown.
    kind: sql
    args:
      category: {desc: "Filter by category"}
    sql: |
      SELECT CASE WHEN m.lead_time_days <= 30 THEN "0-30 days"
                  WHEN m.lead_time_days <= 60 THEN "31-60 days"
                  WHEN m.lead_time_days <= 90 THEN "61-90 days"
                  ELSE ">90 days" END AS lead_time_band,
             count(distinct m.sku) AS num_products,
             round(avg(m.markdown_rate_pct), 1) AS avg_markdown_rate_pct,
             round(avg(m.avg_markdown_depth_pct), 1) AS avg_markdown_depth_pct,
             sum(m.units_sold) AS total_units
      FROM product_markdown_rate m
      JOIN master.products pr ON pr.sku = m.sku
      WHERE ($category IS NULL OR m.category = $category)
        AND m.period_type = 'monthly'
        AND m.period >= cast(date_trunc('month', CAST($as_of AS DATE)) - INTERVAL 12 MONTH as varchar)
      GROUP BY lead_time_band
      ORDER BY min(m.lead_time_days)
    limit: 20
    example: {category: "Dresses"}

  - name: get_new_product_launch_history
    desc: Past new-product launches with early-life demand, sell-through and forecast accuracy.
    kind: select
    from: product_launch_history
    filters:
      status: {default: launched}
      category: {}
    columns: [sku, style_id, category, launch_date, initial_allocation_units, units_sold_month1, sell_through_rate_pct, forecast_vs_actual_pct]
    order: launch_date
    limit: 100
    example: {status: launched}

  - name: get_otif_by_dimension
    desc: OTIF actuals sliced by supplier, category, DC, weekday and inbound mode. Break down the metric by each dimension.
    kind: select
    from: otif_metrics
    filters:
      supplier_id: {}
      category: {}
      site_id: {}
      inbound_mode: {}
      week: {col: week, op: ">=", type: date, default: "-12w"}
    columns: [week, supplier_id, category, site_id, inbound_mode, on_time_units, total_units, otif_pct, late_units]
    order: week
    limit: 200
    example: {supplier_id: "SUP-0001"}

  - name: calculate_units_affected_by_grade_change
    desc: Calculate total units that would be affected by a grade change for a style size, based on sales history.
    kind: sql
    args:
      style_id: {required: true}
      size: {required: true}
      period_days: {type: int, default: 90}
    sql: |
      SELECT $style_id AS style_id, $size AS size,
             sum(p.units_sold) AS total_units_affected,
             count(distinct p.date) AS days_with_sales,
             round(avg(p.units_sold), 1) AS avg_daily_units,
             max(p.date) AS last_sales_date,
             'Grade change for ' || $style_id || ' size ' || $size || ' affects units sold' AS explanation
      FROM product_sales_fact p
      WHERE p.style_id = $style_id AND p.size = $size
        AND p.date >= CAST($as_of AS DATE) - INTERVAL $period_days DAY
    limit: 1
    example: {style_id: "STY-T-4410", size: "14"}

  - name: compare_inventory_balances
    desc: Reconcile two inventory sources and itemise differences. Shows WMS vs ERP vs Finance variances.
    kind: select
    from: inventory_balance_reconciliation
    filters:
      site_id: {required: true}
      adjustment_required: {}
      category: {op: like}
    columns: [date, sku, wms_units, erp_units, finance_units, wms_erp_variance, erp_finance_variance, category, variance_explanation]
    order: date
    limit: 100
    example: {site_id: DC1, adjustment_required: true}

  - name: get_kpi_history
    desc: Historical monthly and weekly KPI series for monitoring trends. Returns KPI name, value and variance from target.
    kind: select
    from: product_kpi_history
    filters:
      kpi_name: {desc: "KPI name, e.g. OTIF, markdown_rate, sell_through"}
      period_type: {default: monthly}
    columns: [date, kpi_name, kpi_value, target_value, variance_pct]
    order: date
    limit: 52
    example: {kpi_name: OTIF, period_type: monthly}

  - name: create_warehouse_view
    desc: Create a saved view in the warehouse from supplied SQL. View becomes available for all users.
    kind: insert
    table: saved_warehouse_views
    id_prefix: VIEW-
    defaults: {status: active}
    args:
      view_name: {required: true, desc: "Name for this view"}
      sql_query: {required: true, type: text, desc: "SQL query for the view"}
      description: {type: str, desc: "Purpose of this view"}
      created_by: {type: str, desc: "Creator name"}
    example: {view_name: "Top 100 Products", sql_query: "SELECT sku, sum(sales_gbp) FROM product_sales_fact GROUP BY sku ORDER BY sum(sales_gbp) DESC LIMIT 100", description: "Top products by sales", created_by: "analyst@example.com"}
