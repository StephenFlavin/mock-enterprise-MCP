- question: "01:6:Q2"
  story: "Autumn space scenario week 44. Multiple SKUs (STY-5520, STY-7731, K-1700, PF-220) have confirmed supply and inbound forecasted together with existing stock, showing utilisation patterns across week 44-45."
  checks:
    - tool: calculate_projected_space_utilisation
      args: {forecast_week: "2026-W44"}
      expect: ["week", "44", "utilisation"]
    - tool: get_supply_plan_for_product
      args: {sku: "STY-5520"}
      expect: ["STY-5520", "W44", "forecast_units", "3200"]

- question: "02:19:Q5"
  story: "Port closure scenario: Singapore port (SGSIN) closures at 2 weeks and 4 weeks durations showing stock cover by category and which stores hit first."
  checks:
    - tool: run_port_closure_scenario
      args: {port_code: "SGSIN", closure_weeks: 2}
      expect: ["SGSIN", "closure", "category"]
    - tool: run_port_closure_scenario
      args: {port_code: "SGSIN", closure_weeks: 4}
      expect: ["SGSIN", "4", "weeks"]
    - tool: calculate_port_closure_impact_scenarios
      args: {port_code: "SGSIN", scenario_weeks: 6}
      expect: ["SGSIN", "revenue", "margin"]

- question: "03:24:Q2"
  story: "Week 44 denim gap: STY-5520 has 25,000-unit gap between 27,500-unit forecast and 2,500-unit confirmed supply. Options are expediting from SUP-0001, splitting with secondary supplier, or shifting promotion timing."
  checks:
    - tool: get_supply_demand_gap_for_product
      args: {sku: "STY-5520", gap_week: "2026-W44"}
      expect: ["STY-5520", "25000", "27500"]
    - tool: calculate_expedite_cost
      args: {sku: "STY-5520", supplier_id: "SUP-0001", quantity_units: 25000, expedite_weeks: 1}
      expect: ["expedite_cost", "25000", "gbp"]
    - tool: calculate_split_sourcing_cost
      args: {sku: "STY-5520", total_quantity: 25000, primary_supplier_id: "SUP-0001", secondary_supplier_id: "SUP-0002", split_pct: 50}
      expect: ["split", "25000", "50"]
    - tool: compare_supply_gap_options
      args: {sku: "STY-5520", gap_units: 25000, supplier_id: "SUP-0001"}
      expect: ["Expedite", "Split", "cost"]
    - tool: create_supply_request_for_promotion
      args: {sku: "STY-5520", site_id: "DC1", quantity_requested: 20000, requirement_date: "2026-10-21"}
      expect: ["SRP-", "supply_request"]

- question: "03:24:Q3"
  story: "Zips and trims shortage detection for Q1 production. Multiple categories (Dresses, Shirts, Accessories) have fabric requirements tracked in fabric_requirements table. Some suppliers have flagged delays."
  checks:
    - tool: get_fabric_requirements_by_category
      args: {category: "Dresses"}
      expect: ["Dresses", "Cotton", "Polyester", "Silk"]
    - tool: calculate_buy_ahead_cost
      args: {sku: "STY-5520", quantity_units: 10000, advance_weeks: 4}
      expect: ["buy_ahead", "working_capital", "storage"]

- question: "03:24:Q4"
  story: "Fabric shortages by category. Dresses category heavily dependent on Cotton from SUP-0001 (85k units annually) and Polyester from SUP-0003 (65k). Requirements and supplier exposure tracked."
  checks:
    - tool: get_fabric_requirements_by_category
      args: {}
      expect: ["category", "material", "supplier"]
    - tool: get_fabric_requirements_by_category
      args: {category: "Dresses"}
      expect: ["Cotton", "85000", "Polyester"]

- question: "03:24:Q5"
  story: "Lead time gaps quantified: SUP-0001 has 10.5-day gap between quoted 21 days and actual 31.5 days (18-order sample). Similar gaps for SUP-0005 (10.5 days), SUP-0042 (11 days). Planning lead times need updating for worst offenders."
  checks:
    - tool: get_lead_times_by_origin
      args: {origin_region: "Asia"}
      expect: ["Asia", "SGSIN", "transit_days"]
    - tool: calculate_lead_time_gap_inventory_impact
      args: {supplier_id: "SUP-0001", gap_days: 10}
      expect: ["lead_time_gap", "inventory", "stock"]
    - tool: update_planning_lead_time_for_supplier
      args: {supplier_id: "SUP-0001", sku: "STY-5520", actual_avg_lead_days: 31.5}
      expect: ["updated"]

- question: "03:28:Q3"
  story: "Asia lead time sensitivity: If Asia lead times increase by 2 weeks (14 days), showing impact on stock levels and category sensitivity. Transit time from SGSIN is 35 days sea."
  checks:
    - tool: get_lead_times_by_origin
      args: {origin_region: "Asia", mode: "sea"}
      expect: ["Asia", "35", "transit_days"]
    - tool: calculate_lead_time_gap_inventory_impact
      args: {supplier_id: "SUP-0001", gap_days: 14}
      expect: ["14", "additional_stock"]

- question: "03:28:Q4"
  story: "Long-tail items sourcing decision: Multiple SKUs evaluated for make-to-order vs central stock. STY-T-4410 and others are candidates for sourcing policy change."
  checks:
    - tool: get_item_planning_parameters
      args: {sku: "STY-T-4410"}
      expect: ["STY-T-4410", "sourcing_policy", "stocked"]
    - tool: update_sku_sourcing_policy
      args: {sku: "STY-T-4410", sourcing_policy: "make_to_order"}
      expect: ["updated"]

- question: "03:30:Q1"
  story: "Order proposal anomaly: ORP-900002 for K-1700 proposes 12,000 units (covers 15 weeks) when item sells 800/week, flagged with pack_size_too_large issue. Needs parameter audit and cancellation."
  checks:
    - tool: get_order_proposal_calculation_trace
      args: {proposal_id: "ORP-900002"}
      expect: ["ORP-900002", "K-1700", "12000", "issue_detected"]
    - tool: get_item_planning_parameters
      args: {sku: "K-1700"}
      expect: ["K-1700", "pack_size", "lead_time"]
    - tool: list_items_with_similar_parameter_issue
      args: {issue_type: "pack_size"}
      expect: ["pack_size", "proposal"]
    - tool: cancel_order_proposal
      args: {proposal_id: "ORP-900002", cancel_reason: "Parameter error: pack size misconfigured"}
      expect: ["cancelled"]
    - tool: update_item_planning_parameters
      args: {sku: "K-1700", pack_size: 250}
      expect: ["updated"]

