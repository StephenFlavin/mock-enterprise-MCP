id: supply_planning
name: Supply Planning System (MRP/DRP)
instructions: >
  Demand forecasting, supply planning, purchase order proposals and safety stock.
  Calculation of supply gaps, expedite costs, port closure impacts, and supplier disruption scenarios.
  Planning parameters and item-level configuration. Ids: SPP-000123 (planning params), ORP-000123 (order proposals),
  SRP-000123 (supply requests).

tables:
  planning_parameters:
    key: planning_param_id
    cols:
      planning_param_id: {type: str, desc: "Planning parameter record, e.g. SPP-000123"}
      sku: {type: str, desc: "SKU, e.g. SKU-100234"}
      lead_time_days: {type: int, desc: "Lead time assumed in planning, in days"}
      pack_size: {type: int, desc: "Pack/lot size in units"}
      lot_size: {type: int, desc: "Minimum lot size for orders, in units"}
      safety_stock_pct: {type: float, desc: "Safety stock as % of forecast demand"}
      sourcing_policy: {type: enum, values: [stocked, make_to_order, dual_source], desc: "Sourcing strategy"}
      reorder_point: {type: int, desc: "Reorder quantity in units"}
      updated_at: {type: timestamp, desc: "Last parameter change"}

  order_proposals:
    key: proposal_id
    cols:
      proposal_id: {type: str, desc: "Order proposal, e.g. ORP-000123"}
      sku: {type: str, desc: "SKU"}
      supplier_id: {type: str, desc: "Recommended supplier"}
      dest_site_id: {type: str, desc: "Destination DC"}
      quantity: {type: int, desc: "Proposed quantity in units"}
      demand_period_weeks: {type: int, desc: "Weeks of demand covered"}
      planned_order_week: {type: str, desc: "Week this order should be placed (YYYY-WXX)"}
      planned_delivery_week: {type: str, desc: "Week delivery expected (YYYY-WXX)"}
      status: {type: enum, values: [draft, approved, converted, cancelled], desc: "Proposal status"}
      conversion_reason: {type: str, desc: "Why created: forecast_driven, promotion, replenishment, etc"}
      issue_detected: {type: str, desc: "Flag if parameters seem wrong, e.g. 'pack size too large'"}
      created_at: {type: timestamp, desc: "When this proposal was created"}
      cancelled_at: {type: timestamp, desc: "When cancelled"}
      cancel_reason: {type: str, desc: "Reason for cancellation"}

  supply_plans:
    key: [sku, plan_week]
    cols:
      sku: {type: str, desc: "SKU"}
      plan_week: {type: str, desc: "Week identifier (YYYY-WXX)"}
      forecast_units: {type: int, desc: "Demand forecast for the week"}
      confirmed_supply: {type: int, desc: "Units already confirmed on POs"}
      planned_inbound: {type: int, desc: "Units on approved/draft proposals"}
      gap: {type: int, desc: "Shortfall (negative = excess)"}
      stock_on_hand: {type: int, desc: "Projected on-hand stock start of week"}
      stock_projected: {type: int, desc: "Projected on-hand stock end of week"}
      safety_stock: {type: int, desc: "Target safety stock"}
      last_updated: {type: timestamp, desc: "When plan was last recalculated"}

  supply_demand_gaps:
    key: gap_id
    cols:
      gap_id: {type: str, desc: "Gap record, e.g. SDG-000123"}
      sku: {type: str, desc: "SKU with gap"}
      gap_week: {type: str, desc: "Week of the shortage (YYYY-WXX)"}
      forecast_units: {type: int, desc: "Forecast for week"}
      confirmed_units: {type: int, desc: "Confirmed supply"}
      gap_units: {type: int, desc: "Shortfall"}
      category: {type: str, desc: "Product category"}
      gap_reason: {type: str, desc: "Why gap occurred: delayed_po, forecast_spike, promotion, etc"}
      first_detected: {type: date, desc: "Date gap was first flagged"}
      last_updated: {type: date, desc: "Most recent update"}

  supply_requests:
    key: request_id
    cols:
      request_id: {type: str, desc: "Supply request, e.g. SRP-000123"}
      sku: {type: str, desc: "SKU"}
      site_id: {type: str, desc: "Requesting site/DC"}
      quantity_requested: {type: int, desc: "Units required"}
      requirement_date: {type: date, desc: "Date needed by"}
      request_type: {type: enum, values: [promotion, replenishment, safety_stock, emergency, clearance], desc: "Type of request"}
      promotion_id: {type: str, desc: "Promotion id if promotion-related"}
      status: {type: enum, values: [draft, submitted, ordered, fulfilled, cancelled], desc: "Status"}
      submitted_at: {type: timestamp, desc: "When request was created"}
      notes: {type: str, desc: "Notes on the request"}

  supplier_lead_time_actuals:
    key: [supplier_id, sku]
    cols:
      supplier_id: {type: str, desc: "Supplier"}
      sku: {type: str, desc: "SKU sourced from this supplier"}
      quoted_lead_days: {type: int, desc: "Supplier quoted lead time"}
      actual_avg_lead_days: {type: float, desc: "Average actual lead time from last 12 months"}
      sample_size: {type: int, desc: "Number of orders in the average"}
      gap_days: {type: float, desc: "Difference (actual - quoted)"}
      last_shipment_date: {type: date, desc: "Date of most recent shipment"}

  lead_time_by_origin:
    key: origin_id
    cols:
      origin_id: {type: str, desc: "Origin region/port"}
      origin_region: {type: str, desc: "Region: Asia, Europe, Americas"}
      origin_port: {type: str, desc: "Origin port code if applicable"}
      dest_dc: {type: str, desc: "Destination DC"}
      transit_days: {type: int, desc: "Average transit time in days"}
      transit_variability_days: {type: int, desc: "Standard deviation of transit time"}
      mode: {type: enum, values: [sea, air, road, rail], desc: "Transport mode"}
      rate_gbp_per_unit: {type: float, desc: "Typical freight cost per unit"}
      last_updated: {type: date, desc: "Date of last update"}

  fabric_requirements:
    key: [category, material]
    cols:
      category: {type: str, desc: "Product category"}
      material: {type: str, desc: "Fabric/material type"}
      annual_requirement_units: {type: int, desc: "Annual quantity needed"}
      monthly_average_units: {type: int, desc: "Average monthly quantity"}
      supplier_id: {type: str, desc: "Primary supplier"}
      lead_time_weeks: {type: int, desc: "Lead time from supplier"}
      stock_on_hand: {type: int, desc: "Current stock"}
      critical_threshold: {type: int, desc: "Level below which supply is critical"}

tools:
  - name: get_item_planning_parameters
    desc: Retrieve planning parameters (lead time, pack size, lot size, safety stock) for an item. Use to check or audit configuration.
    kind: select
    from: planning_parameters
    filters:
      sku: {}
    columns: [planning_param_id, sku, lead_time_days, pack_size, lot_size, safety_stock_pct, sourcing_policy, reorder_point, updated_at]
    limit: 5
    example: {sku: "SKU-100007"}

  - name: update_item_planning_parameters
    desc: Change planning parameters (lead time, pack size, lot size, safety stock %) on an item after auditing.
    kind: update
    table: planning_parameters
    set: {updated_at: "$as_of"}
    args:
      planning_param_id: {required: true}
      lead_time_days: {type: int}
      pack_size: {type: int}
      lot_size: {type: int}
      safety_stock_pct: {type: float}
      sourcing_policy: {type: enum, values: [stocked, make_to_order, dual_source]}
    example: {planning_param_id: "SPP-900001", lead_time_days: 21}

  - name: get_supply_demand_gap_for_product
    desc: Retrieve supply demand gap for a product in a week or date range. Shows confirmed supply vs forecast demand.
    kind: sql
    args:
      sku: {required: true}
      gap_week: {type: str, desc: "Week identifier (YYYY-WXX) or date range"}
    sql: |
      SELECT gap_id, sku, gap_week, forecast_units, confirmed_units, gap_units, category, gap_reason, first_detected
      FROM supply_demand_gaps
      WHERE sku = $sku
      ORDER BY gap_week DESC
    limit: 30
    example: {sku: "SKU-100007"}

  - name: get_supply_plan_for_product
    desc: Retrieves supply plan for product showing forecast, confirmed supply, and projected stock position by week.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT sku, plan_week, forecast_units, confirmed_supply, planned_inbound, gap, stock_on_hand, stock_projected, safety_stock
      FROM supply_plans
      WHERE sku = $sku
      ORDER BY plan_week
    limit: 52
    example: {sku: "SKU-100007"}

  - name: get_order_proposal_calculation_trace
    desc: Retrieve order proposal calculation trace including inputs (demand, lead time, pack size, safety stock settings) that drove the proposed quantity.
    kind: sql
    args:
      proposal_id: {required: true}
    sql: |
      SELECT proposal_id, sku, supplier_id, quantity, demand_period_weeks, planned_order_week, planned_delivery_week, status,
             issue_detected, conversion_reason, created_at
      FROM order_proposals
      WHERE proposal_id = $proposal_id
    limit: 1
    example: {proposal_id: "ORP-900001"}

  - name: calculate_projected_space_utilisation
    desc: Project space utilisation by week from stock, inbound and outbound plans. Shows DC capacity risk.
    kind: sql
    args:
      forecast_week: {type: str, required: true, desc: "Week to forecast (YYYY-WXX)"}
      site_id: {type: str, desc: "DC to analyse (default all)"}
    sql: |
      SELECT
        $forecast_week AS forecast_week,
        COALESCE($site_id, 'All DCs') AS site_id,
        ROUND(CAST(RANDOM() AS FLOAT) * 85.0 + 50.0, 1) AS utilisation_pct,
        CASE WHEN (CAST(RANDOM() AS FLOAT) * 85.0 + 50.0) > 90 THEN 'Critical'
             WHEN (CAST(RANDOM() AS FLOAT) * 85.0 + 50.0) > 75 THEN 'High'
             ELSE 'Normal' END AS risk_level,
        ROUND(CAST(RANDOM() AS FLOAT) * 2000.0, 0)::INT AS pallet_positions_occupied,
        ROUND(CAST(RANDOM() AS FLOAT) * 500.0, 0)::INT AS pallet_positions_available,
        'Dresses: 2800, Shirts: 1400, Accessories: 1200' AS category_breakdown
    limit: 5
    example: {forecast_week: "2026-W44"}

  - name: cancel_order_proposal
    desc: Cancels a system-generated order proposal before conversion to a PO. Returns old and new status.
    kind: update
    table: order_proposals
    set: {status: cancelled}
    args:
      cancel_reason: {required: true, desc: "Reason for cancellation"}
    example: {proposal_id: "ORP-900001", cancel_reason: "Parameter error found"}

  - name: list_items_with_similar_parameter_issue
    desc: List items with similar planning parameter problem (e.g. pack size too large, lead time misconfigured).
    kind: sql
    args:
      issue_type: {type: str, required: true, desc: "Issue to search for: pack_size_too_large, lead_time_wrong, etc"}
    sql: |
      SELECT DISTINCT sku, COUNT(*) as proposal_count, SUM(quantity) as total_quantity
      FROM order_proposals
      WHERE issue_detected IS NOT NULL AND issue_detected ILIKE $issue_type
      GROUP BY sku
      ORDER BY proposal_count DESC
    limit: 30
    example: {issue_type: "pack_size"}

  - name: calculate_expedite_cost
    desc: Calculate expedite cost for fast-tracking a supplier order. Returns additional cost per unit above plan.
    kind: sql
    args:
      sku: {required: true}
      supplier_id: {required: true}
      quantity_units: {type: int, required: true, desc: "Units to expedite"}
      expedite_weeks: {type: int, default: 1, desc: "Weeks to compress lead time"}
    sql: |
      SELECT
        $sku AS sku,
        $supplier_id AS supplier_id,
        $quantity_units AS quantity_units,
        $expedite_weeks AS expedite_weeks,
        ROUND($quantity_units * (5.0 + ($expedite_weeks * 2.0)), 2) AS expedite_cost_gbp,
        ROUND(5.0 + ($expedite_weeks * 2.0), 2) AS cost_per_unit_gbp,
        'cost = base_5_per_unit + 2_per_unit_per_week_expedited' AS formula
    limit: 1
    example: {sku: "SKU-100007", supplier_id: "SUP-0001", quantity_units: 5000}

  - name: calculate_split_sourcing_cost
    desc: Calculate split sourcing cost when ordering from two suppliers instead of one. Shows additional cost.
    kind: sql
    args:
      sku: {required: true}
      total_quantity: {type: int, required: true, desc: "Total units to source"}
      primary_supplier_id: {required: true, desc: "Primary supplier"}
      secondary_supplier_id: {required: true, desc: "Secondary supplier for split"}
      split_pct: {type: float, default: 50, desc: "% from secondary (50 = 50/50)"}
    sql: |
      SELECT
        $sku AS sku,
        $total_quantity AS total_quantity,
        $primary_supplier_id AS primary_supplier,
        $secondary_supplier_id AS secondary_supplier,
        ROUND($split_pct, 1) AS split_percentage,
        ROUND(CAST($total_quantity AS FLOAT) * ($split_pct / 100.0), 0) AS qty_from_secondary,
        ROUND(CAST($total_quantity AS FLOAT) * (1.0 - $split_pct / 100.0), 0) AS qty_from_primary,
        ROUND($total_quantity * 3.50, 2) AS total_split_cost_gbp,
        'cost = total_qty * 3.50 (supplier coordination overhead)' AS formula
    limit: 1
    example: {sku: "SKU-100007", total_quantity: 25000, primary_supplier_id: "SUP-0001", secondary_supplier_id: "SUP-0002"}

  - name: calculate_buy_ahead_cost
    desc: Calculate buy ahead cost for forward purchasing (working capital and storage).
    kind: sql
    args:
      sku: {required: true}
      quantity_units: {type: int, required: true, desc: "Units to buy ahead"}
      advance_weeks: {type: int, default: 4, desc: "How many weeks ahead to buy"}
    sql: |
      SELECT
        $sku AS sku,
        $quantity_units AS quantity_units,
        $advance_weeks AS advance_weeks,
        ROUND($quantity_units * ($advance_weeks * 0.15), 2) AS working_capital_cost_gbp,
        ROUND($quantity_units * ($advance_weeks * 0.08), 2) AS storage_cost_gbp,
        ROUND($quantity_units * ($advance_weeks * 0.23), 2) AS total_buy_ahead_cost_gbp,
        ROUND(CAST($quantity_units AS FLOAT) * $advance_weeks * 0.23 / $quantity_units, 2) AS cost_per_unit_per_week,
        'cost = qty * (0.15 working_capital + 0.08 storage) * weeks' AS formula
    limit: 1
    example: {sku: "SKU-100007", quantity_units: 10000, advance_weeks: 4}

  - name: calculate_buffer_stock_cost
    desc: Holding cost of a proposed safety stock buffer. Returns annual holding cost.
    kind: sql
    args:
      sku: {required: true}
      buffer_units: {type: int, required: true, desc: "Safety stock units to hold"}
    sql: |
      SELECT
        $sku AS sku,
        $buffer_units AS buffer_units,
        ROUND($buffer_units * 8.50, 2) AS annual_holding_cost_gbp,
        8.50 AS cost_per_unit_per_year,
        'cost = buffer_units * 8.50 (holding cost at 25% of £34 unit cost / year)' AS formula
    limit: 1
    example: {sku: "SKU-100007", buffer_units: 2000}

  - name: calculate_lead_time_gap_inventory_impact
    desc: Calculate inventory and service level impact of lead time gaps (difference between quoted and actual lead times).
    kind: sql
    args:
      supplier_id: {required: true}
      gap_days: {type: int, required: true, desc: "Extra days actual vs quoted"}
    sql: |
      SELECT
        $supplier_id AS supplier_id,
        $gap_days AS lead_time_gap_days,
        ROUND(CAST($gap_days AS FLOAT) / 7.0, 1) AS gap_weeks,
        ROUND(CAST($gap_days AS FLOAT) * 145.0, 0) AS inventory_increase_units,
        ROUND(CAST($gap_days AS FLOAT) * 145.0 * 8.50, 0) AS inventory_holding_cost_gbp,
        ROUND(CAST($gap_days AS FLOAT) * 0.8, 1) AS service_level_impact_pct,
        'inventory_impact = gap_days * daily_demand (145 units) * safety_factor' AS formula
    limit: 1
    example: {supplier_id: "SUP-0001", gap_days: 10}

  - name: get_lead_times_by_origin
    desc: Retrieve lead times by origin (Asia, Europe, Americas) and destination DC, with transit variability.
    kind: select
    from: lead_time_by_origin
    filters:
      origin_region: {}
      dest_dc: {}
      mode: {}
    columns: [origin_id, origin_region, origin_port, dest_dc, transit_days, transit_variability_days, mode, rate_gbp_per_unit]
    order: transit_days
    limit: 20
    example: {origin_region: "Asia"}

  - name: update_planning_lead_time_for_supplier
    desc: Changes the lead time used in planning for a supplier after analysing actual performance.
    kind: update
    table: supplier_lead_time_actuals
    set: {gap_days: "$actual_avg_lead_days - $quoted_lead_days"}
    args:
      supplier_id: {required: true}
      sku: {required: true}
      quoted_lead_days: {type: int}
      actual_avg_lead_days: {type: float, required: true, desc: "Actual average lead time in days"}
    example: {supplier_id: "SUP-0001", sku: "SKU-100007", actual_avg_lead_days: 35}

  - name: get_fabric_requirements_by_category
    desc: Retrieve fabric requirements by category. Returns materials at risk of shortage.
    kind: select
    from: fabric_requirements
    filters:
      category: {}
      material: {}
    columns: [category, material, annual_requirement_units, monthly_average_units, supplier_id, lead_time_weeks, stock_on_hand, critical_threshold]
    order: category
    limit: 50
    example: {category: "Womenswear"}

  - name: get_material_requirements_forecast
    desc: Forecast material requirements by month for raw materials and components.
    kind: sql
    args:
      material_type: {type: str, default: "fabric", desc: "Material type: fabric, zips, trims, etc"}
    sql: |
      SELECT
        CAST($material_type AS TEXT) AS material_type,
        CAST($as_of AS DATE) AS forecast_month,
        ROUND(2450.5 * (1 + (EXTRACT(MONTH FROM CAST($as_of AS DATE)) - 1) * 0.08), 0)::INT AS forecast_units,
        'forecast = base_2450 * seasonal_index' AS formula
    limit: 36
    example: {material_type: "fabric"}

  - name: calculate_supplier_disruption_impact
    desc: Stock-out and sales impact of a supplier outage or delay. Shows which SKUs run out first.
    kind: sql
    args:
      supplier_id: {required: true}
      outage_weeks: {type: int, required: true, desc: "Duration of supplier outage"}
    sql: |
      SELECT
        $supplier_id AS supplier_id,
        $outage_weeks AS outage_weeks,
        ROUND(CAST($outage_weeks AS FLOAT) * 7.0 * 145.0, 0) AS units_at_risk,
        ROUND(CAST($outage_weeks AS FLOAT) * 7.0 * 145.0 * 32.0, 0) AS revenue_at_risk_gbp,
        ROUND(CAST($outage_weeks AS FLOAT) * 3.2, 1) AS stock_outs_likely,
        'revenue_impact = outage_weeks * 7 days * 145 units/day * £32 avg price' AS formula
    limit: 1
    example: {supplier_id: "SUP-0001", outage_weeks: 6}

  - name: calculate_port_closure_impact_scenarios
    desc: Revenue, margin and stock-out impact for port closure durations (3/6/12 weeks).
    kind: sql
    args:
      port_code: {type: str, required: true, desc: "Port affected, e.g. VNSGN"}
      scenario_weeks: {type: int, required: true, desc: "Duration of closure in weeks"}
    sql: |
      SELECT
        $port_code AS port_code,
        $scenario_weeks AS scenario_weeks,
        ROUND(CAST($scenario_weeks AS FLOAT) * 7.0 * 2800.0, 0)::INT AS units_affected,
        ROUND(CAST($scenario_weeks AS FLOAT) * 7.0 * 2800.0 * 28.0, 0)::INT AS revenue_at_risk_gbp,
        ROUND(CAST($scenario_weeks AS FLOAT) * 7.0 * 2800.0 * 12.0, 0)::INT AS margin_at_risk_gbp,
        CASE WHEN $scenario_weeks >= 6 THEN 8 WHEN $scenario_weeks >= 3 THEN 4 ELSE 2 END AS categories_impacted,
        'revenue = weeks * 7 * 2800 units_daily * £28 avg_price; margin = 43% of revenue' AS formula
    limit: 3
    example: {port_code: "VNSGN", scenario_weeks: 6}

  - name: run_port_closure_scenario
    desc: Runs a port closure scenario on supply plan. Shows impact by category and which stores hit first.
    kind: sql
    args:
      port_code: {type: str, required: true}
      closure_weeks: {type: int, required: true, desc: "Duration of port closure in weeks"}
    sql: |
      SELECT
        CAST($port_code AS TEXT) AS port_affected,
        $closure_weeks AS closure_weeks,
        'Denim' AS category_most_impacted,
        'ST214 (Belfast)' AS store_hit_first,
        ROUND(CAST($closure_weeks AS FLOAT) * 385.0, 0)::INT AS projected_stockouts,
        'stock_cover_by_category: Denim 2.1 weeks, Shirts 3.2 weeks, Accessories 4.8 weeks' AS analysis
    limit: 1
    example: {port_code: "VNSGN", closure_weeks: 6}

  - name: compare_supply_gap_options
    desc: Compare supply gap options (expedite, split sourcing, promotion delay) on cost, service level and risk.
    kind: sql
    args:
      sku: {required: true}
      gap_units: {type: int, required: true, desc: "Units to cover"}
      supplier_id: {required: true}
    sql: |
      SELECT
        $sku AS sku,
        $gap_units AS gap_units,
        'Option A: Expedite' AS option,
        ROUND(CAST($gap_units AS FLOAT) * 7.0, 0)::INT AS cost_gbp,
        '1 week delivery' AS lead_time,
        'High' AS service_level,
        'Low cost, supplier capacity risk' AS risks
      UNION ALL
      SELECT
        $sku AS sku,
        $gap_units AS gap_units,
        'Option B: Split 50/50' AS option,
        ROUND(CAST($gap_units AS FLOAT) * 3.5, 0)::INT AS cost_gbp,
        '2-3 weeks' AS lead_time,
        'Medium' AS service_level,
        'Coordination risk, quality variance' AS risks
      UNION ALL
      SELECT
        $sku AS sku,
        $gap_units AS gap_units,
        'Option C: Delay promotion' AS option,
        0::INT AS cost_gbp,
        '3+ weeks' AS lead_time,
        'Low' AS service_level,
        'Revenue lost, market timing' AS risks
    limit: 3
    example: {sku: "SKU-100007", gap_units: 25000, supplier_id: "SUP-0001"}

  - name: calculate_stock_shortfall_for_promotion
    desc: Calculates stock shortfall for promotion. Returns risk and financial impact if stock runs out.
    kind: sql
    args:
      sku: {required: true}
      promotion_volume: {type: int, required: true, desc: "Expected units to sell"}
      current_stock: {type: int, required: true, desc: "Current stock on hand"}
    sql: |
      SELECT
        $sku AS sku,
        $promotion_volume AS promotion_volume,
        $current_stock AS current_stock,
        CASE WHEN $current_stock >= $promotion_volume THEN 0 ELSE $promotion_volume - $current_stock END AS shortfall_units,
        CASE WHEN $current_stock >= $promotion_volume THEN 'Low'
             WHEN $current_stock >= ($promotion_volume * 0.8) THEN 'Medium'
             ELSE 'High' END AS stockout_risk,
        ROUND(CASE WHEN $current_stock < $promotion_volume THEN CAST(($promotion_volume - $current_stock) AS FLOAT) * 28.0 ELSE 0 END, 0)::INT AS lost_revenue_gbp,
        'risk = promotional_volume / current_stock' AS formula
    limit: 1
    example: {sku: "SKU-100007", promotion_volume: 8000, current_stock: 5500}

  - name: create_supply_request_for_promotion
    desc: Raises a supply request for the stock a promotion needs. Returns new request id and status.
    kind: insert
    table: supply_requests
    id_prefix: SRP-
    defaults: {status: submitted, request_type: promotion}
    args:
      sku: {required: true}
      site_id: {required: true}
      quantity_requested: {required: true, type: int, desc: "Units required"}
      requirement_date: {required: true, type: date, desc: "Date needed by"}
      promotion_id: {}
      notes: {}
    example: {sku: "SKU-100007", site_id: "DC1", quantity_requested: 15000, requirement_date: "+21d"}

  - name: update_sku_sourcing_policy
    desc: Changes a SKU between stocked and make-to-order sourcing based on demand analysis.
    kind: update
    table: planning_parameters
    set: {updated_at: "$as_of"}
    args:
      planning_param_id: {required: true}
      sourcing_policy: {type: enum, values: [stocked, make_to_order, dual_source], required: true}
    example: {planning_param_id: "SPP-900001", sourcing_policy: "make_to_order"}
