# One entry per question in the brief (see: python -m mockmcp brief kpi)

- question: "05:49:Q5"
  story: >
    Circularity units collected (KPI-0011) are 49,400 over the last 52 weeks versus 40,100 the year before (+23.2%,
    95% of the 52,000 annual target); value recovered (KPI-0012) is £245,000 versus £190,000 (+28.9%, target £260,000).
    Channel targets: Reuse recovers the most per pound of handling cost.
  checks:
    - tool: get_circularity_targets
      args: {}
      expect: ["Reuse", "Recycle", "6.67", "104000"]
    - tool: calculate_year_on_year_change
      args: {kpi_id: KPI-0011}
      expect: ["49400", "40100", "23.2", "52000"]
    - tool: calculate_year_on_year_change
      args: {kpi_id: KPI-0012}
      expect: ["245000", "190000", "28.9", "260000"]

- question: "09:81:Q3"
  story: >
    Service KPIs have targets and red/amber alert ids. OTIF (KPI-0001) has slipped to about 90% against 95.5 and is
    most likely to miss; its red alert ALT-000001 sits at 85.95 and is tightened by the write.
  checks:
    - tool: get_kpi_targets
      args: {domain: service}
      expect: ["95.5", "85.95", "ALT-000001", "850"]
    - tool: update_kpi_alert_threshold
      args: {alert_id: ALT-000001, threshold_value: 92}
      expect: ["ALT-000001", "92"]
    - tool: get_kpi_targets
      args: {kpi_id: KPI-0001}
      expect: ["92"]

- question: "09:87:Q1"
  story: >
    Five adverse headline KPIs in the latest four-week period: Lost Time Injury Frequency (+54%, DC2 forklift injuries),
    Stock Turnover Days (+12%), Waste Diversion Rate (-8%), Cost per Unit (+7%) and OTIF (-5%). Root causes carry fix
    dates; turnover and waste diversion take far longer than a quarter.
  checks:
    - tool: get_executive_scorecard
      args: {}
      expect: ["Lost Time Injury Frequency", "Red", "Amber", "Green"]
    - tool: list_top_kpi_variances
      args: {}
      expect: ["Lost Time Injury Frequency", "Stock Turnover Days", "Waste Diversion Rate", "Cost per Unit Handled", "OTIF", "54"]
    - tool: get_issue_root_causes
      args: {}
      expect: ["Forklift", "recycling", "fixable_within_quarter"]

- question: "09:88:Q1"
  story: >
    ST214 (Glasgow Retail Park) misses all four targets (service 88.5, cost 3.12, LTIF 1.2, first pass 92.1) because of
    vacancies and agency cover; DC2 (Daventry) is second worst (LTIF 0.8 after forklift injuries, first pass 94.5).
    DC1 (Northampton) is third: cost per unit 2.54 and LTIF 0.65 are over target (the HSE worst-DC and budgeting over-budget story) while service and quality are on target.
    Other sites are at or near target.
  checks:
    - tool: get_site_scorecard
      args: {}
      expect: ["ST214", "Glasgow Retail Park", "DC2", "88.5", "3.12"]
    - tool: get_site_quality_metrics
      args: {}
      expect: ["ST214", "92.1", "DC2", "94.5"]
    - tool: get_issue_root_causes
      args: {site_id: ST214}
      expect: ["vacancies", "agency"]

- question: "09:88:Q5"
  story: >
    Latest weekly KPI actuals: DC Throughput is ahead of target (859 vs 850); Lost Time Injury Frequency (0.78 vs 0.5),
    Stock Turnover Days (31.4 vs 28), Waste Diversion Rate (66.2 vs 72) and OTIF are behind.
  checks:
    - tool: get_kpi_actuals
      args: {}
      expect: ["DC Throughput", "ahead of target", "behind target", "Lost Time Injury Frequency"]
