# One entry per question in the brief (see: python -m mockmcp brief kpi)
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string

- question: "05:49:Q5"
  story: >
    We collected 78,000 units across Reuse (25,000), Repair (18,000), and Recycle (35,000) channels this year,
    recovering £270,000 in value against a target of £270,000. Reuse recovered the most per pound of handling cost.
    Last year we collected 65,000 units and recovered £215,000, so we're up 20% in volume and 25% in value.
  checks:
    - tool: get_circularity_targets
      args: {}
      expect: ["Reuse", "Recycle", "units_collected_target"]
    - tool: calculate_year_on_year_change
      args: {kpi_id: KPI-0001}
      expect: ["current_year_value", "prior_year_value", "formula"]

- question: "09:81:Q3"
  story: >
    Next month's KPI targets show OTIF at 95.5% (current: 94.8%), Cost per Unit at £2.35 (current: £2.42),
    and Inventory Accuracy at 98.5%. Cost and OTIF are most likely to miss target. Red alert on cost if below £2.00,
    amber if below £2.23. We tighten the cost alert to £2.15 to catch problems earlier.
  checks:
    - tool: get_kpi_targets
      args: {domain: service}
      expect: ["OTIF", "target_value"]
    - tool: update_kpi_alert_threshold
      args: {alert_id: ALT-900004, threshold_value: 2.15}
      expect: ["ALT-900004"]

- question: "09:87:Q1"
  story: >
    Executive scorecard shows service OTIF at 94.8% (target 95.5%, -3.6% variance), Cost at £2.42/unit (target £2.35, +6.8% adverse),
    and Quality at 96.5% (target 96.5%, on track). Top variances: Cost up due to peak volume surge (moderate, action raised),
    OTIF down due to supplier delays (moderate, root cause identified), and Safety LTIF at 0.8 (target 0.5, severe). DC1 leads on service at 96.5%.
  checks:
    - tool: get_executive_scorecard
      args: {}
      expect: ["OTIF", "Cost per Unit", "domain"]
    - tool: list_top_kpi_variances
      args: {}
      expect: ["variance_id", "severity"]
    - tool: get_issue_root_causes
      args: {}
      expect: ["root_cause", "department_responsible"]

- question: "09:88:Q1"
  story: >
    Site scorecard shows DC1 leading on service (96.5%), DC2 second (93.2%), and ST214 weakest (88.5%).
    Quality metrics show DC1 at 97.8% first pass (best), DC2 at 94.5% (weakest), ST214 at 92.1%.
    Safety shows DC2 with highest LTIF at 0.8 (target 0.5). DC2 is underperforming on service, cost, and safety.
    The root cause is insufficient safety training and equipment maintenance in DC2 operations.
  checks:
    - tool: get_site_scorecard
      args: {}
      expect: ["DC1", "DC2", "service_score"]
    - tool: get_site_quality_metrics
      args: {}
      expect: ["quality_first_pass_pct", "stock_accuracy_pct"]
    - tool: get_issue_root_causes
      args: {}
      expect: ["DC2", "Safety"]

- question: "09:88:Q5"
  story: >
    KPI actuals for OTIF show 94.8% this week (vs 95.5% target), and for Cost per Unit show £2.42 (vs £2.35 target).
    Historical actuals over last 30 days show OTIF ranged 94.2% to 96.2%, averaging 95.1%.
    Cost ranged £2.18 to £2.45, averaging £2.32. These results benchmark against industry standards.
  checks:
    - tool: get_kpi_actuals
      args: {kpi_id: KPI-0001, date_from: "-30d"}
      expect: ["actual_value", "measured_date"]
