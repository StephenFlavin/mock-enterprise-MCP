- question: "01:8:Q1"
  story: "INC-900001 shows 140 orders stuck in allocation failure since 6am, affecting the WMS system. The question investigates whether it's a data issue, config change, or interface failure. Our tools help identify root cause and the incident is logged."
  checks:
    - tool: create_incident_ticket
      args: {title: "WMS interface timeout", description: "Stock feed timing out", severity: high, system_affected: "WMS"}
      expect: ["INC-", "open", "high"]

- question: "01:8:Q2"
  story: "INC-900004 shows ERP and WMS stock disagree. We log an incident ticket for the interface team to fix."
  checks:
    - tool: create_incident_ticket
      args: {title: "ERP WMS stock sync mismatch", description: "Stock levels not reconciling", severity: high, system_affected: "ERP"}
      expect: ["INC-", "open", "high"]

- question: "01:8:Q3"
  story: "We have CHG-900001 as a draft change request for WMS 9.3 security patch. It's submitted for CAB approval and we verify its status."
  checks:
    - tool: list_releases_and_change_requests
      args: {system_affected: "WMS", date_from: "-90d"}
      expect: ["CHG-", "WMS", "patch", "v9.3"]

- question: "01:10:Q3"
  story: "CHG-900002 is a draft change request to update AMR firmware 4.7, targeting first week of November. We create and verify it."
  checks:
    - tool: create_change_request
      args: {title: "AMR firmware update", description: "Update to firmware 4.7", change_type: firmware, system_affected: "WMS", planned_date: "+30d"}
      expect: ["CHG-", "draft", "firmware"]

- question: "01:10:Q5"
  story: "We investigate WiFi network load at DC1 showing that 2-4pm (14-16 hours) has higher device count (45-50 devices) and lower throughput (180-220 Mbps) and higher latency (8-12ms) in warehouse area."
  checks:
    - tool: get_wifi_network_load
      args: {site_id: DC1, area: warehouse}
      expect: ["DC1", "warehouse", "device_count", "latency_ms"]

- question: "08:74:Q1"
  story: "INC-900005 shows conversion drop investigation. ERR-900001, ERR-900002, ERR-900003, and ERR-900004 show checkout errors and inventory sync issues affecting sales."
  checks:
    - tool: list_site_errors_for_period
      args: {date_from: "-30d"}
      expect: ["checkout_error", "inventory_sync", "ST001", "ST100", "ST214"]

- question: "08:74:Q1-followup"
  story: "We log an incident for the checkout errors discovered."
  checks:
    - tool: create_incident_ticket_for_site_error
      args: {title: "Checkout errors", description: "Error spike reducing conversion", system_affected: "POS"}
      expect: ["INC-", "open", "POS"]

- question: "08:79:Q5"
  story: "We check self-checkout fault tickets at stores with shrink issues. FLT-900001, FLT-900002, FLT-900003 show multiple failures at ST214."
  checks:
    - tool: list_self_checkout_fault_tickets
      args: {site_id: ST214}
      expect: ["ST214", "FLT-", "scanning error", "payment failure"]

- question: "08:79:Q5-remedy"
  story: "We create a fault ticket for a new scanning error at a self-checkout unit."
  checks:
    - tool: create_fault_ticket_for_self_checkout
      args: {site_id: ST100, device_id: "SCO-100-08", fault_type: "scanning error", description: "Barcode scanner malfunction", severity: high}
      expect: ["FLT-", "ST100", "scanning error", "open"]

- question: "09:82:Q2"
  story: "REL-900001, REL-900002, and REL-900003 show releases and changes affecting the demand model and related systems over the past 90 days, helping identify whether drift is from a data pipeline change."
  checks:
    - tool: list_releases_and_change_requests
      args: {date_from: "-90d"}
      expect: ["REL-", "release_date", "deployed"]

- question: "09:82:Q5"
  story: "ALR-900001 and ALR-900002 show demand forecast model has active drift and accuracy alerts, including recent trigger on ALR-900001."
  checks:
    - tool: get_model_alert_rules
      args: {model_name: demand_forecast}
      expect: ["demand_forecast", "drift", "accuracy", "true"]

- question: "09:83:Q2"
  story: "We investigate EDI ASN specification mapping. CHG-900003 is a draft change request to map the new EDI ASN segment for pallet-level packing data to WMS inbound fields."
  checks:
    - tool: list_releases_and_change_requests
      args: {system_affected: "WMS", date_from: "-30d"}
      expect: ["CHG-", "WMS"]

- question: "09:83:Q4"
  story: "We check interface throughput and capacity. Order API at INT-900001 has 16% headroom, Stock Feed at INT-900002 has only 5% headroom (critical). Load test history at LTR-900001 and LTR-900002 show previous peak loads. We schedule a new test."
  checks:
    - tool: get_interface_throughput_and_capacity
      args: {}
      expect: ["INT-", "headroom_pct", "Order API", "Stock Feed"]
    - tool: get_peak_interface_load_history
      args: {interface_name: "Order API"}
      expect: ["LTR-", "peak_achieved", "avg_latency_ms"]
    - tool: create_load_test_run
      args: {interface_name: "Order API", test_type: "peak load", target_message_rate: 5000}
      expect: ["LTR-", "scheduled", "Order API"]

- question: "09:83:Q5"
  story: "Data pipeline shows stock_feed pipeline has 4 steps with timing data. PIP-900006 through PIP-900009 show fetch takes 45s, transform 120s, validate 60s, publish 240s - total ~465s latency, causing 20-minute delays."
  checks:
    - tool: get_pipeline_step_timings
      args: {pipeline_name: "stock_feed"}
      expect: ["stock_feed", "fetch", "transform", "validate", "publish"]

- question: "09:85:Q1"
  story: "Asset CMDB shows critical systems: AST-900001 WMS Database (critical, RTO 15min), AST-900002 Order API (critical, RTO 30min), etc. We assess business criticality to rank security risks."
  checks:
    - tool: get_asset_business_criticality
      args: {}
      expect: ["AST-", "critical", "WMS", "Order API"]

- question: "09:85:Q3"
  story: "SEC-900002 and SEC-900003 are remediation tasks for supplier connection access and third-party system access risks. We verify open tasks."
  checks:
    - tool: create_security_remediation_task
      args: {title: "Patch critical vulnerability", description: "Apply security patch", finding_id: "VULN-100", risk_level: critical, due_date: "+7d"}
      expect: ["SEC-", "open", "critical"]

- question: "09:85:Q4"
  story: "VSW-900001, VSW-900002, VSW-900003 show WMS 9.2 in all three DCs with 3 security issues. VSW-900004 shows SAP ERP 4.7 with 1 issue. Latest WMS version is 9.3."
  checks:
    - tool: get_vendor_software_inventory
      args: {}
      expect: ["WMS", "Blue Yonder", "9.2", "security_issues"]

- question: "09:85:Q5"
  story: "System dependencies show WMS depends on Database (recovery tier 1, RTO 15min, RPO 5min), Message Queue (tier 1, RTO 60min, RPO 15min). Backup status shows all critical databases have recent backups and restore tests."
  checks:
    - tool: get_critical_system_dependencies
      args: {}
      expect: ["WMS", "recovery_tier", "rto_minutes"]
    - tool: get_recovery_time_and_backup_status
      args: {}
      expect: ["WMS Database", "healthy", "restore_tested"]

- question: "09:88:Q2"
  story: "WMS system performance shows DC2 (Daventry) has degraded status with higher response times (92.3ms vs 85.5ms at DC1, 75.2ms at DC3) and 8 errors vs 5 at DC1, 2 at DC3."
  checks:
    - tool: get_wms_system_performance
      args: {site_id: DC2}
      expect: ["DC2", "degraded"]

- question: "09:90:Q3"
  story: "We create a change request to log the chosen programme trade-off option for the steering committee."
  checks:
    - tool: create_change_request
      args: {title: "Programme decision - scope reduction", description: "Steering committee approved scope reduction", change_type: configuration, system_affected: "WMS"}
      expect: ["CHG-", "draft", "configuration"]
