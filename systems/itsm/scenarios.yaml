- question: 09:83:Q4
  story: WMS_to_OMS has the least headroom (430 of 650 msgs/s, 33.8%) and would reach about 104% at a 57% peak uplift; it peaked at 610 msgs/s last Black Friday week and failed a stress test at 560 msgs/s.
    The agent schedules a stress test on it.
  checks:
  - tool: get_interface_throughput_and_capacity
    args:
      peak_uplift_pct: 57
    expect:
    - WMS_to_OMS
    - '33.8'
    - '103.9'
    - WMS_to_Website
  - tool: get_peak_interface_load_history
    args:
      interface_name: WMS_to_OMS
    expect:
    - PKL-900001
    - '610'
    - Black Friday week
    - '2350'
  - tool: list_load_test_history
    args:
      interface_name: WMS_to_OMS
    expect:
    - LTR-900002
    - '560'
    - failed
  - tool: create_load_test_run
    args:
      interface_name: WMS_to_OMS
      test_type: stress
      target_message_rate: 700
    expect:
    - LTR-900006
    - scheduled
    - WMS_to_OMS
    - '700'
