- question: 01:8:Q1
  story: Orders are stuck in allocation failure on the WMS_to_OMS interface; the agent opens a critical incident routed to the Interface Team. The stored ticket carries severity, affected interface and
    team.
  checks:
  - tool: create_incident_ticket
    args:
      title: WMS to OMS allocation failures
      description: 140 orders stuck in allocation failed since 6am; WMS_to_OMS queue backing up
      severity: critical
      system_affected: WMS_to_OMS
      assigned_team: Interface Team
    expect:
    - INC-
    - critical
    - WMS_to_OMS
    - Interface Team
- question: 01:8:Q2
  story: ERP and WMS stock disagree because of the ERP_to_WMS interface; the agent raises a high severity incident for the interface fix. The ticket stores the interface and the Interface Team.
  checks:
  - tool: create_incident_ticket
    args:
      title: ERP to WMS stock mismatch
      description: ERP and WMS stock disagree; fix the ERP_to_WMS mapping
      severity: high
      system_affected: ERP_to_WMS
      assigned_team: Interface Team
    expect:
    - INC-
    - high
    - ERP_to_WMS
    - Interface Team
- question: 01:8:Q3
  story: WMS 9.2.4 is installed and patch 9.2.7 fixes the duplicate replenishment tasks. The agent creates a draft patch change request for WMS and submits it for the next CAB (the new id follows seeded
    CHG-900110).
  checks:
  - tool: create_change_request
    args:
      title: WMS 9.2.7 patch
      description: Apply WMS patch 9.2.7 to fix duplicate replenishment tasks
      change_type: patch
      system_affected: WMS
      planned_date: +14d
    expect:
    - CHG-900111
    - draft
    - patch
    - WMS
  - tool: submit_change_request
    args:
      change_id: CHG-900111
    expect:
    - draft
    - submitted
