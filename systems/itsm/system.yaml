id: itsm
name: Application Monitoring & ITSM
instructions: >
  Incident management, change control, system monitoring, security tasks and load testing.
  Incident ids like INC-000123, change requests like CHG-000123, fault tickets like FLT-000123.
  Use for incidents, change requests, self-checkout faults, site errors, security remediation,
  system performance and recovery planning.

tables:
  incident_tickets:
    key: incident_id
    cols:
      incident_id: {type: str, desc: "Incident ticket, e.g. INC-000123"}
      title: {type: str, desc: Incident title}
      description: {type: str, desc: Incident description}
      status: {type: enum, values: [open, investigating, resolved, closed], desc: Ticket status}
      severity: {type: enum, values: [critical, high, medium, low], desc: Severity level}
      assigned_to: {type: str, desc: "Employee id assigned to, e.g. EMP-00095"}
      assigned_team: {type: str, desc: "Support team the ticket is routed to, e.g. Interface Team"}
      system_affected: {type: str, desc: "Affected system or interface, e.g. WMS, WMS_to_OMS, Website"}
      source_error_id: {type: str, desc: "Site error that triggered the ticket, e.g. ERR-900001"}
      raised_at: {type: timestamp, desc: When raised}
      resolved_at: {type: timestamp, desc: When resolved}
      updated_at: {type: timestamp, desc: Last updated}

  change_requests:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change request, e.g. CHG-000123"}
      title: {type: str, desc: Change title}
      description: {type: str, desc: Change description}
      change_type: {type: enum, values: [patch, firmware, configuration, migration], desc: Type of change}
      status: {type: enum, values: [draft, submitted, approved, implemented, closed, rejected], desc: Status}
      assigned_to: {type: str, desc: "Employee id assigned"}
      system_affected: {type: str, desc: "System affected by change"}
      planned_date: {type: date, desc: Planned implementation date}
      submitted_at: {type: timestamp, desc: When submitted for approval}
      approved_at: {type: timestamp, desc: When approved by CAB}
      implemented_at: {type: timestamp, desc: When implemented}
      created_at: {type: timestamp, desc: When created}
      updated_at: {type: timestamp, desc: Last updated}

  fault_tickets:
    key: fault_id
    cols:
      fault_id: {type: str, desc: "Fault ticket, e.g. FLT-000123"}
      site_id: {type: str, desc: Store location}
      device_id: {type: str, desc: Self-checkout unit identifier}
      fault_type: {type: str, desc: "Type of fault, e.g. scanning error, payment failure"}
      description: {type: str, desc: Fault description}
      status: {type: enum, values: [open, investigating, repaired, closed], desc: Status}
      severity: {type: enum, values: [high, medium, low], desc: Severity level}
      raised_at: {type: timestamp, desc: When fault reported}
      resolved_at: {type: timestamp, desc: When resolved}
      updated_at: {type: timestamp, desc: Last updated}

  site_errors:
    key: error_id
    cols:
      error_id: {type: str, desc: "Website error, e.g. ERR-000123"}
      error_type: {type: str, desc: "Error type: checkout_error, payment_gateway, inventory_sync, basket_error, search_error, login_error"}
      page: {type: str, desc: "Website page or step where it occurs, e.g. /checkout/payment"}
      device: {type: str, desc: "Device affected: mobile, desktop or all"}
      error_message: {type: str, desc: Error details}
      error_count: {type: int, desc: Number of times error occurred}
      sessions_affected: {type: int, desc: Customer sessions that hit the error}
      first_seen: {type: timestamp, desc: First occurrence}
      last_seen: {type: timestamp, desc: Last occurrence}
      status: {type: enum, values: [active, investigating, resolved, ignored], desc: Status}
      resolution: {type: str, desc: "How it was resolved, or the proposed fix and its effort"}
      created_at: {type: timestamp, desc: When created}
      updated_at: {type: timestamp, desc: Last updated}

  security_remediation_tasks:
    key: task_id
    cols:
      task_id: {type: str, desc: "Remediation task, e.g. SEC-000123"}
      finding_id: {type: str, desc: Related security finding identifier}
      title: {type: str, desc: Task title}
      description: {type: str, desc: Task description}
      risk_level: {type: enum, values: [critical, high, medium, low], desc: Business risk level}
      status: {type: enum, values: [open, in_progress, completed, accepted_risk], desc: Status}
      assigned_to: {type: str, desc: "Employee id assigned"}
      due_date: {type: date, desc: Due date for remediation}
      created_at: {type: timestamp, desc: When created}
      updated_at: {type: timestamp, desc: Last updated}

  load_test_runs:
    key: test_run_id
    cols:
      test_run_id: {type: str, desc: "Load test run, e.g. LTR-000123"}
      interface_name: {type: str, desc: "Interface being tested, e.g. WMS_to_OMS"}
      test_type: {type: str, desc: "Test type, e.g. peak load, stress, endurance"}
      target_message_rate: {type: int, desc: Target messages per second}
      peak_achieved: {type: int, desc: Peak messages achieved per second}
      avg_latency_ms: {type: float, desc: Average latency in milliseconds}
      max_latency_ms: {type: float, desc: Maximum latency in milliseconds}
      errors: {type: int, desc: Number of errors during test}
      status: {type: enum, values: [scheduled, in_progress, passed, failed], desc: Test status}
      scheduled_at: {type: timestamp, desc: When scheduled}
      started_at: {type: timestamp, desc: When started}
      completed_at: {type: timestamp, desc: When completed}
      notes: {type: str, desc: Test notes and findings}

  system_interfaces:
    key: interface_id
    cols:
      interface_id: {type: str, desc: "Interface, e.g. INT-000123"}
      interface_name: {type: str, desc: "Interface name, e.g. WMS_to_OMS"}
      source_system: {type: str, desc: Source system name}
      target_system: {type: str, desc: Target system name}
      message_type: {type: str, desc: "Message type, e.g. order, shipment, inventory"}
      current_throughput_msgs_per_sec: {type: float, desc: Current throughput in messages per second}
      rated_capacity_msgs_per_sec: {type: int, desc: Rated capacity in messages per second}
      headroom_pct: {type: float, desc: Available headroom as percentage}
      last_measured: {type: date, desc: Date of last measurement}
      status: {type: enum, values: [operational, degraded, failing], desc: Current status}

  interface_peak_load:
    key: peak_id
    cols:
      peak_id: {type: str, desc: "Peak record, e.g. PKL-000123"}
      interface_name: {type: str, desc: "Interface, e.g. WMS_to_OMS"}
      event_name: {type: str, desc: "Peak event, e.g. Black Friday week"}
      peak_date: {type: date, desc: Day of the busiest hour}
      peak_msgs_per_sec: {type: float, desc: Highest sustained messages per second in the peak}
      rated_capacity_msgs_per_sec: {type: int, desc: Rated capacity at the time}
      avg_latency_ms: {type: float, desc: Average latency in milliseconds during the peak}
      p95_latency_ms: {type: float, desc: 95th percentile latency in milliseconds}
      error_rate_pct: {type: float, desc: Share of messages that errored or were retried}
      messages_in_peak_day: {type: int, desc: Total messages on the peak day}

  wifi_network_load:
    key: measurement_id
    cols:
      measurement_id: {type: str, desc: "Measurement, e.g. WIF-000123"}
      site_id: {type: str, desc: Store or DC site}
      area: {type: str, desc: "Area within site, e.g. warehouse, loading_dock, office"}
      hour_of_day: {type: int, desc: "Hour of day 0-23"}
      date_measured: {type: date, desc: Date of measurement}
      device_count: {type: int, desc: Number of connected devices}
      throughput_mbps: {type: float, desc: Network throughput in Mbps}
      latency_ms: {type: float, desc: Average latency in milliseconds}
      signal_strength_dbm: {type: float, desc: Signal strength in dBm}
      channel_utilisation_pct: {type: float, desc: Share of airtime in use on the access points}
      packet_loss_pct: {type: float, desc: Packet loss percentage}

  wms_system_performance:
    key: perf_id
    cols:
      perf_id: {type: str, desc: "Performance record, e.g. WMS-000123"}
      site_id: {type: str, desc: Site location}
      measurement_date: {type: date, desc: Date of measurement}
      avg_response_time_ms: {type: float, desc: Average response time in milliseconds}
      p95_response_time_ms: {type: float, desc: 95th percentile response time in milliseconds}
      p99_response_time_ms: {type: float, desc: 99th percentile response time in milliseconds}
      error_count: {type: int, desc: Number of errors during period}
      incident_count: {type: int, desc: Number of incidents reported}
      throughput_orders_per_hour: {type: float, desc: Orders processed per hour}
      status: {type: enum, values: [healthy, degraded, critical], desc: Overall status}

  asset_cmdb:
    key: asset_entry_id
    cols:
      asset_entry_id: {type: str, desc: "CMDB entry, e.g. CMB-000123"}
      asset_id: {type: str, desc: Asset identifier}
      asset_name: {type: str, desc: Asset name}
      asset_type: {type: str, desc: "Asset type, e.g. server, database, application"}
      business_service: {type: str, desc: "Business service it supports"}
      criticality: {type: enum, values: [critical, high, medium, low], desc: Business criticality}
      owner_team: {type: str, desc: Team that owns the asset}
      rto_minutes: {type: int, desc: Recovery time objective in minutes}
      rpo_minutes: {type: int, desc: Recovery point objective in minutes}

  system_dependencies:
    key: dependency_id
    cols:
      dependency_id: {type: str, desc: "Dependency record, e.g. DEP-000123"}
      source_system: {type: str, desc: Source system name}
      target_system: {type: str, desc: Target system (dependency)}
      dependency_type: {type: str, desc: "Type, e.g. database, API, file transfer"}
      criticality: {type: enum, values: [critical, high, medium, low], desc: Impact if target fails}
      rto_minutes: {type: int, desc: Recovery time objective if target fails}
      rpo_minutes: {type: int, desc: Recovery point objective if target fails}
      recovery_tier: {type: int, desc: "Recovery tier: 1 (highest priority) to 4"}

  backup_and_recovery:
    key: system_name
    cols:
      system_name: {type: str, desc: System name}
      system_type: {type: str, desc: "System type, e.g. database, application, file storage"}
      rto_minutes: {type: int, desc: "Recovery time objective (RTO) in minutes"}
      rpo_minutes: {type: int, desc: "Recovery point objective (RPO) in minutes"}
      last_backup_date: {type: date, desc: Date of last backup}
      last_backup_size_gb: {type: float, desc: Size of last backup in GB}
      last_restore_test_date: {type: date, desc: Date of last restore test}
      last_restore_test_duration_minutes: {type: int, desc: Duration of last restore test}
      backup_status: {type: enum, values: [healthy, at_risk, failed], desc: Status of backup}
      restore_tested: {type: bool, desc: Whether restore has been tested}

  vendor_software:
    key: software_id
    cols:
      software_id: {type: str, desc: "Software entry, e.g. VSW-000123"}
      software_name: {type: str, desc: Software application name}
      vendor_name: {type: str, desc: Software vendor}
      installed_version: {type: str, desc: Installed version}
      system_or_location: {type: str, desc: "Where it is installed, e.g. DC1, HQ"}
      installation_date: {type: date, desc: Date installed}
      support_end_date: {type: date, desc: Vendor support end date}
      latest_available_version: {type: str, desc: Latest version available}
      security_issues: {type: int, desc: Number of known security issues in this version}
      criticality: {type: enum, values: [critical, high, medium, low], desc: Criticality to business}

  model_alert_rules:
    key: rule_id
    cols:
      rule_id: {type: str, desc: "Alert rule, e.g. ALR-000123"}
      model_id: {type: str, desc: "ML model id, e.g. MOD-demand"}
      model_name: {type: str, desc: "ML model name, e.g. Demand Forecast"}
      rule_type: {type: str, desc: "Type, e.g. drift, accuracy, retraining"}
      threshold_value: {type: float, desc: Threshold that triggers alert}
      threshold_metric: {type: str, desc: "Metric used, e.g. PSI, MAE, R-squared"}
      enabled: {type: bool, desc: Whether rule is active}
      created_at: {type: timestamp, desc: When rule was created}
      last_triggered: {type: timestamp, desc: When rule last triggered}
      noise_level: {type: enum, values: [low, medium, high], desc: False positive rate}
      alerts_last_30d: {type: int, desc: Alerts raised by this rule in the last 30 days}

  data_pipeline:
    key: pipeline_step_id
    cols:
      pipeline_step_id: {type: str, desc: "Pipeline step, e.g. PIP-000123"}
      pipeline_name: {type: str, desc: Pipeline name}
      step_name: {type: str, desc: Step name in pipeline}
      step_order: {type: int, desc: Execution order}
      avg_duration_seconds: {type: float, desc: Average step duration in seconds over the last 7 days}
      baseline_avg_seconds: {type: float, desc: Average step duration in seconds over the previous 90 days}
      max_duration_seconds: {type: float, desc: Maximum step duration observed}
      min_duration_seconds: {type: float, desc: Minimum step duration observed}
      rows_processed: {type: int, desc: Rows processed in last run}
      last_run_date: {type: date, desc: Date of last run}
      success_rate_pct: {type: float, desc: Success rate as percentage}
      notes: {type: str, desc: What the step does and any setting that controls its duration}

  releases_and_changes:
    key: release_id
    cols:
      release_id: {type: str, desc: "Release, e.g. REL-000123"}
      release_name: {type: str, desc: Release name}
      system_affected: {type: str, desc: System affected}
      release_date: {type: date, desc: Release date}
      change_description: {type: str, desc: What changed}
      change_request_ids: {type: str, desc: Related change request ids}
      deployed_to: {type: str, desc: "Where deployed, e.g. production, staging"}
      rollback_available: {type: bool, desc: Whether rollback is available}
      status: {type: enum, values: [planned, deployed, rolled_back], desc: Status}

tools:
  - name: create_incident_ticket
    desc: Open an incident ticket and assign it to a support team. Returns the new incident ticket.
    kind: insert
    table: incident_tickets
    id_prefix: INC-
    defaults: {status: open}
    args:
      title: {required: true}
      description: {required: true}
      severity: {required: true, values: [critical, high, medium, low]}
      system_affected: {required: true}
      assigned_to: {type: str, desc: Employee id to assign to}
    example: {title: "WMS interface timeout", description: "Stock feed timing out", severity: high, system_affected: "WMS"}

  - name: create_incident_ticket_for_site_error
    desc: Raises an incident ticket for a site error. Returns the new ticket.
    kind: insert
    table: incident_tickets
    id_prefix: INC-
    defaults: {status: open, severity: high}
    args:
      title: {required: true}
      description: {required: true}
      system_affected: {required: true}
      assigned_to: {type: str}
    example: {title: "Checkout error spike", description: "Checkout errors increasing", system_affected: "POS"}

  - name: create_fault_ticket_for_self_checkout
    desc: Raises a fault ticket for a self-checkout unit. Returns the new ticket.
    kind: insert
    table: fault_tickets
    id_prefix: FLT-
    defaults: {status: open}
    args:
      site_id: {required: true}
      device_id: {required: true}
      fault_type: {required: true}
      description: {required: true}
      severity: {required: true, values: [high, medium, low]}
    example: {site_id: ST214, device_id: "SCO-214-01", fault_type: "scanning error", description: "Barcode scanner not responding", severity: high}

  - name: create_change_request
    desc: Create a change request record for a patch, firmware or configuration change. Returns the new change request.
    kind: insert
    table: change_requests
    id_prefix: CHG-
    defaults: {status: draft}
    args:
      title: {required: true}
      description: {required: true}
      change_type: {required: true, values: [patch, firmware, configuration, migration]}
      system_affected: {required: true}
      planned_date: {type: date}
      assigned_to: {type: str}
    example: {title: "WMS 9.3 security patch", description: "Apply critical security patch", change_type: patch, system_affected: WMS, planned_date: "+7d"}

  - name: submit_change_request
    desc: Submit a change request for approval at the change board. Returns the old and new status.
    kind: update
    table: change_requests
    set: {status: submitted, submitted_at: "$as_of"}
    args: {}
    example: {change_id: CHG-900001}

  - name: create_load_test_run
    desc: Schedules a load test run against an interface. Returns the new test run.
    kind: insert
    table: load_test_runs
    id_prefix: LTR-
    defaults: {status: scheduled}
    args:
      interface_name: {required: true}
      test_type: {required: true}
      target_message_rate: {required: true, type: int}
      scheduled_at: {type: timestamp, desc: When to schedule the test}
    example: {interface_name: "Order API", test_type: "peak load", target_message_rate: 5000}

  - name: create_security_remediation_task
    desc: Creates a remediation task for a security finding. Returns the new task.
    kind: insert
    table: security_remediation_tasks
    id_prefix: SEC-
    defaults: {status: open}
    args:
      title: {required: true}
      description: {required: true}
      finding_id: {required: true}
      risk_level: {required: true, values: [critical, high, medium, low]}
      due_date: {type: date}
      assigned_to: {type: str}
    example: {title: "Patch WMS SQLi vulnerability", description: "Apply vendor patch", finding_id: "VULN-042", risk_level: critical, due_date: "+7d"}

  - name: list_site_errors_for_period
    desc: Lists site errors for period. Returns error id, type, message and occurrence count.
    kind: sql
    args:
      site_id: {}
      date_from: {type: date, default: "-30d", desc: "Errors from this date onward"}
      date_to: {type: date, default: "$as_of", desc: "Errors up to this date"}
      error_type: {type: str, desc: "Filter by error type"}
    sql: |
      SELECT error_id, site_id, error_type, error_message, error_count, first_seen, last_seen, status
      FROM site_errors
      WHERE ($site_id IS NULL OR site_id = $site_id)
        AND first_seen >= CAST($date_from AS DATE)
        AND last_seen <= CAST($date_to AS DATE)
        AND ($error_type IS NULL OR error_type = $error_type)
      ORDER BY last_seen DESC
    limit: 50
    example: {}

  - name: list_self_checkout_fault_tickets
    desc: Lists self checkout fault tickets. Returns ticket id, site, device, fault type and status.
    kind: sql
    args:
      site_id: {}
      status: {type: enum, values: [open, investigating, repaired, closed], desc: "Filter by status"}
      raised_from: {col: raised_at, op: ">=", type: date, default: "-30d"}
    sql: |
      SELECT fault_id, site_id, device_id, fault_type, description, status, severity, raised_at, resolved_at
      FROM fault_tickets
      WHERE ($site_id IS NULL OR site_id = $site_id)
        AND ($status IS NULL OR status = $status)
        AND raised_at >= CAST($raised_from AS DATE)
      ORDER BY raised_at DESC
    limit: 50
    example: {}

  - name: list_load_test_history
    desc: Previous load tests and results. Returns test id, interface, dates and outcome.
    kind: sql
    args:
      interface_name: {}
      date_from: {type: date, default: "-90d", desc: "Tests scheduled from this date onward"}
      status: {type: enum, values: [scheduled, in_progress, passed, failed], desc: "Filter by test status"}
    sql: |
      SELECT test_run_id, interface_name, test_type, target_message_rate, peak_achieved,
             avg_latency_ms, max_latency_ms, errors, status, scheduled_at, completed_at, notes
      FROM load_test_runs
      WHERE ($interface_name IS NULL OR interface_name = $interface_name)
        AND scheduled_at >= CAST($date_from AS DATE)
        AND ($status IS NULL OR status = $status)
      ORDER BY scheduled_at DESC
    limit: 50
    example: {}

  - name: list_releases_and_change_requests
    desc: Releases and change records affecting systems in a date range. Returns release, system, date and changes.
    kind: sql
    args:
      system_affected: {}
      date_from: {type: date, default: "-90d", desc: "Releases from this date onward"}
      date_to: {type: date, default: "$as_of", desc: "Releases up to this date"}
    sql: |
      SELECT release_id, release_name, system_affected, release_date, change_description, change_request_ids, deployed_to, status
      FROM releases_and_changes
      WHERE ($system_affected IS NULL OR system_affected = $system_affected)
        AND release_date >= CAST($date_from AS DATE)
        AND release_date <= CAST($date_to AS DATE)
      ORDER BY release_date DESC
    limit: 50
    example: {}

  - name: get_asset_business_criticality
    desc: Asset criticality and business service mapping from the CMDB. Returns asset, service and criticality.
    kind: sql
    args:
      asset_id: {}
      asset_type: {type: str, desc: "Filter by asset type, e.g. database, application"}
      criticality: {type: enum, values: [critical, high, medium, low]}
    sql: |
      SELECT asset_entry_id, asset_id, asset_name, asset_type, business_service, criticality, owner_team, rto_minutes, rpo_minutes
      FROM asset_cmdb
      WHERE ($asset_id IS NULL OR asset_id = $asset_id)
        AND ($asset_type IS NULL OR asset_type = $asset_type)
        AND ($criticality IS NULL OR criticality = $criticality)
      ORDER BY criticality DESC
    limit: 50
    example: {}

  - name: get_critical_system_dependencies
    desc: Dependencies and recovery tiers of warehouse systems. Returns source, target, type and RTO.
    kind: sql
    args:
      source_system: {}
      criticality: {type: enum, values: [critical, high, medium, low]}
    sql: |
      SELECT dependency_id, source_system, target_system, dependency_type, criticality, rto_minutes, rpo_minutes, recovery_tier
      FROM system_dependencies
      WHERE ($source_system IS NULL OR source_system = $source_system)
        AND ($criticality IS NULL OR criticality = $criticality)
      ORDER BY recovery_tier ASC, criticality DESC
    limit: 50
    example: {}

  - name: get_interface_throughput_and_capacity
    desc: Current throughput and rated capacity per interface. Returns interface, capacity, usage and headroom.
    kind: sql
    args:
      interface_name: {}
    sql: |
      SELECT interface_id, interface_name, source_system, target_system, message_type,
             current_throughput_msgs_per_sec, rated_capacity_msgs_per_sec, headroom_pct, status, last_measured
      FROM system_interfaces
      WHERE ($interface_name IS NULL OR interface_name = $interface_name)
      ORDER BY headroom_pct ASC
    limit: 50
    example: {}

  - name: get_peak_interface_load_history
    desc: Message volumes and latency during previous peaks. Returns test runs with throughput and latency.
    kind: sql
    args:
      interface_name: {required: true}
      days: {type: int, default: 180, desc: "Look back this many days"}
    sql: |
      SELECT test_run_id, interface_name, peak_achieved, avg_latency_ms, max_latency_ms, errors, completed_at
      FROM load_test_runs
      WHERE interface_name = $interface_name
        AND status IN ('passed', 'failed')
        AND completed_at >= CAST($as_of AS DATE) - INTERVAL (CAST($days AS INT)) DAY
      ORDER BY completed_at DESC
    limit: 30
    example: {interface_name: "Order API"}

  - name: get_wifi_network_load
    desc: Wireless network load and latency by area and hour. Returns device count, throughput and latency.
    kind: sql
    args:
      site_id: {required: true}
      area: {type: str, desc: "Area within site, e.g. warehouse, checkout"}
      hour_of_day: {type: int, desc: "Hour 0-23 (default all)"}
    sql: |
      SELECT measurement_id, site_id, area, hour_of_day, date_measured, device_count, throughput_mbps, latency_ms, signal_strength_dbm
      FROM wifi_network_load
      WHERE site_id = $site_id
        AND ($area IS NULL OR area = $area)
        AND ($hour_of_day IS NULL OR hour_of_day = $hour_of_day)
      ORDER BY date_measured DESC, hour_of_day ASC
    limit: 50
    example: {site_id: DC1}

  - name: get_wms_system_performance
    desc: WMS response times and incident counts for a site. Returns response times, error rate and incidents.
    kind: sql
    args:
      site_id: {required: true}
      date_from: {type: date, default: "-30d", desc: "Performance data from this date onward"}
    sql: |
      SELECT perf_id, site_id, measurement_date, avg_response_time_ms, p95_response_time_ms, p99_response_time_ms,
             error_count, incident_count, throughput_orders_per_hour, status
      FROM wms_system_performance
      WHERE site_id = $site_id
        AND measurement_date >= CAST($date_from AS DATE)
      ORDER BY measurement_date DESC
    limit: 50
    example: {site_id: DC1}

  - name: get_model_alert_rules
    desc: Configured monitoring alerts and thresholds for models. Returns rule id, model, metric and threshold.
    kind: sql
    args:
      model_name: {}
      rule_type: {type: str, desc: "Type: drift, accuracy, retraining"}
    sql: |
      SELECT rule_id, model_name, rule_type, threshold_value, threshold_metric, enabled, created_at, last_triggered, noise_level
      FROM model_alert_rules
      WHERE ($model_name IS NULL OR model_name = $model_name)
        AND ($rule_type IS NULL OR rule_type = $rule_type)
      ORDER BY model_name, rule_type
    limit: 50
    example: {}

  - name: get_pipeline_step_timings
    desc: Timing of each step in a data pipeline. Returns step name, order and durations.
    kind: sql
    args:
      pipeline_name: {required: true}
    sql: |
      SELECT pipeline_step_id, pipeline_name, step_name, step_order, avg_duration_seconds, max_duration_seconds,
             min_duration_seconds, rows_processed, last_run_date, success_rate_pct
      FROM data_pipeline
      WHERE pipeline_name = $pipeline_name
      ORDER BY step_order ASC
    limit: 50
    example: {pipeline_name: "demand_forecast"}

  - name: get_recovery_time_and_backup_status
    desc: RTO/RPO targets and last backup and restore tests. Returns system, targets and test dates.
    kind: sql
    args:
      system_name: {}
      system_type: {type: str, desc: "Filter by type: database, application, file storage"}
    sql: |
      SELECT system_name, system_type, rto_minutes, rpo_minutes, last_backup_date, last_backup_size_gb,
             last_restore_test_date, last_restore_test_duration_minutes, backup_status, restore_tested
      FROM backup_and_recovery
      WHERE ($system_name IS NULL OR system_name = $system_name)
        AND ($system_type IS NULL OR system_type = $system_type)
      ORDER BY rto_minutes ASC
    limit: 50
    example: {}

  - name: get_vendor_software_inventory
    desc: Applications, versions and vendors in the CMDB. Returns software, vendor, version and support end date.
    kind: sql
    args:
      software_name: {}
      vendor_name: {}
      criticality: {type: enum, values: [critical, high, medium, low]}
    sql: |
      SELECT software_id, software_name, vendor_name, installed_version, system_or_location, installation_date,
             support_end_date, latest_available_version, security_issues, criticality
      FROM vendor_software
      WHERE ($software_name IS NULL OR software_name = $software_name)
        AND ($vendor_name IS NULL OR vendor_name = $vendor_name)
        AND ($criticality IS NULL OR criticality = $criticality)
      ORDER BY criticality DESC, security_issues DESC
    limit: 50
    example: {}
