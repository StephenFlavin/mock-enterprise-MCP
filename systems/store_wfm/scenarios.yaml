- question: "07:68:Q5"
  story: >
    Leeds Shopping Centre (ST150). The stock assistant Liam Pearson (STF-910002) is rostered 08:00-16:00 Monday to
    Friday and never later; the evening closers on Tuesday, Thursday and Friday are Chloe Barnes and Rhys Edwards
    (12:00-20:00). Nobody is rostered at 20:00, when the stockroom removals and after-hours adjustments happen, so
    the staff card entries fall outside everyone's rota hours (internal theft pattern, not a process error).
  checks:
    - tool: get_store_staff_schedules
      args: {site_id: ST150, date_from: "-21d"}
      expect: ["Liam Pearson", "08:00", "16:00", "stock", "Chloe Barnes", "Rhys Edwards", "closing"]
    - tool: get_store_staff_schedules
      args: {site_id: ST150, date_from: "-21d", on_shift_at: "20:00"}
      expect: ["No matching rows"]

- question: "08:71:Q1"
  story: >
    ST214 Glasgow Retail Park, last weeks. Friday deliveries are received single-handed (06:00-12:00) by the agency
    stock assistant Callum Reid, while Tuesday deliveries have two people (Dan Whitfield and Priya Nair), matching the
    Friday receiving shortages. On Mondays Aisha Khan is the only person rostered between 14:00 and 16:00, when the
    Monday shrink adjustments for Dresses are posted.
  checks:
    - tool: get_staff_rota_for_store
      args: {site_id: ST214, date_from: "-28d", weekday: Friday, task_category: receiving}
      expect: ["Callum Reid", "agency", "06:00", "12:00"]
    - tool: get_staff_rota_for_store
      args: {site_id: ST214, date_from: "-28d", weekday: Monday, on_shift_at: "15:00"}
      expect: ["Aisha Khan", "Team Leader", "till"]
    - tool: get_staff_rota_for_store
      args: {site_id: ST214, date_from: "-28d", weekday: Tuesday, task_category: receiving}
      expect: ["Dan Whitfield", "Priya Nair"]

- question: "08:71:Q3"
  story: >
    ST214 next week is a draft rota (ROT-900001). Against a weekly forecast of 15,300 visitors it is over-staffed
    at opening hours and short on Saturday evening (17:00-21:00 only two people against four needed); with two people
    off sick on Saturday it is short from 11:00 and the minimum cover is two. Priya Nair (SFT-900038) is on Saturday
    09:00-17:00 and is available on Sunday. Relabelling and stock counts can slip by two or more days.
  checks:
    - tool: get_staff_availability_for_week
      args: {site_id: ST214}
      expect: ["Priya Nair", "STF-900003", "Appointment Wednesday", "Second job Thursday"]
    - tool: get_labour_standards_for_tasks
      args: {}
      expect: ["relabel", "max_defer_days", "stock", "receiving"]
    - tool: calculate_hourly_labour_requirement
      args: {site_id: ST214, forecast_footfall: 15300, day: Saturday, staff_off: 2}
      expect: ["ROT-900001", "17:00", "short", "minimum_cover", "11:00"]
    - tool: calculate_hourly_labour_requirement
      args: {site_id: ST214, forecast_footfall: 15300, day: Saturday}
      expect: ["09:00", "over", "17:00", "short"]
    - tool: get_staff_rota_for_store
      args: {site_id: ST214, date_from: "+7d", date_to: "+7d", weekday: Saturday}
      expect: ["SFT-900038", "Priya Nair", "draft"]
    - tool: approve_rota_for_store
      args: {rota_id: ROT-900001, approved_by: EMP-00536}
      expect: ["published", "draft", "ROT-900001", "EMP-00536"]
    - tool: update_shift_for_employee
      args: {shift_id: SFT-900038, shift_date: "+13d", start_time: "10:00", end_time: "16:00"}
      expect: ["SFT-900038", "swapped", "10:00", "16:00"]

- question: "08:71:Q5"
  story: >
    Cluster B has 99 stores. Over the last four weeks ST214 Glasgow Retail Park has the highest labour cost % of
    sales (14.5%, rank 1) against a cluster average of 11.6%; ST150 is second at 14.4%. Its closest Scottish
    retail-park comparator ST206 Inverness runs 11.9%, and Scottish cluster B stores average 12.4%, so location
    explains less than a point of the gap.
  checks:
    - tool: get_labour_cost_percentage_by_store
      args: {site_id: ST214, cluster: B}
      expect: ["ST214", "14.5", "rank_highest_cost: 1", "stores_compared: 99", "group_avg_pct: 11.6"]
    - tool: get_labour_cost_percentage_by_store
      args: {cluster: B, region: Scotland}
      expect: ["ST214", "ST206", "ST209", "retail_park", "12.4"]

- question: "08:73:Q1"
  story: >
    ST214 has 7.82 FTE (10 people: one agency stock assistant, no Assistant Manager - the post is vacant - and a
    borrowed cover manager) against about 9.8 to 10.75 FTE and full establishments at its closest peers ST206, ST209
    and ST202 (the same same-format, same-cluster, same-region peers store_ops lists).
  checks:
    - tool: get_staffing_levels_for_store
      args: {site_id: ST214}
      expect: ["7.82", "Assistant Manager", "agency_staff", "Cover Manager"]
    - tool: get_staffing_levels_for_store
      args: {site_id: ST206}
      expect: ["9.78", "ALL ROLES", "Assistant Manager"]
    - tool: get_staffing_levels_for_store
      args: {site_id: ST202}
      expect: ["ALL ROLES"]

- question: "08:73:Q2"
  story: >
    UK North labour cost % over the last four weeks (region average about 10.3%): ST150 Leeds Shopping Centre 14.4%,
    ST143 Preston High Street 2 12.1% and ST142 Preston High Street 11.5% are the outliers; all other stores are
    10.9% or lower, consistent with the BI view of the same three stores.
  checks:
