  story: >
    UK North rotas over the last six weeks. At ST159 Leeds Retail Park the store manager Cameron Hill (EMP-00481)
    is the only person on the tills on Thursday afternoons (12:00-18:00), matching the till 2 void cluster at
    14:00-16:00; every other store has at least two people on the tills then. At ST150 nobody is rostered after 20:00.
  checks:
