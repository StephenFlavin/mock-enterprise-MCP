- question: "07:68:Q5"
  story: Shrink at Leeds store (ST150) over three weeks. The rota shows a concentration of shifts from specific staff on high-shrink days. Seeds test get_store_staff_schedules for ST150 week 2026-09-28 to show which staff are scheduled during shrink patterns.
  checks:
    - tool: get_store_staff_schedules
      args: {site_id: ST150, week_start: "2026-09-28"}
      expect: ["ST150", "EMP-01101", "EMP-01102", "scheduled", "2026-09-28"]

- question: "08:71:Q1"
  story: Store manager at ST214 asks about shrink over the last 12 weeks. The rota data shows baseline staffing with some variation. Seeds provide rotas for ST214 to show staffing patterns.
  checks:
    - tool: get_staff_rota_for_store
      args: {site_id: ST214, week_start: "2026-09-28"}
      expect: ["ST214", "EMP-01001", "till", "shelf"]

- question: "08:71:Q3"
  story: Store manager at ST214 needs to build next week's rota (2026-10-05) based on footfall and deliveries. Seeds provide existing rota as draft. Manager checks availability, labour standards, calculates requirements, then approves and updates a shift.
  checks:
    - tool: get_staff_availability_for_week
      args: {site_id: ST214, week_start: "2026-10-05"}
      expect: ["EMP-01001", "EMP-01002", "available", "ST214"]
    - tool: get_labour_standards_for_tasks
      args: {status: active}
      expect: ["receiving", "shelf", "till", "checkout", "relabel", "cleaning"]
    - tool: calculate_hourly_labour_requirement
      args: {site_id: ST214, week_start: "2026-10-05", forecast_footfall: 2500, receiving_deliveries: 2}
      expect: ["total_hours_required", "ST214", "requirements_breakdown"]
    - tool: approve_rota_for_store
      args: {rota_id: ROT-900002, approved_by: EMP-00100}
      expect: ["published", "ROT-900002"]
    - tool: update_shift_for_employee
      args: {shift_id: SFT-900014, shift_start: "2026-10-05T10:00:00", shift_end: "2026-10-05T18:00:00"}
      expect: ["swapped", "SFT-900014"]

- question: "08:71:Q5"
  story: Store manager at ST214 compares with other stores in cluster. Labour cost data shows ST214 at 12.2% while ST150 (Leeds) at 14.6%. Seeds provide labour costs for multiple weeks to show the pattern.
  checks:
    - tool: get_labour_cost_percentage_by_store
      args: {week_start: "2026-09-28"}
      expect: ["ST214", "ST150", "labour_cost_pct", "12.4", "14.4"]

- question: "08:73:Q1"
  story: Regional manager compares Store 214 (ST214) with peers. Staffing levels show ST214 has adequate staff across roles. Seeds provide staffing levels for ST214.
  checks:
    - tool: get_staffing_levels_for_store
      args: {site_id: ST214}
      expect: ["ST214", "headcount", "active"]

- question: "08:73:Q2"
  story: Regional manager looks at patterns across region. Labour costs vary: ST001 at 9.8-10.0%, ST150 at 14.3-14.6%, ST214 at 12.2-12.4%. Seeds show this variance across different store types.
  checks:
    - tool: get_labour_cost_percentage_by_store
      args: {week_start: "2026-10-05"}
      expect: ["labour_cost_pct", "ST001", "ST214", "ST150"]

- question: "08:79:Q1"
  story: Loss prevention officer looks at staff rotas for the whole region over six months to correlate with shrink signals. Seeds provide rotas for multiple stores (ST214, ST150, ST159) showing shift patterns.
  checks:
    - tool: get_staff_rota_for_stores
      args: {week_start: "2026-09-28"}
      expect: ["store", "employee", "shift", "task", "region"]
