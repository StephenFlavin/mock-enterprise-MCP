id: commodity
name: Commodity & Market Data Feed
instructions: >
  Commodity prices, forecasts, indices and supply outlook. Commodity ids: COTTON, POLYESTER, NYLON, LEATHER,
  SS304, ENERGY_ELEC, PKG_CORR, PKG_FILM. Material ids: RECYCLED_POLY, CHEM_RECYCLED_POLY, RECYCLED_NYLON,
  RECYCLED_COTTON.

tables:
  commodity_prices:
    key: [commodity_id, price_date]
    cols:
      commodity_id: {type: str, desc: "Commodity code, e.g. COTTON, SS304"}
      price_date: {type: date, desc: "Date of price observation"}
      price_gbp_unit: {type: float, desc: "Price in GBP per unit (per tonne, per metre, per kg depending on commodity)"}
      source: {type: str, desc: "Data source, e.g. LME, ICE, market data feed"}
      unit_name: {type: str, desc: "Unit, e.g. tonne, metre, kg"}

  commodity_forecasts:
    key: forecast_id
    cols:
      forecast_id: {type: str, desc: "Forecast, e.g. FOR-000001"}
      commodity_id: {type: str, desc: "Commodity code"}
      forecast_date: {type: date, desc: "Date forecast was published"}
      forecast_price_gbp: {type: float, desc: "Forecast price in GBP"}
      confidence_level: {type: enum, values: [low, medium, high], desc: "Analyst confidence"}
      horizon_months: {type: int, desc: "Forecast horizon in months"}
      analyst_note: {type: str, desc: "Analyst commentary"}

  price_alerts:
    key: alert_id
    cols:
      alert_id: {type: str, desc: "Alert, e.g. ALR-000001"}
      commodity_id: {type: str, desc: "Commodity monitored"}
      threshold_gbp: {type: float, desc: "Alert threshold price"}
      alert_type: {type: enum, values: [above, below], desc: "Alert if price goes above or below"}
      status: {type: enum, values: [active, triggered, archived], desc: "Alert status"}
      created_at: {type: timestamp, desc: "When alert was created"}
      triggered_at: {type: timestamp, desc: "When alert was triggered"}

  seasonality_patterns:
    key: [commodity_id, month]
    cols:
      commodity_id: {type: str, desc: "Commodity"}
      month: {type: int, desc: "Month 1-12"}
      avg_price_index: {type: float, desc: "Average price index (100 = annual average)"}
      typical_high_pct: {type: float, desc: "Typical monthly high as % vs annual average, e.g. 3.0 or -8.0"}
      typical_low_pct: {type: float, desc: "Typical monthly low as % vs annual average, e.g. -3.0 or -14.0"}

  market_news:
    key: news_id
    cols:
      news_id: {type: str, desc: "News item, e.g. NEWS-000001"}
      commodity_id: {type: str, desc: "Commodity affected"}
      published_at: {type: timestamp, desc: "Publication date"}
      title: {type: str, desc: "News headline"}
      summary: {type: text, desc: "News summary and impact"}
      category: {type: enum, values: [supply, demand, weather, trade, geopolitical, other], desc: "Category"}

  market_indices:
    key: [index_id, reading_date]
    cols:
      index_id: {type: str, desc: "Index code, e.g. LMEX, ICE_COTTON"}
      index_name: {type: str, desc: "Index name"}
      category: {type: str, desc: "Index type, e.g. metals, textiles, energy"}
      applies_to: {type: text, desc: "Product or indirect categories this index benchmarks, separated by semicolons, e.g. Cookware; Drinkware"}
      base_date: {type: date, desc: "Base date for index"}
      index_value: {type: float, desc: "Index value"}
      reading_date: {type: date, desc: "Date of index reading (quarterly readings)"}

  category_benchmarks:
    key: product_category
    cols:
      product_category: {type: str, desc: "Product or indirect category, e.g. Cookware, Footwear, Energy"}
      benchmark_price_gbp: {type: float, desc: "Market reference price per unit of a comparable product, GBP"}
      benchmark_basis: {type: text, desc: "What the reference price represents"}
      primary_index_id: {type: str, desc: "Main market index tracking this category, e.g. SS304_IDX"}
      driver_commodity_id: {type: str, desc: "Main raw material commodity driving the category price, if any"}
      benchmark_date: {type: date, desc: "Date of the reference price"}

  components:
    key: component_id
    cols:
      component_id: {type: str, desc: "Component code, e.g. ZIP_METAL"}
      component_name: {type: str, desc: "Component description"}
      unit_desc: {type: str, desc: "Price unit, e.g. per 100 units"}
      supply_status: {type: enum, values: [adequate, tight, critical], desc: "Market supply assessment"}
      supply_note: {type: text, desc: "Why supply is at this level"}

  component_prices:
    key: [component_id, price_date]
    cols:
      component_id: {type: str, desc: "Component, e.g. ZIP_PLASTIC, TRIM_METAL"}
      component_name: {type: str, desc: "Component description"}
      price_date: {type: date, desc: "Date"}
      price_gbp: {type: float, desc: "Unit price in GBP"}
      unit_desc: {type: str, desc: "Price unit, e.g. per 100 units, per kg"}

  material_supply_outlooks:
    key: outlook_id
    cols:
      outlook_id: {type: str, desc: "Outlook, e.g. SUP-000001"}
      material_id: {type: str, desc: "Material code"}
      outlook_date: {type: date, desc: "Date of outlook"}
      supply_level: {type: enum, values: [abundant, adequate, tight, critical], desc: "Supply assessment"}
      reasoning: {type: text, desc: "Why supply is at this level"}

  packaging_indices:
    key: index_date
    cols:
      index_date: {type: date, desc: "Date"}
      corrugated_index: {type: float, desc: "Corrugated packaging price index"}
      film_index: {type: float, desc: "Film packaging price index"}

  commodity_cost_outlooks:
    key: outlook_id
    cols:
      outlook_id: {type: str, desc: "Outlook, e.g. OUT-000001"}
      commodity_id: {type: str, desc: "Commodity"}
      outlook_date: {type: date, desc: "Date the expected cost applies to"}
      expected_cost_gbp: {type: float, desc: "Expected cost in GBP per commodity unit"}
      horizon_months: {type: int, desc: "Months ahead the outlook covers: 1, 3 or 6"}
      reasoning: {type: text, desc: "Rationale"}

  recycled_material_premiums:
    key: [material_id, premium_date]
    cols:
      material_id: {type: str, desc: "Recycled material, e.g. RECYCLED_POLY"}
      virgin_material_id: {type: str, desc: "Virgin equivalent"}
      premium_date: {type: date, desc: "Date"}
      premium_pct: {type: float, desc: "Premium percentage above virgin price"}
      reasoning: {type: str, desc: "Why premium exists"}

  forecast_accuracy:
    key: forecast_id
    cols:
      forecast_id: {type: str, desc: "Forecast being evaluated"}
      commodity_id: {type: str, desc: "Commodity"}
      forecast_date: {type: date, desc: "When forecast was made"}
      horizon_months: {type: int, desc: "Forecast horizon in months: 3 or 6"}
      forecast_price_gbp: {type: float, desc: "Forecast price"}
      actual_date: {type: date, desc: "Actual measurement date"}
      actual_price_gbp: {type: float, desc: "Actual price"}
      accuracy_pct: {type: float, desc: "Accuracy percentage: 100 minus absolute error vs actual in % (100 = perfect forecast)"}

tools:
  - name: get_commodity_price_history
    desc: Weekly prices for one commodity, newest first, with % change versus 13 and 52 weeks earlier. Use for trends and current price.
    kind: sql
    args:
      commodity_id: {required: true, desc: "Commodity code: COTTON, POLYESTER, NYLON, LEATHER, SS304, ENERGY_ELEC, PKG_CORR or PKG_FILM"}
      date_from: {type: date, default: "-400d", desc: "Start of period"}
      date_to: {type: date, desc: "End of period; leave empty for latest"}
    sql: |
      WITH s AS (
        SELECT commodity_id, price_date, price_gbp_unit, unit_name, source,
               round(100 * (price_gbp_unit / lag(price_gbp_unit, 13) OVER w - 1), 1) AS change_13w_pct,
               round(100 * (price_gbp_unit / lag(price_gbp_unit, 52) OVER w - 1), 1) AS change_52w_pct
        FROM commodity_prices
        WHERE commodity_id = upper($commodity_id)
        WINDOW w AS (ORDER BY price_date))
      SELECT commodity_id, price_date, price_gbp_unit, unit_name, change_13w_pct, change_52w_pct, source
      FROM s
      WHERE price_date >= CAST($date_from AS DATE) AND ($date_to IS NULL OR price_date <= CAST($date_to AS DATE))
      ORDER BY price_date DESC
    limit: 100
    example: {commodity_id: COTTON}

  - name: get_commodity_price_forecast
    desc: Latest analyst price forecasts at 3, 6 and 12 months with change versus the current price and confidence. Leave commodity empty for all.
    kind: sql
    args:
      commodity_id: {desc: "Commodity code, e.g. COTTON, SS304, ENERGY_ELEC; leave empty for all commodities"}
      horizon_months: {type: int, desc: "Forecast horizon: 3, 6 or 12; leave empty for all horizons"}
    sql: |
      WITH cur AS (
        SELECT commodity_id, price_gbp_unit AS current_price_gbp, unit_name
        FROM commodity_prices QUALIFY row_number() OVER (PARTITION BY commodity_id ORDER BY price_date DESC) = 1)
      SELECT f.commodity_id, f.horizon_months, f.forecast_date, c.current_price_gbp, f.forecast_price_gbp,
             round(100 * (f.forecast_price_gbp / c.current_price_gbp - 1), 1) AS change_vs_current_pct,
             c.unit_name, f.confidence_level, f.analyst_note
      FROM commodity_forecasts f JOIN cur c USING (commodity_id)
      WHERE ($commodity_id IS NULL OR f.commodity_id = upper($commodity_id))
        AND ($horizon_months IS NULL OR f.horizon_months = $horizon_months)
      QUALIFY row_number() OVER (PARTITION BY f.commodity_id, f.horizon_months ORDER BY f.forecast_date DESC) = 1
      ORDER BY f.commodity_id, f.horizon_months
    limit: 30
    example: {commodity_id: COTTON}

  - name: get_commodity_cost_outlook
    desc: Expected commodity cost at a horizon versus the current price, biggest expected rise first. Use to rank cost risks across commodities.
    kind: sql
    args:
      commodity_id: {desc: "Commodity code, e.g. COTTON, ENERGY_ELEC; leave empty to rank all commodities"}
      horizon_months: {type: int, default: 6, desc: "Months ahead: 1, 3 or 6"}
    sql: |
      WITH cur AS (
        SELECT commodity_id, price_gbp_unit AS current_price_gbp, unit_name
        FROM commodity_prices QUALIFY row_number() OVER (PARTITION BY commodity_id ORDER BY price_date DESC) = 1)
      SELECT o.commodity_id, o.horizon_months, o.outlook_date, c.current_price_gbp, o.expected_cost_gbp,
             round(100 * (o.expected_cost_gbp / c.current_price_gbp - 1), 1) AS expected_change_pct,
             c.unit_name, o.reasoning
      FROM commodity_cost_outlooks o JOIN cur c USING (commodity_id)
      WHERE ($commodity_id IS NULL OR o.commodity_id = upper($commodity_id))
        AND o.horizon_months = $horizon_months
      ORDER BY expected_change_pct DESC
    limit: 10
    example: {}

  - name: get_commodity_seasonality
    desc: Seasonal price pattern by month (100 = annual average) with typical highs and lows and cheapest-month rank. Use to time purchases.
    kind: sql
    args:
      commodity_id: {required: true, desc: "Commodity code, e.g. COTTON, LEATHER"}
    sql: |
      SELECT commodity_id, month, monthname(make_date(2001, month, 1)) AS month_name, avg_price_index,
             typical_high_pct, typical_low_pct,
             rank() OVER (PARTITION BY commodity_id ORDER BY avg_price_index, month) AS cheapest_rank
      FROM seasonality_patterns
      WHERE commodity_id = upper($commodity_id)
      ORDER BY month
    limit: 12
    example: {commodity_id: COTTON}

  - name: search_commodity_news
    desc: Recent commodity news and market drivers, newest first, with category (supply, weather, trade, demand). Filter by commodity or category.
    kind: select
    from: market_news
    filters:
      commodity_id: {desc: "Commodity code, e.g. COTTON; leave empty for all"}
      published_at: {col: published_at, op: ">=", type: date, default: "-30d", desc: "Earliest publication date"}
      category: {}
    columns: [news_id, commodity_id, published_at, title, summary, category]
    order: published_at DESC
    limit: 20
    example: {commodity_id: COTTON}

  - name: search_market_price_indices
    desc: Market price indices that benchmark a product category or index type, with latest value and 3 and 12 month change. Leave empty for all.
    kind: sql
    args:
      category: {type: str, desc: "Product category (e.g. Cookware, Footwear, Energy) or index type (metals, textiles); leave empty for all"}
    sql: |
      WITH s AS (
        SELECT *, lag(index_value, 1) OVER w AS v3m, lag(index_value, 4) OVER w AS v12m
        FROM market_indices WINDOW w AS (PARTITION BY index_id ORDER BY reading_date)),
      l AS (SELECT * FROM s QUALIFY row_number() OVER (PARTITION BY index_id ORDER BY reading_date DESC) = 1)
      SELECT index_id, index_name, category AS index_type, applies_to, index_value, reading_date,
             round(100 * (index_value / v3m - 1), 1) AS change_3m_pct,
             round(100 * (index_value / v12m - 1), 1) AS change_12m_pct
      FROM l
      WHERE $category IS NULL OR lower(category) = lower($category) OR index_name ILIKE '%' || $category || '%'
         OR list_contains(list_transform(string_split(lower(applies_to), ';'), x -> trim(x)), lower($category))
      ORDER BY index_id
    limit: 20
    example: {category: Cookware}

  - name: get_component_price_trend
    desc: Price trend per component (zips, trims, buttons) with latest price, price N weeks ago, % change and supply status. Leave empty for all.
    kind: sql
    args:
      component_id: {desc: "Component code, e.g. ZIP_METAL, TRIM_WOVEN; leave empty for all components"}
      name: {desc: "Words in the component name, e.g. zips or trim", type: str}
      weeks: {type: int, default: 13, desc: "Weeks back to compare against the latest price"}
    sql: |
      WITH mx AS (SELECT component_id, max(price_date) AS d FROM component_prices GROUP BY component_id)
      SELECT c.component_id, c.component_name, c.unit_desc, now_p.price_gbp AS latest_price_gbp,
             then_p.price_gbp AS price_gbp_weeks_ago, $weeks AS weeks_compared,
             round(100 * (now_p.price_gbp / then_p.price_gbp - 1), 1) AS change_pct,
             CASE WHEN now_p.price_gbp / then_p.price_gbp - 1 > 0.03 THEN 'rising'
                  WHEN now_p.price_gbp / then_p.price_gbp - 1 < -0.03 THEN 'falling' ELSE 'stable' END AS trend,
             c.supply_status, c.supply_note
      FROM components c
      JOIN mx ON mx.component_id = c.component_id
      JOIN component_prices now_p ON now_p.component_id = c.component_id AND now_p.price_date = mx.d
      JOIN component_prices then_p ON then_p.component_id = c.component_id
           AND then_p.price_date = mx.d - to_days(7 * $weeks)
      WHERE ($component_id IS NULL OR c.component_id = upper($component_id))
        AND ($name IS NULL OR c.component_name ILIKE '%' || $name || '%')
      ORDER BY change_pct DESC
    limit: 20
    example: {}

  - name: get_material_supply_outlook
    desc: Supply outlook for raw materials. Assesses availability and constraints.
    kind: select
    from: material_supply_outlooks
    filters:
      material_id: {required: true}
    columns: [outlook_id, material_id, outlook_date, supply_level, reasoning]
    order: outlook_date
    limit: 10
    example: {material_id: COTTON}

  - name: get_packaging_price_index_history
    desc: Packaging price index history for corrugated and film. Use for packaging cost decisions.
    kind: select
    from: packaging_indices
    filters:
      index_date: {col: index_date, op: ">=", type: date, default: "-360d"}
    columns: [index_date, corrugated_index, film_index]
    order: index_date
    limit: 100
    example: {}

  - name: get_price_benchmark_for_category
    desc: Market reference price per unit for a category with its index, 3 and 12 month market change and direction. Leave empty for all categories.
    kind: sql
    args:
      cat_name: {type: str, desc: "Category, e.g. Cookware, Footwear, Energy; leave empty for all categories"}
    sql: |
      WITH s AS (
        SELECT *, lag(index_value, 1) OVER w AS v3m, lag(index_value, 4) OVER w AS v12m
        FROM market_indices WINDOW w AS (PARTITION BY index_id ORDER BY reading_date)),
      l AS (SELECT * FROM s QUALIFY row_number() OVER (PARTITION BY index_id ORDER BY reading_date DESC) = 1)
      SELECT b.product_category AS category, b.benchmark_price_gbp, b.benchmark_basis, b.primary_index_id AS index_id, l.index_name,
             round(100 * (l.index_value / l.v3m - 1), 1) AS change_3m_pct,
             round(100 * (l.index_value / l.v12m - 1), 1) AS change_12m_pct,
             CASE WHEN l.index_value / l.v12m - 1 < -0.01 THEN 'falling'
                  WHEN l.index_value / l.v12m - 1 > 0.01 THEN 'rising' ELSE 'flat' END AS market_direction,
             b.driver_commodity_id, b.benchmark_date
      FROM category_benchmarks b JOIN l ON l.index_id = b.primary_index_id
      WHERE $cat_name IS NULL OR lower(b.product_category) = lower($cat_name)
         OR (b.product_category ILIKE '%' || $cat_name || '%'
             AND NOT EXISTS (SELECT 1 FROM category_benchmarks x WHERE lower(x.product_category) = lower($cat_name)))
      ORDER BY (lower(b.product_category) = lower($cat_name)) DESC NULLS LAST, change_12m_pct
    limit: 40
    example: {cat_name: Cookware}

  - name: get_recycled_material_price_premium
    desc: Price premium of recycled vs virgin material. Shows cost of using sustainable materials.
    kind: select
    from: recycled_material_premiums
    filters:
      material_id: {required: true}
      premium_date: {col: premium_date, op: ">=", type: date, default: "-30d"}
    columns: [material_id, virgin_material_id, premium_date, premium_pct, reasoning]
    order: premium_date
    limit: 10
    example: {material_id: RECYCLED_POLY}

  - name: get_feedstock_supply_outlook
    desc: Supply outlook for feedstock materials. Assesses availability, bottlenecks and scalability.
    kind: select
    from: material_supply_outlooks
    filters:
      material_id: {required: true}
    columns: [outlook_id, material_id, outlook_date, supply_level, reasoning]
    order: outlook_date
    limit: 10
    example: {material_id: RECYCLED_POLY}

  - name: get_forecast_accuracy_history_for_commodity
    desc: Past analyst forecasts scored against actual prices, with average accuracy and bias. Shows how reliable forecasts have been.
    kind: sql
    args:
      commodity_id: {required: true, desc: "Commodity code, e.g. COTTON, LEATHER"}
      horizon_months: {type: int, desc: "Forecast horizon to score: 3 or 6; leave empty for both"}
    sql: |
      SELECT forecast_id, commodity_id, forecast_date, horizon_months, forecast_price_gbp, actual_date, actual_price_gbp,
             accuracy_pct,
             round(avg(accuracy_pct) OVER (), 1) AS avg_accuracy_pct,
             round(100 * avg(forecast_price_gbp / actual_price_gbp - 1) OVER (), 1) AS avg_bias_pct,
             count(*) OVER () AS forecasts_scored
      FROM forecast_accuracy
      WHERE commodity_id = upper($commodity_id) AND ($horizon_months IS NULL OR horizon_months = $horizon_months)
      ORDER BY forecast_date DESC, horizon_months
    limit: 20
    example: {commodity_id: COTTON}

  - name: list_commodity_alert_thresholds
    desc: List configured price alert thresholds for commodities. Shows active and triggered alerts.
    kind: select
    from: price_alerts
    filters:
      commodity_id: {}
      status: {}
    columns: [alert_id, commodity_id, threshold_gbp, alert_type, status, created_at, triggered_at]
    order: created_at
    limit: 50
    example: {}

  - name: create_commodity_price_alert
    desc: Creates a price alert at a chosen level for a commodity. Triggers when price breaches threshold.
    kind: insert
    table: price_alerts
    id_prefix: ALR-
    defaults: {status: active}
    args:
      commodity_id: {required: true}
      threshold_gbp: {required: true, type: float, desc: "Alert threshold price in GBP"}
      alert_type: {required: true, type: enum, values: [above, below], desc: "Alert if price goes above or below"}
    example: {commodity_id: LEATHER, threshold_gbp: 45.50, alert_type: above}

  - name: update_commodity_alert_threshold
    desc: Changes the threshold on an existing commodity alert. Updates active alert parameters.
    kind: update
    table: price_alerts
    args:
      threshold_gbp: {type: float, desc: "New threshold price"}
      status: {type: enum, values: [active, triggered, archived], desc: "New status"}
    example: {alert_id: ALR-900001, threshold_gbp: 42.00, status: active}

  - name: calculate_fixed_vs_floating_cost_scenarios
    desc: Compare locking a fixed price with floating at today's price or on the analyst forecast path, in total cost for the period.
    kind: py
    fn: calc_fixed_vs_floating
    args:
      commodity_id: {required: true, desc: "Commodity code, e.g. ENERGY_ELEC, COTTON"}
      volume_units: {type: float, default: 1000, desc: "Volume to commit in commodity units (MWh, kg, tonne or 1000 sqm)"}
      period_months: {type: int, default: 12, desc: "Months to cover: 1 to 12"}
      current_price_gbp: {type: float, desc: "Current market price; leave empty to use the latest price"}
      fixed_price_gbp: {type: float, desc: "Fixed price offered; leave empty to price a lock-in at today's price"}
    example: {commodity_id: ENERGY_ELEC, volume_units: 1000, period_months: 12}
