- question: 04:37:Q5
  story: Electricity 165 per MWh now, forecast 170/181/185 at 3/6/12 months; corrugated 26 to 29 per 1000 sqm and film 1,800 to 2,040 per tonne
    at 12 months. Fixing electricity at today's price for 1,000 MWh over 12 months saves 12,250 versus the forecast path and 20,000 versus the
    end-of-period forecast.
  checks:
  - tool: get_commodity_price_forecast
    args:
      commodity_id: ENERGY_ELEC
    expect:
    - '185'
    - '181'
  - tool: get_commodity_price_forecast
    args:
      commodity_id: PKG_CORR
    expect:
    - '29'
  - tool: get_commodity_price_forecast
    args:
      commodity_id: PKG_FILM
    expect:
    - '2040'
  - tool: calculate_fixed_vs_floating_cost_scenarios
    args:
      commodity_id: ENERGY_ELEC
      volume_units: 1000
      period_months: 12
    expect:
    - Fixed price
    - '12250'
    - '20000'
