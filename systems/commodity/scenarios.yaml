# Scenarios mapping each question in the brief to seed data and tool checks
- question: "03:24:Q3"
  story: >
    Zips and trims shortage alert. Plastic zips are showing upward price trend, indicating market tightness.
  checks:
    - tool: get_component_price_trend
      args: {component_id: ZIP_PLASTIC}
      expect: ["ZIP_PLASTIC"]

