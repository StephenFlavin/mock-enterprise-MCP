# Scenarios mapping each question in the brief to seed data and tool checks
- question: 03:24:Q3
  story: Metal zips (ZIP_METAL) are up 17.9% in 13 weeks with a critical supply status (brass strip shortage, 14+ week lead times); plastic zips
    up 9.6% and tight; woven and elastic trims, buttons stable.
  checks:
  - tool: get_component_price_trend
    args: {}
    expect:
    - ZIP_METAL
    - '17.9'
    - critical
    - ZIP_PLASTIC
    - '9.6'
  - tool: get_component_price_trend
    args:
      name: trim
    expect:
    - TRIM_WOVEN
    - stable
- question: 03:27:Q3
  story: 'Cost outlook ranks six-month cost risks: electricity +9.7%, film +8.9%, corrugated +7.7%, nylon, polyester, stainless steel, leather,
    cotton +4.6%.'
  checks:
  - tool: get_commodity_cost_outlook
    args: {}
    expect:
    - ENERGY_ELEC
    - '9.7'
    - PKG_FILM
    - '8.9'
    - COTTON
    - '4.6'
  - tool: get_commodity_cost_outlook
    args:
      commodity_id: SS304
      horizon_months: 3
    expect:
    - SS304
    - '2950'
- question: 04:32:Q1
  story: '304 stainless steel is 2,880 GBP per tonne, up 4.7% in 13 weeks and 12.9% in 52 weeks: the material cost basis for the bottle quotes.'
  checks:
  - tool: get_commodity_price_history
    args:
      commodity_id: SS304
      date_from: -180d
    expect:
    - SS304
    - '2880'
    - '4.7'
    - '12.9'
- question: 04:32:Q2
  story: SS304 +12.9% over 12 months (2,550 to 2,880 per tonne); analysts forecast 2,950 / 3,050 / 3,200 at 3/6/12 months (+11.1% at 12 months),
    so the trend is expected to continue.
  checks:
  - tool: get_commodity_price_history
    args:
      commodity_id: SS304
    expect:
    - '12.9'
    - '2880'
  - tool: get_commodity_price_forecast
    args:
      commodity_id: SS304
    expect:
    - '3200'
    - '11.1'
    - '3050'
- question: 04:32:Q7
  story: Cookware market benchmark is 17.69 GBP per unit, tracked by the Stainless Steel 304 Index (+12.9% over 12 months, rising), so a cookware
    supplier will argue material cost increases.
  checks:
  - tool: get_price_benchmark_for_category
    args:
      cat_name: Cookware
    expect:
    - '17.69'
    - SS304_IDX
    - '12.9'
    - rising
  - tool: search_market_price_indices
    args:
      category: Cookware
    expect:
    - SS304_IDX
    - LMEX
- question: 04:36:Q2
  story: 'Market benchmarks that have fallen over 12 months give renegotiation leverage: Footwear -4.2%, consumer-electronics categories (Small
    Appliances, Smart Home, Audio, Lighting) -3.7%, Bags -2.6%, Storage -2.1%; apparel, cotton, cookware and energy are rising.'
  checks:
  - tool: get_price_benchmark_for_category
    args: {}
    expect:
    - Footwear
    - '-4.2'
    - Small Appliances
    - '-3.7'
    - falling
