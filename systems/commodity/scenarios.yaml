# Scenarios mapping each question in the brief to seed data and tool checks
- question: "03:24:Q3"
  story: >
    Zips and trims shortage alert. Plastic zips (ZIP_PLASTIC) are showing upward price trend from £2.45 to £2.58 per 100 units
    over recent weeks, indicating market tightness. Woven trims (TRIM_WOVEN) are equally strained at £0.86 per metre.
  checks:
    - tool: get_component_price_trend
      args: {component_id: ZIP_PLASTIC}
      expect: ["ZIP_PLASTIC", "2.58", "per 100 units"]
    - tool: get_component_price_trend
      args: {component_id: TRIM_WOVEN}
      expect: ["TRIM_WOVEN", "0.86", "per metre"]

- question: "03:27:Q3"
  story: >
    S&OP risk assessment shows cotton cost outlook at £1.96 tonne (tight supply from monsoon impact), SS304 at £2880 tonne
    (energy cost push), and leather at £45.00 kg (tannery disruptions). These are the biggest cost risks.
  checks:
    - tool: get_commodity_cost_outlook
      args: {commodity_id: COTTON}
      expect: ["COTTON", "1.96", "Forecast based on current market trends"]
    - tool: get_commodity_cost_outlook
      args: {commodity_id: SS304}
      expect: ["SS304", "2880"]
    - tool: get_commodity_cost_outlook
      args: {commodity_id: LEATHER}
      expect: ["LEATHER", "45.00"]

- question: "04:32:Q1"
  story: >
    Category buyer comparing two bottle supplier quotes. Cotton prices show upward trend from £1.87 to £1.96 per tonne
    over the period, supporting material cost increases. Historical data available for cost breakdown analysis.
  checks:
    - tool: get_commodity_price_history
      args: {commodity_id: COTTON}
      expect: ["COTTON", "1.87", "1.96"]

- question: "04:32:Q2"
  story: >
    304 stainless steel price trend over 12 months: baseline £2750 in July rising to £2880 in October, up 4.7%.
    Forecast shows continued pressure to £2950-3050 tonne over 6-12 months. Cost exposure clear.
  checks:
    - tool: get_commodity_price_history
      args: {commodity_id: SS304}
      expect: ["SS304", "2750", "2880"]
    - tool: get_commodity_price_forecast
      args: {commodity_id: SS304}
      expect: ["SS304", "2950"]

- question: "04:32:Q7"
  story: >
    Negotiation brief for cookware supplier includes stainless steel price benchmark (index value 210) from market indices.
    This is the reference point for pricing discussions.
  checks:
    - tool: search_market_price_indices
      args: {category: "metals"}
      expect: ["metals", "250"]
    - tool: get_price_benchmark_for_category
      args: {category: "metals"}
      expect: ["SS304_IDX"]

- question: "04:36:Q2"
  story: >
    Procurement analyst analyzing savings opportunities. Market benchmarks show polyester at index 240,
    leather category at 100, cotton at 250, indicating pricing spreads.
  checks:
    - tool: search_market_price_indices
      args: {category: "textiles"}
      expect: ["textiles", "250"]
    - tool: get_price_benchmark_for_category
      args: {category: "textiles"}
      expect: ["Polyester Price Index"]

- question: "04:36:Q4"
  story: >
    Top categories by spend: metals (SS304 at £2880), textiles (cotton at £1.96, polyester at £0.96).
    Market indices show these categories are near or above benchmark levels.
  checks:
    - tool: search_market_price_indices
      args: {category: "metals"}
      expect: ["metals", "index_value"]
    - tool: search_market_price_indices
      args: {category: "textiles"}
      expect: ["textiles"]

- question: "04:36:Q6"
  story: >
    Commodity price history for cotton (£1.87 to £1.96, +4.8%), polyester (£0.92 to £0.96, +4.3%), nylon (£1.15 to £1.22, +6.1%).
    These trends should inform price increase expectations for supplier negotiations.
  checks:
    - tool: get_commodity_price_history
      args: {commodity_id: COTTON}
      expect: ["1.87", "1.96"]
    - tool: get_commodity_price_history
      args: {commodity_id: POLYESTER}
      expect: ["0.92", "0.96"]
    - tool: get_commodity_price_history
      args: {commodity_id: NYLON}
      expect: ["1.15", "1.22"]

- question: "04:37:Q5"
  story: >
    Energy (ENERGY_ELEC) and packaging (PKG_CORR, PKG_FILM) cost forecasts for next year. Energy forecast shows £0.168 kWh
    over 3 months, £0.172 over 6 months. Packaging corrugated index at 145.5, film at 98.9. Fixed vs floating scenarios
    can be calculated for a 12-month energy contract at current price £0.165.
  checks:
    - tool: get_commodity_price_forecast
      args: {commodity_id: ENERGY_ELEC, horizon_months: 6}
      expect: ["ENERGY_ELEC", "0.172"]
    - tool: get_packaging_price_index_history
      args: {}
      expect: ["145.5", "98.9"]
    - tool: calculate_fixed_vs_floating_cost_scenarios
      args: {commodity_id: ENERGY_ELEC, volume_units: 1000000, current_price_gbp: 0.165, fixed_price_gbp: 0.160, period_months: 12}
      expect: ["Fixed price", "Floating", "Average forecast"]

- question: "04:39:Q1"
  story: >
    Raw materials buyer summary for cotton (£1.87→£1.96, forecast £2.05 in 6 months), polyester (£0.92→£0.96, forecast £1.02),
    nylon (£1.15→£1.22, forecast £1.30), leather (£43→£45, forecast £47.50). Recent news includes cotton crop reduction in India
    (+3% impact). Forecast accuracy averages 92% across commodities.
  checks:
    - tool: get_commodity_price_history
      args: {commodity_id: COTTON}
      expect: ["COTTON", "1.96"]
    - tool: get_commodity_price_forecast
      args: {commodity_id: COTTON, horizon_months: 6}
      expect: ["COTTON", "2.05"]
    - tool: search_commodity_news
      args: {commodity_id: COTTON}
      expect: ["cotton crop", "India", "3%"]
    - tool: get_forecast_accuracy_history_for_commodity
      args: {commodity_id: COTTON}
      expect: ["COTTON", "96.9"]

- question: "04:39:Q2"
  story: >
    Cotton seasonality shows October baseline at month 10 (index 92, high 99, low 88), suggesting we're in a seasonal trough.
    Forecast for 6 months ahead shows £2.05 tonne. Hedging analysis: current price £1.96, fixed contract offered at £1.88,
    floating average forecast £2.05. Fixed price locks in £0.09/tonne savings.
  checks:
    - tool: get_commodity_seasonality
      args: {commodity_id: COTTON}
      expect: ["COTTON", "92", "99", "88"]
    - tool: get_commodity_price_forecast
      args: {commodity_id: COTTON, horizon_months: 6}
      expect: ["2.05"]
    - tool: calculate_fixed_vs_floating_cost_scenarios
      args: {commodity_id: COTTON, volume_units: 4200, current_price_gbp: 1.96, fixed_price_gbp: 1.88, period_months: 6}
      expect: ["Fixed price", "1.88"]

- question: "04:39:Q3"
  story: >
    Cotton price history shows rise from £1.87 to £1.96 (+4.8%), while fabric cost rose 9%. Implies 188% pass-through of cotton
    costs to fabric. News shows cotton crop disruption in India. Mill margin analysis needed to explain the gap.
  checks:
    - tool: get_commodity_price_history
      args: {commodity_id: COTTON}
      expect: ["1.87", "1.96"]
    - tool: search_commodity_news
      args: {commodity_id: COTTON, category: supply}
      expect: ["Cotton crop reduced", "India"]

- question: "04:39:Q5"
  story: >
    Cotton supply analysis: monsoon rains reduced yields in India (key supplier). Geopolitical tensions may also disrupt supply.
    Forecast shows price pressure to £2.05 in 6 months. Supply outlook shows "tight" status for cotton.
  checks:
    - tool: search_commodity_news
      args: {commodity_id: COTTON}
      expect: ["India", "monsoon", "supply"]
    - tool: get_commodity_price_forecast
      args: {commodity_id: COTTON, horizon_months: 6}
      expect: ["2.05"]
    - tool: get_material_supply_outlook
      args: {material_id: COTTON}
      expect: ["COTTON", "tight"]

- question: "04:39:Q6"
  story: >
    Recycled polyester can replace virgin polyester at premium of 18% (RECYCLED_POLY at 2026-10-05).
    Virgin polyester at £0.96/kg, recycled at ~£1.13/kg. Supply outlook for recycled shows "critical" shortage,
    limiting scalability to 2M metres per year.
  checks:
    - tool: get_recycled_material_price_premium
      args: {material_id: RECYCLED_POLY}
      expect: ["RECYCLED_POLY", "18.0"]
    - tool: get_feedstock_supply_outlook
      args: {material_id: RECYCLED_POLY}
      expect: ["RECYCLED_POLY", "critical"]

- question: "04:39:Q7"
  story: >
    Leather seasonality for buying decision: October (month 10) shows index 98 (below average), high 105, low 93.
    Suggests October is favorable for buying ahead. Price alert set at £46.50 (above current £45) triggers when price rises,
    warning to lock in purchases.
  checks:
    - tool: get_commodity_seasonality
      args: {commodity_id: LEATHER}
      expect: ["LEATHER", "98", "105", "93"]
    - tool: create_commodity_price_alert
      args: {commodity_id: LEATHER, threshold_gbp: 46.50, alert_type: above}
      expect: ["ALR-", "LEATHER", "46.50", "above"]

- question: "04:39:Q8"
  story: >
    Commodity brief shows price history for cotton (£1.96), news on Indian crop disruption (+3% impact), active alerts
    including SS304 at £3000 threshold (currently triggered at £2880). Alert threshold updated to £3100 to avoid false positives.
  checks:
    - tool: get_commodity_price_history
      args: {commodity_id: COTTON}
      expect: ["1.96"]
    - tool: search_commodity_news
      args: {commodity_id: COTTON}
      expect: ["India", "crop", "3%"]
    - tool: list_commodity_alert_thresholds
      args: {}
      expect: ["ALR-900003", "SS304", "3000"]
    - tool: update_commodity_alert_threshold
      args: {alert_id: ALR-900003, threshold_gbp: 3100}
      expect: ["ALR-900003", "3100"]

- question: "04:40:Q4"
  story: >
    Packaging price trends: corrugated index at 145.5 (Sep 142.0, +2.5%), film index at 98.9 (Sep 98.2, +0.7%).
    Forecast shows continued rises to £0.027-0.028 for corrugated, £0.0095-0.010 for film. Renegotiation recommended now.
  checks:
    - tool: get_packaging_price_index_history
      args: {}
      expect: ["145.5", "98.9"]
    - tool: get_commodity_price_forecast
      args: {commodity_id: PKG_CORR, horizon_months: 6}
      expect: ["PKG_CORR", "0.028"]

- question: "06:60:Q4"
  story: >
    Recycled material scalability: feedstock supply outlook for RECYCLED_POLY shows "critical" status.
    At 2M metres per year scale, supply bottleneck would be severe. Cost at volume calculation needs supply confirmation first.
  checks:
    - tool: get_feedstock_supply_outlook
      args: {material_id: RECYCLED_POLY}
      expect: ["RECYCLED_POLY", "critical", "bottleneck"]
