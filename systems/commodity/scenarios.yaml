  story: Top spend categories Footwear, Shirts, Jewellery, Outerwear, Trousers each map to market indices and a reference unit price (17.82, 31.27,
    26.50, 17.29, 22.12) that matches the spend system's benchmark; Footwear index -4.2%, apparel +2.4%, jewellery +5.1%.
  checks:
  - tool: get_price_benchmark_for_category
    args:
      cat_name: Footwear
    expect:
    - '17.82'
    - FOOTWEAR_PPI
    - '-4.2'
  - tool: get_price_benchmark_for_category
    args:
      cat_name: Jewellery
    expect:
    - '26.5'
    - JEWELLERY_PPI
    - '5.1'
  - tool: search_market_price_indices
    args:
      category: Shirts
    expect:
    - APPAREL_PPI
    - ICE_COTTON
  - tool: search_market_price_indices
    args:
      category: Trousers
    expect:
    - APPAREL_PPI
    - POLY_IDX
