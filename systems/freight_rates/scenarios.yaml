- question: "02:12:Q1"
  story: "Freight forwarder wants to see spot and contract container rates from Ho Chi Minh to Felixstowe, Rotterdam and Los Angeles over the last 12 weeks. Seed data shows Ho Chi Minh to Felixstowe spot rates ranging from 1790-1850 GBP with contracts at 1650 GBP."
  checks:
    - tool: get_spot_container_rates_by_lane
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["1850", "1820", "26"]
    - tool: get_spot_container_rates_by_lane
      args: {origin_port: VNHCM, destination_port: NLRTM}
      expect: ["1920", "per 40ft container"]
    - tool: get_contract_container_rates_by_lane
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["1650", "CAR-007", "large"]
    - tool: get_rate_trend_by_lane
      args: {origin_port: VNHCM, destination_port: GBFXT, mode: sea}
      expect: ["1850", "1650"]

- question: "02:12:Q3"
  story: "Freight forwarder asks if rates will spike before Lunar New Year. Seed data shows rate indices (SCFI 850.2, WCI 1215.5) with year-on-year changes of +12.5% and +15.2% respectively, indicating seasonal upward pressure."
  checks:
    - tool: get_rate_index_history
      args: {index_name: SCFI, weeks_back: 12}
      expect: ["SCFI", "850.2", "1.8"]
    - tool: get_rate_index_history
      args: {index_name: WCI}
      expect: ["WCI", "1215.5", "15.2"]
    - tool: get_contract_vs_spot_mix
      args: {period: 2026-Q4}
      expect: ["2026-Q4", "62.5"]

- question: "02:12:Q5"
  story: "Freight forwarder asks about surcharges for the next couple of months. Seed data shows CAR-007 fuel surcharge of 125 GBP and congestion surcharge of 200 GBP on VNHCM-GBFXT lane effective until end of year, impacting bookings."
  checks:
    - tool: calculate_surcharge_impact_on_bookings
      args: {booking_volume_units: 500}
      expect: ["fuel", "125", "62500"]
    - tool: calculate_surcharge_impact_on_bookings
      args: {lane_id: VNHCM-GBFXT, booking_volume_units: 300}
      expect: ["200", "congestion", "60000"]

- question: "02:12:Q6"
  story: "Freight forwarder asks about routing via alternate ports (Valencia or Piraeus plus rail). Seed data shows alternative to Rotterdam via sea-rail option totalling 2260 GBP with 35-day transit."
  checks:
    - tool: get_alternate_port_options_and_rates
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["ALT", "NLRTM", "2200", "2260"]
    - tool: get_ocean_and_rail_rate_quote
      args: {origin_port: VNHCM}
      expect: ["sea", "rail", "2200"]

- question: "02:13:Q3"
  story: "Air freight coordinator asks for air rates from Dhaka and Ho Chi Minh to London. Seed data shows DAC-LHR rates at 2.85 GBP/kg (5-day) and VNHCM-LHR at 3.25 GBP/kg (6-day)."
  checks:
    - tool: get_air_freight_rates_by_origin
      args: {origin_airport: DAC}
      expect: ["DAC", "LHR", "2.85"]
    - tool: get_air_freight_rates_by_origin
      args: {origin_airport: VNHCM}
      expect: ["VNHCM", "LHR", "3.25"]
    - tool: get_air_rate_history
      args: {origin_airport: DAC, destination_airport: LHR}
      expect: ["DAC", "LHR", "2.85"]

- question: "02:13:Q5"
  story: "Air freight coordinator needs to compare straight air from Dhaka versus sea-air via Dubai for 500 units. Seed data provides air quote DAC-LHR at 2.85 GBP/kg and sea-air options via Dubai."
  checks:
    - tool: get_air_freight_quote
      args: {origin_airport: DAC, destination_airport: LHR, weight_kg: 5000}
      expect: ["DAC", "LHR", "14250"]
    - tool: get_sea_air_routing_quote
      args: {origin_port: VNHCM, transhipment_port: AEDXB, destination_airport: LHR, weight_kg: 5000}
      expect: ["sea-air", "DXB", "LHR"]

- question: "02:20:Q1"
  story: "Carrier relationship manager compares 12 months of invoices against contracted rates. Seed data shows CAR-007 contract rate of 1650 GBP for VNHCM-GBFXT vs spot rates of 1790-1850 GBP, showing carrier performance vs contract."
  checks:
    - tool: get_carrier_contract_rates
      args: {carrier_id: CAR-007}
      expect: ["CAR-007", "1650", "sea"]
    - tool: compare_rates_to_benchmark
      args: {lane_id: VNHCM-GBFXT, mode: sea}
      expect: ["1650", "competitive", "VNHCM-GBFXT"]

- question: "02:20:Q2"
  story: "Carrier relationship manager asks if parcel rates are competitive. Seed data provides market benchmarks for comparable volumes and lanes, enabling rate comparison."
  checks:
    - tool: get_parcel_rates_by_service
      args: {}
      expect: ["parcel"]
    - tool: get_market_benchmark_rates
      args: {mode: sea, volume_band: large}
      expect: ["1650", "sea", "large"]

- question: "02:20:Q4"
  story: "Carrier relationship manager forecasts rate increases next year. Seed data shows annual carrier spend forecast by carrier and mode, with forecast rates showing upward trend."
  checks:
    - tool: get_annual_carrier_spend_forecast
      args: {mode: sea}
      expect: ["forecast", "gbp"]
    - tool: get_freight_rate_forecast
      args: {mode: sea}
      expect: ["rising", "stable"]

- question: "04:33:Q3"
  story: "Sourcing manager asks about Vietnam vs Bangladesh for denim sourcing. Seed data provides ocean freight rates for relevant lanes, supporting landed cost comparison."
  checks:
    - tool: get_ocean_freight_rates_for_lane
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["VNHCM", "GBFXT", "sea"]
    - tool: get_transit_time_by_lane
      args: {lane_id: VNHCM-GBFXT, mode: sea}
      expect: ["VNHCM", "GBFXT", "26"]

- question: "04:34:Q3"
  story: "Costing analyst builds landed cost model for wool coat Vietnam vs Portugal. Seed data shows freight rates for multiple scenarios supporting cost model sensitivity analysis."
  checks:
    - tool: get_freight_rate_for_lane
      args: {lane_id: VNHCM-GBFXT, mode: sea}
      expect: ["1850", "1650", "sea"]
    - tool: get_freight_rates_for_lane
      args: {}
      expect: ["rate", "lane"]

- question: "05:45:Q2"
  story: "Sustainability manager compares air vs sea for emissions reduction. Seed data shows CO2e emissions per kg: sea 0.125 kg CO2e/kg vs air 1.0 kg CO2e/kg, supporting 30% air-to-sea shift analysis."
  checks:
    - tool: compare_air_sea_freight_cost_and_emissions
      args: {shipment_weight_kg: 5000}
      expect: ["Air", "Sea", "emissions"]
    - tool: compare_air_sea_freight_cost_and_emissions
      args: {shipment_weight_kg: 5000}
      expect: ["gbp", "co2e"]

- question: "05:50:Q2"
  story: "Supply chain risk analyst models Vietnam port closure impact. Seed data shows alternate port options (NLRTM, DEHAM) with rail routing costs, and air freight rates (3.25 GBP/kg VNHCM-LHR) for emergency rerouting."
  checks:
    - tool: get_alternate_port_options_and_rates
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["ALT", "active"]
    - tool: get_air_freight_rates
      args: {}
      expect: ["air", "rate"]

- question: "06:55:Q4"
  story: "Packaging designer calculates freight saving from 10% carton reduction. Seed data enables calculation: 15,000 kg current vs 13,500 kg optimized across 100 annual containers at 0.15 GBP/kg = 225,000 GBP annual saving."
  checks:
    - tool: calculate_freight_saving_per_container
      args: {current_weight_kg: 15000, new_weight_kg: 13500, containers_annual: 100, current_rate_gbp_per_kg: 0.15}
      expect: ["225000", "saving"]

- question: "06:58:Q2"
  story: "Costing analyst asks current freight costs for scenario analysis. Seed data provides rates for Vietnam/Bangladesh/Turkey lanes supporting sensitivity analysis."
  checks:
    - tool: get_freight_rate_for_lane
      args: {lane_id: VNHCM-GBFXT, mode: sea}
      expect: ["sea", "1850"]

- question: "07:62:Q2"
  story: "FP&A analyst builds three-scenario forecast (base, downside with freight +20%, upside flat). Seed data provides rate forecasts by lane with confidence levels supporting scenario modeling."
  checks:
    - tool: get_freight_rate_forecast
      args: {mode: sea}
      expect: ["forecast", "confidence", "trend"]
