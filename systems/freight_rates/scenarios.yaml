- question: "02:12:Q1"
  story: "Freight forwarder wants to see spot and contract container rates from Ho Chi Minh to Felixstowe, Rotterdam and Los Angeles over the last 12 weeks."
  checks:
    - tool: get_spot_container_rates_by_lane
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["VNHCM-GBFXT", "40ft container", "rate"]
    - tool: get_contract_container_rates_by_lane
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["VNHCM-GBFXT", "large"]

- question: "02:12:Q3"
  story: "Freight forwarder asks if rates will spike before Lunar New Year."
  checks:
    - tool: get_rate_index_history
      args: {index_name: SCFI}
      expect: ["SCFI", "index"]
    - tool: get_contract_vs_spot_mix
      args: {period: 2026-Q4}
      expect: ["2026-Q4"]

- question: "02:12:Q5"
  story: "Freight forwarder asks about surcharges for the next couple of months."
  checks:
    - tool: calculate_surcharge_impact_on_bookings
      args: {booking_volume_units: 500}
      expect: ["impact", "gbp"]

- question: "02:12:Q6"
  story: "Freight forwarder asks about routing via alternate ports."
  checks:
    - tool: get_alternate_port_options_and_rates
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["routing", "cost"]

- question: "02:13:Q3"
  story: "Air freight coordinator asks for air rates from Dhaka and Ho Chi Minh to London."
  checks:
    - tool: get_air_freight_rates_by_origin
      args: {origin_airport: DAC}
      expect: ["airport", "rate"]
    - tool: get_air_rate_history
      args: {origin_airport: DAC}
      expect: ["quote", "airport"]

- question: "02:13:Q5"
  story: "Air freight coordinator needs to compare straight air from Dhaka versus sea-air via Dubai for 500 units."
  checks:
    - tool: get_air_freight_quote
      args: {origin_airport: DAC, destination_airport: LHR, weight_kg: 5000}
      expect: ["DAC", "LHR", "quote"]

- question: "02:20:Q1"
  story: "Carrier relationship manager compares invoices against contracted rates."
  checks:
    - tool: get_carrier_contract_rates
      args: {carrier_id: CAR-007}
      expect: ["CAR-007", "sea"]

- question: "02:20:Q2"
  story: "Carrier relationship manager asks if parcel rates are competitive."
  checks:
    - tool: get_market_benchmark_rates
      args: {mode: sea}
      expect: ["benchmark", "rate"]

- question: "02:20:Q4"
  story: "Carrier relationship manager forecasts rate increases next year."
  checks:
    - tool: get_annual_carrier_spend_forecast
      args: {mode: sea}
      expect: ["forecast", "spend"]
    - tool: get_freight_rate_forecast
      args: {mode: sea}
      expect: ["forecast", "rate"]

- question: "04:33:Q3"
  story: "Sourcing manager asks about Vietnam vs Bangladesh for denim sourcing."
