- question: "02:11:Q4"
  story: >
    Road spot rates are quoted for Black Friday week and Christmas week on eight DC-to-store lanes. The four UK North lanes from DC3
    (Leeds) carry the steepest peak uplift: DC3-ST148 (Newcastle) goes from 285 to 355 and 390 per load, about 37% above standard in Christmas week.
  checks:
    - tool: get_spot_market_rates_by_lane
      args: {region: UK North}
      expect: ["DC3-ST148", "Christmas week", "390", "36.8"]
    - tool: get_spot_market_rates_by_lane
      args: {origin: DC1}
      expect: ["DC1-ST214", "700"]

- question: "02:12:Q1"
  story: >
    Spot 40ft rates from Ho Chi Minh City (VNSGN) rose over 12 weeks: Felixstowe 1,900 to 2,460 (+29.5%), Rotterdam 2,000 to 2,500 (+25%),
    while Los Angeles eased from 3,250 to 2,950. Contract rates are 1,750 (CAR-007, large band) to Felixstowe, 1,820 to Rotterdam and 3,050 to Los Angeles,
    so spot is about 41% above contract to Felixstowe but below contract to Los Angeles.
  checks:
    - tool: get_spot_container_rates_by_lane
      args: {origin_port: VNSGN, destination_port: GBFXT}
      expect: ["2460", "29.5"]
    - tool: get_spot_container_rates_by_lane
      args: {origin_port: VNSGN, destination_port: USLAX}
      expect: ["2950", "3250"]
    - tool: get_contract_container_rates_by_lane
      args: {origin_port: VNSGN, destination_port: GBFXT}
      expect: ["1750", "CAR-007", "40.6"]
    - tool: get_rate_trend_by_lane
      args: {lane_id: VNSGN-NLRTM}
      expect: ["2500", "25"]

- question: "02:12:Q3"
  story: >
    SCFI and WCI ran up 16 to 24% in the eight weeks before each of the last three Lunar New Year weeks (SCFI 20.5%, 16.3% and 24% versus eight weeks earlier).
    The VNSGN-GBFXT contract share is 57.5% this quarter, down from 71% in the quarter that contained the last Lunar New Year.
  checks:
    - tool: get_rate_index_history
      args: {index_name: SCFI, weeks_back: 156}
      expect: ["Lunar New Year week", "20.5", "16.3", "24"]
    - tool: get_contract_vs_spot_mix
      args: {lane_id: VNSGN-GBFXT}
      expect: ["57.5", "42.5", "71"]

- question: "02:12:Q5"
  story: >
    Announced and current ocean surcharges: CAR-007 fuel 125 per box (effective) and a congestion surcharge of 250 per box on VNSGN-NLRTM starting in two weeks;
    CAR-005 peak season 300 per box on VNSGN-GBFXT and VNSGN-NLRTM starting in three weeks. 80 CAR-007 boxes to Rotterdam cost 30,000 extra.
  checks:
    - tool: calculate_surcharge_impact_on_bookings
      args: {lane_id: VNSGN-NLRTM, booking_volume_units: 80, carrier_id: CAR-007}
      expect: ["congestion", "250", "30000"]
    - tool: calculate_surcharge_impact_on_bookings
      args: {lane_id: VNSGN-GBFXT, booking_volume_units: 100, carrier_id: CAR-005}
      expect: ["peak season", "30000"]

- question: "02:12:Q6"
  story: >
    Via Valencia (ESVLC) or Piraeus (GRPIR) plus rail to Northampton DC1 costs about 3,010 to 3,020 per 40ft box against 2,750 direct to Felixstowe
    (spot 2,460 plus 290 haulage), 260 to 270 more, and takes 32 to 33 days versus 27. Against Rotterdam the extra is only 100 to 110.
  checks:
    - tool: get_ocean_and_rail_rate_quote
      args: {origin_port: VNSGN, destination_port: GBFXT}
      expect: ["GRPIR", "ESVLC", "3010", "2750", "260"]
    - tool: get_ocean_and_rail_rate_quote
      args: {origin_port: VNSGN, destination_port: NLRTM}
      expect: ["2910", "100"]

- question: "02:13:Q1"
  story: >
    Style 7731 is made in Turkey (SUP-0022), so the air lane is IST-LHR. 6,000 units at 0.33 kg is about 1,980 kg: CAR-008 at 2.05 per kg is 4,059,
    CAR-018 courier at 2.40 per kg is 4,752. At 3,000 kg the rate breaks to 1.90 and 2.25, so consolidating beats splitting.
  checks:
    - tool: get_air_freight_quote
      args: {origin_airport: IST, destination_airport: LHR, weight_kg: 1980}
      expect: ["CAR-008", "4059", "2.05", "1.9"]
    - tool: get_air_freight_quote
      args: {origin_airport: IST, destination_airport: LHR, weight_kg: 990}
      expect: ["2.3", "2277"]

- question: "02:13:Q3"
  story: >
    Dhaka to London is 3.20 per kg (1,000 to 2,999 kg) with CAR-008, up 8.8% on a year ago (2.94); Ho Chi Minh City to London is 3.55, down 9.7% on 3.93.
  checks:
    - tool: get_air_freight_rates_by_origin
      args: {origin_airport: DAC, destination_airport: LHR}
      expect: ["CAR-008", "3.2", "3.6"]
    - tool: get_air_freight_rates_by_origin
      args: {origin_airport: SGN, destination_airport: LHR}
      expect: ["3.55", "3.95"]
    - tool: get_air_rate_history
      args: {origin_airport: DAC, destination_airport: LHR}
      expect: ["2.94", "8.8"]
    - tool: get_air_rate_history
      args: {origin_airport: SGN, destination_airport: LHR}
      expect: ["3.93", "-9.7"]

- question: "02:13:Q4"
  story: >
    Peak season air rates add 0.45 to 0.50 per kg: Dhaka to London 3.65 (1,000 to 2,999 kg) against 3.20 standard, Ho Chi Minh City 4.05 against 3.55.
  checks:
    - tool: get_air_freight_rates_by_origin
      args: {origin_airport: DAC, destination_airport: LHR}
      expect: ["3.65", "3.2", "2.75", "3.2"]
    - tool: get_air_freight_rates_by_origin
      args: {origin_airport: SGN}
      expect: ["4.05", "3.55"]

- question: "02:13:Q5"
  story: >
    For 400 kg from Dhaka to London: straight air with CAR-008 at 3.60 per kg is 1,440 in 4 days; sea-air via Dubai is 840 with CAR-010 (express, 10 days)
    or 660 with CAR-009 (economy, 13 days, which misses a 12-day deadline). Splitting at the 1,000 kg break would cut the air rate to 3.20.
  checks:
    - tool: get_air_freight_quote
      args: {origin_airport: DAC, destination_airport: LHR, weight_kg: 400}
      expect: ["CAR-008", "1440", "3.6"]
    - tool: get_sea_air_routing_quote
      args: {origin_airport: DAC, destination_airport: LHR, weight_kg: 400}
      expect: ["DXB", "840", "10", "660", "13"]

- question: "02:19:Q3"
  story: >
    Replacement stock flown from Ho Chi Minh City to London for the priority boxes: 6,000 kg is 3.10 per kg with CAR-008 (18,600) or 3.55 with CAR-018 (21,300).
  checks:
    - tool: get_air_freight_quote
      args: {origin_airport: SGN, destination_airport: LHR, weight_kg: 6000}
      expect: ["CAR-008", "18600", "21300", "3.1"]

- question: "02:20:Q1"
  story: >
    CAR-002 Midshires contract (matches the contracts rate card): 17.20 per pallet and 645 per full load DC1 to UK North, fuel surcharge capped at 12%,
    tail lift 18 per drop, waiting time 42 per hour after 60 free minutes, redelivery 55, 750kg per pallet weight rule.
  checks:
    - tool: get_carrier_contract_rates
      args: {carrier_id: CAR-002}
      expect: ["17.2", "645", "12%", "tail lift 18", "750kg"]

- question: "02:20:Q2"
  story: >
    Parcel rates: standard (CAR-013) is 1% to 2% below market median, express (CAR-012) is about 8.5% above, next-day (CAR-011) is 16 to 17% above and
    in the dearest quartile in every weight band, so next-day is the lever in a negotiation.
  checks:
    - tool: get_parcel_rates_by_service
      args: {service_type: next-day}
      expect: ["CAR-011", "7.35", "9.55", "15.7"]
    - tool: get_market_benchmark_rates
      args: {mode: parcel, lane_id: UK-next-day}
      expect: ["6.3", "8.2", "13.5"]
    - tool: compare_rates_to_benchmark
      args: {mode: parcel}
      expect: ["UK-next-day", "16.7", "dearest quartile", "UK-standard", "-1.7"]

