- question: "02:12:Q1"
  story: "Freight forwarder wants to see current and contract rates from Ho Chi Minh to Felixstowe."
  checks:
    - tool: get_contract_container_rates_by_lane
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["VNHCM-GBFXT", "large", "1650"]

- question: "02:12:Q3"
  story: "Freight forwarder asks about rate changes."
  checks:
    - tool: get_contract_vs_spot_mix
      args: {period: 2026-Q4}
      expect: ["2026-Q4", "contract"]

- question: "02:12:Q5"
  story: "Freight forwarder asks about surcharges impacting bookings."
  checks:
    - tool: calculate_surcharge_impact_on_bookings
      args: {booking_volume_units: 500}
      expect: ["impact", "gbp"]

- question: "02:12:Q6"
  story: "Freight forwarder asks about alternate port options."
  checks:
    - tool: get_alternate_port_options_and_rates
      args: {origin_port: VNHCM, destination_port: GBFXT}
      expect: ["route", "cost", "GBFXT"]

- question: "02:13:Q3"
  story: "Air freight coordinator asks for rates from Dhaka to London."
  checks:
    - tool: get_air_freight_rates_by_origin
      args: {origin_airport: DAC}
      expect: ["LHR", "rate"]
    - tool: get_air_rate_history
      args: {origin_airport: DAC}
      expect: ["DAC", "quote"]

- question: "02:13:Q5"
  story: "Air freight coordinator needs quotes for Dhaka to London."
  checks:
    - tool: get_air_freight_quote
      args: {origin_airport: DAC, destination_airport: LHR, weight_kg: 5000}
      expect: ["LHR", "quote", "DAC"]

- question: "02:20:Q1"
  story: "Carrier relationship manager reviews CAR-007 contract rates."
  checks:
    - tool: get_carrier_contract_rates
      args: {carrier_id: CAR-007}
      expect: ["CAR-007", "sea", "rate"]

- question: "02:20:Q2"
  story: "Carrier relationship manager compares rates."
  checks:
    - tool: compare_rates_to_benchmark
      args: {lane_id: VNHCM-GBFXT, mode: sea}
      expect: ["VNHCM", "rate", "gbp"]

- question: "02:20:Q4"
  story: "Carrier relationship manager forecasts spend."
  checks:
    - tool: get_annual_carrier_spend_forecast
      args: {mode: sea}
      expect: ["forecast", "carrier"]
    - tool: get_freight_rate_forecast
      args: {mode: sea}
      expect: ["forecast", "rate"]

- question: "04:33:Q3"
  story: "Sourcing manager evaluates ocean freight rates."
  checks:
    - tool: get_freight_rate_for_lane
      args: {lane_id: VNHCM-GBFXT, mode: sea}
      expect: ["rate", "gbp"]

- question: "04:34:Q3"
  story: "Costing analyst reviews freight costs."
  checks:
    - tool: get_freight_rate_for_lane
      args: {lane_id: VNHCM-GBFXT, mode: sea}
      expect: ["transit", "rate"]

- question: "05:45:Q2"
  story: "Sustainability manager compares air versus sea emissions."
  checks:
    - tool: compare_air_sea_freight_cost_and_emissions
      args: {shipment_weight_kg: 5000}
      expect: ["Air", "Sea", "cost"]

- question: "05:50:Q2"
  story: "Risk analyst models impact and recovery options."
  checks:
    - tool: get_air_freight_rates
      args: {}
      expect: ["airport", "rate"]

- question: "06:55:Q4"
  story: "Packaging designer calculates cost savings."
  checks:
    - tool: calculate_freight_saving_per_container
      args: {current_weight_kg: 15000, new_weight_kg: 13500, containers_annual: 100, current_rate_gbp_per_kg: 0.15}
      expect: ["saving", "formula"]

- question: "07:62:Q2"
  story: "Finance analyst forecasts rates."
  checks:
    - tool: get_freight_rate_forecast
      args: {mode: sea}
      expect: ["forecast"]
