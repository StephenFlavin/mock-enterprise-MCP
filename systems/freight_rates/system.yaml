id: freight_rates
name: Freight Rate Management System
instructions: 'Freight rates: sea container spot and contract rates, air rate cards and sea-air routes, road spot rates, parcel rates, benchmarks, surcharges, rate indices and forecasts. Lanes look like VNSGN-GBFXT (ports), DAC-LHR (airports), DC3-ST148 (road). Carriers are CAR-007 style ids.'
tables:
  spot_rates:
    key: rate_id
    cols:
      rate_id:
        type: str
        desc: Spot rate record, e.g. RAT-000123
      lane_id:
        type: str
        desc: 'Lane identifier: port pair VNSGN-GBFXT, airport pair DAC-LHR or road DC3-ST148'
      mode:
        type: enum
        values:
        - sea
        - air
        - road
        - parcel
        desc: Transport mode
      rate_date:
        type: date
        desc: Date rate was quoted
      rate_gbp:
        type: float
        desc: Rate in GBP (per container, per kg, per load or per parcel, see unit)
      unit:
        type: str
        desc: Rate unit, e.g. per 40ft container, per kg, per drop
      origin:
        type: str
        desc: Origin port/airport/location
      destination:
        type: str
        desc: Destination port/airport/location
      min_weight_kg:
        type: float
        desc: Minimum weight for rate
      max_weight_kg:
        type: float
        desc: Maximum weight for rate
      transit_days:
        type: int
        desc: Transit time in days
      source:
        type: str
        desc: Data source, e.g. carrier quote, market data
      period_label:
        type: str
        desc: 'Standard, or the peak period a forward quote covers: Black Friday week, Christmas week'
  contract_rates:
    key: contract_rate_id
    cols:
      contract_rate_id:
        type: str
        desc: Contract rate, e.g. CRR-900001
      carrier_id:
        type: str
        desc: Carrier
      lane_id:
        type: str
        desc: 'Lane: port pair VNSGN-GBFXT, road DC1-NORTH, or parcel service UK-next-day'
      mode:
        type: enum
        values:
        - sea
        - air
        - road
        - parcel
        desc: Transport mode
      rate_from:
        type: date
        desc: Contract start date
      rate_to:
        type: date
        desc: Contract end date
      rate_gbp:
        type: float
        desc: Contracted rate in GBP
      unit:
        type: str
        desc: Rate unit
      min_volume_units:
        type: int
        desc: Minimum volume commitment
      max_volume_units:
        type: int
        desc: Maximum volume per period
      volume_period:
        type: str
        desc: Period (monthly, quarterly, annual)
      volume_band:
        type: str
        desc: Volume band (e.g. small, medium, large)
      status:
        type: enum
        values:
        - active
        - expired
        - under_review
        desc: Contract status
      service_level:
        type: str
        desc: 'Service: FCL 40ft, pallet, full load, standard, express, next-day'
      min_weight_kg:
        type: float
        desc: Parcel weight band lower bound (kg)
      max_weight_kg:
        type: float
        desc: Parcel weight band upper bound (kg)
      terms:
        type: text
        desc: 'Contract terms: fuel surcharge cap, accessorial charges, weight rules'
  air_freight_quotes:
    key: quote_id
    cols:
      quote_id:
        type: str
        desc: Air rate card line, e.g. QTE-000012
      origin_airport:
        type: str
        desc: Origin airport code, e.g. DAC (Dhaka), SGN (Ho Chi Minh City), IST (Istanbul)
      destination_airport:
        type: str
        desc: Destination airport code, e.g. LHR (London Heathrow)
      carrier_id:
        type: str
        desc: Air carrier, e.g. CAR-008
      min_weight_kg:
        type: float
        desc: Lower bound of the weight break (kg)
      max_weight_kg:
        type: float
        desc: Upper bound of the weight break (kg)
      rate_gbp_per_kg:
        type: float
        desc: Standard rate per kg for this weight break
      peak_rate_gbp_per_kg:
        type: float
        desc: Peak season rate per kg (November to December)
      transit_days:
        type: int
        desc: Door-to-airport transit days
      quote_date:
        type: date
        desc: Date quoted
      valid_until:
        type: date
        desc: Quote valid until
      status:
        type: enum
        values:
        - quoted
        - accepted
        - expired
        desc: Quote status
      notes:
        type: text
        desc: Service notes
  rate_history:
    key:
    - lane_id
    - rate_date
    cols:
      lane_id:
        type: str
        desc: Lane identifier
      rate_date:
        type: date
        desc: Date of rate snapshot
      mode:
        type: enum
        values:
        - sea
        - air
        - road
        - parcel
        desc: Transport mode
      spot_rate_gbp:
        type: float
        desc: Spot rate on this date
      contract_rate_gbp:
        type: float
        desc: Contract rate on this date
      contract_rate_pct:
        type: float
        desc: Contract vs spot %
      rate_change_week:
        type: float
        desc: Week-on-week change %
      rate_change_month:
        type: float
        desc: Month-on-month change %
      rate_change_year:
        type: float
        desc: Year-on-year change %
  market_benchmarks:
    key: benchmark_id
    cols:
      benchmark_id:
        type: str
        desc: Benchmark, e.g. BEN-000123
      lane_id:
        type: str
        desc: Lane identifier
      mode:
        type: enum
        values:
        - sea
        - air
        - road
        - parcel
        desc: Transport mode
      volume_band:
        type: str
        desc: Volume band (small/medium/large)
      benchmark_rate_gbp:
        type: float
        desc: Market benchmark rate in GBP
      data_points:
        type: int
        desc: Number of quotes in benchmark
      benchmark_date:
        type: date
        desc: Benchmark date
      percentile_25_gbp:
        type: float
        desc: 25th percentile rate
      percentile_50_gbp:
        type: float
        desc: 50th percentile (median) rate
      percentile_75_gbp:
        type: float
        desc: 75th percentile rate
      min_weight_kg:
        type: float
        desc: Parcel weight band lower bound (kg)
      max_weight_kg:
        type: float
        desc: Parcel weight band upper bound (kg)
      unit:
        type: str
        desc: 'Rate unit, e.g. per 40ft container, per pallet, per load, per parcel'
  surcharges:
    key: surcharge_id
    cols:
      surcharge_id:
        type: str
        desc: Surcharge, e.g. SUR-000123
      carrier_id:
        type: str
        desc: Ocean carrier, e.g. CAR-007
      surcharge_type:
        type: str
        desc: Type (fuel, congestion, security, equipment etc)
      start_date:
        type: date
        desc: Surcharge effective date
      end_date:
        type: date
        desc: Surcharge end date
      amount_gbp:
        type: float
        desc: Surcharge per 40ft container in GBP
      applies_to_mode:
        type: enum
        values:
        - sea
        - air
        - road
        - parcel
        desc: Mode affected
      applies_to_lane:
        type: str
        desc: Lane the surcharge applies to; blank = every lane of the carrier
      status:
        type: enum
        values:
        - effective
        - announced
        - expired
        desc: effective = already billed; announced = starts later
  alternate_ports:
    key: route_id
    cols:
      route_id:
        type: str
        desc: Alternate routing, e.g. ALT-000123
      primary_lane_id:
        type: str
        desc: Primary lane (e.g. Vietnam-UK)
      origin_port:
        type: str
        desc: Origin port code
      primary_dest_port:
        type: str
        desc: Primary destination port
      alternate_dest_port:
        type: str
        desc: Alternative discharge port, e.g. ESVLC (Valencia), GRPIR (Piraeus)
      transit_days_primary:
        type: int
        desc: Direct sea transit days to the primary port
      transit_days_alternate:
        type: int
        desc: Sea transit days to the alternative port
      rate_gbp_sea:
        type: float
        desc: Sea rate to the alternative port, per 40ft container
      rate_gbp_rail:
        type: float
        desc: Rail rate onward to the final destination, per 40ft container
      total_transit_days:
        type: int
        desc: Sea plus rail transit days
      cost_gbp:
        type: float
        desc: Through-rate sea plus rail, per 40ft container
      status:
        type: enum
        values:
        - active
        - seasonal
        - limited
        desc: Availability
      rail_days:
        type: int
        desc: Rail leg transit days
      rail_carrier_id:
        type: str
        desc: Rail carrier, e.g. CAR-016
      final_destination:
        type: str
        desc: Final destination site, e.g. DC1 (Northampton DC)
      direct_haulage_to_dc_gbp:
        type: float
        desc: Cost of road haulage from the primary port to the DC, per container
  rate_forecast:
    key: forecast_id
    cols:
      forecast_id:
        type: str
        desc: Forecast, e.g. FRC-000123
      lane_id:
        type: str
        desc: Lane identifier
      mode:
        type: enum
        values:
        - sea
        - air
        - road
        - parcel
        desc: Transport mode
      forecast_date:
        type: date
        desc: Date forecast is for
      forecast_gbp:
        type: float
        desc: Forecasted rate in GBP
      confidence_pct:
        type: int
        desc: Forecast confidence (0-100)"
      trend:
        type: enum
        values:
        - rising
        - stable
        - falling
        desc: Direction of trend
      notes:
        type: str
        desc: Driver or rationale
  transit_times:
    key: transit_id
    cols:
      transit_id:
        type: str
        desc: Transit time record, e.g. TRN-000123
      lane_id:
        type: str
        desc: Lane identifier
      mode:
        type: enum
        values:
        - sea
        - air
        - road
        - parcel
        desc: Transport mode
      origin:
        type: str
        desc: Origin
      destination:
        type: str
        desc: Destination
      transit_days_scheduled:
        type: int
        desc: Scheduled transit time"
      transit_days_actual_avg:
        type: float
        desc: Actual average transit time
      reliability_pct:
        type: float
        desc: On-time delivery %
      data_period:
        type: str
        desc: Period covered (e.g. last 12 weeks)
  rate_indices:
    key:
    - index_name
    - index_date
    cols:
      index_name:
        type: str
        desc: Index name (e.g. SCFI, WCI, TAC Index)
      index_date:
        type: date
        desc: Date of index reading
      index_value:
        type: float
        desc: Index value
      week_change_pct:
        type: float
        desc: Week-on-week change %
      year_change_pct:
        type: float
        desc: Year-on-year change %
      mode:
        type: enum
        values:
        - sea
        - air
        - road
        desc: Mode the index covers
      event:
        type: str
        desc: Seasonal event the week belongs to, e.g. Lunar New Year week
  booking_volumes:
    key:
    - lane_id
    - booking_period
    cols:
      lane_id:
        type: str
        desc: Lane identifier
      booking_period:
        type: str
        desc: Quarter label relative to today, e.g. current quarter, last quarter
      period_start:
        type: date
        desc: Start of the quarter
      contract_volume_units:
        type: int
        desc: 40ft containers booked on contract
      spot_volume_units:
        type: int
        desc: 40ft containers booked on spot
      total_volume_units:
        type: int
        desc: Total 40ft containers booked
      contract_pct:
        type: float
        desc: Contract as % of total
      spot_pct:
        type: float
        desc: Spot as % of total
  freight_emissions:
    key:
    - corridor_id
    cols:
      corridor_id:
        type: str
        desc: Air/sea corridor, e.g. DAC-LHR
      origin_airport:
        type: str
        desc: Origin airport, e.g. DAC
      origin_port:
        type: str
        desc: Origin sea port for the same origin, e.g. BDCGP
      destination_airport:
        type: str
        desc: Destination airport, e.g. LHR
      destination_port:
        type: str
        desc: Destination sea port, e.g. GBFXT
      distance_km:
        type: int
        desc: Distance used for emissions, km
      air_co2e_kg_per_kg:
        type: float
        desc: Air emissions, kg CO2e per kg shipped
      sea_co2e_kg_per_kg:
        type: float
        desc: Sea emissions, kg CO2e per kg shipped
      sea_kg_per_container:
        type: int
        desc: Payload assumed per 40ft container, kg
      data_source:
        type: str
        desc: Source of emissions factors
  sea_air_routes:
    key: route_id
    cols:
      route_id:
        type: str
        desc: Sea-air route, e.g. SAR-000001
      origin_airport:
        type: str
        desc: Origin airport code, e.g. DAC
      destination_airport:
        type: str
        desc: Destination airport code, e.g. LHR
      via_hub:
        type: str
        desc: Transfer hub airport, e.g. DXB (Dubai)
      carrier_id:
        type: str
        desc: Forwarder selling the through-rate, e.g. CAR-009
      rate_gbp_per_kg:
        type: float
        desc: Through-rate per kg, sea plus air
      min_weight_kg:
        type: float
        desc: Minimum chargeable weight (kg)
      sea_days:
        type: int
        desc: Sea leg transit days
      hub_transfer_days:
        type: int
        desc: Days to transfer at the hub
      air_days:
        type: int
        desc: Air leg days
      total_transit_days:
        type: int
        desc: Total door-to-airport days
      valid_until:
        type: date
        desc: Quote valid until
      notes:
        type: text
        desc: Service and cut-off notes
  air_rate_history:
    key:
    - origin_airport
    - destination_airport
    - rate_date
    cols:
      origin_airport:
        type: str
        desc: Origin airport code, e.g. DAC
      destination_airport:
        type: str
        desc: Destination airport code, e.g. LHR
      rate_date:
        type: date
        desc: Date of the rate (every four weeks)
      rate_gbp_per_kg:
        type: float
        desc: Lowest carrier rate per kg for the 1,000 to 2,999 kg weight break
  carrier_spend:
    key:
    - carrier_id
    - mode
    cols:
      carrier_id:
        type: str
        desc: Carrier, e.g. CAR-007
      mode:
        type: enum
        values:
        - sea
        - air
        - road
        - parcel
        desc: Transport mode
      annual_volume:
        type: float
        desc: Volume moved with the carrier in the last 12 months
      volume_unit:
        type: str
        desc: 'Unit of volume: 40ft containers, pallets, kg, parcels'
      avg_rate_gbp:
        type: float
        desc: Average contract rate per unit, GBP
      baseline_annual_gbp:
        type: float
        desc: Last 12 months contracted spend at current rates, GBP
      announced_increase_pct:
        type: float
        desc: Rate increase the carrier has announced, %
      effective_from:
        type: date
        desc: Date the increase takes effect
      notice:
        type: str
        desc: Source or description of the announcement
  port_diversions:
    key: route_id
    cols:
      route_id:
        type: str
        desc: Diversion option, e.g. DIV-000001
      closed_port:
        type: str
        desc: Load port that is closed or disrupted, e.g. VNSGN
      alternate_load_port:
        type: str
        desc: Alternative load port code
      alternate_port_name:
        type: str
        desc: Alternative port name
      destination_port:
        type: str
        desc: Destination port, e.g. GBFXT
      routing:
        type: str
        desc: How boxes reach the alternative port and sail
      positioning_cost_gbp:
        type: float
        desc: Cost of moving a 40ft container to the alternative port, GBP
      rate_premium_gbp:
        type: float
        desc: Sea rate premium at the alternative port versus the normal lane, GBP per 40ft
      extra_transit_days:
        type: int
        desc: Extra transit days versus the normal lane
      capacity_share_pct:
        type: int
        desc: Share of normal weekly volume the option can absorb, %
      status:
        type: str
        desc: 'Availability: active or limited'
      notes:
        type: str
        desc: Capacity and routing notes
tools:
- name: get_contract_container_rates_by_lane
  desc: Contracted 40ft container rates on a port pair by carrier and volume band, with today spot rate and spot premium over contract.
  kind: sql
  args:
    origin_port:
      type: str
      desc: Origin port code, e.g. VNSGN
      required: true
    destination_port:
      type: str
      desc: Destination port code, e.g. GBFXT
      required: true
  sql: |
    SELECT c.contract_rate_id, c.lane_id, c.carrier_id, car.name AS carrier_name, c.rate_gbp AS contract_rate_gbp,
           c.unit, c.volume_band, c.min_volume_units, c.max_volume_units, c.rate_from, c.rate_to,
           sp.rate_gbp AS current_spot_gbp, round((sp.rate_gbp / c.rate_gbp - 1) * 100, 1) AS spot_premium_over_contract_pct
    FROM contract_rates c
    JOIN master.carriers car ON c.carrier_id = car.carrier_id
    LEFT JOIN (SELECT lane_id, rate_gbp FROM spot_rates WHERE mode = 'sea' AND rate_date <= CAST($as_of AS DATE)
               QUALIFY row_number() OVER (PARTITION BY lane_id ORDER BY rate_date DESC) = 1) sp ON sp.lane_id = c.lane_id
    WHERE c.mode = 'sea'
      AND UPPER(c.lane_id) = UPPER($origin_port || '-' || $destination_port)
      AND c.rate_from <= CAST($as_of AS DATE) AND c.rate_to >= CAST($as_of AS DATE)
    ORDER BY c.rate_gbp
  example:
    origin_port: VNSGN
    destination_port: GBFXT
- name: get_contract_vs_spot_mix
  desc: Share of 40ft container volume booked on contract versus spot by lane and quarter, newest quarter first. Use to size contract cover.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier, e.g. VNSGN-GBFXT
    quarters_back:
      type: int
      desc: Number of quarters to return, including the current one
      default: 5
  sql: |
    SELECT lane_id, booking_period, period_start, contract_volume_units, spot_volume_units, total_volume_units, contract_pct, spot_pct
    FROM (SELECT b.*, dense_rank() OVER (PARTITION BY b.lane_id ORDER BY b.period_start DESC) AS rk
          FROM booking_volumes b WHERE ($lane_id IS NULL OR UPPER(b.lane_id) = UPPER($lane_id))) q
    WHERE rk <= $quarters_back
    ORDER BY lane_id, period_start DESC
  example:
    lane_id: VNSGN-GBFXT
- name: get_air_freight_quote
  desc: Air freight quotes by carrier for a shipment weight on an airport pair, with total cost, peak rate and the next weight break. Cheapest first.
  kind: sql
  args:
    origin_airport:
      type: str
      desc: Origin airport code, e.g. DAC (Dhaka)
      required: true
    destination_airport:
      type: str
      desc: Destination airport code, e.g. LHR (London)
      required: true
    weight_kg:
      type: int
      desc: Shipment chargeable weight in kg
      required: true
  sql: |
    WITH q AS (
      SELECT a.*, lead(a.min_weight_kg) OVER w AS next_break_kg, lead(a.rate_gbp_per_kg) OVER w AS next_break_rate
      FROM air_freight_quotes a
      WHERE a.origin_airport = UPPER($origin_airport) AND a.destination_airport = UPPER($destination_airport)
        AND a.valid_until >= CAST($as_of AS DATE) AND a.status IN ('quoted', 'accepted')
      WINDOW w AS (PARTITION BY a.carrier_id ORDER BY a.min_weight_kg)
    )
    SELECT q.quote_id, q.origin_airport, q.destination_airport, q.carrier_id, car.name AS carrier_name,
           q.rate_gbp_per_kg, round(q.rate_gbp_per_kg * $weight_kg, 2) AS total_gbp,
           q.peak_rate_gbp_per_kg, round(q.peak_rate_gbp_per_kg * $weight_kg, 2) AS peak_total_gbp,
           q.transit_days, q.min_weight_kg, q.max_weight_kg, q.next_break_kg, q.next_break_rate,
           q.valid_until, q.notes
    FROM q JOIN master.carriers car ON car.carrier_id = q.carrier_id
    WHERE $weight_kg >= q.min_weight_kg AND $weight_kg <= q.max_weight_kg
    ORDER BY q.rate_gbp_per_kg
  example:
    origin_airport: DAC
    destination_airport: LHR
    weight_kg: 500
- name: get_air_freight_rates_by_origin
  desc: Current air rate cards from an origin airport by destination, carrier and weight break, with peak season rates, cheapest first.
  kind: sql
  args:
    origin_airport:
      type: str
      desc: Origin airport code, e.g. DAC (Dhaka), SGN (Ho Chi Minh City)
      required: true
    destination_airport:
      type: str
      desc: Destination airport code, e.g. LHR
  sql: |
    SELECT q.origin_airport, q.destination_airport, q.carrier_id, car.name AS carrier_name,
           q.min_weight_kg, q.max_weight_kg, q.rate_gbp_per_kg, q.peak_rate_gbp_per_kg, q.transit_days, q.valid_until
    FROM air_freight_quotes q
    JOIN master.carriers car ON car.carrier_id = q.carrier_id
    WHERE q.origin_airport = UPPER($origin_airport)
      AND ($destination_airport IS NULL OR q.destination_airport = UPPER($destination_airport))
      AND q.valid_until >= CAST($as_of AS DATE) AND q.status IN ('quoted', 'accepted')
    ORDER BY q.destination_airport, q.min_weight_kg, q.rate_gbp_per_kg
  example:
    origin_airport: DAC
  limit: 40
- name: get_air_rate_history
  desc: Air rate per kg history from an origin airport (1,000-2,999 kg weight break), newest first, with the rate a year earlier and change.
  kind: sql
  args:
    origin_airport:
      type: str
      desc: Origin airport code, e.g. DAC
      required: true
    destination_airport:
      type: str
      desc: Destination airport code, e.g. LHR
    months_back:
      type: int
      desc: Months of history
      default: 12
  sql: |
    SELECT h.origin_airport, h.destination_airport, h.rate_date, h.rate_gbp_per_kg,
           y.rate_gbp_per_kg AS rate_year_earlier_gbp_per_kg,
           round((h.rate_gbp_per_kg / y.rate_gbp_per_kg - 1) * 100, 1) AS change_vs_year_earlier_pct
    FROM air_rate_history h
    LEFT JOIN air_rate_history y ON y.origin_airport = h.origin_airport AND y.destination_airport = h.destination_airport
         AND y.rate_date = h.rate_date - INTERVAL 364 DAY
    WHERE h.origin_airport = UPPER($origin_airport)
      AND ($destination_airport IS NULL OR h.destination_airport = UPPER($destination_airport))
      AND h.rate_date <= CAST($as_of AS DATE)
      AND h.rate_date >= CAST($as_of AS DATE) - INTERVAL ($months_back * 31) DAY
    ORDER BY h.destination_airport, h.rate_date DESC
  example:
    origin_airport: DAC
  limit: 100
- name: get_alternate_port_options_and_rates
  desc: 'Alternative ports for a lane with rates and transit times: other load ports if the origin is closed, and Mediterranean discharge ports with rail.'
  kind: sql
  args:
    origin_port:
      type: str
      desc: Origin port code
      required: true
    destination_port:
      type: str
      desc: Destination port code
      required: true
  sql: |
    WITH sp AS (
      SELECT lane_id, rate_gbp FROM spot_rates WHERE mode = 'sea' AND rate_date <= CAST($as_of AS DATE)
      QUALIFY row_number() OVER (PARTITION BY lane_id ORDER BY rate_date DESC) = 1
    )
    SELECT 'alternate load port' AS option_type, d.route_id, d.alternate_load_port AS via_port, d.alternate_port_name AS via_port_name,
           d.routing, d.positioning_cost_gbp, ROUND(sp.rate_gbp + d.rate_premium_gbp, 2) AS sea_rate_gbp,
           ROUND(sp.rate_gbp + d.rate_premium_gbp + d.positioning_cost_gbp, 2) AS total_cost_gbp,
           ROUND(d.rate_premium_gbp + d.positioning_cost_gbp, 2) AS extra_cost_vs_normal_gbp,
           tt.transit_days_scheduled + d.extra_transit_days AS total_transit_days, d.extra_transit_days,
           d.capacity_share_pct, d.status, d.notes
    FROM port_diversions d
    LEFT JOIN sp ON sp.lane_id = d.closed_port || '-' || d.destination_port
    LEFT JOIN transit_times tt ON tt.lane_id = d.closed_port || '-' || d.destination_port AND tt.mode = 'sea'
    WHERE UPPER(d.closed_port) = UPPER($origin_port) AND UPPER(d.destination_port) = UPPER($destination_port)
    UNION ALL
    SELECT 'alternate discharge port (sea + rail)', r.route_id, r.alternate_dest_port,
           CASE r.alternate_dest_port WHEN 'ESVLC' THEN 'Valencia' WHEN 'GRPIR' THEN 'Piraeus' ELSE r.alternate_dest_port END,
           'Sea to ' || r.alternate_dest_port || ', then rail to ' || r.final_destination, r.rate_gbp_rail, r.rate_gbp_sea, r.cost_gbp,
           ROUND(r.cost_gbp - sp.rate_gbp - r.direct_haulage_to_dc_gbp, 2), r.total_transit_days,
           r.total_transit_days - (r.transit_days_primary + 1), NULL, r.status, NULL
    FROM alternate_ports r
    LEFT JOIN sp ON sp.lane_id = r.primary_lane_id
    WHERE UPPER(r.origin_port) = UPPER($origin_port) AND UPPER(r.primary_dest_port) = UPPER($destination_port)
      AND r.status IN ('active', 'seasonal')
    ORDER BY option_type, total_cost_gbp
  example:
    origin_port: VNSGN
    destination_port: GBFXT
- name: get_annual_carrier_spend_forecast
  desc: 'Forecast carrier spend for the next 12 months by carrier and mode: last 12 months'' volume at contract rates, uplifted by each carrier''s announced rate increase, with a total row.'
  kind: sql
  args:
    carrier_id:
      type: str
      desc: Carrier, or blank for all
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
  sql: |
    SELECT * FROM (
      SELECT s.carrier_id, car.name AS carrier_name, s.mode, s.annual_volume, s.volume_unit, s.avg_rate_gbp,
             s.baseline_annual_gbp, s.announced_increase_pct, s.effective_from,
             ROUND(s.baseline_annual_gbp * (1 + s.announced_increase_pct / 100), 2) AS forecast_annual_gbp,
             ROUND(s.baseline_annual_gbp * s.announced_increase_pct / 100, 2) AS increase_gbp, s.notice
      FROM carrier_spend s
      JOIN master.carriers car ON s.carrier_id = car.carrier_id
      WHERE ($carrier_id IS NULL OR s.carrier_id = $carrier_id)
        AND ($mode IS NULL OR s.mode = $mode)
      UNION ALL
      SELECT 'TOTAL', 'All carriers selected', NULL, NULL, NULL, NULL, ROUND(SUM(s.baseline_annual_gbp), 2),
             ROUND(SUM(s.baseline_annual_gbp * s.announced_increase_pct / 100) / SUM(s.baseline_annual_gbp) * 100, 2), NULL,
             ROUND(SUM(s.baseline_annual_gbp * (1 + s.announced_increase_pct / 100)), 2),
             ROUND(SUM(s.baseline_annual_gbp * s.announced_increase_pct / 100), 2), 'Weighted average increase in pct column'
      FROM carrier_spend s
      WHERE ($carrier_id IS NULL OR s.carrier_id = $carrier_id)
        AND ($mode IS NULL OR s.mode = $mode)
    ) ORDER BY (carrier_id = 'TOTAL'), increase_gbp DESC
  example:
    mode: sea
- name: get_carrier_contract_rates
  desc: Current contract rates for a carrier across lanes and modes, with units, service levels, fuel surcharge cap and accessorial terms.
  kind: sql
  args:
    carrier_id:
      required: true
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
  sql: |
    SELECT c.contract_rate_id, c.carrier_id, car.name AS carrier_name, c.lane_id, c.mode, c.service_level, c.rate_gbp, c.unit,
           c.min_weight_kg, c.max_weight_kg, c.volume_band, c.min_volume_units, c.rate_from, c.rate_to, c.terms, c.status
    FROM contract_rates c
    JOIN master.carriers car ON car.carrier_id = c.carrier_id
    WHERE c.carrier_id = $carrier_id
      AND ($mode IS NULL OR c.mode = $mode)
      AND c.rate_from <= CAST($as_of AS DATE)
      AND c.rate_to >= CAST($as_of AS DATE)
    ORDER BY c.mode, c.lane_id, c.service_level, c.min_weight_kg
  example:
    carrier_id: CAR-002
  limit: 50
- name: get_freight_rate_for_lane
  desc: Current freight rate for a specific lane (sea/air/road) by date and mode.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier, e.g. HCM-FXT
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
  sql: |
    SELECT s.lane_id, s.rate_date, s.rate_gbp, s.unit, s.origin, s.destination,
           s.transit_days, c.rate_gbp AS contract_rate_gbp
    FROM spot_rates s
    LEFT JOIN (SELECT lane_id, mode, min(rate_gbp) AS rate_gbp FROM contract_rates
               WHERE rate_from <= CAST($as_of AS DATE) AND rate_to >= CAST($as_of AS DATE) GROUP BY lane_id, mode) c ON c.lane_id = s.lane_id AND c.mode = s.mode
    WHERE ($lane_id IS NULL OR UPPER(s.lane_id) = UPPER($lane_id))
      AND ($mode IS NULL OR s.mode = $mode)
      AND s.rate_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
      AND s.rate_date <= CAST($as_of AS DATE)
    ORDER BY s.rate_date DESC
    LIMIT 30
  example:
    lane_id: VNSGN-GBFXT
    mode: sea
- name: get_freight_rate_forecast
  desc: Spot freight rate outlook by lane for the next 12 weeks, with the change versus the current spot rate and the contract rate (fixed until renewal) for comparison.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
  sql: |
    WITH sp AS (
      SELECT lane_id, mode, rate_gbp FROM spot_rates WHERE rate_date <= CAST($as_of AS DATE)
      QUALIFY row_number() OVER (PARTITION BY lane_id, mode ORDER BY rate_date DESC) = 1
    ), ct AS (
      SELECT lane_id, mode, min(rate_gbp) AS rate_gbp FROM contract_rates
      WHERE rate_from <= CAST($as_of AS DATE) AND rate_to >= CAST($as_of AS DATE) GROUP BY lane_id, mode
    )
    SELECT f.lane_id, f.mode, f.forecast_date, f.forecast_gbp, sp.rate_gbp AS current_spot_gbp,
           ROUND((f.forecast_gbp / sp.rate_gbp - 1) * 100, 1) AS change_vs_current_pct, ct.rate_gbp AS contract_rate_gbp,
           f.trend, f.confidence_pct, f.notes
    FROM rate_forecast f
    LEFT JOIN sp ON sp.lane_id = f.lane_id AND sp.mode = f.mode
    LEFT JOIN ct ON ct.lane_id = f.lane_id AND ct.mode = f.mode
    WHERE ($lane_id IS NULL OR f.lane_id = $lane_id)
      AND ($mode IS NULL OR f.mode = $mode)
      AND f.forecast_date >= CAST($as_of AS DATE)
      AND f.forecast_date <= CAST($as_of AS DATE) + INTERVAL 12 WEEK
    ORDER BY f.lane_id, f.forecast_date
    LIMIT 50
  example:
    mode: sea
- name: get_air_freight_rates
  desc: Current air freight rates by lane (origin-destination pair).
  kind: sql
  args:
    mode:
      type: enum
      values:
      - air
      desc: Always air
    min_weight_kg:
      type: int
      desc: Minimum shipment weight; shows breaks that apply at or above it
    origin_airport:
      type: str
      desc: Origin airport code, e.g. SGN (Ho Chi Minh City), DAC (Dhaka)
    destination_airport:
      type: str
      desc: Destination airport code, e.g. LHR
  sql: |
    SELECT q.origin_airport, q.destination_airport, q.carrier_id, car.name AS carrier_name, q.min_weight_kg, q.max_weight_kg,
           q.rate_gbp_per_kg, q.peak_rate_gbp_per_kg, q.transit_days, q.valid_until
    FROM air_freight_quotes q
    JOIN master.carriers car ON q.carrier_id = car.carrier_id
    WHERE q.valid_until >= CAST($as_of AS DATE)
      AND ($min_weight_kg IS NULL OR q.max_weight_kg >= $min_weight_kg)
      AND ($origin_airport IS NULL OR q.origin_airport = UPPER($origin_airport))
      AND ($destination_airport IS NULL OR q.destination_airport = UPPER($destination_airport))
    ORDER BY q.origin_airport, q.destination_airport, q.min_weight_kg, q.rate_gbp_per_kg
  example: {}
  limit: 60
- name: compare_rates_to_benchmark
  desc: Compare our contract rates with the market benchmark by lane or parcel service, with variance percent and market position, most above market first.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier, e.g. VNSGN-GBFXT or parcel service UK-next-day; blank for all lanes of the mode
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
      required: true
  sql: |
    SELECT c.lane_id, c.carrier_id, car.name AS carrier_name, c.service_level, c.volume_band, c.min_weight_kg, c.max_weight_kg,
           c.rate_gbp AS our_rate_gbp, b.percentile_50_gbp AS market_median_gbp, b.percentile_25_gbp, b.percentile_75_gbp,
           round((c.rate_gbp / b.percentile_50_gbp - 1) * 100, 1) AS variance_vs_median_pct,
           CASE WHEN c.rate_gbp < b.percentile_25_gbp THEN 'well below market (cheapest quartile)'
                WHEN c.rate_gbp <= b.percentile_50_gbp THEN 'below market median'
                WHEN c.rate_gbp <= b.percentile_75_gbp THEN 'above market median'
                ELSE 'well above market (dearest quartile)' END AS competitive_position
    FROM contract_rates c
    JOIN master.carriers car ON c.carrier_id = car.carrier_id
    JOIN market_benchmarks b ON b.lane_id = c.lane_id AND b.mode = c.mode
         AND ((c.mode = 'parcel' AND b.min_weight_kg = c.min_weight_kg AND b.max_weight_kg = c.max_weight_kg)
              OR (c.mode <> 'parcel' AND b.volume_band = c.volume_band))
    WHERE c.mode = $mode
      AND ($lane_id IS NULL OR UPPER(c.lane_id) = UPPER($lane_id))
      AND c.rate_from <= CAST($as_of AS DATE) AND c.rate_to >= CAST($as_of AS DATE)
      AND b.benchmark_date >= CAST($as_of AS DATE) - INTERVAL 60 DAY
    ORDER BY variance_vs_median_pct DESC
  example:
    lane_id: UK-next-day
    mode: parcel
  limit: 40
- name: calculate_freight_saving_per_container
  desc: 'Freight saving per container and per year from a lighter container load: weight cut x rate per kg, given or taken from the current spot rate of a sea lane.'
  kind: sql
  args:
    current_weight_kg:
      type: int
      desc: Current package weight in kg
      required: true
    new_weight_kg:
      type: int
      desc: Optimized package weight in kg
      required: true
    containers_annual:
      type: int
      desc: Containers per year
      required: true
    current_rate_gbp_per_kg:
      type: float
      desc: Current rate per kg
    lane_id:
      type: str
      desc: Sea lane to take the current rate from when no rate per kg is given, e.g. MXZLO-GBFXT
  sql: |
    WITH r AS (
      SELECT COALESCE($current_rate_gbp_per_kg,
               (SELECT rate_gbp / 20000.0 FROM spot_rates WHERE mode = 'sea' AND UPPER(lane_id) = UPPER($lane_id)
                  AND rate_date <= CAST($as_of AS DATE) ORDER BY rate_date DESC LIMIT 1)) AS rate,
             CASE WHEN $current_rate_gbp_per_kg IS NOT NULL THEN 'given' ELSE 'current spot rate of ' || $lane_id || ' / 20,000 kg' END AS rate_source
    )
    SELECT $current_weight_kg AS current_weight_kg, $new_weight_kg AS new_weight_kg, $containers_annual AS containers_annual,
           ROUND(r.rate, 4) AS rate_gbp_per_kg, r.rate_source,
           ROUND(($current_weight_kg - $new_weight_kg) * 100.0 / $current_weight_kg, 1) AS weight_reduction_pct,
           ROUND(r.rate * ($current_weight_kg - $new_weight_kg), 2) AS saving_per_container_gbp,
           ROUND(r.rate * ($current_weight_kg - $new_weight_kg) * $containers_annual, 2) AS annual_saving_gbp,
           'saving = (current_weight - new_weight) * rate per kg; annual = saving per container * containers per year' AS formula
    FROM r
  example:
    current_weight_kg: 15000
    new_weight_kg: 13500
    containers_annual: 100
    current_rate_gbp_per_kg: 0.15
- name: calculate_surcharge_impact_on_bookings
  desc: Surcharges in force or starting in the next weeks on a lane for a carrier, with cost on planned containers and the total.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier, e.g. VNSGN-NLRTM
      required: true
    booking_volume_units:
      type: int
      desc: Planned bookings in 40ft containers
      required: true
    carrier_id:
      type: str
      desc: Ocean carrier, e.g. CAR-007; blank for every carrier
    weeks_ahead:
      type: int
      desc: Look-ahead window in weeks
      default: 8
  sql: |
    SELECT s.surcharge_id, s.carrier_id, car.name AS carrier_name, s.surcharge_type, s.amount_gbp AS amount_per_container_gbp,
           s.applies_to_lane, s.status, s.start_date, s.end_date,
           $booking_volume_units AS containers,
           round(s.amount_gbp * $booking_volume_units, 2) AS impact_gbp,
           round(sum(s.amount_gbp * $booking_volume_units) OVER (), 2) AS total_impact_gbp,
           'impact = surcharge per container x planned containers' AS formula
    FROM surcharges s
    JOIN master.carriers car ON car.carrier_id = s.carrier_id
    WHERE (s.applies_to_lane IS NULL OR UPPER(s.applies_to_lane) = UPPER($lane_id))
      AND ($carrier_id IS NULL OR s.carrier_id = $carrier_id)
      AND s.start_date <= CAST($as_of AS DATE) + INTERVAL ($weeks_ahead * 7) DAY
      AND s.end_date >= CAST($as_of AS DATE)
      AND s.status IN ('effective', 'announced')
    ORDER BY s.start_date, s.surcharge_type
  example:
    lane_id: VNSGN-NLRTM
    booking_volume_units: 80
    carrier_id: CAR-007
- name: compare_air_sea_freight_cost_and_emissions
  desc: Cost and CO2e of air versus sea for a shipment weight on an origin corridor (airport or port code), and of shifting a share of the air volume to sea.
  kind: sql
  args:
    shipment_weight_kg:
      type: int
      desc: Shipment weight in kg (annual air volume to be compared)
      required: true
    origin:
      type: str
      desc: Origin airport or port code, e.g. DAC or BDCGP; blank for every corridor
    destination:
      type: str
      desc: Destination airport or port code, e.g. LHR or GBFXT
    shift_pct:
      type: int
      desc: Share of the volume moved from air to sea in the shift option, %
      default: 30
  sql: |
    WITH c AS (
      SELECT * FROM freight_emissions
      WHERE ($origin IS NULL OR UPPER($origin) IN (origin_airport, origin_port))
        AND ($destination IS NULL OR UPPER($destination) IN (destination_airport, destination_port))
    ), air AS (
      SELECT c.corridor_id, avg(q.rate_gbp_per_kg) AS rate, min(q.transit_days) AS days
      FROM c JOIN air_freight_quotes q ON q.origin_airport = c.origin_airport AND q.destination_airport = c.destination_airport
      WHERE q.valid_until >= CAST($as_of AS DATE) AND $shipment_weight_kg BETWEEN q.min_weight_kg AND q.max_weight_kg
      GROUP BY c.corridor_id
    ), sea AS (
      SELECT c.corridor_id, s.rate_gbp AS rate, s.transit_days AS days
      FROM c JOIN spot_rates s ON s.lane_id = c.origin_port || '-' || c.destination_port AND s.mode = 'sea'
           AND s.rate_date <= CAST($as_of AS DATE)
      QUALIFY row_number() OVER (PARTITION BY c.corridor_id ORDER BY s.rate_date DESC) = 1
    ), m AS (
      SELECT c.corridor_id, c.origin_airport, c.origin_port,
             $shipment_weight_kg * air.rate AS air_cost, $shipment_weight_kg * c.air_co2e_kg_per_kg AS air_kg,
             CEIL($shipment_weight_kg / c.sea_kg_per_container) AS sea_boxes, sea.rate AS sea_rate,
             $shipment_weight_kg * c.sea_co2e_kg_per_kg AS sea_kg, air.days AS air_days, sea.days AS sea_days,
             CEIL($shipment_weight_kg * $shift_pct / 100.0 / c.sea_kg_per_container) AS shift_boxes,
             c.air_co2e_kg_per_kg, c.sea_co2e_kg_per_kg
      FROM c JOIN air ON air.corridor_id = c.corridor_id JOIN sea ON sea.corridor_id = c.corridor_id
    )
    SELECT corridor_id, 'Air (100%)' AS option, $shipment_weight_kg AS weight_kg, NULL AS sea_containers,
           ROUND(air_cost, 2) AS cost_gbp, ROUND(air_kg, 0) AS emissions_co2e_kg, ROUND(air_kg / 1000, 2) AS emissions_co2e_tonnes,
           air_days AS transit_days, NULL AS cost_saving_vs_air_gbp, NULL AS co2e_saving_vs_air_tonnes
    FROM m
    UNION ALL
    SELECT corridor_id, 'Sea (100%)', $shipment_weight_kg, sea_boxes, ROUND(sea_boxes * sea_rate, 2), ROUND(sea_kg, 0),
           ROUND(sea_kg / 1000, 2), sea_days, ROUND(air_cost - sea_boxes * sea_rate, 2), ROUND((air_kg - sea_kg) / 1000, 2)
    FROM m
    UNION ALL
    SELECT corridor_id, 'Shift ' || $shift_pct || '% to sea', $shipment_weight_kg, shift_boxes,
           ROUND(air_cost * (100 - $shift_pct) / 100.0 + shift_boxes * sea_rate, 2),
           ROUND(air_kg * (100 - $shift_pct) / 100.0 + sea_kg * $shift_pct / 100.0, 0),
           ROUND((air_kg * (100 - $shift_pct) / 100.0 + sea_kg * $shift_pct / 100.0) / 1000, 2), sea_days,
           ROUND(air_cost - (air_cost * (100 - $shift_pct) / 100.0 + shift_boxes * sea_rate), 2),
           ROUND((air_kg - (air_kg * (100 - $shift_pct) / 100.0 + sea_kg * $shift_pct / 100.0)) / 1000, 2)
    FROM m
    ORDER BY corridor_id, cost_gbp DESC
  example:
    shipment_weight_kg: 400000
    origin: DAC
- name: get_spot_container_rates_by_lane
  desc: Weekly spot rates for a 40ft container on a port pair over the last 12 weeks, newest first, with change since the start.
  kind: sql
  args:
    origin_port:
      type: str
      desc: Origin port code, e.g. VNSGN
      required: true
    destination_port:
      type: str
      desc: Destination port code, e.g. GBFXT
      required: true
  sql: |
    SELECT s.lane_id, s.rate_date, s.rate_gbp, s.unit, s.transit_days, s.source,
           round((s.rate_gbp / first_value(s.rate_gbp) OVER (ORDER BY s.rate_date) - 1) * 100, 1) AS change_since_first_week_pct
    FROM spot_rates s
    WHERE s.mode = 'sea'
      AND UPPER(s.lane_id) = UPPER($origin_port || '-' || $destination_port)
      AND s.rate_date >= CAST($as_of AS DATE) - INTERVAL 12 WEEK
      AND s.rate_date <= CAST($as_of AS DATE)
    ORDER BY s.rate_date DESC
  example:
    origin_port: VNSGN
    destination_port: GBFXT
  limit: 30
- name: get_spot_market_rates_by_lane
  desc: Spot road rates by lane (DC to store) now and quoted for Black Friday and Christmas weeks, with uplift. Filter by origin DC or store region.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Road lane, e.g. DC3-ST148
    origin:
      type: str
      desc: Origin DC id, e.g. DC3
    region:
      type: str
      desc: Destination store region, e.g. UK North
    date_from:
      type: date
      default: -14d
      desc: Rate date on or after
    date_to:
      type: date
      default: +120d
      desc: Rate date on or before
  sql: |
    SELECT s.lane_id, s.origin, st.name AS store_name, st.region AS store_region, s.period_label, s.rate_date,
           s.rate_gbp, s.unit, round((s.rate_gbp / b.std_rate - 1) * 100, 1) AS uplift_vs_standard_pct,
           s.transit_days, s.source
    FROM spot_rates s
    JOIN master.sites st ON st.site_id = s.destination
    JOIN (SELECT lane_id, max(rate_gbp) FILTER (WHERE period_label = 'standard') AS std_rate
          FROM spot_rates WHERE mode = 'road' GROUP BY lane_id) b ON b.lane_id = s.lane_id
    WHERE s.mode = 'road'
      AND ($lane_id IS NULL OR s.lane_id = $lane_id)
      AND ($origin IS NULL OR s.origin = $origin)
      AND ($region IS NULL OR st.region ILIKE '%' || $region || '%')
      AND s.rate_date >= CAST($date_from AS DATE)
      AND s.rate_date <= CAST($date_to AS DATE)
    ORDER BY s.lane_id, s.rate_date
  example:
    region: UK North
  limit: 60
- name: get_rate_trend_by_lane
  desc: Weekly spot and contract rate trend for a port-pair lane over recent weeks, newest first, with week-on-week and period change.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier, e.g. VNSGN-GBFXT
      required: true
    weeks_back:
      type: int
      desc: Number of weekly points to return
      default: 12
  sql: |
    WITH r AS (
      SELECT h.*, row_number() OVER (ORDER BY h.rate_date DESC) AS rn
      FROM rate_history h
      WHERE UPPER(h.lane_id) = UPPER($lane_id) AND h.rate_date <= CAST($as_of AS DATE)
    )
    SELECT lane_id, rate_date, spot_rate_gbp, contract_rate_gbp, rate_change_week, rate_change_month, rate_change_year,
           round((spot_rate_gbp / first_value(spot_rate_gbp) OVER (ORDER BY rate_date) - 1) * 100, 1) AS spot_change_over_period_pct,
           round((spot_rate_gbp / contract_rate_gbp - 1) * 100, 1) AS spot_premium_over_contract_pct
    FROM r
    WHERE rn <= $weeks_back
    ORDER BY rate_date DESC
  example:
    lane_id: VNSGN-GBFXT
  limit: 100
- name: get_rate_index_history
  desc: Weekly freight rate index history (SCFI, WCI), newest first, with year-on-year, change versus 8 weeks earlier and Lunar New Year weeks flagged.
  kind: sql
  args:
    index_name:
      type: str
      desc: 'Index name: SCFI or WCI'
      default: SCFI
    weeks_back:
      type: int
      desc: Number of weekly points to return, up to 160 (three years is 156)
      default: 52
  sql: |
    WITH x AS (
      SELECT i.*, lag(i.index_value, 8) OVER (PARTITION BY i.index_name ORDER BY i.index_date) AS v8,
             row_number() OVER (PARTITION BY i.index_name ORDER BY i.index_date DESC) AS rn
      FROM rate_indices i
      WHERE ($index_name IS NULL OR UPPER(i.index_name) = UPPER($index_name)) AND i.index_date <= CAST($as_of AS DATE)
    )
    SELECT index_name, index_date, index_value, week_change_pct, year_change_pct,
           round((index_value / v8 - 1) * 100, 1) AS change_vs_8_weeks_earlier_pct, event
    FROM x
    WHERE rn <= $weeks_back
    ORDER BY index_name, index_date DESC
  example:
    index_name: SCFI
  limit: 400
- name: get_freight_rate_history
  desc: Historical freight rates by lane and date for trend analysis.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
    months_back:
      type: int
      desc: Number of months of history
      default: 12
  sql: |
    SELECT h.lane_id, h.rate_date, h.mode, h.spot_rate_gbp, h.contract_rate_gbp,
           h.contract_rate_pct, h.rate_change_month, h.rate_change_year,
           'Rate history' AS history_type
    FROM rate_history h
    WHERE ($lane_id IS NULL OR h.lane_id = $lane_id)
      AND ($mode IS NULL OR h.mode = $mode)
      AND h.rate_date >= CAST($as_of AS DATE) - INTERVAL ($months_back * 30) DAY
    ORDER BY h.rate_date DESC
    LIMIT 150
  example:
    lane_id: VNSGN-GBFXT
    mode: sea
- name: get_freight_rates_for_lane
  desc: 'Freight rates for a lane: recent spot rates with contract rate, month and year-on-year change, and per-pallet equivalent for sea containers.'
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
  sql: |
    SELECT s.lane_id, s.rate_date, s.mode, s.rate_gbp, s.unit,
           CASE WHEN s.unit LIKE 'per 40ft%' THEN ROUND(s.rate_gbp / 20.0, 2) END AS rate_per_pallet_gbp,
           s.transit_days, s.origin, s.destination,
           c.rate_gbp AS contract_rate_gbp, h.rate_change_month, h.rate_change_year
    FROM spot_rates s
    LEFT JOIN (SELECT lane_id, mode, min(rate_gbp) AS rate_gbp FROM contract_rates
               WHERE rate_from <= CAST($as_of AS DATE) AND rate_to >= CAST($as_of AS DATE) GROUP BY lane_id, mode) c ON c.lane_id = s.lane_id AND c.mode = s.mode
    LEFT JOIN rate_history h ON h.lane_id = s.lane_id AND h.mode = s.mode AND h.rate_date = s.rate_date
    WHERE ($lane_id IS NULL OR UPPER(s.lane_id) = UPPER($lane_id))
      AND ($mode IS NULL OR s.mode = $mode)
      AND s.rate_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
      AND s.rate_date <= CAST($as_of AS DATE)
    ORDER BY s.rate_date DESC
    LIMIT 50
  example:
    lane_id: VNSGN-GBFXT
    mode: sea
- name: get_market_benchmark_rates
  desc: Market benchmark rates (25th, 50th, 75th percentile) by lane and mode, for sea volume bands or parcel services and weight bands.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier, e.g. VNSGN-GBFXT or parcel service UK-next-day; blank for all lanes of the mode
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
      required: true
    volume_band:
      type: str
      desc: Volume band (small/medium/large)
  sql: |
    SELECT b.benchmark_id, b.lane_id, b.mode, b.volume_band, b.min_weight_kg, b.max_weight_kg,
           b.benchmark_rate_gbp, b.data_points, b.percentile_25_gbp, b.percentile_50_gbp, b.percentile_75_gbp, b.benchmark_date
    FROM market_benchmarks b
    WHERE b.mode = $mode
      AND ($lane_id IS NULL OR UPPER(b.lane_id) = UPPER($lane_id))
      AND ($volume_band IS NULL OR b.volume_band = $volume_band)
      AND b.benchmark_date >= CAST($as_of AS DATE) - INTERVAL 60 DAY
    ORDER BY b.lane_id, b.volume_band, b.min_weight_kg
  example:
    lane_id: VNSGN-GBFXT
    mode: sea
  limit: 40
- name: get_market_rate_benchmarks
  desc: Market benchmark percentiles against our contracted rate and carrier for a lane (sea, road or parcel), with variance versus market. Use to judge outsourced rates.
  kind: sql
  args:
    lane_id:
      type: str
      desc: 'Lane identifier, e.g. VNSGN-GBFXT (sea), DC1-NORTH (road) or UK-next-day (parcel)'
      required: true
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
  sql: |
    SELECT b.lane_id, b.mode, b.volume_band, b.min_weight_kg, b.max_weight_kg, b.unit, c.carrier_id,
           b.benchmark_rate_gbp, b.percentile_25_gbp, b.percentile_50_gbp, b.percentile_75_gbp,
           c.rate_gbp AS our_contract_rate_gbp,
           ROUND(((c.rate_gbp - b.benchmark_rate_gbp) / b.benchmark_rate_gbp) * 100, 1) AS vs_market_pct
    FROM market_benchmarks b
    LEFT JOIN contract_rates c ON c.lane_id = b.lane_id AND c.mode = b.mode
         AND c.unit = b.unit
         AND (c.volume_band IS NULL OR c.volume_band = b.volume_band)
         AND (c.min_weight_kg IS NULL OR c.min_weight_kg = b.min_weight_kg)
         AND c.rate_from <= CAST($as_of AS DATE) AND c.rate_to >= CAST($as_of AS DATE)
    WHERE UPPER(b.lane_id) = UPPER($lane_id)
      AND ($mode IS NULL OR b.mode = $mode)
      AND b.benchmark_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
    ORDER BY b.unit, b.volume_band, b.min_weight_kg
  example:
    lane_id: VNSGN-GBFXT
    mode: sea
- name: get_ocean_freight_rates_for_lane
  desc: Weekly spot rates for a port-pair lane over 12 weeks with the contract carrier and rate (largest volume band available). Use for ocean freight cost comparisons.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier, e.g. VNSGN-GBFXT
      required: true
  sql: |
    SELECT s.rate_id, s.lane_id, s.rate_date, s.rate_gbp, s.unit, s.transit_days, s.origin, s.destination,
           c.carrier_id, car.name AS carrier_name, c.rate_gbp AS contract_rate_gbp, c.volume_band
    FROM spot_rates s
    LEFT JOIN (SELECT lane_id, carrier_id, rate_gbp, volume_band FROM contract_rates
               WHERE mode = 'sea' AND rate_from <= CAST($as_of AS DATE) AND rate_to >= CAST($as_of AS DATE)
               QUALIFY row_number() OVER (PARTITION BY lane_id ORDER BY CASE volume_band WHEN 'large' THEN 0 WHEN 'medium' THEN 1 ELSE 2 END, rate_gbp) = 1) c
           ON c.lane_id = s.lane_id
    LEFT JOIN master.carriers car ON c.carrier_id = car.carrier_id
    WHERE s.mode = 'sea'
      AND UPPER(s.lane_id) = UPPER($lane_id)
      AND s.rate_date >= CAST($as_of AS DATE) - INTERVAL 12 WEEK
      AND s.rate_date <= CAST($as_of AS DATE)
    ORDER BY s.rate_date DESC
  example:
    lane_id: VNSGN-GBFXT
- name: get_parcel_rates_by_service
  desc: Our contracted parcel rates per parcel by service (standard, express, next-day) and weight band with carrier.
  kind: sql
  args:
    service_type:
      type: str
      desc: 'Service: standard, express or next-day'
    weight_kg:
      type: float
      desc: Parcel weight in kg; returns the band covering it
    carrier_id:
      type: str
      desc: Parcel carrier, e.g. CAR-011
  sql: |
    SELECT c.lane_id, c.service_level AS service, c.carrier_id, car.name AS carrier_name, c.min_weight_kg, c.max_weight_kg,
           c.rate_gbp, c.unit, c.terms, c.rate_from, c.rate_to
    FROM contract_rates c
    JOIN master.carriers car ON car.carrier_id = c.carrier_id
    WHERE c.mode = 'parcel'
      AND ($service_type IS NULL OR lower(c.service_level) = lower($service_type))
      AND ($weight_kg IS NULL OR ($weight_kg >= c.min_weight_kg AND $weight_kg <= c.max_weight_kg))
      AND ($carrier_id IS NULL OR c.carrier_id = $carrier_id)
      AND c.rate_from <= CAST($as_of AS DATE) AND c.rate_to >= CAST($as_of AS DATE)
    ORDER BY c.service_level, c.min_weight_kg
  example: {}
  limit: 30
- name: get_transit_time_by_lane
  desc: Transit time by lane with actual reliability and scheduled times.
  kind: sql
  args:
    lane_id:
      type: str
      desc: Lane identifier
      required: true
    mode:
      type: enum
      values:
      - sea
      - air
      - road
      - parcel
      desc: Transport mode
  sql: |
    SELECT t.transit_id, t.lane_id, t.mode, t.origin, t.destination,
           t.transit_days_scheduled, t.transit_days_actual_avg, t.reliability_pct,
           t.data_period
    FROM transit_times t
    WHERE t.lane_id = $lane_id
      AND ($mode IS NULL OR t.mode = $mode)
    LIMIT 10
  example:
    lane_id: VNSGN-GBFXT
    mode: sea
- name: get_ocean_and_rail_rate_quote
  desc: Ocean plus rail through-rate options via Mediterranean ports to the DC with transit time, and the extra cost versus direct sea and haulage.
  kind: sql
  args:
    origin_port:
      type: str
      desc: Origin port code, e.g. VNSGN
      required: true
    destination_port:
      type: str
      desc: Direct North European port the boxes use now, e.g. GBFXT or NLRTM
      required: true
  sql: |
    SELECT r.route_id, r.origin_port, r.alternate_dest_port AS via_port, r.final_destination,
           r.rate_gbp_sea, r.rate_gbp_rail, r.cost_gbp AS through_rate_gbp, r.transit_days_alternate AS sea_days,
           r.rail_days, r.total_transit_days, r.rail_carrier_id,
           r.primary_dest_port AS direct_port, sp.rate_gbp AS direct_sea_rate_gbp, r.direct_haulage_to_dc_gbp,
           round(sp.rate_gbp + r.direct_haulage_to_dc_gbp, 2) AS direct_total_to_dc_gbp,
           r.transit_days_primary + 1 AS direct_transit_days_to_dc,
           round(r.cost_gbp - sp.rate_gbp - r.direct_haulage_to_dc_gbp, 2) AS extra_cost_vs_direct_gbp
    FROM alternate_ports r
    LEFT JOIN (SELECT lane_id, rate_gbp FROM spot_rates WHERE mode = 'sea' AND rate_date <= CAST($as_of AS DATE)
               QUALIFY row_number() OVER (PARTITION BY lane_id ORDER BY rate_date DESC) = 1) sp ON sp.lane_id = r.primary_lane_id
    WHERE UPPER(r.origin_port) = UPPER($origin_port)
      AND UPPER(r.primary_dest_port) = UPPER($destination_port)
      AND r.status IN ('active', 'seasonal')
    ORDER BY r.cost_gbp, r.total_transit_days
  example:
    origin_port: VNSGN
    destination_port: GBFXT
- name: get_sea_air_routing_quote
  desc: Sea-air routing quotes via a hub such as Dubai for a weight, with total cost, transit days and cut-off notes. Compare with get_air_freight_quote.
  kind: sql
  args:
    origin_airport:
      type: str
      desc: Origin airport code, e.g. DAC
      required: true
    destination_airport:
      type: str
      desc: Destination airport code, e.g. LHR
      required: true
    weight_kg:
      type: int
      desc: Shipment weight in kg
      required: true
    via_hub:
      type: str
      desc: Transfer hub airport, e.g. DXB
  sql: |
    SELECT s.route_id, s.origin_airport, s.destination_airport, s.via_hub, s.carrier_id, car.name AS carrier_name,
           s.rate_gbp_per_kg, round(s.rate_gbp_per_kg * $weight_kg, 2) AS total_gbp,
           s.sea_days, s.hub_transfer_days, s.air_days, s.total_transit_days, s.valid_until, s.notes
    FROM sea_air_routes s
    JOIN master.carriers car ON car.carrier_id = s.carrier_id
    WHERE s.origin_airport = UPPER($origin_airport) AND s.destination_airport = UPPER($destination_airport)
      AND ($via_hub IS NULL OR s.via_hub = UPPER($via_hub))
      AND s.min_weight_kg <= $weight_kg
      AND s.valid_until >= CAST($as_of AS DATE)
    ORDER BY s.total_transit_days, s.rate_gbp_per_kg
  example:
    origin_airport: DAC
    destination_airport: LHR
    weight_kg: 400
- name: get_next_day_delivery_rates_by_postcode
  desc: Carrier next-day cost per parcel drop by destination postcode area and origin DC, for a parcel weight, cheapest first. Use for e-commerce next-day eligibility.
  kind: sql
  args:
    postcode_area:
      type: str
      desc: Postcode area code or prefix, e.g. SW1A or LS
    weight_kg:
      type: float
      default: 1
      desc: Parcel weight in kg; returns the weight band covering it
  sql: |
    SELECT s.lane_id, s.destination AS postcode, s.origin AS origin_site, s.rate_gbp AS cost_per_drop_gbp,
           s.min_weight_kg, s.max_weight_kg, s.transit_days, s.unit AS service, s.rate_date
    FROM spot_rates s
    WHERE s.mode = 'parcel'
      AND s.transit_days <= 1
      AND s.rate_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
      AND s.rate_date <= CAST($as_of AS DATE)
      AND ($weight_kg IS NULL OR ($weight_kg > s.min_weight_kg AND $weight_kg <= s.max_weight_kg))
      AND ($postcode_area IS NULL OR upper(s.destination) LIKE upper($postcode_area) || '%')
    ORDER BY s.rate_gbp, s.destination
  limit: 30
  example: {}
