id: freight_rates
name: Freight Rate Management System
instructions: >
  Freight rates (spot and contract), air/sea/road quotes, transit times, market benchmarks and surcharges.
  Rate ids look like RAT-000123. Use it for current rates, quotes, forecasts, trends, benchmarks and surcharge impact.

tables:
  spot_rates:
    key: rate_id
    cols:
      rate_id: {type: str, desc: "Spot rate record, e.g. RAT-000123"}
      lane_id: {type: str, desc: "Lane identifier (origin-destination pair)"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: Transport mode}
      rate_date: {type: date, desc: Date rate was quoted}
      rate_gbp: {type: float, desc: Rate in GBP (per container/kg/drop etc)"}
      unit: {type: str, desc: "Rate unit, e.g. per 40ft container, per kg, per drop"}
      origin: {type: str, desc: "Origin port/airport/location"}
      destination: {type: str, desc: "Destination port/airport/location"}
      min_weight_kg: {type: float, desc: Minimum weight for rate"}
      max_weight_kg: {type: float, desc: Maximum weight for rate"}
      transit_days: {type: int, desc: Transit time in days}
      source: {type: str, desc: "Data source, e.g. carrier quote, market data"}

  contract_rates:
    key: contract_rate_id
    cols:
      contract_rate_id: {type: str, desc: "Contract rate, e.g. CTR-000123"}
      carrier_id: {type: str, desc: Carrier}
      lane_id: {type: str, desc: "Lane identifier"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: Transport mode}
      rate_from: {type: date, desc: Contract start date}
      rate_to: {type: date, desc: Contract end date}
      rate_gbp: {type: float, desc: Contracted rate in GBP}
      unit: {type: str, desc: Rate unit}
      min_volume_units: {type: int, desc: Minimum volume commitment}
      max_volume_units: {type: int, desc: Maximum volume per period}
      volume_period: {type: str, desc: "Period (monthly, quarterly, annual)"}
      volume_band: {type: str, desc: "Volume band (e.g. small, medium, large)"}
      status: {type: enum, values: [active, expired, under_review], desc: Contract status}

  air_freight_quotes:
    key: quote_id
    cols:
      quote_id: {type: str, desc: "Air freight quote, e.g. QTE-000123"}
      origin_airport: {type: str, desc: "Origin airport code"}
      destination_airport: {type: str, desc: "Destination airport code"}
      weight_kg: {type: int, desc: Total weight in kg}
      rate_gbp_per_kg: {type: float, desc: Rate per kg in GBP}
      total_gbp: {type: float, desc: Total quote in GBP}
      transit_days: {type: int, desc: Transit time in days}
      carrier_id: {type: str, desc: Carrier offering quote}
      quote_date: {type: date, desc: Date quote was generated}
      valid_until: {type: date, desc: Date quote expires}
      status: {type: enum, values: [quoted, accepted, booked, expired], desc: Quote status}
      notes: {type: str, desc: Special conditions or restrictions}

  rate_history:
    key: [lane_id, rate_date]
    cols:
      lane_id: {type: str, desc: "Lane identifier"}
      rate_date: {type: date, desc: Date of rate snapshot}
      mode: {type: enum, values: [sea, air, road, parcel], desc: Transport mode}
      spot_rate_gbp: {type: float, desc: Spot rate on this date}
      contract_rate_gbp: {type: float, desc: Contract rate on this date}
      contract_rate_pct: {type: float, desc: "Contract vs spot %"}
      rate_change_week: {type: float, desc: "Week-on-week change %"}
      rate_change_month: {type: float, desc: "Month-on-month change %"}
      rate_change_year: {type: float, desc: "Year-on-year change %"}

  market_benchmarks:
    key: benchmark_id
    cols:
      benchmark_id: {type: str, desc: "Benchmark, e.g. BEN-000123"}
      lane_id: {type: str, desc: "Lane identifier"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: Transport mode}
      volume_band: {type: str, desc: "Volume band (small/medium/large)"}
      benchmark_rate_gbp: {type: float, desc: Market benchmark rate in GBP}
      data_points: {type: int, desc: Number of quotes in benchmark}
      benchmark_date: {type: date, desc: Benchmark date}
      percentile_25_gbp: {type: float, desc: 25th percentile rate}
      percentile_50_gbp: {type: float, desc: 50th percentile (median) rate}
      percentile_75_gbp: {type: float, desc: 75th percentile rate}

  surcharges:
    key: surcharge_id
    cols:
      surcharge_id: {type: str, desc: "Surcharge, e.g. SUR-000123"}
      carrier_id: {type: str, desc: Carrier imposing surcharge}
      surcharge_type: {type: str, desc: "Type (fuel, congestion, security, equipment etc)"}
      start_date: {type: date, desc: Surcharge effective date}
      end_date: {type: date, desc: Surcharge end date}
      amount_gbp: {type: float, desc: Surcharge amount in GBP}
      applies_to_mode: {type: enum, values: [sea, air, road, parcel], desc: Mode affected}
      applies_to_lane: {type: str, desc: "Lane affected, blank if all"}
      status: {type: enum, values: [announced, effective, withdrawn], desc: Status}

  alternate_ports:
    key: route_id
    cols:
      route_id: {type: str, desc: "Alternate routing, e.g. ALT-000123"}
      primary_lane_id: {type: str, desc: "Primary lane (e.g. Vietnam-UK)"}
      origin_port: {type: str, desc: "Origin port code"}
      primary_dest_port: {type: str, desc: "Primary destination port"}
      alternate_dest_port: {type: str, desc: "Alternate destination port"}
      transit_days_primary: {type: int, desc: Transit time to primary port}
      transit_days_alternate: {type: int, desc: Transit time to alternate port"}
      rate_gbp_sea: {type: float, desc: "Sea freight rate in GBP"}
      rate_gbp_rail: {type: float, desc: "Rail (if rail routing available) in GBP"}
      total_transit_days: {type: int, desc: Total door-to-door transit time}
      cost_gbp: {type: float, desc: Total cost for option}
      status: {type: enum, values: [active, seasonal, limited], desc: Availability}

  rate_forecast:
    key: forecast_id
    cols:
      forecast_id: {type: str, desc: "Forecast, e.g. FRC-000123"}
      lane_id: {type: str, desc: "Lane identifier"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: Transport mode}
      forecast_date: {type: date, desc: Date forecast is for}
      forecast_gbp: {type: float, desc: Forecasted rate in GBP}
      confidence_pct: {type: int, desc: Forecast confidence (0-100)"}
      trend: {type: enum, values: [rising, stable, falling], desc: Direction of trend}
      notes: {type: str, desc: Driver or rationale}

  transit_times:
    key: transit_id
    cols:
      transit_id: {type: str, desc: "Transit time record, e.g. TRN-000123"}
      lane_id: {type: str, desc: "Lane identifier"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: Transport mode}
      origin: {type: str, desc: "Origin"}
      destination: {type: str, desc: "Destination"}
      transit_days_scheduled: {type: int, desc: Scheduled transit time"}
      transit_days_actual_avg: {type: float, desc: "Actual average transit time"}
      reliability_pct: {type: float, desc: "On-time delivery %"}
      data_period: {type: str, desc: "Period covered (e.g. last 12 weeks)"}

  rate_indices:
    key: [index_name, index_date]
    cols:
      index_name: {type: str, desc: "Index name (e.g. SCFI, WCI, TAC Index)"}
      index_date: {type: date, desc: "Date of index reading"}
      index_value: {type: float, desc: "Index value"}
      week_change_pct: {type: float, desc: "Week-on-week change %"}
      year_change_pct: {type: float, desc: "Year-on-year change %"}
      mode: {type: enum, values: [sea, air, road], desc: Mode the index covers}

  booking_volumes:
    key: [lane_id, booking_period]
    cols:
      lane_id: {type: str, desc: "Lane identifier"}
      booking_period: {type: str, desc: "Period (e.g. 2026-Q4)"}
      contract_volume_units: {type: int, desc: "Units booked on contract"}
      spot_volume_units: {type: int, desc: "Units booked on spot"}
      total_volume_units: {type: int, desc: "Total units"}
      contract_pct: {type: float, desc: "Contract as % of total"}
      spot_pct: {type: float, desc: "Spot as % of total"}

  freight_emissions:
    key: [lane_id, shipment_type]
    cols:
      lane_id: {type: str, desc: "Lane identifier"}
      shipment_type: {type: enum, values: [sea, air], desc: "Sea or air shipment"}
      mode: {type: str, desc: "Mode detail (e.g. 40ft container, typical container)"}
      weight_kg: {type: int, desc: "Weight in kg"}
      emissions_co2e_kg: {type: float, desc: "CO2e emissions per shipment in kg"}
      emissions_co2e_per_kg: {type: float, desc: "Emissions per kg in kg"}
      data_source: {type: str, desc: "Source of emissions data"}

tools:
  - name: get_spot_container_rates_by_lane
    desc: Spot container rates by port pair, with trend over last 12 weeks.
    kind: sql
    args:
      origin_port: {type: str, desc: "Origin port code, e.g. CNSHA (Shanghai)", required: true}
      destination_port: {type: str, desc: "Destination port code, e.g. GBFXT (Felixstowe)", required: true}
    sql: |
      SELECT s.lane_id, s.rate_date, s.rate_gbp, s.transit_days, r.rate_change_week, r.rate_change_month
      FROM spot_rates s
      LEFT JOIN rate_history r ON s.lane_id = r.lane_id AND s.rate_date = r.rate_date
      WHERE s.mode = 'sea'
        AND s.origin = $origin_port
        AND s.destination = $destination_port
        AND s.rate_date >= CAST($as_of AS DATE) - INTERVAL 12 WEEK
      ORDER BY s.rate_date DESC
      LIMIT 50
    example: {origin_port: VNHCM, destination_port: GBFXT}

  - name: get_contract_container_rates_by_lane
    desc: Contracted 40ft container rates by port pair with carriers and terms.
    kind: sql
    args:
      origin_port: {type: str, desc: "Origin port code", required: true}
      destination_port: {type: str, desc: "Destination port code", required: true}
    sql: |
      SELECT c.contract_rate_id, c.carrier_id, car.name AS carrier_name, c.rate_gbp, c.volume_band,
             c.min_volume_units, c.rate_from, c.rate_to, c.status
      FROM contract_rates c
      JOIN master.carriers car ON c.carrier_id = car.carrier_id
      WHERE c.mode = 'sea'
        AND UPPER(c.lane_id) = UPPER($origin_port || '-' || $destination_port)
        AND c.rate_from <= $as_of AND c.rate_to >= CAST($as_of AS DATE)
      ORDER BY c.rate_gbp
    example: {origin_port: VNHCM, destination_port: GBFXT}

  - name: get_rate_trend_by_lane
    desc: Freight rate trend for a lane over 12 weeks, with percentage changes.
    kind: sql
    args:
      origin_port: {type: str, desc: "Origin port code", required: true}
      destination_port: {type: str, desc: "Destination port code", required: true}
      mode: {type: enum, values: [sea, air, road, parcel], desc: "Transport mode"}
    sql: |
      SELECT r.rate_date, r.spot_rate_gbp, r.contract_rate_gbp, r.rate_change_week,
             r.rate_change_month, r.rate_change_year, r.mode
      FROM rate_history r
      WHERE UPPER(r.lane_id) = UPPER($origin_port || '-' || $destination_port)
        AND ($mode IS NULL OR r.mode = $mode)
        AND r.rate_date >= CAST($as_of AS DATE) - INTERVAL 12 WEEK
      ORDER BY r.rate_date DESC
      LIMIT 52
    example: {origin_port: VNHCM, destination_port: GBFXT, mode: sea}

  - name: get_rate_index_history
    desc: Freight rate index history with year-on-year and week-on-week changes.
    kind: sql
    args:
      index_name: {type: str, desc: "Index name, e.g. SCFI (Shanghai Container Freight Index)"}
      weeks_back: {type: int, desc: "Number of weeks of history to show", default: 12}
    sql: |
      SELECT index_name, index_date, index_value, week_change_pct, year_change_pct, mode
      FROM rate_indices
      WHERE ($index_name IS NULL OR index_name = $index_name)
        AND index_date >= $as_of - INTERVAL ($weeks_back * 7) DAY
      ORDER BY index_name, index_date DESC
      LIMIT 200
    example: {index_name: SCFI}

  - name: get_contract_vs_spot_mix
    desc: Share of volume booked on contract versus spot market by lane and period.
    kind: sql
    args:
      lane_id: {type: str, desc: "Lane identifier, e.g. HCM-FXT"}
      period: {type: str, desc: "Period, e.g. 2026-Q4", required: true}
    sql: |
      SELECT lane_id, booking_period, contract_volume_units, spot_volume_units,
             total_volume_units, contract_pct, spot_pct
      FROM booking_volumes
      WHERE ($lane_id IS NULL OR lane_id = $lane_id)
        AND booking_period = $period
      ORDER BY lane_id
    example: {period: 2026-Q4}

  - name: get_air_freight_quote
    desc: Air freight quote for shipment by weight, origin and destination.
    kind: sql
    args:
      origin_airport: {type: str, desc: "Origin airport code, e.g. DAC (Dhaka)", required: true}
      destination_airport: {type: str, desc: "Destination airport code, e.g. LHR (London)", required: true}
      weight_kg: {type: int, desc: "Shipment weight in kg", required: true}
    sql: |
      SELECT q.quote_id, q.rate_gbp_per_kg, ROUND(q.rate_gbp_per_kg * $weight_kg, 2) AS total_gbp,
             q.transit_days, q.carrier_id, car.name AS carrier_name, q.quote_date, q.valid_until
      FROM air_freight_quotes q
      JOIN master.carriers car ON q.carrier_id = car.carrier_id
      WHERE q.origin_airport = $origin_airport
        AND q.destination_airport = $destination_airport
        AND q.valid_until >= CAST($as_of AS DATE)
        AND q.status IN ('quoted', 'accepted')
      ORDER BY q.rate_gbp_per_kg
      LIMIT 10
    example: {origin_airport: DAC, destination_airport: LHR, weight_kg: 5000}

  - name: get_air_freight_rates_by_origin
    desc: Current air freight rates by origin airport with destinations served.
    kind: sql
    args:
      origin_airport: {type: str, desc: "Origin airport code, e.g. DAC", required: true}
      year_back: {type: int, desc: "Years of rate history", default: 1}
    sql: |
      SELECT DISTINCT q.origin_airport, q.destination_airport, q.rate_gbp_per_kg,
             q.transit_days, q.carrier_id, car.name AS carrier_name, q.quote_date
      FROM air_freight_quotes q
      JOIN master.carriers car ON q.carrier_id = car.carrier_id
      WHERE q.origin_airport = $origin_airport
        AND q.valid_until >= $as_of
        AND q.quote_date >= $as_of - INTERVAL ($year_back * 365) DAY
      ORDER BY q.rate_gbp_per_kg
      LIMIT 30
    example: {origin_airport: DAC}

  - name: get_air_rate_history
    desc: Historic air freight rates by origin airport with trend.
    kind: sql
    args:
      origin_airport: {type: str, desc: "Origin airport code", required: true}
      destination_airport: {type: str, desc: "Destination airport code"}
      months_back: {type: int, desc: "Months of history", default: 12}
    sql: |
      SELECT q.quote_date, q.origin_airport, q.destination_airport, q.rate_gbp_per_kg,
             LAG(q.rate_gbp_per_kg) OVER (PARTITION BY q.destination_airport ORDER BY q.quote_date) AS prev_rate,
             ROUND(((q.rate_gbp_per_kg - LAG(q.rate_gbp_per_kg) OVER (PARTITION BY q.destination_airport ORDER BY q.quote_date)) /
                    LAG(q.rate_gbp_per_kg) OVER (PARTITION BY q.destination_airport ORDER BY q.quote_date)) * 100, 1) AS rate_change_pct
      FROM air_freight_quotes q
      WHERE q.origin_airport = $origin_airport
        AND ($destination_airport IS NULL OR q.destination_airport = $destination_airport)
        AND q.quote_date >= $as_of - INTERVAL ($months_back * 30) DAY
      ORDER BY q.destination_airport, q.quote_date DESC
      LIMIT 100
    example: {origin_airport: DAC}

  - name: get_alternate_port_options_and_rates
    desc: Alternate routing options and rates for a lane (e.g. transhipment or rail).
    kind: sql
    args:
      origin_port: {type: str, desc: "Origin port code", required: true}
      destination_port: {type: str, desc: "Destination port code", required: true}
    sql: |
      SELECT r.route_id, r.primary_dest_port, r.alternate_dest_port, r.transit_days_primary,
             r.transit_days_alternate, r.rate_gbp_sea, r.rate_gbp_rail, r.total_transit_days,
             r.cost_gbp, r.status
      FROM alternate_ports r
      WHERE r.origin_port = $origin_port
        AND r.primary_dest_port = $destination_port
        AND r.status IN ('active', 'seasonal')
      ORDER BY r.cost_gbp, r.total_transit_days
    example: {origin_port: VNHCM, destination_port: GBFXT}

  - name: get_sea_air_routing_quote
    desc: Sea-air routing options with cost, transit time and break-even point.
    kind: sql
    args:
      origin_port: {type: str, desc: "Origin port code"}
      transhipment_port: {type: str, desc: "Transhipment hub (e.g. DXB for Dubai)"}
      destination_airport: {type: str, desc: "Destination airport code"}
      weight_kg: {type: int, desc: "Weight in kg"}
    sql: |
      SELECT 'sea-air via ' || $transhipment_port AS routing_option,
             COALESCE(ROUND(s.rate_gbp, 2), 0) AS sea_leg_gbp,
             COALESCE(ROUND(q.rate_gbp_per_kg * $weight_kg, 2), 0) AS air_leg_gbp,
             COALESCE(ROUND(s.rate_gbp, 2), 0) + COALESCE(ROUND(q.rate_gbp_per_kg * $weight_kg, 2), 0) AS total_gbp,
             COALESCE(s.transit_days, 0) + COALESCE(q.transit_days, 0) AS total_transit_days
      FROM spot_rates s
      FULL OUTER JOIN air_freight_quotes q ON q.origin_airport = $transhipment_port
      WHERE s.origin = $origin_port AND s.destination = $transhipment_port AND s.mode = 'sea'
        AND q.destination_airport = $destination_airport AND q.valid_until >= CAST($as_of AS DATE)
      LIMIT 5
    example: {origin_port: VNHCM, transhipment_port: AEDXB, destination_airport: LHR, weight_kg: 5000}

  - name: get_annual_carrier_spend_forecast
    desc: Forecast carrier spend for the next 12 months by carrier and mode.
    kind: sql
    args:
      carrier_id: {type: str, desc: "Carrier, or blank for all"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: "Transport mode"}
    sql: |
      SELECT c.carrier_id, car.name AS carrier_name, c.mode,
             ROUND(COALESCE(AVG(c.rate_gbp * COALESCE(bv.total_volume_units, 100)), 0), 2) AS forecast_annual_gbp
      FROM contract_rates c
      JOIN master.carriers car ON c.carrier_id = car.carrier_id
      LEFT JOIN booking_volumes bv ON bv.lane_id = c.lane_id
      WHERE ($carrier_id IS NULL OR c.carrier_id = $carrier_id)
        AND ($mode IS NULL OR c.mode = $mode)
        AND c.rate_from <= $as_of
        AND c.rate_to >= $as_of
      GROUP BY c.carrier_id, car.name, c.mode
      ORDER BY forecast_annual_gbp DESC
      LIMIT 20
    example: {mode: sea}

  - name: get_carrier_contract_rates
    desc: Current contract rates with a carrier across all lanes and modes.
    kind: sql
    args:
      carrier_id: {required: true}
    sql: |
      SELECT c.contract_rate_id, c.lane_id, c.mode, c.rate_gbp, c.unit, c.volume_band,
             c.min_volume_units, c.rate_from, c.rate_to, c.status
      FROM contract_rates c
      WHERE c.carrier_id = $carrier_id
        AND c.rate_from <= CAST($as_of AS DATE)
        AND c.rate_to >= CAST($as_of AS DATE)
      ORDER BY c.mode, c.lane_id
      LIMIT 50
    example: {carrier_id: CAR-007}

  - name: get_freight_rate_for_lane
    desc: Current freight rate for a specific lane (sea/air/road) by date and mode.
    kind: sql
    args:
      lane_id: {type: str, desc: "Lane identifier, e.g. HCM-FXT"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: "Transport mode"}
    sql: |
      SELECT s.lane_id, s.rate_date, s.rate_gbp, s.unit, s.origin, s.destination,
             s.transit_days, c.rate_gbp AS contract_rate_gbp
      FROM spot_rates s
      LEFT JOIN contract_rates c ON c.lane_id = s.lane_id AND c.mode = s.mode
      WHERE s.lane_id = $lane_id
        AND s.mode = $mode
        AND s.rate_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
      ORDER BY s.rate_date DESC
      LIMIT 30
    example: {lane_id: HCM-FXT, mode: sea}

  - name: get_freight_rate_forecast
    desc: Contract and spot freight rate outlook by lane for next 12 weeks.
    kind: sql
    args:
      lane_id: {type: str, desc: "Lane identifier"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: "Transport mode"}
    sql: |
      SELECT f.lane_id, f.forecast_date, f.forecast_gbp, f.trend, f.confidence_pct, f.notes
      FROM rate_forecast f
      WHERE ($lane_id IS NULL OR f.lane_id = $lane_id)
        AND ($mode IS NULL OR f.mode = $mode)
        AND f.forecast_date >= CAST($as_of AS DATE)
        AND f.forecast_date <= CAST($as_of AS DATE) + INTERVAL 12 WEEK
      ORDER BY f.lane_id, f.forecast_date
      LIMIT 50
    example: {mode: sea}

  - name: get_air_freight_rates
    desc: Current air freight rates by lane (origin-destination pair).
    kind: sql
    args:
      mode: {type: enum, values: [air], desc: "Always air"}
      min_weight_kg: {type: int, desc: "Minimum shipment weight"}
    sql: |
      SELECT DISTINCT q.origin_airport, q.destination_airport, q.rate_gbp_per_kg,
             q.transit_days, q.carrier_id, car.name AS carrier_name, q.quote_date
      FROM air_freight_quotes q
      JOIN master.carriers car ON q.carrier_id = car.carrier_id
      WHERE q.valid_until >= CAST($as_of AS DATE)
        AND q.quote_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
        AND ($min_weight_kg IS NULL OR q.weight_kg >= $min_weight_kg)
      ORDER BY q.origin_airport, q.destination_airport, q.rate_gbp_per_kg
      LIMIT 50
    example: {}

  - name: get_ocean_freight_rates_for_lane
    desc: Ocean freight rates for a specific lane.
    kind: sql
    args:
      origin_port: {type: str, desc: "Origin port code"}
      destination_port: {type: str, desc: "Destination port code"}
    sql: |
      SELECT s.lane_id, s.rate_date, s.rate_gbp, s.unit, s.transit_days, c.rate_gbp AS contract_rate_gbp
      FROM spot_rates s
      LEFT JOIN contract_rates c ON c.lane_id = s.lane_id
      WHERE s.origin = $origin_port
        AND s.destination = $destination_port
        AND s.mode = 'sea'
        AND s.rate_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
      ORDER BY s.rate_date DESC
      LIMIT 30
    example: {origin_port: VNHCM, destination_port: GBFXT}

  - name: compare_rates_to_benchmark
    desc: Compare our contract rates to market benchmark for a lane.
    kind: sql
    args:
      lane_id: {type: str, desc: "Lane identifier"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: "Transport mode"}
    sql: |
      SELECT c.lane_id, c.carrier_id, car.name AS carrier_name, c.rate_gbp AS our_rate_gbp,
             b.benchmark_rate_gbp, b.percentile_25_gbp, b.percentile_50_gbp, b.percentile_75_gbp,
             ROUND(((c.rate_gbp - b.benchmark_rate_gbp) / b.benchmark_rate_gbp) * 100, 1) AS variance_pct,
             CASE WHEN c.rate_gbp < b.percentile_25_gbp THEN 'better than 75%'
                  WHEN c.rate_gbp < b.percentile_50_gbp THEN 'better than 50%'
                  WHEN c.rate_gbp < b.percentile_75_gbp THEN 'better than 25%'
                  ELSE 'above market' END AS competitive_position
      FROM contract_rates c
      JOIN master.carriers car ON c.carrier_id = car.carrier_id
      JOIN market_benchmarks b ON c.lane_id = b.lane_id AND c.mode = b.mode
      WHERE c.lane_id = $lane_id
        AND c.mode = $mode
        AND c.rate_from <= CAST($as_of AS DATE)
        AND c.rate_to >= CAST($as_of AS DATE)
        AND b.benchmark_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
      ORDER BY c.rate_gbp
    example: {lane_id: HCM-FXT, mode: sea}

  - name: get_market_benchmark_rates
    desc: Benchmark market rates for comparable volumes and lanes.
    kind: sql
    args:
      mode: {type: enum, values: [sea, air, road, parcel], desc: "Transport mode"}
      volume_band: {type: str, desc: "Volume band (small/medium/large)"}
    sql: |
      SELECT b.lane_id, b.volume_band, b.benchmark_rate_gbp, b.percentile_25_gbp,
             b.percentile_50_gbp, b.percentile_75_gbp, b.data_points, b.benchmark_date
      FROM market_benchmarks b
      WHERE b.mode = $mode
        AND ($volume_band IS NULL OR b.volume_band = $volume_band)
        AND b.benchmark_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
      ORDER BY b.lane_id, b.benchmark_date DESC
      LIMIT 50
    example: {mode: sea, volume_band: large}

  - name: get_parcel_rates_by_service
    desc: Parcel rates by service level (next day, 2-3 day) and weight band.
    kind: sql
    args:
      service_level: {type: str, desc: "Service, e.g. next_day, 2_3_day"}
      weight_kg: {type: int, desc: "Shipment weight in kg"}
    sql: |
      SELECT c.carrier_id, car.name AS carrier_name, c.rate_gbp, c.unit, c.volume_band
      FROM contract_rates c
      JOIN master.carriers car ON c.carrier_id = car.carrier_id
      WHERE c.mode = 'parcel'
        AND c.rate_from <= CAST($as_of AS DATE)
        AND c.rate_to >= CAST($as_of AS DATE)
        AND ($service_level IS NULL OR c.lane_id ILIKE '%' || $service_level || '%')
      ORDER BY c.rate_gbp
      LIMIT 20
    example: {}

  - name: get_next_day_delivery_rates_by_postcode
    desc: Next day delivery carrier rates by UK postcode area.
    kind: sql
    args:
      postcode_area: {type: str, desc: "Postcode area (e.g. SW1, N1, M1)"}
    sql: |
      SELECT c.lane_id, c.carrier_id, car.name AS carrier_name, c.rate_gbp, c.unit
      FROM contract_rates c
      JOIN master.carriers car ON c.carrier_id = car.carrier_id
      WHERE c.mode = 'parcel'
        AND c.lane_id ILIKE '%' || $postcode_area || '%'
        AND c.lane_id ILIKE '%next_day%'
        AND c.rate_from <= CAST($as_of AS DATE)
        AND c.rate_to >= CAST($as_of AS DATE)
      ORDER BY c.rate_gbp
      LIMIT 10
    example: {postcode_area: SW1}

  - name: get_ocean_and_rail_rate_quote
    desc: Ocean plus rail through-rate options for a routing.
    kind: sql
    args:
      origin_port: {type: str, desc: "Origin port code"}
      rail_destination: {type: str, desc: "Rail destination, e.g. inland depot"}
    sql: |
      SELECT r.route_id, r.origin_port, r.primary_dest_port, r.alternate_dest_port,
             r.rate_gbp_sea + COALESCE(r.rate_gbp_rail, 0) AS total_cost_gbp,
             r.rate_gbp_sea, r.rate_gbp_rail, r.total_transit_days
      FROM alternate_ports r
      WHERE r.origin_port = $origin_port
        AND ($rail_destination IS NULL OR r.alternate_dest_port ILIKE '%' || $rail_destination || '%')
        AND r.rate_gbp_rail IS NOT NULL
      ORDER BY total_cost_gbp
      LIMIT 10
    example: {origin_port: VNHCM}

  - name: get_transit_time_by_lane
    desc: Transit time by lane and mode, with reliability data.
    kind: sql
    args:
      lane_id: {type: str, desc: "Lane identifier"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: "Transport mode"}
    sql: |
      SELECT t.lane_id, t.origin, t.destination, t.mode, t.transit_days_scheduled,
             t.transit_days_actual_avg, t.reliability_pct, t.data_period
      FROM transit_times t
      WHERE t.lane_id = $lane_id
        AND ($mode IS NULL OR t.mode = $mode)
      ORDER BY t.mode, t.lane_id
      LIMIT 10
    example: {lane_id: HCM-FXT, mode: sea}

  - name: get_freight_rate_history
    desc: Historical freight rates by lane and mode with trends.
    kind: sql
    args:
      lane_id: {type: str, desc: "Lane identifier"}
      mode: {type: enum, values: [sea, air, road, parcel], desc: "Transport mode"}
      months_back: {type: int, desc: "Months of history", default: 12}
    sql: |
      SELECT r.lane_id, r.rate_date, r.spot_rate_gbp, r.contract_rate_gbp,
             r.rate_change_week, r.rate_change_month, r.rate_change_year
      FROM rate_history r
      WHERE r.lane_id = $lane_id
        AND r.mode = $mode
        AND r.rate_date >= $as_of - INTERVAL ($months_back * 30) DAY
      ORDER BY r.rate_date DESC
      LIMIT 100
    example: {lane_id: VNHCM-GBFXT, mode: sea}

  - name: calculate_freight_saving_per_container
    desc: Calculate freight cost saving from packaging optimization per container.
    kind: sql
    args:
      current_weight_kg: {type: int, desc: "Current package weight in kg", required: true}
      new_weight_kg: {type: int, desc: "Optimized package weight in kg", required: true}
      containers_annual: {type: int, desc: "Containers per year", required: true}
      current_rate_gbp_per_kg: {type: float, desc: "Current rate per kg"}
    sql: |
      SELECT $current_weight_kg AS current_weight_kg,
             $new_weight_kg AS new_weight_kg,
             $containers_annual AS containers_annual,
             COALESCE($current_rate_gbp_per_kg, 0) AS rate_gbp_per_kg,
             ROUND(COALESCE($current_rate_gbp_per_kg, 0) * ($current_weight_kg - $new_weight_kg) * $containers_annual, 2) AS annual_saving_gbp,
             'saving = (current_weight - new_weight) * rate * annual_containers' AS formula
    example: {current_weight_kg: 15000, new_weight_kg: 13500, containers_annual: 100, current_rate_gbp_per_kg: 0.15}

  - name: calculate_surcharge_impact_on_bookings
    desc: Calculate surcharge cost impact on planned bookings by lane.
    kind: sql
    args:
      lane_id: {type: str, desc: "Lane identifier"}
      booking_volume_units: {type: int, desc: "Planned booking volume", required: true}
    sql: |
      SELECT s.surcharge_id, s.surcharge_type, s.amount_gbp,
             $booking_volume_units AS booking_volume_units,
             ROUND(s.amount_gbp * $booking_volume_units, 2) AS total_impact_gbp
      FROM surcharges s
      WHERE ($lane_id IS NULL OR s.applies_to_lane = $lane_id OR s.applies_to_lane IS NULL)
        AND s.start_date <= CAST($as_of AS DATE)
        AND s.end_date >= CAST($as_of AS DATE)
        AND s.status = 'effective'
      ORDER BY total_impact_gbp DESC
    example: {booking_volume_units: 500}

  - name: compare_air_sea_freight_cost_and_emissions
    desc: Compare air vs sea freight cost and CO2e emissions for a shipment.
    kind: sql
    args:
      shipment_weight_kg: {type: int, desc: "Shipment weight in kg", required: true}
      origin: {type: str, desc: "Origin port/airport"}
      destination: {type: str, desc: "Destination port/airport"}
    sql: |
      SELECT 'Air' AS mode, COALESCE(SUM(q.rate_gbp_per_kg * $shipment_weight_kg), 0) AS cost_gbp,
             COALESCE(AVG(e.emissions_co2e_kg), 0) AS emissions_co2e_kg
      FROM air_freight_quotes q
      FULL OUTER JOIN freight_emissions e ON e.shipment_type = 'air'
      WHERE q.valid_until >= CAST($as_of AS DATE)
      UNION ALL
      SELECT 'Sea' AS mode, COALESCE(AVG(s.rate_gbp), 0) AS cost_gbp,
             COALESCE(AVG(e.emissions_co2e_kg), 0) AS emissions_co2e_kg
      FROM spot_rates s
      FULL OUTER JOIN freight_emissions e ON e.shipment_type = 'sea'
      WHERE s.rate_date >= CAST($as_of AS DATE) - INTERVAL 30 DAY
      ORDER BY cost_gbp
    example: {shipment_weight_kg: 5000}
