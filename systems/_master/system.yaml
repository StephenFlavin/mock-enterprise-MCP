id: master
name: Master data (shared, not an MCP server)
instructions: Shared reference and spine data readable by every system as master.<table>.
tables:
  calendar:
    key: date
    shift: false
    cols:
      date: {type: date, desc: Calendar date}
      fy: {type: str, desc: "Financial year, e.g. FY27 (Feb 2026-Jan 2027)"}
      fy_period: {type: int, desc: Financial period 1-12}
      fy_week: {type: int, desc: Financial week 1-53}
      cal_quarter: {type: str, desc: "Calendar quarter, e.g. 2026-Q3"}
      season: {type: enum, values: [SS, AW], desc: Trading season}
      is_peak: {type: bool, desc: True from mid-November to end of December}
  legal_entities:
    key: entity_id
    cols:
      entity_id: {type: str, desc: "Legal entity, e.g. LE-UK"}
      name: {type: str, desc: Legal entity name}
      country: {type: str, desc: ISO country code}
      currency: {type: str, desc: Functional currency}
  sites:
    key: site_id
    cols:
      site_id: {type: str, desc: "Site id: DC1-DC8 for distribution centres, ST001-ST259 for stores, HQ1/HK1 offices"}
      name: {type: str, desc: Site name}
      type: {type: enum, values: [dc, store, office], desc: Site type}
      format: {type: str, desc: "Store format (high_street, retail_park, outlet, shopping_centre, travel) or DC role"}
      country: {type: str, desc: ISO country code}
      region: {type: str, desc: "Trading region, e.g. UK North, UK South, Ireland, EU Central, US"}
      city: {type: str, desc: City}
      cluster: {type: str, desc: "Store cluster A (largest) to D (smallest)"}
      entity_id: {type: str, desc: Owning legal entity}
      opened_date: {type: date, desc: Opening date}
      sqft: {type: int, desc: Floor area in square feet}
      status: {type: enum, values: [open, closed, refit, planned], desc: Site status}
  locations:
    key: location_id
    desc: DC bin locations
    cols:
      location_id: {type: str, desc: "Bin location, e.g. DC1-C-14-02 (DC-aisle-bay-level)"}
      site_id: {type: str, desc: DC site id}
      zone: {type: enum, values: [pick, reserve, bulk, mezzanine, hazmat, returns], desc: Warehouse zone}
      aisle: {type: str, desc: Aisle letter}
      bay: {type: int, desc: Bay number}
      level: {type: int, desc: Level (1 = floor)}
      location_type: {type: enum, values: [pick_face, reserve, bulk_floor, overflow], desc: Location type}
      max_weight_kg: {type: float, desc: Maximum load in kg}
      max_height_cm: {type: int, desc: Maximum pallet height in cm}
      status: {type: enum, values: [active, blocked, damaged, inactive], desc: Location status}
  assets:
    key: asset_id
    desc: DC equipment and building assets (shared by maintenance, control, safety and finance systems)
    cols:
      asset_id: {type: str, desc: "Equipment asset, e.g. AST-DC2-SHT-04 (name also accepted)"}
      name: {type: str, desc: Asset name}
      site_id: {type: str, desc: DC where the asset is}
      asset_class: {type: enum, values: [shuttle, conveyor, sorter, motor, gearbox, sensor, forklift, reach_truck, dock_leveller, sprinkler, racking, charger, compressor], desc: Asset class}
      parent_asset_id: {type: str, desc: Parent system the component belongs to}
      location: {type: str, desc: "Where in the DC, e.g. aisle C or sorter induct 2"}
      manufacturer: {type: str, desc: Manufacturer}
      model: {type: str, desc: Model}
      install_date: {type: date, desc: Installation date}
      software_version: {type: str, desc: Controller software version (automation only)}
      replacement_cost_gbp: {type: float, desc: Replacement cost in GBP}
      criticality: {type: enum, values: [high, medium, low], desc: Impact on throughput if it fails}
      status: {type: enum, values: [in_service, degraded, out_of_service, retired], desc: Asset status}
  products:
    key: sku
    cols:
      sku: {type: str, desc: "SKU, e.g. SKU-100234 (a few legacy SKUs look like PF-220)"}
      style_id: {type: str, desc: "Style, e.g. STY-5520"}
      name: {type: str, desc: Product name}
      department: {type: str, desc: "Department, e.g. Womenswear, Home"}
      category: {type: str, desc: "Category, e.g. Dresses, Bedding"}
      subcategory: {type: str, desc: Subcategory}
      colour: {type: str, desc: Colour}
      size: {type: str, desc: Size}
      season: {type: str, desc: "Season code, e.g. AW26"}
      brand: {type: str, desc: Brand}
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      factory_id: {type: str, desc: "Factory, e.g. FAC-0107"}
      country_of_origin: {type: str, desc: ISO country code of manufacture}
      hs_code: {type: str, desc: Customs commodity code}
      unit_cost_gbp: {type: float, desc: Landed unit cost in GBP}
      retail_price_gbp: {type: float, desc: Full retail price in GBP}
      launch_date: {type: date, desc: First sale date}
      status: {type: enum, values: [active, new, clearance, discontinued], desc: Product status}
      abc_class: {type: enum, values: [A, B, C], desc: Sales velocity class}
      hazmat: {type: str, desc: "Hazard class: none, li_ion_battery, flammable_liquid, aerosol"}
      pack_type: {type: str, desc: "Pack type, e.g. polybag, carton, hanging"}
      weight_kg: {type: float, desc: Unit weight in kg}
      lead_time_days: {type: int, desc: Order-to-DC lead time in days}
      moq: {type: int, desc: Minimum order quantity}
  suppliers:
    key: supplier_id
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042 (name also accepted)"}
      name: {type: str, desc: Supplier name}
      country: {type: str, desc: ISO country code}
      category_focus: {type: str, desc: Main product department supplied}
      tier: {type: enum, values: [strategic, preferred, approved, probation], desc: Supplier tier}
      status: {type: enum, values: [active, onboarding, blocked, exited], desc: Supplier status}
      payment_terms_days: {type: int, desc: Payment terms in days}
      currency: {type: str, desc: Invoice currency}
      incoterm: {type: str, desc: Default Incoterm}
      onboarded_date: {type: date, desc: Date onboarded}
      annual_spend_gbp: {type: float, desc: Last 12 months spend in GBP}
      otif_pct_12m: {type: float, desc: On-time-in-full % last 12 months}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: Overall supplier risk}
      account_manager_id: {type: str, desc: Employee managing the supplier}
      supplier_type: {type: enum, values: [product, indirect], desc: "product (goods for resale) or indirect (packaging, energy, facilities, MRO, labour, racking)"}
  factories:
    key: factory_id
    cols:
      factory_id: {type: str, desc: "Factory, e.g. FAC-0107"}
      name: {type: str, desc: Factory name}
      supplier_id: {type: str, desc: Supplier that uses the factory}
      country: {type: str, desc: ISO country code}
      city: {type: str, desc: City}
      capacity_units_month: {type: int, desc: Monthly capacity in units}
      workers: {type: int, desc: Headcount}
      certifications: {type: str, desc: Semicolon-separated certifications}
      last_audit_date: {type: date, desc: Last social/quality audit date}
      audit_rating: {type: enum, values: [A, B, C, D], desc: Last audit grade}
      status: {type: enum, values: [approved, conditional, suspended, delisted], desc: Factory approval status}
  carriers:
    key: carrier_id
    cols:
      carrier_id: {type: str, desc: "Carrier or forwarder, e.g. CAR-007 (name also accepted)"}
      name: {type: str, desc: Carrier name}
      mode: {type: enum, values: [road, ocean, air, parcel, forwarder, rail], desc: Transport mode}
      scope: {type: str, desc: "Coverage, e.g. UK domestic, EU, global"}
      country: {type: str, desc: ISO country code of HQ}
      contract_end: {type: date, desc: Current contract end date}
  ports:
    key: port_code
    cols:
      port_code: {type: str, desc: "UN/LOCODE, e.g. GBFXT (Felixstowe)"}
      name: {type: str, desc: Port name}
      country: {type: str, desc: ISO country code}
      region: {type: str, desc: "Region, e.g. Asia, Europe"}
  airports:
    key: iata_code
    cols:
      iata_code: {type: str, desc: "IATA airport code, e.g. LHR"}
      name: {type: str, desc: Airport name}
      city: {type: str, desc: City}
      country: {type: str, desc: ISO country code}
      region: {type: str, desc: "Region, e.g. Asia, Europe"}
  employees:
    key: employee_id
    cols:
      employee_id: {type: str, desc: "Employee, e.g. EMP-01234 (name also accepted)"}
      name: {type: str, desc: Full name}
      role: {type: str, desc: Job title}
      department: {type: str, desc: Department}
      site_id: {type: str, desc: Home site}
      shift: {type: enum, values: [early, late, night, days, office], desc: Shift pattern}
      start_date: {type: date, desc: Start date}
      manager_id: {type: str, desc: Line manager employee id}
      status: {type: enum, values: [active, leaver, agency], desc: Employment status}
  cost_centres:
    key: cost_centre_id
    cols:
      cost_centre_id: {type: str, desc: "Cost centre, e.g. CC-2101"}
      name: {type: str, desc: Cost centre name}
      function: {type: str, desc: "Function, e.g. Logistics, Stores, Buying"}
      site_id: {type: str, desc: "Site, if site-based"}
      entity_id: {type: str, desc: Legal entity}
      owner_id: {type: str, desc: Budget owner employee id}
  partners:
    key: partner_id
    cols:
      partner_id: {type: str, desc: "Wholesale, franchise or marketplace partner, e.g. PTN-012"}
      name: {type: str, desc: Partner name}
      type: {type: enum, values: [wholesale, franchise, marketplace], desc: Partner type}
      country: {type: str, desc: ISO country code}
      since: {type: date, desc: Relationship start}
      status: {type: enum, values: [active, on_hold, ended], desc: Partner status}
  customers:
    key: customer_id
    cols:
      customer_id: {type: str, desc: "Customer, e.g. CUS-004512"}
      segment: {type: str, desc: "Segment, e.g. loyal, lapsed, new, high_value"}
      region: {type: str, desc: Home region}
      country: {type: str, desc: ISO country code}
      joined_date: {type: date, desc: Account creation date}
      loyalty_tier: {type: enum, values: [none, silver, gold, platinum], desc: Loyalty tier}
  orders:
    key: order_id
    desc: Customer orders (online, click and collect, marketplace), last 120 days
    cols:
      order_id: {type: str, desc: "Customer order, e.g. ORD-2026-0123456"}
      customer_id: {type: str, desc: Customer}
      order_date: {type: date, desc: Order date}
      channel: {type: enum, values: [web, app, click_collect, marketplace], desc: Sales channel}
      fulfil_site_id: {type: str, desc: DC or store that fulfils the order}
      country: {type: str, desc: Delivery country}
      units: {type: int, desc: Units ordered}
      value_gbp: {type: float, desc: Order value in GBP}
      delivery_service: {type: enum, values: [standard, next_day, same_day, collect], desc: Delivery service}
      status: {type: enum, values: [placed, picking, shipped, delivered, cancelled, returned, part_returned], desc: Order status}
  purchase_orders:
    key: po_id
    cols:
      po_id: {type: str, desc: "Purchase order, e.g. PO-2026-004512"}
      supplier_id: {type: str, desc: Supplier}
      factory_id: {type: str, desc: Factory}
      order_date: {type: date, desc: Date raised}
      ship_date: {type: date, desc: Planned ex-factory date}
      due_date: {type: date, desc: Due-in-DC date}
      dest_site_id: {type: str, desc: Destination DC}
      mode: {type: enum, values: [sea, air, road, rail], desc: Inbound mode}
      incoterm: {type: str, desc: Incoterm}
      currency: {type: str, desc: PO currency}
      season: {type: str, desc: Season code}
      total_units: {type: int, desc: Units on the PO}
      total_value: {type: float, desc: PO value in PO currency}
      buyer_id: {type: str, desc: Buyer employee id}
      status: {type: enum, values: [draft, open, confirmed, shipped, received, closed, cancelled], desc: PO status}
  po_lines:
    key: [po_id, line_no]
    cols:
      po_id: {type: str, desc: Purchase order}
      line_no: {type: int, desc: Line number}
      sku: {type: str, desc: SKU}
      qty_ordered: {type: int, desc: Units ordered}
      unit_cost: {type: float, desc: Unit cost in PO currency}
      qty_received: {type: int, desc: Units received so far}
  shipments:
    key: shipment_id
    desc: Inbound international shipments (one per PO; containers for sea)
    cols:
      shipment_id: {type: str, desc: "Inbound shipment, e.g. SHP-0004512"}
      po_id: {type: str, desc: Purchase order}
      carrier_id: {type: str, desc: Carrier or forwarder}
      mode: {type: enum, values: [sea, air, road, rail], desc: Mode}
      origin_port: {type: str, desc: Origin port code}
      dest_port: {type: str, desc: Destination port code}
      container_no: {type: str, desc: Container number (sea only)}
      teu: {type: float, desc: Twenty-foot equivalent units}
      etd: {type: date, desc: Estimated departure}
      atd: {type: date, desc: Actual departure}
      eta: {type: date, desc: Estimated arrival at destination port}
      ata: {type: date, desc: Actual arrival}
      status: {type: enum, values: [booked, in_transit, at_port, customs_hold, delivered, delayed], desc: Shipment status}
  sales_weekly:
    key: [sku, week_start]
    desc: Units and revenue by SKU and week, last 52 weeks
    cols:
      sku: {type: str, desc: SKU}
      week_start: {type: date, desc: Monday of the week}
      store_units: {type: int, desc: Units sold in stores}
      online_units: {type: int, desc: Units sold online}
      revenue_gbp: {type: float, desc: Net revenue in GBP}
      avg_price_gbp: {type: float, desc: Average selling price in GBP}
      markdown_gbp: {type: float, desc: Markdown cost in GBP}
  dc_stock:
    key: [sku, site_id]
    desc: Current DC stock position
    cols:
      sku: {type: str, desc: SKU}
      site_id: {type: str, desc: DC}
      on_hand: {type: int, desc: Units on hand}
      allocated: {type: int, desc: Units allocated to orders or stores}
      available: {type: int, desc: On hand minus allocated}
      on_order: {type: int, desc: Units on open POs}
      stock_value_gbp: {type: float, desc: On-hand value at cost in GBP}
tools: []
