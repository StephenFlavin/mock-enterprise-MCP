- question: "05:44:Q6"
  story: >
    We track internal incidents by product type to understand enforcement trends. Past incidents for electrical items like PF-220
    (4 reported), K-1700 (2 reported) and SKU-100091 (3 reported) show electrical and quality risks.
    PF-220 has had 1 previous recall. These are high-risk product types.
  checks:
    - tool: get_internal_incident_history
      args: {sku: PF-220}
      expect: ["PF-220", "4"]
    - tool: get_internal_incident_history
      args: {}
      expect: ["incident_count"]

- question: "05:47:Q1"
  story: >
    Customer reports battery overheating in PF-220 portable fan (INC-900001) three days ago.
    Batch PF-220-BATCH-001 from factory FAC-0027. Approximately 18,000 units sold.
    Recall case REC-900001 opened with stop-sale hold on the batch. Related products are checked against components.
  checks:
    - tool: get_incident_report
      args: {incident_id: INC-900001}
      expect: ["PF-220", "Battery overheating", "critical"]
    - tool: create_recall_case
      args: {incident_id: INC-900001, sku: PF-220, reason: "Battery overheating hazard", batch_id: "PF-220-BATCH-001", factory_id: "FAC-0027", units_affected: 18000}
      expect: ["REC-", "open"]

- question: "05:47:Q2"
  story: >
    For REC-900001 (PF-220 battery recall), we need regulatory notification. In UK, this is a safety recall (not withdrawal)
    requiring immediate TSS notification with 7-day deadline. In Germany and France similar deadlines apply.
    Regulatory notification drafted and ready to send once signed off.
  checks:
    - tool: get_incident_report
      args: {incident_id: INC-900001}
      expect: ["critical", "Battery"]
    - tool: draft_regulatory_notification
      args: {recall_id: REC-900001, country: GB}
      expect: ["REGULATORY NOTIFICATION", "PF-220"]
    - tool: send_regulatory_notification
      args: {recall_id: REC-900001, country: GB, regulator: "Trading Standards Service", notification_type: recall, deadline: "+7d", content: "Safety recall for PF-220 battery overheating."}
      expect: ["RGN-", "submitted"]

- question: "05:47:Q3"
  story: >
    Previous battery incidents show similar patterns: PF-220 (4 incidents, 1 recall), K-1700 (2 incidents).
    Past recall REC-900002 (K-1700 electrical hazard) cost approximately 225,000 GBP with 5,000 units.
    Worse cases involved delays in communication and customer confusion. Learning from these cases improves response.
  checks:
    - tool: get_internal_incident_history
      args: {sku: PF-220}
      expect: ["4", "incident_count"]
    - tool: get_historical_recall_costs
      args: {}
      expect: ["recall_id", "cost_estimate_gbp"]
    - tool: get_historical_recall_costs
      args: {sku: K-1700}
      expect: ["K-1700", "225"]

- question: "05:47:Q4"
  story: >
    For 18,000 units of PF-220 at retail price, total recall cost includes refunds, logistics,
    legal and comms fees. Cost estimate is calculated and updated on REC-900001.
  checks:
    - tool: calculate_recall_cost_estimate
      args: {units_affected: 18000, retail_price_gbp: 24.67, logistics_cost_per_unit_gbp: 7.5, legal_fees_gbp: 20000, comms_cost_gbp: 8000, insurance_recovery_pct: 25}
      expect: ["18000", "total_cost_gbp", "net_cost"]
    - tool: update_recall_case_cost_estimate
      args: {recall_id: REC-900001, cost_estimate_gbp: 400000}
      expect: ["400000"]

- question: "05:47:Q5"
  story: >
    Draft customer recall notice, store instructions, and press statement are prepared for REC-900001.
    Store instructions published to all stores with pull-and-quarantine action for batch PF-220-BATCH-001.
    Press statement initially drafted but legal requests it be held, so it's deleted.
  checks:
    - tool: get_incident_report
      args: {incident_id: INC-900001}
      expect: ["Battery overheating"]
    - tool: draft_customer_recall_notice
      args: {recall_id: REC-900001}
      expect: ["SAFETY NOTICE", "PF-220"]
    - tool: draft_store_instructions
      args: {recall_id: REC-900001}
      expect: ["PULL", "PF-220-BATCH-001"]
    - tool: draft_press_statement
      args: {recall_id: REC-900001}
      expect: ["FOR IMMEDIATE RELEASE"]
    - tool: send_store_instructions
      args: {recall_id: REC-900001, sku: PF-220, batch_id: "PF-220-BATCH-001", action: pull, content: "URGENT: Pull PF-220 batch PF-220-BATCH-001"}
      expect: ["STI-", "published"]
    - tool: delete_draft_press_statement
      args: {draft_id: DRF-900002}
      expect: ["deleted"]
