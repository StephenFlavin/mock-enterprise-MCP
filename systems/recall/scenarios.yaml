- question: "05:44:Q6"
  story: >
    Past incident history by product type. Kids' products are the riskiest group we have recorded: Babywear has 7 past
    incidents and 2 recalls (poppers detaching is the most common issue, then drawstring cords), Nightwear 1 recall
    (flammability), Schoolwear 1 withdrawal. Battery products (Personal Care) are the other hot spot. Master data has no toys
    category, so kids' clothing categories stand in for kids' products.
  checks:
    - tool: get_internal_incident_history
      args: {department: Kids}
      expect: ["Babywear", "Small parts: popper detached", "Nightwear", "Schoolwear"]
    - tool: get_internal_incident_history
      args: {}
      expect: ["Babywear", "Personal Care", "most_common_issue"]

- question: "05:47:Q1"
  story: >
    Four customer reports on PF-220, all quoting batch BATCH-PF220-2509-A (INC-900001 critical overheating, INC-900002 fire with a
    minor injury, INC-900003, INC-900006). A recall case is opened for INC-900001 for batch BATCH-PF220-2509-A from FAC-0027, 18,000 units.
  checks:
    - tool: get_incident_report
      args: {sku: PF-220}
      expect: ["BATCH-PF220-2509-A", "INC-900001", "critical", "4 rows"]
    - tool: get_incident_report
      args: {incident_id: INC-900001}
      expect: ["Battery overheating", "critical"]
    - tool: create_recall_case
      args: {incident_id: INC-900001, sku: PF-220, reason: "Battery overheating hazard", batch_id: "BATCH-PF220-2509-A", factory_id: "FAC-0027", units_affected: 18000}
      expect: ["REC-", "open", "BATCH-PF220-2509-A", "FAC-0027"]

- question: "05:47:Q2"
  story: >
    REC-900001 is a recall (units already with customers). UK regulator is Trading Standards (OPSS) with a 24 hour deadline,
    Germany 12 hours, France 6 hours (tightest). Director of Product Safety signs off. The UK notification is drafted then sent.
  checks:
    - tool: draft_regulatory_notification
      args: {recall_id: REC-900001, country: GB}
      expect: ["Trading Standards Service (OPSS)", "within 24 hours", "Director of Product Safety", "BATCH-PF220-2509-A"]
    - tool: draft_regulatory_notification
      args: {recall_id: REC-900001, country: FR}
      expect: ["DGCCRF", "within 6 hours"]
    - tool: send_regulatory_notification
      args: {recall_id: REC-900001, country: GB, regulator: "Trading Standards Service (OPSS)", notification_type: recall, deadline: "+1d", content: "Safety recall of PF-220 batch BATCH-PF220-2509-A: battery overheating."}
      expect: ["RGN-", "submitted", "GB"]

- question: "05:47:Q3"
  story: >
    Past battery incidents: REC-800001 (SKU-102289, 16,500 units, well handled, £781,652) and REC-800002 (SKU-100098, 9,000 units,
    worst: notice nine days late, national press, Trading Standards enquiry, £946,005). Smart Home REC-800003 and a Small Appliances
    withdrawal REC-800004 complete the set.
  checks:
    - tool: get_internal_incident_history
      args: {issue: battery}
      expect: ["REC-800002", "National press coverage for two weeks", "Notice went out nine days after", "REC-800001", "within 24 hours"]
    - tool: get_historical_recall_costs
      args: {reason: battery}
      expect: ["REC-800001", "781652", "REC-800002", "946005"]

- question: "05:47:Q4"
  story: >
    An 18,000 unit recall at £77.99: expected £1,015,292, worst case £1,888,320 before insurance (£1,510,656 after 20% recovery). Past battery
    recalls cost £47-£105 per unit affected. The estimate is recorded on REC-900001.
  checks:
    - tool: get_historical_recall_costs
      args: {reason: battery}
      expect: ["cost_per_unit_affected_gbp", "47.37", "105.11"]
    - tool: calculate_recall_cost_estimate
      args: {units_affected: 18000, retail_price_gbp: 77.99}
      expect: ["worst", "1888320", "1510656", "1015292"]
    - tool: update_recall_case_cost_estimate
      args: {recall_id: REC-900001, cost_estimate_gbp: 1015292}
      expect: ["892500", "1015292"]

- question: "05:47:Q5"
  story: >
    Drafts for REC-900001 in English, German and French. The press statement draft carries saved draft DRF-900002 and risky
    sentences (immediately, full transparency, caused by a supplier fault) next to drafting notes showing the first report preceded the
    recall and one report with an injury. Store instructions are published, and the press statement draft is deleted.
  checks:
    - tool: get_incident_report
      args: {incident_id: INC-900002}
      expect: ["minor", "caught fire"]
    - tool: draft_customer_recall_notice
      args: {recall_id: REC-900001}
      expect: ["SAFETY NOTICE", "BATCH-PF220-2509-A", "77.99"]
    - tool: draft_customer_recall_notice
      args: {recall_id: REC-900001, country: DE}
      expect: ["SICHERHEITSHINWEIS", "77.99"]
    - tool: draft_store_instructions
      args: {recall_id: REC-900001}
      expect: ["PULL AND QUARANTINE", "BATCH-PF220-2509-A"]
    - tool: draft_press_statement
      args: {recall_id: REC-900001}
      expect: ["DRF-900002", "FOR IMMEDIATE RELEASE", "reports with an injury: 1"]
    - tool: send_store_instructions
      args: {recall_id: REC-900001, sku: PF-220, batch_id: "BATCH-PF220-2509-A", action: pull, content: "Pull PF-220 batch BATCH-PF220-2509-A and quarantine it"}
      expect: ["STI-", "published"]
    - tool: delete_draft_press_statement
      args: {draft_id: DRF-900002}
      expect: ["deleted", "DRF-900002"]
