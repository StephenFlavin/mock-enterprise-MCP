id: recall
name: Incident & Recall Management System
instructions: >
  Product recalls and incident management. Customer incident reports (INC-000123), recall cases (REC-000123) with
  cost estimates, past recall costs and outcomes, regulator notifications by country (RGN-), store pull instructions
  (STI-) and draft customer/press/store communications (DRF-). Batch ids look like BATCH-PF220-2509-A.

tables:
  incidents:
    key: incident_id
    cols:
      incident_id: {type: str, desc: "Incident report, e.g. INC-900001"}
      sku: {desc: "SKU involved in incident"}
      reported_at: {type: timestamp, desc: When the incident was reported}
      customer_id: {desc: Customer reporting the issue}
      batch_id: {type: str, desc: "Batch code the customer quoted from the product label, if any, e.g. BATCH-PF220-2509-A"}
      description: {type: text, desc: Customer description of the issue}
      severity: {type: enum, values: [minor, moderate, severe, critical], desc: Severity level}
      injury_reported: {type: enum, values: [none, minor, serious], desc: Injury to a person reported by the customer}
      status: {type: enum, values: [open, investigating, resolved, recalled], desc: Incident status}

  recall_cases:
    key: recall_id
    cols:
      recall_id: {type: str, desc: "Recall case, e.g. REC-900001"}
      sku: {desc: "SKU being recalled"}
      incident_id: {type: str, desc: Linked incident report}
      reason: {type: text, desc: Recall reason}
      batch_id: {type: str, desc: "Batch identifier, e.g. BATCH-PF220-2509-A"}
      factory_id: {desc: "Factory that produced the batch"}
      status: {type: enum, values: [open, approved, in_progress, suspended, closed, withdrawn], desc: Recall status}
      units_affected: {type: int, desc: Estimated units in affected batch}
      cost_estimate_gbp: {type: float, desc: Current cost estimate in GBP}
      opened_at: {type: timestamp, desc: When the recall was opened}
      updated_at: {type: timestamp, desc: Last update}

  recall_costs:
    key: recall_id
    cols:
      recall_id: {type: str, desc: "Closed recall case these final costs belong to, e.g. REC-800001"}
      units_returned: {type: int, desc: Units returned or refunded by customers}
      refunds_gbp: {type: float, desc: Refunds paid to customers}
      logistics_gbp: {type: float, desc: Collection, return freight, storage and disposal}
      comms_gbp: {type: float, desc: Customer communications and press relations}
      legal_gbp: {type: float, desc: Legal and compliance fees}
      other_gbp: {type: float, desc: Testing, investigation and other costs}
      insurance_recovery_gbp: {type: float, desc: Recovered from insurance and the supplier}

  regulator_formats:
    key: [country, notification_type]
    cols:
      country: {type: str, desc: "ISO country code, e.g. GB, DE, FR, IE"}
      notification_type: {type: enum, values: [recall, withdrawal], desc: Type of notification}
      regulator: {type: str, desc: Regulator name}
      channel: {type: str, desc: How the notification is submitted}
      deadline_hours: {type: int, desc: Hours after the decision to recall or withdraw}
      format: {type: text, desc: What the notification must contain}
      legal_basis: {type: str, desc: Legal basis}
      signoff_role: {type: str, desc: Who signs the notification off}

  regulatory_notifications:
    key: notification_id
    cols:
      notification_id: {type: str, desc: "Notification, e.g. RGN-900001"}
      recall_id: {type: str, desc: Related recall case}
      country: {type: str, desc: "ISO country code, e.g. GB"}
      regulator: {type: str, desc: "Regulator name, e.g. Trading Standards Service (OPSS)"}
      notification_type: {type: enum, values: [recall, withdrawal], desc: Type of notification}
      status: {type: enum, values: [draft, submitted, acknowledged], desc: Status}
      sent_at: {type: timestamp, desc: When submitted to regulator}
      deadline: {type: date, desc: Deadline for action}
      content: {type: text, desc: Notification content}
      updated_at: {type: timestamp, desc: Last updated}

  store_instructions:
    key: instruction_id
    cols:
      instruction_id: {type: str, desc: "Instruction, e.g. STI-900001"}
      recall_id: {type: str, desc: Related recall case}
      sku: {desc: "SKU to pull"}
      batch_id: {type: str, desc: "Batch to pull"}
      action: {type: enum, values: [pull, quarantine, destroy, return_to_dc], desc: Action to take}
      status: {type: enum, values: [draft, published, executed, cancelled], desc: Status}
      published_at: {type: timestamp, desc: When published to stores}
      content: {type: text, desc: Store instruction content}
      updated_at: {type: timestamp, desc: Last updated}

  draft_communications:
    key: draft_id
    cols:
      draft_id: {type: str, desc: "Draft, e.g. DRF-900002"}
      recall_id: {type: str, desc: Related recall case}
      communication_type: {type: enum, values: [customer_notice, press_statement, regulatory_notification, store_instructions], desc: Type}
      content: {type: text, desc: Draft content}
      created_at: {type: timestamp, desc: When drafted}
      deleted_at: {type: timestamp, desc: "When deleted"}
      status: {type: enum, values: [draft, submitted, published, deleted], desc: Status}

  incident_history:
    key: history_id
    cols:
      history_id: {type: str, desc: "Past incident, e.g. HIST-0013"}
      sku: {desc: "SKU involved"}
      reported_at: {type: timestamp, desc: When reported}
      issue: {type: str, desc: "Issue, e.g. Battery overheating"}
      severity: {type: enum, values: [minor, moderate, severe, critical], desc: Severity level}
      units_sold: {type: int, desc: "Units sold of the affected product when it led to a recall or withdrawal, else 0"}
      outcome: {type: enum, values: [no_action, recall, withdrawal], desc: What we did}
      recall_id: {type: str, desc: "Recall case, if one was opened"}
      reputational_outcome: {type: text, desc: Press, regulator and sales impact afterwards}
      comms_lessons: {type: text, desc: What the communication did well or badly}

tools:
  - name: get_incident_report
    desc: Customer incident reports with description, severity, injury, batch code quoted and status, newest first. Look up by SKU or by incident id.
    kind: sql
    args:
      incident_id: {}
      sku: {}
      date_from: {type: date, default: "-90d", desc: Only reports from this date}
    sql: |
      SELECT i.incident_id, i.sku, p.name AS product, i.reported_at, i.customer_id, c.country AS customer_country,
             i.batch_id, i.description, i.severity, i.injury_reported, i.status
      FROM incidents i
      LEFT JOIN master.products p ON p.sku = i.sku
      LEFT JOIN master.customers c ON c.customer_id = i.customer_id
      WHERE ($incident_id IS NULL OR i.incident_id = $incident_id)
        AND ($sku IS NULL OR i.sku = $sku)
        AND CAST(i.reported_at AS DATE) >= CAST($date_from AS DATE)
      ORDER BY i.reported_at DESC
    limit: 20
    example: {sku: PF-220}

  - name: get_internal_incident_history
    desc: Our past incidents with recalls, costs and outcomes. Summary per product type by default; per case with press impact and communication lessons when sku or issue is given.
    kind: py
    fn: incident_history
    args:
      product_type: {type: str, desc: "Product category to include, e.g. Babywear, Personal Care, Smart Home"}
      department: {type: str, desc: "Product department, e.g. Kids, Electricals"}
      issue: {type: str, desc: "Words in the issue, e.g. battery, popper, drawstring"}
      sku: {}
      group_by: {type: enum, values: [product_type, case], desc: "product_type: one row per product type. case: one row per past incident. Default is case when sku or issue is given, otherwise product_type."}
      days: {type: int, default: 1460, desc: "Look back this many days"}
    example: {issue: battery}

  - name: get_historical_recall_costs
    desc: Final costs of past recalls - refunds, logistics, comms, legal, other, insurance recovery and cost per unit. Use to benchmark a new recall estimate.
    kind: sql
    args:
      sku: {}
      product_type: {type: str, desc: "Product category, e.g. Personal Care, Babywear"}
      reason: {type: str, desc: "Words in the recall reason, e.g. battery"}
      days: {type: int, default: 1460, desc: "Look back this many days"}
    sql: |
      SELECT r.recall_id, r.sku, p.category AS product_type, r.reason, r.units_affected, k.units_returned,
             k.refunds_gbp, k.logistics_gbp, k.comms_gbp, k.legal_gbp, k.other_gbp,
             round(k.refunds_gbp + k.logistics_gbp + k.comms_gbp + k.legal_gbp + k.other_gbp, 0) AS total_cost_gbp,
             k.insurance_recovery_gbp,
             round(k.refunds_gbp + k.logistics_gbp + k.comms_gbp + k.legal_gbp + k.other_gbp - k.insurance_recovery_gbp, 0) AS net_cost_gbp,
             round((k.refunds_gbp + k.logistics_gbp + k.comms_gbp + k.legal_gbp + k.other_gbp) / r.units_affected, 2) AS cost_per_unit_affected_gbp,
             CAST(r.opened_at AS DATE) AS opened
      FROM recall_cases r
      JOIN recall_costs k ON k.recall_id = r.recall_id
      LEFT JOIN master.products p ON p.sku = r.sku
      WHERE ($sku IS NULL OR r.sku = $sku)
        AND ($product_type IS NULL OR lower(p.category) = lower($product_type))
        AND ($reason IS NULL OR r.reason ILIKE '%' || $reason || '%')
        AND CAST(r.opened_at AS DATE) >= CAST($as_of AS DATE) - INTERVAL (CAST($days AS INT)) DAY
      ORDER BY r.opened_at DESC
    limit: 20
    example: {reason: battery}

  - name: calculate_recall_cost_estimate
    desc: "All-in recall cost for a number of units in best, expected and worst scenarios: refunds, logistics, legal, comms, then insurance. Returns inputs and cost breakdown."
    kind: sql
    args:
      units_affected: {type: int, required: true, desc: "Units to recall"}
      retail_price_gbp: {type: float, required: true, desc: "Retail price per unit"}
      logistics_cost_per_unit_gbp: {type: float, default: 3.5, desc: "Collection and disposal cost per unit affected"}
      legal_fees_gbp: {type: float, default: 60000, desc: "Expected legal and compliance fees"}
      comms_cost_gbp: {type: float, default: 50000, desc: "Expected customer comms and press relations cost"}
      insurance_recovery_pct: {type: float, default: 20, desc: "Percentage of total recovered from insurance and supplier (0-100); past recalls recovered 12-30%"}
    sql: |
      SELECT s.scenario,
             CAST($units_affected AS INT) AS units_affected,
             $retail_price_gbp AS retail_price_gbp,
             s.refund_rate AS share_of_units_refunded,
             round(CAST($units_affected AS DOUBLE) * s.refund_rate * $retail_price_gbp, 0) AS refunds_gbp,
             round(CAST($units_affected AS DOUBLE) * $logistics_cost_per_unit_gbp * s.logistics_mult, 0) AS logistics_gbp,
             round($legal_fees_gbp * s.legal_mult, 0) AS legal_gbp,
             round($comms_cost_gbp * s.comms_mult, 0) AS comms_gbp,
             round(CAST($units_affected AS DOUBLE) * s.refund_rate * $retail_price_gbp
                   + CAST($units_affected AS DOUBLE) * $logistics_cost_per_unit_gbp * s.logistics_mult
                   + $legal_fees_gbp * s.legal_mult + $comms_cost_gbp * s.comms_mult, 0) AS total_cost_before_insurance_gbp,
             $insurance_recovery_pct AS insurance_recovery_pct,
             round((CAST($units_affected AS DOUBLE) * s.refund_rate * $retail_price_gbp
                   + CAST($units_affected AS DOUBLE) * $logistics_cost_per_unit_gbp * s.logistics_mult
                   + $legal_fees_gbp * s.legal_mult + $comms_cost_gbp * s.comms_mult) * (1 - $insurance_recovery_pct / 100.0), 0) AS net_cost_after_insurance_gbp,
             'total = units*refund_rate*retail_price + units*logistics*mult + legal*mult + comms*mult; net = total*(1-insurance_pct)' AS formula
      FROM (VALUES ('best', 0.45, 1.0, 0.5, 0.5, 1),
                   ('expected', 0.60, 1.0, 1.0, 1.0, 2),
                   ('worst', 1.00, 1.5, 4.0, 3.0, 3)) AS s(scenario, refund_rate, logistics_mult, legal_mult, comms_mult, ord)
      ORDER BY s.ord
    limit: 3
    example: {units_affected: 18000, retail_price_gbp: 77.99}

  - name: create_recall_case
    desc: Open a recall case for an incident with its batch, factory, units affected and optional cost estimate. Returns the new case.
    kind: insert
    table: recall_cases
    id_prefix: REC-
    defaults: {status: open, opened_at: "$as_of"}
    args:
      incident_id: {required: true}
      sku: {required: true}
      reason: {required: true, desc: "Reason for recall, e.g. Battery overheating hazard"}
      batch_id: {required: true}
      factory_id: {required: true}
      units_affected: {required: true, type: int}
      cost_estimate_gbp: {required: false, type: float, desc: "Initial estimate or blank"}
    example: {incident_id: INC-900001, sku: PF-220, reason: "Battery overheating in portable fans", batch_id: "BATCH-PF220-2509-A", factory_id: FAC-0027, units_affected: 18000}

  - name: update_recall_case_cost_estimate
    desc: Record or change the cost estimate on a recall case after analysis. Returns the old and new estimate.
    kind: update
    table: recall_cases
    set: {updated_at: "$as_of"}
    args:
      cost_estimate_gbp: {required: true, type: float, desc: "Revised cost estimate in GBP"}
    example: {recall_id: REC-900001, cost_estimate_gbp: 1250000}

  - name: draft_regulatory_notification
    desc: "Draft the regulator notification for a recall case in one country's format, with regulator, deadline, sign-off role and recall facts. Not sent."
    kind: draft
    args:
      recall_id: {required: true}
      country: {required: true, desc: "ISO country code, e.g. GB, DE, FR, IE"}
      notification_type: {type: enum, values: [recall, withdrawal], default: recall, desc: "Recall (products with customers) or withdrawal (stock still in the supply chain)"}
    sql:
      recall: |
        SELECT rc.recall_id, rc.sku, rc.reason, rc.batch_id, rc.units_affected, rc.opened_at,
               p.name, p.category, p.supplier_id, rc.factory_id, f.name AS factory_name
        FROM recall_cases rc
        LEFT JOIN master.products p ON p.sku = rc.sku
        LEFT JOIN master.factories f ON f.factory_id = rc.factory_id
        WHERE rc.recall_id = $recall_id
      fmt: SELECT * FROM regulator_formats WHERE country = upper($country) AND notification_type = $notification_type
      inc: |
        SELECT count(*) AS reports, min(i.reported_at) AS first_report,
               count(*) FILTER (WHERE i.injury_reported <> 'none') AS injuries
        FROM incidents i JOIN recall_cases rc ON rc.sku = i.sku AND rc.batch_id = i.batch_id
        WHERE rc.recall_id = $recall_id
    template: |
      REGULATORY NOTIFICATION - {{ country|upper }} ({{ notification_type|upper }})

      To: {{ fmt[0].regulator }}
      Submission channel: {{ fmt[0].channel }}
      Deadline: within {{ fmt[0].deadline_hours }} hours of the decision to {{ notification_type }} ({{ fmt[0].legal_basis }})
      Required content: {{ fmt[0].format }}
      Sign-off: {{ fmt[0].signoff_role }}

      From: {{ company }}

      PRODUCT
      {{ recall[0].name }} (SKU {{ recall[0].sku }}), category {{ recall[0].category }}
      Batch: {{ recall[0].batch_id }}
      Supplier: {{ recall[0].supplier_id }}; factory: {{ recall[0].factory_id }} {{ recall[0].factory_name }}
      Units affected: {{ recall[0].units_affected|num(0) }}

      HAZARD
      {{ recall[0].reason }}
      Customer reports received: {{ inc[0].reports }}{% if inc[0].reports %} (first on {{ inc[0].first_report }}){% endif %}; reports with an injury: {{ inc[0].injuries }}

      CORRECTIVE ACTION
      Sales of the batch stopped; stores and DCs quarantining stock; customers to be told to stop using the product and offered a full refund.

      Recall case {{ recall[0].recall_id }}, opened {{ recall[0].opened_at }}. This notification is pending sign-off and has not been sent.
    example: {recall_id: REC-900001, country: GB}

  - name: send_regulatory_notification
    desc: Submit a regulator notification for a recall or withdrawal in one country. Stores the regulator, deadline and content with the time sent.
    kind: insert
    table: regulatory_notifications
    id_prefix: RGN-
    defaults: {status: submitted}
    args:
      recall_id: {required: true}
      country: {required: true, desc: "ISO country code, e.g. GB"}
      regulator: {required: true, desc: "Regulator name, e.g. Trading Standards Service (OPSS)"}
      notification_type: {required: true, type: enum, values: [recall, withdrawal]}
      deadline: {required: true, type: date, desc: "Regulatory deadline for action"}
      content: {required: true, type: text, desc: "Notification content"}
    example: {recall_id: REC-900001, country: GB, regulator: "Trading Standards Service (OPSS)", notification_type: recall, deadline: "+1d", content: "Battery overheating risk in PF-220 batch BATCH-PF220-2509-A"}

  - name: draft_customer_recall_notice
    desc: "Draft the customer recall notice for a recall case: what happened, what to do, refund amount. English by default; DE and FR available. Not sent."
    kind: draft
    args:
      recall_id: {required: true}
      country: {type: str, default: GB, desc: "Market and language: GB (English), DE (German) or FR (French)"}
    sql:
      recall: |
        SELECT rc.recall_id, rc.sku, rc.reason, rc.batch_id, rc.units_affected, p.name, p.retail_price_gbp
        FROM recall_cases rc LEFT JOIN master.products p ON p.sku = rc.sku WHERE rc.recall_id = $recall_id
    template: |
      {% if country|upper == 'DE' %}
      WICHTIGER SICHERHEITSHINWEIS - PRODUKTRUeCKRUF

      Sehr geehrte Kundin, sehr geehrter Kunde,

      wir rufen das folgende Produkt freiwillig zurueck: {{ recall[0].name }} (Artikel {{ recall[0].sku }}), Charge {{ recall[0].batch_id }}.

      WAS IST PASSIERT
      Bisherige Pruefungen deuten darauf hin, dass der Akku dieser Charge ueberhitzen kann. Wir untersuchen den Sachverhalt.

      WAS SIE TUN SOLLTEN
      1. Benutzen und laden Sie das Geraet nicht mehr und trennen Sie es vom Strom.
      2. Bringen Sie es in eine unserer Filialen oder fordern Sie die kostenlose Abholung an.
      3. Sie erhalten den Kaufpreis von {{ recall[0].retail_price_gbp|num(2) }} GBP vollstaendig erstattet, auch ohne Kassenbon.

      Kundenservice: 0800 123 0123 oder recalls@harbourvale.example

      Dieser Hinweis steht unter dem Vorbehalt weiterer Pruefungen.
      {% elif country|upper == 'FR' %}
      AVIS DE SECURITE IMPORTANT - RAPPEL DE PRODUIT

      Chere cliente, cher client,

      Nous rappelons volontairement le produit suivant : {{ recall[0].name }} (reference {{ recall[0].sku }}), lot {{ recall[0].batch_id }}.

      CE QUI S'EST PASSE
      Les tests realises a ce jour indiquent que la batterie de ce lot peut surchauffer. Nous enquetons sur cette situation.

      CE QUE VOUS DEVEZ FAIRE
      1. Cessez d'utiliser et de recharger l'appareil et debranchez-le.
      2. Rapportez-le en magasin ou demandez une collecte gratuite.
      3. Vous serez rembourse integralement ({{ recall[0].retail_price_gbp|num(2) }} GBP), meme sans ticket de caisse.

      Service client : 0800 123 0123 ou recalls@harbourvale.example

      Cet avis reste soumis aux resultats des verifications en cours.
      {% else %}
      IMPORTANT SAFETY NOTICE - PRODUCT RECALL

      Dear Customer,

      We are recalling the following product: {{ recall[0].name }} (SKU {{ recall[0].sku }}), batch {{ recall[0].batch_id }}.

      WHAT HAPPENED
      Testing to date indicates that the battery in this batch may overheat. We are investigating the matter.

      WHAT YOU SHOULD DO
      1. Stop using and charging the product and unplug it.
      2. Return it to any store, or ask for a free collection.
      3. You will receive a full refund of £{{ recall[0].retail_price_gbp|num(2) }}, with or without a receipt.

      Customer Service: 0800 123 0123 or recalls@harbourvale.example

      This notice is issued pending further investigation.
      {% endif %}
    example: {recall_id: REC-900001}

  - name: draft_store_instructions
    desc: "Draft store pull-and-quarantine instructions for a recall case, with batch, steps, timeline and the number of stores in the country. Not published."
    kind: draft
    args:
      recall_id: {required: true}
      country: {type: str, default: GB, desc: "Market and language: GB (English), DE (German); other codes use English"}
    sql:
      recall: |
        SELECT rc.recall_id, rc.sku, rc.batch_id, rc.reason, p.name
        FROM recall_cases rc LEFT JOIN master.products p ON p.sku = rc.sku WHERE rc.recall_id = $recall_id
      stores: SELECT count(*) AS n FROM master.sites WHERE type = 'store' AND status = 'open' AND country = upper($country)
    template: |
      {% if country|upper == 'DE' %}
      DRINGEND: ANWEISUNG ZUM ENTFERNEN UND SPERREN VON WARE ({{ stores[0].n }} Filialen in {{ country|upper }})

      Produkt: {{ recall[0].name }}, Artikel {{ recall[0].sku }}, Charge {{ recall[0].batch_id }}

      HEUTE ERFORDERLICH
      1. Alle Geraete dieser Charge von Verkaufsflaeche und Lager nehmen.
      2. Getrennt lagern und mit "GESPERRT - SICHERHEITSRUeCKRUF" kennzeichnen.
      3. Bestand bis Tagesende im Portal an das DC melden.
      4. Aushang im Eingangsbereich anbringen.

      KUNDEN
      Rueckgaben dieser Charge annehmen und den Kaufpreis erstatten; keine Rueckgabe wieder in den Verkauf.

      FRISTEN
      Sofort: Ware entfernen. Innerhalb 24 Stunden: Bestand melden. Innerhalb 72 Stunden: Ware abgeholt.
      {% else %}
      URGENT: STORE PULL AND QUARANTINE INSTRUCTIONS ({{ stores[0].n }} stores in {{ country|upper }})

      Product: {{ recall[0].name }}, SKU {{ recall[0].sku }}, batch {{ recall[0].batch_id }}
      Reason: {{ recall[0].reason }}
      {% if stores[0].n == 0 %}
      We have no stores in {{ country|upper }}: this applies to online orders and wholesale customers only.
      {% endif %}

      ACTION REQUIRED TODAY
      1. Pull all units of this batch from the sales floor and stockroom. Do not sell them.
      2. Quarantine them in a separate area labelled "HOLD - SAFETY RECALL".
      3. Count the units and report the count to the DC by end of day on the portal.
      4. Put the recall notice at the entrance.

      CUSTOMERS
      Accept returns of this batch and refund the full price with or without a receipt. Do not put returned units back on sale.

      TIMELINE
      Immediately: pull from shelves. Within 24 hours: count and report. Within 72 hours: all units collected from the store.
      {% endif %}
    example: {recall_id: REC-900001}

  - name: send_store_instructions
    desc: Publish pull-and-quarantine instructions for a recall batch to stores. Stores the action and content with the publication time.
    kind: insert
    table: store_instructions
    id_prefix: STI-
    defaults: {status: published, published_at: "$as_of"}
    args:
      recall_id: {required: true}
      sku: {required: true}
      batch_id: {required: true}
      action: {required: true, type: enum, values: [pull, quarantine, destroy, return_to_dc], desc: "Action for stores"}
      content: {required: true, type: text, desc: "Detailed instruction content"}
    example: {recall_id: REC-900001, sku: PF-220, batch_id: "BATCH-PF220-2509-A", action: pull, content: "URGENT: pull PF-220 batch BATCH-PF220-2509-A and quarantine it"}

  - name: draft_press_statement
    desc: "Draft the press statement for a recall case with facts, company statement and media contact, plus the reference of any saved draft. English by default; DE and FR available."
    kind: draft
    args:
      recall_id: {required: true}
      country: {type: str, default: GB, desc: "Market and language: GB (English), DE (German) or FR (French)"}
    sql:
      recall: |
        SELECT rc.recall_id, rc.sku, rc.reason, rc.batch_id, rc.units_affected, rc.opened_at, p.name
        FROM recall_cases rc LEFT JOIN master.products p ON p.sku = rc.sku WHERE rc.recall_id = $recall_id
      inc: |
        SELECT count(*) AS reports, min(i.reported_at) AS first_report,
               count(*) FILTER (WHERE i.injury_reported <> 'none') AS injuries
        FROM incidents i JOIN recall_cases rc ON rc.sku = i.sku AND rc.batch_id = i.batch_id
        WHERE rc.recall_id = $recall_id
      saved: |
        SELECT draft_id FROM draft_communications
        WHERE recall_id = $recall_id AND communication_type = 'press_statement' AND status = 'draft'
        ORDER BY created_at DESC
    template: |
      {% if saved %}Saved draft: {{ saved[0].draft_id }} (press statement, status draft){% endif %}

      {% if country|upper == 'DE' %}
      ZUR SOFORTIGEN VEROEFFENTLICHUNG

