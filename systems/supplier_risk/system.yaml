  - name: run_bank_account_verification
    desc: Verify bank account against company details for fraud risk mitigation.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, bank_name, account_holder, country,
             CASE WHEN country = (SELECT country FROM master.suppliers WHERE supplier_id = $supplier_id LIMIT 1)
                  THEN 'verified' ELSE 'country_mismatch' END AS verification_status
      FROM supplier_bank_details
      WHERE supplier_id = $supplier_id
    example: {supplier_id: SUP-0001}

  - name: search_factories
    desc: Find factories by name, supplier or country; returns factory ids to use with other tools.
    kind: select
    from: master.factories
    filters:
      name: {op: like, desc: "Factory name or part of it"}
      supplier_id: {}
      country: {}
    columns: [factory_id, name, supplier_id, country, capacity_units_month]
    order: name
    limit: 30
    example: {country: VN}
