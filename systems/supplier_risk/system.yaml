id: supplier_risk
name: Supplier Onboarding & Risk System
instructions: >
  Supplier risk ratings, certifications, financial health, onboarding cases and qualifications.
  Supplier ids like SUP-0042, factory ids like FAC-0107.
  Alert ids like SRA-000001, onboarding case ids like SOC-000001, control ids like SOC-CTL-001.

tables:
  supplier_profiles:
    key: supplier_id
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      criticality_rating: {type: enum, values: [low, medium, high, critical], desc: "Criticality to our operations"}
      financial_health_score: {type: float, desc: "Financial health 0-100 (higher is better)"}
      security_risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Security and risk rating"}
      last_assessed_at: {type: date, desc: "Date of last risk assessment"}
      watch_status: {type: enum, values: [none, watch, escalated], desc: "Current watch/escalation status"}

  supplier_risk_alerts:
    key: alert_id
    cols:
      alert_id: {type: str, desc: "Alert id, e.g. SRA-000001"}
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      factory_id: {type: str, desc: "Factory if alert is factory-specific"}
      alert_type: {type: enum, values: [financial, compliance, quality, delivery, security, regulatory, other], desc: "Type of risk"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Alert severity"}
      description: {type: text, desc: "Details of the alert"}
      raised_at: {type: date, desc: "Date alert was raised"}
      status: {type: enum, values: [active, resolved, dismissed], desc: "Alert status"}

  supplier_certifications:
    key: [supplier_id, cert_type]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      cert_type: {type: str, desc: "Certification type, e.g. ISO-9001, OEKO-TEX, BSCI"}
      issuer: {type: str, desc: "Issuing body"}
      issue_date: {type: date, desc: "Date issued"}
      expiry_date: {type: date, desc: "Date expires"}
      scope: {type: str, desc: "Scope of certification"}
      status: {type: enum, values: [current, expired, suspended], desc: "Status"}

  supplier_insurance:
    key: [supplier_id, policy_type]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      policy_type: {type: str, desc: "Insurance type, e.g. General Liability, Product Liability, Cyber"}
      provider: {type: str, desc: "Insurance company name"}
      policy_number: {type: str, desc: "Policy number"}
      coverage_gbp: {type: float, desc: "Coverage limit in GBP"}
      issue_date: {type: date, desc: "Policy issue date"}
      expiry_date: {type: date, desc: "Policy expiry date"}
      status: {type: enum, values: [current, expired, no_policy], desc: "Status"}

  supplier_bank_details:
    key: supplier_id
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      bank_name: {type: str, desc: "Bank name"}
      account_holder: {type: str, desc: "Name on account"}
      account_number: {type: str, desc: "Account number (masked)"}
      sort_code: {type: str, desc: "Sort code"}
      country: {type: str, desc: "Bank country (ISO code)"}
      currency: {type: str, desc: "Account currency"}
      verified: {type: bool, desc: "Whether bank details have been verified"}
      last_verified_at: {type: date, desc: "Date of last verification"}

  supplier_compliance_records:
    key: [supplier_id, record_date]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      record_date: {type: date, desc: "Date of compliance record"}
      compliance_area: {type: str, desc: "Area, e.g. labour, environmental, safety"}
      finding: {type: str, desc: "Compliance finding or status"}
      status: {type: enum, values: [compliant, non_compliant, exception], desc: "Status"}

  supplier_credit_data:
    key: [supplier_id, rating_date]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      rating_date: {type: date, desc: "Date of rating"}
      credit_rating: {type: enum, values: [A_excellent, B_good, C_fair, D_poor, E_very_poor, unknown], desc: "Credit rating"}
      credit_score: {type: int, desc: "Credit score 0-999"}
      days_payable_outstanding: {type: int, desc: "Average DPO days"}
      payment_default_count: {type: int, desc: "Number of payment defaults"}

  supplier_cyber_security:
    key: [supplier_id, assessment_date]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      assessment_date: {type: date, desc: "Date of assessment"}
      rating: {type: enum, values: [excellent, good, fair, poor, unknown], desc: "Cyber security rating"}
      assessment_source: {type: str, desc: "Assessment source/tool"}
      findings: {type: text, desc: "Key findings"}

  supplier_financial_filings:
    key: [supplier_id, filing_date]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      filing_date: {type: date, desc: "Date of filing/statement"}
      filing_type: {type: str, desc: "Type, e.g. annual accounts, tax return"}
      revenue_gbp: {type: float, desc: "Revenue in GBP"}
      profit_gbp: {type: float, desc: "Profit in GBP"}
      cash_gbp: {type: float, desc: "Cash in GBP"}
      debt_gbp: {type: float, desc: "Total debt in GBP"}
      roe_pct: {type: float, desc: "Return on equity %"}
      debt_to_equity: {type: float, desc: "Debt to equity ratio"}
      current_ratio: {type: float, desc: "Current ratio (liquidity)"}

  supplier_security_risk:
    key: [supplier_id, assessment_date]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      assessment_date: {type: date, desc: "Date of assessment"}
      rating: {type: enum, values: [low, medium, high, critical], desc: "Security risk rating"}
      system_access: {type: bool, desc: "Has system access"}
      access_level: {type: str, desc: "Level of system access"}

  factory_profiles:
    key: factory_id
    cols:
      factory_id: {type: str, desc: "Factory, e.g. FAC-0107"}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Current factory risk rating"}
      last_assessed_at: {type: date, desc: "Date of last assessment"}

  onboarding_cases:
    key: case_id
    cols:
      case_id: {type: str, desc: "Onboarding case, e.g. SOC-000001"}
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      status: {type: enum, values: [draft, in_progress, approved, conditional, rejected, completed], desc: "Case status"}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Risk rating from onboarding"}
      conditions: {type: text, desc: "Conditions if status is conditional"}
      created_at: {type: date, desc: "Date case opened"}
      updated_at: {type: date, desc: "Date of last update"}
      completed_at: {type: date, desc: "Date case completed"}

  onboarding_controls:
    key: control_id
    cols:
      control_id: {type: str, desc: "Control id, e.g. SOC-CTL-001"}
      description: {type: str, desc: "What this control checks"}
      control_type: {type: str, desc: "Type, e.g. document review, sanctions screening, financial check"}
      sequence: {type: int, desc: "Order in process"}

  onboarding_items:
    key: [case_id, item_id]
    cols:
      case_id: {type: str, desc: "Onboarding case, e.g. SOC-000001"}
      item_id: {type: str, desc: "Item id"}
      control_id: {type: str, desc: "Related control"}
      description: {type: str, desc: "What is required"}
      status: {type: enum, values: [required, submitted, approved, rejected], desc: "Status"}
      due_date: {type: date, desc: "Due date for submission"}
      submitted_at: {type: date, desc: "Date submitted"}

  alternative_suppliers:
    key: [category, supplier_id]
    cols:
      category: {type: str, desc: "Product category, e.g. Cookware, Fabrics"}
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      tier: {type: enum, values: [primary, secondary, tertiary], desc: "Priority tier"}
      capability: {type: str, desc: "Key capability, e.g. seam-sealing, OEKO-TEX"}

  alternative_factories:
    key: [sku, factory_id]
    cols:
      sku: {type: str, desc: "SKU, e.g. SKU-100234"}
      factory_id: {type: str, desc: "Factory, e.g. FAC-0107"}
      approved: {type: bool, desc: "Whether approved for this SKU"}
      qualification_status: {type: enum, values: [approved, in_progress, pending, failed], desc: "Qualification status"}

tools:
  # Read tools - stage 1

  - name: calculate_supplier_failure_cost
    desc: Estimated cost to the business of a supplier failure, by revenue dependency and inventory exposure.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT $supplier_id AS supplier_id,
             COALESCE(s.annual_spend_gbp, 0) AS annual_spend_gbp,
             ROUND(COALESCE(s.annual_spend_gbp, 0) * 0.25, 2) AS estimated_disruption_cost_gbp,
             'Estimated cost = annual spend × 25% disruption factor' AS formula
      FROM master.suppliers s
      WHERE s.supplier_id = $supplier_id
    example: {supplier_id: SUP-0001}

  - name: calculate_supplier_risk_rating
    desc: Composite risk rating with reasons, combining financial health, certifications, compliance and alerts.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      WITH metrics AS (
        SELECT s.supplier_id,
               CASE WHEN sp.financial_health_score >= 75 THEN 0
                    WHEN sp.financial_health_score >= 50 THEN 1
                    ELSE 2 END AS fin_risk,
               CASE WHEN EXISTS (SELECT 1 FROM supplier_risk_alerts WHERE supplier_id = $supplier_id AND status = 'active' AND severity = 'critical') THEN 2
                    WHEN EXISTS (SELECT 1 FROM supplier_risk_alerts WHERE supplier_id = $supplier_id AND status = 'active' AND severity = 'high') THEN 1
                    ELSE 0 END AS alert_risk,
               CASE WHEN COUNT(sc.cert_type) FILTER (WHERE sc.status = 'current') >= 2 THEN 0 ELSE 1 END AS cert_risk
        FROM master.suppliers s
        LEFT JOIN supplier_profiles sp ON sp.supplier_id = s.supplier_id
        LEFT JOIN supplier_certifications sc ON sc.supplier_id = s.supplier_id
        WHERE s.supplier_id = $supplier_id
        GROUP BY s.supplier_id, sp.financial_health_score
      )
      SELECT supplier_id,
             CASE WHEN fin_risk + alert_risk + cert_risk >= 4 THEN 'critical'
                  WHEN fin_risk + alert_risk + cert_risk >= 2 THEN 'high'
                  WHEN fin_risk + alert_risk + cert_risk >= 1 THEN 'medium'
                  ELSE 'low' END AS risk_rating,
             CASE WHEN fin_risk > 0 THEN 'financial concerns; ' ELSE '' END ||
             CASE WHEN alert_risk > 0 THEN 'active alerts; ' ELSE '' END ||
             CASE WHEN cert_risk > 0 THEN 'missing certifications' ELSE '' END AS reasons
      FROM metrics
    example: {supplier_id: SUP-0001}

  - name: compare_onboarding_file_to_requirements
    desc: Check an onboarding file against minimum requirements, flag gaps and risk indicators.
    kind: sql
    args:
      case_id: {required: true}
      file_path: {type: str, desc: "Path to onboarding file", required: true}
    sql: |
      SELECT oc.case_id, oc.supplier_id,
             COUNT(oi.item_id) AS total_items,
             COUNT(oi.item_id) FILTER (WHERE oi.status = 'approved') AS approved_items,
             ROUND(100.0 * COUNT(oi.item_id) FILTER (WHERE oi.status = 'approved') / COUNT(oi.item_id), 1) AS completion_pct,
             CASE WHEN COUNT(oi.item_id) FILTER (WHERE oi.status = 'approved') >= COUNT(oi.item_id) THEN 'meets requirements'
                  ELSE 'gaps found' END AS status
      FROM onboarding_cases oc
      LEFT JOIN onboarding_items oi ON oi.case_id = oc.case_id
      WHERE oc.case_id = $case_id
      GROUP BY oc.case_id, oc.supplier_id
    example: {case_id: SOC-900001, file_path: onboarding_form.pdf}

  - name: create_onboarding_case
    desc: Opens a new supplier onboarding or qualification case for approval process.
    kind: insert
    table: onboarding_cases
    id_prefix: SOC-
    defaults: {status: draft}
    args:
      supplier_id: {required: true}
      risk_rating: {required: true}
    example: {supplier_id: SUP-0050, risk_rating: medium}

  - name: create_onboarding_control
    desc: Adds a control to the onboarding checklist.
    kind: insert
    table: onboarding_controls
    id_prefix: SOC-CTL-
    args:
      description: {required: true}
      control_type: {required: true}
      sequence: {type: int, required: true}
    example: {description: "Verify company registration", control_type: "document review", sequence: 1}

  - name: create_supplier_risk_alert
    desc: Create a risk alert or watchlist entry for a supplier or factory.
    kind: insert
    table: supplier_risk_alerts
    id_prefix: SRA-
    args:
      supplier_id: {required: true}
      alert_type: {required: true}
      severity: {required: true}
      description: {required: true}
    example: {supplier_id: SUP-0001, alert_type: financial, severity: high, description: "Credit score deteriorating"}

  - name: draft_supplier_security_questions
    desc: Draft cyber security questions for partners to complete in questionnaire.
    kind: draft
    args:
      supplier_id: {}
    sql:
      sup: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id LIMIT 1
      alerts: SELECT * FROM supplier_risk_alerts WHERE supplier_id = $supplier_id AND alert_type = 'security'
    template: |
      CYBER SECURITY QUESTIONNAIRE

      Supplier: {{ sup[0].name if sup else 'TBD' }}

      1. Does your organization have a documented information security policy?
      2. What data protection standards do you follow (ISO 27001, SOC 2, etc.)?
      3. Do you conduct regular security assessments or penetration testing?
      4. What is your incident response process?
      5. How do you manage access to our data?
      {% if alerts %}
      Note: Previous security concerns on file — clarify: {% for a in alerts %}{{ a.description }}{% if not loop.last %}; {% endif %}{% endfor %}
      {% endif %}
    example: {supplier_id: SUP-0001}

  - name: get_factory_risk_rating
    desc: Current risk rating for a factory from audit findings and supply chain position.
    kind: sql
    args:
      factory_id: {required: true}
    sql: |
      SELECT fp.factory_id, f.name, fp.risk_rating, fp.last_assessed_at
      FROM factory_profiles fp
      JOIN master.factories f ON f.factory_id = fp.factory_id
      WHERE fp.factory_id = $factory_id
    example: {factory_id: FAC-0001}

  - name: get_onboarding_missing_items
    desc: Missing items for an onboarding case before it can proceed to approval.
    kind: sql
    args:
      case_id: {required: true}
    sql: |
      SELECT oc.case_id, oc.supplier_id, oc.status,
             COUNT(oi.item_id) AS total_items,
             COUNT(oi.item_id) FILTER (WHERE oi.status IN ('required', 'submitted', 'rejected')) AS items_not_approved,
             STRING_AGG(oi.description, '; ' ORDER BY oi.description) FILTER (WHERE oi.status IN ('required', 'submitted', 'rejected')) AS missing_items
      FROM onboarding_cases oc
      LEFT JOIN onboarding_items oi ON oi.case_id = oc.case_id
      WHERE oc.case_id = $case_id
      GROUP BY oc.case_id, oc.supplier_id, oc.status
    example: {case_id: SOC-900001}

  - name: get_supplier_bank_details
    desc: Supplier bank details and account verification status.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, bank_name, account_holder, account_number, sort_code,
             country, currency, verified, last_verified_at
      FROM supplier_bank_details
      WHERE supplier_id = $supplier_id
    example: {supplier_id: SUP-0001}

  - name: get_supplier_certifications
    desc: Supplier certifications and expiry dates, showing status of each.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, cert_type, issuer, issue_date, expiry_date,
             CASE WHEN CAST($as_of AS DATE) > expiry_date THEN 'expired'
                  WHEN CAST($as_of AS DATE) > expiry_date - INTERVAL 30 DAY THEN 'expiring_soon'
                  ELSE 'current' END AS status,
             scope
      FROM supplier_certifications
      WHERE supplier_id = $supplier_id
      ORDER BY expiry_date DESC
    example: {supplier_id: SUP-0001}

  - name: get_supplier_compliance_history
    desc: Supplier compliance history covering labour, environmental, safety and other compliance areas.
    kind: sql
    args:
      supplier_id: {required: true}
      months_back: {type: int, default: 12, desc: "Number of months to show"}
    sql: |
      SELECT supplier_id, record_date, compliance_area, finding, status
      FROM supplier_compliance_records
      WHERE supplier_id = $supplier_id
        AND record_date >= CAST($as_of AS DATE) - INTERVAL ($months_back || ' MONTH')
      ORDER BY record_date DESC
    example: {supplier_id: SUP-0001, months_back: 12}

  - name: get_supplier_concentration_exposure
    desc: Spend and volume concentration by supplier and country, shows diversification risk.
    kind: sql
    args:
      category: {type: str, desc: "Product category to filter (optional)"}
    sql: |
      SELECT s.supplier_id, s.name, s.country,
             s.annual_spend_gbp AS spend_gbp,
             ROUND(100.0 * s.annual_spend_gbp / SUM(s.annual_spend_gbp) OVER (), 1) AS spend_pct_of_category,
             COUNT(DISTINCT p.sku) AS sku_count
      FROM master.suppliers s
      LEFT JOIN master.products p ON p.supplier_id = s.supplier_id AND ($category IS NULL OR p.category = $category)
      GROUP BY s.supplier_id, s.name, s.country, s.annual_spend_gbp
      ORDER BY s.annual_spend_gbp DESC
      LIMIT 30
    example: {category: Cookware}

  - name: get_supplier_country_exposure
    desc: Supplier exposure by country, shows geopolitical and trade risk concentration.
    kind: sql
    args: {}
    sql: |
      SELECT s.country,
             COUNT(DISTINCT s.supplier_id) AS supplier_count,
             ROUND(SUM(s.annual_spend_gbp), 0) AS total_spend_gbp,
             ROUND(100.0 * SUM(s.annual_spend_gbp) / SUM(SUM(s.annual_spend_gbp)) OVER (), 1) AS spend_pct,
             STRING_AGG(DISTINCT sp.security_risk_rating, ', ') AS risk_ratings
      FROM master.suppliers s
      LEFT JOIN supplier_profiles sp ON sp.supplier_id = s.supplier_id
      GROUP BY s.country
      ORDER BY total_spend_gbp DESC
    example: {}

  - name: get_supplier_credit_rating
    desc: Credit rating for a supplier from latest filing, with trend.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, rating_date, credit_rating, credit_score,
             days_payable_outstanding, payment_default_count
      FROM supplier_credit_data
      WHERE supplier_id = $supplier_id
      ORDER BY rating_date DESC
      LIMIT 1
    example: {supplier_id: SUP-0001}

  - name: get_supplier_credit_scores
    desc: Credit scores and trends over time.
    kind: sql
    args:
      supplier_id: {required: true}
      months_back: {type: int, default: 12, desc: "History in months"}
    sql: |
      SELECT supplier_id, rating_date, credit_rating, credit_score,
             LEAD(credit_score) OVER (ORDER BY rating_date DESC) - credit_score AS score_change,
             days_payable_outstanding, payment_default_count
      FROM supplier_credit_data
      WHERE supplier_id = $supplier_id
        AND rating_date >= CAST($as_of AS DATE) - INTERVAL ($months_back || ' MONTH')
      ORDER BY rating_date DESC
    example: {supplier_id: SUP-0001, months_back: 12}

  - name: get_supplier_criticality_rating
    desc: Criticality rating for a supplier, showing how much our business depends on them.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT s.supplier_id, s.name, sp.criticality_rating,
             s.annual_spend_gbp, sp.last_assessed_at
      FROM master.suppliers s
      LEFT JOIN supplier_profiles sp ON sp.supplier_id = s.supplier_id
      WHERE s.supplier_id = $supplier_id
    example: {supplier_id: SUP-0001}

  - name: get_supplier_cyber_security_ratings
    desc: External cyber security ratings and assessments for a supplier.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, assessment_date, rating, assessment_source, findings
      FROM supplier_cyber_security
      WHERE supplier_id = $supplier_id
      ORDER BY assessment_date DESC
      LIMIT 5
    example: {supplier_id: SUP-0001}

  - name: get_supplier_financial_filings
    desc: Filed accounts and key financial ratios over time.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, filing_date, filing_type, revenue_gbp, profit_gbp, cash_gbp,
             debt_gbp, roe_pct, debt_to_equity, current_ratio
      FROM supplier_financial_filings
      WHERE supplier_id = $supplier_id
      ORDER BY filing_date DESC
    example: {supplier_id: SUP-0001}

  - name: get_supplier_financial_health_score
    desc: Financial health score 0-100 (higher is better), from recent accounts, credit and liquidity.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT s.supplier_id, s.name, sp.financial_health_score, sp.last_assessed_at,
             COALESCE(sc.credit_rating, 'unknown') AS latest_credit_rating
      FROM master.suppliers s
      LEFT JOIN supplier_profiles sp ON sp.supplier_id = s.supplier_id
      LEFT JOIN LATERAL (
        SELECT credit_rating FROM supplier_credit_data
        WHERE supplier_id = $supplier_id
        ORDER BY rating_date DESC LIMIT 1
      ) sc ON TRUE
      WHERE s.supplier_id = $supplier_id
    example: {supplier_id: SUP-0001}

  - name: get_supplier_insurance_certificates
    desc: Supplier insurance certificates and coverage limits, showing expiry status.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, policy_type, provider, policy_number, coverage_gbp,
             issue_date, expiry_date,
             CASE WHEN CAST($as_of AS DATE) > expiry_date THEN 'expired'
                  WHEN CAST($as_of AS DATE) > expiry_date - INTERVAL 30 DAY THEN 'expiring_soon'
                  ELSE 'current' END AS status
      FROM supplier_insurance
      WHERE supplier_id = $supplier_id
      ORDER BY expiry_date DESC
    example: {supplier_id: SUP-0001}

  # Write tools - stage 1

  - name: update_onboarding_case_conditions
    desc: Sets conditions on an onboarding case (e.g. audit required, quality certification).
    kind: update
    table: onboarding_cases
    set: {conditions: "{arg}"}
    args:
      conditions: {required: true, desc: "Conditions to set"}
    example: {case_id: SOC-900001, conditions: "Audit required before first order; OEKO-TEX certification needed"}

  - name: update_onboarding_case_status
    desc: Changes the status of an onboarding case (approved, conditional, rejected, etc.).
    kind: update
    table: onboarding_cases
    set: {status: "{arg}", updated_at: "$as_of"}
    args:
      status: {type: enum, values: [draft, in_progress, approved, conditional, rejected, completed], required: true}
    example: {case_id: SOC-900001, status: approved}

  - name: update_supplier_risk_status
    desc: Sets a supplier's watch or escalation status for increased monitoring.
    kind: update
    table: supplier_profiles
    set: {watch_status: "{arg}"}
    args:
      watch_status: {type: enum, values: [none, watch, escalated], required: true}
    example: {supplier_id: SUP-0001, watch_status: watch}

  - name: send_supplier_security_questionnaire
    desc: Send a cyber security questionnaire to a supplier for completion.
    kind: insert
    table: supplier_risk_alerts
    id_prefix: SRA-
    defaults: {alert_type: security}
    args:
      supplier_id: {required: true}
      severity: {default: medium}
    example: {supplier_id: SUP-0001}

  # Stage 2 tools (read-only tools not yet implemented)

  - name: get_supplier_qualification_time_and_cost
    desc: Time and cost to qualify a supplier, from typical onboarding durations and audit costs.
    kind: select
    from: onboarding_cases
    filters:
      supplier_id: {}
      status: {}
    columns: [case_id, supplier_id, status, created_at, completed_at]
    order: created_at
    example: {supplier_id: SUP-0050}

  - name: get_supplier_registration_details
    desc: Registration details of a supplier from company registry or master data.
    kind: select
    from: master.suppliers
    filters:
