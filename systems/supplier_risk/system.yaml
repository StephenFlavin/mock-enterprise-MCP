id: supplier_risk
name: Supplier Onboarding & Risk System
instructions: >
  Supplier risk ratings, certifications, financial health, credit, insurance, onboarding cases and qualification.
  Supplier ids like SUP-0042, factory ids like FAC-0107, carrier ids like CAR-005.
  Alert ids SRA-000001, onboarding cases SOC-000001, controls SOC-CTL-000001.

tables:
  supplier_profiles:
    key: supplier_id
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      criticality_rating: {type: enum, values: [low, medium, high, critical], desc: "Criticality to our operations"}
      financial_health_score: {type: float, desc: "Financial health 0-100 (higher is better)"}
      security_risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Latest security risk rating"}
      last_assessed_at: {type: date, desc: "Date of last risk assessment"}
      watch_status: {type: enum, values: [none, watch, escalated], desc: "Current watch or escalation status"}
      watch_reason: {type: text, desc: "Why the supplier is on watch or escalated"}
      updated_at: {type: date, desc: "Date the profile last changed"}
      region: {type: str, desc: "Region where its production is concentrated, e.g. Southern Vietnam, Chattogram, Guangdong"}

  supplier_risk_alerts:
    key: alert_id
    cols:
      alert_id: {type: str, desc: "Alert id, e.g. SRA-000001"}
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      factory_id: {type: str, desc: "Factory if the alert is factory-specific, e.g. FAC-0107"}
      alert_type: {type: enum, values: [financial, compliance, quality, delivery, security, regulatory, other], desc: "Type of risk"}
      severity: {type: enum, values: [low, medium, high, critical], desc: "Alert severity"}
      description: {type: text, desc: "Details of the alert"}
      raised_at: {type: date, desc: "Date the alert was raised"}
      status: {type: enum, values: [active, resolved, dismissed], desc: "Alert status"}

  supplier_certifications:
    key: [supplier_id, cert_type]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      cert_type: {type: str, desc: "Certification, e.g. OEKO-TEX, GOTS, BSCI, SEDEX, WRAP, ISO9001, ISO14001"}
      issuer: {type: str, desc: "Issuing body"}
      issue_date: {type: date, desc: "Date issued"}
      expiry_date: {type: date, desc: "Date the certificate expires"}
      scope: {type: str, desc: "Factories the certificate covers"}

  supplier_insurance:
    key: [supplier_id, policy_type]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      policy_type: {type: str, desc: "Insurance type, e.g. General Liability, Product Liability, Cyber"}
      provider: {type: str, desc: "Insurance company"}
      policy_number: {type: str, desc: "Policy number"}
      coverage_gbp: {type: float, desc: "Coverage limit in GBP"}
      issue_date: {type: date, desc: "Policy start date"}
      expiry_date: {type: date, desc: "Policy expiry date"}

  supplier_bank_details:
    key: supplier_id
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      bank_name: {type: str, desc: "Bank name"}
      account_holder: {type: str, desc: "Name on the account"}
      account_number: {type: str, desc: "Account number"}
      sort_code: {type: str, desc: "Sort code or bank routing code"}
      bank_country: {type: str, desc: "Bank country (ISO code)"}
      currency: {type: str, desc: "Account currency"}
      verified: {type: bool, desc: "Whether the account has been verified"}
      last_verified_at: {type: date, desc: "Date of last verification, blank if never verified"}

  supplier_registrations:
    key: supplier_id
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      legal_name: {type: str, desc: "Registered legal name"}
      registration_number: {type: str, desc: "Company registration number"}
      registered_address: {type: str, desc: "Registered address"}
      registered_country: {type: str, desc: "Country of registration (ISO code)"}
      incorporation_date: {type: date, desc: "Date incorporated"}
      ultimate_owner: {type: str, desc: "Ultimate owner or parent"}
      tax_id: {type: str, desc: "Tax identifier"}

  supplier_compliance_records:
    key: record_id
    cols:
      record_id: {type: str, desc: "Record id, e.g. CMP-000001"}
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      factory_id: {type: str, desc: "Factory the record is about, blank if supplier-wide, e.g. FAC-0107"}
      record_date: {type: date, desc: "Date of the compliance record"}
      compliance_area: {type: str, desc: "Area, e.g. labour, environmental, safety, tax_compliance"}
      finding: {type: str, desc: "What was found"}
      status: {type: enum, values: [compliant, non_compliant, exception], desc: "Outcome"}

  supplier_credit_data:
    key: [supplier_id, rating_date]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      rating_date: {type: date, desc: "Date of the rating"}
      credit_rating: {type: enum, values: [A_excellent, B_good, C_fair, D_poor, E_very_poor], desc: "Credit rating band"}
      credit_score: {type: int, desc: "Credit score 0-999"}
      days_payable_outstanding: {type: int, desc: "Supplier's average days to pay its own bills"}
      payment_default_count: {type: int, desc: "Number of payment defaults"}

  supplier_cyber_security:
    key: [supplier_id, assessment_date]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      assessment_date: {type: date, desc: "Date of assessment"}
      rating: {type: enum, values: [excellent, good, fair, poor], desc: "Cyber security rating"}
      assessment_source: {type: str, desc: "Rating provider"}
      findings: {type: text, desc: "Key findings"}

  supplier_financial_filings:
    key: [supplier_id, filing_date]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      filing_date: {type: date, desc: "Date of filing"}
      filing_type: {type: str, desc: "Type, e.g. annual accounts"}
      revenue_gbp: {type: float, desc: "Revenue in GBP"}
      profit_gbp: {type: float, desc: "Profit in GBP"}
      cash_gbp: {type: float, desc: "Cash in GBP"}
      debt_gbp: {type: float, desc: "Total debt in GBP"}
      roe_pct: {type: float, desc: "Return on equity %"}
      debt_to_equity: {type: float, desc: "Debt to equity ratio"}
      current_ratio: {type: float, desc: "Current ratio (liquidity)"}

  supplier_security_risk:
    key: [supplier_id, assessment_date]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      assessment_date: {type: date, desc: "Date of assessment"}
      rating: {type: enum, values: [low, medium, high, critical], desc: "Security risk rating"}
      system_access: {type: bool, desc: "Whether the supplier connects to our systems"}
      access_level: {type: str, desc: "Level of system access, e.g. read_only, order_placement, financial"}

  logistics_provider_risk:
    key: carrier_id
    cols:
      carrier_id: {type: str, desc: "Carrier or forwarder, e.g. CAR-005"}
      criticality_rating: {type: enum, values: [low, medium, high, critical], desc: "Criticality to our logistics"}
      cyber_rating: {type: enum, values: [excellent, good, fair, poor], desc: "Cyber security rating"}
      assessment_date: {type: date, desc: "Date of the cyber assessment"}
      system_access: {type: bool, desc: "Whether it connects to our systems"}
      access_level: {type: str, desc: "Level of system access"}

  factory_profiles:
    key: factory_id
    cols:
      factory_id: {type: str, desc: "Factory, e.g. FAC-0107"}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Current factory risk rating from audit rating and status"}
      last_assessed_at: {type: date, desc: "Date of last audit"}
      assessment_note: {type: text, desc: "Why the rating differs from the audit grade, if it does"}

  onboarding_cases:
    key: case_id
    cols:
      case_id: {type: str, desc: "Onboarding case, e.g. SOC-000001"}
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      status: {type: enum, values: [draft, in_progress, approved, conditional, rejected], desc: "Case status"}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Risk rating from onboarding"}
      conditions: {type: text, desc: "Conditions to meet before or after the first order"}
      created_at: {type: date, desc: "Date the case was opened"}
      updated_at: {type: date, desc: "Date of last update"}
      completed_at: {type: date, desc: "Date of the decision (approved, conditional or rejected), blank while open"}

  onboarding_controls:
    key: control_id
    cols:
      control_id: {type: str, desc: "Control id, e.g. SOC-CTL-000001"}
      description: {type: str, desc: "What this control checks"}
      control_type: {type: str, desc: "Type, e.g. document review, sanctions screening, financial check"}
      sequence: {type: int, desc: "Order in the process"}

  onboarding_items:
    key: [case_id, item_id]
    cols:
      case_id: {type: str, desc: "Onboarding case, e.g. SOC-000001"}
      item_id: {type: str, desc: "Item number within the case"}
      control_id: {type: str, desc: "Control this item evidences"}
      description: {type: str, desc: "What is required"}
      status: {type: enum, values: [required, submitted, approved, rejected], desc: "Item status"}
      due_date: {type: date, desc: "Due date for the item"}
      submitted_at: {type: date, desc: "Date submitted, blank if not yet submitted"}

  qualification_benchmarks:
    key: country
    cols:
      country: {type: str, desc: "Country of the new supplier (ISO code), e.g. VN"}
      typical_days_to_qualify: {type: int, desc: "Typical days from case opening to approval"}
      factory_audit_cost_gbp: {type: float, desc: "Typical social and technical audit cost"}
      sample_testing_cost_gbp: {type: float, desc: "Typical sample and lab testing cost"}
      onboarding_admin_cost_gbp: {type: float, desc: "Internal onboarding and set-up cost"}

  alternative_suppliers:
    key: [category, supplier_id]
    cols:
      category: {type: str, desc: "Product category, e.g. Cookware, Outerwear"}
      supplier_id: {type: str, desc: "Approved alternative supplier, e.g. SUP-0042"}
      tier: {type: enum, values: [primary, secondary, tertiary], desc: "Priority tier"}
      capability: {type: str, desc: "Key capability, e.g. seam-sealing, non-stick coating"}

  alternative_factories:
    key: [sku, factory_id]
    cols:
      sku: {type: str, desc: "SKU, e.g. SKU-100234"}
      factory_id: {type: str, desc: "Alternative factory, e.g. FAC-0107"}
      approved: {type: bool, desc: "Whether approved to make this SKU"}
      qualification_status: {type: enum, values: [approved, in_progress, pending, failed], desc: "Qualification status"}
      unit_cost_delta_pct: {type: float, desc: "Unit cost change versus the current factory, %"}
      lead_time_delta_days: {type: int, desc: "Lead time change versus the current factory, days"}
      qualification_cost_gbp: {type: float, desc: "Cost still to spend to qualify, 0 if already approved"}

  sole_source_designations:
    key: supplier_id
    cols:
      supplier_id: {type: str, desc: "Sole-source supplier, e.g. SUP-0042"}
      category: {type: str, desc: "Product category it is the only qualified source for"}
      scope: {type: str, desc: "What range or process is single-sourced"}
      reason: {type: text, desc: "Why there is no alternative"}
      alternative_status: {type: str, desc: "State of any alternative, e.g. none qualified"}
      designated_at: {type: date, desc: "Date it was designated sole source"}

  supplier_raw_materials:
    key: [supplier_id, raw_material]
    cols:
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      raw_material: {type: str, desc: "Raw material, e.g. cotton, polysilicon, leather"}
      origin_country: {type: str, desc: "Country the material is sourced from (ISO code)"}
      origin_region: {type: str, desc: "Region within that country, e.g. Xinjiang"}

  security_questionnaires:
    key: questionnaire_id
    cols:
      questionnaire_id: {type: str, desc: "Questionnaire id, e.g. SQ-000001"}
      supplier_id: {type: str, desc: "Supplier, e.g. SUP-0042"}
      sent_at: {type: date, desc: "Date sent"}
      due_date: {type: date, desc: "Date a response is due"}
      status: {type: enum, values: [sent, completed, overdue], desc: "Questionnaire status"}
      message: {type: text, desc: "What was sent"}

tools:
  # ---- calculations -------------------------------------------------------------------------------
  - name: calculate_supplier_failure_cost
    desc: Cost of a supplier failing for N weeks, from last-52-week sales of its SKUs, gross margin and stock cover. Returns inputs and formula.
    kind: sql
    args:
      supplier_id: {required: true}
      disruption_weeks: {type: int, default: 6, desc: "Weeks the supplier is out of action"}
      category: {type: str, desc: "Limit to one product category, e.g. Towels (default all the supplier's SKUs)"}
    sql: |
      WITH sk AS (
        SELECT sku, unit_cost_gbp FROM master.products
        WHERE supplier_id = $supplier_id AND ($category IS NULL OR lower(category) = lower($category))),
      sales AS (
        SELECT coalesce(sum(w.revenue_gbp), 0) AS rev52, coalesce(sum(w.store_units + w.online_units), 0) AS units52,
               coalesce(sum((w.store_units + w.online_units) * k.unit_cost_gbp), 0) AS cost52
        FROM master.sales_weekly w JOIN sk k USING (sku)
        WHERE w.week_start >= CAST($as_of AS DATE) - INTERVAL 53 WEEK),
      stock AS (
        SELECT coalesce(sum(d.on_hand), 0) AS on_hand, coalesce(sum(d.stock_value_gbp), 0) AS stock_value
        FROM master.dc_stock d JOIN sk USING (sku)),
      opo AS (
        SELECT count(*) AS open_pos FROM master.purchase_orders
        WHERE supplier_id = $supplier_id AND status IN ('open', 'confirmed', 'shipped')),
      m AS (
        SELECT sales.rev52, sales.cost52, stock.on_hand, stock.stock_value, opo.open_pos,
               sales.units52 / 52.0 AS weekly_units, sales.rev52 / 52.0 AS weekly_rev,
               stock.on_hand / nullif(sales.units52 / 52.0, 0) AS cover_weeks
        FROM sales, stock, opo)
      SELECT $supplier_id AS supplier_id, (SELECT name FROM master.suppliers WHERE supplier_id = $supplier_id) AS supplier_name,
             (SELECT count(*) FROM sk) AS skus_in_scope, $disruption_weeks AS disruption_weeks,
             round(rev52) AS revenue_52w_gbp, round(100.0 * (rev52 - cost52) / nullif(rev52, 0), 1) AS gross_margin_pct,
             on_hand AS stock_on_hand_units, round(stock_value) AS stock_value_gbp, round(cover_weeks, 1) AS stock_cover_weeks,
             open_pos AS open_purchase_orders,
             round($disruption_weeks * weekly_rev) AS revenue_at_risk_gbp,
             round($disruption_weeks * weekly_rev * (rev52 - cost52) / nullif(rev52, 0)) AS estimated_failure_cost_gbp,
             'failure cost = disruption weeks x weekly revenue x gross margin (stock cover shown for context, not netted off)' AS formula
      FROM m
    example: {supplier_id: SUP-0014}

  - name: calculate_supplier_risk_rating
    desc: Composite risk rating with reasons, combining financial health, credit, alerts, certificates, compliance, bank checks, insurance and cyber rating.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      WITH f AS (
        SELECT s.supplier_id, s.name,
          (SELECT financial_health_score FROM supplier_profiles WHERE supplier_id = s.supplier_id) AS health,
          (SELECT credit_rating FROM supplier_credit_data WHERE supplier_id = s.supplier_id ORDER BY rating_date DESC LIMIT 1) AS credit,
          (SELECT max(CASE severity WHEN 'critical' THEN 3 WHEN 'high' THEN 2 WHEN 'medium' THEN 1 ELSE 0 END)
             FROM supplier_risk_alerts WHERE supplier_id = s.supplier_id AND status = 'active') AS alert_sev,
          (SELECT count(*) FILTER (WHERE expiry_date < CAST($as_of AS DATE)) FROM supplier_certifications WHERE supplier_id = s.supplier_id) AS certs_expired,
          (SELECT count(*) FROM supplier_certifications WHERE supplier_id = s.supplier_id) AS certs_total,
          (SELECT count(*) FILTER (WHERE status = 'non_compliant' AND record_date >= CAST($as_of AS DATE) - INTERVAL 12 MONTH)
             FROM supplier_compliance_records WHERE supplier_id = s.supplier_id) AS non_compliant,
          (SELECT b.bank_country <> r.registered_country FROM supplier_bank_details b JOIN supplier_registrations r USING (supplier_id)
             WHERE b.supplier_id = s.supplier_id) AS bank_country_differs,
          (SELECT lower(b.account_holder) <> lower(r.legal_name) FROM supplier_bank_details b JOIN supplier_registrations r USING (supplier_id)
             WHERE b.supplier_id = s.supplier_id) AS holder_differs,
          (SELECT NOT verified FROM supplier_bank_details WHERE supplier_id = s.supplier_id) AS bank_unverified,
          (SELECT count(*) FILTER (WHERE expiry_date < CAST($as_of AS DATE)) FROM supplier_insurance WHERE supplier_id = s.supplier_id) AS ins_expired,
          (SELECT rating FROM supplier_cyber_security WHERE supplier_id = s.supplier_id ORDER BY assessment_date DESC LIMIT 1) AS cyber
        FROM master.suppliers s WHERE s.supplier_id = $supplier_id),
      p AS (
        SELECT *,
          CASE WHEN health < 45 THEN 3 WHEN health < 60 THEN 2 WHEN health < 70 THEN 1 ELSE 0 END AS p_fin,
          CASE WHEN credit IN ('D_poor', 'E_very_poor') THEN 2 WHEN credit = 'C_fair' THEN 1 ELSE 0 END AS p_credit,
          coalesce(alert_sev, 0) AS p_alert,
          least(certs_expired, 2) + CASE WHEN certs_total = 0 THEN 1 ELSE 0 END AS p_cert,
          CASE WHEN non_compliant > 0 THEN 2 ELSE 0 END AS p_comp,
          (CASE WHEN bank_country_differs THEN 2 ELSE 0 END) + (CASE WHEN holder_differs THEN 2 ELSE 0 END)
            + (CASE WHEN bank_unverified THEN 1 ELSE 0 END) AS p_bank,
          CASE WHEN ins_expired > 0 THEN 1 ELSE 0 END AS p_ins,
          CASE cyber WHEN 'poor' THEN 2 WHEN 'fair' THEN 1 ELSE 0 END AS p_cyber
        FROM f),
      t AS (SELECT *, p_fin + p_credit + p_alert + p_cert + p_comp + p_bank + p_ins + p_cyber AS points FROM p)
      SELECT supplier_id, name, points AS risk_points,
             CASE WHEN points >= 10 THEN 'critical' WHEN points >= 6 THEN 'high' WHEN points >= 3 THEN 'medium' ELSE 'low' END AS risk_rating,
             coalesce(nullif(array_to_string(list_filter([
               CASE WHEN p_fin > 0 THEN 'financial health score ' || CAST(health AS INTEGER) || ' is weak' END,
               CASE WHEN p_credit > 0 THEN 'credit rating ' || credit END,
               CASE WHEN p_alert > 0 THEN 'active risk alert (' || CASE p_alert WHEN 3 THEN 'critical' WHEN 2 THEN 'high' ELSE 'medium' END || ')' END,
               CASE WHEN certs_expired > 0 THEN CAST(certs_expired AS VARCHAR) || ' expired certificate(s)' END,
               CASE WHEN certs_total = 0 THEN 'no certificates on file' END,
               CASE WHEN non_compliant > 0 THEN CAST(non_compliant AS VARCHAR) || ' non-compliant finding(s) in the last 12 months' END,
               CASE WHEN bank_country_differs THEN 'bank account country differs from registered country' END,
               CASE WHEN holder_differs THEN 'account holder name differs from legal name' END,
               CASE WHEN bank_unverified THEN 'bank account not verified' END,
               CASE WHEN ins_expired > 0 THEN 'expired insurance policy' END,
               CASE WHEN cyber IN ('poor', 'fair') THEN 'cyber security rating ' || cyber END], x -> x IS NOT NULL), '; '), ''),
               'no risk indicators found') AS reasons,
             'points: financial 0-3, credit 0-2, alerts 0-3, certificates 0-3, compliance 0-2, bank 0-5, insurance 0-1, cyber 0-2; low <3, medium 3-5, high 6-9, critical 10+' AS formula
      FROM t
    example: {supplier_id: SUP-0023}

  - name: compare_onboarding_file_to_requirements
    desc: Check an onboarding case against the minimum requirements, listing each requirement's status, gaps and supplier risk indicators.
    kind: sql
    args:
      case_id: {required: true}
      file_path: {type: str, desc: "Name of the onboarding file being checked, for the record"}
    sql: |
      WITH c AS (
        SELECT c.case_id, c.supplier_id, m.name, c.status, c.risk_rating FROM onboarding_cases c
        JOIN master.suppliers m USING (supplier_id) WHERE c.case_id = $case_id),
      req AS (
        SELECT k.sequence, k.description, coalesce(i.status, 'missing') AS item_status, i.due_date
        FROM onboarding_controls k CROSS JOIN c
        LEFT JOIN onboarding_items i ON i.control_id = k.control_id AND i.case_id = c.case_id),
      ind AS (
        SELECT 1 AS n, 'Bank account country (' || b.bank_country || ') differs from registered country (' || r.registered_country || ')' AS detail
          FROM c JOIN supplier_bank_details b USING (supplier_id) JOIN supplier_registrations r USING (supplier_id) WHERE b.bank_country <> r.registered_country
        UNION ALL
        SELECT 2, 'Account holder "' || b.account_holder || '" differs from legal name "' || r.legal_name || '"'
          FROM c JOIN supplier_bank_details b USING (supplier_id) JOIN supplier_registrations r USING (supplier_id) WHERE lower(b.account_holder) <> lower(r.legal_name)
        UNION ALL
        SELECT 3, 'Bank account has not been verified' FROM c JOIN supplier_bank_details b USING (supplier_id) WHERE NOT b.verified
        UNION ALL
        SELECT 4, cert_type || ' certificate expired on ' || CAST(expiry_date AS VARCHAR)
          FROM c JOIN supplier_certifications s USING (supplier_id) WHERE s.expiry_date < CAST($as_of AS DATE)
        UNION ALL
        SELECT 5, 'Financial health score ' || CAST(p.financial_health_score AS INTEGER) || ' is below 65'
          FROM c JOIN supplier_profiles p USING (supplier_id) WHERE p.financial_health_score < 65
        UNION ALL
        SELECT 6, 'Active ' || a.severity || ' risk alert: ' || a.description
          FROM c JOIN supplier_risk_alerts a USING (supplier_id) WHERE a.status = 'active' AND a.severity IN ('high', 'critical')),
      lines AS (
        SELECT 0 AS o, 'summary' AS section, c.case_id || ' (' || c.supplier_id || ' ' || c.name || ', case ' || c.status || ')' AS item,
               CASE WHEN (SELECT count(*) FROM req WHERE item_status <> 'approved') = 0 THEN 'meets minimum requirements' ELSE 'gaps found' END AS status,
               CAST((SELECT count(*) FROM req WHERE item_status = 'approved') AS VARCHAR) || ' of ' || CAST((SELECT count(*) FROM req) AS VARCHAR)
                 || ' minimum requirements approved; ' || CAST((SELECT count(*) FROM ind) AS VARCHAR) || ' risk indicator(s)' AS detail
        FROM c
        UNION ALL
        SELECT 100 + sequence, 'requirement', description, item_status,
               CASE item_status WHEN 'approved' THEN 'met' WHEN 'missing' THEN 'no evidence on file' ELSE 'not met; due ' || CAST(due_date AS VARCHAR) END FROM req
        UNION ALL
        SELECT 200 + n, 'risk_indicator', detail, 'flag', NULL FROM ind)
      SELECT section, item, status, detail FROM lines ORDER BY o
    limit: 40
    example: {case_id: SOC-900001, file_path: onboarding_form.pdf}

  # ---- writes ---------------------------------------------------------------------------------------
  - name: create_onboarding_case
    desc: Opens a new supplier onboarding or qualification case in draft, with the risk rating and any conditions.
    kind: insert
    table: onboarding_cases
    id_prefix: SOC-
    defaults: {status: draft}
    args:
      supplier_id: {required: true}
      risk_rating: {default: medium, desc: "Provisional risk rating for the case (low, medium, high or critical)"}
      conditions: {desc: "Conditions to record on the case, if any"}
    example: {supplier_id: SUP-0056, risk_rating: medium}

  - name: create_onboarding_control
    desc: Adds a control to the onboarding checklist at a given position in the process.
    kind: insert
    table: onboarding_controls
    id_prefix: SOC-CTL-
    args:
      description: {required: true}
      control_type: {required: true}
      sequence: {type: int, required: true}
    example: {description: "Verify beneficial ownership structure", control_type: "document review", sequence: 7}

  - name: create_supplier_risk_alert
    desc: Create a risk alert or watchlist entry for a supplier, or for one of its factories.
    kind: insert
    table: supplier_risk_alerts
    id_prefix: SRA-
    defaults: {status: active}
    args:
      supplier_id: {required: true, desc: "Supplier the alert is about; for a factory alert, the supplier that owns the factory"}
      factory_id: {desc: "Factory, if the alert is about one factory, e.g. FAC-0087"}
      alert_type: {required: true}
      severity: {required: true}
      description: {required: true}
    example: {supplier_id: SUP-0046, factory_id: FAC-0087, alert_type: compliance, severity: high, description: "Adverse media on working conditions at the factory"}

  - name: update_onboarding_case_conditions
    desc: Sets the conditions on an onboarding case, such as an audit before first order or a certificate to renew.
    kind: update
    table: onboarding_cases
    args:
      conditions: {required: true, desc: "Conditions to set, e.g. audit before first order"}
    example: {case_id: SOC-900001, conditions: "Audit required before first order; renewed BSCI certificate"}

  - name: update_onboarding_case_status
    desc: Records the decision on an onboarding case (approved, conditional or rejected) and the decision date.
    kind: update
    table: onboarding_cases
    set: {completed_at: "$as_of"}
    args:
      status: {type: enum, values: [approved, conditional, rejected], required: true}
    example: {case_id: SOC-900001, status: conditional}

  - name: update_supplier_risk_status
    desc: Sets a supplier's watch or escalation status for increased monitoring, with the reason.
    kind: update
    table: supplier_profiles
    args:
      watch_status: {type: enum, values: [none, watch, escalated], required: true}
      watch_reason: {desc: "Why the supplier is being put on watch or escalated"}
    example: {supplier_id: SUP-0072, watch_status: watch, watch_reason: "Credit score falling for four quarters"}

  - name: send_supplier_security_questionnaire
    desc: Send the cyber security questionnaire to a supplier and record it as sent, with a response due date.
    kind: insert
    table: security_questionnaires
    id_prefix: SQ-
    defaults: {status: sent, message: "Cyber security questionnaire: security policy, standards, testing, incident response and access management"}
    args:
      supplier_id: {required: true}
      due_date: {type: date, default: "+14d", desc: "Date a response is due"}
    example: {supplier_id: SUP-0049}

  # ---- drafts -----------------------------------------------------------------------------------------
  - name: draft_supplier_security_questions
    desc: Draft cyber security questions for a supplier, tailored to its current rating, findings and level of access to our systems.
    kind: draft
    args:
      supplier_id: {required: true}
    sql:
      sup: SELECT supplier_id, name, country FROM master.suppliers WHERE supplier_id = $supplier_id
      cy: SELECT rating, findings, assessment_source FROM supplier_cyber_security WHERE supplier_id = $supplier_id ORDER BY assessment_date DESC LIMIT 1
      sec: SELECT rating, system_access, access_level FROM supplier_security_risk WHERE supplier_id = $supplier_id ORDER BY assessment_date DESC LIMIT 1
      alerts: SELECT description FROM supplier_risk_alerts WHERE supplier_id = $supplier_id AND alert_type = 'security' AND status = 'active'
    template: |
      CYBER SECURITY QUESTIONNAIRE for {{ sup[0].name if sup else supplier_id }} ({{ supplier_id }})
      {% if cy %}
      Current external rating: {{ cy[0].rating }} ({{ cy[0].assessment_source }}). Finding: {{ cy[0].findings }}
      {% endif %}
      {% if sec and sec[0].system_access %}
      Access to our systems: {{ sec[0].access_level }}.
      {% endif %}

      1. Do you have a documented information security policy, and who owns it?
      2. Which standards do you follow (ISO 27001, SOC 2) and when were you last audited?
      3. How often do you run penetration tests and vulnerability scans, and how fast are critical patches applied?
      4. Describe your incident response process and how quickly you would notify us of a breach.
      5. How is access to our data and systems granted, reviewed and removed?
      {% if cy and cy[0].rating in ['fair', 'poor'] %}
      6. Your external rating is {{ cy[0].rating }}: what is your remediation plan and timeline for the findings above?
      7. Is multi-factor authentication enforced for all remote and privileged access?
      {% endif %}
      {% if sec and sec[0].system_access and sec[0].access_level in ['financial', 'order_placement'] %}
      8. You hold {{ sec[0].access_level }} access to our systems: how are those credentials protected and monitored?
      {% endif %}
      {% if alerts %}
      Open security concerns on file: {% for a in alerts %}{{ a.description }}{% if not loop.last %}; {% endif %}{% endfor %}
      {% endif %}
    example: {supplier_id: SUP-0049}

  # ---- factory ---------------------------------------------------------------------------------------
  - name: get_factory_risk_rating
    desc: Current factory risk rating from its audit rating and status, with active alerts. Leave factory_id empty to rank the riskiest factories.
    kind: sql
    args:
      factory_id: {}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Only factories with this rating"}
    sql: |
      SELECT fp.factory_id, f.name, f.supplier_id, s.name AS supplier_name, f.country, fp.risk_rating,
             f.audit_rating, f.last_audit_date, f.status AS factory_status,
             (SELECT count(*) FROM supplier_risk_alerts a WHERE a.factory_id = fp.factory_id AND a.status = 'active') AS active_alerts,
             'audit rating ' || f.audit_rating || ', factory status ' || f.status
               || CASE WHEN fp.assessment_note IS NULL OR fp.assessment_note = '' THEN '' ELSE '; ' || fp.assessment_note END AS basis
      FROM factory_profiles fp
      JOIN master.factories f USING (factory_id)
      JOIN master.suppliers s ON s.supplier_id = f.supplier_id
      WHERE ($factory_id IS NULL OR fp.factory_id = $factory_id)
        AND ($risk_rating IS NULL OR fp.risk_rating = $risk_rating)
      ORDER BY CASE fp.risk_rating WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END DESC, f.capacity_units_month DESC
    limit: 20
    example: {factory_id: FAC-0087}

  - name: search_factories
    desc: Find factories by name, supplier, country or status; returns factory ids to use with other tools.
    kind: select
    from: master.factories
    filters:
      name: {op: like, desc: "Factory name or part of it"}
      supplier_id: {}
      country: {}
      status: {}
    columns: [factory_id, name, supplier_id, country, capacity_units_month, audit_rating, status]
    order: name
    limit: 30
    example: {country: VN}

  - name: list_alternative_factories_for_product
    desc: Alternative factories for a SKU with qualification status, unit cost and lead time change versus the current factory, and qualification cost.
    kind: sql
    args:
      sku: {required: true}
      qualification_status: {type: enum, values: [approved, in_progress, pending, failed], desc: "Only alternatives at this qualification status"}
    sql: |
      SELECT a.sku, p.factory_id AS current_factory_id, a.factory_id, f.name AS factory_name, f.supplier_id, f.country,
             f.capacity_units_month, f.audit_rating, f.status AS factory_status, a.approved, a.qualification_status,
             a.unit_cost_delta_pct, a.lead_time_delta_days, a.qualification_cost_gbp
      FROM alternative_factories a
      JOIN master.factories f ON f.factory_id = a.factory_id
      JOIN master.products p ON p.sku = a.sku
      WHERE a.sku = $sku AND ($qualification_status IS NULL OR a.qualification_status = $qualification_status)
      ORDER BY a.approved DESC, a.unit_cost_delta_pct
    example: {sku: SKU-100007}

  # ---- onboarding ---------------------------------------------------------------------------------------
  - name: get_onboarding_missing_items
    desc: Items still missing, submitted but unapproved or rejected for an onboarding case, with due dates and days overdue.
    kind: sql
    args:
      case_id: {required: true}
    sql: |
      SELECT c.case_id, c.supplier_id, c.status AS case_status, i.item_id, i.description, i.status AS item_status,
             i.due_date, i.submitted_at,
             greatest(0, date_diff('day', i.due_date, CAST($as_of AS DATE))) AS days_overdue
      FROM onboarding_cases c JOIN onboarding_items i ON i.case_id = c.case_id
      WHERE c.case_id = $case_id AND i.status <> 'approved'
      ORDER BY CAST(i.item_id AS INTEGER)
    example: {case_id: SOC-900001}

  - name: list_onboarding_cases_by_status
    desc: Onboarding cases with supplier, status, risk rating, age and days since last update, open cases first. Use to find stuck cases.
    kind: sql
    args:
      status: {type: enum, values: [draft, in_progress, approved, conditional, rejected], desc: "Case status"}
      risk_rating: {type: enum, values: [low, medium, high, critical], desc: "Case risk rating"}
      min_days_since_update: {type: int, desc: "Only cases not updated for at least this many days"}
    sql: |
      SELECT c.case_id, c.supplier_id, m.name AS supplier_name, m.country, c.status, c.risk_rating, c.created_at, c.updated_at,
             date_diff('day', c.created_at, CAST($as_of AS DATE)) AS age_days,
             date_diff('day', c.updated_at, CAST($as_of AS DATE)) AS days_since_update,
             (SELECT count(*) FROM onboarding_items i WHERE i.case_id = c.case_id AND i.status <> 'approved') AS open_items,
             c.conditions
      FROM onboarding_cases c JOIN master.suppliers m USING (supplier_id)
      WHERE ($status IS NULL OR c.status = $status) AND ($risk_rating IS NULL OR c.risk_rating = $risk_rating)
        AND ($min_days_since_update IS NULL OR date_diff('day', c.updated_at, CAST($as_of AS DATE)) >= $min_days_since_update)
      ORDER BY (c.status IN ('draft', 'in_progress', 'conditional')) DESC, c.updated_at ASC
    limit: 30
    example: {status: in_progress}

  - name: list_onboarding_controls
    desc: Controls in the onboarding process, in sequence order.
    kind: select
    from: onboarding_controls
    filters:
      control_type: {op: like}
    columns: [control_id, description, control_type, sequence]
    order: sequence
    limit: 50
    example: {}

  - name: get_supplier_qualification_time_and_cost
    desc: Time and cost to qualify a new supplier in a country, from typical durations, audit and testing costs and past cases.
    kind: sql
    args:
      supplier_id: {desc: "Supplier whose country to use, e.g. SUP-0056; omit when giving a country"}
      country: {type: str, desc: "Country code of the new supplier, e.g. VN; omit to list all countries"}
    sql: |
      WITH tgt AS (SELECT coalesce($country, (SELECT country FROM master.suppliers WHERE supplier_id = $supplier_id)) AS country)
      SELECT b.country, b.typical_days_to_qualify, b.factory_audit_cost_gbp, b.sample_testing_cost_gbp, b.onboarding_admin_cost_gbp,
             b.factory_audit_cost_gbp + b.sample_testing_cost_gbp + b.onboarding_admin_cost_gbp AS total_cost_gbp,
             (SELECT count(*) FROM onboarding_cases c JOIN master.suppliers s USING (supplier_id)
                WHERE s.country = b.country AND c.completed_at IS NOT NULL AND c.status = 'approved') AS past_cases,
             (SELECT round(avg(date_diff('day', c.created_at, c.completed_at))) FROM onboarding_cases c JOIN master.suppliers s USING (supplier_id)
                WHERE s.country = b.country AND c.completed_at IS NOT NULL AND c.status = 'approved') AS past_cases_avg_days,
             (SELECT string_agg(c.case_id || ' (' || c.status || ')', ', ') FROM onboarding_cases c WHERE c.supplier_id = $supplier_id) AS cases_for_supplier,
             'total cost = audit + sample testing + onboarding admin' AS formula
      FROM qualification_benchmarks b, tgt
      WHERE tgt.country IS NULL OR b.country = upper(tgt.country)
      ORDER BY b.country
    example: {country: VN}

  # ---- supplier financial and risk profile ----------------------------------------------------------------
  - name: get_supplier_financial_health_score
    desc: Financial health score 0-100 with band, latest credit rating, liquidity, margin and red flags. Omit supplier_id to list the weakest.
    kind: sql
    args:
      supplier_id: {}
      max_score: {type: float, desc: "Only suppliers scoring at or below this, e.g. 55"}
    sql: |
      WITH fl AS (
        SELECT supplier_id, current_ratio, debt_to_equity, round(100.0 * profit_gbp / nullif(revenue_gbp, 0), 1) AS profit_margin_pct,
               filing_date, lag(profit_gbp) OVER (PARTITION BY supplier_id ORDER BY filing_date DESC) AS dummy,
               row_number() OVER (PARTITION BY supplier_id ORDER BY filing_date DESC) AS rn,
               profit_gbp, revenue_gbp
        FROM supplier_financial_filings),
      lf AS (SELECT a.supplier_id, a.current_ratio, a.debt_to_equity, a.profit_margin_pct, a.filing_date,
                    (a.profit_gbp < 0.7 * b.profit_gbp) AS profit_falling
             FROM fl a LEFT JOIN fl b ON a.supplier_id = b.supplier_id AND b.rn = 2 WHERE a.rn = 1),
      cr AS (SELECT supplier_id, credit_rating, credit_score,
                    credit_score - lag(credit_score, 4) OVER (PARTITION BY supplier_id ORDER BY rating_date DESC) AS dummy_unused,
                    row_number() OVER (PARTITION BY supplier_id ORDER BY rating_date DESC) AS rn
             FROM supplier_credit_data),
      cr1 AS (SELECT a.supplier_id, a.credit_rating, a.credit_score, a.credit_score - e.credit_score AS score_change_12m
              FROM cr a LEFT JOIN cr e ON e.supplier_id = a.supplier_id AND e.rn = 5 WHERE a.rn = 1)
      SELECT p.supplier_id, s.name, p.financial_health_score,
             CASE WHEN p.financial_health_score >= 70 THEN 'healthy' WHEN p.financial_health_score >= 50 THEN 'watch' ELSE 'distressed' END AS score_band,
             cr1.credit_rating AS latest_credit_rating, cr1.credit_score, cr1.score_change_12m AS credit_score_change_12m,
             lf.current_ratio, lf.debt_to_equity, lf.profit_margin_pct, lf.filing_date AS latest_filing_date, p.watch_status,
             coalesce(nullif(array_to_string(list_filter([
               CASE WHEN lf.current_ratio < 1.2 THEN 'low liquidity (current ratio ' || lf.current_ratio || ')' END,
               CASE WHEN lf.debt_to_equity > 2 THEN 'high debt (debt to equity ' || lf.debt_to_equity || ')' END,
               CASE WHEN lf.profit_falling THEN 'profit down by more than 30% year on year' END,
               CASE WHEN cr1.score_change_12m <= -50 THEN 'credit score down ' || CAST(-cr1.score_change_12m AS INTEGER) || ' points in 12 months' END,
               CASE WHEN cr1.credit_rating IN ('D_poor', 'E_very_poor') THEN 'poor credit rating' END], x -> x IS NOT NULL), '; '), ''),
               'none') AS red_flags
      FROM supplier_profiles p
      JOIN master.suppliers s USING (supplier_id)
      LEFT JOIN lf USING (supplier_id)
      LEFT JOIN cr1 USING (supplier_id)
      WHERE ($supplier_id IS NULL OR p.supplier_id = $supplier_id)
        AND ($max_score IS NULL OR p.financial_health_score <= $max_score)
      ORDER BY p.financial_health_score
    limit: 20
    example: {supplier_id: SUP-0053}

  - name: get_supplier_credit_rating
    desc: Latest credit rating and score for a supplier, with the change over the last quarter and last 12 months.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      WITH c AS (SELECT *, row_number() OVER (ORDER BY rating_date DESC) AS rn FROM supplier_credit_data WHERE supplier_id = $supplier_id)
      SELECT a.supplier_id, a.rating_date, a.credit_rating, a.credit_score, a.days_payable_outstanding, a.payment_default_count,
             a.credit_score - q.credit_score AS change_vs_prior_quarter, a.credit_score - y.credit_score AS change_vs_12m_ago,
             CASE WHEN a.credit_score - y.credit_score <= -30 THEN 'deteriorating' WHEN a.credit_score - y.credit_score >= 30 THEN 'improving' ELSE 'stable' END AS trend
      FROM c a LEFT JOIN c q ON q.rn = 2 LEFT JOIN c y ON y.rn = 5 WHERE a.rn = 1
    example: {supplier_id: SUP-0053}

  - name: get_supplier_credit_scores
    desc: Credit scores and ratings over time, newest first, with the change from the previous reading.
    kind: sql
    args:
      supplier_id: {required: true}
      months_back: {type: int, default: 12, desc: "History in months"}
    sql: |
      SELECT supplier_id, rating_date, credit_rating, credit_score,
             credit_score - lead(credit_score) OVER (ORDER BY rating_date DESC) AS score_change,
             days_payable_outstanding, payment_default_count
      FROM supplier_credit_data
      WHERE supplier_id = $supplier_id
      QUALIFY rating_date >= CAST($as_of AS DATE) - INTERVAL ($months_back || ' MONTH')
      ORDER BY rating_date DESC
    example: {supplier_id: SUP-0028, months_back: 12}

  - name: get_supplier_financial_filings
    desc: Filed accounts for a supplier, newest first, with revenue, profit, cash, debt and key ratios.
    kind: select
    from: supplier_financial_filings
    filters:
      supplier_id: {}
    order: filing_date DESC
    limit: 5
    example: {supplier_id: SUP-0028}

  - name: get_supplier_criticality_rating
    desc: Criticality rating of a supplier with spend share, SKUs, factories and sole-source status. Omit supplier_id to list by rating.
    kind: sql
    args:
      supplier_id: {}
      criticality_rating: {type: enum, values: [low, medium, high, critical], desc: "Only suppliers with this rating"}
    sql: |
      SELECT s.supplier_id, s.name, s.country, s.category_focus, p.criticality_rating, s.annual_spend_gbp,
             round(100.0 * s.annual_spend_gbp / (SELECT sum(annual_spend_gbp) FROM master.suppliers WHERE status <> 'exited'), 1) AS pct_of_total_spend,
             (SELECT count(*) FROM master.products x WHERE x.supplier_id = s.supplier_id) AS skus_supplied,
             (SELECT count(*) FROM master.factories f WHERE f.supplier_id = s.supplier_id) AS factories,
             (SELECT d.scope || ' (' || d.alternative_status || ')' FROM sole_source_designations d WHERE d.supplier_id = s.supplier_id) AS sole_source,
             p.watch_status, p.last_assessed_at
      FROM master.suppliers s JOIN supplier_profiles p USING (supplier_id)
      WHERE ($supplier_id IS NULL OR s.supplier_id = $supplier_id)
        AND ($criticality_rating IS NULL OR p.criticality_rating = $criticality_rating)
      ORDER BY CASE p.criticality_rating WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END DESC, s.annual_spend_gbp DESC
    limit: 20
    example: {supplier_id: SUP-0072}

  - name: get_supplier_risk_alerts
    desc: Risk alerts for a supplier or factory with type, severity and description, newest first. Defaults to active alerts.
    kind: select
    from: supplier_risk_alerts
    filters:
      supplier_id: {}
      factory_id: {}
      status: {default: active}
      severity: {}
      alert_type: {}
    columns: [alert_id, supplier_id, factory_id, alert_type, severity, description, raised_at, status]
    order: raised_at DESC
    limit: 20
    example: {supplier_id: SUP-0053}

  - name: list_suppliers_with_risk_alerts
    desc: Suppliers with risk alerts, worst severity first, with description, date raised and the supplier's financial health score.
    kind: sql
    args:
      status: {type: enum, values: [active, resolved, dismissed], default: active, desc: "Alert status"}
      severity: {}
      alert_type: {}
      raised_from: {type: date, desc: "Only alerts raised on or after this date, e.g. -30d"}
    sql: |
      SELECT a.alert_id, a.supplier_id, s.name AS supplier_name, s.country, a.factory_id, a.alert_type, a.severity, a.description,
             a.raised_at, p.financial_health_score, p.watch_status
      FROM supplier_risk_alerts a
      JOIN master.suppliers s USING (supplier_id)
      LEFT JOIN supplier_profiles p USING (supplier_id)
      WHERE ($status IS NULL OR a.status = $status) AND ($severity IS NULL OR a.severity = $severity)
        AND ($alert_type IS NULL OR a.alert_type = $alert_type)
        AND ($raised_from IS NULL OR a.raised_at >= CAST($raised_from AS DATE))
      ORDER BY CASE a.severity WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END DESC, a.raised_at DESC
    limit: 50
    example: {status: active}

  - name: get_supplier_certifications
    desc: Certificates with expiry and computed status (current, expiring_soon, expired). Filter by supplier, certificate type or country.
    kind: sql
    args:
      supplier_id: {}
      cert_type: {type: str, desc: "Certificate type or part of it, e.g. OEKO-TEX, GOTS, BSCI"}
      country: {type: str, desc: "Supplier country code, e.g. PT or TR"}
      status: {type: enum, values: [current, expiring_soon, expired], desc: "Only certificates with this status"}
    sql: |
      WITH c AS (
        SELECT c.supplier_id, s.name AS supplier_name, s.country, c.cert_type, c.issuer, c.issue_date, c.expiry_date,
               CASE WHEN CAST($as_of AS DATE) > c.expiry_date THEN 'expired'
                    WHEN CAST($as_of AS DATE) > c.expiry_date - INTERVAL 30 DAY THEN 'expiring_soon' ELSE 'current' END AS status,
               c.scope
        FROM supplier_certifications c JOIN master.suppliers s USING (supplier_id)
        WHERE ($supplier_id IS NULL OR c.supplier_id = $supplier_id)
          AND ($cert_type IS NULL OR c.cert_type ILIKE '%' || $cert_type || '%')
          AND ($country IS NULL OR s.country = upper($country)))
      SELECT * FROM c WHERE $status IS NULL OR status = $status ORDER BY supplier_id, expiry_date DESC
    limit: 40
    example: {supplier_id: SUP-0023}

  - name: get_supplier_insurance_certificates
    desc: Supplier insurance policies with cover limits, expiry date and computed status (current, expiring_soon, expired).
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, policy_type, provider, policy_number, coverage_gbp, issue_date, expiry_date,
             CASE WHEN CAST($as_of AS DATE) > expiry_date THEN 'expired'
                  WHEN CAST($as_of AS DATE) > expiry_date - INTERVAL 30 DAY THEN 'expiring_soon' ELSE 'current' END AS status
      FROM supplier_insurance
      WHERE supplier_id = $supplier_id
      ORDER BY policy_type
    example: {supplier_id: SUP-0015}

  - name: get_supplier_compliance_history
    desc: Compliance findings for a supplier or one of its factories over recent months, newest first, with outcome by area.
    kind: sql
    args:
      supplier_id: {}
      factory_id: {}
      months_back: {type: int, default: 12, desc: "Number of months to show"}
      status: {type: enum, values: [compliant, non_compliant, exception], desc: "Only findings with this outcome"}
    sql: |
      SELECT r.supplier_id, r.factory_id, r.record_date, r.compliance_area, r.finding, r.status
      FROM supplier_compliance_records r
      WHERE ($supplier_id IS NULL OR r.supplier_id = $supplier_id) AND ($factory_id IS NULL OR r.factory_id = $factory_id)
        AND ($status IS NULL OR r.status = $status)
        AND r.record_date >= CAST($as_of AS DATE) - INTERVAL ($months_back || ' MONTH')
      ORDER BY r.record_date DESC
    limit: 30
    example: {factory_id: FAC-0099}

  - name: get_supplier_bank_details
    desc: Supplier bank details (account number masked) with bank country, currency and verification status.
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT supplier_id, bank_name, account_holder, '****' || right(account_number, 4) AS account_number, sort_code,
             bank_country, currency, verified, last_verified_at
      FROM supplier_bank_details
      WHERE supplier_id = $supplier_id
    example: {supplier_id: SUP-0023}

  - name: get_supplier_registration_details
    desc: "Registration details of a supplier: legal name, registration number, registered address and country, owner and tax id."
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT m.supplier_id, r.legal_name, r.registration_number, r.registered_address, r.registered_country,
             r.incorporation_date, r.ultimate_owner, r.tax_id, m.status AS supplier_status
      FROM master.suppliers m LEFT JOIN supplier_registrations r USING (supplier_id)
      WHERE m.supplier_id = $supplier_id
    example: {supplier_id: SUP-0023}

  - name: run_bank_account_verification
    desc: "Verify a supplier's bank account against its registration: country, account holder name and prior verification. Returns the result."
    kind: sql
    args:
      supplier_id: {required: true}
    sql: |
      SELECT b.supplier_id, r.legal_name, b.account_holder, b.bank_name, b.bank_country AS bank_country, r.registered_country,
             b.bank_country = r.registered_country AS country_matches,
             lower(b.account_holder) = lower(r.legal_name) AS holder_matches_legal_name,
             b.verified AS previously_verified, b.last_verified_at,
             CASE WHEN b.bank_country <> r.registered_country AND lower(b.account_holder) <> lower(r.legal_name)
                    THEN 'failed: bank country and account holder both differ from the registration'
                  WHEN b.bank_country <> r.registered_country THEN 'failed: bank country differs from registered country'
                  WHEN lower(b.account_holder) <> lower(r.legal_name) THEN 'failed: account holder differs from legal name'
                  WHEN NOT b.verified THEN 'unverified: details match the registration but the bank has not confirmed them'
                  ELSE 'verified' END AS verification_status
      FROM supplier_bank_details b JOIN supplier_registrations r USING (supplier_id)
      WHERE b.supplier_id = $supplier_id
    example: {supplier_id: SUP-0023}

  - name: get_supplier_cyber_security_ratings
    desc: External cyber security ratings, worst first. One supplier returns its recent history; without supplier_id, the latest rating per supplier.
    kind: sql
    args:
      supplier_id: {}
      rating: {type: enum, values: [excellent, good, fair, poor], desc: "Only suppliers with this rating"}
    sql: |
      SELECT c.supplier_id, s.name AS supplier_name, c.assessment_date, c.rating, c.assessment_source, c.findings
      FROM supplier_cyber_security c JOIN master.suppliers s USING (supplier_id)
      WHERE ($supplier_id IS NULL OR c.supplier_id = $supplier_id) AND ($rating IS NULL OR c.rating = $rating)
      QUALIFY row_number() OVER (PARTITION BY c.supplier_id ORDER BY c.assessment_date DESC) <= CASE WHEN $supplier_id IS NULL THEN 1 ELSE 5 END
      ORDER BY CASE c.rating WHEN 'poor' THEN 1 WHEN 'fair' THEN 2 WHEN 'good' THEN 3 ELSE 4 END, c.assessment_date DESC
    limit: 30
    example: {supplier_id: SUP-0049}

  - name: get_supplier_security_risk_rating
    desc: Security risk rating from the latest assessment with system access and access level, highest risk first. Omit supplier_id to rank.
    kind: sql
    args:
      supplier_id: {}
      rating: {type: enum, values: [low, medium, high, critical], desc: "Only suppliers with this rating"}
      system_access: {type: bool, desc: "True to only list suppliers connected to our systems"}
    sql: |
      SELECT s.supplier_id, m.name AS supplier_name, m.country, s.assessment_date, s.rating, s.system_access, s.access_level,
             c.rating AS cyber_rating, p.criticality_rating
      FROM (SELECT * FROM supplier_security_risk QUALIFY row_number() OVER (PARTITION BY supplier_id ORDER BY assessment_date DESC) = 1) s
      JOIN master.suppliers m USING (supplier_id)
      LEFT JOIN supplier_profiles p USING (supplier_id)
      LEFT JOIN (SELECT * FROM supplier_cyber_security QUALIFY row_number() OVER (PARTITION BY supplier_id ORDER BY assessment_date DESC) = 1) c USING (supplier_id)
      WHERE ($supplier_id IS NULL OR s.supplier_id = $supplier_id) AND ($rating IS NULL OR s.rating = $rating)
        AND ($system_access IS NULL OR s.system_access = $system_access)
      ORDER BY CASE s.rating WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END DESC, s.system_access DESC, m.annual_spend_gbp DESC
    limit: 15
    example: {system_access: true}

  - name: list_critical_suppliers_and_logistics_providers
    desc: Suppliers and logistics providers at or above a criticality level, most critical first, with cyber rating and system access.
    kind: sql
    args:
      min_criticality: {type: enum, values: [medium, high, critical], default: critical, desc: "Lowest criticality to include"}
      party_type: {type: enum, values: [supplier, logistics], desc: "Only suppliers or only logistics providers"}
    sql: |
      WITH parties AS (
        SELECT p.supplier_id AS party_id, 'supplier' AS party_type, s.name, s.country, p.criticality_rating, s.annual_spend_gbp,
               (SELECT rating FROM supplier_cyber_security c WHERE c.supplier_id = p.supplier_id ORDER BY assessment_date DESC LIMIT 1) AS cyber_rating,
               (SELECT system_access FROM supplier_security_risk x WHERE x.supplier_id = p.supplier_id ORDER BY assessment_date DESC LIMIT 1) AS system_access
        FROM supplier_profiles p JOIN master.suppliers s USING (supplier_id)
        UNION ALL
        SELECT l.carrier_id, 'logistics', c.name, c.country, l.criticality_rating, NULL, l.cyber_rating, l.system_access
        FROM logistics_provider_risk l JOIN master.carriers c USING (carrier_id)),
      r AS (SELECT *, CASE criticality_rating WHEN 'critical' THEN 4 WHEN 'high' THEN 3 WHEN 'medium' THEN 2 ELSE 1 END AS rk FROM parties)
      SELECT party_id, party_type, name, country, criticality_rating, annual_spend_gbp, cyber_rating, system_access
      FROM r
      WHERE rk >= CASE $min_criticality WHEN 'critical' THEN 4 WHEN 'high' THEN 3 ELSE 2 END
        AND ($party_type IS NULL OR party_type = $party_type)
      ORDER BY rk DESC, annual_spend_gbp DESC NULLS LAST
    limit: 40
    example: {}

  # ---- sole source, alternatives, exposure -----------------------------------------------------------------
  - name: list_sole_source_suppliers
    desc: "Sole-source suppliers with no approved alternative: scope, reason, spend, SKUs supplied and 52-week sales of those SKUs."
    kind: sql
    args:
      country: {type: str, desc: "Supplier country code, e.g. CN"}
    sql: |
      SELECT d.supplier_id, s.name, s.country, d.category, d.scope, d.alternative_status, d.reason, s.annual_spend_gbp,
             (SELECT count(*) FROM master.products x WHERE x.supplier_id = d.supplier_id AND x.category = d.category) AS skus_in_category,
             (SELECT round(sum(w.revenue_gbp)) FROM master.sales_weekly w JOIN master.products x USING (sku)
                WHERE x.supplier_id = d.supplier_id AND x.category = d.category AND w.week_start >= CAST($as_of AS DATE) - INTERVAL 53 WEEK) AS category_revenue_52w_gbp
      FROM sole_source_designations d JOIN master.suppliers s USING (supplier_id)
      WHERE $country IS NULL OR s.country = upper($country)
      ORDER BY s.annual_spend_gbp DESC
    limit: 30
    example: {}

  - name: list_alternative_suppliers_for_category
    desc: Approved alternative suppliers for a product category, with tier, capability, country, on-time rate and financial health.
    kind: sql
    args:
      category: {}
      capability: {type: str, desc: "Capability or part of it, e.g. seam-sealing, non-stick coating"}
    sql: |
      SELECT a.category, a.supplier_id, m.name AS supplier_name, m.country, a.tier, a.capability, m.otif_pct_12m,
             m.annual_spend_gbp AS current_annual_spend_gbp, p.financial_health_score
      FROM alternative_suppliers a
      JOIN master.suppliers m USING (supplier_id)
      LEFT JOIN supplier_profiles p USING (supplier_id)
      WHERE ($category IS NULL OR lower(a.category) = lower($category))
        AND ($capability IS NULL OR a.capability ILIKE '%' || $capability || '%')
      ORDER BY a.category, CASE a.tier WHEN 'primary' THEN 1 WHEN 'secondary' THEN 2 ELSE 3 END
    limit: 30
    example: {category: Cookware}

  - name: get_supplier_concentration_exposure
    desc: Spend concentration by supplier, optionally within a department or country, with share of total spend, running total, country share and criticality.
    kind: sql
    args:
      category_focus: {desc: "Department, e.g. Home, Kids, Electricals"}
      country: {type: str, desc: "Supplier country code, e.g. CN"}
    sql: |
      WITH base AS (
        SELECT s.supplier_id, s.name, s.country, s.category_focus, s.annual_spend_gbp AS spend_gbp
        FROM master.suppliers s WHERE s.status <> 'exited'),
      all_s AS (
        SELECT *, sum(spend_gbp) OVER () AS total, sum(spend_gbp) OVER (PARTITION BY country) AS country_total FROM base),
      t AS (
        SELECT * FROM all_s
        WHERE ($category_focus IS NULL OR lower(category_focus) = lower($category_focus))
          AND ($country IS NULL OR country = upper($country)))
      SELECT t.supplier_id, t.name, t.country, t.category_focus, t.spend_gbp,
             round(100.0 * t.spend_gbp / t.total, 1) AS pct_of_spend,
             round(100.0 * sum(t.spend_gbp) OVER (ORDER BY t.spend_gbp DESC) / t.total, 1) AS cumulative_pct,
             round(100.0 * t.country_total / t.total, 1) AS country_pct_of_spend,
             (SELECT count(*) FROM master.products x WHERE x.supplier_id = t.supplier_id) AS sku_count,
             p.criticality_rating, d.scope AS sole_source_scope
      FROM t LEFT JOIN supplier_profiles p USING (supplier_id) LEFT JOIN sole_source_designations d USING (supplier_id)
      ORDER BY t.spend_gbp DESC
    limit: 30
    example: {category_focus: Home}

  - name: get_supplier_country_exposure
    desc: "Supplier exposure by country: supplier count, spend and share, critical suppliers and active high or critical alerts."
    kind: sql
    args: {}
    sql: |
      WITH live AS (SELECT * FROM master.suppliers WHERE status <> 'exited')
      SELECT s.country, count(*) AS supplier_count, round(sum(s.annual_spend_gbp)) AS total_spend_gbp,
             round(100.0 * sum(s.annual_spend_gbp) / sum(sum(s.annual_spend_gbp)) OVER (), 1) AS spend_pct,
             count(*) FILTER (WHERE p.criticality_rating = 'critical') AS critical_suppliers,
             count(*) FILTER (WHERE p.security_risk_rating IN ('high', 'critical')) AS high_security_risk_suppliers,
             (SELECT count(*) FROM supplier_risk_alerts a JOIN live l2 USING (supplier_id)
                WHERE l2.country = s.country AND a.status = 'active' AND a.severity IN ('high', 'critical')) AS active_high_alerts
      FROM live s LEFT JOIN supplier_profiles p USING (supplier_id)
      GROUP BY s.country ORDER BY total_spend_gbp DESC
    example: {}

  - name: list_suppliers_by_country_and_sector
    desc: Suppliers grouped by country and sector (department), with status, spend and master risk rating, for geopolitical risk assessment.
    kind: select
    from: master.suppliers
    filters:
      country: {}
      category_focus: {}
      status: {}
    columns: [supplier_id, name, country, category_focus, status, annual_spend_gbp, risk_rating]
    order: country, annual_spend_gbp DESC
    limit: 50
    example: {country: CN}

  - name: list_suppliers_by_raw_material
    desc: Suppliers using a raw material (e.g. cotton, polysilicon) with origin country and region, flagging high forced-labour-risk origins.
    kind: sql
    args:
      raw_material: {type: str, desc: "Raw material or part of it, e.g. cotton, polysilicon, leather"}
      origin_country: {type: str, desc: "Origin country code, e.g. CN"}
      origin_region: {type: str, desc: "Origin region, e.g. Xinjiang"}
    sql: |
      SELECT r.supplier_id, s.name AS supplier_name, s.country AS supplier_country, s.category_focus, r.raw_material,
             r.origin_country, r.origin_region, s.annual_spend_gbp,
             coalesce(r.origin_region ILIKE 'Xinjiang%', false) AS high_forced_labour_risk_origin
      FROM supplier_raw_materials r JOIN master.suppliers s USING (supplier_id)
      WHERE s.status <> 'exited'
        AND ($raw_material IS NULL OR r.raw_material ILIKE '%' || $raw_material || '%')
        AND ($origin_country IS NULL OR r.origin_country = upper($origin_country))
        AND ($origin_region IS NULL OR r.origin_region ILIKE '%' || $origin_region || '%')
      ORDER BY high_forced_labour_risk_origin DESC, s.annual_spend_gbp DESC
    limit: 50
    example: {raw_material: cotton}

  - name: list_suppliers_in_affected_regions
    desc: Suppliers in an affected country or production region, with spend, criticality, factories, capacity and active alerts. Use region for a named area such as Southern Vietnam.
    kind: sql
    args:
      country: {type: str, desc: "Affected country code, e.g. VN"}
      region: {type: str, desc: "Affected production region or part of it, e.g. Southern Vietnam, Chattogram"}
      category_focus: {desc: "Department, e.g. Home"}
    sql: |
      SELECT s.supplier_id, s.name, s.country, p.region, s.category_focus, s.annual_spend_gbp, p.criticality_rating,
             (SELECT count(*) FROM master.factories f WHERE f.supplier_id = s.supplier_id AND f.status <> 'delisted') AS factories,
             (SELECT sum(f.capacity_units_month) FROM master.factories f WHERE f.supplier_id = s.supplier_id AND f.status <> 'delisted') AS capacity_units_month,
             (SELECT count(*) FROM supplier_risk_alerts a WHERE a.supplier_id = s.supplier_id AND a.status = 'active') AS active_alerts
      FROM master.suppliers s LEFT JOIN supplier_profiles p USING (supplier_id)
      WHERE s.status <> 'exited' AND ($country IS NULL OR s.country = upper($country))
        AND ($region IS NULL OR p.region ILIKE '%' || $region || '%')
        AND ($category_focus IS NULL OR lower(s.category_focus) = lower($category_focus))
      ORDER BY s.annual_spend_gbp DESC
    limit: 50
    example: {country: VN}
