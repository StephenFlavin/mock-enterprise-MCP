# Scenarios for stage 1 supplier_risk tools (21 tools)
# Question references map to the brief output (system:section:question_number format)

- question: "02:14:Q6"
  story: >
    The customs specialist needs to identify suppliers of cotton and polysilicon-based products that could face
    forced-labour import risks. List suppliers by raw material category (cotton suppliers) and assess their exposure.
  checks:
    - tool: list_suppliers_by_raw_material
      args: {category_focus: Womenswear}
      expect: ["supplier_id", "name", "country"]

- question: "04:32:Q6"
  story: >
    A category buyer wants to know which of their top suppliers are in trouble. SUP-0002 has a high severity alert
    (credit score deteriorating), SUP-0004 has critical compliance issues, and SUP-0010 has medium delivery delays.
    Get financial health scores and risk alerts to prioritize.
  checks:
    - tool: list_suppliers_with_risk_alerts
      args: {status: active, severity: high}
      expect: ["SRA-900001", "SUP-0002"]
    - tool: get_supplier_financial_health_score
      args: {supplier_id: SUP-0002}
      expect: ["SUP-0002", "72"]

- question: "04:32:Q7"
  story: >
    For an annual review with the largest cookware supplier, get alternative suppliers by category to assess leverage.
    SUP-0001 (primary), SUP-0003 (secondary), SUP-0010 (secondary) are approved alternatives.
  checks:
    - tool: list_alternative_suppliers_for_category
      args: {category: Cookware}
      expect: ["SUP-0001", "primary", "SUP-0003", "secondary"]

- question: "04:34:Q2"
  story: >
    Finding suppliers in Portugal and Turkey that can make technical outerwear with OEKO-TEX certification
    and 30k unit capacity. Check SUP-0001 has OEKO-TEX certification (issued 2024-06-01, expires 2025-05-31).
  checks:
    - tool: get_supplier_certifications
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001", "OEKO-TEX", "current"]

- question: "04:35:Q1"
  story: >
    Supplier relationship manager has concerns about SUP-0002 performance. Check financial health (score 72, credit C_fair),
    compliance history showing excessive overtime, and risk alerts. Get criticality rating.
  checks:
    - tool: get_supplier_financial_health_score
      args: {supplier_id: SUP-0002}
      expect: ["SUP-0002", "72"]
    - tool: get_supplier_compliance_history
      args: {supplier_id: SUP-0002, months_back: 12}
      expect: ["labour", "non_compliant", "Excessive overtime hours"]

- question: "04:35:Q2"
  story: >
    Check financial health of top 20 suppliers (using sample). SUP-0001 (health score 85, rating B_good),
    SUP-0004 (health score 45, rating D_poor with defaults). Flag deteriorating ones and put on watch.
  checks:
    - tool: get_supplier_credit_rating
      args: {supplier_id: SUP-0004}
      expect: ["SUP-0004", "credit_rating"]
    - tool: update_supplier_risk_status
      args: {supplier_id: SUP-0004, watch_status: escalated}
      expect: ["SUP-0004"]

- question: "04:35:Q3"
  story: >
    For consolidation analysis, assess criticality of top suppliers. SUP-0001 is critical (health 85),
    SUP-0002 is high (health 72), SUP-0010 is critical (health 92 and no alerts).
  checks:
    - tool: get_supplier_criticality_rating
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001", "critical"]
    - tool: get_supplier_criticality_rating
      args: {supplier_id: SUP-0010}
      expect: ["SUP-0010", "critical"]

- question: "04:35:Q4"
  story: >
    If SUP-0010 (largest packaging supplier) failed for 6 weeks, assess backup plan. Get alternative suppliers
    and qualification time/cost. Check critical concentration on SUP-0010.
  checks:
    - tool: get_supplier_concentration_exposure
      args: {category: Packaging}
      expect: ["supplier_id", "spend_gbp", "spend_pct_of_category"]

- question: "04:37:Q1"
  story: >
    Indirect procurement manager evaluates bids for cleaning contract. Need financial health scores for all four
    bidders. Get scores for SUP-0001 (85) and SUP-0004 (45) to assess risk.
  checks:
    - tool: get_supplier_financial_health_score
      args: {supplier_id: SUP-0001}
      expect: ["85"]

- question: "04:38:Q3"
  story: >
    Legal counsel wants to know insurance requirements. SUP-0001 has General Liability and Product Liability coverage.
    SUP-0004 may have expired insurance.
  checks:
    - tool: get_supplier_insurance_certificates
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001", "policy_type", "General Liability"]
    - tool: get_supplier_insurance_certificates
      args: {supplier_id: SUP-0004}
      expect: ["SUP-0004", "policy_type"]

- question: "04:41:Q1"
  story: >
    Run due diligence on prospective cosmetics packaging supplier Sunrise Pack Co Ltd (SUP-0004 in Guangdong).
    Check certifications, financial health, and calculate risk rating combining all factors. Create onboarding case.
  checks:
    - tool: get_supplier_certifications
      args: {supplier_id: SUP-0004}
      expect: ["SUP-0004", "cert_type"]
    - tool: get_supplier_financial_health_score
      args: {supplier_id: SUP-0004}
      expect: ["financial_health_score"]
    - tool: calculate_supplier_risk_rating
      args: {supplier_id: SUP-0004}
      expect: ["risk_rating"]
    - tool: create_onboarding_case
      args: {supplier_id: SUP-0050, risk_rating: medium}
      expect: ["SOC-"]

- question: "04:41:Q3"
  story: >
    Check if supplier's bank account is in different country from registered address. Sunrise Pack Co Ltd has bank
    in China (CN) but needs verification. Get bank details and registration.
  checks:
    - tool: get_supplier_bank_details
      args: {supplier_id: SUP-0004}
      expect: ["Industrial and Commercial Bank", "CN", "verified"]
    - tool: run_bank_account_verification
      args: {supplier_id: SUP-0004}
      expect: ["verification_status"]

- question: "04:41:Q4"
  story: >
    Find onboarding cases stuck with missing items. SOC-900001 (SUP-0050) has 5 items, with 2 still required/submitted.
    SOC-900003 (SUP-0052) has 1 rejected item needing resubmission.
  checks:
    - tool: list_onboarding_cases_by_status
      args: {status: in_progress}
      expect: ["SOC-900001", "SUP-0050", "in_progress"]
    - tool: get_onboarding_missing_items
      args: {case_id: SOC-900001}
      expect: ["items_not_approved", "5"]

- question: "04:41:Q5"
  story: >
    Check if prospective supplier meets minimum onboarding requirements. SOC-900003 (SUP-0052) has 11 items total,
    with 2 approved, 1 submitted, 1 rejected. Overall 27% completion — gaps found.
  checks:
    - tool: compare_onboarding_file_to_requirements
      args: {case_id: SOC-900003, file_path: onboarding_form.pdf}
      expect: ["gaps found"]

- question: "04:41:Q6"
  story: >
    Add missing fraud checks to onboarding control list. Existing controls are registration (SOC-CTL-001),
    sanctions (SOC-CTL-002), credit (SOC-CTL-003), certs (SOC-CTL-004), management (SOC-CTL-005), E&S (SOC-CTL-006).
    Add beneficial ownership verification as new control.
  checks:
    - tool: list_onboarding_controls
      args: {}
      expect: ["SOC-CTL-001", "Verify company registration", "1"]
    - tool: create_onboarding_control
      args: {description: "Verify beneficial ownership structure", control_type: "document review", sequence: 7}
      expect: ["SOC-CTL-", "Verify beneficial ownership"]

- question: "05:43:Q3"
  story: >
    Factory auditor checks news about FAC-0005 and finds concerning reports. Get factory risk rating (currently high
    from last_assessed_at 2026-07-15). Create a risk alert for further investigation.
  checks:
    - tool: get_factory_risk_rating
      args: {factory_id: FAC-0005}
      expect: ["FAC-0005", "high"]
    - tool: create_supplier_risk_alert
      args: {supplier_id: SUP-0002, factory_id: FAC-0005, alert_type: compliance, severity: critical, description: "NGO reports labour violations"}
      expect: ["SRA-", "critical"]

- question: "05:46:Q8"
  story: >
    Ethical trade manager discovers NGO flagged labour issues in suppliers' countries. Raise alerts on affected
    suppliers and factories. Create alerts for SUP-0004 (critical labour findings) and FAC-0005.
  checks:
    - tool: create_supplier_risk_alert
      args: {supplier_id: SUP-0004, alert_type: compliance, severity: critical, description: "Child labour indicators in factory audit"}
      expect: ["SRA-"]

- question: "05:50:Q3"
  story: >
    Supply chain risk analyst checks financial health of sole-source suppliers. Need credit scores/ratings and
    filing data to assess risk of supplier failure.
  checks:
    - tool: get_supplier_credit_scores
      args: {supplier_id: SUP-0001, months_back: 12}
      expect: ["SUP-0001", "credit_rating"]
    - tool: get_supplier_financial_filings
      args: {supplier_id: SUP-0010}
      expect: ["SUP-0010", "revenue_gbp"]
    - tool: calculate_supplier_failure_cost
      args: {supplier_id: SUP-0010}
      expect: ["annual_spend_gbp", "formula"]

- question: "05:50:Q5"
  story: >
    Assess geopolitical and regulatory risks. Get supplier country exposure to show concentration by country.
    Show total spend, supplier count, and risk ratings by country.
  checks:
    - tool: get_supplier_country_exposure
      args: {}
      expect: ["country", "supplier_count", "total_spend_gbp"]

- question: "05:50:Q8"
  story: >
    Supply chain risk analyst reviews recent cyber incidents and identifies three highest-risk partners.
    Get cyber security ratings. SUP-0001 (good), SUP-0002 (fair), SUP-0004 (poor). Draft security questionnaire
    and send to weakest three.
  checks:
    - tool: get_supplier_cyber_security_ratings
      args: {supplier_id: SUP-0004}
      expect: ["poor", "BitSight"]
    - tool: draft_supplier_security_questions
      args: {supplier_id: SUP-0004}
      expect: ["CYBER SECURITY QUESTIONNAIRE"]
    - tool: send_supplier_security_questionnaire
      args: {supplier_id: SUP-0004, severity: high}
      expect: ["SRA-", "security"]

- question: "06:51:Q2"
  story: >
    New product developer checks compliance record of shortlisted factories. Review compliance findings across
    labour, environmental, and safety areas.
  checks:
    - tool: get_supplier_compliance_history
      args: {supplier_id: SUP-0001, months_back: 12}
      expect: ["SUP-0001", "compliance_area"]

- question: "09:85:Q3"
  story: >
    Cybersecurity analyst assesses third-party risk of high/critical rated suppliers and partners.
    Get security risk ratings and system access levels for key suppliers.
  checks:
    - tool: get_supplier_security_risk_rating
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001", "rating"]

- question: "09:87:Q3"
  story: >
    CSCO assesses resilience to major disruption. Get supplier concentration exposure to see diversification risk
    and identify critical dependencies by category.
  checks:
    - tool: get_supplier_concentration_exposure
      args: {}
      expect: ["spend_gbp", "spend_pct_of_category"]

- question: "04:33:Q1"
  story: >
    Sourcing manager is investigating why factory F has been 10-14 days late on five consecutive orders.
    Get factory risk rating and list alternative factories for the product to assess backup options.
  checks:
    - tool: get_factory_risk_rating
      args: {factory_id: FAC-0001}
      expect: ["FAC-0001", "risk_rating"]
    - tool: list_alternative_factories_for_product
      args: {sku: SKU-100007}
      expect: ["sku", "factory_id"]

- question: "04:33:Q3"
  story: >
    Considering moving 20% of denim volume from Bangladesh to Vietnam. Need qualification time and cost
    for new Vietnamese factories to assess transition timeline and investment.
  checks:
    - tool: get_supplier_qualification_time_and_cost
      args: {supplier_id: SUP-0050}
      expect: ["case_id", "supplier_id"]

- question: "04:33:Q6"
  story: >
    Tariff changes mean diversifying away from southern China. Assess how long it would take to qualify
    alternative suppliers and open qualification cases for two best candidates.
  checks:
    - tool: get_supplier_qualification_time_and_cost
      args: {supplier_id: SUP-0051}
      expect: ["supplier_id"]
    - tool: create_onboarding_case
      args: {supplier_id: SUP-0051, risk_rating: medium}
      expect: ["SOC-"]

- question: "05:43:Q4"
  story: >
    Based on audit findings, assess factory risk rating to decide on corrective action or suspension.
    FAC-0005 has high risk rating requiring attention before further orders.
  checks:
    - tool: get_factory_risk_rating
      args: {factory_id: FAC-0005}
      expect: ["risk_rating"]

- question: "05:43:Q5"
  story: >
    Review factories with overdue critical audit findings. Rank by risk rating to prioritize corrective
    action follow-up and order volume decisions.
  checks:
    - tool: get_factory_risk_rating
      args: {factory_id: FAC-0010}
      expect: ["FAC-0010"]

- question: "05:50:Q1"
  story: >
    Supply chain risk analyst assesses current exposure to world events. Identify suppliers in affected regions
    (e.g. China for geopolitical risks) to see revenue exposure and disruption timeline.
  checks:
    - tool: list_suppliers_in_affected_regions
      args: {country: CN}
      expect: ["supplier_id", "country"]

- question: "05:50:Q7"
  story: >
    Weather hazard forecast shows risk in key production regions. Identify suppliers in affected regions
    and set up alerts for those regions to monitor lead time impacts.
  checks:
    - tool: list_suppliers_in_affected_regions
      args: {country: VN}
      expect: ["supplier_id", "country"]

- question: "04:41:Q1:write"
  story: >
    After due diligence, set conditions on SOC-900001 (audit required) and then change status to conditional.
    Later approve it after audit completion.
  checks:
    - tool: update_onboarding_case_conditions
      args: {case_id: SOC-900001, conditions: "Quality audit completed; OEKO-TEX in progress"}
      expect: ["SOC-900001"]
    - tool: update_onboarding_case_status
      args: {case_id: SOC-900001, status: approved}
      expect: ["approved"]
