- question: "04:41:Q1"
  story: >
    Prospective supplier SUP-0023 Morley Industries (China): BSCI certificate expired, health score 62 (C_fair credit), bank account in
    Hong Kong under a different name and unverified. Composite rating: high.
  checks:
    - tool: get_supplier_certifications
      args: {supplier_id: SUP-0023}
      expect: ["BSCI", "expired", "SEDEX"]
    - tool: get_supplier_financial_health_score
      args: {supplier_id: SUP-0023}
      expect: ["62", "C_fair"]
    - tool: calculate_supplier_risk_rating
      args: {supplier_id: SUP-0023}
      expect: ["high", "bank account country differs", "expired certificate"]

- question: "04:41:Q3"
  story: >
    SUP-0023 is registered in Dongguan, China (owner Morley Holdings BVI) but its bank account is in Hong Kong under
    Morley Trading (HK) Limited and has never been verified.
  checks:
    - tool: get_supplier_bank_details
      args: {supplier_id: SUP-0023}
      expect: ["HK", "Morley Trading (HK) Limited", "false"]
    - tool: get_supplier_registration_details
      args: {supplier_id: SUP-0023}
      expect: ["CN", "Morley Holdings (BVI) Ltd", "Dongguan"]
    - tool: run_bank_account_verification
      args: {supplier_id: SUP-0023}
      expect: ["failed", "country_matches: false"]

- question: "04:41:Q4"
  story: >
    Four open onboarding cases for the four suppliers still onboarding: SOC-900001 (SUP-0023, 42 days without update, 4 items open),
    SOC-900002 (SUP-0025), SOC-900003 (SUP-0042, conditional) and SOC-900004 (SUP-0060, draft).
  checks:
    - tool: list_onboarding_cases_by_status
      args: {status: in_progress}
      expect: ["SOC-900001", "SOC-900002"]
    - tool: get_onboarding_missing_items
      args: {case_id: SOC-900001}
      expect: ["Review management team", "rejected", "days_overdue"]

- question: "04:41:Q5"
  story: >
    The onboarding file for SOC-900001 (SUP-0023) meets 2 of 6 minimum requirements and shows bank, certificate and financial risk
    indicators; conditions are set and then the case is rejected.
  checks:
    - tool: compare_onboarding_file_to_requirements
      args: {case_id: SOC-900001, file_path: onboarding_form.pdf}
      expect: ["gaps found", "2 of 6", "Bank account country (HK)"]
    - tool: get_supplier_bank_details
      args: {supplier_id: SUP-0023}
      expect: ["HK"]
    - tool: calculate_supplier_risk_rating
      args: {supplier_id: SUP-0023}
      expect: ["high"]
    - tool: update_onboarding_case_conditions
      args: {case_id: SOC-900001, conditions: "Bank account verified in the supplier's own name; renewed BSCI certificate; audit before first order"}
      expect: ["SOC-900001", "audit before first order"]
    - tool: update_onboarding_case_status
      args: {case_id: SOC-900001, status: rejected}
      expect: ["rejected"]

- question: "04:41:Q6"
  story: >
    Six controls exist: registration, sanctions, credit, certifications, management review and environmental and labour practices.
    There is no bank verification or beneficial ownership control, which is added.
  checks:
    - tool: list_onboarding_controls
      args: {}
      expect: ["SOC-CTL-000001", "Run sanctions list screening"]
    - tool: create_onboarding_control
      args: {description: "Verify beneficial ownership structure", control_type: "document review", sequence: 7}
      expect: ["SOC-CTL-000007", "Verify beneficial ownership"]

