# One entry per question in the brief. Story ids are real master ids; see seed/ and gen.py for the planted rows.

- question: "02:14:Q6"
  story: >
    Cotton and polysilicon suppliers by origin. Cotton from Xinjiang: SUP-0057 Hunt Apparel, SUP-0003 Bishop Apparel,
    SUP-0001 Brown Textiles. Polysilicon from Xinjiang: SUP-0027 Arnold Industries; SUP-0041 and SUP-0034 source it elsewhere in China.
  checks:
    - tool: list_suppliers_by_raw_material
      args: {raw_material: cotton, origin_region: Xinjiang}
      expect: ["Hunt Apparel A.S.", "SUP-0003", "SUP-0001"]
    - tool: list_suppliers_by_raw_material
      args: {raw_material: polysilicon}
      expect: ["Arnold Industries A.S.", "Xinjiang", "SUP-0041"]

- question: "04:32:Q6"
  story: >
    Active alerts, worst first: SUP-0053 West Textiles (critical financial plus high delivery), SUP-0055 Marsden Trading
    (high quality), SUP-0001 Brown Textiles (high compliance, raised last week so a new problem). Other alerts are medium or low.
  checks:
    - tool: list_suppliers_with_risk_alerts
      args: {status: active}
      expect: ["SRA-900001", "SUP-0053", "SRA-900003", "SRA-900004"]
    - tool: list_suppliers_with_risk_alerts
      args: {raised_from: -14d, severity: high}
      expect: ["SRA-900004"]
    - tool: get_supplier_financial_health_score
      args: {supplier_id: SUP-0053}
      expect: ["31", "distressed", "D_poor"]

- question: "04:32:Q7"
  story: >
    The largest cookware supplier is SUP-0074 Lyons Trading (about 2.8m of cookware POs). Home suppliers that do not make
    cookware are the approved alternatives: SUP-0039 primary, SUP-0067 secondary, SUP-0032 tertiary.
  checks:
    - tool: list_alternative_suppliers_for_category
      args: {category: Cookware}
      expect: ["SUP-0039", "primary", "SUP-0067", "secondary", "non-stick coating"]

- question: "04:33:Q1"
  story: >
    Factory FAC-0121 (supplier SUP-0064) makes SKU-100007 and has shipped five straight POs 10 to 14 days late. Alternatives:
    FAC-0072 (TR, approved, +11% cost, 21 days faster), FAC-0017 (VN, approved, +6.5%), FAC-0108 (CN, in qualification).
  checks:
    - tool: list_alternative_factories_for_product
      args: {sku: SKU-100007}
      expect: ["FAC-0072", "FAC-0017", "FAC-0108", "in_progress"]
    - tool: get_supplier_risk_alerts
      args: {factory_id: FAC-0121}
      expect: ["SRA-900011", "10 to 14 days late"]

- question: "04:33:Q3"
  story: >
    Qualifying a new Vietnamese supplier takes about 75 days and 12,200 pounds (audit 4,200, testing 6,500, admin 1,500);
    past Vietnamese cases averaged 83 days.
  checks:
    - tool: get_supplier_qualification_time_and_cost
      args: {country: VN}
      expect: ["75", "12200", "4200"]

- question: "04:33:Q6"
  story: >
    Diversifying out of southern China to Vietnamese suppliers SUP-0056 and SUP-0069: qualification takes about 75 days and
    12,200 pounds each. Cases are opened for both.
  checks:
    - tool: get_supplier_qualification_time_and_cost
      args: {supplier_id: SUP-0056}
      expect: ["VN", "12200"]
    - tool: create_onboarding_case
      args: {supplier_id: SUP-0056, risk_rating: medium}
      expect: ["SOC-900005", "draft"]
    - tool: create_onboarding_case
      args: {supplier_id: SUP-0069, risk_rating: medium}
      expect: ["SOC-900006"]

- question: "04:34:Q2"
  story: >
    OEKO-TEX holders in Portugal and Turkey: SUP-0058 current, SUP-0044 current, SUP-0036 expired, SUP-0067 expiring soon.
  checks:
    - tool: get_supplier_certifications
      args: {country: PT, cert_type: OEKO-TEX}
      expect: ["SUP-0058", "current"]
    - tool: get_supplier_certifications
      args: {country: TR, cert_type: OEKO-TEX}
      expect: ["SUP-0036", "expired", "SUP-0067", "expiring_soon"]

- question: "04:35:Q1"
  story: >
    Supplier S is SUP-0053 West Textiles: health score 31, credit D_poor (down 173 points in a year), liquidity and debt red flags,
    critical financial alert, labour and safety non-compliance at FAC-0099. The underlying issue is financial distress.
  checks:
    - tool: get_supplier_financial_health_score
      args: {supplier_id: SUP-0053}
      expect: ["31", "distressed", "D_poor", "low liquidity"]
    - tool: get_supplier_risk_alerts
      args: {supplier_id: SUP-0053}
      expect: ["SRA-900001", "SRA-900002"]
    - tool: get_supplier_compliance_history
      args: {supplier_id: SUP-0053}
      expect: ["Overtime above 60 hours", "non_compliant"]

- question: "04:35:Q2"
  story: >
    Among the top suppliers, SUP-0072 (score 41, D_poor, critical) and SUP-0038 (score 49, high criticality) show red flags;
    SUP-0044 is healthy. Flagged suppliers are put on watch.
  checks:
    - tool: get_supplier_financial_health_score
      args: {supplier_id: SUP-0072}
      expect: ["41", "distressed", "poor credit rating"]
    - tool: get_supplier_credit_rating
      args: {supplier_id: SUP-0072}
      expect: ["D_poor", "deteriorating"]
    - tool: get_supplier_criticality_rating
      args: {supplier_id: SUP-0072}
      expect: ["critical"]
    - tool: get_supplier_criticality_rating
      args: {supplier_id: SUP-0038}
      expect: ["high"]
    - tool: get_supplier_financial_health_score
      args: {supplier_id: SUP-0044}
      expect: ["80", "healthy"]
    - tool: update_supplier_risk_status
      args: {supplier_id: SUP-0072, watch_status: watch, watch_reason: Credit score falling for four quarters}
      expect: ["watch", "SUP-0072"]

- question: "04:35:Q3"
  story: >
    Critical suppliers are the six largest by spend plus the five sole-source suppliers.
  checks:
    - tool: get_supplier_criticality_rating
      args: {criticality_rating: critical}
      expect: ["SUP-0044", "SUP-0011", "Combed-cotton terry towel range"]

- question: "04:35:Q4"
  story: >
    The master data has no packaging supplier (see bench case notes); the checks use the largest cookware supplier SUP-0074
