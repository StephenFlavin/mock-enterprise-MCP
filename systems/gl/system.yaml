id: gl
name: ERP (General Ledger)
instructions: 'General ledger for Harbour & Vale: journals (JE-000123), accruals, reconciliations, intercompany (IC-, entities LE-UK, LE-PL...), DC cost centres (CC-2101 = DC1), labour rate card, ERP stock
  by SKU and DC, goods movements, freight and recovery postings, FX and inventory valuation. Accounts are 4-digit codes, periods look like FY27-08.'
tables:
  journal_entries:
    key: je_id
    cols:
      je_id:
        type: str
        desc: Journal entry id, e.g. JE-000001
      entity_id:
        type: str
        desc: Legal entity
      posting_date:
        type: date
        desc: Date the entry was or will be posted
      description:
        type: str
        desc: Journal description, e.g. Accrual for Q3 rent
      status:
        type: enum
        values:
        - draft
        - submitted
        - approved
        - posted
        - reversed
        desc: Status
      je_type:
        type: enum
        values:
        - manual
        - accrual
        - inventory
        - intercompany
        - fx
        - reclassification
        desc: Type
      created_by:
        type: str
        desc: Employee who created it
      submitted_by:
        type: str
        desc: Employee who submitted for approval
      approved_by:
        type: str
        desc: Employee who approved it
      auto_reversal_date:
        type: date
        desc: If accrual, the date it reverses
      created_at:
        type: timestamp
        desc: Created timestamp
      updated_at:
        type: timestamp
        desc: Last update timestamp
      total_debit_gbp:
        type: float
        desc: Total debits in GBP
      total_credit_gbp:
        type: float
        desc: Total credits in GBP
      debit_account:
        type: str
        desc: GL account code debited, e.g. 6900
      credit_account:
        type: str
        desc: GL account code credited, e.g. 2300
      reference:
        type: str
        desc: Supporting reference, e.g. IC-900001 or ST165
      recurring:
        type: bool
        desc: True for recurring or template journals; false for one-off journals
      pl_impact_gbp:
        type: float
        desc: Effect on operating profit in GBP (negative = cost), 0 for balance sheet only
      counterparty_entity_id:
        type: str
        desc: Counterparty legal entity for intercompany journals
  journal_lines:
    key:
    - je_id
    - line_no
    cols:
      je_id:
        type: str
        desc: Journal entry id
      line_no:
        type: int
        desc: Line sequence number
      account_code:
        type: str
        desc: GL account code
      account_desc:
        type: str
        desc: Account description
      cost_centre_id:
        type: str
        desc: Cost centre if applicable
      debit_gbp:
        type: float
        desc: Debit amount in GBP
      credit_gbp:
        type: float
        desc: Credit amount in GBP
      currency:
        type: str
        desc: Transaction currency
      amount_local:
        type: float
        desc: Amount in transaction currency
      reference:
        type: str
        desc: Reference (e.g. PO-xxx, SHP-xxx)
  accruals:
    key: accrual_id
    cols:
      accrual_id:
        type: str
        desc: Accrual identifier
      je_id:
        type: str
        desc: Posted journal entry
      reversal_je_id:
        type: str
        desc: Auto-reversal journal entry
      period:
        type: str
        desc: Period accrued for, e.g. FY27-09
      description:
        type: str
        desc: What is being accrued
      amount_gbp:
        type: float
        desc: Accrual amount in GBP
      accrual_date:
        type: date
        desc: Date accrual posted
      reversal_date:
        type: date
        desc: Date auto-reversal will post
      status:
        type: enum
        values:
        - open
        - reversed
        - released
        desc: Status
      entity_id:
        type: str
        desc: Legal entity booking the item
      item_type:
        type: enum
        values:
        - accrual
        - prepayment
        - phasing
        desc: Accrual, prepayment or budget phasing item
      account_code:
        type: str
        desc: GL account charged, e.g. 6210
      owner_id:
        type: str
        desc: Employee id of the preparer, e.g. EMP-00086
  intercompany_transactions:
    key: ic_txn_id
    cols:
      ic_txn_id:
        type: str
        desc: Intercompany transaction id
      from_entity_id:
        type: str
        desc: Sending legal entity
      to_entity_id:
        type: str
        desc: Receiving legal entity
      je_id:
        type: str
        desc: Posted journal entry
      posting_date:
        type: date
        desc: Posting date
      amount_gbp:
        type: float
        desc: Amount in GBP
      currency:
        type: str
        desc: Transaction currency
      amount_local:
        type: float
        desc: Amount in local currency
      fx_rate:
        type: float
        desc: Exchange rate used
      description:
        type: str
        desc: Transaction description
      reference:
        type: str
        desc: Original transaction reference
      matched_to:
        type: str
        desc: Matching transaction id, if matched
      status:
        type: enum
        values:
        - unmatched
        - matched
        - disputed
        desc: Reconciliation status
      counterparty_amount_gbp:
        type: float
        desc: GBP amount the receiving entity booked, blank if it has not booked the invoice
      counterparty_posting_date:
        type: date
        desc: Date the receiving entity booked it, blank if not booked
      counterparty_fx_rate:
        type: float
        desc: Rate the receiving entity used (local per GBP)
  inventory_by_site:
    key:
    - sku
    - site_id
    cols:
      sku:
        type: str
        desc: SKU
      site_id:
        type: str
        desc: DC or store
      as_of_date:
        type: date
        desc: Date of valuation
      units_on_hand:
        type: int
        desc: Physical units
      unit_cost_gbp:
        type: float
        desc: Standard unit cost in GBP
      total_value_gbp:
        type: float
        desc: Total valuation in GBP
      provision_pct:
        type: float
        desc: Provision percentage for slow-moving
      provision_gbp:
        type: float
        desc: Provision amount in GBP
      net_value_gbp:
        type: float
        desc: Value less provision
      status:
        type: enum
        values:
        - active
        - slow_moving
        - obsolete
        - written_off
        desc: Inventory status
  cost_centre_actuals:
    key:
    - cost_centre_id
    - account_code
    - period
    cols:
      cost_centre_id:
        type: str
        desc: Cost centre
      account_code:
        type: str
        desc: GL account
      period:
        type: str
        desc: Financial period, e.g. FY27-09
      period_end:
        type: date
        desc: Last day of the financial period
      category:
        type: enum
        values:
        - labour
        - overtime
        - agency
        - damages
        - rework
        - energy
        - rent
        desc: Cost category
      amount_gbp:
        type: float
        desc: Actual cost in GBP
      budget_gbp:
        type: float
        desc: Budgeted amount in GBP
      variance_gbp:
        type: float
        desc: Actual minus budget
  fx_gains_losses:
    key: fx_txn_id
    cols:
      fx_txn_id:
        type: str
        desc: FX transaction id
      je_id:
        type: str
        desc: Journal entry
      posting_date:
        type: date
        desc: Posting date
      currency:
        type: str
        desc: Foreign currency
      gbp_amount:
        type: float
        desc: GBP amount
      local_amount:
        type: float
        desc: Amount in foreign currency
      opening_rate:
        type: float
        desc: Opening exchange rate
      closing_rate:
        type: float
        desc: Closing exchange rate
      gain_loss_gbp:
        type: float
        desc: Realised or unrealised gain/loss in GBP
      fx_type:
        type: enum
        values:
        - realised
        - unrealised
        desc: Realised or unrealised
      account_code:
        type: str
        desc: GL account for FX gain/loss
  freight_costs:
    key: freight_id
    cols:
      freight_id:
        type: str
        desc: Freight cost entry
      je_id:
        type: str
        desc: Journal entry
      posting_date:
        type: date
        desc: Posting date
      account_code:
        type: str
        desc: GL freight account
      shipment_id:
        type: str
        desc: Shipment reference, if any
      supplier_id:
        type: str
        desc: Freight supplier if not a carrier (usually blank)
      cost_gbp:
        type: float
        desc: Freight cost in GBP
      description:
        type: str
        desc: Freight description
      carrier_id:
        type: str
        desc: Carrier that invoiced the freight
      invoice_ref:
        type: str
        desc: Carrier invoice number
      cost_centre_id:
        type: str
        desc: Cost centre charged, blank if missing
  handling_costs:
    key: handling_id
    cols:
      handling_id:
        type: str
        desc: Handling cost entry
      je_id:
        type: str
        desc: Journal entry
      posting_date:
        type: date
        desc: Posting date
      channel:
        type: enum
        values:
        - take_back
        - resale
        - repair
        - recycling
        desc: Circular-economy recovery channel
      cost_gbp:
        type: float
        desc: Handling cost in GBP
      units_handled:
        type: int
        desc: Units handled
      cost_per_unit_gbp:
        type: float
        desc: Cost per unit in GBP
      description:
        type: str
        desc: Cost description
      recovered_value_gbp:
        type: float
        desc: Value recovered through the channel in GBP
    desc: Monthly handling cost and recovered value by circular-economy recovery channel
  order_charges:
    key: order_id
    cols:
      order_id:
        type: str
        desc: Order id, e.g. ORD-2026-0100001
      entity_id:
        type: str
        desc: Legal entity
      posting_date:
        type: date
        desc: Date for GL posting
      revenue_gbp:
        type: float
        desc: Net revenue in GBP
      freight_charge_gbp:
        type: float
        desc: Freight charge in GBP
      handling_charge_gbp:
        type: float
        desc: Handling/packing charge in GBP
      discount_gbp:
        type: float
        desc: Discount given in GBP
      total_charges_gbp:
        type: float
        desc: Total order charges in GBP
      je_id:
        type: str
        desc: Posted journal entry
      shipment_count:
        type: int
        desc: Number of shipments the order was split into
  erp_stock:
    key:
    - sku
    - site_id
    cols:
      sku:
        type: str
        desc: SKU
      site_id:
        type: str
        desc: DC or plant
      location_id:
        type: str
        desc: Specific bin location if applicable
      as_of_date:
        type: date
        desc: Date of snapshot
      quantity:
        type: int
        desc: Quantity on hand
      unit_cost_gbp:
        type: float
        desc: Standard cost per unit in GBP
      total_value_gbp:
        type: float
        desc: Total valuation in GBP
  reconciliations:
    key: recon_id
    cols:
      recon_id:
        type: str
        desc: Reconciliation id
      account_code:
        type: str
        desc: GL account being reconciled
      account_desc:
        type: str
        desc: GL account description
      period:
        type: str
        desc: Period, e.g. FY27-09
      entity_id:
        type: str
        desc: Legal entity
      status:
        type: enum
        values:
        - open
        - signed_off
        - disputed
        desc: Status
      assigned_to:
        type: str
        desc: Employee assigned
      reviewer:
        type: str
        desc: Employee reviewing
      opened_date:
        type: date
        desc: Date opened
      signed_off_date:
        type: date
        desc: Date signed off
      notes:
        type: text
        desc: Reconciliation notes
      balance_gbp:
        type: float
        desc: Unreconciled difference in GBP
  accounts:
    key: account_code
    cols:
      account_code:
        type: str
        desc: GL account code, e.g. 5110
      name:
        type: str
        desc: Account name
      account_type:
        type: enum
        values:
        - asset
        - liability
        - income
        - expense
        desc: Account type
  dc_activity:
    key:
    - cost_centre_id
    - period
    desc: Monthly DC volumes and paid labour hours (statistical accounts)
    cols:
      cost_centre_id:
        type: str
        desc: DC cost centre, e.g. CC-2101
      period:
        type: str
        desc: Financial period, e.g. FY27-08
      period_end:
        type: date
        desc: Last day of the period
      units_shipped:
        type: int
        desc: Units shipped in the period
      orders_shipped:
        type: int
        desc: Orders shipped in the period
      paid_hours:
        type: int
        desc: 'Paid labour hours: permanent, overtime and agency'
      overtime_hours:
        type: int
        desc: Overtime hours
      agency_hours:
        type: int
        desc: Agency hours
  labour_rate_card:
    key: site_id
    desc: Labour and agency rate card by DC used to cost staffing options
    cols:
      site_id:
        type: str
        desc: DC the rate card applies to, e.g. DC1
      base_hourly_gbp:
        type: float
        desc: Base hourly pay of a warehouse operative in GBP
      overtime_multiplier:
        type: float
        desc: Overtime pay multiplier on base rate
      night_premium_pct:
        type: float
        desc: Night shift premium on base rate, percent
      night_allowance_per_shift_gbp:
        type: float
        desc: Night shift allowance per shift in GBP
      employer_oncost_pct:
        type: float
        desc: Employer on-costs on own-staff pay, percent
      overtime_meal_allowance_per_shift_gbp:
        type: float
        desc: Meal allowance per overtime shift in GBP
      agency_pay_hourly_gbp:
        type: float
        desc: Agency worker pay per hour in GBP
      agency_margin_hourly_gbp:
        type: float
        desc: Agency fee (margin) per hour in GBP
      agency_night_uplift_pct:
        type: float
        desc: Agency night uplift on pay, percent
      onboarding_cost_per_hire_gbp:
        type: float
        desc: Recruitment and induction cost per permanent hire in GBP
      late_shift_agency_share_pct:
        type: float
        desc: Assumed share of late-shift hours filled by agency, percent
      hours_per_fte_week:
        type: float
        desc: Contracted hours per FTE per week
      shifts_per_fte_week:
        type: float
        desc: Shifts per FTE per week
      rate_card_ref:
        type: str
        desc: Source of the rates
  goods_movements:
    key: doc_id
    desc: Goods movements posted in one of ERP or WMS and still pending in the other
    cols:
      doc_id:
        type: str
        desc: Material document id, e.g. MD-4900001
      doc_type:
        type: enum
        values:
        - stock_transfer
        - goods_receipt
        desc: Stock transfer or goods receipt
      reference:
        type: str
        desc: Transfer id (STR-...) or shipment id (SHP-...)
      from_site_id:
        type: str
        desc: Sending site, blank for goods receipts
      to_site_id:
        type: str
        desc: Receiving site
      sku:
        type: str
        desc: SKU moved
      quantity:
        type: int
        desc: Units moved
      value_gbp:
        type: float
        desc: Value at standard cost in GBP
      posted_date:
        type: date
        desc: Date the movement was posted
      posted_in:
        type: enum
        values:
        - ERP
        - WMS
        desc: System where it has been posted
      pending_in:
        type: enum
        values:
        - ERP
        - WMS
        desc: System where it is still pending
      note:
        type: text
        desc: What is pending and why
  inventory_monthly:
    key:
    - site_id
    - category
    - month_end
    cols:
      site_id:
        type: str
        desc: DC the stock sits in, e.g. DC1
      category:
        type: str
        desc: Product category, e.g. Outerwear
      month_end:
        type: date
        desc: Month-end the balances are at
      units_on_hand:
        type: int
        desc: Units on hand at month-end
      gross_value_gbp:
        type: float
        desc: Gross inventory value at month-end
      provision_gbp:
        type: float
        desc: Slow-moving and obsolete provision at month-end
      volume_gbp:
        type: float
        desc: Value movement in the month from change in units
      mix_gbp:
        type: float
        desc: Value movement in the month from change in product mix
      cost_update_gbp:
        type: float
        desc: Value movement from standard cost updates
      fx_gbp:
        type: float
        desc: Value movement from foreign exchange revaluation
      adjustments_gbp:
        type: float
        desc: Value movement from stock count and valuation adjustments
      shrink_gbp:
        type: float
        desc: Stock shrink written off in the month
      written_off_gbp:
        type: float
        desc: Stock written off (damaged, expired, clearance) in the month
      movement_note:
        type: text
        desc: Finance note on unusual items in the month
  ledger_balances:
    key:
    - account_code
    - period
    cols:
      account_code:
        type: str
        desc: Inventory ledger account, e.g. 1300
      account_desc:
        type: str
        desc: Account name
      period:
        type: str
        desc: Financial period, e.g. FY27-08
      period_end:
        type: date
        desc: Last day of the period
      opening_balance_gbp:
        type: float
        desc: Balance at start of period (credits negative)
      movement_gbp:
        type: float
        desc: Net movement in the period
      closing_balance_gbp:
        type: float
        desc: Balance at end of period (credits negative)
  sourcing_margins:
    key: margin_id
    cols:
      margin_id:
        type: str
        desc: Row id, e.g. SM-0001
      sourcing_entity_id:
        type: str
        desc: Sourcing entity charging the fee, e.g. LE-HK
      receiving_entity_id:
        type: str
        desc: Entity receiving the sourcing service, e.g. LE-UK
      period:
        type: str
        desc: Financial quarter, e.g. FY27-Q1
      period_end:
        type: date
        desc: Last day of the quarter
      department:
        type: str
        desc: Product department sourced, e.g. Womenswear
      cost_base_gbp:
        type: float
        desc: Sourcing entity operating cost base for the quarter
      fee_charged_gbp:
        type: float
        desc: Fee or commission charged to the receiving entity
      markup_pct:
        type: float
        desc: Mark-up on cost actually earned, percent
      policy_markup_pct:
        type: float
        desc: Mark-up on cost required by group transfer pricing policy, percent
  supplier_payments:
    key: payment_id
    cols:
      payment_id:
        type: str
        desc: Payment id, e.g. PAY-000001
      supplier_id:
        type: str
        desc: Supplier paid
      po_id:
        type: str
        desc: Purchase order the invoice relates to
      invoice_ref:
        type: str
        desc: Supplier invoice reference
      invoice_date:
        type: date
        desc: Invoice date
      due_date:
        type: date
        desc: Due date under the payment terms
      paid_date:
        type: date
        desc: Date the payment left the bank, blank if unpaid
      amount_gbp:
        type: float
        desc: Invoice amount in GBP
      payment_terms_days:
        type: int
        desc: Payment terms in days
      days_to_pay:
        type: int
        desc: Days from invoice date to payment
      days_late:
        type: int
        desc: Days paid after the due date, negative if early
      status:
        type: enum
        desc: Payment status
        values:
        - paid
        - open
tools:
- name: create_journal_entry
  desc: Creates a draft, unposted journal entry with amount and debit and credit accounts. Returns the new journal with its id.
  kind: insert
  table: journal_entries
  id_prefix: JE-
  defaults:
    status: draft
    total_credit_gbp: '{total_debit_gbp}'
    recurring: false
    pl_impact_gbp: 0
  args:
    entity_id:
      required: true
      desc: Legal entity that books the journal, e.g. LE-UK
    posting_date:
      required: true
      type: date
      desc: Date to post
    description:
      required: true
      desc: Journal description, including any reference
    total_debit_gbp:
      required: true
      type: float
      desc: Journal amount in GBP (debits; credits are set equal)
    debit_account:
      required: true
      desc: GL account code to debit, e.g. 6900
    credit_account:
      required: true
      desc: GL account code to credit, e.g. 2300
    je_type:
      type: enum
      values:
      - manual
      - accrual
      - inventory
      - intercompany
      - fx
      - reclassification
      default: manual
      desc: Type of journal
    created_by:
      desc: Employee id of the preparer, e.g. EMP-00087
  example:
    entity_id: LE-UK
    posting_date: -7d
    description: Increase bad debt provision, September
    total_debit_gbp: 85000
    debit_account: '6800'
    credit_account: '1210'
    je_type: manual
    created_by: EMP-00087
- name: delete_draft_journal
  desc: Deletes an unposted draft journal entry. Returns confirmation of deletion.
  kind: update
  table: journal_entries
  delete: true
  args: {}
  example:
    je_id: JE-900001
- name: create_accrual_journal
  desc: Creates an open accrual with an auto-reversal date for a period. Returns the new accrual record.
  kind: insert
  table: accruals
  id_prefix: ACC-
  defaults:
    status: open
    item_type: accrual
    accrual_date: $as_of
  args:
    entity_id:
      required: true
      desc: Legal entity that books the accrual, e.g. LE-UK
    period:
      required: true
      desc: Period accrued for, e.g. FY27-08
    description:
      required: true
      desc: What is being accrued
    amount_gbp:
      required: true
      type: float
      desc: Accrual amount in GBP
    reversal_date:
      required: true
      type: date
      desc: Date the accrual auto-reverses
    account_code:
      desc: GL expense account to charge, e.g. 5110
    owner_id:
      desc: Employee id of the preparer, e.g. EMP-00087
  example:
    entity_id: LE-UK
    period: FY27-08
    description: Accrual for September rent
    amount_gbp: 45000.0
    reversal_date: +7d
    account_code: '6210'
    owner_id: EMP-00087
- name: create_inventory_adjustment_journal
  desc: Creates a draft inventory adjustment journal for an agreed reconciling difference, with amount and accounts. Returns the new journal; submit it for approval separately.
  kind: insert
  table: journal_entries
  id_prefix: JE-
  defaults:
    status: draft
    je_type: inventory
    total_credit_gbp: '{total_debit_gbp}'
    recurring: false
    pl_impact_gbp: 0
  args:
    entity_id:
      required: true
      desc: Legal entity that books the journal, e.g. LE-UK
    posting_date:
      required: true
      type: date
      desc: Date to post
    description:
      required: true
      desc: Inventory adjustment description, including any reference
    total_debit_gbp:
      required: true
      type: float
      desc: Adjustment amount in GBP (debits; credits are set equal)
    debit_account:
      required: true
      desc: GL account code to debit, e.g. 5000
    credit_account:
      required: true
      desc: GL account code to credit, e.g. 1300
    created_by:
      desc: Employee id of the preparer, e.g. EMP-00087
  example:
    entity_id: LE-UK
    posting_date: -7d
    description: Reverse duplicate goods receipt, DC3 SKU-100007
    total_debit_gbp: 12500
    debit_account: '5000'
    credit_account: '1300'
    created_by: EMP-00087
- name: get_cost_centre_actuals
  desc: Monthly DC cost-centre actuals vs budget by cost category (labour, overtime, agency, damages, rework, energy, rent) with units shipped and cost per unit.
  kind: sql
  args:
    cost_centre_id:
      desc: Cost centre (default all)
    site_id:
      desc: DC the cost centre serves, e.g. DC1 (default all)
    category:
      type: enum
      values:
      - labour
      - overtime
      - agency
      - damages
      - rework
      - energy
      - rent
      desc: Cost category (default all)
    period:
      type: str
      desc: Exact financial period, e.g. FY27-08 (overrides the dates)
    period_from:
      type: date
      default: -75d
      desc: Periods ending on or after
    period_to:
      type: date
      default: $as_of
      desc: Periods ending on or before
  sql: |
    SELECT c.cost_centre_id, cc.name AS cost_centre_name, c.period, c.period_end, c.category, c.account_code,
           a.name AS account_name, round(c.amount_gbp, 2) AS actual_gbp, round(c.budget_gbp, 2) AS budget_gbp,
           round(c.variance_gbp, 2) AS variance_gbp, d.units_shipped,
           round(100 * c.amount_gbp / NULLIF(d.units_shipped, 0), 2) AS cost_per_unit_pence,
           round(sum(c.amount_gbp) OVER (PARTITION BY c.cost_centre_id, c.period), 2) AS period_total_gbp,
           round(100 * sum(c.amount_gbp) OVER (PARTITION BY c.cost_centre_id, c.period) / NULLIF(d.units_shipped, 0), 2) AS period_cost_per_unit_pence
    FROM cost_centre_actuals c
    JOIN master.cost_centres cc ON cc.cost_centre_id = c.cost_centre_id
    LEFT JOIN accounts a ON a.account_code = c.account_code
    LEFT JOIN dc_activity d ON d.cost_centre_id = c.cost_centre_id AND d.period = c.period
    WHERE ($cost_centre_id IS NULL OR c.cost_centre_id = $cost_centre_id)
      AND ($site_id IS NULL OR cc.site_id = $site_id)
      AND ($category IS NULL OR c.category = $category)
      AND (CASE WHEN $period IS NOT NULL THEN c.period = $period
                ELSE c.period_end >= CAST($period_from AS DATE) AND c.period_end <= CAST($period_to AS DATE) END)
    ORDER BY c.cost_centre_id, c.period_end, c.account_code
  limit: 120
  example:
    site_id: DC1
- name: get_inventory_valuation_by_site
  desc: 'Inventory valuation by DC: gross value, provisions, net value, provision shortfall against policy, and the difference to operations stock value. Includes an ALL row.'
  kind: sql
  args:
    site_id:
      desc: Site or DC, e.g. DC1 (default all)
    as_of_date:
      type: date
      default: $as_of
      desc: Valuation date
    status:
      type: enum
      values:
      - active
      - slow_moving
      - obsolete
      desc: Only stock with this ageing status
  sql: |
    WITH snap AS (SELECT max(as_of_date) AS d FROM inventory_by_site WHERE as_of_date <= CAST($as_of_date AS DATE)),
    s AS (
      SELECT i.* FROM inventory_by_site i JOIN snap ON i.as_of_date = snap.d
      WHERE ($site_id IS NULL OR i.site_id = $site_id) AND ($status IS NULL OR i.status = $status)
    ), per AS (
      SELECT site_id, sum(units_on_hand) AS units, count(DISTINCT sku) AS skus, sum(total_value_gbp) AS gross,
             sum(provision_gbp) AS prov, sum(net_value_gbp) AS net,
             sum(total_value_gbp) FILTER (WHERE status IN ('slow_moving', 'obsolete')) AS aged_value,
             sum(CASE status WHEN 'slow_moving' THEN total_value_gbp * 0.15 WHEN 'obsolete' THEN total_value_gbp * 0.50 ELSE 0 END) AS policy_prov,
             count(*) FILTER (WHERE status <> 'active' AND provision_pct < CASE status WHEN 'slow_moving' THEN 0.15 ELSE 0.50 END - 0.0001) AS below_policy
      FROM s GROUP BY site_id
    ), ops AS (SELECT site_id, sum(stock_value_gbp) AS v FROM master.dc_stock GROUP BY site_id),
    tot AS (
      SELECT 'ALL' AS site_id, sum(units), sum(skus), sum(gross), sum(prov), sum(net), sum(aged_value), sum(policy_prov), sum(below_policy)
      FROM per
    )
    SELECT p.site_id, coalesce(st.name, 'All sites') AS site_name, CAST(p.units AS BIGINT) AS total_units, CAST(p.skus AS INTEGER) AS sku_count,
           round(p.gross, 2) AS gross_value_gbp, round(p.prov, 2) AS provision_gbp, round(p.net, 2) AS net_value_gbp,
           round(coalesce(p.aged_value, 0), 2) AS slow_moving_and_obsolete_value_gbp,
           round(p.prov / NULLIF(p.aged_value, 0) * 100, 1) AS provision_cover_pct,
           round(p.policy_prov, 2) AS policy_provision_gbp,
           round(p.policy_prov - p.prov, 2) AS provision_shortfall_gbp,
           CAST(p.below_policy AS INTEGER) AS skus_provided_below_policy,
           round(CASE WHEN p.site_id = 'ALL' THEN (SELECT sum(v) FROM ops WHERE $site_id IS NULL) ELSE o.v END, 2) AS ops_stock_value_gbp,
           round(p.gross - CASE WHEN p.site_id = 'ALL' THEN (SELECT sum(v) FROM ops WHERE $site_id IS NULL) ELSE o.v END, 2) AS finance_minus_ops_gbp
    FROM (SELECT * FROM per UNION ALL SELECT * FROM tot) p
    LEFT JOIN master.sites st ON st.site_id = p.site_id
    LEFT JOIN ops o ON o.site_id = p.site_id
    ORDER BY (p.site_id = 'ALL'), p.site_id
  limit: 10
  example:
    site_id: DC1
- name: compare_wms_to_ledger
  desc: Reconcile WMS stock value to the ledger by SKU, or by cause with group_by cause. Shows the difference and whether it is timing, valuation or an error.
  kind: sql
  args:
    site_id:
      desc: Site or DC, e.g. DC1 (default all)
    group_by:
      type: enum
      values:
      - sku
      - cause
      default: sku
      desc: sku = largest differences first; cause = total difference per cause
    as_of_date:
      type: date
      default: $as_of
      desc: Date for comparison
    min_variance_gbp:
      type: float
      default: 1000.0
      desc: Only show differences of at least this size
  sql: |
    WITH snap AS (SELECT max(as_of_date) AS d FROM erp_stock WHERE as_of_date <= CAST($as_of_date AS DATE)),
    l AS (
      SELECT e.sku, e.site_id, e.quantity AS ledger_units, e.unit_cost_gbp AS ledger_unit_cost, e.total_value_gbp AS ledger_value
      FROM erp_stock e JOIN snap ON e.as_of_date = snap.d WHERE ($site_id IS NULL OR e.site_id = $site_id)
    ), w AS (
      SELECT sku, site_id, on_hand AS wms_units, stock_value_gbp AS wms_value FROM master.dc_stock
      WHERE ($site_id IS NULL OR site_id = $site_id)
    ), j AS (
      SELECT coalesce(l.sku, w.sku) AS sku, coalesce(l.site_id, w.site_id) AS site_id, coalesce(w.wms_units, 0) AS wms_units,
             coalesce(l.ledger_units, 0) AS ledger_units, coalesce(w.wms_value, 0) AS wms_value, coalesce(l.ledger_value, 0) AS ledger_value,
             l.ledger_unit_cost, w.wms_value / NULLIF(w.wms_units, 0) AS wms_unit_cost
      FROM l FULL OUTER JOIN w ON w.sku = l.sku AND w.site_id = l.site_id
    ), c AS (
      SELECT j.*, j.ledger_value - j.wms_value AS diff,
             CASE
               WHEN j.ledger_units <> j.wms_units AND EXISTS (SELECT 1 FROM goods_movements m WHERE m.sku = j.sku AND m.to_site_id = j.site_id
                                                             AND m.pending_in = 'WMS') THEN 'timing: ERP goods receipt not yet put away in WMS'
               WHEN j.ledger_units <> j.wms_units THEN 'error: quantity posted twice in ledger'
               WHEN j.ledger_unit_cost > 3 * j.wms_unit_cost THEN 'error: ledger unit cost keyed at ten times'
               WHEN abs(j.ledger_value - j.wms_value) >= 1 THEN 'valuation: ledger standard cost updated, WMS cost not refreshed'
               ELSE 'agreed'
             END AS cause
      FROM j
    )
    SELECT * FROM (
    SELECT c.sku, p.name AS sku_name, c.site_id, c.wms_units, c.ledger_units, round(c.wms_value, 2) AS wms_value_gbp,
           round(c.ledger_value, 2) AS ledger_value_gbp, round(c.diff, 2) AS difference_gbp, c.cause,
           round(sum(c.diff) OVER (), 2) AS net_difference_all_skus_gbp
    FROM c LEFT JOIN master.products p ON p.sku = c.sku
    WHERE $group_by = 'sku' AND abs(c.diff) >= $min_variance_gbp
    UNION ALL
    SELECT NULL, CAST(count(*) AS VARCHAR) || ' SKU-site balances', NULL, sum(c.wms_units), sum(c.ledger_units), round(sum(c.wms_value), 2),
           round(sum(c.ledger_value), 2), round(sum(c.diff), 2), c.cause, round(sum(sum(c.diff)) OVER (), 2)
    FROM c WHERE $group_by = 'cause' AND abs(c.diff) >= $min_variance_gbp GROUP BY c.cause
    ) x
    ORDER BY abs(difference_gbp) DESC
  limit: 25
  example:
    site_id: DC1
- name: get_erp_stock_by_sku
  desc: ERP stock balances by SKU and DC from the latest close, largest value first, with quantity, standard cost, value and totals for the selection.
  kind: sql
  args:
    sku:
      desc: SKU (default all)
    site_id:
      desc: Site or DC, e.g. DC3 (default all)
    min_value_gbp:
      type: float
      desc: Only balances worth at least this much
    as_of_date:
      type: date
      default: $as_of
      desc: Latest snapshot on or before this date
  sql: |
    WITH snap AS (SELECT max(as_of_date) AS d FROM erp_stock WHERE as_of_date <= CAST($as_of_date AS DATE)),
    sel AS (
      SELECT e.* FROM erp_stock e JOIN snap ON e.as_of_date = snap.d
      WHERE ($sku IS NULL OR e.sku = $sku) AND ($site_id IS NULL OR e.site_id = $site_id)
        AND ($min_value_gbp IS NULL OR e.total_value_gbp >= $min_value_gbp))
    SELECT e.sku, p.name, e.site_id, s.name AS site_name, e.location_id, e.as_of_date, e.quantity,
           round(e.unit_cost_gbp, 2) AS unit_cost_gbp, round(e.total_value_gbp, 2) AS total_value_gbp,
           sum(e.quantity) OVER () AS total_units_in_selection, round(sum(e.total_value_gbp) OVER (), 2) AS total_value_in_selection_gbp
    FROM sel e
    LEFT JOIN master.products p ON p.sku = e.sku
    LEFT JOIN master.sites s ON s.site_id = e.site_id
    ORDER BY e.total_value_gbp DESC, e.sku
  limit: 100
  example:
    sku: SKU-100007
- name: get_intercompany_balances
  desc: Intercompany position between two entities, both directions, with what each side booked, the difference and its split into missing invoice, timing and FX.
  kind: sql
  args:
    from_entity_id:
      required: true
      desc: Sending entity, e.g. LE-UK
    to_entity_id:
      required: true
      desc: Receiving entity, e.g. LE-PL
    as_of_date:
      type: date
      default: $as_of
      desc: Position as of this date
  sql: |
    WITH t AS (
      SELECT i.*,
             CASE WHEN i.counterparty_posting_date IS NOT NULL AND i.counterparty_posting_date <= CAST($as_of_date AS DATE)
                  THEN i.counterparty_amount_gbp ELSE 0 END AS cp_booked,
             CASE WHEN i.counterparty_amount_gbp IS NULL THEN 'missing_invoice'
                  WHEN i.counterparty_posting_date > CAST($as_of_date AS DATE) THEN 'timing'
                  WHEN abs(i.amount_gbp - i.counterparty_amount_gbp) > 0.005 THEN 'fx'
                  ELSE 'none' END AS cause
      FROM intercompany_transactions i
      WHERE ((i.from_entity_id = $from_entity_id AND i.to_entity_id = $to_entity_id)
          OR (i.from_entity_id = $to_entity_id AND i.to_entity_id = $from_entity_id))
        AND i.posting_date <= CAST($as_of_date AS DATE)),
    d AS (
      SELECT t.from_entity_id, t.to_entity_id, count(*) AS transactions, sum(t.amount_gbp) AS booked_by_sender,
             sum(t.cp_booked) AS booked_by_receiver,
             sum(CASE WHEN t.cause = 'missing_invoice' THEN t.amount_gbp ELSE 0 END) AS missing_invoice,
             sum(CASE WHEN t.cause = 'timing' THEN t.amount_gbp ELSE 0 END) AS timing,
             sum(CASE WHEN t.cause = 'fx' THEN t.amount_gbp - t.counterparty_amount_gbp ELSE 0 END) AS fx,
             count(*) FILTER (WHERE t.cause <> 'none') AS open_items
      FROM t GROUP BY t.from_entity_id, t.to_entity_id)
    SELECT d.from_entity_id, d.to_entity_id, d.transactions, round(d.booked_by_sender, 2) AS booked_by_sender_gbp,
           round(d.booked_by_receiver, 2) AS booked_by_receiver_gbp, round(d.booked_by_sender - d.booked_by_receiver, 2) AS difference_gbp,
           round(d.missing_invoice, 2) AS missing_invoice_gbp, round(d.timing, 2) AS timing_gbp, round(d.fx, 2) AS fx_gbp, d.open_items
    FROM d
    UNION ALL
    SELECT 'TOTAL', '', sum(d.transactions), round(sum(d.booked_by_sender), 2), round(sum(d.booked_by_receiver), 2),
           round(sum(d.booked_by_sender - d.booked_by_receiver), 2), round(sum(d.missing_invoice), 2), round(sum(d.timing), 2),
           round(sum(d.fx), 2), sum(d.open_items)
    FROM d
    ORDER BY from_entity_id DESC
  limit: 5
  example:
    from_entity_id: LE-UK
    to_entity_id: LE-PL
- name: draft_clearing_journals
  desc: Draft clearing journals for an intercompany difference, one per cause (missing invoice, timing cut-off, FX), with accounts, amounts and the transactions covered. Read-only.
  kind: sql
  args:
    from_entity_id:
      required: true
      desc: Sending entity, e.g. LE-UK
    to_entity_id:
      required: true
      desc: Receiving entity that books the clearing journals, e.g. LE-PL
    posting_date:
      type: date
      default: -5d
      desc: Posting date for the journals (default period end)
  sql: |
    WITH t AS (
      SELECT i.*,
             CASE WHEN i.counterparty_amount_gbp IS NULL THEN 'missing_invoice'
                  WHEN i.counterparty_posting_date > CAST($as_of AS DATE) THEN 'timing'
                  WHEN abs(i.amount_gbp - i.counterparty_amount_gbp) > 0.005 THEN 'fx'
                  ELSE 'none' END AS cause
      FROM intercompany_transactions i
      WHERE i.from_entity_id = $from_entity_id AND i.to_entity_id = $to_entity_id),
    g AS (
      SELECT t.cause, count(*) AS transactions, string_agg(t.ic_txn_id, ';' ORDER BY t.ic_txn_id) AS ic_txn_ids,
             sum(CASE WHEN t.cause = 'fx' THEN t.amount_gbp - t.counterparty_amount_gbp ELSE t.amount_gbp END) AS amount
      FROM t WHERE t.cause <> 'none' GROUP BY t.cause)
    SELECT $to_entity_id AS entity_id, 'intercompany' AS je_type, CAST($posting_date AS DATE) AS posting_date,
           CASE g.cause WHEN 'missing_invoice' THEN 'Clear intercompany: sender invoices not booked by receiver (book payable and expense)'
                        WHEN 'timing' THEN 'Clear intercompany: cut-off accrual for invoices the receiver books after period end (auto-reverses)'
                        ELSE 'Clear intercompany: FX difference between sender and receiver booking rates' END AS description,
           CASE g.cause WHEN 'fx' THEN '8100' ELSE '6900' END AS debit_account, '2300' AS credit_account,
           round(g.amount, 2) AS amount_gbp, g.cause AS basis, g.transactions, g.ic_txn_ids
    FROM g ORDER BY g.amount DESC
  limit: 5
  example:
    from_entity_id: LE-UK
    to_entity_id: LE-PL
- name: get_freight_cost_by_ledger_account
  desc: Freight cost postings by GL account and carrier over a period, with account subtotals and a grand total; shows freight coded to non-freight accounts.
  kind: sql
  args:
    account_code:
      type: str
      desc: GL account code, e.g. 5110 (default all)
    carrier_id:
      desc: Carrier (default all)
    period_start:
      type: date
      default: -30d
      desc: Costs on or after
    period_end:
      type: date
      default: $as_of
      desc: Costs on or before
  sql: |
    WITH f AS (
      SELECT f.account_code, a.name AS account_name, f.carrier_id, c.name AS carrier_name, f.cost_gbp, f.invoice_ref, f.cost_centre_id, f.posting_date
      FROM freight_costs f
      LEFT JOIN accounts a ON a.account_code = f.account_code
      LEFT JOIN master.carriers c ON c.carrier_id = f.carrier_id
      WHERE f.posting_date >= CAST($period_start AS DATE) AND f.posting_date <= CAST($period_end AS DATE)
        AND ($account_code IS NULL OR f.account_code = $account_code)
        AND ($carrier_id IS NULL OR f.carrier_id = $carrier_id)),
    r AS (
      SELECT COALESCE(f.account_code, 'ALL') AS account_code, COALESCE(any_value(f.account_name), 'All freight accounts') AS account_name,
             COALESCE(f.carrier_id, 'ALL') AS carrier_id, CASE WHEN f.carrier_id IS NULL THEN '' ELSE any_value(f.carrier_name) END AS carrier_name,
             round(sum(f.cost_gbp), 2) AS total_cost_gbp, count(*) AS postings,
             string_agg(DISTINCT CASE WHEN f.account_code <> '5110' THEN f.invoice_ref END, '; ') AS miscoded_invoice_refs
      FROM f GROUP BY ROLLUP(f.account_code, f.carrier_id))
    SELECT * FROM r ORDER BY (account_code = 'ALL'), account_code, (carrier_id = 'ALL') DESC, total_cost_gbp DESC
  limit: 60
  example: {}
- name: get_fx_gain_loss_by_account
  desc: FX gain and loss postings by account, currency and realised or unrealised type, flagging unrealised amounts booked to the realised account.
  kind: sql
  args:
    account_code:
      desc: GL FX account, e.g. 8110 realised or 8120 unrealised (default all)
    period_start:
      type: date
      default: -90d
      desc: Postings on or after
    period_end:
      type: date
      default: $as_of
      desc: Postings on or before
  sql: |
    SELECT f.account_code, a.name AS account_name, f.currency, f.fx_type,
           round(sum(f.gain_loss_gbp), 2) AS gain_loss_gbp,
           count(*) AS transaction_count,
           CASE WHEN f.fx_type = 'unrealised' AND f.account_code = '8110' THEN 'unrealised booked to realised account' ELSE '' END AS flag,
           string_agg(DISTINCT f.je_id, '; ') FILTER (WHERE f.fx_type = 'unrealised' AND f.account_code = '8110') AS misclassified_je_ids,
           round(avg(f.opening_rate), 4) AS avg_opening_rate,
           round(avg(f.closing_rate), 4) AS avg_closing_rate,
           round(sum(sum(f.gain_loss_gbp)) OVER (), 2) AS net_gain_loss_all_accounts_gbp
    FROM fx_gains_losses f
    LEFT JOIN accounts a ON a.account_code = f.account_code
    WHERE f.posting_date >= CAST($period_start AS DATE)
      AND f.posting_date <= CAST($period_end AS DATE)
      AND ($account_code IS NULL OR f.account_code = $account_code)
    GROUP BY f.account_code, a.name, f.currency, f.fx_type
    ORDER BY f.account_code, f.currency
  limit: 40
  example: {}
- name: get_handling_cost_by_channel
  desc: Handling cost, units and cost per unit by circular-economy recovery channel (take-back, resale, repair, recycling) over a period, with a total row.
  kind: sql
  args:
    channel:
      type: enum
      values:
      - take_back
      - resale
      - repair
      - recycling
      desc: Recovery channel (default all)
    period_start:
      type: date
      default: -365d
      desc: Costs on or after
    period_end:
      type: date
      default: $as_of
      desc: Costs on or before
  sql: |
    WITH r AS (
      SELECT COALESCE(h.channel, 'TOTAL') AS channel, round(sum(h.cost_gbp), 2) AS total_cost_gbp, sum(h.units_handled) AS total_units,
             round(sum(h.cost_gbp) / NULLIF(sum(h.units_handled), 0), 4) AS cost_per_unit_gbp, count(*) AS posting_count
      FROM handling_costs h
      WHERE h.posting_date >= CAST($period_start AS DATE) AND h.posting_date <= CAST($period_end AS DATE)
        AND ($channel IS NULL OR h.channel = $channel)
      GROUP BY ROLLUP(h.channel))
    SELECT * FROM r ORDER BY (channel = 'TOTAL'), total_cost_gbp DESC
  limit: 10
  example: {}
- name: get_erp_order_header_and_charges
  desc: ERP order headers with entity, channel, shipments, revenue, freight and handling charges, discount and total charges. Filter by order, entity or channel.
  kind: sql
  args:
    order_id:
      desc: Order id, e.g. ORD-2026-0100002 (default all orders in the period)
    entity_id:
      desc: Legal entity, e.g. LE-UK (default all)
    channel:
      type: enum
      values:
      - web
      - app
      - click_collect
      - marketplace
      desc: Sales channel (default all)
    period_start:
      type: date
      default: -30d
      desc: Orders on or after
    period_end:
      type: date
      default: $as_of
      desc: Orders on or before
  sql: |
    SELECT o.order_id, o.posting_date, o.entity_id, le.name AS entity_name, m.channel, m.fulfil_site_id, m.units, m.delivery_service,
           o.shipment_count, round(o.revenue_gbp, 2) AS revenue_gbp, round(o.freight_charge_gbp, 2) AS freight_charge_gbp,
           round(o.handling_charge_gbp, 2) AS handling_charge_gbp, round(o.discount_gbp, 2) AS discount_gbp,
           round(o.total_charges_gbp, 2) AS total_charges_gbp, count(*) OVER () AS orders_in_selection,
           round(sum(o.revenue_gbp) OVER (), 2) AS revenue_in_selection_gbp
    FROM order_charges o
    LEFT JOIN master.orders m ON m.order_id = o.order_id
    LEFT JOIN master.legal_entities le ON le.entity_id = o.entity_id
    WHERE o.posting_date >= CAST($period_start AS DATE) AND o.posting_date <= CAST($period_end AS DATE)
      AND ($order_id IS NULL OR o.order_id = $order_id)
      AND ($entity_id IS NULL OR o.entity_id = $entity_id)
      AND ($channel IS NULL OR m.channel = $channel)
    ORDER BY o.posting_date DESC, o.order_id
  limit: 25
  example:
    entity_id: LE-UK
- name: get_intercompany_sourcing_margins
  desc: Sourcing entity mark-up on cost by product department against policy mark-up, with the fee shortfall or excess versus policy. Use for transfer pricing exposure.
  kind: sql
  args:
    from_entity_id:
      desc: Sourcing entity, e.g. LE-HK (default all)
    to_entity_id:
      desc: Receiving entity, e.g. LE-UK (default all)
    department:
      type: str
      desc: Product department, e.g. Womenswear (default all)
    period_start:
      type: date
      default: -365d
      desc: Quarters ending on or after
    period_end:
      type: date
      default: $as_of
      desc: Quarters ending on or before
  sql: |
    WITH s AS (
      SELECT * FROM sourcing_margins
      WHERE period_end >= CAST($period_start AS DATE) AND period_end <= CAST($period_end AS DATE)
        AND ($from_entity_id IS NULL OR sourcing_entity_id = $from_entity_id)
        AND ($to_entity_id IS NULL OR receiving_entity_id = $to_entity_id)
        AND ($department IS NULL OR department = $department)
    ), d AS (
      SELECT sourcing_entity_id, receiving_entity_id, department, count(DISTINCT period) AS quarters,
             sum(cost_base_gbp) AS cost, sum(fee_charged_gbp) AS fee, avg(policy_markup_pct) AS policy
      FROM s GROUP BY sourcing_entity_id, receiving_entity_id, department
    ), a AS (
      SELECT sourcing_entity_id, receiving_entity_id, 'ALL' AS department, count(DISTINCT period) AS quarters,
             sum(cost_base_gbp) AS cost, sum(fee_charged_gbp) AS fee, avg(policy_markup_pct) AS policy
      FROM s GROUP BY sourcing_entity_id, receiving_entity_id
    )
    SELECT u.sourcing_entity_id, le.name AS sourcing_entity_name, u.receiving_entity_id, u.department, u.quarters,
           round(u.cost, 2) AS cost_base_gbp, round(u.fee, 2) AS fee_charged_gbp,
           round((u.fee / u.cost - 1) * 100, 2) AS markup_pct, round(u.policy, 2) AS policy_markup_pct,
           round((u.fee / u.cost - 1) * 100 - u.policy, 2) AS markup_vs_policy_pp,
           round(u.cost * (1 + u.policy / 100) - u.fee, 2) AS shortfall_vs_policy_gbp
    FROM (SELECT * FROM a UNION ALL SELECT * FROM d) u
    LEFT JOIN master.legal_entities le ON le.entity_id = u.sourcing_entity_id
    ORDER BY u.sourcing_entity_id, (u.department <> 'ALL'), u.department
  limit: 60
  example: {}
- name: calculate_shift_option_cost
  desc: Total cost of a late shift (night premium, allowances, agency fees, onboarding) versus overtime for a headcount gap, from the site rate card.
  kind: sql
  args:
    site_id:
      required: true
      desc: DC site with a rate card, e.g. DC1
    period_start:
      type: date
      required: true
      desc: First day of the staffing period
    period_end:
      type: date
      required: true
      desc: Last day of the staffing period
    headcount_gap:
      type: int
      default: 45
      desc: FTE headcount gap to fill
    shift_option:
      type: enum
      values:
      - late_shift
      - overtime
      desc: Cost only this option (default both)
    agency_share_pct:
      type: float
      desc: Share of late-shift hours filled by agency staff (default from the rate card)
  sql: |
    WITH p AS (
      SELECT r.*, GREATEST(1, CAST(ceil((CAST(CAST($period_end AS DATE) - CAST($period_start AS DATE) AS INTEGER) + 1) / 7.0) AS INTEGER)) AS weeks,
             COALESCE($agency_share_pct, r.late_shift_agency_share_pct) / 100.0 AS agency_share
      FROM labour_rate_card r WHERE r.site_id = $site_id),
    b AS (SELECT p.*, $headcount_gap * p.hours_per_fte_week * p.weeks AS total_hours FROM p),
    o AS (
      SELECT 'late_shift' AS shift_option, b.site_id, b.weeks, $headcount_gap AS headcount_gap, b.total_hours,
             b.total_hours * (1 - b.agency_share) * b.base_hourly_gbp * (1 + b.night_premium_pct / 100.0) * (1 + b.employer_oncost_pct / 100.0) AS own_staff_pay_gbp,
             b.total_hours * (1 - b.agency_share) * b.base_hourly_gbp * (b.night_premium_pct / 100.0) * (1 + b.employer_oncost_pct / 100.0) AS premium_gbp,
             b.total_hours * b.agency_share * b.agency_pay_hourly_gbp * (1 + b.agency_night_uplift_pct / 100.0) AS agency_pay_gbp,
             b.total_hours * b.agency_share * b.agency_margin_hourly_gbp AS agency_fees_gbp,
             $headcount_gap * (1 - b.agency_share) * b.shifts_per_fte_week * b.weeks * b.night_allowance_per_shift_gbp AS allowances_gbp,
             $headcount_gap * (1 - b.agency_share) * b.onboarding_cost_per_hire_gbp AS onboarding_gbp,
             'late shift: hours x (1 - agency share) x base x (1 + night premium) x (1 + on-cost) + agency hours x (pay x (1 + uplift) + margin) + allowances + onboarding' AS formula
      FROM b
      UNION ALL
      SELECT 'overtime', b.site_id, b.weeks, $headcount_gap, b.total_hours,
             b.total_hours * b.base_hourly_gbp * b.overtime_multiplier * (1 + b.employer_oncost_pct / 100.0),
             b.total_hours * b.base_hourly_gbp * (b.overtime_multiplier - 1) * (1 + b.employer_oncost_pct / 100.0),
             0, 0,
             $headcount_gap * b.shifts_per_fte_week * b.weeks * b.overtime_meal_allowance_per_shift_gbp,
             0,
             'overtime: hours x base x overtime multiplier x (1 + on-cost) + meal allowances'
      FROM b)
    SELECT o.shift_option, o.site_id, o.weeks, o.headcount_gap, round(o.total_hours, 0) AS total_hours,
           round(o.own_staff_pay_gbp, 0) AS own_staff_pay_gbp, round(o.premium_gbp, 0) AS of_which_premium_gbp,
           round(o.agency_pay_gbp, 0) AS agency_pay_gbp, round(o.agency_fees_gbp, 0) AS agency_fees_gbp,
           round(o.allowances_gbp, 0) AS allowances_gbp, round(o.onboarding_gbp, 0) AS onboarding_gbp,
           round(o.own_staff_pay_gbp + o.agency_pay_gbp + o.agency_fees_gbp + o.allowances_gbp + o.onboarding_gbp, 0) AS total_cost_gbp,
           round((o.own_staff_pay_gbp + o.agency_pay_gbp + o.agency_fees_gbp + o.allowances_gbp + o.onboarding_gbp) / o.total_hours, 2) AS cost_per_hour_gbp,
           o.formula
    FROM o
    WHERE ($shift_option IS NULL OR o.shift_option = $shift_option)
    ORDER BY o.shift_option
  limit: 2
  example:
    site_id: DC1
    period_start: +29d
    period_end: +84d
    headcount_gap: 45
- name: get_dc_cost_and_productivity_kpis
  desc: Per-DC cost per unit shipped (labour, energy, rent) and productivity (units per paid hour) over a period, with the cost definition. For benchmarking.
  kind: sql
  args:
    site_id:
      desc: DC site, e.g. DC1 (default all DCs)
    period_start:
      type: date
      default: -90d
      desc: Months ending on or after
    period_end:
      type: date
      default: $as_of
      desc: Months ending on or before
  sql: |
    WITH w AS (
      SELECT c.cost_centre_id, count(DISTINCT c.period) AS months, sum(c.amount_gbp) AS total_cost,
             sum(c.amount_gbp) FILTER (WHERE c.category IN ('labour', 'overtime', 'agency')) AS labour_cost,
             sum(c.amount_gbp) FILTER (WHERE c.category IN ('overtime', 'agency')) AS flex_cost,
             sum(c.amount_gbp) FILTER (WHERE c.category = 'energy') AS energy_cost,
             sum(c.amount_gbp) FILTER (WHERE c.category = 'rent') AS rent_cost
      FROM cost_centre_actuals c
      WHERE c.period_end >= CAST($period_start AS DATE) AND c.period_end <= CAST($period_end AS DATE)
      GROUP BY c.cost_centre_id),
    d AS (
      SELECT x.cost_centre_id, sum(x.units_shipped) AS units, sum(x.orders_shipped) AS orders, sum(x.paid_hours) AS hours
      FROM dc_activity x
      WHERE x.period_end >= CAST($period_start AS DATE) AND x.period_end <= CAST($period_end AS DATE)
      GROUP BY x.cost_centre_id)
    SELECT cc.site_id, s.name AS site_name, w.months, d.units AS units_shipped, d.orders AS orders_shipped,
           round(w.total_cost, 0) AS total_cost_gbp, round(100 * w.total_cost / d.units, 2) AS cost_per_unit_pence,
           round(100 * w.labour_cost / d.units, 2) AS labour_cost_per_unit_pence,
           round(100 * w.flex_cost / w.labour_cost, 1) AS overtime_and_agency_pct_of_labour_cost,
           round(d.units / d.hours, 1) AS units_per_paid_hour, round(w.labour_cost / d.hours, 2) AS labour_cost_per_paid_hour_gbp,
           round(100 * w.energy_cost / d.units, 2) AS energy_cost_per_unit_pence, round(100 * w.rent_cost / d.units, 2) AS rent_cost_per_unit_pence,
           round(d.units / d.orders, 2) AS units_per_order,
           'cost per unit = all DC cost-centre costs (labour, overtime, agency, damages, rework, energy, rent) / units shipped; units per paid hour counts permanent, overtime and agency hours and excludes management' AS definition
    FROM w JOIN d ON d.cost_centre_id = w.cost_centre_id
    JOIN master.cost_centres cc ON cc.cost_centre_id = w.cost_centre_id
    LEFT JOIN master.sites s ON s.site_id = cc.site_id
    WHERE ($site_id IS NULL OR cc.site_id = $site_id)
    ORDER BY cc.site_id
  limit: 10
  example:
    site_id: DC1
- name: get_inventory_value_movement
  desc: 'Inventory value movement by month: opening, volume, mix, cost update, FX and adjustment effects, closing value and units, with finance notes. Group by category for drivers.'
  kind: sql
  args:
    site_id:
      desc: Site or DC, e.g. DC1 (default all)
    category:
      type: str
      desc: Product category, e.g. Outerwear (default all)
    group_by:
      type: enum
      values:
      - month
      - category
      default: month
      desc: month = one row per month; category = movement summed over the period per category
    period_start:
      type: date
      default: -90d
      desc: Month-ends on or after
    period_end:
      type: date
      default: $as_of
      desc: Month-ends on or before
  sql: |
    WITH mm AS (
      SELECT month_end, sum(units_on_hand) AS units, sum(gross_value_gbp) AS closing, sum(volume_gbp) AS vol, sum(mix_gbp) AS mix,
             sum(cost_update_gbp) AS cost, sum(fx_gbp) AS fx, sum(adjustments_gbp) AS adj,
             string_agg(DISTINCT NULLIF(movement_note, ''), '; ') AS notes
      FROM inventory_monthly WHERE ($site_id IS NULL OR site_id = $site_id) AND ($category IS NULL OR category = $category)
      GROUP BY month_end
    ), w AS (SELECT *, lag(units) OVER (ORDER BY month_end) AS prior_units FROM mm),
    cat AS (
      SELECT category, max(month_end) AS month_end, sum(volume_gbp) AS vol, sum(mix_gbp) AS mix, sum(cost_update_gbp) AS cost,
             sum(fx_gbp) AS fx, sum(adjustments_gbp) AS adj, string_agg(DISTINCT NULLIF(movement_note, ''), '; ') AS notes
      FROM inventory_monthly
      WHERE month_end >= CAST($period_start AS DATE) AND month_end <= CAST($period_end AS DATE)
        AND ($site_id IS NULL OR site_id = $site_id) AND ($category IS NULL OR category = $category)
      GROUP BY category
    )
    SELECT month_end, 'ALL' AS category, CAST(units AS BIGINT) AS units_on_hand, CAST(units - prior_units AS BIGINT) AS units_change,
           round(closing - (vol + mix + cost + fx + adj), 2) AS opening_value_gbp, round(vol, 2) AS volume_gbp, round(mix, 2) AS mix_gbp,
           round(cost, 2) AS cost_update_gbp, round(fx, 2) AS fx_gbp, round(adj, 2) AS adjustments_gbp,
           round(vol + mix + cost + fx + adj, 2) AS change_gbp, round(closing, 2) AS closing_value_gbp, notes
    FROM w
    WHERE $group_by = 'month' AND month_end >= CAST($period_start AS DATE) AND month_end <= CAST($period_end AS DATE)
    UNION ALL
    SELECT month_end, category, NULL, NULL, NULL, round(vol, 2), round(mix, 2), round(cost, 2), round(fx, 2), round(adj, 2),
           round(vol + mix + cost + fx + adj, 2), NULL, notes
    FROM cat WHERE $group_by = 'category'
    ORDER BY month_end DESC, change_gbp DESC
  limit: 40
  example:
    site_id: DC1
- name: get_ledger_inventory_balance
  desc: 'Inventory ledger balances for a financial period: finished goods account 1300 and provision account 1310 with opening, movement and closing, and net inventory.'
  kind: sql
  args:
    account_code:
      desc: GL inventory account, 1300 or 1310 (default both)
    period:
      required: true
      type: str
      desc: Financial period, e.g. FY27-08
  sql: |
    SELECT b.account_code, b.account_desc, b.period, b.period_end, round(b.opening_balance_gbp, 2) AS opening_balance_gbp,
           round(b.movement_gbp, 2) AS movement_gbp, round(b.closing_balance_gbp, 2) AS balance_gbp,
           round(sum(b.closing_balance_gbp) OVER (), 2) AS net_inventory_gbp
    FROM ledger_balances b
    WHERE b.period = $period AND ($account_code IS NULL OR b.account_code = $account_code)
    ORDER BY b.account_code
  limit: 50
  example:
    period: FY27-08
- name: get_payment_history_by_supplier
  desc: 'Supplier payment terms and actual payment timing: invoices paid, average days to pay, days beyond terms, share paid late and overdue open invoices. Worst payers first.'
  kind: sql
  args:
    supplier_id:
      desc: Supplier, e.g. SUP-0073 (default all)
    period_start:
      type: date
      default: -180d
      desc: Payments on or after
    period_end:
      type: date
      default: $as_of
      desc: Payments on or before
  sql: |
    WITH paid AS (
      SELECT * FROM supplier_payments
      WHERE status = 'paid' AND paid_date >= CAST($period_start AS DATE) AND paid_date <= CAST($period_end AS DATE)
        AND ($supplier_id IS NULL OR supplier_id = $supplier_id)
    ), od AS (
      SELECT supplier_id, count(*) AS n, round(sum(amount_gbp), 2) AS amt FROM supplier_payments
      WHERE status = 'open' AND due_date < CAST($as_of AS DATE) AND ($supplier_id IS NULL OR supplier_id = $supplier_id) GROUP BY supplier_id
    )
    SELECT p.supplier_id, sup.name AS supplier_name, any_value(p.payment_terms_days) AS payment_terms_days, count(*) AS invoices_paid,
           round(sum(p.amount_gbp), 2) AS total_paid_gbp, round(avg(p.days_to_pay), 1) AS avg_days_to_pay,
           round(avg(p.days_late), 1) AS avg_days_beyond_terms, max(p.days_late) AS max_days_beyond_terms,
           round(100.0 * count(*) FILTER (WHERE p.days_late > 0) / count(*), 1) AS pct_paid_late, max(p.paid_date) AS last_payment_date,
           coalesce(any_value(od.n), 0) AS overdue_open_invoices, coalesce(any_value(od.amt), 0) AS overdue_open_gbp
    FROM paid p
    LEFT JOIN master.suppliers sup ON sup.supplier_id = p.supplier_id
    LEFT JOIN od ON od.supplier_id = p.supplier_id
    GROUP BY p.supplier_id, sup.name
    ORDER BY avg_days_beyond_terms DESC, total_paid_gbp DESC
  limit: 20
  example: {}
- name: get_realised_vs_unrealised_fx
  desc: Realised and unrealised FX split by currency with totals, plus how much unrealised FX was booked to the realised account 8110.
  kind: sql
  args:
    currency:
      desc: Currency, e.g. USD (default all)
    period_start:
      type: date
      default: -90d
      desc: Postings on or after
    period_end:
      type: date
      default: $as_of
      desc: Postings on or before
  sql: |
    WITH f AS (
      SELECT * FROM fx_gains_losses
      WHERE posting_date >= CAST($period_start AS DATE) AND posting_date <= CAST($period_end AS DATE)
        AND ($currency IS NULL OR currency = $currency)
    ), by_ccy AS (
      SELECT currency, fx_type, sum(gain_loss_gbp) AS net, count(*) AS n,
             sum(CASE WHEN gain_loss_gbp > 0 THEN gain_loss_gbp ELSE 0 END) AS gains,
             sum(CASE WHEN gain_loss_gbp < 0 THEN -gain_loss_gbp ELSE 0 END) AS losses,
             sum(CASE WHEN account_code = '8110' THEN gain_loss_gbp ELSE 0 END) AS in_realised_account
      FROM f GROUP BY currency, fx_type
    ), tot AS (
      SELECT 'ALL' AS currency, fx_type, sum(net) AS net, sum(n) AS n, sum(gains) AS gains, sum(losses) AS losses,
             sum(in_realised_account) AS in_realised_account
      FROM by_ccy GROUP BY fx_type
    )
    SELECT currency, fx_type, round(net, 2) AS gain_loss_gbp, CAST(n AS INTEGER) AS transaction_count,
           round(gains, 2) AS gains_gbp, round(losses, 2) AS losses_gbp,
           round(CASE WHEN fx_type = 'unrealised' THEN in_realised_account ELSE 0 END, 2) AS booked_to_realised_account_gbp
    FROM (SELECT * FROM tot UNION ALL SELECT * FROM by_ccy)
    ORDER BY (currency <> 'ALL'), currency, fx_type
  limit: 40
  example: {}
- name: get_recovered_value_by_channel
  desc: Value recovered by circular-economy channel (take-back, resale, repair, recycling) over a period with handling cost and recovered value per pound of handling cost.
  kind: sql
  args:
    channel:
      type: enum
      values:
      - take_back
      - resale
      - repair
      - recycling
      desc: Recovery channel (default all)
    period_start:
      type: date
      default: -365d
      desc: Period start
    period_end:
      type: date
      default: $as_of
      desc: Period end
  sql: |
    WITH r AS (
      SELECT COALESCE(h.channel, 'TOTAL') AS channel, sum(h.units_handled) AS units_recovered,
             round(sum(h.recovered_value_gbp), 2) AS recovered_value_gbp, round(sum(h.cost_gbp), 2) AS handling_cost_gbp,
             round(sum(h.recovered_value_gbp) / NULLIF(sum(h.cost_gbp), 0), 2) AS recovered_per_pound_of_handling_cost,
             round(sum(h.recovered_value_gbp) / NULLIF(sum(h.units_handled), 0), 2) AS recovered_value_per_unit_gbp
      FROM handling_costs h
      WHERE h.posting_date >= CAST($period_start AS DATE) AND h.posting_date <= CAST($period_end AS DATE)
        AND ($channel IS NULL OR h.channel = $channel)
      GROUP BY ROLLUP(h.channel))
    SELECT * FROM r ORDER BY (channel = 'TOTAL'), recovered_per_pound_of_handling_cost DESC
  limit: 10
  example: {}
- name: get_shrink_and_writeoff_history
  desc: Monthly shrink and write-offs with the same month a year earlier and rolling 12-month totals, or by category ranked by increase on last year.
  kind: sql
  args:
    site_id:
      desc: Site or DC, e.g. DC1 (default all)
    category:
      type: str
      desc: Product category, e.g. Fragrance (default all)
    group_by:
      type: enum
      values:
      - month
      - category
      default: month
      desc: month = trend by month; category = period total per category against the same period last year
    period_start:
      type: date
      default: -365d
      desc: History start
    period_end:
      type: date
      default: $as_of
      desc: History end
  sql: |
    WITH mm AS (
      SELECT month_end, sum(shrink_gbp) AS shrink, sum(written_off_gbp) AS wo, row_number() OVER (ORDER BY month_end) AS rn
      FROM inventory_monthly WHERE ($site_id IS NULL OR site_id = $site_id) AND ($category IS NULL OR category = $category)
      GROUP BY month_end
    ), r AS (
      SELECT *, sum(shrink + wo) OVER (ORDER BY month_end ROWS BETWEEN 11 PRECEDING AND CURRENT ROW) AS roll12, rn AS n FROM mm
    ), t AS (
      SELECT a.month_end, a.shrink, a.wo, b.shrink + b.wo AS prior_total,
             CASE WHEN a.rn >= 12 THEN a.roll12 END AS roll12, CASE WHEN b.rn >= 12 THEN b.roll12 END AS prior_roll12
      FROM r a LEFT JOIN r b ON b.rn = a.rn - 12
    ), cw AS (
      SELECT category, sum(shrink_gbp) AS shrink, sum(written_off_gbp) AS wo
      FROM inventory_monthly
      WHERE month_end >= CAST($period_start AS DATE) AND month_end <= CAST($period_end AS DATE)
        AND ($site_id IS NULL OR site_id = $site_id) AND ($category IS NULL OR category = $category) GROUP BY category
    ), cp AS (
      SELECT category, sum(shrink_gbp + written_off_gbp) AS prior_total
      FROM inventory_monthly
      WHERE month_end >= CAST($period_start AS DATE) - INTERVAL 365 DAY AND month_end <= CAST($period_end AS DATE) - INTERVAL 365 DAY
        AND ($site_id IS NULL OR site_id = $site_id) AND ($category IS NULL OR category = $category) GROUP BY category
    )
    SELECT * FROM (
    SELECT month_end, 'ALL' AS category, round(shrink, 2) AS shrink_gbp, round(wo, 2) AS written_off_gbp, round(shrink + wo, 2) AS total_loss_gbp,
           round(prior_total, 2) AS prior_year_total_gbp, round((shrink + wo) / NULLIF(prior_total, 0) * 100 - 100, 1) AS change_vs_prior_year_pct,
           round(roll12, 2) AS rolling_12m_gbp, round(prior_roll12, 2) AS prior_year_rolling_12m_gbp
    FROM t WHERE $group_by = 'month' AND month_end >= CAST($period_start AS DATE) AND month_end <= CAST($period_end AS DATE)
    UNION ALL
    SELECT NULL, cw.category, round(cw.shrink, 2), round(cw.wo, 2), round(cw.shrink + cw.wo, 2), round(cp.prior_total, 2),
           round((cw.shrink + cw.wo) / NULLIF(cp.prior_total, 0) * 100 - 100, 1), NULL, NULL
    FROM cw LEFT JOIN cp ON cp.category = cw.category WHERE $group_by = 'category'
    ) x
    ORDER BY month_end DESC NULLS LAST, (total_loss_gbp - coalesce(prior_year_total_gbp, 0)) DESC
  limit: 40
  example:
    site_id: DC1
- name: get_slow_moving_provision
  desc: Slow-moving and obsolete provision balance by category with the prior-year balance and change, plus an ALL row. Use to compare with last year.
  kind: sql
  args:
    site_id:
      desc: Site or DC, e.g. DC1 (default all)
    category:
      type: str
      desc: Product category, e.g. Outerwear (default all)
    as_of_date:
      type: date
      default: $as_of
      desc: Balance at the latest month-end on or before this date
  sql: |
    WITH ends AS (
      SELECT (SELECT max(month_end) FROM inventory_monthly WHERE month_end <= CAST($as_of_date AS DATE)) AS cur
    ), pe AS (
      SELECT cur, (SELECT max(month_end) FROM inventory_monthly WHERE month_end <= cur - INTERVAL 360 DAY) AS prior FROM ends
    ), c AS (
      SELECT m.category, sum(m.gross_value_gbp) AS gross, sum(m.provision_gbp) AS prov
      FROM inventory_monthly m JOIN pe ON m.month_end = pe.cur
      WHERE ($site_id IS NULL OR m.site_id = $site_id) AND ($category IS NULL OR m.category = $category) GROUP BY m.category
    ), p AS (
      SELECT m.category, sum(m.gross_value_gbp) AS gross, sum(m.provision_gbp) AS prov
      FROM inventory_monthly m JOIN pe ON m.month_end = pe.prior
      WHERE ($site_id IS NULL OR m.site_id = $site_id) AND ($category IS NULL OR m.category = $category) GROUP BY m.category
    ), a AS (
      SELECT pr.category, sum(i.total_value_gbp) FILTER (WHERE i.status = 'slow_moving') AS slow_value,
             sum(i.total_value_gbp) FILTER (WHERE i.status = 'obsolete') AS obs_value
      FROM inventory_by_site i JOIN master.products pr ON pr.sku = i.sku
      WHERE i.as_of_date = (SELECT max(as_of_date) FROM inventory_by_site WHERE as_of_date <= CAST($as_of_date AS DATE))
        AND ($site_id IS NULL OR i.site_id = $site_id) AND ($category IS NULL OR pr.category = $category) GROUP BY pr.category
    ), j AS (
      SELECT c.category, c.gross, c.prov, coalesce(a.slow_value, 0) AS slow_value, coalesce(a.obs_value, 0) AS obs_value,
             coalesce(p.prov, 0) AS prior_prov, coalesce(p.gross, 0) AS prior_gross
      FROM c LEFT JOIN p ON p.category = c.category LEFT JOIN a ON a.category = c.category
    ), u AS (
      SELECT 'ALL' AS category, sum(gross) AS gross, sum(prov) AS prov, sum(slow_value) AS slow_value, sum(obs_value) AS obs_value,
             sum(prior_prov) AS prior_prov, sum(prior_gross) AS prior_gross FROM j
      UNION ALL SELECT * FROM j
    )
    SELECT category, round(gross, 2) AS gross_value_gbp, round(slow_value, 2) AS slow_moving_value_gbp, round(obs_value, 2) AS obsolete_value_gbp,
           round(prov, 2) AS provision_gbp, round(prov / NULLIF(gross, 0) * 100, 2) AS provision_pct_of_value,
           round(prior_prov, 2) AS prior_year_provision_gbp, round(prov - prior_prov, 2) AS change_vs_prior_year_gbp,
           round((prov / NULLIF(prior_prov, 0) - 1) * 100, 1) AS change_vs_prior_year_pct
    FROM u ORDER BY (category <> 'ALL'), provision_gbp DESC
  limit: 40
  example: {}
- name: get_usd_cogs_exposure
  desc: USD-denominated cost of goods in GBP over whole weeks, its share of total COGS, and the extra cost if sterling falls against the dollar, before hedges.
  kind: sql
  args:
    period_start:
      type: date
      default: -364d
      desc: Purchase orders due on or after
    period_end:
      type: date
      default: $as_of
      desc: Purchase orders due on or before
    sterling_fall_pct:
      type: float
      default: 10
      desc: Percentage fall in sterling against the currency
    gbp_usd_rate:
      type: float
      default: 1.27
      desc: Current USD per 1 GBP
    gbp_eur_rate:
      type: float
      default: 1.17
      desc: Current EUR per 1 GBP
  sql: |
    WITH po AS (
      SELECT p.currency, p.total_value, p.total_value / CASE p.currency WHEN 'USD' THEN $gbp_usd_rate WHEN 'EUR' THEN $gbp_eur_rate ELSE 1 END AS gbp_value
      FROM master.purchase_orders p
      WHERE p.due_date >= CAST(date_trunc('week', CAST($period_start AS DATE)) AS DATE)
        AND p.due_date <= CAST(date_trunc('week', CAST($period_end AS DATE)) AS DATE) + 6
        AND p.status NOT IN ('cancelled', 'draft')),
    c AS (SELECT currency, count(*) AS po_count, sum(total_value) AS local_value, sum(gbp_value) AS gbp_value FROM po GROUP BY currency)
    SELECT c.currency, c.po_count, round(c.local_value, 0) AS purchases_in_currency, round(c.gbp_value, 0) AS cogs_gbp,
           round(100 * c.gbp_value / sum(c.gbp_value) OVER (), 1) AS share_of_cogs_pct,
           CASE WHEN c.currency = 'USD' THEN round(c.gbp_value * (1 / (1 - $sterling_fall_pct / 100.0) - 1), 0) END AS extra_cost_gbp_if_sterling_falls,
           CASE WHEN c.currency = 'USD' THEN 'extra cost = USD cogs in GBP x (1 / (1 - fall%) - 1), before hedges' END AS formula
    FROM c ORDER BY c.gbp_value DESC
  limit: 5
  example: {}
- name: list_in_transit_documents
  desc: Goods movements posted in one system (ERP or WMS) and still pending in the other, with value and age. Use to separate timing from real differences.
  kind: sql
  args:
    site_id:
      desc: Either end of the movement, e.g. DC1 (default all)
    from_site_id:
      desc: Sending site (default all)
    to_site_id:
      desc: Receiving site (default all)
    pending_in:
      type: enum
      values:
      - ERP
      - WMS
      desc: System where the movement is still pending (default both)
    period_start:
      type: date
      default: -30d
      desc: Posted on or after
    period_end:
      type: date
      default: $as_of
      desc: Posted on or before
  sql: |
    SELECT m.doc_id, m.doc_type, m.reference, m.from_site_id, m.to_site_id, m.sku, p.name AS product_name, m.quantity,
           round(m.value_gbp, 2) AS value_gbp, m.posted_date, m.posted_in, m.pending_in,
           CAST(CAST($as_of AS DATE) - m.posted_date AS INTEGER) AS age_days, m.note,
           round(sum(m.value_gbp) OVER (), 2) AS total_value_in_selection_gbp
    FROM goods_movements m
    LEFT JOIN master.products p ON p.sku = m.sku
    WHERE ($site_id IS NULL OR m.from_site_id = $site_id OR m.to_site_id = $site_id)
      AND ($from_site_id IS NULL OR m.from_site_id = $from_site_id)
      AND ($to_site_id IS NULL OR m.to_site_id = $to_site_id)
      AND ($pending_in IS NULL OR m.pending_in = $pending_in)
      AND m.posted_date >= CAST($period_start AS DATE) AND m.posted_date <= CAST($period_end AS DATE)
    ORDER BY m.value_gbp DESC
  limit: 50
  example: {}
- name: list_intercompany_transactions
  desc: Intercompany postings by currency and posting date, with what the counterparty booked, the difference and its likely cause (missing invoice, timing, FX). Largest differences first.
  kind: sql
  args:
    from_entity_id:
      desc: Sending entity, e.g. LE-UK (default all)
    to_entity_id:
      desc: Receiving entity, e.g. LE-PL (default all)
    status:
      type: enum
      values:
      - unmatched
      - matched
      - disputed
      desc: Reconciliation status (default all)
    currency:
      type: str
      desc: Transaction currency, e.g. PLN (default all)
    posting_date_from:
      type: date
      default: -90d
      desc: Postings on or after
  sql: |
    WITH t AS (
      SELECT i.*,
             CASE WHEN i.counterparty_posting_date IS NOT NULL AND i.counterparty_posting_date <= CAST($as_of AS DATE)
                  THEN i.counterparty_amount_gbp ELSE 0 END AS cp_booked,
             CASE WHEN i.counterparty_amount_gbp IS NULL THEN 'missing invoice'
                  WHEN i.counterparty_posting_date > CAST($as_of AS DATE) THEN 'timing'
                  WHEN abs(i.amount_gbp - i.counterparty_amount_gbp) > 0.005 THEN 'fx'
                  ELSE '' END AS likely_cause
      FROM intercompany_transactions i
      WHERE ($from_entity_id IS NULL OR i.from_entity_id = $from_entity_id)
        AND ($to_entity_id IS NULL OR i.to_entity_id = $to_entity_id)
        AND ($status IS NULL OR i.status = $status)
        AND ($currency IS NULL OR upper(i.currency) = upper($currency))
        AND i.posting_date >= CAST($posting_date_from AS DATE))
    SELECT t.ic_txn_id, t.from_entity_id, t.to_entity_id, t.posting_date, t.currency, t.amount_local, t.fx_rate, t.amount_gbp,
           t.counterparty_amount_gbp, t.counterparty_posting_date, t.counterparty_fx_rate,
           round(t.amount_gbp - t.cp_booked, 2) AS difference_gbp, t.likely_cause, t.status, t.description, t.reference,
           round(sum(t.amount_gbp - t.cp_booked) OVER (), 2) AS total_difference_gbp
    FROM t
    ORDER BY abs(t.amount_gbp - t.cp_booked) DESC, t.posting_date DESC, t.ic_txn_id
  limit: 60
  example:
    from_entity_id: LE-UK
    to_entity_id: LE-PL
- name: list_one_off_journals
  desc: Non-recurring manual and reclassification journals in a period with amount and profit impact, largest first. Set je_type or status (e.g. draft) to see other journals.
  kind: sql
  args:
    je_type:
      type: enum
      values:
      - manual
      - accrual
      - inventory
      - intercompany
      - fx
      - reclassification
      desc: One journal type (default non-recurring manual and reclassification)
    status:
      type: enum
      values:
      - draft
      - submitted
      - approved
      - posted
      - reversed
      desc: One status (default submitted, approved and posted)
    entity_id:
      desc: Legal entity (default all)
    min_amount_gbp:
      type: float
      desc: Only journals of at least this amount
    period_from:
      type: date
      default: -30d
      desc: Posting date on or after
    period_to:
      type: date
      default: $as_of
      desc: Posting date on or before
  sql: |
    SELECT j.je_id, j.entity_id, le.name AS entity_name, j.posting_date, j.description, j.je_type, j.status, j.created_by,
           round(j.total_debit_gbp, 2) AS amount_gbp, round(j.pl_impact_gbp, 2) AS pl_impact_gbp,
           j.debit_account, j.credit_account, j.reference,
           round(sum(j.pl_impact_gbp) OVER (), 2) AS total_pl_impact_gbp
    FROM journal_entries j
    LEFT JOIN master.legal_entities le ON le.entity_id = j.entity_id
    WHERE j.posting_date >= CAST($period_from AS DATE) AND j.posting_date <= CAST($period_to AS DATE)
      AND ($entity_id IS NULL OR j.entity_id = $entity_id)
      AND ($min_amount_gbp IS NULL OR j.total_debit_gbp >= $min_amount_gbp)
      AND (CASE WHEN $je_type IS NOT NULL THEN j.je_type = $je_type
                ELSE j.je_type IN ('manual', 'reclassification') AND NOT j.recurring END)
      AND (CASE WHEN $status IS NOT NULL THEN j.status = $status ELSE j.status IN ('submitted', 'approved', 'posted') END)
    ORDER BY abs(j.pl_impact_gbp) DESC, j.total_debit_gbp DESC, j.je_id
  limit: 50
  example:
    min_amount_gbp: 50000
- name: list_open_accruals
  desc: Open accruals with age in days, amount, owner and whether the reversal is overdue, oldest first. Use min_age_days to find stale items.
  kind: sql
  args:
    entity_id:
      desc: Legal entity (default all)
    period:
      type: str
      desc: Period accrued for, e.g. FY27-08 (default all)
    owner_id:
      desc: Employee id of the preparer, e.g. EMP-00086 (default all)
    min_age_days:
      type: int
      desc: Only accruals open at least this many days
    item_type:
      type: enum
      values:
      - accrual
      - prepayment
      - phasing
      default: accrual
      desc: Item type
  sql: |
    SELECT a.accrual_id, a.entity_id, a.item_type, a.period, a.description, a.amount_gbp, a.accrual_date, a.reversal_date,
           CAST(CAST($as_of AS DATE) - a.accrual_date AS INTEGER) AS age_days,
           (a.reversal_date < CAST($as_of AS DATE)) AS reversal_overdue, a.status, a.owner_id, e.name AS owner_name,
           round(sum(a.amount_gbp) OVER (), 2) AS total_in_selection_gbp
    FROM accruals a
    LEFT JOIN master.employees e ON e.employee_id = a.owner_id
    WHERE a.status = 'open' AND a.item_type = $item_type
      AND ($entity_id IS NULL OR a.entity_id = $entity_id)
      AND ($period IS NULL OR a.period = $period)
      AND ($owner_id IS NULL OR a.owner_id = $owner_id)
      AND ($min_age_days IS NULL OR CAST($as_of AS DATE) - a.accrual_date >= $min_age_days)
    ORDER BY a.accrual_date, a.accrual_id
  limit: 50
  example: {}
- name: list_timing_items
  desc: Open accruals, prepayments and budget-phasing items that reverse in later periods, by reversal date, with amount and owner. Use to separate timing from permanent variances.
  kind: sql
  args:
    entity_id:
      desc: Legal entity (default all)
    item_type:
      type: enum
      values:
      - accrual
      - prepayment
      - phasing
      desc: Item type (default all)
    min_amount_gbp:
      type: float
      desc: Only items of at least this amount
    reversal_date_from:
      type: date
      default: $as_of
      desc: Reversing on or after
  sql: |
    SELECT a.accrual_id, a.entity_id, a.item_type, a.period, a.description, a.amount_gbp, a.accrual_date, a.reversal_date,
           a.status, a.owner_id, round(sum(a.amount_gbp) OVER (), 2) AS total_timing_gbp
    FROM accruals a
    WHERE a.status = 'open' AND a.reversal_date >= CAST($reversal_date_from AS DATE)
      AND ($entity_id IS NULL OR a.entity_id = $entity_id)
      AND ($item_type IS NULL OR a.item_type = $item_type)
      AND ($min_amount_gbp IS NULL OR a.amount_gbp >= $min_amount_gbp)
    ORDER BY a.reversal_date, a.amount_gbp DESC
  limit: 50
  example:
    min_amount_gbp: 50000
- name: list_unreconciled_accounts
  desc: Balance sheet reconciliations not signed off (open or disputed) with age in days, balance and preparer, oldest first. Use min_age_days for stale ones.
  kind: sql
  args:
    status:
      type: enum
      values:
      - open
      - disputed
      desc: Open or disputed only (default both)
    entity_id:
      desc: Legal entity (default all)
    assigned_to:
      desc: Employee id of the preparer, e.g. EMP-00086 (default all)
    min_age_days:
      type: int
      desc: Only reconciliations open at least this many days
  sql: |
    SELECT r.recon_id, r.account_code, r.account_desc, r.period, r.entity_id, r.status, r.assigned_to, e.name AS preparer_name,
           r.reviewer, r.opened_date, CAST(CAST($as_of AS DATE) - r.opened_date AS INTEGER) AS age_days, r.balance_gbp, r.notes
    FROM reconciliations r
    LEFT JOIN master.employees e ON e.employee_id = r.assigned_to
    WHERE r.status IN ('open', 'disputed') AND ($status IS NULL OR r.status = $status)
      AND ($entity_id IS NULL OR r.entity_id = $entity_id)
      AND ($assigned_to IS NULL OR r.assigned_to = $assigned_to)
      AND ($min_age_days IS NULL OR CAST($as_of AS DATE) - r.opened_date >= $min_age_days)
    ORDER BY r.opened_date, r.recon_id
  limit: 50
  example: {}
- name: reassign_reconciliation
  desc: Changes the preparer (assigned_to) and/or reviewer of one balance sheet reconciliation. Returns the old and new values.
  kind: update
  table: reconciliations
  set: {}
  args:
    assigned_to:
      desc: New preparer, employee id e.g. EMP-00088
    reviewer:
      desc: New reviewer, employee id e.g. EMP-00087
  example:
    recon_id: R-900001
    assigned_to: EMP-00088
- name: submit_journal_for_approval
  desc: Sends a draft journal into the approval workflow for posting. Returns the journal with updated status.
  kind: update
  table: journal_entries
  set:
    status: submitted
  args:
    submitted_by:
      required: true
      desc: Employee submitting
  example:
    je_id: JE-000001
    submitted_by: EMP-00100
