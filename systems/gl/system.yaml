id: gl
name: ERP (General Ledger)
instructions: >
  General ledger, intercompany transactions, inventory valuation, cost tracking and financial
  reconciliations for Harbour & Vale Retail Group. Journal entry ids look like JE-000123.
  Use for ledger postings, financial statement preparation, inventory reconciliation, and
  intercompany clearing.

tables:
  journal_entries:
    key: je_id
    cols:
      je_id: {type: str, desc: "Journal entry id, e.g. JE-000001"}
      entity_id: {type: str, desc: "Legal entity"}
      posting_date: {type: date, desc: "Date the entry was or will be posted"}
      description: {type: str, desc: "Journal description, e.g. Accrual for Q3 rent"}
      status: {type: enum, values: [draft, submitted, approved, posted, reversed], desc: "Status"}
      je_type: {type: enum, values: [manual, accrual, inventory, intercompany, fx, reclassification], desc: "Type"}
      created_by: {type: str, desc: "Employee who created it"}
      submitted_by: {type: str, desc: "Employee who submitted for approval"}
      approved_by: {type: str, desc: "Employee who approved it"}
      auto_reversal_date: {type: date, desc: "If accrual, the date it reverses"}
      created_at: {type: timestamp, desc: "Created timestamp"}
      updated_at: {type: timestamp, desc: "Last update timestamp"}
      total_debit_gbp: {type: float, desc: "Total debits in GBP"}
      total_credit_gbp: {type: float, desc: "Total credits in GBP"}

  journal_lines:
    key: [je_id, line_no]
    cols:
      je_id: {type: str, desc: "Journal entry id"}
      line_no: {type: int, desc: "Line sequence number"}
      account_code: {type: str, desc: "GL account code"}
      account_desc: {type: str, desc: "Account description"}
      cost_centre_id: {type: str, desc: "Cost centre if applicable"}
      debit_gbp: {type: float, desc: "Debit amount in GBP"}
      credit_gbp: {type: float, desc: "Credit amount in GBP"}
      currency: {type: str, desc: "Transaction currency"}
      amount_local: {type: float, desc: "Amount in transaction currency"}
      reference: {type: str, desc: "Reference (e.g. PO-xxx, SHP-xxx)"}

  accruals:
    key: accrual_id
    cols:
      accrual_id: {type: str, desc: "Accrual identifier"}
      je_id: {type: str, desc: "Posted journal entry"}
      reversal_je_id: {type: str, desc: "Auto-reversal journal entry"}
      period: {type: str, desc: "Period accrued for, e.g. FY27-09"}
      description: {type: str, desc: "What is being accrued"}
      amount_gbp: {type: float, desc: "Accrual amount in GBP"}
      accrual_date: {type: date, desc: "Date accrual posted"}
      reversal_date: {type: date, desc: "Date auto-reversal will post"}
      status: {type: enum, values: [open, reversed, released], desc: "Status"}

  intercompany_transactions:
    key: ic_txn_id
    cols:
      ic_txn_id: {type: str, desc: "Intercompany transaction id"}
      from_entity_id: {type: str, desc: "Sending legal entity"}
      to_entity_id: {type: str, desc: "Receiving legal entity"}
      je_id: {type: str, desc: "Posted journal entry"}
      posting_date: {type: date, desc: "Posting date"}
      amount_gbp: {type: float, desc: "Amount in GBP"}
      currency: {type: str, desc: "Transaction currency"}
      amount_local: {type: float, desc: "Amount in local currency"}
      fx_rate: {type: float, desc: "Exchange rate used"}
      description: {type: str, desc: "Transaction description"}
      reference: {type: str, desc: "Original transaction reference"}
      matched_to: {type: str, desc: "Matching transaction id, if matched"}
      status: {type: enum, values: [unmatched, matched, disputed], desc: "Reconciliation status"}

  inventory_by_site:
    key: [sku, site_id]
    cols:
      sku: {type: str, desc: "SKU"}
      site_id: {type: str, desc: "DC or store"}
      as_of_date: {type: date, desc: "Date of valuation"}
      units_on_hand: {type: int, desc: "Physical units"}
      unit_cost_gbp: {type: float, desc: "Standard unit cost in GBP"}
      total_value_gbp: {type: float, desc: "Total valuation in GBP"}
      provision_pct: {type: float, desc: "Provision percentage for slow-moving"}
      provision_gbp: {type: float, desc: "Provision amount in GBP"}
      net_value_gbp: {type: float, desc: "Value less provision"}
      status: {type: enum, values: [active, slow_moving, obsolete, written_off], desc: "Inventory status"}

  cost_centre_actuals:
    key: [cost_centre_id, account_code, period]
    cols:
      cost_centre_id: {type: str, desc: "Cost centre"}
      account_code: {type: str, desc: "GL account"}
      period: {type: str, desc: "Financial period, e.g. FY27-09"}
      amount_gbp: {type: float, desc: "Actual cost in GBP"}
      budget_gbp: {type: float, desc: "Budgeted amount in GBP"}
      variance_gbp: {type: float, desc: "Actual minus budget"}

  fx_gains_losses:
    key: fx_txn_id
    cols:
      fx_txn_id: {type: str, desc: "FX transaction id"}
      je_id: {type: str, desc: "Journal entry"}
      posting_date: {type: date, desc: "Posting date"}
      currency: {type: str, desc: "Foreign currency"}
      gbp_amount: {type: float, desc: "GBP amount"}
      local_amount: {type: float, desc: "Amount in foreign currency"}
      opening_rate: {type: float, desc: "Opening exchange rate"}
      closing_rate: {type: float, desc: "Closing exchange rate"}
      gain_loss_gbp: {type: float, desc: "Realised or unrealised gain/loss in GBP"}
      fx_type: {type: enum, values: [realised, unrealised], desc: "Realised or unrealised"}
      account_code: {type: str, desc: "GL account for FX gain/loss"}

  freight_costs:
    key: freight_id
    cols:
      freight_id: {type: str, desc: "Freight cost entry"}
      je_id: {type: str, desc: "Journal entry"}
      posting_date: {type: date, desc: "Posting date"}
      account_code: {type: str, desc: "GL freight account"}
      shipment_id: {type: str, desc: "Shipment reference, if any"}
      supplier_id: {type: str, desc: "Freight supplier"}
      cost_gbp: {type: float, desc: "Freight cost in GBP"}
      description: {type: str, desc: "Freight description"}

  handling_costs:
    key: handling_id
    cols:
      handling_id: {type: str, desc: "Handling cost entry"}
      je_id: {type: str, desc: "Journal entry"}
      posting_date: {type: date, desc: "Posting date"}
      channel: {type: enum, values: [web, app, click_collect, marketplace, store, warehouse], desc: "Channel or location"}
      cost_gbp: {type: float, desc: "Handling cost in GBP"}
      units_handled: {type: int, desc: "Units handled"}
      cost_per_unit_gbp: {type: float, desc: "Cost per unit in GBP"}
      description: {type: str, desc: "Cost description"}

  order_charges:
    key: order_id
    cols:
      order_id: {type: str, desc: "Customer order"}
      entity_id: {type: str, desc: "Legal entity"}
      posting_date: {type: date, desc: "Date for GL posting"}
      revenue_gbp: {type: float, desc: "Net revenue in GBP"}
      freight_charge_gbp: {type: float, desc: "Freight charge in GBP"}
      handling_charge_gbp: {type: float, desc: "Handling/packing charge in GBP"}
      discount_gbp: {type: float, desc: "Discount given in GBP"}
      total_charges_gbp: {type: float, desc: "Total order charges in GBP"}
      je_id: {type: str, desc: "Posted journal entry"}

  erp_stock:
    key: [sku, site_id]
    cols:
      sku: {type: str, desc: "SKU"}
      site_id: {type: str, desc: "DC or plant"}
      location_id: {type: str, desc: "Specific bin location if applicable"}
      as_of_date: {type: date, desc: "Date of snapshot"}
      quantity: {type: int, desc: "Quantity on hand"}
      unit_cost_gbp: {type: float, desc: "Standard cost per unit in GBP"}
      total_value_gbp: {type: float, desc: "Total valuation in GBP"}

  reconciliations:
    key: recon_id
    cols:
      recon_id: {type: str, desc: "Reconciliation id"}
      account_code: {type: str, desc: "GL account being reconciled"}
      period: {type: str, desc: "Period, e.g. FY27-09"}
      entity_id: {type: str, desc: "Legal entity"}
      status: {type: enum, values: [open, signed_off, disputed], desc: "Status"}
      assigned_to: {type: str, desc: "Employee assigned"}
      reviewer: {type: str, desc: "Employee reviewing"}
      opened_date: {type: date, desc: "Date opened"}
      signed_off_date: {type: date, desc: "Date signed off"}
      notes: {type: text, desc: "Reconciliation notes"}

tools:
  - name: create_journal_entry
    desc: Creates a draft journal entry in the ledger, unposted. Returns the new journal entry with its id.
    kind: insert
    table: journal_entries
    id_prefix: JE-
    defaults: {status: draft, je_type: manual}
    args:
      entity_id: {required: true, desc: "Legal entity"}
      posting_date: {required: true, type: date, desc: "Date to post"}
      description: {required: true, desc: "Journal description"}
      je_type: {type: enum, values: [manual, accrual, inventory, intercompany, fx, reclassification], desc: "Type of journal"}
    example: {entity_id: LE-UK, posting_date: "2026-10-01", description: "Month-end accrual for utilities", je_type: accrual}

  - name: delete_draft_journal
    desc: Deletes an unposted draft journal entry. Returns confirmation of deletion.
    kind: delete
    table: journal_entries
    args:
      status: {type: enum, values: [draft], default: draft, desc: "Only draft journals can be deleted"}
    example: {je_id: JE-900001}

  - name: create_accrual_journal
    desc: Creates an accrual journal with auto-reversal for a period. Returns the accrual with its posting and reversal journals.
    kind: insert
    table: accruals
    id_prefix: ACC-
    args:
      je_id: {required: true, desc: "Posted journal entry id"}
      period: {required: true, desc: "Period accrued for, e.g. FY27-09"}
      description: {required: true, desc: "What is being accrued"}
      amount_gbp: {required: true, type: float, desc: "Accrual amount in GBP"}
      reversal_date: {required: true, type: date, desc: "Date the accrual reverses"}
    example: {je_id: JE-900001, period: "FY27-09", description: "Accrual for September rent", amount_gbp: 45000.00, reversal_date: "2026-10-01"}

  - name: create_inventory_adjustment_journal
    desc: Posts a journal adjusting inventory valuation for an agreed reconciling difference. Returns the new journal.
    kind: insert
    table: journal_entries
    id_prefix: JE-
    defaults: {status: draft, je_type: inventory}
    args:
      entity_id: {required: true, desc: "Legal entity"}
      posting_date: {required: true, type: date, desc: "Date to post"}
      description: {required: true, desc: "Inventory adjustment description"}
      sku: {desc: "SKU being adjusted, if applicable"}
      site_id: {desc: "Site or DC"}
      amount_gbp: {required: true, type: float, desc: "Adjustment amount in GBP"}
    example: {entity_id: LE-UK, posting_date: "2026-10-01", description: "Inventory shrink adjustment DC1", sku: "SKU-100234", site_id: "DC1", amount_gbp: -5000.00}

  - name: submit_journal_for_approval
    desc: Sends a draft journal into the approval workflow for posting. Returns the updated journal with submitted status.
    kind: update
    table: journal_entries
    set: {status: submitted, submitted_by: "{submitted_by}"}
    args:
      submitted_by: {required: true, desc: "Employee submitting for approval"}
    example: {je_id: JE-900001, submitted_by: EMP-00123}

  - name: get_cost_centre_actuals
    desc: Actual costs by cost centre and account for a period. Returns actuals vs budget with variance.
    kind: sql
    args:
      cost_centre_id: {desc: "Cost centre (default all)"}
      period: {required: true, type: str, desc: "Financial period, e.g. FY27-09"}
      account_code: {desc: "GL account (default all)"}
    sql: |
      SELECT c.cost_centre_id, cc.name, c.account_code, c.period,
             round(c.amount_gbp, 2) AS actual_gbp,
             round(c.budget_gbp, 2) AS budget_gbp,
             round(c.variance_gbp, 2) AS variance_gbp
      FROM cost_centre_actuals c
      LEFT JOIN master.cost_centres cc USING (cost_centre_id)
      WHERE c.period = $period
        AND ($cost_centre_id IS NULL OR c.cost_centre_id = $cost_centre_id)
        AND ($account_code IS NULL OR c.account_code = $account_code)
      ORDER BY c.cost_centre_id, c.account_code
    limit: 100
    example: {period: "FY27-09"}

  - name: get_inventory_valuation_by_site
    desc: Inventory valuation and provisions by site. Returns gross value, provisions and net value.
    kind: sql
    args:
      site_id: {desc: "Site or DC (default all)"}
      as_of_date: {type: date, default: "$as_of", desc: "Valuation date"}
      status: {type: enum, values: [active, slow_moving, obsolete, written_off], desc: "Filter by status"}
    sql: |
      SELECT i.site_id, s.name AS site_name,
             sum(i.units_on_hand) AS total_units,
             round(sum(i.total_value_gbp), 2) AS gross_value_gbp,
             round(sum(i.provision_gbp), 2) AS provision_gbp,
             round(sum(i.net_value_gbp), 2) AS net_value_gbp,
             count(DISTINCT i.sku) AS sku_count
      FROM inventory_by_site i
      LEFT JOIN master.sites s ON s.site_id = i.site_id
      WHERE i.as_of_date = CAST($as_of_date AS DATE)
        AND ($site_id IS NULL OR i.site_id = $site_id)
        AND ($status IS NULL OR i.status = $status)
      GROUP BY i.site_id, s.name
      ORDER BY i.site_id
    limit: 10
    example: {site_id: DC1}

  - name: compare_wms_to_ledger
    desc: Reconcile WMS stock value to the ledger. Returns valuation by SKU with differences highlighted.
    kind: sql
    args:
      site_id: {desc: "Site or DC (default all)"}
      as_of_date: {type: date, default: "$as_of", desc: "Date for comparison"}
      min_variance_gbp: {type: float, default: 100.00, desc: "Only show differences >= this"}
    sql: |
      SELECT e.sku,
             p.name AS sku_name,
             e.site_id,
             e.quantity AS erp_units,
             e.total_value_gbp AS erp_value_gbp,
             round(e.total_value_gbp, 2) AS ledger_value_gbp,
             round(e.total_value_gbp - e.total_value_gbp, 2) AS difference_gbp
      FROM erp_stock e
      LEFT JOIN master.products p ON p.sku = e.sku
      WHERE e.as_of_date = CAST($as_of_date AS DATE)
        AND ($site_id IS NULL OR e.site_id = $site_id)
      ORDER BY abs(e.total_value_gbp - e.total_value_gbp) DESC
    limit: 50
    example: {site_id: DC1}

  - name: get_erp_stock_by_sku
    desc: ERP stock balances by SKU and plant or storage location. Returns quantity, cost and total value.
    kind: sql
    args:
      sku: {desc: "SKU (default all)"}
      site_id: {desc: "Site or DC (default all)"}
      as_of_date: {type: date, default: "$as_of", desc: "Date for snapshot"}
    sql: |
      SELECT e.sku, p.name, e.site_id, s.name AS site_name, e.location_id,
             e.quantity, round(e.unit_cost_gbp, 2) AS unit_cost_gbp,
             round(e.total_value_gbp, 2) AS total_value_gbp
      FROM erp_stock e
      LEFT JOIN master.products p ON p.sku = e.sku
      LEFT JOIN master.sites s ON s.site_id = e.site_id
      WHERE e.as_of_date = CAST($as_of_date AS DATE)
        AND ($sku IS NULL OR e.sku = $sku)
        AND ($site_id IS NULL OR e.site_id = $site_id)
      ORDER BY e.sku, e.site_id
    limit: 100
    example: {sku: "SKU-100234"}

  - name: get_intercompany_balances
    desc: Intercompany balances between two entities. Separates unmatched transactions and disputed items.
    kind: sql
    args:
      from_entity_id: {required: true, desc: "Sending entity"}
      to_entity_id: {required: true, desc: "Receiving entity"}
      as_of_date: {type: date, default: "$as_of", desc: "As of date"}
    sql: |
      SELECT i.from_entity_id, i.to_entity_id,
             count(*) AS transaction_count,
             round(sum(CASE WHEN i.status = 'matched' THEN 0 ELSE i.amount_gbp END), 2) AS unmatched_gbp,
             round(sum(CASE WHEN i.status = 'disputed' THEN i.amount_gbp ELSE 0 END), 2) AS disputed_gbp,
             round(sum(i.amount_gbp), 2) AS total_gbp
      FROM intercompany_transactions i
      WHERE i.from_entity_id = $from_entity_id
        AND i.to_entity_id = $to_entity_id
        AND i.posting_date <= CAST($as_of_date AS DATE)
      GROUP BY i.from_entity_id, i.to_entity_id
    limit: 1
    example: {from_entity_id: "LE-UK", to_entity_id: "LE-EU"}

  - name: list_intercompany_transactions
    desc: Intercompany postings by currency and posting date. Shows matched status and reference details.
    kind: sql
    args:
      from_entity_id: {desc: "Sending entity (default all)"}
      to_entity_id: {desc: "Receiving entity (default all)"}
      date_from: {type: date, default: "-90d", desc: "Transactions on or after"}
      status: {type: enum, values: [unmatched, matched, disputed], desc: "Filter by status"}
    sql: |
      SELECT i.ic_txn_id, i.from_entity_id, i.to_entity_id, i.posting_date,
             i.amount_gbp, i.currency, i.amount_local, i.fx_rate,
             i.description, i.reference, i.status
      FROM intercompany_transactions i
      WHERE i.posting_date >= CAST($date_from AS DATE)
        AND ($from_entity_id IS NULL OR i.from_entity_id = $from_entity_id)
        AND ($to_entity_id IS NULL OR i.to_entity_id = $to_entity_id)
        AND ($status IS NULL OR i.status = $status)
      ORDER BY i.posting_date DESC
    limit: 100
    example: {from_entity_id: "LE-UK"}

  - name: draft_clearing_journals
    desc: Draft journals to clear intercompany differences between entities. Returns suggested clearing entries.
    kind: sql
    args:
      from_entity_id: {required: true, desc: "Sending entity"}
      to_entity_id: {required: true, desc: "Receiving entity"}
      posting_date: {type: date, default: "$as_of", desc: "Clearing posting date"}
    sql: |
      SELECT i.from_entity_id, i.to_entity_id,
             round(sum(CASE WHEN i.status = 'unmatched' THEN i.amount_gbp ELSE 0 END), 2) AS amount_to_clear_gbp,
             count(DISTINCT i.ic_txn_id) AS transaction_count,
             'Clearing journal for intercompany reconciliation' AS description
      FROM intercompany_transactions i
      WHERE i.from_entity_id = $from_entity_id
        AND i.to_entity_id = $to_entity_id
        AND i.status IN ('unmatched', 'disputed')
      GROUP BY i.from_entity_id, i.to_entity_id
    limit: 1
    example: {from_entity_id: "LE-UK", to_entity_id: "LE-EU"}

  - name: get_freight_cost_by_ledger_account
    desc: Freight cost postings by account and period. Returns costs by supplier and shipping mode.
    kind: sql
    args:
      account_code: {desc: "GL freight account (default all)"}
      period_start: {type: date, default: "-30d", desc: "Costs on or after"}
      period_end: {type: date, default: "$as_of", desc: "Costs on or before"}
    sql: |
      SELECT f.account_code, f.posting_date,
             f.supplier_id, sup.name AS supplier_name,
             round(sum(f.cost_gbp), 2) AS total_cost_gbp,
             count(DISTINCT f.freight_id) AS transaction_count
      FROM freight_costs f
      LEFT JOIN master.suppliers sup ON sup.supplier_id = f.supplier_id
      WHERE f.posting_date >= CAST($period_start AS DATE)
        AND f.posting_date <= CAST($period_end AS DATE)
        AND ($account_code IS NULL OR f.account_code = $account_code)
      GROUP BY f.account_code, f.posting_date, f.supplier_id, sup.name
      ORDER BY f.posting_date DESC
    limit: 50
    example: {}

  - name: get_fx_gain_loss_by_account
    desc: FX gain and loss postings by account. Separates realised from unrealised movements by currency.
    kind: sql
    args:
      account_code: {desc: "GL FX account (default all)"}
      period_start: {type: date, default: "-90d", desc: "Postings on or after"}
      period_end: {type: date, default: "$as_of", desc: "Postings on or before"}
    sql: |
      SELECT f.account_code, f.currency, f.fx_type,
             round(sum(f.gain_loss_gbp), 2) AS gain_loss_gbp,
             count(*) AS transaction_count,
             round(avg(f.opening_rate), 4) AS avg_opening_rate,
             round(avg(f.closing_rate), 4) AS avg_closing_rate
      FROM fx_gains_losses f
      WHERE f.posting_date >= CAST($period_start AS DATE)
        AND f.posting_date <= CAST($period_end AS DATE)
        AND ($account_code IS NULL OR f.account_code = $account_code)
      GROUP BY f.account_code, f.currency, f.fx_type
      ORDER BY f.account_code, f.currency
    limit: 50
    example: {}

  - name: get_handling_cost_by_channel
    desc: Handling cost by recovery channel. Shows cost per unit and total by channel (web, store, warehouse).
    kind: sql
    args:
      channel: {type: enum, values: [web, app, click_collect, marketplace, store, warehouse], desc: "Channel (default all)"}
      period_start: {type: date, default: "-30d", desc: "Costs on or after"}
      period_end: {type: date, default: "$as_of", desc: "Costs on or before"}
    sql: |
      SELECT h.channel,
             round(sum(h.cost_gbp), 2) AS total_cost_gbp,
             sum(h.units_handled) AS total_units,
             round(sum(h.cost_gbp) / NULLIF(sum(h.units_handled), 0), 4) AS cost_per_unit_gbp,
             count(*) AS posting_count
      FROM handling_costs h
      WHERE h.posting_date >= CAST($period_start AS DATE)
        AND h.posting_date <= CAST($period_end AS DATE)
        AND ($channel IS NULL OR h.channel = $channel)
      GROUP BY h.channel
      ORDER BY h.channel
    limit: 10
    example: {}

  - name: get_erp_order_header_and_charges
    desc: Order headers, revenue and charges from the ERP. Shows order level financials by entity and channel.
    kind: sql
    args:
      entity_id: {desc: "Legal entity (default all)"}
      period_start: {type: date, default: "-30d", desc: "Orders on or after"}
      period_end: {type: date, default: "$as_of", desc: "Orders on or before"}
    sql: |
      SELECT o.order_id, o.posting_date, o.entity_id, le.name AS entity_name,
             round(o.revenue_gbp, 2) AS revenue_gbp,
             round(o.freight_charge_gbp, 2) AS freight_charge_gbp,
             round(o.handling_charge_gbp, 2) AS handling_charge_gbp,
             round(o.discount_gbp, 2) AS discount_gbp,
             round(o.total_charges_gbp, 2) AS total_charges_gbp
      FROM order_charges o
      LEFT JOIN master.legal_entities le ON le.entity_id = o.entity_id
      WHERE o.posting_date >= CAST($period_start AS DATE)
        AND o.posting_date <= CAST($period_end AS DATE)
        AND ($entity_id IS NULL OR o.entity_id = $entity_id)
      ORDER BY o.posting_date DESC
    limit: 100
    example: {entity_id: "LE-UK"}

  - name: get_intercompany_sourcing_margins
    desc: Sourcing entity margins and mark-ups. Shows margin % by product category and transfer price variance.
    kind: sql
    args:
      from_entity_id: {desc: "Sourcing entity (default all)"}
      to_entity_id: {desc: "Receiving entity (default all)"}
    sql: |
      SELECT i.from_entity_id, i.to_entity_id,
             count(DISTINCT i.ic_txn_id) AS transaction_count,
             round(sum(i.amount_gbp), 2) AS total_transfer_price_gbp,
             round(avg(i.fx_rate), 4) AS avg_fx_rate
      FROM intercompany_transactions i
      WHERE ($from_entity_id IS NULL OR i.from_entity_id = $from_entity_id)
        AND ($to_entity_id IS NULL OR i.to_entity_id = $to_entity_id)
      GROUP BY i.from_entity_id, i.to_entity_id
      ORDER BY i.from_entity_id, i.to_entity_id
    limit: 20
    example: {}

  - name: calculate_shift_option_cost
    desc: Total cost comparison of staffing options (premiums, agency fees, allowances).
    kind: sql
    args:
      site_id: {required: true, desc: "DC site"}
      period_start: {type: date, required: true, desc: "Period start date"}
      period_end: {type: date, required: true, desc: "Period end date"}
      headcount_gap: {type: int, default: 45, desc: "FTE headcount gap to fill"}
      shift_option: {type: enum, values: [late_shift, overtime], desc: "Staffing option to cost"}
    sql: |
      SELECT $site_id AS site_id,
             $period_start AS period_start,
             $period_end AS period_end,
             $shift_option AS shift_option,
             $headcount_gap AS headcount_gap,
             CASE WHEN $shift_option = 'late_shift' THEN $headcount_gap * 35000 ELSE $headcount_gap * 22000 END AS estimated_cost_gbp,
             'cost = headcount_gap * weekly_rate * weeks' AS formula
    limit: 1
    example: {site_id: "DC1", period_start: "2026-11-03", period_end: "2026-12-28", headcount_gap: 45, shift_option: "late_shift"}

  - name: get_dc_cost_and_productivity_kpis
    desc: DC cost per unit and productivity KPIs for comparison. Shows labour, energy, rent and facility costs per unit handled.
    kind: sql
    args:
      site_id: {desc: "DC site (default all)"}
      period_start: {type: date, default: "-90d", desc: "Period start"}
      period_end: {type: date, default: "$as_of", desc: "Period end"}
    sql: |
      SELECT c.cost_centre_id AS site_id,
             round(sum(c.amount_gbp), 2) AS total_cost_gbp,
             round(sum(c.amount_gbp) / 1000, 2) AS cost_per_thousand_units_gbp,
             count(DISTINCT c.account_code) AS account_count
      FROM cost_centre_actuals c
      WHERE c.period >= DATE_FORMAT(CAST($period_start AS DATE), '%Y-%m')
        AND c.period <= DATE_FORMAT(CAST($period_end AS DATE), '%Y-%m')
      GROUP BY c.cost_centre_id
      ORDER BY c.cost_centre_id
    limit: 10
    example: {site_id: "DC1"}

  - name: get_shrink_and_writeoff_history
    desc: Shrink and write-off trend with prior-year pattern. For forecasting year-end shrink provisions.
    kind: sql
    args:
      site_id: {desc: "Site or DC (default all)"}
      days_history: {type: int, default: 365, desc: "Days of history to analyze"}
    sql: |
      SELECT i.site_id,
             sum(CASE WHEN i.status = 'written_off' THEN i.provision_gbp ELSE 0 END) AS writeoff_gbp,
             sum(CASE WHEN i.status = 'written_off' THEN i.units_on_hand ELSE 0 END) AS writeoff_units,
             round(sum(i.provision_gbp), 2) AS total_provision_gbp,
             'shrink = value_provision for written_off items' AS formula
      FROM inventory_by_site i
      WHERE ($site_id IS NULL OR i.site_id = $site_id)
      GROUP BY i.site_id
      ORDER BY i.site_id
    limit: 10
    example: {site_id: "DC1"}

  - name: list_one_off_journals
    desc: Non-recurring and manual journals in a period. Flags one-off items for management accounts commentary.
    kind: sql
    args:
      entity_id: {desc: "Legal entity (default all)"}
      period: {required: true, type: str, desc: "Financial period, e.g. FY27-09"}
      je_type: {type: enum, values: [manual, accrual, inventory, intercompany, fx, reclassification], desc: "Filter by type"}
    sql: |
      SELECT j.je_id, j.entity_id, j.posting_date, j.description, j.je_type,
             round(j.total_debit_gbp, 2) AS debit_gbp,
             round(j.total_credit_gbp, 2) AS credit_gbp,
             j.created_by, j.submitted_by, j.approved_by
      FROM journal_entries j
      WHERE date_format(j.posting_date, '%Y-%m') = $period
        AND j.status IN ('approved', 'posted')
        AND j.je_type IN ('manual', 'reclassification')
        AND ($entity_id IS NULL OR j.entity_id = $entity_id)
        AND ($je_type IS NULL OR j.je_type = $je_type)
      ORDER BY j.posting_date DESC
    limit: 50
    example: {period: "FY27-09"}

  - name: list_open_accruals
    desc: Open accrual balances with age. Shows accruals not yet reversed.
    kind: sql
    args:
      period: {desc: "Period accrued for (default all)"}
      days_open: {type: int, default: 60, desc: "Only accruals open more than this many days"}
    sql: |
      SELECT a.accrual_id, a.je_id, a.period, a.description,
             round(a.amount_gbp, 2) AS amount_gbp,
             a.accrual_date, a.reversal_date,
             DATEDIFF(CAST($as_of AS DATE), a.accrual_date) AS days_open,
             a.status
      FROM accruals a
      WHERE a.status = 'open'
        AND ($period IS NULL OR a.period = $period)
        AND DATEDIFF(CAST($as_of AS DATE), a.accrual_date) > $days_open
      ORDER BY a.accrual_date ASC
    limit: 50
    example: {period: "FY27-09"}

  - name: list_unreconciled_accounts
    desc: Balance sheet reconciliations not signed off, with age. Shows outstanding close tasks.
    kind: sql
    args:
      entity_id: {desc: "Legal entity (default all)"}
      period: {desc: "Period (default current)"}
      days_open: {type: int, default: 30, desc: "Only unreconciled more than this many days"}
    sql: |
      SELECT r.recon_id, r.account_code, r.period, r.entity_id, r.status,
             r.assigned_to, r.reviewer,
             r.opened_date,
             DATEDIFF(CAST($as_of AS DATE), r.opened_date) AS days_open,
             r.notes
      FROM reconciliations r
      WHERE r.status IN ('open', 'disputed')
        AND ($entity_id IS NULL OR r.entity_id = $entity_id)
        AND ($period IS NULL OR r.period = $period)
        AND DATEDIFF(CAST($as_of AS DATE), r.opened_date) > $days_open
      ORDER BY r.opened_date ASC
    limit: 50
    example: {period: "FY27-09"}

  - name: reassign_reconciliation
    desc: Changes the preparer or reviewer of a balance sheet reconciliation. Returns the updated reconciliation.
    kind: update
    table: reconciliations
    args:
      assigned_to: {desc: "New assigned employee"}
      reviewer: {desc: "New reviewer employee"}
    example: {recon_id: "R-000001", assigned_to: "EMP-00456"}

  - name: get_inventory_value_movement
    desc: Inventory value movement by month. Breaks down by cost updates, FX, mix and adjustments.
    kind: sql
    args:
      site_id: {desc: "Site or DC (default all)"}
      months_history: {type: int, default: 3, desc: "Months of history"}
    sql: |
      SELECT i.site_id, i.as_of_date,
             round(sum(i.total_value_gbp), 2) AS month_end_value_gbp,
             count(DISTINCT i.sku) AS sku_count,
             sum(i.units_on_hand) AS total_units
      FROM inventory_by_site i
      WHERE ($site_id IS NULL OR i.site_id = $site_id)
      GROUP BY i.site_id, i.as_of_date
      ORDER BY i.site_id, i.as_of_date DESC
    limit: 50
    example: {site_id: "DC1"}

  - name: get_ledger_inventory_balance
    desc: Inventory ledger balance by account. Shows total inventory value by GL account and location.
    kind: sql
    args:
      account_code: {desc: "GL inventory account (default all)"}
      as_of_date: {type: date, default: "$as_of", desc: "Date for snapshot"}
    sql: |
      SELECT i.site_id,
             round(sum(i.total_value_gbp), 2) AS inventory_value_gbp,
             round(sum(i.provision_gbp), 2) AS provision_gbp,
             round(sum(i.net_value_gbp), 2) AS net_value_gbp
      FROM inventory_by_site i
      WHERE i.as_of_date = CAST($as_of_date AS DATE)
      GROUP BY i.site_id
      ORDER BY i.site_id
    limit: 20
    example: {}

  - name: get_payment_history_by_supplier
    desc: Payment terms and actual payment timing by supplier. Shows days payable outstanding trend.
    kind: sql
    args:
      supplier_id: {desc: "Supplier (default all)"}
      months: {type: int, default: 12, desc: "Months of history"}
    sql: |
      SELECT $supplier_id AS supplier_id,
             45 AS standard_terms_days,
             52 AS avg_actual_days,
             'avg_actual_days = sum(actual_payment_days) / count(invoices)' AS formula
    limit: 1
    example: {supplier_id: "SUP-0042"}

  - name: get_realised_vs_unrealised_fx
    desc: Realised and unrealised FX split. Shows movements booked as realised vs unrealised by currency.
    kind: sql
    args:
      currency: {desc: "Foreign currency (default all)"}
      period_start: {type: date, default: "-90d", desc: "Period start"}
      period_end: {type: date, default: "$as_of", desc: "Period end"}
    sql: |
      SELECT f.currency,
             round(sum(CASE WHEN f.fx_type = 'realised' THEN f.gain_loss_gbp ELSE 0 END), 2) AS realised_gbp,
             round(sum(CASE WHEN f.fx_type = 'unrealised' THEN f.gain_loss_gbp ELSE 0 END), 2) AS unrealised_gbp,
             round(sum(f.gain_loss_gbp), 2) AS total_gbp
      FROM fx_gains_losses f
      WHERE f.posting_date >= CAST($period_start AS DATE)
        AND f.posting_date <= CAST($period_end AS DATE)
        AND ($currency IS NULL OR f.currency = $currency)
      GROUP BY f.currency
      ORDER BY f.currency
    limit: 20
    example: {}

  - name: get_recovered_value_by_channel
    desc: Value recovered by channel. Shows handling cost and recovered value by returns/circular economy channel.
    kind: sql
    args:
      channel: {type: enum, values: [web, app, click_collect, marketplace, store, warehouse], desc: "Channel (default all)"}
      period_start: {type: date, default: "-90d", desc: "Period start"}
      period_end: {type: date, default: "$as_of", desc: "Period end"}
    sql: |
      SELECT h.channel,
             round(sum(h.cost_gbp), 2) AS handling_cost_gbp,
             count(*) AS recovery_count,
             round(sum(h.cost_gbp) / NULLIF(count(*), 0), 2) AS cost_per_recovery_gbp
      FROM handling_costs h
      WHERE h.posting_date >= CAST($period_start AS DATE)
        AND h.posting_date <= CAST($period_end AS DATE)
        AND ($channel IS NULL OR h.channel = $channel)
      GROUP BY h.channel
      ORDER BY h.channel
    limit: 10
    example: {}

  - name: get_slow_moving_provision
    desc: Provision balance and prior-year comparison. Shows current slow-moving provision vs last year.
    kind: sql
    args:
      site_id: {desc: "Site or DC (default all)"}
      as_of_date: {type: date, default: "$as_of", desc: "Current date"}
    sql: |
      SELECT i.site_id,
             round(sum(CASE WHEN i.status = 'slow_moving' THEN i.provision_gbp ELSE 0 END), 2) AS slow_moving_provision_gbp,
             round(sum(CASE WHEN i.status = 'obsolete' THEN i.provision_gbp ELSE 0 END), 2) AS obsolete_provision_gbp,
             round(sum(i.provision_gbp), 2) AS total_provision_gbp
      FROM inventory_by_site i
      WHERE i.as_of_date = CAST($as_of_date AS DATE)
        AND ($site_id IS NULL OR i.site_id = $site_id)
      GROUP BY i.site_id
      ORDER BY i.site_id
    limit: 10
    example: {site_id: "DC1"}

  - name: get_usd_cogs_exposure
    desc: USD-denominated cost of goods exposure. Shows unhedged COGS exposure to USD movements.
    kind: sql
    args:
      period_start: {type: date, default: "-90d", desc: "Period start"}
      period_end: {type: date, default: "$as_of", desc: "Period end"}
    sql: |
      SELECT 'USD' AS currency,
             round(sum(amount_local), 2) AS exposure_usd,
             round(sum(gbp_amount), 2) AS exposure_gbp,
             round(avg(opening_rate), 4) AS avg_rate,
             count(*) AS transaction_count
      FROM fx_gains_losses
      WHERE currency = 'USD'
        AND posting_date >= CAST($period_start AS DATE)
        AND posting_date <= CAST($period_end AS DATE)
      GROUP BY currency
    limit: 1
    example: {}

  - name: list_timing_items
    desc: Accruals, prepayments and phasing items that reverse in later periods. Shows what will unwind.
    kind: sql
    args:
      period: {required: true, type: str, desc: "Period, e.g. FY27-09"}
    sql: |
      SELECT a.accrual_id, a.je_id, a.description,
             round(a.amount_gbp, 2) AS amount_gbp,
             a.reversal_date,
             DATEDIFF(a.reversal_date, CAST($as_of AS DATE)) AS days_to_reversal
      FROM accruals a
      WHERE a.status IN ('open', 'reversed')
        AND a.reversal_date > CAST($as_of AS DATE)
      ORDER BY a.reversal_date ASC
    limit: 50
    example: {period: "FY27-09"}

  - name: list_in_transit_documents
    desc: Goods movements posted in one system and pending in the other. For reconciling WMS/ERP cutoff.
    kind: sql
    args:
      site_id: {desc: "Site or DC (default all)"}
      days_in_transit: {type: int, default: 30, desc: "Items in transit more than this many days"}
    sql: |
      SELECT e.sku, e.site_id,
             sum(e.quantity) AS units_in_transit,
             round(sum(e.total_value_gbp), 2) AS value_gbp,
             max(e.as_of_date) AS last_updated
      FROM erp_stock e
      WHERE ($site_id IS NULL OR e.site_id = $site_id)
      GROUP BY e.sku, e.site_id
      ORDER BY e.site_id, e.sku
    limit: 50
    example: {site_id: "DC1"}
