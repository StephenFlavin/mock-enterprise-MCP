id: gl
name: ERP (General Ledger)
instructions: 'General ledger, intercompany transactions, inventory valuation, cost
  tracking and financial reconciliations for Harbour & Vale Retail Group. Journal
  entry ids look like JE-000123. Use for ledger postings, financial statement preparation,
  inventory reconciliation, and intercompany clearing.

  '
tables:
  journal_entries:
    key: je_id
    cols:
      je_id:
        type: str
        desc: Journal entry id, e.g. JE-000001
      entity_id:
        type: str
        desc: Legal entity
      posting_date:
        type: date
        desc: Date the entry was or will be posted
      description:
        type: str
        desc: Journal description, e.g. Accrual for Q3 rent
      status:
        type: enum
        values:
        - draft
        - submitted
        - approved
        - posted
        - reversed
        desc: Status
      je_type:
        type: enum
        values:
        - manual
        - accrual
        - inventory
        - intercompany
        - fx
        - reclassification
        desc: Type
      created_by:
        type: str
        desc: Employee who created it
      submitted_by:
        type: str
        desc: Employee who submitted for approval
      approved_by:
        type: str
        desc: Employee who approved it
      auto_reversal_date:
        type: date
        desc: If accrual, the date it reverses
      created_at:
        type: timestamp
        desc: Created timestamp
      updated_at:
        type: timestamp
        desc: Last update timestamp
      total_debit_gbp:
        type: float
        desc: Total debits in GBP
      total_credit_gbp:
        type: float
        desc: Total credits in GBP
  journal_lines:
    key:
    - je_id
    - line_no
    cols:
      je_id:
        type: str
        desc: Journal entry id
      line_no:
        type: int
        desc: Line sequence number
      account_code:
        type: str
        desc: GL account code
      account_desc:
        type: str
        desc: Account description
      cost_centre_id:
        type: str
        desc: Cost centre if applicable
      debit_gbp:
        type: float
        desc: Debit amount in GBP
      credit_gbp:
        type: float
        desc: Credit amount in GBP
      currency:
        type: str
        desc: Transaction currency
      amount_local:
        type: float
        desc: Amount in transaction currency
      reference:
        type: str
        desc: Reference (e.g. PO-xxx, SHP-xxx)
  accruals:
    key: accrual_id
    cols:
      accrual_id:
        type: str
        desc: Accrual identifier
      je_id:
        type: str
        desc: Posted journal entry
      reversal_je_id:
        type: str
        desc: Auto-reversal journal entry
      period:
        type: str
        desc: Period accrued for, e.g. FY27-09
      description:
        type: str
        desc: What is being accrued
      amount_gbp:
        type: float
        desc: Accrual amount in GBP
      accrual_date:
        type: date
        desc: Date accrual posted
      reversal_date:
        type: date
        desc: Date auto-reversal will post
      status:
        type: enum
        values:
        - open
        - reversed
        - released
        desc: Status
  intercompany_transactions:
    key: ic_txn_id
    cols:
      ic_txn_id:
        type: str
        desc: Intercompany transaction id
      from_entity_id:
        type: str
        desc: Sending legal entity
      to_entity_id:
        type: str
        desc: Receiving legal entity
      je_id:
        type: str
        desc: Posted journal entry
      posting_date:
        type: date
        desc: Posting date
      amount_gbp:
        type: float
        desc: Amount in GBP
      currency:
        type: str
        desc: Transaction currency
      amount_local:
        type: float
        desc: Amount in local currency
      fx_rate:
        type: float
        desc: Exchange rate used
      description:
        type: str
        desc: Transaction description
      reference:
        type: str
        desc: Original transaction reference
      matched_to:
        type: str
        desc: Matching transaction id, if matched
      status:
        type: enum
        values:
        - unmatched
        - matched
        - disputed
        desc: Reconciliation status
  inventory_by_site:
    key:
    - sku
    - site_id
    cols:
      sku:
        type: str
        desc: SKU
      site_id:
        type: str
        desc: DC or store
      as_of_date:
        type: date
        desc: Date of valuation
      units_on_hand:
        type: int
        desc: Physical units
      unit_cost_gbp:
        type: float
        desc: Standard unit cost in GBP
      total_value_gbp:
        type: float
        desc: Total valuation in GBP
      provision_pct:
        type: float
        desc: Provision percentage for slow-moving
      provision_gbp:
        type: float
        desc: Provision amount in GBP
      net_value_gbp:
        type: float
        desc: Value less provision
      status:
        type: enum
        values:
        - active
        - slow_moving
        - obsolete
        - written_off
        desc: Inventory status
  cost_centre_actuals:
    key:
    - cost_centre_id
    - account_code
    - period
    cols:
      cost_centre_id:
        type: str
        desc: Cost centre
      account_code:
        type: str
        desc: GL account
      period:
        type: str
        desc: Financial period, e.g. FY27-09
      amount_gbp:
        type: float
        desc: Actual cost in GBP
      budget_gbp:
        type: float
        desc: Budgeted amount in GBP
      variance_gbp:
        type: float
        desc: Actual minus budget
  fx_gains_losses:
    key: fx_txn_id
    cols:
      fx_txn_id:
        type: str
        desc: FX transaction id
      je_id:
        type: str
        desc: Journal entry
      posting_date:
        type: date
        desc: Posting date
      currency:
        type: str
        desc: Foreign currency
      gbp_amount:
        type: float
        desc: GBP amount
      local_amount:
        type: float
        desc: Amount in foreign currency
      opening_rate:
        type: float
        desc: Opening exchange rate
      closing_rate:
        type: float
        desc: Closing exchange rate
      gain_loss_gbp:
        type: float
        desc: Realised or unrealised gain/loss in GBP
      fx_type:
        type: enum
        values:
        - realised
        - unrealised
        desc: Realised or unrealised
      account_code:
        type: str
        desc: GL account for FX gain/loss
  freight_costs:
    key: freight_id
    cols:
      freight_id:
        type: str
        desc: Freight cost entry
      je_id:
        type: str
        desc: Journal entry
      posting_date:
        type: date
        desc: Posting date
      account_code:
        type: str
        desc: GL freight account
      shipment_id:
        type: str
        desc: Shipment reference, if any
      supplier_id:
        type: str
        desc: Freight supplier
      cost_gbp:
        type: float
        desc: Freight cost in GBP
      description:
        type: str
        desc: Freight description
  handling_costs:
    key: handling_id
    cols:
      handling_id:
        type: str
        desc: Handling cost entry
      je_id:
        type: str
        desc: Journal entry
      posting_date:
        type: date
        desc: Posting date
      channel:
        type: enum
        values:
        - web
        - app
        - click_collect
        - marketplace
        - store
        - warehouse
        desc: Channel or location
      cost_gbp:
        type: float
        desc: Handling cost in GBP
      units_handled:
        type: int
        desc: Units handled
      cost_per_unit_gbp:
        type: float
        desc: Cost per unit in GBP
      description:
        type: str
        desc: Cost description
  order_charges:
    key: order_id
    cols:
      order_id:
        type: str
        desc: Customer order
      entity_id:
        type: str
        desc: Legal entity
      posting_date:
        type: date
        desc: Date for GL posting
      revenue_gbp:
        type: float
        desc: Net revenue in GBP
      freight_charge_gbp:
        type: float
        desc: Freight charge in GBP
      handling_charge_gbp:
        type: float
        desc: Handling/packing charge in GBP
      discount_gbp:
        type: float
        desc: Discount given in GBP
      total_charges_gbp:
        type: float
        desc: Total order charges in GBP
      je_id:
        type: str
        desc: Posted journal entry
  erp_stock:
    key:
    - sku
    - site_id
    cols:
      sku:
        type: str
        desc: SKU
      site_id:
        type: str
        desc: DC or plant
      location_id:
        type: str
        desc: Specific bin location if applicable
      as_of_date:
        type: date
        desc: Date of snapshot
      quantity:
        type: int
        desc: Quantity on hand
      unit_cost_gbp:
        type: float
        desc: Standard cost per unit in GBP
      total_value_gbp:
        type: float
        desc: Total valuation in GBP
  reconciliations:
    key: recon_id
    cols:
      recon_id:
        type: str
        desc: Reconciliation id
      account_code:
        type: str
        desc: GL account being reconciled
      period:
        type: str
        desc: Period, e.g. FY27-09
      entity_id:
        type: str
        desc: Legal entity
      status:
        type: enum
        values:
        - open
        - signed_off
        - disputed
        desc: Status
      assigned_to:
        type: str
        desc: Employee assigned
      reviewer:
        type: str
        desc: Employee reviewing
      opened_date:
        type: date
        desc: Date opened
      signed_off_date:
        type: date
        desc: Date signed off
      notes:
        type: text
        desc: Reconciliation notes
tools:
- name: create_journal_entry
  desc: Creates a draft journal entry in the ledger, unposted. Returns the new journal
    entry with its id.
  kind: insert
  table: journal_entries
  id_prefix: JE-
  defaults:
    status: draft
    je_type: manual
  args:
    entity_id:
      required: true
      desc: Legal entity
    posting_date:
      required: true
      type: date
      desc: Date to post
    description:
      required: true
      desc: Journal description
    je_type:
      type: enum
      values:
      - manual
      - accrual
      - inventory
      - intercompany
      - fx
      - reclassification
      desc: Type of journal
  example:
    entity_id: LE-UK
    posting_date: '2026-10-01'
    description: Month-end accrual for utilities
    je_type: accrual
- name: delete_draft_journal
  desc: Deletes an unposted draft journal entry. Returns confirmation of deletion.
  kind: update
  table: journal_entries
  delete: true
  args: {}
  example:
    je_id: JE-900001
- name: create_accrual_journal
  desc: Creates an accrual journal with auto-reversal for a period. Returns the accrual
    with its posting and reversal journals.
  kind: insert
  table: accruals
  id_prefix: ACC-
  args:
    je_id:
      required: true
      desc: Posted journal entry id
    period:
      required: true
      desc: Period accrued for, e.g. FY27-09
    description:
      required: true
      desc: What is being accrued
    amount_gbp:
      required: true
      type: float
      desc: Accrual amount in GBP
    reversal_date:
      required: true
      type: date
      desc: Date the accrual reverses
  example:
    je_id: JE-900001
    period: FY27-09
    description: Accrual for September rent
    amount_gbp: 45000.0
    reversal_date: '2026-10-01'
- name: create_inventory_adjustment_journal
  desc: Posts a journal adjusting inventory valuation for an agreed reconciling difference.
    Returns the new journal.
  kind: insert
  table: journal_entries
  id_prefix: JE-
  defaults:
    status: draft
    je_type: inventory
  args:
    entity_id:
      required: true
      desc: Legal entity
    posting_date:
      required: true
      type: date
      desc: Date to post
    description:
      required: true
      desc: Inventory adjustment description
    sku:
      desc: SKU being adjusted, if applicable
    site_id:
      desc: Site or DC
    amount_gbp:
      required: true
      type: float
      desc: Adjustment amount in GBP
  example:
    entity_id: LE-UK
    posting_date: '2026-10-01'
    description: Inventory shrink adjustment DC1
    sku: SKU-100234
    site_id: DC1
    amount_gbp: -5000.0
- name: get_cost_centre_actuals
  desc: Actual costs by cost centre and account for a period. Returns actuals vs budget
    with variance.
  kind: sql
  args:
    cost_centre_id:
      desc: Cost centre (default all)
    period:
      required: true
      type: str
      desc: Financial period, e.g. FY27-09
    account_code:
      desc: GL account (default all)
  sql: "SELECT c.cost_centre_id, cc.name, c.account_code, c.period,\n       round(c.amount_gbp,\
    \ 2) AS actual_gbp,\n       round(c.budget_gbp, 2) AS budget_gbp,\n       round(c.variance_gbp,\
    \ 2) AS variance_gbp\nFROM cost_centre_actuals c\nLEFT JOIN master.cost_centres\
    \ cc USING (cost_centre_id)\nWHERE c.period = $period\n  AND ($cost_centre_id\
    \ IS NULL OR c.cost_centre_id = $cost_centre_id)\n  AND ($account_code IS NULL\
    \ OR c.account_code = $account_code)\nORDER BY c.cost_centre_id, c.account_code\n"
  limit: 100
  example:
    period: FY27-09
- name: get_inventory_valuation_by_site
  desc: Inventory valuation and provisions by site. Returns gross value, provisions
    and net value.
  kind: sql
  args:
    site_id:
      desc: Site or DC (default all)
    as_of_date:
      type: date
      default: $as_of
      desc: Valuation date
    status:
      type: enum
      values:
      - active
      - slow_moving
      - obsolete
      - written_off
      desc: Filter by status
  sql: "SELECT i.site_id, s.name AS site_name,\n       sum(i.units_on_hand) AS total_units,\n\
    \       round(sum(i.total_value_gbp), 2) AS gross_value_gbp,\n       round(sum(i.provision_gbp),\
    \ 2) AS provision_gbp,\n       round(sum(i.net_value_gbp), 2) AS net_value_gbp,\n\
    \       count(DISTINCT i.sku) AS sku_count\nFROM inventory_by_site i\nLEFT JOIN\
    \ master.sites s ON s.site_id = i.site_id\nWHERE i.as_of_date = CAST($as_of_date\
    \ AS DATE)\n  AND ($site_id IS NULL OR i.site_id = $site_id)\n  AND ($status IS\
    \ NULL OR i.status = $status)\nGROUP BY i.site_id, s.name\nORDER BY i.site_id\n"
  limit: 10
  example:
    site_id: DC1
- name: compare_wms_to_ledger
  desc: Reconcile WMS stock value to the ledger. Returns valuation by SKU with differences
    highlighted.
  kind: sql
  args:
    site_id:
      desc: Site or DC (default all)
    as_of_date:
      type: date
      default: $as_of
      desc: Date for comparison
    min_variance_gbp:
      type: float
      default: 100.0
      desc: Only show differences >= this
  sql: "SELECT e.sku,\n       p.name AS sku_name,\n       e.site_id,\n       e.quantity\
    \ AS erp_units,\n       e.total_value_gbp AS erp_value_gbp,\n       round(e.total_value_gbp,\
    \ 2) AS ledger_value_gbp,\n       round(e.total_value_gbp - e.total_value_gbp,\
    \ 2) AS difference_gbp\nFROM erp_stock e\nLEFT JOIN master.products p ON p.sku\
    \ = e.sku\nWHERE e.as_of_date = CAST($as_of_date AS DATE)\n  AND ($site_id IS\
    \ NULL OR e.site_id = $site_id)\nORDER BY abs(e.total_value_gbp - e.total_value_gbp)\
    \ DESC\n"
  limit: 50
  example:
    site_id: DC1
- name: get_erp_stock_by_sku
  desc: ERP stock balances by SKU and plant or storage location. Returns quantity,
    cost and total value.
  kind: sql
  args:
    sku:
      desc: SKU (default all)
    site_id:
      desc: Site or DC (default all)
    as_of_date:
      type: date
      default: $as_of
      desc: Date for snapshot
  sql: "SELECT e.sku, p.name, e.site_id, s.name AS site_name, e.location_id,\n   \
    \    e.quantity, round(e.unit_cost_gbp, 2) AS unit_cost_gbp,\n       round(e.total_value_gbp,\
    \ 2) AS total_value_gbp\nFROM erp_stock e\nLEFT JOIN master.products p ON p.sku\
    \ = e.sku\nLEFT JOIN master.sites s ON s.site_id = e.site_id\nWHERE e.as_of_date\
    \ = CAST($as_of_date AS DATE)\n  AND ($sku IS NULL OR e.sku = $sku)\n  AND ($site_id\
    \ IS NULL OR e.site_id = $site_id)\nORDER BY e.sku, e.site_id\n"
  limit: 100
  example:
    sku: SKU-100234
- name: get_intercompany_balances
  desc: Intercompany balances between two entities. Separates unmatched transactions
    and disputed items.
  kind: sql
  args:
    from_entity_id:
      required: true
      desc: Sending entity
    to_entity_id:
      required: true
      desc: Receiving entity
    as_of_date:
      type: date
      default: $as_of
      desc: As of date
  sql: "SELECT i.from_entity_id, i.to_entity_id,\n       count(*) AS transaction_count,\n\
    \       round(sum(CASE WHEN i.status = 'matched' THEN 0 ELSE i.amount_gbp END),\
    \ 2) AS unmatched_gbp,\n       round(sum(CASE WHEN i.status = 'disputed' THEN\
    \ i.amount_gbp ELSE 0 END), 2) AS disputed_gbp,\n       round(sum(i.amount_gbp),\
    \ 2) AS total_gbp\nFROM intercompany_transactions i\nWHERE i.from_entity_id =\
    \ $from_entity_id\n  AND i.to_entity_id = $to_entity_id\n  AND i.posting_date\
    \ <= CAST($as_of_date AS DATE)\nGROUP BY i.from_entity_id, i.to_entity_id\n"
  limit: 1
  example:
    from_entity_id: LE-UK
    to_entity_id: LE-EU
- name: draft_clearing_journals
  desc: Draft journals to clear intercompany differences between entities. Returns
    suggested clearing entries.
  kind: sql
  args:
    from_entity_id:
      required: true
      desc: Sending entity
    to_entity_id:
      required: true
      desc: Receiving entity
    posting_date:
      type: date
      default: $as_of
      desc: Clearing posting date
  sql: "SELECT i.from_entity_id, i.to_entity_id,\n       round(sum(CASE WHEN i.status\
    \ = 'unmatched' THEN i.amount_gbp ELSE 0 END), 2) AS amount_to_clear_gbp,\n  \
    \     count(DISTINCT i.ic_txn_id) AS transaction_count,\n       'Clearing journal\
    \ for intercompany reconciliation' AS description\nFROM intercompany_transactions\
    \ i\nWHERE i.from_entity_id = $from_entity_id\n  AND i.to_entity_id = $to_entity_id\n\
    \  AND i.status IN ('unmatched', 'disputed')\nGROUP BY i.from_entity_id, i.to_entity_id\n"
  limit: 1
  example:
    from_entity_id: LE-UK
    to_entity_id: LE-EU
- name: get_freight_cost_by_ledger_account
  desc: Freight cost postings by account and period. Returns costs by supplier and
    shipping mode.
  kind: sql
  args:
    account_code:
      desc: GL freight account (default all)
    period_start:
      type: date
      default: -30d
      desc: Costs on or after
    period_end:
      type: date
      default: $as_of
      desc: Costs on or before
  sql: "SELECT f.account_code, f.posting_date,\n       f.supplier_id, sup.name AS\
    \ supplier_name,\n       round(sum(f.cost_gbp), 2) AS total_cost_gbp,\n      \
    \ count(DISTINCT f.freight_id) AS transaction_count\nFROM freight_costs f\nLEFT\
    \ JOIN master.suppliers sup ON sup.supplier_id = f.supplier_id\nWHERE f.posting_date\
    \ >= CAST($period_start AS DATE)\n  AND f.posting_date <= CAST($period_end AS\
    \ DATE)\n  AND ($account_code IS NULL OR f.account_code = $account_code)\nGROUP\
    \ BY f.account_code, f.posting_date, f.supplier_id, sup.name\nORDER BY f.posting_date\
    \ DESC\n"
  limit: 50
  example: {}
- name: get_fx_gain_loss_by_account
  desc: FX gain and loss postings by account. Separates realised from unrealised movements
    by currency.
  kind: sql
  args:
    account_code:
      desc: GL FX account (default all)
    period_start:
      type: date
      default: -90d
      desc: Postings on or after
    period_end:
      type: date
      default: $as_of
      desc: Postings on or before
  sql: "SELECT f.account_code, f.currency, f.fx_type,\n       round(sum(f.gain_loss_gbp),\
    \ 2) AS gain_loss_gbp,\n       count(*) AS transaction_count,\n       round(avg(f.opening_rate),\
    \ 4) AS avg_opening_rate,\n       round(avg(f.closing_rate), 4) AS avg_closing_rate\n\
    FROM fx_gains_losses f\nWHERE f.posting_date >= CAST($period_start AS DATE)\n\
    \  AND f.posting_date <= CAST($period_end AS DATE)\n  AND ($account_code IS NULL\
    \ OR f.account_code = $account_code)\nGROUP BY f.account_code, f.currency, f.fx_type\n\
    ORDER BY f.account_code, f.currency\n"
  limit: 50
  example: {}
- name: get_handling_cost_by_channel
  desc: Handling cost by recovery channel. Shows cost per unit and total by channel
    (web, store, warehouse).
  kind: sql
  args:
    channel:
      type: enum
      values:
      - web
      - app
      - click_collect
      - marketplace
      - store
      - warehouse
      desc: Channel (default all)
    period_start:
      type: date
      default: -30d
      desc: Costs on or after
    period_end:
      type: date
      default: $as_of
      desc: Costs on or before
  sql: "SELECT h.channel,\n       round(sum(h.cost_gbp), 2) AS total_cost_gbp,\n \
    \      sum(h.units_handled) AS total_units,\n       round(sum(h.cost_gbp) / NULLIF(sum(h.units_handled),\
    \ 0), 4) AS cost_per_unit_gbp,\n       count(*) AS posting_count\nFROM handling_costs\
    \ h\nWHERE h.posting_date >= CAST($period_start AS DATE)\n  AND h.posting_date\
    \ <= CAST($period_end AS DATE)\n  AND ($channel IS NULL OR h.channel = $channel)\n\
    GROUP BY h.channel\nORDER BY h.channel\n"
  limit: 10
  example: {}
- name: get_erp_order_header_and_charges
  desc: Order headers, revenue and charges from the ERP. Shows order level financials
    by entity and channel.
  kind: sql
  args:
    entity_id:
      desc: Legal entity (default all)
    period_start:
      type: date
      default: -30d
      desc: Orders on or after
    period_end:
      type: date
      default: $as_of
      desc: Orders on or before
  sql: "SELECT o.order_id, o.posting_date, o.entity_id, le.name AS entity_name,\n\
    \       round(o.revenue_gbp, 2) AS revenue_gbp,\n       round(o.freight_charge_gbp,\
    \ 2) AS freight_charge_gbp,\n       round(o.handling_charge_gbp, 2) AS handling_charge_gbp,\n\
    \       round(o.discount_gbp, 2) AS discount_gbp,\n       round(o.total_charges_gbp,\
    \ 2) AS total_charges_gbp\nFROM order_charges o\nLEFT JOIN master.legal_entities\
    \ le ON le.entity_id = o.entity_id\nWHERE o.posting_date >= CAST($period_start\
    \ AS DATE)\n  AND o.posting_date <= CAST($period_end AS DATE)\n  AND ($entity_id\
    \ IS NULL OR o.entity_id = $entity_id)\nORDER BY o.posting_date DESC\n"
  limit: 100
  example:
    entity_id: LE-UK
- name: get_intercompany_sourcing_margins
  desc: Sourcing entity margins and mark-ups. Shows margin % by product category and
    transfer price variance.
  kind: sql
  args:
    from_entity_id:
      desc: Sourcing entity (default all)
    to_entity_id:
      desc: Receiving entity (default all)
  sql: "SELECT i.from_entity_id, i.to_entity_id,\n       count(DISTINCT i.ic_txn_id)\
    \ AS transaction_count,\n       round(sum(i.amount_gbp), 2) AS total_transfer_price_gbp,\n\
    \       round(avg(i.fx_rate), 4) AS avg_fx_rate\nFROM intercompany_transactions\
    \ i\nWHERE ($from_entity_id IS NULL OR i.from_entity_id = $from_entity_id)\n \
    \ AND ($to_entity_id IS NULL OR i.to_entity_id = $to_entity_id)\nGROUP BY i.from_entity_id,\
    \ i.to_entity_id\nORDER BY i.from_entity_id, i.to_entity_id\n"
  limit: 20
  example: {}
- name: calculate_shift_option_cost
  desc: Total cost comparison of staffing options (premiums, agency fees, allowances).
  kind: sql
  args:
    site_id:
      required: true
      desc: DC site
    period_start:
      type: date
      required: true
      desc: Period start date
    period_end:
      type: date
      required: true
      desc: Period end date
    headcount_gap:
      type: int
      default: 45
      desc: FTE headcount gap to fill
    shift_option:
      type: enum
      values:
      - late_shift
      - overtime
      desc: Staffing option to cost
  sql: "SELECT $site_id AS site_id,\n       $period_start AS period_start,\n     \
    \  $period_end AS period_end,\n       $shift_option AS shift_option,\n       $headcount_gap\
    \ AS headcount_gap,\n       CASE WHEN $shift_option = 'late_shift' THEN $headcount_gap\
    \ * 35000 ELSE $headcount_gap * 22000 END AS estimated_cost_gbp,\n       'cost\
    \ = headcount_gap * weekly_rate * weeks' AS formula\n"
  limit: 1
  example:
    site_id: DC1
    period_start: '2026-11-03'
    period_end: '2026-12-28'
    headcount_gap: 45
    shift_option: late_shift
- name: get_dc_cost_and_productivity_kpis
  desc: DC cost per unit and productivity KPIs for comparison. Shows labour, energy,
    rent and facility costs per unit handled.
  kind: sql
  args:
    site_id:
      desc: DC site (default all)
    period_start:
      type: date
      default: -90d
      desc: Period start
    period_end:
      type: date
      default: $as_of
      desc: Period end
  sql: "SELECT c.cost_centre_id AS site_id,\n       round(sum(c.amount_gbp), 2) AS\
    \ total_cost_gbp,\n       round(sum(c.amount_gbp) / 1000, 2) AS cost_per_thousand_units_gbp,\n\
    \       count(DISTINCT c.account_code) AS account_count\nFROM cost_centre_actuals\
    \ c\nWHERE ($site_id IS NULL OR c.cost_centre_id = $site_id)\nGROUP BY c.cost_centre_id\n\
    ORDER BY c.cost_centre_id\n"
  limit: 10
  example:
    site_id: DC1
