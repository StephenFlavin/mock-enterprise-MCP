- name: get_intercompany_sourcing_margins
  desc: Sourcing entity margins and mark-ups. Shows margin % by product category and transfer price variance.
  kind: sql
  args:
    from_entity_id:
      desc: Sourcing entity (default all)
    to_entity_id:
      desc: Receiving entity (default all)
