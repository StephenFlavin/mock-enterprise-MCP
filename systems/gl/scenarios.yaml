- question: "01:6:Q1"
  story: September cost per unit shipped increased 9% over August. Seed data shows CC-2101 labour costs increased from 25000 to 28000 GBP in September, while other cost centres remained stable.
  checks:
    - tool: get_cost_centre_actuals
      args: {period: "FY27-09"}
      expect: ["CC-2101", "actual_gbp"]

- question: "01:6:Q3"
  story: Decision needed between late shift option (8 weeks, 45 FTE) or overtime. Seed data includes cost calculations for both staffing options for November-December period.
  checks:
    - tool: calculate_shift_option_cost
      args: {site_id: "DC1", period_start: "+10d", period_end: "+56d", headcount_gap: 45, shift_option: "late_shift"}
      expect: ["estimated_cost", "formula"]

- question: "01:6:Q4"
  story: Need to benchmark DC costs and productivity against other retail DCs. Seed data includes cost centre actuals with labour and energy costs per unit.
  checks:
    - tool: get_dc_cost_and_productivity_kpis
      args: {}
      expect: ["cost_per_thousand_units_gbp", "total_cost_gbp"]

- question: "01:8:Q2"
  story: ERP and WMS stock don't agree on SKU-100007. Seed data shows ERP has 150 units at DC1 valued at 3825 GBP.
  checks:
    - tool: get_erp_stock_by_sku
      args: {sku: "SKU-100007", site_id: "DC1"}
      expect: ["SKU-100007", "150", "Northampton DC"]

- question: "01:8:Q4"
  story: Finance is asking about £1.2m gap between ERP and WMS. Seed data shows stock differences and goods in transit issues.
  checks:
    - tool: list_in_transit_documents
      args: {}
      expect: ["ic_txn_id", "status"]
    - tool: get_erp_stock_by_sku
      args: {site_id: "DC1"}
      expect: ["quantity", "total_value_gbp"]

- question: "05:49:Q5"
  story: Circular economy lead needs recovery channel analysis. Seed data includes handling costs across web, store, and warehouse channels with recovery metrics.
  checks:
    - tool: get_recovered_value_by_channel
      args: {}
      expect: ["channel", "estimated_recovered_value_gbp"]
    - tool: get_handling_cost_by_channel
      args: {}
      expect: ["channel", "total_cost_gbp"]

- question: "07:61:Q1"
  story: Operating profit variance needs decomposition. Seed data shows manual journals, one-off adjustments and timing items in current period.
  checks:
    - tool: list_one_off_journals
      args: {}
      expect: ["je_type", "description", "status"]
    - tool: list_timing_items
      args: {}
      expect: ["reversal_date", "amount_gbp"]
    - tool: submit_journal_for_approval
      args: {je_id: "JE-900001", submitted_by: "EMP-00100"}
      expect: ["JE-900001", "submitted"]

- question: "07:61:Q2"
  story: UK-IE intercompany balance is out by 340k. Seed data shows 28 intercompany transactions between LE-UK and LE-IE, some matched and some unmatched.
  checks:
    - tool: list_intercompany_transactions
      args: {from_entity_id: "LE-UK", to_entity_id: "LE-IE"}
      expect: ["ic_txn_id", "status", "amount_gbp"]
    - tool: get_intercompany_balances
      args: {from_entity_id: "LE-UK", to_entity_id: "LE-IE"}
      expect: ["transaction_count", "unmatched_gbp", "total_gbp"]
    - tool: submit_journal_for_approval
      args: {je_id: "JE-900001", submitted_by: "EMP-00100"}
      expect: ["JE-900001", "submitted"]

- question: "07:61:Q4"
  story: Close task review at month end. Seed data shows multiple accruals and reconciliation records awaiting sign-off.
  checks:
    - tool: list_open_accruals
      args: {}
      expect: ["status", "reversal_date"]
    - tool: list_unreconciled_accounts
      args: {}
      expect: ["status", "assigned_to"]
    - tool: reassign_reconciliation
      args: {recon_id: "R-000001", assigned_to: "EMP-00101"}
      expect: ["R-000001", "EMP-00101"]
    - tool: draft_clearing_journals
      args: {from_entity_id: "LE-UK", to_entity_id: "LE-IE"}
      expect: ["clearing", "intercompany"]

- question: "07:61:Q5"
  story: Freight cost P&L is £210k off TMS. Seed data includes 40 freight cost entries across multiple GL accounts and suppliers.
  checks:
    - tool: get_freight_cost_by_ledger_account
      args: {}
      expect: ["total_cost_gbp", "supplier_name"]

