- question: 01:6:Q1
  story: CC-2101 (Northampton DC, DC1) cost per unit rose 9.0% in FY27-08 (70.39p) from FY27-07 (64.58p); overtime (+82,656) and agency (+50,008) drive most of it while permanent labour fell slightly and
    productivity dropped from 32.9 to 30.3 units per paid hour. FY26-08 is 63.26p for the year-on-year view.
  checks:
  - tool: get_cost_centre_actuals
    args:
      site_id: DC1
    expect:
    - Warehouse overtime
    - '207648'
    - '124992'
    - '70.39'
    - '64.58'
  - tool: get_cost_centre_actuals
    args:
      site_id: DC1
      period: FY26-08
    expect:
    - '63.26'
    - '3310000'
