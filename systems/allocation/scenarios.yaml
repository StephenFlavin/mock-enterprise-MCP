# Allocation system scenarios - one per question using allocation tools
- question: "02:19:Q5"
  story: >
    Port closure scenario analysis for northern Europe. 2-week closure: rebalance proposals show transferring 5,300 units of
    SKU-101897 from EU Central to UK North and South (net benefit £7,400). 4-week closure: expand to 8,900 units with net benefit
    £13,600. SKU-103157 (2,500-4,000 units) and other products show similar patterns. Analysis shows northern stores will be hit first
    due to limited days of cover (3-5 days). Rebalances are approved for both scenarios.
  checks:
    - tool: calculate_stock_reallocation_plan
      args: {sku: "SKU-101897", scenario: "port_closure_2w"}
      expect: ["EU Central", "UK North", "UK South", "5300", "7400"]
    - tool: calculate_stock_reallocation_plan
      args: {sku: "SKU-101897", scenario: "port_closure_4w"}
      expect: ["8900", "13600", "executed"]
    - tool: calculate_stock_reallocation_plan
      args: {sku: "SKU-103157", scenario: "port_closure_2w"}
      expect: ["EU Central", "UK North", "2500"]

- question: "03:22:Q1"
  story: >
    SKU-101897 stocked out in 40 stores (ST001-ST040) for nine days (26 Sep - 4 Oct). Allocations made daily but delivery/receipt
    was sporadic. All 40 stores received allocations of 100 units each. Of these, 22 stores received full quantity (received),
    9 received partial (75 units), and 9 were either in-transit or not yet received. The gap: DC had stock but allocation
    decisions were delayed, causing the 9-day stockout despite adequate DC inventory.
  checks:
    - tool: get_store_allocations_for_product
      args: {sku: "SKU-101897"}
      expect: ["ST001", "ST040", "100", "40", "allocated", "received"]
    - tool: get_store_allocations_for_product
      args: {sku: "SKU-101897", status: "received"}
      expect: ["ST001", "ST014", "ST024", "ST034", "ST038"]
    - tool: get_store_allocations_for_product
      args: {sku: "SKU-101897", status: "partial"}
      expect: ["50", "75", "partial"]

- question: "03:22:Q4"
  story: >
    Seasonal throw (K-1700, 14,000 units) sitting at DC. Regional stock analysis shows UK North stores at 4.8 days of cover
    (5 stockouts) vs UK South at 15 days (fully stocked). Northern stores selling 188/week vs southern 280/week. Rebalance benefit
    analysis shows transferring 1,500 units from South to North would cost £900 but unlock £2,100 in sales (net benefit £1,200, ROI 2.3x).
    Decision: execute rebalance focused only on northern stores with <7 days cover.
  checks:
    - tool: get_store_stock_and_sales_by_region
      args: {sku: "K-1700", region: "UK North"}
      expect: ["4.8", "at_risk", "188", "1200"]
    - tool: get_store_stock_and_sales_by_region
      args: {sku: "K-1700", region: "UK South"}
      expect: ["15", "balanced", "280", "4800"]
    - tool: calculate_rebalance_benefit
      args: {sku: "K-1700", scenario: "standard"}
      expect: ["1200", "net_benefit"]

- question: "03:30:Q4"
  story: >
    Slow-mover accuracy comparison using SKU-101897 data. Store-SKU level forecast: 11.2% MAPE, 3-day replenishment, £1,287.50 total cost.
    Cluster level: 15.8% MAPE, 7-day replenishment, £3,082.50 total cost. Category level: 22.4% MAPE, 14-day replenishment, £6,135 total cost.
    Analysis shows store-SKU is optimal despite effort - lowest error (11.2%) and cost (£1,287.50). Replenishment impact of moving to
    cluster level would triple total cost due to increased dead stock and stockouts.
  checks:
    - tool: calculate_replenishment_impact
      args: {sku: "SKU-101897"}
      expect: ["store_sku", "11.2", "1287.50", "cluster", "15.8", "3082.50"]
    - tool: calculate_replenishment_impact
      args: {sku: "SKU-101897", include_all_levels: true}
      expect: ["category", "22.4", "6135"]
    - tool: calculate_replenishment_impact
      args: {sku: "SKU-103157"}
      expect: ["10.5", "store_sku", "848"]
