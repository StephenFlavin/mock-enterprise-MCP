- question: "02:19:Q5"
  story: >
    Port closure plan for the Smart Home category (SKU-101484, SKU-103269, SKU-101176). EU Central stores run short of Smart Home
    (ST228 runs out first in the ims story), so stock moves into EU Central: a 2-week closure moves 1,200 units UK Midlands to EU
    Central, 900 UK North to EU Central and 450 UK South to EU Central; a 4-week closure doubles the volumes and adds 600 units
    Scotland to EU Central.
  checks:
    - tool: calculate_stock_reallocation_plan
      args: {scenario: port_closure_2w, category: Smart Home}
      expect: ["UK Midlands", "EU Central", "1200", "900", "450"]
    - tool: calculate_stock_reallocation_plan
      args: {scenario: port_closure_4w, category: Smart Home}
      expect: ["Scotland", "2400", "600"]

- question: "03:22:Q1"
  story: >
    SKU-101904 (style STY-5520) stocked out for nine days in 40 stores. DC1 held 4,282 units, but the store
    allocations were cancelled on the DC1 release threshold (40 cancelled allocations of 12 units) and only
    re-released late, after the stock-out.
  checks:
    - tool: get_store_allocations_for_product
      args: {style_id: STY-5520, status: cancelled}
      expect: ["ST001", "ST254", "release threshold", "cancelled"]
    - tool: get_store_allocations_for_product
      args: {style_id: STY-5520, status: received}
      expect: ["late release after stock-out", "ST214"]

- question: "03:22:Q4"
  story: >
    Seasonal bedding throw SKU-104963 by region: UK North (3.4 days cover, same six stores as ims) is at risk, UK South
    holds 3,191 available units against 100 a week. Moving 1,521 units to UK North over 16.7 selling weeks costs about
    £684 for about £80.6k of sales.
  checks:
    - tool: get_store_stock_and_sales_by_region
      args: {sku: SKU-104963}
      expect: ["UK North", "at_risk", "overstocked", "3.4"]
    - tool: calculate_rebalance_benefit
      args: {sku: SKU-104963, selling_weeks: 16.7}
      expect: ["1521", "684.45", "80597.79"]

- question: "03:30:Q4"
  story: >
    Thirteen slow movers: store-SKU forecasts average 12.5% MAPE against 17.0% at cluster level (4.5 points),
    with fewer stockouts and total cost of £12,289 against £30,134.
  checks:
    - tool: calculate_replenishment_impact
      args: {item_type: slow_mover}
      expect: ["store_sku", "12.5", "cluster", "17", "12289.43", "30134.16"]
