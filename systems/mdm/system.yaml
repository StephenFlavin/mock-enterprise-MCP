id: mdm
name: Master Data Management (MDM)
instructions: >
  Central management of master data: vendors/suppliers, products, sites, and data ownership.
  Vendor ids look like VEN-000123. Use it for data quality issues, duplicate detection,
  data ownership governance, and master attribute lookups.

tables:
  vendor_master:
    key: vendor_id
    cols:
      vendor_id: {type: str, desc: "Vendor/supplier record id, e.g. VEN-000123"}
      name: {type: str, desc: Vendor name}
      address: {type: str, desc: Registered address}
      tax_id: {type: str, desc: "Tax/VAT id"}
      country: {type: str, desc: ISO country code}
      status: {type: enum, values: [active, archived, merged, duplicate], desc: Vendor status}
      merged_into: {type: str, desc: "Master vendor id this was merged into"}
      bank_account_hash: {type: str, desc: "Hash of primary bank account for matching"}
      merged_at: {type: timestamp, desc: When this record was merged}
      updated_at: {type: timestamp, desc: Last updated}

  vendor_bank_details:
    key: bank_detail_id
    cols:
      bank_detail_id: {type: str, desc: "Bank detail record id, e.g. BNK-000123"}
      vendor_id: {type: str, desc: Vendor id}
      account_number: {type: str, desc: "Bank account number (partial, last 4 chars shown)"}
      sort_code: {type: str, desc: "UK sort code or routing number"}
      iban: {type: str, desc: "IBAN (partial, last 4 chars shown)"}
      bank_name: {type: str, desc: Bank name}
      account_holder: {type: str, desc: Account holder name}
      currency: {type: str, desc: Account currency}
      status: {type: enum, values: [active, archived, blocked], desc: Status}
      created_at: {type: timestamp, desc: When added}
      archived_at: {type: timestamp, desc: When archived}

  vendor_bank_changes:
    key: change_id
    cols:
      change_id: {type: str, desc: "Change record id, e.g. CHG-000123"}
      vendor_id: {type: str, desc: Vendor id}
      changed_at: {type: timestamp, desc: When the change occurred}
      changed_by: {type: str, desc: Employee id of person who made change}
      field_changed: {type: str, desc: "Field that changed, e.g. account_number"}
      old_value: {type: str, desc: Previous value}
      new_value: {type: str, desc: New value}
      change_type: {type: enum, values: [added, modified, archived], desc: Type of change}

  data_owners:
    key: dataset_id
    cols:
      dataset_id: {type: str, desc: "Dataset id, e.g. DST-001"}
      name: {type: str, desc: Dataset or domain name}
      domain: {type: str, desc: "Domain: products, vendors, sites, customers, orders"}
      owner_id: {type: str, desc: "Employee id of data owner"}
      steward_id: {type: str, desc: "Employee id of data steward"}
      slo_accuracy_pct: {type: float, desc: "SLO for data accuracy %"}
      last_audit_date: {type: date, desc: Date of last audit}

tools:
  # Lookup tools - list/search across master data
  - name: search_products
    desc: Find SKUs by name, style, category or supplier. Returns ids to use with other tools.
    kind: select
    from: master.products
    filters:
      name: {op: like, desc: "Words in the product name, e.g. glass kettle"}
      style_id: {op: like, desc: "Style id or part of it, e.g. 5520"}
      category: {}
      supplier_id: {}
    columns: [sku, style_id, name, category, colour, size, supplier_id, status]
    order: sku
    limit: 50
    example: {name: kettle}

  - name: search_sites
    desc: Find stores, DCs and offices by name, town, region or format. Returns site ids for other tools.
    kind: select
    from: master.sites
    filters:
      name: {op: like, desc: "Site name or words in it, e.g. Northampton"}
      city: {op: like, desc: "City name, e.g. Manchester"}
      region: {}
      type: {}
      format: {}
    columns: [site_id, name, type, format, city, region, status]
    order: site_id
    limit: 50
    example: {name: Northampton}

  - name: search_suppliers
    desc: Find suppliers by name, country or category. Returns supplier ids for other tools.
    kind: select
    from: master.suppliers
    filters:
      name: {op: like, desc: "Supplier name or words in it, e.g. Brown"}
      country: {}
      category_focus: {op: like, desc: "Product category supplied, e.g. apparel"}
      status: {}
    columns: [supplier_id, name, country, category_focus, tier, status, annual_spend_gbp, otif_pct_12m]
    order: supplier_id
    limit: 50
    example: {name: textile}

  - name: search_partners
    desc: Find wholesale, franchise and marketplace partners by name or country. Returns partner ids.
    kind: select
    from: master.partners
    filters:
      name: {op: like, desc: "Partner name or words in it, e.g. Freeman"}
      country: {}
      type: {}
      status: {}
    columns: [partner_id, name, type, country, since, status]
    order: partner_id
    limit: 50
    example: {name: Freeman}

  # MDM read tools
  - name: get_sku_master_attributes
    desc: SKU attributes including weight, status, handling flags (hazmat, pack type), supplier and lead time. Use for SKU quality checks.
    kind: select
    from: master.products
    filters:
      sku: {required: true}
    columns: [sku, name, style_id, department, category, subcategory, colour, size, brand, supplier_id, factory_id, country_of_origin, status,
              hazmat, pack_type, weight_kg, lead_time_days, moq, unit_cost_gbp, retail_price_gbp, abc_class, launch_date]
    example: {sku: PF-220}

  - name: search_duplicate_vendor_candidates
    desc: Fuzzy-match duplicate vendor pairs on name, address, tax ID and bank account, with the signals shared and a risk flag. Use to group duplicates.
    kind: sql
    args:
      match_type: {type: enum, values: [name, address, tax_id, bank_account, all], default: all, desc: "Type of matching to perform"}
      min_similarity: {type: float, default: 0.85, desc: "Minimum name similarity 0.0-1.0"}
      vendor_id: {desc: "Only pairs involving this vendor, e.g. VEN-900001"}
      name: {type: str, desc: "Only pairs where either vendor name contains these words, e.g. TextileCorp"}
    sql: |
      WITH p AS (
        SELECT v1.vendor_id AS v1_id, v2.vendor_id AS v2_id, v1.name, v2.name AS match_name,
               regexp_replace(lower(v1.name), '[^a-z0-9]', '', 'g') AS n1,
               regexp_replace(lower(v2.name), '[^a-z0-9]', '', 'g') AS n2,
               v1.address AS a1, v2.address AS a2,
               v1.tax_id AS t1, v2.tax_id AS t2,
               v1.bank_account_hash AS b1, v2.bank_account_hash AS b2
        FROM vendor_master v1
        JOIN vendor_master v2 ON v1.vendor_id < v2.vendor_id
        WHERE v1.status IN ('active', 'duplicate') AND v2.status IN ('active', 'duplicate')
          AND ($vendor_id IS NULL OR v1.vendor_id = $vendor_id OR v2.vendor_id = $vendor_id)
          AND ($name IS NULL OR lower(v1.name) LIKE '%' || lower($name) || '%'
                             OR lower(v2.name) LIKE '%' || lower($name) || '%'
                             OR regexp_replace(lower(v1.name), '[^a-z0-9]', '', 'g') LIKE '%' || regexp_replace(lower($name), '[^a-z0-9]', '', 'g') || '%'
                             OR regexp_replace(lower(v2.name), '[^a-z0-9]', '', 'g') LIKE '%' || regexp_replace(lower($name), '[^a-z0-9]', '', 'g') || '%')
      ), s AS (
        SELECT *,
               round(jaro_similarity(n1, n2), 2) AS name_similarity,
               (left(n1, 5) = left(n2, 5) AND jaro_similarity(n1, n2) >= $min_similarity) AS name_hit,
               (jaro_similarity(lower(a1), lower(a2)) >= 0.9) AS address_hit,
               (t1 IS NOT NULL AND t1 = t2) AS tax_hit,
               (b1 IS NOT NULL AND b1 <> '' AND b1 = b2) AS bank_hit
        FROM p
      )
      SELECT v1_id, v2_id, name, match_name, name_similarity,
             array_to_string(list_filter([CASE WHEN name_hit THEN 'name' END, CASE WHEN address_hit THEN 'address' END,
                                          CASE WHEN tax_hit THEN 'tax_id' END, CASE WHEN bank_hit THEN 'bank_account' END], x -> x IS NOT NULL), ', ') AS match_reasons,
             CASE WHEN tax_hit THEN 'likely duplicate (same tax id)'
                  WHEN bank_hit THEN 'possible fraud: shared bank account but different tax id'
                  ELSE 'review manually' END AS risk
      FROM s
      WHERE ($match_type = 'all' AND (name_hit OR address_hit OR tax_hit OR bank_hit))
         OR ($match_type = 'name' AND name_hit) OR ($match_type = 'address' AND address_hit)
         OR ($match_type = 'tax_id' AND tax_hit) OR ($match_type = 'bank_account' AND bank_hit)
      ORDER BY (bank_hit::INT + tax_hit::INT + name_hit::INT + address_hit::INT) DESC, name_similarity DESC, v1_id, v2_id
    limit: 100
    example: {match_type: name}

  - name: get_vendor_bank_account_matches
    desc: Groups of active vendors sharing one bank account, with tax-id count and a payment-risk flag (duplicate vs possible fraud).
    kind: sql
    args:
      iban_suffix: {type: str, desc: "Account/IBAN suffix to match (e.g. last 4 chars), or blank for all"}
      vendor_id: {desc: "Only groups containing this vendor, e.g. VEN-900001"}
    sql: |
      WITH acct AS (
        SELECT bd.vendor_id, v.name, v.tax_id, v.country, v.status AS vendor_status,
               coalesce(nullif(bd.iban, ''), bd.sort_code || ' ' || bd.account_number) AS bank_account, bd.bank_name
        FROM vendor_bank_details bd
        JOIN vendor_master v ON bd.vendor_id = v.vendor_id
        WHERE bd.status = 'active' AND v.status IN ('active', 'duplicate')
      )
      SELECT string_agg(DISTINCT vendor_id, ', ' ORDER BY vendor_id) AS vendor_ids,
             string_agg(DISTINCT name, '; ' ORDER BY name) AS vendor_names,
             bank_account, any_value(bank_name) AS bank_name,
             count(DISTINCT vendor_id) AS vendor_count,
             count(DISTINCT tax_id) AS distinct_tax_ids,
             CASE WHEN count(DISTINCT tax_id) = 1 THEN 'likely duplicate: same tax id'
                  ELSE 'possible fraud: different tax ids share this account, hold payments' END AS payment_risk
      FROM acct
      WHERE ($iban_suffix IS NULL OR bank_account LIKE '%' || $iban_suffix)
      GROUP BY bank_account
      HAVING count(DISTINCT vendor_id) > 1 AND ($vendor_id IS NULL OR bool_or(vendor_id = $vendor_id))
      ORDER BY vendor_count DESC, bank_account
    limit: 100
    example: {}

  - name: list_vendor_bank_detail_changes
    desc: Changes to vendor bank details with user and timestamp, newest first. Audit trail for compliance and security.
    kind: sql
    args:
      vendor_id: {}
      changed_from: {type: date, default: "-90d", desc: "Changes on or after"}
      changed_to: {type: date, desc: "Changes on or before"}
      change_type: {type: enum, values: [added, modified, archived], desc: "Filter by change type"}
    sql: |
      SELECT c.change_id, c.vendor_id, v.name AS vendor_name, c.changed_at, c.changed_by AS changed_by_id, e.name AS changed_by,
             c.field_changed, c.old_value, c.new_value, c.change_type
      FROM vendor_bank_changes c
      JOIN vendor_master v ON c.vendor_id = v.vendor_id
      LEFT JOIN master.employees e ON c.changed_by = e.employee_id
      WHERE ($vendor_id IS NULL OR c.vendor_id = $vendor_id)
        AND c.changed_at >= CAST($changed_from AS DATE)
        AND ($changed_to IS NULL OR CAST(c.changed_at AS DATE) <= CAST($changed_to AS DATE))
        AND ($change_type IS NULL OR c.change_type = $change_type)
      ORDER BY c.changed_at DESC
    limit: 100
    example: {}

  - name: get_data_owner_for_dataset
    desc: Data owner and steward (ids and names) for a dataset or domain, with accuracy SLO and last audit date.
    kind: sql
    args:
      domain: {type: str, desc: "Domain name, e.g. vendors, products"}
      dataset: {type: str, desc: "Dataset name or words in it, e.g. OTIF_daily or Vendor Master"}
      owner_id: {}
    sql: |
      SELECT d.dataset_id, d.name, d.domain, d.owner_id, o.name AS owner_name, d.steward_id, st.name AS steward_name,
             d.slo_accuracy_pct, d.last_audit_date, date_diff('day', d.last_audit_date, CAST($as_of AS DATE)) AS days_since_audit
      FROM data_owners d
      LEFT JOIN master.employees o ON d.owner_id = o.employee_id
      LEFT JOIN master.employees st ON d.steward_id = st.employee_id
      WHERE ($domain IS NULL OR lower(d.domain) LIKE '%' || lower($domain) || '%')
        AND ($dataset IS NULL OR lower(d.name) LIKE '%' || lower($dataset) || '%')
        AND ($owner_id IS NULL OR d.owner_id = $owner_id)
      ORDER BY d.dataset_id
    limit: 50
    example: {domain: vendors}

  # MDM write tools
  - name: merge_vendor_records
    desc: Merges duplicate vendor records into a surviving master record. Returns old and new status.
    kind: update
    table: vendor_master
    set: {status: merged, merged_at: "$as_of", updated_at: "$as_of"}
    args:
      merged_into: {required: true, desc: "Master vendor id to merge into, e.g. VEN-0001"}
    example: {vendor_id: VEN-900002, merged_into: VEN-900001}

  - name: archive_duplicate_vendor
    desc: Archives a duplicate vendor record after merge. Sets status to archived and retains audit trail.
    kind: update
    table: vendor_master
    set: {status: archived, updated_at: "$as_of"}
    args: {}
    example: {vendor_id: VEN-900003}
