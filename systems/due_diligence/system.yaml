tools:
- name: calculate_supplier_share_of_factory_capacity
  desc: Our share of a factory's monthly capacity from the last 52 weeks of purchase orders, as a leverage indicator for remediation or exit.
  kind: sql
  args:
    supplier_id:
      required: true
    factory_id:
      required: true
  sql: "SELECT f.factory_id, f.name AS factory_name, f.supplier_id, f.capacity_units_month,\n  COALESCE(SUM(m.total_units), 0) AS our_units_last_52_weeks,\n  round(COALESCE(SUM(m.total_units), 0) / 12.0,\
    \ 0) AS our_monthly_units,\n  round(COALESCE(SUM(m.total_units), 0) / 12.0 * 100.0 / NULLIF(f.capacity_units_month, 0), 1) AS our_share_pct,\n  CASE WHEN COALESCE(SUM(m.total_units), 0) / 12.0 * 100.0\
    \ / NULLIF(f.capacity_units_month, 0) >= 25 THEN 'strong leverage'\n       WHEN COALESCE(SUM(m.total_units), 0) / 12.0 * 100.0 / NULLIF(f.capacity_units_month, 0) >= 10 THEN 'moderate leverage'\n  \
    \     ELSE 'low leverage: join other buyers or use audit pressure' END AS leverage,\n  'our_share_pct = (units ordered in last 52 weeks / 12) * 100 / monthly capacity' AS formula\nFROM master.factories\
    \ f\nLEFT JOIN master.purchase_orders m ON m.factory_id = f.factory_id AND m.supplier_id = f.supplier_id\n  AND m.status NOT IN ('cancelled', 'draft')\n  AND CAST(m.order_date AS DATE) >= date_trunc('week',\
    \ CAST($as_of AS DATE)) - INTERVAL 52 WEEK\nWHERE f.factory_id = $factory_id AND f.supplier_id = $supplier_id\nGROUP BY f.factory_id, f.name, f.supplier_id, f.capacity_units_month\n"
  limit: 1
  example:
    supplier_id: SUP-0001
    factory_id: FAC-0001
- name: create_due_diligence_case
  desc: Open an ethical trade case for an allegation, incident, or periodic review.
  kind: insert
  table: due_diligence_cases
  id_prefix: CASE-
  defaults:
    status: open
  args:
    case_type:
      required: true
      desc: 'Case type: allegation, onboarding, audit_finding, periodic_review, escalation'
    supplier_id:
      required: true
    factory_id: {}
    description:
      required: true
      desc: Allegation or issue summary
    assigned_to: {}
    risk_rating:
      type: enum
      values:
      - low
      - medium
      - high
      - critical
      default: high
      desc: Initial risk rating
  example:
    case_type: allegation
    supplier_id: SUP-0001
    description: Debt bondage allegation at Tamil Nadu mill
    factory_id: FAC-0001
- name: create_due_diligence_task
  desc: Create and assign a due diligence or mapping task, optionally linked to a case, supplier or country. Returns the new task.
  kind: insert
  table: due_diligence_tasks
  id_prefix: TASK-
  defaults:
    status: open
  args:
    case_id: {}
    supplier_id: {}
    country:
      desc: Country or region the task covers, e.g. CN
    description:
      required: true
    task_type:
      required: true
      desc: 'Task type: mapping, audit, evidence_collection, legal_review, remediation_plan'
    assigned_to: {}
    due_date:
      type: date
  example:
    task_type: mapping
    description: Map cotton ginneries in Xinjiang
    country: CN
    due_date: +14d
- name: draft_compliance_gap_list
  desc: Draft a gap list of evidence versus forced-labour and due-diligence legal requirements for a supplier, by jurisdiction. Use get_evidence_inventory_for_due_diligence for the raw table.
  kind: draft
  args:
    supplier_id:
      required: true
    jurisdiction:
      type: str
      desc: Jurisdiction code UK, EU, US or CA; omit for all
  sql:
    supplier: SELECT * FROM master.suppliers WHERE supplier_id = $supplier_id
    evidence: "SELECT r.requirement_id, r.jurisdiction, r.regulation, r.requirement_text, r.penalties, r.effective_date,\n   COALESCE(e.evidence_held, false) AS evidence_held, e.evidence_type, e.evidence_date,\
      \ e.gap_description, e.priority\n  FROM compliance_requirements r\n  LEFT JOIN compliance_evidence_inventory e ON e.requirement_id = r.requirement_id AND e.supplier_id = $supplier_id\n  WHERE r.topic\
      \ <> 'product_liability' AND ($jurisdiction IS NULL OR r.jurisdiction = $jurisdiction)\n  ORDER BY r.jurisdiction, r.requirement_id"
  template: 'COMPLIANCE GAP ANALYSIS: {{ supplier[0].name }} ({{ supplier[0].supplier_id }})

    Jurisdiction: {{ jurisdiction or ''UK, EU, US, CA'' }}

    Gaps: {{ evidence|rejectattr(''evidence_held'')|list|length }} of {{ evidence|length }} requirements

    {% for req in evidence %}

    ### {{ req.jurisdiction }}: {{ req.regulation }}

    Requirement: {{ req.requirement_text }}

    {% if req.evidence_held %}Status: EVIDENCE HELD ({{ req.evidence_type }}, {{ req.evidence_date }})

    {% else %}Status: GAP - {{ req.gap_description or ''no evidence on file'' }} (priority: {{ req.priority or ''high'' }})

    {% endif %}Penalties: {{ req.penalties }}

    {% endfor %}'
  example:
    supplier_id: SUP-0001
    jurisdiction: EU
- name: draft_escalation_note
  desc: Draft an internal escalation note for an ethical trade allegation, from a case id or a supplier and factory, with evidence, exposed suppliers and obligations.
  kind: draft
  args:
    case_id:
      desc: Existing case id, e.g. CASE-900001; omit to draft from supplier and factory
    supplier_id: {}
    factory_id: {}
    summary:
      type: str
      desc: Allegation in one sentence, used when no case id is given
  sql:
    case_info: "SELECT COALESCE(c.case_id, 'not yet opened') AS case_id, COALESCE(c.case_type, 'allegation') AS case_type,\n   COALESCE(c.supplier_id, $supplier_id, f.supplier_id) AS supplier_id, COALESCE(c.factory_id,\
      \ $factory_id) AS factory_id,\n   COALESCE(c.description, $summary, 'Forced labour allegation') AS description,\n   COALESCE(c.risk_rating, rr.forced_labour_risk, 'high') AS risk_rating, s.name AS\
      \ supplier_name, f.name AS factory_name\n  FROM (SELECT 1 AS one) x\n  LEFT JOIN due_diligence_cases c ON c.case_id = $case_id\n  LEFT JOIN master.factories f ON f.factory_id = COALESCE(c.factory_id,\
      \ $factory_id)\n  LEFT JOIN supplier_risk_ratings rr ON rr.supplier_id = COALESCE(c.supplier_id, $supplier_id, f.supplier_id)\n  LEFT JOIN master.suppliers s ON s.supplier_id = COALESCE(c.supplier_id,\
      \ $supplier_id, f.supplier_id)"
    evidence: "SELECT e.* FROM risk_evidence e WHERE e.risk_level IN ('high', 'critical')\n   AND e.supplier_id = COALESCE((SELECT supplier_id FROM due_diligence_cases WHERE case_id = $case_id), $supplier_id,\n\
      \        (SELECT supplier_id FROM master.factories WHERE factory_id = $factory_id)) ORDER BY e.found_at DESC"
    media: "SELECT headline, source, credibility, published_date FROM adverse_media_records\n   WHERE entity_id = COALESCE((SELECT factory_id FROM due_diligence_cases WHERE case_id = $case_id), $factory_id)\n\
      \   ORDER BY published_date DESC"
    exposed: "SELECT st.supplier_id, s.name AS supplier_name, st.material_flow FROM supplier_sub_tier_relationships st\n   JOIN master.suppliers s ON s.supplier_id = st.supplier_id\n   WHERE st.factory_id\
      \ = COALESCE((SELECT factory_id FROM due_diligence_cases WHERE case_id = $case_id), $factory_id)"
    obligations: SELECT * FROM compliance_requirements WHERE topic = 'forced_labour' ORDER BY jurisdiction, requirement_id
  template: 'INTERNAL ESCALATION NOTE

    Case: {{ case_info[0].case_id }} | {{ case_info[0].case_type|upper }}


    ISSUE: {{ case_info[0].description }}

    Supplier: {{ case_info[0].supplier_name }} ({{ case_info[0].supplier_id }})

    {% if case_info[0].factory_name %}Factory: {{ case_info[0].factory_name }} ({{ case_info[0].factory_id }}){% endif %}


    RISK LEVEL: {{ case_info[0].risk_rating|upper }}


    EVIDENCE:

    {% for ev in evidence %}- {{ ev.evidence_type }}: {{ ev.description }} ({{ ev.credibility }}, {{ ev.found_at }})

    {% endfor %}{% for m in media %}- media: {{ m.headline }} ({{ m.source }}, source credibility {{ m.credibility }}, {{ m.published_date }})

    {% endfor %}

    {% if exposed %}OUR SUPPLIERS SUPPLIED BY THIS FACTORY:

    {% for x in exposed %}- {{ x.supplier_name }} ({{ x.supplier_id }}): {{ x.material_flow }}

    {% endfor %}{% endif %}

    LEGAL OBLIGATIONS:

    {% for obl in obligations %}- {{ obl.regulation }} ({{ obl.jurisdiction }}): {{ obl.requirement_text }}

    {% endfor %}

    RECOMMENDED ACTIONS:

    1. Immediate engagement with supplier for facts

    2. Review current PO status and payment holds if needed

    3. Commission urgent audit if forced labour suspected

    4. Engage legal and compliance teams

    5. Consider media and stakeholder communication plan


    NEXT REVIEW: Within 5 business days

    '
  example:
    supplier_id: SUP-0018
    factory_id: FAC-0035
    summary: Debt bondage alleged at Tamil Nadu spinning mill
- name: get_company_ownership_structure
  desc: Shareholders and ultimate beneficial owners of a supplier or prospective company, with ownership percentage and whether the beneficial owner is disclosed and verified.
  kind: sql
  args:
    entity_id:
      type: str
      desc: Supplier id such as SUP-0003, or prospective company id such as PSP-0001 from search_company_registry
    entity_name:
      type: str
      desc: Part of the company name, if no id is known
  sql: "SELECT o.entity_id, o.entity_name, o.country, o.shareholder_name, o.shareholder_country, o.ownership_pct, o.shareholder_type,\n  CASE WHEN o.beneficial_owner_name = '' OR o.beneficial_owner_name\
    \ IS NULL THEN 'NOT DISCLOSED' ELSE o.beneficial_owner_name END AS beneficial_owner,\n  o.beneficial_owner_country, o.verified, o.verification_source, o.verified_date, o.notes\nFROM ownership_structures\
    \ o\nWHERE ($entity_id IS NULL OR o.entity_id = $entity_id) AND ($entity_name IS NULL OR o.entity_name ILIKE '%' || $entity_name || '%')\n  AND ($entity_id IS NOT NULL OR $entity_name IS NOT NULL)\n\
    ORDER BY o.entity_id, o.ownership_pct DESC\n"
  limit: 10
  example:
    entity_id: SUP-0003
- name: get_country_risk_indices
  desc: Forced labour and human rights risk indices by country with governance and enforcement scores.
  kind: select
  from: country_risk_indices
  filters:
    country: {}
    forced_labour_index:
      op: '>='
      type: float
      desc: Minimum risk index
  columns:
  - country
  - country_name
  - forced_labour_index
  - human_rights_score
  - legal_environment
  - enforcement_level
  - corruption_index
  - sourcing_volume_units
  - updated_at
  order: forced_labour_index DESC
  limit: 50
  example:
    country: IN
- name: get_evidence_inventory_for_due_diligence
  desc: Evidence a supplier holds per forced-labour or due-diligence requirement, with gaps and priorities, for all jurisdictions or one.
  kind: sql
  args:
    supplier_id:
      required: true
    jurisdiction:
      type: str
      desc: Jurisdiction code UK, EU, US or CA; omit for all
  sql: "SELECT r.jurisdiction, e.requirement_id, r.regulation, r.requirement_text, e.evidence_held, e.evidence_type, e.evidence_date,\n  CASE WHEN e.evidence_held THEN 'COVERED' ELSE 'GAP: ' || COALESCE(e.gap_description,\
    \ 'no evidence on file') END AS status, e.priority\nFROM compliance_requirements r\nLEFT JOIN compliance_evidence_inventory e ON e.requirement_id = r.requirement_id AND e.supplier_id = $supplier_id\n\
    WHERE r.topic <> 'product_liability' AND ($jurisdiction IS NULL OR r.jurisdiction = $jurisdiction)\nORDER BY CASE WHEN COALESCE(e.evidence_held, false) THEN 1 ELSE 0 END, CASE e.priority WHEN 'critical'\
    \ THEN 0 WHEN 'high' THEN 1 WHEN 'medium' THEN 2 ELSE 3 END, r.jurisdiction, r.requirement_id\n"
  limit: 100
  example:
    supplier_id: SUP-0001
    jurisdiction: UK
- name: get_factory_profile
  desc: Factory location, owner supplier, workforce, products, certifications, audit rating and remediation status.
  kind: sql
  args:
    factory_id:
      required: true
  sql: "SELECT\n  f.factory_id,\n  f.name,\n  f.supplier_id,\n  s.name AS supplier_name,\n  f.country,\n  f.city,\n  f.latitude,\n  f.longitude,\n  f.product_types,\n  f.capacity_units_month,\n  f.workers,\n\
    \  f.certifications,\n  f.last_audit_date,\n  f.audit_rating,\n  f.remediation_status,\n  f.grievance_mechanism,\n  f.updated_at\nFROM factory_profiles f\nLEFT JOIN master.suppliers s ON s.supplier_id\
    \ = f.supplier_id\nWHERE f.factory_id = $factory_id\n"
  limit: 1
  example:
    factory_id: FAC-0001
- name: get_forced_labour_risk_by_supplier
  desc: Forced-labour risk rating per supplier with country index, evidence count and open cases, worst first. Filter by supplier, country or minimum risk level.
  kind: sql
  args:
    supplier_id: {}
    country:
      type: str
      desc: Supplier country code, e.g. CN
    min_risk_level: &id001
      type: enum
      values:
      - low
      - medium
      - high
      - critical
      default: high
      desc: Lowest forced-labour risk level to include
  sql: "SELECT r.supplier_id, s.name AS supplier_name, s.country, c.forced_labour_index AS country_forced_labour_index, r.forced_labour_risk,\n  r.compliance_risk, r.financial_risk, r.overall_risk, r.due_diligence_status,\
    \ r.last_assessed_at,\n  (SELECT count(*) FROM risk_evidence e WHERE e.supplier_id = r.supplier_id AND e.risk_category = 'forced_labour') AS forced_labour_evidence_count,\n  (SELECT count(*) FROM due_diligence_cases\
    \ dc WHERE dc.supplier_id = r.supplier_id AND dc.status <> 'closed') AS open_cases\nFROM supplier_risk_ratings r\nJOIN master.suppliers s ON s.supplier_id = r.supplier_id\nLEFT JOIN country_risk_indices\
    \ c ON c.country = s.country\nWHERE ($supplier_id IS NULL OR r.supplier_id = $supplier_id) AND ($country IS NULL OR s.country = $country)\n  AND (CASE r.forced_labour_risk WHEN 'critical' THEN 3 WHEN\
    \ 'high' THEN 2 WHEN 'medium' THEN 1 ELSE 0 END) >= (CASE $min_risk_level WHEN 'critical' THEN 3 WHEN 'high' THEN 2 WHEN 'medium' THEN 1 ELSE 0 END)\nORDER BY (CASE r.forced_labour_risk WHEN 'critical'\
    \ THEN 3 WHEN 'high' THEN 2 WHEN 'medium' THEN 1 ELSE 0 END) DESC, forced_labour_evidence_count DESC, r.supplier_id\n"
  limit: 50
  example: {}
- name: get_supplier_chain_of_custody_certificates
  desc: Supplier chain of custody certificates by type with validity and coverage.
  kind: sql
  args:
    supplier_id:
      required: true
    cert_type: {}
  sql: "SELECT\n  c.cert_id,\n  c.supplier_id,\n  c.cert_type,\n  c.issued_by,\n  c.scope,\n  c.issued_date,\n  c.expiry_date,\n  c.status,\n  CASE WHEN c.expiry_date >= CAST($as_of AS DATE) THEN 'VALID'\
    \ ELSE 'EXPIRED' END AS validity,\n  c.updated_at\nFROM chain_of_custody_certificates c\nWHERE c.supplier_id = $supplier_id\n  AND ($cert_type IS NULL OR c.cert_type = $cert_type)\nORDER BY c.expiry_date\
    \ DESC\n"
  limit: 50
  example:
    supplier_id: SUP-0001
    cert_type: recycled_content
- name: get_supplier_due_diligence_status
  desc: Due-diligence status (not_started, in_progress, complete, escalated) per supplier with risk, open cases and open tasks. Filter by supplier or supplier country.
  kind: sql
  args:
    supplier_id: {}
    country:
      type: str
      desc: Supplier country code, e.g. PL
  sql: "SELECT r.supplier_id, s.name AS supplier_name, s.country, r.due_diligence_status, r.overall_risk, r.forced_labour_risk, r.last_assessed_at, r.next_review_date,\n  (SELECT count(*) FROM due_diligence_cases\
    \ c WHERE c.supplier_id = r.supplier_id AND c.status <> 'closed') AS open_cases,\n  (SELECT count(*) FROM due_diligence_tasks t WHERE t.status IN ('open','in_progress','blocked') AND (t.supplier_id\
    \ = r.supplier_id\n     OR t.case_id IN (SELECT case_id FROM due_diligence_cases c2 WHERE c2.supplier_id = r.supplier_id))) AS open_tasks\nFROM supplier_risk_ratings r JOIN master.suppliers s ON s.supplier_id\
    \ = r.supplier_id\nWHERE ($supplier_id IS NULL OR r.supplier_id = $supplier_id) AND ($country IS NULL OR s.country = $country)\n  AND ($supplier_id IS NOT NULL OR $country IS NOT NULL)\nORDER BY r.supplier_id\n"
  limit: 50
  example:
    supplier_id: SUP-0001
- name: get_supplier_risk_evidence
  desc: Evidence behind a supplier risk rating by category (forced labour, wages, audits, media) with credibility and source, worst first.
  kind: sql
  args:
    supplier_id:
      required: true
    risk_category: {}
  sql: "SELECT\n  e.supplier_id,\n  e.evidence_id,\n  e.risk_category,\n  e.evidence_type,\n  e.description,\n  e.risk_level,\n  e.credibility,\n  e.source,\n  e.found_at,\n  e.updated_at\nFROM risk_evidence\
    \ e\nWHERE e.supplier_id = $supplier_id\n  AND ($risk_category IS NULL OR e.risk_category = $risk_category)\nORDER BY CASE e.risk_level WHEN 'critical' THEN 0 WHEN 'high' THEN 1 WHEN 'medium' THEN 2\
    \ ELSE 3 END,\n         CASE e.credibility WHEN 'highly_verified' THEN 0 WHEN 'verified' THEN 1 WHEN 'partially_verified' THEN 2 ELSE 3 END,\n         e.found_at DESC\n"
  limit: 100
  example:
    supplier_id: SUP-0001
- name: get_supplier_sub_tier_relationships
  desc: Sub-tier links between our suppliers and the suppliers or mills that feed them, with material flow. Filter by downstream supplier, sub-tier supplier or mill factory id.
  kind: sql
  args:
    supplier_id:
      desc: Our downstream supplier, e.g. SUP-0024
    sub_tier_supplier_id:
      type: str
      desc: Upstream sub-tier supplier id, e.g. SUP-0018
    factory_id:
      desc: Upstream mill or factory id, e.g. FAC-0035
  sql: "SELECT s.supplier_id, sup.name AS supplier_name, sup.country AS supplier_country, s.sub_tier_supplier_id, st.name AS sub_tier_supplier_name,\n  s.factory_id, f.name AS factory_name, f.country AS\
    \ factory_country, s.material_flow, s.relationship_type, s.mapped_date\nFROM supplier_sub_tier_relationships s\nJOIN master.suppliers sup ON sup.supplier_id = s.supplier_id\nJOIN master.suppliers st\
    \ ON st.supplier_id = s.sub_tier_supplier_id\nLEFT JOIN master.factories f ON f.factory_id = s.factory_id\nWHERE ($supplier_id IS NULL OR s.supplier_id = $supplier_id) AND ($sub_tier_supplier_id IS\
    \ NULL OR s.sub_tier_supplier_id = $sub_tier_supplier_id)\n  AND ($factory_id IS NULL OR s.factory_id = $factory_id)\n  AND ($supplier_id IS NOT NULL OR $sub_tier_supplier_id IS NOT NULL OR $factory_id\
    \ IS NOT NULL)\nORDER BY s.supplier_id\n"
  limit: 100
  example:
    factory_id: FAC-0035
- name: get_supplier_tier_mapping_by_country
  desc: 'Tier-n supplier map by country: factories, workers and percent mapped per tier. Filter by supplier, supplier home country, sourcing country or tier.'
  kind: sql
  args:
    supplier_id: {}
    supplier_country:
      type: str
      desc: Supplier home country code, e.g. PL
    country:
      type: str
      desc: Country code where the tier operates, e.g. IN
    tier:
      type: int
      desc: Tier level, 1 = direct
  sql: "SELECT t.supplier_id, s.name AS supplier_name, s.country AS supplier_country, t.tier, t.country, t.factory_count, t.worker_count, t.mapped_pct\nFROM tier_mapping_by_country t JOIN master.suppliers\
    \ s ON s.supplier_id = t.supplier_id\nWHERE ($supplier_id IS NULL OR t.supplier_id = $supplier_id) AND ($supplier_country IS NULL OR s.country = $supplier_country)\n  AND ($country IS NULL OR t.country\
    \ = $country) AND ($tier IS NULL OR t.tier = $tier)\n  AND ($supplier_id IS NOT NULL OR $supplier_country IS NOT NULL OR $country IS NOT NULL)\nORDER BY t.supplier_id, t.tier, t.country\n"
  limit: 100
  example:
    supplier_id: SUP-0001
- name: get_supplier_traceability_evidence
  desc: 'Traceability evidence by supplier and material: origin region, evidence type, confidence level and what it lacks. Filter by supplier, material or origin.'
  kind: sql
  args:
    supplier_id: {}
    material:
      type: str
      desc: Material, e.g. cotton or polysilicon
    origin:
      type: str
      desc: Origin region, e.g. Xinjiang
    evidence_type: {}
  sql: "SELECT t.supplier_id, s.name AS supplier_name, t.evidence_id, t.evidence_type, t.material_or_product, t.origin, t.confidence_level, t.notes, t.evidence_date\nFROM supplier_traceability_evidence\
    \ t JOIN master.suppliers s ON s.supplier_id = t.supplier_id\nWHERE ($supplier_id IS NULL OR t.supplier_id = $supplier_id) AND ($material IS NULL OR t.material_or_product ILIKE '%' || $material || '%')\n\
    \  AND ($origin IS NULL OR t.origin ILIKE '%' || $origin || '%') AND ($evidence_type IS NULL OR t.evidence_type = $evidence_type)\n  AND ($supplier_id IS NOT NULL OR $material IS NOT NULL OR $origin\
    \ IS NOT NULL)\nORDER BY CASE t.confidence_level WHEN 'low' THEN 0 WHEN 'medium' THEN 1 WHEN 'high' THEN 2 ELSE 3 END, t.supplier_id, t.evidence_id\n"
  limit: 50
  example:
    supplier_id: SUP-0001
- name: get_supply_chain_map_for_product
  desc: Mapped tiers for a product from the direct factory through mills and fibre source, with country and mapping status.
  kind: sql
  args:
    sku:
      required: true
    tier:
      type: int
      desc: Tier level (1=direct); omit for all
  sql: 'SELECT product_sku, tier, node_id, entity_name, country, factory_id, supplier_id, material_flow, mapping_status, mapped_at

    FROM supply_chain_mapping WHERE product_sku = $sku AND ($tier IS NULL OR tier = $tier) ORDER BY tier, node_id

    '
  limit: 50
  example:
    sku: SKU-103808
- name: get_supply_chain_mapping_gaps
  desc: Unmapped supply chain tiers by region and product category, with annual volume, closing cost, remediation plan and priority, largest first.
  kind: sql
  args:
    product_category:
      type: str
      desc: Product category, e.g. Cotton textiles
    country:
      type: str
      desc: Country code, e.g. CN
    min_priority:
      type: enum
      values:
      - high
      - medium
      - low
      default: low
      desc: Lowest priority to include
  sql: "SELECT gap_id, product_category, tier_level, country, region, unit_volume_annual, est_cost_gbp, gap_reason, remediation_plan, priority\nFROM supply_chain_mapping_gaps\nWHERE ($product_category IS\
    \ NULL OR product_category ILIKE '%' || $product_category || '%') AND ($country IS NULL OR country = $country)\n  AND (CASE $min_priority WHEN 'high' THEN priority = 'high' WHEN 'medium' THEN priority\
    \ IN ('high', 'medium') ELSE true END)\nORDER BY unit_volume_annual DESC\n"
  limit: 100
  example: {}
- name: get_worker_grievance_records
  desc: Worker grievance and hotline records by factory or supplier with category, status and resolution notes, newest first.
  kind: sql
  args:
    factory_id: {}
    supplier_id: {}
    category: {}
    status:
      type: enum
      values:
      - open
      - investigating
      - resolved
      - closed
  sql: "SELECT\n  grievance_id,\n  factory_id,\n  supplier_id,\n  grievance_date,\n  category,\n  description,\n  remediation_status,\n  resolution_notes,\n  updated_at\nFROM worker_grievances\nWHERE ($factory_id\
    \ IS NULL OR factory_id = $factory_id)\n  AND ($supplier_id IS NULL OR supplier_id = $supplier_id)\n  AND ($category IS NULL OR category = $category)\n  AND ($status IS NULL OR remediation_status =\
    \ $status)\nORDER BY grievance_date DESC\n"
  limit: 100
  example:
    supplier_id: SUP-0001
- name: list_required_supplier_documents
  desc: Documents suppliers must supply for due diligence by jurisdiction, with due date and status. Filter by supplier, supplier country, jurisdiction or status.
  kind: sql
  limit: 100
  example:
    supplier_id: SUP-0040
  args:
    supplier_id: {}
    country:
      type: str
      desc: Supplier country code, e.g. PL
    jurisdiction:
      type: str
      desc: EU or UK
    status:
      type: enum
      values:
      - pending
      - received
      - verified
      - expired
      desc: Document status
  sql: "SELECT d.supplier_id, s.name AS supplier_name, d.jurisdiction, d.document_type, d.status, d.required_by_date\nFROM supplier_document_requirements d JOIN master.suppliers s ON s.supplier_id = d.supplier_id\n\
    WHERE ($supplier_id IS NULL OR d.supplier_id = $supplier_id) AND ($country IS NULL OR s.country = $country)\n  AND ($jurisdiction IS NULL OR d.jurisdiction = $jurisdiction) AND ($status IS NULL OR d.status\
    \ = $status)\n  AND ($supplier_id IS NOT NULL OR $country IS NOT NULL)\nORDER BY d.supplier_id, d.jurisdiction, d.document_type\n"
- name: list_suppliers_by_forced_labour_risk
  desc: Suppliers ranked by forced-labour risk (critical first, then most evidence) with rank, country and compliance risk. Use limit for a top-N list.
  kind: sql
  args:
    min_risk_level: *id001
    country:
      type: str
      desc: Supplier country code, e.g. IN
  sql: "SELECT row_number() OVER (ORDER BY (CASE r.forced_labour_risk WHEN 'critical' THEN 3 WHEN 'high' THEN 2 WHEN 'medium' THEN 1 ELSE 0 END) DESC, (SELECT count(*) FROM risk_evidence e WHERE e.supplier_id\
    \ = r.supplier_id AND e.risk_level IN ('high','critical')) DESC, r.supplier_id) AS rank,\n  r.supplier_id, s.name AS supplier_name, s.country, r.forced_labour_risk, r.compliance_risk, r.financial_risk,\
    \ r.overall_risk, r.due_diligence_status,\n  (SELECT count(*) FROM risk_evidence e WHERE e.supplier_id = r.supplier_id AND e.risk_level IN ('high','critical')) AS high_risk_evidence_count\nFROM supplier_risk_ratings\
    \ r\nJOIN master.suppliers s ON s.supplier_id = r.supplier_id\nWHERE ($country IS NULL OR s.country = $country) AND (CASE r.forced_labour_risk WHEN 'critical' THEN 3 WHEN 'high' THEN 2 WHEN 'medium'\
    \ THEN 1 ELSE 0 END) >= (CASE $min_risk_level WHEN 'critical' THEN 3 WHEN 'high' THEN 2 WHEN 'medium' THEN 1 ELSE 0 END)\nORDER BY rank\n"
  limit: 50
  example: {}
- name: run_sanctions_screening
  desc: Sanctions screening results (OFAC, UN, UK, EU) for a supplier or prospective company by id or name, with match status and any action.
  kind: sql
  args:
    entity_id: {}
    entity_name: {}
    sanctions_list:
      values:
      - OFAC
      - UN
      - UK
      - EU
  sql: "SELECT\n  entity_id,\n  screening_id,\n  entity_name,\n  screening_date,\n  sanctions_list,\n  match_status,\n  description,\n  action_taken,\n  updated_at\nFROM sanctions_screening_records\nWHERE\
    \ ($entity_id IS NULL OR entity_id = $entity_id)\n  AND ($entity_name IS NULL OR entity_name ILIKE '%' || $entity_name || '%')\n  AND ($sanctions_list IS NULL OR sanctions_list = $sanctions_list)\n\
    ORDER BY screening_date DESC, CASE match_status WHEN 'confirmed_match' THEN 0 WHEN 'possible_match' THEN 1 ELSE 2 END\n"
  limit: 50
  example:
    entity_name: Sunrise Pack
- name: search_adverse_media
  desc: Search adverse media by keyword, entity id or name, with source, credibility, date and severity, most severe first.
  kind: sql
  args:
    headline:
      type: str
      desc: Keywords in headline or content
    entity_id:
      type: str
      desc: Supplier, factory or prospect id
    entity_name:
      type: str
      desc: Part of the entity name
    source: {}
    severity:
      type: enum
      values:
      - low
      - medium
      - high
      - critical
    date_from:
      type: date
      default: -180d
      desc: Published on or after this date
  sql: "SELECT entity_id, entity_name, record_id, headline, source, credibility, severity, published_date, verified, content\nFROM adverse_media_records\nWHERE ($headline IS NULL OR headline ILIKE '%' ||\
    \ $headline || '%' OR content ILIKE '%' || $headline || '%')\n  AND ($entity_id IS NULL OR entity_id = $entity_id) AND ($entity_name IS NULL OR entity_name ILIKE '%' || $entity_name || '%')\n  AND ($source\
    \ IS NULL OR source = $source) AND ($severity IS NULL OR severity = $severity) AND published_date >= CAST($date_from AS DATE)\nORDER BY CASE severity WHEN 'critical' THEN 0 WHEN 'high' THEN 1 WHEN 'medium'\
    \ THEN 2 ELSE 3 END, published_date DESC\n"
  limit: 50
  example:
    entity_name: Sunrise Pack
