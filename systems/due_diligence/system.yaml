      updated_at:
        type: timestamp
        desc: Last updated
  supply_chain_mapping:
    key:
    - product_sku
    - tier
    - node_id
    cols:
      product_sku:
        type: str
        desc: Product SKU, e.g. SKU-103808
      tier:
        type: int
        desc: Tier level, 1 = direct factory
      node_id:
        type: str
