id: due_diligence
name: Supply Chain Due Diligence Platform
instructions: 'Ethical trade, forced-labour and supply chain compliance for suppliers and factories. Case ids look like CASE-000001. Task ids look like TASK-000001. Use it for supplier risk ratings, due
  diligence cases, ownership and sub-tier mapping, compliance gaps, and worker grievance tracking.

  '
tables:
  due_diligence_cases:
    key: case_id
    cols:
      case_id:
        type: str
        desc: Due diligence case, e.g. CASE-000001
      case_type:
        type: enum
        values:
        - allegation
        - onboarding
        - audit_finding
        - periodic_review
        - escalation
        desc: Case type
      supplier_id:
        type: str
        desc: Supplier, e.g. SUP-0042
      factory_id:
        type: str
        desc: Factory, e.g. FAC-0107
      description:
        type: str
        desc: Allegation or issue summary
      status:
        type: enum
        values:
        - open
        - investigating
        - remediation
        - closed
        desc: Case status
      risk_rating:
        type: enum
        values:
        - low
        - medium
        - high
        - critical
        desc: Overall risk rating
      created_at:
        type: timestamp
        desc: When case was created
      assigned_to:
        type: str
        desc: Employee id
      updated_at:
        type: timestamp
        desc: Last updated
  due_diligence_tasks:
    key: task_id
    cols:
      task_id:
        type: str
        desc: Task, e.g. TASK-000001
      case_id:
        type: str
        desc: Due diligence case
      supplier_id:
        type: str
        desc: Supplier the task concerns
      country:
        type: str
        desc: Country or region the task covers, e.g. IN
      description:
        type: str
        desc: Task description
      task_type:
        type: enum
        values:
        - mapping
        - audit
        - evidence_collection
        - legal_review
        - remediation_plan
        desc: Task type
      status:
        type: enum
        values:
        - open
        - in_progress
        - completed
        - blocked
        desc: Task status
      assigned_to:
        type: str
        desc: Employee id
      due_date:
        type: date
        desc: Task due date
      created_at:
        type: timestamp
        desc: When created
      updated_at:
        type: timestamp
        desc: Last updated
  supplier_risk_ratings:
    key: supplier_id
    cols:
      supplier_id:
        type: str
        desc: Supplier, e.g. SUP-0042
      forced_labour_risk:
        type: enum
        values:
        - low
        - medium
        - high
        - critical
        desc: Forced labour risk
      compliance_risk:
        type: enum
        values:
        - low
        - medium
        - high
        - critical
        desc: Regulatory compliance risk
      financial_risk:
        type: enum
        values:
        - low
        - medium
        - high
        - critical
        desc: Financial/viability risk
      overall_risk:
        type: enum
        values:
        - low
        - medium
        - high
        - critical
        desc: Overall risk rating
      due_diligence_status:
        type: enum
        values:
        - not_started
        - in_progress
        - complete
        - escalated
        desc: DD status
      last_assessed_at:
        type: date
        desc: Date of last full assessment
      next_review_date:
        type: date
        desc: When next review is due
      updated_at:
        type: timestamp
        desc: Last updated
  risk_evidence:
    key:
    - supplier_id
    - evidence_id
    cols:
      supplier_id:
        type: str
        desc: Supplier
      evidence_id:
        type: str
        desc: Evidence record id
      risk_category:
        type: enum
        values:
        - forced_labour
        - child_labour
        - health_safety
        - wages_hours
        - freedom_association
        - grievance_mechanism
        - environmental
        - sanctions
        - adverse_media
        - litigation
        desc: Risk category
      evidence_type:
        type: enum
        values:
        - audit_finding
        - worker_interview
        - grievance_record
        - media_report
        - ngo_report
        - certification
        - test_result
        - document
        desc: Evidence type
      description:
        type: str
        desc: What the evidence shows
      risk_level:
        type: enum
        values:
        - low
        - medium
        - high
        - critical
        desc: Risk level implied
      credibility:
        type: enum
        values:
        - unverified
        - partially_verified
        - verified
        - highly_verified
        desc: How credible is it
      source:
        type: str
        desc: Source of evidence
      found_at:
        type: date
        desc: When this evidence was found
      updated_at:
        type: timestamp
        desc: Last updated
  factory_profiles:
    key: factory_id
    cols:
      factory_id:
        type: str
        desc: Factory, e.g. FAC-0107
      name:
        type: str
        desc: Factory name
      supplier_id:
        type: str
        desc: Supplier that owns/operates it
      country:
        type: str
        desc: ISO country code
      city:
        type: str
        desc: City
      latitude:
        type: float
        desc: Latitude for mapping
      longitude:
        type: float
        desc: Longitude for mapping
      product_types:
        type: str
        desc: Products made, semicolon-separated
      capacity_units_month:
        type: int
        desc: Monthly capacity in units
      workers:
        type: int
        desc: Headcount
      certifications:
        type: str
        desc: Certifications held; semicolon-separated
      last_audit_date:
        type: date
        desc: Last social/quality audit"
      audit_rating:
        type: enum
        values:
        - A
        - B
        - C
        - D
        desc: Last audit rating
      remediation_status:
        type: enum
        values:
        - compliant
        - in_remediation
        - non_compliant
