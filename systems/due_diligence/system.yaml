- name: search_company_registry
  desc: Search company registries by name or id for registration number, registered address, legal form, status and directors. Prospective companies have PSP- ids.
  kind: sql
  args:
    entity_name:
      type: str
      desc: Company name or part of it, e.g. Sunrise Pack
    entity_id:
      type: str
      desc: Supplier id or prospect id
    country:
      type: str
      desc: Registration country code, e.g. CN, HK, VG
  sql: "SELECT entity_id, entity_name, country, registration_number, registry_source, legal_form, registered_address, registration_date, status, directors_info, verified_date\nFROM company_registry\nWHERE\
    \ ($entity_name IS NULL OR entity_name ILIKE '%' || $entity_name || '%') AND ($entity_id IS NULL OR entity_id = $entity_id)\n  AND ($country IS NULL OR country = $country) AND ($entity_name IS NOT NULL\
    \ OR $entity_id IS NOT NULL)\nORDER BY entity_name\n"
  limit: 50
  example:
    entity_name: Sunrise Pack
- name: search_due_diligence_regulation_requirements
  desc: Forced-labour, due-diligence and product-liability requirements by jurisdiction (UK, EU, US, CA), with applicability and penalties for non-compliance.
  kind: sql
  args:
    jurisdiction:
      type: str
      desc: UK, EU, US or CA; omit for all
    topic:
      type: enum
      values:
      - forced_labour
      - due_diligence
      - supply_chain_transparency
      - product_liability
    keyword:
      type: str
      desc: Search term in regulation name or requirement text
  sql: "SELECT requirement_id, jurisdiction, regulation, topic, requirement_text, applicability, effective_date, penalties\nFROM compliance_requirements\nWHERE ($jurisdiction IS NULL OR jurisdiction = $jurisdiction)\
    \ AND ($topic IS NULL OR topic = $topic)\n  AND ($keyword IS NULL OR regulation ILIKE '%' || $keyword || '%' OR requirement_text ILIKE '%' || $keyword || '%')\nORDER BY jurisdiction, requirement_id\n"
  limit: 50
  example:
    jurisdiction: UK
    topic: forced_labour
- name: search_litigation_records
  desc: Litigation records for a supplier or prospective company by id or name, with case type, jurisdiction, status and outcome.
  kind: sql
  args:
    entity_id:
      type: str
      desc: Supplier or prospect id
    entity_name:
      type: str
      desc: Part of the entity name
    case_type:
      type: enum
      values:
      - employment
      - labour
      - environmental
      - criminal
      - commercial
      - other
    jurisdiction:
      type: str
      desc: Country name, e.g. China
    status:
      type: enum
      values:
      - active
      - settled
      - dismissed
      - appealed
      - concluded
  sql: "SELECT entity_id, litigation_case_id, entity_name, case_type, jurisdiction, case_status, description, outcome, case_date\nFROM litigation_records\nWHERE ($entity_id IS NULL OR entity_id = $entity_id)\
    \ AND ($entity_name IS NULL OR entity_name ILIKE '%' || $entity_name || '%')\n  AND ($case_type IS NULL OR case_type = $case_type) AND ($jurisdiction IS NULL OR jurisdiction = $jurisdiction)\n  AND\
    \ ($status IS NULL OR case_status = $status) AND ($entity_id IS NOT NULL OR $entity_name IS NOT NULL)\nORDER BY case_date DESC\n"
  limit: 50
  example:
