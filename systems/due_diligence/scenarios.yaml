# Scenarios for due_diligence system tools
# One entry per question in the brief that uses this system's tools

- question: "05:46:Q2"
  story: >
    An NGO report alleges workers at Tamil Nadu Spinning Mill (FAC-0107), operated by our supplier
    Goodman & Singh Textiles (SUP-0042), are recruited through debt bondage. We've opened case CASE-900001
    with risk_rating critical. We draft an escalation note for legal and leadership review with evidence
    of forced labour, freedom of association violations, and wage issues.
  checks:
    - tool: create_due_diligence_case
      args: {case_type: allegation, supplier_id: SUP-0042, factory_id: FAC-0107, description: "Debt bondage allegation at Tamil Nadu mill"}
      expect: ["CASE-", "allegation", "critical"]
    - tool: get_supplier_risk_evidence
      args: {supplier_id: SUP-0042, risk_category: forced_labour}
      expect: ["NGO report", "debt bondage", "highly_verified"]
    - tool: draft_escalation_note
      args: {case_id: CASE-900001}
      expect: ["INTERNAL ESCALATION", "Tamil Nadu", "critical", "LEGAL OBLIGATIONS"]

- question: "05:46:Q3"
  story: >
    After the audit at Tamil Nadu Spinning Mill (FAC-0107), we need to decide whether to remediate,
    suspend, or exit. We check our share of factory capacity (SUP-0042, FAC-0107), grievance records,
    and worker voice data to assess leverage and whether remediation is viable.
  checks:
    - tool: calculate_supplier_share_of_factory_capacity
      args: {supplier_id: SUP-0042, factory_id: FAC-0107}
      expect: ["our_share_pct", "50000", "formula"]
    - tool: get_worker_grievance_records
      args: {factory_id: FAC-0107}
      expect: ["GRV-", "freedom_association", "wages"]
    - tool: get_factory_profile
      args: {factory_id: FAC-0107}
      expect: ["Tamil Nadu", "320", "in_remediation"]

- question: "05:46:Q4"
  story: >
    We need to understand what forced-labour and due-diligence laws apply in UK, EU, US and Canada,
    and what evidence we have versus what we need. For SUP-0042, we draft a compliance gap list
    showing evidence held, gaps, and priorities by jurisdiction.
  checks:
    - tool: draft_compliance_gap_list
      args: {supplier_id: SUP-0042, jurisdiction: UK}
      expect: ["COMPLIANCE GAP ANALYSIS", "Modern Slavery", "evidence"]
    - tool: get_evidence_inventory_for_due_diligence
      args: {supplier_id: SUP-0042, jurisdiction: UK}
      expect: ["REQ-", "EVIDENCE", "GAP"]

- question: "05:46:Q5"
  story: >
    We want to see forced-labour risk ranked by supplier, the evidence behind each rating,
    and where supply chain mapping has gaps. We identify that TAD (top at-risk depot) suppliers are
    in high-risk countries with incomplete tier-2 visibility, especially in India and Bangladesh.
  checks:
    - tool: list_suppliers_by_forced_labour_risk
      args: {}
      expect: ["SUP-0042", "critical", "high"]
    - tool: get_supplier_risk_evidence
      args: {supplier_id: SUP-0042}
      expect: ["forced_labour", "freedom_association", "credibility"]
    - tool: get_supply_chain_mapping_gaps
      args: {}
      expect: ["GAP-", "tier", "India"]

- question: "04:41:Q1"
  story: >
    We run due diligence on prospective supplier Sunrise Pack Co Ltd (SUP-0150) from Guangdong.
    We search company registry to understand ownership structure, run sanctions screening,
    and look for adverse media. Ownership is unclear (nominee directors); we escalate for legal review.
  checks:
    - tool: get_company_ownership_structure
      args: {supplier_id: SUP-0150}
      expect: ["Sunrise Pack", "Guangdong", "offshore"]
    - tool: run_sanctions_screening
      args: {entity_id: SUP-0150}
      expect: ["no_match", "screening"]
    - tool: search_adverse_media
      args: {entity_name: "Sunrise Pack Co Ltd"}
      expect: ["entity", "media"]

- question: "04:34:Q8"
  story: >
    Sourcing manager asks if nearshoring to EU reduces due-diligence exposure. We check what
    regulatory requirements exist for EU, tier mapping by country for nearshore options, and
    what documents we'd need from suppliers.
  checks:
    - tool: search_due_diligence_regulation_requirements
      args: {jurisdiction: EU}
      expect: ["EU Due Diligence Directive", "requirement"]
    - tool: get_supplier_tier_mapping_by_country
      args: {supplier_id: SUP-0089, country: VN}
      expect: ["tier", "worker_count"]
    - tool: list_required_supplier_documents
      args: {country: EU}
      expect: ["document"]

- question: "06:60:Q7"
  story: >
    R&D materials scientist asks what chain-of-custody evidence we need to claim recycled content,
    and whether our current claims meet the evidence. For SUP-0089, we have fair-trade and organic
    certs; SUP-0042 has expired recycled-content cert.
  checks:
    - tool: get_supplier_chain_of_custody_certificates
      args: {supplier_id: SUP-0089, cert_type: fair_trade}
      expect: ["CERT-", "valid", "fair_trade"]
    - tool: get_supplier_chain_of_custody_certificates
      args: {supplier_id: SUP-0042, cert_type: recycled_content}
      expect: ["CERT-", "expired"]
