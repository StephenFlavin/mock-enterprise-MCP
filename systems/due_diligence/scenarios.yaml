# Scenarios for due_diligence. Stories are planted in gen.py (master ids only; prospective company Sunrise Pack Co. Ltd has PSP- ids).

- question: "02:14:Q6"
  story: >
    Forced-labour import exposure: the four China suppliers rated high or critical are SUP-0001 Brown Textiles, SUP-0027 Arnold Industries
    (polysilicon), SUP-0003 Bishop Apparel and SUP-0057 Hunt Apparel. Their cotton or polysilicon is declared from Xinjiang with low or medium
    traceability confidence.
  checks:
    - tool: get_forced_labour_risk_by_supplier
      args: {country: CN, min_risk_level: high}
      expect: ["Brown Textiles", "Arnold Industries", "Bishop Apparel", "Hunt Apparel", "critical"]
    - tool: get_supplier_traceability_evidence
      args: {origin: Xinjiang}
      expect: ["Polysilicon", "Cotton", "Xinjiang", "low"]

- question: "04:34:Q8"
  story: >
    Nearshore Poland: SUP-0040, SUP-0054 and SUP-0068 are mapped 100% at tier one in Poland but only 10-30% at tier three, where the raw materials
    come from China and India. Due-diligence status is complete, in_progress and not_started. EU CSDDD and the Forced Labour Regulation apply, and
    documents such as the tier 2+ supplier list and ownership disclosure are still pending.
  checks:
    - tool: search_due_diligence_regulation_requirements
      args: {jurisdiction: EU, topic: due_diligence}
      expect: ["Corporate Sustainability Due Diligence Directive", "5%"]
    - tool: get_supplier_tier_mapping_by_country
      args: {supplier_country: PL}
      expect: ["SUP-0068", "100", "CN"]
    - tool: get_supplier_due_diligence_status
      args: {country: PL}
      expect: ["SUP-0040", "complete", "not_started"]
    - tool: list_required_supplier_documents
      args: {country: PL, jurisdiction: EU}
      expect: ["Tier 2+ supplier list", "Ownership disclosure"]

- question: "04:38:Q2"
  story: >
    Regulation table covers UK, EU, US and CA forced-labour, due-diligence, transparency and product-liability laws with penalties
    (CSDDD fines of at least 5% of turnover, UFLPA detention, UK Modern Slavery Act injunction, EU Product Liability Directive strict liability).
  checks:
    - tool: search_due_diligence_regulation_requirements
      args: {jurisdiction: UK}
      expect: ["Modern Slavery Act", "Consumer Protection Act", "injunction"]
    - tool: search_due_diligence_regulation_requirements
      args: {jurisdiction: EU}
      expect: ["Product Liability Directive", "5%"]
    - tool: search_due_diligence_regulation_requirements
      args: {jurisdiction: US}
      expect: ["Uyghur", "detention"]

- question: "04:41:Q1"
  story: >
    Prospective supplier Sunrise Pack Co. Ltd (PSP-0001, Dongguan, Guangdong): registry active; 60% owned by Sunrise Trading (HK) Limited (director Li Jun)
    and 40% by Pearl River Holdings Ltd (BVI) with no beneficial owner disclosed; sanctions clean for the company; one active labour arbitration
    claim; adverse media from a local paper (wastewater fine, medium credibility) and an anonymous forum post (low credibility).
  checks:
    - tool: search_company_registry
      args: {entity_name: Sunrise Pack, country: CN}
      expect: ["PSP-0001", "Dongguan", "active"]
    - tool: get_company_ownership_structure
      args: {entity_id: PSP-0001}
      expect: ["Pearl River Holdings", "NOT DISCLOSED"]
    - tool: run_sanctions_screening
      args: {entity_id: PSP-0001}
      expect: ["no_match", "OFAC"]
    - tool: search_litigation_records
      args: {entity_name: Sunrise Pack}
      expect: ["unpaid overtime", "active"]
    - tool: search_adverse_media
      args: {entity_name: Sunrise Pack}
      expect: ["wastewater", "Anonymous forum post"]

- question: "04:41:Q3"
  story: >
    Sunrise Pack is registered in China but its parent Sunrise Trading (HK) Limited is in Hong Kong with the same director (Li Jun), so a Hong Kong
    account can be legitimate holding-company structure; the BVI 40% shareholder remains opaque.
  checks:
    - tool: search_company_registry
      args: {entity_name: Sunrise}
      expect: ["Sunrise Trading (HK) Limited", "Li Jun", "Dongguan"]
    - tool: get_company_ownership_structure
      args: {entity_name: Sunrise Pack}
      expect: ["60", "Sunrise Trading (HK) Limited", "NOT DISCLOSED"]

- question: "04:41:Q5"
  story: >
    Screening of Sunrise Pack and its shareholders: the company and the HK parent are clean, Pearl River Holdings Ltd has a possible UK-list match
    that cannot be cleared because its beneficial owner is not disclosed.
  checks:
    - tool: run_sanctions_screening
      args: {entity_name: Pearl River}
      expect: ["possible_match", "UK", "beneficial owner not disclosed"]
    - tool: run_sanctions_screening
      args: {entity_name: Sunrise Trading}
      expect: ["no_match"]

- question: "05:43:Q3"
  story: >
    FAC-0087 (SUP-0046 Bennett Apparel, India, audit D): BBC report on forced overtime three weeks ago (high credibility, verified), a union bulletin on
    unpaid wages (medium, unverified) and a year-old anonymous post on child workers (low credibility).
  checks:
    - tool: get_factory_profile
      args: {factory_id: FAC-0087}
      expect: ["Khan Plant 87", "IN", "D", "non_compliant"]
    - tool: search_adverse_media_for_entity
      args: {entity_id: FAC-0087}
      expect: ["BBC", "forced overtime", "Social media post"]

- question: "05:46:Q1"
  story: >
    Critical forced-labour suppliers are SUP-0002, SUP-0001, SUP-0018 and SUP-0027. SUP-0001's evidence centres on Xinjiang cotton. SKU-103808 is mapped
    at tier one only (FAC-0001); tiers two and three are partly or un-mapped. The biggest mapping gap is China (Xinjiang cotton, 240000 units, GBP 85000).
  checks:
    - tool: list_suppliers_by_forced_labour_risk
      args: {min_risk_level: critical}
      expect: ["Harris Manufacturing", "Brown Textiles", "Ali Apparel", "Arnold Industries"]
    - tool: get_supplier_risk_evidence
      args: {supplier_id: SUP-0001}
      expect: ["Xinjiang", "critical", "highly_verified"]
    - tool: get_supply_chain_map_for_product
      args: {sku: SKU-103808}
      expect: ["partially_mapped", "unmapped", "Xinjiang"]
    - tool: get_supply_chain_mapping_gaps
      args: {}
      expect: ["GAP-0001", "Xinjiang", "85000"]
    - tool: get_country_risk_indices
      args: {forced_labour_index: 0.8}
      expect: ["China", "0.85"]

- question: "05:46:Q2"
  story: >
    Allegation of debt bondage at the Tamil Nadu spinning mill FAC-0035 (SUP-0018 Ali Apparel, India). A press article (medium credibility, unverified)
    is corroborated by an NGO report (Southern Workers Rights Forum, high credibility) and an ILO sector report. The mill supplies cotton yarn or fabric
    to SUP-0011, SUP-0024, SUP-0043 and SUP-0046.
  checks:
    - tool: search_adverse_media_for_entity
      args: {entity_id: FAC-0035}
      expect: ["Southern Workers Rights Forum", "International Labour News Network", "ILO"]
    - tool: get_supplier_sub_tier_relationships
      args: {factory_id: FAC-0035}
      expect: ["Walton Homewares", "Bennett Apparel", "Parker Homewares", "Khan Products"]
    - tool: draft_escalation_note
      args: {supplier_id: SUP-0018, factory_id: FAC-0035, summary: Debt bondage alleged at Tamil Nadu spinning mill}
      expect: ["INTERNAL ESCALATION NOTE", "CRITICAL", "Jackson Knitting 35", "Walton Homewares"]
    - tool: create_due_diligence_case
      args: {case_type: allegation, supplier_id: SUP-0018, factory_id: FAC-0035, description: Debt bondage allegation at Tamil Nadu spinning mill, risk_rating: critical}
      expect: ["CASE-", "allegation", "critical"]
    - tool: draft_escalation_note
      args: {case_id: CASE-900001}
      expect: ["CASE-900001", "FAC-0003"]

- question: "05:46:Q3"
  story: >
    FAC-0003 (SUP-0002 Harris Manufacturing, Vietnam): open forced-labour and child-labour grievances, and our share of its capacity is only about 1.4%,
    so leverage is low.
  checks:
    - tool: get_worker_grievance_records
      args: {factory_id: FAC-0003}
      expect: ["forced_labour", "child_labour", "passports"]
    - tool: calculate_supplier_share_of_factory_capacity
      args: {supplier_id: SUP-0002, factory_id: FAC-0003}
      expect: ["1.4", "357000", "low leverage"]

- question: "05:46:Q4"
  story: >
    SUP-0001 holds evidence for only the UK Modern Slavery Act and California Act; the US UFLPA gap is critical because there is no Xinjiang origin audit.
  checks:
    - tool: get_evidence_inventory_for_due_diligence
      args: {supplier_id: SUP-0001}
      expect: ["Uyghur", "No Xinjiang origin audit", "COVERED"]
    - tool: draft_compliance_gap_list
      args: {supplier_id: SUP-0001}
      expect: ["COMPLIANCE GAP ANALYSIS", "Gaps: 7 of 9", "critical"]
    - tool: create_due_diligence_task
      args: {task_type: evidence_collection, description: Obtain Xinjiang origin audit for UFLPA, supplier_id: SUP-0001, due_date: +14d}
      expect: ["TASK-", "evidence_collection", "open"]

- question: "05:46:Q5"
  story: >
    Top 10 riskiest suppliers include SUP-0002 (FAC-0003 grievances on forced labour, child labour, hours), SUP-0001 (FAC-0001 wages, hours, freedom of
    association) and SUP-0018 (FAC-0035 recruitment fees).
  checks:
    - tool: list_suppliers_by_forced_labour_risk
      args: {top_n: 10}
      expect: ["Harris Manufacturing", "Marsden Trading", "10"]
    - tool: get_worker_grievance_records
      args: {supplier_id: SUP-0002}
      expect: ["forced_labour", "child_labour"]
    - tool: get_worker_grievance_records
      args: {supplier_id: SUP-0001}
      expect: ["wages", "freedom_association"]

- question: "05:46:Q7"
  story: Mapping gaps by region show where cotton traceability is weakest (China Xinjiang, India Tamil Nadu).
  checks:
    - tool: get_supply_chain_mapping_gaps
      args: {product_category: Cotton}
      expect: ["Xinjiang", "Tamil Nadu"]

- question: "05:50:Q3"
  story: Adverse media for supplier SUP-0002 (debt bondage report) is available by entity id with severity.
  checks:
    - tool: search_adverse_media_for_entity
      args: {entity_id: SUP-0002}
      expect: ["Fair Labor Association", "high"]

- question: "06:60:Q7"
  story: >
    SUP-0002 has valid fair-trade and organic certificates; SUP-0001 has an expired recycled-content certificate.
  checks:
    - tool: get_supplier_chain_of_custody_certificates
      args: {supplier_id: SUP-0002, cert_type: fair_trade}
      expect: ["CERT-900002", "fair_trade", "VALID"]
    - tool: get_supplier_chain_of_custody_certificates
      args: {supplier_id: SUP-0001, cert_type: recycled_content}
      expect: ["CERT-900001", "EXPIRED"]
