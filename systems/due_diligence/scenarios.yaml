# Scenarios for due_diligence system tools
# One entry per question in the brief that uses this system's tools

- question: "05:46:Q2"
  story: >
    An NGO report alleges workers at Law Knitting Mill (FAC-0001), operated by our supplier
    Brown Textiles (SUP-0001), are recruited through debt bondage. We've opened case CASE-900001
    with risk_rating critical. We draft an escalation note for legal and leadership review with evidence
    of forced labour, freedom of association violations, and wage issues.
  checks:
    - tool: create_due_diligence_case
      args: {case_type: allegation, supplier_id: SUP-0001, factory_id: FAC-0001, description: "Debt bondage allegation at spinning mill", risk_rating: critical}
      expect: ["CASE-", "allegation", "critical"]
    - tool: get_supplier_risk_evidence
      args: {supplier_id: SUP-0001, risk_category: forced_labour}
      expect: ["NGO report", "debt bondage", "highly_verified"]
    - tool: draft_escalation_note
      args: {case_id: CASE-900001}
      expect: ["INTERNAL ESCALATION", "critical", "LEGAL OBLIGATIONS"]

- question: "05:46:Q3"
  story: >
    After the audit at Law Knitting Mill (FAC-0001), we need to decide whether to remediate,
    suspend, or exit. We check our share of factory capacity (SUP-0001, FAC-0001) and factory profile
    to assess leverage and remediation viability.
  checks:
    - tool: calculate_supplier_share_of_factory_capacity
      args: {supplier_id: SUP-0001, factory_id: FAC-0001}
      expect: ["our_share_pct", "formula"]
    - tool: get_factory_profile
      args: {factory_id: FAC-0001}
      expect: ["Tiruppur", "320", "in_remediation"]

- question: "05:46:Q4"
  story: >
    We need to understand what forced-labour and due-diligence laws apply in UK, EU, US and Canada,
    and what evidence we have versus what we need. For SUP-0001, we draft a compliance gap list
    showing evidence held, gaps, and priorities by jurisdiction.
  checks:
    - tool: draft_compliance_gap_list
      args: {supplier_id: SUP-0001, jurisdiction: UK}
      expect: ["COMPLIANCE GAP ANALYSIS", "Modern Slavery", "evidence"]
    - tool: get_evidence_inventory_for_due_diligence
      args: {supplier_id: SUP-0001, jurisdiction: UK}
      expect: ["REQ-", "EVIDENCE", "GAP"]

- question: "05:46:Q5"
  story: >
    We want to see forced-labour risk by supplier with evidence and country context.
    Top at-risk suppliers in high-risk countries are identified.
  checks:
    - tool: get_forced_labour_risk_by_supplier
      args: {}
      expect: ["SUP-", "critical"]
    - tool: get_supplier_risk_evidence
      args: {supplier_id: SUP-0001}
      expect: ["forced_labour", "freedom_association", "credibility"]
    - tool: get_country_risk_indices
      args: {country: IN}
      expect: ["India", "forced_labour_index"]

- question: "04:41:Q1"
  story: >
    We run due diligence on prospective supplier Bishop Apparel (SUP-0003) from China.
    We understand ownership structure; it shows nominee directors with unclear beneficial ownership,
    so we escalate for legal review.
  checks:
    - tool: get_company_ownership_structure
      args: {supplier_id: SUP-0003}
      expect: ["Bishop Apparel", "China"]
    - tool: get_supplier_due_diligence_status
      args: {supplier_id: SUP-0003}
      expect: ["SUP-0003"]

- question: "05:46:Q1"
  story: >
    We analyze where forced-labour risk is highest and check sub-tier relationships for supplier SUP-0001,
    which has critical forced labour risk. The supplier has raw material and component links to
    sub-tier suppliers.
  checks:
    - tool: get_forced_labour_risk_by_supplier
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001", "critical"]
    - tool: get_supplier_sub_tier_relationships
      args: {supplier_id: SUP-0001}
      expect: ["cotton", "raw_material"]

- question: "06:60:Q7"
  story: >
    R&D materials scientist asks what chain-of-custody evidence we need to claim recycled content.
    We check our suppliers' certificates. SUP-0002 has valid fair-trade and organic certs.
    SUP-0001 has an expired recycled-content cert.
  checks:
    - tool: get_supplier_chain_of_custody_certificates
      args: {supplier_id: SUP-0002, cert_type: fair_trade}
      expect: ["CERT-", "valid", "fair_trade"]
    - tool: get_supplier_chain_of_custody_certificates
      args: {supplier_id: SUP-0001, cert_type: recycled_content}
      expect: ["CERT-", "expired"]

- question: "02:14:Q6"
  story: >
    We need to identify forced labour risks for suppliers who provide cotton and polysilicon products.
    We check suppliers SUP-0001 and SUP-0002 for forced labour risk, and we collect traceability evidence
    from SUP-0001 showing cotton origin from India and some evidence gaps.
  checks:
    - tool: get_forced_labour_risk_by_supplier
      args: {}
      expect: ["critical", "forced_labour"]
    - tool: get_supplier_traceability_evidence
      args: {supplier_id: SUP-0001}
      expect: ["Cotton", "confidence_level"]

- question: "04:34:Q8"
  story: >
    Sourcing asks whether nearshoring to Eastern Europe reduces compliance exposure. We check the
    required regulations in UK and EU jurisdictions, tier mapping for SUP-0001 in Poland (EU),
    due diligence status, and required documents for compliance.
  checks:
    - tool: search_due_diligence_regulation_requirements
      args: {jurisdiction: EU, topic: due_diligence}
      expect: ["Due Diligence Directive", "EU"]
    - tool: get_supplier_tier_mapping_by_country
      args: {supplier_id: SUP-0001}
      expect: ["factory_count", "mapped_pct"]
    - tool: get_supplier_due_diligence_status
      args: {supplier_id: SUP-0001}
      expect: ["SUP-0001", "due_diligence_status"]
    - tool: list_required_supplier_documents
      args: {supplier_id: SUP-0001, jurisdiction: EU}
      expect: ["DREQ-", "document_type"]

- question: "04:38:Q2"
  story: >
    Legal counsel needs to understand forced labour and due diligence laws in UK, EU, US and Canada
    for contract updates. We search for regulation requirements by jurisdiction and topic.
  checks:
    - tool: search_due_diligence_regulation_requirements
      args: {jurisdiction: UK, topic: forced_labour}
      expect: ["Modern Slavery", "UK"]
    - tool: search_due_diligence_regulation_requirements
      args: {jurisdiction: US, topic: forced_labour}
      expect: ["forced_labour", "US"]

- question: "04:41:Q1"
  story: >
    We run due diligence on prospective supplier "Bishop Apparel" from Guangdong, China. We check
    company registry for Bishop Apparel (registration CHN-1234), ownership structure, run sanctions
    screening against OFAC/UN lists (clean result), search litigation records (no active cases), and
    search adverse media (no high-severity reports found).
  checks:
    - tool: search_company_registry
      args: {entity_name: "Bishop Apparel", country: CN}
      expect: ["Bishop Apparel", "CN"]
    - tool: get_company_ownership_structure
      args: {supplier_id: SUP-0003}
      expect: ["beneficial_owner"]
    - tool: run_sanctions_screening
      args: {entity_name: "Bishop Apparel"}
      expect: ["no_match", "screening"]
    - tool: search_litigation_records
      args: {entity_name: "Bishop Apparel"}
      expect: ["case"]
    - tool: search_adverse_media
      args: {headline: labour}
      expect: ["headline", "source"]

- question: "04:41:Q3"
  story: >
    We investigate whether a supplier's bank account country differs from registration address,
    a risk flag for beneficial ownership opacity. We search company registry for registration details
    and check ownership structure for SUP-0003.
  checks:
    - tool: search_company_registry
      args: {entity_name: "Bishop Apparel"}
      expect: ["registration_number", "country"]
    - tool: get_company_ownership_structure
      args: {supplier_id: SUP-0003}
      expect: ["country", "beneficial_owner"]

- question: "04:41:Q5"
  story: >
    Before onboarding a new supplier, we run sanctions screening to ensure they're not on restricted
    lists. Supplier passes screening against OFAC, UN, UK, and EU lists (no confirmed matches).
  checks:
    - tool: run_sanctions_screening
      args: {entity_name: "Brown Textiles"}
      expect: ["screening", "no_match"]

- question: "05:43:Q3"
  story: >
    Factory auditor wants to know if there's adverse media about Law Knitting Mill (FAC-0001).
    We retrieve factory profile showing location and workforce, then search adverse media for the factory
    and find news reports about forced labour allegations and union concerns.
  checks:
    - tool: get_factory_profile
      args: {factory_id: FAC-0001}
      expect: ["workers", "certifications"]
    - tool: search_adverse_media_for_entity
      args: {entity_id: FAC-0001, entity_type: factory}
      expect: ["headline", "published_date"]

- question: "05:46:Q1"
  story: >
    Ethical trade manager wants to see where forced-labour risk is highest across suppliers and tiers.
    We list suppliers ranked by forced labour risk (critical and high), with evidence counts.
    We check sub-tier links for SUP-0001. We map cotton products by tier to see supply chain visibility
    gaps in Vietnam and India regions.
  checks:
    - tool: list_suppliers_by_forced_labour_risk
      args: {}
      expect: ["forced_labour_risk", "SUP-"]
    - tool: get_supplier_risk_evidence
      args: {supplier_id: SUP-0001}
      expect: ["evidence", "credibility"]
    - tool: get_supply_chain_map_for_product
      args: {sku: PF-220}
      expect: ["tier", "mapped"]
    - tool: get_supply_chain_mapping_gaps
      args: {}
      expect: ["gap_id", "priority"]
    - tool: get_country_risk_indices
      args: {country: IN}
      expect: ["India", "forced_labour_index"]

- question: "05:46:Q7"
  story: >
    Supply chain team wants to understand which product categories and regions have mapping gaps.
    We query supply chain mapping gaps by product type and identify textile tier-2 suppliers in
    Vietnam and India as priority gaps requiring field mapping.
  checks:
    - tool: get_supply_chain_mapping_gaps
      args: {}
      expect: ["gap_id", "remediation_plan"]

- question: "05:50:Q3"
  story: >
    Supply chain risk analyst evaluates sole-source suppliers for business continuity risk.
    We search adverse media for high-risk suppliers to identify reputational/operational risks,
    then calculate supplier failure impact.
  checks:
    - tool: search_adverse_media_for_entity
      args: {}
      expect: ["entity_id", "severity"]

- question: "05:46:QX"
  story: >
    Test creating a task to map cotton suppliers in a region. We create task for mapping
    with due date in 14 days.
  checks:
    - tool: create_due_diligence_task
      args: {task_type: mapping, description: "Map cotton suppliers for India region", due_date: "+14d"}
      expect: ["TASK-", "mapping", "open"]
