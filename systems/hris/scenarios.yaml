# One entry per question row that uses this system's tools (see: python -m mockmcp brief hris).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "01:6:Q3"
  story: >
    The brief analyzes shift patterns for overtime vs late shift options. The attrition_by_shift_pattern
    tool shows that night shift workers have a 45% annual turnover rate (10 leavers from 22 active employees),
    predominantly due to pay gaps and shift pattern preferences. Early shift shows 28% turnover (8 leavers from 28 active).
    This data supports the recommendation around retention impacts of the shift decision.
  checks:
    - tool: get_attrition_by_shift_pattern
      args: {date_from: "-365d"}
      expect: ["night", "leavers", "avg_tenure_months"]

- question: "09:87:Q6"
  story: >
    The COO asks about comparable retailer structures. The org_structure tool shows our setup by department:
    Logistics (85 active), Stores Operations (120 active), Buying (45 active), Finance (35 active), etc.
    This provides baseline headcount by function for comparison with external benchmarks.
  checks:
    - tool: get_org_structure
      args: {}
      expect: ["department", "headcount", "active_count"]

- question: "09:88:Q2"
  story: >
    Daventry (DC2) productivity is low. The site_management_structure tool shows the management team at DC2
    has 5 managers with an average team span of 18 people and varying tenure (1 new manager, 3 mid-tenure).
    One manager has managed for only 2 months, suggesting possible leadership transitions affecting productivity.
  checks:
    - tool: get_site_management_structure
      args: {site_id: DC2}
      expect: ["manager", "team_size", "manager_tenure_years"]

- question: "09:88:Q4"
  story: >
    The COO needs capacity planning. Current headcount by site and shift at DC1 shows 85 active
    (35 early, 30 late, 20 night); DC2 shows 95 active (40 early, 35 late, 20 night); DC3 shows 72 active.
    A requisition for 20 night-shift operatives at DC1 is created for 2026-11-01 to cover peak demand.
  checks:
    - tool: get_current_headcount_by_site_and_skill
      args: {site_id: DC1}
      expect: ["site_id", "shift", "headcount"]
    - tool: create_headcount_requisition
      args: {site_id: DC1, role: "Warehouse Operative", headcount: 20, employment_type: permanent, shift: night, required_by: "+28d"}
      expect: ["REQ-", "draft", "20"]

- question: "09:89:Q1"
  story: >
    The workforce planner needs headcount by skill for peak planning. Current headcount shows DC1 has
    18 forklift-certified operatives (12 intermediate, 6 expert) and 22 CSCS-certified. A requisition is
    created for 15 additional pickers at DC2 needed by early November for peak demand.
  checks:
    - tool: get_current_headcount_by_site_and_skill
      args: {site_id: DC2, skill: forklift}
      expect: ["headcount"]
    - tool: create_headcount_requisition
      args: {site_id: DC2, role: "Picker", headcount: 15, employment_type: agency, shift: late}
      expect: ["REQ-", "draft"]

- question: "09:89:Q2"
  story: >
    Corby (DC2) turnover is 45% annually (14 leavers from ~30 active employees), vs 28% elsewhere (8 leavers from ~28 elsewhere).
    Exit interview themes show: Pay (50% mention), Commute distance (36%), Management style (21%), Overtime expectations (14%).
    Market rates show our Warehouse Operative rate is £12.50/hr vs market rate of £14.20/hr (88% of market, 12% gap).
    Site management structure shows 5 managers, 1 new (2 months tenure). Commute analysis shows 60% of DC2 employees
    commute 25+ km, compared to 35% at DC1. A pay review request is logged for night-shift operatives citing 45% turnover.
  checks:
    - tool: get_site_turnover_by_cohort
      args: {site_id: DC2}
      expect: ["DC2", "leavers", "tenure_band"]
    - tool: get_exit_interview_themes
      args: {site_id: DC2, date_from: "-180d"}
      expect: ["Pay", "Commute", "exit_reason"]
    - tool: get_pay_rates_vs_market
      args: {site_id: DC2, role: "Warehouse Operative"}
      expect: ["DC2", "12.50", "14.20"]
    - tool: get_site_management_structure
      args: {site_id: DC2}
      expect: ["DC2", "manager", "team_size"]
    - tool: get_employee_commute_distances
      args: {site_id: DC2}
      expect: ["DC2", "distance_km"]
    - tool: create_pay_review_request
      args: {site_id: DC2, role: "Warehouse Operative", shift: night, reason: "Turnover 45% vs 28% elsewhere; market rate gap 12%"}
      expect: ["PRR-", "submitted"]

- question: "09:89:Q3"
  story: >
    The planner reviews market pay rates across regions. DC2 (Corby) shows the widest gap at 12%
    (our £12.50 vs market £14.20), while DC1 shows only 3.8% gap. This indicates DC2 is least competitive
    in the labour market, explaining the higher turnover observed in question 09:89:Q2.
  checks:
    - tool: get_pay_rates_vs_market
      args: {}
      expect: ["site_id", "role", "gap_pct"]

- question: "09:89:Q4"
  story: >
    The planner compares labour options. Retention by labour type shows: permanent staff average 18.5 months
    tenure with 8% very-early-leaver rate (< 3 months); agency staff average 5.2 months tenure with 22%
    very-early-leaver rate; temporary staff average 3.8 months tenure with 35% very-early-leaver rate.
    This informs the hire vs agency trade-off analysis.
  checks:
    - tool: get_retention_by_labour_type
      args: {}
      expect: ["employment_type", "avg_tenure_months"]

- question: "09:89:Q5"
  story: >
    The workforce planner sets up a weekly report. Attrition by site and shift shows DC2 night shift at highest
    risk (8 leavers in 12 months from 20 employees = 40% annualized). Absence data shows average 6.2 hours/month
    per employee in sickness; DC2 night shift shows 8.1 hours/month. Exit interview themes confirm pay and
    commute as top reasons. The planner creates a report dashboard showing these metrics.
  checks:
    - tool: get_attrition_by_site_and_shift
      args: {site_id: DC2, shift_pattern: night}
      expect: ["DC2", "leavers", "tenure_band"]
    - tool: get_absence_rate_by_site_and_shift
      args: {site_id: DC2, shift_pattern: night, date_from: "-90d"}
      expect: ["DC2", "absence_count"]
    - tool: get_exit_interview_themes
      args: {site_id: DC2, date_from: "-180d"}
      expect: ["exit_reason", "count"]
