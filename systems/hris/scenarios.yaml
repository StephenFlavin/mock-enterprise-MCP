# One entry per question row that uses this system's tools (see: python -m mockmcp brief hris).
# Story: DC2 (Daventry) has ~45% annual turnover against ~28% at the other DCs, worst on nights (63%). Pay is the
# most-cited exit theme (night market gap 12%), then management (late shift manager left, early manager is agency),
# commute (night staff avg 38 km) and shift pattern. DC2 unplanned absence is about double the other sites.
# Corby is DC6 (a 3PL overflow DC with no employees in master data), so the Corby workforce questions are answered for DC2 Daventry and named as such.

- question: "01:6:Q3"
  story: >
    Night shift has the highest turnover across the DCs (41% against 27% on early), and agency leavers on nights
    stay about three months, nearly all leaving within six months.
  checks:
    - tool: get_attrition_by_shift_pattern
      args: {date_from: "-365d"}
      expect: ["night", "41.2", "26.9", "3.3"]

- question: "09:87:Q6"
  story: >
    The supply chain function is Logistics (DCs, 210 people), Planning 14, Sourcing 7, Quality 6, plus the
    Supply Chain Director and COO.
  checks:
    - tool: get_org_structure
      args: {function: Supply Chain}
      expect: ["Logistics", "210", "Planning", "Sourcing", "Quality"]

- question: "09:88:Q2"
  story: >
    DC2 management is thin: the early shift manager is agency cover (EMP-00182), the late shift manager EMP-00201
    has left with 18 people still reporting to him and an open requisition (REQ-900004), and the night manager
    EMP-00220 has 18 reports.
  checks:
    - tool: get_site_management_structure
      args: {site_id: DC2}
      expect: ["EMP-00182", "agency", "EMP-00201", "REQ-900004", "Manager has left"]

- question: "09:88:Q4"
  story: >
    DC2 has a 45 FTE night requisition (REQ-900002) against 19 night staff, only 3 of them forklift certified.
    Requisitions created for the first tranche are stored complete with created date and status.
  checks:
    - tool: get_current_headcount_by_site_and_skill
      args: {site_id: DC2, skill: forklift}
      expect: ["night", "19", "38"]
    - tool: create_headcount_requisition
      args: {site_id: DC2, role: Picker/Packer, headcount: 12, shift: night, required_by: "+28d"}
      expect: ["REQ-", "draft", "permanent"]

- question: "09:89:Q1"
  story: >
    Current DC2 headcount is 55 on shifts (18 early, 18 late, 19 night) with forklift certification held by 3, 5
    and 3 people respectively.
  checks:
    - tool: get_current_headcount_by_site_and_skill
      args: {site_id: DC2}
      expect: ["forklift certification", "manual handling", "RF scanning (WMS)", "19"]

- question: "09:89:Q2"
  story: >
    DC2 turnover is 45.5% (night 63%), with <6 month leavers on nights under EMP-00220. Exit interviews cite pay
    most (59%), then management; night pay is 12% below market; night staff commute 38 km on average against 15 km
    elsewhere. A pay review request can be logged for the night shift.
  checks:
    - tool: get_site_turnover_by_cohort
      args: {site_id: DC2}
      expect: ["EMP-00220", "<6 months", "45.5"]
    - tool: get_exit_interview_themes
      args: {site_id: DC2}
      expect: ["Pay", "58.8", "Management", "Commute distance"]
    - tool: get_pay_rates_vs_market
      args: {site_id: DC2, shift: night}
      expect: ["Picker/Packer", "14.6", "16.6", "-12"]
    - tool: get_employee_commute_distances
      args: {site_id: DC2}
      expect: ["night", "37.9", "89.5"]
    - tool: create_pay_review_request
      args: {site_id: DC2, role: Picker/Packer, shift: night, reason: Market rate gap and high turnover}
      expect: ["PRR-", "submitted"]

- question: "09:89:Q3"
  story: >
    Picker/Packer pay is 12% below market on DC2 nights (14.60 against 16.60), 3% below at Northampton and
    about at market at Leeds.
  checks:
    - tool: get_pay_rates_vs_market
      args: {role: Picker/Packer}
      expect: ["DC2", "UK Midlands", "UK North", "-12", "16.6"]

- question: "09:89:Q4"
  story: >
    Agency leavers stay 3.5 months on average and 93% leave within six months, against 47 months for permanent
    direct hires and 37 months for referrals.
  checks:
    - tool: get_retention_by_labour_type
      args: {}
      expect: ["agency", "93.3", "referral", "37.1"]

- question: "09:89:Q5"
  story: >
    DC2 is the outlier on both turnover (45.5%, night 63%) and unplanned absence (night 7.8% against about 3%
    elsewhere); leavers cite pay first.
  checks:
    - tool: get_attrition_by_site_and_shift
      args: {}
      expect: ["DC2", "63.2", "45.5"]
    - tool: get_absence_rate_by_site_and_shift
      args: {}
      expect: ["DC2", "7.8", "6.4"]
    - tool: get_exit_interview_themes
      args: {site_id: DC2}
      expect: ["Pay", "58.8"]
