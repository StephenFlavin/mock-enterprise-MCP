- question: "09:81:Q1"
  story: >
    OTIF_daily checks show the data changed under the metric: the OTIF definition was tightened from 1 September with no
    grace day and 100% in-full (PCH-900002, consistency fails at 91 vs 98; same change as kb), ASN data arrives 8 hours late and PO_ID completeness fell
    to 92. Baseline checks from several weeks earlier all passed, so the drop is partly a measurement change.
  checks:
    - tool: run_data_quality_checks
      args: {dataset: OTIF_daily}
      expect: ["CHK-900001", "92", "grace day", "8 hours", "FAILED"]
    - tool: run_data_quality_checks
      args: {dataset: ASN_feed, check_type: completeness}
      expect: ["CHK-900004", "78", "Supplier master gaps"]

- question: "09:81:Q6"
  story: >
    Seven story issues plus generated low/medium noise. By severity then age the top three unresolved are DQI-900003
    (demand_forecast, critical, reopened 3 times), DQI-900007 (cost_centre_actuals, critical) and DQI-900002 (ASN_feed,
    high, reopened twice). Recurrence history shows the reopen timeline. Tickets and reassignment write complete rows.
  checks:
    - tool: list_data_quality_issues
      args: {}
      expect: ["DQI-900003", "DQI-900007", "DQI-900002", "critical", "EMP-00098"]
    - tool: list_data_quality_issues
      args: {min_reopens: 2}
      expect: ["DQI-900003", "DQI-900002"]
    - tool: get_issue_recurrence_history
      args: {issue_id: DQI-900003}
      expect: ["demand_forecast", "reopened", "Planners overriding forecasts"]
    - tool: create_data_quality_ticket
      args: {dataset: cost_centre_actuals, severity: critical, description: "Invalid cost centre codes", owner: EMP-00085}
      expect: ["DQI-900008", "EMP-00085"]
    - tool: reassign_data_quality_issue
      args: {issue_id: DQI-900003, owner: EMP-00097}
      expect: ["EMP-00097", "assigned"]

- question: "09:82:Q2"
  story: >
    About thirteen weeks ago a schema change (PCH-900001) removed the category field from the demand model features,
    which is when forecast accuracy started falling; DQI-900003 and the demand_forecast checks show the drift.
  checks:
    - tool: list_pipeline_and_schema_changes
      args: {dataset: demand_forecast}
      expect: ["PCH-900001", "schema", "category field"]
    - tool: run_data_quality_checks
      args: {dataset: demand_forecast}
      expect: ["CHK-900008", "Category feature no longer populated"]

- question: "09:90:Q2"
  story: >
    Two migration objects are blocked on source data quality: purchase_orders MIG-900001 (78.3, missing PO status
    mapping, 477 failing records) and suppliers MIG-900005 (75.7, consolidation mapping incomplete).
  checks:
    - tool: get_data_quality_scores_for_migration_objects
      args: {status: blocked}
      expect: ["MIG-900001", "78.3", "MIG-900005", "75.7", "consolidation mapping"]
    - tool: get_data_quality_scores_for_migration_objects
      args: {object_type: purchase_orders}
      expect: ["477", "PO status mapping", "EMP-00057"]
