# Treasury test scenarios - one per question row in the brief
- question: "04:39:Q2"
  story: >
    Raw materials buyer needs to decide on hedging 60% of next year's cotton requirement (4,200 tonnes).
    Seed data includes a cotton forward hedge proposal at 0.76/unit (HDG-900001) and a historical
    outcome showing a similar hedge in AW26 (HOU-900003) gained 630k GBP (4% better than spot).
    Forecast shows adequate cash position to support hedging costs.
  checks:
    - tool: get_cash_position_forecast
      args: {}
      expect: ["adequate", "headroom"]
    - tool: get_historic_hedging_outcomes
      args: {underlying_type: commodity}
      expect: ["cotton", "HOU-900003", "4%"]
    - tool: calculate_hedge_scenarios
      args: {underlying_type: commodity, commodity: cotton, notional_amount: 4200}
      expect: ["Forward hedge", "Option"]

- question: "07:66:Q1"
  story: >
    FX analyst checks 12-month net exposure by currency. Seed data includes bank accounts and
    forecasts denominated in GBP and references to historical USD and EUR hedges (HOU-900001, HOU-900002).
    The analyst can see exposure profile and identify hedging gaps.
  checks:
    - tool: get_forecast_cash_flows_by_currency
      args: {}
      expect: ["GBP", "net_exposure"]
    - tool: get_historic_hedging_outcomes
      args: {underlying_type: fx_forward}
      expect: ["GBP/USD", "GBP/EUR"]
    - tool: get_debt_facilities_and_headroom
      args: {}
      expect: ["maturity_date", "undrawn"]

- question: "07:66:Q3"
  story: >
    Treasury evaluates raising USD hedge ratio from 60% to 80%. Hedge request HDG-900002 shows
    80% hedge on $2m USD exposure at forward rate 1.27. Covenant headroom (FAC-900001 at 28.5%)
    is solid, allowing for hedge cost.
  checks:
    - tool: calculate_hedge_scenarios
      args: {underlying_type: fx_forward, currency_pair: GBP/USD, notional_amount: 2000000, forward_rate_or_price: 1.27}
      expect: ["Forward hedge", "Option", "Cost"]
    - tool: get_debt_facilities_and_covenants
      args: {}
      expect: ["FAC-900001", "compliant"]

- question: "07:66:Q5"
  story: >
    Liquidity manager checks 13-week cash forecast headroom. FOR-900001 forecast shows adequate
    closing balances across all weeks, with lowest point at week 5 (29.6m GBP, well above minimum 5m).
    Peak week is week 10 (44.6m) with dividend payment impact at week 11 (drops to 37.6m but still adequate).
  checks:
    - tool: get_13_week_cash_forecast
      args: {forecast_id: FOR-900001}
      expect: ["week_no", "closing_balance"]
    - tool: get_bank_balances
      args: {}
      expect: ["available_balance", "facility_limit"]
    - tool: get_debt_facilities_and_headroom
      args: {}
      expect: ["undrawn_pct"]

- question: "07:70:Q2"
  story: >
    CFO analyzes downside/base/upside scenarios over 18 months. FAC-900001 (term loan) has 28.5%
    headroom to leverage covenant of 3.0x. Forecast shows 26-week trajectory with risks at dividend
    payment (week 11, £5m) and debt repayment (week 10, £2m). Create alert at 15% headroom threshold.
    Downside scenario halves headroom to ~14%, triggering warning.
  checks:
    - tool: get_cash_flow_forecast_18_months
      args: {}
      expect: ["closing_balance", "drawn_amount", "undrawn"]
    - tool: get_debt_facilities_and_covenants
      args: {}
      expect: ["Leverage", "compliant", "28.5"]
    - tool: get_dividend_policy_and_schedule
      args: {}
      expect: ["payment_date", "amount_gbp"]
    - tool: calculate_covenant_headroom
      args: {facility_id: FAC-900001, scenario: base}
      expect: ["headroom_pct", "compliant"]
    - tool: calculate_covenant_headroom
      args: {facility_id: FAC-900001, scenario: downside}
      expect: ["watch"]
    - tool: create_covenant_alert
      args: {facility_id: FAC-900001, alert_type: headroom_threshold, threshold_pct: 15}
      expect: ["ALT-", "active"]
