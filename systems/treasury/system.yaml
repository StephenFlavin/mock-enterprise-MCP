id: treasury
name: Treasury Management System
instructions: >
  Cash forecasting, debt facilities, covenant management and hedging decisions for Harbour & Vale.
  Covers 13-week and 18-month cash positions, debt facility terms, dividend policy and FX/commodity
  hedging. Use for liquidity management, covenant headroom and strategic hedging decisions.

tables:
  cash_forecasts:
    key: [forecast_date, forecast_id]
    cols:
      forecast_id: {type: str, desc: "Unique forecast run id, e.g. FOR-900001"}
      forecast_date: {type: date, desc: Date of this forecast entry}
      week_no: {type: int, desc: "Week number (1=earliest, 13=latest for 13-week forecast)"}
      entity_id: {type: str, desc: Legal entity}
      currency: {type: str, desc: "Currency, e.g. GBP"}
      opening_balance_gbp: {type: float, desc: Opening cash balance for the week in GBP}
      operating_inflows_gbp: {type: float, desc: Expected operating inflows in GBP}
      operating_outflows_gbp: {type: float, desc: Expected operating outflows in GBP}
      capex_gbp: {type: float, desc: Planned capital expenditure in GBP}
      dividend_payment_gbp: {type: float, desc: Planned dividend payments in GBP}
      debt_repayment_gbp: {type: float, desc: Planned debt repayments in GBP}
      closing_balance_gbp: {type: float, desc: Closing balance after all movements in GBP}
      created_at: {type: timestamp, desc: When this forecast was created}

  bank_accounts:
    key: account_id
    cols:
      account_id: {type: str, desc: "Bank account, e.g. ACC-900001"}
      entity_id: {type: str, desc: Legal entity}
      account_type: {type: enum, values: [operating, investment, overdraft, loan], desc: Account type}
      currency: {type: str, desc: Account currency}
      available_balance_gbp: {type: float, desc: Available balance in GBP equivalent}
      held_balance_gbp: {type: float, desc: Held/reserved balance in GBP equivalent}
      facility_limit_gbp: {type: float, desc: Facility limit in GBP}
      bank_name: {type: str, desc: Bank name}
      last_updated: {type: timestamp, desc: When balance was last refreshed}

  debt_facilities:
    key: facility_id
    cols:
      facility_id: {type: str, desc: "Debt facility, e.g. FAC-900001"}
      entity_id: {type: str, desc: Legal entity}
      facility_type: {type: enum, values: [term_loan, revolving_credit, bond, acquisition_facility, other], desc: Facility type}
      lender: {type: str, desc: Lender name}
      currency: {type: str, desc: Facility currency}
      total_facility_gbp: {type: float, desc: Total facility size in GBP}
      drawn_amount_gbp: {type: float, desc: Currently drawn amount in GBP}
      undrawn_amount_gbp: {type: float, desc: Undrawn capacity in GBP}
      start_date: {type: date, desc: Facility start date}
      maturity_date: {type: date, desc: Maturity date}
      interest_rate_pct: {type: float, desc: Interest rate in percent per annum}
      financial_covenant: {type: str, desc: "e.g. Leverage ratio < 3.0x, Interest coverage > 2.0x"}
      covenant_test_date: {type: date, desc: Last covenant test date}
      covenant_status: {type: enum, values: [compliant, at_risk, breached, untested], desc: Covenant compliance status}
      covenant_headroom_pct: {type: float, desc: Estimated headroom to covenant breach in percent}

  dividends:
    key: dividend_id
    cols:
      dividend_id: {type: str, desc: "Dividend record, e.g. DIV-900001"}
      entity_id: {type: str, desc: Legal entity}
      policy_type: {type: enum, values: [interim, final, special, share_buyback], desc: Dividend type}
      payment_date: {type: date, desc: Planned payment date}
      amount_gbp: {type: float, desc: Total dividend amount in GBP}
      status: {type: enum, values: [planned, approved, approved_subject_to, paid, cancelled], desc: Dividend status}
      payout_ratio_pct: {type: float, desc: Payout as percentage of earnings}
      notes: {type: str, desc: "Policy notes or conditions, e.g. subject to covenant compliance"}

  hedging_requests:
    key: hedge_request_id
    cols:
      hedge_request_id: {type: str, desc: "Hedging request, e.g. HDG-900001"}
      request_date: {type: date, desc: Date request was submitted}
      underlying_type: {type: enum, values: [fx_forward, commodity, interest_rate, option, other], desc: Type of hedge}
      currency_pair: {type: str, desc: "Currency pair, e.g. GBP/USD"}
      commodity: {type: str, desc: "Commodity name, e.g. cotton, copper"}
      notional_amount: {type: float, desc: Notional amount to hedge}
      notional_currency: {type: str, desc: Currency of notional}
      hedge_ratio_pct: {type: int, desc: "Percentage of exposure to hedge"}
      instrument_type: {type: str, desc: "e.g. forward, collar, put, straddle"}
      strike_or_rate: {type: float, desc: "Strike price or forward rate"}
      maturity_date: {type: date, desc: Hedge maturity/expiry date}
      estimated_cost_gbp: {type: float, desc: Estimated cost in GBP}
      status: {type: enum, values: [submitted, approved, rejected, executed, closed, expired], desc: Request status}
      approval_date: {type: date, desc: When approved or rejected}
      approver_id: {type: str, desc: Employee who approved}

  hedging_outcomes:
    key: outcome_id
    cols:
      outcome_id: {type: str, desc: "Hedging outcome record, e.g. HOU-900001"}
      hedge_request_id: {type: str, desc: Original hedge request id (if created from request)"}
      decision_date: {type: date, desc: Date the hedge decision was made}
      underlying_type: {type: enum, values: [fx_forward, commodity, interest_rate, option, other], desc: Type of hedge}
      currency_pair: {type: str, desc: "Currency pair, e.g. GBP/USD"}
      commodity: {type: str, desc: "Commodity, e.g. cotton"}
      notional_amount: {type: float, desc: Notional amount hedged}
      hedge_ratio_pct: {type: int, desc: "Percentage hedged"}
      entry_rate_or_price: {type: float, desc: "Entry rate or price"}
      exit_rate_or_price: {type: float, desc: "Exit rate or price (null if still open)"}
      settlement_date: {type: date, desc: When hedge settled}
      realised_gain_loss_gbp: {type: float, desc: Realised gain/loss in GBP (positive = gain)"}
      strategy_vs_spot: {type: str, desc: "Comparison to spot outcome, e.g. forward was 8% better than spot"}
      comments: {type: str, desc: "Notes on why this decision was made"}

  covenant_alerts:
    key: alert_id
    cols:
      alert_id: {type: str, desc: "Alert record, e.g. ALT-900001"}
      facility_id: {type: str, desc: Debt facility this alert applies to}
      alert_type: {type: enum, values: [headroom_threshold, breach_imminent, breach_occurred, other], desc: Alert type}
      threshold_pct: {type: float, desc: "Headroom threshold, e.g. 15%"}
      current_headroom_pct: {type: float, desc: Current headroom percentage}
      status: {type: enum, values: [active, triggered, resolved, cancelled], desc: Alert status}
      created_date: {type: date, desc: When alert was created}
      triggered_date: {type: date, desc: When alert was triggered}
      actions_taken: {type: str, desc: Actions taken in response}

tools:
  - name: get_bank_balances
    desc: Current bank balances and facility limits across all accounts and entities.
    kind: select
    from: bank_accounts
    columns: [account_id, entity_id, account_type, currency, available_balance_gbp, facility_limit_gbp, bank_name, last_updated]
    order: entity_id
    example: {}

  - name: get_13_week_cash_forecast
    desc: Weekly cash position forecast for the next 13 weeks showing inflows, outflows and closing balances.
    kind: select
    from: cash_forecasts
    filters:
      forecast_id: {}
      week_no: {op: "<=", default: "13"}
    columns: [forecast_date, week_no, opening_balance_gbp, operating_inflows_gbp, operating_outflows_gbp, capex_gbp, closing_balance_gbp]
    order: forecast_date
    example: {forecast_id: FOR-900001}

  - name: get_cash_flow_forecast_18_months
    desc: 18-month cash and debt forecast showing cash position, debt drawn and facility headroom under base case.
    kind: sql
    args:
      entity_id: {required: false, desc: "Specific entity, e.g. LE-UK (default all)"}
    sql: |
      SELECT c.forecast_date, c.week_no, c.opening_balance_gbp, c.operating_inflows_gbp,
             c.operating_outflows_gbp, c.capex_gbp, c.dividend_payment_gbp, c.debt_repayment_gbp,
             c.closing_balance_gbp, b.total_facility_gbp, b.drawn_amount_gbp, b.undrawn_amount_gbp
      FROM cash_forecasts c
      LEFT JOIN debt_facilities b ON b.entity_id = c.entity_id
      WHERE ($entity_id IS NULL OR c.entity_id = $entity_id)
      ORDER BY c.forecast_date
    limit: 100
    example: {}

  - name: get_cash_position_forecast
    desc: Projected cash position and headroom to minimum required balance over the next 90 days.
    kind: sql
    args:
      min_balance_gbp: {type: float, required: false, default: "5000000", desc: Minimum required cash balance in GBP}
    sql: |
      SELECT forecast_date, week_no, closing_balance_gbp,
             round(closing_balance_gbp - $min_balance_gbp, 0) AS headroom_gbp,
             CASE WHEN closing_balance_gbp < $min_balance_gbp THEN 'at_risk' ELSE 'adequate' END AS status
      FROM cash_forecasts
      WHERE closing_balance_gbp IS NOT NULL
      ORDER BY forecast_date
    limit: 30
    example: {}

  - name: get_debt_facilities_and_covenants
    desc: Facility terms, current covenants and compliance status for all debt facilities.
    kind: select
    from: debt_facilities
    columns: [facility_id, entity_id, facility_type, lender, total_facility_gbp, drawn_amount_gbp, maturity_date, financial_covenant, covenant_status, covenant_headroom_pct]
    order: maturity_date
    example: {}

  - name: get_debt_facilities_and_headroom
    desc: Facility limits, drawn amounts and liquidity headroom to undrawn capacity.
    kind: sql
    args:
      entity_id: {required: false}
    sql: |
      SELECT facility_id, facility_type, lender, total_facility_gbp, drawn_amount_gbp,
             undrawn_amount_gbp, interest_rate_pct, maturity_date,
             round(100.0 * undrawn_amount_gbp / total_facility_gbp, 1) AS undrawn_pct
      FROM debt_facilities
      WHERE ($entity_id IS NULL OR entity_id = $entity_id)
      ORDER BY maturity_date
    limit: 20
    example: {}

  - name: get_dividend_policy_and_schedule
    desc: Dividend policy, planned payment dates and amount, including policy for how much of earnings to return.
    kind: select
    from: dividends
    columns: [dividend_id, entity_id, policy_type, payment_date, amount_gbp, status, payout_ratio_pct, notes]
    order: payment_date
    example: {}

  - name: get_forecast_cash_flows_by_currency
    desc: Forecast monthly cash inflows and outflows by currency for the next 12 months showing net exposure and FX risk.
    kind: sql
    args:
      currency: {required: false, desc: "Specific currency e.g. GBP, USD (default all)"}
      horizon_months: {type: int, default: "12", desc: "Forecast horizon in months"}
    sql: |
      SELECT c.forecast_date, c.currency, c.operating_inflows_gbp, c.operating_outflows_gbp,
             round(c.operating_inflows_gbp - c.operating_outflows_gbp, 2) AS net_exposure_gbp
      FROM cash_forecasts c
      WHERE ($currency IS NULL OR c.currency = $currency)
      ORDER BY c.forecast_date
    limit: 50
    example: {}

  - name: get_historic_hedging_outcomes
    desc: Outcomes of past hedging decisions showing actual gains/losses versus spot and strategy effectiveness.
    kind: select
    from: hedging_outcomes
    filters:
      decision_date: {op: ">=", default: "-365d"}
      underlying_type: {}
      settlement_date: {op: "IS NOT NULL"}
    columns: [outcome_id, underlying_type, currency_pair, commodity, hedge_ratio_pct, entry_rate_or_price, exit_rate_or_price, realised_gain_loss_gbp, strategy_vs_spot, decision_date]
    order: decision_date
    limit: 50
    example: {}

  - name: calculate_hedge_scenarios
    desc: Cost and P&L impact of forward, option and other hedging strategies for a given notional and time horizon.
    kind: sql
    args:
      underlying_type: {required: true, values: [fx_forward, commodity, interest_rate], desc: "Type of hedge"}
      currency_pair: {required: false, desc: "For FX, e.g. GBP/USD"}
      commodity: {required: false, desc: "For commodity, e.g. cotton"}
      notional_amount: {required: true, type: float, desc: "Notional amount to hedge"}
      forward_rate_or_price: {required: false, type: float, desc: "Current forward rate or spot price"}
      option_strike: {required: false, type: float, desc: "Strike price for option contracts"}
    sql: |
      SELECT
        'Forward hedge' AS strategy,
        $notional_amount AS notional_gbp,
        round(($forward_rate_or_price * 100 - 100), 2) AS cost_pct,
        round($notional_amount * (($forward_rate_or_price * 100 - 100) / 100), 2) AS cost_gbp,
        'Fixed rate; no upside capture' AS characteristics
      UNION ALL
      SELECT
        'Option (put)' AS strategy,
        $notional_amount,
        round(2.0, 2),
        round($notional_amount * 0.02, 2),
        'Premium cost; downside protected; upside captured'
      UNION ALL
      SELECT
        'Wait/spot' AS strategy,
        $notional_amount,
        0.0,
        0.0,
        'No hedge cost; full exposure to moves'
    limit: 10
    example: {underlying_type: fx_forward, notional_amount: 1000000}

  - name: calculate_covenant_headroom
    desc: Current and projected covenant headroom under base, downside and upside scenarios for key debt facilities.
    kind: sql
    args:
      facility_id: {required: true, desc: "Debt facility id"}
      scenario: {type: enum, values: [base, downside, upside], default: base, desc: "Scenario assumption"}
    sql: |
      SELECT
        f.facility_id,
        $scenario AS scenario,
        f.financial_covenant,
        CASE $scenario
          WHEN 'downside' THEN round(f.covenant_headroom_pct * 0.5, 1)
          WHEN 'upside' THEN round(f.covenant_headroom_pct * 1.5, 1)
          ELSE f.covenant_headroom_pct
        END AS headroom_pct,
        CASE
          WHEN CASE $scenario
            WHEN 'downside' THEN round(f.covenant_headroom_pct * 0.5, 1)
            WHEN 'upside' THEN round(f.covenant_headroom_pct * 1.5, 1)
            ELSE f.covenant_headroom_pct
          END < 15 THEN 'watch'
          WHEN CASE $scenario
            WHEN 'downside' THEN round(f.covenant_headroom_pct * 0.5, 1)
            WHEN 'upside' THEN round(f.covenant_headroom_pct * 1.5, 1)
            ELSE f.covenant_headroom_pct
          END < 10 THEN 'breach_risk'
          ELSE 'compliant'
        END AS status,
        'See covenant alert for ongoing monitoring' AS formula
      FROM debt_facilities f
      WHERE f.facility_id = $facility_id
    limit: 5
    example: {facility_id: FAC-900001, scenario: base}

  - name: create_covenant_alert
    desc: Create or update a threshold alert on covenant headroom to flag when the facility approaches the covenant breach level.
    kind: insert
    table: covenant_alerts
    id_prefix: ALT-
    defaults: {status: active}
    args:
      facility_id: {required: true}
      alert_type: {required: true}
      threshold_pct: {required: true, type: float, desc: "Headroom threshold percentage, e.g. 15"}
    example: {facility_id: FAC-900001, alert_type: headroom_threshold, threshold_pct: 15}

  - name: submit_hedge_request
    desc: Submit a forward, option or other hedge request for treasury approval. Returns request id and approval status.
    kind: insert
    table: hedging_requests
    id_prefix: HDG-
    defaults: {status: submitted, estimated_cost_gbp: 0}
    args:
      underlying_type: {required: true, desc: "Type of hedge"}
      currency_pair: {required: false, desc: "For FX, e.g. GBP/USD"}
      commodity: {required: false, desc: "For commodity, e.g. cotton"}
      notional_amount: {required: true, type: float, desc: "Amount to hedge"}
      notional_currency: {required: true, desc: "Currency of notional"}
      hedge_ratio_pct: {required: true, type: int, desc: "Percentage to hedge (e.g. 60)"}
      instrument_type: {required: true, desc: "forward, collar, put, etc"}
      maturity_date: {required: true, type: date, desc: "Hedge expiry date"}
    example: {underlying_type: fx_forward, currency_pair: GBP/USD, notional_amount: 2000000, notional_currency: GBP, hedge_ratio_pct: 60, instrument_type: forward, maturity_date: "+180d"}
