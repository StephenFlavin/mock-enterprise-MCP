# One entry per question row that uses this system's tools (see: python -m mockmcp brief competitor_prices).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:14:Q8"
  story: >
    Five competitors across EU and UK offer delivery to Europe with varying de minimis approaches.
    We seed competitor delivery terms so managers can see what traders are doing on thresholds.
  checks:
    - tool: get_competitor_prices_for_product
      args: {sku: "K-1700"}
      expect: ["CMPD-001", "34.99", "HomeShop Direct"]

- question: "02:16:Q4"
  story: >
    Three major UK retailers (John Lewis, Argos, Currys) have published updated delivery practice rules
    for low-emission zones in London and Manchester. Our data shows their current practices.
  checks:
    - tool: get_competitor_prices_for_products
      args: {skus: ["K-1700", "PF-220"]}
      expect: ["K-1700", "PF-220", "CMPD-002"]

- question: "02:21:Q5"
  story: >
    Five competitors show different returns policies. Argos charges £5, John Lewis is free,
    Carrefour charges £8. Our seed captures these baseline policies.
  checks:
    - tool: get_competitor_prices_for_range
      args: {category: "Kettles"}
      expect: ["Kettles", "Electric Kettle", "CMPD-"]

- question: "03:25:Q5"
  story: >
    Five competitors are pricing their insulated bottles at £48-£65. We check against Argos (£48.99, 30% off),
    John Lewis (£64.95), HomeShop (£52.99) to assess positioning on our athleisure range analogue.
  checks:
    - tool: get_competitor_prices_for_similar_products
      args: {sku: "PF-220"}
      expect: ["PF-220", "CMPD-", "Insulated bottles"]

- question: "03:29:Q1"
  story: >
    John Lewis and HomeShop are pricing similar men's jackets at £149 and £89.99 (30% off).
    We pulled their 13-week history to see if our 30% markdown on similar items was out of line.
  checks:
    - tool: get_competitor_price_history
      args: {category: "Men's jackets", date_from: "-60d"}
      expect: ["Men's jackets", "CMPD-", "price_date"]

- question: "03:29:Q4"
  story: >
    HomeShop (30% off jackets), Currys (no markdown), and Argos (50% off jackets) show a range
    of clearance strategies. Our 30% markdown on men's jackets is in the middle, and our
    timing (this week) aligns with their clearance season.
  checks:
    - tool: get_competitor_clearance_prices
      args: {}
      expect: ["clearance", "CMPD-", "discount_pct"]

- question: "04:32:Q4"
  story: >
    Competitor prices for K-1700 (750ml insulated bottle equivalent) range from £35.99 (Argos)
    to £64.95 (John Lewis), with HomeShop at £52.99. Our retail price is £49.99,
    putting us below average but above low-cost options.
  checks:
    - tool: get_competitor_price_history_for_product
      args: {sku: "K-1700", date_from: "-60d"}
      expect: ["K-1700", "price_gbp", "CMPD-"]

- question: "06:51:Q3"
  story: >
    Five competitors offer insulated lunch boxes in the £48-£75 range with various features.
    The comparison table we draft shows HomeShop at £52.99, John Lewis at premium price £64.95,
    and Argos at clearance (30% off, £48.99). Our entry at £45 is competitive below market.
  checks:
    - tool: draft_competitor_comparison_table
      args: {category: "Insulated bottles"}
      expect: ["Competitor", "Product", "Price", "CMPD-"]

- question: "06:54:Q6"
  story: >
    Competitors' price index for kettles shows: HomeShop (34.99), Argos (35.99), Carrefour (37.50),
    John Lewis (39.95), Currys (42.99). Our retail price of £44.99 puts us at 115 (15% above
    competitor average of £39.09), suggesting we are positioned as premium.
  checks:
    - tool: calculate_price_index_vs_competitors
      args: {category: "Kettles"}
      expect: ["price_index", "positioning", "formula"]

- question: "08:73:Q5"
  story: >
    Competitor promotions active now: HomeShop (kettles 15% off, jackets 30% off),
    Argos (bottles 30% off clearance, jackets 50% off), John Lewis (bottles 10% off).
    This helps us understand the promotional intensity in the market and plan our response.
  checks:
    - tool: get_competitor_promotions_active
      args: {}
      expect: ["active", "CMPD-", "discount_pct"]

- question: "08:77:Q2"
  story: >
    Looking back 90 days, we see competitors' response to cost shocks: when tariffs hit,
    HomeShop increased kettle prices by 8%, John Lewis held steady, Argos pushed a promotion.
    This informs our pricing strategy for the coming tariff.
  checks:
    - tool: get_competitor_price_response_history
      args: {event_type: "tariff"}
      expect: ["competitor_id", "CMPD-", "promotion"]

- question: "08:77:Q5"
  story: >
    This month: HomeShop dropped kettles 15% (Sept 25 - Oct 5), Argos ran a 20% sale (Sept 10-17),
    Currys held pricing. HomeShop's timing (Black Friday early) aligns with our planning.
  checks:
    - tool: get_competitor_price_changes_for_period
      args: {date_from: "-30d"}
      expect: ["change_pct", "CMPD-", "price_date"]

- question: "08:77:Q6"
  story: >
    For a new product launch, we benchmark competitor offers on similar insulated bottles:
    Argos £48.99 (clearance, 30% off), HomeShop £52.99, Carrefour £55, John Lewis £64.95.
    We draft a comparison showing features and test launch pricing of £49.99.
  checks:
    - tool: compare_offer_vs_competitors
      args: {sku: "K-1700"}
      expect: ["Our Pricing", "Competitor", "£"]

- question: "08:78:Q1"
  story: >
    Our 30% markdown on men's jackets didn't move stock. We compare to competitors:
    HomeShop is 30% off, John Lewis (no markdown, premium positioning), Argos 50% off clearance.
    Our markdown depth looks competitive, but our inventory position differs.
  checks:
    - tool: compare_markdown_to_competitors
      args: {category: "Men's jackets"}
      expect: ["markdown", "competitor", "discount"]

- question: "08:78:Q4"
  story: >
    Historical promotions show competitors' Black Friday patterns. Last year: HomeShop 20-30% off,
    John Lewis 15%, Argos 25-40%. This year they are already running early-bird offers (Black Friday
    prep starting Sept 25). Our timing and depth strategy should account for this.
  checks:
    - tool: get_competitor_promotion_history_for_period
      args: {date_from: "-90d"}
      expect: ["promotion", "CMPD-", "promo_start"]

- question: "06:52:Q1"
  story: >
    Major competitor ranges show colour (black, navy, white), material (cotton, wool, synthetics),
    and silhouettes (slim, oversized, structured) trending in AW27. We capture competitor features
    to identify which attributes are emerging early in their cycles.
  checks:
    - tool: search_competitor_ranges_by_attribute
      args: {features: "insulated"}
      expect: ["competitor_id", "features", "category"]

- question: "06:54:Q3"
  story: >
    In small kitchen appliances, competitors offer: blenders (4 products), coffee makers (3),
    toasters (5). Argos leads on blender range with 5 SKUs, HomeShop on coffee makers with 4.
    We identify range gaps where we're underrepresented.
  checks:
    - tool: search_competitor_products_by_category
      args: {category: "Small appliances"}
      expect: ["category", "Small appliances", "CMPD-"]

- question: "06:56:Q3"
  story: >
    Competitors offer wellness products: yoga mats, recovery rollers, meditation cushions.
    HomeShop has 8 products, Argos 5, John Lewis 3. We check what's gaining traction and
    what flopped (discontinued products with low review counts).
  checks:
    - tool: search_competitor_products_by_category
      args: {category: "Small appliances"}
      expect: ["their_name", "CMPD-"]

- question: "06:56:Q4"
  story: >
    Trends in competitor home range show sustainability (eco-friendly, recycled), comfort
    (ergonomic, soft), and smart home (connected, IoT). We identify early movers and lead times.
  checks:
    - tool: search_competitor_ranges_by_attribute
      args: {features: "eco"}
      expect: ["features", "competitor_id"]

- question: "08:71:Q4"
  story: >
    Store 214 location has had two competitor openings in the last 6 months: Currys opened
    nearby 4 months ago, HomeShop opened 2 months ago. Our sales show impact around each opening.
  checks:
    - tool: search_competitor_openings_near_store
      args: {site_id: "ST214", date_from: "-180d"}
      expect: ["competitor_id", "CMPD-", "opening_date"]

- question: "08:74:Q4"
  story: >
    Our top 20 products are matched to competitors: K-1700 (kettle) is priced £49.99 vs
    Argos £48.99 (online), HomeShop £52.99, John Lewis £64.95. We compare delivery (all offer
    free over £30) and returns (Argos charges, John Lewis free).
  checks:
    - tool: get_competitor_prices_for_products
      args: {skus: ["K-1700", "PF-220"]}
      expect: ["competitor_id", "price_gbp", "CMPD-"]

- question: "08:77:Q1"
  story: >
    Price gap analysis shows: K-1700 (our £49.99) vs Argos £48.99 (-2%), HomeShop £52.99 (+6%),
    John Lewis £64.95 (+30%). We're competitively priced on volume drivers but premium on upmarket.
  checks:
    - tool: get_price_gaps_vs_competitors
      args: {category: "Kettles"}
      expect: ["sku", "gap_pct", "position"]

- question: "08:77:Q4"
  story: >
    Looking back 6 months at tariff-shock periods: HomeShop increased kettle prices by 8% over
    2 weeks, then ran a 15% promotion for 3 weeks. John Lewis held prices, ran no promo. Argos
    jumped straight to a 25% clearance.  This shows different response strategies.
  checks:
    - tool: get_competitor_response_to_past_cost_shocks
      args: {event_type: "tariff", date_from: "-180d"}
      expect: ["competitor_id", "promotion", "CMPD-"]
