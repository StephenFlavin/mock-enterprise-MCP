  - name: search_competitor_openings_and_closures_near_stores
    desc: Competitor store openings and closures near our locations, newest first, with site and competitor. Filter by sales region or site; for store impact analysis.
    kind: sql
    args:
      region: {type: str, desc: "Our sales region to cover, e.g. Scotland, UK North; default all"}
      site_id: {type: str, desc: "One of our stores, e.g. ST214; default all"}
      date_from: {type: date, default: "-180d", desc: "Look back this far"}
    sql: |
      SELECT cs.site_id, s.name AS our_store, cs.competitor_id, c.name, cs.opening_date, cs.closing_date, cs.status,
             CASE WHEN cs.status = 'open' THEN 'Opening' ELSE 'Closure' END as event_type,
             COALESCE(cs.closing_date, cs.opening_date) as event_date
      FROM competitor_stores cs
      JOIN competitors c ON c.competitor_id = cs.competitor_id
      JOIN master.sites s ON s.site_id = cs.site_id
      WHERE (cs.opening_date >= CAST($date_from AS DATE)
             OR cs.closing_date >= CAST($date_from AS DATE))
        AND ($site_id IS NULL OR cs.site_id = $site_id)
        AND ($region IS NULL OR s.region ILIKE '%' || $region || '%')
      ORDER BY event_date DESC, cs.site_id
    limit: 100
    example: {region: "Scotland"}

  - name: search_competitor_openings_near_store
    desc: Competitor store openings and closures near a specific store location.
    kind: sql
    args:
      site_id: {required: true, desc: "Our store location"}
      date_from: {type: date, default: "-180d", desc: "Look back this far"}
    sql: |
      SELECT cs.competitor_id, c.name, c.format, cs.opening_date, cs.closing_date, cs.status,
             CASE WHEN cs.status = 'open' THEN 'Opening' ELSE 'Closure' END as event_type
      FROM competitor_stores cs
      JOIN competitors c ON c.competitor_id = cs.competitor_id
      WHERE cs.site_id = $site_id
        AND (cs.opening_date >= CAST($date_from AS DATE)
             OR (cs.closing_date IS NOT NULL AND cs.closing_date >= CAST($date_from AS DATE)))
      ORDER BY COALESCE(cs.closing_date, cs.opening_date) DESC
    limit: 20
    example: {site_id: "ST214"}

  - name: search_competitor_prices_for_product
    desc: Competitor prices for products comparable to one of our SKUs (same category), with source and data quality so reliability can be judged.
    kind: sql
    args:
      sku: {required: true, desc: "Our SKU to find competitors for, e.g. SKU-102590"}
      category: {type: str, desc: "Restrict to a competitor category instead of the one matched to the SKU"}
    sql: |
      WITH target_category AS (
        SELECT DISTINCT cp.category FROM competitor_products cp
        WHERE cp.sku IN (SELECT m2.sku FROM master.products m1 JOIN master.products m2 ON m2.style_id = m1.style_id WHERE m1.sku = $sku)
      ),
      latest AS (
        SELECT * FROM competitor_prices QUALIFY row_number() OVER (PARTITION BY competitor_product_id ORDER BY price_date DESC) = 1
      )
      SELECT c.competitor_id, c.name AS competitor, c.format, c.data_source, cp.their_name, cp.features,
             p.list_price_gbp, p.price_gbp, p.promotion_type, p.discount_pct, p.data_quality, p.price_date
      FROM latest p
      JOIN competitor_products cp ON cp.competitor_product_id = p.competitor_product_id
      JOIN competitors c ON c.competitor_id = p.competitor_id
      WHERE (($category IS NOT NULL AND (cp.category ILIKE '%' || $category || '%' OR cp.subcategory ILIKE '%' || $category || '%'))
             OR ($category IS NULL AND cp.category IN (SELECT category FROM target_category)))
        AND p.price_date >= CAST($as_of AS DATE) - INTERVAL 14 DAY
      ORDER BY p.price_gbp ASC, c.name
    limit: 50
    example: {sku: "K-1700"}

  - name: search_competitor_products_by_category
    desc: Competitor products in a category or product type with brand, features, listing status (bestseller, discontinued) and current price. Shows who sells what and where ranges are thin.
    kind: sql
    args:
      category: {required: true, type: str, desc: "Product category or product type, e.g. Small appliances, Lunch boxes, Wellness"}
      subcategory: {type: str, desc: "Product type, e.g. Air fryers, Soup makers"}
      competitor_id: {}
      status: {type: str, desc: "Listing status: active, bestseller or discontinued", values: [active, bestseller, discontinued]}
    sql: |
      WITH latest AS (
        SELECT * FROM competitor_prices QUALIFY row_number() OVER (PARTITION BY competitor_product_id ORDER BY price_date DESC) = 1
      )
      SELECT cp.competitor_product_id, c.competitor_id, c.name AS competitor, cp.their_name, cp.category, cp.subcategory,
             cp.brand, cp.features, cp.status, cp.launch_date, p.list_price_gbp, p.price_gbp AS current_price_gbp,
             p.discount_pct, p.price_date AS last_price_date, cp.sku
      FROM competitor_products cp
      JOIN competitors c ON c.competitor_id = cp.competitor_id
      LEFT JOIN latest p ON p.competitor_product_id = cp.competitor_product_id
      WHERE (cp.category ILIKE '%' || $category || '%' OR cp.subcategory ILIKE '%' || $category || '%')
        AND ($subcategory IS NULL OR cp.subcategory ILIKE '%' || $subcategory || '%')
        AND ($competitor_id IS NULL OR cp.competitor_id = $competitor_id)
        AND ($status IS NULL OR cp.status = $status)
      ORDER BY cp.category, cp.subcategory, c.competitor_id
    limit: 100
    example: {category: "Small appliances"}

  - name: search_competitor_ranges_by_attribute
    desc: Competitor products matching an attribute such as feature, colour, material or silhouette, with competitor name and current price. For trend and range analysis.
    kind: sql
    args:
      features: {type: str, desc: "Feature or keyword in the product name or description, e.g. insulated, eco-friendly"}
      category: {type: str, desc: "Restrict to a category, e.g. Women's outerwear"}
      colour: {type: str, desc: "Colour, e.g. chocolate brown, sage green"}
      material: {type: str, desc: "Material, e.g. recycled, wool"}
      silhouette: {type: str, desc: "Fit or shape, e.g. oversized, cropped"}
      brand: {type: str, desc: "Brand filter"}
      department: {type: str, desc: "Our department the range sits in, e.g. Home, Womenswear, Electricals"}
    sql: |
      WITH latest AS (
        SELECT * FROM competitor_prices QUALIFY row_number() OVER (PARTITION BY competitor_product_id ORDER BY price_date DESC) = 1
      )
      SELECT cp.competitor_product_id, c.competitor_id, c.name AS competitor, cp.their_name, cp.department, cp.category, cp.subcategory,
             cp.colour, cp.material, cp.silhouette, cp.features, cp.brand, cp.launch_date, p.price_gbp AS current_price_gbp
      FROM competitor_products cp
      JOIN competitors c ON c.competitor_id = cp.competitor_id
      LEFT JOIN latest p ON p.competitor_product_id = cp.competitor_product_id
      WHERE ($features IS NULL OR cp.features ILIKE '%' || $features || '%' OR cp.their_name ILIKE '%' || $features || '%'
             OR cp.material ILIKE '%' || $features || '%' OR cp.silhouette ILIKE '%' || $features || '%')
        AND ($category IS NULL OR cp.category ILIKE '%' || $category || '%' OR cp.subcategory ILIKE '%' || $category || '%')
        AND ($colour IS NULL OR cp.colour ILIKE '%' || $colour || '%')
        AND ($material IS NULL OR cp.material ILIKE '%' || $material || '%')
        AND ($silhouette IS NULL OR cp.silhouette ILIKE '%' || $silhouette || '%')
        AND ($brand IS NULL OR cp.brand ILIKE '%' || $brand || '%')
        AND ($department IS NULL OR cp.department ILIKE $department)
      ORDER BY cp.category, c.competitor_id
    limit: 100
    example: {features: "insulated"}

  - name: search_competitor_returns_policies
    desc: Returns policies by competitor, showing whether returns are free, the returns fee, restocking charge and return window.
    kind: select
    from: competitor_returns_policies
    filters:
      competitor_id: {}
      competitor_name: {op: like}
      country: {type: str, desc: "Market the policy applies to, e.g. GB, FR"}
      returns_free: {}
    columns: [policy_id, competitor_id, competitor_name, country, returns_free, restocking_fee_gbp, restocking_fee_pct,
              return_window_days, policy_description]
    order: competitor_name
    limit: 20
    example: {}
