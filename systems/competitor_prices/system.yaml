    columns: [practice_id, competitor_id, competitor_name, delivery_zones, urban_delivery_notes, min_order_gbp,
              free_delivery_threshold_gbp, standard_delivery_days, express_delivery_available, saturday_delivery]
    order: competitor_name
    limit: 20
