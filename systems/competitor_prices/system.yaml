  - name: search_competitor_delivery_terms
    desc: Cross-border delivery terms by competitor, including EU shipping, de minimis threshold, who pays duty and VAT, and VAT reverse charge.
    kind: select
    from: competitor_delivery_practices
    filters:
      competitor_id: {}
      delivery_zones: {op: like}
      eu_cross_border: {}
