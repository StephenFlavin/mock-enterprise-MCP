    columns: [practice_id, competitor_id, competitor_name, delivery_zones, eu_cross_border, de_minimis_threshold_eur,
              duty_vat_terms, vat_reverse_charge, min_order_gbp, free_delivery_threshold_gbp]
    order: competitor_name
    limit: 20
