  - name: search_competitor_prices_for_product
    desc: Find competitor prices for products comparable to a given SKU.
    kind: sql
    args:
      sku: {required: true, desc: "Our SKU to find competitors for"}
      category: {type: str, desc: "Restrict to category"}
    sql: |
      WITH target_category AS (
        SELECT DISTINCT cp.category
        FROM competitor_products cp
        WHERE cp.sku = $sku
        LIMIT 1
      )
      SELECT DISTINCT c.competitor_id, c.name, c.format,
             cp.their_name, cp.features, p.price_gbp,
             p.promotion_type, p.discount_pct, p.price_date
      FROM competitor_prices p
      JOIN competitor_products cp ON cp.competitor_product_id = p.competitor_product_id
      JOIN competitors c ON c.competitor_id = p.competitor_id
      CROSS JOIN target_category tc
      WHERE (cp.sku = $sku OR ($category IS NOT NULL AND cp.category ILIKE '%' || $category || '%')
             OR ($category IS NULL AND cp.category = tc.category))
        AND p.price_date >= CAST($as_of AS DATE) - INTERVAL 7 DAY
      ORDER BY p.price_gbp ASC, c.name
    limit: 50
    example: {sku: "K-1700"}

