  - name: search_competitor_openings_and_closures_near_stores
    desc: Competitor store openings and closures near all our locations. For store impact analysis.
    kind: sql
    args:
      date_from: {type: date, default: "-180d", desc: "Look back this far"}
    sql: |
      SELECT cs.site_id, cs.competitor_id, c.name, cs.opening_date, cs.closing_date, cs.status,
             CASE WHEN cs.status = 'open' THEN 'Opening' ELSE 'Closure' END as event_type,
             COALESCE(cs.closing_date, cs.opening_date) as event_date
      FROM competitor_stores cs
      JOIN competitors c ON c.competitor_id = cs.competitor_id
      WHERE (cs.opening_date >= CAST($date_from AS DATE)
