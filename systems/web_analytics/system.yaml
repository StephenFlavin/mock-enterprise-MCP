id: web_analytics
name: Web Analytics Platform
instructions: >
  Website traffic analysis, conversion rates, search trends, marketing campaign
  performance, and customer funnel metrics for resale and new product launches.
  Trend ids like ST-000001, traffic and conversion data by day/channel/device.

tables:
  search_trends:
    key: trend_id
    cols:
      trend_id: {type: str, desc: "Search trend, e.g. ST-000001"}
      search_term: {type: str, desc: "Search term or keyword"}
      date: {type: date, desc: "Date of trend measurement"}
      volume: {type: int, desc: "Search volume for the term"}
      trend_direction: {type: enum, values: [up, stable, down], desc: "Trend direction"}
      category: {type: str, desc: "Product category, if relevant"}

  traffic_by_channel:
    key: [date, channel, device]
    cols:
      date: {type: date, desc: "Date of traffic"}
      channel: {type: enum, values: [organic, paid, direct, social, email, referral], desc: "Traffic channel"}
      device: {type: enum, values: [mobile, desktop, tablet], desc: "Device type"}
      sessions: {type: int, desc: "Number of sessions"}
      conversions: {type: int, desc: "Number of conversions"}
      revenue_gbp: {type: float, desc: "Revenue in GBP"}

  conversion_metrics:
    key: [date, channel, device, delivery_option]
    cols:
      date: {type: date, desc: "Date of measurement"}
      channel: {type: enum, values: [organic, paid, direct, social, email, referral], desc: "Traffic channel"}
      device: {type: enum, values: [mobile, desktop, tablet], desc: "Device type"}
      delivery_option: {type: str, desc: "Delivery option, e.g. standard, next_day"}
      conversion_rate: {type: float, desc: "Conversion rate percentage"}
      conversions: {type: int, desc: "Number of conversions"}
      orders: {type: int, desc: "Number of orders"}
      revenue_gbp: {type: float, desc: "Revenue in GBP for this segment"}

  marketing_activities:
    key: activity_id
    cols:
      activity_id: {type: str, desc: "Marketing activity, e.g. MA-000001"}
      range_id: {type: str, desc: "Style id or SKU for the range"}
      campaign_name: {type: str, desc: "Campaign name"}
      channel: {type: enum, values: [organic, paid, direct, social, email, referral], desc: "Campaign channel"}
      start_date: {type: date, desc: "Campaign start date"}
      end_date: {type: date, desc: "Campaign end date"}
      impressions: {type: int, desc: "Number of impressions"}
      clicks: {type: int, desc: "Number of clicks"}
      conversions: {type: int, desc: "Number of conversions"}
      revenue_gbp: {type: float, desc: "Campaign revenue in GBP"}

  campaign_creatives:
    key: creative_id
    cols:
      creative_id: {type: str, desc: "Campaign creative, e.g. CC-000001"}
      campaign_name: {type: str, desc: "Campaign name"}
      creative_type: {type: enum, values: [image, video, text, carousel], desc: "Creative asset type"}
      test_variant: {type: str, desc: "Test variant identifier"}
      impressions: {type: int, desc: "Number of impressions"}
      clicks: {type: int, desc: "Number of clicks"}
      conversions: {type: int, desc: "Number of conversions"}
      revenue_gbp: {type: float, desc: "Revenue from this creative in GBP"}
      engagement_rate_pct: {type: float, desc: "Engagement rate as percentage"}

  resale_funnel:
    key: [date, funnel_stage]
    cols:
      date: {type: date, desc: "Date of measurement"}
      funnel_stage: {type: enum, values: [views, item_added, checkout, purchase], desc: "Funnel stage"}
      user_count: {type: int, desc: "Number of users at this stage"}
      transaction_count: {type: int, desc: "Number of transactions"}
      items_listed: {type: int, desc: "Items listed for resale"}
      items_sold: {type: int, desc: "Items sold through resale"}
      gmv_gbp: {type: float, desc: "Gross merchandise value in GBP"}

  traffic_forecast:
    key: [date, channel]
    cols:
      date: {type: date, desc: "Forecast date"}
      channel: {type: enum, values: [organic, paid, direct, social, email, referral], desc: "Traffic channel"}
      forecast_volume: {type: int, desc: "Forecasted traffic volume"}
      forecast_revenue_gbp: {type: float, desc: "Forecasted revenue in GBP"}
      confidence_pct: {type: float, desc: "Forecast confidence percentage"}

tools:
  - name: get_search_trend_data
    desc: Retrieve search trend data for keywords over a date range, showing volume and direction.
    kind: sql
    args:
      search_term: {type: str, desc: "Search term to analyze, e.g. backpack"}
      date_from: {type: date, default: "-90d", desc: "Search trends from this date"}
      date_to: {type: date, default: "today", desc: "Search trends until this date"}
    sql: |
      SELECT trend_id, search_term, date, volume, trend_direction, category
      FROM search_trends
      WHERE search_term ILIKE '%' || $search_term || '%'
        AND date >= CAST($date_from AS DATE)
        AND date <= CAST($date_to AS DATE)
      ORDER BY date ASC
    limit: 100
    example: {search_term: "backpack"}

  - name: get_traffic_mix_by_channel
    desc: Traffic volume and conversion by channel and device for a date range.
    kind: sql
    args:
      date_from: {type: date, default: "-14d", desc: "Traffic from this date"}
      date_to: {type: date, default: "today", desc: "Traffic until this date"}
      channel: {type: str, desc: "Filter to one channel (default all)"}
    sql: |
      SELECT date, channel, device, sessions, conversions,
             ROUND(100.0 * conversions / NULLIF(sessions, 0), 2) AS conversion_pct,
             revenue_gbp
      FROM traffic_by_channel
      WHERE date >= CAST($date_from AS DATE)
        AND date <= CAST($date_to AS DATE)
        AND ($channel IS NULL OR channel = $channel)
      ORDER BY date DESC, channel, device
    limit: 100
    example: {}

  - name: get_conversion_rate_by_device_and_day
    desc: Daily conversion rates by device (mobile/desktop) with volumes, for trend analysis.
    kind: sql
    args:
      date_from: {type: date, default: "-21d", desc: "Data from this date"}
      date_to: {type: date, default: "today", desc: "Data until this date"}
      device: {type: str, desc: "Filter to device type (default all)"}
    sql: |
      SELECT date, device, channel,
             ROUND(conversion_rate, 2) AS conversion_rate_pct,
             conversions, orders,
             ROUND(100.0 * conversions / NULLIF(orders, 0), 2) AS order_conversion_pct
      FROM conversion_metrics
      WHERE date >= CAST($date_from AS DATE)
        AND date <= CAST($date_to AS DATE)
        AND ($device IS NULL OR device = $device)
      ORDER BY date DESC, device, channel
    limit: 100
    example: {}

  - name: get_conversion_by_delivery_option
    desc: Conversion rate and revenue by delivery option (standard, next-day), showing impact of delivery speed.
    kind: sql
    args:
      date_from: {type: date, default: "-60d", desc: "Data from this date"}
      date_to: {type: date, default: "today", desc: "Data until this date"}
      postcode_area: {type: str, desc: "Filter to postcode area (optional)"}
    sql: |
      SELECT date, delivery_option, channel,
             ROUND(conversion_rate, 2) AS conversion_rate_pct,
             conversions, orders,
             ROUND(100.0 * conversions / NULLIF(orders, 0), 2) AS order_conversion_pct
      FROM conversion_metrics
      WHERE date >= CAST($date_from AS DATE)
        AND date <= CAST($date_to AS DATE)
      GROUP BY date, delivery_option, channel, conversion_rate, conversions, orders
      ORDER BY date DESC, delivery_option
    limit: 100
    example: {}

  - name: get_marketing_activity_for_range
    desc: Marketing activity for a product range showing impressions, clicks, conversions and revenue by channel.
    kind: sql
    args:
      range_id: {required: true, type: str, desc: "Product range id (style or SKU)"}
      date_from: {type: date, default: "-90d", desc: "Activity from this date"}
    sql: |
      SELECT activity_id, campaign_name, channel, start_date, end_date,
             impressions, clicks,
             ROUND(100.0 * clicks / NULLIF(impressions, 0), 2) AS ctr_pct,
             conversions,
             ROUND(100.0 * conversions / NULLIF(clicks, 0), 2) AS conversion_from_clicks_pct,
             revenue_gbp,
             ROUND(revenue_gbp / NULLIF(conversions, 0), 2) AS revenue_per_conversion_gbp
      FROM marketing_activities
      WHERE range_id = $range_id
        AND start_date >= CAST($date_from AS DATE)
      ORDER BY start_date DESC
    limit: 50
    example: {range_id: "STY-5520"}

  - name: get_campaign_creative_performance
    desc: Campaign creative performance by test variant, showing impressions, clicks, conversions and engagement.
    kind: sql
    args:
      campaign_name: {required: true, type: str, desc: "Campaign name"}
      date_from: {type: date, default: "-60d", desc: "Activity from this date"}
    sql: |
      SELECT creative_id, campaign_name, creative_type, test_variant,
             impressions, clicks,
             ROUND(100.0 * clicks / NULLIF(impressions, 0), 2) AS ctr_pct,
             conversions,
             ROUND(100.0 * conversions / NULLIF(clicks, 0), 2) AS conversion_pct,
             revenue_gbp,
             ROUND(revenue_gbp / NULLIF(conversions, 0), 2) AS revenue_per_conversion_gbp,
             engagement_rate_pct
      FROM campaign_creatives
      WHERE campaign_name = $campaign_name
      ORDER BY conversions DESC, revenue_gbp DESC
    limit: 50
    example: {campaign_name: "Home Event 20pct off"}

  - name: get_resale_programme_funnel_metrics
    desc: Resale programme funnel metrics (views, cart adds, checkouts, purchases) over time, showing conversion drop-off.
    kind: sql
    args:
      date_from: {type: date, default: "-90d", desc: "Funnel data from this date"}
      date_to: {type: date, default: "today", desc: "Funnel data until this date"}
    sql: |
      SELECT date, funnel_stage, user_count, transaction_count,
             items_listed, items_sold,
             ROUND(100.0 * items_sold / NULLIF(items_listed, 0), 2) AS sell_through_pct,
             gmv_gbp,
             ROUND(gmv_gbp / NULLIF(items_sold, 0), 2) AS aov_gbp
      FROM resale_funnel
      WHERE date >= CAST($date_from AS DATE)
        AND date <= CAST($date_to AS DATE)
      ORDER BY date DESC, funnel_stage
    limit: 100
    example: {}

  - name: get_traffic_forecast_for_peak
    desc: Traffic forecast by channel for peak season (Black Friday to Christmas), with revenue forecast and confidence.
    kind: sql
    args:
      date_from: {type: date, default: "+30d", desc: "Forecast from this date (typically Black Friday)"}
      date_to: {type: date, default: "+80d", desc: "Forecast until this date (typically Christmas Eve)"}
      channel: {type: str, desc: "Filter to one channel (default all)"}
    sql: |
      SELECT date, channel, forecast_volume, forecast_revenue_gbp, confidence_pct
      FROM traffic_forecast
      WHERE date >= CAST($date_from AS DATE)
        AND date <= CAST($date_to AS DATE)
        AND ($channel IS NULL OR channel = $channel)
      ORDER BY date ASC, channel
    limit: 200
    example: {}

  - name: calculate_lost_revenue_from_conversion_drop
    desc: Calculate lost revenue from a conversion rate drop, using baseline rates and actual volumes.
    kind: sql
    args:
      date_from: {type: date, default: "-7d", desc: "Period with dropped conversion"}
      date_to: {type: date, default: "today", desc: "End of period"}
      baseline_conversion_rate: {type: float, default: 2.5, desc: "Baseline conversion rate percentage"}
    sql: |
      SELECT ROUND(SUM(orders), 0) AS actual_orders,
             ROUND(AVG(conversion_rate), 2) AS actual_conversion_rate,
             ROUND(SUM(revenue_gbp), 2) AS actual_revenue_gbp,
             $baseline_conversion_rate AS baseline_conversion_rate_pct,
             ROUND(AVG(revenue_gbp / NULLIF(orders, 0)), 2) AS aov_gbp,
             ROUND(SUM(revenue_gbp) * ($baseline_conversion_rate / AVG(conversion_rate) - 1), 2) AS lost_revenue_gbp,
             'lost_revenue = actual_revenue * (baseline_rate / actual_rate - 1)' AS formula
      FROM conversion_metrics
      WHERE date >= CAST($date_from AS DATE)
        AND date <= CAST($date_to AS DATE)
    limit: 1
    example: {}
