# One entry per question row that uses this system's tools (see: python -m mockmcp brief web_analytics).
# story = what the data plants; checks = tool calls whose output must contain every `expect` string.
- question: "03:23:Q2"
  story: >
    Weekly search volume for the new recycled-polyester backpack range. "backpack" climbs from 12,000 to 22,000 over the
    last seven weeks, "recycled polyester" from 8,500 to 16,800 and "recycled polyester backpack" from 1,100 to 3,900,
    all marked up. A year of weekly history shows the January level (about 13,000 for backpack) for the 12 January launch.
  checks:
    - tool: get_search_trend_data
      args: {search_term: "recycled polyester", date_from: "-60d"}
      expect: ["16800", "8500", "up", "3900"]
    - tool: get_search_trend_data
      args: {search_term: "backpack", date_from: "-60d"}
      expect: ["22000", "12000", "Bags"]

- question: "03:25:Q5"
  story: >
    Athleisure style STY-4056 (SKU-100084 is one of its sizes) had only three launch campaigns, all starting ten weeks
    ago: paid search MA-900001 (three weeks, 5,760 spend), paid social MA-900002 (ended early after two weeks) and a
    single email send MA-900003 (588 conversions on 260 spend). Nothing has run for the last seven weeks, so marketing
    support stopped long before the range was out of its launch window; the campaigns that did run converted fine.
  checks:
    - tool: get_marketing_activity_for_range
      args: {range_id: "STY-4056"}
      expect: ["MA-900002", "ended_early", "4680", "MA-900003", "588"]
    - tool: get_marketing_activity_for_range
      args: {range_id: "SKU-100084"}
      expect: ["MA-900001", "5760", "paid"]

- question: "05:49:Q4"
  story: >
    Weekly resale funnel: views to the resale pages fell from 8,900 a week to 3,800 (now about 0.7% of site sessions) while
    each step stays healthy (24% view to cart, 62% cart to checkout, 71% checkout to purchase, 10.5% view to purchase)
    and listings stay about 2,350. Fewer customers reach the programme (awareness), rather than dropping out inside it.
  checks:
    - tool: get_resale_programme_funnel_metrics
      args: {}
      expect: ["3800", "8900", "10.5", "0.69"]

- question: "08:74:Q1"
  story: >
    Last week conversion fell from 2.66% to 2.27% (-0.39 pts). Mobile fell 0.49 pts (to 1.63%, from a mobile
    checkout error starting midweek) while desktop fell only 0.21 pts; a new paid campaign lifted paid's share of
    sessions by 4.2 pts, which converts lower. The drop cost about 2,139 orders and 105,363 GBP.
  checks:
    - tool: get_conversion_rate_by_device_and_day
      args: {date_from: "-12d"}
      expect: ["mobile", "1.38", "desktop", "3.65"]
    - tool: get_traffic_mix_by_channel
      args: {date_from: "-9d", date_to: "-1d"}
      expect: ["paid", "4.2", "27.3", "2.27"]
    - tool: calculate_lost_revenue_from_conversion_drop
      args: {date_from: "-9d", date_to: "-1d"}
      expect: ["all devices", "2139", "105363", "-0.39"]

- question: "08:74:Q2"
  story: >
    Daily peak forecast from Black Friday (Friday) to Christmas Eve: Black Friday is the first bottleneck day at about 221,500
    sessions and 7,571 orders, a second ramp peaks on the Saturday before Christmas at 206,867 sessions, and Christmas Eve
    drops off. A 15% traffic uplift scales every day (Black Friday 254,724 sessions, 8,707 orders).
  checks:
    - tool: get_traffic_forecast_for_peak
      args: {}
      expect: ["221499", "7571", "206867", "6442"]
    - tool: get_traffic_forecast_for_peak
      args: {traffic_uplift_pct: 15}
      expect: ["254724", "8707"]

- question: "08:74:Q3"
  story: >
    Next-day lifts conversion most in LS1 (+1.08 pts, 2.40% to 3.49%), G1, NG1, L1, M1, B1, NE1, S1, CF1 and LE1 (+0.48);
    London areas such as SW1, SE1 and E1 gain under 0.3 points. Most of the best areas do not yet have next-day switched on.
  checks:
    - tool: get_conversion_by_delivery_option
      args: {}
      expect: ["LS1", "1.08", "G1", "0.98", "LE1", "0.48"]
    - tool: get_conversion_by_delivery_option
      args: {postcode_area: LS1}
      expect: ["3.49", "2.4", "1.08"]

- question: "08:78:Q1"
  story: >
    The Weekend Home Event 20pct off creatives (CC-900001..CC-900005) beat the earlier Spring Bedding and Summer Kitchen events:
    event click-through 3.77% against 2.8% and 3.13%, and 2.49% of clicks converting against 2.31% and 2.48%. Best creative is
    image variant A (CC-900001, 270 conversions); worst is video variant B (CC-900004, 90). Creative was not what held the event back.
  checks:
    - tool: get_campaign_creative_performance
      args: {campaign_name: "Weekend Home Event"}
      expect: ["CC-900001", "270", "CC-900004", "90", "3.77", "2.49"]
    - tool: get_campaign_creative_performance
      args: {campaign_name: "Spring Bedding"}
      expect: ["CC-900011", "2.8", "2.31"]
