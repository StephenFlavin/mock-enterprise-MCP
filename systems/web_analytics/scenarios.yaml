# One entry per question row that uses this system's tools (see: python -m mockmcp brief web_analytics).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.
- question: "03:23:Q2"
  story: >
    Demand planner is forecasting demand for a new recycled-polyester backpack range launching 12 January.
    Search trend data (ST-900006 to ST-900010) shows "recycled polyester" search volume growing from 8,500 in early September
    to 16,800 by early October, indicating strong customer interest. "Backpack" searches also trend up from 12,000 to 22,000.
    This data supports a positive base case forecast.
  checks:
    - tool: get_search_trend_data
      args: {search_term: "recycled polyester"}
      expect: ["ST-900006", "16800", "up"]
    - tool: get_search_trend_data
      args: {search_term: "backpack"}
      expect: ["ST-900005", "22000", "up"]

- question: "03:25:Q5"
  story: >
    Merchandise planner checks why athleisure range STY-5520 is 20% behind plan. Marketing activity data shows three campaigns
    (MA-900001 paid, MA-900002 social, MA-900003 email) with combined impressions of 1.45M and conversions totaling 1,210.
    Email channel (MA-900003) outperformed with 14,000 clicks and 560 conversions (4% conversion from clicks),
    while paid and social underperformed, suggesting creative or targeting issues need investigation.
  checks:
    - tool: get_marketing_activity_for_range
      args: {range_id: "STY-5520"}
      expect: ["MA-900001", "750000", "paid"]
    - tool: get_marketing_activity_for_range
      args: {range_id: "STY-5520"}
      expect: ["MA-900003", "email", "560"]

- question: "05:49:Q4"
  story: >
    Circular economy lead checks resale programme participation. Funnel data shows concerning drop-off:
    October views (3,800) declining 55% from August (8,500), item adds down 55%, checkouts down 55%, purchases down 55%.
    Purchase stage data shows 380 users in October vs 850 in August, with items sold declining from 170 to 76 units and
    GMV from 6,800 GBP to 3,040 GBP. This 55% decline suggests awareness, effort, or price barriers are reducing participation.
  checks:
    - tool: get_resale_programme_funnel_metrics
      args: {}
      expect: ["purchase", "76", "3040"]
    - tool: get_resale_programme_funnel_metrics
      args: {}
      expect: ["views", "3800"]

- question: "08:74:Q1"
  story: >
    E-commerce manager investigates conversion drop last week. Traffic mix from Sept 25-Oct 5 shows stable organic
    (10,700 mobile sessions converting at 2.05%, 5,750 desktop at 3.35% average). However, Oct 3-5 conversion rates dropped:
    paid desktop fell to 2.8-2.95% (from 3.2%), and organic mobile to 1.82-1.90% (from 2.1%), indicating device-specific issues.
    The 0.4-point drop concentrated on paid desktop (3.2% to 2.9%) and paid mobile (1.8% to 1.75%).
    Lost revenue calculation shows this drop cost approximately 1,200-1,400 GBP vs 2% baseline.
  checks:
    - tool: get_conversion_rate_by_device_and_day
      args: {date_from: "-7d"}
      expect: ["mobile", "1.82"]
    - tool: get_conversion_rate_by_device_and_day
      args: {date_from: "-7d"}
      expect: ["desktop", "2.92"]
    - tool: get_traffic_mix_by_channel
      args: {}
      expect: ["organic", "paid", "conversions"]
    - tool: calculate_lost_revenue_from_conversion_drop
      args: {date_from: "-7d", baseline_conversion_rate: 2.5}
      expect: ["lost_revenue", "gbp"]

- question: "08:74:Q2"
  story: >
    E-commerce manager forecasts Black Friday to Christmas order volumes (2026-11-25 to 2026-12-24).
    Traffic forecast data shows peak ramping: organic traffic grows from 18,000 on Nov 25 to 42,300 by Dec 24 (135% growth);
    paid from 12,000 to 28,200 (135% growth). Daily volumes increase especially in final week before Christmas.
    Revenue forecast shows organic channel peak revenue of 3.8M GBP on Dec 24 across all channels (~9M GBP total),
    with 75-85% forecast confidence. This supports planning DC capacity and carrier cutoff dates.
  checks:
    - tool: get_traffic_forecast_for_peak
      args: {date_from: "2026-11-25"}
      expect: ["2026-11-25", "organic", "18000"]
    - tool: get_traffic_forecast_for_peak
      args: {date_from: "2026-11-25"}
      expect: ["2026-12-24", "42300"]
    - tool: get_traffic_forecast_for_peak
      args: {date_from: "2026-11-25"}
      expect: ["forecast_volume", "confidence"]

- question: "08:74:Q3"
  story: >
    E-commerce manager evaluates next-day delivery expansion. Conversion metrics data shows next_day delivery option
    has consistently higher conversion rates than standard across date ranges: delivery_option column shows "next_day"
    performing 0.3-0.5 percentage points better than standard (e.g., 2.4% vs 2.0% for mobile). This conversion lift
    suggests next-day delivery increases purchase intent and margin impact is positive.
  checks:
    - tool: get_conversion_by_delivery_option
      args: {}
      expect: ["conversion_rate", "delivery_option"]

- question: "08:78:Q1"
  story: >
    Promotions planner analyzes why the "Home Event 20pct off" weekend promotion underperformed.
    Campaign creative performance data (CC-900001 through CC-900005) shows variance: image variant A (CC-900001)
    had best conversion (262 conversions on 8,750 clicks, 3.0% conv rate, 3.5% engagement),
    while video variant B (CC-900004) underperformed (90 conversions on 4,500 clicks, 2.0% conv rate, 3.0% engagement).
    Carousel variant A (CC-900005) achieved highest engagement at 5.5% but 5.5% click-to-conversion. Creative testing
    suggests video B variant and overall creative approach need improvement for next event.
  checks:
    - tool: get_campaign_creative_performance
      args: {campaign_name: "Home Event 20pct off"}
      expect: ["CC-900001", "image", "262"]
    - tool: get_campaign_creative_performance
      args: {campaign_name: "Home Event 20pct off"}
      expect: ["CC-900004", "video", "90"]
    - tool: get_campaign_creative_performance
      args: {campaign_name: "Home Event 20pct off"}
      expect: ["engagement_rate"]
