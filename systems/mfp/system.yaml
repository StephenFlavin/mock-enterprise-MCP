id: mfp
name: Merchandise Financial Planning (MFP)
instructions: >
  Open-to-buy budgets, sales forecasts, sell-through rates and markdown scenarios for merchandise planning.
  Planned buy ids look like PB-000123. Use for category-level financial planning, OTB allocation and
  margin forecasting.

tables:
  planned_buys:
    key: planned_buy_id
    cols:
      planned_buy_id: {type: str, desc: "Planned buy line, e.g. PB-000123"}
      category: {type: str, desc: "Product category, e.g. Dresses"}
      country_of_origin: {type: str, desc: "Country of manufacture (ISO code)"}
      fy_period: {type: int, desc: "Financial period 1-12 the buy is for"}
      season: {type: enum, values: [SS, AW], desc: "Trading season"}
      planned_units: {type: int, desc: "Planned purchase units"}
      planned_cost_gbp: {type: float, desc: "Planned total landed cost in GBP"}
      retail_value_gbp: {type: float, desc: "Planned retail value in GBP"}
      status: {type: enum, values: [draft, approved, confirmed, received, cancelled], desc: "Buy status"}
      created_at: {type: timestamp, desc: "When the plan was created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  sell_through_data:
    key: sell_through_id
    cols:
      sell_through_id: {type: str, desc: "Sell-through record, e.g. ST-000123"}
      category: {type: str, desc: "Product category"}
      sku: {type: str, desc: "SKU (optional, for detail)"}
      fy_period: {type: int, desc: "Financial period"}
      season: {type: enum, values: [SS, AW], desc: "Trading season"}
      region: {type: str, desc: "Trading region"}
      planned_units: {type: int, desc: "Units planned to sell"}
      actual_units: {type: int, desc: "Units actually sold"}
      planned_retail_gbp: {type: float, desc: "Planned revenue in GBP"}
      actual_retail_gbp: {type: float, desc: "Actual revenue in GBP"}
      sell_through_pct: {type: float, desc: "Actual / planned as percentage"}
      recorded_at: {type: timestamp, desc: "When recorded"}

  open_to_buy:
    key: otb_id
    cols:
      otb_id: {type: str, desc: "OTB allocation, e.g. OTB-000123"}
      category: {type: str, desc: "Product category"}
      fy_period: {type: int, desc: "Financial period"}
      season: {type: enum, values: [SS, AW], desc: "Trading season"}
      total_budget_gbp: {type: float, desc: "Total OTB budget in GBP"}
      allocated_gbp: {type: float, desc: "Amount allocated to buys"}
      unallocated_gbp: {type: float, desc: "Reserve for in-season chases"}
      chase_reserve_gbp: {type: float, desc: "Held back for in-season demand"}
      status: {type: enum, values: [draft, active, closed], desc: "OTB status"}
      last_updated_at: {type: timestamp, desc: "Last modification"}

  markdown_shrink_rates:
    key: rate_id
    cols:
      rate_id: {type: str, desc: "Rate record, e.g. MR-000123"}
      category: {type: str, desc: "Product category"}
      fy_period: {type: int, desc: "Financial period"}
      season: {type: enum, values: [SS, AW], desc: "Trading season"}
      markdown_pct: {type: float, desc: "Expected markdown as percentage of retail"}
      shrink_pct: {type: float, desc: "Expected shrink as percentage of units"}
      markdown_gbp_per_unit: {type: float, desc: "Average markdown discount per unit"}
      write_off_gbp_per_unit: {type: float, desc: "Expected write-off per unit"}
      basis: {type: str, desc: "Based on history (last year, trend, forecast)"}
      recorded_at: {type: timestamp, desc: "When recorded"}

  sales_forecasts:
    key: forecast_id
    cols:
      forecast_id: {type: str, desc: "Forecast record, e.g. FC-000123"}
      region: {type: str, desc: "Trading region, e.g. UK North"}
      category: {type: str, desc: "Product category"}
      fy_period: {type: int, desc: "Financial period"}
      season: {type: enum, values: [SS, AW], desc: "Trading season"}
      pessimistic_units: {type: int, desc: "Conservative forecast units"}
      pessimistic_gbp: {type: float, desc: "Downside revenue forecast"}
      base_forecast_units: {type: int, desc: "Base case forecast units"}
      base_forecast_gbp: {type: float, desc: "Base case revenue forecast"}
      optimistic_units: {type: int, desc: "Upside forecast units"}
      optimistic_gbp: {type: float, desc: "Upside revenue forecast"}
      forecast_date: {type: date, desc: "Date forecast was made"}

  otb_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Scenario, e.g. SC-000123"}
      scenario_name: {type: str, desc: "Scenario label, e.g. 'Cautious case'"}
      category: {type: str, desc: "Product category"}
      fy_period: {type: int, desc: "Financial period"}
      scenario_type: {type: enum, values: [base, optimistic, cautious], desc: "Scenario assumption level"}
      allocated_gbp: {type: float, desc: "Budget allocated to this category in scenario"}
      chase_reserve_gbp: {type: float, desc: "Reserve held for in-season chases"}
      expected_sell_through_pct: {type: float, desc: "Projected sell-through percentage"}
      expected_margin_pct: {type: float, desc: "Expected margin %"}
      created_at: {type: timestamp, desc: "When scenario was created"}

  period_forecasts:
    key: period_forecast_id
    cols:
      period_forecast_id: {type: str, desc: "Period forecast, e.g. PF-000123"}
      region: {type: str, desc: "Trading region"}
      fy_period: {type: int, desc: "Financial period being forecasted"}
      forecast_date: {type: date, desc: "Date forecast was made"}
      forecast_units: {type: int, desc: "Forecasted units"}
      forecast_value_gbp: {type: float, desc: "Forecasted revenue in GBP"}
      forecast_vs_plan_pct: {type: float, desc: "Forecast variance vs original plan %"}
      status: {type: enum, values: [draft, published, final], desc: "Forecast status"}
      recorded_at: {type: timestamp, desc: "When recorded"}

tools:
  - name: get_planned_buy_by_category_and_country
    desc: Planned buy by category and country. Use to see purchasing plans by source.
    kind: sql
    args:
      category: {}
      country_of_origin: {type: str, desc: "Country (ISO code)"}
      fy_period: {type: int, desc: "Financial period"}
      season: {}
    sql: |
      SELECT planned_buy_id, category, country_of_origin, fy_period, season,
             planned_units, planned_cost_gbp, retail_value_gbp, status
      FROM planned_buys
      WHERE ($category IS NULL OR category = $category)
        AND ($country_of_origin IS NULL OR country_of_origin = $country_of_origin)
        AND ($fy_period IS NULL OR fy_period = $fy_period)
        AND ($season IS NULL OR season = $season)
      ORDER BY category, planned_buy_id
    limit: 100
    example: {category: "Knitwear"}

  - name: get_sell_through_by_category
    desc: Actual sell-through by category and period. Use to track performance vs plan.
    kind: sql
    args:
      category: {}
      fy_period: {type: int, desc: "Financial period"}
      season: {}
      region: {type: str, desc: "Trading region"}
    sql: |
      SELECT sell_through_id, category, fy_period, season, region,
             planned_units, actual_units, planned_retail_gbp, actual_retail_gbp,
             sell_through_pct
      FROM sell_through_data
      WHERE ($category IS NULL OR category = $category)
        AND ($fy_period IS NULL OR fy_period = $fy_period)
        AND ($season IS NULL OR season = $season)
        AND ($region IS NULL OR region = $region)
      ORDER BY category, sell_through_id
    limit: 100
    example: {category: "Knitwear"}

  - name: get_open_to_buy_by_category
    desc: Open-to-buy budget and allocation by category. Shows total, allocated and unallocated amounts.
    kind: sql
    args:
      category: {}
      fy_period: {type: int, desc: "Financial period"}
    sql: |
      SELECT otb_id, category, fy_period, season, total_budget_gbp,
             allocated_gbp, unallocated_gbp, chase_reserve_gbp, status
      FROM open_to_buy
      WHERE ($category IS NULL OR category = $category)
        AND ($fy_period IS NULL OR fy_period = $fy_period)
      ORDER BY category
    limit: 50
    example: {fy_period: 3}

  - name: get_markdown_and_shrink_rates
    desc: "Markdown and shrink rates by category and period. Use to estimate end-of-season margin impact."
    kind: sql
    args:
      category: {}
      fy_period: {type: int, desc: "Financial period"}
      season: {}
    sql: |
      SELECT rate_id, category, fy_period, season,
             markdown_pct, shrink_pct, markdown_gbp_per_unit, write_off_gbp_per_unit, basis
      FROM markdown_shrink_rates
      WHERE ($category IS NULL OR category = $category)
        AND ($fy_period IS NULL OR fy_period = $fy_period)
        AND ($season IS NULL OR season = $season)
      ORDER BY category, fy_period
    limit: 50
    example: {category: "Knitwear", fy_period: 3}

  - name: get_sell_through_rates
    desc: Sell-through rates by SKU and season. Use to identify fast movers and laggards.
    kind: sql
    args:
      sku: {type: str, desc: "Product SKU, e.g. PF-220"}
      season: {}
      category: {}
    sql: |
      SELECT sku, category, season, fy_period,
             planned_units, actual_units, sell_through_pct,
             actual_retail_gbp
      FROM sell_through_data
      WHERE ($sku IS NULL OR sku = $sku)
        AND ($season IS NULL OR season = $season)
        AND ($category IS NULL OR category = $category)
      ORDER BY sell_through_pct DESC, sku
    limit: 100
    example: {season: "AW"}

  - name: get_sell_through_vs_plan
    desc: Sell-through performance vs plan by category showing variance. Use to assess momentum.
    kind: sql
    args:
      category: {required: true}
      fy_period: {type: int, desc: "Financial period"}
    sql: |
      SELECT sell_through_id, category, fy_period, season, region,
             planned_units, actual_units,
             round((actual_units - planned_units) * 100.0 / planned_units, 1) AS variance_pct,
             planned_retail_gbp, actual_retail_gbp,
             round((actual_retail_gbp - planned_retail_gbp) * 100.0 / planned_retail_gbp, 1) AS revenue_variance_pct
      FROM sell_through_data
      WHERE category = $category
        AND ($fy_period IS NULL OR fy_period = $fy_period)
      ORDER BY variance_pct DESC, region
    limit: 50
    example: {category: "Knitwear", fy_period: 3}

  - name: get_category_sell_through_trends
    desc: Sell-through trends by category across recent periods. Use for OTB scenario planning.
    kind: sql
    args:
      category: {required: true}
      seasons: {type: int, default: 2, desc: "Number of past seasons to include"}
    sql: |
      SELECT category, season, fy_period, region,
             sum(planned_units) AS total_planned_units,
             sum(actual_units) AS total_actual_units,
             round(sum(actual_units) * 100.0 / sum(planned_units), 1) AS aggregate_sell_through_pct,
             round(sum(actual_retail_gbp) * 100.0 / sum(planned_retail_gbp), 1) AS revenue_sell_through_pct
      FROM sell_through_data
      WHERE category = $category
      GROUP BY category, season, fy_period, region
      ORDER BY fy_period DESC, region
    limit: 50
    example: {category: "Knitwear"}

  - name: get_sales_forecast_for_region
    desc: Sales forecast by region with optimistic and cautious scenarios. Use for capacity and range decisions.
    kind: sql
    args:
      region: {required: true}
      fy_period: {type: int, desc: "Financial period"}
    sql: |
      SELECT forecast_id, region, category, fy_period, season,
             base_forecast_units, base_forecast_gbp,
             pessimistic_units, pessimistic_gbp,
             optimistic_units, optimistic_gbp,
             forecast_date
      FROM sales_forecasts
      WHERE region = $region
        AND ($fy_period IS NULL OR fy_period = $fy_period)
      ORDER BY category, fy_period DESC
    limit: 50
    example: {region: "UK North"}

  - name: run_open_to_buy_scenario
    desc: Model OTB allocation scenarios (optimistic, cautious, base) by category. Returns allocation and reserve for each.
    kind: sql
    args:
      fy_period: {required: true, type: int}
      scenario_type: {type: enum, values: [base, optimistic, cautious], desc: "Scenario assumption level"}
      category: {type: str, desc: "Filter to one category (optional)"}
    sql: |
      SELECT scenario_id, scenario_name, category, fy_period, scenario_type,
             allocated_gbp, chase_reserve_gbp, expected_sell_through_pct,
             expected_margin_pct, created_at
      FROM otb_scenarios
      WHERE fy_period = $fy_period
        AND ($scenario_type IS NULL OR scenario_type = $scenario_type)
        AND ($category IS NULL OR category = $category)
      ORDER BY category, allocated_gbp DESC
    limit: 50
    example: {fy_period: 3, scenario_type: "cautious"}

  - name: calculate_in_season_chase_reserve
    desc: Calculate recommended in-season chase reserve based on sell-through trends and category volatility.
    kind: sql
    args:
      category: {required: true}
      fy_period: {required: true, type: int}
      total_otb_gbp: {required: true, type: float, desc: "Total OTB budget in GBP"}
    sql: |
      SELECT $category AS category,
             $fy_period AS fy_period,
             $total_otb_gbp AS total_budget_gbp,
             round($total_otb_gbp * 0.2, 2) AS recommended_chase_reserve_gbp,
             round($total_otb_gbp * 0.8, 2) AS allocation_for_initial_buy_gbp,
             'chase_reserve = total * 0.20 (20% for volatility)' AS formula
      FROM open_to_buy
      WHERE category = $category AND fy_period = $fy_period
      LIMIT 1
    limit: 1
    example: {category: "Knitwear", fy_period: 3, total_otb_gbp: 2100000}

  - name: compare_buy_scenarios
    desc: Compare OTB scenarios (optimistic vs cautious) with key assumptions. Use for scenario decision-making.
    kind: sql
    args:
      fy_period: {required: true, type: int}
    sql: |
      SELECT scenario_type, category,
             sum(allocated_gbp) AS total_allocated_gbp,
             sum(chase_reserve_gbp) AS total_reserve_gbp,
             round(avg(expected_sell_through_pct), 1) AS avg_sell_through_pct,
             round(avg(expected_margin_pct), 1) AS avg_margin_pct
      FROM otb_scenarios
      WHERE fy_period = $fy_period
      GROUP BY scenario_type, category
      ORDER BY scenario_type DESC, category
    limit: 50
    example: {fy_period: 3}

  - name: run_period_outturn_forecast
    desc: Forecast period outturn by region based on current sell-through trends. Shows forecast vs plan.
    kind: sql
    args:
      region: {required: true}
      fy_period: {required: true, type: int}
    sql: |
      SELECT period_forecast_id, region, fy_period, forecast_date,
             forecast_units, forecast_value_gbp,
             round(forecast_vs_plan_pct, 1) AS forecast_vs_plan_pct,
             status
      FROM period_forecasts
      WHERE region = $region AND fy_period = $fy_period
      ORDER BY forecast_date DESC
    limit: 20
    example: {region: "UK North", fy_period: 3}

  - name: run_market_sales_forecast
    desc: Market-level sales forecast for expansion analysis. Returns base, pessimistic and optimistic cases.
    kind: sql
    args:
      region: {required: true}
      fy_period: {type: int, desc: "Financial period (default all periods)"}
    sql: |
      SELECT forecast_id, region, category, fy_period, season,
             base_forecast_units, base_forecast_gbp,
             pessimistic_units, pessimistic_gbp,
             optimistic_units, optimistic_gbp
      FROM sales_forecasts
      WHERE region = $region
        AND ($fy_period IS NULL OR fy_period = $fy_period)
      ORDER BY category
    limit: 50
    example: {region: "Spain", fy_period: 1}

  - name: update_open_to_buy_allocation
    desc: Update OTB allocation by category, including reserve. Returns old and new allocation.
    kind: update
    table: open_to_buy
    set: {allocated_gbp: "{allocated_gbp}", unallocated_gbp: "{unallocated_gbp}", chase_reserve_gbp: "{chase_reserve_gbp}", last_updated_at: "$as_of"}
    args:
      allocated_gbp: {required: true, type: float, desc: "New allocated amount in GBP"}
      unallocated_gbp: {required: false, type: float, desc: "New unallocated amount in GBP"}
      chase_reserve_gbp: {required: false, type: float, desc: "New chase reserve in GBP"}
    example: {otb_id: OTB-900001, allocated_gbp: 1680000, chase_reserve_gbp: 420000}
