id: mfp
name: Merchandise Financial Planning (MFP)
instructions: >
  Merchandise financial planning: planned buys by category and origin country, weekly sell-through vs plan,
  open-to-buy (OTB) budgets and scenarios, markdown and shrink rates, regional period forecasts and market
  expansion forecasts. Categories and countries use master names (Knitwear, VN); OTB ids look like OTB-900005.

tables:
  planned_buys:
    key: planned_buy_id
    cols:
      planned_buy_id: {type: str, desc: "Planned buy line, e.g. PB-900001"}
      category: {type: str, desc: "Product category as in master, e.g. Footwear"}
      country_of_origin: {type: str, desc: "Country of manufacture, ISO code e.g. VN"}
      buy_year: {type: int, desc: "Calendar year the buy lands and trades, e.g. 2027"}
      fy_period: {type: int, desc: "Financial period 1-12 the buy is for"}
      season: {type: enum, values: [SS, AW], desc: "Trading season"}
      planned_units: {type: int, desc: "Planned purchase units"}
      planned_cost_gbp: {type: float, desc: "Planned total landed cost in GBP"}
      retail_value_gbp: {type: float, desc: "Planned retail value in GBP"}
      status: {type: enum, values: [draft, approved, confirmed, received, cancelled], desc: "Buy status"}
      created_at: {type: timestamp, desc: "When the plan was created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  sell_through_data:
    key: sell_through_id
    cols:
      sell_through_id: {type: str, desc: "Weekly sell-through record, e.g. ST-000123"}
      department: {type: str, desc: "Master department, e.g. Womenswear, Menswear, Kids, Accessories, Home"}
      category: {type: str, desc: "Product category as in master, e.g. Knitwear"}
      range_name: {type: str, desc: "Named range if the line is a special range, e.g. Athleisure; blank for core ranges"}
      region: {type: str, desc: "Trading region, e.g. UK North"}
      week_start: {type: date, desc: "Monday of the trading week"}
      fy_period: {type: int, desc: "Financial period 1-12 of the week"}
      season: {type: enum, values: [SS, AW], desc: "Trading season of the week"}
      planned_units: {type: int, desc: "Units planned to sell that week"}
      actual_units: {type: int, desc: "Units actually sold that week"}
      planned_retail_gbp: {type: float, desc: "Planned revenue in GBP"}
      actual_retail_gbp: {type: float, desc: "Actual revenue in GBP"}
      sell_through_pct: {type: float, desc: "Actual units as a percentage of planned units (100 = on plan)"}

  sku_sell_through:
    key: [sku, season]
    cols:
      sku: {type: str, desc: "SKU as in master, e.g. SKU-100007"}
      category: {type: str, desc: "Product category as in master"}
      season: {type: str, desc: "Master season code of the SKU: SS26, AW26 or CORE"}
      received_units: {type: int, desc: "Units bought into stock for the season"}
      units_sold: {type: int, desc: "Units sold so far"}
      sell_through_pct: {type: float, desc: "Units sold as a percentage of units received"}
      weeks_on_sale: {type: int, desc: "Weeks the SKU has been on sale"}
      retail_sales_gbp: {type: float, desc: "Revenue to date in GBP"}

  open_to_buy:
    key: otb_id
    cols:
      otb_id: {type: str, desc: "OTB budget line for a category and season, e.g. OTB-900005"}
      category: {type: str, desc: "Product category as in master"}
      season: {type: enum, values: [SS, AW], desc: "Trading season the budget is for (SS = spring/summer)"}
      buy_year: {type: int, desc: "Calendar year the season trades, e.g. 2027"}
      total_budget_gbp: {type: float, desc: "Total open-to-buy budget in GBP"}
      allocated_gbp: {type: float, desc: "Amount committed to buys"}
      unallocated_gbp: {type: float, desc: "Budget not yet committed (total minus allocated)"}
      chase_reserve_gbp: {type: float, desc: "Part of the unallocated budget held for in-season chases"}
      status: {type: enum, values: [draft, active, closed], desc: "OTB status"}
      last_updated_at: {type: timestamp, desc: "Last modification"}

  markdown_shrink_rates:
    key: rate_id
    cols:
      rate_id: {type: str, desc: "Rate record, e.g. MR-000123"}
      category: {type: str, desc: "Product category as in master"}
      period_start: {type: date, desc: "Start of the four-week block"}
      fy_period: {type: int, desc: "Financial period"}
      season: {type: enum, values: [SS, AW], desc: "Trading season"}
      net_sales_gbp: {type: float, desc: "Net sales in the block, GBP (weights the rates)"}
      markdown_pct: {type: float, desc: "Markdown as a percentage of net sales"}
      shrink_pct: {type: float, desc: "Shrink (theft, damage, error) as a percentage of net sales"}
      ly_markdown_pct: {type: float, desc: "Markdown percentage in the same block last year"}
      ly_shrink_pct: {type: float, desc: "Shrink percentage in the same block last year"}
      markdown_gbp_per_unit: {type: float, desc: "Average markdown discount per unit"}
      write_off_gbp_per_unit: {type: float, desc: "Average shrink write-off per unit"}
      basis: {type: str, desc: "actual or forecast"}
      driver_note: {type: text, desc: "What is behind the rate, and whether it is temporary or structural"}
      recorded_at: {type: timestamp, desc: "When recorded"}

  sales_forecasts:
    key: forecast_id
    cols:
      forecast_id: {type: str, desc: "Forecast record, e.g. FC-000123"}
      region: {type: str, desc: "Trading region, e.g. UK North"}
      category: {type: str, desc: "Product category as in master"}
      fy_period: {type: int, desc: "Financial period"}
      season: {type: enum, values: [SS, AW], desc: "Trading season"}
      period_start: {type: date, desc: "First day of the period"}
      period_end: {type: date, desc: "Last day of the period"}
      plan_gbp: {type: float, desc: "Planned revenue for the period in GBP"}
      pessimistic_units: {type: int, desc: "Cautious forecast units"}
      pessimistic_gbp: {type: float, desc: "Downside revenue forecast"}
      base_forecast_units: {type: int, desc: "Base case forecast units"}
      base_forecast_gbp: {type: float, desc: "Base case revenue forecast"}
      optimistic_units: {type: int, desc: "Upside forecast units"}
      optimistic_gbp: {type: float, desc: "Upside revenue forecast"}
      forecast_date: {type: date, desc: "Date forecast was made"}

  otb_scenarios:
    key: scenario_id
    cols:
      scenario_id: {type: str, desc: "Scenario line, e.g. SC-900001"}
      scenario_name: {type: str, desc: "Scenario label, e.g. Cautious case"}
      category: {type: str, desc: "Product category as in master"}
      season: {type: enum, values: [SS, AW], desc: "Trading season the scenario is for"}
      buy_year: {type: int, desc: "Calendar year the season trades"}
      scenario_type: {type: enum, values: [base, optimistic, cautious], desc: "Scenario assumption level"}
      allocated_gbp: {type: float, desc: "Budget allocated to buys for this category in the scenario"}
      chase_reserve_gbp: {type: float, desc: "Budget held back for in-season chases"}
      expected_sales_growth_pct: {type: float, desc: "Assumed sales growth on last year"}
      expected_sell_through_pct: {type: float, desc: "Projected sell-through percentage"}
      markdown_assumption_pct: {type: float, desc: "Assumed markdown as a percentage of sales"}
      expected_margin_pct: {type: float, desc: "Expected margin %"}
      assumptions: {type: text, desc: "Plain-language assumptions behind the scenario"}
      created_at: {type: timestamp, desc: "When scenario was created"}

  period_forecasts:
    key: period_forecast_id
    cols:
      period_forecast_id: {type: str, desc: "Period forecast, e.g. PF-000123"}
      region: {type: str, desc: "Trading region, e.g. UK North"}
      fy_period: {type: int, desc: "Financial period being forecast"}
      period_start: {type: date, desc: "First day of the period"}
      period_end: {type: date, desc: "Last day of the period"}
      forecast_date: {type: date, desc: "Date forecast was made"}
      plan_value_gbp: {type: float, desc: "Planned revenue for the period in GBP"}
      actual_to_date_gbp: {type: float, desc: "Revenue banked so far in the period"}
      forecast_value_gbp: {type: float, desc: "Forecast revenue outturn for the whole period in GBP"}
      forecast_units: {type: int, desc: "Forecast units for the period"}
      forecast_vs_plan_pct: {type: float, desc: "Forecast variance vs plan, %"}
      forecast_vs_last_year_pct: {type: float, desc: "Forecast variance vs last year, %"}
      key_risks: {type: text, desc: "Main risks to the forecast"}
      status: {type: enum, values: [draft, published, final], desc: "Forecast status"}

  market_forecasts:
    key: market_forecast_id
    cols:
      market_forecast_id: {type: str, desc: "Market forecast line, e.g. MF-000001"}
      market: {type: str, desc: "Country market, e.g. Spain"}
      country_code: {type: str, desc: "ISO country code, e.g. ES"}
      scenario: {type: enum, values: [base, downside, upside], desc: "Forecast case"}
      year_no: {type: int, desc: "Year after launch, 1 to 5"}
      stores_open: {type: int, desc: "Stores trading in the year"}
      sales_gbp: {type: float, desc: "Forecast sales in GBP (stores plus online)"}
      units: {type: int, desc: "Forecast units"}
      gross_margin_pct: {type: float, desc: "Forecast gross margin %"}
      assumptions: {type: text, desc: "Key assumptions behind the year"}
      forecast_date: {type: date, desc: "Date forecast was made"}

tools:
  - name: get_planned_buy_by_category_and_country
    desc: Planned buy units, landed cost and retail value by category and origin country for a buy year, cancelled lines excluded. Use to size tariff or sourcing changes.
    kind: sql
    args:
      category: {}
      country_of_origin: {type: str, desc: "Origin country, ISO code or name, e.g. VN or Vietnam"}
      buy_year: {type: int, desc: "Calendar year of the buy, e.g. 2027"}
      season: {}
    sql: |
      WITH names(code, cname) AS (VALUES ('VN','vietnam'),('ID','indonesia'),('IN','india'),('CN','china'),('TR','turkey'),
        ('IT','italy'),('PT','portugal'),('BD','bangladesh'),('MX','mexico'),('PL','poland'),('DE','germany'),('FR','france'),('GB','united kingdom'))
      SELECT b.category, b.country_of_origin, b.buy_year, count(*) AS buy_lines,
             sum(b.planned_units) AS planned_units,
             round(sum(b.planned_cost_gbp)) AS planned_cost_gbp,
             round(sum(b.retail_value_gbp)) AS retail_value_gbp,
             round(sum(b.planned_cost_gbp) / sum(b.planned_units), 2) AS cost_per_unit_gbp,
             round((1 - sum(b.planned_cost_gbp) / sum(b.retail_value_gbp)) * 100, 1) AS planned_margin_pct
      FROM planned_buys b
      WHERE b.status <> 'cancelled'
        AND ($category IS NULL OR b.category = $category)
        AND ($country_of_origin IS NULL OR b.country_of_origin = upper($country_of_origin)
             OR b.country_of_origin IN (SELECT code FROM names WHERE cname = lower($country_of_origin)))
        AND ($buy_year IS NULL OR b.buy_year = $buy_year)
        AND ($season IS NULL OR b.season = $season)
      GROUP BY b.category, b.country_of_origin, b.buy_year
      ORDER BY b.buy_year DESC, b.category, planned_cost_gbp DESC
    limit: 100
    example: {category: "Footwear", buy_year: 2027}

  - name: get_sell_through_by_category
    desc: Sell-through (units sold as % of plan) by category and financial period, with units and revenue. Use to see trend and shortfall by category, department or region.
    kind: sql
    args:
      category: {}
      department: {type: str, desc: "Master department, e.g. Womenswear, Menswear, Kids, Accessories, Home"}
      region: {type: str, desc: "Trading region, e.g. UK North; omit for all regions"}
      date_from: {type: date, default: "-60d", desc: "Include weeks starting on or after this date"}
      date_to: {type: date, desc: "Include weeks starting on or before this date"}
    sql: |
      SELECT department, category, fy_period, season,
             CASE WHEN $region IS NULL THEN 'All regions' ELSE $region END AS region,
             sum(planned_units) AS planned_units, sum(actual_units) AS actual_units,
             round(sum(actual_units) * 100.0 / sum(planned_units), 1) AS sell_through_pct,
             round(sum(planned_retail_gbp)) AS planned_retail_gbp, round(sum(actual_retail_gbp)) AS actual_retail_gbp,
             round((sum(actual_retail_gbp) - sum(planned_retail_gbp)) * 100.0 / sum(planned_retail_gbp), 1) AS revenue_vs_plan_pct
      FROM sell_through_data
      WHERE ($category IS NULL OR category = $category)
        AND ($department IS NULL OR department = $department)
        AND ($region IS NULL OR region = $region)
        AND week_start >= CAST($date_from AS DATE)
        AND ($date_to IS NULL OR week_start <= CAST($date_to AS DATE))
      GROUP BY ALL
      ORDER BY category, department, fy_period DESC
    limit: 100
    example: {category: "Knitwear", department: "Womenswear", date_from: "-30d"}

  - name: get_open_to_buy_by_category
    desc: Open-to-buy budget by category with allocated, unallocated and chase reserve amounts, plus a total row. Defaults to active budgets.
    kind: sql
    args:
      category: {}
      season: {}
      buy_year: {type: int, desc: "Calendar year the season trades, e.g. 2027"}
      status: {type: enum, values: [draft, active, closed], default: active, desc: "Budget status"}
    sql: |
      WITH o AS (
        SELECT otb_id, category, CAST(season AS VARCHAR) AS season, buy_year, total_budget_gbp, allocated_gbp,
               unallocated_gbp, chase_reserve_gbp, CAST(status AS VARCHAR) AS status
        FROM open_to_buy
        WHERE ($category IS NULL OR category = $category) AND ($season IS NULL OR season = $season)
          AND ($buy_year IS NULL OR buy_year = $buy_year) AND status = $status)
      SELECT 1 AS ord, * FROM o
      UNION ALL
      SELECT 2, 'TOTAL', 'All categories', CASE WHEN count(DISTINCT season) = 1 THEN min(season) ELSE 'ALL' END,
             CASE WHEN count(DISTINCT buy_year) = 1 THEN min(buy_year) ELSE NULL END,
             sum(total_budget_gbp), sum(allocated_gbp), sum(unallocated_gbp), sum(chase_reserve_gbp), $status
      FROM o HAVING count(*) > 0
      ORDER BY ord, category
    limit: 50
    example: {season: SS}

  - name: get_markdown_and_shrink_rates
    desc: "Markdown and shrink rates by category over a period versus last year, with margin impact in points and a total row. Use to size the markdown and shrink part of a margin change."
    kind: sql
    args:
      category: {}
      date_from: {type: date, default: "-90d", desc: "Include four-week blocks starting on or after this date"}
      date_to: {type: date, desc: "Include blocks starting on or before this date"}
    sql: |
      WITH w AS (
        SELECT category, sum(net_sales_gbp) AS ns,
               sum(markdown_pct * net_sales_gbp) / sum(net_sales_gbp) AS md, sum(ly_markdown_pct * net_sales_gbp) / sum(net_sales_gbp) AS lmd,
               sum(shrink_pct * net_sales_gbp) / sum(net_sales_gbp) AS sh, sum(ly_shrink_pct * net_sales_gbp) / sum(net_sales_gbp) AS lsh,
               max(driver_note) AS driver_note
        FROM markdown_shrink_rates
        WHERE ($category IS NULL OR category = $category) AND period_start >= CAST($date_from AS DATE)
          AND ($date_to IS NULL OR period_start <= CAST($date_to AS DATE))
        GROUP BY category),
      t AS (
        SELECT 'ALL CATEGORIES' AS category, sum(ns) AS ns, sum(md * ns) / sum(ns) AS md, sum(lmd * ns) / sum(ns) AS lmd,
               sum(sh * ns) / sum(ns) AS sh, sum(lsh * ns) / sum(ns) AS lsh, 'Total of the categories above' AS driver_note FROM w HAVING count(*) > 0),
      a AS (SELECT 1 AS ord, * FROM w UNION ALL SELECT 2, * FROM t)
      SELECT category, round(ns) AS net_sales_gbp, round(ns * 100 / (SELECT sum(ns) FROM w), 1) AS share_of_sales_pct,
             round(md, 1) AS markdown_pct, round(lmd, 1) AS ly_markdown_pct, round(md - lmd, 1) AS markdown_change_pts,
             round(sh, 1) AS shrink_pct, round(lsh, 1) AS ly_shrink_pct, round(sh - lsh, 1) AS shrink_change_pts,
             round(-((md - lmd) + (sh - lsh)) * ns / (SELECT sum(ns) FROM w) , 2) AS margin_impact_pts, driver_note
      FROM a ORDER BY ord, margin_impact_pts
    limit: 50
    example: {date_from: "-60d"}

  - name: get_sell_through_rates
    desc: Season sell-through by SKU or by category (units sold as % of received), with unsold units and unsold cost. Lowest sell-through first; use to find slow movers.
    kind: sql
    args:
      sku: {}
      season: {type: str, desc: "Master season code: SS26, AW26 or CORE"}
      category: {}
      max_sell_through_pct: {type: float, desc: "Only SKUs at or below this sell-through percentage, e.g. 60"}
      group_by: {type: enum, values: [sku, category], default: sku, desc: "Row level: one row per SKU, or per category"}
    sql: |
      WITH g AS (
      SELECT CASE WHEN $group_by = 'category' THEN 'ALL SKUS' ELSE s.sku END AS sku,
             CASE WHEN $group_by = 'category' THEN '' ELSE p.status END AS sku_status,
             s.category, s.season, count(*) AS skus,
             sum(s.received_units) AS received_units, sum(s.units_sold) AS units_sold,
             sum(s.received_units - s.units_sold) AS unsold_units,
             round(sum(s.units_sold) * 100.0 / sum(s.received_units), 1) AS sell_through_pct,
             round(sum((s.received_units - s.units_sold) * p.unit_cost_gbp)) AS unsold_cost_gbp
      FROM sku_sell_through s JOIN master.products p ON p.sku = s.sku
      WHERE ($sku IS NULL OR s.sku = $sku) AND ($season IS NULL OR s.season = $season)
        AND ($category IS NULL OR s.category = $category)
        AND ($max_sell_through_pct IS NULL OR s.sell_through_pct <= $max_sell_through_pct)
      GROUP BY ALL)
      SELECT * FROM g ORDER BY CASE WHEN $group_by = 'category' THEN -unsold_cost_gbp ELSE sell_through_pct END, sku
    limit: 100
    example: {season: SS26, max_sell_through_pct: 60, group_by: category}

  - name: get_sell_through_vs_plan
    desc: Sell-through versus plan over a period, worst variance first, by category or region. Filter by season, range or department to see which lines are behind plan.
    kind: sql
    args:
      category: {}
      department: {type: str, desc: "Master department, e.g. Womenswear, Menswear, Kids, Accessories, Home"}
      range_name: {type: str, desc: "Named range, e.g. Athleisure; omit for all lines"}
      season: {}
      region: {type: str, desc: "Trading region, e.g. UK North"}
      by: {type: enum, values: [category, region], default: category, desc: "Group results by category or by region"}
      date_from: {type: date, default: "-90d", desc: "Include weeks starting on or after this date"}
    sql: |
      SELECT department, category, COALESCE(NULLIF(range_name, ''), 'core') AS range_name,
             CASE WHEN $by = 'region' THEN region ELSE 'All regions' END AS region,
             sum(planned_units) AS planned_units, sum(actual_units) AS actual_units,
             round((sum(actual_units) - sum(planned_units)) * 100.0 / sum(planned_units), 1) AS variance_pct,
             round(sum(planned_retail_gbp)) AS planned_retail_gbp, round(sum(actual_retail_gbp)) AS actual_retail_gbp,
             round((sum(actual_retail_gbp) - sum(planned_retail_gbp)) * 100.0 / sum(planned_retail_gbp), 1) AS revenue_variance_pct
      FROM sell_through_data
      WHERE ($category IS NULL OR category = $category) AND ($department IS NULL OR department = $department)
        AND ($range_name IS NULL OR lower(range_name) = lower($range_name))
        AND ($season IS NULL OR season = $season) AND ($region IS NULL OR region = $region)
        AND week_start >= CAST($date_from AS DATE)
      GROUP BY ALL
      ORDER BY variance_pct, category
    limit: 50
    example: {season: AW}

  - name: get_category_sell_through_trends
    desc: Sell-through versus plan by category for the latest financial periods, with the change from the previous period. Use to see which categories are improving or fading.
    kind: sql
    args:
      category: {}
      department: {type: str, desc: "Master department, e.g. Womenswear, Menswear, Kids, Accessories, Home"}
      periods: {type: int, default: 3, desc: "Number of latest financial periods to show"}
    sql: |
      WITH p AS (
        SELECT category, fy_period, min(season) AS season, sum(planned_units) AS pu, sum(actual_units) AS au,
               sum(actual_retail_gbp) AS ar, sum(planned_retail_gbp) AS pr
        FROM sell_through_data
        WHERE ($category IS NULL OR category = $category) AND ($department IS NULL OR department = $department)
        GROUP BY category, fy_period),
      q AS (SELECT *, lag(au * 100.0 / pu) OVER (PARTITION BY category ORDER BY fy_period) AS prev FROM p)
      SELECT category, fy_period, season, pu AS total_planned_units, au AS total_actual_units,
             round(au * 100.0 / pu, 1) AS sell_through_pct, round(ar * 100.0 / pr, 1) AS revenue_sell_through_pct,
             round(au * 100.0 / pu - prev, 1) AS change_vs_prior_period_pts
      FROM q WHERE fy_period > (SELECT max(fy_period) FROM sell_through_data) - $periods
      ORDER BY category, fy_period DESC
    limit: 100
    example: {category: "Knitwear"}

  - name: get_sales_forecast_for_region
    desc: Sales forecast by category for a region and period, with pessimistic, base and optimistic cases against plan, plus a total row. Defaults to the current period.
    kind: sql
    args:
      region: {required: true, type: str, desc: "Trading region, e.g. UK North, UK South, Scotland"}
      category: {}
      fy_period: {type: int, desc: "Financial period; omit for the current one"}
    sql: |
      WITH f AS (
        SELECT * FROM sales_forecasts
        WHERE region = $region AND ($category IS NULL OR category = $category)
          AND (($fy_period IS NULL AND CAST($as_of AS DATE) BETWEEN period_start AND period_end) OR fy_period = $fy_period)),
      a AS (
        SELECT 1 AS ord, category, fy_period, period_start, period_end, plan_gbp, pessimistic_gbp, base_forecast_gbp,
               optimistic_gbp, base_forecast_units, forecast_date FROM f
        UNION ALL
        SELECT 2, 'TOTAL', min(fy_period), min(period_start), min(period_end), sum(plan_gbp), sum(pessimistic_gbp),
               sum(base_forecast_gbp), sum(optimistic_gbp), sum(base_forecast_units), max(forecast_date) FROM f HAVING count(*) > 0)
      SELECT $region AS region, category, fy_period, period_start, period_end, round(plan_gbp) AS plan_gbp,
             round(pessimistic_gbp) AS pessimistic_gbp, round(base_forecast_gbp) AS base_gbp, round(optimistic_gbp) AS optimistic_gbp,
             round((base_forecast_gbp - plan_gbp) * 100.0 / plan_gbp, 1) AS base_vs_plan_pct, base_forecast_units, forecast_date
      FROM a ORDER BY ord, base_vs_plan_pct
    limit: 50
    example: {region: "UK North"}

  - name: run_open_to_buy_scenario
    desc: Modelled open-to-buy allocation and chase reserve by category for the base, optimistic and cautious cases, with scenario totals.
    kind: sql
    args:
      season: {required: true}
      buy_year: {type: int, desc: "Calendar year the season trades; omit for the latest"}
      scenario_type: {type: enum, values: [base, optimistic, cautious], desc: "Scenario assumption level; omit for all three"}
      category: {}
    sql: |
      WITH s AS (
        SELECT * FROM otb_scenarios
        WHERE season = $season AND buy_year = COALESCE($buy_year, (SELECT max(buy_year) FROM otb_scenarios WHERE season = $season))
          AND ($scenario_type IS NULL OR scenario_type = $scenario_type) AND ($category IS NULL OR category = $category)),
      a AS (
        SELECT 1 AS ord, scenario_type, scenario_id, category, allocated_gbp, chase_reserve_gbp, expected_sales_growth_pct,
               expected_sell_through_pct, markdown_assumption_pct, expected_margin_pct FROM s
        UNION ALL
        SELECT 2, scenario_type, 'TOTAL', 'All categories', sum(allocated_gbp), sum(chase_reserve_gbp),
               round(avg(expected_sales_growth_pct), 1), round(avg(expected_sell_through_pct), 1),
               round(avg(markdown_assumption_pct), 1), round(avg(expected_margin_pct), 1) FROM s GROUP BY scenario_type)
      SELECT scenario_type, scenario_id, category, allocated_gbp, chase_reserve_gbp, expected_sales_growth_pct,
             expected_sell_through_pct, markdown_assumption_pct, expected_margin_pct
      FROM a ORDER BY scenario_type, ord, category
    limit: 50
    example: {season: SS, scenario_type: cautious}

  - name: calculate_in_season_chase_reserve
    desc: Recommend the in-season chase reserve by category from sell-through volatility and the latest shortfall to plan, scaled to a total OTB. Shows inputs and formula.
    kind: sql
    args:
      total_otb_gbp: {required: true, type: float, desc: "Total open-to-buy budget in GBP to split, e.g. 2100000"}
      season: {default: SS}
      buy_year: {type: int, desc: "Calendar year the season trades; omit for the active budget"}
      category: {}
    sql: |
      WITH wk AS (
        SELECT category, week_start, sum(actual_units) * 1.0 / sum(planned_units) AS ratio
        FROM sell_through_data WHERE fy_period >= (SELECT max(fy_period) FROM sell_through_data) - 2 GROUP BY category, week_start),
      vol AS (SELECT category, stddev_pop(ratio) AS v FROM wk GROUP BY category),
      last AS (
        SELECT category, sum(actual_units) * 1.0 / sum(planned_units) AS r
        FROM sell_through_data WHERE fy_period = (SELECT max(fy_period) FROM sell_through_data) GROUP BY category),
      bud AS (
        SELECT category, sum(total_budget_gbp) AS b FROM open_to_buy
        WHERE season = $season AND status = 'active'
          AND buy_year = COALESCE($buy_year, (SELECT max(buy_year) FROM open_to_buy WHERE season = $season AND status = 'active'))
          AND ($category IS NULL OR category = $category)
        GROUP BY category),
      c AS (
        SELECT bud.category, $total_otb_gbp * bud.b / (SELECT sum(b) FROM bud) AS otb,
               round(vol.v * 100, 1) AS volatility_pct, round(last.r * 100, 1) AS latest_sell_through_pct,
               least(35.0, 8.0 + 120 * vol.v + 50 * greatest(0.0, 1 - last.r)) AS reserve_pct
        FROM bud JOIN vol USING (category) JOIN last USING (category))
      , r AS (
        SELECT 1 AS ord, category, round(otb) AS category_otb_gbp, volatility_pct, latest_sell_through_pct,
               round(reserve_pct, 1) AS recommended_reserve_pct, round(otb * reserve_pct / 100) AS recommended_chase_reserve_gbp,
               round(otb * (1 - reserve_pct / 100)) AS initial_buy_gbp,
               'reserve_pct = min(35, 8 + 120 x volatility + 50 x shortfall to plan)' AS formula
        FROM c
        UNION ALL
        SELECT 2, 'TOTAL', round(sum(otb)), NULL, NULL, round(sum(otb * reserve_pct) / sum(otb), 1), round(sum(otb * reserve_pct / 100)),
               round(sum(otb * (1 - reserve_pct / 100))), 'sum of categories' FROM c HAVING count(*) > 0)
      SELECT * EXCLUDE (ord) FROM r ORDER BY ord, category
    limit: 50
    example: {total_otb_gbp: 2100000, season: SS}

  - name: compare_buy_scenarios
    desc: Compare optimistic and cautious open-to-buy scenarios side by side by category, with differences, expected sell-through and margin, and the assumptions behind each.
    kind: sql
    args:
      season: {required: true}
      buy_year: {type: int, desc: "Calendar year the season trades; omit for the latest"}
    sql: |
      WITH s AS (
        SELECT * FROM otb_scenarios
        WHERE season = $season AND buy_year = COALESCE($buy_year, (SELECT max(buy_year) FROM otb_scenarios WHERE season = $season))),
      c AS (
        SELECT category,
          sum(allocated_gbp) FILTER (WHERE scenario_type = 'optimistic') AS opt_alloc,
          sum(allocated_gbp) FILTER (WHERE scenario_type = 'cautious') AS cau_alloc,
          sum(chase_reserve_gbp) FILTER (WHERE scenario_type = 'optimistic') AS opt_res,
          sum(chase_reserve_gbp) FILTER (WHERE scenario_type = 'cautious') AS cau_res,
          avg(expected_sell_through_pct) FILTER (WHERE scenario_type = 'optimistic') AS opt_st,
          avg(expected_sell_through_pct) FILTER (WHERE scenario_type = 'cautious') AS cau_st,
          avg(expected_margin_pct) FILTER (WHERE scenario_type = 'optimistic') AS opt_m,
          avg(expected_margin_pct) FILTER (WHERE scenario_type = 'cautious') AS cau_m,
          max(assumptions) FILTER (WHERE scenario_type = 'optimistic') AS opt_text,
          max(assumptions) FILTER (WHERE scenario_type = 'cautious') AS cau_text
        FROM s GROUP BY category),
      a AS (
        SELECT 1 AS ord, category, opt_alloc, cau_alloc, opt_res, cau_res, opt_st, cau_st, opt_m, cau_m, NULL AS opt_text, NULL AS cau_text FROM c
        UNION ALL
        SELECT 2, 'TOTAL', sum(opt_alloc), sum(cau_alloc), sum(opt_res), sum(cau_res), avg(opt_st), avg(cau_st), avg(opt_m), avg(cau_m),
               max(opt_text), max(cau_text) FROM c HAVING count(*) > 0)
      SELECT category, opt_alloc AS optimistic_allocated_gbp, cau_alloc AS cautious_allocated_gbp,
             cau_alloc - opt_alloc AS cautious_vs_optimistic_gbp, round((cau_alloc - opt_alloc) * 100.0 / opt_alloc, 1) AS cautious_vs_optimistic_pct,
             opt_res AS optimistic_reserve_gbp, cau_res AS cautious_reserve_gbp,
             round(opt_st, 1) AS optimistic_sell_through_pct, round(cau_st, 1) AS cautious_sell_through_pct,
             round(opt_m, 1) AS optimistic_margin_pct, round(cau_m, 1) AS cautious_margin_pct,
             opt_text AS optimistic_assumptions, cau_text AS cautious_assumptions
      FROM a ORDER BY ord, cautious_vs_optimistic_pct
    limit: 50
    example: {season: SS}

  - name: run_period_outturn_forecast
    desc: Forecast outturn for a region's period versus plan and last year, with revenue banked so far, shortfall and key risks. Defaults to the current period.
    kind: sql
    args:
      region: {required: true, type: str, desc: "Trading region, e.g. UK North, UK South, Scotland"}
      fy_period: {type: int, desc: "Financial period; omit for the current one"}
    sql: |
      SELECT period_forecast_id, region, fy_period, period_start, period_end, status, forecast_date,
             round(plan_value_gbp) AS plan_value_gbp, round(actual_to_date_gbp) AS actual_to_date_gbp,
             round(forecast_value_gbp) AS forecast_value_gbp, forecast_units,
             round((forecast_value_gbp - plan_value_gbp) * 100.0 / plan_value_gbp, 1) AS forecast_vs_plan_pct,
             round(forecast_value_gbp - plan_value_gbp) AS shortfall_to_plan_gbp,
             forecast_vs_last_year_pct, key_risks
      FROM period_forecasts
      WHERE region = $region
        AND (($fy_period IS NULL AND CAST($as_of AS DATE) BETWEEN period_start AND period_end) OR fy_period = $fy_period)
      ORDER BY forecast_date DESC
    limit: 20
    example: {region: "UK North"}

  - name: run_market_sales_forecast
    desc: Market-level sales forecast for a country by year after launch, with stores, sales, margin and assumptions for base, downside and upside cases. Use for expansion analysis.
    kind: sql
    args:
      market: {required: true, type: str, desc: "Country market, name or ISO code, e.g. Spain or ES"}
      scenario: {type: enum, values: [base, downside, upside], desc: "Forecast case; omit for all three"}
      years: {type: int, default: 5, desc: "Number of years after launch to show, 1 to 5"}
    sql: |
      SELECT market, scenario, year_no, stores_open, round(sales_gbp) AS sales_gbp,
             round(sum(sales_gbp) OVER (PARTITION BY market, scenario ORDER BY year_no)) AS cumulative_sales_gbp,
             units, gross_margin_pct, assumptions
      FROM market_forecasts
      WHERE (lower(market) = lower($market) OR country_code = upper($market))
        AND ($scenario IS NULL OR scenario = $scenario) AND year_no <= $years
      ORDER BY scenario = 'base' DESC, scenario, year_no
    limit: 50
    example: {market: "Spain"}

  - name: update_open_to_buy_allocation
    desc: Set the allocated, unallocated and chase reserve amounts of one open-to-buy category line by its OTB id. Returns old and new values.
    kind: update
    table: open_to_buy
    set: {last_updated_at: "$as_of"}
    args:
      allocated_gbp: {required: true, type: float, desc: "New amount allocated to buys in GBP"}
      unallocated_gbp: {required: true, type: float, desc: "New amount left unallocated (reserve) in GBP"}
      chase_reserve_gbp: {type: float, desc: "New chase reserve in GBP, within the unallocated amount; unchanged if omitted"}
    example: {otb_id: OTB-900005, allocated_gbp: 224000, unallocated_gbp: 106000, chase_reserve_gbp: 106000}
