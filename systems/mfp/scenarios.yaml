# One entry per question row that uses this system's tools (see: python -m mockmcp brief mfp).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:14:Q4"
  story: >
    Footwear category has planned buys from Vietnam (PB-900001, PB-900002) totalling 9,000 units at £135k cost
    and from Indonesia (PB-900003) at 2,500 units. Query shows the planned buy breakdown by country to assess
    tariff impact if Vietnam tariff increases 15%.
  checks:
    - tool: get_planned_buy_by_category_and_country
      args: {category: "Footwear"}
      expect: ["PB-900001", "VN", "5000", "135000"]
    - tool: get_planned_buy_by_category_and_country
      args: {category: "Footwear", country_of_origin: "VN"}
      expect: ["9000", "VN"]

- question: "03:25:Q1"
  story: >
    Women's knitwear in period 3 (SS) sold 5,460 units vs plan of 6,600 units, achieving 82% sell-through.
    Sell-through data shows actual_retail of £98,280 vs £132,000 planned, indicating a 3.2 point margin variance
    due to lower volumes and mix (planned was 82-85% sell-through range).
  checks:
    - tool: get_sell_through_by_category
      args: {category: "Knitwear", fy_period: 3}
      expect: ["ST-900001", "Knitwear", "82.0"]
    - tool: get_markdown_and_shrink_rates
      args: {category: "Knitwear", fy_period: 3}
      expect: ["12.5", "3.2", "MR-900001"]

- question: "03:25:Q2"
  story: >
    Spring OTB of £2.1m (total of Knitwear £700k + Dresses £600k + Footwear £400k + Athleisure £300k + Accessories £100k)
    needs split across categories. Cautious case (PB Q3:Q2) allocates 80% for initial buy, 20% for chase reserve;
    optimistic case allocates 85%/15%. Current trends show Knitwear at 82% sell-through, Dresses at 92%, signalling
    strength in tailored pieces and weakness in knits.
  checks:
    - tool: get_open_to_buy_by_category
      args: {fy_period: 3}
      expect: ["700000", "Knitwear", "OTB-900001"]
    - tool: get_category_sell_through_trends
      args: {category: "Knitwear"}
      expect: ["82", "Knitwear"]
    - tool: run_open_to_buy_scenario
      args: {fy_period: 3, scenario_type: "cautious"}
      expect: ["cautious", "448000", "112000"]
    - tool: run_open_to_buy_scenario
      args: {fy_period: 3, scenario_type: "optimistic"}
      expect: ["optimistic", "672000"]
    - tool: compare_buy_scenarios
      args: {fy_period: 3}
      expect: ["cautious", "optimistic", "category"]

- question: "03:25:Q3"
  story: >
    Autumn range (modelled as period 3 SS in system, but question refers to autumn delivery) is selling below plan.
    Athleisure shows 80% sell-through vs planned (2,400 actual vs 3,000 planned in UK North, 2,000 vs 2,500 in UK South).
    Markdown rates for Athleisure are 18%, and shrink 5%, indicating high risk of clearance.
  checks:
    - tool: get_sell_through_vs_plan
      args: {category: "Athleisure", fy_period: 3}
      expect: ["Athleisure", "-20.0"]
    - tool: get_markdown_and_shrink_rates
      args: {category: "Athleisure"}
      expect: ["18.0", "5.0", "MR-900004"]

- question: "03:25:Q5"
  story: >
    Athleisure range is 20% behind plan: UK North shows 2,400 actual vs 3,000 planned (80% sell-through),
    UK South shows 2,000 vs 2,500 (80% sell-through). Category shows structural underperformance
    with high markdown rates (18%) signalling product or positioning issue.
  checks:
    - tool: get_sell_through_vs_plan
      args: {category: "Athleisure"}
      expect: ["Athleisure", "-20.0", "ST-900006"]

- question: "07:62:Q1"
  story: >
    Gross margin bridge analysis. Markdown rates by category show Footwear at 15% (MR-900003), Athleisure 18% (MR-900004),
    and Knitwear 12.5% (MR-900001). Shrink rates range from 2% to 5%. These rates feed the margin bridge showing
    which drivers are structural (Athleisure weakness) vs temporary (seasonal markdown norms).
  checks:
    - tool: get_markdown_and_shrink_rates
      args: {fy_period: 3}
      expect: ["MR-900001", "MR-900002", "MR-900003", "12.5"]
    - tool: get_markdown_and_shrink_rates
      args: {category: "Footwear"}
      expect: ["15.0", "Footwear", "MR-900003"]

- question: "07:69:Q2"
  story: >
    Slow-moving stock provision. Sell-through rates show Knitwear at 82% (slower than peers), Dresses at 92% (healthy),
    and Athleisure at 80% (concerning). These rates determine ageing and recovery expectations for slow-moving provision.
  checks:
    - tool: get_sell_through_rates
      args: {season: "SS"}
      expect: ["82.0", "92.0", "ST-900008"]

- question: "08:73:Q4"
  story: >
    Regional outturn forecast for period 3. UK North forecasts 5,000 units worth £150k (5% above plan),
    UK South forecasts 4,200 units at £126k (3% above plan), Ireland at 1,500 units with -2% variance.
    Period forecast shows the region will deliver mid-to-high teens growth with risks in Ireland.
  checks:
    - tool: get_sales_forecast_for_region
      args: {region: "UK North", fy_period: 3}
      expect: ["UK North", "40000", "Knitwear"]
    - tool: run_period_outturn_forecast
      args: {region: "UK North", fy_period: 3}
      expect: ["5000", "150000", "5.0", "PF-900001"]

- question: "08:80:Q4"
  story: >
    Spain expansion market forecast. Period 1 forecasts for Spain show base case of 800 units / £16k for Knitwear
    (pessimistic 500/£10k, optimistic 1,200/£24k), Dresses base 900/£27k, and Athleisure 700/£21k.
    The forecasts show market has upside potential with cautious downside risk.
  checks:
    - tool: run_market_sales_forecast
      args: {region: "Spain", fy_period: 1}
      expect: ["Spain", "FC-900008", "800", "16000"]
    - tool: run_market_sales_forecast
      args: {region: "Spain"}
      expect: ["Knitwear", "Dresses", "Spain"]
