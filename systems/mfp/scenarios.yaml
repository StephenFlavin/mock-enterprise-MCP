# One entry per question row that uses this system's tools (see: python -m mockmcp brief mfp).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:14:Q4"
  story: >
    Footwear 2027 planned buy from Vietnam is four live lines (PB-900001..04) totalling 288,000 units at £7.106m
    landed cost (a fifth VN line, PB-900005, is cancelled and excluded). Alternatives: India and Italy lines and a
    14,400-unit Indonesian pilot (PB-900010) at £374k.
  checks:
    - tool: get_planned_buy_by_category_and_country
      args: {category: Footwear, buy_year: 2027}
      expect: ["VN", "288000", "7106400", "ID", "14400"]
    - tool: get_planned_buy_by_category_and_country
      args: {category: Footwear, country_of_origin: Vietnam, buy_year: 2027}
      expect: ["VN", "7106400"]

- question: "03:25:Q1"
  story: >
    Women's (Womenswear) knitwear sold 84.4% of plan units last fiscal period (P8) against 94% the period before,
    while menswear knitwear is close to plan. Markdown and shrink rates feed the margin split.
  checks:
    - tool: get_sell_through_by_category
      args: {category: Knitwear, department: Womenswear, date_from: -60d}
      expect: ["Womenswear", "84.4", "94"]
    - tool: get_markdown_and_shrink_rates
      args: {category: Knitwear}
      expect: ["Knitwear", "1.6", "Temporary"]

- question: "03:25:Q2"
  story: >
    Spring (SS 2027) OTB is £2.1m over eight categories (OTB-900001..08). Knitwear sell-through is fading
    (89.5% of plan last period against 95.6% the period before; Outerwear 94.4%, with Womenswear outerwear the weak part). Optimistic allocates £1.909m and reserves £191k; cautious allocates
    £1.675m and reserves £425k, cutting Outerwear and Knitwear hardest. OTB-900005 (Knitwear) can be updated to cautious.
  checks:
    - tool: get_open_to_buy_by_category
      args: {season: SS}
      expect: ["OTB-900005", "2100000", "TOTAL"]
    - tool: get_category_sell_through_trends
      args: {category: Knitwear}
      expect: ["89.5", "95.6"]
    - tool: run_open_to_buy_scenario
      args: {season: SS, scenario_type: cautious}
      expect: ["1675000", "425000"]
    - tool: calculate_in_season_chase_reserve
      args: {total_otb_gbp: 2100000, season: SS}
      expect: ["Knitwear", "223217", "TOTAL"]
    - tool: compare_buy_scenarios
      args: {season: SS}
      expect: ["1909000", "1675000", "Outerwear"]
    - tool: update_open_to_buy_allocation
      args: {otb_id: OTB-900005, allocated_gbp: 224000, unallocated_gbp: 106000, chase_reserve_gbp: 106000}
      expect: ["280000 → 224000", "106000"]
    - tool: get_open_to_buy_by_category
      args: {category: Knitwear, season: SS}
      expect: ["224000", "106000"]

- question: "03:25:Q3"
  story: >
    Autumn (AW) season to date: Womenswear Outerwear is 15.7% behind plan units and Womenswear Knitwear 9.5% behind;
    Menswear Outerwear is 8.2% behind. The new Athleisure range is 20% behind. Dresses and Shirts are ahead of plan.
  checks:
    - tool: get_sell_through_vs_plan
      args: {season: AW}
      expect: ["Outerwear", "-15.7", "Knitwear", "-9.5"]

- question: "03:25:Q5"
  story: >
    The Athleisure range (Womenswear Tops and Trousers, launched ten weeks ago) is 20% behind plan on units, worst in
    UK North (-29%) and Scotland (-27%), best in EU Central and UK South.
  checks:
    - tool: get_sell_through_vs_plan
      args: {range_name: Athleisure}
      expect: ["Athleisure", "-20"]
    - tool: get_sell_through_vs_plan
      args: {range_name: Athleisure, by: region}
      expect: ["UK North", "-29", "Scotland", "-27"]

- question: "07:62:Q1"
  story: >
    Markdown is up 0.6 points on last year (Knitwear +1.6, Outerwear +1.8, Dresses +0.9, all temporary clearance) and shrink up
    0.2 points (Small Appliances and Fragrance, structural theft). Together about 0.8 of the 1.4 point gross margin fall.
  checks:
    - tool: get_markdown_and_shrink_rates
      args: {date_from: -60d}
      expect: ["ALL CATEGORIES", "0.6", "Knitwear", "Outerwear", "Fragrance", "Structural"]

- question: "07:69:Q2"
  story: >
    SS26 stock is slow in Small Appliances (57% sell-through, £6.98m unsold at cost) and Footwear (£3.63m), ahead of Jewellery, Audio and Tops (£2.16m).
  checks:
    - tool: get_sell_through_rates
      args: {season: SS26, max_sell_through_pct: 65, group_by: category}
      expect: ["Small Appliances", "6979887", "Footwear", "3633549"]

- question: "08:73:Q4"
  story: >
    UK North is forecast to deliver £6.47m this period against a £6.90m plan (-6.2%), consistent with POS trading
    about 6-7% below last year. Knitwear (-17%) and Outerwear (-15%) drive the shortfall.
  checks:
    - tool: run_period_outturn_forecast
      args: {region: UK North}
      expect: ["6472300", "6900100", "-6.2", "mild September"]
    - tool: get_sales_forecast_for_region
      args: {region: UK North}
      expect: ["Knitwear", "-17", "Outerwear", "TOTAL"]

- question: "08:80:Q4"
  story: >
    Spain expansion: base case £3.8m in year one rising to £19.2m in year three (12 stores); downside £2.1m and £10.8m.
  checks:
    - tool: run_market_sales_forecast
      args: {market: Spain}
      expect: ["3819000", "19165000", "2148000", "10781000"]
