# One entry per question row that uses this system's tools (see: python -m mockmcp brief ap).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:13:Q2"
  story: >
    Q3 air freight invoices (FRT-900001 to FRT-900007) for SUP-0001, SUP-0002, SUP-0003.
    Most is from demand spike and store emergency. These are marked avoidable (65-85%),
    chargeable to suppliers. Tool returns breakdown by reason and avoidability.
  checks:
    - tool: get_air_spend_by_supplier
      args: {date_from: "-90d"}
      expect: ["SUP-0001", "demand_spike", "store_emergency"]
    - tool: calculate_avoidable_air_spend
      args: {date_from: "-90d"}
      expect: ["avoidable_spend", "unavoidable", "formula"]

- question: "02:20:Q1"
  story: >
    12 months of carrier invoices from SUP-0001, SUP-0002, SUP-0003 (INV-900001 to INV-900007).
    SUP-0001 overcharged on surcharges and accessorials. Disputable lines flagged.
    INV-900001 disputed already. Tool returns variance details by charge type.
  checks:
    - tool: list_carrier_invoice_lines
      args: {supplier_id: "SUP-0001", variance_pct_gt: 5}
      expect: ["surcharge", "accessorial"]
    - tool: compare_invoice_to_contract_rate
      args: {supplier_id: "SUP-0001", invoice_id: "INV-900001"}
      expect: ["freight", "variance"]
    - tool: calculate_dispute_value_by_charge_type
      args: {supplier_id: "SUP-0001", invoice_id: "INV-900001"}
      expect: ["disputable_variance", "surcharge"]
    - tool: draft_dispute_letter
      args: {supplier_id: "SUP-0001", invoice_id: "INV-900001"}
      expect: ["invoice", "discrepancies"]

- question: "04:35:Q1"
  story: >
    Supplier SUP-0042 (Acme) on payment hold for dispute (VND-900004). Payment performance
    shows payment made on 2026-09-12 (11 days after invoice). Bank detail change (BDC-900003)
    approved 2026-09-10. Tool shows open invoices and payment status.
  checks:
    - tool: get_supplier_payment_performance
      args: {supplier_id: "SUP-0042", days_back: 365}
      expect: ["payment", "amount_gbp"]
    - tool: get_open_transactions_for_vendor
      args: {vendor_id: "VND-900004"}
      expect: ["invoice"]

- question: "04:35:Q5"
  story: >
    Supplier SUP-0042 (Acme) rebate agreement RBA-900001 with £250k threshold, 2.5% rebate.
    Accruals show Q3 rebate accrued. Shows rebate tracking and accrual history.
  checks:
    - tool: list_supplier_rebate_agreements
      args: {supplier_id: "SUP-0042"}
      expect: ["RBA-900001", "volume", "active"]
    - tool: get_rebate_accrual_history
      args: {supplier_id: "SUP-0042"}
      expect: ["accrued"]

- question: "04:36:Q5"
  story: >
    Vendor master has fraud indicators. VND-900005 (Beta Distribution) marked as fraud risk 65,
    with country_mismatch (NL/US). On payment hold for fraud investigation.
    VND-900005 has open invoice INV-900006.
  checks:
    - tool: list_vendor_fraud_indicators
      args: {fraud_risk_score: 50}
      expect: ["VND-900005", "65"]
    - tool: get_open_transactions_for_vendor
      args: {vendor_id: "VND-900005"}
      expect: ["invoice"]
    - tool: block_supplier_payments
      args: {vendor_id: "VND-900005", hold_reason: "Fraud investigation confirmed"}
      expect: ["on_payment_hold"]

- question: "04:37:Q3"
  story: >
    Facilities spend analysis by supplier and category using get_accounts_payable_invoices_for_supplier.
    Supplier SUP-0042, SUP-0043, SUP-0044 have invoices tracked showing categories.
  checks:
    - tool: get_accounts_payable_invoices_for_supplier
      args: {supplier_id: "SUP-0042", date_from: "-90d"}
      expect: ["invoice_id"]

- question: "04:41:Q3"
  story: >
    Supplier master controls checked using get_vendor_master_controls tool.
    Shows which suppliers have control requirements and approval needed.
  checks:
    - tool: get_vendor_master_controls
      args: {}
      expect: ["control_approvals_required"]

- question: "04:41:Q6"
  story: >
    Supplier fraud schemes detected via list_vendor_fraud_indicators.
    Shows fraud risk scores and indicators for onboarding review.
  checks:
    - tool: list_vendor_fraud_indicators
      args: {fraud_risk_score: 30}
      expect: ["fraud_risk_score"]

- question: "07:61:Q3"
  story: >
    Freight cost reconciliation. INV-900005, INV-900006 are unaccrued freight invoices.
    INV-900006 is miscoded to 5100 instead of 5105. Tool shows these issues.
  checks:
    - tool: list_unaccrued_freight_invoices
      args: {date_from: "-90d"}
      expect: ["INV-900005", "INV-900006"]
    - tool: list_miscoded_freight_invoices
      args: {date_from: "-90d"}
      expect: ["INV-900006"]
    - tool: update_invoice_gl_coding
      args: {invoice_id: "INV-900006", gl_account: "5105"}
      expect: ["5105"]

- question: "07:61:Q5"
  story: >
    Additional freight accrual needed for proper accounting. Posting accruals for unaccrued invoices.
  checks:
    - tool: list_unaccrued_freight_invoices
      args: {date_from: "-90d"}
      expect: ["INV-900005"]

- question: "07:66:Q5"
  story: >
    Payment runs scheduled: RUN-900001, RUN-900002, RUN-900003, RUN-900004.
    Check payment runs for changed vendors, update run dates, cancel runs as needed.
  checks:
    - tool: get_payment_runs_for_changed_vendors
      args: {days_back: 90}
      expect: ["payment", "change"]
    - tool: update_payment_run_date
      args: {payment_run_id: "RUN-900001", new_run_date: "+7d"}
      expect: ["run_date"]
    - tool: cancel_payment_run
      args: {payment_run_id: "RUN-900004", reason: "Liquidity constraint"}
      expect: ["cancelled"]

- question: "07:68:Q1"
  story: >
    Year of PO/payment data review: Bank detail changes show BDC-900001 (VND-900005), BDC-900003 (VND-900004).
    New vendors and bank detail changes tracked. list_vendor_master_changes shows recent changes.
  checks:
    - tool: list_vendor_master_changes
      args: {days_back: 180}
      expect: ["bank_detail_change", "new_vendor"]
    - tool: list_vendor_fraud_indicators
      args: {fraud_risk_score: 30}
      expect: ["fraud_risk_score"]
    - tool: block_vendor_for_payment
      args: {vendor_id: "VND-900005", hold_reason: "Audit investigation"}
      expect: ["on_payment_hold"]

- question: "07:68:Q4"
  story: >
    Vendor master controls: Vendors with control_approvals_required based on risk score.
    VND-900005 has fraud indicators. Bank detail changes (BDC-900001, BDC-900002, BDC-900003)
    show approval status tracking. Tool returns control configuration.
  checks:
    - tool: get_vendor_master_controls
      args: {}
      expect: ["control_approvals_required"]
    - tool: list_bank_detail_change_requests
      args: {}
      expect: ["change_id"]

- question: "08:79:Q1"
  story: >
    Goods receipt vs invoice variance analysis. VAR-900001 (quantity variance),
    VAR-900002 (price variance), VAR-900003, VAR-900004 show discrepancies.
    Tool returns variance details and status.
  checks:
    - tool: get_goods_receipt_vs_invoice_discrepancies
      args: {}
      expect: ["variance_id"]

- question: "09:85:Q2"
  story: >
    Security incident review: Payment run check for changed vendors shows changed bank details
    and associated payments. Get_payment_runs_for_changed_vendors returns relevant records.
    VND-900005 needs payment hold due to security incident.
  checks:
    - tool: get_payment_runs_for_changed_vendors
      args: {days_back: 90}
      expect: ["payment", "change"]
    - tool: block_vendor_payment
      args: {vendor_id: "VND-900005", hold_reason: "Security incident - account compromise"}
      expect: ["on_payment_hold"]
