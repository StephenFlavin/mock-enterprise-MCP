# One entry per question row that uses this system's tools (see: python -m mockmcp brief ap).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:13:Q2"
  story: >
    Q3 air freight invoices show spend breakdown by supplier and reason code,
    with avoidability analysis showing split between avoidable and unavoidable.
  checks:
    - tool: get_air_spend_by_supplier
      args: {date_from: "-90d"}
      expect: ["air_reason", "total_spend"]
    - tool: calculate_avoidable_air_spend
      args: {date_from: "-90d"}
      expect: ["avoidable_spend", "unavoidable", "formula"]

- question: "02:20:Q1"
  story: >
    12 months of carrier invoices show overcharges on surcharges and accessorials.
    Tool returns line details with variance analysis for dispute calculation.
  checks:
    - tool: list_carrier_invoice_lines
      args: {supplier_id: "SUP-0001", variance_pct_gt: 1}
      expect: ["charge_type", "variance"]
    - tool: get_accounts_payable_invoices_for_supplier
      args: {supplier_id: "SUP-0001"}
      expect: ["invoice"]

