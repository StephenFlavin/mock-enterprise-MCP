# One entry per question row that uses this system's tools (see: python -m mockmcp brief ap).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "02:13:Q2"
  story: >
    Q3 air freight invoices total £420k (FRT-900001 to FRT-900007). Most is from demand spike
    (£85k+£92k+£82k CAR-007) and store emergency (£78k+£93k CAR-003, £62k CAR-001).
    These are marked avoidable (65-85%), chargeable to suppliers. Top three suppliers
    are CAR-007 (£259k avoidable), CAR-003 (£171k avoidable), CAR-001 (£62k avoidable).
  checks:
    - tool: get_air_spend_by_supplier
      args: {date_from: "-90d"}
      expect: ["CAR-007", "demand_spike", "store_emergency", "£"]
    - tool: calculate_avoidable_air_spend
      args: {date_from: "-90d"}
      expect: ["avoidable_spend", "unavoidable", "formula"]

- question: "02:20:Q1"
  story: >
    12 months of carrier invoices from CAR-007, CAR-003, CAR-001 (INV-900001 to INV-900007).
    CAR-007 overcharged on surcharges (£100 INV-900001 line 2, £350 INV-900004 line 2) and
    accessorials. Total overcharge £650 across disputes. Disputable lines flagged.
    INV-900001 disputed already. Largest dispute is INV-900001 with £200 variance.
  checks:
    - tool: list_carrier_invoice_lines
      args: {supplier_id: "CAR-007", variance_pct_gt: 5}
      expect: ["surcharge", "accessorial", "100", "350"]
    - tool: compare_invoice_to_contract_rate
      args: {supplier_id: "CAR-007", invoice_id: "INV-900001"}
      expect: ["freight", "surcharge", "variance", "disputable"]
    - tool: calculate_dispute_value_by_charge_type
      args: {supplier_id: "CAR-007", invoice_id: "INV-900001"}
      expect: ["disputable_variance", "surcharge"]
    - tool: draft_dispute_letter
      args: {supplier_id: "CAR-007", invoice_id: "INV-900001"}
      expect: ["invoice", "discrepancies", "contracted rates"]

- question: "04:35:Q1"
  story: >
    Supplier SUP-0042 (Acme) on payment hold for dispute (VND-900004). Payment performance
    shows 11 days average to pay, on-time 90%. Recently had bank detail change (BDC-900003)
    on 2026-09-10, now approved. First payment to new account 2026-09-25.
  checks:
    - tool: get_supplier_payment_performance
      args: {supplier_id: "SUP-0042", days_back: 365}
      expect: ["on_time", "avg_days_to_pay", "11"]
    - tool: get_open_transactions_for_vendor
      args: {vendor_id: "VND-900004"}
      expect: ["open", "on_hold", "invoice"]

- question: "04:35:Q5"
  story: >
    Supplier SUP-0042 (Acme) rebate agreement RBA-900001 with £250k threshold, 2.5% rebate.
    YTD spend FY2026-Q3 is £720k, accrued rebate £11,750. Prior quarters accrued £5,750 (Q2)
    and £0 (Q1). All accruals pending settlement. Shows rebate tracking and accrual history.
  checks:
    - tool: list_supplier_rebate_agreements
      args: {supplier_id: "SUP-0042"}
      expect: ["RBA-900001", "volume", "2.5", "active"]
    - tool: get_rebate_accrual_history
      args: {supplier_id: "SUP-0042"}
      expect: ["FY2026-Q3", "720000", "11750", "accrued"]

- question: "04:36:Q5"
  story: >
    Vendor master has duplicate/fraud indicators. VND-900005 (Beta Distribution) marked as fraud risk 65,
    with country_mismatch (NL/US) and bank_country_mismatch. On payment hold for fraud investigation.
    Also shows VND-900002, VND-900004 with elevated fraud scores. VND-900005 has open invoices.
  checks:
    - tool: list_vendor_fraud_indicators
      args: {fraud_risk_score: 50}
      expect: ["VND-900005", "65", "country_mismatch", "bank_country_mismatch"]
    - tool: get_open_transactions_for_vendor
      args: {vendor_id: "VND-900005"}
      expect: ["open", "invoice"]
    - tool: block_supplier_payments
      args: {vendor_id: "VND-900005", hold_reason: "Fraud investigation confirmed"}
      expect: ["on_payment_hold"]

- question: "07:61:Q3"
  story: >
    Freight cost in GL is off by £210k. Root causes: (1) unaccrued freight invoices (INV-900005, INV-900006
    from late August/Sept), (2) miscoded invoices (some to wrong GL accounts). INV-900006 miscoded to 5100
    instead of 5105. Total unaccrued ~£3,600. Miscoded freight invoices need GL correction.
  checks:
    - tool: list_unaccrued_freight_invoices
      args: {date_from: "-60d"}
      expect: ["INV-900005", "INV-900006", "accrued"]
    - tool: list_miscoded_freight_invoices
      args: {date_from: "-90d"}
      expect: ["INV-900006", "5100"]
    - tool: update_invoice_gl_coding
      args: {invoice_id: "INV-900006", gl_account: "5105"}
      expect: ["5105"]

- question: "07:66:Q5"
  story: >
    Payment runs scheduled (RUN-900001 2026-10-08, RUN-900004 2026-10-20) total £570k. Liquidity
    forecast shows RUN-900001 is in tight week; suggest postponing or cancelling RUN-900004.
    After approval, move RUN-900001 to 2026-10-15, then cancel RUN-900004 (non-critical).
  checks:
    - tool: get_payment_runs_for_changed_vendors
      args: {days_back: 90}
      expect: ["payment", "bank_detail"]
    - tool: update_payment_run_date
      args: {payment_run_id: "RUN-900001", new_run_date: "+7d"}
      expect: ["2026-10-15"]
    - tool: cancel_payment_run
      args: {payment_run_id: "RUN-900004", reason: "Liquidity constraint"}
      expect: ["cancelled"]

- question: "07:68:Q1"
  story: >
    Year of PO/payment data review: Bank detail changes show BDC-900001 (VND-900005, GB→NL country mismatch,
    Aug 2026), BDC-900003 (VND-900004, approved Sep 2026). VND-900005 has fraud risk 65, on hold for
    investigation. New vendors (VND-900004, VND-900005, VND-900006, VND-900007, VND-900008) from
    recent onboarding. Anomalies: list_vendor_master_changes shows recent additions and bank changes.
  checks:
    - tool: list_vendor_master_changes
      args: {days_back: 180}
      expect: ["bank_detail_change", "new_vendor", "VND-900004", "VND-900005"]
    - tool: list_vendor_fraud_indicators
      args: {fraud_risk_score: 30}
      expect: ["fraud_risk_score", "country_mismatch"]
    - tool: block_vendor_for_payment
      args: {vendor_id: "VND-900005", hold_reason: "Audit investigation - anomalous transaction patterns"}
      expect: ["on_payment_hold"]

- question: "07:68:Q4"
  story: >
    Vendor master controls: Vendors with control_approvals_required 1-3 based on risk score.
    VND-900005 requires 3 approvals (fraud risk 65). Bank detail changes (BDC-900001, BDC-900002,
    BDC-900003) show approval status tracking. Dual approval enforcement needed.
    List bank detail changes shows pending approval on BDC-900002.
  checks:
    - tool: get_vendor_master_controls
      args: {}
      expect: ["control_approvals_required", "VND-900005", "3"]
    - tool: list_bank_detail_change_requests
      args: {approval_status: "pending"}
      expect: ["BDC-900002", "pending", "1"]

- question: "08:79:Q1"
  story: >
    Goods receipt vs invoice variance analysis over 6 months. VAR-900001 (PO-2026-001234, 5-unit short),
    VAR-900002 (price variance £200 up), VAR-900003 (both qty and price variance).
    Variances pending/investigated show control gaps. Get variance details by type.
  checks:
    - tool: get_goods_receipt_vs_invoice_discrepancies
      args: {status: "pending"}
      expect: ["VAR-900001", "quantity", "VAR-900004"]

- question: "09:85:Q2"
  story: >
    Security incident: Unusual supplier portal access at 03:12, vendor bank details accessed.
    Payment run check for changed vendors (BDC-900001, first payment 2026-09-20 to NL account).
    Payments to VND-900005 on changed details with fraud investigation hold.
    Lock account and hold payments to changed bank details.
  checks:
    - tool: get_payment_runs_for_changed_vendors
      args: {days_back: 60}
      expect: ["VND-900005", "NL91", "bank_detail"]
    - tool: block_vendor_payment
      args: {vendor_id: "VND-900005", hold_reason: "Security incident - account compromise"}
      expect: ["on_payment_hold"]
