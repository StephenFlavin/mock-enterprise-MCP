# One entry per question row that uses this system's tools
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string

- question: "01:6:Q3"
  story: >
    Fatigue-related incidents in September-October show multiple near-misses and one accident in night and late shifts:
    three near-misses in aisle C (INC-900001), D (INC-900002), and F (INC-900004), and one high-severity accident
    in dock area (INC-900003). A corrective action (CA-900009) for night shift fatigue monitoring was completed on 25 Sep.
  checks:
    - tool: list_fatigue_related_incidents
      args: {site_id: DC1}
      expect: ["INC-900001", "INC-900002", "INC-900003", "Aisle C", "Aisle D", "Dock area"]
    - tool: list_fatigue_related_incidents
      args: {site_id: DC2}
      expect: ["INC-900004", "Aisle B", "night"]

- question: "01:9:Q1"
  story: >
    Twelve months of incident data shows multiple incidents across DC1 and DC2. DC1 has 8 incidents including
    forklift-pedestrian incidents, with 3 open CAs (CA-900001, CA-900002, CA-900003) and 1 completed (CA-900008).
    CA-900009 is marked closed, and the manager closes CA-900008 and extends CA-900001 to month-end.
  checks:
    - tool: list_incidents
      args: {site_id: DC1, incident_type: accident}
      expect: ["INC-900003", "INC-900006", "INC-900008", "INC-900013"]
    - tool: list_open_corrective_actions
      args: {site_id: DC1}
      expect: ["CA-900001", "CA-900002", "CA-900003", "open", "due"]
    - tool: update_corrective_action_status
      args: {ca_id: CA-900001, due_date: "2026-10-31"}
      expect: ["CA-900001", "2026-10-31"]

- question: "01:9:Q2"
  story: >
    Risk assessments for both DC1 and DC2 show high-risk reach truck operations (RA-900001, RA-900002) and
    battery charging (RA-900005) with medium residual risk after controls. Two new sites (DC4 and DC5) will get
    electric reach trucks in January. Corrective actions (CA-900002, CA-900012) assigned for procedure updates.
  checks:
    - tool: list_risk_assessments_by_site
      args: {site_id: DC1}
      expect: ["RA-900001", "Reach truck", "high", "medium"]
    - tool: list_risk_assessments_by_site
      args: {site_id: DC1, risk_level: high}
      expect: ["RA-900001", "RA-900005", "high"]
    - tool: create_corrective_action
      args: {site_id: DC4, description: "Update electric reach truck procedures for new fleet", owner: "EMP-00310", due_date: "2026-12-31"}
      expect: ["CA-", "open"]

- question: "01:9:Q3"
  story: >
    Forklift-pedestrian near-misses and accidents clustered in Q3: crossing point A1 (INC-900006),
    crossing point B2 (INC-900007), aisle C (INC-900008), aisle E (INC-900005), and aisle G (INC-900013).
    Heatmap shows Aisle C and Aisle E with 2 incidents each, crossing points with 1 each. CA-900001 and CA-900002
    assigned to address procedures and signage. No action for aisle 7 (not in data).
  checks:
    - tool: list_incidents
      args: {site_id: DC1, equipment_involved: Forklift}
      expect: ["Forklift", "INC-900005", "INC-900006", "INC-900007", "INC-900008", "INC-900013"]
    - tool: get_incident_location_heatmap
      args: {site_id: DC1}
      expect: ["Aisle C", "Aisle E", "Crossing point A1", "Crossing point B2", "total_incidents"]
    - tool: create_corrective_action
      args: {site_id: DC1, description: "Install speed limiters on forklifts in high-incident areas", owner: "EMP-00305", due_date: "2026-11-15", incident_id: "INC-900013"}
      expect: ["CA-", "open", "INC-900013"]

- question: "01:9:Q4"
  story: >
    Forklift incident data from last 12 months shows 6 incidents in DC1 including accidents and near-misses.
    Incidents involve struck-by, crossing points, and equipment damage.
  checks:
    - tool: list_incidents
      args: {site_id: DC1, equipment_involved: Forklift}
      expect: ["Forklift", "struck", "crossing", "pedestrian"]

- question: "01:9:Q5"
  story: >
    Sites cover three countries: UK (DC1, DC2, DC3), Germany (DC4), Poland (DC5). Each has applicable regimes
    from HSW Act and COSHH in UK, ArbStättV in Germany, and Kodeks pracy in Poland. Procedures are active across
    most sites, with DC4 having a draft reach truck procedure. Corrective actions will be created only for Germany.
  checks:
    - tool: list_site_jurisdictions
      args: {}
      expect: ["DC1", "GB", "DC4", "DE", "DC5", "PL"]
    - tool: list_site_jurisdictions
      args: {country: DE}
      expect: ["DC4", "ArbStättV", "BetrSichV"]
    - tool: list_site_safety_procedures
      args: {site_id: DC4}
      expect: ["PROC-900014", "PROC-900015", "draft", "Reach Truck"]
    - tool: create_corrective_action
      args: {site_id: DC4, description: "Implement new AGV charging zone safety controls per German regulations", owner: "EMP-00311", due_date: "2026-11-30"}
      expect: ["CA-", "DC4", "open"]

- question: "01:10:Q3"
  story: >
    Safety validation records for automation assets show multiple firmware and functional tests. VAL-900001 and
    VAL-900002 pass for reach trucks in DC1. VAL-900004 needs review for speed limiter calibration discrepancy.
    VAL-900007 shows successful firmware 4.6 installation in DC3. Four records pass, one needs review.
  checks:
    - tool: get_safety_validation_records
      args: {asset_id: AST-DC1-SRT-01}
      expect: ["VAL-900001", "pass", "Firmware"]
    - tool: get_safety_validation_records
      args: {validation_type: Firmware}
      expect: ["VAL-900001", "VAL-900004", "VAL-900007"]
    - tool: get_safety_validation_records
      args: {status: "needs_review"}
      expect: ["VAL-900004", "speed limiter"]

- question: "09:88:Q1"
  story: >
    Site safety incidents over 12 months show DC1 with 9 incidents (8 near-misses/accidents, 3 critical/high),
    DC2 with 3 incidents, DC3 with 2, and DC4 with 2. DC1 is the worst performer with the highest accident rate.
  checks:
    - tool: get_site_safety_incidents
      args: {}
      expect: ["DC1", "total_incidents", "accidents", "near_misses"]
    - tool: get_site_safety_incidents
      args: {site_id: DC1}
      expect: ["DC1", "high_count", "critical_count"]
