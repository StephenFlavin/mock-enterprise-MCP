# One entry per question row that uses this system's tools
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string

- question: "01:6:Q3"
  story: >
    DC1 has seven fatigue-tagged incidents in the last 90 days, all on late or night shifts and tied to overtime
    or long shifts (INC-900015 to INC-900020 plus the night aisle 7 forklift near miss INC-900013), including one
    high-severity dock accident (INC-900019) and a back strain at the end of a 12-hour night shift (INC-900020).
    DC2 has one night-shift reach truck near miss (INC-900030).
  checks:
    - tool: list_fatigue_related_incidents
      args: {site_id: DC1}
      expect: ["INC-900019", "INC-900020", "INC-900015", "night", "late", "overtime"]
    - tool: list_fatigue_related_incidents
      args: {site_id: DC2}
      expect: ["INC-900030", "night"]

- question: "01:9:Q1"
  story: >
    Over 12 months DC1 is the worst DC (most incidents, one critical forklift crush in aisle 7 and the Q3 forklift-pedestrian
    cluster); DC2 has repeated reach truck racking strikes in aisle 8 plus a critical racking collapse (INC-900035);
    DC3 has mezzanine falls and manual handling strains. Open corrective actions: CA-900004, CA-900012 and CA-900013
    have the work already completed (completed_date set) and just need closing; CA-900006, CA-900010, CA-900014,
    CA-900015 and CA-900016 are overdue and need a new due date at month end.
  checks:
    - tool: get_site_safety_incidents
      args: {}
      expect: ["DC1", "DC2", "DC3", "incidents_per_100_staff"]
    - tool: list_incidents
      args: {site_id: DC2, equipment_involved: reach truck}
      expect: ["INC-900037", "INC-900033", "Aisle 8", "Racking"]
    - tool: list_incidents
      args: {incident_type: dangerous_occurrence}
      expect: ["INC-900035", "critical", "Racking bay partly collapsed"]
    - tool: list_open_corrective_actions
      args: {site_id: DC1}
      expect: ["CA-900004", "CA-900006", "CA-900014", "work_completed"]
    - tool: list_open_corrective_actions
      args: {overdue_only: true}
      expect: ["CA-900006", "CA-900010", "CA-900014", "CA-900015", "CA-900016"]
    - tool: update_corrective_action_status
      args: {ca_id: CA-900004, status: closed, completed_date: "-5d"}
      expect: ["CA-900004", "closed"]
    - tool: update_corrective_action_status
      args: {ca_id: CA-900006, due_date: "+25d"}
      expect: ["CA-900006", "due_date"]

- question: "01:9:Q2"
  story: >
    The two newest company-run DCs of the original network (DC1-DC5) by opening date are DC4 (Venlo, 2018) and DC3 (Leeds, 2015); DC6 Corby is a 3PL overflow site and DC7/DC8 are outside the electric reach truck programme. DC3's battery charging assessment
    (RA-900013, lead-acid, assessed long ago) and reach truck assessment (RA-900011, over a year old, no charging hazards)
    need to change; DC4 has a reach truck assessment (RA-900016) but no battery charging assessment at all.
    Site managers are EMP-00239 (DC3) and EMP-00276 (DC4).
  checks:
    - tool: list_risk_assessments_by_site
      args: {site_id: DC3}
      expect: ["RA-900013", "Battery charging", "lead-acid", "RA-900011"]
    - tool: list_risk_assessments_by_site
      args: {site_id: DC4}
      expect: ["RA-900016", "Reach truck"]
    - tool: create_corrective_action
      args: {site_id: DC4, description: "Create battery charging risk assessment for electric reach trucks", owner: "EMP-00276", due_date: "+60d"}
      expect: ["CA-", "DC4", "open", "EMP-00276"]

- question: "01:9:Q3"
  story: >
    DC1 forklift-pedestrian near misses rose from 3 in the previous quarter to 14 in the last 90 days after an aisle layout
    change and the peak labour intake, mostly late shift and agency or new-starter drivers. Hotspots: aisle 7 (5),
    crossing point B2 (4), crossing point A1 (3) and aisle 3 (3 with the generated one).
  checks:
    - tool: list_incidents
      args: {site_id: DC1, equipment_involved: forklift, description: pedestrian, occurred_from: -90d}
      expect: ["INC-900001", "INC-900008", "INC-900014", "Layout change"]
    - tool: get_incident_location_heatmap
      args: {equipment_involved: forklift, description: pedestrian}
      expect: ["Aisle 7", "Crossing point B2", "Crossing point A1", "DC1"]
    - tool: get_incident_location_heatmap
      args: {equipment_involved: forklift, description: pedestrian, incident_from: -365d, incident_to: -91d}
      expect: ["DC1", "Aisle 7"]
    - tool: create_corrective_action
      args: {site_id: DC1, description: "Add physical barriers and mirrors at crossing point B2", owner: "EMP-00108", due_date: "+45d", incident_id: "INC-900009"}
      expect: ["CA-", "open", "INC-900009"]

- question: "01:9:Q4"
  story: >
    DC1 has 20-plus forklift incidents in 12 months, almost all pedestrian interactions at crossing points and in aisles 3 and 7,
    including a critical crush in February (INC-900021). Root causes are layout, training and procedure, which tells which
    controls (exclusion zones, proximity sensors, speed limiters) would have helped.
  checks:
    - tool: list_incidents
      args: {site_id: DC1, equipment_involved: forklift}
      expect: ["INC-900021", "critical", "Crossing point B2", "pedestrian"]

- question: "01:9:Q5"
  story: >
    Germany is the Frankfurt DC8 plus ten stores (ST228 to ST237), Poland is the Lodz DC7 plus stores ST256 to ST259, the UK is DC1-DC3, the
    Corby 3PL overflow DC6 and stores. Regimes per country come from list_site_jurisdictions. German stores ST228, ST231 and ST233
    have a few stockroom procedures, some draft or inactive, which are the gaps.
  checks:
    - tool: list_site_jurisdictions
      args: {}
      expect: ["GB", "DE", "NL", "DC1, DC2, DC3", "ST228"]
    - tool: list_site_jurisdictions
      args: {country: DE}
      expect: ["DC8", "ST228", "ST237", "BetrSichV", "ArbSchG"]
    - tool: list_site_jurisdictions
      args: {country: PL}
      expect: ["DC7", "ST256", "ST259", "Kodeks pracy", "BHP"]
    - tool: list_site_safety_procedures
      args: {site_id: ST233}
      expect: ["PROC-", "inactive", "Delivery receiving"]
    - tool: create_corrective_action
      args: {site_id: ST233, description: "Reinstate delivery receiving procedure to meet German requirements", owner: "EMP-00108", due_date: "+56d"}
      expect: ["CA-", "ST233", "open"]

- question: "01:10:Q3"
  story: >
    The DC1 AMR fleet (8 robots; wcs) is part-way through the 4.7 firmware update: the three pilot robots on 4.7 were safety-validated,
    robot-002 and robot-005 passed, but robot-007 (VAL-900002) needs review for a speed monitoring and zone-stop calibration discrepancy
    after its firmware change, so the fleet-wide update needs safety revalidation before peak. The AMR robots are not in the master
    asset register, so their validation rows carry their own site and name.
  checks:
    - tool: get_safety_validation_records
      args: {site_id: DC1, validation_type: firmware}
      expect: ["VAL-900001", "VAL-900002", "needs_review", "zone-stop", "robot-007"]
    - tool: get_safety_validation_records
      args: {status: needs_review}
      expect: ["VAL-900002", "robot-007"]

- question: "09:88:Q1"
  story: >
    Over 12 months DC1 Northampton has the most incidents (about 38) and the highest incidents per 100 staff, with 7 high and 1
    critical, followed by DC2 Daventry. DC3 to DC5 are lower.
  checks:
    - tool: get_site_safety_incidents
      args: {}
      expect: ["DC1", "Northampton DC", "incidents_per_100_staff", "DC2"]
    - tool: get_site_safety_incidents
      args: {site_id: DC1}
      expect: ["DC1", "high_count", "critical_count"]
