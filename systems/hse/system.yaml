id: hse
name: Health & Safety System (HSE)
instructions: >
  Workplace incidents, near-misses, risk assessments, corrective actions and safety validations
  across all distribution centres. Incident ids look like INC-000123, corrective action ids like CA-000123.
  Use it for incident tracking, fatigue-related issues, compliance checklists and safety controls.

tables:
  incidents:
    key: incident_id
    cols:
      incident_id: {type: str, desc: "Incident, e.g. INC-000123"}
      site_id: {type: str, desc: "DC where incident occurred"}
      occurred_at: {type: timestamp, desc: When the incident occurred}
      incident_type: {type: enum, values: [accident, near_miss, dangerous_occurrence], desc: Type of incident}
      severity: {type: enum, values: [critical, high, medium, low], desc: Severity level}
      location: {type: str, desc: "Where it happened, e.g. aisle C or dock area"}
      task: {type: str, desc: Task being performed}
      description: {type: text, desc: Incident description}
      reported_by: {type: str, desc: Employee who reported it}
      is_fatigue_related: {type: bool, desc: Tagged to fatigue, long hours or night shift}
      shift_type: {type: enum, values: [early, late, night, days, office], desc: "Shift when it occurred"}
      equipment_involved: {type: str, desc: "Equipment involved, e.g. forklift, conveyor"}
      root_cause: {type: text, desc: Root cause analysis}
      created_at: {type: timestamp, desc: When incident was logged}
      updated_at: {type: timestamp, desc: Last updated}

  corrective_actions:
    key: ca_id
    cols:
      ca_id: {type: str, desc: "Corrective action, e.g. CA-000123"}
      site_id: {type: str, desc: "DC where action applies"}
      incident_id: {type: str, desc: "Related incident if any"}
      status: {type: enum, values: [open, in_progress, completed, closed], desc: CA status}
      description: {type: text, desc: What needs to be corrected}
      owner: {type: str, desc: Employee responsible}
      due_date: {type: date, desc: Due date for completion}
      completed_date: {type: date, desc: Actual completion date}
      created_at: {type: timestamp, desc: When CA was created}
      updated_at: {type: timestamp, desc: Last updated}

  risk_assessments:
    key: ra_id
    cols:
      ra_id: {type: str, desc: "Risk assessment, e.g. RA-000123"}
      site_id: {type: str, desc: DC}
      activity: {type: str, desc: "Activity assessed, e.g. reach truck operation"}
      risk_level: {type: enum, values: [critical, high, medium, low], desc: Risk level}
      hazards: {type: text, desc: "Hazards identified"}
      controls: {type: text, desc: "Current controls in place"}
      residual_risk: {type: enum, values: [critical, high, medium, low], desc: Risk after controls}
      date_assessed: {type: date, desc: Assessment date}
      updated_at: {type: timestamp, desc: Last updated}

  site_safety_procedures:
    key: procedure_id
    cols:
      procedure_id: {type: str, desc: "Procedure, e.g. PROC-000123"}
      site_id: {type: str, desc: DC}
      procedure_name: {type: str, desc: Procedure name}
      procedure_type: {type: str, desc: "Type, e.g. forklift operation, battery charging"}
      status: {type: enum, values: [active, inactive, draft], desc: Status}
      last_updated: {type: date, desc: Last update date}

  safety_validations:
    key: validation_id
    cols:
      validation_id: {type: str, desc: "Validation record, e.g. VAL-000123"}
      asset_id: {type: str, desc: "Asset validated"}
      validation_date: {type: date, desc: Validation date}
      validation_type: {type: str, desc: "Type, e.g. firmware update, safety checks"}
      status: {type: enum, values: [pass, fail, needs_review], desc: Validation result}
      validated_by: {type: str, desc: Employee who validated}
      notes: {type: text, desc: Validation notes}
      updated_at: {type: timestamp, desc: Last updated}

  site_jurisdictions:
    key: site_id
    cols:
      site_id: {type: str, desc: DC}
      country: {type: str, desc: "ISO country code, e.g. GB, DE, PL"}
      applicable_regimes: {type: text, desc: "Applicable safety regimes, semicolon-separated"}

tools:
  - name: list_incidents
    desc: Incidents and near misses with type, severity, location, time and task. Filter by site, type or date.
    kind: select
    from: incidents
    filters:
      site_id: {}
      incident_type: {}
      severity: {}
      occurred_from: {col: occurred_at, op: ">=", type: date, default: "-365d", desc: Incidents on or after}
      task: {op: like}
    columns: [incident_id, site_id, occurred_at, incident_type, severity, location, task, shift_type, equipment_involved]
    order: occurred_at DESC
    limit: 50
    example: {site_id: DC1}

  - name: list_fatigue_related_incidents
    desc: Incidents tagged to fatigue, long hours or night shifts. Shows task, time and site.
    kind: select
    from: incidents
    filters:
      site_id: {}
      is_fatigue_related: {default: true}
      occurred_from: {col: occurred_at, op: ">=", type: date, default: "-90d", desc: Incidents on or after}
    columns: [incident_id, site_id, occurred_at, task, shift_type, incident_type, severity, description]
    order: occurred_at DESC
    limit: 30
    example: {site_id: DC1}

  - name: list_open_corrective_actions
    desc: Open corrective actions and controls by site. Shows owner, due date and status.
    kind: select
    from: corrective_actions
    filters:
      site_id: {}
      status: {default: open}
    columns: [ca_id, site_id, description, owner, due_date, status, incident_id]
    order: due_date
    limit: 30
    example: {site_id: DC1}

  - name: list_risk_assessments_by_site
    desc: Current risk assessments by site and activity. Shows hazards, controls and residual risk.
    kind: select
    from: risk_assessments
    filters:
      site_id: {}
      risk_level: {}
      activity: {op: like}
    columns: [ra_id, site_id, activity, risk_level, hazards, controls, residual_risk, date_assessed]
    order: site_id, activity
    limit: 30
    example: {site_id: DC1}

  - name: list_site_jurisdictions
    desc: Sites with country and applicable regimes for safety regulation compliance.
    kind: select
    from: site_jurisdictions
    filters:
      country: {}
    columns: [site_id, country, applicable_regimes]
    order: country, site_id
    limit: 30
    example: {}

  - name: list_site_safety_procedures
    desc: Current procedures and practices by site. Shows procedure type and status.
    kind: select
    from: site_safety_procedures
    filters:
      site_id: {}
      status: {}
      procedure_type: {op: like}
    columns: [procedure_id, site_id, procedure_name, procedure_type, status, last_updated]
    order: site_id, procedure_name
    limit: 30
    example: {site_id: DC1}

  - name: get_incident_location_heatmap
    desc: Incident counts by aisle, crossing point or area. Shows severity distribution and frequency.
    kind: sql
    args:
      site_id: {}
      incident_from: {col: occurred_at, op: ">=", type: date, default: "-90d", desc: Incidents on or after}
    sql: |
      SELECT location, count(*) AS total_incidents,
             count(*) FILTER (WHERE severity = 'critical') AS critical_count,
             count(*) FILTER (WHERE severity = 'high') AS high_count,
             count(*) FILTER (WHERE severity = 'medium') AS medium_count,
             count(*) FILTER (WHERE severity = 'low') AS low_count,
             count(*) FILTER (WHERE incident_type = 'accident') AS accidents,
             count(*) FILTER (WHERE incident_type = 'near_miss') AS near_misses
      FROM incidents
      WHERE ($site_id IS NULL OR site_id = $site_id)
        AND occurred_at >= CAST($incident_from AS DATE)
      GROUP BY location
      ORDER BY total_incidents DESC
    limit: 20
    example: {site_id: DC1}

  - name: get_site_safety_incidents
    desc: Incident and near-miss rates by site over 12 months. Shows totals and severity breakdown.
    kind: sql
    args:
      site_id: {}
      date_from: {type: date, default: "-365d", desc: Incidents on or after}
    sql: |
      SELECT s.site_id, s.name,
             count(*) AS total_incidents,
             count(*) FILTER (WHERE i.incident_type = 'accident') AS accidents,
             count(*) FILTER (WHERE i.incident_type = 'near_miss') AS near_misses,
             count(*) FILTER (WHERE i.severity = 'critical') AS critical_count,
             count(*) FILTER (WHERE i.severity = 'high') AS high_count,
             round(count(*) * 100.0 / (SELECT count(*) FROM incidents), 1) AS pct_of_total
      FROM incidents i
      JOIN master.sites s ON s.site_id = i.site_id
      WHERE ($site_id IS NULL OR i.site_id = $site_id)
        AND i.occurred_at >= CAST($date_from AS DATE)
      GROUP BY s.site_id, s.name
      ORDER BY total_incidents DESC
    limit: 20
    example: {}

  - name: get_safety_validation_records
    desc: Safety validation and sign-off records for automation. Shows asset, date and validation status.
    kind: select
    from: safety_validations
    filters:
      asset_id: {}
      validation_type: {}
      status: {}
      validation_from: {col: validation_date, op: ">=", type: date, default: "-90d", desc: Validations on or after}
    columns: [validation_id, asset_id, validation_date, validation_type, status, validated_by, notes]
    order: validation_date DESC
    limit: 30
    example: {}

  - name: create_corrective_action
    desc: Create a corrective action with owner, site and due date.
    kind: insert
    table: corrective_actions
    id_prefix: CA-
    defaults: {status: open}
    args:
      site_id: {required: true}
      description: {required: true}
      owner: {required: true}
      due_date: {required: true, type: date}
      incident_id: {type: str}
    example: {site_id: DC1, description: "Replace safety signage in aisle C", owner: "EMP-01234", due_date: "-7d"}

  - name: update_corrective_action_status
    desc: Close a corrective action or change its status or due date.
    kind: update
    table: corrective_actions
    args:
      status: {type: enum, values: [open, in_progress, completed, closed]}
      due_date: {type: date}
      completed_date: {type: date}
    example: {ca_id: CA-900001, status: closed, completed_date: "$as_of"}
