# One entry per question row that uses this system's tools (see: python -m mockmcp brief dam).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.
- question: "06:52:Q1"
  story: >
    The design team is researching key colour, material and silhouette trends for women's AW27.
    They compile a mood board (MB-900001) containing key trend references: earthy tones,
    natural materials (linen), oversized silhouettes, jewel tones, and bold geometric patterns.
    The team publishes this shared mood board to collaborate on design direction.
  checks:
    - tool: create_mood_board_in_dam
      args: {title: "AW27 Women's Design Trends", description: "Key colour material and silhouette insights for women's line", season: AW27, category: women, created_by: EMP-00027}
      expect: ["MB-", "AW27 Women's Design Trends", "published"]
