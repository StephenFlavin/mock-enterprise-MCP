id: dam
name: Digital Asset Management (DAM)
instructions: >
  Shared mood boards and design assets for the merchandising team. Mood board ids look like
  MB-000123. Use it to create and manage mood boards for design trends, seasonal collections,
  and customer insights.

tables:
  dam_assets:
    key: dam_asset_id
    cols:
      dam_asset_id: {type: str, desc: "Asset id, e.g. DAM-00001"}
      title: {type: str, desc: Asset title or description}
      asset_type: {type: enum, values: [image, video, reference, trend_data], desc: Type of asset}
      url: {type: str, desc: URL or file path to the asset}
      created_at: {type: timestamp, desc: When the asset was added}
      created_by: {type: str, desc: Employee id who created it}
      metadata: {type: str, desc: "Keywords: colour, material, silhouette attributes"}
      status: {type: enum, values: [active, archived], desc: Asset status}

  mood_boards:
    key: board_id
    cols:
      board_id: {type: str, desc: "Mood board, e.g. MB-000123"}
      title: {type: str, desc: Mood board title}
      description: {type: text, desc: Mood board description and purpose}
      season: {type: str, desc: "Season, e.g. AW27"}
      category: {type: str, desc: "Category, e.g. women, menswear, home"}
      created_at: {type: timestamp, desc: When the board was created}
      created_by: {type: str, desc: Employee id who created it}
      updated_at: {type: timestamp, desc: Last update}
      status: {type: enum, values: [draft, published, archived], desc: Mood board status}

  board_items:
    key: [board_id, item_no]
    cols:
      board_id: {type: str, desc: Mood board}
      item_no: {type: int, desc: Item sequence number}
      dam_asset_id: {type: str, desc: Asset on the board}
      added_at: {type: timestamp, desc: When added to board}
      added_by: {type: str, desc: Employee id who added it}

tools:
  - name: create_mood_board_in_dam
    desc: Create a shared mood board for the design team with title, description, season and category. Returns the new board id.
    kind: insert
    table: mood_boards
    id_prefix: MB-
    args:
      title: {required: true, desc: "Mood board title, e.g. AW27 Women's Trends"}
      description: {required: true, desc: Description of the mood board's purpose}
      season: {required: true, desc: "Season code, e.g. AW27"}
      category: {required: true, desc: "Category, e.g. women, menswear"}
      created_by: {required: true, desc: Employee id}
    defaults: {status: published}
    example: {title: "AW27 Women's Trend Board", description: "Key colour, material and silhouette trends", season: AW27, category: women, created_by: EMP-01234}
