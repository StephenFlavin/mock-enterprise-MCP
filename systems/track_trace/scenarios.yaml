# One entry per question row that uses this system's tools (see: python -m mockmcp brief track_trace).
- question: "02:19:Q1"
  story: >
    Six inbound shipments are predicted well behind plan: SHP-0000132 (INNSA to GBFXT, PO-2026-004155) by 11 days,
    SHP-0000102 (VNSGN to GBLGP) by 9, SHP-0000300 (INNSA to GBLGP) by 8, SHP-0000114 by 7, SHP-0000126 by 6 and
    SHP-0000709 by 5. All other active shipments are 4 days late or less, so these head the list. The control tower
    flags the top ones as priority.
  checks:
    - tool: get_predicted_eta_vs_planned_arrival
      args: {}
      expect: ["SHP-0000132", "SHP-0000102", "SHP-0000300", "SHP-0000114", "SHP-0000126"]
    - tool: get_predicted_eta_vs_planned_arrival
      args: {status: in_transit, min_days_late: 6}
      expect: ["SHP-0000114", "SHP-0000126"]
    - tool: update_shipment_priority
      args: {shipment_id: SHP-0000132, priority_flag: true, priority_reason: Stockout risk}
      expect: ["SHP-0000132", "priority_flag", "true"]
    - tool: get_predicted_eta_vs_planned_arrival
      args: {min_days_late: 11}
      expect: ["SHP-0000132", "true"]

- question: "02:19:Q4"
  story: >
    The Asia-UK lane CNSHA to GBFXT (service FAL9, 28 planned days) has run 3.5 days late on average over six months,
    worst on Pacific Star Shipping (CAR-006) and on sailings hit by disruptions DIS-900020, DIS-900021 and
    DIS-900024. The planning buffer is 2 days but the 90th percentile delay needs 6.6 days; with 50 percent better
    ETAs the need falls to 3.3 days, saving 3.3 buffer days.
  checks:
    - tool: get_ocean_transit_history_by_lane
      args: {origin_port: CNSHA, dest_port: GBFXT}
      expect: ["FAL9", "CAR-006", "DIS-900020", "DIS-900021"]
    - tool: calculate_planning_buffer_savings
      args: {origin_port: CNSHA, dest_port: GBFXT}
      expect: ["3.5", "6.6", "3.3", "buffer_days_saved"]

- question: "02:19:Q6"
  story: >
    Twelve disruptions are active or monitored. Top by severity: DIS-900007 Chittagong political unrest (critical,
    11 shipments, 40500 units) and DIS-900001 Felixstowe congestion (critical, 32 shipments). Five were reported in the
    last week: DIS-900001, DIS-900002, DIS-900004 (Rotterdam strike), DIS-900005 (UK customs, 60 shipments) and
    DIS-900006. The two low-severity ones fall outside the top ten.
  checks:
    - tool: list_active_disruptions
      args: {}
      expect: ["DIS-900007", "DIS-900001", "DIS-900005", "shipments_affected", "60"]
    - tool: list_new_disruptions_since
      args: {reported_since: "-7d"}
      expect: ["DIS-900001", "DIS-900002", "DIS-900004", "DIS-900005", "DIS-900006"]
    - tool: get_disruption_impact_on_shipments
      args: {disruption_id: DIS-900001}
      expect: ["SHP-0000114", "GBFXT", "19000"]

- question: "04:33:Q5"
  story: >
    Political unrest and power shortages at Chittagong (DIS-900007, critical) expose 12 undelivered shipments from
    Bangladesh (BDCGP). The earliest due is SHP-0000257 for PO-2026-004301 (4 days late, ETA about now), then
    SHP-0001109 and SHP-0000205; most are also exposed to the UK customs backlog (DIS-900005) or Felixstowe congestion.
  checks:
    - tool: get_order_shipment_status
      args: {origin_country: BD}
      expect: ["PO-2026-004301", "SHP-0000257", "DIS-900007", "BDCGP"]
    - tool: get_order_shipment_status
      args: {po_id: PO-2026-004155}
      expect: ["SHP-0000132", "delayed", "DIS-900001"]

- question: "05:47:Q1"
  story: >
    PF-220 batch BATCH-PF220-2509-A from FAC-0027 has 3000 units still on the water: shipment SHP-0001757 (PO-2026-006019,
    CAR-007, CNYTN to GBSOU) bound for DC2, due in about two weeks. Other PF-220 receipts are already delivered.
  checks:
    - tool: get_in_transit_stock_for_batch
      args: {sku: PF-220}
      expect: ["BATCH-PF220-2509-A", "SHP-0001757", "3000", "DC2", "FAC-0027"]
    - tool: get_in_transit_stock_for_batch
      args: {sku: PF-220, batch_number: BATCH-PF220-2509-A}
      expect: ["SHP-0001757", "3000"]

- question: "08:80:Q2"
  story: >
    Dubai franchise PTN-011: past shipments cleared quickly (air 4 days, sea 26 days; SHP-920004 only briefly in
    customs hold). The open order FRO-900002 on SHP-920005 is on a 25 day sea leg, predicted 2026-10-24 against a
    planned 2026-10-15 (9 days late), and FRO-900001 (SHP-920006 core, SHP-920007 non-core) is booked to sail
    2026-10-09 and predicted 2026-11-03 against a 2026-10-20 plan (14 days late). Lead time, not customs, is the gap.
  checks:
    - tool: get_shipment_tracking_for_franchise
      args: {partner_id: PTN-011}
      expect: ["SHP-920005", "FRO-900002", "SHP-920006", "FRO-900001", "customs_hold", "25"]

- question: "09:82:Q1"
  story: >
    Six months of CNSHA to GBFXT sailings show delays rising with Felixstowe congestion, with disrupted sailings
    flagged (DIS-900020 typhoon, DIS-900021 Felixstowe queue, DIS-900024 Cape diversion). GBFXT dwell climbed from
    36 to 63 hours and the vessel queue from 9 to 41 over five weeks (critical).
  checks:
    - tool: get_ocean_transit_history_by_lane
      args: {origin_port: CNSHA, dest_port: GBFXT, mode: sea}
      expect: ["FAL9", "DIS-900020", "DIS-900021", "DIS-900024"]
    - tool: get_port_congestion_history
      args: {port_code: GBFXT}
      expect: ["63", "41", "critical", "DIS-900001"]

- question: "09:82:Q6"
  story: >
    Port congestion history over the last 90 days for GBFXT (dwell 36 to 63 hours, queue 9 to 41, now critical) and
    NLRTM (dwell 38 to 94 hours during the strike) gives feature candidates for supplier delay risk, with disruption
    notes attached.
  checks:
    - tool: get_port_congestion_history
      args: {port_code: GBFXT, from_date: "-90d"}
      expect: ["GBFXT", "63", "41", "critical"]
    - tool: get_port_congestion_history
      args: {port_code: NLRTM}
      expect: ["NLRTM", "94", "DIS-900004"]
