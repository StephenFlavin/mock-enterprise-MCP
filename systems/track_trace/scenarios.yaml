# One entry per question row that uses this system's tools (see: python -m mockmcp brief track_trace).
- question: "02:19:Q1"
  story: >
    Three inbound shipments to DC1 and DC2 from Asia are at risk of late arrival (SHP-0900001 predicted
    2026-10-13 vs planned 2026-10-08, SHP-0900002 2026-10-14 vs 2026-10-09, SHP-0900003 2026-10-17 vs 2026-10-10).
    The control tower flags SHP-0900001 as priority for expedited handling by the forwarder.
  checks:
    - tool: get_predicted_eta_vs_planned_arrival
      args: {status: in_transit}
      expect: ["SHP-0900001", "SHP-0900002", "5"]
    - tool: update_shipment_priority
      args: {shipment_id: SHP-0900001, priority_flag: true}
      expect: ["priority_flag"]

- question: "02:19:Q4"
  story: >
    The Asia-UK lane (SGSIN to GBFXT) has poor ETA accuracy. Reviewing six months of transit history shows
    average variance of 5.2%, suggesting the current 14-day planning buffer can be reduced to 13 days with
    improved predictions, saving 8 days of safety stock per shipment.
  checks:
    - tool: get_ocean_transit_history_by_lane
      args: {origin_port: SGSIN, dest_port: GBFXT}
      expect: ["SGSIN", "GBFXT", "28"]
    - tool: calculate_planning_buffer_savings
      args: {origin_port: SGSIN, dest_port: GBFXT}
      expect: ["current_buffer_days", "14", "recommended_buffer_days"]

- question: "02:19:Q6"
  story: >
    Three active disruptions this week (DIS-000001 typhoon in Asia, DIS-000002 Felixstowe congestion,
    DIS-000004 customs delays) impact four shipments. Two new disruptions were reported since last Monday
    (DIS-000001, DIS-000002).
  checks:
    - tool: list_active_disruptions
      args: {}
      expect: ["DIS-000001", "DIS-000002", "critical"]
    - tool: list_new_disruptions_since
      args: {reported_since: "-7d"}
      expect: ["DIS-000001", "DIS-000002"]
    - tool: get_disruption_impact_on_shipments
      args: {disruption_id: DIS-000001}
      expect: ["SHP-0900001", "SHP-0900002"]

- question: "04:33:Q5"
  story: >
    Orders for portable fans (SKU PF-220) placed last month are in transit from Asia on two shipments
    (SHP-0900001 to DC1, SHP-0900005 also in transit). Checking order status shows current location and ETA.
  checks:
    - tool: get_order_shipment_status
      args: {order_id: "ORD-2026-0001234"}
      expect: ["SHP", "PO-2026"]

- question: "05:47:Q1"
  story: >
    Portable fan (SKU PF-220) batch recall: two manufacturing batches (MFG-20260915-001 and MFG-20260920-001)
    shipped in SHP-0900001 to DC1 totalling 5000 units are in transit. One additional batch (MFG-20260912-001)
    of 1200 units is in SHP-0900005 also in transit.
  checks:
    - tool: get_in_transit_stock_for_batch
      args: {sku: PF-220}
      expect: ["BAT-0900001", "BAT-0900002", "BAT-0900005", "5000"]

- question: "08:80:Q2"
  story: >
    Checking Dubai franchise shipments (PTN-001) shows one air shipment (SHP-0900004) arriving 2026-10-12,
    core merchandise for urgent delivery. Franchise is out of stock on this line.
  checks:
    - tool: get_shipment_tracking_for_franchise
      args: {partner_id: PTN-001}
      expect: ["PTN-001", "SHP", "in_transit"]

- question: "09:82:Q1"
  story: >
    Data scientist reviews ocean transit history on Asia-UK lane (SGSIN-GBFXT) with carrier data, port congestion
    at key ports (GBFXT, SGSIN), and variance patterns to develop predictive models.
  checks:
    - tool: get_ocean_transit_history_by_lane
      args: {origin_port: SGSIN, dest_port: GBFXT, mode: sea}
      expect: ["SGSIN", "GBFXT", "transit_time_days"]
    - tool: get_port_congestion_history
      args: {port_code: GBFXT}
      expect: ["GBFXT", "congestion_level"]

- question: "09:82:Q6"
  story: >
    Port congestion history for GBFXT and other key ports used in feature engineering for supplier delay risk
    prediction alongside PO history and dwell time patterns.
  checks:
    - tool: get_port_congestion_history
      args: {port_code: GBFXT, from_date: "-90d"}
      expect: ["GBFXT", "avg_dwell_hours"]
