  - name: get_cannibalisation_estimate
    desc: Estimate how much of a promotion's uplift is cannibalised versus incremental, from past completed promotions in the category.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Cookware (kitchenware)"}
      promotion_depth_pct: {type: float, default: 25, desc: "Planned discount depth %"}
    sql: |
      WITH h AS (
        SELECT * FROM promotions
        WHERE lower(category) = lower($category) AND status = 'completed'
          AND actual_uplift_pct IS NOT NULL AND cannibalisation_pct IS NOT NULL AND discount_depth_pct > 0),
      est AS (SELECT avg(actual_uplift_pct / discount_depth_pct) * $promotion_depth_pct AS uplift FROM h)
      SELECT $category AS category, round($promotion_depth_pct, 1) AS promotion_depth_pct,
             count(*) AS past_promotions_used,
             round(est.uplift, 1) AS estimated_total_uplift_pct,
             round(avg(h.cannibalisation_pct), 1) AS cannibalised_share_of_uplift_pct,
             round(100 - avg(h.cannibalisation_pct), 1) AS incremental_share_of_uplift_pct,
             round(est.uplift * (1 - avg(h.cannibalisation_pct) / 100), 1) AS estimated_incremental_uplift_pct,
             round(min(h.cannibalisation_pct), 1) AS lowest_past_cannibalisation_pct,
             round(max(h.cannibalisation_pct), 1) AS highest_past_cannibalisation_pct,
             arg_min(h.promotion_id, abs(h.discount_depth_pct - $promotion_depth_pct)) AS closest_past_promotion,
             'cannibalised share = average of past promotions (share of uplift taken from other lines or full-price sales)' AS basis
      FROM h CROSS JOIN est GROUP BY est.uplift
    example: {category: Cookware, promotion_depth_pct: 25}

  - name: get_discounting_depth_for_category
    desc: Get average markdown depth and frequency trends by category. Use for understanding category markdown policies.
    kind: sql
    args:
      category: {required: true}
      lookback_weeks: {type: int, default: 26, desc: "Weeks of history"}
    sql: |
      SELECT p.category,
             round(AVG(md.markdown_depth_pct), 1) AS avg_markdown_depth_pct,
             round(MAX(md.markdown_depth_pct), 1) AS max_markdown_depth_pct,
             round(MIN(md.markdown_depth_pct), 1) AS min_markdown_depth_pct,
             count(*) AS markdown_events_in_period
      FROM markdown_events md JOIN master.products p ON p.sku = md.sku
      WHERE lower(p.category) = lower($category)
        AND md.end_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks * 7 AS INT)) DAY
      GROUP BY p.category
    example: {category: Dresses, lookback_weeks: 26}

  - name: get_elasticity_confidence_for_category
    desc: Show how reliable the price elasticity estimate for a category is, with confidence interval, sample size and product-level coverage.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Outerwear"}
      measure_date: {type: date, desc: "Use the latest estimate on or before this date. Defaults to today"}
    sql: |
      SELECT e.category,
             round(e.elasticity_to_price, 2) AS elasticity_to_price,
             round(e.elasticity_confidence_interval, 2) AS confidence_interval_95pct,
             round(e.elasticity_to_price - e.elasticity_confidence_interval, 2) AS lower_bound,
             round(e.elasticity_to_price + e.elasticity_confidence_interval, 2) AS upper_bound,
             round(100 * e.elasticity_confidence_interval / abs(e.elasticity_to_price), 1) AS interval_pct_of_estimate,
             e.data_points,
             CASE WHEN e.elasticity_confidence_interval / abs(e.elasticity_to_price) < 0.12 THEN 'high'
                  WHEN e.elasticity_confidence_interval / abs(e.elasticity_to_price) < 0.2 THEN 'medium'
                  ELSE 'low' END AS confidence,
             (SELECT count(*) FROM elasticity_data x WHERE x.category = e.category AND x.sku IS NOT NULL) AS products_with_own_estimate,
             e.measure_date
      FROM elasticity_data e
      WHERE lower(e.category) = lower($category) AND e.sku IS NULL
        AND e.measure_date <= CAST(COALESCE(CAST($measure_date AS DATE), CAST($as_of AS DATE)) AS DATE)
      ORDER BY e.measure_date DESC LIMIT 1
    example: {category: Outerwear}

  - name: get_elasticity_confidence_intervals
    desc: Get the latest price elasticity estimate with confidence interval for every category, tightest first. Use to spot high and low confidence estimates.
    kind: sql
    args:
      min_data_points: {type: int, default: 0, desc: "Only categories with at least this many observations"}
    sql: |
      SELECT category,
             round(elasticity_to_price, 2) AS elasticity_to_price,
             round(elasticity_confidence_interval, 2) AS confidence_interval_95pct,
             data_points,
             round(elasticity_to_price - elasticity_confidence_interval, 2) AS lower_bound,
             round(elasticity_to_price + elasticity_confidence_interval, 2) AS upper_bound,
             measure_date
      FROM elasticity_data
      WHERE sku IS NULL AND data_points >= $min_data_points
        AND measure_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
      QUALIFY row_number() OVER (PARTITION BY category ORDER BY measure_date DESC) = 1
      ORDER BY elasticity_confidence_interval / abs(elasticity_to_price)
    limit: 40
    example: {}

  - name: get_full_price_cannibalisation_estimate
    desc: Estimate full-price sales lost on similar items when stock in a category is marked down to a given depth.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Footwear"}
      markdown_depth_pct: {type: float, required: true, desc: "Planned markdown depth %"}
      weekly_full_price_sales_gbp: {type: float, desc: "Weekly full-price sales of similar items, to express the loss in GBP"}
    sql: |
      SELECT pp.category,
             round($markdown_depth_pct, 1) AS markdown_depth_pct,
             pp.full_price_cannibalisation_pct_per_10pts AS loss_pct_per_10pts_of_depth,
             round(pp.full_price_cannibalisation_pct_per_10pts * $markdown_depth_pct / 10, 1) AS full_price_sales_loss_pct,
             CASE WHEN $weekly_full_price_sales_gbp IS NULL THEN NULL
                  ELSE round(pp.full_price_cannibalisation_pct_per_10pts * $markdown_depth_pct / 100 * $weekly_full_price_sales_gbp, 2) END AS weekly_full_price_sales_lost_gbp,
             'loss % = category cannibalisation per 10 points of depth x depth / 10' AS formula
      FROM price_positioning pp
      WHERE lower(pp.category) = lower($category)
    example: {category: Footwear, markdown_depth_pct: 40}

  - name: get_markdown_performance_for_product
    desc: Actual sell-through, units per week, stock left and margin for a product's markdown events. Give a SKU, or a style id for all its sizes.
    kind: sql
    args:
      sku: {desc: "SKU to look up"}
      style_id: {desc: "Style id, e.g. STY-4102, to see every size of the style"}
    sql: |
      SELECT md.markdown_id, md.sku, p.name, p.size,
             round(md.markdown_depth_pct, 1) AS markdown_depth_pct,
             md.start_date, md.end_date, md.status,
             md.stock_at_start, md.units_sold, md.stock_at_start - md.units_sold AS units_left,
             round(md.units_sold * 100.0 / NULLIF(md.stock_at_start, 0), 1) AS sell_through_pct,
             (SELECT count(*) FROM markdown_history h WHERE h.markdown_id = md.markdown_id) AS weeks_live,
             (SELECT round(avg(h.weekly_units_sold), 1) FROM markdown_history h WHERE h.markdown_id = md.markdown_id) AS units_per_week,
             round((md.stock_at_start - md.units_sold) / NULLIF((SELECT avg(h.weekly_units_sold) FROM markdown_history h WHERE h.markdown_id = md.markdown_id), 0), 1) AS weeks_to_clear_at_this_rate,
             round(md.original_price_gbp * (1 - md.markdown_depth_pct / 100), 2) AS markdown_price_gbp,
             round(md.original_price_gbp * (1 - md.markdown_depth_pct / 100) - p.unit_cost_gbp, 2) AS unit_margin_gbp,
             round(md.units_sold * (md.original_price_gbp * (1 - md.markdown_depth_pct / 100) - p.unit_cost_gbp), 2) AS margin_to_date_gbp
      FROM markdown_events md JOIN master.products p ON p.sku = md.sku
      WHERE ($sku IS NOT NULL OR $style_id IS NOT NULL)
        AND ($sku IS NULL OR md.sku = $sku)
        AND ($style_id IS NULL OR lower(p.style_id) = lower($style_id))
      ORDER BY md.start_date DESC, md.sku
    limit: 20
    example: {style_id: "STY-4102"}

  - name: get_markdown_rate_by_category
    desc: Get current markdown rate (% of full-price value sold at markdown) by category over the last 90 days.
    kind: sql
    args:
      category: {required: true}
    sql: |
      SELECT p.category,
             count(DISTINCT md.markdown_id) AS markdown_events,
             round(AVG(md.markdown_depth_pct), 1) AS avg_depth_pct,
             round(SUM(md.units_sold), 0) AS total_units_cleared,
             round(SUM(md.units_sold * (md.original_price_gbp * (1 - md.markdown_depth_pct / 100) - p.unit_cost_gbp)), 2) AS total_margin_gbp,
             round(100 * SUM(md.units_sold * md.original_price_gbp * md.markdown_depth_pct / 100) / NULLIF(SUM(md.units_sold * md.original_price_gbp), 0), 1) AS markdown_cost_pct_of_full_price_value,
             'markdown rate = discount given / full-price value of units sold on markdown' AS metric_definition
      FROM markdown_events md JOIN master.products p ON p.sku = md.sku
      WHERE lower(p.category) = lower($category)
        AND md.status IN ('active', 'completed')
        AND md.end_date >= CAST($as_of AS DATE) - INTERVAL 90 DAY
      GROUP BY p.category
    example: {category: Dresses}

  - name: get_markdown_spend_by_category
    desc: Markdown cost (discount given) and markdown rate for a category over the last N weeks versus the N weeks before. Add department for part of a category.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Knitwear"}
      department: {desc: "Department if only part of the category, e.g. Womenswear"}
      lookback_weeks: {type: int, default: 4, desc: "Length of each period in weeks"}
    sql: |
      WITH ev AS (
        SELECT md.*, p.unit_cost_gbp,
               CASE WHEN md.start_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks * 7 AS INT)) DAY THEN 'last period'
                    WHEN md.start_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks * 14 AS INT)) DAY THEN 'previous period' END AS period
        FROM markdown_events md JOIN master.products p ON p.sku = md.sku
        WHERE lower(p.category) = lower($category)
          AND ($department IS NULL OR lower(p.department) = lower($department))
          AND md.status IN ('active', 'completed') AND md.start_date <= CAST($as_of AS DATE))
      SELECT period, count(*) AS markdown_events, sum(units_sold) AS units_sold,
             round(avg(markdown_depth_pct), 1) AS avg_depth_pct,
             round(sum(units_sold * original_price_gbp), 2) AS full_price_value_of_units_sold_gbp,
             round(sum(units_sold * original_price_gbp * markdown_depth_pct / 100), 2) AS markdown_cost_gbp,
             round(100 * sum(units_sold * original_price_gbp * markdown_depth_pct / 100) / NULLIF(sum(units_sold * original_price_gbp), 0), 1) AS markdown_rate_pct,
             round(sum(units_sold * (original_price_gbp * (1 - markdown_depth_pct / 100) - unit_cost_gbp)), 2) AS margin_after_markdown_gbp,
             'markdown cost = full price x depth x units sold; rate = markdown cost / full-price value' AS calculation
      FROM ev WHERE period IS NOT NULL
      GROUP BY period ORDER BY period
    example: {category: Knitwear, department: Womenswear}

  - name: get_our_black_friday_results_last_year
    desc: Retrieve results of our last Black Friday promotion for benchmarking and planning next year.
    kind: sql
    args: {}
    sql: |
      SELECT p.promotion_id, p.category,
             p.discount_depth_pct, p.start_date, p.end_date,
             round(p.planned_uplift_pct, 1) AS planned_uplift_pct,
             round(p.actual_uplift_pct, 1) AS actual_uplift_pct,
             round(p.planned_margin_gbp, 2) AS planned_margin_gbp,
             round(p.actual_margin_gbp, 2) AS actual_margin_gbp,
             'Black Friday 2025 results' AS event
      FROM promotions p
      WHERE (p.start_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY
        AND p.start_date <= CAST($as_of AS DATE))
        AND (p.promotion_type = 'percentage_discount' OR EXTRACT(MONTH FROM p.start_date) = 11)
      ORDER BY p.start_date DESC
      LIMIT 5
    example: {}

  - name: get_our_markdown_depth_and_timing
    desc: Our current markdown depth, duration and timing by category and department over the last 13 weeks. Omit category to compare all categories.
    kind: sql
    args:
      category: {desc: "Category, e.g. Outerwear. Omit to compare all"}
      department: {desc: "Department, e.g. Menswear"}
      lookback_weeks: {type: int, default: 13, desc: "Weeks of markdown starts to include"}
    sql: |
      SELECT p.category, p.department,
             count(*) AS markdown_events,
             count(*) FILTER (WHERE md.status = 'active') AS live_now,
             round(avg(md.markdown_depth_pct), 1) AS avg_markdown_depth_pct,
             round(max(md.markdown_depth_pct), 1) AS max_markdown_depth_pct,
             round(avg(CAST((md.end_date - md.start_date) AS INT)) / 7.0, 1) AS avg_duration_weeks,
             round(avg(CAST((md.start_date - p.launch_date) AS INT)) / 7.0, 0) AS avg_weeks_from_launch_to_markdown,
             min(md.start_date) AS first_markdown_start,
             sum(md.units_sold) AS units_sold,
             round(100.0 * sum(md.units_sold) / NULLIF(sum(md.stock_at_start), 0), 1) AS sell_through_pct
      FROM markdown_events md JOIN master.products p ON p.sku = md.sku
      WHERE md.status IN ('active', 'completed')
        AND md.start_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks * 7 AS INT)) DAY
        AND ($category IS NULL OR lower(p.category) = lower($category))
        AND ($department IS NULL OR lower(p.department) = lower($department))
      GROUP BY p.category, p.department
      ORDER BY p.category, p.department
    limit: 40
    example: {category: Outerwear, department: Menswear}

  - name: get_own_product_prices_and_quality_scores
    desc: Get our current prices, costs and quality positioning for products in a category for competitive analysis.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. kitchenware"}
    sql: |
      SELECT p.sku, p.style_id, p.name,
             round(CASE WHEN pc.new_price_gbp IS NOT NULL THEN pc.new_price_gbp ELSE pc.old_price_gbp END, 2) AS current_price_gbp,
             'Quality score: 4/5' AS quality_position,
             'Target position: mid-market' AS strategic_position,
             pc.created_at AS price_set_date
      FROM master.products p
      LEFT JOIN price_changes pc ON pc.sku = p.sku AND pc.status = 'active'
      WHERE p.category = $category
      ORDER BY p.sku
      LIMIT 50
    example: {category: Cookware}

  - name: get_post_promotion_dip_for_category
    desc: Sales dip after past promotions in a category (dip % and weeks), most recent first, with the average and the closest-depth event.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Cookware (kitchenware)"}
      promotion_depth_pct: {type: float, default: 25, desc: "Planned discount depth % to compare against"}
    sql: |
      SELECT p.promotion_id, p.event_name, p.discount_depth_pct, p.start_date, p.end_date,
             p.post_promo_dip_pct, p.post_promo_dip_weeks,
             round(avg(p.post_promo_dip_pct) OVER (), 1) AS average_dip_pct_all_events,
             CASE WHEN abs(p.discount_depth_pct - $promotion_depth_pct) = min(abs(p.discount_depth_pct - $promotion_depth_pct)) OVER ()
                  THEN 'closest depth to plan' ELSE '' END AS comparable
      FROM promotions p
      WHERE lower(p.category) = lower($category) AND p.status = 'completed' AND p.post_promo_dip_pct IS NOT NULL
      ORDER BY p.end_date DESC
    limit: 10
    example: {category: Cookware, promotion_depth_pct: 25}

  - name: get_price_change_history_for_sku
    desc: Return all price changes (draft, approved, active, rolled back) for a specific SKU with reasons.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT pc.pc_id, pc.sku,
             round(pc.old_price_gbp, 2) AS old_price_gbp,
             round(pc.new_price_gbp, 2) AS new_price_gbp,
             round((pc.new_price_gbp / pc.old_price_gbp - 1) * 100, 1) AS price_change_pct,
             pc.change_reason, pc.status,
             pc.proposed_date, pc.effective_date, pc.created_at
      FROM price_changes pc
      WHERE pc.sku = $sku
      ORDER BY pc.created_at DESC
      LIMIT 20
    example: {sku: "K-1700"}

  - name: get_price_changes_for_category
    desc: Price changes for a category, past and pending, with old and new price, change %, reason, status and date. Add department for part of a category.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Outerwear"}
      department: {desc: "Department if only part of the category, e.g. Womenswear"}
      lookback_weeks: {type: int, default: 26, desc: "Weeks of history"}
    sql: |
      SELECT pc.pc_id, pc.sku, p.name, p.department,
             round(pc.old_price_gbp, 2) AS old_price_gbp,
             round(pc.new_price_gbp, 2) AS new_price_gbp,
             round((pc.new_price_gbp / pc.old_price_gbp - 1) * 100, 1) AS price_change_pct,
             pc.change_reason, pc.status,
             COALESCE(pc.effective_date, pc.proposed_date) AS change_date
      FROM price_changes pc JOIN master.products p ON p.sku = pc.sku
      WHERE lower(p.category) = lower($category)
        AND ($department IS NULL OR lower(p.department) = lower($department))
        AND COALESCE(pc.effective_date, pc.proposed_date) >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks * 7 AS INT)) DAY
      ORDER BY change_date DESC, pc.pc_id
      LIMIT 50
    example: {category: Outerwear}

  - name: get_price_elasticity_for_category
    desc: Latest price elasticity of demand for a category with confidence interval, sample size and the previous estimate. Use to model volume impact of price changes.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Outerwear"}
    sql: |
      SELECT category,
             round(elasticity_to_price, 2) AS elasticity_to_price,
             round(elasticity_confidence_interval, 2) AS confidence_interval_95pct,
             data_points,
             round(lead(elasticity_to_price) OVER (ORDER BY measure_date DESC), 2) AS previous_elasticity,
             measure_date,
             'Below -1 = elastic: a 1% price rise loses more than 1% of volume' AS interpretation
      FROM elasticity_data
      WHERE lower(category) = lower($category) AND sku IS NULL
      ORDER BY measure_date DESC
      LIMIT 1
    example: {category: Cookware}

  - name: get_price_elasticity_for_product
    desc: Price elasticity of demand for one SKU. Uses the product's own estimate if there is one, otherwise its category estimate.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT p.sku, p.name, p.category,
             CASE WHEN e.sku IS NOT NULL THEN 'product' ELSE 'category (no product-level estimate)' END AS level,
             round(e.elasticity_to_price, 2) AS elasticity_to_price,
             round(e.elasticity_confidence_interval, 2) AS confidence_interval_95pct,
             e.data_points, e.measure_date
      FROM master.products p
      JOIN elasticity_data e ON e.sku = p.sku OR (e.sku IS NULL AND e.category = p.category)
      WHERE p.sku = $sku
      QUALIFY row_number() OVER (ORDER BY CASE WHEN e.sku IS NOT NULL THEN 0 ELSE 1 END, e.measure_date DESC) = 1
    example: {sku: "SKU-100168"}

  - name: get_price_elasticity_for_products
    desc: Get price elasticity for multiple products. Returns elasticity estimates with confidence intervals for each SKU.
    kind: sql
    args:
      category: {required: true}
    sql: |
      SELECT ed.sku, ed.category,
             round(ed.elasticity_to_price, 2) AS elasticity_to_price,
             round(ed.elasticity_confidence_interval, 3) AS confidence_interval_95pct,
             ed.data_points,
             ed.measure_date
      FROM elasticity_data ed
      WHERE ed.category = $category AND ed.sku IS NOT NULL
      ORDER BY ed.measure_date DESC, ed.sku
      LIMIT 50
    example: {category: "Small Appliances"}

  - name: get_price_positioning_for_product
    desc: Where a product's price sits in its category (index to category median, percentile) against the category's target position and price band.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      WITH cat AS (
        SELECT category, count(*) AS n, min(retail_price_gbp) AS lo, max(retail_price_gbp) AS hi,
               avg(retail_price_gbp) AS avg_price, median(retail_price_gbp) AS med
        FROM master.products WHERE status <> 'discontinued' GROUP BY category)
      SELECT p.sku, p.name, p.category,
             p.retail_price_gbp AS price_gbp,
             round(c.med, 2) AS category_median_price_gbp,
             round(c.lo, 2) AS category_lowest_price_gbp,
             round(c.hi, 2) AS category_highest_price_gbp,
             round(p.retail_price_gbp / c.med, 2) AS price_index_vs_category_median,
             round(100.0 * (SELECT count(*) FROM master.products q WHERE q.category = p.category AND q.status <> 'discontinued' AND q.retail_price_gbp < p.retail_price_gbp) / c.n, 0) AS price_percentile_in_category,
             pp.target_position,
             pp.min_price_index AS allowed_index_min, pp.max_price_index AS allowed_index_max,
             CASE WHEN p.retail_price_gbp / c.med < pp.min_price_index THEN 'below target band'
                  WHEN p.retail_price_gbp / c.med > pp.max_price_index THEN 'above target band'
                  ELSE 'within target band' END AS position_check,
             round(c.med * pp.min_price_index, 2) AS band_low_gbp,
             round(c.med * pp.max_price_index, 2) AS band_high_gbp,
             pp.markdown_policy_min_depth_pct AS min_markdown_allowed_pct,
             pp.markdown_policy_max_depth_pct AS max_markdown_allowed_pct
      FROM master.products p
      JOIN cat c ON c.category = p.category
      LEFT JOIN price_positioning pp ON pp.category = p.category
      WHERE p.sku = $sku
    example: {sku: "SKU-103423"}

  - name: get_price_positioning_rules_for_category
    desc: Get pricing positioning, allowed price band index and markdown policy rules for a category. Use for understanding strategic pricing constraints.
    kind: sql
    args:
      category: {required: true}
    sql: |
      SELECT category, target_position,
             min_price_index AS allowed_index_min,
             max_price_index AS allowed_index_max,
             markdown_policy_min_depth_pct AS min_markdown_allowed_pct,
             markdown_policy_max_depth_pct AS max_markdown_allowed_pct,
             full_price_cannibalisation_pct_per_10pts,
             updated_at
      FROM price_positioning
      WHERE lower(category) = lower($category)
    example: {category: Cookware}

  - name: get_promotion_calendar_for_category
    desc: Promotions for a category from a few weeks back to weeks ahead, with depth, dates, status and cancellations. Use to see the calendar and avoid clashes.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Outerwear or Trousers"}
      department: {desc: "Department if only part of the category, e.g. Menswear"}
      weeks_back: {type: int, default: 8, desc: "How many weeks back to show"}
      weeks_ahead: {type: int, default: 26, desc: "How many weeks ahead to show"}
      status: {type: enum, values: [draft, scheduled, active, completed, cancelled], desc: "Only this status. Omit for all"}
    sql: |
      SELECT promo.promotion_id, promo.event_name, promo.category, COALESCE(promo.department, 'all') AS department,
             promo.promotion_type, round(promo.discount_depth_pct, 1) AS discount_depth_pct,
             promo.start_date, promo.end_date, promo.status,
             round(promo.planned_uplift_pct, 1) AS planned_uplift_pct,
             round(promo.actual_uplift_pct, 1) AS actual_uplift_pct,
             promo.cancel_reason
      FROM promotions promo
      WHERE lower(promo.category) = lower($category)
        AND ($department IS NULL OR promo.department IS NULL OR lower(promo.department) = lower($department))
        AND ($status IS NULL OR promo.status = $status)
        AND promo.end_date >= CAST($as_of AS DATE) - INTERVAL (CAST($weeks_back * 7 AS INT)) DAY
        AND promo.start_date < CAST($as_of AS DATE) + INTERVAL (CAST($weeks_ahead * 7 AS INT)) DAY
      ORDER BY promo.start_date
      LIMIT 50
    example: {category: Outerwear}

  - name: get_promotion_calendar_for_store
    desc: Get promotions scheduled for a specific store in next 26 weeks. Use for store operations planning.
    kind: sql
    args:
      site_id: {required: true}
      weeks_ahead: {type: int, default: 26, desc: "How many weeks ahead to show"}
    sql: |
      SELECT DISTINCT pc.promotion_id, pc.site_id, pc.category, pc.promotion_type,
             pc.start_date, pc.end_date
      FROM promotion_calendar pc
      WHERE pc.site_id = $site_id
        AND pc.start_date < CAST($as_of AS DATE) + INTERVAL (CAST($weeks_ahead * 7 AS INT)) DAY
      ORDER BY pc.start_date
      LIMIT 50
    example: {site_id: "ST001", weeks_ahead: 26}

  - name: get_promotion_depth_and_timing_history
    desc: Retrieve historical promotion depth and timing patterns for a category. Use to understand promotional strategy evolution.
    kind: sql
    args:
      category: {required: true}
      lookback_weeks: {type: int, default: 52, desc: "Weeks of history"}
    sql: |
      SELECT promotion_id, category, promotion_type,
             round(discount_depth_pct, 1) AS discount_depth_pct,
             start_date, end_date,
             CAST((end_date - start_date) AS INT) AS duration_days,
             round(CAST((end_date - start_date) AS INT) / 7.0, 1) AS duration_weeks,
             status
      FROM promotions
      WHERE category = $category
        AND end_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks * 7 AS INT)) DAY
      ORDER BY start_date DESC
      LIMIT 50
    example: {category: Cookware, lookback_weeks: 52}

  - name: get_promotion_flags_for_item
    desc: Get promotion flags and constraints affecting a SKU (e.g. excluded from promotions, supplier-funded restrictions).
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT $sku AS sku,
             'Item may participate in promotions' AS flag,
             'No supplier co-funding restrictions' AS constraint,
             'Eligible for category and cross-category promotions' AS eligibility,
             'Check category positioning before assigning to promotions' AS note
      FROM (SELECT 1) t
    example: {sku: "K-1700"}

  - name: get_promotion_history_for_category
    desc: Past promotions in a category with discount depth, actual uplift, margin, cannibalisation and post-promotion dip, most recent first.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Cookware (kitchenware)"}
      department: {desc: "Department if only part of the category"}
      lookback_weeks: {type: int, default: 52, desc: "Weeks of history"}
    sql: |
      SELECT p.promotion_id, p.event_name, p.category, p.promotion_type,
             round(p.discount_depth_pct, 1) AS discount_depth_pct,
             p.start_date, p.end_date,
             round(p.planned_uplift_pct, 1) AS planned_uplift_pct,
             round(p.actual_uplift_pct, 1) AS actual_uplift_pct,
             round(p.actual_margin_gbp, 2) AS actual_margin_gbp,
             round(p.cannibalisation_pct, 1) AS cannibalisation_pct_of_uplift,
             round(p.post_promo_dip_pct, 1) AS post_promo_dip_pct,
             p.post_promo_dip_weeks,
             p.status
      FROM promotions p
      WHERE lower(p.category) = lower($category)
        AND ($department IS NULL OR p.department IS NULL OR lower(p.department) = lower($department))
        AND p.end_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks * 7 AS INT)) DAY
        AND p.status IN ('completed', 'cancelled')
      ORDER BY p.end_date DESC
      LIMIT 50
    example: {category: Cookware, lookback_weeks: 52}

  - name: get_promotion_margin_and_traffic_return
    desc: Analyse margin and traffic return for a promotion. Returns margin contribution and uplift achieved vs planned.
    kind: sql
    args:
      promotion_id: {required: true}
    sql: |
      SELECT p.promotion_id, p.category,
             round(p.planned_margin_gbp, 2) AS planned_margin_gbp,
             round(p.actual_margin_gbp, 2) AS actual_margin_gbp,
             round(p.planned_uplift_pct, 1) AS planned_uplift_pct,
             round(p.actual_uplift_pct, 1) AS actual_uplift_pct,
             CASE WHEN p.planned_margin_gbp > 0
               THEN round((p.actual_margin_gbp / p.planned_margin_gbp - 1) * 100, 1)
               ELSE NULL END AS margin_vs_plan_pct,
             p.status
      FROM promotions p
      WHERE p.promotion_id = $promotion_id
    example: {promotion_id: "PROMO-900001"}

  - name: get_promotion_results_vs_plan
    desc: Compare planned vs actual results for a promotion. Returns uplift, margin and ROI performance.
    kind: sql
    args:
      promotion_id: {required: true}
    sql: |
      SELECT p.promotion_id, p.category,
             round(p.planned_uplift_pct, 1) AS planned_uplift_pct,
             round(p.actual_uplift_pct, 1) AS actual_uplift_pct,
             round(p.actual_uplift_pct - p.planned_uplift_pct, 1) AS uplift_variance_pct,
             round(p.planned_margin_gbp, 2) AS planned_margin_gbp,
             round(p.actual_margin_gbp, 2) AS actual_margin_gbp,
             round(p.actual_margin_gbp - p.planned_margin_gbp, 2) AS margin_variance_gbp,
             p.status,
             p.start_date, p.end_date
      FROM promotions p
      WHERE p.promotion_id = $promotion_id
    example: {promotion_id: "PROMO-900002"}

  - name: get_promotion_uplift_estimate
    desc: Estimate sales uplift for a planned promotion from the uplift per discount point of past completed promotions in the category, with range and closest event.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Cookware (kitchenware)"}
      discount_pct: {type: float, required: true, desc: "Planned discount %, e.g. 25"}
    sql: |
      WITH h AS (
        SELECT * FROM promotions
        WHERE lower(category) = lower($category) AND status = 'completed'
          AND actual_uplift_pct IS NOT NULL AND discount_depth_pct > 0)
      SELECT $category AS category, round($discount_pct, 1) AS discount_pct,
             count(*) AS past_promotions_used,
             round(avg(actual_uplift_pct / discount_depth_pct) * $discount_pct, 1) AS estimated_uplift_pct,
             round(min(actual_uplift_pct / discount_depth_pct) * $discount_pct, 1) AS low_uplift_pct,
             round(max(actual_uplift_pct / discount_depth_pct) * $discount_pct, 1) AS high_uplift_pct,
             arg_min(promotion_id, abs(discount_depth_pct - $discount_pct)) AS closest_past_promotion,
             arg_min(discount_depth_pct, abs(discount_depth_pct - $discount_pct)) AS closest_depth_pct,
             arg_min(actual_uplift_pct, abs(discount_depth_pct - $discount_pct)) AS closest_actual_uplift_pct,
             'uplift = average of (actual uplift % / discount %) over past completed promotions x planned discount %' AS basis
      FROM h
    example: {category: Cookware, discount_pct: 25}

  - name: list_promotions_in_calendar
    desc: List all promotions in the calendar for a date range. Use for seeing full promotional schedule.
    kind: select
    from: promotion_calendar
    filters:
      site_id: {}
      start_date: {col: start_date, op: ">=", default: "-7d"}
      end_date: {col: end_date, op: "<=", default: "+90d"}
    columns: [promotion_id, site_id, category, promotion_type, start_date, end_date]
    order: start_date
    limit: 100
    example: {site_id: "ST001"}

  - name: list_promotions_next_six_weeks
    desc: List promotions starting in the next 6 weeks. Use for upcoming promotional planning.
    kind: sql
    args:
      weeks_ahead: {type: int, default: 6, desc: "How many weeks ahead"}
    sql: |
      SELECT DISTINCT p.promotion_id, p.category, p.promotion_type,
             round(p.discount_depth_pct, 1) AS discount_depth_pct,
             p.start_date, p.end_date,
             round(p.planned_uplift_pct, 1) AS planned_uplift_pct,
             p.status
      FROM promotions p
      WHERE p.start_date >= CAST($as_of AS DATE)
        AND p.start_date < CAST($as_of AS DATE) + INTERVAL (CAST($weeks_ahead * 7 AS INT)) DAY
        AND p.status IN ('scheduled', 'active')
      ORDER BY p.start_date
      LIMIT 50
    example: {weeks_ahead: 6}

  - name: run_volume_and_margin_forecast_at_price_points
    desc: Forecast volume and margin outcomes at different price points for a SKU using elasticity.
    kind: sql
    args:
      sku: {required: true}
      base_price_gbp: {type: float, required: true, desc: "Base price in GBP"}
      base_volume_units: {type: int, required: true, desc: "Base volume units"}
      cost_gbp: {type: float, required: true, desc: "Unit cost in GBP"}
      elasticity_to_price: {type: float, default: -1.5, desc: "Price elasticity"}
    sql: |
      SELECT $sku AS sku,
             round($base_price_gbp * 0.85, 2) AS price_gbp_minus_15pct,
             round($base_volume_units * POWER(0.85, $elasticity_to_price), 0) AS forecast_volume,
             round(($base_price_gbp * 0.85 - $cost_gbp) * $base_volume_units * POWER(0.85, $elasticity_to_price), 2) AS margin_gbp
      UNION ALL
      SELECT $sku,
             round($base_price_gbp, 2),
             round($base_volume_units, 0),
             round(($base_price_gbp - $cost_gbp) * $base_volume_units, 2)
      UNION ALL
      SELECT $sku,
             round($base_price_gbp * 1.15, 2),
             round($base_volume_units * POWER(1.15, $elasticity_to_price), 0),
             round(($base_price_gbp * 1.15 - $cost_gbp) * $base_volume_units * POWER(1.15, $elasticity_to_price), 2)
      ORDER BY price_gbp_minus_15pct
    example: {sku: "K-1700", base_price_gbp: 35.0, base_volume_units: 10000, cost_gbp: 15.0, elasticity_to_price: -1.5}

  - name: run_volume_and_margin_forecast_for_price_change
    desc: Model volume and margin impact of a proposed price change. Use for price change decision support.
    kind: sql
    args:
      sku: {required: true}
      current_price_gbp: {type: float, required: true, desc: "Current price in GBP"}
      new_price_gbp: {type: float, required: true, desc: "Proposed new price in GBP"}
      current_volume_units: {type: int, required: true, desc: "Current volume units"}
      cost_gbp: {type: float, required: true, desc: "Unit cost in GBP"}
      elasticity_to_price: {type: float, default: -1.2, desc: "Price elasticity"}
    sql: |
      SELECT $sku AS sku,
             round($current_price_gbp, 2) AS current_price_gbp,
             round($new_price_gbp, 2) AS new_price_gbp,
             round(($new_price_gbp / $current_price_gbp - 1) * 100, 1) AS price_change_pct,
             round($current_volume_units * POWER(($new_price_gbp / $current_price_gbp), $elasticity_to_price), 0) AS forecast_volume_units,
             round(($current_price_gbp - $cost_gbp) * $current_volume_units, 2) AS current_margin_gbp,
             round(($new_price_gbp - $cost_gbp) * $current_volume_units * POWER(($new_price_gbp / $current_price_gbp), $elasticity_to_price), 2) AS forecast_margin_gbp,
             'Volume forecast based on elasticity assumption' AS basis
    example: {sku: "K-1700", current_price_gbp: 35.0, new_price_gbp: 38.5, current_volume_units: 10000, cost_gbp: 15.0, elasticity_to_price: -1.2}

  - name: submit_price_change_for_approval
    desc: Submit a draft price change into the approval workflow. Moves from draft to submitted status.
    kind: update
    table: price_changes
    set: {status: submitted, updated_at: "$as_of"}
    args: {}
    example: {pc_id: PC-900001}

  - name: update_markdown_price_for_product
    desc: Change the markdown depth on an existing markdown event, which sets the new markdown price. Returns the old and new depth.
    kind: update
    table: markdown_events
    set: {updated_at: "$as_of"}
    args:
      markdown_depth_pct: {type: float, required: true, desc: "New markdown depth %, e.g. 40"}
    example: {markdown_id: MDE-900101, markdown_depth_pct: 40}

  - name: update_promotion_start_date
    desc: Move the start and end dates of a scheduled promotion. Use to adjust promotional timing.
    kind: update
    table: promotions
    set: {start_date: "{start_date}", end_date: "{end_date}", updated_at: "$as_of"}
    args:
      start_date: {type: date, required: true}
      end_date: {type: date, required: true}
    example: {promotion_id: PROMO-900001, start_date: "+7d", end_date: "+35d"}
