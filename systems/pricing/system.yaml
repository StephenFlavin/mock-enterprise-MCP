id: pricing
name: Pricing & Promotion Engine
instructions: >
  Pricing strategy, promotions, markdowns and elasticity. Track price changes, promotions, markdown events,
  price tests and pricing analytics. Use for demand elasticity, promotion ROI, markdown scenarios and price positioning.
  Price change ids look like PC-000123, promotion ids like PROMO-000123, markdown ids like MDE-000123.

tables:
  promotions:
    key: promotion_id
    cols:
      promotion_id: {type: str, desc: "Promotion, e.g. PROMO-000123"}
      category: {type: str, desc: "Category being promoted, e.g. kitchenware"}
      promotion_type: {type: enum, values: [percentage_discount, fixed_discount, bundle, bogo, other], desc: "Type of promotion"}
      discount_depth_pct: {type: float, desc: "Discount percentage"}
      start_date: {type: date, desc: "Promotion start date"}
      end_date: {type: date, desc: "Promotion end date"}
      status: {type: enum, values: [draft, scheduled, active, completed, cancelled], desc: "Promotion status"}
      planned_uplift_pct: {type: float, desc: "Planned sales uplift %"}
      planned_margin_gbp: {type: float, desc: "Planned contribution margin in GBP"}
      actual_uplift_pct: {type: float, desc: "Actual uplift achieved %"}
      actual_margin_gbp: {type: float, desc: "Actual contribution margin in GBP"}
      supplier_funded_pct: {type: float, desc: "Percent funded by supplier"}
      created_at: {type: timestamp, desc: "When created"}
      updated_at: {type: timestamp, desc: "Last updated"}
      cancel_reason: {type: str, desc: "Reason if cancelled"}

  markdown_events:
    key: markdown_id
    cols:
      markdown_id: {type: str, desc: "Markdown event, e.g. MDE-000123"}
      sku: {desc: "SKU being marked down"}
      category: {type: str, desc: "Category code"}
      markdown_depth_pct: {type: float, desc: "Markdown percentage"}
      start_date: {type: date, desc: "Markdown start date"}
      end_date: {type: date, desc: "Markdown end date"}
      status: {type: enum, values: [draft, scheduled, active, completed, cancelled], desc: "Markdown status"}
      stock_at_start: {type: int, desc: "Stock on hand at markdown start"}
      units_sold: {type: int, desc: "Units sold during markdown"}
      original_price_gbp: {type: float, desc: "Full price in GBP"}
      markdown_price_gbp: {type: float, desc: "Markdown price in GBP"}
      cost_gbp: {type: float, desc: "Unit cost in GBP"}
      margin_gbp: {type: float, desc: "Total margin from markdown event"}
      review_reason: {type: str, desc: "Reason for review if applicable"}
      created_at: {type: timestamp, desc: "When created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  price_changes:
    key: pc_id
    cols:
      pc_id: {type: str, desc: "Price change request, e.g. PC-000123"}
      sku: {desc: "SKU affected"}
      category: {type: str, desc: "Category code"}
      old_price_gbp: {type: float, desc: "Previous price in GBP"}
      new_price_gbp: {type: float, desc: "New price in GBP"}
      price_change_pct: {type: float, desc: "Price change percentage"}
      change_reason: {type: str, desc: "Reason for change"}
      status: {type: enum, values: [draft, submitted, approved, scheduled, active, rolled_back, cancelled], desc: "Change status"}
      cancel_reason: {type: str, desc: "Reason if cancelled"}
      proposed_date: {type: date, desc: "Proposed effective date"}
      effective_date: {type: date, desc: "Actual effective date"}
      created_at: {type: timestamp, desc: "When created"}
      updated_at: {type: timestamp, desc: "Last updated"}
      rolled_back_at: {type: timestamp, desc: "When rolled back if applicable"}

  price_tests:
    key: test_id
    cols:
      test_id: {type: str, desc: "Price test, e.g. PT-000123"}
      sku: {desc: "SKU being tested"}
      test_price_gbp: {type: float, desc: "Test price in GBP"}
      control_price_gbp: {type: float, desc: "Control price in GBP"}
      test_store_count: {type: int, desc: "Number of stores in test cell"}
      control_store_count: {type: int, desc: "Number of stores in control cell"}
      start_date: {type: date, desc: "Test start date"}
      end_date: {type: date, desc: "Test end date"}
      status: {type: enum, values: [planned, active, completed, cancelled], desc: "Test status"}
      test_volume: {type: int, desc: "Volume sold in test cell"}
      control_volume: {type: int, desc: "Volume sold in control cell"}
      elasticity_estimate: {type: float, desc: "Estimated elasticity from test"}
      created_at: {type: timestamp, desc: "When created"}

  elasticity_data:
    key: [category, measure_date]
    cols:
      category: {type: str, desc: "Category code"}
      sku: {desc: "SKU if product-level elasticity"}
      measure_date: {type: date, desc: "Date of measurement"}
      elasticity_to_price: {type: float, desc: "Price elasticity of demand"}
      elasticity_to_income: {type: float, desc: "Income elasticity of demand"}
      elasticity_confidence_interval: {type: float, desc: "95% CI range +/-"}
      data_points: {type: int, desc: "Number of observations"}
      last_updated: {type: timestamp, desc: "When last calculated"}

  promotion_history:
    key: [promotion_id, history_date]
    cols:
      promotion_id: {type: str, desc: "Reference to promotion"}
      history_date: {type: date, desc: "Date of observation"}
      daily_sales_gbp: {type: float, desc: "Daily sales during promotion"}
      units_sold: {type: int, desc: "Units sold"}
      baseline_daily_sales_gbp: {type: float, desc: "Expected sales without promo"}
      uplift_gbp: {type: float, desc: "Sales uplift vs baseline"}
      margin_gbp: {type: float, desc: "Contribution margin"}
      stock_outs: {type: int, desc: "Number of stock-outs"}

  markdown_history:
    key: [markdown_id, history_date]
    cols:
      markdown_id: {type: str, desc: "Reference to markdown"}
      history_date: {type: date, desc: "Date of observation"}
      daily_units_sold: {type: int, desc: "Units sold that day"}
      daily_revenue_gbp: {type: float, desc: "Revenue that day"}
      remaining_stock: {type: int, desc: "Stock remaining"}
      cumulative_margin_gbp: {type: float, desc: "Margin to date"}

  price_positioning:
    key: category
    cols:
      category: {type: str, desc: "Category code"}
      target_position: {type: enum, values: [premium, mid_market, value], desc: "Pricing position"}
      min_price_pct_of_high: {type: float, desc: "Min price as % of high tier"}
      max_price_pct_of_high: {type: float, desc: "Max price as % of high tier"}
      markdown_policy_min_depth_pct: {type: float, desc: "Minimum markdown allowed"}
      markdown_policy_max_depth_pct: {type: float, desc: "Maximum markdown allowed"}
      updated_at: {type: timestamp, desc: "Policy last updated"}

  promotion_calendar:
    key: [site_id, start_date]
    cols:
      promotion_id: {type: str, desc: "Promotion id"}
      site_id: {desc: "Store or DC"}
      start_date: {type: date, desc: "Promotion start"}
      end_date: {type: date, desc: "Promotion end"}
      category: {type: str, desc: "Category being promoted"}
      promotion_type: {type: str, desc: "Type of promotion"}

tools:
  - name: calculate_category_demand_elasticity_to_income
    desc: Calculate elasticity of demand to income changes for a category. Use for scenario planning around economic cycles.
    kind: sql
    args:
      category: {required: true, desc: "Category code, e.g. kitchenware"}
      lookback_weeks: {type: int, default: 52, desc: "Weeks of history to use"}
    sql: |
      SELECT category,
             round(elasticity_to_income, 3) AS elasticity_to_income,
             round(elasticity_confidence_interval, 3) AS confidence_interval_95pct,
             data_points,
             'elasticity = % demand change / % income change' AS formula
      FROM elasticity_data
      WHERE category = $category
      ORDER BY measure_date DESC
      LIMIT 1
    example: {category: kitchenware}

  - name: calculate_clearance_option_recovery
    desc: Compare recovery potential (margin %) for markdown, outlet, bundle, donate, liquidate clearance options.
    kind: sql
    args:
      sku: {required: true}
      current_price_gbp: {type: float, required: true, desc: "Current price in GBP"}
      cost_gbp: {type: float, required: true, desc: "Unit cost in GBP"}
      stock_on_hand: {type: int, required: true, desc: "Units of stock to clear"}
    sql: |
      SELECT 'markdown 50% off' AS option,
             round($current_price_gbp * 0.5, 2) AS option_price_gbp,
             round(($current_price_gbp * 0.5 - $cost_gbp) / ($current_price_gbp * 0.5) * 100, 1) AS margin_pct,
             round($stock_on_hand * 0.7, 0) AS expected_units_recovered
      UNION ALL
      SELECT 'outlet 70% off', round($current_price_gbp * 0.3, 2), round(($current_price_gbp * 0.3 - $cost_gbp) / ($current_price_gbp * 0.3) * 100, 1), round($stock_on_hand * 0.6, 0)
      UNION ALL
      SELECT 'liquidate 85% off', round($current_price_gbp * 0.15, 2), round(($current_price_gbp * 0.15 - $cost_gbp) / ($current_price_gbp * 0.15) * 100, 1), round($stock_on_hand * 0.95, 0)
      UNION ALL
      SELECT 'bundle 40% off', round($current_price_gbp * 0.6, 2), round(($current_price_gbp * 0.6 - $cost_gbp) / ($current_price_gbp * 0.6) * 100, 1), round($stock_on_hand * 0.8, 0)
      ORDER BY expected_units_recovered DESC
    example: {sku: "K-1700", current_price_gbp: 35.0, cost_gbp: 15.0, stock_on_hand: 500}

  - name: calculate_earlier_markdown_impact
    desc: Calculate impact on margin and sell-through if markdown depth or timing changes.
    kind: sql
    args:
      sku: {required: true}
      current_markdown_depth_pct: {type: float, required: true, desc: "Current markdown depth %"}
      earlier_markdown_depth_pct: {type: float, required: true, desc: "Proposed earlier markdown depth %"}
      weeks_earlier: {type: int, default: 2, desc: "How many weeks earlier to apply"}
    sql: |
      SELECT round($current_markdown_depth_pct, 1) AS current_depth_pct,
             round($earlier_markdown_depth_pct, 1) AS earlier_depth_pct,
             'Earlier markdown typically increases sell-through by 15-25%' AS impact_on_sellthrough,
             'Margin impact depends on cost basis and timing' AS margin_impact,
             'Recommend earlier action if turnover risk high' AS recommendation
    example: {sku: "SKU-101904", current_markdown_depth_pct: 30, earlier_markdown_depth_pct: 40, weeks_earlier: 2}

  - name: calculate_markdown_cost_projection
    desc: Project total markdown cost for a line based on current sell-through, stock and elasticity.
    kind: sql
    args:
      sku: {required: true}
      current_price_gbp: {type: float, required: true, desc: "Current price in GBP"}
      cost_gbp: {type: float, required: true, desc: "Unit cost in GBP"}
      stock_on_hand: {type: int, required: true, desc: "Current stock units"}
      weekly_baseline_units: {type: int, required: true, desc: "Expected weekly sales"}
    sql: |
      SELECT $sku AS sku,
             round(CAST($stock_on_hand AS FLOAT) / $weekly_baseline_units, 1) AS weeks_of_stock_at_baseline,
             round($current_price_gbp - $cost_gbp, 2) AS current_margin_gbp,
             round(($current_price_gbp - $cost_gbp) * $stock_on_hand, 2) AS full_margin_if_all_sold_gbp,
             round(($current_price_gbp * 0.7 - $cost_gbp) * $stock_on_hand * 0.8, 2) AS projected_margin_at_30pct_markdown_gbp,
             'Projection assumes 30% markdown and 80% sell-through' AS basis
    example: {sku: "SKU-103164", current_price_gbp: 45.0, cost_gbp: 18.0, stock_on_hand: 1200, weekly_baseline_units: 150}

  - name: calculate_markdown_depth_scenario
    desc: Model sell-through, margin and clearance time at different markdown depths for a product.
    kind: sql
    args:
      sku: {required: true}
      current_price_gbp: {type: float, required: true, desc: "Current price in GBP"}
      cost_gbp: {type: float, required: true, desc: "Unit cost in GBP"}
      elasticity_to_price: {type: float, default: -1.5, desc: "Price elasticity estimate"}
    sql: |
      SELECT '20% markdown' AS scenario,
             round($current_price_gbp * 0.8, 2) AS price_gbp,
             round(100 * POWER(0.8, $elasticity_to_price), 0) AS volume_index,
             round(($current_price_gbp * 0.8 - $cost_gbp) / ($current_price_gbp * 0.8), 3) AS margin_pct,
             '6-8 weeks' AS clearance_time
      UNION ALL
      SELECT '40% markdown', round($current_price_gbp * 0.6, 2), round(100 * POWER(0.6, $elasticity_to_price), 0),
             round(($current_price_gbp * 0.6 - $cost_gbp) / ($current_price_gbp * 0.6), 3), '3-4 weeks'
      ORDER BY scenario
    example: {sku: "SKU-101904", current_price_gbp: 65.0, cost_gbp: 22.0, elasticity_to_price: -1.5}

  - name: calculate_markdown_sell_through_scenario
    desc: Project sell-through percentage at different markdown depths for a product.
    kind: sql
    args:
      sku: {required: true}
      elasticity_to_price: {type: float, default: -1.5}
    sql: |
      SELECT '10% markdown' AS scenario, 91 AS expected_sell_through_pct, '12 weeks' AS time_to_clear
      UNION ALL
      SELECT '20% markdown', 74, '8 weeks'
      UNION ALL
      SELECT '30% markdown', 56, '5 weeks'
      UNION ALL
      SELECT '40% markdown', 38, '3 weeks'
      ORDER BY scenario
    example: {sku: "SKU-101904", elasticity_to_price: -1.5}

  - name: calculate_price_increase_to_offset_cost
    desc: Calculate price increase needed to offset a cost increase and maintain margin.
    kind: sql
    args:
      current_price_gbp: {type: float, required: true, desc: "Current price in GBP"}
      cost_increase_gbp: {type: float, required: true, desc: "Cost increase in GBP"}
      elasticity_to_price: {type: float, default: -1.2, desc: "Price elasticity estimate"}
    sql: |
      SELECT round($current_price_gbp, 2) AS current_price_gbp,
             round($cost_increase_gbp, 2) AS cost_increase_gbp,
             round(($cost_increase_gbp / $current_price_gbp) * 100, 1) AS cost_as_pct_of_price,
             round(($cost_increase_gbp * (1 + ABS($elasticity_to_price) * 0.125)), 2) AS total_increase_needed_to_offset_gbp,
             round($current_price_gbp + ($cost_increase_gbp * (1 + ABS($elasticity_to_price) * 0.125)), 2) AS recommended_new_price_gbp,
             'Required price increase to offset cost increase by ' || round($cost_increase_gbp, 2) || ' GBP' AS offset_recommendation
      FROM (SELECT 1) t
    example: {current_price_gbp: 35.0, cost_increase_gbp: 4.0, elasticity_to_price: -1.2}

  - name: calculate_price_test_sample_size
    desc: Calculate minimum test and control sample sizes for statistically significant price test.
    kind: sql
    args:
      expected_uplift_pct: {type: float, required: true, desc: "Expected sales change %, e.g. -15 for 15% drop"}
      confidence_level_pct: {type: float, default: 95, desc: "Confidence level, typically 90-99"}
      baseline_daily_sales_units: {type: int, required: true, desc: "Daily sales baseline units"}
    sql: |
      SELECT round(CAST($baseline_daily_sales_units AS FLOAT) * 7 * 8, 0) AS units_per_cell_per_8_weeks,
             'test + control' AS allocation,
             round(CAST($baseline_daily_sales_units AS FLOAT) * 7 * 8 * 2, 0) AS total_units_for_8_week_test,
             round(CAST($baseline_daily_sales_units AS FLOAT) * 7 * 4, 0) AS units_per_cell_per_4_weeks,
             CASE WHEN ABS($expected_uplift_pct) < 5 THEN 'Large sample - 10-12 weeks needed'
                  WHEN ABS($expected_uplift_pct) < 15 THEN 'Medium sample - 6-8 weeks needed'
                  ELSE 'Small sample - 4 weeks adequate' END AS recommended_duration
    example: {expected_uplift_pct: -15, baseline_daily_sales_units: 180, confidence_level_pct: 95}

  - name: calculate_promotion_roi_ranking
    desc: Rank promotions by ROI (margin return per promotion investment).
    kind: sql
    args:
      lookback_days: {type: int, default: 90, desc: "Days of history to include"}
    sql: |
      SELECT promotion_id, category,
             round(actual_margin_gbp, 2) AS actual_margin_gbp,
             round(planned_margin_gbp, 2) AS planned_margin_gbp,
             round(CASE WHEN planned_margin_gbp > 0 THEN (actual_margin_gbp / planned_margin_gbp - 1) * 100 ELSE NULL END, 1) AS vs_plan_pct,
             round(actual_uplift_pct, 1) AS actual_uplift_pct,
             'ROI = margin generated / investment cost' AS formula
      FROM promotions
      WHERE status IN ('completed', 'cancelled')
        AND end_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_days AS INT)) DAY
      ORDER BY actual_margin_gbp DESC
      LIMIT 20
    example: {lookback_days: 90}

  - name: calculate_sales_lost_to_price_gaps
    desc: Estimate sales lost due to price gaps versus competitors in key categories.
    kind: sql
    args:
      category: {required: true}
      price_gap_pct: {type: float, required: true, desc: "Our price gap vs competitor %"}
      elasticity_to_price: {type: float, default: -1.5}
    sql: |
      SELECT $category AS category,
             round($price_gap_pct, 1) AS our_price_premium_pct,
             round($elasticity_to_price, 2) AS elasticity_to_price,
             round(ABS($elasticity_to_price * $price_gap_pct), 1) AS estimated_volume_loss_pct,
             'Volume lost = elasticity * price gap' AS formula
    example: {category: kitchenware, price_gap_pct: 8.5, elasticity_to_price: -1.5}

  - name: cancel_promotion
    desc: Cancel a scheduled or planned promotion and release stock commitments.
    kind: update
    table: promotions
    set: {status: cancelled, updated_at: "$as_of"}
    args:
      cancel_reason: {required: true}
    example: {promotion_id: PROMO-900001, cancel_reason: "Insufficient stock due to supply delay"}

  - name: cancel_scheduled_price_change
    desc: Cancel a scheduled price change before it takes effect.
    kind: update
    table: price_changes
    set: {status: cancelled, updated_at: "$as_of"}
    args:
      cancel_reason: {required: true, desc: "Reason for cancellation"}
    example: {pc_id: PC-900001, cancel_reason: "Competitive pressure eased"}

  - name: compare_clearance_options
    desc: Compare recovery margin % and time to clear for different clearance strategies.
    kind: select
    from: markdown_events
    filters:
      category: {op: like}
      status: {}
    columns: [markdown_id, sku, category, markdown_depth_pct, status, units_sold, margin_gbp]
    limit: 10
    example: {category: apparel, status: completed}

  - name: compare_markdown_scenarios
    desc: Compare sell-through, margin and timing outcomes for different markdown depths.
    kind: sql
    args:
      sku: {required: true}
      scenario_a_depth_pct: {type: float, required: true, desc: "First markdown depth %"}
      scenario_b_depth_pct: {type: float, required: true, desc: "Second markdown depth %"}
    sql: |
      SELECT 'Scenario A: ' || $scenario_a_depth_pct || '% markdown' AS scenario,
             round((100 - $scenario_a_depth_pct) * 70, 0) AS units_sold,
             round((100 - $scenario_a_depth_pct) * 70 * (100 - $scenario_a_depth_pct) / 100, 0) AS margin_gbp,
             '5-6 weeks' AS time_to_clear
      UNION ALL
      SELECT 'Scenario B: ' || $scenario_b_depth_pct || '% markdown',
             round((100 - $scenario_b_depth_pct) * 85, 0),
             round((100 - $scenario_b_depth_pct) * 85 * (100 - $scenario_b_depth_pct) / 100, 0),
             '3-4 weeks'
      ORDER BY margin_gbp DESC
    example: {sku: "SKU-101904", scenario_a_depth_pct: 20, scenario_b_depth_pct: 40}

  - name: compare_promotion_with_past_events
    desc: Compare planned promotion to past similar events on sales uplift, margin and timing.
    kind: sql
    args:
      category: {required: true}
      planned_discount_pct: {type: float, required: true, desc: "Discount % of planned promotion"}
    sql: |
      SELECT category, promotion_type, discount_depth_pct,
             round(actual_uplift_pct, 1) AS past_uplift_pct,
             round(actual_margin_gbp, 2) AS past_margin_gbp,
             status, end_date
      FROM promotions
      WHERE category = $category
        AND status IN ('completed', 'cancelled')
        AND ABS(discount_depth_pct - $planned_discount_pct) < 5
      ORDER BY end_date DESC
      LIMIT 5
    example: {category: kitchenware, planned_discount_pct: 25}

  - name: create_markdown_event
    desc: Create a scheduled markdown event for selected SKUs.
    kind: insert
    table: markdown_events
    id_prefix: MDE-
    defaults: {status: draft}
    args:
      sku: {required: true}
      category: {required: true}
      markdown_depth_pct: {required: true}
      start_date: {type: date, required: true}
      end_date: {type: date, required: true}
      original_price_gbp: {required: true, type: float}
      cost_gbp: {required: true, type: float}
    example: {sku: "SKU-101904", category: "apparel", markdown_depth_pct: 40, start_date: "+14d", end_date: "+42d", original_price_gbp: 65.0, cost_gbp: 22.0}

  - name: create_markdown_review_request
    desc: Request pricing team to review markdown options for category or line.
    kind: insert
    table: markdown_events
    id_prefix: MDE-
    defaults: {status: draft, markdown_depth_pct: 0}
    args:
      category: {required: true}
      sku: {desc: "SKU if line-level, blank for category"}
      review_reason: {required: true, desc: "Reason for review request"}
      original_price_gbp: {type: float, desc: "Current price in GBP"}
      cost_gbp: {type: float, desc: "Unit cost in GBP"}
    example: {category: "apparel", review_reason: "End-of-season stock clearance", original_price_gbp: 45.0, cost_gbp: 15.0}

  - name: create_price_change_request
    desc: Create a draft price change request for products.
    kind: insert
    table: price_changes
    id_prefix: PC-
    defaults: {status: draft}
    args:
      sku: {required: true}
      category: {required: true}
      new_price_gbp: {required: true, type: float}
      change_reason: {required: true}
      proposed_date: {type: date}
    example: {sku: "K-1700", category: "kitchenware", new_price_gbp: 38.50, change_reason: "Cost increase passthrough"}

  - name: create_price_test
    desc: Create a price test with test and control cells.
    kind: insert
    table: price_tests
    id_prefix: PT-
    defaults: {status: planned}
    args:
      sku: {required: true}
      test_price_gbp: {required: true, type: float}
      control_price_gbp: {required: true, type: float}
      test_store_count: {type: int, required: true}
      control_store_count: {type: int, required: true}
      start_date: {type: date, required: true}
      end_date: {type: date, required: true}
    example: {sku: "PF-220", test_price_gbp: 32.0, control_price_gbp: 28.0, test_store_count: 10, control_store_count: 10, start_date: "+7d", end_date: "+49d"}

  - name: create_scheduled_price_change
    desc: Schedule an approved price change to take effect on a date. Moves from approved status to scheduled.
    kind: update
    table: price_changes
    set: {status: scheduled, effective_date: "{proposed_date}"}
    args:
      proposed_date: {type: date, required: true}
    example: {pc_id: PC-900001, proposed_date: "+7d"}

  - name: delete_draft_markdown_event
    desc: Delete a draft markdown event that has not gone live yet.
    kind: update
    table: markdown_events
    set: {status: cancelled, updated_at: "$as_of"}
    args:
      review_reason: {desc: "Reason for deletion"}
    example: {markdown_id: MDE-900001, review_reason: "Forecast revised, markdown no longer needed"}

  - name: delete_draft_price_for_product
    desc: Delete an unapproved draft price change for a product.
    kind: update
    table: price_changes
    set: {status: cancelled, cancel_reason: "Deleted by user", updated_at: "$as_of"}
    args: {}
    example: {pc_id: PC-900001}

  - name: delete_draft_promotion
    desc: Delete a promotion that is still in draft status.
    kind: update
    table: promotions
    set: {status: cancelled, cancel_reason: "Deleted by user", updated_at: "$as_of"}
    args: {}
    example: {promotion_id: PROMO-900001}

  - name: get_cannibalisation_estimate
    desc: Estimate sales cannibalisation (lost full-price sales) from a planned promotion or markdown.
    kind: sql
    args:
      category: {required: true}
      promotion_depth_pct: {type: float, default: 25, desc: "Discount or markdown depth %"}
    sql: |
      SELECT $category AS category,
             round($promotion_depth_pct, 1) AS discount_depth_pct,
             'Cannibalisation rate typically 30-50% of incremental volume for similar products' AS cannibalisation_assumption,
             round($promotion_depth_pct * 0.4, 1) AS estimated_cannibalisation_pct_of_incremental,
             'Avoid heavy promotional overlap in related SKUs to minimise cannibalisation' AS recommendation
    example: {category: kitchenware, promotion_depth_pct: 25}

  - name: get_discounting_depth_for_category
    desc: Get average markdown depth and frequency trends by category. Use for understanding category markdown policies.
    kind: sql
    args:
      category: {required: true}
      lookback_weeks: {type: int, default: 26, desc: "Weeks of history"}
    sql: |
      SELECT $category AS category,
             round(AVG(markdown_depth_pct), 1) AS avg_markdown_depth_pct,
             round(MAX(markdown_depth_pct), 1) AS max_markdown_depth_pct,
             round(MIN(markdown_depth_pct), 1) AS min_markdown_depth_pct,
             count(*) AS markdown_events_in_period
      FROM markdown_events
      WHERE category = $category
        AND end_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks AS INT) WEEK)
    example: {category: apparel, lookback_weeks: 26}

  - name: get_elasticity_confidence_for_category
    desc: Retrieve 95% confidence interval width for price elasticity estimate for a category.
    kind: sql
    args:
      category: {required: true}
      measure_date: {type: date, desc: "Date of measurement", default: "-30d"}
    sql: |
      SELECT category,
             round(elasticity_to_price, 2) AS elasticity_to_price,
             round(elasticity_confidence_interval, 3) AS confidence_interval_95pct,
             data_points,
             'Narrow CI = high confidence in elasticity; wide CI = estimate with caution' AS interpretation
      FROM elasticity_data
      WHERE category = $category
        AND measure_date <= CAST($measure_date AS DATE)
      ORDER BY measure_date DESC
      LIMIT 1
    example: {category: apparel}

  - name: get_elasticity_confidence_intervals
    desc: Get elasticity estimates with confidence intervals for all categories. Use for identifying high/low confidence estimates.
    kind: sql
    args:
      min_confidence_pct: {type: float, default: 50, desc: "Minimum data points as % of best estimate"}
    sql: |
      SELECT category,
             round(elasticity_to_price, 2) AS elasticity_to_price,
             round(elasticity_confidence_interval, 3) AS confidence_interval_95pct,
             data_points,
             round(elasticity_to_price - elasticity_confidence_interval, 2) AS lower_bound,
             round(elasticity_to_price + elasticity_confidence_interval, 2) AS upper_bound
      FROM elasticity_data
      WHERE measure_date >= CAST($as_of AS DATE) - INTERVAL 180 DAY
      ORDER BY ABS(elasticity_confidence_interval) ASC
    example: {}

  - name: get_full_price_cannibalisation_estimate
    desc: Estimate total sales lost from full-price SKUs when related items are marked down.
    kind: sql
    args:
      category: {required: true}
      markdown_depth_pct: {type: float, required: true, desc: "Planned markdown depth %"}
    sql: |
      SELECT $category AS category,
             round($markdown_depth_pct, 1) AS markdown_depth_pct,
             'Cannibalisation estimated at 35-50% of incremental volume for most categories' AS model_basis,
             round($markdown_depth_pct * 0.45, 1) AS full_price_sales_loss_pct_of_incremental,
             'Higher depth = higher cannibalisation; test on similar SKUs first' AS recommendation
    example: {category: home, markdown_depth_pct: 40}

  - name: get_markdown_performance_for_product
    desc: Get actual performance (sell-through, margin achieved, duration) for a product's recent markdown events.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT md.markdown_id, md.sku, md.category,
             round(md.markdown_depth_pct, 1) AS markdown_depth_pct,
             md.start_date, md.end_date, md.status,
             md.stock_at_start, md.units_sold,
             CASE WHEN md.stock_at_start > 0 THEN round(md.units_sold * 100 / md.stock_at_start, 1) ELSE 0 END AS sell_through_pct,
             round(md.margin_gbp, 2) AS total_margin_gbp,
             round(CAST(md.units_sold AS FLOAT) / NULLIF((md.end_date - md.start_date), 0), 1) AS units_per_day
      FROM markdown_events md
      WHERE md.sku = $sku
      ORDER BY md.end_date DESC
      LIMIT 10
    example: {sku: "SKU-101904"}

  - name: get_markdown_rate_by_category
    desc: Get current markdown rate (% of sales from marked-down products) by category.
    kind: sql
    args:
      category: {required: true}
    sql: |
      SELECT md.category,
             count(DISTINCT md.markdown_id) AS active_markdown_events,
             round(AVG(md.markdown_depth_pct), 1) AS avg_depth_pct,
             round(SUM(md.units_sold), 0) AS total_units_cleared,
             round(SUM(md.margin_gbp), 2) AS total_margin_gbp,
             'Markdown rate = % of category sales from promotional markdowns' AS metric_definition
      FROM markdown_events md
      WHERE md.category = $category
        AND md.status IN ('active', 'completed')
        AND md.end_date >= CAST($as_of AS DATE) - INTERVAL 90 DAY
      GROUP BY md.category
    example: {category: apparel}

  - name: get_markdown_spend_by_category
    desc: Total margin impact from markdown events (margin foregone) by category over a period.
    kind: sql
    args:
      category: {required: true}
      lookback_weeks: {type: int, default: 26, desc: "Weeks of history"}
    sql: |
      SELECT md.category,
             count(*) AS markdown_events,
             round(SUM(md.stock_at_start * md.original_price_gbp), 2) AS value_of_markdown_stock_gbp,
             round(SUM((md.original_price_gbp - md.markdown_price_gbp) * md.units_sold), 2) AS markdown_discount_cost_gbp,
             round(SUM(md.margin_gbp), 2) AS realized_margin_gbp,
             'Markdown cost = (full price - markdown price) * units sold' AS calculation
      FROM markdown_events md
      WHERE md.category = $category
        AND md.end_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks AS INT) WEEK)
      GROUP BY md.category
    example: {category: apparel, lookback_weeks: 26}

  - name: get_our_black_friday_results_last_year
    desc: Retrieve results of our last Black Friday promotion for benchmarking and planning next year.
    kind: sql
    args: {}
    sql: |
      SELECT p.promotion_id, p.category,
             p.discount_depth_pct, p.start_date, p.end_date,
             round(p.planned_uplift_pct, 1) AS planned_uplift_pct,
             round(p.actual_uplift_pct, 1) AS actual_uplift_pct,
             round(p.planned_margin_gbp, 2) AS planned_margin_gbp,
             round(p.actual_margin_gbp, 2) AS actual_margin_gbp,
             'Black Friday 2025 results' AS event
      FROM promotions p
      WHERE (p.start_date >= CAST($as_of AS DATE) - INTERVAL 365 DAY
        AND p.start_date <= CAST($as_of AS DATE))
        AND (p.promotion_type = 'percentage_discount' OR EXTRACT(MONTH FROM p.start_date) = 11)
      ORDER BY p.start_date DESC
      LIMIT 5
    example: {}

  - name: get_our_markdown_depth_and_timing
    desc: Compare our current markdown depth and timing to historical patterns by category.
    kind: sql
    args:
      category: {required: true}
    sql: |
      SELECT md.category,
             'Current' AS period,
             round(AVG(md.markdown_depth_pct), 1) AS avg_markdown_depth_pct,
             'weeks' AS timing_unit,
             round(AVG(CAST((md.end_date - md.start_date) AS NUMERIC) / 7), 1) AS avg_duration_weeks,
             count(*) AS number_of_events
      FROM markdown_events md
      WHERE md.category = $category
        AND md.end_date >= CAST($as_of AS DATE) - INTERVAL 90 DAY
        AND md.status IN ('active', 'completed')
      GROUP BY md.category
    example: {category: apparel}

  - name: get_own_product_prices_and_quality_scores
    desc: Get our current prices, costs and quality positioning for products in a category for competitive analysis.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. kitchenware"}
    sql: |
      SELECT p.sku, p.style_id, p.name,
             round(CASE WHEN pc.new_price_gbp IS NOT NULL THEN pc.new_price_gbp ELSE pc.old_price_gbp END, 2) AS current_price_gbp,
             'Quality score: 4/5' AS quality_position,
             'Target position: mid-market' AS strategic_position,
             pc.created_at AS price_set_date
      FROM master.products p
      LEFT JOIN price_changes pc ON pc.sku = p.sku AND pc.status = 'active'
      WHERE p.category = $category
      ORDER BY p.sku
      LIMIT 50
    example: {category: kitchenware}

  - name: get_post_promotion_dip_for_category
    desc: Estimate post-promotion sales dip (customer wait behaviour) after a promotion ends.
    kind: sql
    args:
      category: {required: true}
      promotion_depth_pct: {type: float, default: 25, desc: "Promotion discount %"}
    sql: |
      SELECT $category AS category,
             round($promotion_depth_pct, 1) AS promotion_depth_pct,
             'Post-promo dip typically 15-30% below baseline for 2-3 weeks after end' AS historical_pattern,
             round($promotion_depth_pct * 0.5, 1) AS estimated_post_promo_dip_pct,
             'Higher dips for regular promoters; run longer gaps between events' AS recommendation
    example: {category: kitchenware, promotion_depth_pct: 25}

  - name: get_price_change_history_for_sku
    desc: Return all price changes (draft, approved, active, rolled back) for a specific SKU with reasons.
    kind: sql
    args:
      sku: {required: true}
    sql: |
      SELECT pc.pc_id, pc.sku, pc.category,
             round(pc.old_price_gbp, 2) AS old_price_gbp,
             round(pc.new_price_gbp, 2) AS new_price_gbp,
             round(pc.price_change_pct, 1) AS price_change_pct,
             pc.change_reason, pc.status,
             pc.proposed_date, pc.effective_date, pc.created_at
      FROM price_changes pc
      WHERE pc.sku = $sku
      ORDER BY pc.created_at DESC
      LIMIT 20
    example: {sku: "K-1700"}

  - name: get_price_changes_for_category
    desc: Get all price changes (past and pending) for a category, with effective dates and reasons.
    kind: sql
    args:
      category: {required: true}
      lookback_weeks: {type: int, default: 26, desc: "Weeks of history"}
    sql: |
      SELECT pc.pc_id, pc.sku, pc.category,
             round(pc.old_price_gbp, 2) AS old_price_gbp,
             round(pc.new_price_gbp, 2) AS new_price_gbp,
             round(pc.price_change_pct, 1) AS price_change_pct,
             pc.change_reason, pc.status, pc.effective_date
      FROM price_changes pc
      WHERE pc.category = $category
        AND pc.created_at >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks AS INT) WEEK)
      ORDER BY pc.effective_date DESC, pc.created_at DESC
      LIMIT 30
    example: {category: apparel}

  - name: get_price_elasticity_for_category
    desc: Get price elasticity of demand for a category. Use to model volume impact of price changes.
    kind: sql
    args:
      category: {required: true}
    sql: |
      SELECT category,
             round(elasticity_to_price, 2) AS elasticity_to_price,
             round(elasticity_confidence_interval, 3) AS confidence_interval_95pct,
             data_points,
             'Elasticity < -1 = elastic (% price up > % volume down); > -1 = inelastic' AS interpretation,
             'Last updated: ' || last_updated AS data_freshness
      FROM elasticity_data
      WHERE category = $category
      ORDER BY measure_date DESC
      LIMIT 1
    example: {category: kitchenware}
