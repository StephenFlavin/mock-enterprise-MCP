id: pricing
name: Pricing & Promotion Engine
instructions: >
  Pricing strategy, promotions, markdowns and elasticity. Categories and SKUs are master data (category e.g. Cookware,
  Outerwear, Knitwear; kitchenware = Cookware, denim = Trousers). Ids: price change PC-000123, promotion PROMO-000123,
  markdown event MDE-000123, markdown review request MRR-000123.

tables:
  promotions:
    key: promotion_id
    cols:
      promotion_id: {type: str, desc: "Promotion, e.g. PROMO-000123"}
      event_name: {type: str, desc: "Event name if any, e.g. Denim Days"}
      category: {type: str, desc: "Category being promoted (master category), e.g. Cookware"}
      department: {type: str, desc: "Department if the promotion covers only part of the category, blank for all"}
      promotion_type: {type: enum, values: [percentage_discount, fixed_discount, bundle, bogo, other], desc: "Type of promotion"}
      discount_depth_pct: {type: float, desc: "Discount percentage"}
      start_date: {type: date, desc: "Promotion start date"}
      end_date: {type: date, desc: "Promotion end date"}
      status: {type: enum, values: [draft, scheduled, active, completed, cancelled], desc: "Promotion status"}
      planned_uplift_pct: {type: float, desc: "Planned sales uplift %"}
      planned_margin_gbp: {type: float, desc: "Planned contribution margin in GBP"}
      actual_uplift_pct: {type: float, desc: "Actual uplift achieved %"}
      actual_margin_gbp: {type: float, desc: "Actual contribution margin in GBP"}
      supplier_funded_pct: {type: float, desc: "Percent funded by supplier"}
      cannibalisation_pct: {type: float, desc: "Share of the uplift taken from other lines or full-price sales, %"}
      post_promo_dip_pct: {type: float, desc: "Sales dip below baseline after the promotion ended, %"}
      post_promo_dip_weeks: {type: int, desc: "Weeks the post-promotion dip lasted"}
      created_at: {type: timestamp, desc: "When created"}
      updated_at: {type: timestamp, desc: "Last updated"}
      cancel_reason: {type: str, desc: "Reason if cancelled"}

  markdown_events:
    key: markdown_id
    cols:
      markdown_id: {type: str, desc: "Markdown event, e.g. MDE-000123"}
      sku: {desc: "SKU being marked down"}
      markdown_depth_pct: {type: float, desc: "Markdown percentage off the original price"}
      start_date: {type: date, desc: "Markdown start date"}
      end_date: {type: date, desc: "Markdown end date"}
      status: {type: enum, values: [draft, scheduled, active, completed, cancelled], desc: "Markdown status"}
      stock_at_start: {type: int, desc: "Stock on hand at markdown start"}
      units_sold: {type: int, desc: "Units sold during markdown so far"}
      original_price_gbp: {type: float, desc: "Full price before markdown in GBP"}
      review_reason: {type: str, desc: "Reason for review or deletion if any"}
      created_at: {type: timestamp, desc: "When created"}
      updated_at: {type: timestamp, desc: "Last updated"}

  markdown_history:
    key: [markdown_id, history_date]
    cols:
      markdown_id: {type: str, desc: "Markdown event, e.g. MDE-000123"}
      history_date: {type: date, desc: "Start of the week observed"}
      weekly_units_sold: {type: int, desc: "Units sold that week at the markdown price"}
      weekly_revenue_gbp: {type: float, desc: "Revenue that week"}
      remaining_stock: {type: int, desc: "Stock left at the end of the week"}

  markdown_review_requests:
    key: request_id
    cols:
      request_id: {type: str, desc: "Review request, e.g. MRR-000123"}
      category: {type: str, desc: "Master category to review, e.g. Bedding"}
      department: {type: str, desc: "Department if only part of the category"}
      sku: {desc: "SKU if the review is for one line"}
      review_reason: {type: str, desc: "Why a review is requested"}
      status: {type: enum, values: [open, in_review, actioned, closed], desc: "Request status"}
      created_at: {type: timestamp, desc: "When requested"}

  price_changes:
    key: pc_id
    cols:
      pc_id: {type: str, desc: "Price change request, e.g. PC-000123"}
      sku: {desc: "SKU affected"}
      old_price_gbp: {type: float, desc: "Previous price in GBP"}
      new_price_gbp: {type: float, desc: "New price in GBP"}
      change_reason: {type: str, desc: "Reason for change"}
      status: {type: enum, values: [draft, submitted, approved, scheduled, active, rolled_back, cancelled], desc: "Change status"}
      cancel_reason: {type: str, desc: "Reason if cancelled"}
      proposed_date: {type: date, desc: "Proposed effective date"}
      effective_date: {type: date, desc: "Actual effective date"}
      created_at: {type: timestamp, desc: "When created"}
      updated_at: {type: timestamp, desc: "Last updated"}
      rolled_back_at: {type: timestamp, desc: "When rolled back if applicable"}

  price_tests:
    key: test_id
    cols:
      test_id: {type: str, desc: "Price test, e.g. PT-000123"}
      sku: {desc: "SKU being tested"}
      test_price_gbp: {type: float, desc: "Test price in GBP"}
      control_price_gbp: {type: float, desc: "Control price in GBP"}
      test_store_count: {type: int, desc: "Number of stores in test cell"}
      control_store_count: {type: int, desc: "Number of stores in control cell"}
      start_date: {type: date, desc: "Test start date"}
      end_date: {type: date, desc: "Test end date"}
      status: {type: enum, values: [planned, active, completed, cancelled], desc: "Test status"}
      test_volume: {type: int, desc: "Volume sold in test cell"}
      control_volume: {type: int, desc: "Volume sold in control cell"}
      elasticity_estimate: {type: float, desc: "Estimated elasticity from test"}
      created_at: {type: timestamp, desc: "When created"}

  elasticity_data:
    key: elasticity_id
    cols:
      elasticity_id: {type: str, desc: "Measurement, e.g. EL-000123"}
      category: {type: str, desc: "Master category, e.g. Outerwear"}
      sku: {desc: "SKU if product-level elasticity, blank for the category estimate"}
      measure_date: {type: date, desc: "Date of measurement"}
      elasticity_to_price: {type: float, desc: "Price elasticity of demand (negative)"}
      elasticity_to_income: {type: float, desc: "Income elasticity of demand (positive = normal good)"}
      elasticity_confidence_interval: {type: float, desc: "95% CI range +/-"}
      data_points: {type: int, desc: "Number of observations"}
      last_updated: {type: timestamp, desc: "When last calculated"}

  promotion_history:
    key: [promotion_id, history_date]
    cols:
      promotion_id: {type: str, desc: "Reference to promotion"}
      history_date: {type: date, desc: "Date of observation"}
      daily_sales_gbp: {type: float, desc: "Daily sales during promotion"}
      units_sold: {type: int, desc: "Units sold"}
      baseline_daily_sales_gbp: {type: float, desc: "Expected sales without promo"}
      uplift_gbp: {type: float, desc: "Sales uplift vs baseline"}
      margin_gbp: {type: float, desc: "Contribution margin"}
      stock_outs: {type: int, desc: "Number of stock-outs"}

  price_positioning:
    key: category
    cols:
      category: {type: str, desc: "Master category, e.g. Cookware"}
      title: {type: str, desc: "Category with everyday names, e.g. Cookware (kitchenware, pans)"}
      target_position: {type: enum, values: [premium, mid_market, value], desc: "Pricing position"}
      min_price_index: {type: float, desc: "Lowest allowed price as index to the category median price"}
      max_price_index: {type: float, desc: "Highest allowed price as index to the category median price"}
      markdown_policy_min_depth_pct: {type: float, desc: "Minimum markdown allowed"}
      markdown_policy_max_depth_pct: {type: float, desc: "Maximum markdown allowed"}
      full_price_cannibalisation_pct_per_10pts: {type: float, desc: "Full-price sales lost on similar items per 10 points of markdown depth, %"}
      updated_at: {type: timestamp, desc: "Policy last updated"}

  clearance_options:
    key: [category, option]
    cols:
      category: {type: str, desc: "Master category, e.g. Footwear"}
      option: {type: enum, values: [markdown, outlet, bundle, donate, liquidate], desc: "Clearance route"}
      recovery_pct_of_price: {type: float, desc: "Average selling price as % of current full price"}
      sell_through_pct: {type: float, desc: "Share of the stock the route clears, %"}
      weeks_to_clear: {type: int, desc: "Typical weeks to clear"}
      best_channel: {type: str, desc: "Channel that suits the route"}
      handling_cost_per_unit_gbp: {type: float, desc: "Handling cost per unit in GBP"}
      fp_cannibalisation_pct: {type: float, desc: "Full-price sales lost on similar items, %"}

  promotion_calendar:
    key: [site_id, start_date]
    cols:
      promotion_id: {type: str, desc: "Promotion id"}
      site_id: {desc: "Store or DC"}
      start_date: {type: date, desc: "Promotion start"}
      end_date: {type: date, desc: "Promotion end"}
      category: {type: str, desc: "Category being promoted"}
      promotion_type: {type: str, desc: "Type of promotion"}

  product_quality:
    key: [sku, scored_at]
    cols:
      sku: {desc: "SKU the quality score is for"}
      quality_score: {type: float, desc: "Quality score out of 5, from reviews, returns and test results"}
      quality_tier: {type: enum, values: [high, standard, basic], desc: "Quality tier from the score"}
      scored_at: {type: date, desc: "When the score was last updated"}

tools:
  - name: calculate_category_demand_elasticity_to_income
    desc: Income elasticity of demand by category, with the demand change implied by an income shock, lowest elasticity (most resilient) first. Omit category to rank all.
    kind: sql
    args:
      category: {desc: "Category, e.g. Cookware (kitchenware) or Outerwear. Omit to rank every category"}
      income_change_pct: {type: float, default: -3, desc: "Assumed change in household real income %, e.g. -3"}
      lookback_weeks: {type: int, default: 52, desc: "Only use measurements newer than this many weeks"}
    sql: |
      WITH latest AS (
        SELECT category, elasticity_to_income, elasticity_confidence_interval, data_points, measure_date,
               row_number() OVER (PARTITION BY category ORDER BY measure_date DESC) AS rn
        FROM elasticity_data
        WHERE sku IS NULL
          AND measure_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_weeks * 7 AS INT)) DAY
          AND ($category IS NULL OR lower(category) = lower($category)))
      SELECT category,
             round(elasticity_to_income, 2) AS elasticity_to_income,
             round(elasticity_confidence_interval, 2) AS confidence_interval_95pct,
             data_points,
             round($income_change_pct, 1) AS income_change_pct,
             round(elasticity_to_income * $income_change_pct, 1) AS estimated_demand_change_pct,
             rank() OVER (ORDER BY elasticity_to_income) AS resilience_rank,
             'demand change % = income elasticity x income change %; rank 1 holds up best' AS formula
      FROM latest WHERE rn = 1
      ORDER BY elasticity_to_income
    limit: 40
    example: {category: Cookware}

  - name: calculate_clearance_option_recovery
    desc: Expected margin, units cleared and time for each clearance option (markdown, outlet, bundle, donate, liquidate) on stock of one SKU, best margin first.
    kind: sql
    args:
      sku: {required: true}
      stock_on_hand: {type: int, required: true, desc: "Units of stock to clear"}
      current_price_gbp: {type: float, desc: "Current full price in GBP. Defaults to the product retail price"}
      cost_gbp: {type: float, desc: "Unit cost in GBP. Defaults to the product unit cost"}
    sql: |
      WITH par AS (
        SELECT p.sku, p.name, p.category,
               COALESCE(CAST($current_price_gbp AS DOUBLE), p.retail_price_gbp) AS price,
               COALESCE(CAST($cost_gbp AS DOUBLE), p.unit_cost_gbp) AS cost
        FROM master.products p WHERE p.sku = $sku),
      opt AS (
        SELECT par.sku, par.name, par.category, o.option, o.best_channel, o.weeks_to_clear, o.fp_cannibalisation_pct,
               par.price * o.recovery_pct_of_price / 100 AS opt_price,
               par.cost + o.handling_cost_per_unit_gbp AS unit_cost_all_in,
               CAST($stock_on_hand AS DOUBLE) * o.sell_through_pct / 100 AS units
        FROM par JOIN clearance_options o ON lower(o.category) = lower(par.category))
      SELECT sku, option, best_channel AS channel,
             round(opt_price, 2) AS option_price_gbp,
             round(units) AS units_cleared,
             round(opt_price - unit_cost_all_in, 2) AS margin_per_unit_gbp,
             round(units * (opt_price - unit_cost_all_in), 2) AS expected_margin_gbp,
             round(100 * (opt_price - unit_cost_all_in) / NULLIF(opt_price, 0), 1) AS margin_pct,
             weeks_to_clear,
             fp_cannibalisation_pct AS full_price_sales_lost_on_similar_items_pct,
             'expected margin = units cleared x (option price - unit cost - handling)' AS formula
      FROM opt ORDER BY expected_margin_gbp DESC
    example: {sku: "SKU-104277", stock_on_hand: 2000}

  - name: calculate_earlier_markdown_impact
    desc: Compare closing stock, sell-through and margin over a 12-week season if a markdown starts some weeks earlier, versus the current plan.
    kind: sql
    args:
      sku: {required: true}
      stock_on_hand: {type: int, required: true, desc: "Units in stock now"}
      weekly_baseline_units: {type: int, required: true, desc: "Weekly units at full price"}
      current_markdown_depth_pct: {type: float, required: true, desc: "Planned markdown depth %"}
      earlier_markdown_depth_pct: {type: float, required: true, desc: "Depth % of the earlier markdown"}
      weeks_earlier: {type: int, default: 2, desc: "How many weeks earlier to start"}
      markdown_start_week: {type: int, default: 8, desc: "Season week the planned markdown starts, 1-12"}
    sql: |
      WITH par AS (
        SELECT p.sku, p.retail_price_gbp AS price, p.unit_cost_gbp AS cost,
               COALESCE((SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku = p.sku ORDER BY e.measure_date DESC LIMIT 1),
                        (SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku IS NULL AND e.category = p.category ORDER BY e.measure_date DESC LIMIT 1),
                        -1.5) AS el
        FROM master.products p WHERE p.sku = $sku),
      scn AS (
        SELECT 1 AS n, 'current plan' AS scenario, CAST($current_markdown_depth_pct AS DOUBLE) AS depth, CAST($markdown_start_week AS INT) AS start_wk
        UNION ALL
        SELECT 2, 'earlier markdown', CAST($earlier_markdown_depth_pct AS DOUBLE), greatest(1, CAST($markdown_start_week AS INT) - CAST($weeks_earlier AS INT))),
      wk AS (
        SELECT s.n, s.scenario, s.depth, s.start_wk, w, par.price, par.cost,
               CASE WHEN w >= s.start_wk THEN 1 - s.depth / 100 ELSE 1 END AS idx,
               CAST($weekly_baseline_units AS DOUBLE) * POWER(CASE WHEN w >= s.start_wk THEN 1 - s.depth / 100 ELSE 1 END, par.el) AS demand
        FROM scn s CROSS JOIN par CROSS JOIN range(1, 13) AS t(w)),
      sold AS (
        SELECT *, greatest(0, least(demand, CAST($stock_on_hand AS DOUBLE) - (sum(demand) OVER (PARTITION BY n ORDER BY w) - demand))) AS units
        FROM wk),
      agg AS (
        SELECT n, scenario, depth, start_wk, sum(units) AS units_sold, sum(units * price * idx) AS revenue, sum(units * cost) AS cogs
        FROM sold GROUP BY n, scenario, depth, start_wk)
      SELECT scenario, round(depth, 1) AS markdown_depth_pct, start_wk AS markdown_start_week,
             round(units_sold) AS units_sold_12_weeks,
             round(100 * units_sold / CAST($stock_on_hand AS DOUBLE), 1) AS sell_through_pct,
             round(CAST($stock_on_hand AS DOUBLE) - units_sold) AS closing_stock_units,
             round(revenue, 2) AS revenue_gbp,
             round(revenue - cogs, 2) AS margin_gbp,
             round((revenue - cogs) - max(CASE WHEN n = 1 THEN revenue - cogs END) OVER (), 2) AS margin_vs_current_plan_gbp,
             'demand = baseline x price index ^ elasticity, capped at stock; 12-week season' AS formula
      FROM agg ORDER BY n
    example: {sku: "SKU-103472", stock_on_hand: 2400, weekly_baseline_units: 150, current_markdown_depth_pct: 30, earlier_markdown_depth_pct: 20, weeks_earlier: 3}

  - name: calculate_markdown_cost_projection
    desc: Project units left at season end, markdown cost and closing stock for a line if current sell-through continues and leftovers are marked down.
    kind: sql
    args:
      sku: {required: true}
      stock_on_hand: {type: int, required: true, desc: "Units in stock now"}
      weekly_baseline_units: {type: int, required: true, desc: "Current weekly sales in units"}
      weeks_remaining: {type: int, default: 10, desc: "Selling weeks left in the season"}
      markdown_depth_pct: {type: float, desc: "Depth % for the clearance markdown. Defaults to the category average of completed markdowns"}
    sql: |
      WITH par AS (
        SELECT p.sku, p.name, p.category, p.retail_price_gbp AS price, p.unit_cost_gbp AS cost
        FROM master.products p WHERE p.sku = $sku),
      done AS (
        SELECT q.category, md.markdown_depth_pct AS depth, md.units_sold * 100.0 / md.stock_at_start AS st
        FROM markdown_events md JOIN master.products q ON q.sku = md.sku
        WHERE md.status = 'completed' AND md.stock_at_start > 0),
      dep AS (
        SELECT par.*, COALESCE(CAST($markdown_depth_pct AS DOUBLE), (SELECT avg(d.depth) FROM done d WHERE d.category = par.category), 30) AS depth
        FROM par),
      st AS (
        SELECT dep.*, COALESCE((SELECT avg(d.st) FROM done d WHERE d.category = dep.category AND abs(d.depth - dep.depth) <= 10),
                               (SELECT avg(d.st) FROM done d WHERE d.category = dep.category), 60) AS md_st,
               (SELECT count(*) FROM done d WHERE d.category = dep.category AND abs(d.depth - dep.depth) <= 10) AS n_events
        FROM dep),
      calc AS (
        SELECT st.*, CAST($stock_on_hand AS DOUBLE) AS stock, CAST($weekly_baseline_units AS DOUBLE) AS wk,
               CAST($weeks_remaining AS DOUBLE) AS wks,
               greatest(0, CAST($stock_on_hand AS DOUBLE) - CAST($weekly_baseline_units AS DOUBLE) * CAST($weeks_remaining AS DOUBLE)) AS leftover
        FROM st)
      SELECT sku, name, category,
             round(stock / wk, 1) AS weeks_of_cover,
             round(least(stock, wk * wks)) AS units_sold_at_current_pace,
             round(leftover) AS units_left_at_season_end,
             round(depth, 1) AS clearance_markdown_depth_pct,
             round(md_st, 1) AS markdown_sell_through_pct,
             n_events AS comparable_past_markdowns,
             round(leftover * price * depth / 100, 2) AS markdown_cost_gbp,
             round(leftover * md_st / 100 * (price * (1 - depth / 100) - cost), 2) AS margin_on_cleared_units_gbp,
             round(leftover * (1 - md_st / 100)) AS projected_closing_stock_units,
             'markdown cost = units left x price x depth; closing stock = units left x (1 - past markdown sell-through)' AS formula
      FROM calc
    example: {sku: "SKU-103472", stock_on_hand: 2400, weekly_baseline_units: 150}

  - name: calculate_markdown_depth_scenario
    desc: Model weekly units, unit margin and weeks to clear the remaining stock of a product at several markdown depths, relative to its current markdown.
    kind: sql
    args:
      sku: {required: true}
      stock_on_hand: {type: int, desc: "Units left. Defaults to stock left on the latest markdown event"}
      current_markdown_depth_pct: {type: float, desc: "Current depth %. Defaults to the latest markdown event"}
      weekly_units_at_current_depth: {type: float, desc: "Observed weekly units. Defaults to the latest markdown's weekly average"}
      elasticity_to_price: {type: float, desc: "Override the stored product or category elasticity"}
    sql: |
      WITH par AS (
        SELECT p.sku, p.name, p.retail_price_gbp AS price, p.unit_cost_gbp AS cost,
               COALESCE(CAST($elasticity_to_price AS DOUBLE),
                        (SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku = p.sku ORDER BY e.measure_date DESC LIMIT 1),
                        (SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku IS NULL AND e.category = p.category ORDER BY e.measure_date DESC LIMIT 1),
                        -1.5) AS el
        FROM master.products p WHERE p.sku = $sku),
      ev AS (
        SELECT md.markdown_id, md.markdown_depth_pct AS depth, md.stock_at_start - md.units_sold AS left_units
        FROM markdown_events md WHERE md.sku = $sku AND md.status IN ('active', 'completed')
        ORDER BY md.start_date DESC LIMIT 1),
      base AS (
        SELECT par.*,
               COALESCE(CAST($current_markdown_depth_pct AS DOUBLE), (SELECT depth FROM ev)) AS cur_depth,
               COALESCE(CAST($stock_on_hand AS DOUBLE), (SELECT left_units FROM ev)) AS stock,
               COALESCE(CAST($weekly_units_at_current_depth AS DOUBLE),
                        (SELECT avg(h.weekly_units_sold) FROM markdown_history h WHERE h.markdown_id = (SELECT markdown_id FROM ev))) AS cur_wk
        FROM par),
      scn AS (
        SELECT DISTINCT depth FROM (SELECT unnest([20.0, 30.0, 40.0, 50.0, 60.0]) AS depth UNION ALL SELECT cur_depth FROM base)),
      calc AS (
        SELECT b.sku, b.name, s.depth, b.cur_depth, b.stock, b.cur_wk, b.el, b.price, b.cost,
               b.price * (1 - s.depth / 100) AS md_price,
               b.cur_wk * POWER((1 - s.depth / 100) / (1 - b.cur_depth / 100), b.el) AS wk_units
        FROM base b CROSS JOIN scn s)
      SELECT sku, round(depth, 1) AS markdown_depth_pct,
             CASE WHEN depth = cur_depth THEN 'current' ELSE '' END AS marker,
             round(md_price, 2) AS markdown_price_gbp,
             round(wk_units, 1) AS weekly_units,
             round(100 * wk_units / cur_wk - 100, 1) AS weekly_units_vs_current_pct,
             round(md_price - cost, 2) AS unit_margin_gbp,
             round(wk_units * (md_price - cost), 2) AS weekly_margin_gbp,
             round(stock) AS stock_left_units,
             round(stock / NULLIF(wk_units, 0), 1) AS weeks_to_clear,
             round(el, 2) AS elasticity_used,
             'weekly units = current units x (new price / current price) ^ elasticity' AS formula
      FROM calc ORDER BY depth
    example: {sku: "SKU-100168"}

  - name: calculate_markdown_sell_through_scenario
    desc: Project sell-through, closing stock and margin over a 12-week season for one markdown depth starting in a given week.
    kind: sql
    args:
      sku: {required: true}
      markdown_depth_pct: {type: float, required: true, desc: "Markdown depth %, e.g. 20"}
      markdown_start_week: {type: int, default: 3, desc: "Season week the markdown starts, 1-12"}
      stock_on_hand: {type: int, required: true, desc: "Units in stock now"}
      weekly_baseline_units: {type: int, required: true, desc: "Weekly units at full price"}
    sql: |
      WITH par AS (
        SELECT p.sku, p.retail_price_gbp AS price, p.unit_cost_gbp AS cost,
               COALESCE((SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku = p.sku ORDER BY e.measure_date DESC LIMIT 1),
                        (SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku IS NULL AND e.category = p.category ORDER BY e.measure_date DESC LIMIT 1),
                        -1.5) AS el
        FROM master.products p WHERE p.sku = $sku),
      wk AS (
        SELECT par.sku, par.price, par.cost, par.el, w,
               CASE WHEN w >= CAST($markdown_start_week AS INT) THEN 1 - CAST($markdown_depth_pct AS DOUBLE) / 100 ELSE 1 END AS idx
        FROM par CROSS JOIN range(1, 13) AS t(w)),
      dem AS (SELECT *, CAST($weekly_baseline_units AS DOUBLE) * POWER(idx, el) AS demand FROM wk),
      sold AS (
        SELECT *, greatest(0, least(demand, CAST($stock_on_hand AS DOUBLE) - (sum(demand) OVER (ORDER BY w) - demand))) AS units FROM dem)
      SELECT sku,
             round(CAST($markdown_depth_pct AS DOUBLE), 1) AS markdown_depth_pct,
             CAST($markdown_start_week AS INT) AS markdown_start_week,
             round(sum(units)) AS units_sold,
             round(100 * sum(units) / CAST($stock_on_hand AS DOUBLE), 1) AS sell_through_pct,
             round(CAST($stock_on_hand AS DOUBLE) - sum(units)) AS closing_stock_units,
             round(sum(units * price * idx), 2) AS revenue_gbp,
             round(sum(units * (price * idx - cost)), 2) AS margin_gbp,
             min(w) FILTER (WHERE sum_units_to_w >= CAST($stock_on_hand AS DOUBLE) - 0.5) AS week_stock_clears,
             round(min(el), 2) AS elasticity_used,
             'demand = baseline x price index ^ elasticity, capped at stock; 12-week season' AS formula
      FROM (SELECT *, sum(units) OVER (ORDER BY w) AS sum_units_to_w FROM sold)
      GROUP BY sku
    example: {sku: "SKU-100959", markdown_depth_pct: 20, markdown_start_week: 3, stock_on_hand: 2000, weekly_baseline_units: 120}

  - name: calculate_price_increase_to_offset_cost
    desc: "Price rise needed to offset a unit-cost rise, by category or SKU, the rise that holds margin per unit and the rise that holds total margin after lost volume."
    kind: sql
    args:
      category: {desc: "Category, e.g. Small Appliances. Omit to rank every category"}
      sku: {desc: "One SKU instead of the category average"}
      cost_increase_pct: {type: float, required: true, desc: "Rise in unit cost %, e.g. 11 for a 10% fall in sterling on dollar-bought goods"}
      elasticity_to_price: {type: float, desc: "Override the stored elasticity (negative, e.g. -1.3)"}
    sql: |
      WITH lines AS (
        SELECT p.sku, p.category, p.retail_price_gbp AS price, p.unit_cost_gbp AS cost,
               COALESCE(CAST($elasticity_to_price AS DOUBLE),
                        CASE WHEN $sku IS NOT NULL THEN (SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku = p.sku ORDER BY e.measure_date DESC LIMIT 1) END,
                        (SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku IS NULL AND e.category = p.category ORDER BY e.measure_date DESC LIMIT 1),
                        -1.5) AS el
        FROM master.products p
        WHERE p.status IN ('active', 'clearance')
          AND ($category IS NULL OR lower(p.category) = lower($category))
          AND ($sku IS NULL OR p.sku = $sku)),
      base AS (
        SELECT category, count(*) AS lines, avg(price) AS price, avg(cost) AS cost, avg(el) AS el FROM lines GROUP BY category),
      cand AS (
        SELECT b.*, t.i / 10.0 AS x,
               (b.price * (1 + t.i / 1000.0) - b.cost * (1 + CAST($cost_increase_pct AS DOUBLE) / 100)) * POWER(1 + t.i / 1000.0, b.el) AS margin_new
        FROM base b CROSS JOIN range(0, 601) AS t(i)),
      res AS (
        SELECT category, any_value(lines) AS lines, any_value(price) AS price, any_value(cost) AS cost, any_value(el) AS el,
               min(x) FILTER (WHERE margin_new >= price - cost) AS rise_total_margin_pct
        FROM cand GROUP BY category)
      SELECT category, lines AS lines_in_scope,
             round(price, 2) AS avg_price_gbp, round(cost, 2) AS avg_unit_cost_gbp,
             round(CAST($cost_increase_pct AS DOUBLE), 1) AS cost_increase_pct,
             round(cost * CAST($cost_increase_pct AS DOUBLE) / 100, 2) AS cost_increase_gbp,
             round(CAST($cost_increase_pct AS DOUBLE), 1) AS price_rise_to_hold_margin_pct,
             round(100 * cost * CAST($cost_increase_pct AS DOUBLE) / 100 / price, 1) AS price_rise_to_hold_unit_margin_gbp_pct,
             round(rise_total_margin_pct, 1) AS price_rise_to_hold_total_margin_pct,
             round(price * (1 + rise_total_margin_pct / 100), 2) AS new_avg_price_gbp,
             round(100 * (POWER(1 + rise_total_margin_pct / 100, el) - 1), 1) AS volume_change_pct_at_that_rise,
             round(el, 2) AS elasticity_used,
             'unit margin held: rise = cost increase / price; total margin held: smallest rise where (price x (1+rise) - new cost) x volume x (1+rise)^elasticity >= today''s margin' AS formula
      FROM res ORDER BY rise_total_margin_pct DESC NULLS LAST, category
    limit: 40
    example: {category: Small Appliances, cost_increase_pct: 11}

  - name: calculate_price_test_sample_size
    desc: Minimum units per cell and days needed to detect a given sales change between test and control stores, at a confidence level and power.
    kind: sql
    args:
      expected_uplift_pct: {type: float, required: true, desc: "Sales change to detect, % (sign ignored), e.g. -10"}
      confidence_level_pct: {type: float, default: 95, desc: "Confidence level, typically 90-99"}
      power_pct: {type: float, default: 80, desc: "Statistical power, typically 80-90"}
      baseline_daily_sales_units: {type: int, required: true, desc: "Units one cell (test or control) sells per day"}
    sql: |
      WITH z AS (
        SELECT sqrt(-2 * ln((1 - CAST($confidence_level_pct AS DOUBLE) / 100) / 2)) AS ta,
               sqrt(-2 * ln(1 - CAST($power_pct AS DOUBLE) / 100)) AS tb),
      zz AS (
        SELECT ta - (2.515517 + 0.802853 * ta + 0.010328 * ta * ta) / (1 + 1.432788 * ta + 0.189269 * ta * ta + 0.001308 * ta * ta * ta) AS z_alpha,
               tb - (2.515517 + 0.802853 * tb + 0.010328 * tb * tb) / (1 + 1.432788 * tb + 0.189269 * tb * tb + 0.001308 * tb * tb * tb) AS z_beta
        FROM z),
      n AS (
        SELECT z_alpha, z_beta, abs(CAST($expected_uplift_pct AS DOUBLE)) / 100 AS r,
               POWER(z_alpha + z_beta, 2) * (2 + abs(CAST($expected_uplift_pct AS DOUBLE)) / 100) / POWER(abs(CAST($expected_uplift_pct AS DOUBLE)) / 100, 2) AS units_control
        FROM zz)
      SELECT round(abs(CAST($expected_uplift_pct AS DOUBLE)), 1) AS sales_change_to_detect_pct,
             round(CAST($confidence_level_pct AS DOUBLE), 0) AS confidence_level_pct,
             round(CAST($power_pct AS DOUBLE), 0) AS power_pct,
             CAST($baseline_daily_sales_units AS INT) AS baseline_daily_units_per_cell,
             ceil(units_control) AS min_units_per_control_cell,
             ceil(units_control * (1 + r)) AS min_units_per_test_cell,
             ceil(units_control / CAST($baseline_daily_sales_units AS DOUBLE)) AS days_needed,
             ceil(units_control / CAST($baseline_daily_sales_units AS DOUBLE) / 7) AS weeks_needed,
             CASE WHEN units_control / CAST($baseline_daily_sales_units AS DOUBLE) <= 14 THEN 'short test: 2 weeks is enough'
                  WHEN units_control / CAST($baseline_daily_sales_units AS DOUBLE) <= 42 THEN 'standard test: run for the weeks shown'
                  ELSE 'long test: raise store count or accept a larger change to detect' END AS recommendation,
             'units per cell = (z_alpha + z_beta)^2 x (2 + r) / r^2 (Poisson counts, r = relative change to detect); days = units / daily units per cell' AS formula
      FROM n
    example: {expected_uplift_pct: -10, baseline_daily_sales_units: 60}

  - name: calculate_promotion_roi_ranking
    desc: Rank promotions by ROI (margin return per promotion investment).
    kind: sql
    args:
      lookback_days: {type: int, default: 90, desc: "Days of history to include"}
    sql: |
      SELECT promotion_id, category,
             round(actual_margin_gbp, 2) AS actual_margin_gbp,
             round(planned_margin_gbp, 2) AS planned_margin_gbp,
             round(CASE WHEN planned_margin_gbp > 0 THEN (actual_margin_gbp / planned_margin_gbp - 1) * 100 ELSE NULL END, 1) AS vs_plan_pct,
             round(actual_uplift_pct, 1) AS actual_uplift_pct,
             'ROI = margin generated / investment cost' AS formula
      FROM promotions
      WHERE status IN ('completed', 'cancelled')
        AND end_date >= CAST($as_of AS DATE) - INTERVAL (CAST($lookback_days AS INT)) DAY
      ORDER BY actual_margin_gbp DESC
      LIMIT 20
    example: {lookback_days: 90}

  - name: calculate_sales_lost_to_price_gaps
    desc: Estimate weekly units and revenue lost because we are priced above competitors by a given gap, for a category or one SKU, from its recent sales and price elasticity.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Cookware"}
      price_gap_pct: {type: float, required: true, desc: "Our price premium over competitors, %"}
      sku: {desc: "One SKU in the category. Omit for the whole category"}
      elasticity_to_price: {type: float, desc: "Override the stored elasticity. Defaults to the SKU's own estimate, else the category's"}
      weeks_back: {type: int, default: 8, desc: "Complete weeks of sales used as the baseline"}
    sql: |
      WITH prod AS (
        SELECT p.sku, p.retail_price_gbp AS price FROM master.products p
        WHERE lower(p.category) = lower($category) AND ($sku IS NULL OR p.sku = $sku)),
      el AS (
        SELECT COALESCE(CAST($elasticity_to_price AS DOUBLE),
                        (SELECT e.elasticity_to_price FROM elasticity_data e WHERE $sku IS NOT NULL AND e.sku = $sku ORDER BY e.measure_date DESC LIMIT 1),
                        (SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku IS NULL AND lower(e.category) = lower($category) ORDER BY e.measure_date DESC LIMIT 1),
                        -1.5) AS el),
      wk AS (
        SELECT sum(s.store_units + s.online_units) / CAST($weeks_back AS DOUBLE) AS units, sum(s.revenue_gbp) / CAST($weeks_back AS DOUBLE) AS revenue
        FROM master.sales_weekly s JOIN prod USING (sku)
        WHERE s.week_start >= CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE) - INTERVAL (CAST($weeks_back * 7 AS INT)) DAY
          AND s.week_start < CAST(date_trunc('week', CAST($as_of AS DATE)) AS DATE))
      SELECT $category AS category, $sku AS sku,
             round(CAST($price_gap_pct AS DOUBLE), 1) AS our_price_premium_pct,
             round(el.el, 2) AS elasticity_to_price,
             round(wk.units, 1) AS baseline_weekly_units,
             round(wk.revenue, 2) AS baseline_weekly_revenue_gbp,
             round(least(100, abs(el.el * CAST($price_gap_pct AS DOUBLE))), 1) AS estimated_volume_loss_pct,
             round(wk.units * least(100, abs(el.el * CAST($price_gap_pct AS DOUBLE))) / 100, 1) AS units_lost_per_week,
             round(wk.revenue * least(100, abs(el.el * CAST($price_gap_pct AS DOUBLE))) / 100, 2) AS revenue_lost_per_week_gbp,
             'volume lost % = |elasticity x price gap %|; units and revenue lost = baseline weekly sales x that %' AS formula
      FROM el, wk
    example: {category: Cookware, price_gap_pct: 8.5, sku: "SKU-103612"}

