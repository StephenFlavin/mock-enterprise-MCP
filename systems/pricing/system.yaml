  - name: compare_clearance_options
    desc: Compare clearance options for a category on typical recovery, margin on full price, time to clear, channel and full-price cannibalisation.
    kind: sql
    args:
      category: {required: true, desc: "Category, e.g. Footwear or Drinkware"}
    sql: |
      WITH cr AS (
        SELECT category, avg(unit_cost_gbp / retail_price_gbp) AS cost_ratio
        FROM master.products WHERE lower(category) = lower($category) GROUP BY category)
      SELECT o.category, o.option, o.best_channel AS channel,
             o.recovery_pct_of_price,
             round(o.recovery_pct_of_price - 100 * cr.cost_ratio, 1) AS margin_pct_of_full_price,
             o.sell_through_pct, o.weeks_to_clear,
             o.fp_cannibalisation_pct AS full_price_sales_lost_on_similar_items_pct
      FROM clearance_options o JOIN cr ON cr.category = o.category
      WHERE lower(o.category) = lower($category)
      ORDER BY margin_pct_of_full_price * o.sell_through_pct DESC
    example: {category: Footwear}

  - name: compare_markdown_scenarios
    desc: Compare two markdown scenarios (depth and start week) on sell-through, closing stock and margin over a 12-week season, and flag the higher margin.
    kind: sql
    args:
      sku: {required: true}
      stock_on_hand: {type: int, required: true, desc: "Units in stock now"}
      weekly_baseline_units: {type: int, required: true, desc: "Weekly units at full price"}
      scenario_a_depth_pct: {type: float, required: true, desc: "Scenario A markdown depth %"}
      scenario_a_start_week: {type: int, required: true, desc: "Scenario A start week, 1-12"}
      scenario_b_depth_pct: {type: float, required: true, desc: "Scenario B markdown depth %"}
      scenario_b_start_week: {type: int, required: true, desc: "Scenario B start week, 1-12"}
    sql: |
      WITH par AS (
        SELECT p.sku, p.retail_price_gbp AS price, p.unit_cost_gbp AS cost,
               COALESCE((SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku = p.sku ORDER BY e.measure_date DESC LIMIT 1),
                        (SELECT e.elasticity_to_price FROM elasticity_data e WHERE e.sku IS NULL AND e.category = p.category ORDER BY e.measure_date DESC LIMIT 1),
                        -1.5) AS el
        FROM master.products p WHERE p.sku = $sku),
      scn AS (
        SELECT 'A' AS scenario, CAST($scenario_a_depth_pct AS DOUBLE) AS depth, CAST($scenario_a_start_week AS INT) AS start_wk
        UNION ALL
        SELECT 'B', CAST($scenario_b_depth_pct AS DOUBLE), CAST($scenario_b_start_week AS INT)),
      wk AS (
        SELECT s.scenario, s.depth, s.start_wk, w, par.price, par.cost, par.el,
               CASE WHEN w >= s.start_wk THEN 1 - s.depth / 100 ELSE 1 END AS idx
        FROM scn s CROSS JOIN par CROSS JOIN range(1, 13) AS t(w)),
      dem AS (SELECT *, CAST($weekly_baseline_units AS DOUBLE) * POWER(idx, el) AS demand FROM wk),
      sold AS (
        SELECT *, greatest(0, least(demand, CAST($stock_on_hand AS DOUBLE) - (sum(demand) OVER (PARTITION BY scenario ORDER BY w) - demand))) AS units FROM dem),
      agg AS (
        SELECT scenario, depth, start_wk, sum(units) AS units_sold, sum(units * price * idx) AS revenue,
               sum(units * (price * idx - cost)) AS margin, min(el) AS el
        FROM sold GROUP BY scenario, depth, start_wk)
      SELECT scenario, round(depth, 1) AS markdown_depth_pct, start_wk AS markdown_start_week,
             round(units_sold) AS units_sold,
             round(100 * units_sold / CAST($stock_on_hand AS DOUBLE), 1) AS sell_through_pct,
             round(CAST($stock_on_hand AS DOUBLE) - units_sold) AS closing_stock_units,
             round(revenue, 2) AS revenue_gbp,
             round(margin, 2) AS margin_gbp,
             CASE WHEN margin = max(margin) OVER () THEN 'higher margin' ELSE '' END AS verdict,
             round(el, 2) AS elasticity_used,
             'demand = baseline x price index ^ elasticity, capped at stock; 12-week season' AS formula
      FROM agg ORDER BY scenario
    example: {sku: "SKU-100959", stock_on_hand: 2000, weekly_baseline_units: 120, scenario_a_depth_pct: 20, scenario_a_start_week: 3, scenario_b_depth_pct: 40, scenario_b_start_week: 6}

  - name: compare_promotion_with_past_events
    desc: Compare planned promotion to past similar events on sales uplift, margin and timing.
    kind: sql
    args:
      category: {required: true}
      planned_discount_pct: {type: float, required: true, desc: "Discount % of planned promotion"}
    sql: |
      SELECT category, promotion_type, discount_depth_pct,
             round(actual_uplift_pct, 1) AS past_uplift_pct,
             round(actual_margin_gbp, 2) AS past_margin_gbp,
             status, end_date
      FROM promotions
      WHERE category = $category
        AND status IN ('completed', 'cancelled')
        AND ABS(discount_depth_pct - $planned_discount_pct) < 5
      ORDER BY end_date DESC
      LIMIT 5
    example: {category: Cookware, planned_discount_pct: 25}

