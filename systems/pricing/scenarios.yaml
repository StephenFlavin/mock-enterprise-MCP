- question: "07:62:Q5"
  story: >
    Tariff adds £4 to landed cost on £35 item. With -1.2 elasticity, recommend price increase
    to £39.6 to offset the cost increase and maintain margin.
  checks:
    - tool: calculate_price_increase_to_offset_cost
      args: {current_price_gbp: 35.0, cost_increase_gbp: 4.0, elasticity_to_price: -1.2}
      expect: ["39.6", "offset"]
    - tool: get_elasticity_confidence_intervals
      args: {}
      expect: ["Cookware", "-1.32", "0.2"]
    - tool: run_volume_and_margin_forecast_for_price_change
      args: {sku: "K-1700", current_price_gbp: 77.99, new_price_gbp: 85.79, current_volume_units: 10000, cost_gbp: 24.67, elasticity_to_price: -1.2}
      expect: ["price_change", "margin", "forecast"]

- question: "08:71:Q3"
  story: >
    Promotion calendar for a store: promotions in the next 26 weeks.
  checks:
