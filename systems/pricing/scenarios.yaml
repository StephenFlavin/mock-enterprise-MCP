      args: {site_id: ST214}
      expect: ["PROMO-900014", "Black Friday"]
    - tool: list_promotions_in_calendar
      args: {site_id: "ST001"}
      expect: ["promotion"]

- question: "08:77:Q1"
  story: >
    Cookware (home and kitchen) overpriced lines: SKU-103612 (£132.99, elasticity -1.9) and SKU-100819 (£114.99,
    elasticity -1.4). A 14% gap on the first costs about 4.5 units and £494 a week; a 12% gap on the second about 4.1
    units and £388, so the first costs more. Cookware is mid-market (band 0.7 to 1.4). Draft price change PC-900041 for
    SKU-103612 exists and is submitted; a new draft is raised for SKU-100819.
  checks:
    - tool: get_price_elasticity_for_products
      args: {category: Cookware}
      expect: ["SKU-103612", "-1.9", "SKU-100819", "-1.4"]
    - tool: calculate_sales_lost_to_price_gaps
      args: {category: Cookware, sku: SKU-103612, price_gap_pct: 14}
      expect: ["26.6", "493.78"]
    - tool: calculate_sales_lost_to_price_gaps
      args: {category: Cookware, sku: SKU-100819, price_gap_pct: 12}
      expect: ["16.8", "388.38"]
    - tool: get_price_positioning_rules_for_category
      args: {category: Cookware}
      expect: ["Cookware", "mid_market"]
    - tool: create_price_change_request
      args: {sku: SKU-100819, old_price_gbp: 114.99, new_price_gbp: 102.99, change_reason: "Competitive pressure", proposed_date: "+14d"}
      expect: ["PC-", "draft", "SKU-100819", "102.99"]
    - tool: submit_price_change_for_approval
      args: {pc_id: PC-900041}
      expect: ["submitted"]

- question: "08:77:Q2"
  story: >
    Small Appliances: elasticity -1.25 (+/-0.18, 85 data points: medium confidence). A 5% rise cuts weekly volume 5.9%
    and adds about £3,121 a week of margin across the range (£2,324 on the top two price tiers). A price test on SKU-104032
    at 5% above control is set up.
  checks:
    - tool: get_price_elasticity_for_category
      args: {category: Small Appliances}
      expect: ["-1.25", "0.18", "85"]
    - tool: run_volume_and_margin_forecast_for_price_change
      args: {category: Small Appliances, price_change_pct: 5}
      expect: ["all tiers in scope", "-5.9", "3120.81"]
    - tool: run_volume_and_margin_forecast_for_price_change
      args: {category: Small Appliances, price_change_pct: 5, min_price_tier: 3}
      expect: ["tier 3", "tier 4", "2324.21"]
    - tool: get_elasticity_confidence_intervals
      args: {}
      expect: ["Small Appliances", "0.18"]
    - tool: create_price_test
      args: {sku: "SKU-104032", test_price_gbp: 243.59, control_price_gbp: 231.99, test_store_count: 10, control_store_count: 10, start_date: "+14d", end_date: "+56d"}
      expect: ["PT-", "planned", "SKU-104032"]
    - tool: delete_draft_price_for_product
      args: {pc_id: PC-900004}
      expect: ["cancelled"]

- question: "08:77:Q3"
  story: >
    Home discounting is deeper: seven markdown events ended in the last 13 weeks at an average 29.3% depth (Bedding 30%,
    Towels 27.5%, Storage 30%, Drinkware 30%), against five events at 18% before, up 11.3 points, which sits behind the
    -0.2 point markdown component of the Home margin bridge.
  checks:
