      args: {department: Home, lookback_weeks: 13}
      expect: ["All Home categories", "29.3", "18", "11.3", "Bedding"]
    - tool: get_discounting_depth_for_category
      args: {category: Dresses, lookback_weeks: 26}
      expect: ["Dresses", "markdown_events_in_period"]
    - tool: create_scheduled_price_change
      args: {pc_id: PC-900003, proposed_date: "+7d"}
      expect: ["scheduled"]

- question: "08:77:Q4"
  story: >
    Small Appliances tariff of 6%: passing it on (price +6%) cuts weekly volume 7% and margin about £4,530 a week;
    absorbing it costs about £8,825 a week of margin (-2.8%). Approved change PC-900043 (SKU-104032, £245.99, tariff
    pass-through) is scheduled and the clashing scheduled change PC-900044 on the same line is cancelled. PC-900002
    (PF-220) stays a separate scheduled change that can also be cancelled.
  checks:
    - tool: run_volume_and_margin_forecast_for_price_change
      args: {category: Small Appliances, price_change_pct: 6, cost_increase_pct: 6}
      expect: ["tier 4", "-7", "-4530.33"]
    - tool: run_volume_and_margin_forecast_for_price_change
      args: {category: Small Appliances, price_change_pct: 0, cost_increase_pct: 6}
      expect: ["tier 1", "-8824.5"]
    - tool: create_scheduled_price_change
      args: {pc_id: PC-900043, proposed_date: "+12w"}
      expect: ["scheduled", "PC-900043"]
    - tool: cancel_scheduled_price_change
      args: {pc_id: PC-900044, cancel_reason: "Clashes with the tariff pass-through price change"}
      expect: ["cancelled"]
    - tool: cancel_scheduled_price_change
      args: {pc_id: PC-900002, cancel_reason: "Tariff impact lower than expected"}
      expect: ["cancelled"]

- question: "08:77:Q6"
  story: >
    New Storage product SKU-100595 (unit cost £8.11, £23.99): at 400 units a week and elasticity -1.2, margin rises with
    price across the candidates (£6,163 a week at £21.99, £6,352 at £23.99, £6,497 at £25.99). A test to detect a 10%
    change at 60 units a day per cell needs 1,649 units a cell, 28 days. Draft price change PC-900045 stays; it can be
    deleted with the delete tool.
  checks:
    - tool: run_volume_and_margin_forecast_at_price_points
      args: {sku: SKU-100595, base_volume_units: 400, price_points: "19.99,21.99,23.99,25.99"}
      expect: ["highest margin", "6496.75", "6163.33"]
    - tool: calculate_price_test_sample_size
      args: {expected_uplift_pct: -10, baseline_daily_sales_units: 60}
      expect: ["1649", "28"]
    - tool: create_price_test
      args: {sku: SKU-100595, test_price_gbp: 21.99, control_price_gbp: 23.99, test_store_count: 8, control_store_count: 8, start_date: "+14d", end_date: "+42d"}
      expect: ["PT-", "planned", "SKU-100595"]
    - tool: delete_draft_price_for_product
      args: {pc_id: PC-900045}
      expect: ["cancelled"]

