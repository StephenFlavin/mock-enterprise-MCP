# One entry per question row that uses this system's tools (see: python -m mockmcp brief pricing).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.
# Category names are master categories: kitchenware = Cookware, denim = Trousers, jackets = Outerwear (Menswear).

- question: "03:23:Q1"
  story: >
    Outerwear, last month: a 25% Autumn Outerwear Sale (PROMO-900011) was planned for the week after next but
    cancelled (mild weather, stock held at full price), so any forecast that still carried it is too high; the
    Autumn Layering Bundle (PROMO-900003) did run, at 16% uplift against 18% planned. Three menswear outerwear styles
    (SKU-100959, SKU-102870, SKU-105705) went up 5.1%, 5.4% and 5.5% on the same day about five weeks ago.
  checks:
    - tool: get_promotion_calendar_for_category
      args: {category: Outerwear}
      expect: ["PROMO-900011", "cancelled", "Mild weather", "PROMO-900003", "bundle"]
    - tool: get_price_changes_for_category
      args: {category: Outerwear, department: Menswear}
      expect: ["PC-900031", "5.1", "PC-900032", "5.4", "PC-900033", "5.5"]

- question: "03:23:Q2"
  story: >
    The recycled backpack range is modelled on SKU-103423 (Rust Bag, £28.99). Bags target a mid-market position;
    the bag sits at 0.74 of the category median price (£38.99), inside the allowed 0.6 to 1.4 band, at the 21st
    percentile of the category.
  checks:
    - tool: get_price_positioning_for_product
      args: {sku: "SKU-103423"}
      expect: ["mid_market", "0.74", "within target band", "38.99"]

- question: "03:23:Q4"
  story: >
    Kitchenware (Cookware) has three completed promotions: 20% (PROMO-900012, +41% uplift), 25% last Black Friday
    (PROMO-900002, +62%, 35% cannibalised, 18% dip for 3 weeks) and 30% (PROMO-900013, +74%). A 25% event is
    estimated at about +58% uplift (range 51 to 62), of which about 64% is incremental.
  checks:
    - tool: get_promotion_history_for_category
      args: {category: Cookware}
      expect: ["PROMO-900002", "62", "PROMO-900012", "PROMO-900013"]
    - tool: get_promotion_uplift_estimate
      args: {category: Cookware, discount_pct: 25}
      expect: ["58.3", "51.2", "PROMO-900002"]
    - tool: get_cannibalisation_estimate
      args: {category: Cookware, promotion_depth_pct: 25}
      expect: ["35.7", "64.3", "37.5"]
    - tool: get_post_promotion_dip_for_category
      args: {category: Cookware, promotion_depth_pct: 25}
      expect: ["PROMO-900002", "18", "closest depth to plan"]

- question: "03:23:Q6"
  story: >
    Income elasticity by category: essentials hold up best (Schoolwear 0.15, Babywear 0.20, Bodycare 0.25) and
    discretionary lines fall most (Jewellery 1.55, Smart Home 1.45, Audio 1.30). A 3% income fall takes 0.5% off
    Schoolwear demand and 4.7% off Jewellery.
  checks:
    - tool: calculate_category_demand_elasticity_to_income
      args: {income_change_pct: -3}
      expect: ["Schoolwear", "0.15", "Babywear", "Jewellery", "1.55", "-4.7"]
    - tool: calculate_category_demand_elasticity_to_income
      args: {category: Cookware}
      expect: ["Cookware", "0.6", "-1.8"]

- question: "03:24:Q2"
  story: >
    Core denim is the Trousers category. Two promotions are scheduled: Denim Days 20% off (PROMO-900021) starting in
    about three weeks for two weeks, and Pre-Christmas Denim 15% (PROMO-900022) in about nine weeks.
  checks:
    - tool: get_promotion_calendar_for_category
      args: {category: Trousers, weeks_ahead: 10}
      expect: ["PROMO-900021", "Denim Days", "20", "PROMO-900022", "scheduled"]

- question: "03:25:Q1"
  story: >
    Womenswear knitwear markdown cost rose: 5 markdown events across three styles in the last four weeks cost
    £75,765 (34.2% of full-price value, 33% average depth) against £22,940 (20.0%) in the four weeks before. Menswear
    knitwear has one small event, so the department filter matters.
  checks:
    - tool: get_markdown_spend_by_category
      args: {category: Knitwear, department: Womenswear}
      expect: ["last period", "75765.09", "34.2", "previous period", "22940.32", "20"]

- question: "03:25:Q3"
  story: >
    Bedding line SKU-103472 (£94.99, cost £36.07) with 2,400 units selling 150 a week and 10 weeks left runs out of
    time with 900 units; at the category's usual 30% clearance depth that costs £25,647 and leaves about 318 units.
    Starting a 20% markdown three weeks earlier raises margin slightly and lowers closing stock risk.
  checks:
    - tool: calculate_markdown_cost_projection
      args: {sku: "SKU-103472", stock_on_hand: 2400, weekly_baseline_units: 150}
      expect: ["900", "25647.3", "318", "64.7"]
    - tool: calculate_earlier_markdown_impact
      args: {sku: "SKU-103472", stock_on_hand: 2400, weekly_baseline_units: 150, current_markdown_depth_pct: 30, earlier_markdown_depth_pct: 20, weeks_earlier: 3}
      expect: ["current plan", "earlier markdown", "1365.15"]

- question: "03:25:Q4"
  story: >
    Bedding and Towels end the season heavy; a markdown review request is stored for the category.
  checks:
    - tool: create_markdown_review_request
      args: {category: "Bedding", review_reason: "Projected to end the season heavy on stock"}
      expect: ["MRR-", "Bedding", "open"]

- question: "03:29:Q1"
  story: >
    Men's jacket style STY-4102 (£66.99, cost £27.18) went 30% off four weeks ago: only 22.8% of 2,500 units sold.
    The M (SKU-100161) sold 55%, S 18.8% and L (SKU-100168) just 8.2% (22.5 a week, 44.9 weeks to clear 1,010
    units). 40% would lift weekly units 38% (31) but cut unit margin from £19.71 to £13.01 and still take 32 weeks.
  checks:
    - tool: get_markdown_performance_for_product
      args: {style_id: "STY-4102"}
      expect: ["MDE-900103", "8.2", "55", "18.8", "44.9"]
    - tool: calculate_markdown_depth_scenario
      args: {sku: "SKU-100168"}
      expect: ["current", "31.1", "13.01", "32.5", "-2.1"]
    - tool: update_markdown_price_for_product
      args: {markdown_id: MDE-900103, markdown_depth_pct: 40}
      expect: ["MDE-900103", "30", "40"]

- question: "03:29:Q2"
  story: >
    Aged lines SKU-104277 (footwear, £108.99, cost £43.48) and SKU-105558 (drinkware, £129.99). Footwear clears best
    by markdown (28,134 expected margin on 2,000 units) and drinkware by bundling (63,370 on 1,500 units). Footwear
    elasticity is -1.9 at product level. Marking footwear down 40% costs about 18.4% of full-price sales of similar items.
  checks:
    - tool: get_price_elasticity_for_product
      args: {sku: "SKU-104277"}
      expect: ["product", "-1.9", "0.38"]
    - tool: calculate_clearance_option_recovery
      args: {sku: "SKU-104277", stock_on_hand: 2000}
      expect: ["markdown", "28134.48", "bundle", "26849.88", "liquidate", "donate"]
    - tool: calculate_clearance_option_recovery
      args: {sku: "SKU-105558", stock_on_hand: 1500}
      expect: ["bundle", "63370.48", "markdown", "40702.2"]
    - tool: get_full_price_cannibalisation_estimate
      args: {category: Footwear, markdown_depth_pct: 40}
      expect: ["18.4", "4.6"]
    - tool: compare_clearance_options
      args: {category: Drinkware}
      expect: ["bundle", "online", "72", "outlet"]
    - tool: create_markdown_event
      args: {sku: "SKU-104277", markdown_depth_pct: 40, start_date: "+7d", end_date: "+35d", original_price_gbp: 108.99, stock_at_start: 2000}
      expect: ["MDE-", "draft", "SKU-104277"]

- question: "03:29:Q3"
  story: >
    Jackets are Outerwear: elasticity -1.52 with a wide interval (+/-0.34 on only 41 observations, low confidence).
    For padded jacket SKU-100959 (£102.99, cost £32.15) with 2,000 units selling 120 a week, 20% off from week 3
    sells 96.2% for £101,637 margin, against 40% off from week 6 selling 100% for £84,006: the earlier, shallower
    markdown wins on margin.
  checks:
    - tool: get_price_elasticity_for_category
      args: {category: Outerwear}
      expect: ["-1.52", "0.34", "41"]
    - tool: get_elasticity_confidence_for_category
      args: {category: Outerwear}
      expect: ["low", "22.4", "41"]
    - tool: calculate_markdown_sell_through_scenario
      args: {sku: "SKU-100959", markdown_depth_pct: 20, markdown_start_week: 3, stock_on_hand: 2000, weekly_baseline_units: 120}
      expect: ["96.2", "101636.87"]
    - tool: compare_markdown_scenarios
      args: {sku: "SKU-100959", stock_on_hand: 2000, weekly_baseline_units: 120, scenario_a_depth_pct: 20, scenario_a_start_week: 3, scenario_b_depth_pct: 40, scenario_b_start_week: 6}
      expect: ["higher margin", "84005.6", "100"]
    - tool: create_markdown_event
      args: {sku: "SKU-100959", markdown_depth_pct: 20, start_date: "+14d", end_date: "+42d", original_price_gbp: 102.99, stock_at_start: 2000}
      expect: ["MDE-", "draft", "SKU-100959"]

- question: "03:29:Q4"
  story: >
    Our men's outerwear (jackets) markdowns: 3 events at 30% depth, 6 weeks long, started four weeks ago, only 22.8%
    sold, on styles launched about 56 weeks ago. Other categories show different depths for comparison.
  checks:
    - tool: get_our_markdown_depth_and_timing
      args: {category: Outerwear, department: Menswear}
      expect: ["Outerwear", "Menswear", "22.8", "56", "570"]

- question: "03:29:Q5"
  story: >
