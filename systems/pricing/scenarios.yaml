      args: {expected_uplift_pct: -15, baseline_daily_sales_units: 180, confidence_level_pct: 95}
      expect: ["units_per_cell", "8_week"]
    - tool: create_price_test
      args: {sku: "PF-220", test_price_gbp: 82.99, control_price_gbp: 77.99, test_store_count: 10, control_store_count: 10, start_date: "+7d", end_date: "+49d"}
      expect: ["PT-", "planned"]
    - tool: delete_draft_price_for_product
      args: {pc_id: PC-900004}
      expect: ["cancelled"]

