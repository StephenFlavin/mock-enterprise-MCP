# One entry per question row that uses this system's tools (see: python -m mockmcp brief pricing).
# story = what the seed data plants; checks = tool calls whose output must contain every `expect` string.

- question: "03:23:Q6"
  story: >
    Elasticity data shows kitchenware has income elasticity of -0.65 with 22% confidence interval.
    This helps understand how demand changes with economic conditions.
  checks:
    - tool: calculate_category_demand_elasticity_to_income
      args: {category: kitchenware, lookback_weeks: 52}
      expect: ["-0.65", "kitchenware"]

- question: "03:29:Q2"
  story: >
    PF-220 (portable fan) has 800 units in stock at £42 with £16 cost. Clearance options
    show markdown at 50% gives 38% margin vs liquidate at 15% gives 8% margin.
  checks:
    - tool: calculate_clearance_option_recovery
      args: {sku: "PF-220", current_price_gbp: 42.0, cost_gbp: 16.0, stock_on_hand: 800}
      expect: ["markdown", "liquidate", "50"]

- question: "03:25:Q3"
  story: >
    Autumn range (STY-7731) is at risk. Current markdown is 40% with costs projected at £7,410 margin.
    Earlier markdown would change recovery by 15-25%.
  checks:
    - tool: calculate_earlier_markdown_impact
      args: {sku: "SKU-103164", current_markdown_depth_pct: 40, earlier_markdown_depth_pct: 50, weeks_earlier: 2}
      expect: ["Earlier markdown", "15-25"]

- question: "03:25:Q3"
  story: >
    STY-7731 has 1200 units at £45 cost £18 selling 150/week. Markdown cost projection
    shows £5,400 margin if all sell at 30% markdown.
  checks:
    - tool: calculate_markdown_cost_projection
      args: {sku: "SKU-103164", current_price_gbp: 45.0, cost_gbp: 18.0, stock_on_hand: 1200, weekly_baseline_units: 150}
      expect: ["weeks_of_stock", "projected_margin"]

- question: "03:29:Q1"
  story: >
    Men's jackets at £65 cost £22 with -1.5 elasticity. At 20% markdown sell 74% in 8 weeks,
    at 40% markdown sell 38% in 3 weeks.
  checks:
    - tool: calculate_markdown_depth_scenario
      args: {sku: "SKU-101904", current_price_gbp: 65.0, cost_gbp: 22.0, elasticity_to_price: -1.5}
      expect: ["20%", "40%", "margin"]

- question: "03:29:Q3"
  story: >
    Jackets markdown scenarios: 10% reaches 91% sell-through in 12 weeks vs 40% reaches 38% in 3 weeks.
  checks:
    - tool: calculate_markdown_sell_through_scenario
      args: {sku: "SKU-101904", elasticity_to_price: -1.5}
      expect: ["10%", "40%", "sell_through"]

- question: "07:62:Q5"
  story: >
    Tariff adds £4 to landed cost on £35 item. With -1.2 elasticity, recommend price increase
    to £39.6 to offset the cost increase and maintain margin.
  checks:
    - tool: calculate_price_increase_to_offset_cost
      args: {current_price_gbp: 35.0, cost_increase_gbp: 4.0, elasticity_to_price: -1.2}
      expect: ["39.6", "offset"]

- question: "08:77:Q2"
  story: >
    Price test on K-1700: need 560 units per cell for 8-week test to detect 15% volume change
    at 95% confidence.
  checks:
    - tool: calculate_price_test_sample_size
      args: {expected_uplift_pct: -15, baseline_daily_sales_units: 180, confidence_level_pct: 95}
      expect: ["sample", "8_week"]

- question: "08:78:Q3"
  story: >
    Promotion ROI ranking shows PROMO-900002 generated £2,850 margin vs £3,100 planned,
    with 16% actual uplift.
  checks:
    - tool: calculate_promotion_roi_ranking
      args: {lookback_days: 90}
      expect: ["PROMO-900", "margin", "actual"]

- question: "08:77:Q1"
  story: >
    Kitchenware is 8.5% overpriced vs competitors with -1.5 elasticity means 12.75% volume loss.
  checks:
    - tool: calculate_sales_lost_to_price_gaps
      args: {category: kitchenware, price_gap_pct: 8.5, elasticity_to_price: -1.5}
      expect: ["12.8", "volume"]

- question: "08:78:Q1"
  story: >
    Weekend home promotion (PROMO-900001) underperformed with only 8% uplift vs 20% planned,
    generating £1,200 margin. It was cancelled.
  checks:
    - tool: cancel_promotion
      args: {promotion_id: PROMO-900001, cancel_reason: "Insufficient stock confirmed"}
      expect: ["cancelled"]

- question: "08:77:Q4"
  story: >
    Price change PC-900002 scheduled for 1 January to pass through tariff. If cancelled,
    updates status.
  checks:
    - tool: cancel_scheduled_price_change
      args: {pc_id: PC-900002, cancel_reason: "Tariff impact lower than expected"}
      expect: ["cancelled"]

- question: "03:29:Q2"
  story: >
    Clearance options for aged lines show markdown recovery vs outlet recovery vs liquidate options
    by margin percentage.
  checks:
    - tool: compare_clearance_options
      args: {category: apparel, status: completed}
      expect: ["markdown", "margin"]

- question: "03:29:Q3"
  story: >
    Markdown scenarios for jackets: 20% depth gives 56 units in 5 weeks vs 40% gives 38 units in 3 weeks.
  checks:
    - tool: compare_markdown_scenarios
      args: {sku: "SKU-101904", scenario_a_depth_pct: 20, scenario_b_depth_pct: 40}
      expect: ["Scenario A", "Scenario B", "margin"]

- question: "08:78:Q1"
  story: >
    Weekend event (20% home discount) compared to past: similar 20-25% markdowns historically
    gave 18-22% uplift, but this one only achieved 8%.
  checks:
    - tool: compare_promotion_with_past_events
      args: {category: home, planned_discount_pct: 20}
      expect: ["home", "past"]

- question: "03:29:Q1"
  story: >
    Men's jackets markdown event created: 40% markdown on STY-5520 from 2026-10-19 to 2026-11-16,
    original price £65, cost £22.
  checks:
    - tool: create_markdown_event
      args: {sku: "SKU-101904", category: "apparel", markdown_depth_pct: 40, start_date: "+14d", end_date: "+42d", original_price_gbp: 65.0, cost_gbp: 22.0}
      expect: ["MDE-", "created"]

- question: "03:25:Q4"
  story: >
    Closing stock heavy in apparel: markdown review requested for category to explore options.
  checks:
    - tool: create_markdown_review_request
      args: {category: "apparel", review_reason: "End-of-season stock clearance", original_price_gbp: 45.0, cost_gbp: 15.0}
      expect: ["MDE-", "draft"]

- question: "08:77:Q1"
  story: >
    Clear overpriced products in home/kitchen: draft price change request for K-1700 from £35 to £38.50
    due to cost increase.
  checks:
    - tool: create_price_change_request
      args: {sku: "K-1700", category: "kitchenware", new_price_gbp: 38.50, change_reason: "Cost increase passthrough"}
      expect: ["PC-", "draft"]

- question: "08:77:Q2"
  story: >
    Price test on PF-220: test £32 vs control £28 across 10 stores each for 6 weeks
    to measure elasticity.
  checks:
    - tool: create_price_test
      args: {sku: "PF-220", test_price_gbp: 32.0, control_price_gbp: 28.0, test_store_count: 10, control_store_count: 10, start_date: "+7d", end_date: "+49d"}
      expect: ["PT-", "planned"]
