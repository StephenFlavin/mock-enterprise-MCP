- question: "08:77:Q1"
  story: >
    Overpriced lines: sales lost to a price gap, a draft price change for K-1700 from £70.99 to £77.99, and
    per-product elasticities in Small Appliances.
  checks:
    - tool: calculate_sales_lost_to_price_gaps
      args: {category: Cookware, price_gap_pct: 8.5, elasticity_to_price: -1.5}
      expect: ["12.8", "volume"]
    - tool: get_price_elasticity_for_products
      args: {category: "Small Appliances"}
      expect: ["K-1700", "-1.25"]
    - tool: get_price_positioning_rules_for_category
      args: {category: Cookware}
      expect: ["Cookware", "mid_market"]
    - tool: create_price_change_request
      args: {sku: "K-1700", old_price_gbp: 70.99, new_price_gbp: 66.99, change_reason: "Competitor gap"}
      expect: ["PC-", "draft", "K-1700"]
    - tool: submit_price_change_for_approval
      args: {pc_id: PC-900004}
      expect: ["submitted"]

- question: "08:77:Q2"
  story: >
    Price test on PF-220 and sample-size needs for a test.
  checks:
