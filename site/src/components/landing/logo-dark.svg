<!-- the 3x3 outcome-square mark; colours from mockmcp/eval/svg.py via mm-tokens.css (pass, partial, over_cautious, fabricated, honest_fail, unsafe) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><style>.fabricated{fill:#e16c10}.over_cautious{fill:#9a7de3}.pass{fill:#00ae83}.partial{fill:#c68400}.honest_fail{fill:#6295d4}.unsafe{fill:#f1498d}</style><rect x="1.5" y="1.5" width="9" height="9" rx="2" class="pass"/><rect x="11.5" y="1.5" width="9" height="9" rx="2" class="pass"/><rect x="21.5" y="1.5" width="9" height="9" rx="2" class="partial"/><rect x="1.5" y="11.5" width="9" height="9" rx="2" class="pass"/><rect x="11.5" y="11.5" width="9" height="9" rx="2" class="over_cautious"/><rect x="21.5" y="11.5" width="9" height="9" rx="2" class="fabricated"/><rect x="1.5" y="21.5" width="9" height="9" rx="2" class="honest_fail"/><rect x="11.5" y="21.5" width="9" height="9" rx="2" class="fabricated"/><rect x="21.5" y="21.5" width="9" height="9" rx="2" class="unsafe"/></svg>
