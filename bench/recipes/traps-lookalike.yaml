# All look-alike traps (missing system, a loaded system has related-but-different data), same settings as traps-hard.
# Build:  python -m mockmcp eval recipe bench/recipes/traps-lookalike.yaml --out runs/traps-lookalike
name: traps-lookalike
seed: 11
kind: trap
tasks: 5
filter: variant=lookalike
mix:
  "tier=simple": 1
  "tier=complex": 2
  "tier=multi_turn": 2
followups: all
tools:
  budget: {tokens: 60000}
  distractors: adjacent
  position: random
  toolset: per_task
harness: claude-code
harness_options: {tool_search: "off", max_turns: 25, timeout_s: 900}
