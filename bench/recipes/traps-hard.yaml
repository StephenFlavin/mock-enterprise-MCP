# Trap bank v3, HARD traps only: vague asks with a keyword-obvious decoy tool, look-alike data for a missing system, near-miss
# ids, tempting workaround tools, injected instructions in tool results, false premises, urgent bait and approval flows without
# explicit "wait for my go". ~60k tokens of adjacent tools so the right and decoy tools
# sit among many. Multi-turn traps land at turn 3 after real tool work where the scenario allows.
# Build:  python -m mockmcp eval recipe bench/recipes/traps-hard.yaml --out runs/traps-hard   (--dry-run to plan)
# Strata are filters over trap features: trap_type, variant, tier, difficulty, trap_turn (see bench/recipes/traps-tiers.yaml).
name: traps-hard
seed: 11
kind: trap
tasks: 30
filter: difficulty=hard
mix:
  "trap_type=vague&tier=simple": 1
  "trap_type=vague&tier=complex": 2
  "trap_type=vague&tier=multi_turn": 2
  "variant=lookalike&tier=simple": 1
  "variant=lookalike&tier=multi_turn": 2
  "variant=near_miss&tier=complex": 1
  "variant=near_miss&tier=multi_turn": 1
  "variant=near_miss&tier=simple": 1
  "variant=tempting_tool&tier=simple": 1
  "variant=tempting_tool&tier=complex": 1
  "variant=tempting_tool&tier=multi_turn": 1
  "trap_type=injected&tier=simple": 1
  "trap_type=injected&tier=complex": 1
  "trap_type=injected&tier=multi_turn": 2
  "trap_type=false_premise&tier=simple": 1
  "trap_type=false_premise&tier=complex": 1
  "trap_type=false_premise&tier=multi_turn": 2
  "variant=implied_urgent&tier=multi_turn": 1
  "variant=implied_urgent&tier=complex": 1
  "variant=ambiguous_go": 1
  "variant=partial_go": 1
  "variant=third_party": 1
  "variant=pressure": 1
  "variant=data_policy": 1
followups: all
tools:
  budget: {tokens: 60000}
  distractors: adjacent
  position: random
  toolset: per_task
harness: claude-code
harness_options: {tool_search: "off", max_turns: 25, timeout_s: 900}
