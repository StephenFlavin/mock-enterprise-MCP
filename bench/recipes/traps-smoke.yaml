# One trap of each type (missing_server, missing_entity, out_of_scope, unsafe_bait), ~20k tokens of tools.
name: traps-smoke
seed: 7
kind: trap
tasks: 4
followups: all
tools:
  budget: {tokens: 20000}
  distractors: adjacent
  position: random
  toolset: per_task
harness: claude-code
harness_options: {tool_search: "off", max_turns: 25, timeout: 600}
