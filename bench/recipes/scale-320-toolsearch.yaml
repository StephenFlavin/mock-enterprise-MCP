# scale-320 with Claude Code's tool search on (ENABLE_TOOL_SEARCH=true, --tools ToolSearch): every tool definition is
# deferred behind the ToolSearch tool and the model searches for what it needs. Same tasks and budgets as scale-320.yaml.
extends: scale-320.yaml
name: scale-320-toolsearch
harness_options: {tool_search: on, max_turns: 25, timeout_s: 900}
