# Six tasks to check the pipeline end to end: 2 simple slices, 2 multi-system scenarios with follow-ups,
# 1 write, 1 trap (skipped with a warning until bench/traps.yaml exists).
name: smoke
seed: 7
kind: any
tasks: 6
mix: {"simple&kind=slice": 2, "multi_system&followups&kind=scenario": 2, write: 1}
followups: all
traps: 1
tools:
  budget: {tokens: 20000}
  distractors: adjacent
  position: random
  toolset: per_task
harness: claude-code
harness_options: {tool_search: off, max_turns: 25, timeout_s: 600}
