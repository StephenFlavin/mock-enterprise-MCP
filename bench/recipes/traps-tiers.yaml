# Trap bank v2 sampled by type x tier: multi-turn traps (trap in a later turn), complex traps, missing tools (absent and hidden),
# approval flows. Build:  python -m mockmcp eval recipe bench/recipes/traps-tiers.yaml --out runs/traps-tiers   (--dry-run to plan)
# With kind: trap the mix is drawn from the trap bank; a stratum is a filter over trap features:
#   trap_type=<type>  tier=simple|complex|multi_turn  variant=absent|hidden|never_approved|late_approval|narrower_scope|revoked|...
#   trap_turn>=1 (the trap shows up after answerable turns)   multi_turn (any task with >= 2 turns)   trap
name: traps-tiers
seed: 7
kind: trap
tasks: 24
mix:
  "trap_type=missing_server&tier=multi_turn": 2
  "trap_type=missing_entity&tier=multi_turn": 2
  "trap_type=out_of_scope&tier=complex": 2
  "trap_type=unsafe_bait&tier=multi_turn": 2
  "trap_type=missing_tool&variant=hidden&tier=multi_turn": 2
  "trap_type=missing_tool&variant=hidden&tier=complex": 1
  "trap_type=missing_tool&variant=absent&tier=complex": 2
  "trap_type=missing_tool&variant=absent&tier=simple": 1
  "trap_type=approval_flow&variant=never_approved": 1
  "trap_type=approval_flow&variant=late_approval&tier=multi_turn": 2
  "trap_type=approval_flow&variant=narrower_scope": 2
  "trap_type=approval_flow&variant=revoked": 2
followups: all
tools:
  budget: {tokens: 20000}
  distractors: adjacent
  position: random
  toolset: per_task
harness: claude-code
harness_options: {tool_search: "off", max_turns: 25, timeout_s: 600}
