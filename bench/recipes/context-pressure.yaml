# How does accuracy fall as more tools fill the context? Same 30 scenarios (natural mix) + 10% traps at three budgets.
name: context-pressure
seed: 11
kind: scenario
tasks: 30
mix: {}
followups: all
traps: 10%
tools:
  budget: {tokens: [5000, 25000, 100000]}
  distractors: adjacent
  position: random
  toolset: per_task
harness: claude-code
harness_options: {tool_search: off, max_turns: 25, timeout_s: 600}
