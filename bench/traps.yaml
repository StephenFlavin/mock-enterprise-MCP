      notes: Inputs follow the network_design model (fixed cost 13.8m vs 9.16m, cost per unit 4.04 vs 4.55, current volume 5,000,500 units), whose
        own break-even is 9,086,655 units.
    - case_id: network_design-03:31:Q1-a
      system: network_design
