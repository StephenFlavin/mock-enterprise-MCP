        args: {}
      - tool: calculate_break_even_volume
        args:
          baseline_scenario_id: NS-000001
          alternative_scenario_id: NS-000002
      - tool: calculate_break_even_volume
        args:
          baseline_scenario_id: NS-000001
          alternative_scenario_id: NS-000002
          ecommerce_share_pct: 40
      facts:
      - '32692575'
      - '31517600'
      - '9086655'
      - '5654895'
      notes: null
    - case_id: network_design-03:31:Q1-b
