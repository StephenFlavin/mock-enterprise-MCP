    - {tool: list_products_by_regulated_category, args: {category_name: childrens_drinkware}}
  facts: ["SKU-105551", "SKU-104039", ["childrens_drinkware", "children's drinkware"]]
  notes: "Master data has no toys, so kids sleepwear and children's drinkware stand in for toys and kids' products. Recall history and regulator enforcement come from other systems."

