- id: plm-02:14:Q2
  question: "02:14:Q2"
  prompt: >
    We're launching a padded gilet with a detachable fleece liner, made in Vietnam: SKU-100952. For the customs
    classification I need to know what the shell, the liner and the padding are made of, and whether the liner is
    knitted or woven.
  ref:
    - {tool: get_product_bill_of_materials, args: {sku: SKU-100952}}
  facts: ["100% polyester", ["knit", "knitted"], "wadding", "detachable"]

- id: plm-02:14:Q5
  question: "02:14:Q5"
  prompt: >
    Style STY-6132 (SKU-102968) is a garment with fabric from China that is cut and sewn in Vietnam. What is the
    fabric made of, in which country is it made, which supplier provides it, and in which country is the garment made?
  ref:
    - {tool: get_product_bill_of_materials, args: {sku: SKU-102968}}
    - {tool: get_fabric_origin_by_style, args: {style_id: STY-6132}}
  facts: ["100% polyester", ["China", "CN"], ["Vietnam", "VN"], "SUP-0001"]

- id: plm-04:32:Q4
  question: "04:32:Q4"
  prompt: >
    SKU-102590 is our 750ml insulated bottle. Show me its bill of materials with the cost of each component, which
    parts cost the most and what share of the material cost they are, so I can see where we could change the product.
  ref:
    - {tool: get_product_bom_and_cost_breakdown, args: {sku: SKU-102590}}
  facts: ["304 stainless steel", 7.1, 56.1, "vacuum insulation"]
  notes: "Master data has no product named 750ml insulated bottle; Drinkware SKU-102590 stands in for it."

- id: plm-04:38:Q5
  question: "04:38:Q5"
  prompt: >
    Where are we exposed on IP when suppliers co-develop products with us? List our co-development projects with
    suppliers and the IP terms on each, and tell me which projects leave us exposed (the supplier owns the IP, joint
    ownership with no licence-back, terms not agreed, or ownership disputed).
  ref:
    - {tool: list_co_development_projects, args: {}}
  facts: ["CODEV-900001", "CODEV-900002", "CODEV-900004", "CODEV-900007"]

- id: plm-04:39:Q4
  question: "04:39:Q4"
  prompt: >
    We are modelling a 20% rise in polyester prices. In the Blouses category, how many products use 100% polyester
    fabric (MAT-POL-100), and which two are most exposed, measured by that fabric's share of the product's unit cost?
  ref:
    - {tool: list_products_by_material, args: {material_id: MAT-POL-100, category: Blouses}}
  facts: [13, "SKU-106125", "SKU-106132"]

- id: plm-05:42:Q1
  question: "05:42:Q1"
  prompt: >
    Seven bulk lots of the polyester blouse style STY-4012 (lots BATCH-POL-PINK-001 to BATCH-POL-PINK-007) failed
    colourfastness to rubbing. From the dye lot records for the failed lots, what colour are they, which dye houses
    processed them, and what process change do they have in common?
  ref:
    - {tool: get_dye_lot_and_process_changes_for_lots, args: {style_id: STY-4012, test_status: failed}}
  facts: ["pink", "DYES-A", "DYES-B", "reduction clearing"]

- id: plm-05:42:Q2
  question: "05:42:Q2"
  prompt: >
    A lot of trousers SKU-100651 passed everything except zip strength, which measured 4% under spec. What is the zip
    strength specification and tolerance for this product?
  ref:
    - {tool: get_product_specification_tolerances, args: {sku: SKU-100651}}
  facts: ["100 N", "95 N", "5%"]

- id: plm-05:42:Q3
  question: "05:42:Q3"
  prompt: >
    Which of our products are in the kids' sleepwear regulated category? I need how many products are affected, the
    flammability standard that applies in the UK, EU and US, and any products that rely on an exemption.
  ref:
    - {tool: list_products_by_regulated_category, args: {category_name: kids_sleepwear}}
  facts: [30, "BS 5722", "EN 14878", "16 CFR 1615", "tight-fitting"]

- id: plm-05:42:Q5
  question: "05:42:Q5"
  prompt: >
    Complaints about sole separation on shoe SKU-100301 are up over the last three months. Which material batches
    went into it, which of them failed testing, which factory made the failed ones, and what do the batch records say
    went wrong?
  ref:
    - {tool: get_material_batches_for_product, args: {sku: SKU-100301}}
  facts: ["BATCH-SHOE-002", "BATCH-SHOE-003", "BATCH-SHOE-004", "FAC-0070", "primer"]

- id: plm-05:44:Q1
  question: "05:44:Q1"
  prompt: >
    Our children's 350ml insulated bottles are SKU-102590, SKU-104123, SKU-104795 and SKU-105551. What do the product
    specifications say about each bottle's straw tip, age warning, exterior finish and test evidence, so I can flag
    which might not comply?
  ref:
    - {tool: get_product_specifications, args: {sku: SKU-102590, spec_type: test_requirements}}
    - {tool: get_product_specifications, args: {sku: SKU-104123, spec_type: test_requirements}}
    - {tool: get_product_specifications, args: {sku: SKU-104795, spec_type: test_requirements}}
    - {tool: get_product_specifications, args: {sku: SKU-105551, spec_type: test_requirements}}
  facts: ["removable", "none on pack", "none on file", "lead 120 mg/kg"]

- id: plm-05:44:Q2
  question: "05:44:Q2"
  prompt: >
    Leather bag SKU-101813 failed the chromium VI test and its leather came from batch BATCH-LEATHER-002. Trace it:
    who supplies the leather and where, what do the batch records say about the tannery and any subcontractor, and
    which other products used the same batch?
  ref:
    - {tool: get_bill_of_materials_with_suppliers, args: {sku: SKU-101813}}
    - {tool: get_material_batch_traceability, args: {batch_id: BATCH-LEATHER-002}}
    - {tool: list_products_using_material, args: {batch_id: BATCH-LEATHER-002}}
  facts: ["Holt Apparel Group", "FAC-0131", "SKU-103199", "SKU-103745"]

- id: plm-05:44:Q3
  question: "05:44:Q3"
  prompt: >
    Across our regulated product categories, which products have a non-compliant status, and which regulated category
    covers the most of our products?
  ref:
    - {tool: list_products_by_regulated_category, args: {}}
  facts: ["SKU-105551", "SKU-104039", "SKU-101813", "battery_products"]
