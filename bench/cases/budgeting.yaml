- id: budgeting-02:13:Q4-a
  question: "02:13:Q4"
  prompt: >
    Air freight at the Transport cost centre CC-2124 keeps running over because suppliers are late. What did we spend
    on air freight each month over the last year against budget, what did last year's peak (November and December)
    cost, and what is the peak season air freight budget set at now? Then raise the peak season air freight budget
    line to £450,000.
  ref:
    - {tool: get_historical_air_freight_spend, args: {cost_centre_id: CC-2124, period_from: -12m}}
    - {tool: update_budget_line, args: {budget_line_id: BL-900101, value_gbp: 450000}}
  facts: [162000, 171000, 300000, 450000]

