- id: web_analytics-03:23:Q2
  question: "03:23:Q2"
  prompt: >
    We are launching a new recycled-polyester backpack range in January and I need the demand signal from search.
    How has search volume for "backpack" and for "recycled polyester" moved week by week over the last two months,
    and what is the latest weekly volume for "recycled polyester backpack"?
  ref:
    - {tool: get_search_trend_data, args: {search_term: backpack, date_from: -60d}}
    - {tool: get_search_trend_data, args: {search_term: recycled polyester, date_from: -60d}}
  facts: ["22000", "12000", "16800", "8500", "3900"]

- id: web_analytics-03:25:Q5
  question: "03:25:Q5"
  prompt: >
    Our new athleisure style STY-4056 is 20% behind plan on sell-through. What marketing support did it get since
    launch: which campaigns ran, what did each spend and convert, did any end early, and is anything running now?
  ref:
    - {tool: get_marketing_activity_for_range, args: {range_id: STY-4056, date_from: -120d}}
  facts: ["5760", "4680", ["ended early", "ended_early", "cut short"], "588"]

- id: web_analytics-05:49:Q4
  question: "05:49:Q4"
  prompt: >
    Why aren't customers using our resale programme? Show me the weekly funnel for the last three months: how many
    people reach the resale pages, how many go on to add to cart, check out and buy, and what share of site sessions
    the resale pages get.
  ref:
    - {tool: get_resale_programme_funnel_metrics, args: {date_from: "2026-07-13"}}
  facts: ["3800", "8900", "10.5", ["0.69", "0.7"]]

- id: web_analytics-08:74:Q1-a
  question: "08:74:Q1"
  prompt: >
    Conversion on the website fell about 0.4 points last week. Did mobile and desktop move differently? Look at daily
    conversion by device for last week against the week before, and tell me which device fell and from which day.
  ref:
    - {tool: get_conversion_rate_by_device_and_day, args: {date_from: "2026-09-21", date_to: "2026-10-04"}}
  facts: ["mobile", ["2026-09-30", "2026-10-01"], ["1.38", "1.39", "1.4"]]

- id: web_analytics-08:74:Q1-b
  question: "08:74:Q1"
  prompt: >
    Did our traffic mix change last week compared with the week before? Which channel gained the most share of
    sessions and how did conversion move by channel?
  ref:
    - {tool: get_traffic_mix_by_channel, args: {date_from: "2026-09-28", date_to: "2026-10-04"}}
  facts: ["paid", "27.3", "23.2", "email"]

- id: web_analytics-08:74:Q1-c
  question: "08:74:Q1"
  prompt: >
    Conversion fell about 0.4 points last week. Compared with the week before, how many orders and how much revenue
    did we lose from the drop, in total and for mobile?
  ref:
    - {tool: calculate_lost_revenue_from_conversion_drop, args: {date_from: "2026-09-28", date_to: "2026-10-04"}}
  facts: ["2142", "105541", "1678", "73588"]

- id: web_analytics-08:74:Q2-a
  question: "08:74:Q2"
  prompt: >
    What does the traffic forecast say for each day from Black Friday to Christmas Eve? On which day is traffic
    highest, and how many sessions and web orders are forecast that day?
  ref:
    - {tool: get_traffic_forecast_for_peak, args: {date_from: "2026-11-27", date_to: "2026-12-24"}}
  facts: [["2026-11-27", "Black Friday"], "221499", "7571"]

- id: web_analytics-08:74:Q2-b
  question: "08:74:Q2"
  prompt: >
    What if traffic comes in 15% above the forecast on Black Friday itself? Give me the sessions and web orders for
    that day.
  ref:
    - {tool: get_traffic_forecast_for_peak, args: {date_from: "2026-11-27", date_to: "2026-11-27", traffic_uplift_pct: 15}}
  facts: ["254724", "8707"]

- id: web_analytics-08:74:Q3
  question: "08:74:Q3"
  prompt: >
    Which postcode areas get the best conversion lift from offering next-day delivery over the last 60 days? Rank
    the best ten by lift in points over standard delivery.
  ref:
    - {tool: get_conversion_by_delivery_option, args: {date_from: -60d}}
  facts: ["LS1", "G1", "NG1", "L1", "LE1"]

- id: web_analytics-08:78:Q1
  question: "08:78:Q1"
  prompt: >
    Why did the weekend home event (20% off) underperform? Marketing say it was the creative. How did the creative
    variants for the Weekend Home Event do, which was best, and how does its click-through and conversion compare
    with the earlier events?
  ref:
    - {tool: get_campaign_creative_performance, args: {date_from: -365d}}
  facts: ["image", "270", "3.77", "2.8", "3.13"]
