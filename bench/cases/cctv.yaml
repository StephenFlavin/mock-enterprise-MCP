- id: cctv-07:68:Q5
  question: "07:68:Q5"
  prompt: >
    Shrink at the Leeds Shopping Centre store ST150 has tripled over the last few weeks. From the incident logs for
    the last two months, is this looking like internal theft or process error? Give the type, severity and
    estimated loss of what was logged.
  ref:
    - {tool: search_cctv_incident_logs, args: {site_id: ST150, date_from: -60d}}
  facts: ["internal theft", "critical", "4800", "process error"]

- id: cctv-08:79:Q1
  question: "08:79:Q1"
  prompt: >
    For the UK North region, which stores have high or critical severity incidents in the incident logs over the
    last six months? Tell me the incident type and estimated loss for each, and which store shows the strongest
    internal theft signal.
  ref:
    - {tool: search_cctv_incident_logs, args: {region: UK North, severity: high, date_from: -180d}}
  facts: ["ST150", "ST159", "ST183", "internal theft", "4800"]

- id: cctv-08:79:Q5
  question: "08:79:Q5"
  prompt: >
    Self-checkout shrink is up at five Leeds stores: ST150, ST159, ST165, ST181 and ST183. From the CCTV exception
    events over the last 30 days, which stores show scanner faults on specific self-checkout units and which show
    customers deliberately bypassing the scanner?
  ref:
    - {tool: get_cctv_exception_events_for_store, args: {site_id: ST150}}
    - {tool: get_cctv_exception_events_for_store, args: {site_id: ST159}}
    - {tool: get_cctv_exception_events_for_store, args: {site_id: ST165}}
    - {tool: get_cctv_exception_events_for_store, args: {site_id: ST181}}
    - {tool: get_cctv_exception_events_for_store, args: {site_id: ST183}}
  facts: ["unit 5", "unit 1", "ST165", "ST183", "working normally"]
