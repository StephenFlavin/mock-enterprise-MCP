- id: ml_platform-09:82:Q1
  question: "09:82:Q1"
  prompt: >
    I want to build a model to predict ocean transit time variability on our main lanes. Which features do we
    already hold in the feature store for ocean transit times, carrier ETA accuracy and port congestion, and how
    often is each refreshed?
  ref:
    - {tool: list_feature_store_features, args: {}}
  facts: ["Ocean transit times by lane", "Carrier ETA vs actual variance", "Port delay indicators", ["24 hours", "24"]]

- id: ml_platform-09:82:Q2-a
  question: "09:82:Q2"
  prompt: >
    Our demand model MOD-demand has been getting worse for about three months and planners have stopped trusting it.
    How have its accuracy and feature drift moved over that time, and what training datasets could we retrain it on?
  ref:
    - {tool: get_model_accuracy_history, args: {model_id: MOD-demand}}
    - {tool: get_feature_drift_report, args: {model_id: MOD-demand}}
    - {tool: get_model_training_dataset_summary, args: {model_id: MOD-demand}}
  facts: ["85.2", "76.4", "28.6", "v2.2"]

- id: ml_platform-09:82:Q2-b
  question: "09:82:Q2"
  prompt: >
    Go ahead and start a retraining run for MOD-demand on the newest dataset, v2.2.
  ref:
    - {tool: submit_model_retraining_job, args: {model_id: MOD-demand, dataset_version: v2.2}}
  facts: ["v2.2", "scheduled"]

- id: ml_platform-09:82:Q3
  question: "09:82:Q3"
  prompt: >
    We backtested candidate model MOD-demand-v3 against the current MOD-demand model. What accuracy did each get,
    what uplift does the candidate give, what is the estimated benefit and what is the recommendation?
  ref:
    - {tool: get_model_backtest_results, args: {candidate_model_id: MOD-demand-v3, current_model_id: MOD-demand}}
  facts: ["85", "79.5", "6.92", "195000", "deploy"]

- id: ml_platform-09:82:Q5-a
  question: "09:82:Q5"
  prompt: >
    Are our production models OK? Give me each model's current accuracy and drift, and tell me which need retraining
    soonest.
  ref:
    - {tool: get_model_health_summary, args: {}}
    - {tool: list_model_retraining_schedule, args: {}}
  facts: ["MOD-demand", "76.4", "28.6", ["8 days", "in 8"]]

- id: ml_platform-09:82:Q5-b
  question: "09:82:Q5"
  prompt: >
    Model MOD-churn has no drift alert. Set one up with a threshold of 15.
  ref:
    - {tool: create_model_alert_rule, args: {model_id: MOD-churn, rule_type: drift, threshold: 15}}
  facts: ["drift", "15"]

- id: ml_platform-09:82:Q5-c
  question: "09:82:Q5"
  prompt: >
    The drift alert on the pricing model is too noisy. Remove alert rule RULE-900003.
  ref:
    - {tool: delete_model_alert_rule, args: {alert_rule_id: RULE-900003}}
  facts: [["Deleted", "removed"]]

- id: ml_platform-09:82:Q6
  question: "09:82:Q6"
  prompt: >
    I'm planning a model to predict supplier delay risk at PO level. What features does the feature store already
    hold for PO history, ASN timeliness, payment history and weather at ports, and which of those is not used by any
    model yet?
  ref:
    - {tool: list_feature_store_features, args: {}}
  facts: ["PO line characteristics and outcomes", "ASN submission and delivery timing", "Payment terms and history by supplier", "Weather events at origin ports and factory regions"]
