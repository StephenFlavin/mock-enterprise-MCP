- id: wms-01:4:Q1-a
  question: "01:4:Q1"
  prompt: >
    The count for bay C-14 at Northampton DC (DC1) was way off on Tuesday. Look at what the system says is in the bay, the
    count results, and the last 90 days of movements for the bay. Is it one SKU or several, and what do the movements show
    went wrong?
  ref:
    - {tool: get_location_inventory_balance, args: {location_id: DC1-C-14}}
    - {tool: list_cycle_count_results_for_location, args: {location_id: DC1-C-14, date_from: -90d}}
    - {tool: get_stock_movements_for_location, args: {location_id: DC1-C-14, date_from: -90d}}
  facts: ["SKU-100084", "DC1-C-14-02", "-24", "wrong bin", "not scanned"]

- id: wms-01:4:Q1-b
  question: "01:4:Q1"
  prompt: >
    Put a hold on bin DC1-C-14-02 at DC1 with the reason "Awaiting recount", and create a recount task for that bin.
  ref:
    - {tool: block_location, args: {location_id: DC1-C-14-02, site_id: DC1, reason: Awaiting recount}}
    - {tool: create_cycle_count_task, args: {location_id: DC1-C-14-02, site_id: DC1, reason: Recount after variance}}
  facts: ["DC1-C-14-02", "awaiting recount"]

- id: wms-01:4:Q2
  question: "01:4:Q2"
  prompt: >
    At Northampton DC (DC1), look at the cycle count corrections over 500 pounds in value from the last 16 weeks. Which cause
    code is being used as a catch-all and which shift and zone is it coming from, and which corrections were reversed within
    48 hours so should be excluded (give their bins)?
  ref:
    - {tool: list_cycle_count_corrections, args: {site_id: DC1, min_value_gbp: 500, date_from: -112d}}
    - {tool: get_cause_code_definitions, args: {}}
  facts: ["other", "night", "mezzanine", "DC1-A-03-01", "DC1-A-03-02", "DC1-B-02-01"]

- id: wms-01:4:Q3-a
  question: "01:4:Q3"
  prompt: >
    I have three days of counting capacity this week at Northampton DC (DC1). Which bins should I count first? I want high
    value and historically inaccurate, but skip anything counted in the last month. Give me the top three.
  ref:
    - {tool: list_locations_by_last_count_date, args: {site_id: DC1, days_since_count: 30, min_value_gbp: 100000}}
    - {tool: calculate_count_priority_score, args: {site_id: DC1}}
  facts: ["DC1-F-13-04", "DC1-B-21-02", "DC1-A-28-02"]

- id: wms-01:4:Q3-b
  question: "01:4:Q3"
  prompt: >
    Release count task CCT-900101 to the handhelds. Then drop the aisle D counts from my list by reassigning the planned counts
    CCT-900105 and CCT-900106 to employee EMP-00136.
  ref:
    - {tool: release_cycle_count_tasks, args: {task_id: CCT-900101}}
    - {tool: reassign_cycle_count_task, args: {task_id: CCT-900105, assigned_to: EMP-00136}}
    - {tool: reassign_cycle_count_task, args: {task_id: CCT-900106, assigned_to: EMP-00136}}
  facts: ["CCT-900101", "CCT-900105", "CCT-900106", "EMP-00136"]
  notes: "The question asks to give the counts to Priya but master employees has nobody of that name, so the case uses an employee id. 'Zone D' is taken as aisle D (master zones are pick, reserve, bulk, mezzanine, hazmat)."

- id: wms-01:4:Q4
  question: "01:4:Q4"
  prompt: >
    Compare goods receipts to the supplier ASNs for the last 8 weeks across all our DCs. Is one supplier or carrier responsible
    for most of the negative variances, and is it short-shipping or our own receiving?
  ref:
    - {tool: compare_receipts_to_asns, args: {group_by: supplier, date_from: -56d}}
    - {tool: compare_receipts_to_asns, args: {group_by: carrier, date_from: -56d}}
    - {tool: compare_receipts_to_asns, args: {variance: short, date_from: -56d}}
  facts: ["SUP-0072", "PO-2026-005321", "PO-2026-005133", "424", "395", "seal intact"]

- id: wms-01:4:Q5
  question: "01:4:Q5"
  prompt: >
    Where will stock accuracy be worst going into peak at Northampton DC (DC1)? Use the last four quarters of cycle count
    results by zone, so I know where to put the extra counting time and which zones I can leave alone.
  ref:
    - {tool: get_stock_accuracy_trend_by_zone, args: {site_id: DC1, quarters: 4}}
  facts: ["mezzanine", "85.9", ["deteriorating", "falling", "declining", "worsening"]]

- id: wms-01:6:Q1
  question: "01:6:Q1"
  prompt: >
    Cost per unit shipped at Northampton DC (DC1) has gone up. Compare the four complete weeks ending the week before last with
    the four weeks before that: how did units shipped and orders shipped change, and did the share of single-unit orders move?
  ref:
    - {tool: get_units_shipped_by_period, args: {site_id: DC1, date_from: "2026-08-31", date_to: "2026-09-27", period: all}}
    - {tool: get_units_shipped_by_period, args: {site_id: DC1, date_from: "2026-08-03", date_to: "2026-08-30", period: all}}
    - {tool: get_order_line_profile, args: {site_id: DC1, date_from: "2026-08-31", date_to: "2026-09-27", period: all}}
    - {tool: get_order_line_profile, args: {site_id: DC1, date_from: "2026-08-03", date_to: "2026-08-30", period: all}}
  facts: ["1241", "1106", "38.4", "37.9"]
  notes: "The follow-up about last September cannot be answered: master orders only start in June, so WMS has no shipped history for the previous year."

- id: wms-01:6:Q2
  question: "01:6:Q2"
  prompt: >
    Will we run out of pallet positions this autumn at Northampton DC (DC1)? Give me occupancy for the whole building and by
    zone, how many weeks until it is full at the current growth, and which product categories are driving it.
  ref:
    - {tool: get_storage_capacity_by_zone, args: {site_id: DC1}}
    - {tool: get_pallet_positions_by_category, args: {site_id: DC1}}
  facts: ["90.2", "7.4", "Small Appliances", "Smart Home"]

- id: wms-01:6:Q5
  question: "01:6:Q5"
  prompt: >
    Store service level fell over the last three weeks. From the Northampton DC (DC1) warehouse side, is the process breaking in
    picking, loading or wave release, which stores took the hit, and what configuration change went in three weeks ago?
  ref:
    - {tool: list_short_picks_by_stage, args: {site_id: DC1, date_from: "2026-08-24", date_to: "2026-10-04", group_by: week}}
    - {tool: list_short_picks_by_stage, args: {site_id: DC1, date_from: "2026-09-14", date_to: "2026-10-04", group_by: store}}
    - {tool: list_recent_configuration_changes, args: {site_id: DC1, date_from: "2026-08-24"}}
  facts: ["loading", "ST159", "ST150", "ST183", "wave template"]

- id: wms-01:8:Q1-a
  question: "01:8:Q1"
  prompt: >
    140 orders have been stuck in allocation failed since 6am. What do the affected SKUs have in common, and is it a data
    issue, a configuration change or an interface failure?
  ref:
    - {tool: list_orders_by_status, args: {status: allocation_failed}}
    - {tool: list_allocation_failure_reasons, args: {}}
    - {tool: list_recent_configuration_changes, args: {date_from: -7d}}
  facts: ["SUP-0013", "PF-220", "K-1700", "inner pack", "pack specification"]

- id: wms-01:8:Q1-b
  question: "01:8:Q1"
  prompt: >
    Retry the allocation for stuck order ORD-2026-0114544 now that the pack specification issue is understood.
  ref:
    - {tool: retry_order_allocation, args: {order_id: ORD-2026-0114544, notes: Pack specification corrected}}
  facts: ["ORD-2026-0114544"]

- id: wms-01:8:Q2
  question: "01:8:Q2"
  prompt: >
    ERP shows 150 more units of SKU-100007 at Northampton DC (DC1) than WMS. Show me how WMS holds that SKU by inventory
    status to explain it, and which SKU pairs at DC1 are picked together often enough to sit side by side.
  ref:
    - {tool: get_wms_stock_by_sku, args: {sku: SKU-100007, site_id: DC1}}
    - {tool: get_pick_affinity_pairs, args: {site_id: DC1}}
  facts: ["quarantine", "150", "SKU-103157", "SKU-103164"]

- id: wms-01:8:Q3
  question: "01:8:Q3"
  prompt: >
    We're on WMS version 9.2 and getting duplicate task creation after replenishment at Northampton DC (DC1). Which patch
    fixes it, what should we test before applying it, which build are we on, and how many duplicate task pairs have we had
    in the last 90 days?
  ref:
    - {tool: get_wms_version_and_patches, args: {contains: duplicate}}
    - {tool: get_wms_version_and_patches, args: {status: current}}
    - {tool: list_replenishment_task_duplicates, args: {site_id: DC1, date_from: -90d}}
  facts: ["9.2.7", "9.2.4", "50 concurrent receipts", ["12", "twelve"]]

- id: wms-01:10:Q5
  question: "01:10:Q5"
  prompt: >
    Robot throughput at Northampton DC (DC1) drops every afternoon. Over the last six weeks, does the order mix by hour change
    between 2pm and 4pm, in lines per order or zone split, compared with the rest of the day?
  ref:
    - {tool: get_order_mix_by_hour, args: {site_id: DC1, date_from: -42d}}
  facts: ["1.4"]

- id: wms-01:8:Q4
  question: "01:8:Q4"
  prompt: >
    ERP and WMS don't agree on stock and finance is asking about a gap of around 1.2 million pounds. From the WMS side,
    how much stock is sitting in statuses that WMS leaves out of available stock but that ERP still counts, what is it
    worth in total, which SKU and DC make up the most of it, and how does the status mapping treat quarantine stock?
  ref:
    - {tool: get_wms_stock_by_sku, args: {status: held}}
    - {tool: get_inventory_status_mapping, args: {}}
  facts: ["1204615", "SKU-100819", "DC3", "quarantine", "quality release"]

- id: wms-01:8:Q5
  question: "01:8:Q5"
  prompt: >
    We want to move e-commerce at Daventry (DC2) from wave picking to continuous batching. What is the current e-commerce
    wave setup there: release times, order cut-off, waves per day and orders per wave?
  ref:
    - {tool: get_wave_configuration, args: {site_id: DC2, channel: ecommerce}}
  facts: ["06:00", "10:00", "13:00", "15:00", "29"]

- id: wms-02:14:Q7
  question: "02:14:Q7"
  prompt: >
    Over the last four months, how many units and what value at cost did our UK DCs ship on to Ireland and to the EU
    countries, by destination, and how much of it was non-UK-origin goods?
  ref:
    - {tool: get_reexport_volumes_by_destination, args: {date_from: -120d}}
  facts: ["6713", "160345.84", "16407", "4309", "76.5"]

- id: wms-03:22:Q1
  question: "03:22:Q1"
  prompt: >
    SKU-101904 (style 5520) stocked out in 40 stores for nine days last month. What receipts have we had for it over the
    last year, and how much stock did the DCs hold each day over the last 60 days: was there stock at a DC while the
    stores were out?
  ref:
    - {tool: get_goods_receipts_for_product, args: {sku: SKU-101904, date_from: -400d}}
    - {tool: get_dc_stock_history_for_product, args: {sku: SKU-101904, date_from: -60d}}
  facts: ["2807", "193", "DC1", "4282"]

- id: wms-03:22:Q4-a
  question: "03:22:Q4"
  prompt: >
    About 13,000 units of the seasonal throw SKU-104963 sit in our DCs. How many units are at each DC and which DC holds the most?
  ref:
    - {tool: get_dc_stock_for_product, args: {sku: SKU-104963}}
  facts: ["DC2", "5184", "DC4", "4651"]
  notes: "The question says 14,000 units of a seasonal throw; master has no throw and its dc_stock holds about 13,000 units of the closest seasonal bedding SKU-104963 (same SKU the ims case uses)."

- id: wms-03:22:Q4-b
  question: "03:22:Q4"
  prompt: >
    Create a transfer of 200 units of SKU-104963 from Daventry DC2 to northern store ST145, reason rebalance.
  ref:
    - {tool: create_stock_transfer, args: {from_site_id: DC2, to_site_id: ST145, sku: SKU-104963, qty_requested: 200, reason: rebalance}}
  facts: ["ST145", "200", "DC2"]

- id: wms-03:22:Q5
  question: "03:22:Q5"
  prompt: >
    Our out-of-stock rate is up and supplier SUP-0013 looks like a big part of it. Over the last nine weeks, which of its
    deliveries into our DCs arrived late, at which DC, and how late was the worst?
  ref:
    - {tool: get_dc_inbound_delays, args: {supplier_id: SUP-0013, date_from: -63d, days_late_threshold: 1}}
  facts: ["PO-2026-004443", "DC2", "18"]

- id: wms-03:25:Q5
  question: "03:25:Q5"
  prompt: >
    Move 30 units of SKU-100084 (athleisure style STY-4056, size 14) from our weakest store ST201 to our strongest store
    ST143, reason rebalance.
  ref:
    - {tool: create_stock_transfer, args: {from_site_id: ST201, to_site_id: ST143, sku: SKU-100084, qty_requested: 30, reason: rebalance}}
  facts: ["ST201", "ST143", "30"]

- id: wms-03:29:Q2
  question: "03:29:Q2"
  prompt: >
    SKU-104277 is going to outlet. Create an outlet transfer of 800 units from Leeds DC3 to Sheffield Outlet ST154.
  ref:
    - {tool: create_stock_transfer, args: {from_site_id: DC3, to_site_id: ST154, sku: SKU-104277, qty_requested: 800, reason: outlet}}
  facts: ["DC3", "ST154", "800", "outlet"]

- id: wms-03:31:Q4
  question: "03:31:Q4"
  prompt: >
    Looking for underused sites in the network: what share of bin locations is occupied at each DC, and which DC is the
    most underused compared with the others?
  ref:
    - {tool: get_dc_utilisation, args: {group_by: site}}
  facts: ["DC3", "55.3", "88.5", "81.1"]

- id: wms-04:40:Q1
  question: "04:40:Q1"
  prompt: >
    For small appliance SKU-100532, compare its corrugated, moulded pulp and recycled plastic pack options on units per
    pallet, and how many pallets a year each needs at 400,000 units a year.
  ref:
    - {tool: calculate_pallet_fill_by_pack_spec, args: {sku: SKU-100532, annual_units: 400000}}
  facts: ["250", "200", "400", "1600", "2000", "1000"]

- id: wms-04:40:Q3
  question: "04:40:Q3"
  prompt: >
    Breakage claims on glass small appliances are up 40%. Over the last 90 days, how many units did our own warehouse
    handling damage reports log on Small Appliances, at which process stages, and is it rising week to week?
  ref:
    - {tool: get_warehouse_handling_damage_reports, args: {category: Small Appliances, date_from: -90d, group_by: stage}}
    - {tool: get_warehouse_handling_damage_reports, args: {category: Small Appliances, date_from: -90d, group_by: week}}
  facts: ["picking", "24", "putaway", "12", ["flat", "stable", "not rising", "no rise", "steady"]]

- id: wms-07:67:Q4
  question: "07:67:Q4"
  prompt: >
    For a bonded warehouse, how much of our on-hand stock is suitable (non-UK origin, non-hazmat) at each DC: units,
    pallets and value at cost? Which DC holds the most?
  ref:
    - {tool: get_bonded_warehouse_volumes, args: {group_by: site}}
  facts: ["DC2", "30397361.13", "2148", "DC1", "1909"]
