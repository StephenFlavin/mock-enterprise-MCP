- id: pim-05:49:Q6-a
  question: "05:49:Q6"
  prompt: >
    We're preparing for the upcoming textile EPR rules in the UK, France and the Netherlands. Which of the product data
    fields needed for EPR reporting (weights, materials, recyclability and so on) do we hold in our product data, and
    which don't we hold?
  ref:
    - {tool: get_available_epr_reporting_data_fields, args: {category: Textiles}}
  facts: ["Unit Weight", "Material Composition", "Recyclability", "Recycled Content", "End-of-life Pathway"]

- id: pim-06:52:Q6-a
  question: "06:52:Q6"
  prompt: >
    We are designing outdoor clothing for 25 to 34 year olds. Which of our current Outerwear products are waterproof?
  ref:
    - {tool: list_products_by_attribute_in_category, args: {category: Outerwear, attribute_filter: "Waterproof:true"}}
  facts: ["SKU-101358", "SKU-105544", "SKU-102870", "SKU-100161"]

- id: pim-06:59:Q1-a
  question: "06:59:Q1"
  prompt: >
    Marketplaces keep rejecting our small appliance listings (K-1700 is one of them). Across all our Small Appliances
    products, which mandatory product fields are most commonly missing? Then draft the correction file so I can check
    it, and tell me which fixes can be done in bulk.
  ref:
    - {tool: get_pim_attribute_completeness, args: {category: Small Appliances}}
    - {tool: draft_bulk_attribute_correction_file, args: {category: Small Appliances}}
  facts: ["WEEE Registration Number", "Voltage & Wattage", "Colour", "Weight"]

- id: pim-06:59:Q1-b
  question: "06:59:Q1"
  prompt: >
    I've checked the correction file. Fix the missing Weight for SKU-100539 (Black Small Appliance) by applying the value
    from the file, 0.76 (kg).
  ref:
    - {tool: get_pim_attributes_for_product, args: {sku: SKU-100539}}
    - {tool: update_pim_attributes_in_bulk, args: {sku: SKU-100539, attribute_id: ATTR-137, value: "0.76"}}
  facts: ["0.76"]

- id: pim-06:59:Q2-a
  question: "06:59:Q2"
  prompt: >
    We want to list our home appliances (the Small Appliances category) on marketplaces in Germany and France. How
    complete is our product data for them today, and which mandatory fields would we need to add to our current listings?
  ref:
    - {tool: get_pim_attribute_completeness_by_category, args: {category: Small Appliances}}
  facts: ["43", "WEEE Registration Number", "Voltage & Wattage", "Energy Rating"]

- id: pim-06:59:Q3-a
  question: "06:59:Q3"
  prompt: >
    Our product attributes for the Home category are a mess and every channel wants something different. What attribute
    structure do we have for Home today, what is the first thing to fix, and what would a unified structure with the
    marketplace fields mapped look like?
  ref:
    - {tool: get_pim_taxonomy_and_attributes, args: {category: Home}}
    - {tool: draft_attribute_taxonomy_proposal, args: {category: Home}}
  facts: ["Dimensions", "Height x Diameter", ["65.2", "65%"], "Country of Origin"]

- id: pim-06:59:Q3-b
  question: "06:59:Q3"
  prompt: >
    How long would it take to migrate the Home category to a unified attribute structure, and what would the migration
    involve?
  ref:
    - {tool: calculate_migration_effort_for_taxonomy, args: {category: Home}}
  facts: ["19", ["about 4 weeks", "4 weeks"], "11", "12"]

- id: pim-06:59:Q3-c
  question: "06:59:Q3"
  prompt: >
    Create the first attribute group for the Home category so we can start. Call it Home_Core_v2, described as
    "Unified core attributes for home products".
  ref:
    - {tool: create_pim_attribute_group, args: {name: Home_Core_v2, category: Home, description: "Unified core attributes for home products"}}
  facts: ["Home_Core_v2"]

- id: pim-06:59:Q4-a
  question: "06:59:Q4"
  prompt: >
    Customers keep returning cookware SKU-100805 saying it isn't suitable for their induction hob. What does our product
    data say about its heat source compatibility, and how reliable is that data?
  ref:
    - {tool: get_pim_attributes_for_product, args: {sku: SKU-100805}}
  facts: ["All hobs incl. induction", "55", "marketplace"]

- id: pim-06:60:Q7-a
  question: "06:60:Q7"
  prompt: >
    Review our recycled content claims. Which recycled content claims do we make, and which of them fall short of valid
    certificate backing (no certificate, an expired certificate, or a certified percentage lower than the claimed one)?
  ref:
    - {tool: list_product_claims, args: {claim_type: recycled_content}}
  facts: ["SKU-100161", "SKU-100427", "SKU-100700", "K-1700"]

- id: pim-06:60:Q7-b
  question: "06:60:Q7"
  prompt: >
    The recycled polyester claim on SKU-100161 is certified for only 70%, so change its wording to say 70% recycled
    polyester (GRS certified). Also remove the recycled ocean plastic claim from SKU-100700, because it has no
    certificate.
  ref:
    - {tool: list_product_claims, args: {sku: SKU-100161}}
    - {tool: update_product_claim, args: {claim_id: CLM-900002, claim_text: "Made with 70% recycled polyester (GRS certified)", claimed_pct: 70}}
    - {tool: list_product_claims, args: {sku: SKU-100700}}
    - {tool: remove_product_claim, args: {claim_id: CLM-900004}}
  facts: ["70% recycled polyester", "CLM-900004"]

- id: pim-08:80:Q3-a
  question: "08:80:Q3"
  prompt: >
    We're thinking of selling in Japan, where compact sizing matters. Which of our product categories fit the Japanese
    market best, and what would we need to change for the ones that don't fit?
  ref:
    - {tool: compare_range_fit_to_market, args: {target_market: Japan}}
  facts: ["Cookware", ["92.3", "92%"], "100V", ["1.2 L", "1.2L", "1.2 litre"]]
