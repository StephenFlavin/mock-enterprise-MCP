- id: slotting-01:4:Q2
  question: "01:4:Q2"
  prompt: >
    Stock adjustments at DC1 clustered in certain zones last quarter. What layout changes went live at DC1 in the
    last 90 days, which zones and aisles did each affect, and when? I want to see whether the August change lines up.
  ref:
    - {tool: list_layout_changes, args: {site_id: DC1, effective_from: -100d}}
  facts: ["2026-08-31", "DC1-PICK-A", "DC1-PICK-B", "DC1-RESERVE-A", "2026-07-20"]

- id: slotting-01:8:Q2
  question: "01:8:Q2"
  prompt: >
    How long would a re-slot of about 30% of the active locations at DC1 take with a crew of six, how many moves
    and labour hours is that in total, and can it be done in phases by zone?
  ref:
    - {tool: calculate_reslotting_effort, args: {site_id: DC1, move_pct: 30, crew_size: 6}}
  facts: ["2429", "214.5", "4.8", "DC1-PICK-A"]

- id: slotting-01:9:Q3
  question: "01:9:Q3"
  prompt: >
    Forklift-pedestrian near misses at DC1 went up this quarter. What layout changes has DC1 had in the last 90
    days, which aisles did they touch, and is any aisle still being relaid?
  ref:
    - {tool: list_layout_changes, args: {site_id: DC1, effective_from: -100d}}
  facts: ["2026-07-20", "2026-08-31", "aisle 7", ["in progress", "in_progress"]]

- id: slotting-01:9:Q4
  question: "01:9:Q4"
  prompt: >
    We are weighing pedestrian exclusion zones, proximity sensors and speed limiters at DC1. How big is the site
    in aisles and crossing points, how many are forklift-pedestrian crossings, and how many crossing points
    already have proximity sensors or speed limiters?
  ref:
    - {tool: get_site_layout_summary, args: {site_id: DC1}}
  facts: ["14", "7", "5", "2"]

- id: slotting-09:87:Q5
  question: "09:87:Q5"
  prompt: >
    The Northampton DC (DC1) cost per unit is 18% above the network average. Is the layout part of the reason?
    Show its pick zone space utilisation, travel distance and congestion over the last 30 days against the average
    of all DCs.
  ref:
    - {tool: get_dc_layout_utilisation, args: {site_id: DC1}}
  facts: ["88.8", "89.8", "79", "54.3", "73"]

- id: slotting-09:88:Q2
  question: "09:88:Q2"
  prompt: >
    Productivity at Daventry (DC2) is well below the other DCs. Does the layout explain it? Compare its pick zone
    utilisation, travel distance and picks per hour over the last 30 days with the all-DC average.
  ref:
    - {tool: get_dc_layout_utilisation, args: {site_id: DC2}}
  facts: ["67.9", "79", "42", "55.7", "59"]
