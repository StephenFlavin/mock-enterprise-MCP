- id: kpi-05:49:Q5
  question: "05:49:Q5"
  prompt: >
    For the circular economy numbers: how do this year's units collected (KPI-0011) and value recovered
    (KPI-0012) compare with last year and with the annual target? Give me the percentage change on last year.
  ref:
    - {tool: calculate_year_on_year_change, args: {kpi_id: KPI-0011}}
    - {tool: calculate_year_on_year_change, args: {kpi_id: KPI-0012}}
    - {tool: get_circularity_targets, args: {}}
  facts: ["49400", "23.2", "245000", "28.9", "260000"]

- id: kpi-09:81:Q3-a
  question: "09:81:Q3"
  prompt: >
    What are the targets and alert thresholds for our service KPIs? I want to see which ones have the
    least headroom before they alert.
  ref:
    - {tool: get_kpi_targets, args: {domain: service}}
  facts: ["95.5", "850", "85.95", "ALT-000001"]

- id: kpi-09:81:Q3-b
  question: "09:81:Q3"
  prompt: >
    OTIF (KPI-0001) is most likely to miss target next month. Tighten its red alert threshold to 92.
  ref:
    - {tool: get_kpi_targets, args: {kpi_id: KPI-0001}}
    - {tool: update_kpi_alert_threshold, args: {alert_id: ALT-000001, threshold_value: 92}}
  facts: ["92"]

