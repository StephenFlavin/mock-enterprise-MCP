- id: cmms-01:10:Q1-a
  question: "01:10:Q1"
  prompt: >
    Shuttle AST-DC2-SHT-03 at DC2 keeps stopping. What unplanned stoppages has it had in the last 40 days,
    what failed each time, and which of them could have been predicted from sensor data?
  ref:
    - {tool: list_unplanned_stoppages, args: {asset_id: AST-DC2-SHT-03, date_from: -40d}}
  facts: ["Bearing failure", "Motor bearing", "Sensor malfunction", "Drive shaft"]

- id: cmms-01:10:Q1-b
  question: "01:10:Q1"
  prompt: >
    For shuttle AST-DC2-SHT-03 at DC2, what repair work has been done on it recently? In particular, what was
    done after the bearing breakdown on 8 September, how long did it take and what did it cost?
  ref:
    - {tool: list_work_orders_for_asset, args: {asset_id: AST-DC2-SHT-03}}
  facts: ["Replace motor bearing assembly", "1.25", "450", "completed"]

- id: cmms-01:10:Q1-c
  question: "01:10:Q1"
  prompt: >
    We keep getting motor bearing and oil seal failures on the shuttles. What spares do we hold for motors, which
    are out of stock or low against their reorder level, and what are the lead times on the bearing assemblies and
    oil seal kits?
  ref:
    - {tool: get_spare_parts_stock, args: {asset_class: motor}}
  facts: ["Motor bearing assembly", "Oil seal kit", "Spare coupler", "21"]
  notes: "Planted shuttle spares (motor bearing assembly, oil seal kit) are filed under asset_class motor, not shuttle; the shuttle class holds only generic 'Spare ...' parts, so a model filtering by shuttle misses them. Several generated parts have implausible lead times (60-90 days for gaskets) and unit costs."

- id: cmms-01:10:Q1-d
  question: "01:10:Q1"
  prompt: >
    What have the unplanned failures on shuttle AST-DC2-SHT-03 cost us over the last 40 days in total, how many
    hours of downtime was that, and what is that per hour of downtime?
  ref:
    - {tool: get_unplanned_failure_cost, args: {asset_id: AST-DC2-SHT-03, days: 40}}
  facts: ["14023", "6.4", ["2185.4", "2,185"], "3"]
  notes: "Story says total unplanned cost across the 14 September shuttle stoppages is about 18k with 75-210 min each, but aisle 3 also carries a generated stoppage STP-000007 (265 min, 12,551 GBP, 'Sensor malfunction' on a drive shaft) which dwarfs the planted ones (920 and 552) and dominates the cost totals."

- id: cmms-01:10:Q2-a
  question: "01:10:Q2"
  prompt: >
    There is a planned shutdown on 19 October. How long is it, which assets and how many work orders does it
    cover, what is the estimated cost, and is it approved?
  ref:
    - {tool: get_shutdown_plan, args: {shutdown_date: "2026-10-19"}}
  facts: ["16", "8500", "approved", "6"]
  notes: "Shutdown SHD-900001 says 6 work orders included, but only 2 scheduled sorter work orders (WO-900003, WO-900004) plus 2 open conveyor motor PMs (WO-900005, WO-900006) exist for 19 October; the plan has no capacity/hours-per-work-order breakdown, so fit can't be checked per job."

- id: cmms-01:10:Q2-b
  question: "01:10:Q2"
  prompt: >
    How is the DC1 tilt-tray sorter AST-DC1-SRT doing right now? Give its current run hours, condition rating,
    vibration, temperature and oil analysis result, and say whether it is likely to need work before 1 November.
  ref:
    - {tool: list_asset_run_hours, args: {asset_id: AST-DC1-SRT}}
  facts: ["87234", "poor", "5.2", "degrading"]
  notes: "Run hours are not monotonic: generated readings for the same asset interleave with the planted ones (e.g. 27,363 h on 2026-10-05 vs 87,234 h on 2026-10-06, condition 'good' vs 'poor'), so a trend over time is contradictory. No failure-likelihood or remaining-life field exists."

- id: cmms-01:10:Q2-c
  question: "01:10:Q2"
  prompt: >
    Conveyor drive motor AST-DC1-CNV-M03 at DC1 is showing as fair. Raise a high priority work order to do
    preventive maintenance on it, planned for 19 October.
  ref:
    - {tool: create_work_order, args: {asset_id: AST-DC1-CNV-M03, priority: high, description: "Preventive maintenance", planned_date: "2026-10-19"}}
  facts: ["open", "2026-10-19"]

- id: cmms-01:10:Q2-d
  question: "01:10:Q2"
  prompt: >
    Cancel work order WO-900005 (the preventive maintenance on conveyor motor 1), we will do it at the next
    shutdown instead. What status was it in and what is it now?
  ref:
    - {tool: cancel_work_order, args: {wo_id: WO-900005, cancel_reason: "Pushed to next shutdown cycle"}}
  facts: ["open", "cancelled"]

- id: cmms-01:10:Q4-a
  question: "01:10:Q4"
  prompt: >
    How much has the DC1 tilt-tray sorter AST-DC1-SRT cost us in maintenance, planned versus unplanned, how many
    work orders of each kind, and how many hours of downtime in total?
  ref:
    - {tool: get_asset_maintenance_cost_history, args: {asset_id: AST-DC1-SRT}}
  facts: ["8121.42", "3667.26", "4454.16", "31.1"]
  notes: "Asked for 7 years of history but the data covers only ~4 months (7 work orders, Jul-Oct 2026), so no wear-out trend is visible. Planted breakdown WOs (WO-900007/8/9, 3,000 GBP) are mixed with generated 'breakdown' WOs that read as preventive maintenance, and unplanned WO cost (4,454) is far below the stoppage cost (29,324)."

- id: cmms-01:10:Q4-b
  question: "01:10:Q4"
  prompt: >
    What unplanned stoppages has the DC1 tilt-tray sorter AST-DC1-SRT had in the last 90 days, what failed each
    time, how long was each, and could any have been predicted from sensor data?
  ref:
    - {tool: list_unplanned_stoppages, args: {asset_id: AST-DC1-SRT, date_from: -90d}}
  facts: ["Coupling", "Drive shaft", "Mechanical wear", "Lubrication failure"]
  notes: "Story says the sorter has repeated planted breakdowns averaging 1,500 GBP, but its only stoppages are two generated ones (474 and 272 min, 19,275 and 10,049 GBP), both flagged not predictable from sensors, contradicting the poor condition / high vibration story. Planted stoppages for the sorter are missing."
