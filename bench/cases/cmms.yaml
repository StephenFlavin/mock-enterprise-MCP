- id: cmms-01:10:Q1-a
  question: "01:10:Q1"
  prompt: >
    Shuttle AST-DC2-SHT-03 at DC2 keeps stopping. What unplanned stoppages has it had in the last 40 days,
    what failed each time, and which of them could have been predicted from sensor data?
  ref:
    - {tool: list_unplanned_stoppages, args: {asset_id: AST-DC2-SHT-03, date_from: -40d}}
  facts: ["Bearing failure", "Motor bearing", "Software glitch", "Control board"]

- id: cmms-01:10:Q1-b
  question: "01:10:Q1"
  prompt: >
    For shuttle AST-DC2-SHT-03 at DC2, what repair work has been done on it recently? In particular, what repair
    fixed last month's bearing breakdown, was it completed, how long did it take and what did it cost?
  ref:
    - {tool: list_work_orders_for_asset, args: {asset_id: AST-DC2-SHT-03}}
  facts: ["Replace motor bearing assembly", ["1.25", "75 minutes", "1 hour 15"], "450", "completed"]
  # the scenario asks for root causes and spares, not this repair's duration, cost or status
  scenario_facts: ["Replace motor bearing assembly"]

- id: cmms-01:10:Q1-c
  question: "01:10:Q1"
  prompt: >
    We keep getting motor bearing and oil seal failures on the shuttles. What spares do we hold for the shuttles,
    which are out of stock or low against their reorder level, and what are the lead times on the bearing
    assemblies and oil seal kits?
  ref:
    - {tool: get_spare_parts_stock, args: {asset_class: shuttle}}
  facts: ["Shuttle motor bearing assembly", "Shuttle oil seal kit", "Shuttle drive sprocket assembly", "21", "14"]
  # the scenario asks which spares to hold, not their lead times
  scenario_facts: ["Shuttle motor bearing assembly", "Shuttle oil seal kit", "Shuttle drive sprocket assembly"]
  notes: "Spare parts are supplied by the indirect MRO suppliers in master (SUP-0087 Hartley MRO Supplies, SUP-0088 Apex Maintenance Spares; racking parts SUP-0090 Rackwell)."

- id: cmms-01:10:Q1-d
  question: "01:10:Q1"
  prompt: >
    What have the unplanned failures on shuttle AST-DC2-SHT-03 at DC2 cost us over the last 40 days in total, how
    many hours of downtime was that, and what is that per hour of downtime?
  ref:
    - {tool: get_unplanned_failure_cost, args: {asset_id: AST-DC2-SHT-03, days: 40}}
  facts: ["1386", ["693", "£693"]]

- id: cmms-01:10:Q1-e
  question: "01:10:Q1"
  prompt: >
    Our shuttle system at DC2 had 14 unplanned stoppages in the last 30 days. What are the common root causes, ranked by
    the total time lost, and is any failure tied to a specific software version?
  ref:
    - {tool: list_unplanned_stoppages, args: {site_id: DC2, date_from: -30d}}
  facts: ["Seal degradation", "Mechanical wear", "Lubrication failure", "4.3.0"]

- id: cmms-01:10:Q2-a
  question: "01:10:Q2"
  prompt: >
    There is a planned shutdown at DC1 in about two weeks. How long is it, how many work orders are already booked
    into it and how many hours do they take, how many hours are left, what is the estimated cost, and is it approved?
  ref:
    - {tool: get_shutdown_plan, args: {shutdown_date: "2026-10-19"}}
  facts: ["16", "8500", "approved", "13", "4"]

- id: cmms-01:10:Q2-b
  question: "01:10:Q2"
  prompt: >
    How is the DC1 tilt-tray sorter AST-DC1-SRT doing right now? Give its current run hours, condition rating,
    vibration, temperature and oil analysis result, and say whether it is likely to need work in the next four weeks.
  ref:
    - {tool: list_asset_run_hours, args: {asset_id: AST-DC1-SRT}}
  facts: ["51230", "poor", "5.2", "degrading"]

- id: cmms-01:10:Q2-c
  question: "01:10:Q2"
  prompt: >
    Which motors, gearboxes and sensors in the DC1 conveyor network (AST-DC1-CNV) are in the worst condition right
    now? Give their run hours and condition.
  ref:
    - {tool: list_asset_run_hours, args: {asset_id: AST-DC1-CNV}}
  facts: [["AST-DC1-CNV-G01", "Conveyor gearbox 1"], ["AST-DC1-CNV-M08", "Conveyor drive motor 8"], "poor"]

- id: cmms-01:10:Q2-d
  question: "01:10:Q2"
  prompt: >
    Gearbox AST-DC1-CNV-G01 on the DC1 conveyor network is ageing. What does an unplanned gearbox failure
    typically cost compared with a planned replacement, and what do we save per failure avoided?
  ref:
    - {tool: get_unplanned_failure_cost, args: {asset_id: AST-DC1-CNV-G01}}
  facts: [["1224", "1225"], ["533", "534"], ["690", "691"]]

- id: cmms-01:10:Q2-e
  question: "01:10:Q2"
  prompt: >
    What work is already booked on the DC1 sorter AST-DC1-SRT for the shutdown in about two weeks, and how many hours is
    each job estimated at?
  ref:
    - {tool: list_work_orders_for_asset, args: {asset_id: AST-DC1-SRT, status: scheduled}}
  facts: ["Complete overhaul of sorter rollers and sensors", "Replace sorter drive motor and gearbox", "2026-10-19"]

- id: cmms-01:10:Q2-f
  question: "01:10:Q2"
  prompt: >
    Conveyor drive motor AST-DC1-CNV-M03 at DC1 is showing as fair. Raise a high priority work order to do
    preventive maintenance on it, planned for the DC1 shutdown in about two weeks.
  ref:
    - {tool: create_work_order, args: {asset_id: AST-DC1-CNV-M03, priority: high, description: "Preventive maintenance", planned_date: "2026-10-19"}}
  facts: ["open", "2026-10-19"]

- id: cmms-01:10:Q2-g
  question: "01:10:Q2"
  prompt: >
    Cancel work order WO-900005 (the preventive maintenance on conveyor motor 1), we will do it at the next
    shutdown instead. What status was it in and what is it now?
  ref:
    - {tool: cancel_work_order, args: {wo_id: WO-900005, cancel_reason: "Pushed to next shutdown cycle"}}
  facts: ["open", "cancelled"]

- id: cmms-01:10:Q4-a
  question: "01:10:Q4"
  prompt: >
    How much has the DC1 tilt-tray sorter AST-DC1-SRT cost us in maintenance over the last seven years, planned
    versus unplanned, how many work orders of each kind, how many hours of downtime in total, and is the cost rising?
  ref:
    - {tool: get_asset_maintenance_cost_history, args: {asset_id: AST-DC1-SRT}}
  facts: [["57967.8", "57968"], ["27394", "27395"], ["30573", "30574"], ["230.1", "230"]]
  notes: "Master data gives the sorter an install date of 2018-09-09 (about 8 years old) while the question says nearly 12 years old; master data is out of this repair's scope, so the history covers the 7 years the question asks about but not the sorter's full 12."

- id: cmms-01:10:Q4-b
  question: "01:10:Q4"
  prompt: >
    What unplanned stoppages has the DC1 tilt-tray sorter AST-DC1-SRT had in the last 90 days, what failed each
    time, how long was each, and could any have been predicted from sensor data?
  ref:
    - {tool: list_unplanned_stoppages, args: {asset_id: AST-DC1-SRT, date_from: -90d}}
  facts: ["Lubrication failure", "Mechanical wear", "Sensor malfunction", "Gearbox"]
  # scenario facts reviewed: the failure history is what the downtime-risk question asks for
  scenario_facts: ["Lubrication failure", "Mechanical wear", "Sensor malfunction", "Gearbox"]

- id: cmms-01:10:Q4-c
  question: "01:10:Q4"
  prompt: >
    What have the unplanned failures on the DC1 tilt-tray sorter AST-DC1-SRT cost us over the last 90 days in
    total, how many hours of downtime was that, and what is the average cost per failure?
  ref:
    - {tool: get_unplanned_failure_cost, args: {asset_id: AST-DC1-SRT, days: 90}}
  facts: ["5325", "15.5", "1775"]
