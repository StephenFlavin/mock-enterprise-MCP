- id: kb-01:6:Q4-a
  question: "01:6:Q4"
  prompt: >
    We want to compare our DC cost and productivity with other retail DCs. How do we define our own DC cost and
    productivity measures, and which of them are likely not directly comparable with benchmark figures?
  ref:
    - {tool: search_kpi_definitions, args: {query: DC cost productivity}}
  facts: ["DC cost per unit handled", "units per labour hour", "labour-only", ["direct productive hours", "direct hours"]]

- id: kb-01:8:Q3-a
  question: "01:8:Q3"
  prompt: >
    We're on WMS version 9.2 and getting duplicate task creation after replenishment. Do our internal notes list this
    as a known issue, which patch fixes it, is there a workaround, and what should we test before applying it?
  ref:
    - {tool: search_internal_knowledge_base, args: {query: WMS 9.2 duplicate task}}
  facts: ["9.2.7", ["event queue timeout", "queue timeout"], "50 concurrent", "Saturday"]

- id: kb-01:8:Q4-a
  question: "01:8:Q4"
  prompt: >
    ERP and WMS stock disagree again. What have we previously written up about ERP-WMS gaps? Then publish a new write-up
    to the knowledge base (category reconciliation) saying this gap comes from cutoff timing and status mapping, and
    archive the old July ERP-WMS reconciliation note KB-900001 that it replaces.
  ref:
    - {tool: search_past_reconciliation_notes, args: {query: ERP WMS stock}}
    - {tool: create_knowledge_base_article, args: {title: ERP-WMS stock reconciliation write-up, category: reconciliation, content: Gap driven by cutoff timing and status mapping differences}}
    - {tool: archive_knowledge_base_article, args: {article_id: KB-900001}}
  facts: ["980k", "KB-900001", "archived"]

- id: kb-01:10:Q3-a
  question: "01:10:Q3"
  prompt: >
    We are planning an AMR fleet firmware update to 4.7. What is our rollback process if it goes wrong, does it
    affect our safety validation, and by when does it have to be in before peak?
  ref:
    - {tool: search_internal_knowledge_base, args: {query: AMR firmware rollback safety}}
  facts: ["previous firmware image", "15 minutes per robot", ["re-run", "re-validat"], "first week of November"]

- id: kb-02:14:Q5-a
  question: "02:14:Q5"
  prompt: >
    Do our garments qualify for UK-Vietnam preferential rates if the fabric comes from China and is cut and sewn in
    Vietnam? What would need to change to qualify, what evidence do we need and who issues it?
  ref:
    - {tool: search_knowledge_base, args: {query: UK Vietnam preferential origin garments}}
  facts: ["65%", "non-originating", "Ministry of Industry and Trade", "certificate of origin"]

- id: kb-02:20:Q6-a
  question: "02:20:Q6"
  prompt: >
    What criteria and weights should our next carrier tender scorecard use, and what minimum thresholds should
    disqualify a bidder?
  ref:
    - {tool: search_knowledge_base, args: {query: carrier tender scorecard}}
  facts: ["30%", "25%", "90%", "100k"]

- id: kb-02:21:Q4-a
  question: "02:21:Q4"
  prompt: >
    What are the rules on returned goods and EPR in Germany, France and the Netherlands? Include the penalties and
    tell me which country is the strictest and what may conflict with our practices.
  ref:
    - {tool: search_knowledge_base, args: {query: returned goods EPR Germany France Netherlands}}
  facts: ["75k", "80k", "65k", "France"]

- id: kb-04:33:Q5-a
  question: "04:33:Q5"
  prompt: >
    We are worried about export restrictions, power shortages or unrest in our sourcing countries. What trigger points
    would be sensible for taking action, and what contingency should we use if it gets worse?
  ref:
    - {tool: search_knowledge_base_articles, args: {query: export restrictions power shortages unrest sourcing}}
  facts: ["4 hours", "48 hours", "air-freight", "buffer stock"]

- id: kb-04:34:Q4-a
  question: "04:34:Q4"
  prompt: >
    What does Morocco offer compared with Turkey? Cover incentives, labour, fabric availability and geopolitical or
    currency risk, and say which is better for tailoring and how reliable Moroccan lead time is.
  ref:
    - {tool: search_knowledge_base_articles, args: {query: Morocco Turkey}}
  facts: ["Tangier", "lira", ["tailored suits", "tailoring"], "8-12 weeks"]

- id: kb-04:34:Q7-a
  question: "04:34:Q7"
  prompt: >
    How much should we commit to a nearshore supplier to get priority capacity without taking on too much risk? What is
    the typical minimum volume, and which of our standard clauses protect us if demand drops?
  ref:
    - {tool: search_knowledge_base_articles, args: {query: nearshore commitment capacity}}
    - {tool: get_standard_clause_library, args: {query: volume}}
  facts: ["60%", "70%", "Volume Commitment and Flexibility", "termination for convenience"]

- id: kb-04:35:Q6-a
  question: "04:35:Q6"
  prompt: >
    How should we structure a joint programme with a supplier to cut lead time by 20%? What have other retailers
    achieved, and what would the supplier need from us?
  ref:
    - {tool: search_knowledge_base_articles, args: {query: supplier lead time reduction programme}}
  facts: ["15-25%", "12-week", "£50k", "8 weeks"]

- id: kb-04:38:Q1-a
  question: "04:38:Q1"
  prompt: >
    We are reviewing a supplier agreement against our standard terms. What are our approved fallback positions and
    red lines by clause, and what contract terms would be unusual for the apparel industry?
  ref:
    - {tool: get_fallback_positions_playbook, args: {}}
    - {tool: search_knowledge_base_articles, args: {query: apparel supplier agreement unusual terms}}
  facts: ["100% of the value of the affected order", "never cap product safety", "payment terms over 90 days", "unauthorised subcontracting"]
