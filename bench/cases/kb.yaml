    - {tool: get_standard_clause_library, args: {query: forced labour}}
    - {tool: compare_clause_library_to_regulations, args: {}}
    - {tool: update_standard_clause, args: {clause_id: CLS-007, wording: "Supplier shall not use forced labour, shall comply with the UK Modern Slavery Act, shall provide traceability of its sub-supplier chain and shall charge workers no recruitment fees."}}
  facts: ["Forced Labour", "Supply Chain Due Diligence", "5% of net worldwide turnover", "recall"]

