- id: kb-01:6:Q4-a
  question: "01:6:Q4"
  prompt: >
    We want to compare our DC cost and productivity with other retail DCs. How do we define our own DC cost and
    productivity measures, and which of them are likely not directly comparable with benchmark figures?
  ref:
    - {tool: search_kpi_definitions, args: {query: DC cost productivity}}
  facts: ["DC cost per unit handled", "units per labour hour", "labour-only", ["direct productive hours", "direct hours"]]

- id: kb-01:8:Q3-a
  question: "01:8:Q3"
  prompt: >
    We're on WMS version 9.2 and getting duplicate task creation after replenishment. Do our internal notes list this
    as a known issue, which patch fixes it, is there a workaround, and what should we test before applying it?
  ref:
    - {tool: search_internal_knowledge_base, args: {query: WMS 9.2 duplicate task}}
  facts: ["9.2.7", ["event queue timeout", "queue timeout"], "50 concurrent", "Saturday"]

