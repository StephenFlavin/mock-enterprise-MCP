- id: track_trace-02:19:Q1
  question: "02:19:Q1"
  prompt: >
    Which inbound shipments are predicted to arrive late against their planned arrival, and by how many days?
    Take the three furthest behind and flag each of them as priority for expedited handling.
  ref:
    - {tool: get_predicted_eta_vs_planned_arrival, args: {}}
    - {tool: update_shipment_priority, args: {shipment_id: SHP-0000132, priority_flag: true}}
    - {tool: update_shipment_priority, args: {shipment_id: SHP-0000102, priority_flag: true}}
    - {tool: update_shipment_priority, args: {shipment_id: SHP-0000300, priority_flag: true}}
  facts: ["SHP-0000132", "SHP-0000102", "SHP-0000300", "11", "9"]

- id: track_trace-02:19:Q4
  question: "02:19:Q4"
  prompt: >
    ETA accuracy on the Shanghai to Felixstowe lane (CNSHA to GBFXT) is poor. Over the last six months, how many
    days late do sailings run against plan on average, what planning buffer do we hold today against what the
    history says we need, and how many buffer days would we save if ETA prediction got 50 percent better?
  ref:
    - {tool: calculate_planning_buffer_savings, args: {origin_port: CNSHA, dest_port: GBFXT, eta_improvement_pct: 50}}
  facts: ["3.5", "6.6", "3.3", "2"]

