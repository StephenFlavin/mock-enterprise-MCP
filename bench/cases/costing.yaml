- id: costing-06:54:Q4
  question: "06:54:Q4"
  prompt: >
    For next season's pipeline items SKU-102128, SKU-102310 and SKU-102233, what is the costed gross margin against
    target, and which one carries the most margin risk?
  ref:
    - {tool: get_costed_margin_for_product, args: {sku: SKU-102128}}
    - {tool: get_costed_margin_for_product, args: {sku: SKU-102310}}
    - {tool: get_costed_margin_for_product, args: {sku: SKU-102233}}
  facts: ["69.6", "61.4", "71.1", "4.6"]

- id: costing-06:58:Q1
  question: "06:58:Q1"
  prompt: >
    We have a supplier quote for an AW27 padded jacket, style STY-9504. What did similar styles we have bought cost on
    fabric, trims, labour and overhead on average, and in total, so I can benchmark the quote?
  ref:
    - {tool: get_historical_costings_for_similar_styles, args: {style_id: STY-9504}}
  facts: ["11.47", "4.92", "8.59", "30.62"]
  notes: "The quote itself is read by the documents system; the padded jacket is master style STY-9504 (SKU-106328) and similar means same category and department within 35% of its price. cost_model benchmarks the quote lines against its own padded-jacket benchmarks (trims 2.20, labour 5.30), which are lower than these all-outerwear averages."

- id: costing-06:58:Q2
  question: "06:58:Q2"
  prompt: >
    Show me the current costing sheet for SKU-100007. I have signed off 30,000 units, so save the Portugal scenario to
    its costing sheet: supplier SUP-0058, factory FAC-0110, unit cost £27.40, margin £64.59 (70.2%).
  ref:
    - {tool: get_costing_sheet_for_product, args: {sku: SKU-100007}}
    - {tool: update_costing_sheet_for_product, args: {costing_id: CST-SKU-100007-V1, origin_country: PT, supplier_id: SUP-0058, factory_id: FAC-0110, quantity_units: 30000, total_cost_gbp: 27.4, gross_margin_gbp: 64.59, gross_margin_pct: 70.2}}
  facts: ["28.95", "1800", "30000", "27.4"]
  notes: "Landed cost across origins, freight, FX and duty come from the landed_cost, freight_rates, fx and tax_duty systems; the costing sheet only stores the chosen scenario."

- id: costing-06:58:Q3
  question: "06:58:Q3"
  prompt: >
    We want to take 8% out of the cost of K-1700. What is its current costed unit cost, and how does it split between
    material, labour, overhead, freight and tooling?
  ref:
    - {tool: get_costing_sheet_for_product, args: {sku: K-1700}}
  facts: ["24.67", "14.74", "59.7", "2.33"]
  notes: "The cost_model system lists K-1700's current cost as £2.30, which does not match the costed £24.67 here (master unit cost); options, savings and customer impact come from cost_model and reviews."

- id: costing-06:58:Q4
  question: "06:58:Q4"
  prompt: >
    How do actual costs compare with costed costs across last season's (SS26) range, and which products lost the most
    margin per unit? For the category of the worst-hit product, what drove the margin shortfall against plan? Then
    update next season's costed price for the worst-hit product to £189.99, keeping its costed unit cost.
  ref:
    - {tool: get_costed_vs_actual_cost_by_product, args: {season: SS26}}
    - {tool: calculate_margin_variance_by_driver, args: {category: Knitwear, department: Womenswear}}
    - {tool: update_costed_price_for_product, args: {costing_id: CST-SKU-104291-V1, retail_price_gbp: 189.99, gross_margin_gbp: 146.7, gross_margin_pct: 77.2}}
  facts: ["SKU-104291", "4.38", "10.1", "1.1", "189.99"]
  notes: "Actual landed cost by purchase order and FX come from landed_cost and fx; the costing system holds costed cost, supplier actual cost history and the margin drivers by category."

- id: costing-06:60:Q1
  question: "06:60:Q1"
  prompt: >
    What PFAS-free durable water repellent (DWR) finishes do we have costed for waterproof outerwear? For each, give
    the spray rating, wash durability, cost per metre, and what a 2,000-metre trial would cost and how many days it
    would take.
  ref:
    - {tool: get_material_cost_and_performance_data, args: {application: DWR finish, contains_pfas: false}}
    - {tool: calculate_trial_cost_and_duration, args: {material_id: MAT-DWR-DENDRIMER, test_volume_units: 2000}}
    - {tool: calculate_trial_cost_and_duration, args: {material_id: MAT-DWR-SILICONE, test_volume_units: 2000}}
    - {tool: calculate_trial_cost_and_duration, args: {material_id: MAT-DWR-WAX, test_volume_units: 2000}}
  facts: ["0.58", "90", "3560", "63", "1560"]
  notes: "Availability at scale, UK/EU/US regulatory status and independent test evidence are held in other systems; costing holds cost, spray rating, wash durability and trial economics."

- id: costing-06:60:Q4
  question: "06:60:Q4"
  prompt: >
    We want to buy recycled polyester MAT-RPET-100 at 2 million metres a year. What would it cost per metre and in
