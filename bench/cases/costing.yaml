- id: costing-02:13:Q1
  question: "02:13:Q1"
  prompt: >
    Style STY-7731 is three weeks late and it's a key winter promo line with 6,000 units planned. The air freight quote
    is £16 a unit. How many units and how much sales value would we lose if we wait for sea, and is airfreighting all
    6,000 units worth it? What if we only air 3,000?
  ref:
    - {tool: calculate_lost_sales_if_delayed, args: {style_id: STY-7731, delay_weeks: 3}}
    - {tool: calculate_air_vs_sea_margin_impact, args: {style_id: STY-7731, air_freight_cost_gbp: 16, volume_units: 6000}}
    - {tool: calculate_air_vs_sea_margin_impact, args: {style_id: STY-7731, air_freight_cost_gbp: 16, volume_units: 3000}}
  facts: ["2340", "180157", "32551", "76191"]

- id: costing-02:14:Q4
  question: "02:14:Q4"
  prompt: >
    A proposed tariff on footwear from Vietnam could add about 12% to our footwear cost of goods. What do our footwear
    factory quotes look like in Vietnam (VN) and in Indonesia (ID), and how much margin could a 5% retail price rise
    recover on footwear against that cost increase?
  ref:
    - {tool: get_factory_cost_quotes_by_country, args: {origin_country: VN, category: Footwear}}
    - {tool: get_factory_cost_quotes_by_country, args: {origin_country: ID, category: Footwear}}
    - {tool: calculate_margin_recovery_from_price_change, args: {category: Footwear, price_increase_pct: 5, cost_increase_pct: 12}}
  facts: ["17.98", "18.79", "96469", "27"]

- id: costing-02:21:Q2
  question: "02:21:Q2"
  prompt: >
    For returned electronics accessories (chargers, cables, earbuds) costing about £20 a unit, compare restocking,
    refurbishing, liquidation and recycling on recovered value, handling cost, time to cash and risk. Which route is
    best for items older than 60 days, and which age band's route should we change first?
  ref:
    - {tool: calculate_recovered_value_by_route, args: {category: Electronics accessories, cost_per_unit_gbp: 20, stock_type: returns}}
  facts: ["Liquidation", "10.1", "6.7", "Restocking", "61-180"]

- id: costing-03:22:Q2
  question: "03:22:Q2"
  prompt: >
    SKU-105341 and SKU-102338 are both about to run out. For each, what is the margin per unit, and how much sales and
    margin are at risk over the next four weeks if they do?
  ref:
    - {tool: get_sku_margin_and_sales_at_risk, args: {sku: SKU-105341, weeks: 4}}
    - {tool: get_sku_margin_and_sales_at_risk, args: {sku: SKU-102338, weeks: 4}}
  facts: ["106.71", "160599", "60", "91230"]

- id: costing-03:25:Q1
  question: "03:25:Q1"
  prompt: >
    Women's knitwear margin was 3.2 points below plan last month. Split it into price, cost, mix, markdown and shrink,
    and tell me where the net margin ends up by the end of the season if nothing changes (8 weeks left).
  ref:
    - {tool: get_margin_variance_to_plan, args: {category: Knitwear, department: Womenswear}}
    - {tool: get_margin_bridge_for_category, args: {category: Knitwear, department: Womenswear}}
    - {tool: get_shrink_by_category, args: {category: Knitwear, department: Womenswear}}
    - {tool: calculate_end_of_season_margin_projection, args: {category: Knitwear, department: Womenswear, weeks_remaining: 8}}
  facts: ["1.1", "0.9", "0.6", "0.3", "59.8"]

- id: costing-03:29:Q5
  question: "03:29:Q5"
  prompt: >
    We hold stock older than 180 days: Towels £1,556,740, Knitwear £1,127,922 and Bedding £1,074,689 at cost. For each,
    what is the best disposal route and the expected recovery, and which group should I focus on first?
  ref:
    - {tool: calculate_recovery_potential_for_lines, args: {category: Towels, min_age_days: 180, stock_value_gbp: 1556740}}
    - {tool: calculate_recovery_potential_for_lines, args: {category: Knitwear, min_age_days: 180, stock_value_gbp: 1127922}}
    - {tool: calculate_recovery_potential_for_lines, args: {category: Bedding, min_age_days: 180, stock_value_gbp: 1074689}}
  facts: ["Knitwear", "Outlet", "322253", "163385", "153067"]

- id: costing-03:31:Q1
  question: "03:31:Q1"
  prompt: >
    A second Midlands DC would add £2.4m a year in fixed cost and save about £1.60 per unit shipped. What volume breaks
    even, and what share of our 20 million units a year is that?
  ref:
    - {tool: calculate_break_even_volume, args: {fixed_cost_gbp: 2400000, contribution_margin_gbp: 1.6, annual_volume_units: 20000000}}
  facts: ["1500000", "7.5"]

- id: costing-04:32:Q2
  question: "04:32:Q2"
  prompt: >
    SKU-102590 is our 750ml insulated stainless steel bottle. How much of its unit cost is 304 stainless steel, and what
    would a 10% rise in the steel price add to unit cost and take off margin?
  ref:
    - {tool: get_material_cost_share_for_product, args: {sku: SKU-102590}}
    - {tool: calculate_commodity_cost_exposure, args: {sku: SKU-102590, commodity_price_change_pct: 10}}
  facts: ["34.1", "0.6", "1.08"]
  notes: "Master data has no product named 750ml insulated bottle; Drinkware SKU-102590 stands in for it."

- id: costing-04:32:Q4
  question: "04:32:Q4"
  prompt: >
    Competitors charge about £44.99 for the 750ml insulated bottle SKU-102590. What target gross margin do we work to
    in Drinkware, and what target cost does that price imply compared with the bottle's current cost?
  ref:
    - {tool: get_target_margin_for_category, args: {category: Drinkware}}
    - {tool: calculate_target_cost, args: {retail_price_gbp: 44.99, sku: SKU-102590}}
  facts: ["57.9", "18.9", "20.82", "1.92"]
  notes: "Master data has no product named 750ml insulated bottle; Drinkware SKU-102590 stands in for it."

- id: costing-04:32:Q8
  question: "04:32:Q8"
  prompt: >
    Our buying margin on Small Appliances fell 2.5 points year on year. Confirm the change and decompose it by cost,
    FX, mix and supplier.
  ref:
    - {tool: get_buying_margin_by_category_period, args: {category: Small Appliances}}
    - {tool: calculate_margin_bridge, args: {category: Small Appliances}}
  facts: ["2.5", "1.0", "0.7", "0.3", "0.5"]

- id: costing-04:33:Q2
  question: "04:33:Q2"
  prompt: >
    How has FOB cost per unit moved over the past year in Vietnam (VN), Cambodia (KH) and Bangladesh (BD), and what
    would an 8% wage rise add to FOB in each country?
  ref:
    - {tool: get_fob_price_history_by_country, args: {origin_country: VN}}
    - {tool: get_fob_price_history_by_country, args: {origin_country: KH}}
    - {tool: get_fob_price_history_by_country, args: {origin_country: BD}}
    - {tool: calculate_wage_impact_on_fob, args: {origin_country: VN, wage_increase_pct: 8}}
    - {tool: calculate_wage_impact_on_fob, args: {origin_country: KH, wage_increase_pct: 8}}
    - {tool: calculate_wage_impact_on_fob, args: {origin_country: BD, wage_increase_pct: 8}}
  facts: ["1.8", "2.8", "1.4", "0.32", "0.34", "0.28"]
  notes: "Master data has no Cambodian factories; KH figures are factory quotes (basis quoted), not orders."

- id: costing-04:34:Q1
  question: "04:34:Q1"
  prompt: >
    SKU-101897 is one of our top dress basics. Moving it to Portugal would add about 12% to its cost. What is its
    current markdown rate, and how many points of markdown reduction would we need to break even?
  ref:
    - {tool: calculate_markdown_breakeven, args: {sku: SKU-101897, cost_increase_pct: 12}}
  facts: ["12.7", "3.4", "1.41"]

- id: costing-04:34:Q3
  question: "04:34:Q3"
  prompt: >
    We are comparing a men's coat made in Vietnam (STY-4595) with the same kind of coat made in Portugal (STY-6070).
    What do the two cost sheets show for total unit cost and lead time, and what annual inventory holding cost rate
    applies to outerwear?
  ref:
    - {tool: get_product_costing_for_style, args: {style_id: STY-4595}}
    - {tool: get_product_costing_for_style, args: {style_id: STY-6070}}
    - {tool: get_inventory_holding_cost_rate, args: {category: Outerwear}}
  facts: ["32.15", "38.07", "75", "28", "25"]
  notes: "Master data has no wool coat; Menswear Outerwear STY-4595 (Vietnam) and STY-6070 (Portugal) stand in."

- id: costing-04:34:Q5
  question: "04:34:Q5"
  prompt: >
    Nearshore quotes for the Portugal-made coat SKU-102863 are coming in well above what I expected. What target cost
    does its retail price and target margin imply, and how is that split between material, labour, and overhead and
    freight?
  ref:
    - {tool: get_target_cost_for_product, args: {sku: SKU-102863}}
  facts: ["55.48", "27.97", "19.25", "8.26"]
  notes: "Master data has no wool coat; Menswear Outerwear SKU-102863 (Portugal) stands in. Quotes themselves live in sourcing."

- id: costing-04:39:Q1
  question: "04:39:Q1"
  prompt: >
    For the products that use cotton, polyester, nylon and leather, what share of their unit cost is each of those
    materials, across our range?
  ref:
    - {tool: get_material_cost_share_for_product, args: {}}
  facts: ["39.6", "40.3", "41.2", "25.3"]

- id: costing-04:39:Q3
  question: "04:39:Q3"
  prompt: >
    Our 10oz cotton fabric (MAT-COTTON-10OZ) cost per metre rose about 9% over the last six months while the cotton
    index rose about 4%. Break the rise into market, supplier premium, mill margin, freight and contract lag, and tell
    me which suppliers passed on more than the market and who is the worst.
  ref:
    - {tool: calculate_cost_variance_bridge, args: {commodity: COTTON}}
    - {tool: get_fabric_cost_history_by_supplier, args: {material_id: MAT-COTTON-10OZ}}
    - {tool: compare_supplier_pass_through_to_market, args: {commodity: COTTON}}
  facts: ["1.6", "1.4", "1.2", "0.8", ["SUP-0064", "Wright Garments"]]

- id: costing-04:39:Q4
  question: "04:39:Q4"
  prompt: >
    What does a 20% rise in polyester prices do to product cost and gross margin by product category?
  ref:
    - {tool: calculate_commodity_shock_impact_by_category, args: {commodity: POLYESTER, shock_pct: 20}}
  facts: ["6.99", "7.21", "7.47", "2.3"]

- id: costing-04:40:Q1
  question: "04:40:Q1"
  prompt: >
    For our Small Appliances packaging, compare corrugated, moulded pulp and recycled plastic on unit cost, damage rate,
    recycled content and recyclability. What does each change cost against today's pack at 400,000 units a year?
  ref:
    - {tool: get_packaging_unit_cost_by_material, args: {category: Small Appliances, annual_units: 400000}}
  facts: ["0.92", "0.78", "28000", "1.5", "95"]

- id: costing-04:40:Q5
  question: "04:40:Q5"
  prompt: >
    Cookware packaging is behind on our recycled content target. What does each packaging option cost per unit, how
    much more or less is that than the current pack, and what are its recycled content and recyclability?
  ref:
    - {tool: get_packaging_unit_cost_by_material, args: {category: Cookware}}
  facts: ["0.71", "0.09", "92", "78"]

- id: costing-05:44:Q4
  question: "05:44:Q4"
  prompt: >
    For our waterproof outerwear, what do the PFAS-free alternatives (DWR finishes and membranes) cost compared with
    the current PFAS ones, and how do they perform on water repellency and wash durability?
  ref:
    - {tool: get_material_cost_and_performance_data, args: {application: waterproof outerwear}}
  facts: ["dendrimer", "38.1", "silicone", "21.4"]

- id: costing-05:45:Q2
  question: "05:45:Q2"
  prompt: >
    If we move our polyester products to recycled polyester, how much more does the fabric cost per metre than virgin,
    in percent, and what would it add to our cost each year?
  ref:
    - {tool: get_recycled_material_cost_premium, args: {material_type: fabric, commodity: POLYESTER}}
  facts: ["5.5", "10", "548180"]
  notes: "Master data has no 'basics' flag; the annual figure covers every polyester-exposed category (Outerwear, Nightwear, Schoolwear)."

- id: costing-05:47:Q4
  question: "05:47:Q4"
  prompt: >
    We may have to recall 18,000 units of PF-220, the portable fan with a lithium battery. What is its unit cost and
    retail price, and what are 18,000 units worth at cost and at retail?
  ref:
    - {tool: get_unit_cost_and_retail_price, args: {sku: PF-220, units: 18000}}
  facts: ["24.67", "77.99", "444060", "1403820"]

- id: costing-05:49:Q1
  question: "05:49:Q1"
  prompt: >
    Across our categories, which hold the most resale value (as a share of cost) for returned items about 30 days old?
    And what does repair cost as a share of unit cost for Small Appliances and Smart Home?
  ref:
    - {tool: get_resale_value_estimates_by_category, args: {age_days: 30}}
    - {tool: get_repair_cost_by_category, args: {category: Small Appliances}}
    - {tool: get_repair_cost_by_category, args: {category: Smart Home}}
  facts: ["Electronics accessories", "51.3", "50.5", "28.6", "35.2"]

- id: costing-05:50:Q2
  question: "05:50:Q2"
  prompt: >
    To size a six-week closure of our main southern Vietnam port, what is the weekly revenue and net margin of our
    Vietnam-made products over the last three months, and which product earns the most?
  ref:
    - {tool: get_sku_margin_and_revenue, args: {origin_country: VN}}
  facts: ["138380", "85709", "SKU-103696"]
  notes: "Costing knows country of origin, not the port: all Vietnam-made SKUs are used. Margin history covers the top sellers per category (14 Vietnam SKUs)."
