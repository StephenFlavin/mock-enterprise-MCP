    - {tool: calculate_product_margin_contribution, args: {sku: PF-220}}
    - {tool: calculate_product_margin_contribution, args: {sku: SKU-101904}}
    - {tool: calculate_product_margin_contribution, args: {sku: SKU-101876}}
    - {tool: calculate_product_margin_contribution, args: {sku: SKU-103640}}
  facts: ["61.5", "62.9", "59", "28.7", "35.4"]
