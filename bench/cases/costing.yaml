    - {tool: calculate_garment_cost_by_fabric, args: {style_id: STY-4102, material_ids: "MAT-COTTON-10OZ,MAT-POLYESTER-100,MAT-RPET-100"}}
  facts: ["27.8", "26.64", "27.53", "30.44", "73.35"]
  notes: "Master data has no overshirt; STY-4102 (menswear outerwear) is the stand-in, and fabric ids are costing's own material ids."

