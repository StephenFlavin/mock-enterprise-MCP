    - {tool: get_product_costing_for_style, args: {style_id: STY-6070}}
    - {tool: get_inventory_holding_cost_rate, args: {category: Outerwear}}
  facts: ["32.15", "38.07", "75", "28", "25"]
  notes: "Master data has no wool coat; Menswear Outerwear STY-4595 (Vietnam) and STY-6070 (Portugal) stand in."

