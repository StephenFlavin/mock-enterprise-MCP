  question: "04:39:Q3"
  prompt: >
    Our 10oz cotton fabric (MAT-COTTON-10OZ) cost per metre rose about 9% over the last six months while the cotton
    index rose about 4%. Break the rise into market, supplier premium, mill margin, freight and contract lag, and tell
