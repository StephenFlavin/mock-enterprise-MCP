- id: costing-05:50:Q2
  question: "05:50:Q2"
  prompt: >
    To size a six-week closure of our main southern Vietnam port, what is the weekly revenue and net margin of our
    Vietnam-made products over the last three months, and which product earns the most?
  ref:
    - {tool: get_sku_margin_and_revenue, args: {origin_country: VN}}
  facts: ["138380", "85709", "SKU-103696"]
  notes: "Costing knows country of origin, not the port: all Vietnam-made SKUs are used. Margin history covers the top sellers per category (14 Vietnam SKUs)."

- id: costing-06:51:Q1
  question: "06:51:Q1"
  prompt: >
    The spring launch products SKU-100931 (about three weeks late) and SKU-103115 (about two weeks late) are at risk of
    missing their in-store date. What would it cost to recover the date by airfreighting each one, and what margin would
    we lose if we let them land late instead?
  ref:
    - {tool: calculate_date_recovery_cost, args: {sku: SKU-100931, weeks_late: 3}}
    - {tool: calculate_date_recovery_cost, args: {sku: SKU-103115, weeks_late: 2}}
  facts: ["4320", "1344", "57600", "3685"]
  notes: "Costing holds no air freight quotes, so the air freight rate defaults to a multiple (4x) of each SKU's costed sea freight unless a quote is passed. Which launches are late comes from the sampling system."

- id: costing-06:51:Q2
  question: "06:51:Q2"
  prompt: >
    For the new insulated lunch box (target cost £3.20 FOB), the three shortlisted factories quote tooling of £8,500,
    £7,500 and £9,000. What does each tooling quote add per unit at 40,000 units, and what is the unit price including
    tooling?
  ref:
    - {tool: calculate_tooling_amortisation_per_unit, args: {tooling_cost_gbp: 8500, lifetime_volume_units: 40000, unit_cost_gbp: 3.2}}
    - {tool: calculate_tooling_amortisation_per_unit, args: {tooling_cost_gbp: 7500, lifetime_volume_units: 40000, unit_cost_gbp: 3.2}}
    - {tool: calculate_tooling_amortisation_per_unit, args: {tooling_cost_gbp: 9000, lifetime_volume_units: 40000, unit_cost_gbp: 3.2}}
  facts: ["3.41", "3.39", "3.43"]
  notes: "The tooling figures come from the factory quotes in the sourcing system; this server only does the amortisation. The lunch box is master SKU-106314 (STY-9502); the quotes are for the three shortlisted factories FAC-0042, FAC-0021 and FAC-0023."

- id: costing-06:51:Q5
  question: "06:51:Q5"
  prompt: >
    For SKU-100126, one of our new launch products, what are the unit cost and margin at 20,000, 50,000 and 100,000
    units? If tooling and development cost £90,000, what is the break-even volume on its costed margin? Then save the
    50,000-unit case as a new costing version.
  ref:
    - {tool: get_costing_sheet_for_product, args: {sku: SKU-100126}}
    - {tool: calculate_unit_cost_at_volumes, args: {sku: SKU-100126, volumes: "20000,50000,100000"}}
    - {tool: calculate_margin_at_volumes, args: {sku: SKU-100126, volumes: "20000,50000,100000"}}
    - {tool: calculate_break_even_volume, args: {sku: SKU-100126, fixed_cost_gbp: 90000}}
    - {tool: create_costing_version_for_product, args: {sku: SKU-100126, style_id: STY-4071, season: SS27, quantity_units: 50000, total_cost_gbp: 35.18, retail_price_gbp: 114.99, gross_margin_gbp: 79.81, gross_margin_pct: 69.4}}
  facts: ["36.32", "35.18", "34.66", "1207"]
  notes: "The question names no product; SKU-100126 (an SS27 launch in the sampling system) is the stand-in. The saved version stores sku, style, season, volume, unit cost, price and margin; the component costs, origin and supplier are not copied onto it."

- id: costing-06:51:Q6
  question: "06:51:Q6"
  prompt: >
    We are looking at recycled polyester (MAT-RPET-100) and recycled nylon (MAT-RNYLON-100) to replace the
    MAT-POLYESTER-100 fabric on SKU-106328 (the new padded jacket). What would each do to its unit cost?
  ref:
    - {tool: calculate_unit_cost_impact_of_material_change, args: {sku: SKU-106328, old_material_id: MAT-POLYESTER-100, new_material_id: MAT-RPET-100}}
    - {tool: calculate_unit_cost_impact_of_material_change, args: {sku: SKU-106328, old_material_id: MAT-POLYESTER-100, new_material_id: MAT-RNYLON-100}}
  facts: ["0.78", "3.7", "6.21", "29.6"]
  notes: "Costing prices recycled polyester about 10% above virgin (in line with its recycled-premium table), while the trend system lists it at -2.5%; the readiness and compliance parts of the question live in other systems."

- id: costing-06:52:Q4
  question: "06:52:Q4"
  prompt: >
    For the new overshirt, style STY-9505, what is the target cost at its target margin? What would the garment cost
    be with each of the three shortlisted fabrics (MAT-COT-100 brushed cotton twill, MAT-POL-COT-50 poly-cotton twill and
    MAT-LINEN washed linen), which of them meet the target, and what price would the worst one need to hit the target margin?
  ref:
    - {tool: get_target_cost_for_style, args: {style_id: STY-9505}}
    - {tool: calculate_garment_cost_by_fabric, args: {style_id: STY-9505, material_ids: "MAT-COT-100,MAT-POL-COT-50,MAT-LINEN"}}
  facts: ["9.9", "8.46", "9.04", "10.05", "45.68"]
  notes: "The overshirt is master style STY-9505 (SKU-106335 Rust Overshirt). The three fabrics are the plm / test_lab / supplier_portal shortlist (FAB-900010 brushed cotton twill, FAB-900011 poly-cotton twill, FAB-900012 washed linen, material ids MAT-COT-100, MAT-POL-COT-50, MAT-LINEN)."

- id: costing-06:54:Q1
  question: "06:54:Q1"
  prompt: >
    Reviews of our best-selling 1.7L kettle (SKU K-1700) say the lid leaks. What would a fix cost and how quickly could
    fixed units reach our DC?
  ref:
    - {tool: calculate_fix_cost_and_lead_time_for_sku, args: {sku: K-1700}}
  facts: ["2635", "7556", "45120", "63"]

- id: costing-06:54:Q2
  question: "06:54:Q2"
  prompt: >
    For the range review: over the last six months, what net margin did each of K-1700, PF-220, SKU-101904 and the two
    proposed deletions SKU-101876 and SKU-103640 contribute after markdown and shrink, and which one earns the weakest
    net margin percentage?
  ref:
