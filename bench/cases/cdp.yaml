- id: cdp-02:21:Q5
  question: "02:21:Q5"
  prompt: >
    We are considering charging for returns in the UK. Which of our customer segments would be most affected:
    which return the most, and which are most likely to cut their spending if we introduce a returns charge?
  ref:
    - {tool: get_customer_segment_return_behaviour, args: {market: UK}}
  facts: ["Essential Buyers", "62", "Trend Followers", "28.3"]

- id: cdp-03:27:Q6
  question: "03:27:Q6"
  prompt: >
    Which customer segments are most exposed to stockouts, and how much annual revenue is at risk for each,
    so we know which segments to protect with higher service levels?
  ref:
    - {tool: get_customer_segment_exposure_to_stockouts, args: {}}
  facts: ["Essential Buyers", "58", "4547200", "Fast Fashion Hunters"]

- id: cdp-03:29:Q3
  question: "03:29:Q3"
  prompt: >
    What is the risk of training customers to wait for markdowns? Which customer segments are most likely to wait
    for a discount rather than buy at full price, and how much does their conversion lift when discounted?
  ref:
    - {tool: get_customer_markdown_wait_behaviour, args: {}}
  facts: ["Fast Fashion Hunters", "68", "2.1", "Trend Followers", "55"]

- id: cdp-05:49:Q4
  question: "05:49:Q4"
  prompt: >
    Which customer segments take part least in our resale programme, and what is the main barrier for each:
    awareness, effort or price?
  ref:
    - {tool: get_customer_segment_participation, args: {}}
  facts: ["Essential Buyers", "awareness", "Premium Loyalists", "price", "Fast Fashion Hunters", "effort"]

- id: cdp-06:52:Q1
  question: "06:52:Q1"
