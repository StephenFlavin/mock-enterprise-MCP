- id: store_ops-03:29:Q5
  question: "03:29:Q5"
  prompt: >
    Our three biggest lines of stock older than 180 days are SKU-105054, SKU-101253 and SKU-100658. Which sales channel
    suits each of them best, and roughly what share of full price would we recover through it?
  ref:
    - {tool: get_channel_options_for_line, args: {sku: SKU-105054}}
    - {tool: get_channel_options_for_line, args: {sku: SKU-101253}}
    - {tool: get_channel_options_for_line, args: {sku: SKU-100658}}
  facts: ["Retail", "Outlet", "Online", "53", "51", "45.3"]

- id: store_ops-05:49:Q3
  question: "05:49:Q3"
  prompt: >
    We are looking at taking in-store take-back to all UK stores. What did the pilots achieve on participation, how many
    UK stores have back-room space for it, and at 20% participation what would the rollout cost a year, how many tonnes a
    month would it collect and how much carbon would it save a year?
  ref:
    - {tool: get_take_back_pilot_results, args: {}}
    - {tool: get_store_backroom_space_constraints, args: {country: GB, take_back_space_available: true}}
    - {tool: calculate_take_back_programme_cost, args: {country: GB, participation_rate_pct: 20}}
  facts: ["166", "967500", "132.1", "302.9", "215"]

- id: store_ops-08:71:Q1
  question: "08:71:Q1"
  prompt: >
    My store is ST214 and shrink is worst in Dresses. Raise a stock count on Dresses for Monday and add an action to my
    store plan, "Dresses count and daily floor walk", owned by me, EMP-00536, due in two weeks.
  ref:
    - {tool: create_cycle_count_task_for_store, args: {site_id: ST214, category: Dresses, count_date: +5d, reason: Shrink investigation}}
    - {tool: create_store_action_plan_item, args: {site_id: ST214, title: Dresses count and daily floor walk, employee_id: EMP-00536, due_date: +14d, priority: high, category: Shrink}}
  facts: ["Dresses", "EMP-00536", "floor walk"]

- id: store_ops-08:71:Q2
  question: "08:71:Q2"
  prompt: >
    At my store ST214 three of my best-selling lines have gaps on shelf even though the system shows stock: SKU-100007,
    K-1700 and SKU-100014. What is the likely cause for each, and how many units are in the back room? Then raise a stock
    count and bump up the replenishment priority to 1 for only the two lines that are in the back room, not the third.
  ref:
    - {tool: get_shelf_availability_exceptions_for_store, args: {site_id: ST214}}
    - {tool: create_cycle_count_task_for_store, args: {site_id: ST214, sku: SKU-100007, count_date: +5d, reason: Shelf gap}}
    - {tool: create_cycle_count_task_for_store, args: {site_id: ST214, sku: K-1700, count_date: +5d, reason: Shelf gap}}
    - {tool: update_shelf_replenishment_priority_for_product, args: {site_id: ST214, sku: SKU-100007, priority_level: 1}}
    - {tool: update_shelf_replenishment_priority_for_product, args: {site_id: ST214, sku: K-1700, priority_level: 1}}
  facts: ["112", "84", ["delivery", "short delivery"], "SKU-100014"]

- id: store_ops-08:71:Q3
  question: "08:71:Q3"
  prompt: >
    I'm building next week's staffing plan for my store ST214. What deliveries are scheduled and when, and which tasks
    are in the week plan? Then move Tuesday's receiving task to EMP-00014 and remove the Saturday relabel job from the plan.
  ref:
    - {tool: get_delivery_schedule_for_store, args: {site_id: ST214}}
    - {tool: get_task_list_for_store_week, args: {site_id: ST214}}
    - {tool: reassign_task_to_employee, args: {task_id: TSK-900002, employee_id: EMP-00014}}
    - {tool: delete_task_from_store_week, args: {task_id: TSK-900005}}
  facts: ["Tuesday", "Friday", "06:00", "EMP-00014", "relabel"]

- id: store_ops-08:71:Q5
  question: "08:71:Q5"
  prompt: >
    How does my store ST214 compare with the other stores in its cluster on shrink, availability and labour cost? Where do
    I rank on each, and which one gap would be worth fixing first?
  ref:
    - {tool: get_store_cluster_members, args: {site_id: ST214}}
    - {tool: compare_store_kpis_within_cluster, args: {site_id: ST214}}
  facts: ["availability", "94.2", "96.21", "91", "6084"]

- id: store_ops-08:73:Q1
  question: "08:73:Q1"
  prompt: >
    Store ST214 has been below target for six months while similar stores are on plan. Who are its five closest peer
    stores, how does it compare with them on availability, shrink, labour cost, margin and sales against plan, and can you
    draft the action plan for my visit on Thursday?
  ref:
    - {tool: search_peer_stores_for_store, args: {site_id: ST214, limit_count: 5}}
    - {tool: compare_store_kpis_with_peers, args: {site_id: ST214}}
    - {tool: draft_store_visit_action_plan, args: {site_id: ST214, visit_date: +3d}}
  facts: ["ST206", "ST209", "96.3", "-7.8", "6351"]

- id: store_ops-08:73:Q2
  question: "08:73:Q2"
  prompt: >
    Add the three weakest UK North stores, ST143, ST142 and ST150, to my visit list for a recovery plan review in two
    weeks. I am EMP-00003.
  ref:
    - {tool: create_store_visit_task, args: {site_id: ST143, employee_id: EMP-00003, visit_date: +14d, visit_purpose: Recovery plan review}}
    - {tool: create_store_visit_task, args: {site_id: ST142, employee_id: EMP-00003, visit_date: +14d, visit_purpose: Recovery plan review}}
    - {tool: create_store_visit_task, args: {site_id: ST150, employee_id: EMP-00003, visit_date: +14d, visit_purpose: Recovery plan review}}
  facts: ["ST143", "ST142", "ST150", "Recovery plan review"]
  notes: "Master data has no area manager role, so the visiting manager id EMP-00003 is a placeholder."

- id: store_ops-08:73:Q3
  question: "08:73:Q3"
  prompt: >
    I need to decide where to focus visits next quarter across my UK North region. List the region's stores with their
    latest shrink, availability, labour cost and sales against plan, and tell me which are flagged as below target.
  ref:
    - {tool: list_stores_in_region, args: {region: UK North}}
  facts: ["60", "ST143", "ST142", "ST150"]

- id: store_ops-08:73:Q4
  question: "08:73:Q4"
  prompt: >
    How is the UK North region doing against its sales plan this period? Give me the region's total variance and which
    stores drive the shortfall.
  ref:
    - {tool: get_plan_vs_actual_by_store, args: {region: UK North}}
  facts: ["63530", "ST143", "45500", "ST142", "ST150"]

- id: store_ops-08:74:Q6
  question: "08:74:Q6"
  prompt: >
