- id: qms-01:8:Q4
  question: "01:8:Q4"
  prompt: >
    Finance says ERP and WMS stock are about £1.2m apart as of last night. I want to know how much of that could be
    stock sitting on a quality hold. Draft a root cause write-up on the quality-hold side: how much stock is on hold,
    where is it, what is it worth, and has this kind of hold wave happened before?
  ref:
    - {tool: draft_root_cause_report, args: {analysis_context: "ERP vs WMS stock gap"}}
  facts: ["24338", "1050008", "DC3", "quarantine"]

- id: qms-02:21:Q1
  question: "02:21:Q1"
  prompt: >
    Our top five returned styles are STY-5520, STY-7731, STY-T-4410, STY-PF-220 and STY-K-1700. What did supplier QA
    say about each of them over the last quarter, and which style has the worst record? Then open a QA review on each
    of the five, as top-returns reviews.
  ref:
    - {tool: get_supplier_qa_results_by_style, args: {style_id: STY-5520}}
    - {tool: get_supplier_qa_results_by_style, args: {style_id: STY-7731}}
    - {tool: get_supplier_qa_results_by_style, args: {style_id: STY-T-4410}}
    - {tool: get_supplier_qa_results_by_style, args: {style_id: STY-PF-220}}
    - {tool: get_supplier_qa_results_by_style, args: {style_id: STY-K-1700}}
    - {tool: create_quality_review_request, args: {style_id: STY-5520, review_type: top_returns}}
    - {tool: create_quality_review_request, args: {style_id: STY-7731, review_type: top_returns}}
    - {tool: create_quality_review_request, args: {style_id: STY-T-4410, review_type: top_returns}}
    - {tool: create_quality_review_request, args: {style_id: STY-PF-220, review_type: top_returns}}
    - {tool: create_quality_review_request, args: {style_id: STY-K-1700, review_type: top_returns}}
  facts: ["STY-5520", ["6.8", "6.8%"], ["1.5", "1.5%"]]
  notes: "The top five returned styles come from the returns system (its planted top styles are STY-5520, STY-7731 and STY-T-4410 plus the PF-220 and K-1700 products); qms only supplies the QA side."

- id: qms-04:32:Q3
  question: "04:32:Q3"
  prompt: >
    For next season's bedding range we are comparing suppliers SUP-0039, SUP-0004 and SUP-0011. How do they compare
    on quality for bedding products over the last 12 weeks: defect rate, pass rate and incidents? Who has the best
    and worst record?
  ref:
    - {tool: get_supplier_quality_record, args: {supplier_id: SUP-0039, category: Bedding}}
    - {tool: get_supplier_quality_record, args: {supplier_id: SUP-0004, category: Bedding}}
    - {tool: get_supplier_quality_record, args: {supplier_id: SUP-0011, category: Bedding}}
  facts: [["1.1", "1.1%"], ["2.8", "2.8%"], ["5.3", "5.3%"]]

- id: qms-04:32:Q6
  question: "04:32:Q6"
  prompt: >
    Three of my suppliers have risk alerts: SUP-0053, SUP-0055 and SUP-0001. What quality incidents have each of them
    had in the last 12 weeks, and which one is worst on quality?
  ref:
    - {tool: get_supplier_quality_incidents, args: {supplier_id: SUP-0053, weeks: 12}}
    - {tool: get_supplier_quality_incidents, args: {supplier_id: SUP-0055, weeks: 12}}
    - {tool: get_supplier_quality_incidents, args: {supplier_id: SUP-0001, weeks: 12}}
  facts: ["electrical safety", "Glass cracks", ["Zipper strength", "zip"]]

- id: qms-04:34:Q6
  question: "04:34:Q6"
  prompt: >
    How are our nearshore pilot suppliers SUP-0040, SUP-0044, SUP-0058 and SUP-0039 doing on quality compared with
    our Asian suppliers SUP-0001 and SUP-0002 over the last quarter? Which pilot supplier is performing best?
  ref:
    - {tool: get_supplier_quality_record, args: {supplier_id: SUP-0040}}
    - {tool: get_supplier_quality_record, args: {supplier_id: SUP-0044}}
    - {tool: get_supplier_quality_record, args: {supplier_id: SUP-0058}}
    - {tool: get_supplier_quality_record, args: {supplier_id: SUP-0039}}
    - {tool: get_supplier_quality_record, args: {supplier_id: SUP-0001}}
    - {tool: get_supplier_quality_record, args: {supplier_id: SUP-0002}}
  facts: ["SUP-0040", ["0.8", "0.8%"], ["4.9", "4.9%"], ["3.1", "3.1%"]]

- id: qms-04:35:Q1
  question: "04:35:Q1"
  prompt: >
    Supplier S is SUP-0053 and they have slipped on quality over the last two quarters. Pull its quality incidents
    for that period and tell me whether quality has got worse, how many incidents there were in each quarter and
    what the main problems are.
  ref:
    - {tool: get_supplier_quality_incidents, args: {supplier_id: SUP-0053, weeks: 26}}
  facts: ["Glass cracks", "Electrical insulation", "Glass tumbler"]

- id: qms-04:40:Q1
  question: "04:40:Q1"
  prompt: >
    We are comparing corrugated, moulded pulp and recycled plastic packaging for small appliances. What damage rate
    has each had over the last 12 weeks, and which is lowest and highest?
  ref:
    - {tool: get_damage_rate_by_pack_type, args: {category: Small Appliances, period_weeks: 12}}
  facts: [["1.51", "1.5"], ["1.99", "2.0"], "moulded pulp"]

- id: qms-04:40:Q3
  question: "04:40:Q3"
  prompt: >
    Breakage on glass items is up 40%. The worst two items by claims are K-1700 (the 1.7L glass kettle) and
    SKU-100539. Open a quality investigation on each, covering whether the cause is packaging, the carrier or our
    own handling.
  ref:
    - {tool: create_quality_investigation, args: {sku: K-1700, scope: "Glass breakage up 40%: packaging vs carrier vs warehouse handling"}}
    - {tool: create_quality_investigation, args: {sku: SKU-100539, scope: "Glass breakage up 40%: packaging vs carrier vs warehouse handling"}}
  facts: ["packaging", "carrier", "handling"]

- id: qms-04:40:Q6
  question: "04:40:Q6"
  prompt: >
    For our own e-commerce orders, what damage rate do we see by pack type over the last 12 weeks, and which pack
    type is worst and which is best?
  ref:
    - {tool: get_damage_rate_by_pack_type, args: {channel: ecommerce, period_weeks: 12}}
  facts: ["polybag", ["6.85", "6.8"], "rigid box", ["0.56", "0.6", "0.5"]]

- id: qms-05:42:Q1
  question: "05:42:Q1"
  prompt: >
    Seven bulk lots of our pink polyester blouse, style STY-4012, failed colourfastness to rubbing over the last two
    months. Which lots are they, which factory and supplier made them, and how many units were produced in total?
    Then draft a corrective action request to that supplier and raise it, but do not send it yet.
  ref:
    - {tool: get_production_lot_details, args: {style_id: STY-4012, failed_only: true, date_from: -60d}}
    - {tool: draft_supplier_corrective_action_request, args: {supplier_id: SUP-0064}}
    - {tool: create_supplier_corrective_action_request, args: {supplier_id: SUP-0064, factory_id: FAC-0121, issue_description: "Seven lots failed colourfastness to rubbing", requested_action: "Dye house audit and root cause analysis"}}
  facts: ["FAC-0121", "SUP-0064", "4200"]
  notes: "Units already shipped come from oms, and the hold on unshipped stock from ims; qms only has lots produced, inspections and the corrective action request."

- id: qms-05:42:Q2
  question: "05:42:Q2"
  prompt: >
    Lot LOT-900016 passed everything except zip strength, which is 4% under spec. Reject the lot and tell the
    supplier.
  ref:
    - {tool: get_production_lot_details, args: {lot_id: LOT-900016}}
    - {tool: update_lot_disposition, args: {lot_id: LOT-900016, lot_disposition: reject}}
    - {tool: send_supplier_notification, args: {supplier_id: SUP-0036, factory_id: FAC-0072, lot_id: LOT-900016, issue_description: "Lot rejected: zip strength 4% under specification", requested_action: "Investigate the zip supplier and confirm corrective action"}}
  facts: ["reject", "zip"]

- id: qms-05:42:Q4
  question: "05:42:Q4"
  prompt: >
    Which factories are most likely to cause quality problems next season, looking at defect rate, critical defects,
    on-time delivery and trend over the last 12 weeks? Book an extra inline inspection next week at each of the top
    three.
  ref:
    - {tool: calculate_factory_quality_risk_score, args: {period_weeks: 12}}
    - {tool: create_inspection_booking, args: {factory_id: FAC-0087, scheduled_at: "+7d"}}
    - {tool: create_inspection_booking, args: {factory_id: FAC-0107, scheduled_at: "+7d"}}
    - {tool: create_inspection_booking, args: {factory_id: FAC-0137, scheduled_at: "+7d"}}
  facts: ["FAC-0087", "FAC-0107", "FAC-0137"]

- id: qms-05:42:Q5
  question: "05:42:Q5"
  prompt: >
    Complaints about shoe sole separation on SKU-100301, made at FAC-0081, are up over the last three months. What do
    the factory's inline inspection results for the last three months show, is the defect rate getting worse, and
    what is the latest result? Then open a quality incident for the sole separation problem on that SKU and factory.
  ref:
    - {tool: get_factory_defect_inspection_results, args: {factory_id: FAC-0081, inspection_type: inline, date_from: -120d}}
    - {tool: create_quality_incident, args: {sku: SKU-100301, factory_id: FAC-0081, issue_description: "Sole separation failures up over the last three months"}}
  facts: [["2.5", "2.5%"], ["8.8", "8.8%"], ["6.7", "6.7%"], "sole separation"]
  notes: "Returns, review text and material batches come from other systems, and the stock hold from ims; qms only has the factory inspection history and the incident."

- id: qms-05:44:Q2
  question: "05:44:Q2"
  prompt: >
    A leather bag, SKU-101813, failed the chromium VI test. Its leather came from batch BATCH-LEATHER-002, tanned at
    tannery factory FAC-0092 (supplier SUP-0049). Which production lots used that batch, which SKUs and factories
    were they, and how many units in total? Then open a quality incident for the chromium VI failure on the bag, and
    send the tannery supplier a notification asking for their tanning and subcontract records.
  ref:
    - {tool: get_production_lot_details, args: {batch_id: BATCH-LEATHER-002}}
    - {tool: create_quality_incident, args: {sku: SKU-101813, factory_id: FAC-0082, issue_description: "Leather bag failed chromium VI test"}}
    - {tool: send_supplier_notification, args: {supplier_id: SUP-0049, factory_id: FAC-0092, issue_description: "Chromium VI failure on leather from batch BATCH-LEATHER-002", requested_action: "Provide tanning and subcontractor process records for the batch"}}
  facts: ["SKU-103199", "SKU-103745", "FAC-0105", "FAC-0041"]
  notes: "The draft-then-send flow needs an existing incident id for draft_supplier_notification, so the case sends directly; tracing the tannery and subcontractor is plm, and the stock hold is ims."

- id: qms-06:51:Q2
  question: "06:51:Q2"
  prompt: >
    For the new insulated lunch box we want to release the PO only after the pre-production sample is checked. What
    tests and thresholds must the pre-production sample for an insulated lunch box meet, and which failures would
    block the PO?
  ref:
    - {tool: list_preproduction_sample_acceptance_criteria, args: {product_type: insulated lunch box}}
  facts: ["thermal retention", "leak", "food contact", "critical"]
  notes: "The lunch box has no style or SKU in master data, so the criteria are looked up by product type."

- id: qms-06:51:Q4
  question: "06:51:Q4"
  prompt: >
    The backpack sample, style STY-4012 (SKU-100007, supplier SUP-0064, factory FAC-0121), failed the zip pull
    strength test again. Raise a corrective action request against the supplier for the zip pull strength failures,
    asking for a root cause analysis and a switch back to the approved zip supplier.
  ref:
    - {tool: create_supplier_corrective_action_request, args: {supplier_id: SUP-0064, factory_id: FAC-0121, sku: SKU-100007, issue_description: "Backpack sample failed zip pull strength test again", requested_action: "Root cause analysis and revert to the approved zip supplier"}}
  facts: ["SUP-0064", "zip"]
  notes: "Master data names SKU-100007 / STY-4012 'Blush Blouse 10', while test_lab and supplier_portal call style STY-4012 a backpack."

- id: qms-06:53:Q1
  question: "06:53:Q1"
  prompt: >
    Returns say size 14 trousers of style STY-T-4410 (SKU-100651, made at FAC-0072) are "too tight at the hip". What
    do the inspection measurements of the hip width on that SKU show against spec and tolerance across recent lots,
    and is the factory missing its tolerance? For the latest measured lot, LOT-900004, how far off spec is it?
  ref:
    - {tool: get_inspection_measurements_for_style, args: {style_id: STY-T-4410, sku: SKU-100651, measurement_type: hip_width}}
    - {tool: calculate_measurement_deviation_vs_tolerance, args: {lot_id: LOT-900004, measurement_type: hip_width}}
  facts: [["95.5", "95.5 cm"], ["94.1", "94.1 cm"], ["-1.4", "1.4"]]
  notes: "Returns, grade rules and sales by size come from other systems; qms supplies the measured hip widths."

- id: qms-06:53:Q4
  question: "06:53:Q4"
  prompt: >
    We need a shrinkage tolerance for the cotton knit jersey SKU-103808, made at FAC-0001. What do industry and
    internal standards say for cotton knit shrinkage, how capable is that factory (pass rate and defect rate over
    12 weeks), and what tolerance would you recommend, using the tighter figure?
  ref:
    - {tool: get_factory_process_capability, args: {factory_id: FAC-0001}}
    - {tool: search_knowledge_base_for_tolerance_standards, args: {search_term: knit shrinkage, material: cotton}}
    - {tool: calculate_recommended_tolerance, args: {factory_id: FAC-0001, material: cotton, measurement_type: shrinkage, construction: knit}}
  facts: [["79.1", "79.1%"], ["3.0", "3%", "3.0%"], ["4.2", "4.2%"], "ISO"]
  notes: "Shrinkage test results come from test_lab and the tech pack update from plm."

- id: qms-06:54:Q1
  question: "06:54:Q1"
  prompt: >
    Sales and ratings for our best-selling 1.7L kettle, SKU K-1700, have been dropping for eight weeks. What quality
    incidents has the kettle had over the last eight weeks, and how serious are they? Then put a quality hold on the
    SKU until we know the cause.
  ref:
    - {tool: get_quality_defects_for_sku, args: {sku: K-1700, weeks: 8}}
    - {tool: create_quality_hold_for_sku, args: {sku: K-1700, hold_reason: "Hold pending investigation of base seal cracking and leaks"}}
  facts: ["hairline cracks", "leak", "base seal", "high"]
  notes: "Reviews, returns, prices and competitor launches come from other systems; qms supplies the quality incidents and the hold."

- id: qms-06:55:Q3
  question: "06:55:Q3"
  prompt: >
    We are choosing between a rigid box and a flexible pouch for a new product's packaging. What damage rate have
    those two pack types had in e-commerce over the last 12 weeks, and which protects better?
  ref:
    - {tool: get_damage_rate_by_pack_type, args: {channel: ecommerce, period_weeks: 12}}
  facts: ["rigid box", ["0.56", "0.6"], "pouch", ["3.95", "4.0"]]
  notes: "Costs, pallet fill and recyclability come from other systems; qms supplies the damage rates."
