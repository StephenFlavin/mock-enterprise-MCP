- id: returns-07:63:Q2
  question: "07:63:Q2"
  prompt: >
    For the cost-to-serve build, what do returns cost us in each online sales channel over the last 90 days:
    net returns cost in total, per order and per pound of sales? Which channel costs the most in total and which
    is cheapest per order?
  ref:
    - {tool: get_returns_cost_by_channel, args: {days_back: 90}}
  facts: ["web", ["30392.62", "30393"], "app", "5.81"]
  notes: "Returns data has no store or wholesale channels (only web, app, click_collect, marketplace) and only the last 13 weeks, so FY26 actuals and stores/wholesale cannot be answered from this system."
