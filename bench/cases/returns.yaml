- id: returns-02:21:Q1
  question: "02:21:Q1"
  prompt: >
    What are our five most returned styles over the last 90 days? For the top one, what are customers' main reasons
    for returning it, and what would cutting its returns by 10% save us over a year?
  ref:
    - {tool: list_top_returned_styles, args: {limit_count: 5}}
    - {tool: get_return_reasons_by_style, args: {style_id: STY-5520}}
    - {tool: calculate_return_reduction_savings, args: {style_id: STY-5520, reduction_pct: 10}}
  facts: ["STY-5520", "STY-T-4410", "STY-4171", ["wrong size", "too large or too small"], ["505.89", "506"]]

- id: returns-02:21:Q2-a
  question: "02:21:Q2"
  prompt: >
    For returned items in the Audio category (our earbuds and headphones), compare restocking, refurbishing,
    selling to a liquidator and recycling on recovered value, handling cost, time to sell and brand risk, using
    the last six months. Which route should we change first, how does the answer shift for items older than
    60 days, and what would that change be worth over a year?
  ref:
    - {tool: get_disposition_route_outcomes, args: {category: Audio}}
    - {tool: get_return_item_age_profile, args: {category: Audio}}
    - {tool: get_liquidator_recovery_rates, args: {category: Audio}}
    - {tool: calculate_annual_disposition_change_value, args: {category: Audio, old_route: recycled, new_route: liquidated}}
  facts: ["recycled", "liquidated", "28.06", ["2444", "2444.21"]]
  notes: "Master data has no chargers or cables, so 'electronics accessories' is covered by the Audio (earbuds, headphones) category only."

- id: returns-02:21:Q2-b
  question: "02:21:Q2"
  prompt: >
    Change the Audio rule for items older than 60 days to liquidation, and retire the older 90+ day Audio
    recycling rule that this replaces.
  ref:
    - {tool: get_return_item_age_profile, args: {category: Audio}}
    - {tool: update_disposition_rule, args: {rule_id: DIS-900003, disposition_route: liquidated}}
    - {tool: delete_disposition_rule, args: {rule_id: DIS-900004}}
  facts: ["liquidated", "DIS-900003", "DIS-900004"]

- id: returns-02:21:Q3
  question: "02:21:Q3"
  prompt: >
    Looking at the last 52 weeks of returns, which week was the peak and how many items came back that week?
    And what does the returns centre plan look like over the next four months: on the days forecast returns
    exceed capacity, what is the most agency staff we would need on a single day?
  ref:
    - {tool: get_historical_weekly_returns, args: {weeks_back: 52}}
    - {tool: get_returns_centre_capacity, args: {date_from: "+1d", date_to: "+130d", peak_only: true}}
  facts: ["2026-01-05", "947", "11"]

- id: returns-02:21:Q4
  question: "02:21:Q4"
  prompt: >
    What returned-goods handling practices do we run today in Germany (DE), France (FR) and the Netherlands (NL),
    and which of them conflict with the regulation they relate to?
  ref:
    - {tool: get_returns_handling_practices, args: {country: DE}}
    - {tool: get_returns_handling_practices, args: {country: FR}}
    - {tool: get_returns_handling_practices, args: {country: NL}}
  facts: ["destroyed", "90 days", "21 days"]

- id: returns-02:21:Q5-a
  question: "02:21:Q5"
  prompt: >
    We are thinking of charging for returns in Germany (DE). What does a return cost us per order there compared
    with GB, and what would a 4.99 pound returns charge do to our return rate, conversion and annual margin?
    Draft the trial plan too.
  ref:
    - {tool: get_return_cost_per_order, args: {}}
    - {tool: calculate_returns_charge_impact, args: {market: DE, charge_gbp: 4.99}}
    - {tool: draft_returns_charge_trial_plan, args: {market: DE, proposed_charge_gbp: 4.99}}
  facts: ["7.85", "5.98", "16.5", "5393"]

- id: returns-02:21:Q5-b
  question: "02:21:Q5"
  prompt: >
    The returns charge has been signed off. Set up a trial at 4.99 pounds per return in Germany (DE) and the
    Netherlands (NL), starting in two weeks and running ten weeks.
  ref:
    - {tool: create_returns_charge_trial, args: {market: DE, charge_gbp: 4.99, start_date: "+14d", end_date: "+84d"}}
    - {tool: create_returns_charge_trial, args: {market: NL, charge_gbp: 4.99, start_date: "+14d", end_date: "+84d"}}
  facts: ["DE", "NL", "4.99"]

