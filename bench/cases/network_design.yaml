- id: network_design-03:31:Q1-a
  question: "03:31:Q1"
  prompt: >
    We're considering a second DC in the Midlands. Compare keeping the current network anchored on Northampton, a second
    owned DC in the Midlands, and a third-party partner on total annual cost, delivery times to stores and resilience.
    What volume does the owned DC need to reach to break even against the current network, and how does that change if
    e-commerce reaches 40% of sales?
  ref:
    - {tool: run_network_scenario, args: {}}
    - {tool: calculate_break_even_volume, args: {baseline_scenario_id: NS-000001, alternative_scenario_id: NS-000002}}
    - {tool: calculate_break_even_volume, args: {baseline_scenario_id: NS-000001, alternative_scenario_id: NS-000002, ecommerce_share_pct: 40}}
  facts: ["32692575", "31517600", "9086655", "5654895"]

- id: network_design-03:31:Q1-b
  question: "03:31:Q1"
  prompt: >
    Over five years including set-up costs, what does the current network (NS-000001) cost in total compared with a second
    owned Midlands DC (NS-000002)? And what would a 15% rent increase do to the owned DC's five-year total?
  ref:
    - {tool: calculate_network_total_cost, args: {scenario_id: NS-000001, years: 5}}
    - {tool: calculate_network_total_cost, args: {scenario_id: NS-000002, years: 5}}
    - {tool: calculate_network_total_cost, args: {scenario_id: NS-000002, years: 5, rent_increase_pct: 15}}
  facts: ["159530125", "169962875", "174087875"]

- id: network_design-03:31:Q1-c
  question: "03:31:Q1"
  prompt: >
    What does the current network cost us per year today, by DC (Northampton, Daventry, Leeds), covering handling,
    transport, rent, labour and overhead, and what is the network total?
  ref:
    - {tool: get_network_baseline_costs, args: {}}
  facts: ["16596000", "8914400", "6395625", "31906025"]

- id: network_design-03:31:Q2-a
  question: "03:31:Q2"
  prompt: >
    What volumes should the network handle in 2030, split by region and channel, assuming 5% growth a year? Show what
    happens to e-commerce volume if its share of volume reaches 40% compared with staying at today's share.
  ref:
    - {tool: run_network_volume_forecast, args: {growth_rate_pct: 5, ecommerce_penetration_pct: 40, target_year: 2030}}
    - {tool: run_network_volume_forecast, args: {growth_rate_pct: 5, ecommerce_penetration_pct: 22, target_year: 2030}}
  facts: ["6064466", "2425786", "1334182"]

- id: network_design-03:31:Q2-b
  question: "03:31:Q2"
  prompt: >
    What does the long-term growth plan assume up to 2030, including any new market, and what e-commerce share does
    the forecast reach by then?
  ref:
    - {tool: get_long_term_growth_plan, args: {year: 2030}}
    - {tool: get_ecommerce_share_forecast, args: {}}
  facts: ["Czechia", "23.9", "40"]

- id: network_design-03:31:Q3-a
  question: "03:31:Q3"
  prompt: >
    Compare the three shortlisted sites for a new DC on rent, labour cost and supply, and local incentives, and flag the
    main risk with each (labour supply, transport links, planning).
  ref:
    - {tool: get_site_shortlist, args: {}}
    - {tool: get_labour_cost_and_supply_by_region, args: {}}
  facts: ["1900000", "1500000", "1700000", "judicial review"]

- id: network_design-03:31:Q3-b
  question: "03:31:Q3"
  prompt: >
    Doncaster iPort (SC-900003) is the weakest of the three shortlisted sites, with the highest planning risk and the
    weakest labour supply. Remove it from the shortlist.
  ref:
    - {tool: remove_site_from_shortlist, args: {candidate_id: SC-900003, removed_reason: Highest planning risk and weakest labour supply}}
  facts: ["SC-900003", "removed"]

- id: network_design-03:31:Q4
  question: "03:31:Q4"
  prompt: >
    I think the network is less efficient than it should be. Looking at cross-shipping, split orders, long hauls and
    underused sites, which are the top three inefficiencies by annual saving, what would fixing them cost in total, what
    saving would that give, and how much of the saving is about inventory placement rather than where the sites are?
  ref:
    - {tool: calculate_inefficiency_fix_cost, args: {top_n: 3}}
  facts: ["910000", "625000", "72", ["long haul", "long_haul"]]

- id: network_design-03:31:Q5-a
  question: "03:31:Q5"
  prompt: >
    Should we close the small southern DC (Daventry, DC2) and consolidate into Northampton and Leeds (scenario NS-000004)?
    What does the consolidated network cost a year, how does delivery time to stores and redundancy change, and can it
    handle a peak 25% above average volume?
  ref:
    - {tool: run_network_scenario, args: {scenario_id: NS-000004}}
    - {tool: calculate_service_impact, args: {scenario_id: NS-000004}}
    - {tool: calculate_peak_capacity_risk, args: {scenario_id: NS-000004, peak_volume_uplift_pct: 25}}
  facts: ["29253115", "2.5", "38", "1925"]
  # scenario facts reviewed: the business case asks for the network cost
  scenario_facts: ["29253115", "2.5", "38", "1925"]
  notes: "Master data has no small southern DC: the UK DCs are DC1 Northampton, DC2 Daventry (Midlands) and DC3 Leeds. DC2 Daventry is used as the DC to close."

- id: network_design-03:31:Q5-b
  question: "03:31:Q5"
  prompt: >
    Draft the business case for closing Daventry DC2 and consolidating into Northampton and Leeds (scenario NS-000004)
    against the current network, covering saving, one-off cost, payback and service impact. I want to review it before it
    goes to the CFO.
  ref:
    - {tool: draft_business_case, args: {scenario_id: NS-000004}}
  facts: ["2652910", "2800000", "1.1"]

- id: network_design-03:31:Q6
  question: "03:31:Q6"
  prompt: >
    How resilient are we if DC1 is offline for two weeks? What share of service is lost, how much volume can the other DCs
    absorb per day, and how much extra buffer inventory would cover the gap at a 95% service target?
  ref:
    - {tool: run_dc_outage_scenario, args: {down_site: DC1, outage_days: 14}}
    - {tool: get_alternative_dc_capacity, args: {excluding_site: DC1}}
    - {tool: calculate_buffer_stock_requirement, args: {down_site: DC1, outage_days: 14, target_service_pct: 95}}
  facts: ["41.6", "2300", "75810"]

- id: network_design-04:33:Q6
  question: "04:33:Q6"
  prompt: >
    If we had to diversify away from southern China because of new tariffs, what happens to inbound lead times and unit
    cost under each alternative origin the network model covers, compared with today?
  ref:
    - {tool: run_network_scenario, args: {}}
  facts: ["38", "43", "5.5", "14", "12.5"]
  notes: "Master data has no factory or supplier origin-region split for southern China, so the scenarios carry assumed inbound lead-time and cost-change figures."

- id: network_design-06:51:Q5
  question: "06:51:Q5"
  prompt: >
    A new product (the insulated lunch box) has 9,500 pounds of one-off tooling and development, sells at 13.99 pounds a
    unit and costs 3.90 pounds a unit to make. What is the break-even volume?
  ref:
    - {tool: calculate_break_even_volume, args: {fixed_cost_gbp: 9500, unit_price_gbp: 13.99, unit_variable_cost_gbp: 3.9}}
  facts: [["942", "941"]]
  notes: "This server only does generic break-even maths from fixed cost, price and unit cost; unit cost and margin at volumes for a real product come from the costing system."

- id: network_design-07:63:Q3
  question: "07:63:Q3"
  prompt: >
    Is it cheaper to serve northern store ST141 from the main DC (DC1) direct or through a regional cross-dock, counting
    handling, transport and inventory holding at about 40,000 units a week? How does that change at peak?
  ref:
    - {tool: calculate_network_cost_comparison, args: {origin_site: DC1, dest_site: ST141, weekly_volume_units: 40000}}
  facts: ["2.19", "2.54", "2.82", "2.65"]

