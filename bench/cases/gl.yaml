- id: gl-01:6:Q1
  question: "01:6:Q1"
  prompt: >
    Cost per unit shipped at Northampton DC (DC1) went up about 9% last month compared with the month before. Split the
    increase by labour, overtime, agency, damages, rework, energy and rent, tell me which line drove most of it, and how
    last month's cost per unit compares with the same month a year earlier.
  ref:
    - {tool: get_cost_centre_actuals, args: {site_id: DC1}}
    - {tool: get_cost_centre_actuals, args: {site_id: DC1, period: FY26-08}}
  facts: ["overtime", "207648", "70.39", "64.58", "63.26"]

- id: gl-01:6:Q3
  question: "01:6:Q3"
  prompt: >
    We need to fill a 45 FTE headcount gap at Northampton DC (DC1) for peak, starting in about four weeks and running for
    eight weeks. Compare the total cost of adding a late shift (22:00 to 06:00) with paying overtime on the two existing
    shifts, including premiums, agency fees and allowances.
  ref:
    - {tool: calculate_shift_option_cost, args: {site_id: DC1, period_start: "+29d", period_end: "+84d", headcount_gap: 45}}
  facts: ["288462", "322387", "39312"]

- id: gl-01:6:Q4
  question: "01:6:Q4"
  prompt: >
    We want to compare our DC cost and productivity with other retail DCs. For Northampton DC (DC1) over the last three
    months, what are our cost per unit shipped, labour cost per unit and units per paid hour, and what exactly is
    included in those measures?
  ref:
    - {tool: get_dc_cost_and_productivity_kpis, args: {site_id: DC1}}
  facts: [["65.99", "66p", "0.66"], ["46.55", "47p", "0.47"], "32.3", "excludes management"]

- id: gl-01:8:Q2
  question: "01:8:Q2"
  prompt: >
    ERP shows more units of SKU-100007 at Northampton DC (DC1) than WMS does. What does ERP hold for that SKU at DC1:
    quantity, unit cost and total value?
  ref:
    - {tool: get_erp_stock_by_sku, args: {sku: SKU-100007, site_id: DC1}}
  facts: ["5392", "28.95", ["156098.4", "156098", "156,098"]]

- id: gl-01:8:Q4
  question: "01:8:Q4"
  prompt: >
    Finance is asking about a gap of about £1.2m between ERP and WMS stock as of last night. From the ERP side, what
    does ERP hold for SKU-100819 at Leeds DC (DC3), and which goods movements are posted in one system but still pending
    in the other, how many and worth how much in total?
  ref:
    - {tool: get_erp_stock_by_sku, args: {sku: SKU-100819, site_id: DC3}}
    - {tool: list_in_transit_documents, args: {}}
  facts: ["5878", ["258161.76", "258162", "258,162"], "11", ["139557.88", "139558", "139,558"]]

- id: gl-05:49:Q5
  question: "05:49:Q5"
  prompt: >
    For the last 12 months, what handling cost and recovered value did we have in each circular economy recovery channel
    (take-back, resale, repair, recycling), in total, and which channel recovered the most per pound of handling cost?
  ref:
    - {tool: get_handling_cost_by_channel, args: {}}
    - {tool: get_recovered_value_by_channel, args: {}}
  facts: [["resale", "reuse"], "1.37", "2140", ["1839.5", "1839.50", "1,840"]]

- id: gl-07:61:Q1
  question: "07:61:Q1"
  prompt: >
    Operating profit for last month is well below budget. List the one-off manual journals of £50k or more posted last
    month with their profit impact and the net total, and the timing items (accruals, prepayments, phasing) of £50k or
    more that reverse in later periods and their total.
  ref:
    - {tool: list_one_off_journals, args: {min_amount_gbp: 50000}}
    - {tool: list_timing_items, args: {min_amount_gbp: 50000}}
  facts: ["redundancy", "385000", "610000", "575000", "310000"]

- id: gl-07:61:Q2-a
  question: "07:61:Q2"
  prompt: >
    Intercompany between the UK entity (LE-UK) and the Polish entity (LE-PL) is out by about £340k. Show the position and
    the transactions behind the difference by currency and posting date, and tell me how much is FX, how much timing
    and how much a missing invoice.
  ref:
    - {tool: get_intercompany_balances, args: {from_entity_id: LE-UK, to_entity_id: LE-PL}}
    - {tool: list_intercompany_transactions, args: {from_entity_id: LE-UK, to_entity_id: LE-PL, status: unmatched}}
  facts: ["340000", ["189997.7", "189998"], "120000", ["30002.3", "30002"]]
  notes: "Master legal_entities has no LE-PL (Polish entity) yet; it is staged in systems/_master/pending. Entity-id resolution on write tools and the entity lint need it applied."

- id: gl-07:61:Q2-b
  question: "07:61:Q2"
  prompt: >
    Prepare the clearing journals for the difference on intercompany from the UK entity (LE-UK) to the Polish entity
    (LE-PL), one for each cause, with amounts and which entity books them, for me to approve.
  ref:
    - {tool: draft_clearing_journals, args: {from_entity_id: LE-UK, to_entity_id: LE-PL}}
  facts: [["189997.7", "189998"], "120000", ["30002.3", "30002"], "LE-PL"]
  notes: "Master legal_entities has no LE-PL (Polish entity) yet; it is staged in systems/_master/pending. Entity-id resolution on write tools and the entity lint need it applied."

- id: gl-07:61:Q2-c
  question: "07:61:Q2"
  prompt: >
    I approve the FX clearing journal. Create it as a draft in LE-PL for £30,002.30, debiting account 8100 (FX gains and
    losses) and crediting account 2300 (intercompany payable), described as clearing the UK-PL FX difference. I'm EMP-00087.
  ref:
    - {tool: create_journal_entry, args: {entity_id: LE-PL, posting_date: "-5d", description: "Clear UK-PL intercompany FX difference", total_debit_gbp: 30002.3, debit_account: "8100", credit_account: "2300", je_type: intercompany, created_by: EMP-00087}}
  facts: ["30002.3", "8100", "2300", "LE-PL"]
  notes: "Master legal_entities has no LE-PL (Polish entity) yet; it is staged in systems/_master/pending. Entity-id resolution on write tools and the entity lint need it applied."

- id: gl-07:61:Q2-d
  question: "07:61:Q2"
  prompt: >
    Draft journal JE-900012 is a duplicate of JE-900011 for the UK-PL intercompany clearing. Delete JE-900012.
  ref:
    - {tool: delete_draft_journal, args: {je_id: JE-900012}}
  facts: ["JE-900012"]

- id: gl-07:61:Q2-e
  question: "07:61:Q2"
  prompt: >
    I have checked draft journal JE-900011, the UK-PL intercompany clearing for the missing invoices. Submit it for
    approval as EMP-00087.
  ref:
    - {tool: submit_journal_for_approval, args: {je_id: JE-900011, submitted_by: EMP-00087}}
  facts: ["JE-900011", "EMP-00087"]

- id: gl-07:61:Q4-a
  question: "07:61:Q4"
  prompt: >
    What accruals are still open at close that have been open for more than two months? Give me the total, the owners
    and the largest one.
  ref:
    - {tool: list_open_accruals, args: {min_age_days: 60}}
  facts: ["176650", "EMP-00086", "56200", "Columbus"]

- id: gl-07:61:Q4-b
  question: "07:61:Q4"
  prompt: >
    Which balance sheet reconciliations have been open or disputed for more than two months, who is the preparer holding
    the most of them, and which one is disputed?
  ref:
    - {tool: list_unreconciled_accounts, args: {min_age_days: 60}}
  facts: ["EMP-00086", "64100", "disputed", "Trade payables"]

- id: gl-07:61:Q4-c
  question: "07:61:Q4"
  prompt: >
    EMP-00086 is on leave. Reassign reconciliation R-900001 to EMP-00088.
  ref:
    - {tool: reassign_reconciliation, args: {recon_id: R-900001, assigned_to: EMP-00088}}
  facts: ["R-900001", "EMP-00088"]

- id: gl-07:61:Q5-a
  question: "07:61:Q5"
  prompt: >
    Freight cost in the P&L is about £210k off the logistics system. Show the freight posted to the ledger over the last
    four weeks by account and carrier, and flag any freight invoices coded to non-freight accounts.
  ref:
    - {tool: get_freight_cost_by_ledger_account, args: {period_start: "-28d"}}
  facts: ["509970", "18400", "9750", "6120", "4860"]

- id: gl-07:61:Q5-b
  question: "07:61:Q5"
  prompt: >
    Go ahead and post the accrual in LE-UK for the £208,822 of unaccrued freight invoices, charged to freight account
    5110 for period FY27-08 and reversing in 30 days. I'm EMP-00087.
  ref:
    - {tool: create_accrual_journal, args: {entity_id: LE-UK, period: FY27-08, description: "Accrual for unaccrued freight invoices", amount_gbp: 208822, reversal_date: "+30d", account_code: "5110", owner_id: EMP-00087}}
  facts: ["208822", "5110", "FY27-08"]

- id: gl-07:62:Q5
  question: "07:62:Q5"
  prompt: >
    What would a 10% fall in sterling against the dollar do to our cost of goods? Give me our USD-denominated cost of
    goods in sterling over the last 12 months, its share of total cost of goods, and the extra cost before hedges.
  ref:
    - {tool: get_usd_cogs_exposure, args: {sterling_fall_pct: 10}}
  facts: [["167669969", "167.7m"], "80.1", ["18629997", "18.6m"]]

- id: gl-07:65:Q3
  question: "07:65:Q3"
  prompt: >
    Prepare the bad-debt provision increase journal for my approval: a draft in LE-UK for £85,000, debiting account 6800
    (bad debt expense) and crediting account 1210 (provision for doubtful debts). I'm EMP-00087.
  ref:
    - {tool: create_journal_entry, args: {entity_id: LE-UK, posting_date: "-5d", description: "Increase bad debt provision", total_debit_gbp: 85000, debit_account: "6800", credit_account: "1210", created_by: EMP-00087}}
  facts: ["85000", "6800", "1210", "LE-UK"]
