- id: store_wfm-07:68:Q5-a
  question: "07:68:Q5"
  prompt: >
    Shrink at our Leeds store ST150 has roughly tripled over the last three weeks. The losses look like removals from
    the stockroom around 8pm on Tuesday, Thursday and Friday evenings, after the store has closed. From the staff
    schedules for the last three weeks, who is rostered on stockroom duties and until what time, and who is rostered
    to close the store on those evenings?
  ref:
    - {tool: get_store_staff_schedules, args: {site_id: ST150, date_from: -21d}}
  facts: ["Liam Pearson", "16:00", "Chloe Barnes", "Rhys Edwards"]

- id: store_wfm-08:71:Q1-a
  question: "08:71:Q1"
  prompt: >
    My store ST214 has high shrink. Looking at the rota for the last four weeks, who receives the Friday deliveries
    and are they on their own, and who is on the shop floor on Monday afternoons around 3pm?
  ref:
    - {tool: get_staff_rota_for_store, args: {site_id: ST214, date_from: -28d, weekday: Friday, task_category: receiving}}
    - {tool: get_staff_rota_for_store, args: {site_id: ST214, date_from: -28d, weekday: Monday, on_shift_at: "15:00"}}
  facts: ["Callum Reid", "agency", "Aisha Khan"]

- id: store_wfm-08:71:Q3-a
  question: "08:71:Q3"
  prompt: >
    Plan next week's staffing for my store ST214. The footfall forecast is about 15,300 visitors for the week, with
    deliveries on Tuesday and Friday. Assume two people are off sick on Saturday. By hour on Saturday, where am I
    short or over, and what is the minimum cover?
  ref:
    - {tool: calculate_hourly_labour_requirement, args: {site_id: ST214, forecast_footfall: 15300, day: Saturday, staff_off: 2}}
  facts: ["11:00", "17:00", "short"]

- id: store_wfm-08:71:Q3-b
  question: "08:71:Q3"
  prompt: >
    Which of our routine store tasks can safely slip from Saturday to Sunday, and by how many days can each one slip?
  ref:
    - {tool: get_labour_standards_for_tasks, args: {}}
  facts: ["relabel", "stock", "cleaning"]

- id: store_wfm-08:71:Q3-c
  question: "08:71:Q3"
  prompt: >
    I'm the manager of store ST214 (EMP-00536). Next week's rota looks right, so approve it, then move Priya's
    Saturday shift to Sunday, 10:00 to 16:00.
  ref:
    - {tool: get_staff_rota_for_store, args: {site_id: ST214, date_from: +7d, date_to: +7d, weekday: Saturday}}
    - {tool: approve_rota_for_store, args: {rota_id: ROT-900001, approved_by: EMP-00536}}
    - {tool: update_shift_for_employee, args: {shift_id: SFT-900038, shift_date: +13d, start_time: "10:00", end_time: "16:00"}}
  facts: ["10:00", "16:00", "EMP-00536"]

- id: store_wfm-08:71:Q5-a
  question: "08:71:Q5"
  prompt: >
    I manage store ST214, which is in cluster B. How does my labour cost as a percentage of sales over the last four
    weeks compare with the other cluster B stores, and where do I rank?
  ref:
    - {tool: get_labour_cost_percentage_by_store, args: {site_id: ST214, cluster: B, date_from: -28d}}
  facts: ["14.5", "97", "11.5"]

- id: store_wfm-08:73:Q1-a
  question: "08:73:Q1"
  prompt: >
    Store ST214 has been below target for six months. Compare its staffing with its closest peers ST206, ST209, ST202
    and ST210: headcount, FTE, agency use and any vacancies. What is different?
  ref:
    - {tool: get_staffing_levels_for_store, args: {site_id: ST214}}
    - {tool: get_staffing_levels_for_store, args: {site_id: ST206}}
    - {tool: get_staffing_levels_for_store, args: {site_id: ST209}}
    - {tool: get_staffing_levels_for_store, args: {site_id: ST202}}
    - {tool: get_staffing_levels_for_store, args: {site_id: ST210}}
  facts: ["7.82", "Assistant Manager", "agency"]

- id: store_wfm-08:73:Q2-a
  question: "08:73:Q2"
  prompt: >
    Which stores in UK North have the highest labour cost as a percentage of sales over the last four weeks? Give me
    the top three with their percentages.
  ref:
    - {tool: get_labour_cost_percentage_by_store, args: {region: UK North, date_from: -28d}}
  facts: ["ST150", "14.4", "ST143", "12.1", "ST142"]

- id: store_wfm-08:79:Q1-a
  question: "08:79:Q1"
  prompt: >
    Loss prevention, UK North. Till voids cluster on Thursday afternoons, around 14:00 to 16:00. Check the staff rotas
    across the region for the last six weeks: which store relies on a single person on the tills at that time, and who
    is it?
  ref:
    - {tool: get_staff_rota_for_stores, args: {region: UK North, weekday: Thursday, task_category: till, on_shift_at: "15:00", date_from: -42d}}
  facts: ["ST159", "Cameron Hill", "Store Manager"]
