- id: fixed_assets-01:10:Q4-a
  question: "01:10:Q4"
  prompt: >
    The DC1 tilt-tray sorter AST-DC1-SRT is costing more to maintain and we're weighing repair, overhaul or
    replacement. What is its net book value today, what did it cost, how much has been depreciated, and what
    would it cost to replace?
  ref:
    - {tool: get_asset_book_value, args: {asset_id: AST-DC1-SRT}}
  facts: [["1076935.89", "1076936", "1,076,936"], ["2350000", "2.35m"], ["1273064", "1,273,064"], ["2742290", "2.74m", "2.7m"]]
  notes: "Master data gives the sorter an install date of 2018-09-09 (about 8 years old) while the question says nearly 12 years old; master data is out of scope so the register follows master."

- id: fixed_assets-07:67:Q6-a
  question: "07:67:Q6"
  prompt: >
    How much capital investment do we have planned for DC automation, and how much for renewable energy?
    List the projects and amounts so we can assess tax incentive claims.
  ref:
    - {tool: get_planned_capex_by_type, args: {investment_type: automation}}
    - {tool: get_planned_capex_by_type, args: {investment_type: renewable_energy}}
  facts: [["1700000", "1.7m", "1,700,000"], ["455000", "455,000", "455k"], "650000", "450000", "250000"]
