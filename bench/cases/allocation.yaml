- id: allocation-02:19:Q5
  question: "02:19:Q5"
  prompt: >
    A northern Europe port closure is expected to run two weeks. For the Smart Home category, what is the best
    reallocation of stock across our regions, what does it cost and what sales does it protect? Then the same if
    the closure runs four weeks.
  ref:
    - {tool: calculate_stock_reallocation_plan, args: {scenario: port_closure_2w, category: Smart Home}}
    - {tool: calculate_stock_reallocation_plan, args: {scenario: port_closure_4w, category: Smart Home}}
  facts: ["EU Central", "UK Midlands", "1200", "Scotland", "2400"]

- id: allocation-03:22:Q1
  question: "03:22:Q1"
  prompt: >
    Style STY-5520 stocked out in 40 stores for nine days last month. Look at the store allocations for that style
    over the last 60 days: what happened to the allocations for those stores, why, and when did they finally get
    stock?
  ref:
    - {tool: get_store_allocations_for_product, args: {style_id: STY-5520, allocation_from: -60d}}
  facts: ["cancelled", "release threshold", "2026-09-03", "2026-09-16"]

- id: allocation-03:22:Q4
  question: "03:22:Q4"
  prompt: >
    14,000 units of seasonal line K-1700 sit at the DC. Northern stores are selling out and southern ones are
    overstocked. With about 16 selling weeks left, is moving surplus stock from the south to the northern regions
    short of cover worth it? Give the units, transfer cost and sales we would capture.
  ref:
    - {tool: get_store_stock_and_sales_by_region, args: {sku: K-1700}}
    - {tool: calculate_rebalance_benefit, args: {sku: K-1700, selling_weeks: 16}}
  facts: ["UK North", "Scotland", "668", "300.6", "52097"]

- id: allocation-03:30:Q4
  question: "03:30:Q4"
  prompt: >
    For our slow-moving SKUs, how would forecasting at store-SKU level versus cluster level change replenishment
    performance? Compare forecast error, stockouts, lost sales and total cost.
  ref:
    - {tool: calculate_replenishment_impact, args: {item_type: slow_mover}}
  facts: ["12.5", "17", "12289", "30134"]
