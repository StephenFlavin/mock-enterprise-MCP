- id: supplier_portal-01:4:Q4-a
  question: "01:4:Q4"
  prompt: >
    Supplier SUP-0013 keeps short-shipping against its ASNs. Draft a note for its supplier manager covering the
    receipt variances from the last 8 weeks. Include what is claimable and which lines are still inside the claim window.
  ref:
    - {tool: draft_supplier_variance_note, args: {supplier_id: SUP-0013, lookback_days: 56}}
  facts: ["63031.85", "PO-2026-005301", "PO-2026-004418", "61798.35"]

- id: supplier_portal-01:4:Q4-b
  question: "01:4:Q4"
  prompt: >
    Raise a claim against supplier SUP-0013 for the 50-unit short shipment of PF-220 on PO-2026-005301
    (variance VAR-900001), claim value £1,233.50.
  ref:
    - {tool: create_supplier_claim, args: {po_id: PO-2026-005301, supplier_id: SUP-0013, claim_type: short_ship, claim_amount_gbp: 1233.5, variance_id: VAR-900001}}
  facts: ["PO-2026-005301", "1233.5", "SUP-0013"]

- id: supplier_portal-01:4:Q4-c
  question: "01:4:Q4"
  prompt: >
    The variance note for supplier SUP-0013 is approved. Send it to its supplier manager with the title "Receipt
    variances, last 8 weeks", saying we found short-shipping on recent orders and are claiming £63,031.85.
  ref:
    - {tool: send_supplier_variance_note, args: {supplier_id: SUP-0013, title: "Receipt variances, last 8 weeks", content: "Short-shipping found on recent orders; we are claiming the value inside the claim window", amount_gbp: 63031.85}}
  facts: ["SUP-0013", "63031.85"]

- id: supplier_portal-01:10:Q2-a
  question: "01:10:Q2"
  prompt: >
    We want to replace worn motors, gearboxes and sensors on the DC1 conveyor network and sorter in the planned
    shutdown in about two weeks. What lead times do our suppliers quote for motor parts, gearbox parts and sensors,
    and which part takes longest?
  ref:
    - {tool: get_part_lead_time, args: {asset_class: motor}}
    - {tool: get_part_lead_time, args: {asset_class: gearbox}}
    - {tool: get_part_lead_time, args: {asset_class: sensor}}
  facts: ["Conveyor drive motor", "49", "Gearbox bearing set", "25", "Induction sensor"]

- id: supplier_portal-01:10:Q2-b
  question: "01:10:Q2"
  prompt: >
    Across all the spare parts we buy for the DC1 sorter and conveyors, which have the longest supplier lead
    times, and how long are they?
  ref:
    - {tool: get_part_lead_time, args: {}}
  facts: ["Conveyor drive motor", "49", "Sorter control board", "42"]

- id: supplier_portal-02:13:Q2-a
  question: "02:13:Q2"
  prompt: >
    Send a chargeback notice to supplier SUP-0023 for £39,056.83 of avoidable air freight caused by its late
    production. Use the title "Chargeback notice - avoidable air freight".
  ref:
    - {tool: send_supplier_chargeback_notice, args: {supplier_id: SUP-0023, amount_gbp: 39056.83, title: "Chargeback notice - avoidable air freight", content: "Air freight caused by late production on your orders is chargeable under the supply agreement"}}
  facts: ["SUP-0023", "39056.83"]

- id: supplier_portal-02:13:Q4-a
  question: "02:13:Q4"
  prompt: >
    Production is running late at a few suppliers. Based on their current delays and their on-time record, how much
    air freight should I budget for peak, and which suppliers drive most of it?
  ref:
    - {tool: calculate_expected_air_requirement, args: {}}
  facts: ["117744", ["SUP-0074", "Lyons Trading"], ["SUP-0023", "Morley Industries"]]

- id: supplier_portal-02:13:Q4-b
  question: "02:13:Q4"
  prompt: >
    Work out the expected air freight requirement for peak from the suppliers' current delays and on-time record again,
    but assuming their delays improve by 20%. What is the total?
  ref:
    - {tool: calculate_expected_air_requirement, args: {delay_improvement_pct: 20}}
  facts: ["95388"]

- id: supplier_portal-03:22:Q2-a
  question: "03:22:Q2"
  prompt: >
    These SKUs are about to run out: SKU-101260 (supplier SUP-0034), SKU-104536 (supplier SUP-0068), SKU-100280
    (supplier SUP-0069), SKU-102884 and SKU-101722 (both supplier SUP-0008). Which of them does the supplier have
    stock for right now, and how many units?
  ref:
    - {tool: get_supplier_available_stock, args: {supplier_id: SUP-0034, sku: SKU-101260}}
    - {tool: get_supplier_available_stock, args: {supplier_id: SUP-0068, sku: SKU-104536}}
    - {tool: get_supplier_available_stock, args: {supplier_id: SUP-0069, sku: SKU-100280}}
    - {tool: get_supplier_available_stock, args: {supplier_id: SUP-0008, sku: SKU-102884}}
    - {tool: get_supplier_available_stock, args: {supplier_id: SUP-0008, sku: SKU-101722}}
  facts: ["6200", "3100", "1800"]

- id: supplier_portal-03:22:Q2-b
  question: "03:22:Q2"
  prompt: >
    Go ahead and send the expedite request to supplier SUP-0034 for 6,000 units of SKU-101260 from their stock,
    asking for shipment within a week.
  ref:
    - {tool: submit_expedite_request, args: {supplier_id: SUP-0034, sku: SKU-101260, quantity_units: 6000, title: Expedite request, content: "Please ship 6,000 units from stock within a week"}}
  facts: ["SKU-101260", "6000", "SUP-0034"]

- id: supplier_portal-03:24:Q1-a
  question: "03:24:Q1"
  prompt: >
    Supplier SUP-0070 has been missing its confirmed ship dates. Compare its latest 10 orders with the 10 before:
    how many missed the ship date in each, and is it getting worse?
  ref:
    - {tool: get_supplier_ship_date_performance, args: {supplier_id: SUP-0070}}
  facts: ["6", ["worsening", "getting worse", "worse"], ["10", "10%"]]

- id: supplier_portal-03:24:Q1-b
  question: "03:24:Q1"
  prompt: >
    What does supplier SUP-0070's capacity look like: how much of it is committed now, how has that changed over the
    last six months, and how much is spare?
  ref:
    - {tool: get_supplier_capacity_report, args: {supplier_id: SUP-0070}}
  facts: ["96", "72", "7200"]

- id: supplier_portal-03:24:Q1-c
  question: "03:24:Q1"
  prompt: >
    How much of next quarter's planned supply depends on supplier SUP-0070? Give the units and its share of the
    department it supplies.
  ref:
    - {tool: get_supply_dependency_for_supplier, args: {supplier_id: SUP-0070}}
  facts: ["24000", "28.3", "Accessories"]

- id: supplier_portal-03:24:Q1-d
  question: "03:24:Q1"
  prompt: >
    If we have to move volume away from supplier SUP-0070, which other active Accessories suppliers could take it?
    Give their OTIF and typical lead times, best OTIF first.
  ref:
    - {tool: search_alternative_suppliers, args: {category_focus: Accessories, exclude_supplier_id: SUP-0070}}
  facts: ["SUP-0021", "93", "SUP-0014", "66"]

- id: supplier_portal-03:24:Q2-a
  question: "03:24:Q2"
  prompt: >
    There is a 25,000-unit gap in week 44 on our core trousers range, currently made by SUP-0008. Which trousers
    suppliers actually have spare capacity right now, and how much does each have?
  ref:
    - {tool: get_supplier_available_capacity, args: {category: Trousers}}
  facts: ["SUP-0036", "SUP-0044", "31500", "5400"]
  notes: "Master data has no denim category, so the core denim range in the question is taken as the Trousers category (SUP-0008 makes SKU-102884 and SKU-102898)."

- id: supplier_portal-03:24:Q3-a
  question: "03:24:Q3"
  prompt: >
    Which suppliers have already flagged delays on zips and trims for Q1 production, and how many days late are
    they?
  ref:
    - {tool: get_supplier_delay_notices, args: {material_type: zip}}
    - {tool: get_supplier_delay_notices, args: {material_type: trim}}
  facts: ["SUP-0042", "21", "SUP-0035", "14", "SUP-0056"]

- id: supplier_portal-03:24:Q4-a
  question: "03:24:Q4"
  prompt: >
    Are any fabric mills running short of capacity? Which suppliers are most at risk, with their utilisation now
    versus six months ago?
  ref:
    - {tool: get_supplier_capacity_report, args: {material_type: fabric}}
  facts: ["SUP-0001", "97", "SUP-0003", "94"]

- id: supplier_portal-03:28:Q4-a
  question: "03:28:Q4"
  prompt: >
    Three long-tail products could be made to order instead of held in stock: SKU-102898 (supplier SUP-0008),
    SKU-106034 (supplier SUP-0051) and SKU-102289 (supplier SUP-0041). Can each supplier make them to order, and with
    what lead time and minimum order quantity?
  ref:
    - {tool: get_supplier_make_to_order_lead_times, args: {supplier_id: SUP-0008, sku: SKU-102898}}
    - {tool: get_supplier_make_to_order_lead_times, args: {supplier_id: SUP-0051, sku: SKU-106034}}
    - {tool: get_supplier_make_to_order_lead_times, args: {supplier_id: SUP-0041, sku: SKU-102289}}
  facts: ["21", "100", "28", "150"]

- id: supplier_portal-04:32:Q3-a
  question: "04:32:Q3"
  prompt: >
    For next season's bedding range we are comparing suppliers SUP-0039, SUP-0011 and SUP-0004. How much of each
    one's bedding capacity is already committed, and how much is still available?
