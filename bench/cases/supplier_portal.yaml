- id: supplier_portal-04:33:Q1-a
  question: "04:33:Q1"
  prompt: >
    Factory FAC-0121 has been 10 to 14 days late on five straight orders. What do its production reports and its
    material inbound status for the last 12 weeks show? Is the cause capacity, labour or materials?
  ref:
    - {tool: get_factory_production_reports, args: {factory_id: FAC-0121}}
    - {tool: get_factory_material_inbound_status, args: {factory_id: FAC-0121}}
