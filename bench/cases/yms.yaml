- id: yms-01:6:Q2
  question: "01:6:Q2"
  prompt: >
    We're pushing two low-priority inbound POs back a week. Cancel their dock bookings at DC1 for next Tuesday:
    appointment APT-900001 (PO-2026-004674) and appointment APT-900002 (PO-2026-005926). Give "PO pushed back a week"
    as the reason.
  ref:
    - {tool: cancel_inbound_appointment, args: {appointment_id: APT-900001, cancel_reason: PO pushed back a week}}
    - {tool: cancel_inbound_appointment, args: {appointment_id: APT-900002, cancel_reason: PO pushed back a week}}
  facts: ["APT-900001", "APT-900002", "cancelled"]
- id: yms-01:6:Q5
  question: "01:6:Q5"
  prompt: >
    Store service level has dropped over the last three weeks. At DC1, have inbound trailers been arriving late
    (an hour or more after their slot) over that period? Which haulier is responsible, how many trailers, and how
    late was the worst?
  ref:
    - {tool: list_late_inbound_trailers, args: {site_id: DC1, date_from: -21d, min_minutes_late: 60}}
  facts: ["Midshires Transport", "190", "10"]
