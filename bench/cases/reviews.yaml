- id: reviews-02:21:Q1
  question: "02:21:Q1"
  prompt: >
    Our most returned styles right now are STY-4123, STY-5094, STY-8908 and STY-8683. What does customer feedback
    say about each of them: is it pointing to sizing, quality or expectations not being met?
  ref:
    - {tool: get_customer_feedback_themes_by_style, args: {style_id: STY-4123}}
    - {tool: get_customer_feedback_themes_by_style, args: {style_id: STY-5094}}
    - {tool: get_customer_feedback_themes_by_style, args: {style_id: STY-8908}}
    - {tool: get_customer_feedback_themes_by_style, args: {style_id: STY-8683}}
  facts: ["sizing", "quality", "expectation"]
  notes: "Master style STY-7892, the tied top returned style, launches after today, so it has no reviews; the case uses the four other top returned styles."

- id: reviews-03:25:Q5
  question: "03:25:Q5"
  prompt: >
    Our new athleisure style STY-4056 is behind plan on sell-through. Over the last 90 days, how do its customer
    reviews rate against all our products, and what is customers' biggest complaint: the product itself or something else?
  ref:
    - {tool: get_range_reviews_summary, args: {style_id: STY-4056}}
    - {tool: get_review_theme_summary, args: {category: Tops}}
  facts: ["4.05", "availability"]

- id: reviews-04:32:Q4
  question: "04:32:Q4"
  prompt: >
    For our 750ml insulated bottle SKU-102590, which features do customers talk about most in reviews, which are they
    happiest with and what do they complain about?
  ref:
    - {tool: search_customer_review_themes, args: {sku: SKU-102590}}
  facts: ["insulation", "lid", "finish"]
  notes: "Master data has no product named 750ml insulated bottle; Drinkware SKU-102590 stands in for it."

- id: reviews-04:34:Q2
  question: "04:34:Q2"
  prompt: >
    We are shortlisting suppliers in Portugal and Turkey for technical outerwear. What does customer feedback on the
    outerwear they already make for us say: which supplier's products are rated best, which worst, and what do
    customers complain about?
  ref:
    - {tool: search_customer_feedback_for_supplier, args: {country: "PT,TR", category: Outerwear}}
  facts: ["SUP-0058", "SUP-0037", "waterproofing"]

- id: reviews-04:40:Q6
  question: "04:40:Q6"
  prompt: >
    I'm reviewing our e-commerce packaging. Over the last six months, which of our products get the most customer
    complaints about packaging damage (torn, crushed or dented on arrival)?
  ref:
    - {tool: search_customer_review_themes, args: {theme: packaging}}
  facts: ["SKU-100014", "K-1700", "SKU-100007"]

- id: reviews-05:42:Q5
  question: "05:42:Q5"
  prompt: >
    Complaints about shoe sole separation are up over the last three months. Search the customer review text: which
    SKU is it, and how many reviews mention it in the last 30 days compared with the 30 days before?
  ref:
    - {tool: search_review_text_by_topic, args: {topic: sole separation, date_from: -90d}}
  facts: ["SKU-100301", "20", "8"]

- id: reviews-06:51:Q3
  question: "06:51:Q3"
  prompt: >
    We want to launch an insulated lunch box. What do customers complain about most in competitor lunch boxes, and
    which competitor lunch box is rated best and which worst?
  ref:
    - {tool: get_review_theme_summary, args: {category: Lunch boxes, sentiment: negative}}
    - {tool: search_customer_reviews_for_competitor_products, args: {category: Lunch boxes}}
  facts: ["leaking", "John Lewis", "Carrefour"]

- id: reviews-06:52:Q5
  question: "06:52:Q5"
  prompt: >
    What do customer reviews say about our best-selling jeans SKU-100637: what is the most common complaint and what
    do customers praise most?
  ref:
    - {tool: search_customer_reviews_for_product, args: {sku: SKU-100637, max_rating: 3}}
    - {tool: get_review_theme_summary, args: {sku: SKU-100637, sentiment: positive}}
  facts: ["waistband", "back", "comfort"]
  notes: "Master data has no product called jeans; SKU-100637 (style STY-T-4410, Trousers in denim) is the SKU the reviews and returns data call jeans."

- id: reviews-06:52:Q6
  question: "06:52:Q6"
  prompt: >
    What do customers aged 25 to 34 ask for in reviews of our outerwear (outdoor clothing)? Which themes come up most,
    and how do German reviewers in that age group differ?
  ref:
    - {tool: search_customer_reviews_by_segment, args: {customer_segment: "25-34", category: Outerwear}}
    - {tool: search_customer_reviews_by_segment, args: {customer_segment: "25-34", category: Outerwear, country: DE}}
  facts: ["lightweight", "pockets", "sustainability", "warmth"]
  notes: "Master data has no outdoor clothing category; Outerwear stands in for it."

- id: reviews-06:54:Q1
  question: "06:54:Q1"
  prompt: >
    Ratings for our best-selling 1.7L kettle (SKU K-1700) have been dropping for eight weeks. Show the weekly rating
    trend and what customers complain about: is it a quality problem or a perception problem?
  ref:
    - {tool: get_ratings_trend_for_sku, args: {sku: K-1700, date_from: -10w}}
    - {tool: get_review_theme_summary, args: {sku: K-1700, sentiment: negative, date_from: -60d}}
    - {tool: search_customer_reviews_for_product, args: {sku: K-1700, max_rating: 2, date_from: -30d}}
  facts: ["2.78", "quality", "lid", "leak"]

- id: reviews-06:54:Q5
  question: "06:54:Q5"
  prompt: >
    I'm preparing for the range review. Using customer ratings over the last 30 days against the 30 days before,
    which products have fallen most and what is the top complaint on each? Give me a shortlist of five.
  ref:
    - {tool: draft_range_review_shortlist, args: {date_from: -30d, limit_to: 5}}
  facts: ["K-1700", "SKU-100014", "PF-220", "SKU-100301"]

- id: reviews-06:56:Q3
  question: "06:56:Q3"
  prompt: >
    What do customers say about competitors' wellness and recovery products? Which are rated best and which have
    flopped (discontinued), and why?
  ref:
    - {tool: search_customer_reviews_for_competitor_products, args: {category: Wellness & recovery}}
  facts: ["Weighted Blanket", "Cold Plunge Tub", "Compression Recovery Boots", "Sauna Blanket"]

- id: reviews-06:58:Q3
  question: "06:58:Q3"
  prompt: >
    We are looking at cutting about 8% of the cost of our 1.7L kettle K-1700 (thinner walls, a simpler lid, a plastic
    base). From the last 90 days of customer reviews, which parts of the product do customers talk about most and
    praise or complain about, so we know which changes they would notice?
  ref:
    - {tool: get_review_theme_summary, args: {sku: K-1700, date_from: -90d}}
    - {tool: search_customer_reviews_for_product, args: {sku: K-1700, text: lid, date_from: -90d}}
  facts: ["quality", "lid", "design"]

- id: reviews-08:73:Q1
  question: "08:73:Q1"
  prompt: >
    Store ST214 has been below target for six months. What are customers saying in the feedback collected at that
    store over the last month, and how does that compare with its peer stores ST206 and ST209?
  ref:
    - {tool: get_customer_feedback_for_store, args: {store_id: ST214}}
    - {tool: get_customer_feedback_for_store, args: {store_id: ST206}}
    - {tool: get_customer_feedback_for_store, args: {store_id: ST209}}
  facts: [["availability", "out of stock", "sold out"], ["cheaper", "price", "value"], ["staff", "service", "friendly"]]

- id: reviews-08:74:Q4
  question: "08:74:Q4"
  prompt: >
    How do customers rate the competing products for our top five sellers SKU-104032, SKU-104025, SKU-105075,
    SKU-102261 and SKU-100630? Which competitor is rated best and which worst across them?
  ref:
    - {tool: get_competitor_ratings_for_products, args: {skus: [SKU-104032, SKU-104025, SKU-105075, SKU-102261, SKU-100630]}}
  facts: ["John Lewis", "4.7", "Carrefour", "3.5", "Argos"]
