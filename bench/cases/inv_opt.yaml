  facts: ["HOLD_STOCK", "Babywear", "Small Appliances"]

- id: inv_opt-03:28:Q4-a
  question: "03:28:Q4"
  prompt: >
    Our long-tail items selling around 140 units a week or less are stocked at several DCs. Which should we hold in one
