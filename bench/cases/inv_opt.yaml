- id: inv_opt-03:22:Q3-a
  question: "03:22:Q3"
  prompt: >
    Review the reorder points and safety stock for our 200 fastest-selling SKUs. Which look too low or too high
    given demand variability and supplier lead times? Name the worst cases and which supplier is behind the too-low ones.
  ref:
    - {tool: compare_policy_to_recommended_parameters, args: {top_n_by_volume: 200}}
  facts: ["SKU-105075", "SKU-102471", "SUP-0080", "TOO_LOW"]
  notes: "Policies are generated from master demand so many top sellers are only mildly off; the supplier story follows the purchasing system's lead-time actuals (SUP-0080 about 31 days slower, SUP-0048 about 31 days faster, SUP-0013 slightly slower), but the tool shows lead times per SKU rather than a supplier summary."

- id: inv_opt-03:22:Q3-b
  question: "03:22:Q3"
  prompt: >
    For the 200 fastest-selling SKUs, what would the working capital change be by category if we reset safety stock
    to the recommended levels at each SKU's current service level target? Which categories take the most cash?
  ref:
    - {tool: calculate_working_capital_impact, args: {top_n: 200, rank_by: volume}}
  facts: ["Small Appliances", "Audio", "1148515.59"]

- id: inv_opt-03:22:Q3-c
  question: "03:22:Q3"
  prompt: >
    For SKU-104018, what safety stock and reorder point should we hold at a 95% service level using its demand and
    lead-time variability, and how does that compare with what is set today? Has its supplier lead time changed?
  ref:
    - {tool: calculate_safety_stock, args: {sku: SKU-104018, target_service_level_pct: 95}}
  facts: ["4769", "1949", "16144", "79"]

- id: inv_opt-03:27:Q6-a
  question: "03:27:Q6"
  prompt: >
    How are our SKUs split into A, B and C classes, what share of annual value does each class carry, and which segment
    and service level target does each class have today?
  ref:
    - {tool: get_sku_abc_classification, args: {limit_count: 5}}
  facts: ["SEG-001", "95", "125", "50.5"]

- id: inv_opt-03:27:Q6-b
  question: "03:27:Q6"
  prompt: >
    What does stock value look like at 85%, 90%, 95%, 97% and 99% service level for the A items versus the C long tail?
    Where does the extra cost of each point get steep?
  ref:
    - {tool: calculate_service_level_target_options, args: {}}
    - {tool: get_service_level_vs_inventory_curve, args: {abc_class: A}}
  facts: ["SEG-001", "SEG-003", "99"]
  notes: "Stock values appear in scientific notation (e.g. 2.41402e+06) in the tool output, so a model may restate large numbers loosely."

- id: inv_opt-03:27:Q6-c
  question: "03:27:Q6"
  prompt: >
    We agreed the top segment should move to a 97% service level target. Please update it (the A items segment, SEG-001).
  ref:
    - {tool: update_service_level_target_for_segment, args: {segment_id: SEG-001, target_service_level_pct: 97}}
  facts: ["SEG-001", "97"]

- id: inv_opt-03:28:Q1-a
  question: "03:28:Q1"
  prompt: >
    Calculate the working capital change by category if the 500 highest-value SKUs are set to safety stock at a 97%
    service level. Which categories need the most extra cash, and how does it compare with current settings?
  ref:
    - {tool: calculate_working_capital_impact, args: {target_service_level_pct: 97, top_n: 500}}
  facts: ["Small Appliances", "Outerwear", "1937373.12"]

- id: inv_opt-03:28:Q1-b
  question: "03:28:Q1"
