- id: inv_opt-03:28:Q3-a
  question: "03:28:Q3"
  prompt: >
    What if lead times from Asia get two weeks longer? Which product categories are most sensitive, and how much extra
    working capital would the extra safety stock tie up?
  ref:
    - {tool: calculate_lead_time_sensitivity_by_category, args: {lead_time_increase_days: 14, origin_region: Asia}}
  facts: ["Babywear", "Outerwear", "Jewellery", "92918.12"]

- id: inv_opt-03:28:Q3-b
  question: "03:28:Q3"
  prompt: >
    With Asia lead times two weeks longer, is it cheaper to hold more stock or accept a lower service level of 90%?
    Answer by category.
  ref:
