- id: due_diligence-05:46:Q1
  question: "05:46:Q1"
  prompt: >
    Where is our forced-labour risk highest? List the critical-risk suppliers, show the evidence behind the rating for
    SUP-0001, how well product SKU-103808 is mapped beyond tier one, and which country has the highest forced-labour
