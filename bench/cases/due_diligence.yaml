    - {tool: get_supply_chain_map_for_product, args: {sku: SKU-103808}}
    - {tool: get_supply_chain_mapping_gaps, args: {}}
    - {tool: get_country_risk_indices, args: {}}
  facts: ["Ali Apparel", "Xinjiang", "China", "240000", "85000"]

- id: due_diligence-05:46:Q2
  question: "05:46:Q2"
  prompt: >
    A news article alleges workers at the spinning mill FAC-0035 in Tamil Nadu are recruited through debt bondage. What
    adverse media do we hold on the mill and how credible is it, including any NGO corroboration? Which of our suppliers
    does the mill supply? Then draft an internal escalation note for supplier SUP-0018.
  ref:
    - {tool: search_adverse_media_for_entity, args: {entity_id: FAC-0035}}
    - {tool: get_supplier_sub_tier_relationships, args: {factory_id: FAC-0035}}
    - {tool: draft_escalation_note, args: {supplier_id: SUP-0018, factory_id: FAC-0035, summary: Debt bondage alleged at Tamil Nadu spinning mill}}
  facts: ["Southern Workers Rights Forum", "Walton Homewares", "Bennett Apparel", "Parker Homewares", "Khan Products"]
  notes: "Master data has no Tamil Nadu spinning mill: the documents article names Law Knitting Mill (FAC-0001), but FAC-0001 is a China factory in master, so FAC-0035 (India, SUP-0018) stands in for the mill."

- id: due_diligence-05:46:Q3
  question: "05:46:Q3"
  prompt: >
    After the audit at factory FAC-0003 (supplier SUP-0002), do we remediate, suspend or exit? What do the worker
    grievances say, and how much leverage do we have as our share of the factory's capacity?
  ref:
    - {tool: get_worker_grievance_records, args: {factory_id: FAC-0003}}
    - {tool: calculate_supplier_share_of_factory_capacity, args: {supplier_id: SUP-0002, factory_id: FAC-0003}}
  facts: ["forced labour", "child labour", "1.4", "low leverage"]

- id: due_diligence-05:46:Q4
  question: "05:46:Q4"
  prompt: >
    For supplier SUP-0001, what evidence do we hold against forced-labour and due-diligence laws in the UK, EU, US and
    Canada, and where are the gaps? Which gap is most critical? Draft the compliance gap list.
