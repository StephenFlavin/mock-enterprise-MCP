- id: due_diligence-02:14:Q6
  question: "02:14:Q6"
  prompt: >
    We buy a lot of cotton and some polysilicon-based products and could be stopped at the border under forced-labour import
    rules. Which of our suppliers in China are rated high or critical for forced-labour risk, and what traceability evidence
    do we hold on where their cotton or polysilicon comes from?
  ref:
    - {tool: get_forced_labour_risk_by_supplier, args: {country: CN, min_risk_level: high}}
    - {tool: get_supplier_traceability_evidence, args: {origin: Xinjiang}}
  facts: ["Brown Textiles", "Arnold Industries", "Bishop Apparel", "Hunt Apparel", "Xinjiang"]

- id: due_diligence-04:34:Q8
  question: "04:34:Q8"
  prompt: >
    We are considering moving sourcing nearshore to Poland to reduce our due-diligence exposure under the new EU rules.
    What do the EU due-diligence rules require, how well mapped beyond tier one are our Polish suppliers, what is their
    due-diligence status, and which documents would we need from them?
  ref:
    - {tool: search_due_diligence_regulation_requirements, args: {jurisdiction: EU, topic: due_diligence}}
    - {tool: get_supplier_tier_mapping_by_country, args: {supplier_country: PL}}
    - {tool: get_supplier_due_diligence_status, args: {country: PL}}
    - {tool: list_required_supplier_documents, args: {country: PL, jurisdiction: EU}}
  facts: ["Corporate Sustainability Due Diligence Directive", "5%", "not started", "Tier 2+ supplier list"]

- id: due_diligence-04:38:Q2
  question: "04:38:Q2"
  prompt: >
    What do current UK, EU and US laws require on forced labour, supply chain due diligence and product liability,
    and what penalties apply for non-compliance?
  ref:
    - {tool: search_due_diligence_regulation_requirements, args: {jurisdiction: UK}}
    - {tool: search_due_diligence_regulation_requirements, args: {jurisdiction: EU}}
    - {tool: search_due_diligence_regulation_requirements, args: {jurisdiction: US}}
  facts: ["Modern Slavery Act", "Corporate Sustainability Due Diligence Directive", "Uyghur", "5%", "Product Liability Directive"]

- id: due_diligence-04:41:Q1
  question: "04:41:Q1"
  prompt: >
    Run due diligence on a prospective cosmetics-packaging supplier, Sunrise Pack Co. Ltd in Guangdong, China: company
    registry, ownership, sanctions screening, litigation and adverse media. Tell me the red flags and how reliable each
    source is.
  ref:
    - {tool: search_company_registry, args: {entity_name: Sunrise Pack, country: CN}}
    - {tool: get_company_ownership_structure, args: {entity_id: PSP-0001}}
    - {tool: run_sanctions_screening, args: {entity_id: PSP-0001}}
    - {tool: search_litigation_records, args: {entity_name: Sunrise Pack}}
    - {tool: search_adverse_media, args: {entity_name: Sunrise Pack}}
  facts: ["Pearl River Holdings", "not disclosed", "unpaid overtime", "wastewater", "Anonymous forum post"]
  notes: "Sunrise Pack Co. Ltd is a prospect that is not in master data, so the tools use PSP- ids (PSP-0001 to PSP-0003) taken from the registry search; supplier_risk stands SUP-0023 in for it."

- id: due_diligence-04:41:Q3
  question: "04:41:Q3"
  prompt: >
    A prospective supplier, Sunrise Pack Co. Ltd, is registered in Guangdong, China but its bank account is in Hong Kong.
    Using the company registry and the ownership records, is that a risk indicator, or could it be a legitimate holding
    company?
  ref:
    - {tool: search_company_registry, args: {entity_name: Sunrise}}
    - {tool: get_company_ownership_structure, args: {entity_name: Sunrise Pack}}
  facts: ["Sunrise Trading (HK) Limited", "Li Jun", "Pearl River Holdings", "not disclosed"]
  notes: "Sunrise Pack Co. Ltd is not in master data; its bank details sit in supplier_risk, so this case covers only the registry and ownership part."

- id: due_diligence-04:41:Q5
  question: "04:41:Q5"
  prompt: >
    Sunrise Pack Co. Ltd is a prospective supplier whose shareholders are Sunrise Trading (HK) Limited and Pearl River
    Holdings Ltd. Run sanctions screening on all three companies: is there any match I need to worry about?
  ref:
    - {tool: run_sanctions_screening, args: {entity_name: Sunrise Pack}}
    - {tool: run_sanctions_screening, args: {entity_name: Sunrise Trading}}
    - {tool: run_sanctions_screening, args: {entity_name: Pearl River}}
  facts: ["Pearl River Holdings", "possible match", "UK"]

- id: due_diligence-05:43:Q3
  question: "05:43:Q3"
