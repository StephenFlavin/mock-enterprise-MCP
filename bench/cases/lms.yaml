- id: lms-01:4:Q2
  question: "01:4:Q2"
  prompt: >
    Last quarter's stock adjustments at DC1 look clustered. Using the labour data for DC1 over roughly the last
    13 weeks: which shift took most of the new starters, in which week was the starter intake highest, and what
    was the peak average number of agency operatives per day on that shift?
  ref:
    - {tool: list_new_starters_by_period, args: {site_id: DC1, date_from: -98d}}
    - {tool: get_shift_roster_by_date, args: {site_id: DC1, date_from: -98d, granularity: week}}
  facts: ["late", "2026-08-31", "29.2"]

- id: lms-01:6:Q1
  question: "01:6:Q1"
  prompt: >
    Labour cost at DC1 went up in the last four weeks compared with the four weeks before. Split the labour cost
    into permanent, overtime and agency for both periods, and tell me which labour type added the most cost.
  ref:
    - {tool: get_labour_hours_by_type, args: {site_id: DC1, date_from: -62d, granularity: four_week}}
  facts: ["overtime", "79985", "48848", "108276", "91119"]

- id: lms-01:6:Q3
  question: "01:6:Q3"
  prompt: >
    At DC1 we run two shifts, early and late. We are choosing between adding a night shift (22:00 to 06:00) for
    eight weeks or paying overtime on the existing shifts to cover a gap of about 45 FTE. For the latest week, what
    overtime hours and hourly rate does the late shift have, and how does late-shift picking productivity for
    overtime labour compare with permanent labour? Then request 45 agency operatives for the night shift,
    starting in about four weeks and running for eight weeks.
  ref:
    - {tool: get_overtime_hours_by_shift, args: {site_id: DC1, shift_type: late}}
    - {tool: get_labour_productivity_by_shift, args: {site_id: DC1, shift_type: late, process_type: picking, labour_type: overtime}}
    - {tool: get_labour_productivity_by_shift, args: {site_id: DC1, shift_type: late, process_type: picking, labour_type: permanent}}
    - {tool: create_agency_labour_request, args: {site_id: DC1, shift_type: night, date_from: +28d, date_to: +84d, quantity_required: 45, labour_type: operative}}
  facts: ["501", "23.25", "191", "210.4", "45", "night"]

- id: lms-01:6:Q5
  question: "01:6:Q5"
  prompt: >
    Store service level from DC1 fell over the last three weeks. Using labour productivity at DC1 by shift and
    task over the last eight weeks, which shift and which task lost productivity, and from which week did it start?
  ref:
    - {tool: get_labour_productivity_by_shift, args: {site_id: DC1, date_from: -62d}}
  facts: ["early", "shipping", "2026-09-14", "141.8", "187.6"]

- id: lms-01:8:Q5
  question: "01:8:Q5"
  prompt: >
    We are considering moving e-commerce at DC2 from wave picking to continuous batching. What pick rates
    (picks per hour) do wave, batch and discrete picking get at DC2 over the last four weeks?
  ref:
    - {tool: get_pick_rates_by_method, args: {site_id: DC2, breakdown: method}}
  facts: ["67", "52.1", "36"]

- id: lms-01:9:Q1
  question: "01:9:Q1"
  prompt: >
    To put safety incidents into context, how many labour hours were worked at each of DC1, DC2 and DC3 over the
    last 12 months, and which DC used the most agency hours?
  ref:
    - {tool: get_exposure_hours_by_site, args: {breakdown: site}}
  facts: ["307037", "313854", "236557", "103523"]

- id: lms-01:9:Q3
  question: "01:9:Q3"
  prompt: >
    Forklift near misses at DC1 went up over the last quarter. Using shift and intake data for DC1 over roughly
    the last 13 weeks: which shift saw its agency share rise, what was that share at its peak (as a percentage of
    the shift), and in which week was the new starter intake at its peak?
  ref:
    - {tool: get_shift_roster_by_date, args: {site_id: DC1, date_from: -98d, granularity: week}}
    - {tool: list_new_starters_by_period, args: {site_id: DC1, date_from: -98d}}
  facts: ["late", "33.2", "2026-08-31"]

- id: lms-01:9:Q5
  question: "01:9:Q5"
  prompt: >
    How many agency workers are in place at each of our DCs right now, and which agency supplies the most of them
    at DC1?
  ref:
    - {tool: list_agency_workers_by_site, args: {}}
  facts: ["38", "54", "16", ["SUP-0089", "Quickstaff"]]
  notes: "Quickstaff Temporary Labour Ltd (SUP-0089) is the only agency in master data, so every agency request uses it."

- id: lms-02:21:Q3
  question: "02:21:Q3"
  prompt: >
    The returns forecast for the peak weeks is about 100,000 units a week at the Leeds returns centre (DC3). What is
    the productivity standard for returns processing, how many operatives does that need (7.5 productive hours a
    day, 5 days a week, 15% absence allowance), and how many agency staff do we need on top of our 30 permanent
    returns operatives? Then request those agency staff on the early shift for four weeks starting in about
    fifteen weeks.
  ref:
    - {tool: get_labour_productivity_standards, args: {site_id: DC3, process_type: returns}}
    - {tool: calculate_returns_staffing_requirement, args: {site_id: DC3, weekly_units: 100000, permanent_operatives: 30}}
    - {tool: create_agency_labour_request, args: {site_id: DC3, shift_type: early, date_from: +105d, date_to: +133d, quantity_required: 40, labour_type: operative}}
  facts: ["45", "69.7", "40"]
  # the scenario's demand forecast says 125k-144k a week, not this case's 100,000 (issue #3), so the staffing figures
  # derived from 100,000 are not required there; any agency quantity grounded in the forecast is acceptable (Rule B)
  scenario_facts: ["45"]
  notes: "Master data has no labour-agency suppliers (all suppliers are product suppliers), so agency requests use SUP-0001..0003 as stand-ins; the weekly returns volume has to be given in the prompt because the forecast lives in another system."

- id: lms-07:63:Q3
  question: "07:63:Q3"
  prompt: >
    Serving northern stores: what does handling cost per unit at the main DC (Northampton, DC1) across all
    operations versus the northern cross-dock run from Leeds, in a normal week and a peak week? Assume 120,000 units
    a week, with peak volume 40% higher, and include the fixed weekly cost.
  ref:
    - {tool: get_dc_handling_rates, args: {site_id: DC1, weekly_units: 120000, peak_uplift_pct: 40}}
    - {tool: get_cross_dock_handling_rates, args: {weekly_units: 120000, peak_uplift_pct: 40}}
  facts: ["2.39", "2.78", "0.41", "0.45"]
  notes: "Master data has no cross-dock site, so the northern cross-dock is modelled as a cross_dock operation at DC3 (Leeds, regional DC)."

- id: lms-09:87:Q5
  question: "09:87:Q5"
  prompt: >
    Northampton DC (DC1) cost per unit is 18% above the network average. On labour, how does DC1 productivity
    against standard compare overall with DC2 and DC3 over the last 12 weeks, and what share of DC1's hours is agency
    and overtime?
  ref:
    - {tool: get_dc_labour_productivity, args: {}}
  facts: ["88.7", "77.5", "95.3", "18.8", "10.2"]

- id: lms-09:88:Q2
  question: "09:88:Q2"
  prompt: >
    Productivity at Daventry (DC2) is well below the other DCs. On the labour side, how does each DC compare
    against standard overall over the last 12 weeks, and what share of DC2's hours is agency labour?
  ref:
    - {tool: get_dc_labour_productivity, args: {}}
  facts: ["77.5", "88.7", "95.3", "33"]

- id: lms-09:88:Q4
  question: "09:88:Q4"
  prompt: >
    For next peak we need to know where capacity is most at risk. Looking at picking operatives over the last
    eight weeks, what are the standard and actual units per hour at each DC, and which DC is furthest below
    standard?
  ref:
    - {tool: get_productivity_rates_by_site_and_role, args: {process_type: picking, role: operative}}
  facts: ["240", "205.4", "182.5", "228.1", "DC2"]

- id: lms-09:89:Q1
  question: "09:89:Q1"
  prompt: >
    I am planning peak staffing for Daventry (DC2). Based on current productivity over the last eight weeks, what
    are the standard and actual units per hour for operatives in each process, and how far below standard is
    picking?
  ref:
    - {tool: get_productivity_rates_by_site_and_role, args: {site_id: DC2, role: operative}}
  facts: ["240", "182.5", "76", "300", "236.3"]
  notes: "Corby is DC6, a 3PL overflow DC with no employees in master data, so the LMS and HRIS workforce slices for this question are answered for Daventry (DC2) and named as such."

- id: lms-09:89:Q2
  question: "09:89:Q2"
  prompt: >
    Turnover at Daventry (DC2) is 45% against 28% elsewhere and I suspect shifts. What shift pattern does Daventry run,
    what is its average overtime, and how many overtime hours a week does the night shift carry compared with the
    early and late shifts over the last eight weeks?
  ref:
    - {tool: get_shift_pattern_and_overtime, args: {site_id: DC2}}
  facts: ["three-shift", "22", "180.8", "148.8", "171.2"]
  notes: "Corby is DC6, a 3PL overflow DC with no employees in master data, so the LMS and HRIS workforce slices for this question are answered for Daventry (DC2) and named as such."

- id: lms-09:89:Q4
  question: "09:89:Q4"
  prompt: >
    For peak at DC2, should we hire, use agency or use overtime? Over the last eight weeks what does each labour
    type cost per productive hour, and over the last 13 weeks what is the pick error rate for each?
  ref:
    - {tool: get_cost_per_productive_hour_by_labour_type, args: {site_id: DC2}}
    - {tool: get_quality_error_rate_by_labour_type, args: {site_id: DC2}}
  facts: ["16.85", "21.31", "24.73", "0.85", "1.99", "1.44"]
