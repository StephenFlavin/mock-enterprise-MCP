- id: telematics-02:11:Q5-a
  question: "02:11:Q5"
  prompt: >
    Route plans say 94% utilisation but drivers keep running out of hours on our M62 routes from Leeds DC to the
    Manchester stores. Over the last 30 days, which of those M62 routes have the most runs over the daily hours
    limit, and how bad does the worst day get?
  ref:
    - {tool: get_driver_hours_compliance_by_route, args: {route_name: M62, date_from: -30d}}
  facts: ["RTE-900003", "RTE-900006", ["14.4", "3.4"], ["13.9", "2.9"]]

- id: telematics-02:11:Q5-b
  question: "02:11:Q5"
  prompt: >
    Drivers on M62 routes RTE-900003 and RTE-900006 keep running out of hours. Looking at the actual runs from the
    last 60 days, how long do stops really take per drop compared with what was planned, how much of it is
    unloading, and is traffic a big factor?
  ref:
    - {tool: get_actual_stop_durations_by_route, args: {route_name: M62, date_from: -60d}}
  facts: [["22.5", "22.5 minutes"], ["21.6", "21.6 minutes"], ["15", "15 minutes"], ["35.3", "35 minutes"]]

- id: telematics-09:88:Q6-a
  question: "09:88:Q6"
  prompt: >
    We are weighing up in-sourcing versus outsourcing transport. What does our own active fleet cost to run each
    year by vehicle type, which type is the most expensive, what is the running cost per km, and how old is it?
  ref:
    - {tool: get_fleet_operating_costs, args: {status: active}}
  facts: ["articulated", "1329820", "0.65", "5.5"]
