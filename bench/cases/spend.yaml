- id: spend-04:36:Q6
  question: "04:36:Q6"
  prompt: >
    What price increase should we expect next year from our Cookware supplier SUP-0074 based on its input costs, and
    which Home suppliers have pushed the biggest increases in the past?
  ref:
    - {tool: get_supplier_input_cost_mix, args: {supplier_id: SUP-0074}}
