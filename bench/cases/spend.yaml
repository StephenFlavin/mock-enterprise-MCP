    - {tool: compare_price_paid_to_benchmark, args: {category: Knitwear}}
  facts: ["Small Appliances", "Outerwear", "Knitwear", "Smart Home", "Personal Care", "8.4"]

- id: spend-04:36:Q5
  question: "04:36:Q5"
