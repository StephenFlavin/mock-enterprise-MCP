- id: spend-04:37:Q3
  question: "04:37:Q3"
  prompt: >
    Facilities spend is 14% over budget this year. Which suppliers account for it over the last 12 months, and how
    much of each is one-off versus recurring?
  ref:
    - {tool: list_spend_by_supplier_and_category, args: {category: Facilities}}
    - {tool: classify_spend_one_off_vs_recurring, args: {category: Facilities}}
  facts: ["SUP-0085", "SUP-0086", "SUP-0087", "641694"]
  notes: "Facilities spend sits with the indirect suppliers SUP-0085 (cleaning, recurring), SUP-0087 (MRO, recurring) and SUP-0086 (facilities management, with the roof refurbishment project); master carries no annual spend for indirect suppliers so the spend system holds their service spend. Budget figures live in another system."

- id: spend-04:37:Q5
  question: "04:37:Q5"
  prompt: >
    What have we spent on Energy and Packaging services over the last 12 months, and with which suppliers?
  ref:
    - {tool: get_spend_by_supplier, args: {category: Energy}}
    - {tool: get_spend_by_supplier, args: {category: Packaging}}
  facts: ["SUP-0083", "550000", "SUP-0081", "SUP-0082", "600000"]
  notes: "Energy suppliers are SUP-0083 and SUP-0084, packaging suppliers SUP-0081 (corrugated) and SUP-0082 (film), all indirect suppliers in master. No price forecast data here (commodity system)."

