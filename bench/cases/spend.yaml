    - {tool: list_spend_by_supplier_and_category, args: {supplier_id: SUP-0083, category: Energy, summarise: true}}
  facts: ["900000", "550000"]
  notes: "Contract dates, notice periods and owners live in the contracts system, which uses the same indirect suppliers (SUP-0086 facilities management, SUP-0083 energy)."

