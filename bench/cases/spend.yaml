- id: spend-04:32:Q5
  question: "04:32:Q5"
  prompt: >
    I need to plan housewares margin for next season. Over the last 12 months, how is our Home department supplier
    spend split by invoicing currency, and which suppliers carry the biggest exposure in the main currency?
  ref:
    - {tool: get_supplier_spend_by_currency, args: {department: Home}}
  facts: ["USD", "88.5", "EUR", ["Khan Products", "SUP-0011"]]

- id: spend-04:32:Q6
  question: "04:32:Q6"
  prompt: >
    Three of my suppliers have risk alerts: SUP-0053 (Drinkware), SUP-0055 (Small Appliances) and SUP-0001 (Tops).
    How reliant are we on each of them? Give me each one's share of its category's spend over the last 12 months and
    rank them.
  ref:
    - {tool: get_supplier_share_of_category_spend, args: {supplier_id: SUP-0053, category: Drinkware}}
    - {tool: get_supplier_share_of_category_spend, args: {supplier_id: SUP-0055, category: Small Appliances}}
    - {tool: get_supplier_share_of_category_spend, args: {supplier_id: SUP-0001, category: Tops}}
  facts: ["38.6", "12.8", "12"]

- id: spend-04:32:Q7
  question: "04:32:Q7"
  prompt: >
    I have the annual review with our largest cookware supplier SUP-0074 coming up. What share of its total sales do we
    represent over the last 12 months, and how do our payment terms compare with the market standard for Cookware
    from its country?
  ref:
    - {tool: get_supplier_share_of_wallet, args: {supplier_id: SUP-0074}}
    - {tool: get_payment_terms_benchmark, args: {category: Cookware, supplier_id: SUP-0074}}
  facts: ["25.3", "18589000", "75", "30"]

- id: spend-04:32:Q8
  question: "04:32:Q8"
  prompt: >
    Our buying margin on Small Appliances fell year on year. How much could we recover by renegotiating with our
    suppliers in that category, based on what we pay above contract, and which suppliers matter most?
  ref:
    - {tool: calculate_renegotiation_recovery, args: {category: Small Appliances}}
  facts: ["SUP-0013", "SUP-0055", "814840", "370519"]

- id: spend-04:34:Q7
  question: "04:34:Q7"
  prompt: >
    We are considering a volume commitment with our Portuguese nearshore supplier SUP-0044. How has its actual volume
    compared with forecast recently, what is the commitment level, and what volume is planned for the coming months?
  ref:
    - {tool: get_nearshore_spend_and_forecast_volume, args: {supplier_id: SUP-0044}}
  facts: ["88.1", "84.8", "90", "13898"]

- id: spend-04:35:Q2
  question: "04:35:Q2"
  prompt: >
    List our top 20 suppliers by spend over the last 12 months with their spend and share of total.
  ref:
    - {tool: list_top_suppliers_by_spend, args: {limit_rows: 20}}
  facts: ["SUP-0041", "15525000", "SUP-0020", "SUP-0055", "SUP-0076"]

- id: spend-04:36:Q1
  question: "04:36:Q1"
  prompt: >
    Our preferred-supplier share of category spend has dropped over the last 12 months. Which category fell the most,
    where is that spend going, and how much extra are we paying with SUP-0055 compared with contract?
  ref:
    - {tool: get_preferred_supplier_share_trend, args: {}}
    - {tool: list_spend_by_supplier_and_category, args: {category: Knitwear, period_from: -60d}}
    - {tool: calculate_price_variance_vs_contract, args: {supplier_id: SUP-0055}}
  facts: ["Knitwear", "SUP-0072", ["35", "60.2"], "252197"]
  notes: "Question quotes an 82% to 74% preferred share; spend is reconciled to master annual spend and tiers, so the data shows category-level drops instead (Knitwear 60% to 35%, driven by probation-tier SUP-0072 onboarded this year). The prompt does not quote the figures."

- id: spend-04:36:Q2
  question: "04:36:Q2"
  prompt: >
    Which categories have the biggest tail of small suppliers? For Footwear, what would consolidating onto the suppliers
    that cover 80% of spend save, and how reliably have consolidation savings been realised in the past?
  ref:
    - {tool: get_supplier_fragmentation_by_category, args: {}}
    - {tool: calculate_consolidation_savings, args: {category: Footwear, consolidation_target_pct: 80}}
    - {tool: get_historic_savings_realisation_rates, args: {initiative_type: consolidation}}
  facts: ["Small Appliances", "7132100", "Footwear", "1979933", "98997", "237592"]
  scenario_facts: ["Footwear", "1979933", "98997", "237592"]

- id: spend-04:36:Q3
  question: "04:36:Q3"
  prompt: >
    How much of the savings we reported over the last 12 months are actually in our prices? Show which initiatives were
    reversed or never real.
  ref:
    - {tool: calculate_realised_savings, args: {}}
    - {tool: compare_reported_vs_realised_savings, args: {}}
  facts: ["1270000", "658000", ["INIT-900005", "Shirts"], ["INIT-900006", "Small Appliances"], ["INIT-900007", "Jewellery"]]

- id: spend-04:36:Q4
  question: "04:36:Q4"
  prompt: >
