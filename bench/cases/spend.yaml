- id: spend-04:35:Q3
  question: "04:35:Q3"
  prompt: >
    We have too many suppliers. Looking at all our spend over the last 12 months, how many suppliers do we have, how many
    would be tail suppliers if a core group had to cover 80% of spend, how much spend sits in that tail, and what range
    of savings could consolidating it realistically give?
  ref:
    - {tool: calculate_consolidation_savings, args: {consolidation_target_pct: 80}}
  facts: ["80", "37", "89862000", "4493100", "10783440"]
  notes: "Supplier scoring criteria (scorecards, criticality, management cost) live in other systems; the spend system only gives the tail and the 5-12% saving range."

- id: spend-04:37:Q4
  question: "04:37:Q4"
  prompt: >
    The Facilities contract with SUP-0086 and the Energy contract with SUP-0083 are both coming up for renewal in the
    next 12 months. How much have we spent with each of them in that category over the last 12 months, so I can size the tenders?
