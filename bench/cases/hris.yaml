- id: hris-01:6:Q3
  question: "01:6:Q3"
  prompt: >
    We're weighing a new night shift against overtime on the early and late shifts. Over the last 12 months across
    our DCs, what are the turnover and retention rates by shift pattern, and how do agency staff compare with
    permanent staff on how long they stay?
  ref:
    - {tool: get_attrition_by_shift_pattern, args: {date_from: -365d}}
  facts: [["41.2", "41%"], ["58.8", "59%"], ["26.9", "27%"], ["3.3", "3 months"]]

- id: hris-09:87:Q6
  question: "09:87:Q6"
  prompt: >
    Show me how our supply chain function is organised today: headcount by team (logistics and the DCs, planning,
    sourcing, quality) and how many managers and roles sit in each.
  ref:
    - {tool: get_org_structure, args: {function: Supply Chain}}
  facts: ["210", "14", "7", "6"]

- id: hris-09:88:Q2
  question: "09:88:Q2"
  prompt: >
    Productivity at Daventry (DC2) is well below the other DCs and I want to know if management is part of it.
    Who manages each shift there, how big are their teams, and are there any gaps or vacancies?
  ref:
    - {tool: get_site_management_structure, args: {site_id: DC2}}
  facts: ["agency", ["left", "vacant", "vacancy"], "18", "17"]

- id: hris-09:88:Q4-a
  question: "09:88:Q4"
  prompt: >
    For peak planning, what is our current total headcount at each of the five DCs?
  ref:
    - {tool: get_current_headcount_by_site_and_skill, args: {}}
  facts: ["71", "56", "34", "26", "18"]

- id: hris-09:88:Q4-b
  question: "09:88:Q4"
  prompt: >
    Create a requisition at DC2 for 12 permanent Picker/Packers on the night shift, needed in about four weeks.
  ref:
    - {tool: create_headcount_requisition, args: {site_id: DC2, role: Picker/Packer, headcount: 12, shift: night, employment_type: permanent, required_by: +28d}}
  facts: ["12", "night", "Picker/Packer"]

- id: hris-09:89:Q1
  question: "09:89:Q1"
  prompt: >
    For peak planning at DC2: how many people do we have on each shift today, and how many of them hold a forklift
    certification?
  ref:
    - {tool: get_current_headcount_by_site_and_skill, args: {site_id: DC2, skill: forklift}}
  facts: ["19", "18", ["5", "five"], ["3", "three"]]

- id: hris-09:89:Q2-a
  question: "09:89:Q2"
  prompt: >
    Turnover at Daventry (DC2) is 45% against about 28% at the other DCs. Looking at the last 12 months, which shift
    has the worst turnover, what do leavers say in exit interviews, how does night pay compare with the market, and
    how far do night staff commute?
  ref:
    - {tool: get_site_turnover_by_cohort, args: {site_id: DC2}}
    - {tool: get_exit_interview_themes, args: {site_id: DC2}}
    - {tool: get_pay_rates_vs_market, args: {site_id: DC2, shift: night}}
    - {tool: get_employee_commute_distances, args: {site_id: DC2}}
  facts: ["night", ["58.8", "59%"], ["12%", "12.0"], ["37.9", "38 km", "38km"]]
  notes: "Corby is DC6, a 3PL overflow DC with no employees in master data, so the workforce story the question calls Corby is told on Daventry (DC2) and named as such."

- id: hris-09:89:Q2-b
  question: "09:89:Q2"
  prompt: >
    Log a pay review request for the night shift Picker/Packers at DC2 because of the market rate gap and high
    turnover.
  ref:
    - {tool: create_pay_review_request, args: {site_id: DC2, role: Picker/Packer, shift: night, reason: market rate gap and high turnover}}
  facts: ["DC2", "night", "Picker/Packer"]
  notes: "Corby is DC6 (3PL, no employees in master), so the night-shift pay review is raised for Daventry (DC2)."

- id: hris-09:89:Q3
  question: "09:89:Q3"
  prompt: >
    How do our Picker/Packer hourly pay rates compare with the local market at each of our UK DCs, and where are we
    furthest below market?
  ref:
    - {tool: get_pay_rates_vs_market, args: {role: Picker/Packer}}
  facts: ["Daventry", ["14.6", "14.60"], ["16.6", "16.60"], ["12%", "12.0"]]

- id: hris-09:89:Q4
  question: "09:89:Q4"
  prompt: >
    Over the last 12 months, how does retention compare between agency, temporary and permanent labour, and between
    hire routes such as referrals? I want average tenure and the share who leave within six months.
  ref:
    - {tool: get_retention_by_labour_type, args: {}}
  facts: [["3.5", "3.5 months"], ["93.3", "93%"], ["37.1", "37 months"], ["46.9", "47 months"]]

- id: hris-09:89:Q5
  question: "09:89:Q5"
  prompt: >
    Where are our people problems? Show attrition and absence by DC and shift (turnover over the last 12 months,
    absence over the last 90 days), which site is the outlier, and what leavers there say about why they go.
  ref:
    - {tool: get_attrition_by_site_and_shift, args: {date_from: -365d}}
    - {tool: get_absence_rate_by_site_and_shift, args: {date_from: -90d}}
    - {tool: get_exit_interview_themes, args: {site_id: DC2}}
  facts: ["DC2", ["45.5", "45%"], ["7.3", "7.4", "7.5", "7.6", "7.7", "7.8", "7.9", "8.0", "8.1", "8.2", "8.3", "8%"], "Pay"]
