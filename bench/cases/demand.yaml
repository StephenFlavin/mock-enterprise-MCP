- id: demand-01:4:Q5
  question: "01:4:Q5"
  prompt: >
    We are planning cycle counts before peak. For the peak period from Black Friday week to the end of December,
    what inbound and outbound volume do we forecast across the DCs in total, how much higher is weekly inbound than
    in recent weeks, and which week is the busiest for inbound?
  ref:
    - {tool: get_peak_inbound_forecast, args: {}}
  facts: ["1454677", "43", "2026-11-23", "1664434"]

- id: demand-01:10:Q4
  question: "01:10:Q4"
  prompt: >
    The DC1 sorter is nearly 12 years old and we need the volume it will carry. What is the forecast outbound volume
    through DC1 for each of the next seven years in the base scenario and in the upside scenario, and how much higher
    is year seven than year one in each?
  ref:
    - {tool: get_volume_forecast, args: {site_id: DC1}}
  facts: ["3398800", "22.9", "50.1", "5159500"]

- id: demand-02:11:Q4
  question: "02:11:Q4"
  prompt: >
    For peak transport planning, which lanes have the highest forecast volume from Black Friday week to Christmas
    week? Give me the top lanes with their average weekly pallets and the pallets in Black Friday week and in
    Christmas week.
  ref:
    - {tool: get_peak_volume_forecast_by_lane, args: {}}
  facts: ["DC1-ST215", "754", "787", "711", "DC1-ST150", "762", "648"]

- id: demand-02:13:Q1
  question: "02:13:Q1"
  prompt: >
    Style STY-7731 is a key winter promo line and it is going to arrive three weeks late. What is the weekly base
    sales forecast for the style from launch, and how many units does the base case say we sell in the first three
    weeks, which is what a three-week delay would cost us?
  ref:
    - {tool: get_sales_forecast_for_style, args: {style_id: STY-7731, weeks_ahead: 12}}
  facts: ["900", "2600", "2300", "5800"]

- id: demand-02:16:Q3
  question: "02:16:Q3"
  prompt: >
    To plan courier capacity, what is the forecast number of online order units by region from Black Friday week to
    Christmas week, each region's share, and which day is the busiest? Compare with last year's peak.
  ref:
    - {tool: get_peak_order_volume_forecast_by_region, args: {}}
  facts: ["UK South", "188934", "30.1", "UK North", "138581", "2026-11-27", ["9.4", "9.4%"]]

- id: demand-02:21:Q1
  question: "02:21:Q1"
  prompt: >
    How many returns are we forecast to get next week, and what is the low and high end of the range?
  ref:
    - {tool: get_return_forecast_by_week, args: {weeks_ahead: 1}}
  facts: ["11850", "10900", "12800"]

- id: demand-02:21:Q3
  question: "02:21:Q3"
  prompt: >
    I need returns centre capacity for the January peak, about 13 weeks from now. Show the weekly returns forecast
    for the four weeks of January with the range, which week is the peak, how sure the forecast is for that week,
    and the total for the four weeks.
  ref:
    - {tool: get_return_forecast_by_week, args: {week_start: +13w, weeks_ahead: 4}}
  facts: ["34430", "29270", "39590", "111930", "2027-01-11"]

- id: demand-03:22:Q1
  question: "03:22:Q1"
  prompt: >
    Style STY-5520 (SKU-101904) stocked out in 40 stores for nine days last month even though the forecast looked
    fine. Show me the weekly forecast against actual sales for SKU-101904 over the last eight weeks, and how many
    units and how much revenue the stockout cost us, and what cause is recorded.
  ref:
    - {tool: get_forecast_by_week_for_product, args: {sku: SKU-101904, period_start: -8w, period_end: -1w}}
    - {tool: calculate_lost_sales_for_product, args: {sku: SKU-101904, period_start: -60d}}
  facts: ["304", "12765", ["allocation_shortfall", "allocation shortfall", "allocation"], "212", "195"]

- id: demand-03:22:Q3
  question: "03:22:Q3"
  prompt: >
    Start the review of reorder points with the fastest sellers. Which are the five fastest-selling SKUs by units
    over the last 52 weeks, and how variable is their weekly demand (coefficient of variation) and their forecast
    error?
  ref:
    - {tool: list_top_selling_skus, args: {metric: units, limit_rows: 5}}
    - {tool: get_demand_variability_by_sku, args: {top_n: 5}}
  facts: ["SKU-104669", "21115", "39.6", "9.5", "SKU-102338"]

- id: demand-03:22:Q4
  question: "03:22:Q4"
  prompt: >
    14,000 units of the seasonal throw K-1700 sit at the DC. What is the base weekly demand forecast for the next 12
    weeks, which week is the peak, and what is the total forecast demand over the 12 weeks?
  ref:
    - {tool: get_forecast_by_week_for_product, args: {sku: K-1700, period_start: today, period_end: +11w}}
  notes: "Master sales put K-1700 at about 230 units a week network-wide, so 12 weeks of forecast (3,219 units) is far below the 14,000 units the allocation and wms stories hold at the DC; those systems' regional sales rates (188 and 280 a week) are also inconsistent with master sales."
  facts: ["360", "2026-11-23", "3219"]

- id: demand-03:23:Q1-a
  question: "03:23:Q1"
  prompt: >
    Outerwear forecast bias was about +18% over the last four weeks. Confirm the overall bias, then decompose it by
    driver (weather, promotion, pricing, store cluster, new launches) in percentage points, and say whether the
    weather effect could have been foreseen.
  ref:
    - {tool: get_forecast_bias_for_category, args: {category: Outerwear, period_start: -4w}}
    - {tool: get_forecast_error_decomposition, args: {category: Outerwear, period_start: -4w}}
  facts: ["18", "weather", "9", "promotion", "4", "pricing", "2", ["seasonal outlook", "outlook"]]

- id: demand-03:23:Q1-b
  question: "03:23:Q1"
  prompt: >
    Outerwear forecast bias was +18% over the last four weeks. Is the same bias showing in other markets? Give the
    bias for each market.
  ref:
    - {tool: get_forecast_bias_by_market, args: {category: Outerwear, period_start: -4w}}
  facts: ["Scotland", "26", "UK North", "24", "Ireland", "12", "EU Central", "5"]

- id: demand-03:23:Q2-a
  question: "03:23:Q2"
  prompt: >
    We are forecasting a new recycled-polyester backpack range. Find comparable bags in the Bags category and tell
    me which bag launched in the last year sold the most units in its first 12 weeks.
  ref:
    - {tool: search_comparable_products, args: {name_keywords: bag, category: Bags}}
  facts: ["SKU-103213", "1443", ["White Bag", "STY-7763"]]

- id: demand-03:23:Q2-b
  question: "03:23:Q2"
  prompt: >
    The new backpack range SKU-103423 launches in about 14 weeks. Give me the weekly forecast for the first 12 weeks
    (base case and range) and the cumulative chase and cancel thresholds for the first three weeks after launch.
  ref:
    - {tool: run_new_product_forecast, args: {sku: SKU-103423, launch_date: +14w}}
    - {tool: calculate_early_sales_trigger_thresholds, args: {sku: SKU-103423, launch_week: +14w}}
  notes: "Master data has no SKU for the new backpack range, so SKU-103423 (Rust Bag, STY-7874, Bags) is a stand-in; its master launch_date (an earlier date) differs from the planned launch in pipeline_products."
  facts: ["51", "28", "56", "599", "163", "77"]

- id: demand-03:23:Q2-c
  question: "03:23:Q2"
  prompt: >
    For the new backpack SKU-103423, load the base case into the forecast as an override of 51 units a week for the
    launch week, and set chase and cancel alerts for the first three weeks at 163 and 77 cumulative units.
  ref:
    - {tool: create_forecast_override, args: {sku: SKU-103423, week_start: +14w, week_end: +15w, override_units: 51, override_type: base_case, reason: New product base case}}
    - {tool: create_early_sales_alert, args: {sku: SKU-103423, alert_type: chase, trigger_units: 163, launch_date: +14w, monitor_weeks: 3}}
    - {tool: create_early_sales_alert, args: {sku: SKU-103423, alert_type: cancel, trigger_units: 77, launch_date: +14w, monitor_weeks: 3}}
  facts: ["51", "163", "77"]
