    - {tool: update_demand_history_adjustments, args: {adjustment_id: ADJ-900001, units_lost: 480, correction_method: use average of pre/post}}
  facts: ["480", ["use average of pre/post", "average of pre/post", "average of the weeks before and after", "average of pre and post"]]

