  prompt: >
    We are planning cycle counts before peak. For the peak period from Black Friday week to the end of December,
    what inbound and outbound volume do we forecast across the DCs in total, how much higher is weekly inbound than
    in recent weeks, and which week is the busiest for inbound?
  ref:
    - {tool: get_peak_inbound_forecast, args: {}}
  facts: ["1454677", "43", "2026-11-23", "1664434"]

