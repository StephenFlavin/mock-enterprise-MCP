- id: demand-03:23:Q5-a
  question: "03:23:Q5"
  prompt: >
    Stockouts last quarter distorted demand history for PF-220, SKU-100056, K-1700 and SKU-100441. SKU-100441 has been
    delisted, so leave it out. For the others, how many units of demand did we lose last quarter, and what do PF-220's
    weekly units look like once corrected for the stockouts?
  ref:
    - {tool: calculate_lost_demand_for_sku, args: {sku: PF-220, period_start: -13w, period_end: today}}
    - {tool: calculate_lost_demand_for_sku, args: {sku: SKU-100056, period_start: -13w, period_end: today}}
    - {tool: calculate_lost_demand_for_sku, args: {sku: K-1700, period_start: -13w, period_end: today}}
    - {tool: calculate_corrected_demand_history, args: {sku: PF-220, period_start: -13w, period_end: today}}
  facts: ["770", "600", "287", "373", "466"]
  notes: "Master sales put SKU-100056 at about 15 units a week, so the 600 lost units in the stockout report (and here) are out of proportion with its history."

- id: demand-03:23:Q5-b
