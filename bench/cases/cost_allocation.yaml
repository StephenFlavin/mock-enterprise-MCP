- id: cost_allocation-07:62:Q3-a
  question: "07:62:Q3"
  prompt: >
    We're assessing a proposed £12m automation investment at DC1 (Northampton). What is the DC1 annual operating
    cost base by component, how much of it is labour, and what is the total cost per unit handled?
  ref:
    - {tool: get_site_operating_costs, args: {site_id: DC1}}
  facts: [27125000, 64635000, "42", "1.04"]

- id: cost_allocation-07:63:Q2-a
  question: "07:63:Q2"
  prompt: >
    Using FY26 actuals, show the cost to serve for each channel (store, online, wholesale) across warehousing,
    outbound transport, returns and packaging, per order and as a percentage of sales. Which channel loses money
    after cost to serve? Then test the saved "free returns removed" scenario SCEN-000002 and say what it saves.
  ref:
    - {tool: get_cost_to_serve_by_channel, args: {}}
    - {tool: calculate_cost_to_serve_scenario, args: {scenario_id: SCEN-000002}}
  facts: ["online", "30.31", "34.21", "-22462264", "18900000"]

- id: cost_allocation-07:63:Q2-b
  question: "07:63:Q2"
  prompt: >
    Save a new allocation scenario called "Free returns removed 30" with the returns pool reduced by 30%, created
    by EMP-00085.
  ref:
    - {tool: create_cost_allocation_scenario, args: {scenario_name: "Free returns removed 30", assumptions: "Returns pool reduced 30%", returns_change_pct: -30, created_by: EMP-00085}}
  facts: ["Free returns removed 30", ["-30", "30%"]]

- id: cost_allocation-07:63:Q2-c
  question: "07:63:Q2"
  prompt: >
    Change the returns allocation driver DRV-000023 to per item (allocation base items) at £7.68 per item.
  ref:
    - {tool: update_cost_allocation_driver, args: {driver_id: DRV-000023, allocation_base: items, rate_gbp_per_unit: 7.68}}
  facts: ["items", "7.68"]

- id: cost_allocation-07:63:Q4-a
  question: "07:63:Q4"
  prompt: >
    Are our logistics costs high compared with other retailers? Show which cost lines are furthest above the
    benchmark median and how comparable the benchmark definitions are to ours.
  ref:
    - {tool: get_logistics_cost_by_line, args: {}}
  facts: ["returns", "40", ["low", "least comparable"], ["outbound transport", "outbound_transport"], "12.92"]

- id: cost_allocation-07:63:Q6-a
  question: "07:63:Q6"
  prompt: >
    Why did the activity-based cost per e-commerce order go from £6.20 last quarter to £7.10 this quarter? Which
    cost components moved most, and by how much per order?
  ref:
    - {tool: get_ecom_cost_per_order, args: {}}
  facts: ["7.1", "0.45", "0.23", "0.2"]

- id: cost_allocation-07:63:Q7-a
  question: "07:63:Q7"
  prompt: >
    Which small SKUs cost more to serve than they earn? Flag them for range review and say which loses the most
    per unit.
  ref:
    - {tool: get_sku_cost_to_serve, args: {size_class: small, margin_threshold_gbp: 0}}
  facts: ["SKU-105775", "-3.89", "SKU-104494", "SKU-104816"]

- id: cost_allocation-09:87:Q5-a
  question: "09:87:Q5"
  prompt: >
    Northampton DC (DC1) cost per unit is about 18% above the network average. Break DC1's cost per unit down by
    component against the network average, and say which component adds the most excess cost and how much in total.
  ref:
    - {tool: get_dc_cost_per_unit_by_component, args: {site_id: DC1}}
  facts: ["18.1", "1.04", "0.88", ["labour"], 3923333, 9893333]
