- id: risk-05:50:Q2-a
  question: "05:50:Q2"
  prompt: >
    Save the six-week closure of the main southern Vietnam port as a risk scenario called "Ho Chi Minh City port
    closure - 6 weeks": 15% likelihood, £1.06m revenue impact, 2.4 points of margin impact, affecting the top earners
    SKU-103696 and SKU-103682 and the lines that run out first, SKU-101260, SKU-102884 and SKU-105964, mitigated with an
    alternate port, air freight and buffer stock at an estimated cost of £210,000.
  ref:
    - {tool: create_risk_scenario, args: {scenario_name: "Ho Chi Minh City port closure - 6 weeks", description: "Main southern Vietnam port closed for six weeks", likelihood_pct: 15, revenue_impact_gbp: 1060000, margin_impact_pct: 2.4, affected_skus: "SKU-103696,SKU-103682,SKU-101260,SKU-102884,SKU-105964", mitigation_options: "Alternate port, air freight and buffer stock", cost_to_mitigate_gbp: 210000}}
  facts: [1060000, 210000, "SKU-103696", "SKU-103682", "SKU-101260"]
  notes: "Revenue and margin figures are the risk register's own scale (VN route 9.2m a year); supply_planning's six-week case (3.8m retail revenue at risk) uses master demand at retail price and is higher."

