- id: sourcing-02:12:Q2
  question: "02:12:Q2"
  prompt: >
    We are retendering our Asia-Europe ocean freight contract. Draft the tender criteria from the approved ocean
    carrier template TST-900001, including the reliability and rate terms we should ask carriers to commit to.
    Once that is agreed, set up the tender event for the Asia-Europe lane with that template, bids due in about six
    weeks, and issue the invitation to carriers CAR-006 and CAR-007.
  ref:
    - {tool: draft_tender_criteria, args: {template_id: TST-900001, lane: Asia-Europe}}
    - {tool: create_tender_event, args: {description: Ocean freight tender Asia-Europe renewal, criteria_template_id: TST-900001, lanes: Asia-Europe, invited_carrier_ids: "CAR-006,CAR-007", response_deadline: "+45d"}}
    - {tool: send_tender_invitation, args: {rfx_id: RFX-900005, invited_carrier_ids: "CAR-006,CAR-007"}}
  facts: ["Schedule reliability", "at least 80% schedule reliability", "8% rolled bookings", "Rate competitiveness", "CAR-007"]

- id: sourcing-02:20:Q6
  question: "02:20:Q6"
  prompt: >
    We are rewriting the scorecard for our next road carrier tender. Start from the existing carrier scorecard
    template TST-900002, then score the three carriers in the current-carrier baseline tender RFX-900002 with
    these weights: on-time delivery 30%, damage and loss 25%, cost per shipment 20%, compliance and safety 10%,
    tracking and EDI 10%, sustainability 5%. Save the new scorecard as a template called "Road carrier tender
    scorecard 2027" with those criteria and weights, for use in the tender.
  ref:
    - {tool: draft_tender_scorecard, args: {template_id: TST-900002}}
    - {tool: calculate_carrier_weighted_scores, args: {rfx_id: RFX-900002, on_time_weight_pct: 30, damage_loss_weight_pct: 25, cost_weight_pct: 20, compliance_weight_pct: 10, tracking_weight_pct: 10, sustainability_weight_pct: 5}}
    - {tool: create_tender_scorecard_template, args: {name: Road carrier tender scorecard 2027, description: Scorecard for the next road carrier tender, purpose: Road carrier reliability claims and cost, criteria_weights: "On-time delivery 30%; Damage and loss 25%; Cost per shipment 20%; Compliance and safety 10%; Tracking and EDI 10%; Sustainability 5%"}}
  facts: ["Midshires Transport", "3.6", "Northline Haulage", "3.5", "2.95"]

- id: sourcing-04:32:Q3
  question: "04:32:Q3"
  prompt: >
    For next season's bedding range (RFQ-900001, 60,000 units) what did the three suppliers quote on unit cost,
    lead time and capacity? We have decided on a 70/30 split between SUP-0039 and SUP-0004: record the award at
    their quoted unit costs, effective in about three months. Do not raise any purchase order yet.
  ref:
    - {tool: get_rfq_responses_for_product, args: {rfq_id: RFQ-900001}}
    - {tool: create_sourcing_award, args: {supplier_id: SUP-0039, category: Bedding, rfq_id: RFQ-900001, volume_units: 42000, volume_split_pct: 70, unit_cost_gbp: 38.9, effective_date: "+90d"}}
    - {tool: create_sourcing_award, args: {supplier_id: SUP-0004, category: Bedding, rfq_id: RFQ-900001, volume_units: 18000, volume_split_pct: 30, unit_cost_gbp: 36.2, effective_date: "+90d"}}
  facts: ["38.9", "36.2", "33.8", "57600", "23400"]

- id: sourcing-04:33:Q3
  question: "04:33:Q3"
  prompt: >
    We are looking at moving 20% of our denim volume, about 120,000 jeans a year, from Bangladesh to Vietnam.
    Which approved Vietnamese factories do denim with wash and finishing in-house and can commit at least 30,000
    units a season? Then set up an RFQ for 120,000 core denim jeans for DC1, needed in about four months, to the
    suppliers that own those factories.
  ref:
    - {tool: search_factories_by_capability_and_country, args: {country: VN, capability: denim wash, min_capacity_units_season: 30000}}
    - {tool: create_rfq, args: {product_name: Core denim jeans, required_qty: 120000, required_date: "+120d", destination_site_id: DC1, invited_supplier_ids: "SUP-0008,SUP-0034,SUP-0035"}}
  facts: [["Wright Dyehouse 17", "FAC-0017"], ["McDonald Knitting 66", "FAC-0066"], ["Giles Knitting 70", "FAC-0070"], "80000"]
  notes: "Master data has no Bangladesh-made trousers or denim SKU, so the denim RFQ is by product name. Factory capability lines (denim wash and finishing) are held in this system's own factory_capabilities table because master factories have no capability field."

- id: sourcing-04:33:Q6
  question: "04:33:Q6"
  prompt: >
    If new tariffs force us to move cut-and-sew garment volume out of southern China, which approved factories
    in Vietnam could take it over? We would need at least 100,000 units a season of capacity from each; list them
    best audit grade first.
  ref:
    - {tool: search_factories_by_capability_and_country, args: {country: VN, capability: cut-and-sew garments, min_capacity_units_season: 100000}}
  facts: [["FAC-0129", "Davies Plant 129"], ["FAC-0104", "King Dyehouse 104"], ["FAC-0105", "Howard Plant 105"], "140000"]
  notes: "Master factories carry no region, so southern China cannot be distinguished from the rest of China; the case covers only the alternative (Vietnam) side."

- id: sourcing-04:34:Q1
  question: "04:34:Q1"
  prompt: >
    We want to pilot nearshoring of fashion basics. Which approved factories in Portugal and in Turkey make woven
    trousers and dresses with at least 50,000 units a season of capacity? Then set up a pilot RFQ of 8,000 units
    each for SKU-101638, SKU-102891 and SKU-101897, delivered to DC1 in about 14 weeks, inviting the suppliers of
    the best factory in each country.
  ref:
    - {tool: search_factories_by_capability_and_country, args: {country: PT, capability: woven trousers and dresses, min_capacity_units_season: 50000}}
    - {tool: search_factories_by_capability_and_country, args: {country: TR, capability: woven trousers and dresses, min_capacity_units_season: 50000}}
    - {tool: create_rfq, args: {sku: SKU-101638, required_qty: 8000, required_date: "+98d", destination_site_id: DC1, invited_supplier_ids: "SUP-0058,SUP-0036"}}
    - {tool: create_rfq, args: {sku: SKU-102891, required_qty: 8000, required_date: "+98d", destination_site_id: DC1, invited_supplier_ids: "SUP-0058,SUP-0036"}}
    - {tool: create_rfq, args: {sku: SKU-101897, required_qty: 8000, required_date: "+98d", destination_site_id: DC1, invited_supplier_ids: "SUP-0058,SUP-0036"}}
  facts: [["FAC-0110", "McLean Plant 110"], ["FAC-0072", "Bailey Dyehouse 72"], "120000", "8000"]
  notes: "Master data has no Moroccan factories or suppliers, so only Portugal and Turkey can be searched."

- id: sourcing-04:34:Q2
  question: "04:34:Q2"
  prompt: >
    Find factories in Portugal and in Turkey that can make technical outerwear with seam-sealing, hold OEKO-TEX
    certification and can commit 30,000 units a season, best audit grade first. Then send RFQ-900003 to the
    suppliers of the top three factories.
  ref:
    - {tool: search_factories_by_capability_and_country, args: {country: PT, capability: technical outerwear seam-sealing, certification: OEKO-TEX, min_capacity_units_season: 30000}}
    - {tool: search_factories_by_capability_and_country, args: {country: TR, capability: technical outerwear seam-sealing, certification: OEKO-TEX, min_capacity_units_season: 30000}}
    - {tool: send_rfq_to_suppliers, args: {rfq_id: RFQ-900003, invited_supplier_ids: "SUP-0058,SUP-0036,SUP-0044"}}
  facts: [["FAC-0110", "McLean Plant 110"], ["FAC-0072", "Bailey Dyehouse 72"], ["FAC-0085", "Murphy Mill 85"], ["FAC-0125", "Cunningham Dyehouse 125"]]

- id: sourcing-04:34:Q5
  question: "04:34:Q5"
  prompt: >
    The nearshore quotes for SKU-102863 on RFQ-900002 are about 35% above the cost we expected. Who quoted what,
    which cost components drive the premium, and what did quotes for this SKU look like in earlier rounds by
    origin? Then ask the three highest quotes to re-quote on a simpler specification without the full lining.
  ref:
    - {tool: get_rfq_responses_for_product, args: {rfq_id: RFQ-900002}}
    - {tool: get_quote_cost_breakdown_by_component, args: {rfq_id: RFQ-900002}}
    - {tool: get_historic_quotes_by_origin, args: {sku: SKU-102863}}
    - {tool: send_rfq_clarification_request, args: {rfq_id: RFQ-900002, response_id: RFR-900004, question: Please re-quote on a simpler specification without the full lining, context: specification}}
    - {tool: send_rfq_clarification_request, args: {rfq_id: RFQ-900002, response_id: RFR-900005, question: Please re-quote on a simpler specification without the full lining, context: specification}}
    - {tool: send_rfq_clarification_request, args: {rfq_id: RFQ-900002, response_id: RFR-900006, question: Please re-quote on a simpler specification without the full lining, context: specification}}
  facts: ["Warren Products", "51.4", "labour", "8.39", "28.95"]

- id: sourcing-04:37:Q1
  question: "04:37:Q1"
  prompt: >
    Compare the four bids on the warehouse cleaning tender RFX-900004 on price, service levels, references and
    risk. Surface the hidden costs (call-out fees, consumables, minimum hours, price review clauses), give the
    total cost over three years for each bid, and tell me which bid has the weakest references. Then send a
    clarification to the two bids with the lowest three-year cost, asking them to confirm minimum staffing levels
    and how their price review clause works.
  ref:
    - {tool: compare_bids_by_criteria, args: {rfx_id: RFX-900004}}
    - {tool: calculate_three_year_total_cost, args: {rfx_id: RFX-900004}}
    - {tool: get_supplier_references, args: {rfx_id: RFX-900004}}
    - {tool: send_rfq_clarification_request, args: {rfx_id: RFX-900004, rfx_response_id: RXR-900012, question: Please confirm minimum staffing levels and how the price review clause works, context: service and price review}}
    - {tool: send_rfq_clarification_request, args: {rfx_id: RFX-900004, rfx_response_id: RXR-900013, question: Please confirm minimum staffing levels and how the price review clause works, context: service and price review}}
  facts: ["328293.6", "361182.4", "390952.8", "395080", "CleanForce Services"]
  notes: "Only the incumbent bidder BrightSpace Cleaning Services is a master supplier (SUP-0085, indirect); the other three bidders are prospects held by name (bidder_name) rather than by supplier id."

- id: sourcing-04:39:Q6
  question: "04:39:Q6"
  prompt: >
    Which suppliers can provide recycled or alternative polyester to replace virgin polyester at no more than
    about a 20% price premium? Give their certification, lead time, premium and the capacity they have available.
  ref:
    - {tool: search_alternative_material_suppliers, args: {material: polyester, max_price_premium_pct: 20}}
  facts: ["Cooper Textiles", "Collins Textiles", "Brown Textiles", "17.5", "2500"]
  notes: "Master suppliers are product suppliers, so recycled-fibre capability is held in this system's own supplier_materials table against existing textile suppliers."

- id: sourcing-04:40:Q1
  question: "04:40:Q1"
  prompt: >
    For our small-appliance packaging we are comparing corrugated, moulded pulp and recycled plastic. Which
    suppliers offer each material, and how many packs a year do they have available for us against our need of
    400,000 packs a year?
  ref:
    - {tool: search_packaging_suppliers_by_material, args: {material: corrugated}}
    - {tool: search_packaging_suppliers_by_material, args: {material: moulded pulp}}
    - {tool: search_packaging_suppliers_by_material, args: {material: recycled plastic}}
  facts: ["1440000", "450000", "120000", "SUP-0081", "SUP-0082"]
  notes: "The pack-material suppliers are the indirect packaging suppliers in master (SUP-0081 Calder Corrugated for corrugated and moulded pulp, SUP-0082 Northern Film & Wrap for rPET); capability is held in this system's own supplier_materials table."

- id: sourcing-06:51:Q2
  question: "06:51:Q2"
  prompt: >
    For the new insulated lunch box (target cost 3.20 FOB, 60,000 units) compare the three factories that quoted
    on RFQ-900004 on tooling cost, capability, lead time and compliance record. What are the risks of the
    lowest-cost option, what would the tooling add per unit at 40,000 units, and which factory has the best
    compliance record?
  ref:
    - {tool: get_rfq_responses_for_product, args: {rfq_id: RFQ-900004}}
    - {tool: compare_factory_quotes, args: {rfq_id: RFQ-900004, volume_units: 40000}}
  facts: ["Jackson Trading", "vacuum-insulated", "10000", "0.21", "Wilson Manufacturing"]
  notes: "The RFQ is for the new master lunch box SKU-106314 (STY-9502). The shortlist FAC-0042, FAC-0021, FAC-0023 matches documents (factory_quotes.zip), factory_audit, supplier_risk and the po draft order."

- id: sourcing-07:63:Q5
  question: "07:63:Q5"
  prompt: >
    We are costing a change of our main UK road carrier and a move to a new 3PL. The road carrier bids are on
    tender RFX-900001 and the 3PL proposals on tender RFX-900003. What do the bidders charge a year, what are their
    one-off transition costs and what would each 3PL cost over three years? Then set up a tender for the three
    shortlisted 3PLs (Northgate Contract Logistics, Severn Valley Fulfilment and Hartwell Logistics Partners) with
    responses due in about six weeks.
  ref:
    - {tool: get_carrier_bid_rates, args: {rfx_id: RFX-900001}}
    - {tool: get_3pl_proposal_costs, args: {rfx_id: RFX-900003}}
    - {tool: create_rfx_event, args: {event_type: 3pl_tender, description: "3PL provider tender for UK warehouse", response_deadline: "+42d", invited_bidders: "Northgate Contract Logistics,Severn Valley Fulfilment,Hartwell Logistics Partners"}}
  facts: ["2687596", "160000", "2255000", "2675000", "Hartwell Logistics Partners"]
  notes: "The 3PL bidders are not in master data, so they are held by name (bidder_name / invited_bidders) rather than by id. The main road carrier is CAR-001 in tms, contracts, freight_rates and here (road tender RFX-900001 is UK domestic, CAR-001..003)."
