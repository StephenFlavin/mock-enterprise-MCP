- id: container-02:12:Q4
  question: "02:12:Q4"
  prompt: >
    18% of our Asia-Europe bookings were rolled last quarter. Which Northern European ports are congested right now,
    and how long are vessels waiting for a berth there?
  ref:
    - {tool: get_port_congestion_status, args: {region: Northern Europe}}
  facts: [["Rotterdam", "NLRTM"], "132", ["Hamburg", "DEHAM"], "46"]

- id: container-02:12:Q6
  question: "02:12:Q6"
  prompt: >
    Northern European port congestion is bad, so we are considering routing Europe-bound containers via Valencia (ESVLC)
    or Piraeus (GRPIR) plus rail to the Daventry rail terminal (DIRFT) for Northampton DC, instead of via Rotterdam
    (NLRTM). How congested are those ports now, how reliable is each rail leg in practice, and how do historic Asia-UK
    transit times and on-time performance compare for each routing?
  ref:
    - {tool: get_port_congestion_status, args: {region: Europe}}
    - {tool: get_rail_leg_reliability, args: {destination_port: DIRFT}}
    - {tool: get_transit_time_history_by_route, args: {route_code: Asia-UK}}
  facts: ["132", "82.6", "64.7", "4.1", "0.9"]
  notes: "Master ports has no Valencia or Piraeus, so ESVLC and GRPIR (the codes the other freight systems use) are not in systems/_master/data/ports.csv."

- id: container-02:19:Q2-a
  question: "02:19:Q2"
  prompt: >
    Is anything in the next two weeks likely to hit our vessels or key ports: congestion, strikes, closures or weather?
    Which of our vessels are due in that window?
  ref:
    - {tool: get_port_status_and_congestion, args: {days_ahead: 14}}
    - {tool: list_vessels_and_containers_in_transit, args: {eta_to: +14d}}
  facts: [["Rotterdam", "NLRTM"], ["Hamburg", "DEHAM"], "strike", ["Yantian", "CNYTN"], "typhoon", "CONT-VESSEL-900001"]

- id: container-02:19:Q2-b
  question: "02:19:Q2"
  prompt: >
    A typhoon is forecast to hit Yantian (CNYTN) this week. How long have past weather disruptions at East Asian ports
    lasted, and how much extra lead time did they add?
  ref:
    - {tool: get_historical_disruption_durations, args: {event_type: weather, region: East Asia}}
    - {tool: get_historical_weather_disruption_lead_times, args: {region: East Asia}}
  facts: [["Yantian", "CNYTN"], "5.5", ["Shanghai", "CNSHA"], "3.5"]

- id: container-02:19:Q2-c
  question: "02:19:Q2"
  prompt: >
    Which are the highest-value containers on vessel CONT-VESSEL-900001, and what are they worth?
  ref:
    - {tool: get_container_value, args: {vessel_id: CONT-VESSEL-900001}}
  facts: ["CONT-000037", "50102", "CONT-000135", "48313"]

- id: container-02:19:Q3-a
  question: "02:19:Q3"
  prompt: >
    Vessel CONT-VESSEL-900001, carrying 140 of our containers, has been waiting outside Rotterdam for days. What is its
    current berth status, how long has it been at anchor and is there a berth ETA?
  ref:
    - {tool: get_vessel_position_and_status, args: {vessel_id: CONT-VESSEL-900001}}
  facts: ["anchored", "NLRTM", "6", "140"]

- id: container-02:19:Q3-b
  question: "02:19:Q3"
  prompt: >
    For all containers on vessel CONT-VESSEL-900001, compare the cost and the days to delivery of waiting 10 more days,
    transshipping at another port, and air-freighting the most urgent stock.
  ref:
    - {tool: calculate_option_cost_and_service_impact, args: {vessel_id: CONT-VESSEL-900001, delay_days: 10}}
  facts: ["91000", "109200", "105120"]

- id: container-02:19:Q3-c
  question: "02:19:Q3"
  prompt: >
    What did it cost us the last time we had a congestion event at Rotterdam (NLRTM)? Give the total and the split by
    cost type.
  ref:
    - {tool: get_past_disruption_costs, args: {event_type: congestion, affected_port: NLRTM}}
  facts: ["172860", "63720", "67200", "24780", "17160"]

- id: container-02:19:Q3-d
  question: "02:19:Q3"
  prompt: >
    Which SKUs are in container CONT-000037 and how many units of each?
  ref:
    - {tool: get_container_sku_contents, args: {container_id: CONT-000037}}
  facts: ["SKU-101498", "860", "SKU-102275", "516", "SKU-104613", "172"]

- id: container-02:19:Q4
  question: "02:19:Q4"
  prompt: >
    ETA accuracy on the Asia-UK lane is poor. How accurate are each carrier's ETA updates on that lane, and has port
    dwell at Rotterdam (NLRTM) been rising over recent weeks?
  ref:
    - {tool: get_carrier_eta_update_accuracy, args: {route: Asia-UK}}
    - {tool: get_port_dwell_time_history, args: {port_code: NLRTM}}
  facts: ["Pacific Star Shipping", "30", "42.5", "94.3"]

- id: container-02:19:Q5
  question: "02:19:Q5"
  prompt: >
    If the closure of Rotterdam (NLRTM) runs two weeks, which containers are inbound via it? How many are there,
    which DCs are they going to and what product categories do they carry?
  ref:
    - {tool: list_inbound_containers_via_port, args: {port_code: NLRTM}}
  facts: ["180", "DC1", "DC2", "DC3", "DC4", "Small Appliances"]

