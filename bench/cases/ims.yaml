- id: ims-01:4:Q1-a
  question: "01:4:Q1"
  prompt: >
    The count for bay DC1-C-14-02 at DC1 is way off. What stock adjustments have been posted against that location
    in the last 90 days, for which SKU and with what cause?
  ref:
    - {tool: list_inventory_adjustments_for_location, args: {site_id: DC1, location_id: DC1-C-14-02}}
  facts: ["K-1700", "cycle_count_variance", "-8"]
  notes: "Tool takes no date argument (cannot limit to 90 days). Only one adjustment exists for the location, so 'one SKU or several?' is trivially answered."

- id: ims-01:4:Q1-b
  question: "01:4:Q1"
  prompt: >
    Schedule a recount of location DC1-C-14-02 at DC1 for three days from now, reason "Recount after variance".
  ref:
    - {tool: create_cycle_count_task, args: {site_id: DC1, location_id: DC1-C-14-02, scheduled_date: +3d, reason: Recount after variance}}
  facts: ["scheduled", "DC1-C-14-02"]

- id: ims-01:6:Q1
  question: "01:6:Q1"
  prompt: >
    List the damage and expiry write-offs from the last 90 days. Which single write-off was the highest value,
    and what was it?
  ref:
    - {tool: list_damage_write_offs, args: {date_from: -90d}}
  facts: ["495.95", "SKU-103045", "Sage Small Appliance"]
  notes: "Seeded damage story (LOSS-900002/900003 'September damage and rework') is buried among 20+ generated write-offs; the seeded rows are small (25-150 GBP) so the top item is generated noise. Tool returns no cause/type column, so damage vs expiry cannot be distinguished."

- id: ims-02:19:Q1
  question: "02:19:Q1"
  prompt: >
    How many weeks of stock cover does kettle K-1700 have at store ST214, and how many units are available there?
  ref:
    - {tool: get_store_stock_cover_by_sku, args: {sku: K-1700, site_id: ST214}}
  facts: ["0.1", "10"]
  notes: "calculate_stockout_risk and get_expected_lost_sales (also in this question) take no sku arg; stockout risk for K-1700 cannot be requested. list_skus_on_shipment is hardcoded to K-1700 qty 100 regardless of shipment_id. get_stock_cover_by_sku gives K-1700 ST214 as 0.4 weeks vs 0.1 here, so the two cover tools disagree."

- id: ims-03:22:Q1
  question: "03:22:Q1"
  prompt: >
    Kettle K-1700 kept running out at store ST214 recently. On which dates over the stockout record was it out of stock,
    and how many sales were lost on each?
  ref:
    - {tool: get_stockout_periods_by_sku, args: {sku: K-1700}}
  facts: ["2026-09-23", "2026-09-21", "6", "8"]
  notes: "get_stockout_days_by_store has no sku filter, so store-level stockout days (5 of 10 days, 50%) are not K-1700-specific. Story says 9 days across 40 stores; data shows 2 days at one store."

- id: ims-03:22:Q5
  question: "03:22:Q5"
  prompt: >
    Over the last 30 days, which stock adjustment causes (picking, receiving, count variance) account for the most
    incidents and units lost?
  ref:
    - {tool: list_stockout_root_causes, args: {date_from: -30d}}
  facts: ["picking_error", "24", "cycle_count_variance", "13"]
  notes: "Story says OOS rate rose from 4% to 6.5%; get_out_of_stock_rate_trend shows 98-100% OOS on weekly sampled rows and get_out_of_stock_rate_by_dimension shows 100% for most categories (tracking table only holds OOS-heavy samples). Root-cause tool returns adjustment causes, not supplier delay or forecast miss."

- id: ims-03:28:Q5-a
  question: "03:28:Q5"
  prompt: >
    Where is our cash tied up in stock? Show inventory value by category and tell me the three biggest categories.
  ref:
    - {tool: get_inventory_value_by_dimension, args: {dimension: category}}
  facts: ["Small Appliances", "Smart Home", "Outerwear"]
  notes: "Story says Bedding at 2.1M vs normal 1.5M; Bedding is not near the top. Values are returned in scientific notation (e.g. 5.25916e+06). Output only shows 20 of 29 rows."

- id: ims-03:28:Q5-b
  question: "03:28:Q5"
  prompt: >
    Create a stock release plan for Bedding at DC1 to clear the overstock, with a planned release date two weeks from now.
  ref:
    - {tool: create_stock_release_plan, args: {site_id: DC1, category: Bedding, planned_release_date: +14d, description: Clear overstock}}
  facts: ["Bedding", "draft", "DC1"]

- id: ims-05:47:Q1-a
  question: "05:47:Q1"
  prompt: >
    A customer says portable fan PF-220 is overheating. Where is our stock of PF-220 right now, and how many units
    are on hand at each location?
  ref:
    - {tool: get_stock_by_location_for_batch, args: {sku: PF-220}}
  facts: ["DC1", "200", "ST214", "30"]
  notes: "Tool has no batch argument (stock is by SKU, not batch). Story says 500 units in DCs and 300 in stores; data shows 200 at DC1 and 30 at ST214. No in-transit or customer-held stock."

- id: ims-05:47:Q1-b
  question: "05:47:Q1"
  prompt: >
    Put a stop-sale hold on 150 units of PF-220 at DC1.
  ref:
    - {tool: update_inventory_hold_status, args: {site_id: DC1, sku: PF-220, hold_qty: 150}}
  facts: ["150"]
  notes: "Hold tool takes only SKU/site/qty (no batch or reason) and echoes 'Updated inventory_positions PF-220, DC1, None' with a literal None for the missing location."

- id: ims-07:68:Q2
  question: "07:68:Q2"
  prompt: >
    How did the recent stock counts at DC1 come out? For each count, give the category, system quantity, counted
    quantity and variance.
  ref:
    - {tool: get_stock_count_results, args: {site_id: DC1}}
  facts: ["Home", "215", "213", "Dresses", "230"]
  notes: "Story says DC1 99.2% / DC2 97.8% / DC3 96.5% accuracy, but there are only two counts at DC1 and none at DC2/DC3 with results. avg_variance_pct is 2.25 for Dresses even though total variance is 0, so the percentage contradicts the quantities. Most generated counts have empty quantities."

- id: ims-07:68:Q5
  question: "07:68:Q5"
  prompt: >
    Shrink at the Leeds store, ST216, looks off. List the stock adjustments posted there in the last 90 days with
    cause, quantity and value.
  ref:
    - {tool: list_stock_adjustments_for_store, args: {site_id: ST216, date_from: -90d}}
  facts: ["K-1700", "shrink", "SKU-104984", "-353.58"]
  notes: "Story says shrink tripled at ST216; only two adjustments exist (+4 shrink GBP 20.40 and a -9 count variance), so no tripling is visible. get_shrink_rate_by_store shows ST216 total shrink 150 GBP."

- id: ims-08:71:Q1
  question: "08:71:Q1"
  prompt: >
    My store is ST214. Look at the stock adjustments over the last 90 days: which causes and categories stand out?
  ref:
    - {tool: get_stock_adjustments_for_store, args: {site_id: ST214, date_from: -90d}}
  facts: ["picking_error", "receiving_error", "shrink", "damage"]
  notes: "Only five adjustments exist for ST214. compare_shrink_with_peer_stores filters to the one store so it returns no peers. get_shrink_by_category_for_store values jump from tens of GBP (recent weeks) to thousands (older weeks), and category 'Home' does not appear in master categories."

- id: ims-08:79:Q6
  question: "08:79:Q6"
  prompt: >
    What are our three highest-loss products over the last 90 days by value lost?
  ref:
    - {tool: get_highest_loss_products, args: {limit_products: 3, date_from: -90d}}
  facts: ["SKU-103045", "495.95", "SKU-103444", "470.55", "SKU-100749"]
  notes: "Seeded losses (LOSS-9000xx for K-1700, SKU-100014) are tiny and never reach the top; ranking is driven by generated noise. Loss types include 'unknown' and 'expiry' for apparel items."

- id: ims-08:74:Q6-a
  question: "08:74:Q6"
  prompt: >
    How many units of kettle K-1700 are currently reserved for each sales channel, and how many of those are active?
  ref:
    - {tool: get_stock_position_for_product_by_channel, args: {sku: K-1700}}
  facts: ["click_collect", "25"]
  notes: "Returns only a single channel row (click_collect 25) although get_available_stock_for_product shows reserved_for_channel 10/3/0 by site; the two totals do not reconcile (13 vs 25)."

- id: ims-08:74:Q6-b
  question: "08:74:Q6"
  prompt: >
    Reserve 50 units of K-1700 at DC1 for click-and-collect.
  ref:
    - {tool: create_stock_reservation_for_channel, args: {sku: K-1700, site_id: DC1, channel: click_collect, quantity: 50}}
  facts: ["click_collect", "50", "active"]

- id: ims-08:71:Q2
  question: "08:71:Q2"
  prompt: >
    Kettle K-1700 shows a gap on shelf at store ST214 even though the system says there is stock. How many units
    does the system show on hand and available there, and how much did we lose in sales from the gaps in the last 30 days?
  ref:
    - {tool: get_stock_on_hand_by_product_and_location, args: {sku: K-1700, site_id: ST214}}
    - {tool: calculate_lost_sales_from_availability_gaps, args: {sku: K-1700, site_id: ST214, date_from: -30d}}
  facts: ["15", "10", "14", "1091.86"]
  notes: "Story says 40 units on hand with an empty shelf; on_hand is 15 (40 is the stock cover tool's figure). get_store_deliveries_for_product returns only current on-hand, not deliveries."

- id: ims-08:73:Q3
  question: "08:73:Q3"
  prompt: >
    Raise a transfer request to move 100 units of K-1700 from DC1 to store ST214 because the store is short.
  ref:
    - {tool: create_store_transfer_request, args: {sku: K-1700, from_site_id: DC1, to_site_id: ST214, quantity: 100, reason: Store short of stock}}
  facts: ["requested", "100", "ST214"]
  notes: "get_stock_imbalance_by_store (same question) returns overstocked/out-of-stock SKU counts per site and category, not a store-level coverage percentage; most rows are DCs, not stores."
