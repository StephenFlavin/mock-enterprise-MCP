- id: ims-01:4:Q1-a
  question: "01:4:Q1"
  prompt: >
    The count for bay C-14 at Northampton DC (DC1) was way off on Tuesday. Look at the stock adjustments posted
    against that bay in the last 90 days. Is it one SKU or several, and what causes were used?
  ref:
    - {tool: list_inventory_adjustments_for_location, args: {site_id: DC1, location_id: DC1-C-14, date_from: -90d}}
  facts: ["SKU-100084", "DC1-C-14-02", ["picking_error", "picking error"], ["receiving_variance", "receiving variance"], "-24"]

- id: ims-01:4:Q1-b
  question: "01:4:Q1"
  prompt: >
    Schedule a recount of location DC1-C-14-02 at DC1 for three days from now, reason "Recount after variance".
  ref:
    - {tool: create_cycle_count_task, args: {site_id: DC1, location_id: DC1-C-14-02, scheduled_date: +3d, reason: Recount after variance}}
  facts: ["DC1-C-14-02", "scheduled"]

- id: ims-01:4:Q2
  question: "01:4:Q2"
  prompt: >
    At DC1, list the stock adjustments over 500 pounds in value from the last 100 days. Which cause code looks
    like a catch-all, which zone and shift do most of them come from, and which were reversed within 48 hours?
  ref:
    - {tool: list_inventory_adjustments, args: {site_id: DC1, min_value_gbp: 500, date_from: -100d}}
  facts: ["other", "night", "mezzanine", "cycle_count_variance"]

- id: ims-01:6:Q1
  question: "01:6:Q1"
  prompt: >
    Damage and rework write-offs at Northampton DC (DC1) over roughly the last two months. Which single write-off
    was the highest value, what was it, and what caused the September ones?
  ref:
    - {tool: list_damage_write_offs, args: {site_id: DC1, date_from: -65d}}
  facts: ["Ochre Shirt S", "1479.6", "rework", ["pallet collapse", "forklift"]]

- id: ims-02:19:Q1
  question: "02:19:Q1"
  prompt: >
    Delayed shipment SHP-0000102 is coming in. Which SKUs are on it, and for SKU-103458 which stores are lowest
    on stock cover and so could run out first?
  ref:
    - {tool: list_skus_on_shipment, args: {shipment_id: SHP-0000102}}
    - {tool: get_store_stock_cover_by_sku, args: {sku: SKU-103458}}
  facts: ["SKU-103458", "SKU-104438", "ST214", "ST150"]

- id: ims-03:22:Q1-a
  question: "03:22:Q1"
  prompt: >
    Style STY-5520 stocked out in about 40 stores for nine days last month even though the forecast looked fine.
    From the stockout record, which stores were hit, for how many days, how much did we lose in sales, and what
    cause is recorded?
  ref:
    - {tool: get_stockout_days_by_store, args: {style_id: STY-5520}}
  notes: "Story is one SKU (SKU-101904) in 40 stores, not all three sizes of the style. Tracking is weekly/episode level, so exact stockout dates are not available."
  facts: ["9", ["allocation_shortfall", "allocation shortfall", "allocation"], "ST214", "377.91"]

- id: ims-03:22:Q1-b
  question: "03:22:Q1"
  prompt: >
    Update the safety stock for SKU-101904 at store ST214 to 20 units.
  ref:
    - {tool: update_safety_stock_for_sku, args: {sku: SKU-101904, site_id: ST214, safety_stock: 20}}
  facts: ["20"]

- id: ims-03:22:Q2
  question: "03:22:Q2"
  prompt: >
    What is about to run out across all SKUs over the next four weeks? Rank them by sales at risk and tell me the
    top three with their days until stockout.
  ref:
    - {tool: list_projected_stockouts, args: {days_ahead: 28}}
  facts: ["SKU-105341", "ST214", "SKU-102338", "ST165", "SKU-101575"]

- id: ims-03:22:Q5
  question: "03:22:Q5"
  prompt: >
    Our out-of-stock rate has gone up over the last couple of months. Show the weekly trend, split it by supplier,
    and tell me the root causes and which look one-off versus persistent.
  ref:
    - {tool: get_out_of_stock_rate_trend, args: {date_from: -60d}}
    - {tool: get_out_of_stock_rate_by_dimension, args: {dimension: supplier, date_from: -30d}}
    - {tool: list_stockout_root_causes, args: {date_from: -60d}}
  facts: ["6.5", "SUP-0013", ["supplier_late", "supplier late"], ["dc_receiving_delay", "DC receiving delay", "receiving delay"], ["one-off", "one off"]]

- id: ims-03:28:Q2
  question: "03:28:Q2"
  prompt: >
    We hold a lot of cover on Bedding. How many days of cover is that across the network, and which SKUs make up
    most of the excess?
  ref:
    - {tool: get_days_of_cover_by_category, args: {category: Bedding}}
    - {tool: list_skus_by_excess_contribution, args: {category: Bedding}}
  facts: ["105", "SKU-103486", "SKU-103472", "SKU-104963"]

- id: ims-03:28:Q5-a
  question: "03:28:Q5"
  prompt: >
    Where is our cash tied up in stock? Show inventory value by category and tell me the three biggest categories.
  ref:
    - {tool: get_inventory_value_by_dimension, args: {dimension: category}}
  facts: ["Small Appliances", "Smart Home", "Knitwear"]

- id: ims-03:28:Q5-b
  question: "03:28:Q5"
  prompt: >
    Create a stock release plan for Bedding at DC1 to clear overstock, estimated 1500 units, planned release
    date two weeks from now.
  ref:
    - {tool: create_stock_release_plan, args: {site_id: DC1, category: Bedding, planned_release_date: +14d, description: Clear overstock, estimated_units: 1500}}
  facts: ["Bedding", "DC1", "1500"]

- id: ims-05:47:Q1-a
  question: "05:47:Q1"
  prompt: >
    A customer reports the battery in portable fan PF-220 overheating. Batch BATCH-PF220-2509-A is the suspect
    batch. Where is stock of that batch right now and how many units are there in total?
  ref:
    - {tool: get_stock_by_location_for_batch, args: {sku: PF-220, batch_id: BATCH-PF220-2509-A}}
  facts: ["DC2", "807", "1381", "ST214", "14"]

- id: ims-05:47:Q1-b
  question: "05:47:Q1"
  prompt: >
    Put a stop-sale hold on 150 units of PF-220 at DC2.
  ref:
    - {tool: update_inventory_hold_status, args: {sku: PF-220, site_id: DC2, hold_qty: 150}}
  facts: ["150"]

- id: ims-07:68:Q2
  question: "07:68:Q2"
  prompt: >
    Are stock counts at our three DCs reliable? Give me the count accuracy for DC1, DC2 and DC3 from the cycle
    counts of the last 100 days and tell me which DC is weakest.
  ref:
    - {tool: get_stock_count_results, args: {date_from: -100d}}
  notes: "DC1 accuracy (98.7) includes the bay C-14 count; get_stock_count_results does not state which count was triggered by a problem."
  facts: ["DC3", "96.5", "97.8", "98.7"]

- id: ims-07:68:Q5
  question: "07:68:Q5"
  prompt: >
    Shrink at our Leeds High Street store, ST165, tripled recently. List the stock adjustments posted there in the
    last 90 days with cause, quantity, value and who posted them. What stands out?
  ref:
    - {tool: list_stock_adjustments_for_store, args: {site_id: ST165, date_from: -90d}}
  facts: ["EMP-00488", "theft", "SKU-105159"]

- id: ims-08:71:Q2
  question: "08:71:Q2"
  prompt: >
    Kettle K-1700 has a gap on shelf at store ST214 even though the system says there is stock. How many units
    does the system show on hand and available there, and how many units and how much in sales did we lose from
    the availability gaps in the last 30 days?
  ref:
    - {tool: get_stock_on_hand_by_product_and_location, args: {sku: K-1700, site_id: ST214}}
    - {tool: calculate_lost_sales_from_availability_gaps, args: {sku: K-1700, site_id: ST214, date_from: -30d}}
  notes: "No shelf versus back-room split of stock is held, so the back-room cause is only visible via the stockout cause. get_available_stock_for_product also returns on hand and available, so a model may legitimately use it instead."
  facts: ["12", "8", "7", "545.93"]

- id: ims-08:74:Q6-a
  question: "08:74:Q6"
  prompt: >
    How many units of kettle K-1700 are currently reserved for each sales channel, and how many units are still
    free to allocate across the network?
  ref:
    - {tool: get_stock_position_for_product_by_channel, args: {sku: K-1700}}
  facts: ["250", "40", "60", "1858"]

- id: ims-08:74:Q6-b
  question: "08:74:Q6"
  prompt: >
    Reserve 20 units of K-1700 at DC2 for click-and-collect, expiring in three days.
  ref:
    - {tool: create_stock_reservation_for_channel, args: {sku: K-1700, site_id: DC2, channel: click_collect, quantity: 20, expiry_date: +3d}}
  facts: ["20", "K-1700"]

- id: ims-08:79:Q6
  question: "08:79:Q6"
  prompt: >
    What are our three highest-loss products over the last 90 days by value lost?
  ref:
    - {tool: get_highest_loss_products, args: {limit_products: 3, date_from: -90d}}
  facts: ["SKU-102338", "7545.96", "SKU-101834", "5269.05", "SKU-101085"]

- id: ims-08:73:Q3
  question: "08:73:Q3"
  prompt: >
    Raise a transfer request to move 30 units of K-1700 from store ST215 to store ST214 because ST214 is short.
  ref:
    - {tool: create_store_transfer_request, args: {sku: K-1700, from_site_id: ST215, to_site_id: ST214, quantity: 30, reason: Rebalance}}
  facts: ["30", "ST214", "ST215"]
