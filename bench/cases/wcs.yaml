- id: wcs-01:10:Q1-a
  question: "01:10:Q1"
  prompt: >
    Our shuttle system at DC2 had 14 unplanned stoppages in the last 40 days. Using the fault logs, what are the
    common root causes, ranked by throughput lost? Is any failure tied to a specific shuttle or software version?
  ref:
    - {tool: get_throughput_loss_for_stoppage, args: {site_id: DC2, asset_class: shuttle, date_from: -40d}}
    - {tool: get_fault_log_entries, args: {site_id: DC2, asset_class: shuttle, date_from: -40d}}
  facts: ["Seal degradation", "Mechanical wear", "Lubrication failure", "1362", "AST-DC2-SHT-03", "4.3.0"]

- id: wcs-01:10:Q2-a
  question: "01:10:Q2"
  prompt: >
    Look at the fault history of the DC1 sorter and the conveyor network (its motors, gearboxes and sensors) over the
    last 120 days. Which assets have actually failed, and which are showing repeated warnings that suggest they are
    next to fail?
  ref:
    - {tool: get_fault_log_entries, args: {site_id: DC1, date_from: -120d}}
  facts: ["AST-DC1-SRT", "AST-DC1-CNV-M08", "AST-DC1-CNV-G01", "Lubrication failure"]

- id: wcs-01:10:Q3-a
  question: "01:10:Q3"
  prompt: >
    We are thinking of updating the AMR robots at DC1 to firmware 4.7 before peak. Which robots at DC1 are already on
    4.7 and which are still on 4.6?
  ref:
    - {tool: get_amr_fleet_firmware_versions, args: {site_id: DC1}}
  facts: ["robot-002", "robot-005", "robot-007", ["5", "five"]]

- id: wcs-01:10:Q5-a
  question: "01:10:Q5"
  prompt: >
    Robot throughput at DC1 drops every afternoon, about 15% between 2 and 4pm. What do throughput by hour, traffic
    congestion and the charging schedule show? In particular, which charging window falls in that period?
  ref:
    - {tool: get_robot_throughput_by_hour, args: {site_id: DC1}}
    - {tool: get_robot_traffic_congestion, args: {site_id: DC1}}
    - {tool: get_fleet_charging_schedule, args: {site_id: DC1}}
  facts: ["14:00-16:00", "505", "508"]

- id: wcs-01:10:Q5-b
  question: "01:10:Q5"
  prompt: >
    Go ahead: move the DC1 afternoon charging window (currently 14:00-16:00, schedule CHG-900003) to 6 to 8pm for the test.
  ref:
    - {tool: update_fleet_charging_schedule, args: {schedule_id: CHG-900003, start_time: "18:00", end_time: "20:00"}}
  facts: ["18:00", "20:00"]
