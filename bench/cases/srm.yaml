    - {tool: get_supplier_improvement_programme_history, args: {supplier_id: SUP-0046}}
  facts: ["order to factory", "39.6", "61", "Fabric pre-booking", "suspended"]

- id: srm-04:38:Q6
  question: "04:38:Q6"
  prompt: >
    Supplier SUP-0070 missed a critical delivery. Before we look at the contract, how has its scorecard performed
    over the last six months, particularly on-time delivery?
  ref:
    - {tool: get_supplier_scorecard_history, args: {supplier_id: SUP-0070, months_back: 6}}
