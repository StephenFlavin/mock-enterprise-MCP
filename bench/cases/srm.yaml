- id: srm-03:24:Q1
  question: "03:24:Q1"
  prompt: >
    Supplier SUP-0070 keeps missing its confirmed ship dates and it is getting worse. Put a hold on new orders to
    them, and set up a performance review for this quarter in about two weeks with their account manager.
  ref:
    - {tool: search_suppliers, args: {supplier_id: SUP-0070}}
    - {tool: block_supplier_for_new_orders, args: {supplier_id: SUP-0070}}
    - {tool: create_supplier_performance_review, args: {supplier_id: SUP-0070, review_period: "Q4 2026", scheduled_date: "+14d", internal_owner: EMP-00059}}
  facts: ["blocked", "EMP-00059", "scheduled"]

- id: srm-04:32:Q3
  question: "04:32:Q3"
  prompt: >
    I'm choosing suppliers for next season's bedding range. Which of our suppliers make bedding, and over the last
    six months how have SUP-0039, SUP-0004 and SUP-0011 done on lead time against what was agreed, and how often
    are they late?
  ref:
    - {tool: list_suppliers_for_category, args: {category: Bedding}}
    - {tool: get_supplier_lead_time_performance, args: {supplier_id: SUP-0039}}
    - {tool: get_supplier_lead_time_performance, args: {supplier_id: SUP-0004}}
    - {tool: get_supplier_lead_time_performance, args: {supplier_id: SUP-0011}}
  facts: ["26.7", "31.1", "76.1", "33.3"]

- id: srm-04:32:Q6
  question: "04:32:Q6"
  prompt: >
    SUP-0053, SUP-0055 and SUP-0001 all have risk alerts. How has each one's on-time delivery trended over the last
    six months, and which is getting worse fastest? Log a critical delivery issue against that one, owned by its
    account manager EMP-00060, saying on-time delivery has fallen sharply and needs a recovery plan.
  ref:
    - {tool: get_supplier_on_time_delivery_trend, args: {supplier_id: SUP-0053, months_back: 6}}
    - {tool: get_supplier_on_time_delivery_trend, args: {supplier_id: SUP-0055, months_back: 6}}
    - {tool: get_supplier_on_time_delivery_trend, args: {supplier_id: SUP-0001, months_back: 6}}
    - {tool: create_supplier_issue_record, args: {supplier_id: SUP-0053, issue_type: delivery, description: "On-time delivery has fallen sharply and needs a recovery plan", severity: critical, assigned_to: EMP-00060}}
  facts: ["SUP-0053", "61", "83", "EMP-00060"]

- id: srm-04:32:Q7
  question: "04:32:Q7"
  prompt: >
    I'm preparing for the annual review with SUP-0074, our largest cookware supplier. How has it performed on its
    scorecard over the last 12 months: on-time delivery, quality and overall status, and is it trending up or down?
  ref:
    - {tool: get_supplier_scorecard_history, args: {supplier_id: SUP-0074, months_back: 12}}
  facts: ["95.1", "92.4", "strategic"]

- id: srm-04:34:Q4
  question: "04:34:Q4"
  prompt: >
    How reliable is lead time from our suppliers in Turkey over the last six months? Which Turkish supplier is
    late most often, how often, and by how many days on average?
  ref:
    - {tool: get_supplier_lead_time_performance, args: {country: TR}}
  facts: ["Brennan Textiles", "33.3", "1.3"]
  notes: "The question compares Morocco with Turkey and asks about Moroccan lead time, but master data has no Moroccan suppliers or factories (no MA country), so the case asks about the Turkish suppliers instead."

- id: srm-04:34:Q6
  question: "04:34:Q6"
  prompt: >
    How are our nearshore pilot suppliers SUP-0044, SUP-0040, SUP-0039, SUP-0058 and SUP-0079 doing against our
    Asian suppliers SUP-0001, SUP-0002 and SUP-0003 on reaction time, quality and flexibility? Is the
    speed benefit showing up in lead time, and which pilot supplier is performing best?
  ref:
    - {tool: get_supplier_scorecard_comparison, args: {supplier_ids: "SUP-0044,SUP-0040,SUP-0039,SUP-0058,SUP-0079,SUP-0001,SUP-0002,SUP-0003"}}
  facts: ["Baxter Trading", "14.6", "95", "92.8", "26.5"]

- id: srm-04:35:Q1
  question: "04:35:Q1"
  prompt: >
    Supplier SUP-0053 has slipped on delivery and quality for two quarters. Show how its scorecard has moved over
    the last six months. It looks recoverable, so open a formal delivery improvement plan to get on-time delivery
    from 61% on time to 90% on time within about six months, owned by its account manager EMP-00060, and put the
    supplier on watch status.
  ref:
    - {tool: get_supplier_scorecard_history, args: {supplier_id: SUP-0053, months_back: 6}}
    - {tool: create_supplier_improvement_plan, args: {supplier_id: SUP-0053, plan_type: delivery, focus_area: "On-time delivery", current_baseline: "61% on time", target_value: "90% on time", target_completion_date: "+180d", owner_internal: EMP-00060}}
    - {tool: update_supplier_status, args: {supplier_id: SUP-0053, status: watch, reason: "Delivery and quality slipping"}}
  facts: ["61", "60", "90% on time", "watch"]

- id: srm-04:35:Q3
  question: "04:35:Q3"
  prompt: >
    We have too many suppliers and I'm not sure the relationships are worth what they cost us to manage. Score our
    suppliers: which are the obvious exits and which should we invest in?
  ref:
    - {tool: calculate_supplier_segmentation_score, args: {recommendation: Exit}}
    - {tool: calculate_supplier_segmentation_score, args: {recommendation: Invest}}
  facts: ["Parker Homewares", "Rose Garments", "Page Manufacturing", "Grant Garments", "Baxter Trading"]

- id: srm-04:35:Q5
  question: "04:35:Q5"
  prompt: >
    I'm preparing the Q3 business review pack for supplier SUP-0012. How has its on-time delivery moved over the
    last three months, and what is in its issues log, including anything it has raised about how we treat it?
  ref:
    - {tool: get_supplier_scorecard_history, args: {supplier_id: SUP-0012, months_back: 3}}
    - {tool: get_supplier_issues_log, args: {supplier_id: SUP-0012}}
  facts: ["88.4", "83.2", "invoices", "forecast"]

- id: srm-04:35:Q6
  question: "04:35:Q6"
  prompt: >
    We want a joint programme with supplier SUP-0046 to cut its lead time by 20%. Where does the time go by process
    stage, and what improvement programmes have we already run with them and what were the results?
  ref:
