- id: srm-05:50:Q2
  question: "05:50:Q2"
  prompt: >
    If the main port in southern Vietnam closed for six weeks, we would have to move production of menswear supplier
    SUP-0016, which ships through it, to other factories. Which alternative factories outside Vietnam have at least
    10,000 units a month of spare capacity over the coming months, and what are their lead times and unit costs?
  ref:
    - {tool: get_alternative_factory_capacity, args: {supplier_id: SUP-0016, required_units: 10000}}
  facts: ["Murphy Mill", "Brown Plant", "54810", "71940"]

- id: srm-05:50:Q4
  question: "05:50:Q4"
  prompt: >
    Where are we exposed to a single supplier in Menswear? Show how concentrated our Menswear spend is, including
    what the top two suppliers account for together, name the biggest single point of failure, and tell me what it
    would cost and how long it would take to qualify a second source for it.
  ref:
    - {tool: get_supplier_concentration_by_category, args: {category_focus: Menswear}}
    - {tool: get_dual_sourcing_cost_estimate, args: {category: Menswear, existing_supplier_id: SUP-0044}}
  facts: ["Baxter Trading", "37.8", "58.5", "139540", "64"]

- id: srm-09:82:Q6
  question: "09:82:Q6"
  prompt: >
    I'm building a supplier delay-risk model and want to use scorecard data as features. For supplier SUP-0053, which
    has been slipping, pull its scorecard history for the last 12 months: how have on-time delivery and actual lead
    time against agreed lead time moved, and what scorecard measures are available as candidate features?
  ref:
