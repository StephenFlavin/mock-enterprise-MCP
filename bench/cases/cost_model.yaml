- id: cost_model-01:9:Q4
  question: "01:9:Q4"
  prompt: >
    We want to cut forklift incidents at DC1. What would pedestrian exclusion zones, proximity sensors and speed
    limiters each cost, in capex and running cost, for a site our size, and how much would each cut incidents?
  ref:
    - {tool: calculate_control_option_cost, args: {site_id: DC1}}
  facts: [480000, 310000, 96000, "58", "50"]

- id: cost_model-01:10:Q4
  question: "01:10:Q4"
  prompt: >
    The DC1 sorter AST-DC1-SRT is nearly 12 years old and keeps costing more to maintain. Compare carrying on repairing
    it, a major overhaul and replacing it over the next seven years, including downtime risk, what replacement
    would cost and how long it takes, and how the answer changes if volumes grow 20%.
  ref:
    - {tool: calculate_lifecycle_cost_options, args: {asset_id: AST-DC1-SRT, evaluation_years: 7}}
    - {tool: calculate_lifecycle_cost_options, args: {asset_id: AST-DC1-SRT, evaluation_years: 7, volume_growth_pct: 20}}
  facts: [1483000, 2742290, "52", 1663600]
  notes: "Master assets lists AST-DC1-SRT as installed in 2018 (about 8 years); the 12-year age comes from the persona and fixed_assets."

- id: cost_model-04:32:Q1
  question: "04:32:Q1"
  prompt: >
    Supplier SUP-0004 quoted £4.80 per unit and supplier SUP-0032 quoted £4.10 for the same 750ml double-wall
    stainless steel bottle, SKU-106307, at 50,000 units. Build a should-cost at 50,000 units, show which lines of each quote are out of line
    with it, and give me the questions to put to SUP-0004 before the negotiation.
  ref:
    - {tool: calculate_should_cost, args: {sku: SKU-106307, volume_units: 50000}}
    - {tool: compare_quotes_by_cost_component, args: {sku: SKU-106307}}
    - {tool: draft_negotiation_questions_for_buyer, args: {sku: SKU-106307, supplier_id: SUP-0004}}
  facts: ["4.18", "0.69", "0.45", "tooling"]
  notes: "SKU-106307 is the new master 750ml insulated bottle (STY-9501, Supplier A SUP-0004); its master unit_cost_gbp of 4.80 equals the Supplier A quote."

- id: cost_model-04:34:Q5
  question: "04:34:Q5"
  prompt: >
    Why are the nearshore quotes for coat SKU-102863 so high, about 35% above what I expected? Which cost
    components drive the premium?
  ref:
    - {tool: compare_quotes_by_cost_component, args: {sku: SKU-102863}}
  facts: ["labour", "21.6", "13.21", "63"]

- id: cost_model-06:58:Q1
  question: "06:58:Q1"
  prompt: >
    Supplier SUP-0002 quoted £28.52 a unit for the padded jacket, style STY-9504 (SKU-106328): fabric 12.30, trims
    2.90, labour 6.40, overhead 3.20 and margin 3.72. Benchmark each line, flag the lines that look inflated, build a
    should-cost at 50,000 units and list the questions the buyer should ask before the next round.
  ref:
    - {tool: calculate_should_cost_for_style, args: {style_id: STY-9504, volume_units: 50000}}
    - {tool: compare_quote_lines_to_benchmarks, args: {sku: SKU-106328, supplier_id: SUP-0002}}
    - {tool: draft_negotiation_questions_for_buyer, args: {sku: SKU-106328, supplier_id: SUP-0002}}
    - {tool: get_labour_rates_by_country, args: {country: VN}}
  facts: ["23.41", "48.2", "31.8", "23.1"]
  notes: "The padded jacket is master style STY-9504 (SKU-106328 Black Padded Jacket, supplier SUP-0002, factory FAC-0003, Vietnam); the quote reference PJ-2401 is the supplier's own."

- id: cost_model-06:58:Q3
  question: "06:58:Q3"
  prompt: >
    How do we take 8% out of the cost of kettle K-1700? Give me the saving from each option on its own and which
    changes customers would be most likely to notice.
  ref:
    - {tool: list_cost_reduction_options, args: {sku: K-1700}}
    - {tool: calculate_saving_per_cost_option, args: {sku: K-1700}}
    - {tool: calculate_combined_saving_for_options, args: {sku: K-1700}}
  facts: ["LED", "lid", "0.62", "1.97"]

- id: cost_model-06:58:Q5
  question: "06:58:Q5"
  prompt: >
    What are the current labour rates in Vietnam, Bangladesh and Turkey, how have they moved over the last 12 months,
    and what's expected for next season?
  ref:
    - {tool: get_labour_rates_by_country, args: {country: "VN,BD,TR"}}
  facts: ["2.5", "1.8", "4.77", "5.9"]

- id: cost_model-09:87:Q2
  question: "09:87:Q2"
  prompt: >
    Compare our five supply chain investment cases (nearshoring, automation, network changes, dual sourcing and
    digital planning): which has the highest NPV, which pays back fastest, and what is the risk rating of each?
  ref:
    - {tool: calculate_investment_return, args: {}}
  facts: ["Nearshoring", 34213208, "Dual sourcing", "2.9"]

- id: cost_model-09:88:Q6
  question: "09:88:Q6"
  prompt: >
    Should we in-source or outsource transport? Compare the cost over five years, the flexibility and control, what
    the transition involves, and which parts we could outsource first.
  ref:
    - {tool: run_make_vs_buy_cost_model, args: {activity: transport}}
  facts: [19700000, 17000000, 2700000, "store replenishment", "26"]
