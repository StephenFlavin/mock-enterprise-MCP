- id: ecommerce-02:14:Q8-a
  question: "02:14:Q8"
  prompt: >
    Look at our cross-border direct-to-consumer orders (everything shipped outside the UK) over the last 90 days.
    What is the average basket in each country, and which country is the biggest by order value?
  ref:
    - {tool: get_cross_border_order_baskets, args: {date_from: -90d}}
  facts: ["62", ["Germany", "DE"]]

- id: ecommerce-02:21:Q5-a
  question: "02:21:Q5"
  prompt: >
    Which of our markets have the highest return rates right now, and how do their conversion rates compare
    with the UK?
  ref:
    - {tool: get_return_rates_by_market, args: {}}
  facts: ["19.2", "18.5", "1.75", "2.45"]

- id: ecommerce-02:21:Q5-b
  question: "02:21:Q5"
  prompt: >
    How has weekly conversion in Germany moved over the last month? Give the highest and lowest week.
  ref:
    - {tool: get_conversion_and_basket_history_by_market, args: {region: DE, date_from: -30d}}
  facts: ["1.88", "1.83"]

- id: ecommerce-05:49:Q4-a
  question: "05:49:Q4"
  prompt: >
    Look at our resale listings grouped by how deep the discount is versus the new price. How much discount do
    most listings carry, and what share of listings at each depth has actually sold?
  ref:
    - {tool: get_resale_listing_price_vs_new_price, args: {summary: true}}
  facts: ["17.1", "40", "10", "75"]

- id: ecommerce-07:63:Q6-a
  question: "07:63:Q6"
  prompt: >
    Compare our weekly e-commerce order volumes over the last 12 weeks. Has total order volume changed
    recently, and how has the share of cross-border orders versus UK orders moved?
  ref:
    - {tool: get_ecom_order_volumes_and_mix, args: {date_from: -90d}}
  facts: ["23170", "23730", "39.6", "44"]

- id: ecommerce-07:67:Q3-a
  question: "07:67:Q3"
  prompt: >
    Over the last 90 days, how many parcels a day do we send to the UK and to each EU country, what is the
    average parcel value, and what share of parcels falls under the customs low-value thresholds?
  ref:
    - {tool: get_parcel_volumes_by_destination, args: {date_from: -90d}}
  facts: ["5200", "850", "700", "62", "97"]

- id: ecommerce-08:74:Q1-a
  question: "08:74:Q1"
  prompt: >
    Conversion dropped last week. Which delivery promise changes were made to postcode areas recently, what
    changed in the promise and cut-off, and why?
  ref:
    - {tool: get_delivery_promise_changes, args: {date_from: -30d}}
  facts: ["SW1", "SE1", "2-3 days", "12:00", "collection"]

- id: ecommerce-08:74:Q1-b
  question: "08:74:Q1"
  prompt: >
    Conversion dropped last week. Which of our top-selling products had a price change in the last two weeks,
    and by how much?
  ref:
    - {tool: get_price_changes_for_top_products, args: {date_from: -14d}}
  facts: ["SKU-104032", "SKU-105075", "SKU-102261", "SKU-100630", "6"]

- id: ecommerce-08:74:Q1-c
  question: "08:74:Q1"
  prompt: >
    The delivery promise change in postcode area SW1 hurt us. Roll it back: set the promise to next-day again
    and put the order cut-off back to 16:00.
  ref:
    - {tool: update_delivery_promise_rule, args: {postcode_area: SW1, delivery_promise: next-day, cutoff_time: "16:00"}}
  facts: ["next-day", "16:00"]

- id: ecommerce-08:74:Q2-a
  question: "08:74:Q2"
  prompt: >
    What does our UK peak marketing plan look like from Black Friday to Christmas Eve? List the campaigns with
    their dates, budgets and expected traffic uplift.
  ref:
    - {tool: get_marketing_plan_for_peak, args: {region: UK, date_from: "2026-11-27", date_to: "2026-12-24"}}
  facts: ["UK Black Friday Week", "350000", "38", "UK Christmas Gifting", "220000", "UK Last Order Dates and Gift Cards"]

- id: ecommerce-08:74:Q2-b
  question: "08:74:Q2"
  prompt: >
    We have agreed the peak delivery cut-off for postcode area SW1: set it on the site to two weeks from today
    at 14:00.
  ref:
    - {tool: update_delivery_cutoff_dates_on_site, args: {postcode_area: SW1, cutoff_date: "+14d", cutoff_time: "14:00"}}
  facts: ["14:00", "SW1"]

- id: ecommerce-08:74:Q3-a
  question: "08:74:Q3"
  prompt: >
    Looking at online orders over the last 60 days, which are our ten busiest UK postcode areas, and which of
    those do not have next-day delivery switched on yet?
  ref:
    - {tool: get_orders_by_postcode_area, args: {date_from: -60d}}
  facts: ["M1", "B1", "LS1", "G1", "L1"]

- id: ecommerce-08:74:Q3-b
  question: "08:74:Q3"
  prompt: Switch on next-day delivery for postcode area LS1.
  ref:
    - {tool: update_next_day_postcode_eligibility, args: {postcode_area: LS1, next_day_enabled: true}}
  facts: ["LS1", ["true", "enabled"]]

- id: ecommerce-08:74:Q4-a
  question: "08:74:Q4"
  prompt: >
    Which are our top 20 products by sales over the last 90 days? Give me the SKU, name and category of the
    top five.
  ref:
    - {tool: get_top_products_by_sales, args: {top_n: 20, days: 90}}
  facts: ["SKU-104032", "SKU-104025", "SKU-105075", "SKU-102261", "SKU-100630"]

- id: ecommerce-08:77:Q1-a
  question: "08:77:Q1"
  prompt: >
    Take our 200 best-selling products over the last 90 days. Which three sell the most by revenue, and which
    department are they in?
  ref:
    - {tool: get_top_products_by_sales, args: {top_n: 200, days: 90}}
  facts: ["SKU-104032", "SKU-104025", "SKU-105075", ["Electricals"]]
