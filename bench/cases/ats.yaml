- id: ats-09:88:Q4
  question: "09:88:Q4"
  prompt: >
    We're planning headcount for next peak. How long does it take to hire Warehouse Operatives for each
    recruitment channel, including onboarding time before they are productive? Then raise a requisition at DC2
    for 12 Warehouse Operatives at a salary of £24,000.
  ref:
    - {tool: get_recruitment_lead_times, args: {role: Warehouse Operative}}
    - {tool: create_job_requisition, args: {site_id: DC2, role: Warehouse Operative, headcount_required: 12, salary_gbp: 24000}}
  facts: ["45", "40", "24", "12"]
  # scenario facts reviewed: "when must we commit" asks for the hiring lead times
  scenario_facts: ["45", "40", "24", "12"]

- id: ats-09:89:Q1
  question: "09:89:Q1"
  prompt: >
    For peak hiring of Warehouse Operatives, what is the cost per hire and the time to hire for agency versus
    direct recruitment? Then open a requisition for 10 Warehouse Operatives for the Corby shortfall (DC6) at a salary of £24,000.
  ref:
    - {tool: get_recruitment_cost_per_hire, args: {role: Warehouse Operative}}
    - {tool: get_recruitment_lead_times, args: {role: Warehouse Operative}}
    - {tool: create_job_requisition, args: {site_id: DC6, role: Warehouse Operative, headcount_required: 10, salary_gbp: 24000}}
  facts: ["1950", "1150.5", "26", "10"]

- id: ats-09:89:Q4
  question: "09:89:Q4"
  prompt: >
    Request agency labour for DC2: 20 Warehouse Operatives on the night shift, starting in two weeks and
    running for four weeks.
  ref:
    - {tool: submit_agency_labour_request, args: {site_id: DC2, shift: night, start_date: +14d, end_date: +42d, positions_requested: 20, role: Warehouse Operative}}
  facts: ["DC2", "night", "20"]

- id: ats-09:89:Q5
  question: "09:89:Q5"
  prompt: >
    Show me time to hire by site for the last six months. Which site is the outlier, and which stage of the
    hiring funnel is holding it up?
  ref:
    - {tool: get_time_to_hire_by_site, args: {}}
    - {tool: list_recruitment_funnel_bottlenecks, args: {}}
  facts: ["DC2", "37.8", "interview", "18.4"]
