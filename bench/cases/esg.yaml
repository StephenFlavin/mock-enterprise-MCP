- id: esg-05:45:Q1
  question: "05:45:Q1"
  prompt: >
    For the board pack I need to see where our Scope 3 emissions sit over the last year. Break them down by
    value-chain category, tell me which product categories and which suppliers are the biggest, and say which
    numbers are measured and which are estimates.
  ref:
    - {tool: get_emissions_by_scope_and_category, args: {scope: 3}}
    - {tool: get_emissions_by_product_category, args: {}}
    - {tool: get_emissions_by_supplier, args: {top_n: 5}}
  facts: [["materials", "raw materials"], 33800, "Footwear", ["Hunt Apparel", "SUP-0057"]]

- id: esg-05:45:Q2
  question: "05:45:Q2"
  prompt: >
    How much of our Scope 3 comes from our top 20 suppliers over the last year, and how much of that is
    estimated rather than measured? If getting those 20 onto renewable electricity would save 6,000 tonnes
    CO2e for £2,100,000, what is the cost per tonne?
  ref:
    - {tool: get_emissions_by_supplier, args: {top_n: 20}}
    - {tool: calculate_abatement_cost_per_tonne, args: {expected_savings_tonnes: 6000, cost_gbp: 2100000}}
  facts: [["53.2", "53%"], 350]

- id: esg-05:45:Q3
  question: "05:45:Q3"
  prompt: >
    On our current trajectory, will we meet the 2030 Scope 3 target? What is the gap, and how much of it do
    our planned and in-progress reduction initiatives close?
  ref:
    - {tool: get_emissions_reduction_targets, args: {scope: 3}}
    - {tool: calculate_emissions_trajectory_gap, args: {target_id: TRG-000003}}
    - {tool: get_planned_reduction_initiatives, args: {scope: 3}}
  facts: [70000, 6892, 5080, 1812]

- id: esg-05:45:Q4
  question: "05:45:Q4"
  prompt: >
    What emissions reduction targets do we have on record, which pathway and validation status does the
    Scope 3 one have, and what share of our Scope 3 emissions is backed by measured primary data?
  ref:
    - {tool: get_emissions_reduction_targets, args: {}}
    - {tool: get_emissions_data_coverage, args: {scope: 3}}
  facts: [["well-below 2C", "well below 2C"], "submitted", "17.9"]

- id: esg-05:45:Q5
  question: "05:45:Q5"
  prompt: >
    What is the footprint per kg of recycled versus virgin polyester, and organic versus conventional
    cotton, for production in Asia (India for cotton)? How reliable is the recycled polyester figure?
  ref:
    - {tool: search_emission_factors_by_material, args: {material: polyester, region: Asia}}
    - {tool: search_emission_factors_by_material, args: {material: cotton, region: Asia}}
    - {tool: get_emission_factor_data_quality, args: {factor_id: EF-2026-0003}}
  facts: ["2.6", "6.4", "3.1", "5.9", ["supplier_data", "supplier data"]]

- id: esg-05:45:Q6-a
  question: "05:45:Q6"
  prompt: >
    Our transport emissions intensity rose after we moved some volume to sea. Is that a data issue or real?
    Look at the Asia-Europe lanes: which lanes drove the change and what happened to their emission factors?
  ref:
    - {tool: get_transport_emissions_intensity_trend, args: {corridor: Asia-Europe}}
    - {tool: get_emission_factors_applied_to_transport, args: {corridor: Asia-Europe}}
  facts: ["0.0215", "TEU-km", "CNSHA-GBFXT-SEA", ["bulk import", "bulk factor import"]]

- id: esg-05:45:Q6-b
  question: "05:45:Q6"
  prompt: >
    Correct the current emission factor on the CNSHA-GBFXT-SEA lane to 0.0086 kg CO2e per tonne-km.
  ref:
    - {tool: get_emission_factors_applied_to_transport, args: {lane_id: CNSHA-GBFXT-SEA, status: active}}
    - {tool: update_transport_emission_factor_for_lane, args: {lane_id: CNSHA-GBFXT-SEA, period_start: "2026-07-01", factor_kg_per_tonne_km: 0.0086}}
  facts: ["0.0086"]

- id: esg-05:45:Q7
  question: "05:45:Q7"
  prompt: >
    Which 10 suppliers should we prioritise for emissions engagement, based on their emissions, spend and
    readiness? Which of them already have SBTi targets set?
  ref:
    - {tool: calculate_supplier_engagement_priority_score, args: {limit_to: 10}}
    - {tool: get_supplier_science_based_target_status, args: {status: targets_set}}
  facts: [["Hunt Apparel", "SUP-0057"], "SUP-0049", "SUP-0038", "92.3"]

- id: esg-05:48:Q1
  question: "05:48:Q1"
  prompt: >
    What's our biggest ESG data gap, how hard is it to close, and which reporting rules apply to us?
    Create a task to close the biggest one.
  ref:
    - {tool: calculate_esg_data_gap_materiality, args: {}}
    - {tool: list_in_scope_reporting_regulations, args: {}}
    - {tool: create_esg_data_gap_task, args: {gap_id: GAP-000001, description: "Close the Scope 3 supplier emissions data gap", priority: critical}}
  facts: [["Scope3_supplier_emissions", "Scope 3 supplier emissions"], 18, "hard", ["CSRD", "Corporate Sustainability Reporting"]]

- id: esg-05:48:Q2
  question: "05:48:Q2"
  prompt: >
    Reported Scope 2 fell about 15% this year. Is that real, or a method or boundary change? Show me the
    reconciliation to last year.
  ref:
    - {tool: get_scope2_method_and_boundary_changes, args: {}}
    - {tool: calculate_scope2_reconciliation, args: {}}
  facts: ["DC6", ["market based", "market_based"], "911.5", "15.1"]

- id: esg-05:48:Q3
  question: "05:48:Q3"
  prompt: >
    For our supply chain (Scope 3) emissions disclosure over the last year, how much of each category is
    backed by measured data versus estimates?
  ref:
    - {tool: get_emissions_data_coverage, args: {scope: 3, group_by: category}}
  facts: ["materials", "34.9", "29.9"]

- id: esg-05:48:Q4
  question: "05:48:Q4"
  prompt: >
    Which suppliers haven't sent their ESG data yet, which submissions are low quality (score of 50 or
    below), and when are the open data requests due?
  ref:
    - {tool: get_submission_data_quality_scores, args: {max_quality_score: 50}}
    - {tool: get_data_request_deadline, args: {status: sent}}
  facts: [["Lyons Trading", "SUP-0074"], "SUP-0049", "2026-10-19"]

- id: esg-05:48:Q5
  question: "05:48:Q5"
  prompt: >
    Which reporting rules apply to us over the next couple of years, which of them can our current ESG
    platform handle, and what would the add-on cost?
  ref:
    - {tool: list_in_scope_reporting_regulations, args: {}}
    - {tool: get_esg_platform_capabilities, args: {}}
  facts: ["CSRD", [85000, "£85,000"], ["not licensed", "not_licensed"], ["UK SRS", "planned"]]
