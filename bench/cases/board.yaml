- id: board-07:70:Q1-a
  question: "07:70:Q1"
  prompt: >
    We are deciding where the next £50m of capital goes. Which of our strategic plan assumptions are low
    confidence, and which is the most sensitive to change? I want to know what to challenge.
  ref:
    - {tool: get_strategic_plan_assumptions, args: {confidence_level: low}}
  facts: ["Recession probability", "New market contribution", "Freight rate inflation", ["3", "3.0"]]

- id: board-07:70:Q1-b
  question: "07:70:Q1"
  prompt: >
    Add a board paper titled "Capital Allocation Strategy £50m" to the agenda for the board meeting in about three
    weeks. Summary: "Six strategic options with risk-adjusted returns and sensitivity to a 10% revenue miss." It is
    a capital allocation paper.
  ref:
    - {tool: create_board_agenda_item, args: {board_meeting_date: +21d, paper_title: "Capital Allocation Strategy £50m", paper_summary: "Six strategic options with risk-adjusted returns and sensitivity to a 10% revenue miss.", paper_type: capital_allocation}}
  facts: ["Capital Allocation Strategy", "capital_allocation"]

- id: board-09:87:Q2-a
  question: "09:87:Q2"
  prompt: >
    For our supply chain investments over the next three years, list the strategic initiatives under
    consideration with investment, expected return, risk and dependencies. How much would nearshoring cost, how
    risky is it, and which initiatives does it depend on?
  ref:
    - {tool: list_strategic_initiatives, args: {}}
  facts: ["Nearshoring Eastern Europe", "28000000", "high", "Dual Sourcing", "Digital Analytics Platform"]

- id: board-09:87:Q4-a
  question: "09:87:Q4"
  prompt: >
    What are our own company strategic priorities and board-level financial targets, so I can compare them with
    what the best retailers do in supply chain?
  ref:
    - {tool: get_company_strategic_priorities, args: {}}
  facts: ["Supply Chain Resilience", "80000000", "Automation", "Digital Transformation"]
