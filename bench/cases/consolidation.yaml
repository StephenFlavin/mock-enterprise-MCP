- id: consolidation-07:61:Q1-a
  question: "07:61:Q1"
  prompt: >
    Operating profit for September is £1.8m below budget and the unexplained items sit in the US entity. Create a high
    priority close task for the US entity accountant, EMP-00089, to explain the unexplained items in the US September
    P&L, due in three days.
  ref:
    - {tool: create_close_task, args: {task_name: "Explain unexplained items in US September P&L", owner_id: EMP-00089, due_date: "+3d", entity_id: LE-US, priority: high}}
  facts: ["EMP-00089", "LE-US", "high"]

- id: consolidation-07:61:Q2-a
  question: "07:61:Q2"
  prompt: >
    Intercompany between the UK entity LE-UK and the Polish entity LE-PL is out by about £340k. Which unmatched
    items make up the difference, and for each one what is the amount, the currency and the reason (FX, timing or
    a missing invoice)?
  ref:
    - {tool: search_unmatched_intercompany_items, args: {entity_from_id: LE-UK, entity_to_id: LE-PL}}
  facts: ["128000", "84000", "30002.3", "PLN"]

- id: consolidation-07:61:Q4-a
  question: "07:61:Q4"
  prompt: >
    What is still open on the month-end close checklist for accruals and reconciliations, and which tasks have been
    open for more than two months? Give the task, entity and owner for those.
  ref:
    - {tool: list_open_close_tasks, args: {min_age_days: 60}}
  facts: ["Daventry", "goods received not invoiced", "EMP-00086", "EMP-00089"]

- id: consolidation-07:61:Q4-b
  question: "07:61:Q4"
  prompt: >
    Chase the owner of close task CT-900102, EMP-00086, with a reminder that the goods received not invoiced
    reconciliation is still open from the June close.
  ref:
    - {tool: send_close_task_reminder, args: {task_id: CT-900102, recipient_id: EMP-00086, notes: "GRNI reconciliation still open from the June close"}}
  facts: ["CT-900102", "EMP-00086"]

- id: consolidation-07:62:Q4-a
  question: "07:62:Q4"
  prompt: >
    How do we compare with listed peers? Give our own group gross margin, operating margin, revenue growth and
    inventory turn for the latest month, and say whether margin and turns are ahead of or behind last year.
  ref:
    - {tool: get_company_financial_kpis, args: {view: group}}
  facts: ["33.8", "34.7", "6.5", "2.8", "5.1"]

- id: consolidation-07:62:Q8-a
  question: "07:62:Q8"
  prompt: >
    Summarise last month for the leadership team: group revenue and operating profit against budget, and which
    entities drove the shortfall and why.
  ref:
    - {tool: get_monthly_performance_summary, args: {}}
  facts: ["100500000", "6531000", "1800000", "LE-UK"]

- id: consolidation-07:70:Q3-a
  question: "07:70:Q3"
  prompt: >
    Prepare me for the results call. What do our group inventory and supply chain cost KPIs show over the last two
    quarters (supply chain cost and freight as a percentage of revenue), and what is our current guidance for Q4
    revenue and EBITDA?
  ref:
    - {tool: get_inventory_and_supply_chain_cost_kpis, args: {view: group}}
    - {tool: get_guidance_and_outlook, args: {}}
  facts: ["10.78", "11.58", "5.87", "48000000", "6240000"]

- id: consolidation-07:70:Q5-a
  question: "07:70:Q5"
  prompt: >
    What could break guidance? What is the current guidance range for the coming peak quarter, what assumptions does
    it rely on, and what would trigger a guidance update?
  ref:
    - {tool: get_guidance_and_outlook, args: {}}
  facts: ["5280000", "6240000", ["GBP/USD", "1.20"], ["two consecutive months", "two months in a row"]]
  notes: "Guidance (Q4 revenue £48-52m, EBITDA £5.28-6.24m) is on a much smaller scale than budgeting's full-year revenue (£1.2bn) and September operating profit (£6.5m a month). The guidance rows are cross-referenced by the risk system's guidance_risks, so they were left unchanged."
