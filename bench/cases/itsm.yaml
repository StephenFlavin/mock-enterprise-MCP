- id: itsm-01:8:Q1
  question: "01:8:Q1"
  prompt: >
    140 orders have been stuck in allocation failed since 6am and the WMS_to_OMS interface queue is backing up. Open a
    critical incident for the Interface Team: WMS to OMS order allocation failures, 140 orders stuck.
  ref:
    - {tool: create_incident_ticket, args: {title: WMS to OMS allocation failures, description: "140 orders stuck in allocation failed since 6am; WMS_to_OMS queue backing up", severity: critical, system_affected: WMS_to_OMS, assigned_team: Interface Team}}
  facts: ["critical", "Interface Team", "WMS_to_OMS"]

- id: itsm-01:8:Q2
  question: "01:8:Q2"
  prompt: >
    ERP and WMS stock don't agree. Raise a high severity ticket for the Interface Team to fix the ERP_to_WMS interface stock mapping.
  ref:
    - {tool: create_incident_ticket, args: {title: ERP to WMS stock mismatch, description: "ERP and WMS stock disagree; fix the ERP_to_WMS stock mapping", severity: high, system_affected: ERP_to_WMS, assigned_team: Interface Team}}
  facts: ["high", "Interface Team", "ERP_to_WMS"]

- id: itsm-01:8:Q3
  question: "01:8:Q3"
  prompt: >
    We're on WMS 9.2.4 and getting duplicate task creation after replenishment; patch 9.2.7 fixes it. Raise the change
    request for that patch on WMS, planned in about two weeks, and submit it for the next CAB.
  ref:
    - {tool: create_change_request, args: {title: WMS 9.2.7 patch, description: Apply WMS patch 9.2.7 to fix duplicate replenishment tasks, change_type: patch, system_affected: WMS, planned_date: +14d}}
    - {tool: submit_change_request, args: {change_id: CHG-900111}}
  facts: ["CHG-900111", "patch", "submitted"]

- id: itsm-01:10:Q3
  question: "01:10:Q3"
  prompt: >
    Create a change request to update the AMR Fleet to firmware 4.7 before peak, targeting about four weeks from now.
  ref:
    - {tool: create_change_request, args: {title: AMR firmware 4.7 update, description: Update the AMR fleet to firmware 4.7 before peak, change_type: firmware, system_affected: AMR Fleet, planned_date: +28d}}
  facts: ["CHG-900111", "firmware", "draft"]

- id: itsm-01:10:Q5
  question: "01:10:Q5"
  prompt: >
    Robot throughput at DC1 drops about 15% between 2 and 4pm every afternoon. Is the warehouse WiFi at DC1 busier or
    slower in that window than at other times of day? Give the device count, latency and channel use.
  ref:
    - {tool: get_wifi_network_load, args: {site_id: DC1, area: warehouse, days: 28}}
  facts: [46, 84, 19]

- id: itsm-08:74:Q1
  question: "08:74:Q1"
  prompt: >
    Website conversion fell about 0.4 points last week. Which website errors were hitting customers last week, which is
    the biggest, and which can we fix this week? Log an incident for the biggest one.
  ref:
    - {tool: list_site_errors_for_period, args: {date_from: -14d}}
    - {tool: create_incident_ticket_for_site_error, args: {title: 3-D Secure checkout failures on iOS Safari, description: Mobile checkout shows a blank page after bank authentication, source_error_id: ERR-900001}}
  facts: ["3-D Secure", 6420, "hosted redirect"]

- id: itsm-08:79:Q5
  question: "08:79:Q5"
  prompt: >
    Self-checkout shrink is up in ST150, ST159, ST165, ST181 and ST183. Which of these stores have self-checkout fault
    tickets in the last month, and for what? Then log a high severity scanning error fault ticket for unit SCO-150-05
    at ST150, which keeps failing.
  ref:
    - {tool: list_self_checkout_fault_tickets, args: {}}
    - {tool: create_fault_ticket_for_self_checkout, args: {site_id: ST150, device_id: SCO-150-05, fault_type: scanning error, description: Repeat scanner fault on unit 5, severity: high}}
  facts: ["ST150", "ST159", "ST181", "scanning error"]

- id: itsm-09:82:Q2
  question: "09:82:Q2"
  prompt: >
    The demand model has been getting worse for about three months. Was there a release or data change to the demand
    model around then?
  ref:
    - {tool: list_releases_and_change_requests, args: {system_affected: Demand Model, date_from: -120d}}
  facts: ["outlier capping", "2026-07-13", "category field"]

- id: itsm-09:82:Q5
  question: "09:82:Q5"
  prompt: >
    Which of our production models have no active drift alert configured, and which model's alerts are the noisiest?
  ref:
    - {tool: get_model_alert_rules, args: {}}
  facts: ["MOD-churn", "MOD-pricing", 23]

- id: itsm-09:83:Q2
  question: "09:83:Q2"
  prompt: >
    The supplier's new ASN spec adds a mandatory PAC pallet segment. Raise two change requests in this order: first a
    configuration change on Integration to add the PAC segment to the ASN EDI map, planned in about three weeks; then a
    migration on WMS to add the six mandatory pallet fields to the WMS inbound ASN schema, planned in about five weeks.
  ref:
    - {tool: create_change_request, args: {title: Add PAC pallet segment to the ASN EDI map, description: Map the mandatory PAC fields in the ASN EDI map, change_type: configuration, system_affected: Integration, planned_date: +21d}}
    - {tool: create_change_request, args: {title: Add pallet fields to the WMS inbound ASN schema, description: Add the six mandatory PAC fields to the WMS inbound ASN schema, change_type: migration, system_affected: WMS, planned_date: +35d}}
  facts: ["CHG-900111", "CHG-900112", "configuration", "migration"]

- id: itsm-09:83:Q4
  question: "09:83:Q4"
  prompt: >
    Will our integrations cope with peak, assuming about 57% more message volume than now? Which interface is closest to
    its limit, what load did it hit at last year's peak, and what did its last load test show? Then schedule a stress
    test on it at 700 messages a second.
  ref:
    - {tool: get_interface_throughput_and_capacity, args: {peak_uplift_pct: 57}}
    - {tool: get_peak_interface_load_history, args: {interface_name: WMS_to_OMS}}
    - {tool: list_load_test_history, args: {interface_name: WMS_to_OMS}}
    - {tool: create_load_test_run, args: {interface_name: WMS_to_OMS, test_type: stress, target_message_rate: 700}}
  facts: ["WMS_to_OMS", 610, 560]

- id: itsm-09:83:Q5
  question: "09:83:Q5"
  prompt: >
    Website stock updates are running about 20 minutes behind. Which step in the stock_feed pipeline adds the delay, and
    how long does it take?
  ref:
    - {tool: get_pipeline_step_timings, args: {pipeline_name: stock_feed}}
  facts: ["batch_window_wait", 900, 75]

- id: itsm-09:85:Q1
  question: "09:85:Q1"
  prompt: >
    My security alerts point at assets AST-DC1-SRT, AST-DC1-CNV-M01 and AST-DC2-SHT-01. Which business service does each
    one support, how critical is each to the business, and how quickly must each be recovered?
  ref:
    - {tool: get_asset_business_criticality, args: {asset_id: AST-DC1-SRT}}
    - {tool: get_asset_business_criticality, args: {asset_id: AST-DC1-CNV-M01}}
    - {tool: get_asset_business_criticality, args: {asset_id: AST-DC2-SHT-01}}
  facts: ["WMS", "critical", 15, 240]

- id: itsm-09:85:Q3
  question: "09:85:Q3"
  prompt: >
    The three highest risk third-party connections are CON-900003 (admin access, critical), CON-900001 (full EDI API
    access, high) and CON-900002 (tracking API with no audit logging, medium). Raise a remediation task for each, at the
    risk level I gave, to tighten its access controls, due in about a month.
  ref:
    - {tool: create_security_remediation_task, args: {title: Restrict admin access on Global Tech Partners connection, description: Replace admin access with least-privilege roles and enforce approval for changes, finding_id: CON-900003, risk_level: critical, due_date: +30d}}
    - {tool: create_security_remediation_task, args: {title: Tighten EDI API access on ACME Supplies connection, description: Reduce full EDI API access to the scopes needed and review quarterly, finding_id: CON-900001, risk_level: high, due_date: +30d}}
    - {tool: create_security_remediation_task, args: {title: Enable audit logging on XYZ Logistics tracking API, description: Turn on audit events for the tracking API connection, finding_id: CON-900002, risk_level: medium, due_date: +30d}}
  facts: ["CON-900003", "CON-900001", "CON-900002", "critical"]

- id: itsm-09:85:Q4
  question: "09:85:Q4"
  prompt: >
    Blue Yonder (our WMS vendor) and Orbis EDI (our EDI gateway vendor) have vulnerabilities being exploited. Which
    versions of their software do we run and where, how many known security issues does each have, and which version
    is the oldest?
  ref:
    - {tool: get_vendor_software_inventory, args: {vendor_name: Blue Yonder}}
    - {tool: get_vendor_software_inventory, args: {vendor_name: Orbis EDI}}
  facts: ["9.2.4", "6.4.1", "6.3.8", 4]

- id: itsm-09:85:Q5
  question: "09:85:Q5"
  prompt: >
    If ransomware hit our warehouse systems, what does the WMS depend on and in what recovery tier, and where are the weak
    points in backup and recovery: which systems have never had a restore test or took longer to restore in testing than
    their recovery time objective?
  ref:
    - {tool: get_critical_system_dependencies, args: {source_system: WMS}}
    - {tool: get_recovery_time_and_backup_status, args: {}}
  facts: ["WMS Database", "Message Queue", "Cache Cluster", 45, 90]

- id: itsm-09:88:Q2
  question: "09:88:Q2"
  prompt: >
    Productivity at Daventry (DC2) is well below the other DCs. Over the last month is the WMS performing any worse
    there than at DC1 and DC3? Compare average response time, incidents and unhealthy days.
  ref:
    - {tool: get_wms_system_performance, args: {site_id: DC2, date_from: -30d}}
    - {tool: get_wms_system_performance, args: {site_id: DC1, date_from: -30d}}
    - {tool: get_wms_system_performance, args: {site_id: DC3, date_from: -30d}}
  facts: [87.5, 83.7, 78.8, "healthy"]

- id: itsm-09:90:Q3
  question: "09:90:Q3"
  prompt: >
    The steering committee chose to add 3.5 FTE to the ERP programme to hold the current go-live date. Log that option
    as a configuration change request on ERP, planned in about two weeks.
  ref:
    - {tool: create_change_request, args: {title: ERP programme - add 3.5 FTE to hold go-live, description: Steering committee option - add 3.5 FTE to the ERP programme to hold the go-live date, change_type: configuration, system_affected: ERP, planned_date: +14d}}
  facts: ["ERP", "3.5", "configuration"]
