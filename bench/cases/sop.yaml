- id: sop-03:23:Q6
  question: "03:23:Q6"
  prompt: >
    Create a downside scenario in S&OP for the current cycle (SOP-202610) called "Q1 cost-of-living downside",
    covering Q1 2027, with demand 4% below plan because of cost-of-living pressure. Save it under my id, EMP-00036.
  ref:
    - {tool: create_sop_scenario, args: {name: "Q1 cost-of-living downside", sop_cycle: SOP-202610, scenario_type: downside, forecast_period: "Q1 2027", demand_change_pct: -4, description: "Demand 4% below plan on cost-of-living pressure", created_by: EMP-00036}}
  facts: ["Q1 cost-of-living downside", "downside", "Q1 2027", "-4"]

- id: sop-03:27:Q1-a
  question: "03:27:Q1"
  prompt: >
    What changed in the demand, supply and finance assumptions in the current S&OP cycle compared with last month's,
    who changed each one and why? Which changes have the biggest effect on revenue and inventory, and which are
    still disputed?
  ref:
    - {tool: get_assumption_changes_since_cycle, args: {}}
    - {tool: list_disputed_assumptions, args: {}}
  facts: ["Michael Knight", "Billy Woodward", "Safety stock cover on A-class lines", "Volume lost in weeks 47-49"]

- id: sop-03:27:Q1-b
  question: "03:27:Q1"
  prompt: >
    Turn this S&OP cycle's assumption changes, scenarios and open disputes into a pre-read draft I can review
    before it goes to the attendees.
  ref:
    - {tool: draft_sop_pre_read, args: {}}
  facts: ["Baseline demand growth", "Hold Current Plan", "Asia inbound supplier lead time"]

- id: sop-03:27:Q2-a
  question: "03:27:Q2"
  prompt: >
    For Q4, compare these three scenarios in the current S&OP cycle: hold the current plan, lift stock by 10% on key
    lines, and cut promotions in weeks 47 to 49. Show revenue, margin, service level and cash for each, which has
    the best risk-adjusted outcome and what would trigger a switch.
  ref:
    - {tool: get_current_plan_baseline, args: {}}
    - {tool: compare_scenarios_risk_adjusted, args: {}}
  facts: ["Hold Current Plan", "97.1", ["11300000", "11.3m", "11.3 million"], "93%"]

- id: sop-03:27:Q2-b
  question: "03:27:Q2"
  prompt: >
    Scenario SOP-S-900002 is the one that lifts stock by 10% on key lines. What would that do to cash if sales come
    in 5% under?
  ref:
    - {tool: calculate_scenario_cash_impact, args: {scenario_id: SOP-S-900002, sales_variance_pct: -5}}
  facts: [["8989805", "8.99m", "8.99 million", "8.989m"], ["2310195", "2.31m", "2.31 million"]]

- id: sop-03:27:Q2-c
  question: "03:27:Q2"
  prompt: >
    Which assumptions behind the three Q4 scenarios in the current S&OP cycle are the weakest?
  ref:
    - {tool: get_scenario_assumptions, args: {}}
  facts: ["Volume lost in weeks 47-49", "Asia inbound supplier lead time", "Lost sales recovered"]

- id: sop-03:27:Q4
  question: "03:27:Q4"
  prompt: >
    Which macro assumptions are already in the current S&OP forecast, and which recent macro news items are not yet
    reflected and should be considered for next month's plan?
  ref:
