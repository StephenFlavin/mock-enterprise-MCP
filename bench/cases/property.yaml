- id: property-05:48:Q2
  question: "05:48:Q2"
  prompt: >
    Our reported Scope 2 emissions fell 15% this year. Looking only at actual electricity consumption at our
    distribution centres over the last 12 months compared with the 12 months before, did usage really fall,
    and by how much?
  ref:
    - {tool: get_energy_consumption_by_site, args: {site_type: dc}}
  facts: [["1.2%", "-1.2", "1.2 per"], ["40395672", "40.4 million", "40.4m"], ["40897867", "40.9 million", "40.9m"]]

- id: property-05:49:Q3
  question: "05:49:Q3"
  prompt: >
    We are looking at taking in-store take-back to all UK stores. Using total customer footfall over the last
    30 days, how many UK stores do we have and which are the highest-volume stores?
  ref:
    - {tool: get_store_footfall_and_sales_by_store, args: {country: GB, date_from: -30d}}
  facts: ["215", "ST017", "ST001"]

- id: property-08:71:Q3
  question: "08:71:Q3"
  prompt: >
    I run store ST214 and I'm building next week's staffing plan. From the footfall forecast, which day next week
    is forecast to be busiest and what is the single busiest hour's forecast visitor count?
  ref:
    - {tool: get_footfall_forecast_for_store, args: {site_id: ST214, date_from: +1d, date_to: +14d}}
  facts: ["Saturday", "414"]

- id: property-08:71:Q4
  question: "08:71:Q4"
  prompt: >
    At my store ST214, local events have affected trade before (a summer music festival and a home football match
    nearby, both on Saturdays). Looking at daily footfall over the last 100 days, which Saturday was the busiest
    and which was the quietest, and how many visitors did each have compared with a normal Saturday?
  ref:
    - {tool: get_footfall_history_for_store, args: {site_id: ST214, date_from: -100d}}
  facts: ["4431", "2665"]

- id: property-08:73:Q5
  question: "08:73:Q5"
  prompt: >
    I'm area manager for the Scotland region. Which competitors have stores inside the catchment areas of my
    stores, and which one overlaps our customers the most, and at which of our stores?
  ref:
    - {tool: get_store_catchment_overlap, args: {region: Scotland}}
  facts: ["John Lewis", "ST214", "18"]
