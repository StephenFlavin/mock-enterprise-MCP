- id: supplier_risk-02:14:Q6
  question: "02:14:Q6"
  prompt: >
    We buy a lot of cotton and some polysilicon-based products, and I need to know where we could get stopped at the
    border under forced-labour import rules. Which of our suppliers are exposed, meaning they use cotton or polysilicon
    sourced from a region of concern?
  ref:
    - {tool: list_suppliers_by_raw_material, args: {origin_region: Xinjiang}}
  facts: ["Hunt Apparel", "Bishop Apparel", "Brown Textiles", "Arnold Industries"]

