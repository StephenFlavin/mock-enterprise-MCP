- id: forwarder-02:12:Q4-a
  question: "02:12:Q4"
  prompt: >
    18% of our Asia-Europe ocean bookings were rolled last quarter. Which bookings were rolled in the last 90 days: how
    many, which carriers and ports were involved and why were they rolled?
  ref:
    - {tool: list_rolled_bookings, args: {sailing_from: -90d}}
  facts: ["25", "CAR-005", "Overbooked vessel", "Rotterdam"]

- id: forwarder-02:12:Q4-b
  question: "02:12:Q4"
  prompt: >
    For our Asia-Europe ocean bookings over the last 90 days, how does the roll rate change with how far ahead we
    booked and with the size of the booking? Would booking earlier or splitting big bookings have helped?
  ref:
    - {tool: get_booking_lead_time_vs_roll_outcome, args: {group_by: lead_time_band, sailing_from: -90d}}
    - {tool: get_booking_lead_time_vs_roll_outcome, args: {group_by: booking_size, sailing_from: -90d}}
  facts: ["50", "2.5", "27.7", "13.5"]

- id: forwarder-02:12:Q4-c
  question: "02:12:Q4"
  prompt: >
    Which carriers rolled our Asia-Europe ocean bookings most often over the last 90 days, and what share of each
    carrier's bookings did they roll?
  ref:
    - {tool: get_booking_lead_time_vs_roll_outcome, args: {group_by: carrier_id, sailing_from: -90d}}
  facts: ["CAR-005", "35.5", "CAR-006", "36"]

- id: forwarder-02:12:Q4-d
  question: "02:12:Q4"
  prompt: >
    What did demurrage and detention cost us on ocean bookings over the last 90 days, and how much of that was on
    bookings that had been rolled?
  ref:
    - {tool: get_demurrage_and_detention_for_bookings, args: {period_start: -90d}}
  facts: ["23729.54", "20567.85"]

- id: forwarder-02:12:Q5-a
  question: "02:12:Q5"
  prompt: >
    Oceanic Container Line (CAR-005) has blanked its Rotterdam call on a sailing in about two weeks and its Felixstowe
    call on a sailing about two weeks after that, and Pacific Star Shipping (CAR-006) has blanked its Hamburg call in
    between. Which of our booked ocean bookings with those two carriers are hit, and when do they sail?
  ref:
    - {tool: list_planned_bookings, args: {carrier_id: CAR-005, sailing_to: +6w}}
    - {tool: list_planned_bookings, args: {carrier_id: CAR-006, sailing_to: +6w}}
  facts: ["OBK-900101", "OBK-900102", "OBK-900103"]

- id: forwarder-02:12:Q5-b
  question: "02:12:Q5"
  prompt: >
    Move booking OBK-900102 (Pacific Star Shipping, Ningbo to Hamburg) to the same carrier's next sailing, a week later
    than it is booked now.
  ref:
    - {tool: update_booking_sailing, args: {booking_id: OBK-900102, planned_sailing: "2026-10-31"}}
  facts: ["OBK-900102", "2026-10-31"]

- id: forwarder-02:12:Q5-c
  question: "02:12:Q5"
  prompt: >
    Actually cancel the Rotterdam booking OBK-900101 (Oceanic Container Line, Shanghai to Rotterdam) instead of moving
    it, because its sailing is blanked.
  ref:
    - {tool: cancel_ocean_booking, args: {booking_id: OBK-900101, cancel_reason: Sailing blanked}}
  facts: ["OBK-900101", "cancelled"]

- id: forwarder-02:12:Q6
  question: "02:12:Q6"
  prompt: >
    We are weighing Valencia or Piraeus plus rail for Europe-bound boxes. How many 40ft containers a month do we
    actually ship from Shanghai (CNSHA) to our UK and northern European ports, based on the last six months of
    bookings, and how many per booking?
  ref:
    - {tool: get_historical_container_volumes_by_route, args: {origin_port: CNSHA, months_back: 6}}
  facts: ["GBFXT", "42", "7", "1.9"]

- id: forwarder-02:13:Q1
  question: "02:13:Q1"
  prompt: >
    Go ahead and book the air freight for style STY-7731: 6,000 units with SkyBridge Air Cargo (CAR-008) from Istanbul
    (IST) to London Heathrow, leaving in three days and landing two days later, total price £4,920.
  ref:
    - {tool: create_air_freight_booking, args: {style_id: STY-7731, carrier_id: CAR-008, origin_airport: IST, units: 6000, planned_departure: +3d, planned_arrival: +5d, cost_gbp: 4920}}
  facts: ["STY-7731", "6000", "4920"]

- id: forwarder-02:13:Q2
  question: "02:13:Q2"
  prompt: >
    We spent about £420k on air freight last quarter. Using the air freight invoices for the last 90 days, break the
    spend down by cause and by supplier and say how much of it was avoidable.
  ref:
    - {tool: list_air_freight_invoices, args: {period_start: -90d}}
  facts: ["420000", "246000", "150000", "SUP-0012"]

- id: forwarder-02:13:Q5-a
  question: "02:13:Q5"
  prompt: >
    I need 500 units from PO-2026-005784 (Bangladesh) at our Felixstowe gateway within 12 days. For the routing options
    from Bangladesh (origin port BDCGP, destination GBFXT), what is the chance each one makes the date, and which
    booking cut-offs do I have to hit?
  ref:
    - {tool: calculate_delivery_date_probability, args: {origin_port: BDCGP, dest_port: GBFXT, required_date: +12d}}
    - {tool: get_booking_cut_off_times, args: {po_id: PO-2026-005784}}
  facts: ["94", "sea_air", "2 days before departure", "3 days before departure"]
  notes: "Master PO-2026-005784 has a factory ship date about seven weeks out, so its dates do not fit the 12-day deadline in the question; the deadline is passed explicitly instead."

- id: forwarder-02:13:Q5-b
  question: "02:13:Q5"
  prompt: >
    Draft the booking request to the forwarder for PO-2026-005784: 500 units by air, needed in 12 days.
  ref:
    - {tool: draft_forwarder_booking_request, args: {po_id: PO-2026-005784, units: 500, mode: air, required_date: +12d}}
  facts: ["500 units", "OBK-900105"]

- id: forwarder-02:13:Q5-c
  question: "02:13:Q5"
  prompt: >
    Book the air option for PO-2026-005784: 500 units on SkyBridge Air Cargo (CAR-008) from Dhaka (DAC) to Heathrow,
    leaving in three days and arriving four days later, total price £1,440.
  ref:
    - {tool: create_air_freight_booking, args: {po_id: PO-2026-005784, carrier_id: CAR-008, origin_airport: DAC, units: 500, planned_departure: +3d, planned_arrival: +7d, cost_gbp: 1440}}
  facts: ["PO-2026-005784", "500", "1440"]

- id: forwarder-02:13:Q5-d
  question: "02:13:Q5"
  prompt: >
    Cancel the sea booking we hold on PO-2026-005784, because the goods are now going by air.
  ref:
    - {tool: list_planned_bookings, args: {po_id: PO-2026-005784}}
    - {tool: cancel_sea_freight_booking, args: {booking_id: OBK-900105, cancel_reason: Switched to air}}
  facts: ["OBK-900105", "cancelled"]

- id: forwarder-02:19:Q1
  question: "02:19:Q1"
  prompt: >
    The sea shipments on POs PO-2026-004155 and PO-2026-004352 are running late and the stores will run out of stock.
    Ask the forwarder to expedite both, giving store stock-out risk as the reason.
  ref:
