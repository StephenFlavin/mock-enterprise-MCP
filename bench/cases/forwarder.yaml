    - {tool: send_expedite_request_to_forwarder, args: {booking_id: OBK-900202, reason: Store stock-out risk}}
  facts: ["OBK-900201", "OBK-900202"]

- id: forwarder-02:19:Q3
  question: "02:19:Q3"
  prompt: >
    A vessel from Shanghai (CNSHA) has been anchored outside Rotterdam (NLRTM) for six days with no berth ETA. Besides
    waiting, what routing alternatives exist for those boxes, with transit time, reliability and cost per 40ft
    container?
  ref:
    - {tool: get_transshipment_options, args: {origin_port: CNSHA, dest_port: NLRTM}}
  facts: ["Hamburg", "8970", "Felixstowe", "8520"]

- id: forwarder-08:80:Q2
  question: "08:80:Q2"
  prompt: >
    Our Dubai franchise partner PTN-011 has an open order FRO-900001 split across two ocean shipments. Expedite the
    shipment carrying the core-range lines and leave the overstock shipment alone.
  ref:
    - {tool: list_planned_bookings, args: {partner_id: PTN-011}}
    - {tool: update_shipment_priority_for_franchise_order, args: {booking_id: OBK-900031, priority: urgent}}
  facts: ["OBK-900031", "urgent"]
  notes: "Master ports has no Dubai port (Jebel Ali AEJEA is used for the Dubai bookings) and the franchise order dates in the franchise system cannot be matched to a realistic UK to Dubai sea transit."
