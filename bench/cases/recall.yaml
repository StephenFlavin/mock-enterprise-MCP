- id: recall-05:44:Q6
  question: "05:44:Q6"
  prompt: >
    What past incidents and recalls have we had on our kids' product types (the Kids department)? Which of those product
    types is riskiest for us, what is its most common issue, and how many recalls has it had?
  ref:
    - {tool: get_internal_incident_history, args: {department: Kids}}
  facts: ["Babywear", ["popper", "Small parts"], "Nightwear", "Schoolwear"]
  notes: "Master now has one new toy (SKU-106384, Toys, no sales yet, under review in plm) with no incident history, so past incidents and recalls are the kids' clothing categories (Babywear, Schoolwear, Nightwear)."

- id: recall-05:47:Q1-a
  question: "05:47:Q1"
  prompt: >
    A customer has reported that the battery in our portable fan, SKU PF-220, is overheating. What customer incident
    reports do we hold for PF-220 recently, which batch do they quote, and how severe are the worst ones?
  ref:
    - {tool: get_incident_report, args: {sku: PF-220}}
  facts: ["BATCH-PF220-2509-A", "critical", "fire"]

- id: recall-05:47:Q1-b
  question: "05:47:Q1"
  prompt: >
    Open a recall case for incident INC-900001 (battery overheating in portable fan PF-220). The affected batch is
    BATCH-PF220-2509-A, made at factory FAC-0027, with 18,000 units affected.
  ref:
    - {tool: create_recall_case, args: {incident_id: INC-900001, sku: PF-220, reason: "Battery overheating", batch_id: BATCH-PF220-2509-A, factory_id: FAC-0027, units_affected: 18000}}
  facts: ["BATCH-PF220-2509-A", "FAC-0027", "18000"]

- id: recall-05:47:Q2
  question: "05:47:Q2"
  prompt: >
    For recall case REC-900001, draft the UK regulator notification: who it goes to, the deadline and who signs it off.
    I have signed it off, so then submit the UK notification.
  ref:
    - {tool: draft_regulatory_notification, args: {recall_id: REC-900001, country: GB}}
    - {tool: send_regulatory_notification, args: {recall_id: REC-900001, country: GB, regulator: "Trading Standards Service (OPSS)", notification_type: recall, deadline: +1d, content: "Safety recall of PF-220 batch BATCH-PF220-2509-A: battery overheating."}}
  facts: [["Trading Standards", "OPSS"], ["24 hours", "24 hour", "within 24"], "Director of Product Safety"]

- id: recall-05:47:Q3
  question: "05:47:Q3"
  prompt: >
    What did we do in our own past battery incidents? I want what each recall cost, what happened to our reputation,
    and what the communication did well or badly, and which case was the worst.
  ref:
    - {tool: get_internal_incident_history, args: {issue: battery}}
  facts: [["946005", "£946,005"], ["781652", "£781,652"], ["national press", "National press coverage"], "nine days"]

- id: recall-05:47:Q4-a
  question: "05:47:Q4"
  prompt: >
    What would a recall of 18,000 portable fans (PF-220, retail price £77.99) cost us all in? Give the expected and the
    worst case, and say whether the worst case is before or after insurance.
  ref:
    - {tool: calculate_recall_cost_estimate, args: {units_affected: 18000, retail_price_gbp: 77.99}}
  facts: [["1015292", "£1,015,292"], ["1888320", "£1,888,320"], ["1510656", "£1,510,656"]]

- id: recall-05:47:Q4-b
  question: "05:47:Q4"
  prompt: >
    Use our past battery recalls as a benchmark for a new battery recall: what did each cost in total and per unit
    affected?
  ref:
    - {tool: get_historical_recall_costs, args: {reason: battery}}
  facts: [["781652", "£781,652"], ["946005", "£946,005"], "47.37", "105.11"]

- id: recall-05:47:Q4-c
  question: "05:47:Q4"
  prompt: >
    Record £1,015,292 as the cost estimate on recall case REC-900001.
  ref:
    - {tool: update_recall_case_cost_estimate, args: {recall_id: REC-900001, cost_estimate_gbp: 1015292}}
  facts: [["1015292", "£1,015,292"]]

- id: recall-05:47:Q5-a
  question: "05:47:Q5"
  prompt: >
    Draft the customer notice, the store instructions and the press statement for recall case REC-900001 (portable fan
    PF-220), using the incident reports for PF-220 to check the wording, and tell me which sentence creates the most
    legal risk.
  ref:
    - {tool: get_incident_report, args: {sku: PF-220}}
    - {tool: draft_customer_recall_notice, args: {recall_id: REC-900001}}
    - {tool: draft_store_instructions, args: {recall_id: REC-900001}}
    - {tool: draft_press_statement, args: {recall_id: REC-900001}}
  facts: ["BATCH-PF220-2509-A", ["77.99", "£77.99"], ["18000", "18,000"]]

- id: recall-05:47:Q5-b
  question: "05:47:Q5"
  prompt: >
    Legal has approved the store instructions for recall REC-900001 (PF-220, batch BATCH-PF220-2509-A): publish a pull
    instruction to stores. Legal wants to hold the press statement for that recall, so delete that draft.
  ref:
    - {tool: draft_press_statement, args: {recall_id: REC-900001}}
    - {tool: send_store_instructions, args: {recall_id: REC-900001, sku: PF-220, batch_id: BATCH-PF220-2509-A, action: pull, content: "Pull PF-220 batch BATCH-PF220-2509-A from sale and quarantine it."}}
    - {tool: delete_draft_press_statement, args: {draft_id: DRF-900002}}
  facts: ["pull", "BATCH-PF220-2509-A", "deleted"]
