  facts: ["CTR-000038", "CTR-000108", "CTR-000109", "CTR-000069", "CTR-000042"]

- id: contracts-04:37:Q5
  question: "04:37:Q5"
  prompt: >
    Our energy suppliers are SUP-0050 and SUP-0071 and our packaging suppliers are SUP-0077 (corrugated) and
    SUP-0073 (film). Under their contracts, how is each one's price set, can we lock in a fixed price for 12 months,
    and at what premium and notice?
  ref:
    - {tool: get_contract_terms_for_supplier, args: {supplier_id: SUP-0050}}
    - {tool: get_contract_terms_for_supplier, args: {supplier_id: SUP-0071}}
    - {tool: get_contract_terms_for_supplier, args: {supplier_id: SUP-0077}}
    - {tool: get_contract_terms_for_supplier, args: {supplier_id: SUP-0073}}
  facts: ["3.5", "75", "fixed for 12 months", "4.5"]
  notes: "Master data has no energy or packaging services suppliers; SUP-0050, SUP-0071 (energy) and SUP-0077, SUP-0073 (packaging) are the stand-ins the spend system uses. Price forecasts live in the commodity system."

- id: contracts-04:38:Q1
  question: "04:38:Q1"
  prompt: >
    The attached supplier agreement (version 3) from knitwear supplier SUP-0072 is held as draft contract
    CTR-000072. Compare it with our standard terms and list the deviations ranked by risk, flagging anything unusual
    for the apparel industry. Then estimate our liability exposure under its limitation clause if a defect hit
    40,000 units at 18.50 pounds each.
  ref:
    - {tool: compare_contract_to_standard_terms, args: {contract_id: CTR-000072}}
    - {tool: calculate_liability_exposure, args: {contract_id: CTR-000072, volume_units: 40000, unit_value_gbp: 18.5}}
  facts: [["value of the order", "order value"], ["product safety", "product-safety"], "740000", "620000"]
  notes: "The attached document itself is read by the documents system; here the draft agreement is held as CTR-000072 so it can be compared with the standard terms table."

