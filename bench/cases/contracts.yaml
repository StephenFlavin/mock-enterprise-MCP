- id: contracts-04:34:Q7-a
  question: 04:34:Q7
  prompt: 'We are considering a volume commitment with our Portuguese nearshore supplier SUP-0044: forecast 400,000 units a year at 9.50 pounds a unit. Under its contract, how many units are we committed
