- id: contracts-04:37:Q4
  question: "04:37:Q4"
  prompt: >
    What contracts expire in the next 12 months? Which of them are auto-renewal traps, meaning they renew
    automatically and the notice date has already passed or falls within the next two weeks, and who owns each?
    Then set a renewal alert for CTR-000042 a few days before its notice date.
  ref:
