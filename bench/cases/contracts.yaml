- id: contracts-01:4:Q4
  question: 01:4:Q4
  prompt: 'Supplier SUP-0013 keeps short-shipping against its ASNs. What does its contract say about the time limit for shortage claims, the short-shipment tolerance and the remedy? One short receipt came
    in 10 days ago: is its claim still inside the window?'
  ref:
  - tool: get_supplier_claim_terms
    args:
      supplier_id: SUP-0013
      receipt_date: -10d
  facts:
  - - '14'
    - 14 days
  - - '2'
    - 2%
  - credit note
