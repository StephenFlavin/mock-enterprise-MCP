- id: wholesale_edi-08:75:Q1-a
  question: "08:75:Q1"
  prompt: >
    Our wholesale customer PTN-001's last four orders arrived short. For each of the four, how many units were
    ordered and received, and what was the reason for the shortfall (allocation, pick, quality or carrier)?
  ref:
    - {tool: get_wholesale_orders_for_customer, args: {partner_id: PTN-001, limit: 4}}
  facts: ["560", "450", "700", ["carrier", "CAR-003"]]
  notes: "Party id: PTN-001 Freeman-Sharp is the key account in wholesale_edi, oms, contracts, carrier_portal and wms (ORD-900070..73). Quantities (800/560, 600 lost with CAR-003, 500/450, 700 in full) match those systems."

- id: wholesale_edi-08:75:Q1-b
  question: "08:75:Q1"
  prompt: >
    Draft a response to the buyer at PTN-001 about their recent short orders and what caused each shortfall.
  ref:
    - {tool: draft_response_to_customer_buyer, args: {partner_id: PTN-001}}
  facts: ["Freeman-Sharp", ["lost in transit", "carrier"], "240", "600"]

- id: wholesale_edi-08:75:Q2-a
  question: "08:75:Q2"
  prompt: >
    We have 8,000 units of SKU-100035 and customers PTN-002, PTN-004 and PTN-005 have each ordered some of it
    (15,000 in all). What is each of those three accounts worth to us, and how long have they been customers?
  ref:
    - {tool: get_customer_account_value, args: {partner_id: PTN-002}}
    - {tool: get_customer_account_value, args: {partner_id: PTN-004}}
    - {tool: get_customer_account_value, args: {partner_id: PTN-005}}
  facts: [["1200000", "1.2m"], ["920000", "920k"], ["750000", "750k"], ["2018", "2021"]]

- id: wholesale_edi-08:75:Q2-b
  question: "08:75:Q2"
  prompt: >
    PTN-005's order WOL-900012 for SKU-100035 will get none of the stock we have. Send them a short-shipment
    notice for the full 4,000 units short, reason: stock unavailable.
  ref:
    - {tool: send_short_shipment_notice_to_customers, args: {partner_id: PTN-005, order_id: WOL-900012, qty_short: 4000, reason: Stock unavailable}}
  facts: ["4000", "WOL-900012"]

- id: wholesale_edi-08:75:Q4-a
  question: "08:75:Q4"
  prompt: >
    For our key wholesale accounts, what are their weekly sell-through and the stock they hold, and which
    account holds the most weeks of cover (so is most likely to cut next quarter's orders)?
  ref:
    - {tool: get_key_account_sell_through_and_stock, args: {}}
  facts: ["PTN-006", "6.4", "280", "1800"]

- id: wholesale_edi-08:75:Q4-b
  question: "08:75:Q4"
  prompt: >
    How confident can we be in each key account's data feed? Which accounts have stale feeds or thin SKU
    coverage and so give low-confidence data?
  ref:
    - {tool: get_data_feed_coverage_by_account, args: {}}
  facts: ["PTN-003", "PTN-006", "PTN-007", "PTN-010"]

- id: wholesale_edi-09:83:Q1-a
  question: "09:83:Q1"
  prompt: >
    200 PO acknowledgements failed overnight. How many of them were mapping errors, how many format errors and
    how many partner-side failures, and what does the mapping error say?
  ref:
    - {tool: get_failed_edi_messages, args: {message_type: PO_ACK, error_category: mapping}}
    - {tool: get_failed_edi_messages, args: {message_type: PO_ACK, error_category: format}}
    - {tool: get_failed_edi_messages, args: {message_type: PO_ACK, error_category: partner_side}}
  facts: ["171", "17", "12", "ACK_STATUS"]
  notes: "Incident ids follow integration: 200 PO_ACK failures overnight from the first 38 master suppliers (SUP-0001..SUP-0038): 171 mapping (ACK_STATUS not in PO_ACK map v1.1), 17 format, 12 partner-side HTTP 500 from SUP-0004, SUP-0015, SUP-0030. Messages are keyed by supplier_id, not wholesale partner id. The reprocess tool takes one message_id per call (engine updates one row)."

- id: wholesale_edi-09:83:Q1-b
  question: "09:83:Q1"
  prompt: >
    Which supplier EDI connections are currently in a failed state, so we know the partner-side failures are
    not ours to fix?
  ref:
    - {tool: get_edi_partner_status, args: {connection_status: failed}}
  facts: ["SUP-0004", "SUP-0015", "SUP-0030"]
  # the scenario asks the cause (mapping, format or partner-side), not which partners
  scenario_facts: []

- id: wholesale_edi-09:83:Q1-c
  question: "09:83:Q1"
  prompt: >
    The PO_ACK mapping has been corrected. Reprocess failed message EDI-900001 with the reason "Mapping corrected".
  ref:
    - {tool: submit_edi_message_reprocess, args: {message_id: EDI-900001, retry_reason: Mapping corrected}}
  facts: ["reprocessing", "Mapping corrected"]

- id: wholesale_edi-09:83:Q2-a
  question: "09:83:Q2"
  prompt: >
    The new ASN spec changes the ASN message. Which active trading partners currently send us ASN messages, and
    how many are there, so we know who is affected?
  ref:
    - {tool: list_trading_partners_using_message_type, args: {message_type: ASN}}
  facts: ["25", "SUP-0001", "SUP-0002"]
