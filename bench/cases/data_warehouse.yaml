- id: data_warehouse-09:81:Q4
  question: "09:81:Q4"
  prompt: >
    I want a cost-per-order model joining WMS, TMS and ERP data in the warehouse. Which warehouse tables hold the
    order handling cost, the shipment freight cost and the order revenue and charges, and what are their keys? Test
    your SQL on order ORD-2026-0108564, which was split across shipments, and then save it as a warehouse view called
    cost_per_order.
  ref:
    - {tool: search_data_catalogue, args: {query: order}}
    - {tool: get_table_schema, args: {table_name: wms_order_costs}}
    - {tool: get_table_schema, args: {table_name: tms_shipment_costs}}
    - {tool: get_table_schema, args: {table_name: erp_order_headers}}
    - {tool: run_sql_query, args: {query: "SELECT w.order_id, w.total_cost_gbp AS wms_cost, t.freight, t.shipments, e.revenue_gbp FROM wms_order_costs w JOIN (SELECT order_id, sum(freight_cost_gbp) AS freight, count(*) AS shipments FROM tms_shipment_costs GROUP BY order_id) t USING (order_id) JOIN erp_order_headers e USING (order_id) WHERE w.order_id = 'ORD-2026-0108564'"}}
    - {tool: create_warehouse_view, args: {view_name: cost_per_order, sql_query: "SELECT w.order_id, w.total_cost_gbp + coalesce(sum(t.freight_cost_gbp), 0) AS cost_gbp FROM wms_order_costs w LEFT JOIN tms_shipment_costs t USING (order_id) GROUP BY w.order_id, w.total_cost_gbp"}}
  facts: ["wms_order_costs", "tms_shipment_costs", "erp_order_headers", 23.19, "cost_per_order"]

