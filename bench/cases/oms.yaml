- id: oms-01:6:Q5-a
  question: "01:6:Q5"
  prompt: >
    Store order service level fell from about 98.5% to about 95% over the last three weeks. Show me the weekly service
    level, which lane (source DC) is behind it, and which stores had late orders.
  ref:
    - {tool: get_store_service_level_trend, args: {date_from: "-28d"}}
  facts: ["DC1", "ST159", "93.5"]

- id: oms-01:8:Q5
  question: "01:8:Q5"
  prompt: >
    We are considering moving e-commerce from wave picking to continuous batching. Over the last two weeks, what does the
    online order arrival profile look like by hour of day, and how many lines does an online order have on average?
  ref:
    - {tool: get_order_profile_summary, args: {channel: online, date_from: "-14d"}}
  facts: ["19", "online"]

- id: oms-03:31:Q4
  question: "03:31:Q4"
  prompt: >
    Over the last 30 days, which DC catchment has the highest cross-shipping rate (orders fulfilled from a DC that is not
    local to the destination), and is it driven by stock placement or by DC capacity?
  ref:
    - {tool: get_cross_shipping_rate, args: {date_from: "-30d"}}
  facts: ["DC3", ["stock placement", "stock not at the local DC", "stock is not at the local DC", "inventory placement"]]

- id: oms-05:42:Q1
  question: "05:42:Q1"
  prompt: >
    Several lots of the Blush Blouse in size 10 (SKU-100007) failed colourfastness to rubbing. For each lot of that SKU, how
    many units have already shipped and how many are allocated to orders but not yet shipped?
  ref:
    - {tool: get_shipped_units_by_lot, args: {product_sku: SKU-100007}}
  facts: ["BATCH-POL-PINK-004", "560", "240", "BATCH-POL-PINK-007", "500"]

- id: oms-05:47:Q1
  question: "05:47:Q1"
  prompt: >
    A customer reports the battery in our portable fan SKU PF-220 overheating. How many units of PF-220 have we sold from
    each batch, and through which channels?
  ref:
    - {tool: get_units_sold_by_batch, args: {product_sku: PF-220}}
  facts: ["BATCH-PF220-2509-A", "1385", "BATCH-PF220-2508-B", "653", "store"]

- id: oms-05:47:Q2
  question: "05:47:Q2"
  prompt: >
    Batch BATCH-PF220-2509-A of portable fan PF-220 needs a safety notification. In which countries was it sold and how many
    units in each?
  ref:
    - {tool: get_countries_where_batch_sold, args: {batch_id: BATCH-PF220-2509-A}}
  facts: [["GB", "United Kingdom"], "720", ["DE", "Germany"], "300", ["FR", "France"], ["IE", "Ireland"]]

- id: oms-07:65:Q2
  question: "07:65:Q2"
  prompt: >
    Wholesale customer CUS-000028 is disputing the invoice for order ORD-900040. What do the delivery notes and proof of
    delivery show: units shipped versus received on each delivery, and who signed?
  ref:
    - {tool: get_delivery_notes_for_invoice, args: {order_id: ORD-900040}}
  facts: ["5000", "3000", "2640", "360", "J. Patel"]

- id: oms-07:65:Q5-a
  question: "07:65:Q5"
  prompt: >
    Customer CUS-000016 is 75 days overdue. What open orders do they have, which are on hold and why, and which one is urgent?
  ref:
    - {tool: get_open_orders_for_customer, args: {customer_id: CUS-000016}}
  facts: ["ORD-900050", "urgent", "20000", "credit"]

- id: oms-08:74:Q5-a
  question: "08:74:Q5"
  prompt: >
    Partial and split deliveries on online orders are up. Over the last 60 days, what share of online orders were split
    versus the 60 days before, and which cause (stock, location, wave, carrier) is biggest?
  ref:
    - {tool: get_split_order_rate, args: {date_from: "-60d", channel: online}}
  facts: ["stock", "location"]

- id: oms-08:74:Q5-b
  question: "08:74:Q5"
  prompt: >
    Which stock allocation rule applies to kettle K-1700, what share does it give online, and what does its description say?
  ref:
    - {tool: get_allocation_rules, args: {product_sku: K-1700}}
  facts: ["AR-900002", "20", "capped"]

- id: oms-08:74:Q6-a
  question: "08:74:Q6"
  prompt: >
    K-1700 is a hot seller. How have its units and revenue by channel (store, online, wholesale) trended week by week over the
    last five weeks?
  ref:
    - {tool: get_sell_through_by_channel, args: {product_sku: K-1700, date_from: "-35d"}}
  facts: ["store", "online", "wholesale"]

- id: oms-08:74:Q6-b
  question: "08:74:Q6"
  prompt: >
    We have 1,000 units of K-1700 to split between stores (demand 800) and online (demand 600). Compare the allocation
    options if we hold back 20% for click-and-collect.
  ref:
    - {tool: calculate_allocation_scenarios, args: {product_sku: K-1700, available_units: 1000, store_demand: 800, online_demand: 600, hold_back_pct: 20}}
  facts: ["200", "800", "560"]

- id: oms-08:75:Q1
  question: "08:75:Q1"
  prompt: >
    Wholesale customer CUS-000030's order ORD-900070 arrived short. How was each line allocated, how much was requested versus
    allocated, and was it short at allocation?
  ref:
    - {tool: get_allocation_decision_for_order, args: {order_id: ORD-900070}}
  facts: ["800", "560", "240", "SKU-100469"]

- id: oms-08:75:Q2-a
  question: "08:75:Q2"
  prompt: >
    We have 8,000 units of SKU-100035 and wholesale customers ordered 15,000. List the open wholesale orders for SKU-100035,
    oldest first, with customer and quantity.
  ref:
    - {tool: get_open_wholesale_orders_for_product, args: {product_sku: SKU-100035}}
  facts: ["ORD-900060", "CUS-000036", "6000", "ORD-900061", "5000", "ORD-900062", "4000"]

- id: oms-08:75:Q4
  question: "08:75:Q4"
  prompt: >
    Based on the last 13 weeks versus the 13 weeks before, which wholesale key accounts are ordering less and are likely to
    cut orders next quarter?
  ref:
    - {tool: get_key_account_order_history, args: {periods: 13}}
  facts: ["CUS-000026", "CUS-000024"]

- id: oms-08:75:Q5
  question: "08:75:Q5"
  prompt: >
    How are we doing on fill rate by wholesale account over the last 90 days, and which account has the lowest fill rate?
  ref:
    - {tool: get_fill_rate_by_account, args: {date_from: "-90d"}}
  facts: ["CUS-000010", "88.2"]

- id: oms-09:83:Q5
  question: "09:83:Q5"
  prompt: >
    Website stock updates are running behind. How many online orders have been oversold in the last 14 days, and what
    happened to them (cancelled, short-shipped or waiting for stock)?
  ref:
    - {tool: get_oversell_incidents, args: {channel: online, date_from: "-14d"}}
  facts: ["cancelled", ["short_shipped", "short shipped", "short-shipped"]]

- id: oms-01:6:Q5-b
  question: "01:6:Q5"
  prompt: >
    Order ORD-900001 is a late store order for Leeds. Raise its priority to urgent so it goes out on tonight's wave.
  ref:
    - {tool: update_order_priority, args: {order_id: ORD-900001, priority: urgent}}
  facts: ["urgent"]

- id: oms-07:65:Q5-b
  question: "07:65:Q5"
  prompt: >
    The urgent 20k order ORD-900050 for CUS-000016 should ship after all. Release the hold on it.
  ref:
    - {tool: release_order_hold, args: {order_id: ORD-900050}}
  facts: [["none", "released", "cleared"]]

- id: oms-08:74:Q5-c
  question: "08:74:Q5"
  prompt: >
    Change allocation rule AR-900002 so stores get 55%, online 30% and wholesale 15%.
  ref:
    - {tool: update_allocation_rule, args: {rule_id: AR-900002, store_pct: 55, online_pct: 30, wholesale_pct: 15}}
  facts: ["55", "30", "15"]

- id: oms-08:74:Q6-c
  question: "08:74:Q6"
  prompt: >
    Set the K-1700 allocation to 56% stores, 32% online and 12% wholesale, holding back 20% for click-and-collect.
  ref:
    - {tool: update_channel_allocation_for_product, args: {product_sku: K-1700, store_pct: 56, online_pct: 32, wholesale_pct: 12, hold_back_pct: 20}}
  facts: ["56", "32", "12", "20"]

- id: oms-08:75:Q2-b
  question: "08:75:Q2"
  prompt: >
    Allocate the agreed quantity on order ORD-900060 line 1 (SKU-100035): set the allocated quantity to 4,000 units.
  ref:
    - {tool: update_wholesale_order_allocation, args: {order_id: ORD-900060, line_no: 1, qty_allocated: 4000}}
  facts: ["4000"]

- id: oms-09:85:Q5
  question: "09:85:Q5"
  prompt: >
    We are sizing the cost of a ransomware outage on our order management system. Over the last 28 days, how many orders
    and how much revenue flow through it on an average day, i.e. what is the revenue at risk per day of outage?
  ref:
    - {tool: get_daily_throughput_and_revenue_at_risk, args: {date_from: "-28d"}}
  facts: ["162329", "52.2"]
