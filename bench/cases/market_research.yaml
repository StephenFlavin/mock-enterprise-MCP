- id: market_research-05:49:Q4
  question: "05:49:Q4"
  prompt: >
    Why aren't customers using our resale programme? What do the survey responses say: is it awareness, effort or price?
  ref:
    - {tool: search_survey_responses_by_topic, args: {topic: resale}}
  facts: ["awareness", ["9", "nine"], "effort", "price"]

- id: market_research-06:52:Q6
  question: "06:52:Q6"
  prompt: >
    What do 25 to 34 year olds want from outdoor clothing, and how does that differ between the UK and Germany?
  ref:
    - {tool: search_survey_results_by_segment, args: {topic: outdoor clothing, respondent_age_group: "25-34"}}
    - {tool: compare_survey_results_by_market, args: {topic: outdoor clothing, region_1: UK, region_2: Germany, respondent_age_group: "25-34"}}
  facts: ["waterproof", "sustainab", "durab", ["European", "quality"]]

- id: market_research-06:53:Q2
  question: "06:53:Q2"
  prompt: >
    What are typical body measurements for women in Germany, France and the UK, and how do they differ from our
    womenswear size chart? Where are we furthest out?
  ref:
    - {tool: search_anthropometric_survey_data, args: {gender: female}}
    - {tool: compare_size_chart_to_body_measurements, args: {category: womenswear}}
  facts: ["Germany", "hip", "7"]

- id: market_research-06:54:Q3
  question: "06:54:Q3"
  prompt: >
    Where's the whitespace in UK small kitchen appliances? Tell me how big each segment is, how fast it is growing and
    which has the best margin.
  ref:
    - {tool: search_market_size_by_category, args: {category: small kitchen appliances, country: UK}}
  facts: ["multi cooker", ["soup maker", "soup makers"], "41", "19"]

- id: market_research-06:56:Q6
  question: "06:56:Q6"
  prompt: >
    How are consumer priorities shifting under cost pressures? Use the survey, split by age and by region. Which age
    group is most affected and which region is most resilient?
  ref:
    - {tool: search_survey_results_by_segment, args: {topic: consumer priorities, split_by: age_group}}
    - {tool: search_survey_results_by_segment, args: {topic: consumer priorities, split_by: region}}
  facts: ["25-34", "Germany", "trading down"]

- id: market_research-08:71:Q4
  question: "08:71:Q4"
  prompt: >
    Store ST214: is there anything local that will affect trade over the next month? Check events and roadworks.
  ref:
    - {tool: search_local_events_near_store, args: {site_id: ST214}}
    - {tool: search_road_works_near_store, args: {site_id: ST214}}
  facts: ["festival", ["football", "sports"], "main access road", "parking"]

- id: market_research-08:73:Q1
  question: "08:73:Q1"
  prompt: >
    Store ST214 has been below target for six months. What is the local competition around it, and what has changed
    recently?
  ref:
    - {tool: get_local_competitor_activity_for_store, args: {site_id: ST214}}
  facts: ["Argos", "JD Sports", "Currys", "John Lewis"]

- id: market_research-08:80:Q1
  question: "08:80:Q1"
  prompt: >
    We're considering launching our home range in Poland and Czechia. What do consumers there prefer in terms of style
    and price points, and what are typical retail margins in each?
  ref:
    - {tool: get_consumer_preferences_and_price_points, args: {country: Poland, category: home}}
    - {tool: get_consumer_preferences_and_price_points, args: {country: Czechia, category: home}}
    - {tool: get_typical_retail_margins_for_market, args: {country: Poland, category: home}}
    - {tool: get_typical_retail_margins_for_market, args: {country: Czechia, category: home}}
  facts: ["32", "35", ["4-14", "4 to 14"], ["6-18", "6 to 18"], ["design-conscious", "design"]]

- id: market_research-08:80:Q3
  question: "08:80:Q3"
  prompt: >
    What should we sell in Japan? Look at market size, sizes, pack formats and local competition by category, and tell
    me which categories fit best.
  ref:
    - {tool: get_market_size_and_pack_formats_for_country, args: {country: Japan}}
    - {tool: search_local_competitors_in_market, args: {country: Japan}}
  facts: ["small kitchen", "compact", "Muji", "Nitori"]

- id: market_research-08:80:Q4
  question: "08:80:Q4"
  prompt: >
    What investment would we need, and what sales should we expect, from expanding our home range in Spain? Use the
    Spanish market size and our launch results in comparable markets.
  ref:
    - {tool: get_market_size_and_growth_for_country, args: {country: Spain}}
    - {tool: get_comparable_market_launch_results, args: {category: home}}
  facts: ["Italy", "France", ["1600000", "1.6m", "1.6 million"], "47"]
