- id: ap-02:13:Q2
  question: "02:13:Q2"
  prompt: >
    We spent about £420k on air freight over the last 90 days. Split it by cause and by supplier and tell me how much
    of it was avoidable, and which suppliers account for most of the avoidable spend.
  ref:
    - {tool: get_air_spend_by_supplier, args: {date_from: -90d, group_by: supplier}}
    - {tool: calculate_avoidable_air_spend, args: {date_from: -90d}}
  facts: ["246000", ["supplier late", "supplier_late"], "SUP-0012", "SUP-0015"]

- id: ap-02:20:Q1
  question: "02:20:Q1"
  prompt: >
    Compare the last 12 months of invoices from Midshires Transport (carrier CAR-002) against the contracted rates.
    Where are we being overcharged (surcharges, accessorials, weight, wrong service level), what is the total value we
    can dispute, and which invoice has the largest overcharge? Draft the dispute letter for that invoice.
  ref:
    - {tool: calculate_dispute_value_by_charge_type, args: {carrier_id: CAR-002, date_from: -365d}}
    - {tool: compare_invoice_to_contract_rate, args: {carrier_id: CAR-002, date_from: -365d, group_by: invoice}}
    - {tool: draft_dispute_letter, args: {carrier_id: CAR-002, invoice_id: INV-000006}}
  facts: ["32905", "11035", "10860", "5850"]

- id: ap-04:35:Q1
  question: "04:35:Q1"
  prompt: >
    Supplier SUP-0053 has slipped on delivery and quality. How is our own payment record to them over the last year:
    are we paying within their terms, and how long do we take on average?
  ref:
    - {tool: get_supplier_payment_performance, args: {supplier_id: SUP-0053, days_back: 365}}
  facts: ["60", "90", "56", "63"]

- id: ap-04:35:Q5
  question: "04:35:Q5"
  prompt: >
    I am preparing the Q3 business review for supplier SUP-0012. How have we performed on paying them over the last
    year: their payment terms, average days to pay, share paid late, and anything overdue now?
  ref:
    - {tool: get_supplier_payment_performance, args: {supplier_id: SUP-0012, days_back: 365}}
  facts: ["30", "37.5", "63.6", "13800"]

- id: ap-04:36:Q5
  question: "04:36:Q5"
  prompt: >
    While cleaning up duplicate vendors I want the possible frauds. Which vendors have a fraud risk score of 70 or more
    and what indicators do they show? For the one that shares a bank account with another vendor, show its open
    invoices and put a payment hold on it as suspected fraud.
  ref:
    - {tool: list_vendor_fraud_indicators, args: {fraud_risk_score: 70}}
    - {tool: get_open_transactions_for_vendor, args: {vendor_id: VND-000048}}
    - {tool: block_supplier_payments, args: {vendor_id: VND-000048, hold_reason: Suspected fraud - shares a bank account with another vendor}}
  facts: ["VND-000048", "shared_bank_account", "41200", "18750", "payment hold"]

- id: ap-04:37:Q3
  question: "04:37:Q3"
  prompt: >
    Facilities spend is over budget. For supplier SUP-0086, look at their invoices over the last 12 months: which are
    one-off project charges rather than the regular monthly service, and how much were they?
  ref:
    - {tool: get_accounts_payable_invoices_for_supplier, args: {supplier_id: SUP-0086, date_from: -365d}}
  facts: ["287437", "259839", "179737", "roof"]

- id: ap-04:41:Q3
  question: "04:41:Q3"
  prompt: >
    The bank account of supplier SUP-0023 is in a different country from their registered address. Confirm that from
    our vendor master, then put a payment hold on them until the bank details are verified.
  ref:
    - {tool: get_vendor_master_controls, args: {supplier_id: SUP-0023}}
    - {tool: block_supplier_payments, args: {vendor_id: VND-000023, hold_reason: Bank country differs from registered address - pending verification}}
  facts: [["HK", "Hong Kong"], ["CN", "China"], "payment hold"]

- id: ap-04:41:Q6
  question: "04:41:Q6"
  prompt: >
    Which fraud indicators do we actually flag on our own vendor records today? List each indicator that shows up on
    vendors scoring 50 or more.
  ref:
    - {tool: list_vendor_fraud_indicators, args: {fraud_risk_score: 50}}
  facts: ["shared_bank_account", "bank_country_mismatch", "po_box_address", "duplicate_tax_id"]

- id: ap-07:61:Q3
  question: "07:61:Q3"
  prompt: >
    Supplier rebates that depend on annual volumes: list our active volume rebate agreements with thresholds and
    rates. From the accrual history, where did what we accrued last year differ from what the supplier settled, and
    which current accrual looks ahead of spend to date?
  ref:
    - {tool: list_supplier_rebate_agreements, args: {rebate_type: volume, status: active}}
    - {tool: get_rebate_accrual_history, args: {}}
  facts: ["SUP-0008", "4500", "7500", "6000"]

- id: ap-07:61:Q5
  question: "07:61:Q5"
  prompt: >
    Freight cost in the P&L is about £210k off the logistics system. Which freight and carrier invoices from the last
    four weeks were received but not accrued, and what do they add up to? Which freight invoices are coded to the
    wrong GL account or missing a cost centre? Then fix the coding on the invoice from carrier CAR-004: it belongs on
    GL 5102.
  ref:
    - {tool: list_unaccrued_freight_invoices, args: {date_from: -28d}}
    - {tool: list_miscoded_freight_invoices, args: {}}
    - {tool: update_invoice_gl_coding, args: {invoice_id: INV-902001, gl_account: "5102"}}
  facts: ["208822", "39130", "INV-902001", "5102"]

- id: ap-07:66:Q5-a
  question: "07:66:Q5"
  prompt: >
    Cash is tight. The non-critical payment run RUN-900002 is currently due out on the Friday of the tightest cash week,
    about six weeks from now. Delay it by one week.
  ref:
    - {tool: update_payment_run_date, args: {payment_run_id: RUN-900002, run_date: "2026-11-27"}}
  facts: ["RUN-900002", "2026-11-27"]

- id: ap-07:66:Q5-b
  question: "07:66:Q5"
  prompt: >
    Actually, rather than delaying it, cancel the non-critical payment run RUN-900002 (due out on the Friday of the
    tightest cash week, about six weeks from now) because of the liquidity squeeze.
  ref:
    - {tool: cancel_payment_run, args: {payment_run_id: RUN-900002, cancellation_reason: Liquidity constraint}}
  facts: ["RUN-900002", "cancelled"]
  scenario_context: >
    The non-critical payment run is RUN-900002, due out on the Friday of the tightest week.

- id: ap-07:68:Q1
  question: "07:68:Q1"
  prompt: >
    Audit review of vendor master changes over the last 12 months: which vendors were paid within ten days of being
    created or of a bank detail change? For the bank change that was paid soonest, with fewer approvals than the
    vendor's controls require, put that vendor on payment block for the audit.
  ref:
    - {tool: list_vendor_master_changes, args: {days_back: 365}}
    - {tool: block_vendor_for_payment, args: {vendor_id: VND-000048, hold_reason: Bank detail change with 1 of 3 required approvals paid within days}}
  facts: ["VND-000048", "VND-000071", "VND-000060", "VND-000034", "38400"]

- id: ap-07:68:Q4
  question: "07:68:Q4"
  prompt: >
    I am auditing our supplier master data and bank detail change controls. Over the last 12 months, which bank detail
    changes were approved with fewer approvals than the vendor's control setting requires, which vendors are they on,
    and how quickly after the change was the first payment made?
  ref:
    - {tool: list_bank_detail_change_requests, args: {approval_status: approved, date_from: -365d}}
    - {tool: get_vendor_master_controls, args: {}}
  facts: ["VND-000048", "VND-000071", "VND-000001", ["4", "four"]]

- id: ap-08:79:Q1
  question: "08:79:Q1"
  prompt: >
    For the supplier-fraud part of a loss prevention review over the last six months: compare what suppliers invoiced
    against what we goods-received. Which supplier repeatedly invoices more than we received, on how many invoices,
    and how much were we over-billed in total?
  ref:
    - {tool: get_goods_receipt_vs_invoice_discrepancies, args: {date_from: -180d}}
  facts: ["SUP-0020", ["five", "5"], ["72881.6", "72881.60", "72,881.60", "72882", "72,882"]]
  notes: "AP has no store or region concept: goods receipt variances can only be scoped by supplier, PO and receiving DC, not by the store region the full question covers."

- id: ap-09:85:Q2
  question: "09:85:Q2"
  prompt: >
    A supplier user account logged in from an unusual location and used the vendor bank detail screen. Have any vendor
    bank details changed in the last 14 days, and what payments have been made or are queued to those vendors? Then put
    a payment hold on that vendor because of the security incident.
  ref:
    - {tool: get_payment_runs_for_changed_vendors, args: {days_back: 14}}
    - {tool: block_vendor_payment, args: {vendor_id: VND-000001, hold_reason: Security incident - supplier account compromised and bank details changed}}
  facts: ["VND-000001", "130480", ["India", "IN"], ["payment hold", "on hold", "held", "hold"]]
