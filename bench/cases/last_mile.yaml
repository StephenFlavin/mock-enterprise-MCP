- id: last_mile-02:16:Q1-a
  question: "02:16:Q1"
  prompt: >
    First-attempt delivery success has fallen from about 93% to 88% over the last two months. Show me the weekly trend and
    break the latest four weeks down by courier, region, product and delivery option compared with the four weeks before,
    so I can tell what changed.
  ref:
    - {tool: get_first_attempt_success_trend, args: {weeks: 8}}
    - {tool: get_first_attempt_failures_by_dimension, args: {dimension: courier}}
    - {tool: get_first_attempt_failures_by_dimension, args: {dimension: region}}
    - {tool: get_first_attempt_failures_by_dimension, args: {dimension: product}}
    - {tool: get_first_attempt_failures_by_dimension, args: {dimension: delivery_option}}
  facts: [["CAR-013", "DoorStep"], "UK North", "PF-220", "door"]

- id: last_mile-02:16:Q1-b
  question: "02:16:Q1"
  prompt: >
    First-attempt delivery success has dropped over the last two months. What are the main failure reasons now compared with
    before, which postcode areas are worst, and how much would fixing the top two causes save a year in repeat deliveries and
    extra customer contacts? Is address quality part of it?
  ref:
    - {tool: list_failed_delivery_reasons, args: {}}
    - {tool: get_address_validation_failure_rate, args: {}}
    - {tool: list_worst_postcodes_by_failed_delivery, args: {}}
    - {tool: calculate_repeat_delivery_cost, args: {weeks: 4}}
  facts: ["Address not found", "M4", "L1", "13118"]

- id: last_mile-02:16:Q2-a
  question: "02:16:Q2"
  prompt: >
    Should we shift 20% of London volume from Courier A (CAR-011) to Courier B (CAR-012)? Compare six months of on-time
    performance, damage rate, cost per drop and complaint rate for each in London.
  ref:
    - {tool: get_courier_scorecard, args: {region: London}}
    - {tool: get_cost_per_drop_by_courier, args: {region: London}}
    - {tool: get_damage_rate_by_courier, args: {region: London}}
    - {tool: get_complaint_rate_by_courier, args: {region: London}}
  facts: ["90.5", "85.7", "3.31", "2.34", "4.09"]

- id: last_mile-02:16:Q2-b
  question: "02:16:Q2"
  prompt: >
    Draft a six-week trial plan to move 20% of London volume to Courier B (CAR-012). Once I approve it, set the trial up in the
    allocation rules, covering only the north London postcodes N1, N4, N7, N15, N16 and NW1.
  ref:
    - {tool: draft_courier_trial_plan, args: {courier_id: CAR-012, volume_share_pct: 20, region: London, trial_postcode_areas: "N1,N4,N7,N15,N16,NW1"}}
    - {tool: create_courier_allocation_rule, args: {rule_name: "North London trial", courier_id: CAR-012, postcode_areas: "N1,N4,N7,N15,N16,NW1", volume_share_pct: 20, region: London}}
  facts: ["CAR-012", "20", "N1", "NW1"]

- id: last_mile-02:16:Q3-a
  question: "02:16:Q3"
  prompt: >
    Where are we most likely to see courier delays in peak? Use the last two Nov-Dec peaks, and tell me what weekly courier
    capacity we would need by region if peak volume grows 12% on last peak. How bad were the worst days last year?
  ref:
    - {tool: get_historical_peak_delivery_performance, args: {}}
    - {tool: list_worst_delivery_days, args: {peak_season: last_peak}}
    - {tool: calculate_courier_capacity_gap_by_region, args: {growth_pct: 12}}
  facts: ["Scotland", "UK North", "63.8", "525"]

- id: last_mile-02:16:Q4-a
  question: "02:16:Q4"
  prompt: >
    Show our delivery volumes by UK and EU city, and what the announced low-emission zone, parking and delivery-window rules
    add to cost per drop in those cities. Which cities are hardest hit?
  ref:
    - {tool: get_delivery_volumes_by_city, args: {}}
    - {tool: calculate_cost_per_drop_impact, args: {}}
  facts: ["London", "Dublin", "40.5", "0.75"]

- id: last_mile-02:16:Q5-a
  question: "02:16:Q5"
  prompt: >
    Where-is-my-order contacts are up about 30% on last month. From the delivery side, are late scans, missed delivery
    promises or poor tracking updates behind it? Which orders have a missed scan in the last two weeks, and which courier is
    behind most of them?
  ref:
    - {tool: list_orders_with_missed_scans, args: {weeks: 2}}
    - {tool: get_delivery_promise_accuracy, args: {}}
    - {tool: get_tracking_update_latency, args: {}}
  facts: [["CAR-013", "DoorStep"], "82.6", "5.3", "1.9"]
