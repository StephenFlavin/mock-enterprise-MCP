- id: freight_rates-02:11:Q4-a
  question: "02:11:Q4"
  prompt: >
    Looking only at the north region (stores in UK North), what are the spot road rates per load on each DC-to-store lane now
    and as quoted for Black Friday week and Christmas week? Which lane is dearest at Christmas and how far above the standard rate is it?
  ref:
    - {tool: get_spot_market_rates_by_lane, args: {region: UK North}}
  facts: ["DC3-ST148", "390", "355", "36.8"]

- id: freight_rates-02:12:Q1-a
  question: "02:12:Q1"
  prompt: >
    Ho Chi Minh City (port VNSGN) to Felixstowe (GBFXT) and to Rotterdam (NLRTM), 40ft containers: what are the current spot rate
    and our contract rate on each, and how has the spot rate moved over the last 12 weeks?
  ref:
    - {tool: get_spot_container_rates_by_lane, args: {origin_port: VNSGN, destination_port: GBFXT}}
    - {tool: get_spot_container_rates_by_lane, args: {origin_port: VNSGN, destination_port: NLRTM}}
    - {tool: get_contract_container_rates_by_lane, args: {origin_port: VNSGN, destination_port: GBFXT}}
    - {tool: get_contract_container_rates_by_lane, args: {origin_port: VNSGN, destination_port: NLRTM}}
    - {tool: get_rate_trend_by_lane, args: {lane_id: VNSGN-GBFXT, weeks_back: 12}}
    - {tool: get_rate_trend_by_lane, args: {lane_id: VNSGN-NLRTM, weeks_back: 12}}
  facts: ["2460", "1750", "29.5", "2500", "1820", "25"]

- id: freight_rates-02:12:Q1-b
  question: "02:12:Q1"
  prompt: >
    And Ho Chi Minh City (port VNSGN) to Los Angeles (USLAX), 40ft containers: current spot rate, our contract rate, and the spot trend
    over the last 12 weeks. How does spot compare with contract?
  ref:
    - {tool: get_spot_container_rates_by_lane, args: {origin_port: VNSGN, destination_port: USLAX}}
    - {tool: get_contract_container_rates_by_lane, args: {origin_port: VNSGN, destination_port: USLAX}}
    - {tool: get_rate_trend_by_lane, args: {lane_id: VNSGN-USLAX, weeks_back: 12}}
  facts: ["2950", "3050", "3250", "-9.2"]
  notes: "Master ports has no Los Angeles (USLAX), so the code is not a master id; Ho Chi Minh City is VNSGN in master."

- id: freight_rates-02:12:Q3-a
  question: "02:12:Q3"
  prompt: >
    Will rates spike before Lunar New Year? Using the SCFI index over the last three years, how much did it rise in the eight weeks up to Lunar New Year
    week each time? And what share of our VNSGN-GBFXT container volume is booked on contract versus spot at the moment?
  ref:
    - {tool: get_rate_index_history, args: {index_name: SCFI, weeks_back: 156}}
    - {tool: get_contract_vs_spot_mix, args: {lane_id: VNSGN-GBFXT}}
  facts: ["20.5", "16.3", "24", "57.5"]

- id: freight_rates-02:12:Q5-a
  question: "02:12:Q5"
  prompt: >
    Carrier CAR-007 has 80 containers of ours planned on VNSGN-NLRTM (Ho Chi Minh City to Rotterdam) over the next two months.
    Which surcharges will hit those bookings, and what do they add up to in extra cost?
  ref:
    - {tool: calculate_surcharge_impact_on_bookings, args: {lane_id: VNSGN-NLRTM, booking_volume_units: 80, carrier_id: CAR-007}}
  facts: ["congestion", "250", "30000"]

- id: freight_rates-02:12:Q6-a
  question: "02:12:Q6"
  prompt: >
    Northern European ports are congested. For 40ft containers from Ho Chi Minh City (VNSGN) into Northampton DC1, compare going direct via Felixstowe (GBFXT)
    with going via Valencia or Piraeus plus rail: through-rate per box, extra cost against direct, and transit time.
  ref:
    - {tool: get_ocean_and_rail_rate_quote, args: {origin_port: VNSGN, destination_port: GBFXT}}
  facts: ["3010", "3020", "2750", "260", "270"]
  notes: "Master ports has no Valencia (ESVLC) or Piraeus (GRPIR); the codes are used as-is."

- id: freight_rates-02:13:Q1-a
  question: "02:13:Q1"
  prompt: >
    Style 7731 is made in Turkey and we want to airfreight 6,000 units at 0.33 kg each from Istanbul (IST) to London Heathrow (LHR). What would that cost
    per carrier and how long does it take? And what would it cost if we only air 3,000 units?
  ref:
    - {tool: get_air_freight_quote, args: {origin_airport: IST, destination_airport: LHR, weight_kg: 1980}}
    - {tool: get_air_freight_quote, args: {origin_airport: IST, destination_airport: LHR, weight_kg: 990}}
  facts: ["4059", "2277", "CAR-008"]

- id: freight_rates-02:13:Q3-a
  question: "02:13:Q3"
  prompt: >
    What are the current air freight rates per kg for a 2,000 kg shipment from Dhaka (DAC) and from Ho Chi Minh City (SGN) to London (LHR),
    and how do they compare with a year ago?
  ref:
    - {tool: get_air_freight_rates_by_origin, args: {origin_airport: DAC, destination_airport: LHR}}
    - {tool: get_air_freight_rates_by_origin, args: {origin_airport: SGN, destination_airport: LHR}}
    - {tool: get_air_rate_history, args: {origin_airport: DAC, destination_airport: LHR}}
    - {tool: get_air_rate_history, args: {origin_airport: SGN, destination_airport: LHR}}
  facts: ["3.2", "3.55", "8.8", "-9.7"]

- id: freight_rates-02:13:Q4-a
  question: "02:13:Q4"
  prompt: >
    I'm budgeting air freight for peak. What are the peak season rates per kg for shipments of about 3,000 kg from Dhaka (DAC) and from
    Ho Chi Minh City (SGN) to London (LHR), against the normal rates?
  ref:
    - {tool: get_air_freight_rates_by_origin, args: {origin_airport: DAC, destination_airport: LHR}}
    - {tool: get_air_freight_rates_by_origin, args: {origin_airport: SGN, destination_airport: LHR}}
  facts: ["3.4", "2.95", "3.75", "3.3"]

- id: freight_rates-02:13:Q5-a
  question: "02:13:Q5"
  prompt: >
    500 units of a hero product (about 0.8 kg each, so 400 kg) are stuck at a factory near Dhaka and must reach London within 12 days.
    What does straight air from DAC to LHR cost, what does sea-air via Dubai cost and how long does it take, and which sea-air option makes the deadline?
  ref:
    - {tool: get_air_freight_quote, args: {origin_airport: DAC, destination_airport: LHR, weight_kg: 400}}
    - {tool: get_sea_air_routing_quote, args: {origin_airport: DAC, destination_airport: LHR, weight_kg: 400}}
  facts: ["1440", "840", ["Atlas Logistics Partners", "CAR-010"]]

- id: freight_rates-02:19:Q3-a
  question: "02:19:Q3"
  prompt: >
    The vessel with our containers is stuck outside Rotterdam. If we fly replacement priority stock, what is the air freight quote for 6,000 kg
    from Ho Chi Minh City (SGN) to London (LHR), per carrier?
  ref:
    - {tool: get_air_freight_quote, args: {origin_airport: SGN, destination_airport: LHR, weight_kg: 6000}}
  facts: ["18600", "21300", "CAR-008"]

- id: freight_rates-02:20:Q1-a
  question: "02:20:Q1"
  prompt: >
    We are checking carrier invoices from CAR-002 against the contract. What rates are contracted, what is the fuel surcharge cap, and what accessorial
    charges (tail lift, waiting time) can be billed?
  ref:
    - {tool: get_carrier_contract_rates, args: {carrier_id: CAR-002}}
  facts: ["17.2", "645", "12%", "42"]

- id: freight_rates-02:20:Q2-a
  question: "02:20:Q2"
  prompt: >
    Are our parcel rates competitive? Compare our contracted rates for each parcel service (standard, express, next-day) with the market benchmark
    and tell me which service is furthest above market.
  ref:
    - {tool: get_parcel_rates_by_service, args: {}}
    - {tool: get_market_benchmark_rates, args: {mode: parcel}}
    - {tool: compare_rates_to_benchmark, args: {mode: parcel}}
  facts: ["next-day", "16.7", "8.5"]
