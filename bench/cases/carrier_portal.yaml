- id: carrier_portal-02:11:Q1-a
  question: "02:11:Q1"
  prompt: >
    Are there any carrier service disruptions on our road lanes to stores this week? Which carriers and lanes are
    affected, and what is the cause?
  ref:
    - {tool: search_carrier_service_alerts, args: {}}
  facts: [["Midshires", "CAR-002"], "DC1-ST215", "DC1-ST214", "DC1-ST148", "driver shortage"]

- id: carrier_portal-02:11:Q2-a
  question: "02:11:Q2"
  prompt: >
    For our northern drops DC1-ST150 (Leeds), DC1-ST151 (Manchester), DC1-ST148 (Newcastle) and DC1-ST207 (Glasgow),
    what do our three road carriers CAR-001, CAR-002 and CAR-003 charge per pallet on standard service? And what does the
    pallet network Pallet Exchange publish for the same lanes: its rates, its on-time performance (including in peak) and
    its contract terms?
  ref:
    - {tool: get_carrier_rate_card, args: {lanes: "DC1-ST150,DC1-ST151,DC1-ST148,DC1-ST207", service_type: standard}}
    - {tool: get_pallet_network_rate_card, args: {network_name: "Pallet Exchange", lanes: "DC1-ST150,DC1-ST151,DC1-ST148,DC1-ST207"}}
  facts: ["14.2", "13.7", "96.2", "91.4", "90 days"]

- id: carrier_portal-02:11:Q4-a
  question: "02:11:Q4"
  prompt: >
    We are short of contracted capacity on lane DC1-ST215 (Dundee) for Black Friday and Christmas. Ask carrier CAR-001
    for 200 extra pallets a week on that lane for week 48 and weeks 51 and 52.
  ref:
    - {tool: send_capacity_request_to_carrier, args: {carrier_id: CAR-001, lane: DC1-ST215, weeks_needed: "weeks 48, 51-52", units_requested: 200}}
  facts: ["200", "DC1-ST215"]

- id: carrier_portal-02:12:Q2-a
  question: "02:12:Q2"
  prompt: >
    Our contract with Carrier A (CAR-010) expires in January. On the Asia-Europe lane over the last 12 months, compare
    its schedule reliability, roll rate, share of our volume and standard rate per container with Carrier B (CAR-006)
    and Carrier C (CAR-007).
  ref:
    - {tool: compare_carrier_performance, args: {lane: Asia-Europe, carrier_ids: "CAR-010,CAR-006,CAR-007"}}
    - {tool: get_carrier_schedule_reliability, args: {lane: Asia-Europe}}
    - {tool: get_roll_rate_by_carrier_and_lane, args: {lane: Asia-Europe}}
    - {tool: get_carrier_share_of_volume, args: {lane: Asia-Europe}}
  facts: ["72.4", "76.8", "15.5", "27.7", "3050"]

- id: carrier_portal-02:12:Q4-a
  question: "02:12:Q4"
  prompt: >
    About 18% of our Asia-Europe bookings were rolled last quarter. Which carriers rolled us most often, and what were
    their roll rates?
  ref:
    - {tool: get_roll_rate_by_carrier_and_lane, args: {lane: Asia-Europe, period: last_quarter}}
  facts: [["Pacific Star Shipping", "CAR-006"], "26.2", ["Meridian Ocean Lines", "CAR-007"], "21.7"]

- id: carrier_portal-02:12:Q5-a
  question: "02:12:Q5"
  prompt: >
    What have carriers announced on Asia-Europe for the next couple of months? I need the blank sailings (which ports
    lose a call) and the surcharges with their size.
  ref:
    - {tool: search_carrier_blank_sailing_notices, args: {lane: Asia-Europe}}
    - {tool: search_carrier_surcharge_announcements, args: {lane: Asia-Europe}}
  facts: [["Rotterdam", "NLRTM"], ["Hamburg", "DEHAM"], "12.5", "400"]

- id: carrier_portal-02:16:Q3-a
  question: "02:16:Q3"
  prompt: >
    For peak, what weekly parcel capacity have our couriers committed in each UK region, which region has the least
    in total, and what are the peak-week order cut-off times for UK North?
  ref:
    - {tool: get_courier_capacity_commitments, args: {}}
    - {tool: get_courier_cut_off_times, args: {region: UK North}}
  facts: ["7500", "24500", "43500", "13:30"]

- id: carrier_portal-02:20:Q1-a
  question: "02:20:Q1"
  prompt: >
    Submit a dispute to carrier CAR-002 for 18,450 pounds of fuel surcharge billed above the contracted rate across
    the last 12 months of invoices.
  ref:
    - {tool: submit_carrier_invoice_dispute, args: {carrier_id: CAR-002, period_from: -365d, dispute_reason: "Fuel surcharge billed above contracted rate", disputed_amount_gbp: 18450}}
  facts: ["18450", "fuel surcharge"]

- id: carrier_portal-02:20:Q4-a
  question: "02:20:Q4"
  prompt: >
    What rate increases have carriers announced that take effect from now on? Which carriers announced the biggest
    increases, and by how much?
  ref:
    - {tool: search_carrier_rate_increase_announcements, args: {}}
  facts: [["DoorStep Couriers", "CAR-013"], "8.2", ["Pennine Freight", "CAR-003"], ["ParcelPoint Express", "CAR-012"]]

- id: carrier_portal-02:20:Q5-a
  question: "02:20:Q5"
  prompt: >
    Carrier CAR-002's damage claims doubled last quarter compared with the quarter before (take 90 days each). What
    explains it: which dispatching depots, products, packaging types and lanes do the claims come from?
  ref:
    - {tool: list_damage_claims_by_carrier, args: {carrier_id: CAR-002, date_from: -90d}}
    - {tool: get_damage_claims_by_dimension, args: {carrier_id: CAR-002, date_from: -90d}}
    - {tool: list_damage_claims_by_carrier, args: {carrier_id: CAR-002, date_from: -180d, date_to: -91d}}
  facts: [["Northampton DC", "DC1"], ["K-1700", "Glass Kettle"], "carton", "DC1-ST215"]

- id: carrier_portal-02:20:Q5-b
  question: "02:20:Q5"
  prompt: >
    File the two draft damage claims CLM-900019 and CLM-900020 with the carrier.
  ref:
    - {tool: submit_carrier_damage_claim, args: {claim_id: CLM-900019}}
    - {tool: submit_carrier_damage_claim, args: {claim_id: CLM-900020}}
  facts: ["CLM-900019", "CLM-900020", "submitted"]

- id: carrier_portal-04:40:Q3-a
  question: "04:40:Q3"
  prompt: >
    Breakage on glass items is up 40%. What are our road carriers' damage rates on glass items over the last 12 months,
    and which carrier and lanes stand out?
  ref:
    - {tool: get_carrier_damage_rates, args: {product_group: glass}}
  facts: [["Midshires", "CAR-002"], "DC1-ST215", "4.15", "3.9"]

- id: carrier_portal-08:74:Q2-a
  question: "08:74:Q2"
  prompt: >
    On parcel lane DC2-GB, what daily capacity do our carriers have from Black Friday to Christmas Eve? Which carrier
    has the least headroom in the last two weeks before Christmas? Then ask that carrier for 3,000 extra parcels a day
    for those two weeks (weeks 51-52).
  ref:
    - {tool: get_carrier_capacity_by_day, args: {lane: DC2-GB, date_from: +45d}}
    - {tool: send_capacity_request_to_carrier, args: {carrier_id: CAR-013, lane: DC2-GB, weeks_needed: "weeks 51-52", units_requested: 3000}}
  facts: [["DoorStep Couriers", "CAR-013"], "16000", "3000"]

- id: carrier_portal-08:75:Q1-a
  question: "08:75:Q1"
  prompt: >
    Wholesale customer PTN-001's last four orders are ORD-900070, ORD-900071, ORD-900072 and ORD-900073. From the
    carrier's side, which of them did the carrier deliver in full and which did it fail on, and what happened to
    the one that went missing? Then file a claim against that carrier for the missing order at its full value of 19,200
    pounds (600 units of SKU-100469, shipped on pallets).
  ref:
    - {tool: get_carrier_delivery_record_for_order, args: {order_id: ORD-900070}}
    - {tool: get_carrier_delivery_record_for_order, args: {order_id: ORD-900071}}
    - {tool: get_carrier_delivery_record_for_order, args: {order_id: ORD-900072}}
    - {tool: get_carrier_delivery_record_for_order, args: {order_id: ORD-900073}}
    - {tool: create_carrier_claim, args: {carrier_id: CAR-003, order_ref: ORD-900071, lane: DC1-UK South, sku: SKU-100469, package_type: pallet, amount_gbp: 19200, claim_notes: "600 units lost in transit, no proof of delivery"}}
  facts: ["ORD-900071", ["Pennine Freight", "CAR-003"], "proof of delivery", "19200"]

- id: carrier_portal-09:82:Q1-a
  question: "09:82:Q1"
  prompt: >
    For modelling ocean transit time on our Asia-Europe and Asia-UK lanes over the last 12 months, how do actual
    transit times compare with what each carrier quotes, and how variable are they? Which carrier slips the most
    against its quote on each lane?
  ref:
    - {tool: get_carrier_eta_vs_actual_by_lane, args: {lane: Asia}}
  facts: [["Pacific Star Shipping", "CAR-006"], "2.8", "2.6", "5.1"]

- id: carrier_portal-09:88:Q6-a
  question: "09:88:Q6"
  prompt: >
    We are weighing in-sourcing against outsourcing transport. How do our three outsourced UK road carriers perform
    today over the last 12 months (reliability, on-time, roll and damage rates), and which is best and worst?
  ref:
    - {tool: get_carrier_performance, args: {mode: road}}
  facts: [["Northline Haulage", "CAR-001"], "98.5", ["Pennine Freight", "CAR-003"], "85.6"]
