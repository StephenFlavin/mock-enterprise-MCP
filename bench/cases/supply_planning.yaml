- id: supply_planning-01:6:Q2
  question: "01:6:Q2"
  prompt: >
    Will we run out of pallet positions at Northampton DC (DC1) this autumn? Project utilisation week by week from
    current stock and the inbound purchase orders: when do we first go over capacity, by how many positions at the
    worst point, and which product categories are driving the growth?
  ref:
    - {tool: calculate_projected_space_utilisation, args: {site_id: DC1}}
  facts: ["2026-11-02", "44", "Smart Home", "Cookware"]

- id: supply_planning-02:19:Q5
  question: "02:19:Q5"
  prompt: >
    A northern Europe port closure at Rotterdam (NLRTM) is expected to run two weeks. What happens to stock cover by
    category, and which DCs and regions are hit first? And what changes if it runs four weeks?
  ref:
    - {tool: run_port_closure_scenario, args: {port_code: NLRTM, closure_weeks: 2}}
    - {tool: run_port_closure_scenario, args: {port_code: NLRTM, closure_weeks: 4}}
  facts: ["Haircare", "Dresses", "EU Central", "Smart Home"]

- id: supply_planning-03:24:Q2
  question: "03:24:Q2"
  prompt: >
    There's a 25,000-unit gap between demand and confirmed supply in about three weeks on our core denim (trousers)
    range, made by SUP-0008. The options are expediting two weeks from SUP-0008, splitting 50/50 with SUP-0036, or
    shifting the promotion. Show me the gap by SKU, then compare the options on cost per unit above plan, service
    level and risk. Use SKU-102884, the biggest SKU in the gap, for the costings.
  ref:
    - {tool: get_supply_demand_gap_for_product, args: {category: Trousers, week_from: "+14d", week_to: "+28d"}}
    - {tool: calculate_expedite_cost, args: {sku: SKU-102884, supplier_id: SUP-0008, quantity_units: 25000, expedite_weeks: 2}}
    - {tool: calculate_split_sourcing_cost, args: {sku: SKU-102884, total_quantity: 25000, primary_supplier_id: SUP-0008, secondary_supplier_id: SUP-0036}}
    - {tool: compare_supply_gap_options, args: {sku: SKU-102884, gap_units: 25000, supplier_id: SUP-0008, secondary_supplier_id: SUP-0036}}
  facts: ["SKU-102891", "5.65", "0.4", "410000"]
  notes: "Master data has no denim category, so the core denim range is taken as the Trousers category (mill SUP-0008, style STY-6083), as the supplier_portal and pricing cases do."

- id: supply_planning-03:24:Q3
  question: "03:24:Q3"
  prompt: >
    Metal zips (component ZIP_METAL) are in short supply for Q1 production. What would it cost to buy 500,000 of them
    eight weeks ahead in working capital and storage, how much price rise would that avoid, and is buying ahead worth it?
  ref:
    - {tool: calculate_buy_ahead_cost, args: {component_id: ZIP_METAL, quantity_units: 500000, advance_weeks: 8}}
  facts: ["1987.69", "3136", "buy ahead"]
  notes: "Master data has no components, so buy-ahead cost is by commodity component id (ZIP_METAL, ZIP_PLASTIC), not by SKU."

- id: supply_planning-03:24:Q4
  question: "03:24:Q4"
  prompt: >
    Any fabric shortages coming? Which product categories are most exposed, which fabric is short in each, and which
    suppliers are most at risk?
  ref:
    - {tool: get_fabric_requirements_by_category, args: {}}
  facts: ["Knitwear", "Dresses", "Blouses", "SUP-0001", "SUP-0003", "SUP-0012"]

- id: supply_planning-03:24:Q5
  question: "03:24:Q5"
  prompt: >
    Supplier SUP-0022 quotes about 22.6 days but we actually get about 32.4, a gap of roughly 10 days. What does a
    10-day gap do to inventory and service across the SKUs it supplies? Then update the planning lead time for
    SUP-0022 to 32 days.
  ref:
    - {tool: calculate_lead_time_gap_inventory_impact, args: {supplier_id: SUP-0022, gap_days: 10}}
    - {tool: update_planning_lead_time_for_supplier, args: {supplier_id: SUP-0022, planning_lead_days: 32}}
  facts: ["14996", "286312", "21.6", "32"]

- id: supply_planning-03:28:Q3
  question: "03:28:Q3"
  prompt: >
    What are our current sea lead times from Asian origin ports into Northampton DC (DC1), which origin is slowest, and
    what would each be if lead times from Asia got two weeks longer?
  ref:
    - {tool: get_lead_times_by_origin, args: {origin_region: Asia, dest_dc: DC1, mode: sea, extra_days: 14}}
  facts: ["BDCGP", "40", "54", "49"]

- id: supply_planning-03:28:Q4
  question: "03:28:Q4"
  prompt: >
    Switch the five best long-tail candidates to make to order: SKU-101253, SKU-105054, SKU-101617, SKU-102387 and
    SKU-103038. Tell me what policy each had before.
  ref:
    - {tool: update_sku_sourcing_policy, args: {sku: SKU-101253, sourcing_policy: make_to_order}}
    - {tool: update_sku_sourcing_policy, args: {sku: SKU-105054, sourcing_policy: make_to_order}}
    - {tool: update_sku_sourcing_policy, args: {sku: SKU-101617, sourcing_policy: make_to_order}}
    - {tool: update_sku_sourcing_policy, args: {sku: SKU-102387, sourcing_policy: make_to_order}}
    - {tool: update_sku_sourcing_policy, args: {sku: SKU-103038, sourcing_policy: make_to_order}}
  facts: [["make to order", "make_to_order"], "stocked"]

- id: supply_planning-03:30:Q1
  question: "03:30:Q1"
  prompt: >
    The planning system proposed an order of 12,000 units for SKU-102961, which sells about 790 a week. Trace the
    calculation and tell me what caused the quantity. Then cancel that proposal, tell me which other items could have
    the same problem, and correct the parameter that caused it by setting it to 500.
  ref:
    - {tool: get_order_proposal_calculation_trace, args: {sku: SKU-102961}}
    - {tool: get_item_planning_parameters, args: {sku: SKU-102961}}
    - {tool: list_items_with_similar_parameter_issue, args: {issue_type: pack_size_too_large}}
    - {tool: cancel_order_proposal, args: {proposal_id: ORP-900001, cancel_reason: Pack size misconfigured}}
    - {tool: update_item_planning_parameters, args: {sku: SKU-102961, pack_size: 500}}
  facts: [["pack size", "pack_size"], "10000", "SKU-106251", "SKU-102338", "SKU-102352"]

- id: supply_planning-04:35:Q4
  question: "04:35:Q4"
  prompt: >
    Supplier SUP-0068 is our largest packaging supplier. If it failed for six weeks, which of its SKUs would run out
    first, how many would run out in total, and what is the revenue and margin at risk?
  ref:
    - {tool: calculate_supplier_disruption_impact, args: {supplier_id: SUP-0068, outage_weeks: 6}}
  facts: ["SKU-104536", "SKU-101022", "6 of 20", "2004806", "1433991"]
  notes: "Master data has no packaging supplier, so SUP-0068 (the beauty supplier the inventory and purchasing cases use) stands in for the largest packaging supplier."

- id: supply_planning-04:39:Q7
  question: "04:39:Q7"
  prompt: >
    When should we buy leather for next autumn? Show the monthly leather requirement from planned demand, which month
    is the peak, and by when that month's order has to be placed given the supplier lead time.
  ref:
    - {tool: get_material_requirements_forecast, args: {material_type: leather}}
  facts: ["2027-04-01", "93100", "2026-12-10"]

- id: supply_planning-05:50:Q2
  question: "05:50:Q2"
