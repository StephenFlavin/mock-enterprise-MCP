- id: supply_planning-05:50:Q4
  question: "05:50:Q4"
  prompt: >
    Baxter Trading (SUP-0044) is our single point of failure in Menswear. As one way to mitigate it, what would it
    cost per year to hold six extra weeks of demand as buffer stock on its biggest line, SKU-105075? Give me the
    units, the stock value and the annual holding cost.
  ref:
    - {tool: calculate_buffer_stock_cost, args: {sku: SKU-105075, buffer_weeks: 6}}
  facts: ["5492", "236705", "59176"]

- id: supply_planning-08:78:Q2
  question: "08:78:Q2"
  prompt: >
    We are running a 3 for 2 on toiletries for four weeks in January, with SKU-104599 as the biggest line. Show its
    weekly supply plan through the promotion: when does stock run out, and with the promotion uplift how many units
    are unmet by the end of the promotion? Then raise a supply request at DC1 for that quantity, needed by the first
    week of the promotion.
  ref:
    - {tool: get_supply_plan_for_product, args: {sku: SKU-104599, week_from: +12w, week_to: +16w}}
    - {tool: create_supply_request_for_promotion, args: {sku: SKU-104599, site_id: DC1, quantity_requested: 2200, requirement_date: +13w}}
  facts: ["2026-12-28", "526", "2200", "0"]

- id: supply_planning-08:78:Q5
  question: "08:78:Q5"
  prompt: >
    Three promotions in the next six weeks need stock: SKU-100707 (PROMO-900004) needs 600 units and 200 are
    confirmed, SKU-100784 (PROMO-001014) needs 700 and 450 are confirmed, and SKU-100280 (PROMO-001002) needs 1,200 and
    1,000 are confirmed. What is the shortfall and stock-out risk for each, which is at highest risk, and how much
    revenue is at stake on it?
  ref:
    - {tool: calculate_stock_shortfall_for_promotion, args: {sku: SKU-100707, promotion_volume: 600, current_stock: 200}}
    - {tool: calculate_stock_shortfall_for_promotion, args: {sku: SKU-100784, promotion_volume: 700, current_stock: 450}}
    - {tool: calculate_stock_shortfall_for_promotion, args: {sku: SKU-100280, promotion_volume: 1200, current_stock: 1000}}
  facts: ["SKU-100707", "400", "250", "200", "18396"]
