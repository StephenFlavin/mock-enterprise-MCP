- id: data_quality-09:81:Q1
  question: "09:81:Q1"
  prompt: >
    OTIF fell from 94% to 89% last month. Before I take that to the ops director, how reliable is the
    OTIF_daily data behind it? Check its completeness, timeliness and consistency and tell me whether
    anything changed in how it is measured.
  ref:
    - {tool: run_data_quality_checks, args: {dataset: OTIF_daily}}
  facts: ["grace day", "8 hours", "92"]

- id: data_quality-09:81:Q6
  question: "09:81:Q6"
  prompt: >
    What are the three most serious unresolved data quality problems hurting our reporting, and who owns
    each one? Which of them has kept coming back after being closed? Then reassign that most-reopened
    issue to EMP-00097.
  ref:
    - {tool: list_data_quality_issues, args: {}}
    - {tool: reassign_data_quality_issue, args: {issue_id: DQI-900003, owner: EMP-00097}}
  facts: ["demand forecast", "cost centre", "ASN feed", "EMP-00098", "EMP-00097"]

- id: data_quality-09:82:Q2
  question: "09:82:Q2"
  prompt: >
    The demand forecast model has been getting worse for about three months. Was there any upstream
    pipeline, schema or source change to the demand_forecast data around then, and what changed?
  ref:
    - {tool: list_pipeline_and_schema_changes, args: {dataset: demand_forecast, date_from: -120d}}
  facts: ["category field", "schema", "2026-07-07"]

- id: data_quality-09:90:Q2
  question: "09:90:Q2"
  prompt: >
    Data migration is three weeks behind. Which migration objects are blocked on source data quality,
    what are their quality scores, what exactly is blocking each, and who owns the fix?
  ref:
    - {tool: get_data_quality_scores_for_migration_objects, args: {status: blocked}}
  facts: ["78.3", "75.7", "PO status mapping", "supplier consolidation mapping"]
