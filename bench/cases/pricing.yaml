- id: pricing-03:23:Q1
  question: "03:23:Q1"
  prompt: >
    Outerwear forecast bias was +18% last month and I'm decomposing it. For the promotion and pricing part: what
    promotions on outerwear ran or were planned over the last couple of months (and what happened to each), and
    which outerwear price changes went through in the last three months and by how much?
  ref:
    - {tool: get_promotion_calendar_for_category, args: {category: Outerwear, weeks_back: 8}}
    - {tool: get_price_changes_for_category, args: {category: Outerwear, lookback_weeks: 13}}
  facts: ["Autumn Outerwear Sale", "cancelled", "5.1", "5.4", "5.5"]

- id: pricing-03:23:Q2
  question: "03:23:Q2"
  prompt: >
    We're launching a new recycled-polyester backpack range. Use SKU-103423 (Rust Bag) as the comparable: where does
    its price sit against the rest of the bags category, and what is the category's target price positioning?
  ref:
    - {tool: get_price_positioning_for_product, args: {sku: SKU-103423}}
  facts: [["mid market", "mid-market"], "0.74", "38.99"]

- id: pricing-03:23:Q4
  question: "03:23:Q4"
  prompt: >
    What uplift should I assume for 25% off kitchenware? How much of that is cannibalisation versus incremental, and
    how big was the sales dip afterwards the last time we ran 25% off kitchenware?
  ref:
    - {tool: get_promotion_uplift_estimate, args: {category: Cookware, discount_pct: 25}}
    - {tool: get_cannibalisation_estimate, args: {category: Cookware, promotion_depth_pct: 25}}
    - {tool: get_post_promotion_dip_for_category, args: {category: Cookware, promotion_depth_pct: 25}}
  facts: [["58.3", "58"], ["35.7", "36"], ["64.3", "64"], "18", "3"]

- id: pricing-03:23:Q6
  question: "03:23:Q6"
  prompt: >
    If cost-of-living pressure gets worse and real household income falls 3%, which categories' demand holds up
    best, and what downside adjustment does that imply for them? Use income elasticity by category.
  ref:
    - {tool: calculate_category_demand_elasticity_to_income, args: {income_change_pct: -3}}
  facts: ["Schoolwear", "Babywear", "Bodycare", ["-0.5", "0.5"]]

- id: pricing-03:24:Q2
  question: "03:24:Q2"
  prompt: >
    We have a supply gap on the core denim range in about three weeks and one option is shifting promotion timing.
    What promotions are scheduled on denim over the next ten weeks, with their depth and dates?
  ref:
    - {tool: get_promotion_calendar_for_category, args: {category: Trousers, weeks_ahead: 10}}
  facts: ["Denim Days", "2026-10-26", "Pre-Christmas Denim", "2026-12-07"]
  notes: "Master data has no denim category; denim is treated as the Trousers category (the category title lists denim and jeans as everyday names), as the tax_duty and po systems do."

- id: pricing-03:25:Q1
  question: "03:25:Q1"
  prompt: >
    Women's knitwear margin was 3.2 points below plan last month. For the markdown part: how much markdown cost did
    womenswear knitwear carry over the last four weeks, as a share of full-price value, and how does that compare with
    the four weeks before?
  ref:
    - {tool: get_markdown_spend_by_category, args: {category: Knitwear, department: Womenswear, lookback_weeks: 4}}
  facts: [["75765", "75,765"], "34.2", ["22940", "22,940"], "20"]

- id: pricing-03:25:Q3
  question: "03:25:Q3"
  prompt: >
    The autumn range is selling slower than planned. For bedding line SKU-103472 with 2,400 units in stock, selling
    about 150 a week with 10 selling weeks left: if that carries on and we clear what's left with a markdown, how many
    units are left at season end, what does the markdown cost and where does closing stock land? What would starting
    a 20% markdown three weeks earlier do to margin compared with the planned 30% markdown in week 8?
  ref:
    - {tool: calculate_markdown_cost_projection, args: {sku: SKU-103472, stock_on_hand: 2400, weekly_baseline_units: 150, weeks_remaining: 10}}
    - {tool: calculate_earlier_markdown_impact, args: {sku: SKU-103472, stock_on_hand: 2400, weekly_baseline_units: 150, current_markdown_depth_pct: 30, earlier_markdown_depth_pct: 20, weeks_earlier: 3}}
  facts: ["900", ["25647", "25,647"], "318", ["1365", "1,365"]]

- id: pricing-03:25:Q4
  question: "03:25:Q4"
  prompt: >
    Bedding and Towels are going to end the season heavy on stock. Flag both categories for an early markdown review.
  ref:
    - {tool: create_markdown_review_request, args: {category: Bedding, review_reason: "Projected to end the season heavy on stock"}}
    - {tool: create_markdown_review_request, args: {category: Towels, review_reason: "Projected to end the season heavy on stock"}}
  facts: ["Bedding", "Towels"]

- id: pricing-03:29:Q1
  question: "03:29:Q1"
  prompt: >
    The 30% markdown on men's jacket style STY-4102 didn't move stock. How has each size sold so far, and what would
    a 40% depth do to weekly units, unit margin and clearance time on the large (SKU-100168) compared with the current
    30%? Then take the live markdown on the large to 40%.
  ref:
    - {tool: get_markdown_performance_for_product, args: {style_id: STY-4102}}
    - {tool: calculate_markdown_depth_scenario, args: {sku: SKU-100168}}
    - {tool: update_markdown_price_for_product, args: {markdown_id: MDE-900103, markdown_depth_pct: 40}}
  facts: ["8.2", "55", "18.8", ["31.1", "31"], ["13.01", "13"]]

- id: pricing-03:29:Q2
  question: "03:29:Q2"
  prompt: >
    Aged footwear line SKU-104277 has 2,000 units left. Should we mark down, move to outlet, bundle, donate or
    liquidate to maximise recovery? Give the expected margin per option, the product's price elasticity, and the effect
    on full-price sales of similar footwear if we mark down 40%.
  ref:
    - {tool: get_price_elasticity_for_product, args: {sku: SKU-104277}}
    - {tool: calculate_clearance_option_recovery, args: {sku: SKU-104277, stock_on_hand: 2000}}
    - {tool: get_full_price_cannibalisation_estimate, args: {category: Footwear, markdown_depth_pct: 40}}
  facts: [["28134", "28,134"], ["26849", "26,849"], "18.4", ["-1.9", "1.9"]]

- id: pricing-03:29:Q3
  question: "03:29:Q3"
  prompt: >
    For padded jacket SKU-100959 with 2,000 units, selling 120 a week at full price: what sell-through and margin do I
    get with 20% off from week 3 versus 40% off from week 6? How reliable is the elasticity data for outerwear?
    Then schedule the better option as a markdown event starting in a week for four weeks (full price £102.99).
  ref:
    - {tool: compare_markdown_scenarios, args: {sku: SKU-100959, stock_on_hand: 2000, weekly_baseline_units: 120, scenario_a_depth_pct: 20, scenario_a_start_week: 3, scenario_b_depth_pct: 40, scenario_b_start_week: 6}}
    - {tool: get_elasticity_confidence_for_category, args: {category: Outerwear}}
    - {tool: create_markdown_event, args: {sku: SKU-100959, markdown_depth_pct: 20, start_date: "+7d", end_date: "+35d", original_price_gbp: 102.99, stock_at_start: 2000}}
  facts: ["96.2", ["101636", "101,636", "101,637"], ["84005", "84,005", "84,006"], "low"]

- id: pricing-03:29:Q4
  question: "03:29:Q4"
  prompt: >
    What markdown depth and timing are we running on men's outerwear right now? I want to compare it with what
    competitors are doing on clearance.
  ref:
    - {tool: get_our_markdown_depth_and_timing, args: {category: Outerwear, department: Menswear}}
  facts: ["30", "2026-09-07", "22.8"]
