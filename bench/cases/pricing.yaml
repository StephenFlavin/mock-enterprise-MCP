- id: pricing-08:77:Q4
  question: "08:77:Q4"
  prompt: >
    A new tariff adds about 6% to landed cost on our imported small appliances from the start of the new year. By price
    tier, compare passing it on in full as a 6% price rise with absorbing it entirely: weekly volume and margin change at
    the category's elasticity. Then, for the top two tiers where the board has agreed to pass it on, schedule approved
    price change PC-900043 for the start of the new year, about twelve weeks away, and cancel scheduled change PC-900044
    on the same line, which would clash.
  ref:
    - {tool: run_volume_and_margin_forecast_for_price_change, args: {category: Small Appliances, price_change_pct: 6, cost_increase_pct: 6}}
    - {tool: run_volume_and_margin_forecast_for_price_change, args: {category: Small Appliances, price_change_pct: 0, cost_increase_pct: 6}}
    - {tool: create_scheduled_price_change, args: {pc_id: PC-900043, proposed_date: "+12w"}}
    - {tool: cancel_scheduled_price_change, args: {pc_id: PC-900044, cancel_reason: "Clashes with the tariff pass-through price change"}}
  facts: ["-7", ["30972.47", "30972"], ["60315.71", "60316"], "PC-900043", "PC-900044"]

- id: pricing-08:77:Q6
  question: "08:77:Q6"
  prompt: >
    We're launching new Storage product SKU-100595 (unit cost £8.11, planned price £23.99). If we sell about 400 units a
    week at £23.99, what weekly volume and margin do we get at £19.99, £21.99, £23.99 and £25.99? How many units per cell,
    and how many days, would a test need to detect a 10% change in sales if each cell sells 60 units a day? Then set up
    the test: £21.99 against the £23.99 control, eight test stores and eight control stores, starting in two weeks for
    four weeks. Keep the existing draft price change PC-900045 as it is.
  ref:
    - {tool: run_volume_and_margin_forecast_at_price_points, args: {sku: SKU-100595, base_volume_units: 400, price_points: "19.99,21.99,23.99,25.99"}}
    - {tool: calculate_price_test_sample_size, args: {expected_uplift_pct: -10, baseline_daily_sales_units: 60}}
    - {tool: create_price_test, args: {sku: SKU-100595, test_price_gbp: 21.99, control_price_gbp: 23.99, test_store_count: 8, control_store_count: 8, start_date: "+14d", end_date: "+42d"}}
  facts: [["6496.75", "6497"], ["6163.33", "6163"], ["1649", "1,649"], ["28 days", "4 weeks", "four weeks", "28"]]

