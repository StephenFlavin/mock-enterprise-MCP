  facts: ["96.2", ["101636", "101,636", "101,637"], ["84005", "84,005", "84,006"], "low"]
  scenario_context: >
    The jackets are men's jacket SKU-100959 (outerwear): 2,000 units in stock, selling about 120 a week at the full
    price of £102.99; a markdown event would start in a week and run four weeks.

