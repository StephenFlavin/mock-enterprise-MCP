    - {tool: get_price_positioning_rules_for_category, args: {category: Cookware}}
    - {tool: create_price_change_request, args: {sku: SKU-100819, old_price_gbp: 114.99, new_price_gbp: 102.99, change_reason: "Competitive pressure", proposed_date: "+14d"}}
    - {tool: submit_price_change_for_approval, args: {pc_id: PC-900041}}
  facts: ["-1.9", "26.6", "16.8", ["3452.78", "3453"], ["2694.5", "2695"], ["mid-market", "mid market"]]

