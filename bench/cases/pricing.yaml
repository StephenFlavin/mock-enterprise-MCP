- id: pricing-03:29:Q3
  question: "03:29:Q3"
  prompt: >
    For men's jacket SKU-100959 with 2,000 units, selling 120 a week at full price: what sell-through and margin do I
    get with 20% off from week 3 versus 40% off from week 6? How reliable is the elasticity data for outerwear?
