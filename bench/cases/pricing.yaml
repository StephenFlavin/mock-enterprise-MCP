  question: "08:77:Q1"
  prompt: >
    We're reviewing home and kitchen pricing, starting with Cookware. SKU-103612 is priced 14% above its competitors'
    average and SKU-100819 is 12% above. Using their own price elasticities, how many units and how much revenue does each
    gap cost us a week, and which costs more? What price positioning does the category's policy set? Then put SKU-100819
    (now £114.99) into a draft price change down to £102.99 for competitive pressure, effective in two weeks, and submit
    the existing draft price change PC-900041 for approval.
  ref:
    - {tool: get_price_elasticity_for_products, args: {category: Cookware}}
    - {tool: calculate_sales_lost_to_price_gaps, args: {category: Cookware, sku: SKU-103612, price_gap_pct: 14}}
