- id: ar-07:65:Q1
  question: "07:65:Q1"
  prompt: >
    Wholesale customer PTN-025 (Hartley & Reed Ltd): how healthy is the account and how has their payment behaviour
    trended over the last 12 months? Should we change their credit limit, and what credit insurance do we hold on them?
    Then cut their credit limit to £150k.
  ref:
    - {tool: get_customer_account_summary, args: {customer_id: PTN-025}}
    - {tool: get_customer_payment_history, args: {customer_id: PTN-025, months: 12}}
    - {tool: calculate_credit_limit_recommendation, args: {customer_id: PTN-025}}
    - {tool: get_credit_insurance_cover, args: {customer_id: PTN-025}}
    - {tool: update_customer_credit_limit, args: {customer_id: PTN-025, credit_limit_gbp: 150000}}
  facts: ["250000", "168000", "135000", ["150000", "150,000"], "high"]

- id: ar-07:65:Q2
  question: "07:65:Q2"
  prompt: >
    Wholesale customer PTN-041 is disputing invoice INV-2026-900040 (about £480k). Show me what was invoiced
    (quantities, unit prices, total) and why it is disputed, then put the invoice on dispute hold because of the
    delivery shortfall.
  ref:
    - {tool: get_sales_order_and_invoice, args: {invoice_id: INV-2026-900040}}
    - {tool: update_invoice_dispute_status, args: {invoice_id: INV-2026-900040, dispute_status: on_hold, dispute_reason: Delivery shortfall - 360 units short}}
  facts: ["480000", "4000", ["60", "£60"], "360", ["on hold", "on_hold"]]

- id: ar-07:65:Q3
  question: "07:65:Q3"
  prompt: >
    The CFO wants to know what cash we will collect over the next eight weeks, by week, with a range, and whether the
    bad-debt provision needs to go up. What is the booked provision against the expected credit loss on today's open
    receivables, and which customer carries the largest expected loss?
  ref:
    - {tool: calculate_collections_forecast, args: {weeks_ahead: 8}}
    - {tool: get_bad_debt_provision, args: {}}
    - {tool: calculate_expected_credit_loss, args: {}}
    - {tool: calculate_expected_credit_loss, args: {group_by: customer}}
  facts: ["33000", "PTN-006", "18030"]

- id: ar-07:65:Q4
  question: "07:65:Q4"
  prompt: >
    Who is overdue and getting worse? Compare overdue balances now with 60 days ago for each customer, name the worst ten
    by overdue balance, and send each of those ten a first-notice chaser.
  ref:
    - {tool: get_overdue_trend_by_customer, args: {days: 60}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-006, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-025, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-009, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-034, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-031, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-043, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-002, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-046, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-001, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
    - {tool: send_payment_reminder, args: {customer_id: PTN-032, reminder_type: first_notice, message: "Your invoice is overdue. Please arrange payment."}}
  facts: ["PTN-006", "218000", "PTN-025", "PTN-032"]

- id: ar-07:65:Q5
  question: "07:65:Q5"
  prompt: >
    Customer PTN-032 is about 75 days overdue. What is their account position (balance against credit limit, how much
    is overdue and how old, risk rating)? Then put them on credit hold, reason 75 days overdue.
  ref:
    - {tool: get_customer_account_summary, args: {customer_id: PTN-032}}
    - {tool: update_customer_credit_hold, args: {customer_id: PTN-032, credit_held: true, credit_hold_reason: 75 days overdue}}
  facts: ["71000", "60000", "critical", "61000"]
