- id: tax_duty-02:14:Q1
  question: "02:14:Q1"
  prompt: >
    What are the current duty rates on cotton knit tops (HS 6110) from Vietnam, Bangladesh and Turkey into the UK, EU and US,
    and what has changed in the last 12 months? Also give the duty and VAT per £10,000 of goods into the UK for each of the three countries.
  ref:
    - {tool: get_current_duty_rates, args: {hs_code: "6110", origin_country: "VN,BD,TR"}}
    - {tool: calculate_duty_per_value, args: {hs_code: "6110", origin_country: "VN,BD,TR", destination_market: UK}}
  facts: [["was 10", "from 10", "10% to 15%", "previously 10"], "CPTPP", "2200", "2240"]

- id: tax_duty-02:14:Q2
  question: "02:14:Q2"
  prompt: >
    We're launching a padded gilet with a detachable fleece liner, made in Vietnam and shipped to the UK. It could be classified
    under HS 6110 or HS 6202. At 80,000 units at £50 each, what is the duty on each code and what is the difference between them?
  ref:
    - {tool: calculate_duty_difference_between_codes, args: {hs_code_1: "6110", hs_code_2: "6202", origin_country: VN, units: 80000, unit_cost_gbp: 50}}
