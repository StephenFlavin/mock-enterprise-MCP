- id: treasury-04:39:Q2-a
  question: "04:39:Q2"
  prompt: >
    We're considering locking in 60% of next year's cotton requirement, about 4,200 tonnes, with a 12-month
    forward. What did our past cotton hedges deliver, what would a forward cost compared with an option or a
    collar on that volume, and does our cash forecast leave headroom over the next 90 days against a £20m
    minimum balance?
  ref:
    - {tool: get_historic_hedging_outcomes, args: {commodity: cotton}}
    - {tool: calculate_hedge_scenarios, args: {underlying_type: commodity, commodity: cotton, notional_amount: 4200, hedge_ratio_pct: 60, horizon_months: 12}}
    - {tool: get_cash_position_forecast, args: {min_balance_gbp: 20000000}}
  facts: [514800, 532800, 153115, 375379, 17200000]

- id: treasury-04:39:Q2-b
  question: "04:39:Q2"
  prompt: >
    I approve the split. Place the first tranche: submit a hedge request for a forward on 1,260 tonnes of cotton
    (30% of the 4,200-tonne requirement), at the forward price of 2.02 per kg, maturing in about twelve months.
  ref:
    - {tool: submit_hedge_request, args: {underlying_type: commodity, commodity: cotton, notional_amount: 1260, notional_unit: tonnes, hedge_ratio_pct: 30, instrument_type: forward, maturity_date: "+365d", strike_or_rate: 2.02}}
  facts: [1260, "forward", "cotton", 2.02]

