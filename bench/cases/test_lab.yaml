- id: test_lab-06:60:Q3
  question: "06:60:Q3"
  prompt: >
    Our trial recycled-nylon fabric (material "recycled nylon") failed abrasion tests. Which abrasion conditions
    passed and which failed, how many cycles did the failures reach against the target, and how does the fabric
    compare with the recycled nylon and virgin nylon reference fabrics? Then book a re-test with a higher abrasion
    cycle count.
  ref:
    - {tool: get_test_results_for_material, args: {material_name: recycled nylon}}
    - {tool: compare_material_test_data_to_reference_fabrics, args: {material_name: recycled nylon, test_method_id: TMT-0003}}
    - {tool: create_test_request, args: {test_type: material, material_name: recycled nylon, test_methods: TMT-0003, notes: "Re-test at higher abrasion cycle count (at least 100000 cycles)"}}
  facts: ["50000", "100000", "12 kPa", "105000"]

