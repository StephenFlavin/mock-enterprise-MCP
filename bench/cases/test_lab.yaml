    - {tool: get_wear_trial_results, args: {material_name: polyester shell fabric}}
    - {tool: compare_lab_test_to_wear_trial_conditions, args: {material_name: polyester shell fabric}}
    - {tool: draft_revised_test_protocol, args: {material_name: polyester shell fabric}}
  facts: ["90", "50", "hard water", ["tumble", "tumble-dry"], "abrasion"]
