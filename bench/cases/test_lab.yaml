  question: "06:60:Q8"
  prompt: >
    The new DWR finish on our polyester shell fabric tests well in the lab but fails in real-world wear trials.
    What do the lab test and the wear trials show, what differs between the test conditions and actual use, and
    what revised test would better predict field performance?
