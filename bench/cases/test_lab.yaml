- id: test_lab-04:39:Q6
  question: "04:39:Q6"
  prompt: >
    We want to replace virgin polyester in our blouse fabric with a recycled or alternative material at similar
    quality. From the lab tests, how do recycled polyester (rPET), bio-based polyester (PTT) and lyocell compare
    with virgin polyester on abrasion, tensile strength, pilling and rubbing fastness, and which ones pass?
  ref:
    - {tool: get_material_test_results, args: {material_name: virgin polyester}}
    - {tool: get_material_test_results, args: {material_name: recycled polyester}}
    - {tool: get_material_test_results, args: {material_name: bio-based polyester}}
    - {tool: get_material_test_results, args: {material_name: lyocell}}
  facts: ["35000", "33500", "31000", "22000"]

- id: test_lab-04:40:Q3
  question: "04:40:Q3"
  prompt: >
    Breakage on glass items is up 40%. What do the drop-test results say for the 1.7L glass kettle K-1700 and for
    SKU-100091, which has glass components and had its pack changed recently? Which of their tests fail, and how?
  ref:
    - {tool: get_drop_test_results, args: {sku: K-1700}}
    - {tool: get_drop_test_results, args: {sku: SKU-100091}}
  facts: ["glass breakage", "single-wall", "recycled plastic"]

- id: test_lab-05:42:Q1
  question: "05:42:Q1"
  prompt: >
    Seven bulk lots of the same polyester blouse failed colourfastness to rubbing over the last two months. Which
    lots failed, which SKUs do they cover, and what rubbing grade did they get against the required grade?
  ref:
    - {tool: search_test_results_by_failure_mode, args: {failure_mode: colourfastness}}
  facts: ["LOT-900009", "LOT-900015", "SKU-100007", "SKU-100021"]

- id: test_lab-05:42:Q2
  question: "05:42:Q2"
  prompt: >
    Lot LOT-900016 passed everything except zip strength, which is 4% under spec. Show me the lab results for the
    lot, then raise a retest request on the zip strength result to confirm it.
  ref:
    - {tool: get_lot_test_results, args: {lot_id: LOT-900016}}
    - {tool: create_retest_request, args: {original_result_id: RES-900126, lot_id: LOT-900016, reason: "Confirm zip strength result", test_methods: TMT-0005}}
  facts: ["96 N", "zip strength"]

- id: test_lab-05:44:Q1
  question: "05:44:Q1"
  prompt: >
    We sell children's stainless steel insulated water bottles with a silicone straw (350ml) in the UK, EU, US and
    Australia. What lab tests would the bottles need (heavy metals, food-contact migration, small parts, labelling)
    and what does each cost and how long does it take? Then raise test requests for the bottles that might not
    comply: SKU-104123, SKU-104795 and SKU-105551.
  ref:
    - {tool: get_testing_cost_and_lead_time, args: {applies_to: "children's bottle"}}
    - {tool: create_test_request, args: {test_type: product, sku: SKU-104123, test_methods: "TMT-0014,TMT-0015,TMT-0016,TMT-0018"}}
    - {tool: create_test_request, args: {test_type: product, sku: SKU-104795, test_methods: "TMT-0014,TMT-0015,TMT-0016,TMT-0018"}}
    - {tool: create_test_request, args: {test_type: product, sku: SKU-105551, test_methods: "TMT-0014,TMT-0015,TMT-0016,TMT-0018"}}
  facts: ["420", "350", "280", "14"]

- id: test_lab-05:44:Q2
  question: "05:44:Q2"
  prompt: >
    A leather bag (SKU-101813) failed the chromium VI test; the test report is RPT-900021. What does the report
    show: the result against the limit, which leather batch it came from, and what did the retained leather
    swatches show?
  ref:
    - {tool: get_test_report_details, args: {report_id: RPT-900021}}
  facts: ["8.4", "BATCH-LEATHER-002", "9.1", "2.1"]

- id: test_lab-05:44:Q5
  question: "05:44:Q5"
  prompt: >
    Our new smart water bottle (SKU-104809) has a lithium battery, Bluetooth and USB-C charging. What lab tests
    would it need for CE and UKCA in the EU and UK, and what does each cost and how long does it take? Then book
    the testing for the EU and UK.
  ref:
    - {tool: get_testing_cost_and_lead_time, args: {applies_to: smart bottle, markets: UK EU}}
