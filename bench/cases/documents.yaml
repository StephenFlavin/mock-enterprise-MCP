- id: documents-01:4:Q2
  question: "01:4:Q2"
  prompt: >
    Attached is the DC1 WMS adjustment export for last quarter (adj_Q3.csv). Take the adjustments over 500 pounds,
    leave out cycle-count corrections that were reversed within 48 hours, and group them by cause code, location zone
    and shift. Which cause code is the catch-all, and which cluster is the largest by value, with what total?
  ref:
    - {tool: read_document, args: {path: adj_Q3.csv, min_amount: 500, exclude: "source=cycle_count;reversed_within_48h=yes", group_by: "cause_code,location_zone,shift"}}
  facts: [["CC-999", "Other"], "mezzanine", "night", "48030"]

- id: documents-01:6:Q3-a
  question: "01:6:Q3"
  prompt: >
    We are choosing between a late night shift (22:00 to 06:00) and overtime on the existing two DC1 shifts. From the
    September labour data (labour_Sep.xlsx) and the agency rate card (agency_rates.pdf): what are units per hour and
    error rates for normal versus overtime working, what is the agency hourly rate for the night shift, and how many
    agency staff can we get locally?
  ref:
    - {tool: read_document, args: {path: labour_Sep.xlsx}}
    - {tool: read_document, args: {path: agency_rates.pdf}}
  facts: ["241", "184", "19.00", "30"]

- id: documents-01:6:Q3-b
  question: "01:6:Q3"
  prompt: >
    Draft the one-page recommendation for the operations director on peak labour cover. Option A is a late shift for
    eight weeks costing 412000 pounds, option B is overtime on the two existing shifts costing 486000 pounds. We
    recommend the late shift because it is cheaper and carries a lower fatigue risk. Show the saving.
  ref:
    - {tool: draft_recommendation_summary, args: {topic: Peak labour cover, option_a: Late shift for eight weeks, option_a_cost_gbp: 412000, option_b: Overtime on existing shifts, option_b_cost_gbp: 486000, recommendation: "Late shift: cheaper and lower fatigue risk"}}
  facts: ["74000", "15.2"]

- id: documents-01:8:Q1
  question: "01:8:Q1"
  prompt: >
    140 orders at DC1 have been stuck in allocation failed since 6am and we are still investigating the cause. Write
    the operational incident summary for ops.
  ref:
    - {tool: draft_incident_summary, args: {incident_type: operational, site_id: DC1, what_happened: "140 orders stuck in allocation failed since 6am"}}
  facts: ["Northampton", "140", "investigat"]

- id: documents-01:10:Q2
  question: "01:10:Q2"
  prompt: >
    Attached is the CMMS export for the DC1 conveyor network and sorter (cmms_export.xlsx). Based on run hours,
    condition and fault history, which motors, gearboxes and sensors look most likely to fail before the end of the
    month, and what has been going wrong with each?
  ref:
    - {tool: read_document, args: {path: cmms_export.xlsx}}
  facts: ["AST-DC1-CNV-G01", "AST-DC1-CNV-M08", "AST-DC1-CNV-S11", "drift"]

- id: documents-02:11:Q2-a
  question: "02:11:Q2"
  prompt: >
    For the northern region (Leeds, Manchester, Newcastle and Glasgow drops), use last quarter's loads and delivery
    windows (attached: north_loads_Q3.csv). How many pallets did we move with our three current carriers, what did
    it cost in total, and which lane was the most expensive?
  ref:
    - {tool: read_document, args: {path: north_loads_Q3.csv}}
  facts: ["10210", "487760", "Glasgow"]

- id: documents-02:11:Q2-b
  question: "02:11:Q2"
  prompt: >
    We are considering moving 40% of our northern volume from carrier CAR-002 to a pallet network. Draft the
    negotiation brief on CAR-002 showing when its contract ends and the terms we would have to negotiate.
  ref:
    - {tool: draft_negotiation_brief, args: {carrier_id: CAR-002, volume_shift_pct: 40}}
  facts: ["2028-02-04", "fuel surcharge cap", "volume"]

- id: documents-02:20:Q1
  question: "02:20:Q1"
  prompt: >
    Compare the last 12 months of carrier invoice lines (attached: carrier_invoices_FY26.csv) with contracted
    rates. What is the total value we can dispute, which charge category accounts for most of it, and how much was
    above contract but legitimate?
  ref:
    - {tool: read_document, args: {path: carrier_invoices_FY26.csv, where: "status=disputable", group_by: charge_type}}
    - {tool: read_document, args: {path: carrier_invoices_FY26.csv, group_by: status}}
  facts: ["28858.75", "weight adjustment", "15210", "2575"]

- id: documents-03:23:Q2
  question: "03:23:Q2"
  prompt: >
    We are forecasting demand for the new recycled-polyester backpack range launching in January. What does the
    marketing plan (attached: Q1_marketing_plan.pdf) say about budget, price points, the planned first buy and when
    the marketing peaks in the first weeks?
  ref:
    - {tool: read_document, args: {path: Q1_marketing_plan.pdf}}
  facts: ["250000", "49.99", "64.99", "18000", "week 3"]
  notes: "The plan is a text attachment, so 'week 3' is matched from the influencer burst row (week 3) in the weekly table."

- id: documents-03:29:Q2
  question: "03:29:Q2"
  prompt: >
    I have 40 aged lines (attached: aged_lines.xlsx). Give me the top 10 by stock value first: which SKUs lead, and
    what is the total stock value of the 40 lines?
  ref:
    - {tool: read_spreadsheet_document, args: {filename: aged_lines.xlsx, sort_by: stock_value_gbp, max_rows: 10}}
  facts: ["SKU-105558", "SKU-101813", "1835088.07"]

- id: documents-04:32:Q1
  question: "04:32:Q1"
  prompt: >
    Supplier A (SUP-0060) quoted 4.80 pounds per unit for a 750ml double-wall stainless steel bottle and Supplier B
    (SUP-0032) quoted 4.10 pounds (attached: quote_A.pdf, quote_B.pdf). What are the cost lines in Supplier A's quote,
    and what differs between the two quotes in material grade, wall thickness, tooling, MOQ and freight terms?
  ref:
    - {tool: read_document_attachment, args: {filename: quote_A.pdf}}
    - {tool: read_document_attachment, args: {filename: quote_B.pdf}}
    - {tool: extract_quote_line_items, args: {quote_file: quote_A.pdf}}
  facts: ["304", "201", "0.28", "100000", "EXW"]

- id: documents-04:32:Q3
  question: "04:32:Q3"
  prompt: >
    For next season's bedding range we compared SUP-0039, SUP-0011 and SUP-0004 and want to award the volume to
    SUP-0039. Summarise it as a recommendation for the buying director.
  ref:
    - {tool: draft_sourcing_recommendation, args: {category: Bedding, winning_supplier_id: SUP-0039, compare_supplier_ids: "SUP-0011,SUP-0004"}}
  facts: ["Connor Products Group", "98.6", "21 days", "Khan Products Pvt Ltd"]
  notes: "Master data has no quoted landed cost or capacity commitments, so the draft compares master unit cost, lead time, OTIF and payment terms only."

- id: documents-04:32:Q7
  question: "04:32:Q7"
  prompt: >
    Prepare the negotiation brief for next week's annual review with SUP-0074, our largest cookware supplier. Cover
    our share of their cookware volume, their performance, benchmarks on price and payment terms, and our
    alternatives if talks fail.
  ref:
    - {tool: draft_negotiation_brief, args: {supplier_id: SUP-0074, category: Cookware, negotiation_type: price}}
  facts: ["Lyons Trading Co", "57.8", "93.7", ["30 days", "30 day"], "Khan Products Pvt Ltd"]

- id: documents-04:34:Q2
  question: "04:34:Q2"
  prompt: >
    Draft a shortlist comparison of suppliers in Portugal and Turkey that could make technical outerwear, hold
    OEKO-TEX certification and have capacity for 30,000 units a season. Which factory ranks first and why?
  ref:
    - {tool: draft_supplier_shortlist_comparison, args: {category: technical outerwear, countries: "PT,TR", certification: OEKO-TEX, min_season_capacity: 30000}}
  facts: ["FAC-0110", "FAC-0072", "FAC-0085"]
  notes: "Master factories have no seam-sealing capability field; the draft ranks on OEKO-TEX, capacity, audit rating and whether the factory already makes our Outerwear SKUs, and flags seam-sealing to confirm in the RFQ."
