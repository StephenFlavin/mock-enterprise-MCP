- id: mdm-01:8:Q1-a
  question: "01:8:Q1"
  prompt: >
    Orders are failing allocation on SKUs PF-220 and K-1700. What do their master records say about
    hazmat and handling, and is there anything the two have in common that could explain it?
  ref:
    - {tool: get_sku_master_attributes, args: {sku: PF-220}}
    - {tool: get_sku_master_attributes, args: {sku: K-1700}}
  facts: [["li_ion_battery", "lithium", "li-ion"], "SUP-0013", ["Portable Rechargeable Desk Fan", "desk fan"]]
  notes: "Master data (not fixable here): PF-220 and K-1700 share supplier SUP-0013, weight 2.83, lead time 105, MOQ 1000 and unit cost 24.67, which look like copied attributes; products has no dimensions column, so 'dimensions' cannot be answered."

- id: mdm-04:36:Q5-a
  question: "04:36:Q5"
  prompt: >
    Which vendor records look like duplicates of TextileCorp? Show the matching records and say what
    they share in their bank details.
  ref:
    - {tool: search_duplicate_vendor_candidates, args: {name: TextileCorp}}
    - {tool: get_vendor_bank_account_matches, args: {vendor_id: VEN-900001}}
  facts: ["VEN-900001", "VEN-900002", "VEN-900003", "GB82 WEST 1234 5678 9012"]

- id: mdm-04:36:Q5-b
  question: "04:36:Q5"
  prompt: >
    FastShip Logistics (vendor VEN-900010) has a similar-looking vendor record. Is it a duplicate or does
    it look fraudulent? Check names, tax ids and bank details.
  ref:
    - {tool: search_duplicate_vendor_candidates, args: {vendor_id: VEN-900010}}
    - {tool: get_vendor_bank_account_matches, args: {vendor_id: VEN-900010}}
  facts: ["VEN-900011", "fraud", "GB90 NWAB 4444 5555 6666"]

- id: mdm-04:36:Q5-c
  question: "04:36:Q5"
  prompt: >
    I approve the TextileCorp group: merge duplicate vendor VEN-900002 into the surviving record VEN-900001.
  ref:
    - {tool: merge_vendor_records, args: {vendor_id: VEN-900002, merged_into: VEN-900001}}
  facts: ["VEN-900002", "VEN-900001", "merged"]

- id: mdm-04:36:Q5-d
  question: "04:36:Q5"
  prompt: >
    Archive the duplicate vendor record VEN-900003 now that the TextileCorp group is agreed.
  ref:
    - {tool: archive_duplicate_vendor, args: {vendor_id: VEN-900003}}
  facts: ["VEN-900003", "archived"]

- id: mdm-09:81:Q6-a
  question: "09:81:Q6"
  prompt: >
    Who owns the vendor master data and who is the steward? What accuracy target does it have, and when
    was it last audited? Do the same for product master data.
  ref:
    - {tool: get_data_owner_for_dataset, args: {domain: vendors}}
    - {tool: get_data_owner_for_dataset, args: {domain: products}}
  facts: ["EMP-00052", "EMP-00053", "98", "EMP-00050", "99.5"]

- id: mdm-09:81:Q6-b
  question: "09:81:Q6"
  prompt: >
    The OTIF_daily and ASN_feed datasets have open data quality problems. Who owns each dataset and who is
    its steward, so I can assign the fix?
  ref:
    - {tool: get_data_owner_for_dataset, args: {dataset: OTIF_daily}}
    - {tool: get_data_owner_for_dataset, args: {dataset: ASN_feed}}
  facts: [["Damien Hayes", "EMP-00008"], ["Barry Fletcher", "EMP-00012"], ["Dean Murray-Davies", "EMP-00095"], ["Mary Fraser", "EMP-00096"]]

- id: mdm-09:85:Q2-a
  question: "09:85:Q2"
  prompt: >
    Have any supplier bank details been changed in the last 14 days? Who made each change, when, and
    what was altered?
  ref:
    - {tool: list_vendor_bank_detail_changes, args: {changed_from: -14d}}
  facts: ["VEN-900002", "account_holder", "VEN-900004", "account_number", ["Benjamin Smith", "EMP-00085"], ["Ian Bishop-Gardner", "EMP-00086"]]

- id: mdm-lookup-product-a
  question: "lookup"
  prompt: >
    What's the SKU for the rechargeable desk fan, and which supplier provides it?
  ref:
