  facts: ["PF-220", "SUP-0013"]

- id: mdm-lookup-product-b
  question: "lookup"
  prompt: >
    I need the SKU for the Blush Blouse. Which one is it?
  ref:
    - {tool: search_products, args: {name: Blush Blouse}}
  facts: ["SKU-100007", "SKU-100014", "SKU-100021"]
  notes: "Ambiguous on purpose: three sizes (10, 12, 14) of STY-4012 match. A correct answer lists all three SKUs or asks which size is wanted."

