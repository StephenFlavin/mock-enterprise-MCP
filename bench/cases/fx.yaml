- id: fx-04:32:Q5
  question: "04:32:Q5"
  prompt: >
    I'm modelling housewares margin for next season, which is bought mostly in dollars and euros. What do the
    forward rates for sterling against the dollar and the euro look like over the next 12 months, and how much of
    our USD and EUR exposure is already hedged?
