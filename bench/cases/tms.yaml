- id: tms-01:6:Q5-a
  question: "01:6:Q5"
  prompt: >
    Store service level has dropped over the last three weeks. For departures from DC1 in the last 21 days, which
    carrier's loads are leaving late, and which store lanes are hit hardest?
  ref:
    - {tool: list_late_outbound_departures, args: {date_from: -21d}}
  facts: ["Midshires", "CAR-002"]
  notes: "Late departures are measured in whole days (planned and actual departure are dates), so 'how many minutes late' cannot be answered; the five story lanes (ST148, ST150, ST151, ST214, ST215) tie on counts because they carry the most Midshires loads."

- id: tms-02:11:Q1-a
  question: "02:11:Q1"
  prompt: >
    Any disruption on lane DC1-ST215 (Dundee) in the last two weeks? Give on-time and fill rate against the
    two weeks before.
  ref:
    - {tool: get_lane_performance_summary, args: {lane: DC1-ST215, period_start: -14d}}
  facts: ["78.8", "93.5", "69", "86.5"]

- id: tms-02:11:Q1-b
  question: "02:11:Q1"
  prompt: >
    Planned load SHP-900001 on lane DC1-ST214 is booked with carrier CAR-002, whose service has slipped. Reassign it to
    the backup carrier CAR-003 and record that it is because of the lane disruption.
  ref:
    - {tool: reassign_shipment_to_carrier, args: {shipment_id: SHP-900001, carrier_id: CAR-003}}
  facts: ["CAR-003"]

- id: tms-02:11:Q2-a
  question: "02:11:Q2"
  prompt: >
    For the northern drops DC1-ST150 (Leeds), DC1-ST151 (Manchester), DC1-ST148 (Newcastle) and DC1-ST207 (Glasgow),
    how many shipments and pallets did we move in the last quarter, and what is the average per week on each lane?
  ref:
    - {tool: get_load_volumes_by_lane, args: {lanes: "DC1-ST150,DC1-ST151,DC1-ST148,DC1-ST207"}}
  facts: ["4527", "4283", "4451", "4353"]

- id: tms-02:11:Q2-b
  question: "02:11:Q2"
  prompt: >
    On the northern lanes DC1-ST150, DC1-ST151, DC1-ST148 and DC1-ST207 over the last 90 days, what on-time
    percentage did each of our three road carriers achieve?
  ref:
    - {tool: get_carrier_on_time_performance, args: {lanes: "DC1-ST150,DC1-ST151,DC1-ST148,DC1-ST207", period_start: -90d}}
  facts: ["98.1", "88.6", "81.7"]

- id: tms-02:11:Q2-c
  question: "02:11:Q2"
  prompt: >
    Cost a scenario on lanes DC1-ST150, DC1-ST151, DC1-ST148 and DC1-ST207: move 40% of last quarter's pallets to a
    pallet network at 20 pounds per pallet. What is the current cost and the scenario cost?
  ref:
    - {tool: calculate_lane_cost_scenario, args: {lanes: "DC1-ST150,DC1-ST151,DC1-ST148,DC1-ST207", shift_share_pct: 40, shift_rate_per_pallet_gbp: 20}}
  facts: ["17614", "301458", "321787"]

- id: tms-02:11:Q2-d
  question: "02:11:Q2"
  prompt: >
    Set up the pallet network trial as a draft allocation on lanes DC1-ST150 and DC1-ST151 with carrier CAR-001
    taking a 40% share, 4,000 units, described as "Pallet network trial, first lanes".
  ref:
    - {tool: create_carrier_trial_allocation, args: {lanes_affected: "DC1-ST150,DC1-ST151", carriers_involved: CAR-001, volume_units: 4000, share_pct: 40, description: "Pallet network trial, first lanes"}}
  facts: ["4000", "40"]

- id: tms-02:11:Q4-a
  question: "02:11:Q4"
  prompt: >
    For Black Friday and Christmas, is lane DC1-ST215 short of contracted capacity? Compare against last year's peak
    with 10% growth.
  ref:
    - {tool: calculate_capacity_gap_by_lane, args: {lane: DC1-ST215}}
  facts: ["370", "755", "385", "CAPACITY_SHORT"]

- id: tms-02:11:Q5-a
  question: "02:11:Q5"
  prompt: >
    Which routes have the worst driver-hours breaches at the moment, and by how many hours?
  ref:
    - {tool: list_routes_with_hours_breaches, args: {}}
  facts: ["RTE-900003", "3.4", "RTE-900006", "2.9"]

- id: tms-02:11:Q5-b
  question: "02:11:Q5"
  prompt: >
    Raise the stop-time allowance for stop STP-900001 (Manchester High Street, ST151) to 30 minutes.
  ref:
    - {tool: update_planned_stop_time_assumption, args: {stop_id: STP-900001, stop_time_minutes: 30}}
  facts: ["30"]

- id: tms-02:13:Q2-a
  question: "02:13:Q2"
  prompt: >
    Break our air freight in the last 90 days down by reason code: shipments, cost and how much was avoidable.
    Which reason is the biggest?
  ref:
    - {tool: get_air_shipment_reason_codes, args: {period_start: -90d}}
  facts: ["supplier late", "233343", "avoidable"]
  notes: "The last-quarter air total is about 362k (90-day window), not the 420k in the question; the planted top reason is supplier_late (233k, all avoidable)."

- id: tms-02:19:Q1-a
  question: "02:19:Q1"
  prompt: >
    Where in the UK inbound chain is delay building up? Compare average dwell at the ports over the last five weeks
    with the weeks before.
  ref:
    - {tool: get_dwell_time_by_node, args: {node_type: port}}
  facts: ["GBFXT", "28.2"]

- id: tms-02:20:Q3-a
  question: "02:20:Q3"
  prompt: >
    If we exit carrier CAR-003 from our UK road network and spread its volume over the others, how many shipments
    would each remaining carrier carry and what does on-time look like?
  ref:
    - {tool: run_tender_award_scenario, args: {exit_carrier_ids: CAR-003}}
  facts: ["16104", "15438"]
  notes: "Scenario volumes come from carrier_performance, the weekly table that also feeds scorecards; it is generated separately from the shipments table for background lanes (only the six story lanes are backed by shipment rows)."

- id: tms-07:61:Q5-a
  question: "07:61:Q5"
  prompt: >
    Reconcile freight cost in the TMS against the ledger for the last four weeks. How much is invoiced but not posted
    to the ledger, and which carrier is the largest part?
  ref:
    - {tool: compare_freight_ledger_to_tms, args: {period_start: -28d}}
  facts: ["208822", "CAR-008", "66981"]
  notes: "Total variance is about 219k rather than the 210k in the question; the 209k not posted is the bulk. No miscoded invoices end up in the data (posted_to_wrong_account is 0)."

- id: tms-07:63:Q3-a
  question: "07:63:Q3"
  prompt: >
    What does it cost per drop to deliver to UK North stores from DC3 (Leeds cross-dock) versus from DC1? Use the last
    90 days.
  ref:
    - {tool: get_store_delivery_cost_by_route, args: {origin_site_id: DC3, region: UK North, period_start: -90d}}
    - {tool: get_store_delivery_cost_by_route, args: {origin_site_id: DC1, region: UK North, period_start: -90d}}
  facts: ["186.22", "330"]

- id: tms-08:74:Q5-a
  question: "08:74:Q5"
  prompt: >
    Is the split-order rate going up? Show it by week for the last eight weeks, and how many split orders had their
    second shipment from another DC.
  ref:
    - {tool: get_split_shipment_rate_trend, args: {weeks_back: 8}}
  facts: ["21", "11.4", "19"]
  notes: "Weeks are partial at the edges (the current week has few orders) so the latest rate is inflated; the planted trend is about 3 percent rising to about 11 percent."

- id: tms-05:49:Q1-a
  question: "05:49:Q1"
  prompt: >
    Which product departments are cheapest to take back by transport cost per returned unit and best on net recovery
    over the last 90 days?
  ref:
    - {tool: get_reverse_logistics_cost_by_category, args: {period_start: -90d}}
  facts: ["Womenswear", "0.85", "Accessories"]
