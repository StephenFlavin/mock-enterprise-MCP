- id: pkgd-04:40:Q1
  question: "04:40:Q1"
  prompt: >
    We are comparing corrugated, moulded pulp and recycled plastic packs for small appliance SKU-100532. What are
    the unit cost, pallet fill and recycled content of each pack option we have specified?
  ref:
    - {tool: get_packaging_spec_for_product, args: {sku: SKU-100532}}
  facts: ["0.85", "0.92", "0.78", "240", "95"]

- id: pkgd-04:40:Q2
  question: "04:40:Q2"
  prompt: >
    For EPR fee and packaging tax costing in the UK, France, Germany and Spain, how much does the packaging for
    SKU-100532 weigh per unit, by material and market?
  ref:
    - {tool: get_packaging_weights_by_material_and_market, args: {sku: SKU-100532}}
  facts: ["45", "52", "38", ["France", "FR"], ["Spain", "ES"]]

- id: pkgd-04:40:Q3
  question: "04:40:Q3"
  prompt: >
    Breakage on glass items is up 40%. The worst offenders are the 1.7L glass kettle K-1700, glass drinkware
    SKU-104123 and SKU-100091. What changes have been made to their pack specs in the last 90 days, including any
    supplier changes?
  ref:
    - {tool: get_packaging_spec_change_history, args: {sku: K-1700}}
    - {tool: get_packaging_spec_change_history, args: {sku: SKU-104123}}
    - {tool: get_packaging_spec_change_history, args: {sku: SKU-100091}}
  facts: ["single-wall", "12 mm", "divider", "1.8 mm", "SUP-0082"]

- id: pkgd-04:40:Q6
  question: "04:40:Q6"
  prompt: >
    What e-commerce packaging do we use today for our small appliances? Give the pack type, protective material,
    cost per pack and damage rate for each.
  ref:
    - {tool: get_current_ecommerce_pack_specs, args: {category: Small Appliances}}
  facts: ["kraft paper", "3.4", "2.1", "expanded foam", "1.8"]

- id: pkgd-06:51:Q4
  question: "06:51:Q4"
  prompt: >
    The backpack sample for style STY-9509 failed the zip pull strength test again. What does its tech pack specify
    for the zip and what zip pull strength must the sample meet?
  ref:
    - {tool: get_tech_pack_for_style, args: {style_id: STY-9509}}
  facts: ["140", "#8 coil", "1.4 mm", "riveted"]

- id: pkgd-06:53:Q3
  question: "06:53:Q3"
  prompt: >
    The first sample of the technical jacket, style STY-7731, misses spec on seam strength and water resistance.
    What does its tech pack require for seam strength, thread, stitching and seam taping?
  ref:
    - {tool: get_tech_pack_for_style, args: {style_id: STY-7731}}
  facts: ["110", "bonded nylon", "12 stitches per inch", "taped"]

- id: pkgd-06:55:Q2
  question: "06:55:Q2"
  prompt: >
    Our moulded-pulp tray for SKU-100658 cracks in drop tests. What are its dimensions, wall thickness and design
    features, and what are the properties of moulded pulp? What would a 4.5 mm wall cost per unit, and what would
    ribbing that adds 6% material cost per unit?
  ref:
    - {tool: get_pack_dimensions_and_specs, args: {sku: SKU-100658, material: moulded_pulp}}
    - {tool: get_material_specs_for_pack, args: {pack_spec_id: PKS-900011}}
    - {tool: calculate_unit_cost_of_pack_change, args: {pack_spec_id: PKS-900011, new_wall_thickness_mm: 4.5}}
    - {tool: calculate_unit_cost_of_pack_change, args: {pack_spec_id: PKS-900011, added_rib_material_pct: 6}}
  facts: ["3.5", "no base ribs", "brittle", "1.1", "0.96"]

- id: pkgd-06:55:Q3
  question: "06:55:Q3"
  prompt: >
    For new product SKU-100091 we are split between a rigid box and a flexible pouch. Compare the two options on
    cost, shelf appeal, protection, pallet fill and recyclability, and give the total cost per unit including
    freight and damage at 400,000 units a year.
  ref:
    - {tool: get_packaging_option_specs, args: {sku: SKU-100091}}
    - {tool: get_pack_cost_quotes, args: {sku: SKU-100091}}
    - {tool: calculate_pallet_fill_for_pack, args: {pack_spec_id: PKS-900009, volume_units: 400000}}
    - {tool: calculate_pallet_fill_for_pack, args: {pack_spec_id: PKS-900012, volume_units: 400000}}
    - {tool: calculate_total_cost_per_unit_by_pack_option, args: {option_id: PKO-900001, volume_units: 400000}}
    - {tool: calculate_total_cost_per_unit_by_pack_option, args: {option_id: PKO-900002, volume_units: 400000}}
  facts: ["2.42", "1.67", "180", "450", "not recyclable"]

- id: pkgd-06:55:Q4-a
  question: "06:55:Q4"
  prompt: >
    What is the cost and pallet-fill effect of making the carton on pack spec PKS-900001 10% smaller, at 400,000
    units a year?
  ref:
    - {tool: get_carton_specs, args: {pack_spec_id: PKS-900001}}
    - {tool: calculate_carton_cost_at_new_dimensions, args: {carton_id: CTN-900001, size_reduction_pct: 10, volume_units: 400000}}
    - {tool: calculate_pallet_fill_for_pack, args: {pack_spec_id: PKS-900001, volume_units: 400000, size_reduction_pct: 10}}
  facts: ["0.74", "0.11", "280", "336", "238"]

- id: pkgd-06:55:Q4-b
  question: "06:55:Q4"
  prompt: >
    The 10% smaller carton passed drop and crush tests. Update the carton dimensions in the pack spec PKS-900001 to
    225 mm high, 180 mm wide and 135 mm deep.
  ref:
    - {tool: update_carton_dimensions_in_pack_spec, args: {pack_spec_id: PKS-900001, height_mm: 225, width_mm: 180, depth_mm: 135}}
  facts: ["225", "180", "135"]

- id: pkgd-06:55:Q5
  question: "06:55:Q5"
  prompt: >
    What does our own packaging portfolio look like for small appliances: primary pack, alternatives, sustainability
    notes and units sold in the last year for each product?
  ref:
    - {tool: get_own_packaging_portfolio, args: {category: Small Appliances}}
  facts: ["K-1700", "11844", "70% recycled", "95% recycled"]

- id: pkgd-07:63:Q2
  question: "07:63:Q2"
  prompt: >
    For the cost-to-serve model using FY26 actuals, what was our packaging cost per order and per unit for stores,
    online and wholesale, and the total packaging spend and packing labour share for each channel?
  ref:
    - {tool: get_packaging_cost_by_channel, args: {fiscal_year: FY26}}
  facts: ["3500000", "12000000", "1000000", "1.52", "0.63"]
