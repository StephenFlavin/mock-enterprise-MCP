- id: po-01:10:Q1-a
  question: "01:10:Q1"
  prompt: >
    Raise a purchase requisition for 4 shuttle drive belts at DC1, spare parts category, at £120 each. Put it in
    under EMP-00019 and tell me where it stands.
  ref:
    - {tool: create_purchase_requisition, args: {site_id: DC1, category: Spare Parts, description: Shuttle drive belt, qty: 4, unit_cost_gbp: 120, requested_by: EMP-00019}}
  facts: ["DC1", "120", "Spare Parts"]

- id: po-01:6:Q2-a
  question: "01:6:Q2"
  prompt: >
    Which purchase orders are due into DC1 over the next three weeks? Which one is the biggest by value, and how
    many units is it?
  ref:
    - {tool: list_inbound_purchase_orders_by_week, args: {dest_site_id: DC1, date_from: "+0d", date_to: "+21d"}}
  facts: ["PO-2026-004824", "13000"]

- id: po-01:6:Q2-b
  question: "01:6:Q2"
  prompt: >
    Push the delivery date on PO-2026-005575 back by a week.
  ref:
    - {tool: update_purchase_order_delivery_date, args: {po_id: PO-2026-005575, due_date: "2026-11-17"}}
  facts: ["PO-2026-005575", "2026-11-17"]

- id: po-02:13:Q1-a
  question: "02:13:Q1"
  prompt: >
    Style STY-7731 is running late. Which of its orders is shipped but overdue, how many units is that, and who is
    the supplier?
  ref:
    - {tool: get_purchase_order_status_for_style, args: {style_id: STY-7731}}
  facts: ["PO-2026-004072", "5000", "shipped", "Jackson Trading"]

- id: po-02:13:Q4-a
  question: "02:13:Q4"
  prompt: >
    Which open purchase orders are running late right now? Give me the three most overdue, with their suppliers.
  ref:
    - {tool: list_open_purchase_orders_with_delay, args: {}}
  facts: ["PO-2026-005621", "PO-2026-005775", "PO-2026-005978", "Lee Homewares", "Collins Textiles", "Lyons Trading"]

- id: po-02:13:Q5-a
  question: "02:13:Q5"
  prompt: >
    PO-2026-005154 has a hero fragrance line of 500 units (SKU-105803) stuck behind a late factory exit, with a
    delivery deadline in about ten days. What lines are on the order, what quantity of each, have any been
    received, and when is the factory exit now expected?
  ref:
    - {tool: get_purchase_order_line_status, args: {po_id: PO-2026-005154}}
  facts: ["SKU-105810", "SKU-104655", "SKU-105803", "500", "2026-10-18", ["Not received", "none received", "not been received", "nothing has been received", "not yet received", "no units received", "none of"]]

- id: po-02:14:Q6-a
  question: "02:14:Q6"
  prompt: >
    Supplier SUP-0076 falls under the forced-labour review. Put all its open purchase orders on hold with the reason
    "Forced labour risk - under review", under EMP-00019.
  ref:
    - {tool: block_purchase_orders_for_supplier, args: {supplier_id: SUP-0076, block_reason: "Forced labour risk - under review", blocked_by: EMP-00019}}
  facts: ["SUP-0076", "Forced labour risk - under review"]

- id: po-03:22:Q1-a
  question: "03:22:Q1"
  prompt: >
    SKU-101897 (style 5520) stocked out last month. What purchase orders have been placed for it, with quantities,
    due dates and status? For the open one, what did the supplier confirm and how did that change?
  ref:
    - {tool: get_purchase_orders_for_product, args: {sku: SKU-101897}}
    - {tool: get_supplier_confirmations_for_order, args: {po_id: PO-2026-004312}}
  facts: ["PO-2026-004312", "2000", "shipped", "2026-09-14", "2026-10-25"]

- id: po-03:24:Q1-a
  question: "03:24:Q1"
  prompt: >
    Supplier SUP-0070 looks like it keeps missing its confirmed ship dates. From its order history, how many of its
    last 10 orders left the factory more than two days after the confirmed ship date?
  ref:
    - {tool: get_purchase_order_history_for_supplier, args: {supplier_id: SUP-0070}}
  facts: ["6", "PO-2026-005941", "PO-2026-004127"]

- id: po-03:24:Q3-a
  question: "03:24:Q3"
  prompt: >
    Which open orders contain SKU-101442, who are they with, and what quantity of it is on each?
  ref:
    - {tool: list_open_orders_using_component, args: {sku: SKU-101442}}
  facts: ["PO-2026-004982", "PO-2026-005916", "Roberts Garments", "3000"]

- id: po-03:24:Q5-a
  question: "03:24:Q5"
  prompt: >
    For supplier SUP-0022, over the last two years, how far do their quoted lead times sit from what we actually
    get, and what is their on-time and in-full service level?
  ref:
    - {tool: get_quoted_vs_actual_lead_time_by_supplier, args: {supplier_id: SUP-0022, date_from: "-730d"}}
    - {tool: get_service_level_by_supplier, args: {supplier_id: SUP-0022, date_from: "-730d"}}
  facts: ["22.6", "32.4", "9.8", "40"]

- id: po-04:33:Q1-a
  question: "04:33:Q1"
  prompt: >
    Look at the order delay history for factory FAC-0104. Which supplier is it making for, how late were its recent
    orders, and what delay reasons are recorded?
  ref:
    - {tool: get_order_delay_history_for_factory, args: {factory_id: FAC-0104}}
  facts: ["Smith Garments", "Fabric delayed at mill", "Dye house capacity", "Labour shortage"]

- id: po-04:35:Q1-a
  question: "04:35:Q1"
  prompt: >
    What amendments have been made to our orders with supplier SUP-0027, who asked for them and why? Were any of
    them made close to the ship date?
  ref:
    - {tool: get_order_change_history_for_supplier, args: {supplier_id: SUP-0027}}
  facts: ["PO-2026-004908", "Late demand change", "EMP-00015", "ship_date"]

- id: po-04:35:Q4-a
  question: "04:35:Q4"
  prompt: >
    Supplier SUP-0068 is one of our largest suppliers. What categories do they supply us, and what open orders do
    we have with them right now (units and value)?
  ref:
    - {tool: get_supplier_supplied_items, args: {supplier_id: SUP-0068}}
    - {tool: get_open_orders_for_supplier, args: {supplier_id: SUP-0068}}
  facts: ["Bodycare", "Skincare", "PO-2026-005116", "48180"]

- id: po-04:36:Q1-a
  question: "04:36:Q1"
  prompt: >
    Which purchase orders have we placed off contract recently? Give me the three most recent and why each is off
    contract.
  ref:
    - {tool: list_off_contract_purchase_orders, args: {}}
  facts: ["PO-2026-004932", "PO-2026-006180", "PO-2026-005398"]

- id: po-04:38:Q6-a
  question: "04:38:Q6"
  prompt: >
    Supplier SUP-0022 has missed a critical delivery: the 5,000-unit shipped order into DC4 that was due about five
    weeks ago. Find that order and tell me its delivery status, how late the delay is judged to be, and the
    sales and stock impact.
  ref:
    - {tool: search_purchase_orders, args: {supplier_id: SUP-0022, dest_site_id: DC4, status: shipped}}
    - {tool: get_purchase_order_delivery_status, args: {po_id: PO-2026-004072}}
    - {tool: get_order_delay_impact, args: {po_id: PO-2026-004072}}
  facts: ["PO-2026-004072", "shipped", "36"]
  notes: "SKU-103171 on PO-2026-004072 has no sales history in master sales_weekly, so units/sales at risk come back 0; master.shipments also says this PO was delivered (ata before the due date) although the PO is shipped with nothing received."

- id: po-05:43:Q4-a
  question: "05:43:Q4"
  prompt: >
    Factory FAC-0021 failed its audit. List its open purchase orders, then put them all on hold pending corrective
    action, as EMP-00019, reason "Audit failed".
  ref:
    - {tool: get_open_purchase_orders_by_factory, args: {factory_id: FAC-0021}}
    - {tool: block_purchase_orders_for_factory, args: {factory_id: FAC-0021, block_reason: "Audit failed", blocked_by: EMP-00019}}
  facts: ["PO-2026-005575", "PO-2026-005658", "Audit failed"]

- id: po-07:63:Q1-a
  question: "07:63:Q1"
  prompt: >
    Which suppliers have pushed their prices up the most over the last two years? Give me the top one and its
    average increase.
  ref:
    - {tool: get_supplier_price_changes, args: {date_from: "-730d"}}
  facts: ["SUP-0073", "10.1"]

- id: po-08:78:Q5-a
  question: "08:78:Q5"
  prompt: >
    Supplier SUP-0022 has a 6,000-unit order due in about a month that is still in draft. Find it and send the
    supplier a request to confirm stock and delivery dates for that order.
  ref:
    - {tool: search_purchase_orders, args: {supplier_id: SUP-0022, status: draft}}
    - {tool: send_stock_confirmation_request_to_supplier, args: {po_id: PO-2026-005594, supplier_id: SUP-0022}}
  facts: ["PO-2026-005594", "SUP-0022"]
  notes: "PO-2026-005594 has an order_date a day after today in master data."

- id: po-03:28:Q2-a
  question: "03:28:Q2"
  prompt: >
    Cancel the open purchase order PO-2026-005122; it is no longer needed.
  ref:
    - {tool: cancel_purchase_order, args: {po_id: PO-2026-005122}}
  facts: ["PO-2026-005122", "cancelled"]
  notes: "cancel_purchase_order cannot check the PO is unshipped (the engine's update has no status guard); header totals are not reduced when order lines are cancelled."

- id: po-03:24:Q2-a
  question: "03:24:Q2"
  prompt: >
    Raise a draft purchase order with supplier SUP-0070, factory FAC-0132, into DC1, for 3,000 units with a total
    value of £120,000, arriving by sea.
  ref:
    - {tool: create_purchase_order, args: {supplier_id: SUP-0070, factory_id: FAC-0132, dest_site_id: DC1, total_units: 3000, total_value: 120000, mode: sea}}
  facts: ["SUP-0070", "FAC-0132", "3000", "120000"]
  notes: "A PO header cannot carry the SKU or a buyer: create_purchase_order stores units and value only, and buyer_id stays blank."
