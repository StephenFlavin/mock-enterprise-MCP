- id: po-01:10:Q1-a
  question: "01:10:Q1"
  prompt: >
    Raise a purchase requisition for 4 shuttle drive belts at DC1, spare parts category, at £120 each.
    Put it in under EMP-0001 and tell me where it stands.
  ref:
    - {tool: create_purchase_requisition, args: {site_id: DC1, category: Spare Parts, description: Shuttle drive belt, qty: 4, unit_cost_gbp: 120, requested_by: EMP-0001}}
  facts: ["submitted", "DC1", "120"]
  notes: "create_purchase_requisition returns total_cost_gbp blank (qty x unit cost not computed) and no requisition id format is promised to the user."

- id: po-01:6:Q2-a
  question: "01:6:Q2"
  prompt: >
    Which inbound purchase orders are due in the week starting 12 October 2026? Which one is the biggest by
    value, and how many units is it?
  ref:
    - {tool: list_inbound_purchase_orders_by_week, args: {date_from: "2026-10-12", date_to: "2026-10-18"}}
  facts: ["PO-2026-004268", "628825", "9500"]

- id: po-01:6:Q2-b
  question: "01:6:Q2"
  prompt: >
    Push the delivery date on PO-2026-005575 back by a week, to 17 November 2026.
  ref:
    - {tool: update_purchase_order_delivery_date, args: {po_id: PO-2026-005575, due_date: "2026-11-17"}}
  facts: ["2026-11-10", "2026-11-17"]
  notes: "Tool description says it changes a PO line date but it takes only po_id and updates the PO header due_date; there is no line_no. It also does not move the ship date or any supplier confirmation."

- id: po-02:13:Q1-a
  question: "02:13:Q1"
  prompt: >
    Style STY-7731 is running late. Which of its orders is shipped but overdue, how many units is that, and how
    many days overdue is it?
  ref:
    - {tool: get_purchase_order_status_for_style, args: {style_id: STY-7731}}
  facts: ["PO-2026-004072", "5000", "31", "shipped"]
  notes: "Style STY-7731 returns several rows with the same po_id (PO-2026-004655, PO-2026-004745) repeated per SKU, and a draft PO (PO-2026-004317) with an order_date of 2026-10-18, in the future. Only one genuinely overdue shipped order exists, not 'three weeks late' for the whole style."

- id: po-02:13:Q4-a
  question: "02:13:Q4"
  prompt: >
    Which open purchase orders are running late right now? Give me the three most overdue, with their
    suppliers and how many days overdue each is.
  ref:
    - {tool: list_open_purchase_orders_with_delay, args: {}}
  facts: ["PO-2026-005621", "PO-2026-005775", "PO-2026-005978", "32"]
  notes: "list_open_purchase_orders_with_delay (e.g. SUP-0031, PO-2026-005621, 32 days overdue) contradicts get_supplier_on_time_delivery_history, which reports the same PO as 'On Time', 0 days late, with actual_delivery equal to due_date even for shipped and future-dated orders. On-time history cannot be trusted for the air-freight budget question."

- id: po-02:13:Q5-a
  question: "02:13:Q5"
  prompt: >
    PO-2026-004982 is stuck. What lines are on it, what quantity of each, and have any been received?
  ref:
    - {tool: get_purchase_order_line_status, args: {po_id: PO-2026-004982}}
  facts: ["SKU-101589", "SKU-103633", "5000", "Not received"]

- id: po-02:14:Q6-a
  question: "02:14:Q6"
  prompt: >
    PO-2026-004663 with supplier SUP-0076 falls under the forced-labour review. Put it on hold with the reason
    "Forced labour risk - under review", under EMP-0001, and confirm the hold is in place.
  ref:
    - {tool: block_purchase_orders_for_supplier, args: {po_id: PO-2026-004663, block_reason: "Forced labour risk - under review", blocked_by: EMP-0001}}
  facts: ["active", "supplier", "PO-2026-004663"]
  notes: "The tool blocks one PO at a time (it takes po_id, not supplier_id), so 'hold all open POs for a supplier' needs one call per PO. PO-2026-004663 already carries an active forced-labour block (BLK-000002), so a second block duplicates it; blocked_at comes back blank."

- id: po-03:22:Q1-a
  question: "03:22:Q1"
  prompt: >
    SKU-101897 stocked out. What purchase orders have been placed for it, with quantities, due dates and status?
    Is the open one received yet?
  ref:
    - {tool: get_purchase_orders_for_product, args: {sku: SKU-101897}}
  facts: ["PO-2026-004312", "2000", "2026-10-25", "shipped"]

- id: po-03:24:Q3-a
  question: "03:24:Q3"
  prompt: >
    Which open orders use component SKU-101442 (zips and trims), who are they with and what quantity of it is on
    each?
  ref:
    - {tool: list_open_orders_using_component, args: {sku: SKU-101442}}
  facts: ["PO-2026-004982", "PO-2026-005916", "Roberts Garments", "3000"]

- id: po-03:24:Q5-a
  question: "03:24:Q5"
  prompt: >
    For supplier SUP-0068, how far do their quoted lead times sit from what we actually get, and what is their
    on-time and in-full service level?
  ref:
    - {tool: get_quoted_vs_actual_lead_time_by_supplier, args: {supplier_id: SUP-0068}}
    - {tool: get_service_level_by_supplier, args: {supplier_id: SUP-0068}}
  facts: ["23.8", "28.9", "5.1", "100"]
  notes: "The quoted-vs-actual gap for SUP-0068 is 5.1 days (not the ~10 days in the question). avg_promised_lead_time_days equals avg_actual_lead_time_days exactly, and the service level is 100% on-time, so the planted lateness story is absent from this supplier. Quoted lead times in get_supplier_lead_times (14-28 days per SKU) differ from the 23.8 average."

- id: po-04:33:Q1-a
  question: "04:33:Q1"
  prompt: >
    Look at the order delay history for factory FAC-0001. Which supplier is it making for, and is a delay reason
    recorded on any of the orders?
  ref:
    - {tool: get_order_delay_history_for_factory, args: {factory_id: FAC-0001}}
  facts: ["Brown Textiles", "None recorded"]
  notes: "get_order_delay_history_for_factory shows promised_delivery_date = expected_delivery = due_date on every row and delay_reason 'None recorded' throughout, so it cannot show lateness or a cause. The 'five straight late orders' story is not seeded for FAC-0001."

- id: po-04:35:Q4-a
  question: "04:35:Q4"
  prompt: >
    Supplier SUP-0068 is a key packaging supplier. What categories do they supply us, and what open orders do
    we have with them right now (units and value)?
  ref:
    - {tool: get_supplier_supplied_items, args: {supplier_id: SUP-0068}}
    - {tool: get_open_orders_for_supplier, args: {supplier_id: SUP-0068}}
  facts: ["Bodycare", "Skincare", "PO-2026-005116", "48180"]
  notes: "SUP-0068 supplies bodycare, skincare and haircare, not packaging. get_open_orders_for_supplier returns a single bare record (no row count header) whose status is 'confirmed', a status not in the PO status enum used by search_purchase_orders."

- id: po-04:38:Q6-a
  question: "04:38:Q6"
  prompt: >
    Supplier SUP-0022 has missed a critical delivery. It's the 5,000-unit order into DC4 that was due on 6
    September 2026. Find that order and tell me its delivery status and how late the delay is judged to be.
  ref:
    - {tool: search_purchase_orders, args: {supplier_id: SUP-0022, dest_site_id: DC4, due_date: "2026-09-06"}}
    - {tool: get_purchase_order_delivery_status, args: {po_id: PO-2026-004072}}
    - {tool: get_order_delay_impact, args: {po_id: PO-2026-004072}}
  facts: ["PO-2026-004072", "shipped", "134250"]
  notes: "get_order_delay_impact reports delay_days 0 and a blank confirmed_delivery for PO-2026-004072 even though it is shipped, 5,000 units received 0 and a month past due (list_open_purchase_orders_with_delay says 31 days). Delivery status shows confirmed_delivery equal to promised, so the delay is invisible. search_purchase_orders's due_date is a '<=' filter so it also returns older closed POs, and has no SKU filter despite its description."

- id: po-04:35:Q1-a
  question: "04:35:Q1"
  prompt: >
    What amendments have been made to our orders with supplier SUP-0027, and why?
  ref:
    - {tool: get_order_change_history_for_supplier, args: {supplier_id: SUP-0027}}
  facts: ["PO-2026-004908", "ship_date", "Market demand change", "implemented"]
  notes: "Only two amendments exist for SUP-0027, both on one PO and both with the same reason; no pattern of late changes to support the 'our own late changes' question. One amendment (AMD-000001) was requested in March for a ship date in August and is marked implemented while the later one is still only 'requested'."

- id: po-05:43:Q4-a
  question: "05:43:Q4"
  prompt: >
    Factory FAC-0021 failed its audit. List its open purchase orders, then put them all on hold pending
    corrective action, as EMP-0001, reason "Audit failed".
  ref:
    - {tool: get_open_purchase_orders_by_factory, args: {factory_id: FAC-0021}}
    - {tool: block_purchase_orders_for_factory, args: {po_id: PO-2026-005575, block_reason: "Audit failed", blocked_by: EMP-0001}}
    - {tool: block_purchase_orders_for_factory, args: {po_id: PO-2026-005658, block_reason: "Audit failed", blocked_by: EMP-0001}}
  facts: ["PO-2026-005575", "PO-2026-005658", "active"]
  notes: "block_purchase_orders_for_factory blocks one PO per call (takes po_id, not factory_id), so the model must loop over the factory's open POs. The factory's POs are tagged status 'open' while the order table mixes open/confirmed/shipped, so 'not in production yet' cannot be told apart."

- id: po-04:32:Q1-a
  question: "04:32:Q1"
  prompt: >
    What is the price history for SKU-100238 over the orders we have placed: the lowest, highest and average
    unit price paid, and how many orders is that based on?
  ref:
    - {tool: get_historical_unit_price_for_product, args: {sku: SKU-100238}}
  facts: ["7.58", "8.37", "7.98", "3"]
  notes: "Only three priced orders exist for the SKU, all with SUP-0068; the order of 2026-10-25 (PO-2026-005275, draft) is future-dated and excluded. Price spread is small (£0.39) so it gives little basis for a 'quote gap' analysis."

- id: po-04:36:Q1-a
  question: "04:36:Q1"
  prompt: >
    How many purchase orders have we placed off contract, and which are the most recent three?
  ref:
    - {tool: list_off_contract_purchase_orders, args: {}}
  facts: ["577", "PO-2026-004567", "PO-2026-004932", "PO-2026-005398"]
  notes: "577 off-contract POs is a large share of ~2,200 total with no planted cluster by category or supplier; the tool shows only 50 and carries no contract or category columns, so 'where is the spend going' cannot be answered. Maverick vs contract-gap split is not possible."

- id: po-08:78:Q5-a
  question: "08:78:Q5"
  prompt: >
    Supplier SUP-0022 has a 6,000-unit order due 6 November 2026 that is still in draft. Find it and send the
    supplier a request to confirm stock and delivery dates for that order.
  ref:
    - {tool: search_purchase_orders, args: {supplier_id: SUP-0022, status: draft, due_date: "2026-11-06"}}
    - {tool: send_stock_confirmation_request_to_supplier, args: {po_id: PO-2026-005594, supplier_id: SUP-0022}}
  facts: ["PO-2026-005594", "requested"]
  notes: "search_purchase_orders status filter accepts only draft/submitted/approved/rejected/ordered/received, but the data uses open/confirmed/shipped/closed/cancelled, so most real POs cannot be filtered by status (status 'open' or 'shipped' is rejected with an error). The draft PO has order_date 2026-10-08, one day after today."
