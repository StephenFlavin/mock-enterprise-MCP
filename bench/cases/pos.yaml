- id: pos-03:25:Q5-a
  question: "03:25:Q5"
  prompt: >
    Our new Tops range is behind plan on sell-through and I suspect the size buying. What does the size mix of
    Tops units sold over the last 30 days look like, and which sizes sell most?
  ref:
    - {tool: get_size_curve_vs_sales, args: {category: Tops}}
  facts: ["18.1", "16.9", "12.7", "8.4"]
  notes: "Tool is described as 'versus the expected curve' but returns no expected curve, only actual sales_pct, so over/under-buying cannot be judged. Tops sizes include 'No Size', 'One Size' and numeric sizes (10, 12, 14), which is noise for apparel."

- id: pos-03:25:Q5-b
  question: "03:25:Q5"
  prompt: >
    For the Tops range over the last 30 days, which two stores sold the most units, and how many each?
  ref:
    - {tool: get_store_sell_through_ranking, args: {category: Tops}}
  facts: ["ST214", "18", "ST003", "12"]
  notes: "Story says Glasgow (ST214) underperforms on sell-through, but the data ranks ST214 1st of 32 stores (18 units) and ST001 27th. Tool ranks by units sold, not sell-through % (no stock/plan denominator), and ties (e.g. ST011/ST088/ST047 at 1 unit) are ranked arbitrarily. Units are very low (1-18 per store) so ranking is dominated by noise."

- id: pos-03:27:Q6
  question: "03:27:Q6"
  prompt: >
    Over the last 30 days, how do unit sales and revenue compare between products with high shelf availability
    (90%+) and those with medium availability (70-89%)? How many products fall in each group?
  ref:
    - {tool: get_availability_impact_on_sales, args: {days_back: 30}}
  facts: ["300", "4272", "163", "374"]
  notes: "Story says 5 products in the medium band sell 40% less than high-availability ones; the data has 163 medium SKUs and 300 high SKUs, so planted rows are swamped by generated noise. Total units are per bucket, not per SKU, and an SKU can appear in several buckets, so the buckets are not a clean comparison and 'lost sales' is not computed despite the description."

- id: pos-07:68:Q5
  question: "07:68:Q5"
  prompt: >
    Store ST214 has had a run of voids recently. List its voids over the last 4 weeks. Which employee processed
    most of them, on which till, and what reasons were given?
  ref:
    - {tool: list_pos_exceptions, args: {store_id: ST214, exception_type: void}}
  facts: ["EMP-00001", "T01", "operator error", "duplicate"]
  notes: "Question says Leeds, but the seeded story sits in ST214 Glasgow (Scotland); the Leeds stores (ST150, ST159, ST164, ST165, ST181, ST183) have no seeded exceptions, so the case uses ST214. Tool lists rows only (limit 50), with no counts or totals, and exposes no staff or CCTV link."

- id: pos-08:71:Q1
  question: "08:71:Q1"
  prompt: >
    Why are voids and refunds so high at my store ST214? Show the voids, refunds and discounts by till and
    employee over the last 4 weeks and tell me who and which till stand out.
  ref:
    - {tool: get_pos_voids_and_refunds_for_store, args: {store_id: ST214}}
  facts: ["EMP-00001", "T01", "576", "412"]
  notes: "Story says exceptions cluster in the afternoon (14:00-16:00), but the data has them at 09:00-12:30 and the tool has no time-of-day dimension. The store has no comparison with peer stores. Output also includes scan_exception rows although the description only names voids, refunds and discounts."

- id: pos-08:71:Q2
  question: "08:71:Q2"
  prompt: >
    SKU-100070 has gaps on the shelf at store ST001 even though the system shows stock. Over the last 72 hours,
    when did it sell there, how many units and what revenue, and what was shelf availability at the time?
  ref:
    - {tool: get_hourly_sales_for_product, args: {sku: SKU-100070, store_id: ST001}}
  facts: ["10:00", "127.98", "95"]
  notes: "Story says SKU-100070/100077 sell strongly on 2026-09-09/10 then drop after 09-11 with availability at 75% and a 10:00-11:00 peak; the data has a single ST001 sale of SKU-100070 (2 units, 2026-10-04 10:00, availability 95%), so no trend is visible. SKU-100084 has no ST001 sales at all. Tool takes one SKU per call, so the question's three lines need three calls."

- id: pos-08:71:Q4
  question: "08:71:Q4"
  prompt: >
    For store ST214, what were the daily sales over the last 30 days? What was the best revenue day and how much
    was it, and what margin percentage did the store make on the latest day?
  ref:
    - {tool: get_sales_history_for_store_dates, args: {store_id: ST214, date_from: -30d}}
  facts: ["2026-09-24", "276", "38.2"]
  notes: "Story says £1000-1500 daily revenue, 95% margin and 7-12 transactions a day; the data has £50-276 a day, 1-2 transactions and 32-38% margin, with only 11 trading days in 30. Tool gives only the store's own history, so local events, roadworks or competitor effects cannot be tied to it."

- id: pos-08:73:Q4
  question: "08:73:Q4"
  prompt: >
    How is the UK North region doing on sales so far this period: units, revenue, margin and margin %?
  ref:
    - {tool: get_period_sales_to_date_for_region, args: {region: UK North, period: this period}}
  facts: ["28", "1876", "672", "35.8"]
  notes: "Story says ~8000 units and £400k+ for UK North at 60-65% margin; the data shows only 28 units and £1,876 (35.8% margin), while generated UK South has 3,496 units and £263,782 (68.5%), so the seeded region is tiny and inconsistent with generated margins. The 'period' argument is ignored (always the last 30 days) and the tool returns no last-year comparison despite the description."

- id: pos-08:77:Q2
  question: "08:77:Q2"
  prompt: >
    What have weekly units, revenue and margin % been for Tops over the last 26 weeks? Give me the latest week's figures.
  ref:
    - {tool: get_sales_and_margin_history_for_category, args: {category: Tops, weeks_back: 26}}
  facts: ["2026-09-28", "55", "2902", "50.8"]
  notes: "Story says Tops runs at ~£200k/week, 38% margin and 2,100 units/week; the data has £1.3-2.9k/week and 51-65% margin. Only 8 weeks come back for a 26-week request (data starts mid-August). Tool returns history only: no elasticity or price data for the 5% price-rise question."

- id: pos-08:77:Q3
  question: "08:77:Q3"
  prompt: >
    How did the size mix of Lighting unit sales look in the latest week, and how does it compare with the week before?
  ref:
    - {tool: get_sales_mix_shift_for_category, args: {category: Lighting, weeks_back: 13}}
  facts: ["One Size", "41.7", "16.7", "27.8"]
  notes: "Tool only gives size share by week, not style, price investment, cost or discounting, so it cannot answer why homeware margin fell. Story says the mix is stable week to week, but it swings (One Size 41.7% latest week vs 11.1% the week before). Lighting has sizes XS-XXL, which is implausible for the category. The question says homeware; the category is 'Lighting'."

- id: pos-08:79:Q1
  question: "08:79:Q1"
  prompt: >
    Look at voids, refunds and discounts across the Scotland region over the last six weeks. Which stores are
    involved, and what are the counts and values by exception type?
  ref:
    - {tool: get_pos_voids_and_refunds_for_region, args: {region: Scotland, date_from: -42d}}
  facts: ["ST214", "832", "796", "520"]
  notes: "Only one Scotland store (ST214) has any data, so there is no store comparison. Region tool has no employee, till or time-window dimension, so organised vs internal theft windows cannot be located; run_pos_exception_report adds weekly trend only. Story says 25+ exceptions worth £1,600+; data has 34 worth £2,364."

- id: pos-08:79:Q5-a
  question: "08:79:Q5"
  prompt: >
    Self-checkout shrink is up at store ST214. What are its scan exception rates by rule type?
  ref:
    - {tool: get_self_checkout_scan_exception_rates, args: {store_id: ST214}}
  facts: ["4.5", "3.8", "2.1"]
  notes: "Description promises a 4-week trend but the tool returns one average rate per store and rule type. Worse stores exist than ST214 (ST036 weight_tolerance 5.0%, ST024 4.9%), so the 'five stores' are not identifiable as a set. One output row has a blank store (chain-wide rules, store_id empty). No chain-average figure is returned for comparison."

- id: pos-08:79:Q5-b
  question: "08:79:Q5"
  prompt: >
    Tighten the unexpected-item self-checkout rule at store ST214 (rule SCR-900003) by setting its threshold to 0.1.
  ref:
    - {tool: update_self_checkout_exception_rule, args: {rule_id: SCR-900003, threshold_value: 0.1}}
  facts: ["SCR-900003", "0.15", "0.1"]
  notes: "No tool in this system lists rules or their ids, so the rule id must be given in the prompt. Story says the rules look too sensitive and should be loosened (higher threshold), but the question says tighten; direction is ambiguous for a percent threshold."
