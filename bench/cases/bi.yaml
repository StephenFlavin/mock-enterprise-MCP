- id: bi-06:54:Q5-a
  question: "06:54:Q5"
  prompt: >
    I'm preparing for the range review. How is the range doing against plan over the last 30 days? Show me sales,
    margin, returns and ratings against plan and tell me which products are the biggest movers.
  ref:
    - {tool: get_range_performance_vs_plan, args: {period_from: -30d}}
  facts: [["SKU-100014", "Blush Blouse 12"], ["PF-220", "Portable Rechargeable Desk Fan"], ["K-1700", "Glass Kettle"], "-27.4"]

- id: bi-06:54:Q5-b
  question: "06:54:Q5"
  prompt: >
    Which products have the biggest margin gap against plan over the last 30 days? Give me the margin achieved,
    the plan margin and the gap for the worst ones.
  ref:
    - {tool: get_margin_vs_plan_by_product, args: {period_from: -30d}}
  facts: [["SKU-100014", "Blush Blouse 12"], "22.8", ["K-1700", "Glass Kettle"], "27.4"]

- id: bi-06:54:Q5-c
  question: "06:54:Q5"
  prompt: >
    Flag the outlier products against plan for the last 30 days: anything whose sales or margin is more than
    10% away from plan. Products only, not stores.
  ref:
    - {tool: list_outliers_vs_plan, args: {period_from: -30d, variance_threshold_pct: 10, entity_type: product}}
  facts: [["SKU-100014", "Blush Blouse 12"], ["PF-220", "Desk Fan"], ["K-1700", "Glass Kettle"], "-21.7"]

- id: bi-06:54:Q5-d
  question: "06:54:Q5"
  prompt: >
    Just the Electricals range: how is K-1700 doing against plan over the last 30 days on sales, margin, returns
    and rating, and what is driving the problem?
  ref:
    - {tool: get_range_performance_vs_plan, args: {period_from: -30d, sku: K-1700}}
  facts: ["6.8", "3.1", "27.4", "31"]

- id: bi-08:73:Q2-a
  question: "08:73:Q2"
  prompt: >
    Which stores in the UK North region need attention? Show me the stores missing their sales or margin
    targets over the last 30 days, worst first, with the shortfall.
  ref:
    - {tool: list_stores_below_target, args: {region: UK North, period_from: -30d}}
  facts: ["ST143", "ST142", "ST150", ["11100", "11,100"]]

- id: bi-08:73:Q2-b
  question: "08:73:Q2"
  prompt: >
    For the UK North region over the last 30 days, how do store margins compare with target? I want the lowest
    margin stores and how far they are from target.
  ref:
    - {tool: get_margin_by_store, args: {region: UK North, period_from: -30d}}
  facts: ["ST143", "26.1", "ST142", "28.2", "32.5"]

- id: bi-08:73:Q2-c
  question: "08:73:Q2"
  prompt: >
    Give me the UK North store performance summary for the last 30 days. Which store has the worst availability,
    and what are its shrink and labour cost percentages?
  ref:
    - {tool: get_store_performance_summary_for_region, args: {region: UK North, period_from: -30d}}
  facts: ["ST143", "92.3", "2.8", "12.1"]

- id: bi-08:73:Q3
  question: "08:73:Q3"
  prompt: >
    Where should I focus visits and investment next quarter in the UK North region? Rank the stores by priority
    and tell me what the ranking depends on.
  ref:
    - {tool: calculate_store_priority_score, args: {region: UK North, period_from: -30d}}
  facts: ["ST143", "ST142", "ST150", ["sales shortfall", "sales_shortfall_pct"], ["margin shortfall", "margin_shortfall_pct"]]

- id: bi-08:73:Q4
  question: "08:73:Q4"
  prompt: >
    Which stores in the UK North region drive the variance against plan over the last 30 days? Split it into
    sales volume and margin rate and tell me the biggest ones.
  ref:
    - {tool: calculate_variance_drivers_by_store, args: {region: UK North, period_from: -30d}}
  facts: ["ST143", "ST142", ["-11100", "11,100"], ["sales volume", "volume"]]

- id: bi-09:81:Q6-a
  question: "09:81:Q6"
  prompt: >
    What are the critical data quality issues hurting our reporting? Tell me the business impact of each, which
    KPIs are affected and who owns the fix.
  ref:
    - {tool: get_data_quality_issue_impact, args: {severity: critical}}
  facts: ["DQ-900001", "DQ-900005", ["Anne Turner", "EMP-00099"], ["Dean Murray-Davies", "EMP-00095"], "Labour cost"]

- id: bi-09:81:Q6-b
  question: "09:81:Q6"
  prompt: >
    Of all the open data quality issues, which one can be fixed fastest, how long will it take, and who owns it?
  ref:
    - {tool: get_data_quality_issue_impact, args: {}}
  facts: ["DQ-900002", ["Mary Fraser", "EMP-00096"], "3"]

- id: bi-09:89:Q5
  question: "09:89:Q5"
  prompt: >
    Set up a weekly Workforce Report covering attrition, absence and time-to-hire, sent to
    hr.director@company.com.
  ref:
    - {tool: create_scheduled_report, args: {report_type: Workforce Report, recipient_emails: hr.director@company.com, frequency: weekly}}
  facts: ["weekly", "hr.director@company.com"]
