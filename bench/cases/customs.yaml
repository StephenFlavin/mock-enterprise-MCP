- id: customs-02:13:Q3
  question: "02:13:Q3"
  prompt: >
    Any restrictions on lithium batteries when shipping by air from Bangladesh and from Vietnam to the UK?
  ref:
    - {tool: search_dangerous_goods_restrictions, args: {origin_country: Bangladesh, destination_country: GB, transport_mode: air}}
    - {tool: search_dangerous_goods_restrictions, args: {origin_country: Vietnam, destination_country: GB, transport_mode: air}}
  facts: ["UN3480", "cargo aircraft", "30%", "Civil Aviation Authority"]

- id: customs-02:13:Q5
  question: "02:13:Q5"
  prompt: >
    We are moving 500 portable rechargeable fans with built-in lithium batteries (HS 8414) from Bangladesh to the UK.
    What dangerous-goods restrictions apply flying direct, and what applies to the transfer through the UAE?
  ref:
    - {tool: check_dangerous_goods_restrictions, args: {origin_country: Bangladesh, destination_country: GB, hs_code: "8414", transport_mode: air}}
    - {tool: check_dangerous_goods_restrictions, args: {origin_country: UAE, destination_country: GB, hs_code: "8414", transport_mode: air}}
  facts: ["UN3481", "Civil Aviation Authority", "carrier approval", "Class 9"]
  notes: "The question does not name the hero product; the case uses a battery-powered fan (HS 8414) so that the dangerous-goods check has something to find."

- id: customs-02:14:Q1-a
  question: "02:14:Q1"
  prompt: >
    What are the current duty rates and any additional tariffs on cotton knit tops (HS 6110) from Vietnam, Bangladesh
    and Turkey into the UK, EU and US, and what has changed in the last 12 months?
  ref:
    - {tool: get_tariff_rates_by_hs_code_and_country, args: {hs_code: "6110"}}
    - {tool: get_additional_tariffs_and_trade_remedies, args: {hs_code: "6110"}}
    - {tool: get_tariff_change_history, args: {hs_code: "6110"}}
  facts: ["16.5", "reciprocal", "2026-06-07"]

- id: customs-02:14:Q1-b
  question: "02:14:Q1"
  prompt: >
    For HS 6110 cotton knit tops from Vietnam, Bangladesh and Turkey into the UK and EU, which routes qualify for
    preferential rates and what proof of origin do we need?
  ref:
    - {tool: search_preferential_trade_agreements, args: {hs_code: "6110"}}
    - {tool: get_required_origin_documents, args: {origin_country: Turkey}}
    - {tool: get_required_origin_documents, args: {origin_country: Vietnam}}
  facts: ["UK-Vietnam FTA", "EU Everything But Arms", "A.TR movement certificate"]

- id: customs-02:14:Q2-a
  question: "02:14:Q2"
  prompt: >
    We are launching a padded gilet with a detachable fleece liner: shell 100% polyester, liner 100% polyester knit,
    sold as one item. Which HS codes are the likely candidates, and what UK and EU binding rulings exist on similar garments?
  ref:
    - {tool: search_hs_codes, args: {description: padded gilet}}
    - {tool: search_classification_rulings, args: {keyword: padded gilet}}
  facts: ["6202", "6110", "essential character"]

- id: customs-02:14:Q2-b
  question: "02:14:Q2"
  prompt: >
    For the padded gilet, what are the UK duty rates from Vietnam under HS 6202 and HS 6110, and what evidence should
    we hold if customs challenges a 6202 classification?
  ref:
    - {tool: get_tariff_rates_by_hs_code_and_country, args: {hs_code: "6202", origin_country: Vietnam, destination_country: GB}}
    - {tool: get_tariff_rates_by_hs_code_and_country, args: {hs_code: "6110", origin_country: Vietnam, destination_country: GB}}
    - {tool: draft_classification_evidence_checklist, args: {hs_code: "6202"}}
  facts: ["12", "bill of materials", "photographs"]

- id: customs-02:14:Q2-c
  question: "02:14:Q2"
  prompt: >
    Start a binding ruling application for the padded gilet with detachable fleece liner: we apply 6202 because the
    woven padded shell gives the garment its character, and the alternative is 6110 because the liner is knitted.
  ref:
    - {tool: create_binding_ruling_application, args: {product_description: "Padded gilet with detachable fleece liner", hs_code_applied: "6202", hs_code_alternative: "6110", argument_for_applied: "Woven padded shell gives the essential character", argument_for_alternative: "Liner is knitted fleece"}}
  facts: ["6202", "6110"]

