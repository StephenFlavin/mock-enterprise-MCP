- id: customer_service-02:16:Q5-a
  question: "02:16:Q5"
  prompt: >
    "Where is my order" contacts are up about 30% on last month. Show me the weekly contact trend and tell me
    which issues (missed scans, delayed delivery, tracking gaps...) are driving the increase.
  ref:
    - {tool: get_wismo_contact_trend, args: {weeks_back: 8}}
    - {tool: get_wismo_contacts_by_reason, args: {date_from: -28d}}
  facts: ["Missed scan", ["30.9", "31%"], "216"]

- id: customer_service-02:16:Q5-b
  question: "02:16:Q5"
  prompt: >
    Would proactive notifications for orders with a missed scan cut our "where is my order" contacts? Estimate how
    many contacts that would prevent, then turn that proactive delay alert on.
  ref:
    - {tool: calculate_notification_impact_estimate, args: {rule_type: missed_scan_alert}}
    - {tool: update_notification_rule, args: {rule_id: NTF-000001, status: active}}
  facts: ["45", "active"]

- id: customer_service-04:40:Q3
  question: "04:40:Q3"
  prompt: >
    Breakage on glass items is up 40%. Which glass items have the most damage claims in the last 30 days compared
    with the 30 days before, and how many claims is that in total?
  ref:
    - {tool: get_damage_claims_by_item, args: {date_from: -30d, damage_type: glass}}
  facts: ["K-1700", "SKU-104123", "14", "10"]

- id: customer_service-05:42:Q2
  question: "05:42:Q2"
  prompt: >
    Our trouser lot for SKU-100651 passed everything except zip strength, which came in 4% under spec. What are
    the customer complaint patterns for zip strength on this product over the last 90 days, how severe are they,
    and is there a customer safety angle?
  ref:
    - {tool: search_complaints_by_defect_type, args: {defect_type: zip strength, sku: SKU-100651}}
  facts: ["11", "critical", ["cut my finger", "sharp edge", "scratched", "injur"]]

- id: customer_service-06:59:Q4
  question: "06:59:Q4"
  prompt: >
    Which product data errors on our listings (wrong dimensions, materials or compatibility) are causing returns
    and complaints in the last 90 days, what do they cost us, and which product categories are worst?
  ref:
    - {tool: search_customer_service_contacts_by_issue, args: {group_by: error_type}}
    - {tool: search_customer_service_contacts_by_issue, args: {group_by: category}}
  facts: ["compatibility", ["3835.72", "3836", "3,836"], "Cookware", "Small Appliances"]
