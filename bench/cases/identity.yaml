- id: identity-09:85:Q1-a
  question: "09:85:Q1"
  prompt: >
    What needs my attention this week? Look at the open security alerts and the vulnerability scan findings.
    Which findings are the most dangerous (known to be exploited and reachable from the internet, and on which
    asset), and which types of alert have mostly turned out to be false positives in the past?
  ref:
    - {tool: list_open_security_alerts, args: {}}
    - {tool: list_vulnerability_scan_findings, args: {}}
    - {tool: get_alert_false_positive_history, args: {}}
  facts: ["CVE-2024-1234", "AST-DC1-CNV", ["failed_login_spike", "failed login"], ["unusual_port_activity", "unusual port"], "82"]

- id: identity-09:85:Q1-b
  question: "09:85:Q1"
  prompt: >
    Close alert ALT-900006 as a false positive: the user had just come back from leave and forgot their password.
  ref:
    - {tool: update_security_alert_status, args: {alert_id: ALT-900006, status: false_positive, disposition_reason: User forgot password after leave}}
  facts: ["ALT-900006", ["false_positive", "false positive"]]

- id: identity-09:85:Q2-a
  question: "09:85:Q2"
  prompt: >
    Supplier portal user SUPP-00001 logged in at 03:12 from an unusual location and went into the EDI portal and then
    the vendor portal. Using the auth logs and session history of the last two weeks: where did the logins come from,
    where does this user normally log in from, what record types did the sessions view, and were there failed
    attempts first?
  ref:
    - {tool: search_auth_logs, args: {user_id: SUPP-00001}}
    - {tool: get_user_session_history, args: {user_id: SUPP-00001}}
  facts: ["Mumbai", "192.0.2.89", "Shanghai", ["bank_details", "bank details"], ["failed", "2 failed", "two failed"]]

- id: identity-09:85:Q2-b
  question: "09:85:Q2"
  prompt: >
    It is a real incident. Open a critical security incident for alert ALT-900002 (supplier user SUPP-00001 viewed
    vendor bank details after a login from Mumbai), type data_exfil, affecting edi_portal and vendor_portal.
  ref:
    - {tool: create_security_incident, args: {alert_ids: ALT-900002, incident_type: data_exfil, severity: critical, user_involved: SUPP-00001, description: Supplier user viewed vendor bank details after login from Mumbai}}
  facts: ["ALT-900002", "critical"]

- id: identity-09:85:Q2-c
  question: "09:85:Q2"
  prompt: >
    Go ahead and lock supplier account SUPP-00001 because of suspected compromise after the login from Mumbai.
  ref:
    - {tool: block_user_account, args: {user_id: SUPP-00001, lock_reason: Suspected compromise}}
  facts: ["SUPP-00001", "locked"]

- id: identity-09:85:Q3
  question: "09:85:Q3"
  prompt: >
    Our highest-risk third-party connections are CON-900003, CON-900006 and CON-900007. Which of them have
    privileged or admin access and to which systems, and which security control is missing on each?
  ref:
    - {tool: get_connection_access_privileges, args: {connection_id: CON-900003}}
    - {tool: get_connection_access_privileges, args: {connection_id: CON-900006}}
    - {tool: get_connection_access_privileges, args: {connection_id: CON-900007}}
    - {tool: list_controls_in_place_for_connection, args: {connection_id: CON-900003}}
    - {tool: list_controls_in_place_for_connection, args: {connection_id: CON-900006}}
    - {tool: list_controls_in_place_for_connection, args: {connection_id: CON-900007}}
  facts: ["api_gateway", "sftp_gateway", ["MFA", "multi-factor"], ["IP allow", "ip_allowlist", "allow-list", "allowlist"], ["logging", "SIEM"]]
  notes: "integration also has a generated critical, privileged connection CON-000015 (Holmes Trading JSC) that identity holds no access or control data for; identity covers the CON-9000xx connections seeded in integration."

- id: identity-09:85:Q5
  question: "09:85:Q5"
  prompt: >
    Where are the weak points if ransomware hit our warehouse systems? Which systems have the most unpatched
    vulnerabilities that are reachable from the internet, worst first, and what is the worst CVSS score?
  ref:
    - {tool: get_unpatched_exposure_by_system, args: {}}
  facts: [["AST-DC1-CNV", "DC1 conveyor"], "WMS", "Message Queue", "9.8"]
