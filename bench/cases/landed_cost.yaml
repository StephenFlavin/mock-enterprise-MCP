- id: landed_cost-02:12:Q6
  question: "02:12:Q6"
  prompt: >
    Northern European port congestion is bad. For a typical shipment of 10,000 units (about £400,000 FOB, 40ft garment
    containers) from Shanghai (CNSHA) into Northampton DC (DC1), compare door-to-door cost per unit, transit time and
    on-time reliability for going direct to Felixstowe or Rotterdam against sea to Valencia or Piraeus plus rail.
  ref:
    - {tool: calculate_door_to_door_cost, args: {origin_port: CNSHA, dest_site_id: DC1, fob_value_gbp: 400000, units: 10000}}
  facts: ["42.59", "42.84", "72", "82", "39"]
  notes: "Master ports has no Valencia (ESVLC), Piraeus (GRPIR) or Daventry rail terminal (GBDIT); freight_rates uses those UN/LOCODE-style codes as free text."

- id: landed_cost-02:13:Q5
  question: "02:13:Q5"
  prompt: >
    I have 500 units of SKU-101575 on PO PO-2026-005784 stuck behind a late factory exit in Bangladesh, with a
    delivery deadline in 12 days. Compare straight air from Dhaka, sea-air via Dubai and splitting the order on
    landed cost per unit, and tell me the transit time (median and worst case) of each.
  ref:
    - {tool: calculate_landed_cost_per_unit, args: {po_id: PO-2026-005784, sku: SKU-101575, units: 500}}
  facts: ["36.55", "33.75", "35.15", "18"]

- id: landed_cost-02:14:Q4
  question: "02:14:Q4"
  prompt: >
    If a proposed 15% tariff on footwear from Vietnam goes ahead, what does it add to the landed cost of each unit of
    our Vietnam footwear, and what is the landed cost per unit after the tariff?
  ref:
    - {tool: calculate_landed_cost_per_unit, args: {category: Footwear, origin_country: VN, tariff_uplift_pct: 15}}
  facts: ["3.39", "31.52"]
  notes: "Master has no Indonesian factories or products, so the follow-up about shifting volume to Indonesia cannot be answered from this system; India is the only other Asian footwear origin."

- id: landed_cost-04:32:Q3
  question: "04:32:Q3"
  prompt: >
    For next season's bedding range we are comparing SUP-0039, SUP-0011 and SUP-0004. Compare them on landed cost
    per unit and lead time. Which is cheapest and which is the most expensive?
  ref:
    - {tool: calculate_landed_cost_by_supplier, args: {supplier_id: SUP-0039, category: Bedding}}
    - {tool: calculate_landed_cost_by_supplier, args: {supplier_id: SUP-0011, category: Bedding}}
    - {tool: calculate_landed_cost_by_supplier, args: {supplier_id: SUP-0004, category: Bedding}}
  facts: ["Collins Textiles", "10.83", "Connor Products", "42.02"]
  notes: "Each master bedding supplier makes different SKUs, so FOB (and so landed cost per unit) differences between suppliers mostly reflect product mix rather than like-for-like price."

- id: landed_cost-04:33:Q3
  question: "04:33:Q3"
  prompt: >
    We are thinking of moving 20% of our dress volume from Bangladesh to Vietnam. On sea-freight orders over the last
    6 months, compare the average landed cost per unit and the lead time for Womenswear Dresses made in each country.
  ref:
    - {tool: calculate_landed_cost_by_origin, args: {department: Womenswear, category: Dresses, mode: sea}}
  facts: ["33.63", "35.56", "43", "37"]
  notes: "Master has no denim product group, so Womenswear Dresses (made in both Bangladesh and Vietnam) stands in for denim."

- id: landed_cost-04:33:Q6
  question: "04:33:Q6"
  prompt: >
    If we had to diversify away from southern China because of new tariffs, what would happen to cost and lead times?
    Across all our imports over the last 6 months, what is the landed cost uplift on FOB and the average lead time for
    China versus Vietnam and the other origins?
  ref:
    - {tool: calculate_landed_cost_by_origin, args: {}}
  facts: ["24.1", "34", "21.6", "35"]
  notes: "Cost data is by origin country only; master has no southern-China sub-region."

- id: landed_cost-04:34:Q1
  question: "04:34:Q1"
  prompt: >
    Which fashion basics could move to Portugal or Turkey and still be profitable? For Menswear Shirts over the last
    6 months, compare average landed cost per unit, the uplift on FOB and the lead time for Portugal and Turkey
    against Vietnam and China.
  ref:
    - {tool: calculate_landed_cost_by_origin, args: {department: Menswear, category: Shirts}}
  facts: ["40.97", "29.37", "39", "16.2"]
  notes: "Master has no Moroccan factories, so only Portugal and Turkey can be compared. Origins make different styles, so FOB differs by mix; the uplift on FOB is the like-for-like measure."

- id: landed_cost-04:34:Q3
  question: "04:34:Q3"
  prompt: >
    Build a landed cost model for Menswear Outerwear made in Vietnam versus Portugal over the last 6 months, with FOB,
    freight, duty, insurance, handling and inventory holding. Show the landed cost per unit and lead time if freight
    doubles.
  ref:
    - {tool: calculate_landed_cost_by_origin, args: {department: Menswear, category: Outerwear, freight_multiplier: 2}}
  facts: ["41.99", "31.91", "30", "6"]
  notes: "Master has no wool coat product; Menswear Outerwear is the closest group made in both Vietnam and Portugal. EU duty and the 4-week lead-time forecast-error effect are not in this system."

- id: landed_cost-06:58:Q2
  question: "06:58:Q2"
  prompt: >
    For SKU-103185, compare landed cost per unit across the origins we have quotes for at 30,000 units. What is the
    cheapest route, and what does the cheapest option cost per unit if freight rises 50%?
  ref:
    - {tool: compare_landed_cost_across_origins, args: {sku: SKU-103185, units: 30000}}
    - {tool: calculate_landed_cost_by_scenario, args: {sku: SKU-103185, units: 30000, freight_change_pct: 50}}
  facts: ["42.3", ["Vietnam", "VN"], "42.65", "43.06"]

- id: landed_cost-06:58:Q4
  question: "06:58:Q4"
  prompt: >
    How did actual landed costs compare with costed FOB on our Babywear orders over the last 6 months? Which PO line
    ran furthest over, and what drove it?
  ref:
    - {tool: get_actual_landed_cost_by_purchase_order, args: {category: Babywear}}
  facts: ["PO-2026-004898", "85.9", "air", "5.26"]

- id: landed_cost-06:58:Q6
  question: "06:58:Q6"
  prompt: >
    How should we cost next season's range if tariffs might change mid-season? What tariff contingency should we
    build in for each of our import origins, based on the last 6 months of orders?
  ref:
    - {tool: calculate_tariff_contingency_by_origin, args: {}}
  facts: [["China", "CN"], "7.5", "5.2", "3.5"]
  notes: "Who bears tariff risk under supplier terms is in the contracts system, not here."

- id: landed_cost-07:63:Q1
  question: "07:63:Q1"
  prompt: >
    Landed cost on our top 100 selling SKUs rose about 7% recently. Compare orders in the last 60 days with earlier
    ones: what is the average landed cost per unit before and after, and which cost component drove the increase?
  ref:
    - {tool: get_landed_cost_by_sku, args: {top_n_by_sales: 100}}
    - {tool: get_landed_cost_history, args: {top_n_by_sales: 100}}
  facts: ["7.1", "1.98", "freight", "32.5"]
  notes: "Supplier FOB prices in master POs do not move, so supplier price is not a driver; FX effect is only visible as fx_rate on individual lines."

- id: landed_cost-08:77:Q4
  question: "08:77:Q4"
  prompt: >
    A new tariff adds roughly 6% to landed cost on our imported small appliances from the start of next year. Across the Small
    Appliances category, which SKU has the thinnest gross margin today and what does its margin become after the
    tariff? Also, what does the 1.7L kettle K-1700 cost landed per unit today and after the tariff?
  ref:
    - {tool: get_landed_cost_for_products, args: {category: Small Appliances}}
    - {tool: calculate_landed_cost_with_tariff, args: {category: Small Appliances, tariff_rate_pct: 6}}
  facts: ["SKU-101323", "29.9", "25.7", "36.11", "38.27"]
  notes: "Elasticities, competitor responses and scheduled price changes are in the pricing and competitor_prices systems; this system only gives cost, margin and price tier."
