- id: mfp-02:14:Q4
  question: "02:14:Q4"
  prompt: >
    A 15% tariff has been proposed on footwear from Vietnam. What is our planned 2027 footwear buy by origin
    country, and in particular how many units and what landed cost do we plan to buy from Vietnam?
  ref:
    - {tool: get_planned_buy_by_category_and_country, args: {category: Footwear, buy_year: 2027}}
  facts: [80000, [1974000, "1.97m", "1.974m"], ["Indonesia", "ID"], "4000"]
  notes: "Master has no Indonesian footwear products (footwear origins are IT, IN, VN), so the Indonesia footwear line is a small pilot buy that exists only in the plan."

- id: mfp-03:25:Q1
  question: "03:25:Q1"
  prompt: >
    Women's knitwear margin was 3.2 points below plan last month. What was women's knitwear sell-through against
    plan last month, and how does that compare with the month before?
  ref:
    - {tool: get_sell_through_by_category, args: {category: Knitwear, department: Womenswear, date_from: -60d}}
  facts: ["84.4", "94"]

- id: mfp-03:25:Q2
  question: "03:25:Q2"
  prompt: >
    We have £2.1m of open-to-buy for spring. How is it split across categories now, how are categories trending
    on sell-through, and what do the optimistic and cautious cases allocate in total and hold back as in-season
    chase reserve?
  ref:
    - {tool: get_open_to_buy_by_category, args: {season: SS}}
    - {tool: get_category_sell_through_trends, args: {}}
    - {tool: run_open_to_buy_scenario, args: {season: SS}}
    - {tool: calculate_in_season_chase_reserve, args: {total_otb_gbp: 2100000, season: SS}}
    - {tool: compare_buy_scenarios, args: {season: SS}}
  facts: [[1909000, "1.909m", "1.91m"], [1675000, "1.675m", "1.68m"], [191000, "191k"], [425000, "425k"]]

- id: mfp-03:25:Q2-update
  question: "03:25:Q2"
  prompt: >
    Move the Knitwear spring open-to-buy line OTB-900005 to the cautious case: allocate what the cautious case
    allocates and leave the whole reserve unallocated for in-season chases.
  ref:
    - {tool: run_open_to_buy_scenario, args: {season: SS, scenario_type: cautious, category: Knitwear}}
    - {tool: update_open_to_buy_allocation, args: {otb_id: OTB-900005, allocated_gbp: 224000, unallocated_gbp: 106000, chase_reserve_gbp: 106000}}
  facts: [[224000, "224k"], [106000, "106k"]]

- id: mfp-03:25:Q3
  question: "03:25:Q3"
  prompt: >
    The autumn range is selling but not at the rate we planned. Looking at the season so far, which lines are
    furthest behind plan on units sold?
  ref:
    - {tool: get_sell_through_vs_plan, args: {season: AW}}
  facts: ["Outerwear", "15.7", "Knitwear", "9.5"]

- id: mfp-03:25:Q5
  question: "03:25:Q5"
  prompt: >
    Our new athleisure range is behind plan on sell-through. How far behind plan is it overall, and which
    regions are weakest?
  ref:
    - {tool: get_sell_through_vs_plan, args: {range_name: Athleisure}}
    - {tool: get_sell_through_vs_plan, args: {range_name: Athleisure, by: region}}
  facts: ["20", "UK North", "29", "Scotland"]
  notes: "Master data has no athleisure category, so the range is modelled as range_name Athleisure inside the Tops and Trousers categories."

- id: mfp-07:62:Q1
  question: "07:62:Q1"
  prompt: >
    Gross margin is down 1.4 points. How much of that comes from markdown and shrink compared with last year,
    which categories drive each, and which are temporary and which structural?
  ref:
    - {tool: get_markdown_and_shrink_rates, args: {date_from: -60d}}
  facts: ["0.6", "Knitwear", "Outerwear", "Fragrance", ["structural", "Structural"]]

- id: mfp-07:69:Q2
  question: "07:69:Q2"
  prompt: >
    For the SS26 season, which categories hold the most slow-selling stock (SKUs at or under 65% sell-through),
    and how much unsold stock at cost do they hold?
  ref:
    - {tool: get_sell_through_rates, args: {season: SS26, max_sell_through_pct: 65, group_by: category}}
  facts: ["Small Appliances", [6979887, "6.98m", "7.0m"], "Footwear", [3633549, "3.63m", "3.6m"]]

- id: mfp-08:73:Q4
  question: "08:73:Q4"
  prompt: >
    I run UK North. What will the region deliver this period against plan, and which categories are the risk?
  ref:
    - {tool: run_period_outturn_forecast, args: {region: UK North}}
    - {tool: get_sales_forecast_for_region, args: {region: UK North}}
  facts: [[6472300, "6.47m"], "6.2", "Knitwear", "Outerwear"]

- id: mfp-08:80:Q4
  question: "08:80:Q4"
  prompt: >
    We are considering expanding into Spain. What sales should we expect in year one and year three after launch
    in the base case and in the downside case?
  ref:
    - {tool: run_market_sales_forecast, args: {market: Spain}}
  facts: [[3819000, "3.82m", "3.8m"], [19165000, "19.2m", "19.17m"], [2148000, "2.15m", "2.1m"], [10781000, "10.8m", "10.78m"]]
