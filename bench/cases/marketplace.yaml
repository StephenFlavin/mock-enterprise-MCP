- id: marketplace-06:59:Q1
  question: "06:59:Q1"
  prompt: >
    About 340 of our marketplace listings were rejected this week. Group the rejections by error and by the field at fault,
    tell me which can be fixed in bulk and how, and which fields are most often missing. Leave out the listings with missing
    images. Then, since LST-900003 has now been corrected, resubmit it.
  ref:
    - {tool: list_rejected_listings, args: {days_back: 11}}
    - {tool: list_rejected_listings, args: {days_back: 11, exclude_reason_code: MISSING_IMAGE, bulk_fixable_only: true}}
    - {tool: get_rejection_reasons_by_listing, args: {listing_id: LST-900003}}
    - {tool: submit_marketplace_listing_resubmission, args: {listing_id: LST-900003}}
  facts: ["Missing product images", "83", "67", ["EAN", "ean"]]

- id: marketplace-06:59:Q2
  question: "06:59:Q2"
  prompt: >
    What content and data requirements do the German (MKT-DE) and French (MKT-FR) marketplaces have for small kitchen
    appliances such as our kettle K-1700? Which marketplace is strictest, and which mandatory attributes is our PIM missing
    for the German one?
  ref:
    - {tool: search_marketplace_content_requirements, args: {marketplace_id: MKT-DE, category_name: appliances}}
    - {tool: search_marketplace_content_requirements, args: {marketplace_id: MKT-FR, category_name: appliances}}
    - {tool: compare_pim_attributes_to_marketplace_requirements, args: {marketplace_id: MKT-DE, category_id: MKTCAT-000002}}
  facts: [["MKT-DE", "German"], "video", ["energy_label", "energy label"], ["weee_registration_number", "WEEE"]]

- id: marketplace-06:59:Q3
  question: "06:59:Q3"
  prompt: >
    We are restructuring our home category attributes. How is the German marketplace (MKT-DE) category tree for home laid
    out, which PIM category does each branch map to, and what content requirements apply to small kitchen appliances there?
  ref:
    - {tool: get_marketplace_category_tree, args: {marketplace_id: MKT-DE}}
    - {tool: search_marketplace_content_requirements, args: {marketplace_id: MKT-DE, category_name: appliances}}
  facts: ["Home & Living", "Kitchen & Dining", "Small Kitchen Appliances", "Electrics"]

