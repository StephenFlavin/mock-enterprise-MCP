- id: sampling-06:56:Q4
  question: "06:56:Q4"
  prompt: >
    For next year's home range we are considering lighting and storage trends. What is the typical (median)
    standard lead time for each of those categories, and which is shorter? Then raise a test-order request for
    500 units of SKU-104564 (style STY-8491) to test demand.
  ref:
    - {tool: get_standard_lead_times_by_category, args: {category: Lighting}}
    - {tool: get_standard_lead_times_by_category, args: {category: Storage}}
    - {tool: create_test_order_request, args: {sku: SKU-104564, style_id: STY-8491, volume_units: 500, purpose: trend_validation}}
  facts: ["Storage", "45", "56", "500"]
