- id: hse-01:6:Q3
  question: "01:6:Q3"
  prompt: >
    We are weighing a 22:00 to 06:00 late shift against overtime on the existing shifts at DC1 for peak. Before we decide,
    what fatigue-related incidents has DC1 had in the last 90 days: which shifts, what tasks, and what was the most serious?
  ref:
    - {tool: list_fatigue_related_incidents, args: {site_id: DC1}}
  facts: ["night", "late", "overtime", "Dock area"]

- id: hse-01:9:Q1-a
  question: "01:9:Q1"
  prompt: >
    What are our biggest safety risks right now? Look at the last 12 months of incidents and near misses across our three
    UK DCs (DC1, DC2 and DC3), rather than just the headline numbers.
  ref:
    - {tool: list_incidents, args: {}}
  facts: ["pedestrian", "racking", "mezzanine"]

- id: hse-01:9:Q1-b
  question: "01:9:Q1"
  prompt: >
    Which open corrective actions at DC1, DC2 and DC3 are overdue, who owns them and how late are they?
  ref:
    - {tool: list_open_corrective_actions, args: {overdue_only: true}}
  facts: ["CA-900006", "CA-900014", "CA-900015", "CA-900016"]

- id: hse-01:9:Q1-c
  question: "01:9:Q1"
  prompt: >
    Corrective action CA-900004 (forklift operator refresher training at DC1) was finished a week ago. Please close it.
  ref:
    - {tool: update_corrective_action_status, args: {ca_id: CA-900004, status: closed, completed_date: "2026-09-30"}}
  facts: ["CA-900004", "closed"]

- id: hse-01:9:Q2-a
  question: "01:9:Q2"
  prompt: >
    DC3 is one of the two newest sites getting electric reach trucks in January. What do its current risk assessments say
    about battery charging, and what is the state of its reach truck assessment?
  ref:
    - {tool: list_risk_assessments_by_site, args: {site_id: DC3}}
  facts: ["lead-acid", "hydrogen", "Reach truck"]

- id: hse-01:9:Q2-b
  question: "01:9:Q2"
  prompt: >
    Assign an action to the DC4 site manager, EMP-00276, to create a battery charging risk assessment for the electric
    reach truck rollout, due in 60 days.
  ref:
    - {tool: create_corrective_action, args: {site_id: DC4, owner: EMP-00276, description: "Create battery charging risk assessment for electric reach trucks", due_date: "+60d"}}
  facts: ["DC4", "EMP-00276"]

- id: hse-01:9:Q3-a
  question: "01:9:Q3"
  prompt: >
    Forklift-pedestrian near misses went up in Q3 at DC1. Which aisles or crossing points are the hotspots over the last
    90 days?
  ref:
    - {tool: get_incident_location_heatmap, args: {site_id: DC1, equipment_involved: forklift, description: pedestrian}}
  facts: ["Aisle 7", "Crossing point B2", "Crossing point A1"]

- id: hse-01:9:Q3-b
  question: "01:9:Q3"
  prompt: >
    What is driving the forklift-pedestrian incidents at DC1 over the last 90 days? Look at which shift they happen on and
    the recorded root causes.
  ref:
    - {tool: list_incidents, args: {site_id: DC1, equipment_involved: forklift, description: pedestrian, occurred_from: -90d}}
  facts: ["late", "Layout change", "Inadequate training"]

- id: hse-01:9:Q3-c
  question: "01:9:Q3"
  prompt: >
    Raise a corrective action at DC1 for the crossing point B2 hotspot (incident INC-900009): add barriers and mirrors,
    owner EMP-00108, due in 45 days.
  ref:
    - {tool: create_corrective_action, args: {site_id: DC1, owner: EMP-00108, incident_id: INC-900009, description: "Add barriers and mirrors at crossing point B2", due_date: "+45d"}}
  facts: ["DC1", "INC-900009", "EMP-00108"]

- id: hse-01:9:Q4
  question: "01:9:Q4"
  prompt: >
    Before we compare exclusion zones, proximity sensors and speed limiters at DC1: what forklift incidents have we had at
    DC1 over the last 12 months, where do they happen and what was the most serious?
  ref:
    - {tool: list_incidents, args: {site_id: DC1, equipment_involved: forklift}}
  facts: ["critical", "crushed", "Aisle 7", "Crossing point B2"]

- id: hse-01:9:Q5-a
  question: "01:9:Q5"
  prompt: >
    Which of our sites are in Germany, and which safety regimes apply to them?
  ref:
    - {tool: list_site_jurisdictions, args: {country: DE}}
  facts: ["DC8", "ST228", "ST237", "BetrSichV", "ArbSchG"]

- id: hse-01:9:Q5-d
  question: "01:9:Q5"
  prompt: >
    Which of our sites are in Poland, and which safety regimes apply to them?
  ref:
    - {tool: list_site_jurisdictions, args: {country: PL}}
  facts: ["DC7", "ST256", "ST259", ["Kodeks pracy", "Labour Code"], "BHP"]

- id: hse-01:9:Q5-b
  question: "01:9:Q5"
  prompt: >
    What safety procedures do we have at Munich Shopping Centre (ST233), and which are not currently active?
  ref:
    - {tool: list_site_safety_procedures, args: {site_id: ST233}}
  facts: ["Delivery receiving", "inactive", "Manual handling"]

- id: hse-01:9:Q5-c
  question: "01:9:Q5"
  prompt: >
    Log a corrective action at ST233 (Germany) to reinstate its inactive delivery receiving procedure. Owner EMP-00108,
    due in 56 days.
  ref:
    - {tool: create_corrective_action, args: {site_id: ST233, owner: EMP-00108, description: "Reinstate delivery receiving procedure", due_date: "+56d"}}
  facts: ["ST233", "EMP-00108"]

- id: hse-01:10:Q3
  question: "01:10:Q3"
  prompt: >
    We plan to update the AMR fleet at DC1 to firmware 4.7 before peak. What do the safety validation records for
    firmware updates at DC1 show, and is anything outstanding?
  ref:
    - {tool: get_safety_validation_records, args: {site_id: DC1, validation_type: firmware}}
  facts: ["robot-007", "needs_review", "zone-stop"]
  notes: "AMR robots are not in the master asset register, so their validation rows carry their own site, name and firmware (robot ids as in wcs)."

- id: hse-09:88:Q1
  question: "09:88:Q1"
  prompt: >
    How do our DCs compare on safety over the last 12 months, and which one is the worst?
  ref:
    - {tool: get_site_safety_incidents, args: {}}
  facts: ["DC1", "Northampton", "62.3"]
