- id: integration-01:8:Q1
  question: "01:8:Q1"
  prompt: >
    About 140 orders have been stuck in allocation failed since early this morning. Look at the interface errors
    between our systems from the last week: is an interface failure behind it, which interface, what job or change
    caused it and how many SKUs does it affect?
  ref:
    - {tool: list_interface_errors, args: {date_from: -7d}}
  facts: ["ERP_to_WMS", "PKSYNC-0410", "inner pack", "14"]

- id: integration-01:8:Q2
  question: "01:8:Q2"
  prompt: >
    ERP and WMS stock don't agree for SKU-100007 at DC1. What are the two balances, how big is the difference,
    why does it arise, and what interface problem between WMS and ERP explains it?
  ref:
    - {tool: compare_erp_and_wms_stock, args: {sku: SKU-100007, site_id: DC1}}
    - {tool: list_interface_errors, args: {interface_name: WMS_to_ERP}}
  facts: ["5392", "5242", "150", "quarantine", "status mapping"]

- id: integration-01:8:Q4
  question: "01:8:Q4"
  prompt: >
    Finance is asking about a gap of about £1.2m between ERP and WMS stock. Work out whether it is timing, status
    mapping or real discrepancies and how much each accounts for, which SKU is the single biggest item, and whether
    the WMS to ERP interface has produced this kind of error before in the last nine months and how big it was.
  ref:
    - {tool: compare_erp_and_wms_stock, args: {view: by_cause}}
    - {tool: compare_erp_and_wms_stock, args: {}}
    - {tool: list_interface_errors, args: {interface_name: WMS_to_ERP, date_from: -270d}}
  facts: ["quarantine", "1054350.72", "182593.18", "SKU-100819", ["980k", "980000", "0.98m"]]

- id: integration-09:81:Q1
  question: "09:81:Q1"
  prompt: >
    OTIF dropped last month. Check the inbound ASN feed over the last 60 days for any change in how the data arrives
    or how complete it is: when did the feed change, what changed, and what happened to PO number completeness and
    arrival delay afterwards?
  ref:
    - {tool: get_asn_feed_change_log, args: {days: 60}}
  facts: ["v1.4", ["8-hourly batch", "8 hours", "8 hour"], ["PO number", "PO_ID"], "92"]

- id: integration-09:83:Q1
  question: "09:83:Q1"
  prompt: >
    About 200 EDI PO acknowledgements failed overnight. Analyse the EDI error logs from the last week: what is the
    most common cause and how many messages does it account for, how many failed for format and for partner-side
    reasons, and which mapping change was deployed shortly before?
  ref:
    - {tool: get_edi_error_log_summary, args: {message_type: PO_ACK}}
    - {tool: list_recent_mapping_and_config_changes, args: {change_type: mapping, days: 14}}
  facts: ["171", "ACK_STATUS", "v1.1", "17", "12"]

- id: integration-09:83:Q2
  question: "09:83:Q2"
  prompt: >
    The supplier's new ASN spec adds a PAC segment for pallet-level packing data. What does our current ASN EDI
    map carry today: which version is live, what packing level does it reach, and which segments are not mapped?
  ref:
    - {tool: get_edi_map_for_message_type, args: {message_type: ASN}}
  facts: ["1.4", "carton", "PAC", "GIN"]

- id: integration-09:83:Q3
  question: "09:83:Q3"
  prompt: >
    We are integrating a new 3PL by EDI, REST API or file transfer. Compare the three on running cost: what is the
    monthly run plus support cost per connection for each, which is cheapest, and what is the one-off setup cost
    of a new connection for each?
  ref:
    - {tool: get_integration_run_cost_by_pattern, args: {}}
  facts: ["file transfer", "130", "250", "340", "6500"]

- id: integration-09:83:Q5
  question: "09:83:Q5"
  prompt: >
    Website stock updates are about 20 minutes behind WMS. Using the last four weeks of data for the stock feed,
    which part of the pipeline adds the delay, how many minutes is it, and what schedule is the feed on now?
  ref:
    - {tool: get_stock_feed_latency, args: {days: 28}}
  facts: ["batch wait", "15", "every 15 minutes", "20"]

- id: integration-09:83:Q5-b
  question: "09:83:Q5"
  prompt: >
    Stock feed schedule SCH-000001 runs every 15 minutes and that is what delays the website. I confirm: change it
    to run every 5 minutes.
  ref:
    - {tool: update_stock_feed_schedule, args: {schedule_id: SCH-000001, run_frequency: every 5 minutes}}
  facts: ["every 5 minutes"]

- id: integration-09:85:Q3
  question: "09:85:Q3"
  prompt: >
    Which supplier and partner connections are the highest risk? List the critical ones, say which have privileged
    or direct system access and what they can reach.
  ref:
    - {tool: list_third_party_connections, args: {privileged_access: true}}
  facts: [["SUP-0003", "Bishop Apparel"], ["SUP-0049", "Holt Apparel"], ["SUP-0044", "Baxter Trading"], "critical"]
