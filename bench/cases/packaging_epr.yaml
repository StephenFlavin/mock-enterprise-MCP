- id: packaging_epr-02:21:Q4
  question: "02:21:Q4"
  prompt: >
    We handle returned goods in Germany, France and the Netherlands. Which EPR packaging scheme registrations do we
    hold in each of those countries, and what do we have to report there, how often, and what is the penalty for
    getting it wrong? Which of the three is strictest on reporting?
  ref:
    - {tool: get_epr_registrations_by_country, args: {country: DE, category: packaging}}
    - {tool: get_epr_registrations_by_country, args: {country: FR, category: packaging}}
    - {tool: get_epr_registrations_by_country, args: {country: NL, category: packaging}}
    - {tool: list_epr_reporting_obligations, args: {country: DE, category: packaging}}
    - {tool: list_epr_reporting_obligations, args: {country: FR, category: packaging}}
    - {tool: list_epr_reporting_obligations, args: {country: NL, category: packaging}}
  facts: ["Nedvang", "quarterly", "60000", "50000", "40000"]

- id: packaging_epr-04:40:Q1
  question: "04:40:Q1"
  prompt: >
    For small-appliance SKU SKU-100532 we are comparing corrugated, moulded pulp and recycled plastic packaging
    against our 2028 recycled-content and recyclability targets. What is the recycled content, recyclability and
    unit cost of each, and which of them meets the 2028 targets?
  ref:
    - {tool: get_recycled_content_and_recyclability, args: {sku: SKU-100532}}
    - {tool: get_packaging_targets_and_progress, args: {sku: SKU-100532}}
  facts: ["moulded pulp", "75", "0.65", "1.15"]

- id: packaging_epr-04:40:Q2
  question: "04:40:Q2"
  prompt: >
    What are the EPR fees for plastic packaging, the recycled-content mandates and the plastic taxes in the UK,
    France, Germany and Spain, and which upcoming regulation takes effect first? What would 120 tonnes a year of
    our plastic packaging cost under each country's rules?
  ref:
    - {tool: search_packaging_regulations_by_country, args: {country: "GB,FR,DE,ES"}}
    - {tool: get_epr_fee_rates, args: {country: "GB,FR,DE,ES", material: plastic}}
    - {tool: calculate_epr_cost_by_country, args: {country: "GB,FR,DE,ES", volume_tonnes: 120, material: plastic}}
  facts: ["UK Packaging EPR", "98400", "76800", "66000", "57600"]

- id: packaging_epr-04:40:Q5
  question: "04:40:Q5"
  prompt: >
    Are we on track for our packaging recycled-content and recyclability targets? Which target is furthest behind,
    and for that one what is the fastest option to close the gap and what does it cost in the first year at
    400,000 units a year?
  ref:
    - {tool: get_packaging_targets_and_progress, args: {}}
    - {tool: calculate_catch_up_options, args: {sku: SKU-100091, metric: recyclability_pct}}
  facts: ["SKU-100091", "77.8", "Switch to corrugated carton", "148000"]

- id: packaging_epr-05:49:Q6-a
  question: "05:49:Q6"
  prompt: >
    We are preparing for textile EPR in the UK, France and the Netherlands. Our FY26 volumes are 1,200,000
    womenswear items and 1,400,000 home textiles items (800,000 bedding and 600,000 towels). What are the textile fee rates by scheme, and what is the
    estimated annual fee exposure for each of those two categories in each country?
  ref:
    - {tool: search_epr_scheme_fee_schedules, args: {category: textiles}}
    - {tool: calculate_epr_fee_exposure, args: {category: Womenswear, volume_units: 1200000}}
    - {tool: calculate_epr_fee_exposure, args: {category: Home Textiles, volume_units: 1400000}}
  facts: ["Refashion", "168000", "144000", "560000", "490000"]

- id: packaging_epr-05:49:Q6-b
  question: "05:49:Q6"
  prompt: >
    For textiles EPR in France, what data do we have to report and by when, and what is the penalty for failing to
    report? Draft a six-month readiness plan for France.
  ref:
    - {tool: get_epr_reporting_requirements, args: {country: FR, category: textiles}}
    - {tool: draft_epr_preparation_plan, args: {country: FR, category: textiles}}
  facts: ["Fibre composition", "Supplier audit reports", "2027-06-30", "80000"]

- id: packaging_epr-05:49:Q6-c
  question: "05:49:Q6"
  prompt: >
    Create a textiles EPR preparation task for France to collect FY26 volumes by product category, assigned to
    EMP-00105 and due in 30 days. Then cancel the Netherlands textiles preparation tasks that are not yet finished,
    we're out of scope there.
  ref:
    - {tool: draft_epr_preparation_plan, args: {country: NL, category: textiles}}
    - {tool: create_epr_preparation_task, args: {country: FR, category: textiles, task_description: Collect FY26 volumes by product category, due_date: +30d, assigned_to: EMP-00105}}
    - {tool: cancel_epr_preparation_task, args: {task_id: ERT-900009, cancel_reason: Out of scope in the Netherlands}}
    - {tool: cancel_epr_preparation_task, args: {task_id: ERT-900010, cancel_reason: Out of scope in the Netherlands}}
  facts: ["ERT-900009", "ERT-900010", "cancelled"]

- id: packaging_epr-06:55:Q1
  question: "06:55:Q1"
  prompt: >
    We are preparing cosmetics packaging artwork for France, Germany and Italy. What legal marks, recycling labels,
    warnings and language rules apply in each country, and which country is strictest? Put it in an artwork
    checklist.
  ref:
    - {tool: get_recycling_label_rules_by_country, args: {country: "FR,DE,IT", product_category: cosmetics}}
    - {tool: draft_artwork_compliance_checklist, args: {country: "FR,DE,IT", product_category: cosmetics}}
  facts: ["Triman", "Info-tri", "CONAI", "Italian"]

- id: packaging_epr-06:55:Q3
  question: "06:55:Q3"
  prompt: >
    For new product SKU-100091 we are choosing between a rigid box and a flexible pouch. How do the two compare on
    recyclability and recycled content?
  ref:
