- id: loss_prevention-07:68:Q5
  question: "07:68:Q5"
  prompt: >
    Shrink at store ST150 (Leeds Shopping Centre) has tripled. Show me its shrink in four-week blocks over the last
    16 weeks, with the adjustments, POS exceptions and the split between theft, damage and process error, so I can see
    what changed. Then open a loss prevention case for the store.
  ref:
    - {tool: get_store_shrink_by_period, args: {site_id: ST150, date_from: -112d, period_weeks: 4}}
    - {tool: create_loss_prevention_case, args: {site_id: ST150, case_type: internal_theft, description: "Shrink tripled over four weeks, theft dominant", estimated_loss_gbp: 4800}}
  facts: ["18724.1", "5932.03", "13481.35"]

- id: loss_prevention-07:69:Q3
  question: "07:69:Q3"
  prompt: >
    Year-end is approaching and I need to know where store shrink will land. Show me total shrink across all stores in
    13-week blocks for the last year and a bit, so I can compare the latest block with the same weeks last year and with
    last year's final quarter of the year.
  ref:
    - {tool: get_store_shrink_by_period, args: {date_from: -455d, period_weeks: 13}}
  facts: ["3628217.04", "3387398.91", "4219635.45"]
  notes: "shrink_records has no product category, so the 'biggest category risk' follow-up and the write-off side cannot be answered from this server (gl and ims own those)."

- id: loss_prevention-08:79:Q1-a
  question: "08:79:Q1"
  prompt: >
    Look at the incidents recorded across the UK North region over the last six months. Which stores and time windows
    show the strongest signs of organised theft or internal theft?
  ref:
    - {tool: list_incidents_for_region, args: {region: UK North, date_from: -180d}}
  facts: ["ST150", "ST159", "ST165", "ST181", ["stockroom", "staff card"]]

- id: loss_prevention-08:79:Q1-b
  question: "08:79:Q1"
  prompt: >
    Case LPC-900001 covers the organised group hitting our Leeds stores. Draft a summary of it that I can give to the
    area manager, with its estimated loss and the stores involved. Then open a formal case for the internal theft
    at ST150.
  ref:
    - {tool: draft_loss_prevention_case_summary, args: {case_id: LPC-900001}}
    - {tool: create_loss_prevention_case, args: {site_id: ST150, case_type: internal_theft, description: "Evening stockroom removals matched to staff card access", estimated_loss_gbp: 4800}}
  facts: ["5876", "ST159", "ST165", "ST181"]

- id: loss_prevention-08:79:Q2
  question: "08:79:Q2"
  prompt: >
    What shrink controls cut shrink most per pound spent? Compare tagging, layout, staffing, security staff and POS
    system rules across all our stores, and give the payback on each.
  ref:
    - {tool: compare_control_effectiveness, args: {}}
    - {tool: calculate_control_payback, args: {}}
  facts: ["0.57", "0.66", "1.78", "6.73"]

- id: loss_prevention-08:79:Q4
  question: "08:79:Q4"
  prompt: >
    Across all our stores, which locations have had the most theft and loss incidents over the last six months?
    I want our own hotspots to set against what police and other retailers are doing.
  ref:
    - {tool: get_incident_counts_by_location, args: {date_from: -180d}}
  facts: ["ST150", "ST181", "ST159", "ST165", "ST003"]

- id: loss_prevention-08:79:Q5
  question: "08:79:Q5"
  prompt: >
    Self-checkout shrink is up at stores ST165 and ST183, where the CCTV shows customers deliberately bypassing the
    scanner. Which intervention would be most cost-effective at each store, and what does it cost per pound of shrink saved?
  ref:
    - {tool: calculate_intervention_cost_effectiveness, args: {site_id: ST165}}
    - {tool: calculate_intervention_cost_effectiveness, args: {site_id: ST183}}
  facts: [["pos_rules", "pos rules", "system rules"], "0.69", "0.4"]

- id: loss_prevention-08:79:Q6-a
  question: "08:79:Q6"
  prompt: >
    Our highest-loss products include SKU-105341 and SKU-101085. Across our stores, are their losses driven by theft or
    by damage, and what would be the cheapest way to protect SKU-105341?
  ref:
    - {tool: get_incident_records_for_product, args: {sku: SKU-105341}}
    - {tool: get_incident_records_for_product, args: {sku: SKU-101085}}
    - {tool: calculate_protection_options_cost, args: {sku: SKU-105341}}
  facts: ["theft", ["roof leak", "water damage", "leak"], "tagging", "0.72"]

- id: loss_prevention-08:79:Q6-b
  question: "08:79:Q6"
  prompt: >
    Add SKU-105341, a theft-driven top-five loss product, to the high-risk tagging list. Also take SKU-101085 off the
    list: it is on there as entry HRP-900005 but its losses are water damage, not theft.
  ref:
    - {tool: update_high_risk_product_list, args: {sku: SKU-105341, protection_type: tagging, loss_driver: theft}}
    - {tool: remove_product_from_high_risk_list, args: {hrp_id: HRP-900005, reason: "Loss is water damage, not theft"}}
  facts: ["SKU-105341", "tagging", "HRP-900005"]
  notes: "No tool lists the high-risk list, so a removal needs the entry id from the user or from an earlier add; the high-risk list is also per store or estate-wide (blank store) in this data."
