# Builds site/ and publishes it to GitHub Pages. Pull requests only build.
# Pages limits: a published site may be at most 1 GB and a deployment times out after 10 minutes; the site is about 300 MB.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - bench/AUTHORING.md
      - mockmcp/eval/svg.py
      - mockmcp/eval/schema.py
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - docs/**
      - bench/AUTHORING.md
      - mockmcp/eval/svg.py
      - mockmcp/eval/schema.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# A group holds one pending run, so pull requests get their own groups and can't displace a queued deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # The build scripts need only the standard library and mockmcp/eval/svg.py, so nothing is pip-installed.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          PYTHON: python3
      - run: du -sh site/dist
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      # Tars site/dist on Linux, so task folders with ':' in their names are kept as they are.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
